openapi: 3.1.0
info:
  title: Tenant Managed Execution Lifecycle API
  version: 0.1.0
  description: Foundation contract for capability-bound, resource-grant-bound, approval-gated tenant managed execution.
servers:
  - url: https://auth.mad4b.com
security:
  - bearerAuth: []
paths:
  /managed-execution-runs:
    post:
      operationId: createManagedExecutionRun
      summary: Create or reuse a governed managed execution run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required: [tenant_id, user_id, parent_ticket_id, workflow_key, capability_key, resource_type, resource_ref, effect_class, idempotency_key]
              properties:
                tenant_id: {type: string}
                user_id: {type: string}
                parent_ticket_id: {type: string}
                workflow_key: {type: string}
                capability_key: {type: string}
                resource_type: {type: string}
                resource_ref: {type: string}
                effect_class:
                  type: string
                  enum: [read_only, state_change, destructive, external_send, managed_operation]
                idempotency_key: {type: string}
      responses:
        '201': {description: Managed run created}
        '200': {description: Existing idempotent or active-scope run returned}
        '400': {description: Invalid or secret-bearing request}
        '403': {description: Effective authority missing}
        '409': {description: Capability, approval, or state conflict}
  /managed-execution-runs/{runId}:
    get:
      operationId: getManagedExecutionRun
      summary: Read a managed execution and contradiction-safe projection
      parameters:
        - in: path
          name: runId
          required: true
          schema: {type: string}
      responses:
        '200': {description: Managed execution projection}
        '404': {description: Run not found}
  /managed-execution-runs/{runId}/steps:
    post:
      operationId: createManagedExecutionStep
      summary: Create or reuse an authority-revalidated managed step
      parameters:
        - in: path
          name: runId
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [step_key, idempotency_key]
              properties:
                step_key: {type: string}
                idempotency_key: {type: string}
                step_type: {type: string}
                assigned_to: {type: string}
                input_json: {type: object}
      responses:
        '201': {description: Managed step created}
        '200': {description: Existing idempotent step returned}
        '409': {description: Approval, authority, or lifecycle conflict}
  /managed-execution-runs/{runId}/status:
    patch:
      operationId: updateManagedExecutionRunStatus
      summary: Apply a guarded managed run transition
      parameters:
        - in: path
          name: runId
          required: true
          schema: {type: string}
      responses:
        '200': {description: Run status synchronized}
        '409': {description: Invalid transition or linked-state conflict}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
