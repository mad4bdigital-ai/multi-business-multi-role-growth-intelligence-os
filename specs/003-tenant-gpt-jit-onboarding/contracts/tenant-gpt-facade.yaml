openapi: 3.1.0
info:
  title: Tenant GPT Facade
  version: 0.1.0
  description: Stable OAuth-secured facade for Tenant GPT onboarding and governed tools.
servers:
  - url: https://auth.mad4b.com
paths:
  /activation/session:
    post:
      operationId: activateSession
      summary: Open or reuse the authenticated Tenant GPT session
      security: [{ oauth2: [tenant:gpt] }]
      responses:
        '200': { description: Session context }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /gpt/tools:
    get:
      operationId: listTools
      summary: List tenant-authorized registry tools
      security: [{ oauth2: [tenant:gpt] }]
      responses:
        '200': { description: Authorized tool catalog }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /gpt/tools/call:
    post:
      operationId: callTool
      summary: Invoke a tenant-authorized registry tool
      security: [{ oauth2: [tenant:gpt] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, tool_args]
              properties:
                name: { type: string }
                tool_args: { type: object, additionalProperties: true }
      responses:
        '200': { description: Tool result }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /gpt/session/turns:
    post:
      operationId: writeSessionTurn
      summary: Persist a bounded session turn
      security: [{ oauth2: [tenant:gpt] }]
      responses:
        '200': { description: Turn persisted }
  /gpt/session/end:
    post:
      operationId: endSession
      summary: End the current Tenant GPT session
      security: [{ oauth2: [tenant:gpt] }]
      responses:
        '200': { description: Session ended }
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.mad4b.com/auth/oauth/authorize
          tokenUrl: https://auth.mad4b.com/auth/oauth/token
          scopes:
            tenant:gpt: Use Tenant GPT
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            stage: { type: string }
            retryable: { type: boolean }
            requestId: { type: string }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Authenticated but not authorized
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
