openapi: 3.1.0
info:
  title: System Tool Catalog V2 API
  version: 0.2.0
  description: Principal-scoped stable catalog browsing, direct lookup, intent resolution, descriptor parity, and read-only observability.
servers:
  - url: https://auth.mad4b.com
security:
  - bearerAuth: []
  - backendApiKeyAuth: []
paths:
  /system/tools:
    get:
      operationId: listSystemToolsV2
      tags: [System Tool Catalog]
      summary: List visible System Layer tools using a stable snapshot-bound cursor
      description: Requests without explicit catalog query parameters receive a bounded deprecated compatibility projection during the migration window.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          description: Snapshot-bound V2 cursor. Transitional non-negative numeric offset cursors remain accepted during the compatibility window.
          schema: { type: string, maxLength: 4096 }
        - { name: q, in: query, schema: { type: string, maxLength: 300 } }
        - { name: tag, in: query, schema: { type: string, maxLength: 128 } }
        - { name: source_key, in: query, schema: { type: string, maxLength: 191 } }
        - { name: capability_key, in: query, schema: { type: string, maxLength: 191 } }
      responses:
        '200':
          description: Principal-scoped catalog page or governed continuation envelope when the serialized response exceeds the response budget
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/CatalogResponse' }
                  - { $ref: '#/components/schemas/GovernedChunkResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /system/tools/catalog-observability:
    get:
      operationId: getSystemToolCatalogObservabilityV2
      tags: [System Tool Catalog]
      summary: Read no-secret Catalog V2 counters and descriptor/runtime parity
      security:
        - bearerAuth: [admin]
        - backendApiKeyAuth: []
      responses:
        '200':
          description: Catalog counters and parity evidence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObservabilityResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /system/tools/{toolName}:
    get:
      operationId: getSystemToolDescriptorV2
      tags: [System Tool Catalog]
      summary: Read one visible System Layer descriptor by stable name
      parameters:
        - name: toolName
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 191 }
      responses:
        '200':
          description: Visible descriptor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LookupResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /system/capabilities/resolve:
    post:
      operationId: resolveSystemCapabilityIntentV2
      tags: [System Tool Catalog]
      summary: Resolve intent, tool name, or capability key against visible descriptors
      description: Discovery only. The response never grants execution authority and directs resolved requests to capability preview.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                intent: { type: string, maxLength: 4000 }
                tool_name: { type: string, maxLength: 191 }
                capability_key: { type: string, maxLength: 191 }
                max_candidates: { type: integer, minimum: 1, maximum: 200, default: 10 }
              anyOf:
                - required: [intent]
                - required: [tool_name]
                - required: [capability_key]
      responses:
        '200':
          description: Read-only resolution result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResolutionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    backendApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    ToolDescriptor:
      type: object
      additionalProperties: false
      required: [name, description, source_key, capability_key, tags, aliases, requires_admin, inputSchema]
      properties:
        name: { type: string, minLength: 1, maxLength: 191 }
        description: { type: string, maxLength: 4000 }
        source_key: { type: string, minLength: 1, maxLength: 191 }
        capability_key: { type: [string, 'null'], maxLength: 191 }
        tags: { type: array, items: { type: string } }
        aliases: { type: array, items: { type: string } }
        requires_admin: { type: boolean }
        inputSchema: { type: object, additionalProperties: true }
    Page:
      type: object
      additionalProperties: false
      required: [limit, returned_count, total_count, has_more, next_cursor]
      properties:
        limit: { type: integer, minimum: 1, maximum: 200 }
        returned_count: { type: integer, minimum: 0 }
        total_count: { type: integer, minimum: 0 }
        has_more: { type: boolean }
        next_cursor: { type: [string, 'null'] }
    Compatibility:
      type: [object, 'null']
      additionalProperties: false
      properties:
        mode: { type: string, const: legacy-complete-list }
        deprecated: { type: boolean, const: true }
        bounded_max_items: { type: integer, const: 200 }
        replacement: { type: string, const: cursor-pagination-or-direct-lookup }
    PrincipalProjection:
      type: object
      additionalProperties: false
      properties:
        mode: { type: [string, 'null'] }
        is_admin: { type: boolean }
        tenant_id: { type: [string, 'null'] }
    ContinuationContract:
      type: object
      additionalProperties: true
      required: [response_chunked_when_large, required_tool, use_when, fallback_allowed_only_after, secrets_included]
      properties:
        response_chunked_when_large: { type: boolean }
        required_tool: { type: string, const: response_chunk_read }
        use_when: { type: string }
        fallback_allowed_only_after: { type: string }
        dynamic_cache_ttl: { type: boolean }
        configurable_ttl_options: { type: array, items: { type: string } }
        extends_cache_on_read: { type: boolean }
        persistence_degraded:
          type: boolean
          description: True only when durable chunk persistence is unavailable and a bounded inline fallback is returned.
        fallback_mode:
          type: string
          enum: [bounded_inline_response]
        fallback_reason:
          type: string
          enum: [response_chunk_persistence_unavailable]
        bounded_inline_max_chars:
          type: integer
          minimum: 5000
          maximum: 150000
        serialized_chars:
          type: integer
          minimum: 0
        source_tool_key:
          type: string
          maxLength: 191
        secrets_included: { type: boolean, const: false }
    CatalogResponse:
      type: object
      additionalProperties: false
      required: [ok, protocol, list_mode, catalog_mode, tools, items, page, total_available_tools, catalog_version, snapshot_id, compatibility, continuation_contract, secrets_included]
      properties:
        ok: { type: boolean, const: true }
        protocol: { type: string, const: openapi-mcp-facade }
        list_mode: { type: string, const: bounded_paginated_chunkable }
        catalog_mode: { type: string, const: stable_cursor_catalog_v2 }
        tools: { type: array, items: { $ref: '#/components/schemas/ToolDescriptor' }, description: Backward-compatible alias of items. }
        items: { type: array, items: { $ref: '#/components/schemas/ToolDescriptor' } }
        page: { $ref: '#/components/schemas/Page' }
        total_available_tools: { type: integer, minimum: 0 }
        catalog_version: { type: string, pattern: '^[a-f0-9]{64}$' }
        snapshot_id: { type: string, pattern: '^[a-f0-9]{64}$' }
        compatibility: { $ref: '#/components/schemas/Compatibility' }
        continuation_contract: { $ref: '#/components/schemas/ContinuationContract' }
        principal: { $ref: '#/components/schemas/PrincipalProjection' }
        secrets_included: { type: boolean, const: false }
    LookupResponse:
      type: object
      additionalProperties: false
      required: [ok, tool, catalog_version, snapshot_id, secrets_included]
      properties:
        ok: { type: boolean, const: true }
        tool: { $ref: '#/components/schemas/ToolDescriptor' }
        catalog_version: { type: string, pattern: '^[a-f0-9]{64}$' }
        snapshot_id: { type: string, pattern: '^[a-f0-9]{64}$' }
        secrets_included: { type: boolean, const: false }
    ResolutionCandidate:
      type: object
      additionalProperties: false
      required: [tool, score, match_reasons, execution_allowed]
      properties:
        tool: { $ref: '#/components/schemas/ToolDescriptor' }
        score: { type: integer, minimum: 1 }
        match_reasons: { type: array, items: { type: string } }
        execution_allowed: { type: boolean, const: false }
    ResolutionResponse:
      type: object
      additionalProperties: false
      required: [ok, status, catalog_version, snapshot_id, candidates, selected_tool, execution_allowed, next_step, secrets_included]
      properties:
        ok: { type: boolean, const: true }
        status: { type: string, enum: [resolved, clarification_required, not_found] }
        catalog_version: { type: string, pattern: '^[a-f0-9]{64}$' }
        snapshot_id: { type: string, pattern: '^[a-f0-9]{64}$' }
        candidates: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/ResolutionCandidate' } }
        selected_tool: { oneOf: [{ $ref: '#/components/schemas/ToolDescriptor' }, { type: 'null' }] }
        execution_allowed: { type: boolean, const: false }
        next_step: { type: string, enum: [capability_preview, clarification_required, not_found] }
        secrets_included: { type: boolean, const: false }
    DescriptorParity:
      type: object
      additionalProperties: false
      required: [ok, descriptor_count, missing_handler_count, missing_handlers, secrets_included]
      properties:
        ok: { type: boolean }
        descriptor_count: { type: integer, minimum: 0 }
        missing_handler_count: { type: integer, minimum: 0 }
        missing_handlers: { type: array, items: { type: string } }
        secrets_included: { type: boolean, const: false }
    ObservabilityResponse:
      type: object
      additionalProperties: false
      required: [ok, counters, observed_at, descriptor_parity, secrets_included]
      properties:
        ok: { type: boolean, const: true }
        counters: { type: object, additionalProperties: { type: integer, minimum: 0 } }
        observed_at: { type: string, format: date-time }
        descriptor_parity: { $ref: '#/components/schemas/DescriptorParity' }
        secrets_included: { type: boolean, const: false }
    GovernedChunkResponse:
      type: object
      additionalProperties: true
      required: [ok, response_chunked, chunk_id, page, secrets_included]
      properties:
        ok: { type: boolean, const: true }
        response_chunked: { type: boolean, const: true }
        chunk_id: { type: string }
        page: { type: object, additionalProperties: true }
        secrets_included: { type: boolean, const: false }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [ok, error, secrets_included]
      properties:
        ok: { type: boolean, const: false }
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
            requestId: { type: string }
        secrets_included: { type: boolean, const: false }
  responses:
    BadRequest:
      description: Invalid request or cursor
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Unauthorized:
      description: Authentication required
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Forbidden:
      description: Principal is not allowed
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    NotFound:
      description: Tool is absent or not visible to this principal
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Conflict:
      description: Catalog snapshot changed
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
