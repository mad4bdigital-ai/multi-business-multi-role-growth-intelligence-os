openapi: 3.1.0
info:
  title: Durable Governed Execution Draft API
  version: 0.1.0-draft
  description: >-
    Specification-only contract for durable operations, execution resolution,
    and bounded Agent delegation. This document does not create runtime authority.
servers:
  - url: https://auth.mad4b.com
security:
  - bearerAuth: []
paths:
  /admin/platform-operations/plan:
    post:
      operationId: platformOperationPlan
      summary: Build a no-mutation governed operation plan
      tags: [Platform Operations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationRequest'
      responses:
        '200':
          description: Planned operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationView'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /admin/platform-operations:
    post:
      operationId: platformOperationStart
      summary: Start a durable governed operation
      tags: [Platform Operations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationRequest'
      responses:
        '202':
          description: Durable operation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationView'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /admin/platform-operations/{operation_id}:
    get:
      operationId: platformOperationGet
      summary: Read durable operation state
      tags: [Platform Operations]
      parameters:
        - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: Operation state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationView'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /admin/platform-operations/{operation_id}/resume:
    post:
      operationId: platformOperationResume
      summary: Resume a recoverable operation
      tags: [Platform Operations]
      parameters:
        - $ref: '#/components/parameters/OperationId'
      responses:
        '202':
          description: Resume accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationView'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /admin/platform-operations/{operation_id}/cancel:
    post:
      operationId: platformOperationCancel
      summary: Request governed cancellation
      tags: [Platform Operations]
      parameters:
        - $ref: '#/components/parameters/OperationId'
      responses:
        '202':
          description: Cancellation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationView'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /admin/platform-operations/{operation_id}/explain:
    get:
      operationId: platformOperationExplain
      summary: Explain proven state, blockers, and next action
      tags: [Platform Operations]
      parameters:
        - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: Bounded explanation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationView'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /admin/execution-contracts/resolve:
    post:
      operationId: executionContractResolve
      summary: Resolve semantic intent to a governed execution contract
      tags: [Execution Contracts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractResolutionRequest'
      responses:
        '200':
          description: Resolved contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionContract'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /admin/delegation-grants/preview:
    post:
      operationId: delegationGrantPreview
      summary: Preview delegation policy without mutation
      tags: [Delegation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DelegationGrantRequest'
      responses:
        '200':
          description: Delegation preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelegationGrantView'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /admin/delegation-grants:
    post:
      operationId: delegationGrantCreate
      summary: Create a bounded Agent delegation grant
      tags: [Delegation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DelegationGrantRequest'
      responses:
        '201':
          description: Delegation grant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelegationGrantView'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /admin/delegation-grants/{grant_id}/revoke:
    post:
      operationId: delegationGrantRevoke
      summary: Revoke a delegation grant
      tags: [Delegation]
      parameters:
        - name: grant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Delegation revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelegationGrantView'
        default:
          $ref: '#/components/responses/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    OperationId:
      name: operation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ApprovalMode:
      type: string
      enum:
        - user_approval_only
        - agent_recommend_only
        - agent_queue_for_approval
        - delegated_low_risk
        - delegated_plan_bound
        - human_on_exception
        - multi_agent_approval
        - break_glass
    OperationRequest:
      type: object
      additionalProperties: false
      required: [intent, resource_uri, approval_mode, idempotency_key]
      properties:
        intent:
          type: string
          minLength: 1
          maxLength: 191
        resource_uri:
          type: string
          minLength: 1
          maxLength: 500
        mode:
          type: string
          maxLength: 64
        approval_mode:
          $ref: '#/components/schemas/ApprovalMode'
        plan_id:
          type: string
          format: uuid
        delegation_grant_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 191
    OperationView:
      type: object
      additionalProperties: false
      required: [ok, operation_id, state, completed_steps, blocking_gaps, next_action, secrets_included]
      properties:
        ok:
          type: boolean
        operation_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [requested, context_loading, preflight, awaiting_approval, ready, executing, reconciling, verifying, completed, failed_recoverable, failed_terminal, cancel_requested, cancelled, compensation_required, compensating]
        completed_steps:
          type: array
          items:
            type: string
        blocking_gaps:
          type: array
          items:
            type: object
            additionalProperties: true
        next_action:
          type: object
          additionalProperties: false
          required: [action, reason_code]
          properties:
            action:
              type: string
            reason_code:
              type: string
            required_input:
              type: string
        evidence_refs:
          type: array
          items:
            type: string
        secrets_included:
          const: false
    ContractResolutionRequest:
      type: object
      additionalProperties: false
      required: [intent, resource_uri]
      properties:
        intent:
          type: string
        resource_uri:
          type: string
        mode:
          type: string
    ExecutionContract:
      type: object
      additionalProperties: false
      required: [intent, resource_type, capability_key, runtime_surface, approval_policy_key, retry_policy_key, readback_contract_key, evidence_policy_key, ready, blocking_gaps, secrets_included]
      properties:
        intent:
          type: string
        resource_type:
          type: string
        action_key:
          type: string
        endpoint_key:
          type: string
        capability_key:
          type: string
        runtime_surface:
          type: string
        approval_policy_key:
          type: string
        retry_policy_key:
          type: string
        readback_contract_key:
          type: string
        evidence_policy_key:
          type: string
        ready:
          type: boolean
        blocking_gaps:
          type: array
          items:
            type: object
            additionalProperties: true
        secrets_included:
          const: false
    DelegationGrantRequest:
      type: object
      additionalProperties: false
      required: [delegated_to, approval_mode, plan_id, plan_hash, resource_scope, allowed_intents, max_risk_tier, expires_at]
      properties:
        delegated_to:
          type: string
        approval_mode:
          $ref: '#/components/schemas/ApprovalMode'
        plan_id:
          type: string
          format: uuid
        plan_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        resource_scope:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [resource_uri, snapshot_hash]
            properties:
              resource_uri:
                type: string
              snapshot_hash:
                type: string
                pattern: '^[a-f0-9]{64}$'
        allowed_intents:
          type: array
          minItems: 1
          items:
            type: string
        denied_intents:
          type: array
          items:
            type: string
        max_risk_tier:
          type: string
          enum: [read_only, low, medium, high, critical]
        max_mutations:
          type: integer
          minimum: 0
          maximum: 100
        max_retries:
          type: integer
          minimum: 0
          maximum: 10
        expires_at:
          type: string
          format: date-time
        require_readback:
          type: boolean
          default: true
        stop_on_drift:
          type: boolean
          default: true
    DelegationGrantView:
      type: object
      additionalProperties: false
      required: [ok, grant_id, status, approval_mode, policy_decision, expires_at, secrets_included]
      properties:
        ok:
          type: boolean
        grant_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [preview, active, revoked, expired, exhausted, completed, denied]
        approval_mode:
          $ref: '#/components/schemas/ApprovalMode'
        policy_decision:
          type: string
          enum: [allow, deny, await_user, await_reviewer]
        reason_code:
          type: string
        expires_at:
          type: string
          format: date-time
        secrets_included:
          const: false
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, secrets_included]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            requestId:
              type: string
            operation_id:
              type: string
              format: uuid
        secrets_included:
          const: false
  responses:
    ErrorResponse:
      description: Structured governed error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
