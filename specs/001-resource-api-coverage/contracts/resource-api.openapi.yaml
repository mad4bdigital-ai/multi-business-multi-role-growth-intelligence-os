openapi: 3.1.0
info:
  title: Resource API Coverage Contract
  version: 1.0.0
paths:
  /admin/resource-types:
    get:
      operationId: platformResourceTypesList
      responses:
        '200': { description: Resource descriptors }
  /admin/resources/{resourceKey}:
    get:
      operationId: platformResourceList
      parameters:
        - { name: resourceKey, in: path, required: true, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: pageToken, in: query, schema: { type: string } }
      responses:
        '200': { description: Resource page }
  /me/workspaces/{tenant_id}/resources/{resourceKey}:
    get:
      operationId: tenantResourceList
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string } }
        - { name: resourceKey, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Tenant-authorized resource page }
        '403': { description: Active membership required }
  /admin/resource-coverage/audit:
    get:
      operationId: platformResourceCoverageAudit
      responses:
        '200': { description: Bounded live coverage findings }
components:
  schemas:
    StructuredError:
      type: object
      required: [ok, error, secrets_included]
      properties:
        ok: { const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
        secrets_included: { const: false }
