# Legacy local-managed ingress reference only.
#
# The canonical Local Connector runtime no longer reads tunnel identity or
# credentials from this repository file. It runs as a remotely managed tunnel
# using CONNECTOR_CLOUDFLARED_TOKEN_FILE so no device-specific credential path,
# tunnel credential, or secret is committed to the repository.
#
# Keep these host mappings as documentation for provider-side ingress policy.
ingress:
  - hostname: connector.mad4b.com
    service: http://localhost:7070
  - hostname: local.mad4b.com
    service: http://localhost:7070
  - service: http_status:404
