openapi: 3.1.0
info:
  title: Operation Capability Lifecycle
  version: 1.0.0
  description: |
    Additive capability-envelope lifecycle fields for governed Admin and Tenant
    operation execution. Mutation operations require an operation-scoped
    envelope. Missing or expired envelopes may be recreated from a governed
    dry-run for lower-risk recipes, but protected pull-request finalization and
    operation resume require a separately issued explicit envelope.
servers:
  - url: https://auth.mad4b.com
paths:
  /admin/operations/execute:
    post:
      tags: [Admin Operations]
      operationId: executeAdminOperationWithCapabilityLifecycle
      summary: Execute an Admin operation with a bounded capability envelope
      security:
        - backendApiKeyAuth: []
        - adminBearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/ExecutionRequest'
      responses:
        '200':
          $ref: '#/components/responses/ExecutionResult'
        '202':
          $ref: '#/components/responses/ExecutionResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/CapabilityConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /tenant/operations/execute:
    post:
      tags: [Tenant Operations]
      operationId: executeTenantOperationWithCapabilityLifecycle
      summary: Execute a Tenant operation with a bounded capability envelope
      description: |
        Requires an active tenant membership and object-level authority. A fresh
        envelope that requires approval is returned as a conflict and is not
        dispatched.
      security:
        - userJwtAuth: []
      requestBody:
        $ref: '#/components/requestBodies/ExecutionRequest'
      responses:
        '200':
          $ref: '#/components/responses/ExecutionResult'
        '202':
          $ref: '#/components/responses/ExecutionResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/CapabilityConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    backendApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
    adminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    userJwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  requestBodies:
    ExecutionRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExecutionRequest'
          examples:
            existingEnvelope:
              value:
                operation_key: repo.change.execute
                owner: mad4bdigital-ai
                repo: multi-business-multi-role-growth-intelligence-os
                branch: feature/example
                capability_envelope_id: 11111111-1111-4111-8111-111111111111
                idempotency_key: repo-change-example-v1
            justInTimeRenewal:
              value:
                operation_key: repo.change.execute
                owner: mad4bdigital-ai
                repo: multi-business-multi-role-growth-intelligence-os
                branch: feature/example
                automatic_capability_renewal: true
                capability_ttl_minutes: 60
                idempotency_key: repo-change-example-v2
  responses:
    ExecutionResult:
      description: Operation result with capability lifecycle evidence.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExecutionResult'
    Error:
      description: Structured validation, authentication, or authorization error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    CapabilityConflict:
      description: |
        A fresh envelope is required, requires explicit approval, has blocking
        gaps, or could not be consumed after execution.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            approvalRequired:
              value:
                ok: false
                error:
                  code: OPERATION_CAPABILITY_RENEWAL_REQUIRES_APPROVAL
                  message: A fresh capability envelope was created and requires approval before execution.
                  details:
                    next_action: approve_fresh_capability_envelope
                    renewal:
                      envelope_id: 22222222-2222-4222-8222-222222222222
                      envelope_status: ready_requires_approval
                      approval_required: true
                      dispatch_allowed: false
                      secrets_included: false
                secrets_included: false
    RateLimited:
      description: Operation-specific request limit exceeded.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unavailable:
      description: Capability resolution dependency is temporarily unavailable.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ExecutionRequest:
      type: object
      required: [operation_key]
      additionalProperties: true
      properties:
        operation_key:
          type: string
          minLength: 1
          maxLength: 128
        capability_envelope_id:
          type: string
          format: uuid
        automatic_capability_renewal:
          type: boolean
          default: true
          description: |
            Allows creation of a fresh dry-run envelope when none exists or the
            supplied envelope expired for lower-risk recipes. It is ignored for protected
            pull-request finalization and operation resume, which require an explicit envelope.
        capability_ttl_minutes:
          type: integer
          minimum: 5
          maximum: 1440
          default: 60
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 180
    ExecutionResult:
      type: object
      required: [capability_lifecycle]
      additionalProperties: true
      properties:
        ok:
          type: boolean
        status:
          type: string
        run_id:
          type: string
        capability_lifecycle:
          $ref: '#/components/schemas/CapabilityLifecycle'
        secrets_included:
          type: boolean
          const: false
    CapabilityLifecycle:
      type: object
      required: [required, status, secrets_included]
      additionalProperties: true
      properties:
        required:
          type: boolean
        status:
          type: string
          enum:
            - not_required
            - ready
            - renewed_ready
            - retained_for_bounded_retry
            - consumed
            - consume_failed
        envelope_id:
          type: [string, 'null']
          format: uuid
        source:
          type: [string, 'null']
          enum: [existing, expired_replacement, just_in_time, null]
        readback_required:
          type: boolean
        secrets_included:
          type: boolean
          const: false
    ErrorEnvelope:
      type: object
      required: [ok, error, secrets_included]
      additionalProperties: false
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: object
          required: [code, message]
          additionalProperties: true
          properties:
            code:
              type: string
              enum:
                - OPERATION_CAPABILITY_ENVELOPE_REJECTED
                - OPERATION_CAPABILITY_ENVELOPE_REQUIRED
                - OPERATION_CAPABILITY_RENEWAL_REQUIRED
                - OPERATION_CAPABILITY_RENEWAL_REQUIRES_APPROVAL
                - OPERATION_CAPABILITY_RENEWAL_NOT_READY
                - OPERATION_CAPABILITY_CONSUME_FAILED
            message:
              type: string
            details: {}
            requestId:
              type: [string, 'null']
        secrets_included:
          type: boolean
          const: false
