openapi: 3.1.0
info:
  title: Frontend Authentication Parity Routes
  version: 1.0.0
  description: Canonical authentication contracts for runtime routes required by frontend surface parity.
paths:
  /admin/support/tickets/auth-email-outbox/status:
    get:
      operationId: getAuthEmailOutboxStatus
      summary: Get authentication email outbox status
      tags: [Admin Support]
      security: &adminSecurity
        - adminBearerAuth: []
        - backendApiKeyAuth: []
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /admin/support/tickets/auth-email-outbox/dry-run:
    post:
      operationId: dryRunAuthEmailOutbox
      summary: Preview authentication email outbox delivery
      tags: [Admin Support]
      security: *adminSecurity
      requestBody: &optionalObjectBody
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /admin/support/tickets/auth-email-outbox/apply:
    post:
      operationId: applyAuthEmailOutbox
      summary: Apply authentication email outbox delivery
      tags: [Admin Support]
      security: *adminSecurity
      requestBody: *optionalObjectBody
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /admin/support/tickets/auth-email-outbox/attempts:
    get:
      operationId: listAuthEmailOutboxAttempts
      summary: List authentication email delivery attempts
      tags: [Admin Support]
      security: *adminSecurity
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /admin/support/tickets/auth-email-outbox/targeted-dry-run:
    post:
      operationId: dryRunTargetedAuthEmailOutbox
      summary: Preview targeted authentication email delivery
      tags: [Admin Support]
      security: *adminSecurity
      requestBody: *optionalObjectBody
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /admin/support/tickets/auth-email-outbox/targeted-apply:
    post:
      operationId: applyTargetedAuthEmailOutbox
      summary: Apply targeted authentication email delivery
      tags: [Admin Support]
      security: *adminSecurity
      requestBody: *optionalObjectBody
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/vps/v1/public-keys:
    get:
      operationId: getPublicKeys
      summary: Get public keys
      tags: ["VPS: Public Keys"]
      parameters:
        - name: page
          in: query
          required: false
          description: Page number
          schema: { type: integer, minimum: 1 }
      security: &providerSecurity
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/vps/v1/virtual-machines:
    get:
      operationId: getVirtualMachines
      summary: Get virtual machines
      tags: ["VPS: Virtual machine"]
      security: *providerSecurity
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
components:
  securitySchemes:
    adminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    backendApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API token
  schemas:
    GenericObject:
      type: object
      additionalProperties: true
    ErrorEnvelope:
      type: object
      additionalProperties: true
  responses:
    Success:
      description: Successful response
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GenericObject" }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: Authentication is required or invalid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: The authenticated principal is not authorized
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
