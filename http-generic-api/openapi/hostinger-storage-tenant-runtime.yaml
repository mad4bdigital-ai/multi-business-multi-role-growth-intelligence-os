hostingerStorageTenantApplyPlanPath:
  post:
    operationId: hostingerStorageTenantApplyPlan
    summary: Execute one governed tenant storage plan through the mounted synthetic runtime
    description: >-
      Requires a signed tenant user JWT and an already authorized, mounted, synthetic-only
      tenant storage runtime. The route fails closed when the runtime or its exact mount
      readback is unavailable. It does not grant provider dispatch, automatic retry,
      migration, deployment, or Production authority.
    x-runtime-contract-source: routes/hostingerStorageTenantRoutes.js
    x-runtime-auth-profile: user_jwt
    x-contract-completeness: runtime-mounted-operation
    x-openai-isConsequential: true
    security:
      - userJwtAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HostingerStorageTenantApplyPlanRequest'
    responses:
      '200':
        description: The governed synthetic runtime accepted and executed the exact operation.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostingerStorageTenantApplyPlanResult'
      '400':
        description: The request body or one of its bounded fields is invalid.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostingerStorageTenantRouteError'
      '401':
        description: A signed non-admin tenant user JWT is required.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostingerStorageTenantRouteError'
      '409':
        description: The operation was rejected by an exact governed runtime invariant.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostingerStorageTenantRouteError'
      '503':
        description: The authorized tenant storage runtime or mount readback is unavailable.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostingerStorageTenantRouteError'
      '500':
        description: The governed runtime failed without exposing protected details.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostingerStorageTenantRouteError'

components:
  schemas:
    HostingerStorageTenantApplyPlanRequest:
      type: object
      additionalProperties: false
      required:
        - operation_id
        - expected_sha
      properties:
        operation_id:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:@/-]{0,255}$'
          description: Bounded tenant operation identifier already present in the governed runtime.
        expected_sha:
          type: string
          minLength: 7
          maxLength: 135
          pattern: '^(?:[0-9a-f]{7,64}|sha256-[0-9a-f]{32,128})$'
          description: Exact source or evidence SHA expected by the governed operation.
    HostingerStorageTenantApplyPlanResult:
      type: object
      additionalProperties: true
      required:
        - ok
        - secrets_included
      properties:
        ok:
          type: boolean
          const: true
        secrets_included:
          type: boolean
          const: false
    HostingerStorageTenantRouteError:
      type: object
      additionalProperties: false
      required:
        - ok
        - error
        - secrets_included
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              minLength: 1
              maxLength: 160
            message:
              type: string
              minLength: 1
              maxLength: 512
            reason_codes:
              type: array
              maxItems: 16
              uniqueItems: true
              items:
                type: string
                minLength: 1
                maxLength: 191
                pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,190}$'
        secrets_included:
          type: boolean
          const: false
