# Canonical split contract; root composition and generated evidence remain CI-owned.
schemas:
  CredentialBindingPromoteTenantRequest:
    type: object
    additionalProperties: false
    required:
      - source_owner_type
      - source_owner_id
      - source_account_key
      - source_provider
      - target_business_id
      - target_account_key
      - target_provider
      - source_preflight_status
      - verification_evidence
      - promotion_approved
      - promotion_reason
      - idempotency_key
    properties:
      source_owner_type:
        type: string
        minLength: 1
        maxLength: 64
      source_owner_id:
        type: string
        minLength: 1
        maxLength: 255
      source_account_key:
        type: string
        minLength: 1
        maxLength: 255
      source_provider:
        type: string
        minLength: 1
        maxLength: 128
      target_business_id:
        type: string
        format: uuid
      target_account_key:
        type: string
        minLength: 1
        maxLength: 255
      target_provider:
        type: string
        minLength: 1
        maxLength: 128
      source_preflight_status:
        type: string
        enum: [resolved]
      verification_evidence:
        type: object
        additionalProperties: true
      promotion_approved:
        type: boolean
        enum: [true]
      promotion_reason:
        type: string
        minLength: 1
        maxLength: 2000
      idempotency_key:
        type: string
        minLength: 1
        maxLength: 255

  CredentialBindingPromoteTenantResponse:
    type: object
    additionalProperties: true
    required:
      - ok
      - binding
      - promotion_approved
      - promotion_reason
      - source_preflight_status
      - readback
      - secret_copied
      - token_returned
      - platform_wide_promotion_enabled
      - secrets_included
    properties:
      ok:
        type: boolean
        enum: [true]
      binding:
        type: object
        additionalProperties: true
      promotion_approved:
        type: boolean
        enum: [true]
      promotion_reason:
        type: string
      promoted_owner_type:
        type: string
        enum: [tenant]
      source_preflight_status:
        type: string
        enum: [resolved]
      readback:
        type: object
        additionalProperties: true
      secret_copied:
        type: boolean
        enum: [false]
      token_returned:
        type: boolean
        enum: [false]
      platform_wide_promotion_enabled:
        type: boolean
        enum: [false]
      secrets_included:
        type: boolean
        enum: [false]

  CredentialBindingPromotionSourceNotResolved:
    type: object
    additionalProperties: true
    required:
      - ok
      - error
      - source_preflight_status
      - secrets_included
    properties:
      ok:
        type: boolean
        enum: [false]
      error:
        type: string
        enum: [promotion_source_not_resolved]
      source_preflight_status:
        type: string
      secrets_included:
        type: boolean
        enum: [false]

credentialBindingPromoteTenant:
  post:
    tags: [credentials, admin-control]
    operationId: credentialBindingPromoteTenant
    summary: Promote a verified user credential binding into tenant ownership without copying secret material
    description: Requires an active source connection, successful source-resolution preflight, explicit approval evidence, and an idempotency key. The operation creates or updates only a tenant credential reference; it never decrypts, copies, or returns provider secret material and never enables platform-wide promotion.
    x-registry-exposure: admin_tool
    x-registry-tool-key: credential_binding_promote_tenant
    x-openai-isConsequential: true
    security: [{ adminBearerAuth: [] }, { backendApiKeyAuth: [] }]
    parameters:
      - in: header
        name: Idempotency-Key
        required: false
        description: Optional header form of the idempotency key. The request body idempotency_key remains required by the canonical tool contract.
        schema:
          type: string
          minLength: 1
          maxLength: 255
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/schemas/CredentialBindingPromoteTenantRequest'
    responses:
      '200':
        description: Existing tenant credential-reference binding updated after exact preflight and readback.
        content:
          application/json:
            schema:
              $ref: '#/schemas/CredentialBindingPromoteTenantResponse'
      '201':
        description: Tenant credential-reference binding created after exact preflight and readback.
        content:
          application/json:
            schema:
              $ref: '#/schemas/CredentialBindingPromoteTenantResponse'
      '400':
        description: Invalid promotion request or missing approval evidence.
      '401':
        description: Authentication required.
      '403':
        description: Caller is not authorized to promote credential bindings.
      '409':
        description: Source credential resolution preflight did not resolve an eligible active source binding.
        content:
          application/json:
            schema:
              $ref: '#/schemas/CredentialBindingPromotionSourceNotResolved'
      '500':
        description: Credential promotion failed without exposing secret material.
