# Source-bound path items for governed Support Ticket brand-reference and remediation operations.
adminSupportTicketNewBrandRefApprovalApprove:
  post:
    operationId: approveAdminSupportTicketNewBrandRef
    summary: Approve a proposed new brand reference for remediation
    tags: [support-tickets, admin-control]
    security: [{ adminBearerAuth: [] }, { backendApiKeyAuth: [] }]
    x-registry-exposure: admin_tool
    x-openai-isConsequential: true
    parameters: [{ $ref: './support-ticket-admin-common.yaml#/parameters/SupportTicketId' }]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: './support-ticket-admin-common.yaml#/schemas/AdminSupportTicketActionRequest' }
    responses:
      '200': { $ref: './support-ticket-admin-common.yaml#/responses/Success' }
      '400': { $ref: './support-ticket-admin-common.yaml#/responses/BadRequest' }
      '401': { $ref: './support-ticket-admin-common.yaml#/responses/Unauthorized' }
      '403': { $ref: './support-ticket-admin-common.yaml#/responses/Forbidden' }
      '404': { $ref: './support-ticket-admin-common.yaml#/responses/NotFound' }
      '409': { $ref: './support-ticket-admin-common.yaml#/responses/Conflict' }
      '422': { $ref: './support-ticket-admin-common.yaml#/responses/Unprocessable' }
      '500': { $ref: './support-ticket-admin-common.yaml#/responses/InternalError' }

