openapi: 3.1.0
info:
  title: Brand-Scoped User Skill Activation
  version: 1.0.0
  description: User-JWT activation and revocation of agent skills within an authorized tenant brand and resource scope.
paths:
  /me/workspaces/{tenant_id}/brands/{brand_key}/skills:
    get:
      tags: [brand-skill-activation]
      operationId: listBrandSkillsForSignedInUser
      summary: List skill policies and active user grants for a brand
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/BrandKey'
      responses:
        '200': { description: Brand skill catalog and user grants }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /me/workspaces/{tenant_id}/brands/{brand_key}/skills/{skill_key}/activate:
    post:
      tags: [brand-skill-activation]
      operationId: activateBrandSkillForSignedInUser
      summary: Activate an allowed skill for the signed-in user and selected brand
      description: |
        Scope-idempotent activation. Repeating the same request for an already-effective
        tenant, user, brand, agent, skill, resource, and operation scope returns 200 with
        the existing grant; 201 is returned only when a new grant is created.
        Idempotency-Key is not required.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/BrandKey'
        - $ref: '#/components/parameters/SkillKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandSkillActivationRequest'
      responses:
        '200': { description: Existing effective grant returned }
        '201': { description: User brand skill grant created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/workspaces/{tenant_id}/brands/{brand_key}/skills/{skill_key}/activation:
    delete:
      tags: [brand-skill-activation]
      operationId: revokeBrandSkillForSignedInUser
      summary: Revoke the signed-in user's active skill grants for a brand
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/BrandKey'
        - $ref: '#/components/parameters/SkillKey'
        - name: agent_id
          in: query
          required: false
          schema: { type: string, maxLength: 36 }
      responses:
        '200': { description: Revocation result }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantId:
      name: tenant_id
      in: path
      required: true
      schema: { type: string, maxLength: 36 }
    BrandKey:
      name: brand_key
      in: path
      required: true
      schema: { type: string, maxLength: 128 }
    SkillKey:
      name: skill_key
      in: path
      required: true
      schema: { type: string, maxLength: 128 }
  schemas:
    BrandSkillActivationRequest:
      type: object
      additionalProperties: false
      required: [agent_id, requested_operations]
      properties:
        agent_id: { type: string, maxLength: 36 }
        requested_operations:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items: { type: string, pattern: '^[a-z][a-z0-9_.:-]{0,63}$' }
        resource_type: { type: [string, 'null'], maxLength: 64 }
        resource_ref: { type: [string, 'null'], maxLength: 255 }
        ttl_hours: { type: [integer, 'null'], minimum: 1, maximum: 8760 }
    ErrorEnvelope:
      type: object
      required: [ok, error, secrets_included]
      properties:
        ok: { type: boolean, enum: [false] }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: [object, 'null'] }
            requestId: { type: [string, 'null'] }
        secrets_included: { type: boolean, enum: [false] }
  responses:
    BadRequest:
      description: Invalid activation request
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Unauthorized:
      description: User JWT required
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Forbidden:
      description: Membership, policy, role, agent, operation, or resource authority denied
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Conflict:
      description: Approval is required or activation state conflicts
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
