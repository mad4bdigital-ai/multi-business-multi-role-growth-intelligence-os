openapi: 3.1.0
info:
  title: Session Insight Promotion Read Models API
  version: 1.4.0
  description: Canonical, secret-free contracts for administrative session-insight promotion read models. The POST methods accept bounded filter documents but execute SELECT-only read actions.
servers:
  - url: https://auth.mad4b.com
security:
  - adminBearerAuth: []
  - backendApiKeyAuth: []
tags:
  - name: session-insight-promotion-read-models
paths:
  /platform/session-insight-promotions/adapter-contracts/list:
    post:
      tags: [session-insight-promotion-read-models]
      operationId: listSessionInsightPromotionAdapterContracts
      summary: List dry-run adapter contracts and their apply-request mappings
      description: Runs secret-filtered SELECT queries only. It does not create a preview, approve an apply request, invoke a provider, or write internal or external state.
      x-openai-isConsequential: false
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdapterContractListRequest' }
      responses:
        '200':
          description: Bounded adapter contracts and apply-request mapping readback.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdapterContractListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /platform/session-insight-promotions/target-adapters/list:
    post:
      tags: [session-insight-promotion-read-models]
      operationId: listSessionInsightPromotionTargetAdapters
      summary: List skeleton target adapters and their apply-request mappings
      description: Runs secret-filtered SELECT queries only. Registry rows explicitly keep apply and execution disabled until a capability envelope and implemented target adapter exist.
      x-openai-isConsequential: false
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TargetAdapterListRequest' }
      responses:
        '200':
          description: Bounded target-adapter registry and apply-request mapping readback.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TargetAdapterListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /platform/session-insight-promotions/adapter-apply-readiness/list:
    post:
      tags: [session-insight-promotion-read-models]
      operationId: listSessionInsightPromotionAdapterApplyReadiness
      summary: Read adapter apply-readiness gates, summaries, and issues
      description: Reads readiness views and aggregates with SELECT queries only. The operation cannot approve, execute, or write an adapter action and always reports secret-free evidence.
      x-openai-isConsequential: false
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdapterApplyReadinessListRequest' }
      responses:
        '200':
          description: Bounded readiness gates with aggregate status and issue counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdapterApplyReadinessListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /platform/session-insight-promotions/review/list:
    post:
      tags: [session-insight-promotion-read-models]
      operationId: listSessionInsightPromotionReviews
      summary: List promotion proposals and aggregate review status
      description: Runs secret-filtered SELECT queries only. It does not approve, reject, promote, assign an executor, or write internal or external state.
      x-openai-isConsequential: false
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromotionReviewListRequest' }
      responses:
        '200':
          description: Bounded promotion proposals with aggregate review status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromotionReviewListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /platform/session-insight-promotions/payload-preview/review/list:
    post:
      tags: [session-insight-promotion-read-models]
      operationId: listSessionInsightPayloadPreviewReviews
      summary: List payload previews awaiting or carrying review decisions
      description: Runs secret-filtered SELECT queries only. It does not approve a preview, enable execution or target writes, execute an adapter, or mutate review state.
      x-openai-isConsequential: false
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayloadPreviewReviewListRequest' }
      responses:
        '200':
          description: Bounded payload-preview review rows with aggregate status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayloadPreviewReviewListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /platform/session-insight-promotions/capability-envelope-plans/list:
    post:
      tags: [session-insight-promotion-read-models]
      operationId: listSessionInsightCapabilityEnvelopePlans
      summary: List capability-envelope plans, summaries, and issues
      description: Runs secret-filtered SELECT queries only. It does not create or request a capability envelope, create an approval hold, execute an adapter, or enable a target write.
      x-openai-isConsequential: false
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CapabilityEnvelopePlanListRequest' }
      responses:
        '200':
          description: Bounded capability-envelope plans with aggregate status and issue counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilityEnvelopePlanListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /platform/session-insight-promotions/capability-envelope-request-gates/list:
    post:
      tags: [session-insight-promotion-read-models]
      operationId: listSessionInsightCapabilityEnvelopeRequestGates
      summary: List capability-envelope request gates and review state
      description: Runs three secret-filtered SELECT queries only. It does not create or review a request gate, request an actual capability envelope, create an approval hold, execute an adapter, or enable a target write.
      x-openai-isConsequential: false
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CapabilityEnvelopeRequestGateListRequest' }
      responses:
        '200':
          description: Bounded request gates with review-state aggregates and safety issues.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilityEnvelopeRequestGateListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /platform/session-insight-promotions/capability-envelope-dispatch-dry-runs/list:
    post:
      tags: [session-insight-promotion-read-models]
      operationId: listSessionInsightCapabilityEnvelopeDispatchDryRuns
      summary: List capability-envelope dispatch dry-runs
      description: Runs three secret-filtered SELECT queries only. It does not generate or review a dry-run, call capability resolution, request an actual envelope, create an approval hold, execute an adapter, or write a target surface.
      x-openai-isConsequential: false
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CapabilityEnvelopeDispatchDryRunListRequest' }
      responses:
        '200':
          description: Bounded dispatch dry-runs with aggregate status and safety issues.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilityEnvelopeDispatchDryRunListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /platform/session-insight-promotions/capability-envelope-actual-requests/preflights/list:
    post:
      tags: [session-insight-promotion-read-models]
      operationId: listSessionInsightCapabilityEnvelopeActualRequestPreflights
      summary: List actual capability-envelope request preflights
      description: Runs three secret-filtered SELECT queries only. It does not create a preflight, call capability resolution, request an actual envelope, create an approval hold, execute an adapter, or enable a target write.
      x-openai-isConsequential: false
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CapabilityEnvelopeActualRequestPreflightListRequest' }
      responses:
        '200':
          description: Bounded actual-request preflights with aggregate status and safety issues.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilityEnvelopeActualRequestPreflightListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /platform/session-insight-promotions/capability-envelope-actual-requests/list:
    post:
      tags: [session-insight-promotion-read-models]
      operationId: listSessionInsightCapabilityEnvelopeActualRequests
      summary: List actual capability-envelope requests
      description: Runs three secret-filtered SELECT queries only. It does not request an envelope, approve one, create an approval hold, dispatch an envelope, execute an adapter, or enable a target write.
      x-openai-isConsequential: false
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CapabilityEnvelopeActualRequestListRequest' }
      responses:
        '200':
          description: Bounded actual capability-envelope requests with aggregate status and safety issues.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilityEnvelopeActualRequestListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /platform/session-insight-promotions/capability-envelope-approvals/list:
    post:
      tags: [session-insight-promotion-read-models]
      operationId: listSessionInsightCapabilityEnvelopeApprovals
      summary: List capability-envelope approval decisions
      description: Runs three secret-filtered SELECT queries only. It does not approve an envelope, create an approval hold, dispatch an envelope, execute an adapter, or enable a target write.
      x-openai-isConsequential: false
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CapabilityEnvelopeApprovalListRequest' }
      responses:
        '200':
          description: Bounded capability-envelope approval decisions with aggregate status and safety issues.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilityEnvelopeApprovalListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /platform/session-insight-promotions/capability-envelope-dispatch-readbacks/list:
    post:
      tags: [session-insight-promotion-read-models]
      operationId: listSessionInsightCapabilityEnvelopeDispatchReadbacks
      summary: List capability-envelope dispatch readbacks
      description: Runs three secret-filtered SELECT queries only. It does not create a readback or execution gate, dispatch an envelope, execute an adapter, or enable a target write.
      x-openai-isConsequential: false
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CapabilityEnvelopeDispatchReadbackListRequest' }
      responses:
        '200':
          description: Bounded capability-envelope dispatch readbacks with aggregate status and safety issues.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilityEnvelopeDispatchReadbackListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /platform/session-insight-promotions/capability-envelope-adapter-execution-gates/list:
    post:
      tags: [session-insight-promotion-read-models]
      operationId: listSessionInsightCapabilityEnvelopeAdapterExecutionGates
      summary: List capability-envelope adapter execution gates
      description: Runs three secret-filtered SELECT queries only. It does not create an execution gate, request or execute an adapter apply, enable execution or promotion, or write a target surface.
      x-openai-isConsequential: false
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CapabilityEnvelopeAdapterExecutionGateListRequest' }
      responses:
        '200':
          description: Bounded adapter execution gates with aggregate status and safety issues.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilityEnvelopeAdapterExecutionGateListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /platform/session-insight-promotions/backlog-target-writes/list:
    post:
      tags: [session-insight-promotion-read-models]
      operationId: listSessionInsightBacklogTargetWrites
      summary: List internal backlog target writes
      description: Runs two secret-filtered SELECT queries only. It reads the internal SQL target-write ledger and issue view but cannot execute or roll back a write, modify a target item, call a provider, or perform an external write.
      x-openai-isConsequential: false
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BacklogTargetWriteListRequest' }
      responses:
        '200':
          description: Bounded internal backlog target writes with safety issues and policy evidence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BacklogTargetWriteListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  securitySchemes:
    adminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Backend API Key
      description: Backend API key supplied as a bearer token and accepted only when the runtime admin-principal guard also succeeds.
    backendApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Administrative backend API key accepted by the runtime backend-key guard.
  schemas:
    AdapterContractListRequest:
      type: object
      additionalProperties: false
      properties:
        contract_key: { type: string, minLength: 1, maxLength: 255 }
        adapter_key: { type: string, minLength: 1, maxLength: 255 }
        promotion_type: { type: string, minLength: 1, maxLength: 128 }
        target_surface: { type: string, minLength: 1, maxLength: 128 }
        contract_status: { type: string, minLength: 1, maxLength: 64 }
        status: { type: string, minLength: 1, maxLength: 64 }
        q: { type: string, maxLength: 255 }
        limit: { type: integer, minimum: 1, maximum: 100, default: 25 }
    TargetAdapterListRequest:
      type: object
      additionalProperties: false
      properties:
        adapter_key: { type: string, minLength: 1, maxLength: 255 }
        promotion_type: { type: string, minLength: 1, maxLength: 128 }
        target_surface: { type: string, minLength: 1, maxLength: 128 }
        adapter_family: { type: string, minLength: 1, maxLength: 128 }
        implementation_status: { type: string, minLength: 1, maxLength: 64 }
        status: { type: string, minLength: 1, maxLength: 64 }
        q: { type: string, maxLength: 255 }
        limit: { type: integer, minimum: 1, maximum: 100, default: 25 }
    AdapterApplyReadinessListRequest:
      type: object
      additionalProperties: false
      properties:
        payload_preview_id: { type: string, minLength: 1, maxLength: 255 }
        apply_request_id: { type: string, minLength: 1, maxLength: 255 }
        promotion_id: { type: string, minLength: 1, maxLength: 255 }
        promotion_type: { type: string, minLength: 1, maxLength: 128 }
        target_surface: { type: string, minLength: 1, maxLength: 128 }
        adapter_key: { type: string, minLength: 1, maxLength: 255 }
        contract_key: { type: string, minLength: 1, maxLength: 255 }
        gate_status: { type: string, minLength: 1, maxLength: 128 }
        q: { type: string, maxLength: 255 }
        limit: { type: integer, minimum: 1, maximum: 100, default: 25 }
    PromotionReviewListRequest:
      type: object
      additionalProperties: false
      properties:
        promotion_status: { type: string, enum: [queued, ready, rejected, promoted, superseded] }
        approval_status: { type: string, enum: [not_required, review_required, approved, rejected] }
        promotion_type: { type: string, minLength: 1, maxLength: 128 }
        target_surface: { type: string, minLength: 1, maxLength: 128 }
        tenant_id: { type: string, minLength: 1, maxLength: 128 }
        workspace_key: { type: string, minLength: 1, maxLength: 255 }
        target_scope_type: { type: string, minLength: 1, maxLength: 128 }
        target_scope_ref: { type: string, minLength: 1, maxLength: 255 }
        q: { type: string, maxLength: 255 }
        include_evidence: { type: boolean, default: false }
        limit: { type: integer, minimum: 1, maximum: 100, default: 25 }
    PayloadPreviewReviewListRequest:
      type: object
      additionalProperties: false
      properties:
        payload_preview_id: { type: string, minLength: 1, maxLength: 255 }
        apply_request_id: { type: string, minLength: 1, maxLength: 255 }
        promotion_id: { type: string, minLength: 1, maxLength: 255 }
        promotion_type: { type: string, minLength: 1, maxLength: 128 }
        target_surface: { type: string, minLength: 1, maxLength: 128 }
        adapter_key: { type: string, minLength: 1, maxLength: 255 }
        contract_key: { type: string, minLength: 1, maxLength: 255 }
        payload_review_status: { type: string, enum: [review_required, approved, rejected, not_required] }
        q: { type: string, maxLength: 255 }
        include_payload: { type: boolean, default: false }
        limit: { type: integer, minimum: 1, maximum: 100, default: 25 }
    CapabilityEnvelopePlanListRequest:
      type: object
      additionalProperties: false
      properties:
        capability_plan_id: { type: string, minLength: 1, maxLength: 255 }
        payload_preview_id: { type: string, minLength: 1, maxLength: 255 }
        apply_request_id: { type: string, minLength: 1, maxLength: 255 }
        promotion_id: { type: string, minLength: 1, maxLength: 255 }
        target_surface: { type: string, minLength: 1, maxLength: 128 }
        capability_key: { type: string, minLength: 1, maxLength: 255 }
        plan_status: { type: string, enum: [planned_not_requested, superseded, rejected] }
        limit: { type: integer, minimum: 1, maximum: 100, default: 25 }
    CapabilityEnvelopeRequestGateListRequest:
      type: object
      additionalProperties: false
      properties:
        request_gate_id: { type: string, minLength: 1, maxLength: 128 }
        capability_plan_id: { type: string, minLength: 1, maxLength: 128 }
        payload_preview_id: { type: string, minLength: 1, maxLength: 128 }
        apply_request_id: { type: string, minLength: 1, maxLength: 128 }
        promotion_id: { type: string, minLength: 1, maxLength: 96 }
        target_surface: { type: string, minLength: 1, maxLength: 96 }
        capability_key: { type: string, minLength: 1, maxLength: 128 }
        request_review_status: { type: string, enum: [request_review_required, request_approved, request_rejected] }
        limit: { type: integer, minimum: 1, maximum: 100, default: 25 }
    CapabilityEnvelopeDispatchDryRunListRequest:
      type: object
      additionalProperties: false
      properties:
        dispatch_dry_run_id: { type: string, minLength: 1, maxLength: 128 }
        request_gate_id: { type: string, minLength: 1, maxLength: 128 }
        capability_plan_id: { type: string, minLength: 1, maxLength: 128 }
        payload_preview_id: { type: string, minLength: 1, maxLength: 128 }
        apply_request_id: { type: string, minLength: 1, maxLength: 128 }
        promotion_id: { type: string, minLength: 1, maxLength: 96 }
        target_surface: { type: string, minLength: 1, maxLength: 96 }
        capability_key: { type: string, minLength: 1, maxLength: 128 }
        dispatch_status: { type: string, enum: [dispatch_dry_run_generated, superseded, rejected] }
        limit: { type: integer, minimum: 1, maximum: 100, default: 25 }
    CapabilityEnvelopeActualRequestPreflightListRequest:
      type: object
      additionalProperties: false
      properties:
        actual_request_preflight_id: { type: string, minLength: 1, maxLength: 128 }
        dispatch_dry_run_id: { type: string, minLength: 1, maxLength: 128 }
        request_gate_id: { type: string, minLength: 1, maxLength: 128 }
        capability_plan_id: { type: string, minLength: 1, maxLength: 128 }
        promotion_id: { type: string, minLength: 1, maxLength: 96 }
        preflight_status: { type: string, enum: [actual_request_preflight_passed, actual_request_preflight_blocked, superseded] }
        limit: { type: integer, minimum: 1, maximum: 100, default: 25 }
    CapabilityEnvelopeActualRequestListRequest:
      type: object
      additionalProperties: false
      properties:
        actual_request_id: { type: string, minLength: 1, maxLength: 128 }
        actual_request_preflight_id: { type: string, minLength: 1, maxLength: 128 }
        dispatch_dry_run_id: { type: string, minLength: 1, maxLength: 128 }
        promotion_id: { type: string, minLength: 1, maxLength: 96 }
        actual_capability_envelope_id: { type: string, minLength: 1, maxLength: 128 }
        limit: { type: integer, minimum: 1, maximum: 100, default: 25 }
    CapabilityEnvelopeApprovalListRequest:
      type: object
      additionalProperties: false
      properties:
        approval_decision_id: { type: string, minLength: 1, maxLength: 128 }
        actual_request_id: { type: string, minLength: 1, maxLength: 128 }
        actual_capability_envelope_id: { type: string, minLength: 1, maxLength: 128 }
        promotion_id: { type: string, minLength: 1, maxLength: 96 }
        limit: { type: integer, minimum: 1, maximum: 100, default: 25 }
    CapabilityEnvelopeDispatchReadbackListRequest:
      type: object
      additionalProperties: false
      properties:
        dispatch_readback_id: { type: string, minLength: 1, maxLength: 128 }
        approval_decision_id: { type: string, minLength: 1, maxLength: 128 }
        actual_request_id: { type: string, minLength: 1, maxLength: 128 }
        actual_capability_envelope_id: { type: string, minLength: 1, maxLength: 128 }
        promotion_id: { type: string, minLength: 1, maxLength: 96 }
        limit: { type: integer, minimum: 1, maximum: 100, default: 25 }
    CapabilityEnvelopeAdapterExecutionGateListRequest:
      type: object
      additionalProperties: false
      properties:
        adapter_execution_gate_id: { type: string, minLength: 1, maxLength: 128 }
        dispatch_readback_id: { type: string, minLength: 1, maxLength: 128 }
        actual_request_id: { type: string, minLength: 1, maxLength: 128 }
        actual_capability_envelope_id: { type: string, minLength: 1, maxLength: 128 }
        promotion_id: { type: string, minLength: 1, maxLength: 96 }
        limit: { type: integer, minimum: 1, maximum: 100, default: 25 }
    BacklogTargetWriteListRequest:
      type: object
      additionalProperties: false
      properties:
        target_write_id: { type: string, minLength: 1, maxLength: 128 }
        remaining_scope_completion_id: { type: string, minLength: 1, maxLength: 128 }
        target_item_id: { type: string, minLength: 1, maxLength: 128 }
        promotion_id: { type: string, minLength: 1, maxLength: 96 }
        target_surface: { type: string, enum: [development_backlog, integration_backlog, runtime_repair_backlog] }
        limit: { type: integer, minimum: 1, maximum: 100, default: 25 }
    AdapterContractListResponse:
      type: object
      additionalProperties: false
      required: [ok, contract_count, contracts, apply_request_mapping_count, apply_request_mappings, contract_policy, secrets_included]
      properties:
        ok: { type: boolean, const: true }
        contract_count: { type: integer, minimum: 0 }
        contracts:
          type: array
          items: { $ref: '#/components/schemas/AdapterContract' }
        apply_request_mapping_count: { type: integer, minimum: 0 }
        apply_request_mappings:
          type: array
          items: { $ref: '#/components/schemas/AdapterContractMapping' }
        contract_policy: { $ref: '#/components/schemas/AdapterContractPolicy' }
        secrets_included: { type: boolean, const: false }
    AdapterContract:
      type: object
      additionalProperties: false
      required: [contract_key, adapter_key, promotion_type, target_surface, contract_version, contract_status, contract_mode, payload_schema, required_fields, forbidden_fields, sample_payload, validator_rules, safety_contract, apply_supported, execution_allowed, status, secrets_included]
      properties:
        contract_key: { type: string }
        adapter_key: { type: string }
        promotion_type: { type: string }
        target_surface: { type: string }
        contract_version: { type: string }
        contract_status: { type: string }
        contract_mode: { type: string, enum: [dry_run_contract] }
