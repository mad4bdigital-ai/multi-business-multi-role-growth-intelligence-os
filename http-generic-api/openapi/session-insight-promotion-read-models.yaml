      content:
        application/json:
          schema: { $ref: '#/components/schemas/RuntimeUnauthorizedErrorEnvelope' }
    Forbidden:
      description: Administrative backend authentication is invalid or the authenticated principal lacks administrative authority.
      content:
        application/json:
