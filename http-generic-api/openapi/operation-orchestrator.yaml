openapi: 3.1.0
info:
  title: Operation Orchestrator API
  version: 1.0.0
  description: Canonical contracts for Admin and Tenant operation orchestration discovery, context, preview, status, and CI diagnosis.
tags:
  - name: Admin Operation Orchestration
  - name: Tenant Operation Orchestration
paths:
  /admin/operations/contracts:
    get:
      tags: [Admin Operation Orchestration]
      summary: List operation contracts available to an administrator
      operationId: listAdminOperationContracts
      x-contract-completeness: canonical
      security:
        - adminBearerAuth: []
        - backendApiKeyAuth: []
      responses:
        "200": { $ref: "#/components/responses/OperationResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /admin/operations/context:
    post:
      tags: [Admin Operation Orchestration]
      summary: Resolve administrator operation context
      operationId: resolveAdminOperationContext
      x-contract-completeness: canonical
      security:
        - adminBearerAuth: []
        - backendApiKeyAuth: []
      requestBody: { $ref: "#/components/requestBodies/OperationInput" }
      responses:
        "200": { $ref: "#/components/responses/OperationResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /admin/operations/preview:
    post:
      tags: [Admin Operation Orchestration]
      summary: Preview an administrator operation
      operationId: previewAdminOperation
      x-contract-completeness: canonical
      security:
        - adminBearerAuth: []
        - backendApiKeyAuth: []
      requestBody: { $ref: "#/components/requestBodies/OperationInput" }
      responses:
        "200": { $ref: "#/components/responses/OperationResult" }
        "202": { $ref: "#/components/responses/OperationAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /admin/operations/status:
    post:
      tags: [Admin Operation Orchestration]
      summary: Read administrator operation status
      operationId: readAdminOperationStatus
      x-contract-completeness: canonical
      security:
        - adminBearerAuth: []
        - backendApiKeyAuth: []
      requestBody: { $ref: "#/components/requestBodies/OperationInput" }
      responses:
        "200": { $ref: "#/components/responses/OperationResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /admin/operations/ci-diagnose:
    post:
      tags: [Admin Operation Orchestration]
      summary: Diagnose administrator operation CI state
      operationId: diagnoseAdminOperationCi
      x-contract-completeness: canonical
      security:
        - adminBearerAuth: []
        - backendApiKeyAuth: []
      requestBody: { $ref: "#/components/requestBodies/OperationInput" }
      responses:
        "200": { $ref: "#/components/responses/OperationResult" }
        "202": { $ref: "#/components/responses/OperationAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /tenant/operations/contracts:
    get:
      tags: [Tenant Operation Orchestration]
      summary: List operation contracts available to the active tenant member
      operationId: listTenantOperationContracts
      x-contract-completeness: canonical
      security:
        - userJwtAuth: []
      responses:
        "200": { $ref: "#/components/responses/OperationResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /tenant/operations/context:
    post:
      tags: [Tenant Operation Orchestration]
      summary: Resolve tenant operation context
      operationId: resolveTenantOperationContext
      x-contract-completeness: canonical
      security:
        - userJwtAuth: []
      requestBody: { $ref: "#/components/requestBodies/OperationInput" }
      responses:
        "200": { $ref: "#/components/responses/OperationResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /tenant/operations/preview:
    post:
      tags: [Tenant Operation Orchestration]
      summary: Preview a tenant operation
      operationId: previewTenantOperation
      x-contract-completeness: canonical
      security:
        - userJwtAuth: []
      requestBody: { $ref: "#/components/requestBodies/OperationInput" }
      responses:
        "200": { $ref: "#/components/responses/OperationResult" }
        "202": { $ref: "#/components/responses/OperationAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /tenant/operations/status:
    post:
      tags: [Tenant Operation Orchestration]
      summary: Read tenant operation status
      operationId: readTenantOperationStatus
      x-contract-completeness: canonical
      security:
        - userJwtAuth: []
      requestBody: { $ref: "#/components/requestBodies/OperationInput" }
      responses:
        "200": { $ref: "#/components/responses/OperationResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /tenant/operations/ci-diagnose:
    post:
      tags: [Tenant Operation Orchestration]
      summary: Diagnose tenant operation CI state
      operationId: diagnoseTenantOperationCi
      x-contract-completeness: canonical
      security:
        - userJwtAuth: []
      requestBody: { $ref: "#/components/requestBodies/OperationInput" }
      responses:
        "200": { $ref: "#/components/responses/OperationResult" }
        "202": { $ref: "#/components/responses/OperationAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
components:
  securitySchemes:
    adminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    backendApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
    userJwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  requestBodies:
    OperationInput:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OperationInput" }
  responses:
    OperationResult:
      description: Operation result returned successfully.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OperationResult" }
    OperationAccepted:
      description: Operation requires additional input or asynchronous continuation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OperationResult" }
    BadRequest:
      description: The operation request is invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: The authenticated principal is not allowed to perform the operation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: The requested operation state was not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    InternalError:
      description: Operation orchestration failed unexpectedly.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    OperationInput:
      type: object
      description: Operation-specific input resolved by the operation contract inventory.
      additionalProperties: true
    OperationResult:
      type: object
      description: Operation-specific result, lifecycle evidence, or contract inventory.
      additionalProperties: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
            requestId: { type: string }
          additionalProperties: true
      additionalProperties: false
