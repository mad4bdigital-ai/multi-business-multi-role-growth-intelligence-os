openapi: 3.1.0
info:
  title: Growth Intelligence Platform - Admin Core Actions
  version: 3.0.0-platform
  summary: Admin and system MCP facades without Activation routes.
  description: Stable Admin Core transport for governed admin-control and system-layer operations. Dynamic MCP tool schemas remain SQL-driven.
servers:
  - url: https://auth.mad4b.com
    description: admin_core surface
tags:
  - name: admin-control
    description: Personal administrator control surface for CLI, database, and runtime environment operations.
  - name: system-layer
    description: MCP-style governed system layer backed by connector registries, principal context, and runtime validation.
components:
  securitySchemes:
    backendBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Backend API Key or User JWT
      description: |
        Send Authorization: Bearer <BACKEND_API_KEY> for admin/service access, or Authorization: Bearer <USER_JWT> after user sign-in.
  schemas:
    GoogleAuthPlatformConfigResponse:
      type: object
      additionalProperties: true
      required:
        - ok
        - project_key
        - console_root
        - tabs
      properties:
        ok:
          type: boolean
        project_key:
          type: string
        console_root:
          type: string
        tabs:
          type: array
          items:
            type: object
            additionalProperties: true
            required:
              - config_key
              - status
              - config
            properties:
              config_key:
                type: string
              status:
                type: string
              note:
                type:
                  - string
                  - "null"
              updated_at:
                type:
                  - string
                  - "null"
              config:
                type: object
                additionalProperties: true
                properties:
                  owner_type:
                    type: string
                  tenant_id:
                    type:
                      - string
                      - "null"
                  project_key:
                    type: string
                  project_id:
                    type:
                      - string
                      - "null"
                  project_display_name:
                    type: string
                  tab:
                    type: string
                  path:
                    type: string
                  state:
                    type: object
                    additionalProperties: true
                    properties: {}
                  notes:
                    type:
                      - string
                      - "null"
                  updated_at:
                    type: string
        secrets_included:
          type: boolean
          enum:
            - false
    ToolDispatchResponse:
      type: object
      additionalProperties: true
      properties:
        ok:
          type: boolean
        name:
          type: string
        tool:
          type: string
        status:
          oneOf:
            - type: string
            - type: integer
        result:
          type: object
          additionalProperties: true
          properties:
            ok:
              type: boolean
            classification:
              type: string
            secrets_included:
              type: boolean
              enum:
                - false
        error:
          type: object
          additionalProperties: true
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
              properties: {}
        response_chunked:
          type: boolean
        chunk_id:
          type: string
        continuation:
          type: object
          additionalProperties: true
          properties:
            policy:
              type: string
            required_tool:
              type: string
            required_before_fallback:
              type: boolean
        page:
          type: object
          additionalProperties: true
          properties:
            cursor:
              type: integer
              minimum: 0
            next_cursor:
              type:
                - integer
                - "null"
              minimum: 0
            has_more:
              type: boolean
        secrets_included:
          type: boolean
          enum:
            - false
    SchemaImportJob:
      type: object
      additionalProperties: true
      properties:
        job_id:
          type: string
        action_key:
          type: string
        source_type:
          type: string
          enum:
            - upload
            - repo_link
            - rollback
        source_url:
          type: string
          nullable: true
        source_ref:
          type: string
          nullable: true
        source_filename:
          type: string
          nullable: true
        endpoints_upserted:
          type: integer
        endpoints_deprecated:
          type: integer
        warnings:
          type: array
          items:
            type: string
          nullable: true
        status:
          type: string
          enum:
            - pending
            - completed
            - failed
        error_message:
          type: string
          nullable: true
        imported_by:
          type: string
          nullable: true
        imported_at:
          type: string
          format: date-time
    ErrorObject:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        status:
          type: integer
        details:
          oneOf:
            - type: object
              additionalProperties: true
              properties: {}
            - type: "null"
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - error
      properties:
        ok:
          type: boolean
          enum:
            - false
        error:
          $ref: "#/components/schemas/ErrorObject"
        execution_guardrail:
          type: boolean
  responses:
    BadRequest:
      description: Invalid request body or missing required field
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Invalid or missing backend API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated principal is not authorized for this operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource state conflicts with the requested operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
security:
  - backendBearerAuth: []
paths:
  /system/connectors:
    get:
      tags:
        - system-layer
      security:
        - backendBearerAuth: []
      operationId: listSystemConnectors
      summary: List connector systems visible to the current principal
      description: Principal-aware facade over connected_systems. Tenant users are automatically scoped to their tenant; admin principals can inspect all tenants.
      parameters:
        - name: tenant_id
          in: query
          schema:
            type: string
          description: Admin-only filter. Tenant principals are always forced to their own tenant_id.
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - pending
              - error
              - archived
        - name: connector_family
          in: query
          schema:
            type: string
        - name: provider_family
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Principal-scoped connector registry list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  count:
                    type: integer
                  connectors:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Tenant scope violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /system/connectors/{system_id}:
    get:
      tags:
        - system-layer
      security:
        - backendBearerAuth: []
      operationId: getSystemConnector
      summary: Get one connector system visible to the current principal
      description: Principal-aware connector registry read. Tenant users can only read systems in their tenant; admins can read any system.
      parameters:
        - name: system_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Principal-scoped connector registry record
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  connector:
                    type: object
                    additionalProperties: true
                    properties: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Tenant scope violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Connector system not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /system/tools:
    get:
      tags:
        - system-layer
      security:
        - backendBearerAuth: []
      operationId: listSystemTools
      x-tenant-gpt-operationId: listTools
      summary: List MCP-style system tools visible to the current principal
      description: Lists fixed OpenAPI-compatible tools available through the auth-host system layer. Tool calls are governed by principal context. Results are bounded and page-aware; oversized responses return response_chunked=true, chunk_id, page.next_cursor, cache TTL metadata, and require response_chunk_read befo.
      responses:
        "200":
          description: System layer tools
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  protocol:
                    type: string
                    example: openapi-mcp-facade
                  principal:
                    type: object
                    additionalProperties: true
                    properties: {}
                  tools:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
  /system/tools/call:
    post:
      tags:
        - system-layer
      security:
        - backendBearerAuth: []
      operationId: callSystemTool
      x-tenant-gpt-operationId: callTool
      x-openai-isConsequential: false
      summary: Call a governed MCP-style system tool
      description: Calls a fixed system-layer tool through principal-aware runtime validation. Descriptor tools may declare an explicit handler_name when the public tool name does not map one-to-one to the runtime export; descriptor readiness verifies that the selected handler is callable. Repository Intelligence V2.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
              properties:
                name:
                  type: string
                  pattern: ^[a-z][a-z0-9_:-]{1,128}$
                  description: Tool key returned by listTools; runtime validates registration, tenant scope, and arguments before dispatch.
                arguments:
                  type: object
                  additionalProperties: true
                  deprecated: true
                  description: Legacy tool arguments. Tenant GPT callers should use tool_args.
                  properties: {}
                tool_args:
                  type: object
                  additionalProperties: true
                  description: Tool arguments. For connector_registry_get, include system_id. For activation bootstrap upsert, include GitHub binding fields. Admin provider tools require admin/service auth.
                  properties:
                    mode:
                      type: string
                      enum:
                        - managed
                        - dedicated
                        - hybrid
                    integration_modes:
                      type: array
                      items:
                        type: string
                    device_id:
                      type: string
                      pattern: ^[a-z0-9-]{2,32}$
      responses:
        "200":
          description: System tool result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  ok:
                    type: boolean
                  name:
                    type: string
                  result:
                    type: object
                    additionalProperties: true
                    properties: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Tenant scope violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/system/connectors:
    get:
      tags:
        - admin-control
      security:
        - backendBearerAuth: []
      operationId: listAdminSystemConnectors
      summary: List connector systems from the system registry
      description: Read-only admin facade over the connected_systems table. Use this before choosing connector-specific actions or MCP-style tool calls.
      parameters:
        - name: tenant_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - pending
              - error
              - archived
        - name: connector_family
          in: query
          schema:
            type: string
        - name: provider_family
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Connector registry list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  count:
                    type: integer
                  connectors:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/system/connectors/{system_id}:
    get:
      tags:
        - admin-control
      security:
        - backendBearerAuth: []
      operationId: getAdminSystemConnector
      summary: Get one connector system from the system registry
      description: Returns one connected_systems row plus its installation summary. This is a governed alternative to raw DB inspection for connector inventory.
      parameters:
        - name: system_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Connector registry record
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  connector:
                    type: object
                    additionalProperties: true
                    properties: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Connector system not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/system/tools:
    get:
      tags:
        - admin-control
      security:
        - backendBearerAuth: []
      operationId: listAdminSystemTools
      summary: List MCP-style system layer tools
      description: Lists fixed OpenAPI-compatible tools available through the admin system layer. This behaves like a small MCP tools/list facade over governed platform registries. Results are bounded and page-aware; oversized responses return response_chunked=true, chunk_id, page.next_cursor, cache TTL metadata, and.
      responses:
        "200":
          description: System layer tools
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  protocol:
                    type: string
                    example: openapi-mcp-facade
                  tools:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/system/tools/call:
    post:
      tags:
        - admin-control
      security:
        - backendBearerAuth: []
      operationId: callAdminSystemTool
      x-openai-isConsequential: false
      summary: Call an MCP-style system layer tool
      description: Calls a fixed, governed system-layer tool. Descriptor tools may declare an explicit handler_name when the public tool name does not map one-to-one to the runtime export; descriptor readiness verifies that the selected handler is callable. Repository Intelligence V2 readiness invokes the binding lif.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
              properties:
                name:
                  type: string
                  enum:
                    - connector_registry_list
                    - connector_registry_get
                    - activation_drive_probe
                    - activation_sheets_bootstrap_read
                    - activation_github_validate
                    - activation_provider_bootstrap_validate
                    - activation_bootstrap_config_upsert
                arguments:
                  type: object
                  additionalProperties: true
                  deprecated: true
                  description: Legacy tool arguments. Prefer tool_args for wrapper-safe callers.
                  properties: {}
                tool_args:
                  type: object
                  additionalProperties: true
                  description: Tool arguments. For connector_registry_get, include system_id. For activation bootstrap upsert, include GitHub binding fields. Repository webhook V2 status and dry-run prefer binding_key; apply also requires binding_sha256, capability_sha256, expected_commit_sha, capability_envelope_id, typed confi.
                  properties: {}
            examples:
              repositoryWebhookDryRun:
                summary: Resolve the governed repository and produce review-bound fingerprints without a provider write
                value:
                  name: github_repository_main_moved_webhook_provision
                  tool_args:
                    binding_key: growth_intelligence_platform.github.primary.production
                    mode: dry_run
              repositoryWebhookApply:
                summary: Apply only after reviewing dry-run output and approving a single-use context-bound envelope
                value:
                  name: github_repository_main_moved_webhook_provision
                  tool_args:
                    binding_key: growth_intelligence_platform.github.primary.production
                    mode: apply
                    confirm: PROVISION_GITHUB_REPOSITORY_MAIN_MOVED_WEBHOOK
                    capability_envelope_id: 00000000-0000-0000-0000-000000000000
                    expected_commit_sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                    binding_sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                    capability_sha256: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
                    reason: Apply the reviewed repository webhook plan after same-cycle authority and capability validation.
      responses:
        "200":
          description: System tool result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  ok:
                    type: boolean
                  name:
                    type: string
                  result:
                    type: object
                    additionalProperties: true
                    properties: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/apis-services/google-auth-platform:
    get:
      tags:
        - admin-control
      security:
        - backendBearerAuth: []
      operationId: getAdminGoogleAuthPlatformTabs
      summary: Read simulated Google Auth Platform tabs
      description: Returns governed DB-backed tab state for the platform-controlled Google Auth Platform and APIs & Services console simulation.
      parameters:
        - in: query
          name: project_key
          schema:
            type: string
            default: growth-intelligence-os
        - in: query
          name: owner_type
          schema:
            type: string
            enum:
              - platform
              - tenant
            default: platform
        - in: query
          name: tenant_id
          schema:
            type: string
      responses:
        "200":
          description: Google Auth Platform tab state
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  ok:
                    type: boolean
                  project_key:
                    type: string
                  console_root:
                    type: string
                  tabs:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/apis-services/google-auth-platform/{tab}:
    get:
      tags:
        - admin-control
      security:
        - backendBearerAuth: []
      operationId: getAdminGoogleAuthPlatformTab
      summary: Read one simulated Google Auth Platform tab
      description: Returns one governed tab state, such as overview, branding, audience, clients, data_access, verification_center, settings, or api_credentials.
      parameters:
        - in: path
          name: tab
          required: true
          schema:
            type: string
            enum:
              - overview
              - branding
              - audience
              - clients
              - data_access
              - verification_center
              - settings
              - api_credentials
        - in: query
          name: project_key
          schema:
            type: string
            default: growth-intelligence-os
      responses:
        "200":
          description: Google Auth Platform tab state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleAuthPlatformConfigResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/apis-services/credentials:
    get:
      tags:
        - admin-control
      security:
        - backendBearerAuth: []
      operationId: getAdminApisServicesCredentials
      summary: Read simulated APIs & Services Credentials tab
      description: Returns the governed APIs & Services Credentials tab and linked platform credential-client registry records.
      parameters:
        - in: query
          name: project_key
          schema:
            type: string
            default: growth-intelligence-os
      responses:
        "200":
          description: APIs & Services Credentials state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleAuthPlatformConfigResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /gpt/tools:
    get:
      tags:
        - admin-control
      security:
        - backendBearerAuth: []
      operationId: listAdminTools
      summary: List admin platform tools from the governed registry
      description: Returns paginated DB-backed and virtual Admin tools. Use limit/cursor/q/tag for bounded discovery; clients unable to send query parameters should call admin_tool_catalog_search through callAdminTool. Read all response chunks before fallback. Repository lifecycle mutations remain capability-gated an.
      x-runtime-governance:
        admin_branch_reconcile_continuation:
          policy: admin_branch_reconcile_continuation_contract
          virtual_tool: admin_branch_reconcile
          adapter: runAdminBranchReconcile
          adapter_version: admin-branch-reconciliation-v1
          apply_supported: false
          github_ref_update_force: false
          requires_confirmation_for_future_apply: RECONCILE_BRANCH_<BRANCH_SLUG>
          shared_reconciliation_checkpoint: true
          secrets_included: false
        github_branch_fast_forward_to_base:
          policy: capability_envelope_gated_ref_update
          virtual_tool: github_branch_fast_forward_to_base
          adapter: runGithubBranchFastForwardToBase
          recipe_key: github.branch.fast_forward_to_base
          requires_prior_dry_run_tool: admin_branch_reconcile
          requires_expected_base_sha: true
          requires_expected_branch_sha: true
          applies_only_when_classification: behind_only
          requires_capability_envelope: true
          requires_confirmation: RECONCILE_BRANCH_<BRANCH_SLUG>
          github_ref_update_force: false
          requires_same_cycle_readback: true
          secrets_included: false
        github_branch_merge_commit_create:
          policy: capability_envelope_gated_multi_parent_merge_commit
          virtual_tool: github_branch_merge_commit_create
          adapter: runGithubBranchMergeCommitCreate
          recipe_key: github.branch.create_multi_parent_merge_commit
          requires_prior_dry_run_tool: admin_branch_reconcile
          applies_only_when_classification:
            - diverged_no_overlap
            - diverged_same_files
          requires_expected_base_sha: true
          requires_expected_branch_sha: true
          requires_resolution_commit_sha: true
          resolution_commit_sole_parent: expected_base_sha
          resolution_commit_changed_files_must_match_branch_scope: true
          resolution_commit_max_files: 50
          requires_capability_envelope: true
          requires_confirmation: CREATE_MERGE_COMMIT_<BRANCH_SLUG>
          merge_commit_parent_order:
            - expected_branch_sha
            - expected_base_sha
          merge_commit_tree_source: validated_resolution_commit_tree
          github_ref_update_force: false
          protected_branch_update_allowed: false
          requires_same_cycle_ref_readback: true
          requires_same_cycle_parent_readback: true
          requires_same_cycle_tree_readback: true
          expected_readback_classification: ahead_only
          expected_readback_behind_by: 0
          secrets_included: false
        github_branch_fast_forward_smoke:
          policy: disposable_branch_smoke_with_cleanup
          virtual_tool: github_branch_fast_forward_smoke
          adapter: runGithubBranchFastForwardSmoke
          recipe_key: github.branch.fast_forward_smoke
          creates_branch_prefix: gpt/fast-forward-smoke-
          creates_branch_at: default_branch_parent_commit
          requires_capability_envelope: true
          requires_dry_run_classification: behind_only
          delegates_apply_to: github_branch_fast_forward_to_base
          github_ref_update_force: false
          requires_same_cycle_readback: true
          cleanup_required: true
          cleanup_in_finally: true
          secrets_included: false
        chunked_tool_response_continuation:
          policy: chunk_read_before_alternative_surface
          required_tool: response_chunk_read
          required_before_fallback: true
          applies_to: any_governed_tool_response
          secrets_included: false
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Maximum tools to return in this page.
        - name: cursor
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Zero-based list cursor for the next page.
        - name: q
          in: query
          schema:
            type: string
          description: Optional text filter over name, displayName, description, and path.
        - name: tag
          in: query
          schema:
            type: string
          description: Optional exact tag filter.
        - name: max_chars
          in: query
          schema:
            type: integer
            minimum: 5000
            maximum: 150000
            default: 45000
          description: Maximum JSON characters before returning an automatic response chunk.
      responses:
        "200":
          description: Admin tool catalog
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                  - ok
                  - tools
                properties:
                  ok:
                    type: boolean
                  caller_type:
                    type: string
                  count:
                    type: integer
                  tools:
                    type: array
                    items:
