      operationId: listDeviceTools
      summary: List device-tagged tools (MCP-style local device control surface)
      description: Returns the device-tagged subset of the admin or tenant tool registry. Use this MCP-style facade to control local device apps (n8n, browser, files, Windows, Cloudflare) primarily from auth.mad4b.com instead of the direct connector.mad4b.com schema.
      responses:
        "200":
          description: Device tool catalog
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                  - ok
                  - tools
                properties:
                  ok:
                    type: boolean
                  protocol:
                    type: string
                    example: openapi-mcp-facade
                  surface:
                    type: string
                    example: device
                  caller_type:
                    type: string
                  count:
                    type: integer
                  tools:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        name:
                          type: string
                        displayName:
                          type: string
                        description:
                          type: string
                        method:
                          type: string
                        path:
                          type: string
                        tags:
                          type: array
                          items:
                            type: string
                        inputSchema:
                          type: object
                          additionalProperties: true
                          properties: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Device tool list failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /device/tools/call:
    post:
      tags:
        - admin-control
      security:
        - backendBearerAuth: []
      operationId: callDeviceTool
      x-openai-isConsequential: false
      summary: Execute a device-tagged tool by name (MCP-style dispatch)
      description: Dispatches a device-tagged tool through the auth.mad4b.com facade. Rejects tool keys not tagged 'device' with 403. Reuses the gpt/tools dispatcher so audit, admin scope-grant resolution, and grant_dispatch logging keep working.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
              properties:
                name:
                  type: string
                  description: Device tool key from listDeviceTools, e.g. connector_n8n, connector_browser, connector_win, connector_files.
                tool_args:
                  type: object
                  additionalProperties: true
                  description: Arguments matching the device tool inputSchema.
                  properties: {}
      responses:
        "200":
          description: Upstream device tool response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolDispatchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Tool exists but is not in the device-tools surface
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Tool not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Device tool call failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/cli/local-connector/install-bundle:
    get:
      tags:
        - admin-control
      security:
        - backendBearerAuth: []
      operationId: getLocalConnectorInstallBundle
      summary: Resolve or download a local connector installer
      description: Generate a pre-filled Windows .bat installer for the local connector stack (cloudflared + Node.js service via NSSM). Reads cf_token and connector_secret from local_connector_user_configs in DB for the given user_id + device_id. Falls back to server env only if no DB row exists. The default JSON mod.
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: string
          description: User ID whose device config to load from DB. Defaults to platform admin.
        - name: device_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
            default: mohammedlap
          description: Device ID (hostname) to load config for. Defaults to mohammedlap.
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum:
              - json
              - bat
            default: json
          description: json returns a no-secret handoff; bat returns the authenticated binary installer.
      responses:
        "200":
          description: Metadata-only secure handoff or authenticated installer attachment
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - ok
                  - artifact_delivery
                  - script_content_omitted
                  - credential_materialized
                  - public_storage_allowed
                  - secure_download
                  - secrets_included
                properties:
                  ok:
                    type: boolean
                    const: true
                  artifact_delivery:
                    type: string
                    const: authenticated_direct_download_only
                  script_content_omitted:
                    type: boolean
                    const: true
                  script_content_reason:
                    type: string
                  credential_materialized:
                    type: boolean
                    const: false
                  public_storage_allowed:
                    type: boolean
                    const: false
                  secure_download:
                    type: object
                    additionalProperties: false
                    required:
                      - method
                      - path
                      - query
                      - requires_backend_api_key
                      - requires_admin_principal
                    properties:
                      method:
                        type: string
                        const: GET
                      path:
                        type: string
                        const: /admin/cli/local-connector/install-bundle
                      query:
                        type: object
                        additionalProperties: false
                        required:
                          - user_id
                          - device_id
                          - format
                        properties:
                          user_id:
                            type: string
                          device_id:
                            type: string
                          format:
                            type: string
                            const: bat
                      requires_backend_api_key:
                        type: boolean
                        const: true
                      requires_admin_principal:
                        type: boolean
                        const: true
                  secrets_included:
                    type: boolean
                    const: false
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/cli/local-connector/self-repair:
    post:
      tags:
        - admin-control
      security:
        - backendBearerAuth: []
      operationId: repairLocalConnector
      x-openai-isConsequential: false
      summary: Diagnose local connector health and return a secure installer handoff
      x-runtime-governance:
        local_connector_tunnel_provisioning_continuation:
          policy: local_connector_tunnel_provisioning_continuation_contract
          interruption_signal: connector_tunnel_provisioning_required
          required_next_action: provision_tunnel_token
          status_code: 409
          shared_reconciliation_checkpoint: true
          secrets_included: false
      description: Retry bounded connector health up to three total attempts for transient 1033/HTTP 530. Stop on pass or authorization-gated reachability. The JSON response never generates or uploads installer content; after retry exhaustion and degraded readback it returns a no-secret diagnosis, retry evidence, and.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                user_id:
                  type: string
                  description: User ID whose device to repair. Defaults to platform admin.
                device_id:
                  type: string
                  description: Device hostname to repair. Defaults to mohammedlap.
      responses:
        "200":
          description: Diagnosis and no-secret authenticated repair handoff
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - ok
                  - diagnosis
                  - repair
                properties:
                  ok:
                    type: boolean
                    const: true
                  diagnosis:
                    type: object
                    additionalProperties: true
                    required:
                      - secrets_included
                    properties:
                      device_id:
                        type: string
                      tunnel_url:
                        type: string
                      cf_tunnel_id:
                        type: string
                      cf_tunnel_status:
                        type: string
                      config_source:
                        type: string
                        enum:
                          - db
                          - db_alias
                          - env
                          - env_fallback
                      secrets_included:
                        type: boolean
                        const: false
                  repair:
                    type: object
                    additionalProperties: true
                    required:
                      - required
                      - installer_generated
                      - artifact_delivery
                      - public_storage_allowed
                      - secure_download
                      - secrets_included
                    properties:
                      required:
                        type: boolean
                      installer_generated:
                        type: boolean
                        const: false
                      artifact_delivery:
                        type: string
                        const: authenticated_direct_download_only
                      action:
                        type: string
                      filename:
                        type: string
                      public_storage_allowed:
                        type: boolean
                        const: false
                      drive_upload_status:
                        type: string
                        const: blocked_secret_bearing_artifact
                      drive_error:
                        type: "null"
                      drive:
                        type: "null"
                      script_content_omitted:
                        type: boolean
                        const: true
                      script_content_reason:
                        type: string
                      secure_download:
                        type: object
                        additionalProperties: false
                        required:
                          - method
                          - path
                          - query
                          - requires_backend_api_key
                          - requires_admin_principal
                        properties:
                          method:
                            type: string
                            const: GET
                          path:
                            type: string
                            const: /admin/cli/local-connector/install-bundle
                          query:
                            type: object
                            additionalProperties: false
                            required:
                              - user_id
                              - device_id
                              - format
                            properties:
                              user_id:
                                type: string
                              device_id:
                                type: string
                              format:
                                type: string
                                const: bat
                          requires_backend_api_key:
                            type: boolean
                            const: true
                          requires_admin_principal:
                            type: boolean
                            const: true
                      secrets_included:
                        type: boolean
                        const: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
