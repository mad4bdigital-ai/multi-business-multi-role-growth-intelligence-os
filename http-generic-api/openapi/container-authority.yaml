schemas:
  ErrorResponse:
    type: object
    additionalProperties: false
    required: [error, secretsIncluded]
    properties:
      error:
        type: object
        additionalProperties: false
        required: [code, message, details, requestId]
        properties:
          code: { type: string, example: container_authority_epoch_changed }
          message: { type: string }
          details:
            type: array
            items: { type: object, additionalProperties: true }
          requestId: { type: string }
      secretsIncluded: { type: boolean, const: false }

  Principal:
    type: object
    additionalProperties: false
    required: [type, id]
    properties:
      type: { type: string, enum: [user, agent, service, group] }
      id: { type: string, minLength: 1, maxLength: 191 }

  DimensionRequest:
    type: object
    additionalProperties: false
    required: [dimension, resourceType, resourceRef, operation]
    properties:
      dimension: { type: string, minLength: 1, maxLength: 191 }
      resourceType: { type: string, minLength: 1, maxLength: 128 }
      resourceRef: { type: string, minLength: 1, maxLength: 512, not: { const: '*' } }
      operation: { type: string, minLength: 1, maxLength: 191, not: { const: '*' } }
      capabilityKey: { type: [string, 'null'], maxLength: 191 }

  ResolutionRequest:
    type: object
    additionalProperties: false
    required: [targetContainerId, dimensionRequests]
    properties:
      principal: { $ref: '#/schemas/Principal' }
      tenantId: { type: string, minLength: 1, maxLength: 36 }
      targetContainerId: { type: string, minLength: 1, maxLength: 36 }
      dimensionRequests:
        type: array
        minItems: 1
        maxItems: 50
        items: { $ref: '#/schemas/DimensionRequest' }
      mode: { type: string, enum: [preview, shadow, enforce], default: preview }
      expectedAuthorityEpoch: { type: integer, minimum: 0 }
      expectedRegistrySnapshotHash: { type: string, pattern: '^[a-f0-9]{64}$' }
      legacyDecision: { type: string, maxLength: 64 }
      legacyEvidenceRef: { type: string, maxLength: 512 }
      requestId: { type: string, maxLength: 191 }
    description: Tenant JWT callers are pinned to their signed principal, tenant, and preview mode.

  ResolutionResponse:
    type: object
    additionalProperties: true
    required: [resolutionId, principal, tenantId, targetContainerId, mode, decision, authorityEpoch, resolverVersion, resolutionSha256, blockingCodes, providerCallMade, credentialPayloadRead, secretsIncluded]
    properties:
      resolutionId: { type: string, format: uuid }
      principal: { $ref: '#/schemas/Principal' }
      tenantId: { type: string }
      targetContainerId: { type: string }
      mode: { type: string, enum: [preview, shadow, enforce] }
      decision: { type: string, enum: [allow, restrict, deny, ambiguous, requires_override] }
      authorityEpoch: { type: integer, minimum: 0 }
      resolverVersion: { type: string }
      requestSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
      containerPathHash: { type: string, pattern: '^[a-f0-9]{64}$' }
      registrySnapshotHash: { type: string, pattern: '^[a-f0-9]{64}$' }
      resolutionSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
      blockingCodes: { type: array, items: { type: string } }
      providerCallMade: { type: boolean, const: false }
      credentialPayloadRead: { type: boolean, const: false }
      secretsIncluded: { type: boolean, const: false }
      cacheHit: { type: boolean }
      idempotentReplay: { type: boolean }
      expiresAt: { type: string, format: date-time }

  RelationshipRequest:
    type: object
    additionalProperties: false
    required: [tenantId, fromContainerId, toContainerId, relationshipType]
    properties:
      relationshipId: { type: string, format: uuid }
      tenantId: { type: string, minLength: 1, maxLength: 36 }
      fromContainerId: { type: string, minLength: 1, maxLength: 36 }
      toContainerId: { type: string, minLength: 1, maxLength: 36 }
      relationshipType: { type: string, minLength: 1, maxLength: 191 }
      priority: { type: integer, minimum: 0 }
      conditions: { type: object, additionalProperties: true }
      validFrom: { type: string, format: date-time }
      validUntil: { type: string, format: date-time }
      approvedBy: { type: string, maxLength: 191 }
      metadata: { type: object, additionalProperties: true }

  RoleAssignmentRequest:
    type: object
    additionalProperties: false
    required: [tenantId, containerId, principal]
    properties:
      assignmentId: { type: string, format: uuid }
      tenantId: { type: string, minLength: 1, maxLength: 36 }
      containerId: { type: string, minLength: 1, maxLength: 36 }
      principal: { $ref: '#/schemas/Principal' }
      roleTemplateKey: { type: string, maxLength: 191 }
      inlinePermissions:
        type: array
        items: { type: object, additionalProperties: true }
      inheritanceMode: { type: string, enum: [local_only, inherit_down], default: local_only }
      validUntil: { type: string, format: date-time }
      approvedBy: { type: string, maxLength: 191 }
      metadata: { type: object, additionalProperties: true }
    oneOf:
      - required: [roleTemplateKey]
        not: { required: [inlinePermissions] }
      - required: [inlinePermissions]
        not: { required: [roleTemplateKey] }

  ResourceBindingRequest:
    type: object
    additionalProperties: false
    required: [tenantId, containerId, dimension, resourceType, resourceRef, effect]
    properties:
      bindingId: { type: string, format: uuid }
      tenantId: { type: string, minLength: 1, maxLength: 36 }
      containerId: { type: string, minLength: 1, maxLength: 36 }
      dimension: { type: string, minLength: 1, maxLength: 191 }
      resourceType: { type: string, minLength: 1, maxLength: 128 }
      resourceRef: { type: string, minLength: 1, maxLength: 512, not: { const: '*' } }
      effect: { type: string, enum: [allow, deny, restrict, require, share, delegate] }
      permissionKey: { type: string, maxLength: 191 }
      operations: { type: array, items: { type: string, not: { const: '*' } } }
      capabilityKeys: { type: array, items: { type: string } }
      inheritanceMode: { type: string, enum: [local_only, inherit_down, explicit_share, block_inheritance], default: local_only }
      mergePriority: { type: integer, minimum: 0 }
      conditions: { type: object, additionalProperties: true }
      validUntil: { type: string, format: date-time }
      sourceTable: { type: string, maxLength: 191 }
      sourcePk: { type: string, maxLength: 255 }
      delegatedByPrincipalType: { type: string, enum: [user, agent, service, group] }
      delegatedByPrincipalId: { type: string, maxLength: 191 }
      delegatorResolutionId: { type: string, format: uuid }
      delegationRelationshipId: { type: string, format: uuid }
      approvedBy: { type: string, maxLength: 191 }
      metadata: { type: object, additionalProperties: true }

  OverrideRequest:
    type: object
    additionalProperties: false
    required: [capabilityEnvelopeId, originalResolutionId, targetContainerId, dimension, resourceType, resourceRef, operation, reason]
    properties:
      overrideId: { type: string, format: uuid }
      capabilityEnvelopeId: { type: string, format: uuid }
      originalResolutionId: { type: string, format: uuid }
      targetContainerId: { type: string, format: uuid }
      dimension: { type: string, maxLength: 191 }
      resourceType: { type: string, maxLength: 128 }
      resourceRef: { type: string, maxLength: 512, not: { const: '*' } }
      operation: { type: string, maxLength: 191, not: { const: '*' } }
      riskClass: { type: string, enum: [read_only, standard, high, critical, destructive, credential_touching, deployment_affecting] }
      reason: { type: string, minLength: 20, maxLength: 1000 }
      requestedTtlMinutes: { type: integer, minimum: 1, maximum: 60 }

  OverrideApprovalRequest:
    type: object
    additionalProperties: false
    required: [decision, decisionNote]
    properties:
      decision: { type: string, enum: [approved, rejected] }
      decisionNote: { type: string, minLength: 10, maxLength: 512 }

  ProjectionRequest:
    type: object
    additionalProperties: false
    properties:
      mode: { type: string, enum: [dry_run, apply], default: dry_run }

  MutationResponse:
    type: object
    additionalProperties: true
    required: [ok, secretsIncluded]
    properties:
      ok: { type: boolean, const: true }
      authorityEpoch: { type: integer, minimum: 0 }
      status: { type: string }
      idempotentReplay: { type: boolean }
      targetExecuted: { type: boolean, const: false }
      providerCallMade: { type: boolean, const: false }
      credentialPayloadRead: { type: boolean, const: false }
      secretsIncluded: { type: boolean, const: false }

  ShadowSamplerRequest:
    type: object
    additionalProperties: false
    properties:
      sampleCount: { type: integer, minimum: 1, maximum: 100, default: 100 }
      tenantId: { type: string, minLength: 1, maxLength: 36 }

  ShadowSamplerResponse:
    type: object
    additionalProperties: false
    required: [ok, runId, requestedSampleCount, completedSampleCount, distinctCandidateCount, repeatedRoundCount, evidence, providerCallMade, credentialPayloadRead, externalWriteMade, enforcementApplied, secretsIncluded]
    properties:
      ok: { type: boolean, const: true }
      runId: { type: string, format: uuid }
      requestedSampleCount: { type: integer, minimum: 1, maximum: 100 }
      completedSampleCount: { type: integer, minimum: 1, maximum: 100 }
      distinctCandidateCount: { type: integer, minimum: 1 }
      repeatedRoundCount: { type: integer, minimum: 0 }
      evidence:
        type: object
        additionalProperties: false
        required: [comparisonCount, matchCount, mismatchCount, notComparableCount, performanceSampleCount, withinBudgetCount]
        properties:
          comparisonCount: { type: integer, minimum: 0 }
          matchCount: { type: integer, minimum: 0 }
          mismatchCount: { type: integer, minimum: 0 }
          notComparableCount: { type: integer, minimum: 0 }
          maxLatencyMs: { type: number, minimum: 0 }
          avgLatencyMs: { type: number, minimum: 0 }
          performanceSampleCount: { type: integer, minimum: 0 }
          withinBudgetCount: { type: integer, minimum: 0 }
          maxDurationMs: { type: number, minimum: 0 }
          avgDurationMs: { type: number, minimum: 0 }
      providerCallMade: { type: boolean, const: false }
      credentialPayloadRead: { type: boolean, const: false }
      externalWriteMade: { type: boolean, const: false }
      enforcementApplied: { type: boolean, const: false }
      secretsIncluded: { type: boolean, const: false }

  CanaryPromotionRequest:
    type: object
    additionalProperties: false
    required: [mode, targetCanaryKey]
    properties:
      mode: { type: string, enum: [dry_run, apply], default: dry_run }
      targetCanaryKey: { type: string, minLength: 1, maxLength: 191 }
      confirm: { type: string, maxLength: 255 }
      capabilityEnvelopeId: { type: string, format: uuid }
    allOf:
      - if:
          properties: { mode: { const: apply } }
        then:
          required: [confirm, capabilityEnvelopeId]

  CanaryPromotionResponse:
    type: object
    additionalProperties: false
    required: [ok, mode, plan, providerCalls, credentialPayloadReads, externalWrites, enforcementApplied, secretsIncluded]
    properties:
      ok: { type: boolean, const: true }
      mode: { type: string, enum: [dry_run, apply] }
      plan:
        type: object
        additionalProperties: false
        required: [canaryKey, capabilityKey, currentMode, targetMode, noOp, confirmation, actions, providerCalls, credentialPayloadReads, externalWrites, secretsIncluded]
        properties:
          canaryKey: { type: string }
          capabilityKey: { type: string }
          currentMode: { type: string, enum: [shadow, read_only_canary] }
          targetMode: { type: string, const: read_only_canary }
          noOp: { type: boolean }
          confirmation: { type: string }
          actions: { type: array, items: { type: string } }
          providerCalls: { type: boolean, const: false }
          credentialPayloadReads: { type: boolean, const: false }
          externalWrites: { type: boolean, const: false }
          secretsIncluded: { type: boolean, const: false }
      readback:
        type: [object, 'null']
        additionalProperties: true
      capabilityEnvelope:
        type: [object, 'null']
        additionalProperties: false
        properties:
          envelopeId: { type: [string, 'null'], format: uuid }
          executionStatus: { type: [string, 'null'] }
      providerCalls: { type: boolean, const: false }
      credentialPayloadReads: { type: boolean, const: false }
      externalWrites: { type: boolean, const: false }
      enforcementApplied: { type: boolean, const: false }
      secretsIncluded: { type: boolean, const: false }

  CanaryCloseoutRequest:
    type: object
    additionalProperties: false
    required: [mode, targetCanaryKey]
    properties:
      mode: { type: string, enum: [dry_run, apply], default: dry_run }
      targetCanaryKey: { type: string, minLength: 1, maxLength: 191 }
      reason: { type: string, minLength: 3, maxLength: 512 }
      confirm: { type: string, maxLength: 255 }
      capabilityEnvelopeId: { type: string, format: uuid }
    allOf:
      - if:
          properties: { mode: { const: apply } }
        then:
          required: [confirm, capabilityEnvelopeId]

  CanaryCloseoutResponse:
    type: object
    additionalProperties: false
    required: [ok, mode, plan, providerCalls, credentialPayloadReads, externalWrites, enforcementApplied, secretsIncluded]
    properties:
      ok: { type: boolean, const: true }
      mode: { type: string, enum: [dry_run, apply] }
      plan:
        type: object
        additionalProperties: false
        required: [canaryKey, capabilityKey, currentMode, targetMode, closeoutStatus, reason, confirmation, evidence, actions, providerCalls, credentialPayloadReads, externalWrites, enforcementApplied, secretsIncluded]
        properties:
          canaryKey: { type: string }
          capabilityKey: { type: string }
          currentMode: { type: string, const: read_only_canary }
          targetMode: { type: string, const: shadow }
          closeoutStatus: { type: string, const: accepted }
          reason: { type: string }
          confirmation: { type: string }
          evidence:
            type: object
            additionalProperties: false
            required: [observationCount, successCount, failureCount, auditCoveragePercent, monitoringCode]
            properties:
              observationCount: { type: integer, minimum: 100 }
              successCount: { type: integer, minimum: 100 }
              failureCount: { type: integer, const: 0 }
              auditCoveragePercent: { type: number, const: 100 }
              monitoringCode: { type: string, const: ready_for_review }
          actions: { type: array, items: { type: string } }
          providerCalls: { type: boolean, const: false }
          credentialPayloadReads: { type: boolean, const: false }
          externalWrites: { type: boolean, const: false }
          enforcementApplied: { type: boolean, const: false }
          secretsIncluded: { type: boolean, const: false }
      readback:
        type: [object, 'null']
        additionalProperties: true
      capabilityEnvelope:
        type: [object, 'null']
        additionalProperties: false
        properties:
          envelopeId: { type: [string, 'null'], format: uuid }
          executionStatus: { type: [string, 'null'] }
      providerCalls: { type: boolean, const: false }
      credentialPayloadReads: { type: boolean, const: false }
      externalWrites: { type: boolean, const: false }
      enforcementApplied: { type: boolean, const: false }
      secretsIncluded: { type: boolean, const: false }

  CanaryRollbackRequest:
    type: object
    additionalProperties: false
    required: [mode, targetCanaryKey]
    properties:
      mode: { type: string, enum: [dry_run, apply], default: dry_run }
      targetCanaryKey: { type: string, minLength: 1, maxLength: 191 }
      reason: { type: string, minLength: 3, maxLength: 512 }
      confirm: { type: string, maxLength: 255 }
      capabilityEnvelopeId: { type: string, format: uuid }
    allOf:
      - if:
          properties: { mode: { const: apply } }
        then:
          required: [confirm, capabilityEnvelopeId]

  CanaryRollbackResponse:
    type: object
    additionalProperties: false
    required: [ok, mode, plan, providerCalls, credentialPayloadReads, externalWrites, enforcementApplied, secretsIncluded]
    properties:
      ok: { type: boolean, const: true }
      mode: { type: string, enum: [dry_run, apply] }
      plan:
        type: object
        additionalProperties: false
        required: [canaryKey, capabilityKey, currentMode, targetMode, reason, noOp, confirmation, actions, providerCalls, credentialPayloadReads, externalWrites, enforcementApplied, secretsIncluded]
        properties:
          canaryKey: { type: string }
          capabilityKey: { type: string }
          currentMode: { type: string, enum: [shadow, read_only_canary] }
          targetMode: { type: string, const: shadow }
          reason: { type: string }
          noOp: { type: boolean }
          confirmation: { type: string }
          actions: { type: array, items: { type: string } }
          providerCalls: { type: boolean, const: false }
          credentialPayloadReads: { type: boolean, const: false }
          externalWrites: { type: boolean, const: false }
          enforcementApplied: { type: boolean, const: false }
          secretsIncluded: { type: boolean, const: false }
      readback:
        type: [object, 'null']
        additionalProperties: true
      capabilityEnvelope:
        type: [object, 'null']
        additionalProperties: false
        properties:
          envelopeId: { type: [string, 'null'], format: uuid }
          executionStatus: { type: [string, 'null'] }
      providerCalls: { type: boolean, const: false }
      credentialPayloadReads: { type: boolean, const: false }
      externalWrites: { type: boolean, const: false }
      enforcementApplied: { type: boolean, const: false }
      secretsIncluded: { type: boolean, const: false }

  CanaryProbeSamplerRequest:
    type: object
    additionalProperties: false
    properties:
      sampleCount: { type: integer, minimum: 1, maximum: 100, default: 100 }
      targetCanaryKey:
        type: string
        enum: [container_authority_rollout_readiness_v1]
        default: container_authority_rollout_readiness_v1

  CanaryProbeSamplerResponse:
    type: object
    additionalProperties: false
    required: [ok, runId, targetCanaryKey, capabilityKey, requestedSampleCount, completedSampleCount, evidence, providerCalls, credentialPayloadReads, externalWrites, enforcementApplied, secretsIncluded]
    properties:
      ok: { type: boolean, const: true }
      runId: { type: string, format: uuid }
      targetCanaryKey: { type: string, const: container_authority_rollout_readiness_v1 }
      capabilityKey: { type: string, const: getContainerAuthorityRolloutReadiness }
      requestedSampleCount: { type: integer, minimum: 1, maximum: 100 }
      completedSampleCount: { type: integer, minimum: 1, maximum: 100 }
      evidence:
        type: object
        additionalProperties: false
        required: [observationCount, successCount, failureCount, averageLatencyMs, maximumLatencyMs, auditCoveragePercent, lastReadinessCode]
        properties:
          observationCount: { type: integer, minimum: 0 }
          successCount: { type: integer, minimum: 0 }
          failureCount: { type: integer, minimum: 0 }
          averageLatencyMs: { type: number, minimum: 0 }
          maximumLatencyMs: { type: number, minimum: 0 }
          auditCoveragePercent: { type: number, minimum: 0, maximum: 100 }
          lastReadinessCode: { type: [string, 'null'] }
      providerCalls: { type: boolean, const: false }
      credentialPayloadReads: { type: boolean, const: false }
      externalWrites: { type: boolean, const: false }
      enforcementApplied: { type: boolean, const: false }
      secretsIncluded: { type: boolean, const: false }

  PreviewCanaryProbeSamplerRequest:
    type: object
    additionalProperties: false
    properties:
      sampleCount: { type: integer, minimum: 1, maximum: 100, default: 100 }

  PreviewCanaryProbeSamplerResponse:
    type: object
    additionalProperties: false
    required: [ok, runId, targetCanaryKey, capabilityKey, requestedSampleCount, completedSampleCount, distinctCaseCount, evidence, providerCalls, credentialPayloadReads, externalWrites, enforcementApplied, secretsIncluded]
    properties:
      ok: { type: boolean, const: true }
      runId: { type: string, format: uuid }
      targetCanaryKey: { type: string, const: container_authority_preview_resolution_v1 }
      capabilityKey: { type: string, const: createContainerContextResolution }
      requestedSampleCount: { type: integer, minimum: 1, maximum: 100 }
      completedSampleCount: { type: integer, minimum: 1, maximum: 100 }
      distinctCaseCount: { type: integer, minimum: 1 }
      evidence:
        type: object
        additionalProperties: false
        required: [observationCount, successCount, failureCount, resolutionCount, allowCount, denyCount, restrictCount, ambiguousCount, averageLatencyMs, maximumLatencyMs, auditCoveragePercent]
        properties:
          observationCount: { type: integer, minimum: 0 }
          successCount: { type: integer, minimum: 0 }
          failureCount: { type: integer, minimum: 0 }
          resolutionCount: { type: integer, minimum: 0 }
          allowCount: { type: integer, minimum: 0 }
          denyCount: { type: integer, minimum: 0 }
          restrictCount: { type: integer, minimum: 0 }
          ambiguousCount: { type: integer, minimum: 0 }
          averageLatencyMs: { type: number, minimum: 0 }
          maximumLatencyMs: { type: number, minimum: 0 }
          auditCoveragePercent: { type: number, minimum: 0, maximum: 100 }
      providerCalls: { type: boolean, const: false }
      credentialPayloadReads: { type: boolean, const: false }
      externalWrites: { type: boolean, const: false }
      enforcementApplied: { type: boolean, const: false }
      secretsIncluded: { type: boolean, const: false }

  PlatformTopologyVerificationResponse:
    type: object
    additionalProperties: false
    required: [ok, verificationMode, verifiedAt, status, readinessCode, contract, summary, evidence, gaps, authorityGranted, providerCalls, credentialPayloadReads, externalWrites, secretsIncluded]
    properties:
      ok: { type: boolean, const: true }
      verificationMode: { type: string, const: read_only }
      verifiedAt: { type: string, format: date-time }
      status: { type: string, enum: [verified, gaps_detected] }
      readinessCode: { type: string, enum: [ready_for_review, topology_remediation_required] }
      contract:
        type: object
        additionalProperties: false
        required: [authorityScopeKey, adminWorkspaceKey, platformBrandTargetKey]
        properties:
          authorityScopeKey: { type: string, const: 'platform:root' }
          adminWorkspaceKey: { type: string, const: platform_admin_workspace }
          platformBrandTargetKey: { type: string, const: growth_intelligence_platform }
      summary: { type: object, additionalProperties: true }
      evidence: { type: object, additionalProperties: true }
      gaps:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [code, message, evidence]
          properties:
            code: { type: string }
            message: { type: string }
            evidence: { type: object, additionalProperties: true }
      authorityGranted: { type: boolean, const: false }
      providerCalls: { type: boolean, const: false }
      credentialPayloadReads: { type: boolean, const: false }
      externalWrites: { type: boolean, const: false }
      secretsIncluded: { type: boolean, const: false }

  ListResponse:
    type: object
    additionalProperties: false
    required: [ok, items, secretsIncluded]
    properties:
      ok: { type: boolean, const: true }
      items: { type: array, items: { type: object, additionalProperties: true } }
      page:
        type: object
        additionalProperties: false
        properties:
          nextCursor: { type: [string, 'null'] }
          hasMore: { type: boolean }
      secretsIncluded: { type: boolean, const: false }

  CoWorkspaceItem:
    type: object
    additionalProperties: false
    required: [containerId, tenantId, workspaceId, workspaceKey, displayName, effectiveRoleRank]
    properties:
      containerId: { type: string, format: uuid }
      tenantId: { type: string }
      workspaceId: { type: string }
      workspaceKey: { type: string }
      displayName: { type: string }
      workspaceType: { type: [string, 'null'] }
      bootstrapStatus: { type: [string, 'null'] }
      linkedBrandKey: { type: [string, 'null'] }
      effectiveRoleRank: { type: integer, minimum: 0 }

  CoWorkspaceListResponse:
    type: object
    additionalProperties: false
    required: [ok, items, page, secretsIncluded]
    properties:
      ok: { type: boolean, const: true }
      items:
        type: array
        items: { $ref: '#/schemas/CoWorkspaceItem' }
      page:
        type: object
        additionalProperties: false
        required: [nextCursor, hasMore]
        properties:
          nextCursor: { type: [string, 'null'] }
          hasMore: { type: boolean }
      secretsIncluded: { type: boolean, const: false }

  ContainerTeamMember:
    type: object
    additionalProperties: false
    required: [userId, roleTemplateKey, authorityRank, inheritanceMode, assignmentId, status]
    properties:
      userId: { type: string }
      email: { type: [string, 'null'], format: email }
      displayName: { type: [string, 'null'] }
      roleTemplateKey: { type: string, enum: [container_viewer, container_operator, container_admin] }
      roleDisplayName: { type: [string, 'null'] }
      authorityRank: { type: integer, minimum: 0 }
      inheritanceMode: { type: string, enum: [local_only, inherit_down] }
      validFrom: { type: [string, 'null'], format: date-time }
      validUntil: { type: [string, 'null'], format: date-time }
      assignmentId: { type: string, format: uuid }
      status: { type: string, enum: [active] }

  ContainerTeamResponse:
    type: object
    additionalProperties: false
    required: [ok, container, caller, members, count, page, secretsIncluded]
    properties:
      ok: { type: boolean, const: true }
      container:
        type: object
        additionalProperties: false
        required: [containerId, tenantId, containerType, containerKey, displayName]
        properties:
          containerId: { type: string, format: uuid }
          tenantId: { type: string }
          containerType: { type: string, enum: [workspace, brand] }
          containerKey: { type: string }
          canonicalSubjectRef: { type: [string, 'null'] }
          displayName: { type: string }
      caller:
        type: object
        additionalProperties: false
        required: [userId, effectiveRoleRank, canManage]
        properties:
          userId: { type: string }
          effectiveRoleRank: { type: integer, minimum: 0 }
          canManage: { type: boolean }
      members:
        type: array
        items: { $ref: '#/schemas/ContainerTeamMember' }
      count: { type: integer, minimum: 0 }
      page:
        type: object
        additionalProperties: false
        required: [nextCursor, hasMore]
        properties:
          nextCursor: { type: [string, 'null'] }
          hasMore: { type: boolean }
      secretsIncluded: { type: boolean, const: false }

  ContainerTeamMemberSetRequest:
    type: object
    additionalProperties: false
    properties:
      userId: { type: string, minLength: 1, maxLength: 36 }
      email: { type: string, format: email, maxLength: 255 }
      role:
        type: string
        enum: [viewer, member, editor, operator, owner, admin, container_viewer, container_operator, container_admin]
      roleTemplateKey:
        type: string
        enum: [container_viewer, container_operator, container_admin]
      inheritanceMode: { type: string, enum: [local_only, inherit_down], default: inherit_down }
      validUntil: { type: string, format: date-time }
      metadata: { type: object, additionalProperties: true }
    anyOf:
      - required: [userId]
      - required: [email]
    description: Workspace add may create or reactivate a least-privilege tenant membership for an existing user. Brand add requires an existing active workspace or tenant membership.

  ContainerTeamMemberUpdateRequest:
    type: object
    additionalProperties: false
    properties:
      role:
        type: string
        enum: [viewer, member, editor, operator, owner, admin, container_viewer, container_operator, container_admin]
      roleTemplateKey:
        type: string
        enum: [container_viewer, container_operator, container_admin]
      inheritanceMode: { type: string, enum: [local_only, inherit_down] }
      validUntil: { type: string, format: date-time }
      metadata: { type: object, additionalProperties: true }
    anyOf:
      - required: [role]
      - required: [roleTemplateKey]
      - required: [inheritanceMode]
      - required: [validUntil]
      - required: [metadata]

  ContainerTeamMutationResponse:
    type: object
    additionalProperties: true
    required: [ok, tenantId, containerId, containerType, status, authorityEpoch, secretsIncluded]
    properties:
      ok: { type: boolean, const: true }
      assignmentId: { type: string, format: uuid }
      userId: { type: string }
      email: { type: [string, 'null'], format: email }
      displayName: { type: [string, 'null'] }
      tenantId: { type: string }
      containerId: { type: string, format: uuid }
      containerType: { type: string, enum: [workspace, brand] }
      roleTemplateKey: { type: string, enum: [container_viewer, container_operator, container_admin] }
      authorityRank: { type: integer, minimum: 0 }
      inheritanceMode: { type: string, enum: [local_only, inherit_down] }
      status: { type: string, enum: [active, revoked] }
      authorityEpoch: { type: integer, minimum: 0 }
      idempotentReplay: { type: boolean }
      tenantMembership: { type: object, additionalProperties: true }
      revokedAssignments: { type: integer, minimum: 0 }
      secretsIncluded: { type: boolean, const: false }

parameters:
  IdempotencyKey:
    name: Idempotency-Key
    in: header
    required: true
    schema: { type: string, minLength: 8, maxLength: 128 }
    description: Replays the prior response for an identical request and rejects reuse with different input.
  IfMatch:
    name: If-Match
    in: header
    required: false
    schema: { type: string, example: 'W/"authority-7"' }
    description: Optional optimistic authority-epoch precondition.
  ResolutionId:
    name: resolutionId
    in: path
    required: true
    schema: { type: string, format: uuid }
  OverrideId:
    name: overrideId
    in: path
    required: true
    schema: { type: string, format: uuid }

responses:
  BadRequest:
    description: Invalid request shape, unsupported field, or invalid idempotency key.
    content: { application/json: { schema: { $ref: '#/schemas/ErrorResponse' } } }
  Unauthorized:
    description: Authentication is missing or invalid.
    content: { application/json: { schema: { $ref: '#/schemas/ErrorResponse' } } }
  Forbidden:
    description: The authenticated principal is not authorized for this operation.
    content: { application/json: { schema: { $ref: '#/schemas/ErrorResponse' } } }
  NotFound:
    description: Container authority resource was not found.
    content: { application/json: { schema: { $ref: '#/schemas/ErrorResponse' } } }
  Conflict:
    description: Authority epoch, idempotency state, approval, or override snapshot conflict.
    content: { application/json: { schema: { $ref: '#/schemas/ErrorResponse' } } }
  Unprocessable:
    description: The request is structurally valid but violates an authority invariant.
    content: { application/json: { schema: { $ref: '#/schemas/ErrorResponse' } } }
  RateLimited:
    description: Preview rate limit exceeded. Details include retryAfterSeconds.
    headers:
      Retry-After: { schema: { type: integer, minimum: 1 } }
    content: { application/json: { schema: { $ref: '#/schemas/ErrorResponse' } } }
  InternalError:
    description: Unexpected container authority failure. No stack trace or secret is returned.
    content: { application/json: { schema: { $ref: '#/schemas/ErrorResponse' } } }
  ServiceUnavailable:
    description: Temporary container projection dependency failure.
    content: { application/json: { schema: { $ref: '#/schemas/ErrorResponse' } } }

containerContextResolutions:
  post:
    tags: [container-authority]
    operationId: createContainerContextResolution
    summary: Preview or shadow-resolve effective container authority
    description: Resolves every bounded containment path, classifications, roles, bindings, denies, sharing, and delegations. Tenant JWT callers are forced to preview mode. No provider client is created and no credential payload is read.
    security:
      - backendBearerAuth: []
      - backendApiKeyAuth: []
    parameters:
      - { $ref: '#/parameters/IdempotencyKey' }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/schemas/ResolutionRequest' }
          example:
            targetContainerId: 4d6fa7d2-28a5-4bc8-a09c-2ef0047e648d
            mode: preview
            dimensionRequests:
              - dimension: assets
                resourceType: asset
                resourceRef: article-42
                operation: read.asset
    responses:
      '201': { description: Immutable effective-context resolution, content: { application/json: { schema: { $ref: '#/schemas/ResolutionResponse' } } } }
      '400': { $ref: '#/responses/BadRequest' }
      '401': { $ref: '#/responses/Unauthorized' }
      '403': { $ref: '#/responses/Forbidden' }
      '404': { $ref: '#/responses/NotFound' }
      '409': { $ref: '#/responses/Conflict' }
      '422': { $ref: '#/responses/Unprocessable' }
      '429': { $ref: '#/responses/RateLimited' }
      '500': { $ref: '#/responses/InternalError' }

adminContainerResolutionPreview:
  post:
    tags: [container-authority, admin-control]
    operationId: previewAdminContainerAuthorityResolution
    summary: Preview effective Dynamic Container authority through an Admin tool-safe body contract
    description: Forces preview mode and accepts idempotencyKey in the JSON body for governed tool dispatch. It writes immutable internal evidence only and never enables enforcement, calls providers, reads credential payloads, or performs external writes.
    x-registry-exposure: admin_tool
    x-registry-tool-key: dynamic_container_resolution_preview
    x-openai-isConsequential: true
    security: [{ adminBearerAuth: [] }, { backendApiKeyAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [tenantId, targetContainerId, dimensionRequests, idempotencyKey]
            properties:
              principal: { $ref: '#/schemas/Principal' }
              tenantId: { type: string, minLength: 1, maxLength: 36 }
              targetContainerId: { type: string, minLength: 1, maxLength: 36 }
              dimensionRequests:
                type: array
                minItems: 1
                maxItems: 50
                items: { $ref: '#/schemas/DimensionRequest' }
              expectedAuthorityEpoch: { type: integer, minimum: 0 }
              expectedRegistrySnapshotHash: { type: string, pattern: '^[a-f0-9]{64}$' }
              legacyDecision: { type: string, maxLength: 64 }
              legacyEvidenceRef: { type: string, maxLength: 512 }
              requestId: { type: string, maxLength: 191 }
              idempotencyKey: { type: string, minLength: 8, maxLength: 128 }
          example:
            tenantId: 00000000-0000-0000-0000-000000000000
            targetContainerId: 4d6fa7d2-28a5-4bc8-a09c-2ef0047e648d
            idempotencyKey: preview-container-authority-001
            dimensionRequests:
              - dimension: assets
                resourceType: asset
                resourceRef: article-42
                operation: read.asset
    responses:
      '201': { description: Immutable preview resolution evidence, content: { application/json: { schema: { $ref: '#/schemas/ResolutionResponse' } } } }
      '400': { $ref: '#/responses/BadRequest' }
      '401': { $ref: '#/responses/Unauthorized' }
      '403': { $ref: '#/responses/Forbidden' }
      '404': { $ref: '#/responses/NotFound' }
      '409': { $ref: '#/responses/Conflict' }
      '422': { $ref: '#/responses/Unprocessable' }
      '429': { $ref: '#/responses/RateLimited' }
      '500': { $ref: '#/responses/InternalError' }

containerContextResolutionById:
  get:
    tags: [container-authority]
    operationId: getContainerContextResolution
