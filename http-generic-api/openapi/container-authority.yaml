    security: [{ userJwtAuth: [] }]
    parameters:
      - name: workspaceId
        in: path
        required: true
        description: Workspace container ID, workspace ID, workspace key, or canonical subject reference.
        schema: { type: string, minLength: 1, maxLength: 191 }
    responses:
      '200': { description: Direct workspace team and caller management capability, content: { application/json: { schema: { $ref: '#/schemas/ContainerTeamResponse' } } } }
