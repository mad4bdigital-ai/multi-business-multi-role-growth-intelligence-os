      '404': { $ref: '#/responses/NotFound' }
      '409': { $ref: '#/responses/Conflict' }
      '500': { $ref: '#/responses/InternalError' }

workspaceTeamMembers:
  post:
    tags: [container-authority]
    operationId: addWorkspaceContainerTeamMember
    summary: Add an existing user to a workspace container team
    description: Requires effective container_admin authority. The service may create or reactivate a least-privilege tenant membership, then creates a direct container role assignment and advances the authority epoch.
    security: [{ userJwtAuth: [] }]
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 191 }
      - { $ref: '#/parameters/IdempotencyKey' }
      - { $ref: '#/parameters/IfMatch' }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/schemas/ContainerTeamMemberSetRequest' }
          example: { email: teammate@example.com, role: editor, inheritanceMode: inherit_down }
    responses:
      '200': { description: Idempotent replay of an existing member mutation, content: { application/json: { schema: { $ref: '#/schemas/ContainerTeamMutationResponse' } } } }
      '201': { description: Workspace team member added, content: { application/json: { schema: { $ref: '#/schemas/ContainerTeamMutationResponse' } } } }
      '400': { $ref: '#/responses/BadRequest' }
      '401': { $ref: '#/responses/Unauthorized' }
      '403': { $ref: '#/responses/Forbidden' }
      '404': { $ref: '#/responses/NotFound' }
      '409': { $ref: '#/responses/Conflict' }
      '422': { $ref: '#/responses/Unprocessable' }
      '500': { $ref: '#/responses/InternalError' }

workspaceTeamMemberById:
  patch:
    tags: [container-authority]
    operationId: updateWorkspaceContainerTeamMember
    summary: Update one direct workspace team assignment
    description: Omitted fields retain their current values. Demoting the last effective container administrator is blocked.
    security: [{ userJwtAuth: [] }]
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 191 }
      - name: userId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 36 }
      - { $ref: '#/parameters/IfMatch' }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/schemas/ContainerTeamMemberUpdateRequest' }
          example: { roleTemplateKey: container_operator }
    responses:
      '200': { description: Workspace team assignment updated, content: { application/json: { schema: { $ref: '#/schemas/ContainerTeamMutationResponse' } } } }
      '400': { $ref: '#/responses/BadRequest' }
      '401': { $ref: '#/responses/Unauthorized' }
      '403': { $ref: '#/responses/Forbidden' }
      '404': { $ref: '#/responses/NotFound' }
      '409': { $ref: '#/responses/Conflict' }
      '422': { $ref: '#/responses/Unprocessable' }
      '500': { $ref: '#/responses/InternalError' }
  delete:
    tags: [container-authority]
    operationId: removeWorkspaceContainerTeamMember
    summary: Revoke one direct workspace team assignment
    description: Tenant membership remains active so the user can continue participating in other co-workspaces. Removing the last effective container administrator is blocked.
    security: [{ userJwtAuth: [] }]
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 191 }
      - name: userId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 36 }
      - { $ref: '#/parameters/IfMatch' }
    responses:
      '200': { description: Workspace team assignment revoked, content: { application/json: { schema: { $ref: '#/schemas/ContainerTeamMutationResponse' } } } }
      '400': { $ref: '#/responses/BadRequest' }
      '401': { $ref: '#/responses/Unauthorized' }
      '403': { $ref: '#/responses/Forbidden' }
      '404': { $ref: '#/responses/NotFound' }
      '409': { $ref: '#/responses/Conflict' }
      '500': { $ref: '#/responses/InternalError' }

