    security: [{ userJwtAuth: [] }]
    parameters:
      - name: limit
        in: query
        required: false
        schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      - name: cursor
        in: query
        required: false
        schema: { type: string }
    responses:
      '200': { description: Cursor-paginated co-workspaces, content: { application/json: { schema: { $ref: '#/schemas/CoWorkspaceListResponse' } } } }
      '400': { $ref: '#/responses/BadRequest' }
      '401': { $ref: '#/responses/Unauthorized' }
      '500': { $ref: '#/responses/InternalError' }

workspaceTeam:
  get:
    tags: [container-authority]
    operationId: getWorkspaceContainerTeam
