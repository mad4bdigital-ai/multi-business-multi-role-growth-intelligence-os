      '409': { $ref: '#/responses/Conflict' }
      '422': { $ref: '#/responses/Unprocessable' }
      '500': { $ref: '#/responses/InternalError' }

brandTeamMemberById:
  patch:
    tags: [container-authority]
    operationId: updateBrandContainerTeamMember
    summary: Update one direct brand team assignment
    description: Omitted fields retain their current values. The target identity is read only from the userId path parameter.
    security: [{ userJwtAuth: [] }]
    parameters:
      - name: brandRef
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 255 }
      - name: userId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 36 }
      - { $ref: '#/parameters/IfMatch' }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/schemas/ContainerTeamMemberUpdateRequest' }
          example: { inheritanceMode: local_only }
    responses:
      '200': { description: Brand team assignment updated, content: { application/json: { schema: { $ref: '#/schemas/ContainerTeamMutationResponse' } } } }
      '400': { $ref: '#/responses/BadRequest' }
      '401': { $ref: '#/responses/Unauthorized' }
      '403': { $ref: '#/responses/Forbidden' }
      '404': { $ref: '#/responses/NotFound' }
      '409': { $ref: '#/responses/Conflict' }
      '422': { $ref: '#/responses/Unprocessable' }
      '500': { $ref: '#/responses/InternalError' }
  delete:
    tags: [container-authority]
    operationId: removeBrandContainerTeamMember
