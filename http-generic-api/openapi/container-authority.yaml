    parameters:
      - name: limit
        in: query
        required: false
        schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
    responses:
      '200': { description: Shadow comparison summary, content: { application/json: { schema: { $ref: '#/schemas/ListResponse' } } } }
      '401': { $ref: '#/responses/Unauthorized' }
      '403': { $ref: '#/responses/Forbidden' }
      '500': { $ref: '#/responses/InternalError' }

