openapi: 3.1.0
info:
  title: Growth Intelligence Platform - Tenant Core Actions
  version: 3.0.0-platform
  summary: Tenant resources, dashboard, session, plugin, and SQL-driven MCP facades without Activation routes.
  description: Tenant Core transport. Tenant identity is derived from OAuth JWT. Use listTools then callTool for SQL-registered tools such as connect_activate, passing mode and integration_modes through tool_args.
servers:
  - url: https://auth.mad4b.com
    description: tenant_core surface
tags:
  - name: resource-api
    description: Governed logical resources, safe projections, lifecycle operations, changes, revisions, permissions, and readback.
  - name: activation
    description: Once-per-session activation probes, session history, and scope context.
  - name: growth-dashboard
    description: Tenant-scoped growth cockpit, guidance, preferences, previews, and recommendation feedback.
  - name: system-layer
    description: MCP-style governed system layer backed by connector registries, principal context, and runtime validation.
  - name: platform-plugins
    description: Tenant-facing and admin-governed Platform Plugin catalog, install, resolve, contribution, and promotion surfaces.
  - name: local-connector
  - name: session-archive
components:
  securitySchemes:
    userBearerAuth:
      type: oauth2
      description: Tenant GPT OAuth. ChatGPT signs in through the Growth Intelligence Platform popup, then /auth/oauth/token mints a fresh Mad4B tenant access JWT with issuer, audience, subject, scope, user_id, and tenant_id claims. Google Sign-In is only an upstream identity proof inside the popup; do not call OAuth.
      flows:
        authorizationCode:
          authorizationUrl: https://auth.mad4b.com/auth/oauth/authorize
          tokenUrl: https://auth.mad4b.com/auth/oauth/token
          scopes:
            https://auth.mad4b.com/scopes/tenant.links: Access tenant-scoped Growth Intelligence links for the signed-in user.
            https://auth.mad4b.com/scopes/tenant.status: Read tenant connection status for the signed-in user.
            https://auth.mad4b.com/scopes/tenant.activation: Activate managed or dedicated tenant connection mode for the signed-in user.
            https://auth.mad4b.com/scopes/tenant.install: Provision tenant local connector install bundles for the signed-in user.
            https://auth.mad4b.com/scopes/tenant.system-tools: Use tenant-scoped governed system tools for the signed-in user.
  schemas:
    SecurityDecisionTraceEventPublic:
      type: object
      additionalProperties: false
      required:
        - type
        - gate_key
        - required
        - state
        - evaluated
      properties:
        type:
          type: string
          enum:
            - gate_evaluated
        gate_key:
          type: string
        required:
          type: boolean
        state:
          type: string
          enum:
            - pass
            - deny
            - not_applicable
            - not_evaluated
        evaluated:
          type: boolean
    SecurityDecisionTracePublic:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - outcome
        - allowed
        - dispatch_ready
        - will_execute
        - execution_mode
        - approval_required
        - denied_gate_count
        - unevaluated_required_gate_count
        - gate_events
        - secrets_included
      properties:
        schema_version:
          type: string
          enum:
            - security_decision_trace.v1
        trace_id:
          type: string
          nullable: true
        outcome:
          type: string
          enum:
            - allow
            - deny
        allowed:
          type: boolean
        dispatch_ready:
          type: boolean
        will_execute:
          type: boolean
        execution_mode:
          type: string
          enum:
            - preview
            - dispatch
        approval_required:
          type: boolean
        denied_gate_count:
          type: integer
          minimum: 0
        unevaluated_required_gate_count:
          type: integer
          minimum: 0
        gate_events:
          type: array
          items:
            $ref: "#/components/schemas/SecurityDecisionTraceEventPublic"
        secrets_included:
          type: boolean
          enum:
            - false
    SecurityDecisionMetrics:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - allowed
        - dispatch_ready
        - will_execute
        - denied_gate_count
        - unevaluated_required_gate_count
        - invariant_violation_count
        - violated_invariants
        - alert_level
        - secrets_included
      properties:
        schema_version:
          type: string
          enum:
            - security_decision_metrics.v1
        decision_outcome:
          type: string
          nullable: true
          enum:
            - allow
            - deny
        allowed:
          type: boolean
        dispatch_ready:
          type: boolean
        will_execute:
          type: boolean
        denied_gate_count:
          type: integer
          minimum: 0
        unevaluated_required_gate_count:
          type: integer
          minimum: 0
        invariant_violation_count:
          type: integer
          minimum: 0
        violated_invariants:
          type: array
          items:
            type: string
        alert_level:
          type: string
          enum:
            - none
            - warning
            - critical
        secrets_included:
          type: boolean
          enum:
            - false
    ErrorObject:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        status:
          type: integer
        details:
          oneOf:
            - type: object
              additionalProperties: true
              properties: {}
            - type: "null"
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - error
      properties:
        ok:
          type: boolean
          enum:
            - false
        error:
          $ref: "#/components/schemas/ErrorObject"
        execution_guardrail:
          type: boolean
    GrowthDataStatus:
      type: object
      additionalProperties: false
      required:
        - freshness
        - source_system
        - source_scope
        - confidence
        - partial_data
      properties:
        freshness:
          type: string
          enum:
            - fresh
            - stale
            - unknown
            - failed
        observed_at:
          type:
            - string
            - "null"
          format: date-time
        source_system:
          type: string
        source_scope:
          type: string
          enum:
            - tenant_authorized
        confidence:
          type: number
          minimum: 0
          maximum: 1
        partial_data:
          type: boolean
    GrowthDashboardAction:
      type: object
      additionalProperties: true
      required:
        - action_ref_key
        - label
        - ready
        - requires_confirmation
      properties:
        action_ref_key:
          type: string
        label:
          type: string
        mode:
          type: string
          enum:
            - read_only
            - advisory
            - draft_only
            - write_requires_confirmation
        ready:
          type: boolean
        requires_confirmation:
          type: boolean
        required_capability_key:
          type:
            - string
            - "null"
        runtime_action_key:
          type:
            - string
            - "null"
        blocked_reason:
          type:
            - string
            - "null"
        expected_impact_metric_key:
          type:
            - string
            - "null"
    GrowthDashboardCard:
      type: object
      additionalProperties: true
      required:
        - card_id
        - card_type
        - title
        - status
        - tab_key
        - data_status
      properties:
        card_id:
          type: string
        card_type:
          type: string
          enum:
            - kpi
            - trend
            - score
            - funnel
            - alert
            - recommendation
            - task
            - list
            - calendar
            - campaign
            - content_opportunity
            - lead_opportunity
            - connector_status
            - progress
            - comparison
            - status
        title:
          type: string
        value: {}
        unit:
          type:
            - string
            - "null"
        status:
          type: string
        change: {}
        metric_key:
          type:
            - string
            - "null"
        interpretation:
          type: string
        tab_key:
          type: string
        actions:
          type: array
          items:
            $ref: "#/components/schemas/GrowthDashboardAction"
        data_status:
          $ref: "#/components/schemas/GrowthDataStatus"
        details_ref:
          type:
            - object
            - "null"
          additionalProperties: true
    GrowthDashboardPreferences:
      type: object
      additionalProperties: false
      properties:
        active_container_key:
          type:
            - string
            - "null"
        active_tab_key:
          type:
            - string
            - "null"
        pinned_tabs:
          type: array
          items:
            type: string
        hidden_tabs:
          type: array
          items:
            type: string
        preferred_date_range:
          type: string
          default: last_30_days
        saved_filters:
          type: object
          additionalProperties: true
          properties: {}
        dismissed_alerts:
          type: array
          items:
            type: string
        favorite_metrics:
          type: array
          items:
            type: string
        dashboard_density:
          type: string
          enum:
            - compact
            - comfortable
            - detailed
        language:
          type:
            - string
            - "null"
        currency:
          type:
            - string
            - "null"
        timezone:
          type:
            - string
            - "null"
        notification_preferences:
          type: object
          additionalProperties: true
          properties: {}
    GrowthDashboardResponse:
      type: object
      additionalProperties: true
      required:
        - ok
        - product_layer
        - subject
        - navigation
        - cards
        - growth_guidance
        - next_best_actions
        - secrets_included
      properties:
        ok:
          type: boolean
        product_layer:
          type: string
          enum:
            - tenant_growth_dashboard
        product_version:
          type: string
        subject:
          type: object
          additionalProperties: false
          required:
            - tenant_id
            - user_id
            - scope
          properties:
            tenant_id:
              type: string
            user_id:
              type: string
            scope:
              type: string
              enum:
                - tenant_user
        active_container:
          type:
            - object
            - "null"
          additionalProperties: true
        available_containers:
          type: array
          items:
            type: object
            additionalProperties: true
            properties: {}
        business_context:
          type: object
          additionalProperties: true
          properties: {}
        dashboard_state:
          type: object
          additionalProperties: true
          properties: {}
        navigation:
          type: object
          additionalProperties: true
          properties: {}
        today:
          type: object
          additionalProperties: true
          properties: {}
        cards:
          type: array
          items:
            $ref: "#/components/schemas/GrowthDashboardCard"
        growth_guidance:
          type: object
          additionalProperties: true
          properties: {}
        next_best_actions:
          type: array
          maxItems: 3
          items:
            type: object
            additionalProperties: true
            properties: {}
        available_actions:
          type: array
          items:
            $ref: "#/components/schemas/GrowthDashboardAction"
        assistant_guidance:
          type: object
          additionalProperties: true
          properties: {}
        quick_commands:
          type: array
          items:
            type: string
        degraded_surfaces:
          type: array
          items:
            type: object
            additionalProperties: true
            properties: {}
        secrets_included:
          type: boolean
          enum:
            - false
  responses:
    BadRequest:
      description: Invalid request body or missing required field
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Invalid or missing backend API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
