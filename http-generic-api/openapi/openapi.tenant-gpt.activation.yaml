                    enum:
                      - tenant_task_source_repair_apply_gate
                  changed:
                    type: boolean
                    enum:
                      - true
                  case:
                    type: object
                    additionalProperties: false
                    required:
                      - case_id
                      - tenant_id
                      - status
                      - current_step_key
                      - readback_status
                      - secrets_included
                    properties:
                      case_id:
                        type: string
                      tenant_id:
                        type: string
                      workspace_id:
                        type:
                          - string
                          - "null"
                      status:
                        type: string
                        enum:
                          - verifying
                      current_step_key:
                        type: string
                        enum:
                          - task_source_repair_verifying
                      readback_status:
                        type: string
                        enum:
                          - not_run
                      secrets_included:
                        type: boolean
                        enum:
                          - false
                  task:
                    type: object
                    additionalProperties: false
                    required:
                      - task_id
                      - task_key
                      - title
                      - source_surface
                      - source_ref
                      - secrets_included
                    properties:
                      task_id:
