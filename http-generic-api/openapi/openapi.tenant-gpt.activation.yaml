      description: Applies one approved, no-drift Task Source Repair preview to a tenant-owned pending task, performs same-cycle field readback, consumes the capability envelope, and moves the case only to verifying. Provider calls, external writes, task-id changes, tenant-scope changes, resolved transitions, and sec.
