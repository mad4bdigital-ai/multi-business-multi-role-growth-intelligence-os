                        enum:
                          - false
                      external_write_allowed:
                        type: boolean
                        enum:
                          - false
                      resolved_transition_allowed:
                        type: boolean
                        enum:
                          - false
                      secrets_included:
                        type: boolean
                        enum:
                          - false
