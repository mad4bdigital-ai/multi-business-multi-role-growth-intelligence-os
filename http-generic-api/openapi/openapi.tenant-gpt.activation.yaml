                - approval_hold_id
                - confirm
              properties:
                workspace_id:
                  type: string
                  maxLength: 64
                preview_fingerprint_sha256:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                capability_envelope_id:
                  type: string
                  maxLength: 64
                approval_hold_id:
                  type: string
                  maxLength: 64
                confirm:
                  type: string
                  maxLength: 80
                  description: APPLY_TASK_SOURCE_REPAIR_ followed by the uppercase first 12 characters of the preview fingerprint.
