                      source_surface:
                        type: string
                      source_ref:
                        type: string
                      secrets_included:
                        type: boolean
                        enum:
                          - false
                  apply:
                    type: object
                    additionalProperties: true
                    properties:
                      phase:
                        type: string
                        enum:
                          - applied_pending_verification
                      applied_at:
                        type: string
                        format: date-time
                      preview_fingerprint_sha256:
                        type: string
                        pattern: ^[a-f0-9]{64}$
                      capability_envelope_id:
                        type: string
                      approval_hold_id:
                        type: string
                      task_id:
                        type: string
                      changed_fields:
                        type: array
