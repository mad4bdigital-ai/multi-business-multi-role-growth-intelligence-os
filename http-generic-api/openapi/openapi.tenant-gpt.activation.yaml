                        enum:
                          - false
                      external_write_allowed:
                        type: boolean
                        enum:
                          - false
                      resolved_transition_allowed:
                        type: boolean
                        enum:
                          - false
                      lifecycle_readback_required:
                        type: boolean
                        enum:
                          - true
                      secrets_included:
                        type: boolean
                        enum:
                          - false
