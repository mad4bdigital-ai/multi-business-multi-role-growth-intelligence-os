openapi: 3.1.0
info:
  title: Growth Control Plane Admin API
  version: 0.1.0
  description: >-
    Canonical Admin-only contracts for schema-driven configuration definitions,
    immutable draft versions, deterministic resolution evidence, Activity Packs,
    and brand activity bindings. All mutation endpoints create draft/internal state
    only and perform no provider call, external send, runtime activation, or production deployment.
servers:
  - url: https://auth.mad4b.com
tags:
  - name: growth-control-plane
    description: Admin-governed Growth Control Plane configuration and Activity Pack resources.
security:
  - adminBearerAuth: []
  - backendApiKeyAuth: []

paths:
  /admin/control-plane/configurations:
    get:
      tags: [growth-control-plane]
      operationId: listGrowthControlConfigurations
      summary: List configuration definitions
      description: Returns canonical configuration definitions using opaque cursor pagination.
      x-contract-completeness: canonical
      parameters:
        - $ref: '#/components/parameters/GrowthControlLimit'
        - $ref: '#/components/parameters/GrowthControlCursor'
      responses:
        '200':
          description: Paginated configuration definitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationDefinitionListResponse'
              examples:
                empty:
                  value:
                    items: []
                    page: { nextCursor: null, hasMore: false }
                    secretsIncluded: false
        '400': { $ref: '#/components/responses/GrowthControlBadRequest' }
        '401': { $ref: '#/components/responses/GrowthControlUnauthorized' }
        '403': { $ref: '#/components/responses/GrowthControlForbidden' }
        '500': { $ref: '#/components/responses/GrowthControlInternalError' }
    post:
      tags: [growth-control-plane]
      operationId: createGrowthControlConfigurationDefinition
      summary: Create a draft configuration definition
      description: Creates one schema-governed draft definition. Secret-like fields are rejected.
      x-contract-completeness: canonical
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationDefinitionCreateRequest'
            examples:
              executionPolicy:
                value:
                  configKey: growth.execution.policy
                  schemaVersion: 1
                  schema:
                    type: object
                    additionalProperties: false
                    required: [approvalRequired, maxResources]
                    properties:
                      approvalRequired: { type: boolean }
                      maxResources: { type: integer, minimum: 1, maximum: 100 }
                  defaultValues:
                    approvalRequired: true
                    maxResources: 10
                  allowedScopes: [platform, tenant, workspace, brand]
                  mergeProfile:
                    approvalRequired: deny_wins
                    maxResources: minimum
                  securityClassification: security_control
      responses:
        '201':
          description: Draft configuration definition created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationDefinition'
        '400': { $ref: '#/components/responses/GrowthControlBadRequest' }
        '401': { $ref: '#/components/responses/GrowthControlUnauthorized' }
        '403': { $ref: '#/components/responses/GrowthControlForbidden' }
        '422': { $ref: '#/components/responses/GrowthControlUnprocessable' }
        '500': { $ref: '#/components/responses/GrowthControlInternalError' }

  /admin/control-plane/configurations/{configKey}/versions:
    post:
      tags: [growth-control-plane]
      operationId: createGrowthControlConfigurationVersion
      summary: Create an immutable draft configuration version
      description: Creates an idempotent draft version at one validated scope with optimistic revision control.
      x-contract-completeness: canonical
      parameters:
        - $ref: '#/components/parameters/ConfigKeyPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationVersionCreateRequest'
            examples:
              brandDraft:
                value:
                  scope:
                    scopeType: brand
                    tenantId: 11111111-1111-4111-8111-111111111111
                    workspaceId: 22222222-2222-4222-8222-222222222222
                    brandKey: example-brand
                  values:
                    approvalRequired: true
                    maxResources: 5
                  expectedRevision: 0
      responses:
        '201':
          description: Immutable draft version created or returned from idempotent readback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationVersion'
        '400': { $ref: '#/components/responses/GrowthControlBadRequest' }
        '401': { $ref: '#/components/responses/GrowthControlUnauthorized' }
        '403': { $ref: '#/components/responses/GrowthControlForbidden' }
        '404': { $ref: '#/components/responses/GrowthControlNotFound' }
        '409': { $ref: '#/components/responses/GrowthControlConflict' }
        '422': { $ref: '#/components/responses/GrowthControlUnprocessable' }
        '500': { $ref: '#/components/responses/GrowthControlInternalError' }

  /admin/control-plane/configurations/{configKey}/resolve:
    post:
      tags: [growth-control-plane]
      operationId: resolveGrowthControlConfiguration
      summary: Resolve effective configuration and record evidence
      description: >-
        Resolves defaults and ready/active versions through the canonical scope hierarchy.
        Explicit draft version IDs may be included for Admin preview. The operation records an
        immutable resolution snapshot and performs no provider or external write.
      x-contract-completeness: canonical
      parameters:
        - $ref: '#/components/parameters/ConfigKeyPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationResolveRequest'
            examples:
              brandPreview:
                value:
                  context:
                    tenantId: 11111111-1111-4111-8111-111111111111
                    workspaceId: 22222222-2222-4222-8222-222222222222
                    brandKey: example-brand
                    activityTypeKey: travel
                  includeDraftVersionIds:
                    - 33333333-3333-4333-8333-333333333333
      responses:
        '201':
          description: Deterministic resolution evidence recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationResolution'
        '400': { $ref: '#/components/responses/GrowthControlBadRequest' }
        '401': { $ref: '#/components/responses/GrowthControlUnauthorized' }
        '403': { $ref: '#/components/responses/GrowthControlForbidden' }
        '404': { $ref: '#/components/responses/GrowthControlNotFound' }
        '422': { $ref: '#/components/responses/GrowthControlUnprocessable' }
        '500': { $ref: '#/components/responses/GrowthControlInternalError' }

  /admin/control-plane/configurations/{configKey}/versions/{configVersionId}/validations:
    post:
      tags: [growth-control-plane]
      operationId: validateGrowthControlConfigurationVersion
      summary: Validate a draft configuration version
      description: Revalidates the immutable draft against the active definition schema and moves it to ready without provider or external effects.
      x-contract-completeness: canonical
      parameters:
        - $ref: '#/components/parameters/ConfigKeyPath'
        - $ref: '#/components/parameters/ConfigVersionIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LifecycleValidationRequest' }
            examples:
              validateDraft:
                value: { expectedRevision: 1 }
      responses:
        '200':
          description: Configuration version validated and marked ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigurationVersion' }
        '400': { $ref: '#/components/responses/GrowthControlBadRequest' }
        '401': { $ref: '#/components/responses/GrowthControlUnauthorized' }
        '403': { $ref: '#/components/responses/GrowthControlForbidden' }
        '404': { $ref: '#/components/responses/GrowthControlNotFound' }
        '409': { $ref: '#/components/responses/GrowthControlConflict' }
        '422': { $ref: '#/components/responses/GrowthControlUnprocessable' }
        '500': { $ref: '#/components/responses/GrowthControlInternalError' }

  /admin/control-plane/configurations/{configKey}/versions/{configVersionId}/approval-holds:
    post:
      tags: [growth-control-plane]
      operationId: createGrowthControlConfigurationLifecycleApprovalHold
      summary: Create a plan-bound lifecycle approval hold
      description: Creates an expiring typed hold bound to the exact operation, version, scope, checksum, and revision. It does not approve or execute the operation.
      x-contract-completeness: canonical
      parameters:
        - $ref: '#/components/parameters/ConfigKeyPath'
        - $ref: '#/components/parameters/ConfigVersionIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LifecycleApprovalHoldRequest' }
            examples:
              activationHold:
                value:
                  operation: activate
                  expiresInMinutes: 30
      responses:
        '201':
          description: Open lifecycle approval hold created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LifecycleApprovalHold' }
        '400': { $ref: '#/components/responses/GrowthControlBadRequest' }
        '401': { $ref: '#/components/responses/GrowthControlUnauthorized' }
        '403': { $ref: '#/components/responses/GrowthControlForbidden' }
        '404': { $ref: '#/components/responses/GrowthControlNotFound' }
        '409': { $ref: '#/components/responses/GrowthControlConflict' }
        '422': { $ref: '#/components/responses/GrowthControlUnprocessable' }
        '500': { $ref: '#/components/responses/GrowthControlInternalError' }

  /admin/control-plane/configurations/{configKey}/versions/{configVersionId}/activations:
    post:
      tags: [growth-control-plane]
      operationId: activateGrowthControlConfigurationVersion
      summary: Activate an approved ready configuration version
      description: Atomically activates the ready version, deprecates the prior active version in the same scope, consumes the typed hold, and enqueues an internal invalidation event.
      x-contract-completeness: canonical
      parameters:
        - $ref: '#/components/parameters/ConfigKeyPath'
        - $ref: '#/components/parameters/ConfigVersionIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LifecycleTransitionRequest' }
            examples:
              activate:
                value:
                  approvalHoldId: 44444444-4444-4444-8444-444444444444
                  expectedRevision: 2
      responses:
        '200':
          description: Configuration version activated with transactional outbox evidence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LifecycleTransitionResponse' }
        '400': { $ref: '#/components/responses/GrowthControlBadRequest' }
        '401': { $ref: '#/components/responses/GrowthControlUnauthorized' }
        '403': { $ref: '#/components/responses/GrowthControlForbidden' }
        '404': { $ref: '#/components/responses/GrowthControlNotFound' }
        '409': { $ref: '#/components/responses/GrowthControlConflict' }
        '422': { $ref: '#/components/responses/GrowthControlUnprocessable' }
        '500': { $ref: '#/components/responses/GrowthControlInternalError' }

  /admin/control-plane/configurations/{configKey}/versions/{configVersionId}/rollbacks:
    post:
      tags: [growth-control-plane]
      operationId: rollbackGrowthControlConfigurationVersion
      summary: Restore an approved prior configuration version
      description: Atomically restores a deprecated or rolled-back prior version, marks the displaced active version rolled back, consumes the typed hold, and enqueues an internal invalidation event.
      x-contract-completeness: canonical
      parameters:
        - $ref: '#/components/parameters/ConfigKeyPath'
        - $ref: '#/components/parameters/ConfigVersionIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LifecycleTransitionRequest' }
            examples:
              rollback:
                value:
                  approvalHoldId: 55555555-5555-4555-8555-555555555555
                  expectedRevision: 3
      responses:
        '200':
          description: Prior configuration version restored with transactional outbox evidence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LifecycleTransitionResponse' }
        '400': { $ref: '#/components/responses/GrowthControlBadRequest' }
        '401': { $ref: '#/components/responses/GrowthControlUnauthorized' }
        '403': { $ref: '#/components/responses/GrowthControlForbidden' }
        '404': { $ref: '#/components/responses/GrowthControlNotFound' }
        '409': { $ref: '#/components/responses/GrowthControlConflict' }
        '422': { $ref: '#/components/responses/GrowthControlUnprocessable' }
        '500': { $ref: '#/components/responses/GrowthControlInternalError' }

  /admin/control-plane/activity-packs:
    get:
      tags: [growth-control-plane]
      operationId: listGrowthControlActivityPacks
      summary: List Activity Pack definitions
      description: Returns canonical Activity Pack definitions using opaque cursor pagination.
      x-contract-completeness: canonical
      parameters:
        - $ref: '#/components/parameters/GrowthControlLimit'
        - $ref: '#/components/parameters/GrowthControlCursor'
      responses:
        '200':
          description: Paginated Activity Pack definitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPackDefinitionListResponse'
        '400': { $ref: '#/components/responses/GrowthControlBadRequest' }
        '401': { $ref: '#/components/responses/GrowthControlUnauthorized' }
        '403': { $ref: '#/components/responses/GrowthControlForbidden' }
        '500': { $ref: '#/components/responses/GrowthControlInternalError' }
    post:
      tags: [growth-control-plane]
      operationId: createGrowthControlActivityPackDefinition
      summary: Create a draft Activity Pack definition
      description: Creates one draft Activity Pack bound to an active canonical business activity type.
      x-contract-completeness: canonical
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityPackDefinitionCreateRequest'
            examples:
              travel:
                value:
                  activityPackKey: travel.organic-growth
                  activityTypeKey: travel
                  displayName: Travel Organic Growth
                  description: Canonical schemas, KPIs, capabilities, workflows, policies, and tests for travel growth.
      responses:
        '201':
          description: Draft Activity Pack definition created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPackDefinition'
        '400': { $ref: '#/components/responses/GrowthControlBadRequest' }
        '401': { $ref: '#/components/responses/GrowthControlUnauthorized' }
        '403': { $ref: '#/components/responses/GrowthControlForbidden' }
        '422': { $ref: '#/components/responses/GrowthControlUnprocessable' }
        '500': { $ref: '#/components/responses/GrowthControlInternalError' }

  /admin/control-plane/activity-packs/{activityPackKey}/versions:
    post:
      tags: [growth-control-plane]
      operationId: createGrowthControlActivityPackVersion
      summary: Create an immutable draft Activity Pack version
      description: Validates and stores one idempotent draft manifest. The manifest cannot contain secret-like fields.
      x-contract-completeness: canonical
      parameters:
        - $ref: '#/components/parameters/ActivityPackKeyPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityPackVersionCreateRequest'
            examples:
              travelVersion:
                value:
                  manifest:
                    entitySchemas:
                      destination: { type: object }
                    knowledgeProfile:
                      pointerKey: travel.knowledge.active
                    kpiTaxonomy: [qualified_lead_rate]
                    capabilities: [intent_map_generate]
                    workflows: [organic_growth_plan]
                    policies: [internal_draft_policy]
                    providerCompatibility: []
                    tests:
                      fixtures: [travel-basic]
      responses:
        '201':
          description: Immutable draft Activity Pack version created or returned from idempotent readback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPackVersion'
        '400': { $ref: '#/components/responses/GrowthControlBadRequest' }
        '401': { $ref: '#/components/responses/GrowthControlUnauthorized' }
        '403': { $ref: '#/components/responses/GrowthControlForbidden' }
        '404': { $ref: '#/components/responses/GrowthControlNotFound' }
        '422': { $ref: '#/components/responses/GrowthControlUnprocessable' }
        '500': { $ref: '#/components/responses/GrowthControlInternalError' }

  /admin/control-plane/brand-activity-bindings:
    post:
      tags: [growth-control-plane]
      operationId: createGrowthControlBrandActivityBinding
      summary: Create a draft brand activity binding
      description: >-
        Creates an idempotent draft binding after validating tenant, workspace, brand,
        business activity, Activity Pack version, and active semantic capability references.
      x-contract-completeness: canonical
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandActivityBindingCreateRequest'
            examples:
              travelBrand:
                value:
                  tenantId: 11111111-1111-4111-8111-111111111111
                  workspaceId: 22222222-2222-4222-8222-222222222222
                  brandKey: example-brand
                  activityTypeKey: travel
                  activityPackKey: travel.organic-growth
                  activityPackVersion: 1
                  markets: [EG]
                  locales: [ar-EG, en]
                  channels: [organic-search]
                  objectives: [qualified-leads]
                  allowedCapabilities: [intent_map_generate]
      responses:
        '201':
          description: Draft brand activity binding created or returned from idempotent readback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandActivityBinding'
        '400': { $ref: '#/components/responses/GrowthControlBadRequest' }
        '401': { $ref: '#/components/responses/GrowthControlUnauthorized' }
        '403': { $ref: '#/components/responses/GrowthControlForbidden' }
        '422': { $ref: '#/components/responses/GrowthControlUnprocessable' }
        '500': { $ref: '#/components/responses/GrowthControlInternalError' }

components:
  securitySchemes:
    adminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Backend API Key
      description: Backend API key supplied as a bearer token and accepted only with the Admin principal guard.
    backendApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Backend API key accepted only with the Admin principal guard.

  parameters:
    GrowthControlLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of resources to return.
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    GrowthControlCursor:
      name: cursor
      in: query
      required: false
      description: Opaque Base64URL continuation cursor returned by the previous page.
      schema: { type: string, minLength: 1 }
    ConfigKeyPath:
      name: configKey
      in: path
      required: true
      schema: { $ref: '#/components/schemas/CanonicalKey' }
    ConfigVersionIdPath:
      name: configVersionId
      in: path
      required: true
      description: Immutable Growth Control Plane configuration version identifier.
      schema: { type: string, format: uuid }
    ActivityPackKeyPath:
      name: activityPackKey
      in: path
      required: true
      schema: { $ref: '#/components/schemas/CanonicalKey' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable key for safe retries. Reuse returns the original draft resource.
      schema: { type: string, minLength: 8, maxLength: 191 }

  responses:
    GrowthControlBadRequest:
      description: Invalid request shape, query parameter, limit, cursor, or idempotency key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    GrowthControlUnauthorized:
      description: Missing or invalid backend authentication.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    GrowthControlForbidden:
      description: Authenticated principal is not authorized for the Admin resource or tenant/workspace/brand relation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    GrowthControlNotFound:
      description: Canonical definition or Activity Pack was not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    GrowthControlConflict:
      description: Optimistic revision conflict.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    GrowthControlUnprocessable:
      description: Semantically invalid schema, scope, manifest, binding, or referenced authority.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    GrowthControlInternalError:
      description: Unexpected internal or persistence failure. No secrets or stack traces are returned.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    CanonicalKey:
      type: string
      pattern: '^[a-z][a-z0-9_.-]{2,127}$'

    ErrorDetail:
      type: object
      additionalProperties: true
      properties:
        field: { type: string }
        issue: { type: string }
        value: {}
        expected: {}

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, secretsIncluded]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details, requestId]
          properties:
            code: { type: string, pattern: '^[A-Z][A-Z0-9_]{2,127}$' }
            message: { type: string, maxLength: 512 }
            details:
              type: array
              items: { $ref: '#/components/schemas/ErrorDetail' }
            requestId: { type: string }
        secretsIncluded: { type: boolean, const: false }

    Page:
      type: object
      additionalProperties: false
      required: [nextCursor, hasMore]
      properties:
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }

    ConfigurationScope:
      type: object
      additionalProperties: false
      required: [scopeType]
      properties:
        scopeType:
          type: string
          enum: [platform, activity, tenant, workspace, brand, profile, workflow, workflow_node, plan, execution]
        tenantId: { type: [string, 'null'], maxLength: 36 }
        workspaceId: { type: [string, 'null'], maxLength: 36 }
        brandKey: { type: [string, 'null'], maxLength: 255 }
        activityTypeKey: { type: [string, 'null'], maxLength: 255 }
        activityBindingId: { type: [string, 'null'], maxLength: 36 }
        profileKey: { type: [string, 'null'], maxLength: 191 }
        workflowKey: { type: [string, 'null'], maxLength: 255 }
        workflowVersion: { type: [integer, 'null'], minimum: 1 }
        workflowNodeId: { type: [string, 'null'], maxLength: 191 }
        planId: { type: [string, 'null'], maxLength: 191 }
        executionId: { type: [string, 'null'], maxLength: 191 }

    ConfigurationDefinitionCreateRequest:
      type: object
      additionalProperties: false
      required: [configKey, schema, allowedScopes, mergeProfile]
      properties:
        configKey: { $ref: '#/components/schemas/CanonicalKey' }
        schemaVersion: { type: integer, minimum: 1, default: 1 }
        schema: { type: object, additionalProperties: true }
        defaultValues: { type: object, additionalProperties: true, default: {} }
        allowedScopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [platform, activity, tenant, workspace, brand, profile, workflow, workflow_node, plan, execution]
        mergeProfile:
          type: object
          additionalProperties:
            type: string
            enum: [priority_replace, deny_wins, strict_intersection, minimum, maximum, guarded_union, append_unique, block_on_ambiguity]
        securityClassification:
          type: string
          enum: [public_metadata, tenant_internal, restricted, security_control]
          default: tenant_internal

    ConfigurationDefinition:
      type: object
      additionalProperties: true
      required: [configKey, schemaVersion, schema, defaultValues, allowedScopes, mergeProfile, securityClassification, status, revision, checksumSha256, secretsIncluded]
      properties:
        configKey: { $ref: '#/components/schemas/CanonicalKey' }
        schemaVersion: { type: integer, minimum: 1 }
        schema: { type: object, additionalProperties: true }
        defaultValues: { type: object, additionalProperties: true }
        allowedScopes: { type: array, items: { type: string } }
        mergeProfile: { type: object, additionalProperties: { type: string } }
        securityClassification: { type: string }
        status: { type: string, enum: [draft, active, blocked, deprecated, archived] }
        revision: { type: integer, minimum: 1 }
        checksumSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        createdBy: { type: string }
        createdAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }
        secretsIncluded: { type: boolean, const: false }

    ConfigurationDefinitionListResponse:
      type: object
      additionalProperties: false
      required: [items, page, secretsIncluded]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ConfigurationDefinition' }
        page: { $ref: '#/components/schemas/Page' }
        secretsIncluded: { type: boolean, const: false }

    ConfigurationVersionCreateRequest:
      type: object
      additionalProperties: false
      required: [scope, values, expectedRevision]
      properties:
        scope: { $ref: '#/components/schemas/ConfigurationScope' }
        values: { type: object, additionalProperties: true }
        expectedRevision: { type: integer, minimum: 0 }

    ConfigurationVersion:
      type: object
      additionalProperties: true
      required: [configVersionId, configKey, versionNumber, lifecycle, versionRevision, checksumSha256, secretsIncluded]
      properties:
        configVersionId: { type: string, format: uuid }
        configKey: { $ref: '#/components/schemas/CanonicalKey' }
        versionNumber: { type: integer, minimum: 1 }
        scopeType: { type: string }
        scopeKey: { type: string }
        tenantId: { type: [string, 'null'] }
        workspaceId: { type: [string, 'null'] }
        brandKey: { type: [string, 'null'] }
        activityTypeKey: { type: [string, 'null'] }
        activityBindingId: { type: [string, 'null'] }
        profileKey: { type: [string, 'null'] }
        workflowKey: { type: [string, 'null'] }
        workflowVersion: { type: [integer, 'null'] }
        workflowNodeId: { type: [string, 'null'] }
