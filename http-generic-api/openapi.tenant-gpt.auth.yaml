                  type: string
                  enum:
                    - user
                    - assistant
                    - tool
                content:
                  type: string
                action_key:
                  type: string
      responses:
        "200":
          description: Turn write result with Drive anchor and archive status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                  - ok
                  - session_id
                  - turn_index
                  - turn_id
                  - archive_status
                properties:
