                properties:
                  ok:
                    type: boolean
                  protocol:
                    type: string
                    example: openapi-mcp-facade
                  surface:
                    type: string
                    example: device
                  caller_type:
                    type: string
                  count:
                    type: integer
                  tools:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        name:
                          type: string
                        displayName:
                          type: string
                        description:
                          type: string
                        method:
                          type: string
                        path:
                          type: string
                        tags:
                          type: array
                          items:
                            type: string
                        inputSchema:
                          type: object
                          additionalProperties: true
                          properties: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Device tool list failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /device/tools/call:
    post:
      tags:
        - admin-control
      security:
        - backendBearerAuth: []
      operationId: callDeviceTool
      x-openai-isConsequential: false
      summary: Execute a device-tagged tool by name (MCP-style dispatch)
      description: Dispatches a device-tagged tool through the auth.mad4b.com facade. Rejects tool keys not tagged 'device' with 403. Reuses the gpt/tools dispatcher so audit, admin scope-grant resolution, and grant_dispatch logging keep working.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
              properties:
                name:
                  type: string
                  description: Device tool key from listDeviceTools, e.g. connector_n8n, connector_browser, connector_win, connector_files.
                tool_args:
                  type: object
                  additionalProperties: true
                  description: Arguments matching the device tool inputSchema.
                  properties: {}
      responses:
        "200":
          description: Upstream device tool response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Tool exists but is not in the device-tools surface
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Tool not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Device tool call failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/cli/local-connector/install-bundle:
    get:
      tags:
        - admin-control
      security:
        - backendBearerAuth: []
      operationId: getLocalConnectorInstallBundle
      summary: Generate and upload local connector installer
      description: Generate a pre-filled Windows .bat installer for the local connector stack (cloudflared + Node.js service via NSSM). Reads cf_token and connector_secret from local_connector_user_configs in DB for the given user_id + device_id. Falls back to server env only if no DB row exists. Uploads to Google Dr.
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: string
          description: User ID whose device config to load from DB. Defaults to platform admin.
        - name: device_id
          in: query
          required: false
          schema:
            type: string
          description: Device ID (hostname) to load config for. Defaults to mohammedlap.
      responses:
        "200":
          description: Installer uploaded, drive link returned
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                  - ok
                  - drive
                properties:
                  ok:
                    type: boolean
                  drive_upload_status:
                    type: string
                    enum:
                      - uploaded
                      - failed
                      - not_configured
                      - attempted
                  drive_error:
                    oneOf:
                      - type: object
                        additionalProperties: true
                        properties: {}
                      - type: "null"
                  drive:
                    oneOf:
                      - type: object
                        additionalProperties: true
                        properties:
                          file_id:
                            type: string
                          drive_link:
                            type: string
                          filename:
                            type: string
                      - type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Install bundle generation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/cli/local-connector/self-repair:
    post:
      tags:
        - admin-control
      security:
        - backendBearerAuth: []
      operationId: repairLocalConnector
      x-openai-isConsequential: false
      summary: Self-repair the admin local connector
      x-runtime-governance:
        local_connector_tunnel_provisioning_continuation:
          policy: local_connector_tunnel_provisioning_continuation_contract
          interruption_signal: connector_tunnel_provisioning_required
          required_next_action: provision_tunnel_token
          status_code: 409
          shared_reconciliation_checkpoint: true
          secrets_included: false
      description: "Retry bounded connector health up to three total attempts for transient 1033/HTTP 530. Stop on pass or authorization-gated reachability. Generate repair installer assets only after retry exhaustion and degraded readback. Returns no-secret diagnosis and retry evidence."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                user_id:
                  type: string
                  description: User ID whose device to repair. Defaults to platform admin.
                device_id:
                  type: string
                  description: Device hostname to repair. Defaults to mohammedlap.
      responses:
        "200":
          description: Self-repair result with diagnosis and drive link
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                  - ok
                  - diagnosis
                  - repair
                properties:
                  ok:
                    type: boolean
                  diagnosis:
                    type: object
                    additionalProperties: true
                    properties:
                      device_id:
                        type: string
                      tunnel_url:
                        type: string
                      cf_tunnel_id:
                        type: string
                      cf_tunnel_status:
                        type: string
                      config_source:
                        type: string
                        enum:
                          - db
                          - env
                          - env_fallback
                  repair:
                    type: object
                    additionalProperties: true
                    properties:
                      action:
                        type: string
                      drive_upload_status:
                        type: string
                        enum:
                          - uploaded
                          - failed
                          - not_configured
                          - attempted
                      drive_error:
                        oneOf:
                          - type: object
                            additionalProperties: true
                            properties: {}
                          - type: "null"
                      drive:
                        oneOf:
                          - type: object
                            additionalProperties: true
                            properties:
                              file_id:
                                type: string
                              drive_link:
                                type: string
                              filename:
                                type: string
                          - type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Self-repair failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/cli/dns:
    get:
      tags:
        - admin-control
      security:
        - backendBearerAuth: []
      operationId: listDnsRecords
      summary: List DNS records for a zone
      description: Lists all DNS records for the specified zone via Cloudflare API. Defaults to mad4b.com.
      parameters:
        - name: zone
          in: query
          required: false
          schema:
            type: string
            default: mad4b.com
          description: Domain zone to query, e.g. mad4b.com.
        - name: type
          in: query
          required: false
          schema:
            type: string
          description: Filter by record type, e.g. A, CNAME, TXT.
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Filter by record name.
      responses:
        "200":
          description: DNS record list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                  - ok
                  - records
                properties:
                  ok:
                    type: boolean
                  zone:
                    type: string
                  records:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: DNS list failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/schema-import/jobs:
    get:
      tags:
        - admin-control
      security:
        - backendBearerAuth: []
      operationId: listSchemaImportJobs
      summary: List schema import jobs with optional action_key filter
      parameters:
        - name: action_key
          in: query
          schema:
            type: string
          description: Filter by action_key. Omit to list all jobs.
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Job list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  count:
                    type: integer
                  jobs:
                    type: array
                    items:
                      $ref: "#/components/schemas/SchemaImportJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/cli/data-source/census:
    get:
      tags:
        - admin-control
      security:
        - backendBearerAuth: []
      operationId: getPlatformDataSourceCensus
      summary: SQL data-source census across platform tables
      description: Returns row counts and last-write timestamps for every SQL table mapped in the platform registry (brands, actions, endpoints, plugins, execution_log, etc.) plus the Sheets mirror configuration. Use to verify SQL is the runtime authority, find empty tables that may need seeding, and audit migration.
      responses:
        "200":
          description: Per-table census with summary
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                  - ok
                  - data_source
                  - summary
                  - tables
                properties:
                  ok:
                    type: boolean
                  data_source:
                    type: object
                    additionalProperties: true
                    properties:
                      runtime_authority:
                        type: string
                        enum:
                          - sql
                      mode:
                        type: string
                      sheets_role:
                        type: string
                      sheets_mirror_configured:
                        type: boolean
                  summary:
                    type: object
                    additionalProperties: true
                    properties:
                      total_tables:
                        type: integer
                      seeded_tables:
                        type: integer
                      empty_tables:
                        type: integer
                  tables:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        sql_table:
                          type: string
                        sheet_name:
                          type: string
                        sql_row_count:
                          oneOf:
                            - type: integer
                            - type: "null"
                        sql_last_write_at:
                          oneOf:
                            - type: string
                            - type: "null"
                        sql_seeded:
                          type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Census query failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
