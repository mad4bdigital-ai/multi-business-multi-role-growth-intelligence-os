          required: false
          schema:
            type: string
            default: mad4b.com
          description: Domain zone to query, e.g. mad4b.com.
        - name: type
          in: query
          required: false
          schema:
            type: string
          description: Filter by record type, e.g. A, CNAME, TXT.
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Filter by record name.
      responses:
        '200':
          description: DNS record list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                  - ok
                  - records
                properties:
                  ok:
                    type: boolean
                  zone:
                    type: string
                  records:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: DNS list failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/schema-import/jobs:
    get:
      tags:
        - admin-control
      security:
        - backendBearerAuth: []
      operationId: listSchemaImportJobs
      summary: List schema import jobs with optional action_key filter
      parameters:
        - name: action_key
          in: query
          schema:
            type: string
          description: Filter by action_key. Omit to list all jobs.
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Job list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  count:
                    type: integer
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/SchemaImportJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/cli/data-source/census:
    get:
      tags:
        - admin-control
      security:
        - backendBearerAuth: []
      operationId: getPlatformDataSourceCensus
      summary: SQL data-source census across platform tables
      description: Returns row counts and last-write timestamps for every SQL table mapped in the platform registry (brands, actions, endpoints, plugins, execution_log, etc.) plus the Sheets mirror configuration. Use to verify SQL is the runtime authority, find empty tables that may need seeding, and audit migration.
      responses:
        '200':
          description: Per-table census with summary
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                  - ok
                  - data_source
                  - summary
                  - tables
                properties:
                  ok:
                    type: boolean
                  data_source:
                    type: object
                    additionalProperties: true
                    properties:
                      runtime_authority:
                        type: string
                        enum:
                          - sql
                      mode:
                        type: string
                      sheets_role:
                        type: string
                      sheets_mirror_configured:
                        type: boolean
                  summary:
                    type: object
                    additionalProperties: true
                    properties:
                      total_tables:
                        type: integer
                      seeded_tables:
                        type: integer
                      empty_tables:
                        type: integer
                  tables:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        sql_table:
                          type: string
                        sheet_name:
                          type: string
                        sql_row_count:
                          oneOf:
                            - type: integer
                            - type: 'null'
                        sql_last_write_at:
                          oneOf:
                            - type: string
                            - type: 'null'
                        sql_seeded:
                          type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Census query failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
