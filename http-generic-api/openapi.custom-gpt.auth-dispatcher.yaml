openapi: 3.1.0
info:
  title: Governed HTTP Client â€” AI Platform - Auth Dispatcher Admin Control Actions
  version: 3.0.0-platform
  summary: Admin GPT action schema — MCP-like dispatcher for activation, admin control, and system layer.
  description: Single-host admin GPT schema generated from openapi.yaml. Dispatches activation, admin-control, and system-layer routes via auth.mad4b.com.
servers:
  - url: https://auth.mad4b.com
    description: Governed HTTP Client â€” AI Platform - Auth Dispatcher Admin Control Actions
tags:
  - name: activation
    description: Once-per-session activation probes, session history, and scope context.
  - name: admin-control
    description: Personal administrator control surface for CLI, database, and runtime environment operations.
  - name: system-layer
    description: MCP-style governed system layer backed by connector registries, principal context, and runtime validation.
  - name: runtime-verification
    description: Runtime verification control plane, production parity ledger, and paginated evidence surfaces.
components:
  securitySchemes:
    backendBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Backend API Key or User JWT
      description: |
        Send Authorization: Bearer <BACKEND_API_KEY> for admin/service access, or Authorization: Bearer <USER_JWT> after user sign-in.
  schemas:
    SchemaImportJob:
      type: object
      additionalProperties: true
      properties:
        job_id:
          type: string
        action_key:
          type: string
        source_type:
          type: string
          enum:
            - upload
            - repo_link
            - rollback
        source_url:
          type: string
          nullable: true
        source_ref:
          type: string
          nullable: true
        source_filename:
          type: string
          nullable: true
        endpoints_upserted:
          type: integer
        endpoints_deprecated:
          type: integer
        warnings:
          type: array
          items:
            type: string
          nullable: true
        status:
          type: string
          enum:
            - pending
            - completed
            - failed
        error_message:
          type: string
          nullable: true
        imported_by:
          type: string
          nullable: true
        imported_at:
          type: string
          format: date-time
    HardActivationEvidenceStep:
      type: object
      additionalProperties: true
      properties:
        attempted:
          type: boolean
        ok:
          type: boolean
          nullable: true
        activation_layer:
          type: string
          nullable: true
        evidence_source:
          type: string
          nullable: true
    HardActivationRunResponse:
      type: object
      additionalProperties: true
      required:
        - ok
        - activation_layer
        - activation_complete
        - response_profile
        - runtime_classification
        - evidence_matrix
        - completeness
        - report_policy
        - secrets_included
      properties:
        ok:
          type: boolean
        activation_layer:
          type: string
          enum:
            - hard_activation_orchestrator
        activation_complete:
          type: boolean
        run_id:
          type: string
          nullable: true
        session_id:
          type: string
          nullable: true
        response_profile:
          type: string
          enum:
            - evidence
            - summary
            - dashboard
            - diagnostic
            - full
        snapshot:
          type: object
          additionalProperties: true
          properties:
            snapshot_id:
              type: string
            generated_at:
              type: string
              format: date-time
            registry_version:
              type: string
              nullable: true
            data_watermark:
              type: string
              format: date-time
            profile:
              type: string
            subject_scope:
              type: string
              enum:
                - platform_admin
                - tenant_user
        state_model:
          type: object
          additionalProperties: false
          properties:
            validation_state:
              type: string
            evidence_state:
              type: string
            session_state:
              type: string
            dashboard_state:
              type: string
            delivery_state:
              type: string
            consumer_ack_state:
              type: string
        dynamic_tabs_manifest:
          type: object
          additionalProperties: true
          properties: {}
        operational_summary:
          type: object
          additionalProperties: true
          properties: {}
        operational_dashboard_manifest:
          type: object
          additionalProperties: true
          properties: {}
        completeness:
          type: object
          additionalProperties: true
          properties:
            known_surfaces:
              type: integer
            visible_surfaces:
              type: integer
            summarized_surfaces:
              type: integer
            fully_hydrated_surfaces:
              type: integer
            deferred_surfaces:
              type: integer
            blocked_surfaces:
              type: integer
            stale_surfaces:
              type: integer
            coverage_status:
              type: string
            details_omitted_silently:
              type: boolean
              enum:
                - false
        awareness_index:
          type: object
          additionalProperties: true
          properties: {}
        surface_refs:
          type: array
          items:
            type: object
            additionalProperties: true
            properties: {}
        response_projection:
          type: object
          additionalProperties: true
          properties: {}
        runtime_classification:
          type: object
          additionalProperties: true
          properties:
            activation_status:
              type: string
            status_authority:
              type: string
            reason_code:
              type: string
        evidence_matrix:
          type: object
          additionalProperties: true
          properties:
            session_context:
              $ref: "#/components/schemas/HardActivationEvidenceStep"
            provider_bootstrap:
              $ref: "#/components/schemas/HardActivationEvidenceStep"
        report_policy:
          type: object
          additionalProperties: true
          properties:
            may_report_session_context_loaded:
              type: boolean
            may_report_activation_complete:
              type: boolean
            session_context_claim_requires:
              type: string
        secrets_included:
          type: boolean
          enum:
            - false
    ActivationAwarenessResponse:
      type: object
      additionalProperties: true
      required:
        - ok
        - activation_layer
        - response_profile
        - snapshot
        - dynamic_tabs
        - operational_summary
        - dashboard
        - completeness
        - awareness_index
        - auth_context
        - secrets_included
      properties:
        ok:
          type: boolean
        activation_layer:
          type: string
          enum:
            - activation_awareness_readback
        response_profile:
          type: string
          enum:
            - evidence
            - summary
            - dashboard
            - diagnostic
            - full
        snapshot:
          type: object
          additionalProperties: true
          properties: {}
        dynamic_tabs:
          type: object
          additionalProperties: true
          properties: {}
        operational_summary:
          type: object
          additionalProperties: true
          properties: {}
        dashboard:
          type: object
          additionalProperties: true
          properties: {}
        completeness:
          type: object
          additionalProperties: true
          required:
            - known_surfaces
            - visible_surfaces
            - summarized_surfaces
            - fully_hydrated_surfaces
            - deferred_surfaces
            - blocked_surfaces
            - stale_surfaces
            - coverage_status
            - details_omitted_silently
          properties:
            known_surfaces:
              type: integer
            visible_surfaces:
              type: integer
            summarized_surfaces:
              type: integer
            fully_hydrated_surfaces:
              type: integer
            deferred_surfaces:
              type: integer
            blocked_surfaces:
              type: integer
            stale_surfaces:
              type: integer
            degraded_surfaces:
              type: integer
            coverage_status:
              type: string
            details_omitted_silently:
              type: boolean
              enum:
                - false
            deferred_details_have_refs:
              type: boolean
        awareness_index:
          type: object
          additionalProperties: false
          properties:
            score:
              type: integer
              minimum: 0
              maximum: 100
            coverage:
              type: integer
              minimum: 0
              maximum: 100
            freshness:
              type: integer
              minimum: 0
              maximum: 100
            authorization_visibility:
              type: integer
              minimum: 0
              maximum: 100
            attention_detection:
              type: integer
              minimum: 0
              maximum: 100
            detail_availability:
              type: integer
              minimum: 0
              maximum: 100
        auth_context:
          type: object
          additionalProperties: true
          properties: {}
        secrets_included:
          type: boolean
          enum:
            - false
    ActivationDynamicTabDetailResponse:
      type: object
      additionalProperties: true
      required:
        - ok
        - activation_layer
        - snapshot
        - subject
        - container
        - tab
        - sections
        - page
        - policy
        - secrets_included
      properties:
        ok:
          type: boolean
        activation_layer:
          type: string
          enum:
            - activation_dynamic_tab_detail
        snapshot:
          type: object
          additionalProperties: true
          properties: {}
        subject:
          type: object
          additionalProperties: true
          properties: {}
        container:
          type: object
          additionalProperties: true
          properties: {}
        tab:
          type: object
          additionalProperties: true
          properties: {}
        sections:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              section_key:
                type: string
              row_count:
                type: integer
              rows:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  properties: {}
              page:
                type: object
                additionalProperties: false
                properties:
                  cursor:
                    type: integer
                  limit:
                    type: integer
                  has_more:
                    type: boolean
                  next_cursor:
                    type: integer
                    nullable: true
        page:
          type: object
          additionalProperties: false
          properties:
            cursor:
              type: integer
            limit:
              type: integer
            returned_rows:
              type: integer
            has_more:
              type: boolean
            next_cursor:
              type: integer
              nullable: true
        policy:
          type: object
          additionalProperties: true
          properties: {}
        secrets_included:
          type: boolean
          enum:
            - false
    ActivationRunAckResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - run_id
        - affected_rows
        - secrets_included
      properties:
        ok:
          type: boolean
        run_id:
          type: string
        affected_rows:
          type: integer
        error:
          type: object
          nullable: true
          additionalProperties: true
          properties: {}
        secrets_included:
          type: boolean
          enum:
            - false
    ErrorObject:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        status:
          type: integer
        details:
          oneOf:
            - type: object
              additionalProperties: true
              properties: {}
            - type: "null"
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - error
      properties:
        ok:
          type: boolean
          enum:
            - false
        error:
          $ref: "#/components/schemas/ErrorObject"
        execution_guardrail:
          type: boolean
  responses:
    BadRequest:
      description: Invalid request body or missing required field
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Invalid or missing backend API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
security:
  - backendBearerAuth: []
paths:
  /activation/hard-run/summary:
    get:
      tags:
        - activation
        - runtime-verification
      operationId: getActivationHardRunSummary
      summary: Read compact hard activation summary
      description: |
        Returns a summary-first activation status and registry counts without loading the full hard activation evidence graph. Use this endpoint when tool/client response budgets cannot safely receive full activation evidence.
      security:
        - backendBearerAuth: []
      responses:
        "200":
          description: Compact hard activation summary.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties: {}
        "424":
          description: Activation summary reports degraded surfaces.
  /activation/awareness:
    get:
      tags:
        - activation
      security:
        - backendBearerAuth: []
      operationId: readActivationAwareness
      x-openai-isConsequential: false
      summary: Read complete activation awareness manifests
      description: Returns Dynamic Tabs and Dashboard manifests, attention summaries, completeness, freshness, awareness index, snapshot metadata, and governed detail references without silently omitting surfaces.
      parameters:
        - in: query
          name: profile
          schema:
            type: string
            enum:
              - evidence
              - summary
              - dashboard
              - diagnostic
              - full
            default: evidence
        - in: query
          name: attention_limit
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        "200":
          description: Activation awareness readback.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivationAwarenessResponse"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Awareness read failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /activation/dynamic-tabs/detail:
    get:
      tags:
        - activation
      security:
        - backendBearerAuth: []
      operationId: readActivationDynamicTabDetail
      x-openai-isConsequential: false
      summary: Read one authorized Dynamic Tab detail page
      parameters:
        - in: query
          name: container_key
          required: true
          schema:
            type: string
        - in: query
          name: tab_key
          required: true
          schema:
            type: string
        - in: query
          name: section_key
          schema:
            type: string
        - in: query
          name: cursor
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: snapshot_id
          schema:
            type: string
      responses:
        "200":
          description: Cursor-paginated Dynamic Tab detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivationDynamicTabDetailResponse"
        "400":
          description: Missing or invalid detail scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Container, tab, or section not found within caller scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /activation/runs/{runId}/ack:
    post:
      tags:
        - activation
      security:
        - backendBearerAuth: []
      operationId: acknowledgeActivationRun
      x-openai-isConsequential: false
      summary: Record consumer acknowledgement for an activation run
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                acknowledged_by:
                  type: string
                  maxLength: 180
                consumer_state:
                  type: string
                  enum:
                    - acknowledged
                    - rejected
                  default: acknowledged
      responses:
        "200":
          description: Acknowledgement recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivationRunAckResponse"
        "404":
          description: Activation run not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant/activation/awareness:
    get:
      tags:
        - activation
      security:
        - backendBearerAuth: []
      operationId: readTenantActivationAwareness
      x-openai-isConsequential: false
      summary: Read signed-in tenant activation awareness
      description: Tenant scope is resolved from the signed user JWT and active membership. Client-supplied tenant identity is not trusted.
      parameters:
        - in: query
          name: profile
          schema:
            type: string
            enum:
              - evidence
              - summary
              - dashboard
            default: evidence
        - in: query
          name: attention_limit
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        "200":
          description: Tenant-scoped activation awareness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivationAwarenessResponse"
        "401":
          description: User JWT required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Active tenant membership required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant/activation/dynamic-tabs/detail:
    get:
      tags:
        - activation
      security:
        - backendBearerAuth: []
      operationId: readTenantActivationDynamicTabDetail
      x-openai-isConsequential: false
      summary: Read one tenant-authorized Dynamic Tab detail page
      parameters:
        - in: query
          name: container_key
          required: true
          schema:
            type: string
        - in: query
          name: tab_key
          required: true
          schema:
            type: string
        - in: query
          name: section_key
          schema:
            type: string
        - in: query
          name: cursor
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: snapshot_id
          schema:
            type: string
      responses:
        "200":
          description: Tenant-scoped cursor-paginated Dynamic Tab detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivationDynamicTabDetailResponse"
        "400":
          description: Missing or invalid detail scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller lacks active tenant membership or requested object scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Container, tab, or section not found within caller scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /activation/hard-run/legacy-full:
    post:
      deprecated: true
      tags:
        - activation
      security:
        - backendBearerAuth: []
      operationId: runLegacyFullHardActivation
      x-openai-isConsequential: false
      summary: Run legacy full hard activation response
      description: Compatibility route for callers that require the previous fully hydrated Dynamic Tabs, Operational Intelligence, and Dashboard payload. New callers should use /activation/hard-run with response_profile=full only when necessary.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                tenant_id:
                  type: string
                user_id:
                  type: string
                limit:
                  type: integer
                  minimum: 1
                  maximum: 50
                  default: 10
                include_raw:
                  type: boolean
                  default: false
                include_turns:
                  type: boolean
                  default: false
                close_previous_sessions:
                  type: boolean
                  default: false
                response_profile:
                  type: string
                  enum:
                    - evidence
                    - summary
                    - dashboard
                    - diagnostic
                    - full
                  default: evidence
                session_policy:
                  type: string
                  enum:
                    - reuse_or_create
                    - create_new
                    - reuse_only
                    - read_only
                  default: reuse_or_create
                idempotency_key:
                  type: string
                  maxLength: 180
                conversation_ref:
                  type: string
                  maxLength: 500
                reuse_window_hours:
                  type: integer
                  minimum: 1
                  maximum: 168
                  default: 24
                container_key:
                  type: string
                tab_key:
                  type: string
                section_key:
                  type: string
                cursor:
                  type: integer
                  minimum: 0
                  default: 0
                detail_limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 25
                max_response_chars:
                  type: integer
                  minimum: 5000
                  maximum: 500000
                authorized_access_limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                authorized_surface_limit:
                  type: integer
                  minimum: 1
                  maximum: 50
                provider_arguments:
                  type: object
                  additionalProperties: true
                  properties: {}
      responses:
        "200":
          description: Legacy full activation completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HardActivationRunResponse"
        "424":
          description: Required activation evidence incomplete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HardActivationRunResponse"
  /activation/hard-run:
    post:
      tags:
        - activation
      security:
        - backendBearerAuth: []
      operationId: runHardActivation
      x-openai-isConsequential: false
      summary: Run evidence-first hard activation with complete awareness
      description: Orchestrates hard activation by collecting session-context evidence first and provider-bootstrap evidence second. Activation is not complete unless both evidence surfaces are present and valid. This prevents final activation reports from claiming session context was opened or loaded without getActi.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                tenant_id:
                  type: string
                user_id:
                  type: string
                limit:
                  type: integer
                  minimum: 1
                  maximum: 50
                  default: 10
                include_raw:
                  type: boolean
                  default: false
                include_turns:
                  type: boolean
                  default: false
                close_previous_sessions:
                  type: boolean
                  default: false
                response_profile:
                  type: string
                  enum:
                    - evidence
                    - summary
                    - dashboard
                    - diagnostic
                    - full
                  default: evidence
                session_policy:
                  type: string
                  enum:
                    - reuse_or_create
                    - create_new
                    - reuse_only
                    - read_only
                  default: reuse_or_create
                idempotency_key:
                  type: string
                  maxLength: 180
                conversation_ref:
                  type: string
                  maxLength: 500
                reuse_window_hours:
                  type: integer
                  minimum: 1
                  maximum: 168
                  default: 24
                container_key:
                  type: string
                tab_key:
                  type: string
                section_key:
                  type: string
                cursor:
                  type: integer
                  minimum: 0
                  default: 0
                detail_limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 25
                max_response_chars:
                  type: integer
                  minimum: 5000
                  maximum: 500000
                authorized_access_limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                authorized_surface_limit:
                  type: integer
                  minimum: 1
                  maximum: 50
                provider_arguments:
                  type: object
                  additionalProperties: true
                  properties: {}
      responses:
        "200":
          description: Hard activation complete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HardActivationRunResponse"
        "424":
          description: Required activation evidence is missing or degraded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HardActivationRunResponse"
  /activation/session-context:
    get:
      tags:
        - activation
      security:
        - backendBearerAuth: []
      operationId: getActivationSessionContext
      x-tenant-gpt-operationId: activateSession
      summary: Read previous session history and platform scope context
      description: Hard activation layer that reads prior user session envelopes as a paginated history log, scoped user request transcripts, plus audit activity, developer scopes, API credential scopes, and connected-system scopes. Admin/service sessions may also receive execution-log prompt and response summaries..
      parameters:
        - name: user_id
          in: query
          schema:
            type: string
          description: Optional user id. Admin callers may inspect any user; user JWT callers are restricted to themselves.
        - name: tenant_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 50
          description: Number of previous session/history rows to return per page. Keep small for GPT activation probes.
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Pagination offset for reading older previous session history.
        - name: include_raw
          in: query
          schema:
            type: boolean
            default: false
          description: Include bounded raw request/response dumps where allowed by caller scope.
        - name: raw_max_chars
          in: query
          schema:
            type: integer
            default: 4000
            maximum: 20000
          description: Maximum characters per raw dump field when include_raw=true.
      responses:
        "200":
          description: Session history and related platform scopes
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                  - ok
                  - activation_layer
                  - subject
                  - pagination
                  - session_history
                  - related_scopes
                  - history
                properties:
                  ok:
                    type: boolean
                  activation_layer:
                    type: string
                    enum:
                      - session_context
                  subject:
                    type: object
                    additionalProperties: false
                    properties:
                      user_id:
                        type: string
                      tenant_id:
                        type: string
                      is_admin:
                        type: boolean
                  last_session:
                    type: object
                    additionalProperties: true
                    properties: {}
                  pagination:
                    type: object
                    additionalProperties: false
                    properties:
                      limit:
                        type: integer
                      offset:
