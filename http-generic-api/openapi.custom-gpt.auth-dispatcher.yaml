openapi: 3.1.0
info:
  title: Governed HTTP Client â€” AI Platform - Auth Dispatcher Admin Control Actions
  version: 3.0.0-platform
  summary: Admin GPT action schema — MCP-like dispatcher for activation, admin control, and system layer.
  description: Single-host admin GPT schema generated from openapi.yaml. Dispatches activation, admin-control, and system-layer routes via auth.mad4b.com.
servers:
  - url: https://auth.mad4b.com
    description: Governed HTTP Client â€” AI Platform - Auth Dispatcher Admin Control Actions
tags:
  - name: activation
    description: Once-per-session activation probes, session history, and scope context.
  - name: admin-control
    description: Personal administrator control surface for CLI, database, and runtime environment operations.
  - name: system-layer
    description: MCP-style governed system layer backed by connector registries, principal context, and runtime validation.
components:
  securitySchemes:
    backendBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Backend API Key or User JWT
      description: |
        Send Authorization: Bearer <BACKEND_API_KEY> for admin/service access, or Authorization: Bearer <USER_JWT> after user sign-in.
  schemas:
    SchemaImportJob:
      type: object
      additionalProperties: true
      properties:
        job_id:
          type: string
        action_key:
          type: string
        source_type:
          type: string
          enum:
            - upload
            - repo_link
            - rollback
        source_url:
          type: string
          nullable: true
        source_ref:
          type: string
          nullable: true
        source_filename:
          type: string
          nullable: true
        endpoints_upserted:
          type: integer
        endpoints_deprecated:
          type: integer
        warnings:
          type: array
          items:
            type: string
          nullable: true
        status:
          type: string
          enum:
            - pending
            - completed
            - failed
        error_message:
          type: string
          nullable: true
        imported_by:
          type: string
          nullable: true
        imported_at:
          type: string
          format: date-time
    HardActivationEvidenceStep:
      type: object
      additionalProperties: true
      properties:
        attempted:
          type: boolean
        ok:
          type: boolean
          nullable: true
        activation_layer:
          type: string
          nullable: true
        evidence_source:
          type: string
          nullable: true
    HardActivationRunResponse:
      type: object
      additionalProperties: true
      required:
        - ok
        - activation_layer
        - activation_complete
        - runtime_classification
        - evidence_matrix
        - report_policy
        - secrets_included
      properties:
        ok:
          type: boolean
        activation_layer:
          type: string
          enum:
            - hard_activation_orchestrator
        activation_complete:
          type: boolean
        runtime_classification:
          type: object
          additionalProperties: true
          properties:
            activation_status:
              type: string
            status_authority:
              type: string
            reason_code:
              type: string
        evidence_matrix:
          type: object
          additionalProperties: true
          properties:
            session_context:
              $ref: '#/components/schemas/HardActivationEvidenceStep'
            provider_bootstrap:
              $ref: '#/components/schemas/HardActivationEvidenceStep'
        report_policy:
          type: object
          additionalProperties: true
          properties:
            may_report_session_context_loaded:
              type: boolean
            may_report_activation_complete:
              type: boolean
            session_context_claim_requires:
              type: string
        secrets_included:
          type: boolean
          enum:
            - false
    ErrorObject:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        status:
          type: integer
        details:
          oneOf:
            - type: object
              additionalProperties: true
              properties: {}
            - type: 'null'
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - error
      properties:
        ok:
          type: boolean
          enum:
            - false
        error:
          $ref: '#/components/schemas/ErrorObject'
        execution_guardrail:
          type: boolean
  responses:
    BadRequest:
      description: Invalid request body or missing required field
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Invalid or missing backend API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
security:
  - backendBearerAuth: []
paths:
  /activation/hard-run:
    post:
      tags:
        - activation
      security:
        - backendBearerAuth: []
      operationId: runHardActivation
      x-openai-isConsequential: false
      summary: Run hard activation with mandatory session-context evidence
      description: Orchestrates hard activation by collecting session-context evidence first and provider-bootstrap evidence second. Activation is not complete unless both evidence surfaces are present and valid. This prevents final activation reports from claiming session context was opened or loaded without getActi.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                tenant_id:
                  type: string
                user_id:
                  type: string
                limit:
                  type: integer
                  minimum: 1
                  maximum: 50
                  default: 10
                include_raw:
                  type: boolean
                  default: false
                close_previous_sessions:
                  type: boolean
                  default: false
                provider_arguments:
                  type: object
                  additionalProperties: true
                  properties: {}
      responses:
        '200':
          description: Hard activation complete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardActivationRunResponse'
        '424':
          description: Required activation evidence is missing or degraded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardActivationRunResponse'
  /activation/session-context:
    get:
      tags:
        - activation
      security:
        - backendBearerAuth: []
      operationId: getActivationSessionContext
      x-tenant-gpt-operationId: activateSession
      summary: Read previous session history and platform scope context
      description: Hard activation layer that reads prior user session envelopes as a paginated history log, scoped user request transcripts, plus audit activity, developer scopes, API credential scopes, and connected-system scopes. Admin/service sessions may also receive execution-log prompt and response summaries..
      parameters:
        - name: user_id
          in: query
          schema:
            type: string
          description: Optional user id. Admin callers may inspect any user; user JWT callers are restricted to themselves.
        - name: tenant_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 50
          description: Number of previous session/history rows to return per page. Keep small for GPT activation probes.
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Pagination offset for reading older previous session history.
        - name: include_raw
          in: query
          schema:
            type: boolean
            default: false
          description: Include bounded raw request/response dumps where allowed by caller scope.
        - name: raw_max_chars
          in: query
          schema:
            type: integer
            default: 4000
            maximum: 20000
          description: Maximum characters per raw dump field when include_raw=true.
      responses:
        '200':
          description: Session history and related platform scopes
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                  - ok
                  - activation_layer
                  - subject
                  - pagination
                  - session_history
                  - related_scopes
                  - history
                properties:
                  ok:
                    type: boolean
                  activation_layer:
                    type: string
                    enum:
                      - session_context
                  subject:
                    type: object
                    additionalProperties: false
                    properties:
                      user_id:
                        type: string
                      tenant_id:
                        type: string
                      is_admin:
                        type: boolean
                  last_session:
                    type: object
                    additionalProperties: true
                    properties: {}
                  pagination:
                    type: object
                    additionalProperties: false
                    properties:
                      limit:
                        type: integer
                      offset:
                        type: integer
                      include_raw:
                        type: boolean
                      raw_max_chars:
                        type: integer
                      has_more_session_history:
                        type: boolean
                  session_history:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        transcript:
                          type: object
                          additionalProperties: false
                          properties:
                            user_request:
                              type: string
                            ai_response:
                              type: string
                            request_fields_available:
                              type: array
                              items:
                                type: string
                        raw_dump:
                          type: object
                          additionalProperties: true
                          properties: {}
                  related_scopes:
                    type: array
                    items:
                      type: string
                  history:
                    type: object
                    additionalProperties: true
                    properties: {}
                  degraded_surfaces:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Session context read failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /activation/platform-access:
    get:
      tags:
        - activation
      security:
        - backendBearerAuth: []
      operationId: getActivationPlatformAccess
      summary: Read platform-wide activation access and registry counts
      description: |
        Hard activation evidence for admin/service sessions. Returns explicit all-brand scope plus counts and readiness for brands, plugins, logics, engines, and runtime-callable actions.
      responses:
        '200':
          description: Platform-wide activation access summary
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                  - ok
                  - activation_layer
                  - principal
                  - access_scope
                  - access
                  - counts
                  - readiness
                properties:
                  ok:
                    type: boolean
                  activation_layer:
                    type: string
                    enum:
                      - platform_access
                  principal:
                    type: object
                    additionalProperties: true
                    properties:
                      type:
                        type: string
                      is_admin:
                        type: boolean
                      user_id:
                        type: string
                      tenant_id:
                        type: string
                  access_scope:
                    type: string
                    enum:
                      - platform_admin_all
                      - user_scoped
                  access:
                    type: object
                    additionalProperties: true
                    properties:
                      brands:
                        type: string
                      plugins:
                        type: string
                      logics:
                        type: string
                      engines:
                        type: string
                      actions:
                        type: string
                  counts:
                    type: object
                    additionalProperties: true
                    properties:
                      brands:
                        type: object
                        additionalProperties: true
                        properties: {}
                      plugins:
                        type: object
                        additionalProperties: true
                        properties: {}
                      logics:
                        type: object
                        additionalProperties: true
                        properties: {}
                      engines:
                        type: object
                        additionalProperties: true
                        properties: {}
                      actions:
                        type: object
                        additionalProperties: true
                        properties: {}
                  readiness:
                    type: object
                    additionalProperties: true
                    properties:
                      brands:
                        type: string
                      plugins:
                        type: string
                      logics:
                        type: string
                      engines:
                        type: string
                      actions:
                        type: string
                  degraded_surfaces:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Platform access read failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /system/connectors:
    get:
      tags:
        - system-layer
      security:
        - backendBearerAuth: []
      operationId: listSystemConnectors
      summary: List connector systems visible to the current principal
      description: Principal-aware facade over connected_systems. Tenant users are automatically scoped to their tenant; admin principals can inspect all tenants.
      parameters:
        - name: tenant_id
          in: query
          schema:
            type: string
          description: Admin-only filter. Tenant principals are always forced to their own tenant_id.
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - pending
              - error
              - archived
        - name: connector_family
          in: query
          schema:
            type: string
        - name: provider_family
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Principal-scoped connector registry list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  count:
                    type: integer
                  connectors:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Tenant scope violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /system/connectors/{system_id}:
    get:
      tags:
        - system-layer
      security:
        - backendBearerAuth: []
      operationId: getSystemConnector
      summary: Get one connector system visible to the current principal
      description: Principal-aware connector registry read. Tenant users can only read systems in their tenant; admins can read any system.
      parameters:
        - name: system_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Principal-scoped connector registry record
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  connector:
                    type: object
                    additionalProperties: true
                    properties: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Tenant scope violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Connector system not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /system/tools:
    get:
      tags:
        - system-layer
      security:
        - backendBearerAuth: []
      operationId: listSystemTools
      x-tenant-gpt-operationId: listTools
      summary: List MCP-style system tools visible to the current principal
      description: Lists fixed OpenAPI-compatible tools available through the auth-host system layer. Tool calls are governed by principal context.
      responses:
        '200':
          description: System layer tools
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  protocol:
                    type: string
                    example: openapi-mcp-facade
                  principal:
                    type: object
                    additionalProperties: true
                    properties: {}
                  tools:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /system/tools/call:
    post:
      tags:
        - system-layer
      security:
        - backendBearerAuth: []
      operationId: callSystemTool
      x-tenant-gpt-operationId: callTool
      x-openai-isConsequential: false
      summary: Call a governed MCP-style system tool
      description: Calls a fixed system-layer tool through principal-aware runtime validation. Tenant principals are scoped to their tenant; admin principals can inspect all connector registry records and run provider-bootstrap probes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
              properties:
                name:
                  type: string
                  enum:
                    - connector_registry_list
                    - connector_registry_get
                    - activation_drive_probe
                    - activation_sheets_bootstrap_read
                    - activation_github_validate
                    - activation_provider_bootstrap_validate
                    - activation_bootstrap_config_upsert
                    - tenant_gpt_oauth_client_upsert
                    - credential_client_config_upsert
                    - credential_client_config_list
                    - google_auth_platform_config_upsert
                    - google_auth_platform_config_get
                arguments:
                  type: object
                  additionalProperties: true
                  description: Tool arguments. For connector_registry_get, include system_id. For activation bootstrap upsert, include GitHub binding fields. Admin provider tools require admin/service auth.
                  properties: {}
      responses:
        '200':
          description: System tool result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  ok:
                    type: boolean
                  name:
                    type: string
                  result:
                    type: object
                    additionalProperties: true
                    properties: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Tenant scope violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/system/connectors:
    get:
      tags:
        - admin-control
      security:
        - backendBearerAuth: []
      operationId: listAdminSystemConnectors
      summary: List connector systems from the system registry
      description: Read-only admin facade over the connected_systems table. Use this before choosing connector-specific actions or MCP-style tool calls.
      parameters:
        - name: tenant_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - pending
              - error
              - archived
        - name: connector_family
          in: query
          schema:
            type: string
        - name: provider_family
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Connector registry list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  count:
                    type: integer
                  connectors:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/system/connectors/{system_id}:
    get:
      tags:
        - admin-control
      security:
        - backendBearerAuth: []
      operationId: getAdminSystemConnector
      summary: Get one connector system from the system registry
      description: Returns one connected_systems row plus its installation summary. This is a governed alternative to raw DB inspection for connector inventory.
      parameters:
        - name: system_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Connector registry record
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  connector:
                    type: object
                    additionalProperties: true
                    properties: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Connector system not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/system/tools:
    get:
      tags:
        - admin-control
      security:
        - backendBearerAuth: []
      operationId: listAdminSystemTools
      summary: List MCP-style system layer tools
      description: Lists fixed OpenAPI-compatible tools available through the admin system layer. This behaves like a small MCP tools/list facade over governed platform registries.
      responses:
        '200':
          description: System layer tools
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  protocol:
                    type: string
                    example: openapi-mcp-facade
                  tools:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/system/tools/call:
    post:
      tags:
        - admin-control
      security:
        - backendBearerAuth: []
      operationId: callAdminSystemTool
      x-openai-isConsequential: false
      summary: Call an MCP-style system layer tool
      description: Calls a fixed, governed system-layer tool. Tools expose the connected_systems registry and admin-only provider-bootstrap probes for Drive, Sheets, and GitHub activation evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
              properties:
                name:
                  type: string
                  enum:
                    - connector_registry_list
                    - connector_registry_get
                    - activation_drive_probe
                    - activation_sheets_bootstrap_read
                    - activation_github_validate
                    - activation_provider_bootstrap_validate
                    - activation_bootstrap_config_upsert
                arguments:
                  type: object
                  additionalProperties: true
                  description: Tool arguments. For connector_registry_get, include system_id. For activation bootstrap upsert, include GitHub binding fields.
                  properties: {}
      responses:
        '200':
          description: System tool result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  ok:
                    type: boolean
                  name:
                    type: string
                  result:
                    type: object
                    additionalProperties: true
                    properties: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/apis-services/google-auth-platform:
    get:
      tags:
        - admin-control
      security:
        - backendBearerAuth: []
      operationId: getAdminGoogleAuthPlatformTabs
      summary: Read simulated Google Auth Platform tabs
      description: Returns governed DB-backed tab state for the platform-controlled Google Auth Platform and APIs & Services console simulation.
      parameters:
        - in: query
          name: project_key
          schema:
            type: string
            default: growth-intelligence-os
        - in: query
          name: owner_type
          schema:
            type: string
            enum:
              - platform
              - tenant
            default: platform
        - in: query
          name: tenant_id
          schema:
            type: string
      responses:
        '200':
          description: Google Auth Platform tab state
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  ok:
                    type: boolean
                  project_key:
                    type: string
                  console_root:
                    type: string
                  tabs:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/apis-services/google-auth-platform/{tab}:
    get:
      tags:
        - admin-control
      security:
        - backendBearerAuth: []
      operationId: getAdminGoogleAuthPlatformTab
      summary: Read one simulated Google Auth Platform tab
      description: Returns one governed tab state, such as overview, branding, audience, clients, data_access, verification_center, settings, or api_credentials.
      parameters:
        - in: path
          name: tab
          required: true
          schema:
            type: string
            enum:
              - overview
              - branding
              - audience
              - clients
              - data_access
              - verification_center
              - settings
              - api_credentials
        - in: query
          name: project_key
          schema:
            type: string
            default: growth-intelligence-os
      responses:
        '200':
          description: Google Auth Platform tab state
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/apis-services/credentials:
    get:
      tags:
        - admin-control
      security:
        - backendBearerAuth: []
      operationId: getAdminApisServicesCredentials
      summary: Read simulated APIs & Services Credentials tab
      description: Returns the governed APIs & Services Credentials tab and linked platform credential-client registry records.
      parameters:
        - in: query
          name: project_key
          schema:
            type: string
            default: growth-intelligence-os
      responses:
        '200':
          description: APIs & Services Credentials state
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /gpt/tools:
    get:
      tags:
        - admin-control
      security:
        - backendBearerAuth: []
      operationId: listAdminTools
      x-tenant-gpt-operationId: listTools
      summary: List all admin platform tools from the DB registry
      description: Returns the full catalog of admin platform operations from admin_platform_endpoint_tools. Each tool has a name (pass to callAdminTool), description, and inputSchema. Call this to discover available operations before using callAdminTool.
      responses:
        '200':
          description: Admin tool catalog
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                  - ok
                  - tools
                properties:
                  ok:
                    type: boolean
                  caller_type:
                    type: string
                  count:
                    type: integer
                  tools:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        name:
                          type: string
                        displayName:
                          type: string
                        description:
                          type: string
                        method:
                          type: string
                        path:
                          type: string
                        inputSchema:
                          type: object
                          additionalProperties: true
                          properties: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Tool list failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /gpt/tools/call:
    post:
      tags:
        - admin-control
      security:
        - backendBearerAuth: []
      operationId: callAdminTool
      x-tenant-gpt-operationId: callTool
      x-openai-isConsequential: false
      summary: Execute any admin platform tool by name
      description: Executes a tool from admin_platform_endpoint_tools. Use listAdminTools to get tool names and inputSchema. Pass tool arguments in tool_args. Path params are substituted automatically. Returns the raw upstream response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
              properties:
                name:
                  type: string
                  description: Tool key from listAdminTools, e.g. repo_inspect, admin_control, admin_cloudflare, local_connector_self_repair.
                tool_args:
                  type: object
                  additionalProperties: true
                  description: Arguments matching the tool inputSchema. For connect_activate, pass mode and integration_modes here; for connect_device_install, pass device_id here; for admin_control pass tool, sql, args etc. here.
                  properties:
                    mode:
                      type: string
                      enum:
                        - managed
                        - dedicated
                      description: Activation mode for connect_activate.
                    device_id:
                      type: string
                      pattern: ^[a-z0-9-]{2,32}$
                      description: Stable lowercase device id for connect_device_install.
                    workspace_name:
                      type: string
                    integration_modes:
                      type: object
                      additionalProperties: true
                      description: Optional per-app managed/dedicated source policy.
                      properties: {}
                    n8n_activation_mode:
                      type: string
                      enum:
                        - managed_main_server
                        - self_hosted_local
                    provisioning_credential_mode:
                      type: string
                      enum:
                        - managed
                        - dedicated
                    app_key:
                      type: string
                    auth_type:
                      type: string
                    display_label:
                      type: string
      responses:
        '200':
          description: Upstream tool response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Tool not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Tool call failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /device/tools:
    get:
      tags:
        - admin-control
      security:
        - backendBearerAuth: []
      operationId: listDeviceTools
      summary: List device-tagged tools (MCP-style local device control surface)
      description: Returns the device-tagged subset of the admin or tenant tool registry. Use this MCP-style facade to control local device apps (n8n, browser, files, Windows, Cloudflare) primarily from auth.mad4b.com instead of the direct connector.mad4b.com schema.
      responses:
        '200':
          description: Device tool catalog
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                  - ok
                  - tools
                properties:
                  ok:
                    type: boolean
                  protocol:
                    type: string
                    example: openapi-mcp-facade
                  surface:
                    type: string
                    example: device
                  caller_type:
                    type: string
                  count:
                    type: integer
                  tools:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        name:
                          type: string
                        displayName:
                          type: string
                        description:
                          type: string
                        method:
                          type: string
                        path:
                          type: string
                        tags:
                          type: array
                          items:
                            type: string
                        inputSchema:
                          type: object
                          additionalProperties: true
                          properties: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Device tool list failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /device/tools/call:
    post:
      tags:
        - admin-control
      security:
        - backendBearerAuth: []
      operationId: callDeviceTool
      x-openai-isConsequential: false
      summary: Execute a device-tagged tool by name (MCP-style dispatch)
      description: Dispatches a device-tagged tool through the auth.mad4b.com facade. Rejects tool keys not tagged 'device' with 403. Reuses the gpt/tools dispatcher so audit, admin scope-grant resolution, and grant_dispatch logging keep working.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
              properties:
                name:
                  type: string
                  description: Device tool key from listDeviceTools, e.g. connector_n8n, connector_browser, connector_win, connector_files.
                tool_args:
                  type: object
                  additionalProperties: true
                  description: Arguments matching the device tool inputSchema.
                  properties: {}
      responses:
        '200':
          description: Upstream device tool response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Tool exists but is not in the device-tools surface
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tool not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Device tool call failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/cli/local-connector/install-bundle:
    get:
      tags:
        - admin-control
      security:
        - backendBearerAuth: []
      operationId: getLocalConnectorInstallBundle
      summary: Generate and upload local connector installer
      description: Generate a pre-filled Windows .bat installer for the local connector stack (cloudflared + Node.js service via NSSM). Reads cf_token and connector_secret from local_connector_user_configs in DB for the given user_id + device_id. Falls back to server env only if no DB row exists. Uploads to Google Dr.
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: string
          description: User ID whose device config to load from DB. Defaults to platform admin.
        - name: device_id
          in: query
          required: false
          schema:
            type: string
          description: Device ID (hostname) to load config for. Defaults to mohammedlap.
      responses:
        '200':
          description: Installer uploaded, drive link returned
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                  - ok
                  - drive
                properties:
                  ok:
                    type: boolean
                  drive_upload_status:
                    type: string
                    enum:
                      - uploaded
                      - failed
                      - not_configured
                      - attempted
                  drive_error:
                    oneOf:
                      - type: object
                        additionalProperties: true
                        properties: {}
                      - type: 'null'
                  drive:
                    oneOf:
                      - type: object
                        additionalProperties: true
                        properties:
                          file_id:
                            type: string
                          drive_link:
                            type: string
                          filename:
                            type: string
                      - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Install bundle generation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/cli/local-connector/self-repair:
    post:
      tags:
        - admin-control
      security:
        - backendBearerAuth: []
      operationId: repairLocalConnector
      x-openai-isConsequential: false
      summary: Self-repair the admin local connector
      description: CALL IMMEDIATELY when connector.mad4b.com returns error 1033 or HTTP 530 — do NOT just report the error. Reads device config (cf_token, connector_secret) from local_connector_user_configs in DB, checks Cloudflare tunnel health via API, generates a pre-filled Windows .bat installer (cloudflared + NS.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                user_id:
                  type: string
                  description: User ID whose device to repair. Defaults to platform admin.
                device_id:
                  type: string
                  description: Device hostname to repair. Defaults to mohammedlap.
      responses:
        '200':
          description: Self-repair result with diagnosis and drive link
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                  - ok
                  - diagnosis
                  - repair
                properties:
                  ok:
                    type: boolean
                  diagnosis:
                    type: object
                    additionalProperties: true
                    properties:
                      device_id:
                        type: string
                      tunnel_url:
                        type: string
                      cf_tunnel_id:
                        type: string
                      cf_tunnel_status:
                        type: string
                      config_source:
                        type: string
                        enum:
                          - db
                          - env
                          - env_fallback
                  repair:
                    type: object
                    additionalProperties: true
                    properties:
                      action:
                        type: string
                      drive_upload_status:
                        type: string
                        enum:
                          - uploaded
                          - failed
                          - not_configured
                          - attempted
                      drive_error:
                        oneOf:
                          - type: object
                            additionalProperties: true
                            properties: {}
                          - type: 'null'
                      drive:
                        oneOf:
                          - type: object
                            additionalProperties: true
                            properties:
                              file_id:
                                type: string
                              drive_link:
                                type: string
                              filename:
                                type: string
                          - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Self-repair failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/cli/dns:
    get:
      tags:
        - admin-control
      security:
        - backendBearerAuth: []
      operationId: listDnsRecords
      summary: List DNS records for a zone
      description: Lists all DNS records for the specified zone via Cloudflare API. Defaults to mad4b.com.
      parameters:
        - name: zone
