services:
  runtime-db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:?set DB_NAME in .env.staging}
      MARIADB_USER: ${DB_USER:?set DB_USER in .env.staging}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.staging}
      MARIADB_ROOT_PASSWORD: ${RUNTIME_DB_ROOT_PASSWORD:?set RUNTIME_DB_ROOT_PASSWORD in .env.staging}
    volumes:
      - runtime_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u$${MARIADB_USER} -p$${MARIADB_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  governance-db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${GOVERNANCE_DB_NAME:?set GOVERNANCE_DB_NAME in .env.staging}
      MARIADB_USER: ${GOVERNANCE_DB_USER:?set GOVERNANCE_DB_USER in .env.staging}
      MARIADB_PASSWORD: ${GOVERNANCE_DB_PASSWORD:?set GOVERNANCE_DB_PASSWORD in .env.staging}
      MARIADB_ROOT_PASSWORD: ${GOVERNANCE_DB_ROOT_PASSWORD:?set GOVERNANCE_DB_ROOT_PASSWORD in .env.staging}
    volumes:
      - governance_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u$${MARIADB_USER} -p$${MARIADB_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  persistence-db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${RUNTIME_PERSISTENCE_DB_NAME:?set RUNTIME_PERSISTENCE_DB_NAME in .env.staging}
      MARIADB_USER: ${RUNTIME_PERSISTENCE_DB_USER:?set RUNTIME_PERSISTENCE_DB_USER in .env.staging}
      MARIADB_PASSWORD: ${RUNTIME_PERSISTENCE_DB_PASSWORD:?set RUNTIME_PERSISTENCE_DB_PASSWORD in .env.staging}
      MARIADB_ROOT_PASSWORD: ${RUNTIME_PERSISTENCE_DB_ROOT_PASSWORD:?set RUNTIME_PERSISTENCE_DB_ROOT_PASSWORD in .env.staging}
    volumes:
      - persistence_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u$${MARIADB_USER} -p$${MARIADB_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    env_file:
      - .env.staging
    environment:
      NODE_ENV: staging
      DB_HOST: runtime-db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:?set DB_NAME in .env.staging}
      DB_USER: ${DB_USER:?set DB_USER in .env.staging}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.staging}
      GOVERNANCE_DB_HOST: governance-db
      GOVERNANCE_DB_PORT: 3306
      GOVERNANCE_DB_NAME: ${GOVERNANCE_DB_NAME:?set GOVERNANCE_DB_NAME in .env.staging}
      GOVERNANCE_DB_USER: ${GOVERNANCE_DB_USER:?set GOVERNANCE_DB_USER in .env.staging}
      GOVERNANCE_DB_PASSWORD: ${GOVERNANCE_DB_PASSWORD:?set GOVERNANCE_DB_PASSWORD in .env.staging}
      RUNTIME_PERSISTENCE_DB_HOST: persistence-db
      RUNTIME_PERSISTENCE_DB_PORT: 3306
      RUNTIME_PERSISTENCE_DB_NAME: ${RUNTIME_PERSISTENCE_DB_NAME:?set RUNTIME_PERSISTENCE_DB_NAME in .env.staging}
      RUNTIME_PERSISTENCE_DB_USER: ${RUNTIME_PERSISTENCE_DB_USER:?set RUNTIME_PERSISTENCE_DB_USER in .env.staging}
      RUNTIME_PERSISTENCE_DB_PASSWORD: ${RUNTIME_PERSISTENCE_DB_PASSWORD:?set RUNTIME_PERSISTENCE_DB_PASSWORD in .env.staging}
      REDIS_URL: redis://redis:6379
      QUEUE_WORKER_ENABLED: "FALSE"
      MIGRATION_APPLIED: "false"
      DATABASE_MUTATED: "false"
      PRODUCTION_MUTATION_AUTHORIZED: "false"
      RULESET_MUTATION_AUTHORIZED: "false"
    depends_on:
      runtime-db:
        condition: service_healthy
      governance-db:
        condition: service_healthy
      persistence-db:
        condition: service_healthy

volumes:
  runtime_db_data:
  governance_db_data:
  persistence_db_data:
