action_planner_dry_run for non-executed action planning and tenant_repository_intelligence_v3_v4_readiness_smoke for no-secret readiness validation; V3/V4 never comment, label, close, merge, patch, force-push, or apply migrations. Repository Intelligence V5 adds tenant_repository_advisory_comment_preview, tenant_repository_advisory_comment_apply, tenant_repository_advisory_comment_readback, and tenant_repository_advisory_comment_v5_readiness_smoke for approval-gated advisory PR comments. V5 apply is comment-only after approval and never labels, closes, merges, patches files, force-pushes, or applies migrations. These tools use platform_resource_authority_bindings, delegate PR reads to repo.pr.reconciliation_sweep, may write bounded audit_payload_evidence when requested, and do not comment, label, close, merge, patch, force-push, or apply migrations. Repository Governance V6 adds tenant_repository_intelligence_v6_report, tenant_repository_mutation_plan_v6, platform_repository_mutation_authority_binding_create_v6, tenant_repository_mutation_apply_v6, tenant_repository_mutation_readback_v6, and tenant_repository_governance_v6_readiness_smoke. V6 enforces tenant/workspace/user hierarchy, governed connected-system or platform-managed provider binding, exact-head CI evidence, branch overlap, main file-SHA parity, migration canonical replacement detection, and replay-safe mutation plans. Reports and plans never mutate repositories. Apply is available only for active action-specific recipes after authority binding, capability envelope, approved hold, typed confirmation, unchanged target SHA, same-cycle evidence, unique plan-item run reservation, audit evidence, and provider readback. Planned recipes fail closed, force-push is forbidden, and unknown provider outcomes require readback rather than replay.
