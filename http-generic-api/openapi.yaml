        card_id:
          type: string
        card_type:
          type: string
          enum: [kpi, trend, score, funnel, alert, recommendation, task, list, calendar, campaign, content_opportunity, lead_opportunity, connector_status, progress, comparison, status]
        title:
          type: string
        value: {}
        unit:
          type: [string, "null"]
        status:
          type: string
        change: {}
        metric_key:
          type: [string, "null"]
        interpretation:
          type: string
        tab_key:
          type: string
        actions:
          type: array
          items:
            $ref: "#/components/schemas/GrowthDashboardAction"
        data_status:
