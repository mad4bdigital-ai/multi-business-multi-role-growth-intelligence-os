  /audit-log:
    get:
      tags: [security]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: getAuditLog
      summary: Query the immutable audit log
      description: >
        The audit log is append-only; no UPDATE or DELETE is ever issued against it.
        Use actor_id, resource_type, tenant_id, and date range to filter entries.
      parameters:
        - { name: actor_id, in: query, schema: { type: string } }
        - { name: resource_type, in: query, schema: { type: string } }
        - { name: tenant_id, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, default: 100 } }
      responses:
        "200": { description: Audit log entries, content: { application/json: { schema: { $ref: "#/components/schemas/PlatformListResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /audit/evidence/smoke:
    post:
      tags: [security]
      security:
        - backendBearerAuth: []
        - backendApiKeyAuth: []
      operationId: runAuditPayloadEvidenceSmoke
      summary: Run audit payload evidence smoke
      description: >
        Writes a synthetic audit log row plus bounded, redacted request-response evidence,
        verifies SHA hashes and redacted previews, and confirms no secret values or tokens
        are returned. Cleanup is enabled by default.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditPayloadEvidenceSmokeRequest"
      responses:
        "200":
          description: Audit payload evidence smoke passed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPayloadEvidenceSmokeResponse"
        "500":
          description: Audit payload evidence smoke failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPayloadEvidenceSmokeResponse"

