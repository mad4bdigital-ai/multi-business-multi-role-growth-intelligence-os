      description: >
        Admin-only gated persistence surface. The route recomputes the current
        Ads Provider Governance snapshot proposal, verifies candidate_sha256,
        requires idempotency_key and a ready capability_envelope_id, and records
        snapshot/recommendation rows only when apply=true. Default behavior is
        dry-run. It never calls providers, reads credential payloads, mutates
        spend, performs external writes, deploys, publishes, or returns secrets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [candidate_sha256, idempotency_key, capability_envelope_id]
              properties:
                provider_key:
                  type: string
                  default: google_ads
                candidate_sha256:
                  type: string
                  minLength: 64
                  maxLength: 64
                idempotency_key:
                  type: string
                  minLength: 3
                  maxLength: 80
                capability_envelope_id:
                  type: string
                  minLength: 36
                  maxLength: 36
                apply:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Dry-run or recorded snapshot/recommendation response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [ok, mode, provider_key, plugin_key, candidate_sha256, idempotency_key, capability_envelope_id, execution, secrets_included]
                properties:
                  ok: { type: boolean, enum: [true] }
                  mode: { type: string, enum: [record_dry_run, recorded] }
                  provider_key: { type: string }
                  plugin_key: { type: string }
                  candidate_sha256: { type: string }
                  idempotency_key: { type: string }
                  capability_envelope_id: { type: string }
                  snapshot_key: { type: string }
                  recommendation_key: { type: string }
                  execution:
                    type: object
                    additionalProperties: true
                    properties:
                      will_execute_provider_call: { type: boolean, enum: [false] }
                      will_read_credential_payload: { type: boolean, enum: [false] }
                      will_change_spend: { type: boolean, enum: [false] }
                      will_external_write: { type: boolean, enum: [false] }
                      will_deploy: { type: boolean, enum: [false] }
                      will_publish: { type: boolean, enum: [false] }
                  secrets_included: { type: boolean, enum: [false] }
