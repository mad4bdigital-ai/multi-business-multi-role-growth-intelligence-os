  /connect/activate:
    post:
      tags: [tenant-connect]
      security: [userBearerAuth: []]
      operationId: postConnectActivate
      summary: Activate tenant backend connection
      description: "Activates the tenant backend connection in managed or dedicated mode. Optionally records Cloudflare account context for dedicated mode (tokens are never stored). Upserts tenant_backend_connections and returns the resolved connection."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [managed, dedicated]
                cloudflare_mode:
                  type: string
                google_auth_mode:
                  type: string
                n8n_activation_mode:
                  type: string
                  enum: [managed_main_server, self_hosted_local]
                cf_api_token:
                  type: string
                  description: Dedicated mode only — accepted but not stored.
                cf_account_id:
                  type: string
                hostinger_api_key:
                  type: string
      responses:
        "200":
          description: Activation result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [ok, connection]
                properties:
                  ok: { type: boolean }
                  connection:
                    type: object
                    additionalProperties: true
                  notice: { type: string }
        "400": { description: Invalid mode or activation parameters, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: No active tenant for this user, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { description: Activation write failure, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

