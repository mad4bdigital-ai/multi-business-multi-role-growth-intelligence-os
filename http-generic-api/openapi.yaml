                  kind:
                    type: string
                    enum: [ssh]
                  approval_request:
                    type: object
                    additionalProperties: true
                  execution_enabled:
                    type: boolean
                    enum: [false]
                  secrets_included:
                    type: boolean
                    enum: [false]
        "400": { description: Missing request_id. }
