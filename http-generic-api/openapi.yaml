                zone:
                  type: string
                  default: mad4b.com
                  description: Domain zone, e.g. mad4b.com.
                name:
                  type: string
                  description: Record name, e.g. api or connector.
                type:
                  type: string
                  enum: [A, AAAA, CNAME, TXT, MX, NS]
                  description: DNS record type.
                content:
                  type: string
                  description: Record value, e.g. an IP address or CNAME target.
                ttl:
                  type: integer
                  default: 1
                  description: TTL in seconds. 1 = auto.
                proxied:
                  type: boolean
                  default: false
                  description: Whether Cloudflare proxies the record.
      responses:
        "200":
          description: DNS record created or updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [ok, record]
                properties:
                  ok: { type: boolean }
                  action: { type: string, enum: [created, updated] }
                  record: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { description: DNS upsert failure, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    delete:
      tags: [admin-internal]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: deleteDnsRecord
      summary: Delete a DNS record by ID
      description: Deletes a DNS record from the specified zone using its Cloudflare record ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [record_id]
              properties:
                zone:
                  type: string
                  default: mad4b.com
                  description: Domain zone, e.g. mad4b.com.
                record_id:
                  type: string
                  description: Cloudflare DNS record ID to delete.
      responses:
        "200":
          description: DNS record deleted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [ok]
                properties:
                  ok: { type: boolean }
                  deleted_id: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { description: DNS delete failure, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /auth/platform-jwt/issue:
    post:
      tags: [admin-internal]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: issuePlatformJwtClientToken
      summary: Issue a short-lived tenant user JWT
      description: Admin-only platform JWT client. Mints a short-lived user JWT for an existing active user so governed tenant /connect/* calls can use user auth without relaxing tenant guards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                user_id:
                  type: string
                  description: Existing active platform user ID. Required when email is omitted.
                email:
                  type: string
                  description: Existing active platform user email. Required when user_id is omitted.
                tenant_id:
                  type: string
                  nullable: true
                  description: Optional tenant. When supplied, the user must have active membership.
                ttl_seconds:
                  type: integer
                  minimum: 60
                  maximum: 3600
                  default: 900
                reason:
                  type: string
                  description: Short audit hint for why the token is being issued.
      responses:
        "200":
          description: Short-lived user JWT issued
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  ok: { type: boolean }
                  token_type: { type: string, example: Bearer }
                  access_token: { type: string }
                  expires_in: { type: integer }
                  user: { type: object, additionalProperties: true }
                  tenant: { type: object, additionalProperties: true }
                  next_step: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Admin principal or tenant membership required, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { description: Platform JWT issue failure, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /admin/session-continuity/link-user:
    post:
      tags: [admin-internal]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: linkSessionContinuityUser
      summary: Link unassigned request envelopes to a user
      description: Assigns user_id to unlinked request_envelopes rows and backfills tenant_id when null. Use this as a governed alternative to raw SQL for session continuity repair.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user_id, tenant_id]
              properties:
                user_id:
                  type: string
                  format: uuid
                tenant_id:
                  type: string
                  format: uuid
                scope:
                  type: string
                  enum: [current_unlinked_sessions, tenant_unlinked_sessions]
                  default: current_unlinked_sessions
                  description: current_unlinked_sessions updates all rows with user_id null; tenant_unlinked_sessions limits updates to rows with matching tenant_id and user_id null.
      responses:
        "200":
          description: Session continuity rows linked
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, result]
                properties:
                  ok: { type: boolean }
                  result:
                    type: object
                    additionalProperties: false
                    required: [user_id, tenant_id, scope, matched_before, updated_rows, remaining_unlinked]
                    properties:
                      user_id: { type: string, format: uuid }
                      tenant_id: { type: string, format: uuid }
                      scope: { type: string, enum: [current_unlinked_sessions, tenant_unlinked_sessions] }
                      matched_before: { type: integer }
                      updated_rows: { type: integer }
                      remaining_unlinked: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { description: Session continuity linking failed, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /admin/schema-import/upload:
    post:
      tags: [admin-internal]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: importSchemaUpload
      summary: Upload a full OpenAPI schema file and split it into the registry
      description: Accepts a full OpenAPI 3.x schema string. Parses it, inlines $refs, splits per operation, upserts the parent action row and one endpoint row per operation with a compact dereferenced schema_json. Removed endpoints are deprecated. Returns a job record for audit and rollback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schema_yaml]
              properties:
                schema_yaml:
                  type: string
                  description: Full OpenAPI YAML or JSON content as a string. Use schema_json as an alias.
                schema_json:
                  type: string
                  description: Alias for schema_yaml - supply one or the other.
                action_key:
                  type: string
                  description: Override the action_key derived from the schema info.title slug. Useful when the title does not produce a clean key.
                filename:
                  type: string
                  description: Original filename for audit purposes, e.g. openapi.wordpress.yaml.
                imported_by:
                  type: string
                  description: Actor reference logged against the import job.
      responses:
        "200":
          description: Import completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  job_id: { type: string }
                  action_key: { type: string }
                  endpoints_upserted: { type: integer }
                  endpoints_deprecated: { type: integer }
                  warnings: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: Schema parse or import failure, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /admin/schema-import/repo:
    post:
      tags: [admin-internal]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: importSchemaFromRepo
      summary: Install an OpenAPI schema directly from a GitHub or GitLab repo URL
      description: >
        Fetches the schema file from a GitHub or GitLab repository (converting the repo URL
        to a raw content URL automatically), then runs the same splitter pipeline as the
        upload endpoint. Supports pinning to a specific branch, tag, or commit via ref.
        Returns a job record for audit and rollback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo_url]
              properties:
                repo_url:
                  type: string
                  description: GitHub repo URL (e.g. https://github.com/owner/repo) or a direct raw schema URL.
                path_in_repo:
                  type: string
                  default: openapi.yaml
                  description: Path to the schema file within the repo. Defaults to openapi.yaml.
                ref:
                  type: string
                  default: main
                  description: Git branch, tag, or commit SHA to fetch from. Defaults to main.
                action_key:
                  type: string
                  description: Override the action_key derived from the schema info.title slug.
                imported_by:
                  type: string
      responses:
        "200":
          description: Import completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  job_id: { type: string }
                  action_key: { type: string }
                  endpoints_upserted: { type: integer }
                  endpoints_deprecated: { type: integer }
                  warnings: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: Fetch or import failure, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /admin/schema-import/rollback:
    post:
      tags: [admin-import]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: rollbackSchemaImport
      summary: Restore endpoint schemas to a previous import job's snapshot
      description: Restores endpoint schema_json values for the given action_key to the state captured in the target job's snapshots. Post-job endpoints are deprecated; removed endpoints restored to active. Creates a new rollback job row for audit - the original job is never mutated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action_key, job_id]
              properties:
                action_key:
                  type: string
                  description: The action_key to roll back.
                job_id:
                  type: string
                  description: The schema_import_jobs.job_id to restore from. Must have status=completed.
                requested_by:
                  type: string
                  description: Actor reference logged against the rollback job.
      responses:
        "200":
          description: Rollback completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  job_id: { type: string }
                  action_key: { type: string }
                  endpoints_restored: { type: integer }
                  rolled_back_to_job: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: Rollback failure - job not found or not completed, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /admin/schema-import/jobs:
    get:
      tags: [admin-control]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: listSchemaImportJobs
      summary: List schema import jobs with optional action_key filter
      parameters:
        - name: action_key
          in: query
          schema: { type: string }
          description: Filter by action_key. Omit to list all jobs.
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        "200":
          description: Job list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  count: { type: integer }
                  jobs:
                    type: array
                    items: { $ref: "#/components/schemas/SchemaImportJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/schema-import/jobs/{job_id}:
    get:
      tags: [admin-import]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: getSchemaImportJob
      summary: Get a single schema import job including endpoint snapshots
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Job detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  job:
                    allOf:
                      - $ref: "#/components/schemas/SchemaImportJob"
                      - type: object
                        properties:
                          endpoint_snapshots:
                            type: array
                            items:
                              type: object
                              properties:
                                path: { type: string }
                                method: { type: string }
                                operationId: { type: string }
                                schema_json: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /release/readiness:
    get:
      tags: [release]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: getReleaseReadiness
      summary: Run 61-check platform release readiness report
      description: >
        Checks DB connectivity, all 48 platform tables, 7 legacy tables, seed data
        integrity (plans, assistance roles, quota rules, tenants), and migration
        inventory. Returns overall pass/warn/fail with per-check detail.
        Use ?summary=true for a lightweight uptime-probe-friendly response.
        Use ?persist=true to write results to release_readiness_log.
      parameters:
        - { name: persist, in: query, schema: { type: boolean, default: false } }
        - { name: summary, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: All checks passed (or warn-level issues only)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseReadinessResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: One or more checks failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseReadinessResponse" }

  /release/session-archive-smoke:
    post:
      tags: [release]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: runSessionArchiveSmoke
      summary: Run live GPT session archive Drive writeback smoke
      description: >
        Writes a tiny synthetic GPT action session, appends user and assistant
        turns to Drive, closes the archive, and verifies Google Doc readback,
        Tool_Calls.jsonl readback, SQL preview/hash/pointer storage, and
        activation/session-context Drive URL readback. Intended for daily
        scheduler or uptime monitor probes.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionArchiveSmokeRequest" }
      responses:
        "200":
          description: Smoke passed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionArchiveSmokeResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: Smoke failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionArchiveSmokeResponse" }

  /release/readiness-history:
    get:
      tags: [release]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: getReleaseReadinessHistory
      summary: List past readiness run summaries from release_readiness_log
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 10, maximum: 50 } }
      responses:
        "200":
          description: Run history
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, runs, count]
                properties:
                  ok: { type: boolean }
                  count: { type: integer }
                  runs:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        run_id: { type: string }
                        checked_at: { type: string, format: date-time }
                        pass_count: { type: integer }
                        fail_count: { type: integer }
                        warn_count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /release/readiness-history/{run_id}:
    get:
      tags: [release]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: getReleaseReadinessRun
      summary: Get per-check detail for a specific readiness run
      parameters:
        - { name: run_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Run detail
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [ok, run_id, overall, checks]
                properties:
                  ok: { type: boolean }
                  run_id: { type: string }
                  overall: { type: string, enum: [pass, warn, fail] }
                  checks:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        check_key: { type: string }
                        status: { type: string, enum: [pass, warn, fail] }
                        detail: { type: string }
                        checked_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /release/entity-classification:
    post:
      tags: [release]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: upsertEntityClassification
      summary: Upsert entity classification entries in data_migration_inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [entity_class, table_name]
                  properties:
                    entity_class: { type: string }
                    table_name: { type: string }
                    authority_model: { type: string, enum: [canonical, transitional, legacy] }
                    read_priority: { type: integer }
                    write_strategy: { type: string, enum: [platform_primary, legacy_primary, dual_write] }
                    migration_status: { type: string, enum: [not_started, in_progress, complete] }
                    notes: { type: string }
                - type: array
                  items:
                    type: object
                    required: [entity_class, table_name]
                    properties:
                      entity_class: { type: string }
                      table_name: { type: string }
                      authority_model: { type: string }
                      read_priority: { type: integer }
                      write_strategy: { type: string }
                      migration_status: { type: string }
                      notes: { type: string }
      responses:
        "200":
          description: Entries upserted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, written, total]
                properties:
                  ok: { type: boolean }
                  written: { type: integer }
                  total: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      tags: [release]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: listEntityClassifications
      summary: List all entity classification entries (authority model inventory)
      responses:
        "200":
          description: Entity classification list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, classifications, count]
                properties:
                  ok: { type: boolean }
                  count: { type: integer }
                  classifications:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        entity_class: { type: string }
                        table_name: { type: string }
                        authority_model: { type: string }
                        read_priority: { type: integer }
                        write_strategy: { type: string }
                        migration_status: { type: string }
                        row_count: { type: integer }
                        notes: { type: string }
                        last_checked_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # â”€â”€ Connector Dispatch (Sprint 09) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

  /connector/dispatch:
    post:
      tags: [planner]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: connectorDispatch
      summary: Dispatch a connector execution (WordPress transport or content workflow)
      description: >
        Sprint 09 bridge. Accepts either an existing plan_id or creates an ad-hoc
        execution plan from brand_key + workflow_key + tenant_id, then dispatches
        immediately. Use apply=false (default) for dry-run preview.
        WordPress connector resolves brand credentials and calls runWordpressConnectorMigration.
        Content workflows queue async dispatch and return a run_id to poll.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan_id: { type: string, format: uuid, description: "Existing validated/approved plan. If omitted an ad-hoc plan is created." }
                tenant_id: { type: string, format: uuid }
                user_id: { type: string, format: uuid }
                brand_key: { type: string }
                target_key: { type: string }
                workflow_id: { type: string, description: "Exact workflow execution identity. Takes precedence over workflow_key." }
                workflow_key: { type: string, description: "Workflow family or compatibility key. Must resolve to one active workflow when workflow_id is omitted." }
                intent_key: { type: string }
                apply: { type: boolean, default: false }
                post_types: { type: array, items: { type: string }, default: ["post"] }
                publish_status: { type: string, enum: [draft, publish, private], default: draft }
      responses:
        "200":
          description: Dispatch completed or queued
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, run_id, trace_id, plan_id, connector_type]
                properties:
                  ok: { type: boolean }
                  run_id: { type: string }
                  trace_id: { type: string }
                  plan_id: { type: string }
                  connector_type: { type: string, enum: [wordpress, content_workflow] }
                  plan_status: { type: string }
                  apply: { type: boolean }
                  duration_ms: { type: integer }
                  result: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Access denied â€” requires human approval, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /connector/dispatch/status/{run_id}:
    get:
      tags: [planner]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: getConnectorDispatchStatus
      summary: Poll connector dispatch status by workflow run ID
      parameters:
        - { name: run_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Run status with steps, content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /connector/history:
    get:
      tags: [planner]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: getConnectorHistory
      summary: List recent connector dispatches for a tenant
      parameters:
        - { name: tenant_id, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200": { description: Dispatch history, content: { application/json: { schema: { $ref: "#/components/schemas/PlatformListResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /planner/plans/{plan_id}/execute:
    post:
      tags: [planner]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: executePlan
      summary: Execute a validated/approved plan via the connector dispatch engine
      parameters:
        - { name: plan_id, in: path, required: true, schema: { type: string } }
        - { name: apply, in: query, schema: { type: boolean, default: false } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                apply: { type: boolean, default: false }
                post_types: { type: array, items: { type: string } }
                publish_status: { type: string, enum: [draft, publish, private], default: draft }
      responses:
        "200": { description: Execution dispatched, content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /planner/plans/{plan_id}/compile:
    post:
      tags: [planner]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: compileSequentialPlan
      summary: Compile ordered plan steps with dependencies and execution policies
      parameters:
        - { name: plan_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, steps]
              properties:
                tenant_id: { type: string }
                steps:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [step_key, step_type]
                    properties:
                      step_key: { type: string }
                      step_type: { type: string, enum: [workflow, analysis, checkpoint, approval, stop] }
                      workflow_id: { type: string }
                      workflow_key: { type: string }
                      depends_on: { type: array, items: { type: string } }
                      input: { type: object, additionalProperties: true }
                      success_criteria: { type: object, additionalProperties: true }
                      retry_policy: { type: object, additionalProperties: true }
                      approval_policy: { type: object, additionalProperties: true }
                      idempotency_key: { type: string }
      responses:
        "201": { description: Sequential plan compiled and validated }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /planner/plans/{plan_id}/tick:
    post:
      tags: [planner]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: tickSequentialPlan
      summary: Atomically claim and execute the next ready plan step
      parameters:
        - { name: plan_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: One sequential plan tick completed or stopped at a gate }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /planner/plans/{plan_id}/run:
    post:
      tags: [planner]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: runSequentialPlan
      summary: Execute ready plan steps sequentially until a stop condition
      parameters:
        - { name: plan_id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                max_ticks: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200": { description: Sequential execution timeline for this invocation }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /planner/plans/{plan_id}/resume:
    post:
      tags: [planner]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: resumeSequentialPlan
      summary: Resume a paused, blocked, or retryable sequential plan
      parameters:
        - { name: plan_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Plan returned to validated state without executing a step }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /planner/plans/{plan_id}/enqueue:
    post:
      tags: [planner]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: enqueueSequentialPlan
      summary: Enqueue bounded sequential execution in the background worker
      description: The worker continues until approval, blocked, paused, failed, cancelled, completed, or max_ticks.
      parameters:
        - { name: plan_id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                idempotency_key: { type: string }
                execution_trace_id: { type: string }
                max_ticks: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200": { description: Existing idempotent job returned }
        "202": { description: Sequential plan job queued }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: Background queue unavailable }

  /planner/plans/{plan_id}/timeline:
    get:
      tags: [planner]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: getSequentialPlanTimeline
      summary: Read the compiled steps and append-only event timeline
      parameters:
        - { name: plan_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Plan, compiled steps, and transition events }
