                  ok: { type: boolean }
                  scope: { type: string }
                  version: { type: string }
                  permitted_operations:
                    type: array
                    items: { type: string }
                  connection_modes:
                    type: array
                    items: { type: string }
                  onboarding_url: { type: string }

  /connect/status:
    get:
      tags: [tenant-connect]
      security: [userBearerAuth: []]
      operationId: getConnectStatus
      summary: Tenant connection status for signed-in user
      description: "Returns the signed-in user, their active tenant membership, the tenant backend connection (mode, status, cloudflare_mode, google_auth_mode, n8n_activation_mode), and the user's configured devices. Requires user JWT."
      responses:
        "200":
          description: Connection status payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [ok, user, tenant, connection, devices]
                properties:
                  ok: { type: boolean }
                  user:
                    type: object
                    additionalProperties: true
                  tenant:
                    type: object
                    additionalProperties: true
                  connection:
                    type: object
                    additionalProperties: true
                  devices:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: User not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
