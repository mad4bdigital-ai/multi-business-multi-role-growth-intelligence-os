      security: [userBearerAuth: []]
      operationId: updateConnectIntegrationPolicy
      summary: Update per-app managed/dedicated integration source policy
      description: Keeps tenant activation mode canonical while allowing mixed per-app credential sources.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [integration_modes]
              additionalProperties: false
              properties:
                integration_modes:
                  type: object
                  additionalProperties: true
                  description: >
                    Example: { cloudflare: dedicated, hostinger: dedicated, google_drive: managed }
      responses:
        "200":
          description: Updated hybrid integration policy and readiness
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [ok, hybrid_integration_readiness]
                properties:
                  ok: { type: boolean }
                  hybrid_integration_readiness:
                    type: object
                    additionalProperties: true
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /connect/api/credential-intake/sessions:
    post:
      tags: [connect-api]
      security: [userBearerAuth: []]
      operationId: createConnectCredentialIntakeSession
      summary: Create a user-scoped secure credential intake link
      description: Creates a short-lived URL where the signed-in tenant user can enter integration secrets outside GPT chat.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_key, auth_type]
              additionalProperties: true
              properties:
                app_key: { type: string }
                auth_type:
                  type: string
                  enum: [api_key, bearer_token, basic_auth, mcp, webhook, custom_headers, client_credentials, ssh_key_pair, remote_database]
                display_label: { type: string }
                api_base_url: { type: string, format: uri }
                mcp_endpoint: { type: string, format: uri }
                webhook_url: { type: string, format: uri }
                expires_in_minutes: { type: integer, minimum: 1, maximum: 1440 }
                metadata:
                  type: object
                  additionalProperties: true
                credential_schema:
                  type: object
                  additionalProperties: true
      responses:
        "201":
          description: Credential intake session created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [ok, session_id, intake_url, app_key, auth_type]
                properties:
                  ok: { type: boolean }
                  session_id: { type: string }
                  intake_url: { type: string, format: uri }
                  expires_at: { type: string }
                  app_key: { type: string }
                  auth_type: { type: string }
                  secret_exposed: { type: boolean, enum: [false] }
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /connect/api/credential-intake/sessions/{session_id}/wait:
    get:
      tags: [connect]
      security:
        - backendBearerAuth: []
      operationId: waitConnectCredentialIntakeSession
      summary: Wait for tenant credential intake completion
      description: Long-polls a tenant-scoped credential-intake session and returns completion metadata plus connection_id without exposing submitted secrets. Intended for automated post-intake verification flows and webhook-safe completion handling.
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
        - name: timeout_ms
          in: query
          required: false
          schema:
            type: integer
            minimum: 1000
            maximum: 60000
            default: 15000
        - name: interval_ms
          in: query
          required: false
          schema:
            type: integer
            minimum: 250
            maximum: 5000
            default: 1000
      responses:
        "200":
          description: Intake completed and connection_id is available.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  ok: { type: boolean }
                  session_id: { type: string }
                  status: { type: string }
                  completed: { type: boolean }
                  connection_id: { type: string, nullable: true }
                  webhook_safe_event: { type: string }
                  secrets_included: { type: boolean, enum: [false] }
        "202":
          description: Intake is still pending or timed out without completion.
        "400": { description: Missing or invalid session_id. }
        "401": { description: Missing or invalid tenant user JWT. }
        "404": { description: Intake session not found for this caller. }
        "500": { description: Unexpected intake wait failure. }

  /connect/api/cms/claims:
    get:
      tags: [connect-api]
      security: [userBearerAuth: []]
      operationId: listConnectApiCmsClaims
      summary: List the user's CMS account claims
      responses:
        "200": { description: User's CMS claims, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [connect-api]
      security: [userBearerAuth: []]
      operationId: createConnectApiCmsClaim
      summary: Verify a user-supplied WordPress account and create a private claim
      description: "Calls /wp/v2/users/me on the supplied site with Basic auth (username + application_password), creates an encrypted user_app_connections row, a private credential_bindings row, and a cms_account_claims row. user_id is taken from the authenticated session and rejected if present in the body. Secrets are never returned."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [site_url, username, application_password]
              properties:
                site_url: { type: string, description: "Site URL or domain. www and trailing slashes are normalized away." }
                username: { type: string }
                application_password: { type: string, description: "WordPress application password. Never logged or returned." }
                requested_scope: { type: string, enum: [personal, workspace, tenant_brand], default: personal }
      responses:
        "201":
          description: Claim verified and created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [ok, status, claim_id, connection_id]
                properties:
                  ok: { type: boolean }
                  status: { type: string }
                  claim_id: { type: string }
                  connection_id: { type: string }
                  app_key: { type: string }
                  normalized_domain: { type: string }
                  matched_brand_key:
                    oneOf: [{ type: string }, { type: "null" }]
                  match_confidence: { type: string, enum: [none, low, medium, high, verified] }
                  approval_required: { type: boolean }
                  next_action: { type: string }
        "400": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: WordPress rejected the credentials, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "502": { description: WordPress unreachable or non-auth error, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "504": { description: WordPress verification timeout, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /connect/api/cms/claims/{claim_id}/approve:
    post:
      tags: [connect-api]
      security: [userBearerAuth: []]
      operationId: approveConnectApiCmsClaim
      summary: Approve a CMS claim for workspace/tenant sharing
      parameters:
        - { name: claim_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Approval result, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /connect/api/cms/claims/{claim_id}/reject:
    post:
      tags: [connect-api]
      security: [userBearerAuth: []]
      operationId: rejectConnectApiCmsClaim
      summary: Reject a CMS claim
      parameters:
        - { name: claim_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Rejection result, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /platform/agent-governance/response-profile/resolve:
