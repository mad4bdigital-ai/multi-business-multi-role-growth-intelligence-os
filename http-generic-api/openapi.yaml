                      type: string
                      enum: [managed_main_server, self_hosted_local]
                    provisioning_credential_mode:
                      type: string
                      enum: [managed, dedicated]
                    app_key:
                      type: string
                    auth_type:
                      type: string
                    display_label:
                      type: string
      responses:
        "200":
          description: Upstream tool response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Tool not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { description: Tool call failure, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /device/tools:
    get:
      tags: [admin-control]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: listDeviceTools
      summary: List device-tagged tools (MCP-style local device control surface)
      description: "Returns the device-tagged subset of the admin or tenant tool registry. Use this MCP-style facade to control local device apps (n8n, browser, files, Windows, Cloudflare) primarily from auth.mad4b.com instead of the direct connector.mad4b.com schema."
      responses:
        "200":
          description: Device tool catalog
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [ok, tools]
                properties:
                  ok: { type: boolean }
                  protocol: { type: string, example: openapi-mcp-facade }
                  surface: { type: string, example: device }
                  caller_type: { type: string }
                  count: { type: integer }
                  tools:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        name: { type: string }
                        displayName: { type: string }
                        description: { type: string }
                        method: { type: string }
                        path: { type: string }
                        tags: { type: array, items: { type: string } }
                        inputSchema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { description: Device tool list failure, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /device/tools/call:
    post:
      tags: [admin-control]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: callDeviceTool
      x-openai-isConsequential: false
      summary: Execute a device-tagged tool by name (MCP-style dispatch)
      description: "Dispatches a device-tagged tool through the auth.mad4b.com facade. Rejects tool keys not tagged 'device' with 403. Reuses the gpt/tools dispatcher so audit, admin scope-grant resolution, and grant_dispatch logging keep working."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  description: "Device tool key from listDeviceTools, e.g. connector_n8n, connector_browser, connector_win, connector_files."
                tool_args:
                  type: object
                  additionalProperties: true
                  description: Arguments matching the device tool inputSchema.
      responses:
        "200":
          description: Upstream device tool response
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Tool exists but is not in the device-tools surface, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Tool not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { description: Device tool call failure, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /admin/control:
    post:
      tags: [admin-internal]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: executeAdminControl
      summary: Execute personal admin control operation
      x-runtime-governance:
        github_rest_fallback_continuation:
          policy: repair_missing_capability_before_fallback
          shared_reconciliation_checkpoint: true
          repair_attempts_before_fallback: 3
          secrets_included: false
      description: >
        Root-level personal administrator endpoint for GitHub CLI, gcloud CLI,
        remote database SQL control through the configured application pool, and
        local runtime environment inspection or mutation, plus disabled-by-default
        allowlisted local Windows app launch. This endpoint is intended only for the
        owner's private admin surface and requires backend API key auth. Custom GPT
        schemas should call this through /gpt/tools/call using the admin_control tool
        so read-only diagnostics do not cross an OpenAI approval boundary.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tool]
              allOf:
                - if:
                    properties:
                      tool:
                        const: db
                    required: [tool]
                  then:
                    required: [sql]
                - if:
                    properties:
                      tool:
                        const: shell
                    required: [tool]
                  then:
                    required: [action, alias]
              properties:
                tool:
                  type: string
                  enum: [github, gcloud, db, env, windows_app, hostinger, cloudflare, shell]
                args:
                  type: array
                  items: { type: string }
                  description: Arguments for github, gcloud, or shell tools.
                timeout_ms:
                  type: integer
                  minimum: 1000
                  maximum: 600000
                  default: 120000
                  description: Request timeout in milliseconds. Use timeout_ms (not timeout).
                sql:
                  type: string
                  description: SQL statement for the db tool.
                params:
                  type: array
                  items: {}
                  description: Positional SQL parameters for the db tool.
                action:
                  type: string
                  enum: [run, list, get, set, unset, status, authorize, launch]
                  default: list
                  description: Action selector. Use run for db and shell execution, list/get/set/unset for env, and status/authorize/list/launch for windows_app.
                name:
                  type: string
                  description: Environment variable name for env get, set, or unset.
                value:
                  type: string
                  description: Environment variable value for env set.
                include_values:
                  type: boolean
                  default: false
                  description: Include environment values when listing variables.
                reveal_values:
                  type: boolean
                  default: false
                  description: Return unmasked environment values, including sensitive-looking names.
                alias:
                  type: string
                  description: Shell command alias to run from ADMIN_SHELL_ALLOWLIST when tool=shell action=run.
                app_alias:
                  type: string
                  description: Allowlisted local Windows app alias for windows_app launch.
      responses:
        "200":
          description: Admin control operation result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [ok, tool, result]
                properties:
                  ok: { type: boolean }
                  tool: { type: string, enum: [github, gcloud, db, env, windows_app, hostinger, cloudflare, shell] }
                  result: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { description: Admin control execution failure, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /admin/cli/hostinger:
    post:
      tags: [admin-internal]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: executeHostingerApiCall
      summary: Forward a call to the Hostinger REST API
      description: Proxies any Hostinger API call using server-stored API keys. Use cloud_plan key for VPS, DNS, domains, and billing. Use shared_manager key for shared hosting. Supply the path only, e.g. /v1/dns/zone/mad4b.com/records.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [path]
              properties:
                path:
                  type: string
                  description: "Hostinger API path, e.g. /v1/dns/zone/mad4b.com/records or /v1/vps/virtual-machines"
                method:
                  type: string
                  enum: [GET, POST, PUT, DELETE, PATCH]
                  default: GET
                request_body:
                  type: object
                  additionalProperties: true
                  description: JSON body for POST/PUT/PATCH requests.
                params:
                  type: object
                  additionalProperties: true
                  description: Query string parameters to append.
                api_key_ref:
                  type: string
                  enum: [cloud_plan, shared_manager]
                  default: cloud_plan
                  description: cloud_plan for VPS/DNS/domains/billing; shared_manager for shared hosting.
      responses:
        "200":
          description: Hostinger API response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [ok, result]
                properties:
                  ok: { type: boolean }
                  result:
                    type: object
                    additionalProperties: true
                    properties:
                      status: { type: integer }
                      ok: { type: boolean }
                      data:
                        type: object
                        additionalProperties: true
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { description: Hostinger API call failure, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /admin/cli/cloudflare:
    post:
      tags: [admin-internal]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: executeCloudflareApiCall
      summary: Forward a call to the Cloudflare REST API
      description: Proxies any Cloudflare API call using server-stored credentials. Supply the path only, e.g. /client/v4/zones or /client/v4/tunnels/{tunnel_id}.
      requestBody:
