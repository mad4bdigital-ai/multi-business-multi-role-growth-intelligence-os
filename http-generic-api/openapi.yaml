        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [device_id]
              properties:
                device_id:
                  type: string
                  description: 2-64 alphanumeric, dash, or underscore characters.
                hostname:
                  type: string
                cloudflare_connection_id:
                  type: string
                hostinger_connection_id:
                  type: string
                local_apps:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
