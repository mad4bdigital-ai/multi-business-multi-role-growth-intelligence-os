      responses:
        "200": { description: Decision recorded; no execution dispatched }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Growth Intelligence action not found }
        "409": { description: Linked approval hold is not open }

