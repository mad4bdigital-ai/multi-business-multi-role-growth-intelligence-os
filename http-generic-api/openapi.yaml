                  result:
                    type: object
                    additionalProperties: true
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { description: Cloudflare API call failure, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /admin/scope-grants:
    post:
      tags: [admin-control]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: createAdminScopeGrant
      x-custom-gpt-exclude: true
      summary: Issue a scope grant lending a tenant user a normally admin-only DB tool
      description: "Records a time-bounded scope grant in admin_scope_grants. When the named tenant user calls /gpt/tools/call with source_tool_key, the dispatcher consults this row before returning tool_not_found, validates args against allowed_actions and allowed_args, and dispatches the admin tool. Every dispatch is written to audit_log with grant_id as resource_id."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, user_id, source_tool_key]
              properties:
                tenant_id: { type: string, format: uuid }
                user_id: { type: string, format: uuid }
                source_tool_key:
                  type: string
                  description: "tool_key from admin_platform_endpoint_tools to lend, e.g. connector_ps or admin_control."
                allowed_actions:
                  type: array
                  items: { type: string }
                  description: "Optional whitelist of action enum values inside the called tool. Omit or pass empty array to allow all actions defined in the tool input schema."
                allowed_args:
                  type: object
                  additionalProperties: true
                  description: "Optional pinned arg constraints. Scalar values pin exact match; array values whitelist any of the listed values."
                reason: { type: string }
                expires_at:
                  type: string
                  format: date-time
                  description: "Optional grant expiry. Grants with no expires_at remain active until revoked."
      responses:
        "201":
          description: Scope grant created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [ok, grant]
                properties:
                  ok: { type: boolean }
                  grant:
                    type: object
                    additionalProperties: true
                    properties:
                      grant_id: { type: string, format: uuid }
                      tenant_id: { type: string, format: uuid }
                      user_id: { type: string, format: uuid }
                      source_tool_key: { type: string }
                      allowed_actions: { type: array, items: { type: string } }
                      allowed_args: { type: object, additionalProperties: true }
                      reason: { type: string }
                      granted_by: { type: string }
                      expires_at: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: source_tool_key not found in admin_platform_endpoint_tools, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    get:
      tags: [admin-control]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: listAdminScopeGrants
      x-custom-gpt-exclude: true
      summary: List admin scope grants with optional filters
      description: "Lists rows from admin_scope_grants. By default returns only active grants. Use active_only=false to include revoked or expired rows."
      parameters:
        - { name: tenant_id, in: query, schema: { type: string } }
        - { name: user_id, in: query, schema: { type: string } }
        - { name: source_tool_key, in: query, schema: { type: string } }
        - { name: active_only, in: query, schema: { type: boolean, default: true } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Scope grant list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [ok, grants, count]
                properties:
                  ok: { type: boolean }
                  count: { type: integer }
                  grants:
                    type: array
                    items: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/scope-grants/{grant_id}:
    delete:
      tags: [admin-control]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: revokeAdminScopeGrant
      x-custom-gpt-exclude: true
      summary: Revoke an active scope grant
      description: "Sets revoked_at and revoked_by on admin_scope_grants. The row is not deleted so audit history stays intact. Subsequent dispatches matching this grant will fall back to tool_not_found."
      parameters:
        - { name: grant_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200":
          description: Scope grant revoked
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [ok, grant_id]
                properties:
                  ok: { type: boolean }
                  grant_id: { type: string }
                  revoked_at: { type: string, format: date-time }
                  revoked_by: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Grant not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "409": { description: Grant already revoked, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /me/scope-grants:
    get:
      tags: [identity]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: listMyScopeGrants
      summary: List scope grants issued to the signed-in user
      description: "Returns admin_scope_grants rows where tenant_id and user_id match the signed-in principal. Active grants only by default. Requires user JWT or api_credential auth; admin BACKEND_API_KEY callers get 400 because the route is per-user."
      parameters:
        - { name: active_only, in: query, schema: { type: boolean, default: true } }
      responses:
        "200":
          description: Self scope grant list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [ok, grants, count]
                properties:
                  ok: { type: boolean }
                  count: { type: integer }
                  grants:
                    type: array
                    items: { type: object, additionalProperties: true }
        "400": { description: Token missing tenant_id or user_id, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/cli/local-connector/install-bundle:
    get:
      tags: [admin-control]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: getLocalConnectorInstallBundle
      summary: Resolve or download a local connector installer
      description: "Generate a pre-filled Windows .bat installer for the local connector stack (cloudflared + Node.js service via NSSM). Reads cf_token and connector_secret from local_connector_user_configs in DB for the given user_id + device_id. Falls back to server env only if no DB row exists. The default JSON mode returns metadata before credential lookup. The installer is generated only when format=bat is requested on the authenticated route and is never uploaded to shared or public storage. User saves the .bat and runs as Administrator — cloudflared and NSSM are installed automatically if missing. Both services auto-restart on failure and reboot."
      parameters:
        - name: user_id
          in: query
          required: false
          schema: { type: string }
          description: User ID whose device config to load from DB. Defaults to platform admin.
        - name: device_id
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 128, default: mohammedlap }
          description: Device ID (hostname) to load config for. Defaults to mohammedlap.
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [json, bat], default: json }
          description: json returns a no-secret handoff; bat returns the authenticated binary installer.
      responses:
        "200":
          description: Metadata-only secure handoff or authenticated installer attachment
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, artifact_delivery, script_content_omitted, credential_materialized, public_storage_allowed, secure_download, secrets_included]
                properties:
                  ok: { type: boolean, const: true }
                  artifact_delivery: { type: string, const: authenticated_direct_download_only }
                  script_content_omitted: { type: boolean, const: true }
                  script_content_reason: { type: string }
                  credential_materialized: { type: boolean, const: false }
                  public_storage_allowed: { type: boolean, const: false }
                  secure_download:
                    type: object
                    additionalProperties: false
                    required: [method, path, query, requires_backend_api_key, requires_admin_principal]
                    properties:
                      method: { type: string, const: GET }
                      path: { type: string, const: /admin/cli/local-connector/install-bundle }
                      query:
                        type: object
                        additionalProperties: false
                        required: [user_id, device_id, format]
                        properties:
                          user_id: { type: string }
                          device_id: { type: string }
                          format: { type: string, const: bat }
                      requires_backend_api_key: { type: boolean, const: true }
                      requires_admin_principal: { type: boolean, const: true }
                  secrets_included: { type: boolean, const: false }
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/cli/local-connector/self-repair:
    post:
      tags: [admin-control]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: repairLocalConnector
      x-openai-isConsequential: false
      summary: Diagnose local connector health and return a secure installer handoff
      x-runtime-governance:
        local_connector_tunnel_provisioning_continuation:
          policy: local_connector_tunnel_provisioning_continuation_contract
          interruption_signal: connector_tunnel_provisioning_required
          required_next_action: provision_tunnel_token
          status_code: 409
          shared_reconciliation_checkpoint: true
          secrets_included: false
      description: "Retry bounded connector health up to three total attempts for transient 1033/HTTP 530. Stop on pass or authorization-gated reachability. The JSON response never generates or uploads installer content; after retry exhaustion and degraded readback it returns a no-secret diagnosis, retry evidence, and an authenticated admin-only direct-download handoff. The installer is generated only through the authenticated format=bat route and is never uploaded to shared or public storage."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                user_id:
                  type: string
                  description: User ID whose device to repair. Defaults to platform admin.
                device_id:
                  type: string
                  description: Device hostname to repair. Defaults to mohammedlap.
      responses:
        "200":
          description: Diagnosis and no-secret authenticated repair handoff
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, diagnosis, repair]
                properties:
                  ok: { type: boolean, const: true }
                  diagnosis:
                    type: object
                    additionalProperties: true
                    required: [secrets_included]
                    properties:
                      device_id: { type: string }
                      tunnel_url: { type: string }
                      cf_tunnel_id: { type: string }
                      cf_tunnel_status: { type: string }
                      config_source: { type: string, enum: [db, db_alias, env, env_fallback] }
                      secrets_included: { type: boolean, const: false }
                  repair:
                    type: object
                    additionalProperties: true
                    required: [required, installer_generated, artifact_delivery, public_storage_allowed, secure_download, secrets_included]
                    properties:
                      required: { type: boolean }
                      installer_generated: { type: boolean, const: false }
                      artifact_delivery: { type: string, const: authenticated_direct_download_only }
                      action: { type: string }
                      filename: { type: string }
                      public_storage_allowed: { type: boolean, const: false }
                      drive_upload_status: { type: string, const: blocked_secret_bearing_artifact }
                      drive_error: { type: "null" }
                      drive: { type: "null" }
                      script_content_omitted: { type: boolean, const: true }
                      script_content_reason: { type: string }
                      secure_download:
                        type: object
                        additionalProperties: false
                        required: [method, path, query, requires_backend_api_key, requires_admin_principal]
                        properties:
                          method: { type: string, const: GET }
                          path: { type: string, const: /admin/cli/local-connector/install-bundle }
                          query:
                            type: object
                            additionalProperties: false
                            required: [user_id, device_id, format]
                            properties:
                              user_id: { type: string }
                              device_id: { type: string }
                              format: { type: string, const: bat }
                          requires_backend_api_key: { type: boolean, const: true }
                          requires_admin_principal: { type: boolean, const: true }
                      secrets_included: { type: boolean, const: false }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/cli/dns:
    get:
      tags: [admin-control]
      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: listDnsRecords
      summary: List DNS records for a zone
      description: Lists all DNS records for the specified zone via Cloudflare API. Defaults to mad4b.com.
      parameters:
