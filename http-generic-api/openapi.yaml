  /ai/tool-search:
    post:
      x-openai-isConsequential: false
      tags: [ai, platform-intelligence]
      security:
        - backendBearerAuth: []
        - backendApiKeyAuth: []
      operationId: aiToolSearch
      summary: Search governed deferred tools
      description: >
        Searches the derived governed tool index and returns bounded summaries only. The source of truth remains
        actions, endpoints, workflows, and connected systems; this route does not expose a raw catalog or execute tools.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                query: { type: string }
                tags:
                  type: array
                  items: { type: string }
                risk_class:
                  type: string
                  enum: [read_only, workspace_write, brand_external_write, tenant_external_write, admin_registry_write, provider_privileged, local_device, destructive, credential_touching, deployment_affecting]
                limit: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200": { description: Bounded governed tool search results, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /ai/registry-readiness:
    get:
      tags: [ai]
      security:
        - backendBearerAuth: []
        - backendApiKeyAuth: []
      operationId: getAiRegistryReadiness
      summary: Check AI resolver intent binding in Task Routes and Workflow Registry
      description: >
        Validation-only diagnostic that confirms the two required AI resolver
        intent keys (ai_implementation_plan_generation and
        ai_task_manifest_generation) are bound to executable Task Routes rows
        and linked Workflow Registry rows. Returns 200 when both bindings are
        fully ready, or 409 when one or more bindings are missing or lack
        executable authority.
      responses:
        "200":
          description: All AI resolver intent keys are route/workflow bound
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiRegistryReadinessResponse"
        "401":
          description: Invalid backend API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: One or more AI resolver intent bindings are missing or unresolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiRegistryReadinessResponse"
        "500":
          description: Registry readiness check failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

