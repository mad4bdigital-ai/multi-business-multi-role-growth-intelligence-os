openapi: 3.1.0

info:
  title: Governed HTTP Client â€” AI Platform
  version: 3.0.0-platform
  summary: >
    Multi-tenant AI-native orchestration platform with governed execution, async jobs,
    AI resolvers, and full platform management API (tenants, identity, access, workflows,
    observability, security, developer API, and release readiness).
  description: >
    OpenAPI schema for the Governed AI + Human Managed Platform backend.
    Covers three capability layers:
    (1) Governed execution â€” /http-execute, /jobs/*, /governance/*, /ai/*
    (2) Platform management â€” /tenants, /users, /plans, /subscriptions, /customers,
        /tickets, /connected-systems, /workspaces, /planner/*, /bootstrap/*,
        /logic-definitions, /logic-packs, /workflow-runs, /approval-holds,
        /telemetry/*, /usage/*, /audit-log, /incidents, /developer-apps,
        /api-credentials, /webhooks, /rate-limit-rules
    (3) Release operations â€” /release/readiness, /release/readiness-history,
        /release/entity-classification
    Platform endpoints accept admin/service authentication via BACKEND_API_KEY, or user authentication via a signed login JWT.

servers:
  - url: https://auth.mad4b.com
    description: Governed HTTP backend

tags:
  - name: health
    description: Backend health and queue status.
  - name: dev-diagnostics
    description: Passive development environment diagnostics for dev.mad4b.com.
  - name: activation
    description: Once-per-session activation probes, session history, and scope context.
  - name: growth-dashboard
    description: Tenant-scoped growth cockpit, guidance, preferences, previews, and recommendation feedback.
  - name: jobs
    description: Async governed execution jobs.
  - name: execution
    description: Synchronous governed HTTP execution.
  - name: governance
    description: Runtime governance diagnostics.
  - name: ai
    description: AI generation resolvers for implementation plans and task manifests.
  - name: tenants
    description: Multi-tenant provisioning, relationships, and memberships.
  - name: identity
    description: Users, role assignments, plans, subscriptions, and assistance roles.
  - name: access
    description: 6-outcome access decision engine and request envelope log.
  - name: customers
    description: Customer records, contacts, tickets, and timeline events.
  - name: connected-systems
    description: Connected systems, installations, permission grants, and workspaces.
  - name: planner
    description: Intent resolution and execution plan management.
  - name: bootstrap
    description: Tenant bootstrap readiness checks and onboarding state.
  - name: logic
    description: Logic definitions, logic packs, and adaptation records.
  - name: workflows
    description: Workflow runs, step runs, and human-in-the-loop approval holds.
  - name: observability
    description: Telemetry spans, usage metering, and quota enforcement.
  - name: security
    description: Immutable audit log, secret references, incidents, and compliance.
  - name: developer-api
    description: Developer apps, API credentials (key generation), webhooks, and rate limits.
  - name: admin-control
    description: Personal administrator control surface for CLI, database, and runtime environment operations.
  - name: system-layer
    description: MCP-style governed system layer backed by connector registries, principal context, and runtime validation.
  - name: release
    description: Release readiness checks, history, and entity classification inventory.
  - name: runtime-verification
    description: Runtime verification control plane, production parity ledger, and paginated evidence surfaces.
  - name: operational-console
    description: Unified operational console readback across runtime parity, activation, tiles, gaps, freshness, and evidence manifests.
  - name: activation-guidance
    description: Proactive activation guidance intelligence for Tenant GPT and Admin GPT, including account counts, permissions, readiness semantics, and next-best actions.
  - name: local-manager
    description: Local Manager device-code linking, device controls, and Windows update metadata.
  - name: platform-graph
    description: SQL-primary platform knowledge graph projection, validation, and context resolution.
  - name: platform-plugins
    description: Tenant-facing and admin-governed Platform Plugin catalog, install, resolve, contribution, and promotion surfaces.
  - name: tenant-docs
    description: Tenant-safe live repository documentation reader surfaces.
  - name: wordpress
    description: WordPress runtime diagnostics and publish authority checks.
  - name: platform-evolution
    description: Brand, tenant, and user scoped Platform Evolution checkpoints, thread maps, and linked evidence surfaces.
  - name: platform-intelligence
    description: Admin-governed AI Intelligence Runtime planning, policy, lifecycle, and decision evidence surfaces.
  - name: connected-execution
    description: DB-backed connected execution session, checkpoint, evidence, and resume-action metadata surfaces.
  - name: container-authority
    description: Dynamic multi-parent container authority previews, governed assignments, projections, shadow evidence, and explicit override governance.

components:
  securitySchemes:
    backendBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Backend API Key or User JWT
      description: >
        Send Authorization: Bearer <BACKEND_API_KEY> for admin/service access, or
        Authorization: Bearer <USER_JWT> after user sign-in.
    backendApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: >
        Admin/service Custom GPT-safe backend authentication header. Send
        x-api-key: <BACKEND_API_KEY>. This key should be scoped to the admin user/service identity.
    userJwtAuth:
      type: http
      scheme: bearer
      bearerFormat: User JWT
      description: Signed user JWT from /auth/login or /auth/google. Backend API keys do not satisfy this scheme.
    localManagerBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: User JWT or Local Manager device token
      description: >
        Bearer token minted by /auth/login, /auth/register, or approved device-link polling.

  schemas:

    ActivationGuidanceResponse:
      type: object
      additionalProperties: true
      required: [ok, activation_layer, profile, language_context, invocation_contract, guidance_flow, command_palette, activation_brief, account_or_admin_capability_snapshot, recommended_next_actions, assistant_instruction_pack, secrets_included]
      properties:
        ok: { type: boolean }
        activation_layer: { type: string, enum: [activation_guidance_intelligence] }
        profile: { type: string, enum: [tenant, admin] }
        guidance_mode: { type: string }
        language_context:
          type: object
          additionalProperties: true
          properties:
            mode: { type: string }
            resolved_locale: { type: string }
            source: { type: string }
            tags_are_language_neutral: { type: boolean }
        invocation_contract:
          type: object
          additionalProperties: true
          properties:
            version: { type: string }
            supported_signals:
              type: array
              items: { type: string, enum: [invocation_tag, slash_alias, intent_key] }
            tag_format: { type: string }
            slash_format: { type: string }
            routing_rule: { type: string }
            execution_rule: { type: string }
        guidance_flow:
          type: array
          items:
            type: object
            additionalProperties: true
        guidance_paths:
          type: array
          items:
            type: object
            additionalProperties: true
        command_palette:
          type: array
          items:
            type: object
            additionalProperties: true
        presentation_summary:
          type: object
          additionalProperties: true
        activation_brief:
          type: object
          additionalProperties: true
        account_or_admin_capability_snapshot:
          type: object
          additionalProperties: true
        capability_groups:
          type: array
          items: { type: object, additionalProperties: true }
        recommended_next_actions:
          type: array
          items: { type: object, additionalProperties: true }
        safe_action_menu:
          type: array
          items: { type: object, additionalProperties: true }
        blocked_or_limited_capabilities:
          type: array
          items: { type: object, additionalProperties: true }
        assistant_instruction_pack:
          type: object
          additionalProperties: true
        secrets_included: { type: boolean }

    OperationalConsoleResponse:
      type: object
      additionalProperties: true
      required: [ok, activation_layer, environment_key, summary, secrets_included]
      properties:
        ok: { type: boolean }
        activation_layer: { type: string, enum: [operational_console] }
        environment_key: { type: string }
        summary:
          type: object
          additionalProperties: true
          properties:
            production_parity: { type: string }
            readiness_classification: { type: string }
            activation_status: { type: string }
            latest_run_id: { type: string, nullable: true }
            blocking_gap_count: { type: integer }
            operational_tile_count: { type: integer }
            callback_count: { type: integer }
            attention_rule_count: { type: integer }
            remediation_runbook_count: { type: integer }
            freshness_policy_count: { type: integer }
            secrets_included: { type: boolean }
        runtime_parity: { $ref: '#/components/schemas/RuntimeParityResponse' }
        activation_summary:
          type: object
          additionalProperties: true
        latest_verification_run:
          oneOf:
            - $ref: '#/components/schemas/RuntimeVerificationRunResponse'
            - type: 'null'
        operational_tiles:
          type: array
          items: { type: object, additionalProperties: true }
        callbacks:
          type: array
          items: { type: object, additionalProperties: true }
        attention_rules:
          type: array
          items: { type: object, additionalProperties: true }
        remediation_runbooks:
          type: array
          items: { type: object, additionalProperties: true }
        freshness_policies:
          type: array
          items: { type: object, additionalProperties: true }
        evidence_manifest: { $ref: '#/components/schemas/RuntimeVerificationEvidenceResponse' }
        secrets_included: { type: boolean }

    RuntimeVerificationCreateRequest:
      type: object
      additionalProperties: false
      properties:
        environment_key: { type: string, default: production }
        expected_commit_sha: { type: string }
        deployed_commit_sha: { type: string }
        runtime_base_url: { type: string, default: https://auth.mad4b.com }
        runtime_profile: { type: string, default: api_only }
        response_budget:
          type: object
          additionalProperties: true
          properties:
            max_response_bytes: { type: integer, default: 100000 }
            max_items: { type: integer, default: 50 }
            max_depth: { type: integer, default: 3 }
            overflow_policy: { type: string, default: manifest_only }

    RuntimeVerificationStep:
      type: object
      additionalProperties: true
      properties:
        step_id: { type: string }
        step_key: { type: string }
        step_status: { type: string, enum: [pending, running, pass, warn, fail, blocked, skipped, cancelled] }
        classification: { type: string }
        response_bytes: { type: integer, nullable: true }
        max_allowed_bytes: { type: integer, nullable: true }

    RuntimeVerificationGap:
      type: object
      additionalProperties: true
      properties:
        gap_id: { type: string }
        gap_key: { type: string }
        severity: { type: string, enum: [info, low, medium, high, critical] }
        classification: { type: string }
        blocks_production_parity: { type: boolean }
        remediation: { type: string, nullable: true }
        remediation_type: { type: string, nullable: true }
        auto_fix_allowed: { type: boolean, nullable: true }
        approval_required: { type: boolean, nullable: true }
        recommended_action: { type: string, nullable: true }
        runbook_json: { type: object, additionalProperties: true, nullable: true }

    RuntimeVerificationRunResponse:
      type: object
      additionalProperties: true
      required: [ok, run_id, production_parity]
      properties:
        ok: { type: boolean }
        run_id: { type: string }
        environment_key: { type: string }
        expected_commit_sha: { type: string, nullable: true }
        deployed_commit_sha: { type: string, nullable: true }
        run_status: { type: string }
        production_parity: { type: string, enum: [unknown, validating, verified, degraded, blocked] }
        summary: { type: object, additionalProperties: true }
        steps:
          type: array
          items: { $ref: '#/components/schemas/RuntimeVerificationStep' }
        gaps:
          type: array
          items: { $ref: '#/components/schemas/RuntimeVerificationGap' }

    RuntimeVerificationEvidenceResponse:
      type: object
      additionalProperties: true
      properties:
        ok: { type: boolean }
        run_id: { type: string }
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        page:
          type: object
          additionalProperties: false
          properties:
            hasMore: { type: boolean }
            nextCursor: { type: string, nullable: true }

    RuntimeParityResponse:
      type: object
      additionalProperties: true
      properties:
        ok: { type: boolean }
        environment_key: { type: string }
        expected_commit_sha: { type: string, nullable: true }
        deployed_commit_sha: { type: string, nullable: true }
        production_parity: { type: string, enum: [unknown, validating, verified, degraded, blocked] }
        latest_run_id: { type: string, nullable: true }
        blocking_gap_count: { type: integer }
        readiness_classification: { type: string }

    SchemaImportJob:
      type: object
      additionalProperties: true
      properties:
        job_id: { type: string }
        action_key: { type: string }
        source_type:
          type: string
          enum: [upload, repo_link, rollback]
        source_url: { type: string, nullable: true }
        source_ref: { type: string, nullable: true }
        source_filename: { type: string, nullable: true }
        endpoints_upserted: { type: integer }
        endpoints_deprecated: { type: integer }
        warnings:
          type: array
          items: { type: string }
          nullable: true
        status:
          type: string
          enum: [pending, completed, failed]
        error_message: { type: string, nullable: true }
        imported_by: { type: string, nullable: true }
        imported_at: { type: string, format: date-time }

    ReadbackRequest:
      type: object
      additionalProperties: false
      properties:
        required:
          type: boolean
          default: false
        mode:
          type: string
          enum: [none, echo, location_followup]
          default: none

    ReadbackResult:
      type: object
      properties: {}
      additionalProperties: true
      description: Optional readback result when requested and available.

    QueryObject:
      type: object
      properties: {}
      additionalProperties:
        oneOf:
          - type: string
          - type: number
          - type: integer
          - type: boolean
          - type: "null"

    StringMap:
      type: object
      properties: {}
      additionalProperties:
        type: string

    PathParamsObject:
      type: object
      properties: {}
      additionalProperties:
        oneOf:
          - type: string
          - type: number
          - type: integer
          - type: boolean

    JsonValue:
      oneOf:
        - type: object
          properties: {}
          additionalProperties: true
        - type: array
          items: {}
        - type: string
        - type: number
        - type: integer
        - type: boolean
        - type: "null"

    ConnectedExecutionSessionUpsertRequest:
      type: object
      additionalProperties: true
      properties:
        connected_session_id: { type: string }
        tenant_id: { type: string }
        user_id: { type: string }
        root_plan_id: { type: string }
        current_run_id: { type: string }
        current_step_run_id: { type: string }
        mode: { type: string, enum: [single_turn, connected_rounds, worker_driven], default: connected_rounds }
        status: { type: string, enum: [draft, ready, running, paused, awaiting_user, awaiting_approval, blocked, completed, failed, cancelled], default: ready }
        resume_policy: { $ref: "#/components/schemas/JsonValue" }
        budget_policy: { $ref: "#/components/schemas/JsonValue" }
        checkpoint_policy: { $ref: "#/components/schemas/JsonValue" }
        resume_cursor: { $ref: "#/components/schemas/JsonValue" }
        last_checkpoint: { $ref: "#/components/schemas/JsonValue" }
        next_action: { $ref: "#/components/schemas/JsonValue" }
        max_rounds: { type: integer, minimum: 1, maximum: 1000 }

    ConnectedExecutionSessionResponse:
      type: object
      additionalProperties: true
      required: [ok, session, secrets_included]
      properties:
        ok: { type: boolean, enum: [true] }
        session:
          type: object
          additionalProperties: true
        secrets_included: { type: boolean, enum: [false] }

    ConnectedExecutionCheckpointResponse:
      type: object
      additionalProperties: true
      required: [ok, checkpoint, secrets_included]
      properties:
        ok: { type: boolean, enum: [true] }
        checkpoint:
          type: object
          additionalProperties: true
        secrets_included: { type: boolean, enum: [false] }

    ConnectedExecutionEvidenceReportCreateRequest:
      type: object
      additionalProperties: true
      required: [stage]
      properties:
        evidence_report_id: { type: string }
        tenant_id: { type: string }
        user_id: { type: string }
        plan_id: { type: string }
        run_id: { type: string }
        step_run_id: { type: string }
        stage: { type: string, minLength: 1 }
        status: { type: string, enum: [checkpoint, progress, blocked, handoff, resume_ready, completed, failed], default: checkpoint }
        summary: { $ref: "#/components/schemas/JsonValue" }
        evidence: { $ref: "#/components/schemas/JsonValue" }
        ci: { $ref: "#/components/schemas/JsonValue" }
        readiness: { $ref: "#/components/schemas/JsonValue" }
        artifact_refs:
          type: array
          items: { $ref: "#/components/schemas/JsonValue" }
        blockers:
          type: array
          items: { $ref: "#/components/schemas/JsonValue" }
        next_action: { $ref: "#/components/schemas/JsonValue" }
        first_resume_instruction: { type: string, maxLength: 512 }

    ConnectedExecutionEvidenceReportResponse:
      type: object
      additionalProperties: true
      required: [ok, evidence_report_id, connected_session_id, status, secrets_included]
      properties:
        ok: { type: boolean, enum: [true] }
        evidence_report_id: { type: string }
        connected_session_id: { type: string }
        status: { type: string }
        secrets_included: { type: boolean, enum: [false] }

    ConnectedExecutionResumeActionCreateRequest:
      type: object
      additionalProperties: true
      required: [action_kind]
      properties:
        resume_action_id: { type: string }
        tenant_id: { type: string }
        user_id: { type: string }
        action_order: { type: integer, minimum: 1 }
        action_kind:
          type: string
          enum: [tool_call, repo_operation, db_operation, provider_operation, local_device_operation, document_generation, analysis_step, approval_request, user_prompt, stop]
        action_key: { type: string }
        action_payload: { $ref: "#/components/schemas/JsonValue" }
        guardrails: { $ref: "#/components/schemas/JsonValue" }

    ConnectedExecutionResumeActionResponse:
      type: object
      additionalProperties: true
      required: [ok, resume_action_id, connected_session_id, status, executes_action, secrets_included]
      properties:
        ok: { type: boolean, enum: [true] }
        resume_action_id: { type: string }
        connected_session_id: { type: string }
        status: { type: string, enum: [pending] }
        executes_action: { type: boolean, enum: [false] }
        secrets_included: { type: boolean, enum: [false] }

    ConnectedExecutionResumeActionEnqueueRequest:
      type: object
      additionalProperties: false
      properties:
        requested_by: { type: string }
        idempotency_key: { type: string }
        trace_id: { type: string }

    ConnectedExecutionResumeActionEnqueueResponse:
      type: object
      additionalProperties: true
      required: [ok, connected_session_id, resume_action_id, action_kind, dry_run, will_execute_external_action, will_call_tools, will_mutate_repo, will_call_provider, will_call_local_device, secrets_included, job]
      properties:
        ok: { type: boolean }
        connected_session_id: { type: string }
        resume_action_id: { type: string }
        action_kind: { type: string, enum: [analysis_step, tool_call] }
        dry_run: { type: boolean, enum: [true] }
        will_execute_external_action: { type: boolean, enum: [false] }
        will_call_tools:
          type: boolean
          description: True only when an allowlisted read-only tool_call action explicitly opts into execution.
        will_preflight_tool_call: { type: boolean }
        will_execute_read_only_tool_call: { type: boolean }
        will_mutate_repo: { type: boolean, enum: [false] }
        will_call_provider: { type: boolean, enum: [false] }
        will_call_local_device: { type: boolean, enum: [false] }
        secrets_included: { type: boolean, enum: [false] }
        job:
          $ref: "#/components/schemas/JobSummary"

    HardActivationRunRequest:
      type: object
      additionalProperties: false
      properties:
        tenant_id: { type: string }
        user_id: { type: string }
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
        include_raw: { type: boolean, default: false }
        include_turns: { type: boolean, default: false }
        close_previous_sessions: { type: boolean, default: false }
        response_profile:
          type: string
          enum: [evidence, summary, dashboard, diagnostic, full]
          default: evidence
        session_policy:
          type: string
          enum: [reuse_or_create, create_new, reuse_only, read_only]
          default: reuse_or_create
        idempotency_key: { type: string, maxLength: 180 }
        conversation_ref: { type: string, maxLength: 500 }
        reuse_window_hours: { type: integer, minimum: 1, maximum: 168, default: 24 }
        container_key: { type: string }
        tab_key: { type: string }
        section_key: { type: string }
        cursor: { type: integer, minimum: 0, default: 0 }
        detail_limit: { type: integer, minimum: 1, maximum: 100, default: 25 }
        max_response_chars: { type: integer, minimum: 5000, maximum: 500000 }
        authorized_access_limit: { type: integer, minimum: 1, maximum: 100 }
        authorized_surface_limit: { type: integer, minimum: 1, maximum: 50 }
        provider_arguments:
          type: object
          additionalProperties: true

    HardActivationEvidenceStep:
      type: object
      additionalProperties: true
      properties:
        attempted: { type: boolean }
        ok: { type: boolean, nullable: true }
        activation_layer: { type: string, nullable: true }
        evidence_source: { type: string, nullable: true }

    HardActivationRunResponse:
      type: object
      additionalProperties: true
      required: [ok, activation_layer, activation_complete, response_profile, runtime_classification, evidence_matrix, completeness, report_policy, secrets_included]
      properties:
        ok: { type: boolean }
        activation_layer: { type: string, enum: [hard_activation_orchestrator] }
        activation_complete: { type: boolean }
        run_id: { type: string, nullable: true }
        session_id: { type: string, nullable: true }
        response_profile: { type: string, enum: [evidence, summary, dashboard, diagnostic, full] }
        snapshot:
          type: object
          additionalProperties: true
          properties:
            snapshot_id: { type: string }
            generated_at: { type: string, format: date-time }
            registry_version: { type: string, nullable: true }
            data_watermark: { type: string, format: date-time }
            profile: { type: string }
            subject_scope: { type: string, enum: [platform_admin, tenant_user] }
        state_model:
          type: object
          additionalProperties: false
          properties:
            validation_state: { type: string }
            evidence_state: { type: string }
            session_state: { type: string }
            dashboard_state: { type: string }
            delivery_state: { type: string }
            consumer_ack_state: { type: string }
        dynamic_tabs_manifest: { type: object, additionalProperties: true }
        operational_summary: { type: object, additionalProperties: true }
        operational_dashboard_manifest: { type: object, additionalProperties: true }
        completeness:
          type: object
          additionalProperties: true
          properties:
            known_surfaces: { type: integer }
            visible_surfaces: { type: integer }
            summarized_surfaces: { type: integer }
            fully_hydrated_surfaces: { type: integer }
            deferred_surfaces: { type: integer }
            blocked_surfaces: { type: integer }
            stale_surfaces: { type: integer }
            coverage_status: { type: string }
            details_omitted_silently: { type: boolean, enum: [false] }
        awareness_index: { type: object, additionalProperties: true }
        surface_refs:
          type: array
          items: { type: object, additionalProperties: true }
        response_projection: { type: object, additionalProperties: true }
        runtime_classification:
          type: object
          additionalProperties: true
          properties:
            activation_status: { type: string }
            status_authority: { type: string }
            reason_code: { type: string }
        evidence_matrix:
          type: object
          additionalProperties: true
          properties:
            session_context: { $ref: "#/components/schemas/HardActivationEvidenceStep" }
            provider_bootstrap: { $ref: "#/components/schemas/HardActivationEvidenceStep" }
        report_policy:
          type: object
          additionalProperties: true
          properties:
            may_report_session_context_loaded: { type: boolean }
            may_report_activation_complete: { type: boolean }
            session_context_claim_requires: { type: string }
        secrets_included: { type: boolean, enum: [false] }

    OperationalAlert:
      type: object
      additionalProperties: true
      required: [alert_key, fingerprint_sha256, source_type, category, severity, title, reason_code, lifecycle_status, verification_state, occurrence_count, first_seen_at, last_seen_at, manual_known_issue, persisted, secrets_included]
      properties:
        alert_id: { type: [string, 'null'] }
        alert_key: { type: string }
        fingerprint_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        source_type: { type: string }
        source_ref: { type: [string, 'null'] }
        source_record_id: { type: [string, 'null'] }
        tenant_id: { type: [string, 'null'] }
        user_id: { type: [string, 'null'] }
        workspace_id: { type: [string, 'null'] }
        container_key: { type: [string, 'null'] }
        category: { type: string }
        severity: { type: string, enum: [info, low, medium, high, critical] }
        title: { type: string }
        summary: { type: [string, 'null'] }
        reason_code: { type: string }
