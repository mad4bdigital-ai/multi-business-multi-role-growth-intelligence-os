      x-custom-gpt-exclude: true
      x-gpt-action-exclude: true
      summary: List Session Insight target write readbacks
      description: >
        Lists read-only target write readback evidence and diagnostics. It does not create target writes,
        modify target items, execute rollback, call providers, read credentials, perform external writes,
        or return raw transcripts or secrets.
      requestBody:
        required: false
        content:
