      operationId: tenantSshCliAllowlistedDryRun
      summary: Build tenant SSH allowlisted CLI dry-run plan
      description: Validates a tenant-owned SSH connection and an allowlisted command key, then returns a dry-run plan only. Does not decrypt credentials, authenticate, open a network connection, execute commands, or return credentials.
      parameters:
        - name: connection_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command_key]
              additionalProperties: false
              properties:
                command_key:
                  type: string
                  enum: [pwd, whoami, uname_s, uptime]
      responses:
        "200":
          description: SSH CLI dry-run plan returned.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  ok:
