  /platform/session-insight-promotions/target-write-readbacks/create:
    post:
      tags: [admin-control]
      security:
        - backendBearerAuth: []
        - backendApiKeyAuth: []
      operationId: sessionInsightTargetWriteReadbackCreate
      x-custom-gpt-exclude: true
      x-gpt-action-exclude: true
      summary: Create a read-only Session Insight target write readback
      description: >
        Validates an already executed internal SQL backlog target write against its target item,
        source payload hash, link metadata, duplicate counts, and no-provider/no-external/no-secret
        safety flags. This operation records readback evidence only; it does not create target writes,
        modify target items, execute rollback, call providers, read credentials, perform external writes,
        or return raw transcripts or secrets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target_write_id]
              properties:
                target_write_id:
                  type: string
                created_by:
                  type: string
      responses:
        '200':
          description: Readback evidence recorded.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [ok, readback, validation, safety_contract, secrets_included]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  readback:
                    $ref: '#/components/schemas/JsonValue'
                  validation:
                    $ref: '#/components/schemas/JsonValue'
                  safety_contract:
                    $ref: '#/components/schemas/JsonValue'
                  secrets_included:
                    type: boolean
                    enum: [false]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /platform/session-insight-promotions/target-write-readbacks/list:
    post:
      tags: [admin-control]
      security:
        - backendBearerAuth: []
        - backendApiKeyAuth: []
