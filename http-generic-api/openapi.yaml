      description: "Returns the public tenant policy: permitted operations, connection modes, onboarding URL, and activation sequence. No auth required — used by tenant GPT to introspect the contract before sign-in."
      responses:
        "200":
          description: Public policy payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [ok, scope, version, permitted_operations]
