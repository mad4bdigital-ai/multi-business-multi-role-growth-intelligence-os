      security: [backendBearerAuth: [], backendApiKeyAuth: []]
      operationId: runGrowthIntelligencePilot
      summary: Run the read-only tenant and brand Growth Intelligence pilot
      description: >
        Resolves tenant, brand core, and business activity context, then produces
        JSON and Markdown reports, prioritized opportunities, a dry-run action
        backlog, approval holds, readback, and audit evidence. This operation
        performs no provider writes or external sends and returns no secrets.
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string } }
        - { name: brand_key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [brand_registry_rows, activity_type_registry_rows]
              properties:
                business_activity_type_key: { type: string }
                persistence_mode:
                  type: string
                  enum: [none, internal_registry]
                  default: none
                  description: Internal registry persistence is explicit and never dispatches provider execution.
                brand_registry_rows: { type: array, items: { type: object, additionalProperties: true } }
                brand_core_registry_rows: { type: array, items: { type: object, additionalProperties: true } }
                activity_type_registry_rows: { type: array, items: { type: object, additionalProperties: true } }
                evidence: { type: array, items: { type: object, additionalProperties: true } }
      responses:
        "200":
          description: Growth Intelligence pilot report and governed readback
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Brand context was not found }

