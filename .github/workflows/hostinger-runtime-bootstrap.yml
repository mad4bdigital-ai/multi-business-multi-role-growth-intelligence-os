name: Hostinger Runtime Bootstrap Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hostinger-runtime-bootstrap.yml'
      - 'http-generic-api/config/runtime-bootstrap-contract.json'
      - 'http-generic-api/runtimeBootstrapContract.js'
      - 'http-generic-api/runtimeBootstrapStatus.js'
      - 'http-generic-api/scripts/hostinger-runtime-bootstrap.mjs'
      - 'http-generic-api/test-runtime-bootstrap-contract.mjs'
      - 'docs/governance/hostinger-runtime-bootstrap.md'
      - '.changes/e2e/hostinger-runtime-bootstrap-contract-20260823.json'
  workflow_dispatch:
    inputs:
      mode:
        description: plan is local metadata only; dry_run is DB read-only; apply is explicit allowlist mutation
        required: true
        default: plan
        type: choice
        options: [plan, dry_run, apply]
      expected_sha:
        description: Exact 40-character SHA deployed on Production
        required: true
        type: string
      expected_branch:
        description: Exact deployment branch
        required: false
        default: Production
        type: string
      target_key:
        description: Repository-owned target key from RUNTIME_BOOTSTRAP_TARGETS_JSON
        required: false
        default: production-runtime
        type: string
      target_database:
        description: Exact database identifier matching the allowlisted target
        required: false
        type: string
      migration:
        description: 20260815 is the only apply candidate; 225/1048 are verification-only
        required: false
        default: 20260815_custom_gpt_mcp_catalog_levels.sql
        type: string
      confirmation:
        description: Required only for apply; APPLY_HOSTINGER_RUNTIME_BOOTSTRAP:exact-sha:target-key
        required: false
        type: string
      bundle_manifest:
        description: Optional exact path to generated schema bundle manifest for zero-table apply
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hostinger-runtime-bootstrap-${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Validate Runtime Bootstrap Contract
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install runtime dependencies without lifecycle scripts
        working-directory: http-generic-api
        run: npm ci --ignore-scripts
      - name: Validate bootstrap contract and source-only tests
        run: |
          set -euo pipefail
          node --check http-generic-api/runtimeBootstrapContract.js
          node --check http-generic-api/runtimeBootstrapStatus.js
          node --check http-generic-api/scripts/hostinger-runtime-bootstrap.mjs
          node --test http-generic-api/test-runtime-bootstrap-contract.mjs
          node http-generic-api/scripts/hostinger-runtime-bootstrap.mjs --plan

  execute:
    name: Execute Explicit Runtime Bootstrap Mode
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 30
    env:
      BOOTSTRAP_MODE: ${{ inputs.mode }}
      BOOTSTRAP_EXPECTED_SHA: ${{ inputs.expected_sha }}
      BOOTSTRAP_EXPECTED_BRANCH: ${{ inputs.expected_branch }}
      BOOTSTRAP_EXPECTED_REPOSITORY: ${{ github.repository }}
      BOOTSTRAP_TARGET_KEY: ${{ inputs.target_key }}
      BOOTSTRAP_TARGET_DATABASE: ${{ inputs.target_database }}
      BOOTSTRAP_MIGRATION: ${{ inputs.migration }}
      BOOTSTRAP_CONFIRMATION: ${{ inputs.confirmation }}
      BOOTSTRAP_SCHEMA_BUNDLE_MANIFEST: ${{ inputs.bundle_manifest }}
      RUNTIME_BOOTSTRAP_TARGETS_JSON: ${{ vars.RUNTIME_BOOTSTRAP_TARGETS_JSON }}
      MYSQL_BOOTSTRAP_HOST: ${{ vars.MYSQL_BOOTSTRAP_HOST }}
      MYSQL_BOOTSTRAP_PORT: ${{ vars.MYSQL_BOOTSTRAP_PORT || '3306' }}
      MYSQL_BOOTSTRAP_DATABASE: ${{ inputs.target_database }}
      MYSQL_BOOTSTRAP_USER: ${{ secrets.MYSQL_BOOTSTRAP_USER }}
      MYSQL_BOOTSTRAP_PASSWORD: ${{ secrets.MYSQL_BOOTSTRAP_PASSWORD }}
      BOOTSTRAP_RESULT_PATH: ${{ runner.temp }}/hostinger-runtime-bootstrap/result.json
    steps:
      - name: Validate trusted dispatch ref and exact Production head
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_BRANCH: ${{ inputs.expected_branch }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "${EXPECTED_BRANCH}" == "Production" ]]
          production_sha="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/Production" --jq '.object.sha')"
          [[ "${production_sha,,}" == "${EXPECTED_SHA,,}" ]]
      - name: Checkout exact source SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install runtime database client without lifecycle scripts
        if: inputs.mode != 'plan'
        working-directory: http-generic-api
        run: npm ci --ignore-scripts
      - name: Run selected bootstrap contract mode
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${BOOTSTRAP_RESULT_PATH}")"
          node http-generic-api/scripts/hostinger-runtime-bootstrap.mjs
      - name: Upload bounded no-secret evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hostinger-runtime-bootstrap-${{ inputs.mode }}-${{ inputs.expected_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/hostinger-runtime-bootstrap/result.json
          if-no-files-found: warn
          retention-days: 30
