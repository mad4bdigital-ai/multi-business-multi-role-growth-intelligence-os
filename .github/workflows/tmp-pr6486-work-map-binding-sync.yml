name: Temporary PR 6486 Work Map Binding Sync

on:
  push:
    branches:
      - gpt/reconcile-production-runtime-parity-main-c77c8f8-20260806
    paths:
      - .github/workflows/tmp-pr6486-work-map-binding-sync.yml

permissions:
  contents: write

concurrency:
  group: tmp-pr6486-work-map-binding-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact staging commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Validate immutable branch and parent
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "gpt/reconcile-production-runtime-parity-main-c77c8f8-20260806"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "5cc1fdd29fe98db788e415e5d85bb814d3cce89d"
          remote_sha="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "${remote_sha}" = "${GITHUB_SHA}"

      - name: Update exact Work Map registry bindings
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const paths = [
            'specs/014-governed-hostinger-storage-orchestration/work-map-integration.json',
            'specs/014-retail-commerce-operations-growth-os/work-map-integration.json'
          ];
          const oldFingerprint = '16f2363370e26689d010dcf1f820c9bca8835bba99c073be9220d251dd611060';
          const oldIndex = '9d3f99fc5f871485d94770932393d59a66224a2a0499e308a62d60ab6145b8d2';
          const fingerprint = 'eda348684e6eb6bac47b668575d7a74b115e432b7463db51c2adefae93faf493';
          const indexSourceHash = 'e9e8f27ff5614cd329ff22a27cc97c3cc4ab08281c767c7d38771a0b27d7bea8';
          for (const path of paths) {
            let text = fs.readFileSync(path, 'utf8');
            const fingerprintNeedle = `"fingerprint": "${oldFingerprint}"`;
            const indexNeedle = `"index_source_hash": "${oldIndex}"`;
            if (text.split(fingerprintNeedle).length !== 2) throw new Error(`Unexpected fingerprint binding in ${path}`);
            if (text.split(indexNeedle).length !== 2) throw new Error(`Unexpected index binding in ${path}`);
            text = text.replace(fingerprintNeedle, `"fingerprint": "${fingerprint}"`);
            text = text.replace(indexNeedle, `"index_source_hash": "${indexSourceHash}"`);
            fs.writeFileSync(path, text);
          }
          NODE

      - name: Verify bounded diff and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-pr6486-work-map-binding-sync.yml
          mapfile -t changed < <(git status --short | awk '{print $2}' | sort)
          expected=(
            .github/workflows/tmp-pr6486-work-map-binding-sync.yml
            specs/014-governed-hostinger-storage-orchestration/work-map-integration.json
            specs/014-retail-commerce-operations-growth-os/work-map-integration.json
          )
          printf '%s\n' "${changed[@]}" > /tmp/changed.txt
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          node <<'NODE'
          const fs = require('node:fs');
          const expectedFingerprint = 'eda348684e6eb6bac47b668575d7a74b115e432b7463db51c2adefae93faf493';
          const expectedIndex = 'e9e8f27ff5614cd329ff22a27cc97c3cc4ab08281c767c7d38771a0b27d7bea8';
          for (const path of [
            'specs/014-governed-hostinger-storage-orchestration/work-map-integration.json',
            'specs/014-retail-commerce-operations-growth-os/work-map-integration.json'
          ]) {
            const doc = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (doc.registry.fingerprint !== expectedFingerprint) throw new Error(`Fingerprint mismatch: ${path}`);
            if (doc.registry.index_source_hash !== expectedIndex) throw new Error(`Index hash mismatch: ${path}`);
          }
          NODE

      - name: Commit, push, and read back
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/014-governed-hostinger-storage-orchestration/work-map-integration.json \
                  specs/014-retail-commerce-operations-growth-os/work-map-integration.json \
                  .github/workflows/tmp-pr6486-work-map-binding-sync.yml
          git commit -m 'chore(work-maps): sync exact registry bindings'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "${local_sha}" = "${remote_sha}"
