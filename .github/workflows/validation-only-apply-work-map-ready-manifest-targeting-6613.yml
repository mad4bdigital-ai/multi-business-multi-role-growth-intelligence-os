name: Validation-only Apply Work Map Manifest Bindings 6629

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validation-only-apply-work-map-ready-manifest-targeting-6613.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    name: Apply exact-head manifest-only binding refresh
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_PR: "6629"
      TARGET_BRANCH: "fix/repository-policy-1049-bootstrap-repair-6627"
      EXPECTED_HEAD_SHA: "9f042bad633fe4730d478c460e588a3c129c0a59"
      EXPECTED_BASE_SHA: "e6b2495065ea2c2d97e481cf9a6cee3f5bfd79e4"
    steps:
      - name: Initialize bounded evidence directory
        shell: bash
        run: |
          set -euo pipefail
          evidence_root="${RUNNER_TEMP}/work-map-manifest-bindings-6629"
          echo "EVIDENCE_ROOT=${evidence_root}" >> "${GITHUB_ENV}"
          mkdir -p "${evidence_root}"

      - name: Validate exact target pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}" > "${EVIDENCE_ROOT}/target-pr.json"
          jq -e --arg branch "${TARGET_BRANCH}" --arg head "${EXPECTED_HEAD_SHA}" --arg base "${EXPECTED_BASE_SHA}" '
            .state == "open" and
            .draft == true and
            .head.repo.full_name == env.GITHUB_REPOSITORY and
            .head.ref == $branch and
            .head.sha == $head and
            .base.ref == "main" and
            .base.sha == $base
          ' "${EVIDENCE_ROOT}/target-pr.json" >/dev/null

      - name: Checkout exact target head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Refresh both ready Spec 014 manifest bindings through canonical producer
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs > "${EVIDENCE_ROOT}/hostinger-refresh.json"
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            --feature-key 014-retail-commerce-operations-growth-os \
            > "${EVIDENCE_ROOT}/retail-refresh.json"

      - name: Verify exact two-file mutation and canonical contracts
        shell: bash
        run: |
          set -euo pipefail
          cat > "${EVIDENCE_ROOT}/expected-files.txt" <<'EOF'
          specs/014-governed-hostinger-storage-orchestration/work-map-integration.json
          specs/014-retail-commerce-operations-growth-os/work-map-integration.json
          EOF
          git diff --name-only | sort > "${EVIDENCE_ROOT}/actual-files.txt"
          diff -u "${EVIDENCE_ROOT}/expected-files.txt" "${EVIDENCE_ROOT}/actual-files.txt"
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --check
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            --feature-key 014-retail-commerce-operations-growth-os --check
          node http-generic-api/test-spec014-refresh-final-work-map-binding.mjs
          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          node http-generic-api/scripts/work-map-schema-classification-contract.mjs
          node http-generic-api/scripts/work-map-schema-classification.mjs
          REPORT_PATH="${EVIDENCE_ROOT}/final-work-map-readback.json" \
            node http-generic-api/scripts/spec014-final-work-map-readback.mjs
          node http-generic-api/scripts/spec-kit-work-map-governance-gate.mjs --ci --changed \
            > "${EVIDENCE_ROOT}/governance-gate.json"
          git diff --check

      - name: Commit and push manifest-only refresh
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${EXPECTED_HEAD_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            specs/014-governed-hostinger-storage-orchestration/work-map-integration.json \
            specs/014-retail-commerce-operations-growth-os/work-map-integration.json
          git commit -m "chore(work-maps): refresh ready manifest bindings for migration 1050 repair"
          result_head="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          remote_after="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_after}" = "${result_head}"
          echo "RESULT_HEAD_SHA=${result_head}" >> "${GITHUB_ENV}"

      - name: Publish bounded mutation evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg contract "mad4b.validation-only-manifest-binding-updater.v6" \
            --arg expected_head_sha "${EXPECTED_HEAD_SHA}" \
            --arg result_head_sha "${RESULT_HEAD_SHA:-unresolved}" \
            '{
              contract:$contract,
              expected_head_sha:$expected_head_sha,
              result_head_sha:$result_head_sha,
              producer:"http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs",
              changed_files:[
                "specs/014-governed-hostinger-storage-orchestration/work-map-integration.json",
                "specs/014-retail-commerce-operations-growth-os/work-map-integration.json"
              ],
              force_push:false,
              protected_ref_mutation:false,
              runtime_contact:false,
              deployment:false,
              database_access:false,
              provider_action:false,
              migration_apply:false,
              secrets_included:false
            }' > "${EVIDENCE_ROOT}/result.json"
          sha256sum "${EVIDENCE_ROOT}"/* > "${EVIDENCE_ROOT}/SHA256SUMS.txt" || true

      - name: Upload bounded updater evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-map-manifest-bindings-updater-6629-${{ github.run_id }}
          path: ${{ runner.temp }}/work-map-manifest-bindings-6629
          if-no-files-found: error
          retention-days: 14
