name: Derived State Converged Auto-Merge
run-name: Derived State Converged Auto-Merge · source ${{ github.event.workflow_run.id }}

on:
  workflow_run:
    workflows:
      - Derived State Closure
    types:
      - completed

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: derived-state-automerge-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  register:
    name: Register exact-head guarded auto-merge
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      REPAIR_RECEIPT_CONTRACT: mad4b.derived-state-repair-dispatch.v1
      MAIN_CONVERGENCE_CONTRACT: mad4b.derived-state-main-convergence.v1
      AUTOMERGE_RECEIPT_CONTRACT: mad4b.derived-state-automerge.v1
    steps:
      - name: Resolve canonical converged pull request
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report_dir="${RUNNER_TEMP}/derived-state-automerge"
          rm -rf "$report_dir"
          mkdir -p "$report_dir/closure"
          echo "REPORT_DIR=$report_dir" >> "$GITHUB_ENV"

          source_run_file="$report_dir/source-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > "$source_run_file"
          test "$(jq -r '.path' "$source_run_file")" = ".github/workflows/derived-state-closure.yml"
          test "$(jq -r '.conclusion' "$source_run_file")" = "success"
          source_event="$(jq -r '.event' "$source_run_file")"
          [[ "$source_event" == "pull_request" || "$source_event" == "workflow_dispatch" || "$source_event" == "push" ]]

          artifact_list="$report_dir/source-artifacts.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" > "$artifact_list"
          artifact_count="$(jq '[.artifacts[] | select((.name | startswith("derived-state-closure-")) and (.expired == false))] | length' "$artifact_list")"
          if [[ "$artifact_count" != "1" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "reason=canonical_closure_artifact_not_unique" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          artifact_id="$(jq -r '[.artifacts[] | select((.name | startswith("derived-state-closure-")) and (.expired == false))][0].id' "$artifact_list")"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$report_dir/closure.zip"
          unzip -q "$report_dir/closure.zip" -d "$report_dir/closure"
          mapfile -t reports < <(find "$report_dir/closure" -type f -name 'report.json' -print)
          test "${#reports[@]}" = "1"
          closure_report="${reports[0]}"
          cp "$closure_report" "$report_dir/closure-report.json"
          echo "CLOSURE_REPORT=$report_dir/closure-report.json" >> "$GITHUB_ENV"

          test "$(jq -r '.contract' "$closure_report")" = "mad4b.repository-derived-state-closure.v1"
          if [[ "$(jq -r '.candidate.kind' "$closure_report")" != "github_merge_candidate" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "reason=not_pull_request_merge_candidate" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$(jq -r '.converged' "$closure_report")" = "true"
          test "$(jq -r '.stale_or_failed_artifact_count' "$closure_report")" = "0"
          test "$(jq -r '.verifier_mutation == null' "$closure_report")" = "true"
          test "$(jq -r '.safety.remote_repository_mutation_performed' "$closure_report")" = "false"
          test "$(jq -r '.safety.protected_branch_mutation_performed' "$closure_report")" = "false"
          test "$(jq -r '.safety.force_push_performed' "$closure_report")" = "false"

          pr_number="$(jq -r '.candidate.pr_number // 0' "$closure_report")"
          head_sha="$(jq -r '.candidate.source_head_sha // empty' "$closure_report")"
          base_sha="$(jq -r '.candidate.base_sha // empty' "$closure_report")"
          candidate_sha="$(jq -r '.candidate.sha // empty' "$closure_report")"
          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]

          pr_file="$report_dir/pull-request.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" > "$pr_file"
          if [[ "$(jq -r '.state' "$pr_file")" != "open" || "$(jq -r '.merged' "$pr_file")" != "false" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "reason=pr_not_open" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$(jq -r '.base.ref' "$pr_file")" = "main"
          test "$(jq -r '.base.sha' "$pr_file")" = "$base_sha"
          test "$(jq -r '.head.repo.full_name' "$pr_file")" = "$GITHUB_REPOSITORY"
          target_ref="$(jq -r '.head.ref' "$pr_file")"
          test "$(jq -r '.head.sha' "$pr_file")" = "$head_sha"
          test "$(jq -r '.draft' "$pr_file")" = "false"
          [[ "$target_ref" =~ ^(gpt|cert|fix|feat|chore|docs|release)/[A-Za-z0-9._/-]+$ ]]
          [[ "$target_ref" != "main" && "$target_ref" != "Production" ]]

          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main_sha" != "$base_sha" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "reason=source_main_moved" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${head_sha}" --jq '.behind_by')" = "0"

          current_candidate_sha=""
          for attempt in $(seq 1 8); do
            current_candidate_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '.merge_commit_sha // empty')"
            [[ "$current_candidate_sha" =~ ^[0-9a-f]{40}$ ]] && break
            sleep "$attempt"
          done
          if [[ "$current_candidate_sha" != "$candidate_sha" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "reason=source_merge_candidate_is_stale" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "reason=exact_converged_candidate_pinned" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "target_ref=$target_ref" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "main_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted current-main policy
        if: steps.target.outputs.eligible == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.target.outputs.main_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove current-head convergence provenance and auto-merge eligibility
        id: policy
        if: steps.target.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          MAIN_SHA: ${{ steps.target.outputs.main_sha }}
        run: |
          set -euo pipefail
          registry=".github/derived-state-governance.json"
          test "$(jq -r '.contract' "$registry")" = "mad4b.repository-derived-state-governance.v1"
          test "$(jq -r '.convergence.auto_merge_requires_current_head_convergence_receipt' "$registry")" = "true"
          test "$(jq -r '.convergence.receipt_must_bind_result_head' "$registry")" = "true"

          changed_file="${RUNNER_TEMP}/derived-state-automerge-pr-files.txt"
          expected_changed_files="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.changed_files')"
          [[ "$expected_changed_files" =~ ^[0-9]+$ ]]
          if (( expected_changed_files > 3000 )); then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "reason=pr_file_inventory_exceeds_api_completeness_cap" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename' | sort -u > "$changed_file"
          fetched_changed_files="$(wc -l < "$changed_file" | tr -d '[:space:]')"
          test "$fetched_changed_files" = "$expected_changed_files"
          control_file="${RUNNER_TEMP}/derived-state-automerge-controls.txt"
          jq -er '.convergence.automation_control_paths[]' "$registry" | sort -u > "$control_file"
          if [[ -n "$(comm -12 "$changed_file" "$control_file" || true)" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "reason=automation_control_surface_changed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr_labels="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}" --jq '[.labels[].name]')"
          while IFS= read -r label; do
            [[ -z "$label" ]] && continue
            if jq -e --arg label "$label" 'index($label) != null' <<<"$pr_labels" >/dev/null; then
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              echo "reason=automerge_opt_out_label" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done < <(jq -r '.convergence.automerge_opt_out_labels[]' "$registry")

          comments_file="${RUNNER_TEMP}/derived-state-automerge-comments.json"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" > "$comments_file"

          repair_count="$(jq --arg base "$MAIN_SHA" --arg head "$HEAD_SHA" --arg contract "$REPAIR_RECEIPT_CONTRACT" '
            [ .[] | select(
                .user.login == "github-actions[bot]" and
                (.body | startswith("DERIVED_STATE_REPAIR_DISPATCH contract=" + $contract + " ")) and
                (.body | contains("base_sha=" + $base + " ")) and
                (.body | contains("result_head_sha=" + $head + " ")) and
                (.body | contains("closure_reverification_requested=true "))
              )
            ] | length
          ' "$comments_file")"
          main_convergence_count="$(jq --arg base "$MAIN_SHA" --arg head "$HEAD_SHA" --arg contract "$MAIN_CONVERGENCE_CONTRACT" '
            [ .[] | select(
                .user.login == "github-actions[bot]" and
                (.body | startswith("DERIVED_STATE_MAIN_CONVERGENCE contract=" + $contract + " ")) and
                (.body | contains("base_sha=" + $base + " ")) and
                (.body | contains("head_sha=" + $head + " "))
              )
            ] | length
          ' "$comments_file")"
          provenance_count=$((repair_count + main_convergence_count))
          if (( provenance_count < 1 )); then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "reason=no_trusted_current_head_convergence_receipt" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          max_passes="$(jq -er '.max_convergence_passes' "$registry")"
          all_repair_count="$(jq --arg base "$MAIN_SHA" --arg contract "$REPAIR_RECEIPT_CONTRACT" '
            [ .[] | select(
                .user.login == "github-actions[bot]" and
                (.body | startswith("DERIVED_STATE_REPAIR_DISPATCH contract=" + $contract + " ")) and
                (.body | contains("base_sha=" + $base + " "))
              )
            ] | length
          ' "$comments_file")"
          if (( all_repair_count > max_passes )); then
            echo "::error::Repair receipt count ${all_repair_count} exceeds max_convergence_passes=${max_passes}."
            exit 1
          fi
          if (( main_convergence_count > 1 )); then
            echo "::error::Multiple main-convergence receipts bind the same exact head."
            exit 1
          fi

          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')" = "$HEAD_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$MAIN_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${HEAD_SHA}" --jq '.behind_by')" = "0"

          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "reason=current_head_convergence_receipt_proven" >> "$GITHUB_OUTPUT"
          echo "repair_receipt_count=$repair_count" >> "$GITHUB_OUTPUT"
          echo "main_convergence_receipt_count=$main_convergence_count" >> "$GITHUB_OUTPUT"

      - name: Register guarded exact-head auto-merge
        id: merge
        if: steps.policy.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REPO_AUTOSYNC_TOKEN || github.token }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          MAIN_SHA: ${{ steps.target.outputs.main_sha }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$MAIN_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')" = "$HEAD_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${HEAD_SHA}" --jq '.behind_by')" = "0"

          if gh pr merge "$PR_NUMBER" \
            --auto \
            --squash \
            --delete-branch \
            --match-head-commit "$HEAD_SHA"; then
            echo "registered=true" >> "$GITHUB_OUTPUT"
          else
            merge_rc=$?
            pr_after="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
            if [[ "$(jq -r '.head.sha' <<<"$pr_after")" == "$HEAD_SHA" \
               && "$(jq -r '.base.ref' <<<"$pr_after")" == "main" \
               && -n "$(jq -r '.merged_at // empty' <<<"$pr_after")" ]]; then
              echo "registered=already_merged" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Guarded auto-merge failed without exact-head merged readback."
              exit "$merge_rc"
            fi
          fi

      - name: Publish auto-merge provenance receipt
        if: steps.merge.outputs.registered != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          MAIN_SHA: ${{ steps.target.outputs.main_sha }}
          CANDIDATE_SHA: ${{ steps.target.outputs.candidate_sha }}
          REGISTERED: ${{ steps.merge.outputs.registered }}
        run: |
          set -euo pipefail
          receipt="DERIVED_STATE_AUTOMERGE contract=${AUTOMERGE_RECEIPT_CONTRACT} state=${REGISTERED} source_run_id=${SOURCE_RUN_ID} pr_number=${PR_NUMBER} base_sha=${MAIN_SHA} head_sha=${HEAD_SHA} candidate_sha=${CANDIDATE_SHA} match_head_commit=true admin_bypass=false protected_branch_mutation=github_merge_only force_push=false"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$receipt" >/dev/null
          echo "$receipt" >> "$GITHUB_STEP_SUMMARY"
