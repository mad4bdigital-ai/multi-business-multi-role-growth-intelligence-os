name: Derived State Converged Auto-Merge
run-name: Governance Finalizer · ${{ github.event.workflow_run.id || inputs.source_run_id || github.run_id }}

on:
  workflow_run:
    workflows: [Derived State Closure, Governed Production Promotion Request Launcher]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful trusted source run ID
        required: true
        type: string
      confirmation:
        description: Type FINALIZE_GOVERNANCE_ATTESTATION
        required: true
        type: string
      pr_number:
        description: Optional exact PR for GitHub Direct mode
        required: false
        type: string
      expected_head_sha:
        description: Optional exact source HEAD for GitHub Direct mode
        required: false
        type: string
      action:
        description: GitHub Direct plan or attestation mode
        required: false
        default: plan
        type: choice
        options: [plan, attest, attest_and_merge]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: governance-finalizer-${{ github.event.workflow_run.id || inputs.source_run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  attest:
    name: Trusted GitHub App exact-candidate attestation
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       ((github.event.workflow_run.name == 'Derived State Closure' && github.event.workflow_run.event == 'pull_request') ||
        (github.event.workflow_run.name == 'Governed Production Promotion Request Launcher' && github.event.workflow_run.event == 'workflow_dispatch'))) ||
      (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'FINALIZE_GOVERNANCE_ATTESTATION')
    environment:
      name: Production
      deployment: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      branch: ${{ steps.final.outputs.branch }}
      pr_number: ${{ steps.final.outputs.pr_number }}
      source_head_sha: ${{ steps.final.outputs.source_head_sha }}
      base_sha: ${{ steps.final.outputs.base_sha }}
      candidate_sha: ${{ steps.final.outputs.candidate_sha }}
      manual_count: ${{ steps.final.outputs.manual_count }}
      attestor_app_id: ${{ steps.final.outputs.attestor_app_id }}
      status_creator_id: ${{ steps.final.outputs.status_creator_id }}
      attestor_status_id: ${{ steps.final.outputs.attestor_status_id }}
      head_attestor_status_id: ${{ steps.final.outputs.head_attestor_status_id }}
      head_status_creator_id: ${{ steps.final.outputs.head_status_creator_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      BACKEND_API_KEY: ${{ secrets.HOSTINGER_PRODUCTION_BACKEND_API_KEY }}
      RUNTIME_BASE_URL: https://auth.mad4b.com
    steps:
      - name: Resolve and validate trusted source evidence
        id: final
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.source_run_id }}
        run: |
          set -euo pipefail
          if [[ -z "${BACKEND_API_KEY:-}" ]]; then
            echo "::error title=Trusted attestation configuration::error_code=production_environment_backend_api_key_missing" >&2
            exit 1
          fi
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          run="$RUNNER_TEMP/source-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > "$run"
          test "$(jq -r '.conclusion' "$run")" = "success"
          source_path="$(jq -r '.path' "$run")"
          source_event="$(jq -r '.event' "$run")"
          case "$source_path" in
            .github/workflows/derived-state-closure.yml)
              test "$source_event" = "pull_request"
              branch="main"
              prefix="derived-state-closure-"
              ;;
            .github/workflows/governed-production-promotion-request-launcher.yml)
              test "$source_event" = "workflow_dispatch"
              branch="Production"
              prefix="governed-production-promotion-convergence-"
              ;;
            *) echo "Untrusted finalizer source path: $source_path" >&2; exit 1 ;;
          esac
          artifacts="$RUNNER_TEMP/artifacts.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" > "$artifacts"
          expected_artifact="${prefix}${SOURCE_RUN_ID}"
          test "$(jq -r --arg name "$expected_artifact" '[.artifacts[] | select(.name==$name and .expired==false)] | length' "$artifacts")" = "1"
          artifact_record="$(jq -c --arg name "$expected_artifact" '[.artifacts[] | select(.name==$name and .expired==false)][0]' "$artifacts")"
          artifact_id="$(jq -r '.id // empty' <<<"$artifact_record")"
          evidence_digest="$(jq -r '.digest // empty' <<<"$artifact_record")"
          evidence_digest="${evidence_digest#sha256:}"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$evidence_digest" =~ ^[0-9a-f]{64}$ ]]
          evidence_dir="$RUNNER_TEMP/finalizer-evidence"
          mkdir -p "$evidence_dir"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$RUNNER_TEMP/evidence.zip"
          unzip -q "$RUNNER_TEMP/evidence.zip" -d "$evidence_dir"

          if [[ "$branch" == main ]]; then
            identity="$(find "$evidence_dir" -type f -name detector-identity.json -print -quit)"
            report="$(find "$evidence_dir" -type f -name report.json -print -quit)"
            objections="$(find "$evidence_dir" -type f -name policy-objections.json -print -quit)"
            producer="$(find "$evidence_dir" -type f -name evidence-finalizer.json -print -quit)"
            for file in "$identity" "$report" "$objections" "$producer"; do test -f "$file"; done
            test "$(jq -r '.converged' "$producer")" = "true"
            test "$(jq -r '.blocking_stale_or_failed_artifact_count' "$report")" = "0"
            test "$(jq -r '.blocking_count' "$objections")" = "0"
            pr_number="$(jq -r '.pr_number' "$identity")"
            source_head_sha="$(jq -r '.source_head_sha' "$identity")"
            base_sha="$(jq -r '.base_sha' "$identity")"
            candidate_sha="$(jq -r '.merge_candidate_sha' "$identity")"
            executed_sha="$(jq -r '.executed_sha' "$identity")"
            manual_count="$(jq -r '.manual_count // 0' "$objections")"
            test "$executed_sha" = "$candidate_sha"
          else
            convergence="$(find "$evidence_dir" -type f -name governed-production-promotion-convergence.json -print -quit)"
            test -f "$convergence"
            record="$(jq -c '.. | objects | select(has("release_pr") and has("production_sha") and has("candidate_sha")) | select((.release_pr|tostring|test("^[1-9][0-9]*$")) and (.production_sha|tostring|test("^[0-9a-f]{40}$")) and (.candidate_sha|tostring|test("^[0-9a-f]{40}$")))' "$convergence" | tail -n1)"
            test -n "$record"
            pr_number="$(jq -r '.release_pr' <<<"$record")"
            source_head_sha="$(jq -r '.candidate_sha' <<<"$record")"
            base_sha="$(jq -r '.production_sha' <<<"$record")"
            manual_count="1"
            pr_live="$RUNNER_TEMP/release-pr.json"
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" > "$pr_live"
            test "$(jq -r '.state' "$pr_live")" = "open"
            test "$(jq -r '.base.ref' "$pr_live")" = "Production"
            test "$(jq -r '.head.repo.full_name' "$pr_live")" = "$GITHUB_REPOSITORY"
            test "$(jq -r '.head.sha' "$pr_live")" = "$source_head_sha"
            test "$(jq -r '.base.sha' "$pr_live")" = "$base_sha"
            candidate_sha="$(jq -r '.merge_commit_sha // empty' "$pr_live")"
            [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
            executed_sha="$source_head_sha"
          fi

          for sha in "$source_head_sha" "$base_sha" "$candidate_sha" "$executed_sha"; do [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; done
          live="$RUNNER_TEMP/live-pr.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" > "$live"
          test "$(jq -r '.state' "$live")" = "open"
          test "$(jq -r '.base.ref' "$live")" = "$branch"
          test "$(jq -r '.head.sha' "$live")" = "$source_head_sha"
          test "$(jq -r '.base.sha' "$live")" = "$base_sha"
          test "$(jq -r '.merge_commit_sha // empty' "$live")" = "$candidate_sha"

          if [[ "$branch" == main ]]; then confirm="ATTEST_DERIVED_STATE_CLOSURE"; else confirm="ATTEST_GOVERNED_PRODUCTION_PROMOTION"; fi
          payload="$RUNNER_TEMP/attestation.json"
          jq -n --arg mode attest --arg owner "${GITHUB_REPOSITORY%%/*}" --arg repo "${GITHUB_REPOSITORY#*/}" --arg branch "$branch" \
            --arg pr "$pr_number" --arg source "$source_head_sha" --arg base "$base_sha" --arg candidate "$candidate_sha" --arg executed "$executed_sha" \
            --arg digest "$evidence_digest" --arg run "$SOURCE_RUN_ID" --arg confirm "$confirm" \
            '{mode:$mode,owner:$owner,repo:$repo,default_branch:$branch,pr_number:($pr|tonumber),source_head_sha:$source,base_sha:$base,candidate_sha:$candidate,executed_sha:$executed,evidence_sha256:$digest,source_run_id:($run|tonumber),confirm:$confirm}' > "$payload"
          # Capability probe is authenticated and read-only. In particular, do not
          # POST to a candidate-only legacy backend that shares the old v3 label.
          preflight_response="$RUNNER_TEMP/attestor-preflight-response.json"
          if ! preflight_http="$(curl --proto '=https' --tlsv1.2 -sS -o "$preflight_response" -w '%{http_code}' "$RUNTIME_BASE_URL/admin/repository-automation/attestor-contract" -H "Authorization: Bearer $BACKEND_API_KEY" -H 'Accept: application/json')"; then
            echo "::error title=Trusted attestor preflight::error_code=attestor_contract_probe_transport_failed" >&2
            exit 1
          fi
          if [[ "$preflight_http" != "200" ]] || ! jq -e --arg branch "$branch" '
            .contract == "github-repository-governance-attestation-v4"
            and .mode == "preflight"
            and .candidate_same_cycle_readback_supported == true
            and .status_response_identity_version == "github-rest-url-bound-v2"
            and .native_status_provider == "installed_github_app"
            and .mutation_executed == false
            and .secrets_included == false
            and (.supported_branches | index($branch) != null)
            and (if $branch == "main" then .main_exact_head_status_supported == true else true end)
          ' "$preflight_response" >/dev/null 2>&1; then
            echo "::error title=Trusted attestor preflight::error_code=attestor_runtime_contract_unverified http_status=${preflight_http}" >&2
            exit 1
          fi
          response="$RUNNER_TEMP/attestation-response.json"
          # Report only an HTTP status and a bounded machine error.code; never emit the body, headers, or credential.
          if ! http="$(curl -sS -o "$response" -w '%{http_code}' -X POST "$RUNTIME_BASE_URL/admin/repository-automation/policy-controller" -H "Authorization: Bearer $BACKEND_API_KEY" -H 'Accept: application/json' -H 'Content-Type: application/json' --data-binary "@$payload")"; then
            echo "::error title=Trusted attestation request::error_code=attestation_transport_failed" >&2
            exit 1
          fi
          if [[ ! "$http" =~ ^[0-9]{3}$ ]]; then
            echo "::error title=Trusted attestation request::error_code=attestation_http_status_invalid" >&2
            exit 1
          fi
          if [[ "$http" != "200" ]]; then
            error_code="$(jq -r 'if (.error.code | type) == "string" then .error.code else "unavailable" end' "$response" 2>/dev/null || true)"
            if [[ ! "$error_code" =~ ^[a-z][a-z0-9_]{2,127}$ ]]; then error_code="unavailable"; fi
            printf '::error title=Trusted attestation rejected::http_status=%s error_code=%s\n' "$http" "$error_code" >&2
            exit 1
          fi
          if ! jq -e --arg branch "$branch" --arg candidate "$candidate_sha" --arg digest "$evidence_digest" '
            .mode == "attest" and .branch == $branch and .candidate_sha == $candidate
            and .contract == "github-repository-governance-attestation-v4"
            and .source_provenance.artifact_digest_sha256 == $digest
            and .same_cycle_readback_proven == true
          ' "$response" >/dev/null 2>&1; then
            echo "::error title=Trusted attestation response::error_code=attestation_response_contract_mismatch" >&2
            exit 1
          fi
          test "$(jq -r '.mode' "$response")" = "attest"
          test "$(jq -r '.branch' "$response")" = "$branch"
          test "$(jq -r '.candidate_sha' "$response")" = "$candidate_sha"
          test "$(jq -r '.source_provenance.artifact_digest_sha256' "$response")" = "$evidence_digest"
          test "$(jq -r '.same_cycle_readback_proven' "$response")" = "true"
          attestor_app_id="$(jq -r '.app_id // empty' "$response")"
          status_creator_id="$(jq -r '.status_creator_id // empty' "$response")"
          attestor_status_id="$(jq -r '.status_id // empty' "$response")"
          head_attestor_status_id="$(jq -r '.head_status_id // empty' "$response")"
          head_status_creator_id="$(jq -r '.head_status_creator_id // empty' "$response")"
          if [[ ! "$attestor_app_id" =~ ^[1-9][0-9]*$ || ! "$status_creator_id" =~ ^[1-9][0-9]*$ || ! "$attestor_status_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=Trusted attestation response::error_code=attestation_identity_readback_missing" >&2
            exit 1
          fi
          [[ "$attestor_app_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$status_creator_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$attestor_status_id" =~ ^[1-9][0-9]*$ ]]
          if [[ "$branch" == main ]]; then
            if [[ ! "$head_attestor_status_id" =~ ^[1-9][0-9]*$ \
                || ! "$head_status_creator_id" =~ ^[1-9][0-9]*$ \
                || "$head_status_creator_id" != "$status_creator_id" \
                || "$head_attestor_status_id" == "$attestor_status_id" \
                || "$(jq -r '.native_required_head_status_proven' "$response")" != true ]]; then
              echo "::error title=Trusted attestation response::error_code=required_head_status_identity_missing" >&2
              exit 1
            fi
          fi
          {
            echo "branch=$branch"
            echo "pr_number=$pr_number"
            echo "source_head_sha=$source_head_sha"
            echo "base_sha=$base_sha"
            echo "candidate_sha=$candidate_sha"
            echo "manual_count=$manual_count"
            echo "attestor_app_id=$attestor_app_id"
            echo "status_creator_id=$status_creator_id"
            echo "attestor_status_id=$attestor_status_id"
            echo "head_attestor_status_id=$head_attestor_status_id"
            echo "head_status_creator_id=$head_status_creator_id"
          } >> "$GITHUB_OUTPUT"

  merge:
    name: Merge objection-free exact head through server policy
    needs: attest
    if: needs.attest.outputs.branch == 'main' && needs.attest.outputs.manual_count == '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout governance finalizer readiness verifier
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.attest.outputs.source_head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Merge exact attested Ready PR without native auto-merge
        env:
          GH_TOKEN: ${{ secrets.REPO_AUTOSYNC_TOKEN }}
          REPO_AUTOSYNC_TOKEN_PRESENT: ${{ secrets.REPO_AUTOSYNC_TOKEN != '' }}
          PR_NUMBER: ${{ needs.attest.outputs.pr_number }}
          PR_HEAD_SHA: ${{ needs.attest.outputs.source_head_sha }}
          BASE_SHA: ${{ needs.attest.outputs.base_sha }}
          CANDIDATE_SHA: ${{ needs.attest.outputs.candidate_sha }}
          ATTESTOR_APP_ID: ${{ needs.attest.outputs.attestor_app_id }}
          STATUS_CREATOR_ID: ${{ needs.attest.outputs.status_creator_id }}
          ATTESTOR_STATUS_ID: ${{ needs.attest.outputs.attestor_status_id }}
          HEAD_ATTESTOR_STATUS_ID: ${{ needs.attest.outputs.head_attestor_status_id }}
          HEAD_STATUS_CREATOR_ID: ${{ needs.attest.outputs.head_status_creator_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REPO_AUTOSYNC_TOKEN_PRESENT" != "true" || -z "$GH_TOKEN" ]]; then
            echo "REPO_AUTOSYNC_TOKEN is required for the exact-head governed merge so the resulting push starts normal post-merge CI." >&2
            exit 1
          fi
          for value in "$PR_HEAD_SHA" "$BASE_SHA" "$CANDIDATE_SHA"; do [[ "$value" =~ ^[0-9a-f]{40}$ ]]; done
          [[ "$ATTESTOR_APP_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$STATUS_CREATOR_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ATTESTOR_STATUS_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$HEAD_ATTESTOR_STATUS_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$HEAD_STATUS_CREATOR_ID" =~ ^[1-9][0-9]*$ ]]

          TARGET_BRANCH=main \
          REQUIRED_CHECK_CONTEXT="Derived State Closure" \
          EXPECTED_HEAD_SHA="$BASE_SHA" \
          EXPECTED_PR_HEAD_SHA="$PR_HEAD_SHA" \
          EXPECTED_CANDIDATE_SHA="$CANDIDATE_SHA" \
          EXPECTED_ATTESTOR_APP_ID="$ATTESTOR_APP_ID" \
          EXPECTED_STATUS_CREATOR_ID="$STATUS_CREATOR_ID" \
          EXPECTED_ATTESTOR_STATUS_ID="$ATTESTOR_STATUS_ID" \
          EXPECTED_HEAD_ATTESTOR_STATUS_ID="$HEAD_ATTESTOR_STATUS_ID" \
          EXPECTED_HEAD_STATUS_CREATOR_ID="$HEAD_STATUS_CREATOR_ID" \
          PR_NUMBER="$PR_NUMBER" \
          node .github/ops/github-followup-automerge-readiness.mjs

          pr="$RUNNER_TEMP/pr.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "$pr"
          test "$(jq -r '.state' "$pr")" = "open"
          test "$(jq -r '.draft' "$pr")" = "false"
          test "$(jq -r '.base.ref' "$pr")" = "main"
          test "$(jq -r '.base.sha' "$pr")" = "$BASE_SHA"
          test "$(jq -r '.head.sha' "$pr")" = "$PR_HEAD_SHA"
          test "$(jq -r '.merge_commit_sha' "$pr")" = "$CANDIDATE_SHA"
          labels="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}" --jq '[.labels[].name]')"
          jq -e 'index("do-not-auto-merge")==null and index("manual-merge")==null and index("manual-review")==null and index("security-review")==null' <<<"$labels" >/dev/null

          set +e
          gh pr merge "$PR_NUMBER" --squash --delete-branch --match-head-commit "$PR_HEAD_SHA"
          merge_rc=$?
          set -e

          pr_readback="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          readback_head_sha="$(jq -r '.head.sha // empty' <<<"$pr_readback")"
          readback_base_ref="$(jq -r '.base.ref // empty' <<<"$pr_readback")"
          readback_merged_at="$(jq -r '.merged_at // empty' <<<"$pr_readback")"
          readback_merge_commit_sha="$(jq -r '.merge_commit_sha // empty' <<<"$pr_readback")"

          if [[ "$readback_head_sha" != "$PR_HEAD_SHA" \
             || "$readback_base_ref" != "main" \
             || -z "$readback_merged_at" \
             || ! "$readback_merge_commit_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Governed exact-head merge was not proven by same-cycle PR readback: rc=${merge_rc}, expected_head=${PR_HEAD_SHA}, readback_head=${readback_head_sha:-none}, base=${readback_base_ref:-none}, merged_at=${readback_merged_at:-none}, merge_commit=${readback_merge_commit_sha:-none}."
            exit "${merge_rc:-1}"
          fi

          gh api "repos/${GITHUB_REPOSITORY}/commits/${readback_merge_commit_sha}" >/dev/null
          gh pr comment "$PR_NUMBER" --body "GOVERNANCE_FINAL_ATTESTATION state=merged candidate_sha=${CANDIDATE_SHA} source_head_sha=${PR_HEAD_SHA} merge_commit_sha=${readback_merge_commit_sha} exact_candidate=true blocking_objections=0 manual_objections=0 server_protection_verified=true native_auto_merge=false" >/dev/null
          echo "Governed exact-head merge verified for PR ${PR_NUMBER}; command_rc=${merge_rc}, merge_commit=${readback_merge_commit_sha}."

  direct_attest:
    name: Independent exact-head App attestation
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      statuses: read
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.confirmation == 'PLAN_DIRECT' || inputs.confirmation == 'DIRECT_ATTEST_EXACT_HEAD' || inputs.confirmation == 'DIRECT_ATTEST_AND_MERGE')
    environment:
      name: Governance-Direct
      deployment: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      pr_number: ${{ steps.direct.outputs.pr_number }}
      source_head_sha: ${{ steps.direct.outputs.source_head_sha }}
      base_sha: ${{ steps.direct.outputs.base_sha }}
      candidate_sha: ${{ steps.direct.outputs.candidate_sha }}
      attestor_app_id: ${{ steps.direct.outputs.attestor_app_id }}
      status_creator_id: ${{ steps.direct.outputs.status_creator_id }}
      attestor_status_id: ${{ steps.direct.outputs.attestor_status_id }}
    steps:
      - name: Bind exact input and explicit owner confirmation
        env:
          MODE: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirmation }}
          HEAD: ${{ inputs.expected_head_sha }}
          PR: ${{ inputs.pr_number }}
          RUN: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "${{ github.repository_owner }}"
          [[ "$HEAD" =~ ^[a-f0-9]{40}$ ]]
          [[ "$PR" =~ ^[1-9][0-9]*$ ]]
          [[ "$RUN" =~ ^[1-9][0-9]*$ ]]
          case "$MODE:$CONFIRM" in
            plan:PLAN_DIRECT|attest:DIRECT_ATTEST_EXACT_HEAD|attest_and_merge:DIRECT_ATTEST_AND_MERGE) ;;
            *) echo "::error::Explicit matching confirmation required"; exit 1 ;;
          esac

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Read current PR identity and canonical source artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          HEAD: ${{ inputs.expected_head_sha }}
          RUN: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" > "$RUNNER_TEMP/direct-pr.json"
          jq -e --arg head "$HEAD" --arg repo "$GITHUB_REPOSITORY" \
            '.state=="open" and .draft==false and .base.ref=="main" and
              .head.sha==$head and .head.repo.full_name==$repo' \
            "$RUNNER_TEMP/direct-pr.json" >/dev/null
          head_branch="$(jq -r '.head.ref' "$RUNNER_TEMP/direct-pr.json")"
          if [[ "$head_branch" == main || "$head_branch" == Production ]]; then
            echo "::error::Protected source branch rejected"; exit 1
          fi
          base="$(jq -r '.base.sha' "$RUNNER_TEMP/direct-pr.json")"
          candidate="$(jq -r '.merge_commit_sha' "$RUNNER_TEMP/direct-pr.json")"
          [[ "$base" =~ ^[a-f0-9]{40}$ ]]
          [[ "$candidate" =~ ^[a-f0-9]{40}$ ]]
          mkdir -p "$RUNNER_TEMP/direct-evidence"
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" \
            -n "derived-state-closure-${RUN}" -D "$RUNNER_TEMP/direct-evidence"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"

      - name: Verify and issue trusted status without Hostinger
        id: direct
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DIRECT_ATTESTOR_ENABLED: ${{ vars.DIRECT_GITHUB_ATTESTOR_ENABLED }}
          DIRECT_GITHUB_APP_ID: ${{ secrets.DIRECT_GITHUB_APP_ID }}
          DIRECT_GITHUB_APP_PRIVATE_KEY: ${{ secrets.DIRECT_GITHUB_APP_PRIVATE_KEY }}
          MODE: ${{ inputs.action }}
          PR: ${{ inputs.pr_number }}
          HEAD: ${{ inputs.expected_head_sha }}
          RUN: ${{ inputs.source_run_id }}
          BASE: ${{ steps.source.outputs.base }}
          CANDIDATE: ${{ steps.source.outputs.candidate }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == "plan" ]]; then operation=plan; else operation=attest; fi
          node .github/scripts/github-direct-attestor.mjs \
            "--pr=$PR" "--head=$HEAD" "--run=$RUN" \
            "--base=$BASE" "--candidate=$CANDIDATE" \
            "--evidence-dir=$RUNNER_TEMP/direct-evidence" "--mode=$operation"

  direct_merge:
    name: Server-enforced exact-head governed merge
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    needs: direct_attest
    if: inputs.action == 'attest_and_merge' && needs.direct_attest.result == 'success'
    environment:
      name: Governance-Direct
      deployment: false
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify same-cycle status, no bypass, merge and readback
        env:
          GH_TOKEN: ${{ secrets.REPO_AUTOSYNC_TOKEN }}
          PR: ${{ needs.direct_attest.outputs.pr_number }}
          HEAD: ${{ needs.direct_attest.outputs.source_head_sha }}
          BASE: ${{ needs.direct_attest.outputs.base_sha }}
          CANDIDATE: ${{ needs.direct_attest.outputs.candidate_sha }}
          APP_ID: ${{ needs.direct_attest.outputs.attestor_app_id }}
          CREATOR: ${{ needs.direct_attest.outputs.status_creator_id }}
          STATUS_ID: ${{ needs.direct_attest.outputs.attestor_status_id }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          for v in "$HEAD" "$BASE" "$CANDIDATE"; do [[ "$v" =~ ^[a-f0-9]{40}$ ]]; done
          for v in "$APP_ID" "$CREATOR" "$STATUS_ID"; do [[ "$v" =~ ^[1-9][0-9]*$ ]]; done
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}")"
          jq -e --arg head "$HEAD" --arg base "$BASE" --arg candidate "$CANDIDATE" \
            '.state=="open" and .draft==false and .base.ref=="main" and
             .head.sha==$head and .base.sha==$base and .merge_commit_sha==$candidate' <<<"$pr" >/dev/null
          labels="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}" --jq '[.labels[].name]')"
          jq -e 'index("do-not-auto-merge")==null and index("manual-merge")==null and
            index("manual-review")==null and index("security-review")==null' <<<"$labels" >/dev/null
          rules="$(gh api "repos/${GITHUB_REPOSITORY}/rulesets?includes_parents=true&per_page=100")"
          rule_id="$(jq -r '[.[] | select(.enforcement=="active" and .name=="MAD4B main review policy") | .id] |
            if length==1 then .[0] else empty end' <<<"$rules")"
          [[ "$rule_id" =~ ^[1-9][0-9]*$ ]]
          rule="$(gh api "repos/${GITHUB_REPOSITORY}/rulesets/${rule_id}")"
          jq -e '.enforcement=="active" and (.bypass_actors|length)==0 and
            any(.rules[]; .type=="required_status_checks" and
              any(.parameters.required_status_checks[]; .context=="Derived State Closure"))' <<<"$rule" >/dev/null
          statuses="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD}/statuses?per_page=100")"
          jq -e --argjson id "$STATUS_ID" --argjson creator "$CREATOR" \
            '([.[] | select(.context=="Derived State Closure")][0] |
              .id==$id and .state=="success" and .creator.id==$creator)' <<<"$statuses" >/dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${CANDIDATE}/statuses?per_page=100" --jq length)" = 0
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${CANDIDATE}/check-runs?per_page=100" --jq .total_count)" = 0
          set +e
          gh pr merge "$PR" --squash --match-head-commit "$HEAD"
          rc=$?
          set -e
          result="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}")"
          jq -e --arg head "$HEAD" '.merged==true and .head.sha==$head and
             .base.ref=="main" and (.merged_at|length)>0 and
             (.merge_commit_sha|test("^[a-f0-9]{40}$"))' <<<"$result" >/dev/null
          sha="$(jq -r '.merge_commit_sha' <<<"$result")"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}" >/dev/null
          echo "DIRECT_ATTESTOR_MERGED pr=$PR head=$HEAD commit=$sha command_rc=$rc"
