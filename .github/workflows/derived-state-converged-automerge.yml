name: Derived State Converged Auto-Merge
run-name: Derived State Converged Auto-Merge · ${{ github.event.workflow_run.id || inputs.source_run_id || github.run_id }}

on:
  workflow_run:
    workflows: [Derived State Closure]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Derived State Closure run ID
        required: true
        type: string
      expected_head_sha:
        description: Exact current PR head SHA
        required: true
        type: string
      confirmation:
        description: Type REGISTER_DERIVED_STATE_AUTOMERGE
        required: true
        type: string

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: derived-state-automerge-${{ github.event.workflow_run.id || inputs.source_run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  register:
    name: Register objection-free exact-head auto-merge
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'REGISTER_DERIVED_STATE_AUTOMERGE')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Resolve canonical objection-free evidence
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.source_run_id }}
          MANUAL_EXPECTED_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_head_sha || '' }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          run="$RUNNER_TEMP/run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > "$run"
          test "$(jq -r '.path' "$run")" = ".github/workflows/derived-state-closure.yml"
          test "$(jq -r '.conclusion' "$run")" = "success"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" > "$RUNNER_TEMP/artifacts.json"
          artifact_id="$(jq -r '[.artifacts[] | select((.name|startswith("derived-state-closure-")) and (.expired==false))][0].id // empty' "$RUNNER_TEMP/artifacts.json")"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          mkdir -p "$RUNNER_TEMP/closure"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$RUNNER_TEMP/closure.zip"
          unzip -q "$RUNNER_TEMP/closure.zip" -d "$RUNNER_TEMP/closure"
          report="$(find "$RUNNER_TEMP/closure" -type f -name report.json | head -n1)"
          objections="$(find "$RUNNER_TEMP/closure" -type f -name policy-objections.json | head -n1)"
          evidence="$(find "$RUNNER_TEMP/closure" -type f -name evidence-finalizer.json | head -n1)"
          test -f "$report"; test -f "$objections"; test -f "$evidence"
          test "$(jq -r '.blocking_stale_or_failed_artifact_count' "$report")" = "0"
          test "$(jq -r '.blocking_count' "$objections")" = "0"
          test "$(jq -r '.manual_count' "$objections")" = "0"
          test "$(jq -r '.automerge_allowed' "$objections")" = "true"
          test "$(jq -r '.converged' "$evidence")" = "true"
          pr_number="$(jq -r '.candidate.pr_number' "$report")"
          head_sha="$(jq -r '.candidate.source_head_sha' "$report")"
          base_sha="$(jq -r '.candidate.base_sha' "$report")"
          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]; [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]; [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ -n "$MANUAL_EXPECTED_HEAD_SHA" ]]; then test "$head_sha" = "$MANUAL_EXPECTED_HEAD_SHA"; fi
          pr="$RUNNER_TEMP/pr.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" > "$pr"
          test "$(jq -r '.state' "$pr")" = "open"
          test "$(jq -r '.draft' "$pr")" = "false"
          test "$(jq -r '.head.sha' "$pr")" = "$head_sha"
          test "$(jq -r '.base.sha' "$pr")" = "$base_sha"
          target_ref="$(jq -r '.head.ref' "$pr")"
          case "$target_ref" in
            main|Production) echo "Protected branch mutation target is forbidden: $target_ref" >&2; exit 1 ;;
          esac
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$base_sha"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${head_sha}" --jq '.behind_by')" = "0"
          labels="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr_number}" --jq '[.labels[].name]')"
          jq -e 'index("do-not-auto-merge")==null and index("manual-merge")==null' <<<"$labels" >/dev/null
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "target_ref=$target_ref" >> "$GITHUB_OUTPUT"

      - name: Register guarded exact-head auto-merge
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REPO_AUTOSYNC_TOKEN || github.token }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          BASE_SHA: ${{ steps.target.outputs.base_sha }}
          TARGET_REF: ${{ steps.target.outputs.target_ref }}
        run: |
          set -euo pipefail
          case "$TARGET_REF" in
            main|Production) echo "Protected branch mutation target is forbidden: $TARGET_REF" >&2; exit 1 ;;
          esac
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$BASE_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')" = "$HEAD_SHA"
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch --match-head-commit "$HEAD_SHA"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="DERIVED_STATE_AUTOMERGE contract=mad4b.derived-state-automerge.v2 state=registered head_sha=${HEAD_SHA} blocking_objections=0 manual_objections=0 exact_head=true" >/dev/null
