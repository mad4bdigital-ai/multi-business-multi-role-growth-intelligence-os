name: Repair PR 6650 E2E Scope

on:
  push:
    branches:
      - fix/work-map-writer-delegation-p1-6647
    paths:
      - .github/ops/repair-pr6650-e2e-scope.trigger

permissions:
  contents: write

concurrency:
  group: repair-pr6650-e2e-scope
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Extend exact single-PR E2E runtime scope
        env:
          EXPECTED_BRANCH: fix/work-map-writer-delegation-p1-6647
          EXPECTED_PRE_REPAIR_HEAD: 319b41d5499d75fc74e719fc7c581c987bdfc611
          TARGET_FILE: .changes/e2e/work-map-recovery-independent-bootstrap.json
          WORKFLOW_FILE: .github/workflows/repair-pr6650-e2e-scope.yml
          TRIGGER_FILE: .github/ops/repair-pr6650-e2e-scope.trigger
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          git fetch origin main "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse origin/${EXPECTED_BRANCH})" = "${GITHUB_SHA}"

          previous_head="$(sed -n 's/^previous_head=//p' "$TRIGGER_FILE")"
          launcher_head="$(sed -n 's/^launcher_head=//p' "$TRIGGER_FILE")"
          repair_contract="$(sed -n 's/^repair_contract=//p' "$TRIGGER_FILE")"
          test "$previous_head" = "$EXPECTED_PRE_REPAIR_HEAD"
          test "$launcher_head" = "$(git rev-parse HEAD^)"
          test "$(git rev-parse HEAD~2)" = "$EXPECTED_PRE_REPAIR_HEAD"
          test "$repair_contract" = "single-pr-e2e-runtime-scope-v1"
          test "$(git rev-list --count HEAD..origin/main)" -eq 0

          rm -f "$WORKFLOW_FILE" "$TRIGGER_FILE"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = '.changes/e2e/work-map-recovery-independent-bootstrap.json';
          const contract = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (contract.delivery_mode !== 'single_pr') throw new Error('delivery_mode must remain single_pr');
          if (contract.current_phase !== 'resilient') throw new Error('current_phase must remain resilient');
          if (contract.secrets_included !== false) throw new Error('secrets_included must remain false');
          const include = contract.scope?.include;
          if (!Array.isArray(include)) throw new Error('scope.include must be an array');
          const required = [
            'http-generic-api/scripts/taxonomy/automation-overlap-policy.json',
            'http-generic-api/test-automation-overlap-analyzer.mjs',
            'http-generic-api/test-supervisor-runtime-assurance-automation.mjs'
          ];
          for (const item of required) {
            if (!include.includes(item)) include.push(item);
          }
          contract.scope.include = [...new Set(include)].sort();
          fs.writeFileSync(file, `${JSON.stringify(contract, null, 2)}\n`);
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "$WORKFLOW_FILE" "$TRIGGER_FILE" "$TARGET_FILE"
          git diff --cached --quiet && { echo "Repair produced no staged change"; exit 1; }
          git commit -m "fix(e2e): cover PR 6650 recovery governance runtime scope"
          NEW_HEAD="$(git rev-parse HEAD)"

          mapfile -t NET_CHANGED < <(git diff --name-only "$EXPECTED_PRE_REPAIR_HEAD" "$NEW_HEAD")
          test "${#NET_CHANGED[@]}" -eq 1
          test "${NET_CHANGED[0]}" = "$TARGET_FILE"
          test -z "$(git status --porcelain)"

          node http-generic-api/scripts/e2e-phase-governance-self-test.mjs
          node http-generic-api/scripts/e2e-parallel-work-governance-self-test.mjs
          node http-generic-api/scripts/e2e-parallel-pr-flow-self-test.mjs
          node http-generic-api/scripts/e2e-parallel-pr-gate.mjs check \
            --base "$(git rev-parse origin/main)" \
            --head "$NEW_HEAD" \
            --head-ref "$EXPECTED_BRANCH" \
            --base-ref main \
            --report-file "${RUNNER_TEMP}/e2e-parallel-work-evaluation.json"
          node http-generic-api/scripts/e2e-phase-governance.mjs check \
            --base "$(git rev-parse origin/main)" \
            --head "$NEW_HEAD" \
            --report-file "${RUNNER_TEMP}/e2e-phase-evaluation.json"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/e2e-parallel-work-evaluation.json', 'utf8'));
          if (report.ok !== true) throw new Error('parallel evaluation did not converge');
          if (report.single_pr_maintenance_contract?.contract_path !== '.changes/e2e/work-map-recovery-independent-bootstrap.json') {
            throw new Error('single-PR maintenance contract was not selected');
          }
          NODE

          git fetch origin "${EXPECTED_BRANCH}"
          test "$(git rev-parse origin/${EXPECTED_BRANCH})" = "${GITHUB_SHA}"
          git push origin "HEAD:${EXPECTED_BRANCH}"
          echo "result_head=${NEW_HEAD}" >> "$GITHUB_STEP_SUMMARY"
