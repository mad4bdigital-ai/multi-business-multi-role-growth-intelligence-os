        env:
          INTEGRATION_BRANCH: gpt/hostinger-safe-storage-cleanup-ssh-20260801
          FINAL_BRANCH: gpt/014-hostinger/sql-lease-identity-alignment-20260802
        run: |
          set -euo pipefail
          git fetch origin "${INTEGRATION_BRANCH}"
          git checkout -B "${FINAL_BRANCH}" "origin/${INTEGRATION_BRANCH}"

          python3 - <<'PY'
