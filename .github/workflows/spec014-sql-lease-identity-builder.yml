          new_insert = "return execute(connection, `/* spec014:insert:leases */ INSERT INTO ${SAFE_TABLES.leases} (id, target_id, lease_id, operation_id, generation, status, expires_at_epoch, record_digest, record_json, row_version) VALUES (?, ?, ?, ?, ?, ?, ?, ?, CAST(? AS JSON), 1)`, [record.lease_id, record.target_id, record.lease_id, record.operation_id, record.generation, record.status, record.expires_at_epoch, ...common]);"
          assert adapter.count(old_insert) == 1
          adapter = adapter.replace(old_insert, new_insert)
          adapter_path.write_text(adapter)

          contract_path = Path('.github/contracts/spec014/hostinger-storage-sql-runtime-contract.json')
          contract = json.loads(contract_path.read_text())
