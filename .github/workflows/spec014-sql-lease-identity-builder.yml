          assert validator.count(anchor) == 1
          validator = validator.replace(anchor, insertion + anchor)
          validator_path.write_text(validator)

          test_path = Path('http-generic-api/test-hostinger-storage-sql-persistence-adapter.mjs')
          test = test_path.read_text()
          old_id = """id: ['operations', 'plans', 'approvals', 'journals', 'reconciliations'].includes(table)
                ? recordKey(table, record)
                : undefined,"""
          new_id = """id: table === 'leases'
                ? record.lease_id
                : ['operations', 'plans', 'approvals', 'journals', 'reconciliations'].includes(table)
                  ? recordKey(table, record)
                  : undefined,"""
          assert test.count(old_id) == 1
          test = test.replace(old_id, new_id)
          acquire_anchor = """}, { expected_generation: 0, now_epoch: 1200 })).generation, 1);

          for (const event of ["""
