name: Spec 014 SQL Lease Identity Builder

on:
  pull_request:
    paths:
      - '.github/workflows/spec014-sql-lease-identity-builder.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: spec014-sql-lease-identity-builder-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout builder candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Build clean lease identity correction
