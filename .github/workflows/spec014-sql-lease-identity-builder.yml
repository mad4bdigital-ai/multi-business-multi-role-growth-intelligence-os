          for (const event of ["""
          assert test.count(acquire_anchor) == 1
          test = test.replace(acquire_anchor, acquire_replacement)
          test_path.write_text(test)
          PY

          node .github/contracts/spec014/validate-hostinger-storage-schema-classification.mjs
          node .github/contracts/spec014/validate-hostinger-storage-sql-runtime-contract.mjs
          node http-generic-api/test-hostinger-storage-sql-persistence-adapter.mjs

          test "$(git diff --name-only | wc -l | tr -d ' ')" = "4"
          git diff --name-only | sort > /tmp/changed-files.txt
          printf '%s\n' \
            '.github/contracts/spec014/hostinger-storage-sql-runtime-contract.json' \
            '.github/contracts/spec014/validate-hostinger-storage-sql-runtime-contract.mjs' \
            'http-generic-api/hostingerStorageSqlPersistenceAdapter.js' \
            'http-generic-api/test-hostinger-storage-sql-persistence-adapter.mjs' \
            | sort > /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/changed-files.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'fix(spec-014): align SQL lease identity with canonical schema'
          git push origin "HEAD:refs/heads/${FINAL_BRANCH}"
