name: Activate Spec 014 Wave 1 Apply cross-run guard writer

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  write-final-tree:
    if: >-
      github.event.pull_request.number == 6454 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.ref == 'fix/spec014-wave1-apply-cross-run-guard-20260805' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.id == 271942579
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      TARGET_BRANCH: fix/spec014-wave1-apply-cross-run-guard-20260805
      EXPECTED_MAIN_SHA: 81525a9e0a16ed86a6ab96b849ff26ad3405bd04
      PATCHER_PATH: .github/workflows/spec014-wave1-apply-cross-run-guard-patcher.yml
      TRIGGER_PATH: .github/ops/spec014-wave1-apply-cross-run-guard-trigger.json
      RUNNER_PATH: .github/workflows/spec014-wave1-apply-cross-run-guard-runner.yml
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact temporary authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${EVENT_HEAD_SHA}"
          test "$(gh api "/repos/${REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')" = "${EVENT_HEAD_SHA}"
          test "$(gh api "/repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "${EXPECTED_MAIN_SHA}"
          node -e "const x=require('./${TRIGGER_PATH}'); if(x.contract!=='spec014-wave1-apply-cross-run-guard-trigger.v1'||x.expected_main_sha!=='${EXPECTED_MAIN_SHA}'||x.migration_apply!==false) process.exit(1)"
          actual="$(git diff --name-only "${EXPECTED_MAIN_SHA}"...HEAD | sort)"
          expected="$(printf '%s\n' "${PATCHER_PATH}" "${TRIGGER_PATH}" "${RUNNER_PATH}" | sort)"
          test "${actual}" = "${expected}"

      - name: Execute embedded bounded writer
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path
          import os
          import subprocess

          path = Path(os.environ['PATCHER_PATH'])
          lines = path.read_text().splitlines()

          def run_block(step_name):
              marker = f'- name: {step_name}'
              start = None
              for index, line in enumerate(lines):
                  if line.strip() == marker:
                      start = index
                      break
              if start is None:
                  raise SystemExit(f'Missing patcher step: {step_name}')
              run_index = None
              run_indent = None
              for index in range(start + 1, len(lines)):
                  stripped = lines[index].strip()
                  indent = len(lines[index]) - len(lines[index].lstrip(' '))
                  if stripped.startswith('- name:') and indent <= 6:
                      break
                  if stripped == 'run: |':
                      run_index = index
                      run_indent = indent
                      break
              if run_index is None:
                  raise SystemExit(f'Missing run block for: {step_name}')
              block = []
              content_indent = run_indent + 2
              for index in range(run_index + 1, len(lines)):
                  line = lines[index]
                  stripped = line.strip()
                  indent = len(line) - len(line.lstrip(' '))
                  if stripped and indent <= run_indent:
                      break
                  block.append(line[content_indent:] if len(line) >= content_indent else '')
              script = '\n'.join(block) + '\n'
              subprocess.run(['bash', '-lc', script], check=True, env=os.environ.copy())

          run_block('Create trigger guard and regression')
          run_block('Patch workflow, executor, contract, and existing regression')
          PY

      - name: Normalize and validate final guarded tree
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/spec014-wave1-apply.yml')
          text = path.read_text()
          text = re.sub(
              r"fromJSON\('\[(?:\\?\"OWNER\\?\",\\?\"MEMBER\\?\",\\?\"COLLABORATOR\\?\")\]'\)",
              "fromJSON('[\"OWNER\",\"MEMBER\",\"COLLABORATOR\"]')",
              text,
          )
          path.write_text(text)
          PY
          node --check .github/ops/spec014-wave1-apply-trigger-guard.mjs
          node --check .github/ops/spec014-wave1-apply.mjs
          node http-generic-api/test-spec014-wave1-apply-trigger-guard.mjs
          node http-generic-api/test-spec014-wave1-apply-contract.mjs
          node -e "JSON.parse(require('fs').readFileSync('.changes/e2e/spec014-wave1-apply-contract.json','utf8'))"
          rm -f "${PATCHER_PATH}" "${TRIGGER_PATH}" "${RUNNER_PATH}"
          git diff --check
          actual="$(git diff --name-only "${EXPECTED_MAIN_SHA}" | sort)"
          expected="$(printf '%s\n' \
            '.changes/e2e/spec014-wave1-apply-contract.json' \
            '.github/ops/spec014-wave1-apply-trigger-guard.mjs' \
            '.github/ops/spec014-wave1-apply.mjs' \
            '.github/workflows/spec014-wave1-apply.yml' \
            'http-generic-api/test-spec014-wave1-apply-contract.mjs' \
            'http-generic-api/test-spec014-wave1-apply-trigger-guard.mjs' | sort)"
          printf 'Final files:\n%s\n' "${actual}"
          test "${actual}" = "${expected}"

      - name: Commit and push final guarded tree
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(spec014): prevent cross-run Wave 1 Apply retries'
          git push origin "HEAD:${TARGET_BRANCH}"
