name: Transport Response Main Sync Writer

on:
  push:
    branches:
      - fix/transport-response-schema-promotion-readiness-20260806
    paths:
      - .github/workflows/transport-response-main-sync-writer.yml

permissions:
  contents: write

concurrency:
  group: transport-response-main-sync-writer
  cancel-in-progress: false

jobs:
  write:
    if: github.repository == 'mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os' && github.ref == 'refs/heads/fix/transport-response-schema-promotion-readiness-20260806'
    runs-on: ubuntu-24.04
    env:
      TARGET_BRANCH: fix/transport-response-schema-promotion-readiness-20260806
      WORKFLOW_PATH: .github/workflows/transport-response-main-sync-writer.yml
      EXPECTED_CONTENT_HEAD: dbe15418f3ef4edf0336db181fa8ab1360726b73
      EXPECTED_MAIN_SHA: c6b933e2f711a93d9b0d556adf5e1111d0f9b981
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify pinned inputs and bounded workflow-only repair chain
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${EXPECTED_MAIN_SHA}"
          test "$(git merge-base "${EXPECTED_CONTENT_HEAD}" HEAD)" = "${EXPECTED_CONTENT_HEAD}"
          mapfile -t repair_files < <(git diff --name-only "${EXPECTED_CONTENT_HEAD}" HEAD | sed '/^$/d')
          test "${#repair_files[@]}" -eq 1
          test "${repair_files[0]}" = "${WORKFLOW_PATH}"
          test -z "$(git status --porcelain)"

      - name: Merge pinned main on a clean tree
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          git merge --no-ff --no-commit "${EXPECTED_MAIN_SHA}"
          merge_rc=$?
          set -e
          mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sed '/^$/d')
          if (( merge_rc != 0 )); then
            test "${#conflicts[@]}" -eq 1
            test "${conflicts[0]}" = "docs/work-maps/README.md"
            git checkout --theirs -- docs/work-maps/README.md
            git add -- docs/work-maps/README.md
          else
            test "${#conflicts[@]}" -eq 0
          fi
          test -f .git/MERGE_HEAD
          test "$(cat .git/MERGE_HEAD)" = "${EXPECTED_MAIN_SHA}"
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          git commit -m "chore: merge main into migration 1048 readiness"
          test -z "$(git status --porcelain)"

      - name: Remove temporary writer after synchronization
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm -- "${WORKFLOW_PATH}"
          test ! -e "${WORKFLOW_PATH}"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install locked API dependencies
        shell: bash
        working-directory: http-generic-api
        run: npm ci --ignore-scripts

      - name: Regenerate canonical Work Maps
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check http-generic-api/scripts/platform-work-map-generator.mjs
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          node http-generic-api/scripts/platform-work-map-generator.mjs --check

      - name: Verify bounded repair scope
        shell: bash
        run: |
          set -Eeuo pipefail
          expected=(
            "${WORKFLOW_PATH}"
            "docs/work-maps/README.md"
            "docs/work-maps/data-model-domain-map.md"
            "docs/work-maps/observability-release-map.md"
            "docs/work-maps/work-map-coverage-matrix.md"
          )
          declare -A allowed=()
          for path in "${expected[@]}"; do allowed["${path}"]=1; done
          mapfile -t actual < <(git diff --name-only HEAD -- . | sed '/^$/d' | sort)
          test "${#actual[@]}" -ge 2
          test "${#actual[@]}" -le "${#expected[@]}"
          for path in "${actual[@]}"; do test -n "${allowed[${path}]:-}"; done
          printf '%s\n' "${actual[@]}" | grep -Fxq -- "${WORKFLOW_PATH}"
          test "$(printf '%s\n' "${actual[@]}" | grep -Fxcv -- "${WORKFLOW_PATH}")" -ge 1
          grep -Eq -- '^> Source hash: `[0-9a-f]{64}`$' docs/work-maps/README.md

      - name: Run focused Work Map and migration verification
        shell: bash
        run: |
          set -Eeuo pipefail
          node http-generic-api/scripts/pipeline-connectivity-check.mjs
          node http-generic-api/scripts/work-map-schema-classification-contract.mjs
          node http-generic-api/scripts/work-map-schema-classification.mjs
          node http-generic-api/test-platform-work-map-generator.mjs
          node http-generic-api/test-pipeline-connectivity-check.mjs
          node http-generic-api/test-work-map-schema-classification.mjs
          node http-generic-api/test-work-map-schema-classification-contract.mjs
          node http-generic-api/test-spec-kit-work-map-governance-gate.mjs
          node http-generic-api/test-transport-response-chunk-schema-recovery.mjs

      - name: Commit and push bounded Work Map repair
        shell: bash
        run: |
          set -Eeuo pipefail
          expected=(
            "${WORKFLOW_PATH}"
            "docs/work-maps/README.md"
            "docs/work-maps/data-model-domain-map.md"
            "docs/work-maps/observability-release-map.md"
            "docs/work-maps/work-map-coverage-matrix.md"
          )
          declare -A allowed=()
          for path in "${expected[@]}"; do allowed["${path}"]=1; done
          git add -A -- "${expected[@]}"
          mapfile -t staged < <(git diff --cached --name-only | sed '/^$/d' | sort)
          test "${#staged[@]}" -ge 2
          test "${#staged[@]}" -le "${#expected[@]}"
          for path in "${staged[@]}"; do test -n "${allowed[${path}]:-}"; done
          printf '%s\n' "${staged[@]}" | grep -Fxq -- "${WORKFLOW_PATH}"
          test "$(printf '%s\n' "${staged[@]}" | grep -Fxcv -- "${WORKFLOW_PATH}")" -ge 1
          git diff --cached --check
          git commit -m "docs(work-maps): refresh migration 1048 readiness maps"
          test -z "$(git status --porcelain)"
          git push origin "HEAD:${TARGET_BRANCH}"
