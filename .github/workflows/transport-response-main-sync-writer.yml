name: Transport Response Main Sync Diagnostic

on:
  push:
    branches:
      - fix/transport-response-schema-promotion-readiness-20260806
    paths:
      - .github/workflows/transport-response-main-sync-writer.yml

permissions:
  contents: read

concurrency:
  group: transport-response-main-sync-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.repository == 'mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os' && github.ref == 'refs/heads/fix/transport-response-schema-promotion-readiness-20260806'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@v5
        with:
          ref: fix/transport-response-schema-promotion-readiness-20260806
          fetch-depth: 0
          persist-credentials: false

      - name: Verify pinned inputs
        shell: bash
        env:
          EXPECTED_CONTENT_HEAD: dbe15418f3ef4edf0336db181fa8ab1360726b73
          EXPECTED_MAIN_SHA: c6b933e2f711a93d9b0d556adf5e1111d0f9b981
        run: |
          set -Eeuo pipefail
          workflow='.github/workflows/transport-response-main-sync-writer.yml'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${EXPECTED_MAIN_SHA}"
          test "$(git diff --name-only "${EXPECTED_CONTENT_HEAD}" HEAD)" = "${workflow}"

      - name: Remove diagnostic workflow locally
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow='.github/workflows/transport-response-main-sync-writer.yml'
          git rm --cached --ignore-unmatch -- "${workflow}"
          rm -f -- "${workflow}"
          test ! -e "${workflow}"

      - name: Merge pinned main locally
        shell: bash
        env:
          EXPECTED_MAIN_SHA: c6b933e2f711a93d9b0d556adf5e1111d0f9b981
        run: |
          set -Eeuo pipefail
          set +e
          git merge --no-ff --no-commit "${EXPECTED_MAIN_SHA}"
          merge_rc=$?
          set -e
          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          if (( merge_rc != 0 )); then
            test "${#conflicts[@]}" = '1'
            test "${conflicts[0]}" = 'docs/work-maps/README.md'
            git checkout --theirs -- docs/work-maps/README.md
            git add docs/work-maps/README.md
          else
            test "${#conflicts[@]}" = '0'
          fi
          test -f .git/MERGE_HEAD
          test "$(cat .git/MERGE_HEAD)" = "${EXPECTED_MAIN_SHA}"
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install locked API dependencies
        shell: bash
        working-directory: http-generic-api
        run: npm ci --ignore-scripts

      - name: Regenerate canonical Work Maps
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check http-generic-api/scripts/platform-work-map-generator.mjs
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          node http-generic-api/scripts/platform-work-map-generator.mjs --check

      - name: Check pipeline connectivity
        shell: bash
        run: node http-generic-api/scripts/pipeline-connectivity-check.mjs

      - name: Check Work Map schema contract
        shell: bash
        run: node http-generic-api/scripts/work-map-schema-classification-contract.mjs

      - name: Check Work Map schema classification
        shell: bash
        run: node http-generic-api/scripts/work-map-schema-classification.mjs

      - name: Test Work Map generator
        shell: bash
        run: node http-generic-api/test-platform-work-map-generator.mjs

      - name: Test pipeline connectivity
        shell: bash
        run: node http-generic-api/test-pipeline-connectivity-check.mjs

      - name: Test Work Map schema classification
        shell: bash
        run: node http-generic-api/test-work-map-schema-classification.mjs

      - name: Test Work Map schema contract
        shell: bash
        run: node http-generic-api/test-work-map-schema-classification-contract.mjs

      - name: Test Spec Kit Work Map governance
        shell: bash
        run: node http-generic-api/test-spec-kit-work-map-governance-gate.mjs

      - name: Test migration 1048 regression
        shell: bash
        run: node http-generic-api/test-transport-response-chunk-schema-recovery.mjs

      - name: Check Surface Contract outputs
        shell: bash
        run: node http-generic-api/scripts/surface-contract-discovery.mjs --check
