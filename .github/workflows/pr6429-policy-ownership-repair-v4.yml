name: PR 6429 Policy Ownership Repair V4

on:
  push:
    branches:
      - gpt/github-main-policy-controller-20260805
    paths:
      - .github/workflows/pr6429-policy-ownership-repair-v4.yml

permissions:
  contents: write

jobs:
  repair-policy-ownership-v4:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v4
        with:
          ref: gpt/github-main-policy-controller-20260805
          fetch-depth: 0

      - name: Apply repository-owned Ruleset boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          controller = "http-generic-api/githubRepositoryPolicyController.js"
          tests = "http-generic-api/test-github-repository-policy-controller.mjs"

          replace_once(
              controller,
              'function evaluateRuleset(detail = {}, checks, finalizerAppId) {',
              'function evaluateRuleset(detail = {}, checks, finalizerAppId, target = {}) {',
              'extend evaluator target',
          )
          replace_once(
              controller,
              '  const matchingFinalizerBypassActors = bypassActors.filter((actor) => finalizerAppId && actor.actor_type === "Integration" && actor.actor_id === finalizerAppId);\n',
              '  const matchingFinalizerBypassActors = bypassActors.filter((actor) => finalizerAppId && actor.actor_type === "Integration" && actor.actor_id === finalizerAppId);\n  const sourceType = compact(detail.source_type || "", 64) || null;\n  const source = compact(detail.source || "", 255) || null;\n  const repositorySource = target.owner && target.repo ? `${target.owner}/${target.repo}` : null;\n',
              'capture Ruleset source identity',
          )
          replace_once(
              controller,
              '    enforcement: detail.enforcement || null,\n    applies_to_main: matchesMainCondition(detail),\n',
              '    enforcement: detail.enforcement || null,\n    source_type: sourceType,\n    source,\n    repository_owned: sourceType === "Repository" && source === repositorySource,\n    applies_to_main: matchesMainCondition(detail, target.default_branch || "main"),\n',
              'bind source identity and main target',
          )
          replace_once(
              controller,
              '.map((item) => evaluateRuleset(item.detail, checks, finalizerAppId));',
              '.map((item) => evaluateRuleset(item.detail, checks, finalizerAppId, target));',
              'pass target into evaluator',
          )
          replace_once(
              controller,
              '  const managedRulesets = evaluatedRulesets.filter((item) => item.name === GITHUB_REPOSITORY_POLICY_RULESET_NAME && item.applies_to_main);\n  const activeManagedRulesets = mainRulesets.filter((item) => item.name === GITHUB_REPOSITORY_POLICY_RULESET_NAME);\n',
              '  const managedRulesets = evaluatedRulesets.filter((item) => item.name === GITHUB_REPOSITORY_POLICY_RULESET_NAME && item.applies_to_main);\n  const repositoryManagedRulesets = managedRulesets.filter((item) => item.repository_owned === true);\n  const activeManagedRulesets = mainRulesets.filter((item) => item.name === GITHUB_REPOSITORY_POLICY_RULESET_NAME);\n',
              'separate repository-owned managed Rulesets',
          )
          replace_once(
              controller,
              '    managed_ruleset_count: managedRulesets.length,\n    active_managed_ruleset_count: activeManagedRulesets.length,\n',
              '    managed_ruleset_count: managedRulesets.length,\n    repository_managed_ruleset_count: repositoryManagedRulesets.length,\n    active_managed_ruleset_count: activeManagedRulesets.length,\n',
              'report repository managed count',
          )
          replace_once(
              controller,
              '  const managedRulesets = (readback?.ruleset_details || []).filter((item) => item.name === GITHUB_REPOSITORY_POLICY_RULESET_NAME && item.applies_to_main);\n  const existingManagedRuleset = managedRulesets.length === 1 ? managedRulesets[0] : null;\n',
              '  const managedRulesets = (readback?.ruleset_details || []).filter((item) => item.name === GITHUB_REPOSITORY_POLICY_RULESET_NAME && item.applies_to_main);\n  const repositoryManagedRulesets = managedRulesets.filter((item) => item.repository_owned === true);\n  const existingManagedRuleset = managedRulesets.length === 1 && repositoryManagedRulesets.length === 1\n    ? repositoryManagedRulesets[0]\n    : null;\n  const managedRulesetBlocked = managedRulesets.length > 1\n    || (managedRulesets.length === 1 && repositoryManagedRulesets.length !== 1);\n',
              'resolve repository-owned managed Ruleset',
          )
          replace_once(
              controller,
              '    operation: existingManagedRuleset ? "update_ruleset" : "create_ruleset",',
              '    operation: managedRulesetBlocked ? "blocked" : existingManagedRuleset ? "update_ruleset" : "create_ruleset",',
              'block inherited managed operation',
          )
          replace_once(
              controller,
              '      managed_ruleset_ambiguity_absent: managedRulesets.length <= 1,\n      repository_auto_merge_disabled: readback?.proof?.auto_merge_disabled === true,\n',
              '      managed_ruleset_ambiguity_absent: managedRulesets.length <= 1,\n      managed_ruleset_repository_owned: managedRulesets.length === 0 || (managedRulesets.length === 1 && repositoryManagedRulesets.length === 1),\n      repository_auto_merge_disabled: readback?.proof?.auto_merge_disabled === true,\n',
              'add repository ownership precondition',
          )
          replace_once(
              controller,
              '  if (preReadback.managed_ruleset_count > 1) {\n    throw controllerError(409, "github_repository_policy_managed_ruleset_ambiguous", "More than one managed main policy Ruleset exists.");\n  }\n',
              '  if (!plan.preconditions.managed_ruleset_ambiguity_absent || preReadback.managed_ruleset_count > 1) {\n    throw controllerError(409, "github_repository_policy_managed_ruleset_ambiguous", "More than one managed main policy Ruleset exists.");\n  }\n  if (!plan.preconditions.managed_ruleset_repository_owned) {\n    throw controllerError(409, "github_repository_policy_managed_ruleset_not_repository_owned", "The matching managed Ruleset is inherited and cannot be mutated by the repository controller.");\n  }\n',
              'enforce ambiguity and ownership',
          )
          replace_once(
              controller,
              '  const previousRuleset = (preReadback.ruleset_details || []).find((item) => item.name === GITHUB_REPOSITORY_POLICY_RULESET_NAME && item.applies_to_main) || null;\n',
              '  const previousRuleset = (preReadback.ruleset_details || []).find((item) => item.name === GITHUB_REPOSITORY_POLICY_RULESET_NAME && item.applies_to_main && item.repository_owned === true) || null;\n',
              'restrict mutable previous Ruleset',
          )
          replace_once(
              controller,
              '  const managed = (postReadback.ruleset_details || []).filter((item) => item.name === GITHUB_REPOSITORY_POLICY_RULESET_NAME && item.applies_to_main);\n  const expectedRulesetFingerprint = plan.desired_ruleset_fingerprint;\n  const postconditions = {\n    main_sha_unchanged: postReadback.main_sha === preReadback.main_sha,\n    one_managed_ruleset: managed.length === 1,\n    ruleset_fingerprint_matches: managed.length === 1 && managed[0].policy_fingerprint === expectedRulesetFingerprint,\n',
              '  const managed = (postReadback.ruleset_details || []).filter((item) => item.name === GITHUB_REPOSITORY_POLICY_RULESET_NAME && item.applies_to_main);\n  const repositoryManaged = managed.filter((item) => item.repository_owned === true);\n  const expectedRulesetFingerprint = plan.desired_ruleset_fingerprint;\n  const postconditions = {\n    main_sha_unchanged: postReadback.main_sha === preReadback.main_sha,\n    one_managed_ruleset: managed.length === 1 && repositoryManaged.length === 1,\n    ruleset_fingerprint_matches: repositoryManaged.length === 1 && repositoryManaged[0].policy_fingerprint === expectedRulesetFingerprint,\n',
              'require repository-owned post-readback',
          )

          replace_once(
              tests,
              '  includeRefs = ["~DEFAULT_BRANCH"],\n  excludeRefs = [],\n} = {}) {\n',
              '  includeRefs = ["~DEFAULT_BRANCH"],\n  excludeRefs = [],\n  sourceType = "Repository",\n  source = `${OWNER}/${REPO}`,\n} = {}) {\n',
              'extend Ruleset fixture source',
          )
          replace_once(
              tests,
              '    enforcement: "active",\n    bypass_actors: bypassActors,\n',
              '    enforcement: "active",\n    source_type: sourceType,\n    source,\n    bypass_actors: bypassActors,\n',
              'add source to Ruleset fixture',
          )
          replace_once(
              tests,
              '      state.ruleset = { id: 42, ...body };\n      state.mutations.push({ method, path, body });\n      return response(201, state.ruleset);\n',
              '      state.ruleset = { id: 42, source_type: "Repository", source: `${OWNER}/${REPO}`, ...body };\n      state.mutations.push({ method, path, body });\n      return response(201, state.ruleset);\n',
              'preserve repository source on create',
          )
          replace_once(
              tests,
              '      state.ruleset = { id: 42, ...body };\n      state.mutations.push({ method, path, body });\n      return response(200, state.ruleset);\n',
              '      state.ruleset = { id: 42, source_type: "Repository", source: `${OWNER}/${REPO}`, ...body };\n      state.mutations.push({ method, path, body });\n      return response(200, state.ruleset);\n',
              'preserve repository source on update',
          )

          inherited_test = '''  {
            const inheritedRuleset = desiredRuleset({ sourceType: "Organization", source: OWNER });
            const mock = createGithubFetch({ initialRuleset: inheritedRuleset });
            const planResult = await runGithubRepositoryPolicyController(
              { mode: "plan", owner: OWNER, repo: REPO },
              controllerDeps(mock.fetchImpl)
            );
            assert.equal(planResult.readback.ruleset_details[0].repository_owned, false);
            assert.equal(planResult.readback.repository_managed_ruleset_count, 0);
            assert.equal(planResult.operation, "blocked");
            assert.equal(planResult.preconditions.managed_ruleset_repository_owned, false);
            await expectCode(
              runGithubRepositoryPolicyController({
                mode: "apply",
                owner: OWNER,
                repo: REPO,
                expected_main_sha: MAIN_SHA,
                expected_policy_fingerprint: planResult.policy_fingerprint,
                confirm: GITHUB_REPOSITORY_POLICY_CONFIRMATION,
                capability_envelope_id: "env-policy-1",
              }, controllerDeps(mock.fetchImpl)),
              "github_repository_policy_managed_ruleset_not_repository_owned"
            );
            assert.equal(mock.state.mutations.length, 0);
          }

          '''
          replace_once(
              tests,
              '  console.log(JSON.stringify({\n',
              inherited_test + '  console.log(JSON.stringify({\n',
              'add inherited Ruleset regression',
          )
          replace_once(
              tests,
              '    postcondition_mismatch_rolls_back: true,\n    secrets_included: false,\n',
              '    postcondition_mismatch_rolls_back: true,\n    inherited_managed_ruleset_rejected: true,\n    secrets_included: false,\n',
              'report inherited Ruleset regression',
          )
          PY

      - name: Install API dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Validate focused repair
        working-directory: http-generic-api
        run: |
          set -euo pipefail
          node test-github-repository-policy-controller.mjs
          node test-repository-automation-policy-facade.mjs
          node test-frontend-surface-dispatch.mjs

      - name: Commit repair and remove all bootstrap workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr6429-policy-review-repair.yml
          rm -f .github/workflows/pr6429-policy-review-trigger.yml
          rm -f .github/workflows/pr6429-policy-review-trigger-v2.yml
          rm -f .github/workflows/pr6429-policy-ownership-repair-v3.yml
          rm -f .github/workflows/pr6429-policy-ownership-repair-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            http-generic-api/githubRepositoryPolicyController.js \
            http-generic-api/test-github-repository-policy-controller.mjs \
            .github/workflows/pr6429-policy-review-repair.yml \
            .github/workflows/pr6429-policy-review-trigger.yml \
            .github/workflows/pr6429-policy-review-trigger-v2.yml \
            .github/workflows/pr6429-policy-ownership-repair-v3.yml \
            .github/workflows/pr6429-policy-ownership-repair-v4.yml
          git diff --cached --check
          git commit -m "fix(github): reject inherited repository policy Rulesets"
          git push origin HEAD:gpt/github-main-policy-controller-20260805
