name: PR 7974 persistent device auth once

on:
  pull_request:
    branches: [main]
    types: [synchronize, edited]

permissions:
  contents: write

concurrency:
  group: pr-7974-persistent-device-auth-once
  cancel-in-progress: false

jobs:
  preserve-persistent-device-auth:
    if: github.event.pull_request.number == 7974 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HEAD_BRANCH: fix/admin-recovery-mcp-local-connector-ownership-20260908
      EXPECTED_PARENT: d8ac1b8f76595ec18af51437fe204977acc35254
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Guard exact parent and branch
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.ref }}" = "$HEAD_BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test -e scripts/pr-7974-persistent-device-auth-once.py
          test -e .github/workflows/pr-7974-persistent-device-auth-once.yml

      - name: Apply bounded persistent-device authorization repair
        shell: bash
        run: |
          set -euo pipefail
          python scripts/pr-7974-persistent-device-auth-once.py
          git diff --check

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'

      - name: Install API dependencies
        working-directory: http-generic-api
        shell: bash
        run: npm ci --ignore-scripts

      - name: Run focused connector regressions
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          node --check services/localManagerDeviceLinkService.js
          node --check routes/localConnectorInstallRoutes.js
          node --check test-connect-routes.mjs
          node --check test-local-manager-tool-release-owner.mjs
          node --check test-local-connector-durable-self-healing.mjs
          node test-connect-routes.mjs
          node test-local-manager-tool-release-owner.mjs
          node test-local-connector-durable-self-healing.mjs
          node test-local-connector-installer-capability.mjs

      - name: Commit repair and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr-7974-persistent-device-auth-once.yml
          rm scripts/pr-7974-persistent-device-auth-once.py
          git add -A
          git diff --cached --check
          git config user.name "mad4bdigital-ai"
          git config user.email "mad4b.digital@gmail.com"
          git commit -m "fix(connector): preserve persistent device authorization"
          git push origin "HEAD:${HEAD_BRANCH}"
