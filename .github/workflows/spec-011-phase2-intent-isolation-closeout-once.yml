name: Spec 011 Phase2 Intent Isolation Closeout Once

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  closeout:
    if: github.event.pull_request.head.ref == 'gpt/spec-011-phase2-intent-isolation-closeout-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out closeout branch
        uses: actions/checkout@v5
        with:
          ref: gpt/spec-011-phase2-intent-isolation-closeout-20260730
          fetch-depth: 0
          persist-credentials: true

      - name: Record bounded phase2 evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('specs/011-durable-governed-execution-and-agent-delegation')
          manifest_path = root / 'manifest.json'
          completion_path = root / 'completion.json'

          manifest = json.loads(manifest_path.read_text())
          manifest.update({
              'phase2_intent_isolation_branch': 'gpt/spec-011-phase2-intent-isolation-20260730',
              'phase2_intent_isolation_pull_request': 3913,
              'phase2_intent_isolation_merge_sha': 'cac09f11651d33d1df42ef2a3d282d3b1d68e8ff',
              'phase2_intent_isolation_source_main_sha': 'e2e98ac7d208ed2d3ca579dd0cdff16dd0554d1f',
              'phase2_intent_isolation_final_ci_head_sha': '5072bbad0561b50c174dbdf37a47877ae6477655',
              'phase2_intent_isolation_ci_run_id': 30587108003,
              'phase2_intent_isolation_generated_refresh_run_id': 30587107913,
              'phase2_intent_isolation_frontend_dispatch_run_id': 30587107894,
              'phase2_intent_isolation_hardcoding_report_run_id': 30587107876,
              'phase2_intent_binding_migration_contract': 'http-generic-api/migrations/20260730_spec011_execution_intent_contract_bindings.sql',
              'phase2_intent_binding_production_migration_applied': False,
              'phase2_intent_binding_production_database_write': False,
              'phase2_intent_binding_production_deployment_performed': False,
              'phase2_intent_binding_production_runtime_verified': False,
              'phase2_intent_isolation_tasks_status': 't123_t124_complete_on_main',
          })
          deliverables = manifest.setdefault('deliverables', [])
          for item in [
              'phase2_intent_first_execution_contract_resolution',
              'phase2_admin_tenant_scope_isolation',
              'phase2_no_secret_resolver_evidence',
              'phase2_intent_binding_ambiguity_fail_closed',
              'phase2_activation_surface_explicit_classification',
          ]:
              if item not in deliverables:
                  deliverables.append(item)
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          completion = json.loads(completion_path.read_text())
          delivery = completion.setdefault('delivery', {})
          delivery['phase2_intent_isolation_pr'] = {
              'number': 3913,
              'branch': 'gpt/spec-011-phase2-intent-isolation-20260730',
              'role': 'phase2_intent_first_admin_tenant_isolation',
              'status': 'merged',
              'merge_sha': 'cac09f11651d33d1df42ef2a3d282d3b1d68e8ff',
          }
          implementation_prs = delivery.setdefault('implementation_prs', [])
          if not any(item.get('number') == 3913 for item in implementation_prs):
              implementation_prs.append({
                  'number': 3913,
                  'role': 'phase2_intent_first_admin_tenant_isolation',
                  'status': 'merged',
                  'merge_sha': 'cac09f11651d33d1df42ef2a3d282d3b1d68e8ff',
              })

          evidence = completion.setdefault('evidence', {})
          evidence['phase2_intent_isolation'] = {
              'status': 'complete_on_main_production_unapplied',
              'source_main_sha': 'e2e98ac7d208ed2d3ca579dd0cdff16dd0554d1f',
              'pull_request': 3913,
              'merge_sha': 'cac09f11651d33d1df42ef2a3d282d3b1d68e8ff',
              'resolver': 'http-generic-api/canonicalExecutionContractResolver.js',
              'intent_binding_resolver': 'http-generic-api/executionIntentBindingResolver.js',
              'migration': 'http-generic-api/migrations/20260730_spec011_execution_intent_contract_bindings.sql',
              'activation_exclusion': 'http-generic-api/activation-surfaces/exclusions/execution_intent_contract_bindings.json',
              'tests': [
                  'http-generic-api/test-canonical-execution-intent-isolation.mjs',
                  'http-generic-api/test-execution-intent-binding-migration-contract.mjs',
              ],
              'design': 'phase2-intent-first-admin-tenant-isolation.md',
              'tasks': ['T123', 'T124'],
              'intent_first_resolution': True,
              'legacy_exact_key_compatibility': True,
              'tenant_ref_required_before_database_read': True,
              'admin_tenant_scope_isolation': True,
              'admin_only_contract_rejection': True,
              'resource_operation_scope_isolation': True,
              'ambiguous_binding_fail_closed': True,
              'explicit_binding_conflict_fail_closed': True,
              'secret_columns_selected': False,
              'customer_specific_seed_rows': False,
              'production_migration_applied': False,
              'production_database_write': False,
              'production_deployment_performed': False,
              'production_runtime_verified': False,
              'provider_dispatch_performed': False,
              'secrets_included': False,
          }
          evidence['phase2_intent_isolation_ci'] = {
              'status': 'pass',
              'head_sha': '5072bbad0561b50c174dbdf37a47877ae6477655',
              'base_sha': 'e2e98ac7d208ed2d3ca579dd0cdff16dd0554d1f',
              'ci_run_id': 30587108003,
              'generated_refresh_run_id': 30587107913,
              'frontend_dispatch_run_id': 30587107894,
              'hardcoding_report_run_id': 30587107876,
              'activation_surface_coverage': 'pass_with_explicit_internal_registry_exclusion',
              'required_checks': [
                  'Syntax Check',
                  'Architecture Drift Detection',
                  'Execution Resolver Gate',
                  'Unit & Integration Tests',
              ],
          }
          evidence['phase2_intent_binding_migration'] = {
              'status': 'contract_on_main_production_unapplied',
              'file': 'http-generic-api/migrations/20260730_spec011_execution_intent_contract_bindings.sql',
              'seed_rows_present': False,
              'fixed_tenant_identifiers_present': False,
              'production_migration_applied': False,
              'production_database_write': False,
              'backfill_performed': False,
              'same_cycle_readback_required_before_apply': True,
          }
          evidence['phase2_intent_isolation_production_verification'] = {
              'status': 'not_executed_migration_registry_population_and_live_readback_required',
              'merge_sha': 'cac09f11651d33d1df42ef2a3d282d3b1d68e8ff',
              'production_migration_applied': False,
              'production_registry_rows_created': False,
              'production_database_write': False,
              'production_deployment_performed': False,
              'production_runtime_verified': False,
              'provider_dispatch_performed': False,
              'rollback_required': False,
              'secrets_included': False,
          }
          audit = evidence.setdefault('post_merge_audit', {})
          audit.update({
              'phase2_intent_isolation_status': 'complete_on_main_production_unapplied',
              'phase2_intent_isolation_pull_request': 3913,
              'phase2_intent_isolation_merge_sha': 'cac09f11651d33d1df42ef2a3d282d3b1d68e8ff',
              'phase2_intent_isolation_ci_status': 'pass',
              'phase2_intent_isolation_tasks': 'T123-T124_complete',
              'phase2_intent_binding_production_migration_applied': False,
              'phase2_intent_isolation_production_runtime_verified': False,
              'spec_status': 'pending_remaining_phases',
          })
          completion_path.write_text(json.dumps(completion, indent=2) + '\n')
          PY

      - name: Validate JSON and bounded diff
        shell: bash
        run: |
          python3 -m json.tool specs/011-durable-governed-execution-and-agent-delegation/manifest.json >/dev/null
          python3 -m json.tool specs/011-durable-governed-execution-and-agent-delegation/completion.json >/dev/null
          allowed='^(specs/011-durable-governed-execution-and-agent-delegation/manifest.json|specs/011-durable-governed-execution-and-agent-delegation/completion.json|.github/workflows/spec-011-phase2-intent-isolation-closeout-once.yml)$'
          bad="$(git status --porcelain --untracked-files=all | sed -E 's/^...//' | grep -Ev "$allowed" || true)"
          test -z "$bad" || { echo 'Unexpected closeout paths:'; echo "$bad"; exit 1; }

      - name: Commit clean closeout
        shell: bash
        run: |
          rm -f .github/workflows/spec-011-phase2-intent-isolation-closeout-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'docs(spec-011): record intent isolation closeout'
          git fetch origin gpt/spec-011-phase2-intent-isolation-closeout-20260730
          git rebase origin/gpt/spec-011-phase2-intent-isolation-closeout-20260730
          git push origin HEAD:gpt/spec-011-phase2-intent-isolation-closeout-20260730
