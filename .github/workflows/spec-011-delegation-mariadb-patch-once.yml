name: Spec 011 Delegation MariaDB Patch Once

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  patch:
    if: github.head_ref == 'gpt/spec-011-phase3-delegation-mariadb-certification-binding-20260730'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: gpt/spec-011-phase3-delegation-mariadb-certification-binding-20260730
          fetch-depth: 0

      - name: Synchronize current main
        shell: bash
        run: |
          git fetch origin main
          git config user.name "admin-assitant-growth-os[bot]"
          git config user.email "admin-assitant-growth-os[bot]@users.noreply.github.com"
          git merge --no-edit origin/main

      - name: Patch lifecycle, adapter, and test manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          lifecycle = Path('http-generic-api/delegationGrantLifecycleShadowService.js')
          source = lifecycle.read_text(encoding='utf-8')
          anchors = [
            (
              '  const grantHash = canonicalGrantHash(grant);',
              '  const persistedGrant = normalizeCanonicalGrant({ ...grant, status: "active" });\n  const grantHash = canonicalGrantHash(persistedGrant);',
            ),
            (
              '    grant,\n    preview_grant_hash: previewHash,',
              '    grant: persistedGrant,\n    preview_grant_hash: previewHash,',
            ),
          ]
          for old, new in anchors:
              if source.count(old) != 1:
                  raise SystemExit(f'Lifecycle patch anchor count invalid: {old}')
              source = source.replace(old, new, 1)
          lifecycle.write_text(source, encoding='utf-8')

          repository = Path('http-generic-api/delegationGrantMariaDbRepository.js')
          source = repository.read_text(encoding='utf-8')
          marker = '\nfunction assertUuid(value, field) {'
          helper = '''

          function sqlDateTime(value) {
            const normalized = iso(value);
            return normalized ? normalized.replace("T", " ").replace("Z", "") : null;
          }
          '''
          if source.count(marker) != 1 or 'function sqlDateTime(value)' in source:
              raise SystemExit('MariaDB SQL date helper anchor invalid')
          source = source.replace(marker, helper + marker, 1)
          replacements = {
            'const createdAt = iso(grant.created_at || receipt.created_at);': 'const createdAt = sqlDateTime(grant.created_at || receipt.created_at);',
            'const expiresAt = iso(grant.expires_at);': 'const expiresAt = sqlDateTime(grant.expires_at);',
            'iso(command.revoked_at),': 'sqlDateTime(command.revoked_at),',
            'iso(command.expired_at),': 'sqlDateTime(command.expired_at),',
            '  iso,\n  tenantOperationKey,': '  iso,\n  sqlDateTime,\n  tenantOperationKey,',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'MariaDB patch anchor missing: {old}')
              source = source.replace(old, new)
          repository.write_text(source, encoding='utf-8')

          manifest = Path('http-generic-api/scripts/test-manifest.mjs')
          source = manifest.read_text(encoding='utf-8')
          anchor = '  "node test-delegation-grant-mariadb-adapter-contract.mjs",\n'
          addition = anchor + '  "node test-delegation-grant-mariadb-readiness-collector.mjs",\n  "node test-delegation-grant-mariadb-runtime-binding.mjs",\n'
          if source.count(anchor) != 1:
              raise SystemExit('Test manifest anchor count invalid')
          manifest.write_text(source.replace(anchor, addition, 1), encoding='utf-8')
          PY

      - name: Run focused tests
        shell: bash
        working-directory: http-generic-api
        run: |
          npm ci
          node --check delegationGrantMariaDbRepository.js
          node --check delegationGrantMariaDbReadinessCollector.js
          node --check delegationGrantMariaDbRuntimeBinding.js
          node --check scripts/delegation-mariadb-disposable-certification.mjs
          node --check scripts/delegation-mariadb-production-cycle.mjs
          node test-delegation-grant-lifecycle-shadow.mjs
          node test-delegation-grant-repository-mutation.mjs
          node test-delegation-grant-mariadb-adapter-contract.mjs
          node test-delegation-grant-mariadb-readiness-collector.mjs
          node test-delegation-grant-mariadb-runtime-binding.mjs

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          rm .github/workflows/spec-011-delegation-mariadb-patch-once.yml
          git config user.name "admin-assitant-growth-os[bot]"
          git config user.email "admin-assitant-growth-os[bot]@users.noreply.github.com"
          git add .
          git diff --cached --check
          git commit -m "feat(spec-011): integrate delegation MariaDB certification"
          git push origin HEAD:gpt/spec-011-phase3-delegation-mariadb-certification-binding-20260730
