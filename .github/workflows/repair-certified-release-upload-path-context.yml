name: Repair Certified Release Upload Path Context

on:
  push:
    branches:
      - fix/certified-release-upload-path-context-20260806
    paths:
      - .github/ops/certified-release-upload-path-context.trigger

permissions:
  contents: write

concurrency:
  group: repair-certified-release-upload-path-context
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Pin immutable branch and main inputs
        id: pin
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          BRANCH_HEAD="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" --jq .object.sha)"
          MAIN_HEAD="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          test "$BRANCH_HEAD" = "$GITHUB_SHA"
          [[ "$MAIN_HEAD" =~ ^[0-9a-f]{40}$ ]]
          echo "main_sha=$MAIN_HEAD" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_MAIN_SHA=$MAIN_HEAD" >> "$GITHUB_ENV"

      - name: Checkout pinned current main tree
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pin.outputs.main_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Patch pinned main registration surface
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          python - <<'PY'
          from pathlib import Path

          expression_open = '$' + '{{'
          workflow_path = Path('.github/workflows/production-certified-release-cut-validation.yml')
          workflow = workflow_path.read_text()
          replacements = {
              '            ' + expression_open + ' env.EVIDENCE_PATH }}': '            ' + expression_open + ' runner.temp }}/certified-production-release-cut.json',
              '            ' + expression_open + ' env.CI_SUMMARY_PATH }}': '            ' + expression_open + ' runner.temp }}/certified-release-ci.json',
          }
          for old, new in replacements.items():
              count = workflow.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              workflow = workflow.replace(old, new)
          workflow_path.write_text(workflow)

          test_path = Path('http-generic-api/test-production-certified-release-cut-validation-registration.mjs')
          test = test_path.read_text()
          anchor = '''assert.ok(finalize.includes('echo "CI_SUMMARY_PATH=${RUNNER_TEMP}/certified-release-ci.json" >> "$GITHUB_ENV"'));'''
          addition = '\n'.join([
              anchor,
              "assert.ok(finalize.includes('" + expression_open + " runner.temp }}/certified-production-release-cut.json'));",
              "assert.ok(finalize.includes('" + expression_open + " runner.temp }}/certified-release-ci.json'));",
              r"assert.doesNotMatch(finalize, /\$\{\{ env\.(?:EVIDENCE_PATH|CI_SUMMARY_PATH) \}\}/);",
          ])
          if test.count(anchor) != 1:
              raise SystemExit('registration-test insertion anchor is missing or ambiguous')
          test_path.write_text(test.replace(anchor, addition))
          PY

          git diff --check
          test "$(git diff --name-only "$EXPECTED_MAIN_SHA" -- | wc -l)" -eq 2
          git diff --name-only "$EXPECTED_MAIN_SHA" -- | grep -Fx '.github/workflows/production-certified-release-cut-validation.yml'
          git diff --name-only "$EXPECTED_MAIN_SHA" -- | grep -Fx 'http-generic-api/test-production-certified-release-cut-validation-registration.mjs'

      - name: Validate exact final repository shape
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -e .github/workflows/repair-certified-release-upload-path-context.yml
          test ! -e .github/ops/certified-release-upload-path-context.trigger
          node http-generic-api/test-production-certified-release-cut-validation-registration.mjs
          node --check http-generic-api/test-production-certified-release-cut-validation-registration.mjs
          git diff --check

      - name: Materialize governed Git blobs
        id: blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          WORKFLOW_BLOB="$(jq -Rs '{content: ., encoding: "utf-8"}' < .github/workflows/production-certified-release-cut-validation.yml | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          TEST_BLOB="$(jq -Rs '{content: ., encoding: "utf-8"}' < http-generic-api/test-production-certified-release-cut-validation-registration.mjs | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          [[ "$WORKFLOW_BLOB" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TEST_BLOB" =~ ^[0-9a-f]{40}$ ]]
          echo "workflow_blob=$WORKFLOW_BLOB" >> "$GITHUB_OUTPUT"
          echo "test_blob=$TEST_BLOB" >> "$GITHUB_OUTPUT"

      - name: Publish synchronized bounded repair commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_BLOB: ${{ steps.blobs.outputs.workflow_blob }}
          TEST_BLOB: ${{ steps.blobs.outputs.test_blob }}
        run: |
          set -Eeuo pipefail
          BRANCH_HEAD="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" --jq .object.sha)"
          MAIN_HEAD="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          test "$BRANCH_HEAD" = "$GITHUB_SHA"
          test "$MAIN_HEAD" = "$EXPECTED_MAIN_SHA"
          BASE_TREE="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${EXPECTED_MAIN_SHA}" --jq .tree.sha)"

          jq -n \
            --arg base_tree "$BASE_TREE" \
            --arg workflow_blob "$WORKFLOW_BLOB" \
            --arg test_blob "$TEST_BLOB" \
            '{base_tree: $base_tree, tree: [
              {path: ".github/workflows/production-certified-release-cut-validation.yml", mode: "100644", type: "blob", sha: $workflow_blob},
              {path: "http-generic-api/test-production-certified-release-cut-validation-registration.mjs", mode: "100644", type: "blob", sha: $test_blob}
            ]}' > "$RUNNER_TEMP/repair-tree.json"
          TREE_SHA="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input "$RUNNER_TEMP/repair-tree.json" --jq .sha)"

          jq -n \
            --arg message 'fix(ci): use runner context for certified release artifact paths' \
            --arg tree "$TREE_SHA" \
            --arg branch_parent "$GITHUB_SHA" \
            --arg main_parent "$EXPECTED_MAIN_SHA" \
            '{message: $message, tree: $tree, parents: [$branch_parent, $main_parent]}' > "$RUNNER_TEMP/repair-commit.json"
          COMMIT_SHA="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input "$RUNNER_TEMP/repair-commit.json" --jq .sha)"
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]

          jq -n --arg sha "$COMMIT_SHA" '{sha: $sha, force: false}' > "$RUNNER_TEMP/repair-ref.json"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${GITHUB_REF_NAME}" --input "$RUNNER_TEMP/repair-ref.json" >/dev/null
          echo "CLEAN_REPAIR_COMMIT=$COMMIT_SHA"
