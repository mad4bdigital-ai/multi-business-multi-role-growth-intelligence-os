name: Bounded OAuth Dependency Composition Writer

on:
  pull_request:
    branches:
      - gpt/write-oauth-dependency-composition-base-a61cd9e8-v1
    types: [opened, reopened, synchronize]
    paths:
      - .changes/probes/oauth-dependency-composition-writer-a61cd9e8-v1.txt

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: write-oauth-dependency-composition-a61cd9e8-v1
  cancel-in-progress: false

jobs:
  patch-test-publish:
    name: Apply and validate exact OAuth dependency patch
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/probe-oauth-dependency-composition-a61cd9e8-v1'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      EXPECTED_MAIN_SHA: a61cd9e83070618001676bbc679bc937f0551875
      EXPECTED_BASE_REF: gpt/write-oauth-dependency-composition-base-a61cd9e8-v1
      TARGET_BRANCH: gpt/probe-oauth-dependency-composition-a61cd9e8-v1
      TRIGGER_FILE: .changes/probes/oauth-dependency-composition-writer-a61cd9e8-v1.txt
      ROUTE_INDEX: http-generic-api/routes/index.js
      OAUTH_FIXTURE: http-generic-api/test-auth-oauth-routes.mjs
      T031_TEST: http-generic-api/test-spec012-t031-oauth-token-route-wiring.mjs

    steps:
      - name: Verify immutable authorization surface
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.base.ref }}" = "$EXPECTED_BASE_REF"
          test "${{ github.event.pull_request.head.ref }}" = "$TARGET_BRANCH"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$EXPECTED_MAIN_SHA"
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/$head_sha" --jq '.parents | length')" -eq 1
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/$head_sha" --jq '.parents[0].sha')" = "$base_sha"
          mapfile -t files < <(gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" --jq '.[].filename')
          test "${#files[@]}" -eq 1
          test "${files[0]}" = "$TRIGGER_FILE"

      - name: Checkout exact authorized probe
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Apply exact patch and capture focused evidence
        id: focused
        shell: bash
        run: |
          set -uo pipefail
          REPORT_DIR="$RUNNER_TEMP/oauth-dependency-composition"
          mkdir -p "$REPORT_DIR"
          source_head="$(git rev-parse HEAD)"
          python - <<'PY'
          from pathlib import Path

          replacements = [
              (
                  Path('http-generic-api/routes/index.js'),
                  'app.use(buildTenantGptOAuthMetadataRoutes());',
                  'app.use(buildTenantGptOAuthMetadataRoutes(deps));',
              ),
              (
                  Path('http-generic-api/test-auth-oauth-routes.mjs'),
                  'app.use(buildTenantGptOAuthMetadataRoutes());',
                  'app.use(buildTenantGptOAuthMetadataRoutes({ getPool: () => oauthClientPool }));',
              ),
              (
                  Path('http-generic-api/test-spec012-t031-oauth-token-route-wiring.mjs'),
                  'const metadataMount = routeIndex.indexOf("app.use(buildTenantGptOAuthMetadataRoutes())");',
                  'const metadataMount = routeIndex.indexOf("app.use(buildTenantGptOAuthMetadataRoutes(deps))");',
              ),
          ]
          for path, old, new in replacements:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one old expression, found {count}')
              if new in text:
                  raise SystemExit(f'{path}: replacement already present before authorized patch')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          trigger = Path('.changes/probes/oauth-dependency-composition-writer-a61cd9e8-v1.txt')
          if not trigger.is_file():
              raise SystemExit('authorization trigger missing')
          trigger.unlink()
          PY
          patch_code=$?

          git diff --check >"$REPORT_DIR/diff-check.log" 2>&1
          diff_code=$?
          node --check "$ROUTE_INDEX" >"$REPORT_DIR/route-index-syntax.log" 2>&1
          route_syntax_code=$?
          node --check "$OAUTH_FIXTURE" >"$REPORT_DIR/oauth-fixture-syntax.log" 2>&1
          fixture_syntax_code=$?
          node --check "$T031_TEST" >"$REPORT_DIR/t031-syntax.log" 2>&1
          t031_syntax_code=$?

          npm --prefix http-generic-api ci >"$REPORT_DIR/npm-ci.log" 2>&1
          npm_code=$?
          if [ "$npm_code" -eq 0 ]; then
            (cd http-generic-api && node test-auth-oauth-routes.mjs) >"$REPORT_DIR/test-auth-oauth-routes.log" 2>&1
            oauth_code=$?
            (cd http-generic-api && node test-spec012-t031-oauth-token-route-wiring.mjs) >"$REPORT_DIR/test-spec012-t031.log" 2>&1
            t031_code=$?
            (cd http-generic-api && node test-chatgpt-mcp-metadata-routing.mjs) >"$REPORT_DIR/test-chatgpt-mcp-metadata-routing.log" 2>&1
            metadata_code=$?
          else
            oauth_code=125
            t031_code=125
            metadata_code=125
          fi

          git status --short >"$REPORT_DIR/git-status.txt"
          jq -n \
            --arg contract 'mad4b.oauth-dependency-composition-writer.v1' \
            --arg base_sha "$EXPECTED_MAIN_SHA" \
            --arg source_head_sha "$source_head" \
            --argjson patch_exit "$patch_code" \
            --argjson diff_exit "$diff_code" \
            --argjson route_syntax_exit "$route_syntax_code" \
            --argjson fixture_syntax_exit "$fixture_syntax_code" \
            --argjson t031_syntax_exit "$t031_syntax_code" \
            --argjson npm_exit "$npm_code" \
            --argjson oauth_test_exit "$oauth_code" \
            --argjson t031_test_exit "$t031_code" \
            --argjson metadata_test_exit "$metadata_code" \
            '{contract:$contract,base_sha:$base_sha,source_head_sha:$source_head_sha,patch_exit:$patch_exit,diff_exit:$diff_exit,route_syntax_exit:$route_syntax_exit,fixture_syntax_exit:$fixture_syntax_exit,t031_syntax_exit:$t031_syntax_exit,npm_exit:$npm_exit,oauth_test_exit:$oauth_test_exit,t031_test_exit:$t031_test_exit,metadata_test_exit:$metadata_test_exit,protected_branch_mutation:false,force_push:false,production_mutated:false,provider_call:false,credential_read:false,sql_executed:false,migration_apply:false,database_mutated:false,external_send:false,secrets_included:false}' \
            >"$REPORT_DIR/summary.json"

          combined=$((patch_code | diff_code | route_syntax_code | fixture_syntax_code | t031_syntax_code | npm_code | oauth_code | t031_code | metadata_code))
          if [ "$combined" -ne 0 ]; then
            for file in "$REPORT_DIR"/*.log; do echo "### $file"; tail -n 120 "$file" || true; done
            exit 1
          fi

      - name: Commit and push validated ordinary update
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_head="${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "$source_head"
          git fetch --no-tags origin "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$source_head"
          mapfile -t changed < <(git status --short)
          test "${#changed[@]}" -eq 4
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$ROUTE_INDEX" "$OAUTH_FIXTURE" "$T031_TEST" "$TRIGGER_FILE"
          git diff --cached --check
          git commit -m 'fix(oauth): forward token-route dependencies'
          result_head="$(git rev-parse HEAD)"
          git push origin "HEAD:$TARGET_BRANCH"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$result_head"
          echo "RESULT_HEAD_SHA=$result_head" >> "$GITHUB_ENV"

      - name: Finalize evidence
        if: always()
        shell: bash
        run: |
          REPORT_DIR="$RUNNER_TEMP/oauth-dependency-composition"
          mkdir -p "$REPORT_DIR"
          if [ -f "$REPORT_DIR/summary.json" ]; then
            jq --arg result_head_sha "${RESULT_HEAD_SHA:-}" '. + {result_head_sha:$result_head_sha}' "$REPORT_DIR/summary.json" > "$REPORT_DIR/summary.final.json"
            mv "$REPORT_DIR/summary.final.json" "$REPORT_DIR/summary.json"
          else
            jq -n --arg result_head_sha "${RESULT_HEAD_SHA:-}" '{contract:"mad4b.oauth-dependency-composition-writer.v1",evidence_initialization_failed:true,result_head_sha:$result_head_sha,secrets_included:false}' > "$REPORT_DIR/summary.json"
          fi

      - name: Upload exact writer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oauth-dependency-composition-writer-${{ github.run_id }}
          path: ${{ runner.temp }}/oauth-dependency-composition
          if-no-files-found: error
          retention-days: 14
