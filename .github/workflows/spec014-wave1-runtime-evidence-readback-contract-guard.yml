name: Spec 014 Wave 1 Runtime Evidence Readback Contract Guard

on:
  pull_request:
    paths:
      - '.github/ops/spec014-wave1-runtime-evidence-readback.mjs'
      - '.github/workflows/spec014-wave1-runtime-evidence-readback.yml'
      - '.github/workflows/spec014-wave1-runtime-evidence-readback-contract-guard.yml'
      - 'http-generic-api/test-spec014-wave1-runtime-evidence-readback-contract.mjs'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Execute phased read-only boundary regression
        id: regression
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          evidence="$RUNNER_TEMP/spec014-wave1-runtime-evidence-readback-contract"
          mkdir -p "$evidence"

          set +e
          node --check .github/ops/spec014-wave1-runtime-evidence-readback.mjs \
            > "$evidence/syntax.stdout.txt" \
            2> "$evidence/syntax.stderr.txt"
          syntax_exit=$?

          node http-generic-api/test-spec014-wave1-runtime-evidence-readback-contract.mjs \
            > "$evidence/contract.stdout.txt" \
            2> "$evidence/contract.stderr.txt"
          contract_exit=$?
          set -e

          jq -n \
            --argjson syntax_exit "$syntax_exit" \
            --argjson contract_exit "$contract_exit" \
            --rawfile syntax_stderr "$evidence/syntax.stderr.txt" \
            --rawfile contract_stdout "$evidence/contract.stdout.txt" \
            --rawfile contract_stderr "$evidence/contract.stderr.txt" \
            '{contract:"spec014_wave1_runtime_evidence_readback_guard_report.v1",syntax_exit:$syntax_exit,contract_exit:$contract_exit,syntax_stderr:($syntax_stderr[0:2000]),contract_stdout:($contract_stdout[0:4000]),contract_stderr:($contract_stderr[0:4000]),runtime_contact:false,database_access:false,migration_apply_executed:false,provider_call_executed:false,credential_payload_accessed:false,external_business_write_executed:false,secrets_included:false}' \
            > "$evidence/report.json"
          cat "$evidence/report.json"
          test "$syntax_exit" = 0
          test "$contract_exit" = 0

      - name: Upload structured contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec014-wave1-runtime-evidence-readback-contract-${{ github.run_id }}
          path: ${{ runner.temp }}/spec014-wave1-runtime-evidence-readback-contract/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce regression outcome
        if: always()
        env:
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
        run: test "$REGRESSION_OUTCOME" = success
