name: Spec 014 Wave 1 Runtime Evidence Readback Contract Guard

on:
  pull_request:
    paths:
      - '.github/ops/spec014-wave1-runtime-evidence-readback.mjs'
      - '.github/workflows/spec014-wave1-runtime-evidence-readback.yml'
      - '.github/workflows/spec014-wave1-runtime-evidence-readback-contract-guard.yml'
      - 'http-generic-api/test-spec014-wave1-runtime-evidence-readback-contract.mjs'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Execute read-only boundary regression
        run: |
          node --check .github/ops/spec014-wave1-runtime-evidence-readback.mjs
          node http-generic-api/test-spec014-wave1-runtime-evidence-readback-contract.mjs \
            > "$RUNNER_TEMP/spec014-wave1-runtime-evidence-readback-contract.json"
          cat "$RUNNER_TEMP/spec014-wave1-runtime-evidence-readback-contract.json"

      - name: Upload structured contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec014-wave1-runtime-evidence-readback-contract-${{ github.run_id }}
          path: ${{ runner.temp }}/spec014-wave1-runtime-evidence-readback-contract.json
          if-no-files-found: error
          retention-days: 14
