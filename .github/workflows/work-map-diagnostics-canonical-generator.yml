name: Work Map Diagnostics Canonical Generator

on:
  push:
    branches:
      - gpt/work-map-diagnostics-generated-e123-20260804
    paths:
      - .github/workflows/work-map-diagnostics-canonical-generator.yml

permissions:
  contents: write

concurrency:
  group: work-map-diagnostics-canonical-generator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact launcher head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify bounded relaunch topology
        shell: bash
        env:
          EXPECTED_PARENT: e59da3b47744cf29bf3a380a54c8111fd48dd74b
          LAUNCHER_PATH: .github/workflows/work-map-diagnostics-canonical-generator.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$LAUNCHER_PATH"
          test -z "$(git status --porcelain)"

      - name: Validate focused diagnostics regression
        shell: bash
        run: |
          set -euo pipefail
          node --check http-generic-api/test-work-map-autofix-validation-diagnostics.mjs
          node http-generic-api/test-work-map-autofix-validation-diagnostics.mjs

      - name: Generate twice and prove current output
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          unexpected="$(git diff --name-only | grep -v '^docs/work-maps/' || true)"
          test -z "$unexpected"
          test -n "$(git diff --name-only -- docs/work-maps)"
          first_hash="$(git diff --binary -- docs/work-maps | sha256sum | awk '{print $1}')"
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          second_hash="$(git diff --binary -- docs/work-maps | sha256sum | awk '{print $1}')"
          test "$first_hash" = "$second_hash"
          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          git diff --check

      - name: Remove launcher and commit generated maps
        shell: bash
        env:
          BRANCH: gpt/work-map-diagnostics-generated-e123-20260804
          EVENT_SHA: ${{ github.sha }}
          LAUNCHER_PATH: .github/workflows/work-map-diagnostics-canonical-generator.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_SHA"
          rm "$LAUNCHER_PATH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/work-maps
          git add -u "$LAUNCHER_PATH"
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -ge 2
          for path in "${staged[@]}"; do
            if [[ "$path" != "$LAUNCHER_PATH" && "$path" != docs/work-maps/* ]]; then
              echo "Unexpected staged path: $path"
              exit 1
            fi
          done
          git diff --cached --check
          git commit -m 'docs(work-maps): refresh diagnostics source maps'
          remote_head="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EVENT_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Final safety summary
        shell: bash
        run: |
          set -euo pipefail
          echo 'WORK_MAP_CANONICAL_GENERATION=success'
          echo "RESULT_HEAD_SHA=$(git rev-parse HEAD)"
          echo 'OUTPUT_SCOPE=docs/work-maps/**'
          echo 'SECRETS_INCLUDED=false'
          echo 'PROVIDER_DISPATCH=false'
          echo 'LIVE_DATABASE_ACCESS=false'
          echo 'MIGRATION_APPLY=false'
          echo 'PRODUCTION_MUTATION=false'
