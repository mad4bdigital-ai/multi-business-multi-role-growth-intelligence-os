name: Patch Spec 014 Tenant Base runtime hardening

on:
  push:
    branches:
      - gpt/014-hostinger/tenant-canary-postmerge-hardening-20260801
    paths:
      - .github/workflows/spec014-tenant-base-runtime-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gpt/014-hostinger/tenant-canary-postmerge-hardening-20260801
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply Base runtime hardening
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const basePath = 'http-generic-api/hostingerStorageTenantCanaryBase.js';
          let base = fs.readFileSync(basePath, 'utf8');

          const importAnchor = "import { verifyHostingerStorageTenantCanaryAuthorization } from './hostingerStorageTenantCanaryPolicy.js';\n";
          if (!base.includes(importAnchor)) throw new Error('Base import anchor missing');
          base = base.replace(importAnchor, `${importAnchor}import { createHostingerStorageSyntheticAdapter } from './hostingerStorageSyntheticAdapter.js';\nimport {\n  createHostingerStorageControlPlaneRepository,\n  createMemoryHostingerStoragePersistenceAdapter,\n} from './hostingerStorageControlPlaneRepository.js';\n`);

          const constantsAnchor = "const SHA256_RE = /^[0-9a-f]{64}$/i;\n";
          if (!base.includes(constantsAnchor)) throw new Error('Base constants anchor missing');
          base = base.replace(constantsAnchor, `${constantsAnchor}\nconst REQUIRED_REPOSITORY_METHODS = Object.freeze([\n  'readAggregate',\n  'transitionOperation',\n  'consumePlan',\n  'appendJournalEvent',\n  'recordReconciliation',\n]);\nconst CANONICAL_ADAPTER_KEY = 'hostinger_storage_synthetic_memory_adapter_v1';\nconst CANONICAL_ADAPTER_VERSION = 'spec014-hostinger-storage-synthetic-adapter-v1';\nconst CANONICAL_REPOSITORY_VERSION = 'spec014-storage-control-plane-repository-v1';\nconst CANONICAL_REPOSITORY_ADAPTER_KEY = 'hostinger_storage_memory_test_adapter_v1';\nconst AUTHORITY_STORE_KEY = 'memory_hostinger_storage_tenant_canary_authority_v1';\nconst ENABLEMENT_REGISTRY_KEY = 'memory_hostinger_storage_tenant_canary_enablement_v1';\nconst tenantCanaryAdapters = new WeakSet();\nconst tenantCanaryRepositories = new WeakSet();\nconst tenantCanaryAuthorityStores = new WeakSet();\nconst tenantCanaryEnablementRegistries = new WeakSet();\n`);

          const cloneAnchor = "function clone(value) {\n  return value === undefined ? undefined : structuredClone(value);\n}\n";
          if (!base.includes(cloneAnchor)) throw new Error('Base clone anchor missing');
          base = base.replace(cloneAnchor, `${cloneAnchor}\nfunction snapshotAuthorityRecord(record, tokenField, normalizeToken) {\n  if (!record || typeof record !== 'object') {\n    throw fail(400, 'STORAGE_TENANT_CANARY_AUTHORITY_TOKEN_INPUT_INVALID', 'Authority update record must be a plain data object.', { field: tokenField });\n  }\n  const descriptors = Object.getOwnPropertyDescriptors(record);\n  const tokenDescriptor = descriptors[tokenField];\n  if (!tokenDescriptor || !Object.hasOwn(tokenDescriptor, 'value') || typeof tokenDescriptor.value !== 'string') {\n    throw fail(400, 'STORAGE_TENANT_CANARY_AUTHORITY_TOKEN_INPUT_INVALID', 'Authority token must be an owned primitive string value.', { field: tokenField });\n  }\n  const snapshot = {};\n  for (const [field, descriptor] of Object.entries(descriptors)) {\n    if (!Object.hasOwn(descriptor, 'value')) {\n      throw fail(400, 'STORAGE_TENANT_CANARY_AUTHORITY_TOKEN_INPUT_INVALID', 'Authority update records must not contain accessor properties.', { field });\n    }\n    snapshot[field] = descriptor.value;\n  }\n  const normalizedToken = normalizeToken(tokenDescriptor.value);\n  snapshot[tokenField] = normalizedToken;\n  return { snapshot, normalizedToken };\n}\n\nexport function createHostingerStorageTenantCanarySyntheticAdapter(options = {}) {\n  const adapter = createHostingerStorageSyntheticAdapter(options);\n  tenantCanaryAdapters.add(adapter);\n  return adapter;\n}\n\nexport function createHostingerStorageTenantCanaryControlPlaneRepository({ snapshot = null } = {}) {\n  const persistence = createMemoryHostingerStoragePersistenceAdapter({ snapshot });\n  const repository = createHostingerStorageControlPlaneRepository({ adapter: persistence });\n  tenantCanaryRepositories.add(repository);\n  return repository;\n}\n`);

          const authorityPattern = /export function createMemoryHostingerStorageTenantCanaryAuthorityStore\(\) \{[\s\S]*?\n\}\n\nexport function createMemoryHostingerStorageTenantCanaryEnablementRegistry/;
          if (!authorityPattern.test(base)) throw new Error('Authority factory block missing');
          const authorityReplacement = `export function createMemoryHostingerStorageTenantCanaryAuthorityStore() {\n  const allowlists = new Map();\n  const approvals = new Map();\n  const allowlistRevisionHistory = new Map();\n  const approvalEvidenceHistory = new Map();\n\n  function remember(history, id, value) {\n    const values = history.get(id) || new Set();\n    values.add(value);\n    history.set(id, values);\n  }\n\n  const store = {\n    adapter_key: AUTHORITY_STORE_KEY,\n    synthetic_only: true,\n    production_ready: false,\n    registerAllowlist(record) {\n      const normalized = deepFreeze(normalizeCurrentAllowlist(record));\n      const existing = allowlists.get(normalized.allowlist_id);\n      if (existing && digest(existing) !== digest(normalized)) throw fail(409, 'STORAGE_TENANT_CANARY_ALLOWLIST_ID_CONFLICT', 'Allowlist ID is already bound to different authority evidence.');\n      if (!existing) allowlists.set(normalized.allowlist_id, normalized);\n      remember(allowlistRevisionHistory, normalized.allowlist_id, normalized.revision);\n      return clone(allowlists.get(normalized.allowlist_id));\n    },\n    updateAllowlist({ allowlist_id, expected_revision, record } = {}) {\n      const id = safeId(allowlist_id, 'allowlist_id');\n      const current = allowlists.get(id);\n      if (!current) throw fail(404, 'STORAGE_TENANT_CANARY_ALLOWLIST_NOT_FOUND', 'Authoritative allowlist record was not found.');\n      const expectedRevision = safeId(expected_revision, 'expected_revision');\n      if (current.revision !== expectedRevision) throw fail(409, 'STORAGE_TENANT_CANARY_ALLOWLIST_REVISION_CONFLICT', 'Allowlist revision changed before update.', { current_revision: current.revision });\n      const { snapshot, normalizedToken: nextRevision } = snapshotAuthorityRecord(record, 'revision', (value) => safeId(value, 'allowlist.revision'));\n      const history = allowlistRevisionHistory.get(id) || new Set([current.revision]);\n      if (nextRevision !== current.revision && history.has(nextRevision)) {\n        throw fail(409, 'STORAGE_TENANT_CANARY_ALLOWLIST_TOKEN_REUSED', 'Allowlist revisions are monotonic and may never be reused.', {\n          allowlist_id: id,\n          current_revision: current.revision,\n          rejected_revision: nextRevision,\n        });\n      }\n      const normalized = deepFreeze(normalizeCurrentAllowlist({ ...snapshot, allowlist_id: id }));\n      if (normalized.revision === current.revision) {\n        throw fail(409, 'STORAGE_TENANT_CANARY_ALLOWLIST_REVISION_NOT_ADVANCED', 'Allowlist updates must advance the authoritative revision token.', { current_revision: current.revision });\n      }\n      allowlists.set(id, normalized);\n      remember(allowlistRevisionHistory, id, normalized.revision);\n      return clone(normalized);\n    },\n    readAllowlist(allowlistId) {\n      return clone(allowlists.get(safeId(allowlistId, 'allowlist_id')) || null);\n    },\n    registerApproval(record) {\n      const normalized = deepFreeze(normalizeCurrentApproval(record));\n      const existing = approvals.get(normalized.approval_id);\n      if (existing && digest(existing) !== digest(normalized)) throw fail(409, 'STORAGE_TENANT_CANARY_APPROVAL_ID_CONFLICT', 'Approval ID is already bound to different authority evidence.');\n      if (!existing) approvals.set(normalized.approval_id, normalized);\n      remember(approvalEvidenceHistory, normalized.approval_id, normalized.evidence_digest);\n      return clone(approvals.get(normalized.approval_id));\n    },\n    updateApproval({ approval_id, expected_evidence_digest, record } = {}) {\n      const id = safeId(approval_id, 'approval_id');\n      const current = approvals.get(id);\n      if (!current) throw fail(404, 'STORAGE_TENANT_CANARY_APPROVAL_NOT_FOUND', 'Authoritative approval record was not found.');\n      const expectedEvidenceDigest = hash(expected_evidence_digest, 'expected_evidence_digest');\n      if (current.evidence_digest !== expectedEvidenceDigest) throw fail(409, 'STORAGE_TENANT_CANARY_APPROVAL_EVIDENCE_CONFLICT', 'Approval evidence changed before update.');\n      const { snapshot, normalizedToken: nextEvidence } = snapshotAuthorityRecord(record, 'evidence_digest', (value) => hash(value, 'approval.evidence_digest'));\n      const history = approvalEvidenceHistory.get(id) || new Set([current.evidence_digest]);\n      if (nextEvidence !== current.evidence_digest && history.has(nextEvidence)) {\n        throw fail(409, 'STORAGE_TENANT_CANARY_APPROVAL_TOKEN_REUSED', 'Approval evidence tokens are monotonic and may never be reused.', {\n          approval_id: id,\n          current_evidence_digest: current.evidence_digest,\n          rejected_evidence_digest: nextEvidence,\n        });\n      }\n      const normalized = deepFreeze(normalizeCurrentApproval({ ...snapshot, approval_id: id }));\n      if (normalized.evidence_digest === current.evidence_digest) {\n        throw fail(409, 'STORAGE_TENANT_CANARY_APPROVAL_EVIDENCE_NOT_ADVANCED', 'Approval updates must advance the authoritative evidence token.', { current_evidence_digest: current.evidence_digest });\n      }\n      approvals.set(id, normalized);\n      remember(approvalEvidenceHistory, id, normalized.evidence_digest);\n      return clone(normalized);\n    },\n    readApproval(approvalId) {\n      return clone(approvals.get(safeId(approvalId, 'approval_id')) || null);\n    },\n    exportState() {\n      return clone({\n        allowlists: [...allowlists.values()].sort((left, right) => left.allowlist_id.localeCompare(right.allowlist_id)),\n        approvals: [...approvals.values()].sort((left, right) => left.approval_id.localeCompare(right.approval_id)),\n      });\n    },\n  };\n  tenantCanaryAuthorityStores.add(store);\n  return Object.freeze(store);\n}\n\nexport function createMemoryHostingerStorageTenantCanaryEnablementRegistry`;
          base = base.replace(authorityPattern, authorityReplacement);

          const registryReturn = "  return Object.freeze(registry);\n}\n\nfunction requireAuthorityStore";
          if (!base.includes(registryReturn)) throw new Error('Registry return anchor missing');
          base = base.replace(registryReturn, "  tenantCanaryEnablementRegistries.add(registry);\n  return Object.freeze(registry);\n}\n\nfunction requireAuthorityStore");

          const requirePattern = /function requireAuthorityStore\(store\) \{[\s\S]*?\n\}\n\nfunction requireRegistry\(registry\) \{[\s\S]*?\n\}\n\nfunction requireControlPlaneRepository\(repository\) \{[\s\S]*?\n\}/;
          if (!requirePattern.test(base)) throw new Error('Require blocks missing');
          base = base.replace(requirePattern, `function requireAuthorityStore(store) {\n  if (!store\n    || !tenantCanaryAuthorityStores.has(store)\n    || !Object.isFrozen(store)\n    || store.adapter_key !== AUTHORITY_STORE_KEY\n    || store.synthetic_only !== true\n    || store.production_ready !== false\n    || typeof store.readAllowlist !== 'function'\n    || typeof store.readApproval !== 'function') {\n    throw fail(409, 'STORAGE_TENANT_CANARY_AUTHORITY_STORE_INVALID', 'A Tenant-factory-owned non-production authoritative canary store is required.', {\n      authority_store_provenance: 'tenant_factory_owned_required',\n    });\n  }\n}\n\nfunction requireRegistry(registry) {\n  if (!registry\n    || !tenantCanaryEnablementRegistries.has(registry)\n    || !Object.isFrozen(registry)\n    || registry.adapter_key !== ENABLEMENT_REGISTRY_KEY\n    || registry.synthetic_only !== true\n    || registry.production_ready !== false\n    || typeof registry.read !== 'function'\n    || typeof registry.consume !== 'function') {\n    throw fail(409, 'STORAGE_TENANT_CANARY_ENABLEMENT_REGISTRY_INVALID', 'A Tenant-factory-owned non-production one-shot enablement registry is required.', {\n      enablement_registry_provenance: 'tenant_factory_owned_required',\n    });\n  }\n}\n\nfunction requireControlPlaneRepository(repository) {\n  const missing = REQUIRED_REPOSITORY_METHODS.filter((method) => typeof repository?.[method] !== 'function');\n  if (!repository\n    || !tenantCanaryRepositories.has(repository)\n    || !Object.isFrozen(repository)\n    || repository.repository_version !== CANONICAL_REPOSITORY_VERSION\n    || repository.adapter_key !== CANONICAL_REPOSITORY_ADAPTER_KEY\n    || repository.production_ready !== false\n    || missing.length) {\n    throw fail(409, 'STORAGE_TENANT_CANARY_CONTROL_PLANE_INVALID', 'Tenant canary requires a repository created by the Tenant-owned in-memory control-plane factory.', {\n      repository_provenance: 'tenant_factory_owned_required',\n      expected_repository_version: CANONICAL_REPOSITORY_VERSION,\n      expected_adapter_key: CANONICAL_REPOSITORY_ADAPTER_KEY,\n      required_methods: REQUIRED_REPOSITORY_METHODS,\n      missing_methods: missing,\n    });\n  }\n}`);

          const adapterOld = "  if (!adapter || adapter.synthetic_only !== true || adapter.production_ready !== false || adapter.live_provider !== false\n    || adapter.filesystem_access !== false || adapter.shell_access !== false\n    || typeof adapter.mutateExact !== 'function' || typeof adapter.readbackItem !== 'function'\n    || typeof adapter.readMutationReceipt !== 'function') {\n    throw fail(409, 'STORAGE_TENANT_CANARY_EXECUTOR_ADAPTER_INVALID', 'Canary execution requires the canonical in-memory synthetic adapter contract.');\n  }";
          if (!base.includes(adapterOld)) throw new Error('Adapter validation anchor missing');
          const adapterNew = "  if (!adapter\n    || !tenantCanaryAdapters.has(adapter)\n    || !Object.isFrozen(adapter)\n    || adapter.adapter_key !== CANONICAL_ADAPTER_KEY\n    || adapter.adapter_version !== CANONICAL_ADAPTER_VERSION\n    || adapter.synthetic_only !== true\n    || adapter.production_ready !== false\n    || adapter.live_provider !== false\n    || adapter.filesystem_access !== false\n    || adapter.shell_access !== false\n    || typeof adapter.mutateExact !== 'function'\n    || typeof adapter.readbackItem !== 'function'\n    || typeof adapter.readMutationReceipt !== 'function') {\n    throw fail(409, 'STORAGE_TENANT_CANARY_EXECUTOR_ADAPTER_INVALID', 'Canary execution requires an adapter created by the Tenant-owned synthetic adapter factory.', {\n      adapter_provenance: 'tenant_factory_owned_required',\n      expected_adapter_key: CANONICAL_ADAPTER_KEY,\n      expected_adapter_version: CANONICAL_ADAPTER_VERSION,\n    });\n  }";
          base = base.replace(adapterOld, adapterNew);

          const planAnchor = "    if (plan.candidate_set_hash !== protocol.candidate_set_hash) planMismatches.push('candidate_set_hash');\n";
          if (!base.includes(planAnchor)) throw new Error('Plan authority anchor missing');
          base = base.replace(planAnchor, `${planAnchor}    if (plan.authority_context_hash !== aggregate.operation.authority_context_hash) planMismatches.push('authority_context_hash');\n    if (plan.ownership_revision !== aggregate.operation.ownership_revision) planMismatches.push('ownership_revision');\n    if (plan.policy_revision !== aggregate.operation.policy_revision) planMismatches.push('policy_revision');\n`);
          fs.writeFileSync(basePath, base);

          fs.writeFileSync('http-generic-api/hostingerStorageTenantCanary.js', `export {\n  HOSTINGER_STORAGE_TENANT_CANARY_VERSION,\n  createHostingerStorageTenantCanaryControlPlaneRepository,\n  createHostingerStorageTenantCanarySyntheticAdapter,\n  createMemoryHostingerStorageTenantCanaryAuthorityStore,\n  createMemoryHostingerStorageTenantCanaryEnablementRegistry,\n  executeHostingerStorageTenantCanary,\n} from './hostingerStorageTenantCanaryBase.js';\n`);

          const testPath = 'http-generic-api/test-hostinger-storage-tenant-canary-postmerge-hardening.mjs';
          let test = fs.readFileSync(testPath, 'utf8');
          const importAnchorTest = "import { buildHostingerStorageTenantCanaryAuthorization } from './hostingerStorageTenantCanaryPolicy.js';\n";
          if (!test.includes(importAnchorTest)) throw new Error('Test import anchor missing');
          test = test.replace(importAnchorTest, `${importAnchorTest}import { executeHostingerStorageTenantCanary as executeTenantCanaryBaseDirect } from './hostingerStorageTenantCanaryBase.js';\n`);
          const consoleAnchor = "console.log(JSON.stringify({\n";
          if (!test.includes(consoleAnchor)) throw new Error('Test console anchor missing');
          const regressions = `const forgedAuthorityFixture = createSyntheticExecutorFixture({\n  run_id: 'tenant-canary-forged-authority-run',\n  operation_id: 'tenant-canary-forged-authority-operation',\n  plan_id: 'tenant-canary-forged-authority-plan',\n  target_id: 'tenant-canary-forged-authority-target',\n});\nconst forgedAuthorityAuthorization = buildAuthorization(forgedAuthorityFixture);\nconst forgedAuthorityPrepared = prepare(forgedAuthorityFixture, forgedAuthorityAuthorization);\nconst forgedAuthorityStore = Object.freeze({\n  adapter_key: 'memory_hostinger_storage_tenant_canary_authority_v1',\n  synthetic_only: true,\n  production_ready: false,\n  readAllowlist: () => structuredClone(forgedAuthorityAuthorization.authorization.allowlist),\n  readApproval: () => structuredClone(forgedAuthorityAuthorization.authorization.workspace_owner_approval),\n});\nassert.throws(\n  () => executeTenantCanaryBaseDirect({\n    canary_authorization: forgedAuthorityAuthorization,\n    protocol: forgedAuthorityFixture.protocol.protocol,\n    protocol_digest: forgedAuthorityFixture.protocol.protocol_digest,\n    repository: forgedAuthorityFixture.repository,\n    adapter: forgedAuthorityFixture.adapter,\n    authority_store: forgedAuthorityStore,\n    enablement_registry: forgedAuthorityPrepared.registry,\n    now_epoch: 1100,\n  }),\n  (error) => error.code === 'STORAGE_TENANT_CANARY_AUTHORITY_STORE_INVALID'\n    && error.details?.authority_store_provenance === 'tenant_factory_owned_required',\n);\nassertUnconsumedAndUnchanged(forgedAuthorityFixture, forgedAuthorityPrepared.registry);\n\nconst forgedRegistryFixture = createSyntheticExecutorFixture({\n  run_id: 'tenant-canary-forged-registry-run',\n  operation_id: 'tenant-canary-forged-registry-operation',\n  plan_id: 'tenant-canary-forged-registry-plan',\n  target_id: 'tenant-canary-forged-registry-target',\n});\nconst forgedRegistryAuthorization = buildAuthorization(forgedRegistryFixture);\nconst forgedRegistryPrepared = prepare(forgedRegistryFixture, forgedRegistryAuthorization);\nconst forgedRegistry = Object.freeze({\n  adapter_key: 'memory_hostinger_storage_tenant_canary_enablement_v1',\n  synthetic_only: true,\n  production_ready: false,\n  read: () => ({}),\n  consume: () => ({}),\n  exportState: () => [],\n});\nassert.throws(\n  () => executeTenantCanaryBaseDirect({\n    canary_authorization: forgedRegistryAuthorization,\n    protocol: forgedRegistryFixture.protocol.protocol,\n    protocol_digest: forgedRegistryFixture.protocol.protocol_digest,\n    repository: forgedRegistryFixture.repository,\n    adapter: forgedRegistryFixture.adapter,\n    authority_store: forgedRegistryPrepared.authorityStore,\n    enablement_registry: forgedRegistry,\n    now_epoch: 1100,\n  }),\n  (error) => error.code === 'STORAGE_TENANT_CANARY_ENABLEMENT_REGISTRY_INVALID'\n    && error.details?.enablement_registry_provenance === 'tenant_factory_owned_required',\n);\nassertUnconsumedAndUnchanged(forgedRegistryFixture, forgedRegistryPrepared.registry);\n\n`;
          test = test.replace(consoleAnchor, `${regressions}${consoleAnchor}`);
          test = test.replace("  tenant_owned_repository_weakset_brand_required: true,\n", "  tenant_owned_repository_weakset_brand_required: true,\n  tenant_owned_authority_store_weakset_brand_required: true,\n  tenant_owned_enablement_registry_weakset_brand_required: true,\n  direct_base_executor_enforces_all_provenance: true,\n");
          fs.writeFileSync(testPath, test);

          const guardPath = '.github/workflows/hostinger-storage-tenant-canary-guard.yml';
          let guard = fs.readFileSync(guardPath, 'utf8');
          guard = guard.replace(/      - name: Enforce governed Base imports repository-wide[\s\S]*?      - name: Enforce post-merge hardening contracts/, `      - name: Enforce Base runtime provenance\n        run: |\n          grep -q "tenantCanaryAdapters.has(adapter)" http-generic-api/hostingerStorageTenantCanaryBase.js\n          grep -q "tenantCanaryRepositories.has(repository)" http-generic-api/hostingerStorageTenantCanaryBase.js\n          grep -q "tenantCanaryAuthorityStores.has(store)" http-generic-api/hostingerStorageTenantCanaryBase.js\n          grep -q "tenantCanaryEnablementRegistries.has(registry)" http-generic-api/hostingerStorageTenantCanaryBase.js\n          grep -q "executeHostingerStorageTenantCanary as executeTenantCanaryBaseDirect" http-generic-api/test-hostinger-storage-tenant-canary-postmerge-hardening.mjs\n          grep -q "direct_base_executor_enforces_all_provenance: true" http-generic-api/test-hostinger-storage-tenant-canary-postmerge-hardening.mjs\n      - name: Enforce post-merge hardening contracts`);
          guard = guard.replaceAll('http-generic-api/hostingerStorageTenantCanary.js', 'http-generic-api/hostingerStorageTenantCanaryBase.js');
          guard = guard.replace(/      - name: Enforce validation before one-shot consumption[\s\S]*?      - name: Validate Tenant canary/, `      - name: Enforce validation before one-shot consumption\n        run: |\n          node --input-type=module <<'CHECK'\n          import fs from 'node:fs';\n          const source = fs.readFileSync('http-generic-api/hostingerStorageTenantCanaryBase.js', 'utf8');\n          const executeStart = source.indexOf('export function executeHostingerStorageTenantCanary({');\n          const body = source.slice(executeStart);\n          const authorityStore = body.indexOf('requireAuthorityStore(authority_store);');\n          const registry = body.indexOf('requireRegistry(enablement_registry);');\n          const repository = body.indexOf('requireControlPlaneRepository(repository);');\n          const currentAuthority = body.indexOf('revalidateCurrentAuthority({ authorization, authorityStore: authority_store, now });');\n          const preflight = body.indexOf('preflightSyntheticExecutorInputs({ protocol, protocolDigest: protocol_digest, repository, adapter, now });');\n          const consume = body.indexOf('enablement_registry.consume({');\n          if (!(authorityStore >= 0 && registry > authorityStore && repository > registry && currentAuthority > repository && preflight > currentAuthority && consume > preflight)) {\n            throw new Error('All factory provenance and authority checks must complete before one-shot consumption.');\n          }\n          const preflightStart = source.indexOf('function preflightSyntheticExecutorInputs({');\n          const preflightBody = source.slice(preflightStart, executeStart);\n          const adapterBrand = preflightBody.indexOf('tenantCanaryAdapters.has(adapter)');\n          const aggregateRead = preflightBody.indexOf('repository.readAggregate(protocol.operation_id)');\n          if (!(adapterBrand >= 0 && aggregateRead > adapterBrand)) {\n            throw new Error('Adapter provenance must be checked before repository read or mutation dispatch.');\n          }\n          CHECK\n      - name: Validate Tenant canary`);
          fs.writeFileSync(guardPath, guard);
          NODE
      - name: Validate hardening
        run: |
          node --check http-generic-api/hostingerStorageTenantCanaryBase.js
          node --check http-generic-api/hostingerStorageTenantCanary.js
          node --check http-generic-api/test-hostinger-storage-tenant-canary-postmerge-hardening.mjs
          cd http-generic-api
          node test-hostinger-storage-tenant-canary.mjs
          node test-hostinger-storage-tenant-canary-authority-cas.mjs
          node test-hostinger-storage-tenant-canary-postmerge-hardening.mjs
          node test-hostinger-storage-tenant-canary-token-normalization.mjs
          node test-hostinger-storage-tenant-canary-token-delegation.mjs
      - name: Commit and remove temporary workflow
        run: |
          git rm .github/workflows/spec014-tenant-base-runtime-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            http-generic-api/hostingerStorageTenantCanaryBase.js \
            http-generic-api/hostingerStorageTenantCanary.js \
            http-generic-api/test-hostinger-storage-tenant-canary-postmerge-hardening.mjs \
            .github/workflows/hostinger-storage-tenant-canary-guard.yml
          git commit -m 'fix(spec-014): enforce provenance inside Tenant Base runtime'
          git push origin HEAD:gpt/014-hostinger/tenant-canary-postmerge-hardening-20260801
