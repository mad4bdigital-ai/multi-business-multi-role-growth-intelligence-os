name: Dispatch Spec 014 Tenant Base hardening

on:
  push:
    branches:
      - gpt/014-hostinger/tenant-canary-hardening-recovery-20260801
    paths:
      - .specify/triggers/spec014-close-tenant-base-bypass.trigger

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gpt/014-hostinger/tenant-canary-hardening-recovery-20260801
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Extract and execute the staged patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/spec014-close-tenant-base-bypass.yml').read_text()
          marker = "node --input-type=module <<'NODE'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          NODE", start)
          Path('/tmp/spec014-close-tenant-base-bypass.mjs').write_text(textwrap.dedent(source[start:end]))
          PY
          node /tmp/spec014-close-tenant-base-bypass.mjs
      - name: Validate patched runtime
        run: |
          node --check http-generic-api/hostingerStorageTenantCanaryBase.js
          node --check http-generic-api/hostingerStorageTenantCanary.js
          node --check http-generic-api/test-hostinger-storage-tenant-canary-postmerge-hardening.mjs
          cd http-generic-api
          node test-hostinger-storage-tenant-canary.mjs
          node test-hostinger-storage-tenant-canary-authority-cas.mjs
          node test-hostinger-storage-tenant-canary-postmerge-hardening.mjs
          node test-hostinger-storage-tenant-canary-token-normalization.mjs
          node test-hostinger-storage-tenant-canary-token-delegation.mjs
          node test-hostinger-storage-tenant-canary-repository-provenance.mjs
      - name: Commit hardening and remove temporary tools
        run: |
          rm -f \
            .github/workflows/spec014-close-tenant-base-bypass.yml \
            .github/workflows/spec014-base-hardening-dispatcher.yml \
            .specify/triggers/spec014-close-tenant-base-bypass.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(spec-014): enforce provenance inside Tenant Base runtime'
          git push origin HEAD:gpt/014-hostinger/tenant-canary-hardening-recovery-20260801
