name: Governed Local Connector Production Closure Push

on:
  push:
    branches: [main]
    paths:
      - ".github/local-connector-closure/trigger-3945-792ff63a.txt"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  local-connector-production-closure:
    name: Governed Local Connector Production Closure Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUNTIME_BASE_URL: https://auth.mad4b.com
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      HOTFIX_MERGE_SHA: 792ff63af82791e9a482029f5078931fa0707c8c
      ADMIN_USER_ID: 00000000-0000-4000-a000-000000000002
      PLATFORM_TENANT_ID: 00000000-0000-4000-a000-000000000001
      DEVICE_ID: mohammedlap
      BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
      GH_READ_TOKEN: ${{ github.token }}
      EVIDENCE_PATH: ${{ runner.temp }}/governed-local-connector-production-closure.json
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Verify one-shot marker contract
        run: |
          set -euo pipefail
          MARKER=".github/local-connector-closure/trigger-3945-792ff63a.txt"
          test -f "$MARKER"
          grep -Fxq 'production_pr=3945' "$MARKER"
          grep -Fxq 'production_merge_sha=792ff63af82791e9a482029f5078931fa0707c8c' "$MARKER"
          grep -Fxq 'trigger_revision=ubuntu-v11-minimal' "$MARKER"
          grep -Fxq 'runner=ubuntu-latest' "$MARKER"
          grep -Fxq 'event_scope=marker_path_only' "$MARKER"
          grep -Fxq 'migrations_authorized=false' "$MARKER"
          grep -Fxq 'provider_mutation_authorized=false' "$MARKER"
          grep -Fxq 'credential_rotation_authorized=false' "$MARKER"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Record closure start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPOSITORY}/issues/3945/comments" \
            -f body="GOVERNED_LOCAL_CONNECTOR_PRODUCTION_CLOSURE status=started run_id=${GITHUB_RUN_ID} trigger=ubuntu-v11-minimal trusted_ref=main runner=ubuntu-latest event_scope=marker_path_only concurrency=none"

      - name: Verify exact merged Production PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MERGED=$(gh api "/repos/${REPOSITORY}/pulls/3945" --jq '.merged')
          MERGE_SHA=$(gh api "/repos/${REPOSITORY}/pulls/3945" --jq '.merge_commit_sha')
          test "$MERGED" = "true"
          test "$MERGE_SHA" = "$HOTFIX_MERGE_SHA"

      - name: Execute bounded trusted closure
        id: closure
        run: node .github/scripts/governed-local-connector-production-closure.mjs

      - name: Upload bounded closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governed-local-connector-production-closure-${{ github.run_id }}
          path: ${{ env.EVIDENCE_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Record governed closure outcome on Production PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CLOSURE_RESULT: ${{ steps.closure.outputs.result }}
          PRODUCTION_SHA: ${{ steps.closure.outputs.production_sha }}
          COMMAND_ID: ${{ steps.closure.outputs.command_id }}
          ROUTE_COUNT: ${{ steps.closure.outputs.registered_route_count }}
          HEALTH_AGE: ${{ steps.closure.outputs.health_age_seconds }}
          FAILURE_MESSAGE: ${{ steps.closure.outputs.failure_message }}
        run: |
          set -euo pipefail
          RESULT="${CLOSURE_RESULT:-unknown}"
          BODY="GOVERNED_LOCAL_CONNECTOR_PRODUCTION_CLOSURE result=${RESULT} run_id=${GITHUB_RUN_ID} trigger=ubuntu-v11-minimal trusted_ref=main runner=ubuntu-latest production_sha=${PRODUCTION_SHA:-unverified} command_id=${COMMAND_ID:-none} registered_route_count=${ROUTE_COUNT:-unknown} health_age_seconds=${HEALTH_AGE:-unknown} artifact=governed-local-connector-production-closure-${GITHUB_RUN_ID} event_scope=marker_path_only concurrency=none"
          if [[ "$RESULT" != "pass" && -n "${FAILURE_MESSAGE:-}" ]]; then
            BODY="${BODY} failure=${FAILURE_MESSAGE}"
          fi
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPOSITORY}/issues/3945/comments" \
            -f body="$BODY"
