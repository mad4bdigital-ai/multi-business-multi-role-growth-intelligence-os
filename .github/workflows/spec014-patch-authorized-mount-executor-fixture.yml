name: Spec014 Patch Authorized Mount Executor Fixture

on:
  pull_request:
    branches:
      - gpt/hostinger-safe-storage-cleanup-ssh-20260801
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - '.github/workflows/spec014-patch-authorized-mount-executor-fixture.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: spec014-patch-authorized-mount-executor-fixture
  cancel-in-progress: true

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'gpt/014-hostinger/authorized-mount-executor-20260802'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_BRANCH: gpt/014-hostinger/authorized-mount-executor-20260802
      EXPECTED_PARENT_SHA: 09b26954811f4fea6db7e785cfac5c50ead4f685
      TARGET_FILE: http-generic-api/test-hostinger-storage-authorized-mount-executor.mjs
      LAUNCHER_FILE: .github/workflows/spec014-patch-authorized-mount-executor-fixture.yml
      EVIDENCE_DIR: .ci-evidence/spec014-authorized-mount-fixture-patch
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Patch, validate, and commit exact fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          current_stage='verify_identity'
          on_error() {
            local status=$?
            trap - ERR
            STATUS="${status}" STAGE="${current_stage}" COMMAND="${BASH_COMMAND:-unknown}" python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = {
            'contract': 'mad4b.spec014-authorized-mount-fixture-patch.v1',
            'outcome': 'blocked',
            'expected_parent_sha': os.environ['EXPECTED_PARENT_SHA'],
            'target_branch': os.environ['TARGET_BRANCH'],
            'target_file': os.environ['TARGET_FILE'],
            'failure': {
              'stage': os.environ['STAGE'],
              'exit_status': int(os.environ['STATUS']),
              'command': os.environ['COMMAND'],
            },
            'repository_push_performed': False,
            'force_push': False,
            'job_logs_consulted': False,
            'secrets_included': False,
          }
          Path(os.environ['EVIDENCE_DIR'], 'summary.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
            exit "${status}"
          }
          trap on_error ERR

          remote_sha="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          local_sha="$(git rev-parse HEAD)"
          [[ "${remote_sha}" == "${local_sha}" ]]
          [[ "$(git rev-parse HEAD^)" == "${EXPECTED_PARENT_SHA}" ]]
          unexpected_launcher_paths="$(git diff --name-only "${EXPECTED_PARENT_SHA}" HEAD | grep -vxF "${LAUNCHER_FILE}" || true)"
          [[ -z "${unexpected_launcher_paths}" ]]

          current_stage='replace_fixture'
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path(os.environ['TARGET_FILE'])
          source = path.read_text()
          old = """      readback_cycle_id: 'mount-runtime-readback-cycle-001',
                database_fingerprint: DATABASE,
                expires_at: '2099-01-01T00:15:00.000Z',
          """
          new = """      readback_cycle_id: 'mount-runtime-readback-cycle-001',
                readback_digest: h('c'),
                migration_evidence_digest: h('f'),
                database_fingerprint: DATABASE,
                verified_at: '2026-08-02T07:00:00.000Z',
                expires_at: '2099-01-01T00:15:00.000Z',
          """
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'fixture occurrence count must be 1, got {count}')
          path.write_text(source.replace(old, new))
          PY

          current_stage='validate_focused_contract'
          node http-generic-api/test-hostinger-storage-authorized-mount-executor.mjs > "${EVIDENCE_DIR}/focused-test.stdout" 2> "${EVIDENCE_DIR}/focused-test.stderr"

          current_stage='commit_patch'
          git rm "${LAUNCHER_FILE}"
          git add -- "${TARGET_FILE}"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(spec-014): complete authorized mount schema fixture'
          result_sha="$(git rev-parse HEAD)"

          current_stage='write_success_evidence'
          RESULT_SHA="${result_sha}" python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = {
            'contract': 'mad4b.spec014-authorized-mount-fixture-patch.v1',
            'outcome': 'passed',
            'expected_parent_sha': os.environ['EXPECTED_PARENT_SHA'],
            'result_sha': os.environ['RESULT_SHA'],
            'target_branch': os.environ['TARGET_BRANCH'],
            'target_file': os.environ['TARGET_FILE'],
            'fixture_fields_added': [
              'readback_digest',
              'migration_evidence_digest',
              'verified_at',
            ],
            'focused_contract_passed': True,
            'launcher_removed': True,
            'repository_push_performed': True,
            'force_push': False,
            'job_logs_consulted': False,
            'secrets_included': False,
          }
          Path(os.environ['EVIDENCE_DIR'], 'summary.json').write_text(json.dumps(report, indent=2) + '\n')
          PY

          current_stage='push_patch'
          git push origin "HEAD:${TARGET_BRANCH}"
          trap - ERR

      - name: Upload structured patch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec014-authorized-mount-fixture-patch-${{ github.run_id }}
          path: |
            ${{ env.EVIDENCE_DIR }}/summary.json
            ${{ env.EVIDENCE_DIR }}/focused-test.stdout
            ${{ env.EVIDENCE_DIR }}/focused-test.stderr
          if-no-files-found: error
          retention-days: 14
