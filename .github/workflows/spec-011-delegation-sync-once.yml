name: Spec 011 Delegation Sync Once

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  sync:
    if: github.head_ref == 'gpt/spec-011-phase3-delegation-mariadb-certification-binding-20260730'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v5
        with:
          ref: gpt/spec-011-phase3-delegation-mariadb-certification-binding-20260730
          fetch-depth: 0

      - name: Merge latest main and resolve generated evidence semantically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "admin-assitant-growth-os[bot]"
          git config user.email "admin-assitant-growth-os[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge --no-edit origin/main; then
            CONFLICTS="$(git diff --name-only --diff-filter=U)"
            EXPECTED="http-generic-api/frontend-surface-dispatch.generated.json"
            if [[ "${CONFLICTS}" != "${EXPECTED}" ]]; then
              echo "::error::Unexpected merge conflicts"
              printf '%s\n' "${CONFLICTS}"
              exit 1
            fi
            git checkout --theirs -- "${EXPECTED}"
            git add "${EXPECTED}"
          fi

      - name: Regenerate source-pinned frontend evidence
        shell: bash
        working-directory: http-generic-api
        run: |
          npm ci
          npm run frontend:dispatch:generate -- --baseline-ref=main
          node test-frontend-dispatch-workflow-baseline.mjs
          node test-frontend-operation-governance-generator.mjs
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-openapi-route-coverage.mjs
          npm run openapi:auth:check

      - name: Validate focused delegation contracts
        shell: bash
        working-directory: http-generic-api
        run: |
          node test-delegation-grant-lifecycle-shadow.mjs
          node test-delegation-grant-repository-mutation.mjs
          node test-delegation-grant-mariadb-adapter-contract.mjs
          node test-delegation-grant-mariadb-readiness-collector.mjs
          node test-delegation-grant-mariadb-runtime-binding.mjs

      - name: Commit reconciled head and remove workflow
        shell: bash
        run: |
          rm .github/workflows/spec-011-delegation-sync-once.yml
          git add .
          git diff --cached --check
          git commit -m "chore(spec-011): reconcile delegation certification with main"
          git push origin HEAD:gpt/spec-011-phase3-delegation-mariadb-certification-binding-20260730
