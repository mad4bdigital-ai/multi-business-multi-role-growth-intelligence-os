name: Exact Feature ARM Syntax Diagnostic 5491

on:
  pull_request:
    branches:
      - gpt/validate-feature-arm-base-5491-44ed1522
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: exact-feature-arm-syntax-diagnostic-5491-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  coverage-with-pr-context:
    name: Resource Coverage With Exact PR Context
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/validate-e2e-production-baseline-current-main-44ed1522-20260803' &&
      github.event.pull_request.head.sha == 'c01155fb50808068642f9a8bd82b61a1e171be80'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: c01155fb50808068642f9a8bd82b61a1e171be80
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify exact candidate and parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'c01155fb50808068642f9a8bd82b61a1e171be80'
          test "$(git rev-parse HEAD^1)" = '44ed152286be85c4573c584cbe786fb2faf94c91'
      - name: Run Resource API coverage with canonical PR context
        env:
          GITHUB_EVENT_NAME: pull_request
          GITHUB_BASE_REF: main
          GITHUB_HEAD_REF: gpt/validate-e2e-production-baseline-current-main-44ed1522-20260803
          GITHUB_BASE_SHA: 44ed152286be85c4573c584cbe786fb2faf94c91
          GITHUB_HEAD_SHA: c01155fb50808068642f9a8bd82b61a1e171be80
        run: node http-generic-api/scripts/resource-api-coverage-audit.mjs --ci --changed

  architecture-with-dependencies:
    name: Resource Architecture With Dependencies
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/validate-e2e-production-baseline-current-main-44ed1522-20260803' &&
      github.event.pull_request.head.sha == 'c01155fb50808068642f9a8bd82b61a1e171be80'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: c01155fb50808068642f9a8bd82b61a1e171be80
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json
      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci
      - name: Run Resource API architecture regression
        working-directory: http-generic-api
        run: node test-resource-api-architecture.mjs
