name: Materialize capability drift readback severity

on:
  push:
    branches:
      - fix/capability-drift-age-severity-escalation-4450-20260808
    paths:
      - .github/workflows/materialize-capability-drift-readback-severity.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v5
        with:
          ref: fix/capability-drift-age-severity-escalation-4450-20260808
          fetch-depth: 0
          persist-credentials: true

      - name: Verify current main ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          test "$(git rev-parse origin/main)" = "f861f181fd5c00e65208cae058b7b96eaf688458"

      - name: Apply capability-only monotonic readback patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}")
              p.write_text(text.replace(old, new, 1))

          service = "http-generic-api/operationalAlertService.js"
          test = "http-generic-api/test-operational-alerting-control-plane.mjs"

          replace_once(
              service,
              '''    const lifecycleStatus = persistedLifecycleClosed\n      ? hasNewerLiveOccurrence ? "open" : persisted.lifecycle_status\n      : persisted?.lifecycle_status || current.lifecycle_status || item.lifecycle_status;\n    merged.set(item.alert_key, {\n''',
              '''    const lifecycleStatus = persistedLifecycleClosed\n      ? hasNewerLiveOccurrence ? "open" : persisted.lifecycle_status\n      : persisted?.lifecycle_status || current.lifecycle_status || item.lifecycle_status;\n    const capabilityDriftMerge = current.source_type === CAPABILITY_DRIFT_SOURCE\n      || item.source_type === CAPABILITY_DRIFT_SOURCE;\n    const mergedSeverity = capabilityDriftMerge\n      ? (safeNumber(SEVERITY_WEIGHT[item.severity]) > safeNumber(SEVERITY_WEIGHT[current.severity])\n          ? item.severity\n          : current.severity)\n      : latest.severity;\n    merged.set(item.alert_key, {\n'''
          )

          replace_once(
              service,
              '''      alert_id: persisted?.alert_id || current.alert_id || item.alert_id,\n      lifecycle_status: lifecycleStatus,\n''',
              '''      alert_id: persisted?.alert_id || current.alert_id || item.alert_id,\n      severity: mergedSeverity,\n      lifecycle_status: lifecycleStatus,\n'''
          )

          replace_once(
              test,
              '''  const adminPersisted = _testingOperationalAlerts.mapPersistedAlert(persistedRow, {\n    subject: { is_admin: true },\n  });\n  assert.equal(adminPersisted.tenant_id, null);\n  assert.equal(adminPersisted.evidence.admin_evidence.source_table, "tenant_platform_endpoint_tools");\n''',
              '''  const adminPersisted = _testingOperationalAlerts.mapPersistedAlert(persistedRow, {\n    subject: { is_admin: true },\n  });\n  assert.equal(adminPersisted.tenant_id, null);\n  assert.equal(adminPersisted.evidence.admin_evidence.source_table, "tenant_platform_endpoint_tools");\n\n  const newerLiveBaseSeverity = _testingOperationalAlerts.candidate({\n    alertKey: first.alertKey,\n    sourceType: CAPABILITY_DRIFT_SOURCE,\n    sourceRef: first.sourceRef,\n    sourceRecordId: first.sourceRecordId,\n    tenantId: "tenant-1",\n    category: "capability_drift",\n    severity: "medium",\n    title: first.title,\n    summary: first.summary,\n    reasonCode: first.reasonCode,\n    lifecycleStatus: "open",\n    verificationState: "verified",\n    evidence: { tenant_visible: true, capability_key: tenantVisible.capability_key },\n    firstSeenAt: "2026-08-08T12:00:00.000Z",\n    lastSeenAt: "2026-08-08T16:30:00.000Z",\n  });\n  const persistedEscalated = _testingOperationalAlerts.candidate({\n    alertId: "alert-capability-escalated",\n    alertKey: first.alertKey,\n    sourceType: CAPABILITY_DRIFT_SOURCE,\n    sourceRef: first.sourceRef,\n    sourceRecordId: first.sourceRecordId,\n    category: "capability_drift",\n    severity: "critical",\n    title: first.title,\n    summary: first.summary,\n    reasonCode: first.reasonCode,\n    lifecycleStatus: "investigating",\n    verificationState: "verified",\n    evidence: { tenant_visible: true, age_escalation: { policy_key: "capability_drift_age_escalation_v1" } },\n    occurrenceCount: 9,\n    firstSeenAt: "2026-08-05T12:00:00.000Z",\n    lastSeenAt: "2026-08-08T16:00:00.000Z",\n    persisted: true,\n  });\n  const mergedEscalated = _testingOperationalAlerts.mergeCandidates([newerLiveBaseSeverity, persistedEscalated]);\n  assert.equal(mergedEscalated.length, 1);\n  assert.equal(mergedEscalated[0].severity, "critical", "a newer live capability snapshot must not downgrade persisted age escalation");\n  assert.equal(mergedEscalated[0].last_seen_at, newerLiveBaseSeverity.last_seen_at, "newer live freshness must still win");\n  assert.equal(mergedEscalated[0].alert_id, "alert-capability-escalated");\n  assert.equal(mergedEscalated[0].lifecycle_status, "investigating");\n'''
          )

          replace_once(
              test,
              '''  assert.match(service, /system_age_escalation/);\n''',
              '''  assert.match(service, /system_age_escalation/);\n  assert.match(service, /const capabilityDriftMerge/);\n  assert.match(service, /severity: mergedSeverity/);\n'''
          )
          PY

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/test-operational-alerting-control-plane.mjs
          node http-generic-api/scripts/test-operation-observability-service.mjs

      - name: Remove temporary materializer and enforce exact scope
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capability-drift-readback-severity.yml
          git add -A
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          expected = {
              ".changes/e2e/capability-drift-age-severity-escalation.json",
              "http-generic-api/capabilityDriftAlertEscalationPolicy.js",
              "http-generic-api/operationalAlertService.js",
              "http-generic-api/test-operational-alerting-control-plane.mjs",
          }
          actual = set(subprocess.check_output(
              ["git", "diff", "--cached", "--name-only", "origin/main"],
              text=True,
          ).splitlines())
          if actual != expected:
              raise SystemExit(f"unexpected final scope: expected={sorted(expected)} actual={sorted(actual)}")
          PY

      - name: Commit bounded readback repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(observability): preserve escalated capability severity in readback"
          git push origin HEAD:fix/capability-drift-age-severity-escalation-4450-20260808
