name: PR 6629 Spec014 Final Work Map Binding Refresh

on:
  push:
    branches:
      - fix/repository-policy-1049-bootstrap-repair-6627

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: pr6629-spec014-binding-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Canonical two-manifest binding refresh
    if: github.actor == 'mad4bdigital-ai'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      TARGET_BRANCH: fix/repository-policy-1049-bootstrap-repair-6627
      TARGET_PR: '6629'
      EXPECTED_PARENT_SHA: 3be90f3f4dbb5e901943c0988e0ef1aade1ccb81
      LAUNCHER_PATH: .github/workflows/pr6629-spec014-binding-refresh.yml
      HOSTINGER_MANIFEST: specs/014-governed-hostinger-storage-orchestration/work-map-integration.json
      RETAIL_MANIFEST: specs/014-retail-commerce-operations-growth-os/work-map-integration.json
    steps:
      - name: Checkout exact launcher commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Validate exact branch parent and PR identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}"
          head_sha="$(git rev-parse HEAD)"
          parent_sha="$(git rev-parse HEAD^)"
          test "${parent_sha}" = "${EXPECTED_PARENT_SHA}"

          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${head_sha}"

          mapfile -t launcher_delta < <(git diff --name-only "${EXPECTED_PARENT_SHA}..${head_sha}" | sort)
          test "${#launcher_delta[@]}" = "1"
          test "${launcher_delta[0]}" = "${LAUNCHER_PATH}"

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}")"
          test "$(jq -r '.state' <<<"${pr_json}")" = "open"
          test "$(jq -r '.base.ref' <<<"${pr_json}")" = "main"
          test "$(jq -r '.head.repo.full_name' <<<"${pr_json}")" = "${GITHUB_REPOSITORY}"
          test "$(jq -r '.head.ref' <<<"${pr_json}")" = "${TARGET_BRANCH}"
          test "$(jq -r '.head.sha' <<<"${pr_json}")" = "${head_sha}"

          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          compare_json="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${main_sha}...${head_sha}")"
          test "$(jq -r '.behind_by' <<<"${compare_json}")" = "0"

      - name: Run canonical Spec014 binding producers and exact checks
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          node http-generic-api/scripts/work-map-schema-classification-contract.mjs
          node http-generic-api/scripts/work-map-schema-classification.mjs

          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-governed-hostinger-storage-orchestration
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-retail-commerce-operations-growth-os

          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-governed-hostinger-storage-orchestration --check
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-retail-commerce-operations-growth-os --check
          node http-generic-api/scripts/spec014-final-work-map-readback.mjs

          mapfile -t producer_delta < <(git diff --name-only | sort)
          test "${#producer_delta[@]}" = "2"
          test "${producer_delta[0]}" = "${HOSTINGER_MANIFEST}"
          test "${producer_delta[1]}" = "${RETAIL_MANIFEST}"
          test -z "$(git diff --name-only -- docs/work-maps specs/014-governed-hostinger-storage-orchestration/tasks.md)"

          export GITHUB_ACTIONS=true
          export WORK_MAP_CHANGED_FILES_JSON="$(jq -cn --arg a '.changes/e2e/github-repository-policy-1049-bootstrap-repair.json' --arg b 'docs/work-maps/README.md' --arg c 'docs/work-maps/data-model-domain-map.md' --arg d 'docs/work-maps/work-map-coverage-matrix.md' --arg e 'http-generic-api/migrations/1050_github_repository_policy_controller_bootstrap_repair.sql' --arg f 'http-generic-api/test-github-repository-policy-1050-bootstrap-repair.mjs' --arg g "${HOSTINGER_MANIFEST}" --arg h "${RETAIL_MANIFEST}" '[ $a,$b,$c,$d,$e,$f,$g,$h ]')"
          node http-generic-api/scripts/spec-kit-work-map-governance-gate.mjs --ci --changed

      - name: Remove launcher and push bounded fast-forward result
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${head_sha}"

          git rm "${LAUNCHER_PATH}"
          git add "${HOSTINGER_MANIFEST}" "${RETAIL_MANIFEST}"
          mapfile -t staged < <(git diff --cached --name-only | sort)
          test "${#staged[@]}" = "3"
          test "${staged[0]}" = "${LAUNCHER_PATH}"
          test "${staged[1]}" = "${HOSTINGER_MANIFEST}"
          test "${staged[2]}" = "${RETAIL_MANIFEST}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(spec-014): refresh final Work Map registry bindings'
          result_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "${head_sha}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          pushed_sha="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${pushed_sha}" = "${result_sha}"

          printf 'result_sha=%s\nforce_push=false\nprotected_ref_mutation=false\nprovider_dispatch=false\ndatabase_mutation=false\nmigration_apply=false\nsecrets_included=false\n' "${result_sha}"
