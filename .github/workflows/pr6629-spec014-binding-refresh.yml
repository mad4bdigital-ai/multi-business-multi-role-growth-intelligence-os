name: PR 6629 Final Spec014 Convergence

on:
  push:
    branches:
      - fix/repository-policy-1049-bootstrap-repair-6627

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: pr6629-final-spec014-convergence
  cancel-in-progress: false

jobs:
  converge:
    name: Refresh Spec014, remove launcher, finalize Work Maps
    if: github.actor == 'mad4bdigital-ai'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      TARGET_BRANCH: fix/repository-policy-1049-bootstrap-repair-6627
      TARGET_PR: '6629'
      EXPECTED_PARENT_SHA: d2ab77a5a07e24264e82ee13b2bed92acefefa44
      LAUNCHER_PATH: .github/workflows/pr6629-spec014-binding-refresh.yml
      WRITER_WORKFLOW: spec-kit-work-map-autofix.yml
      READBACK_WORKFLOW: hostinger-storage-final-work-map-readback-guard.yml
      HOSTINGER_MANIFEST: specs/014-governed-hostinger-storage-orchestration/work-map-integration.json
      HOSTINGER_TASKS: specs/014-governed-hostinger-storage-orchestration/tasks.md
      RETAIL_MANIFEST: specs/014-retail-commerce-operations-growth-os/work-map-integration.json
    steps:
      - name: Checkout exact launcher commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Validate exact branch ancestry and PR identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}"
          head_sha="$(git rev-parse HEAD)"
          parent_sha="$(git rev-parse HEAD^)"
          test "${parent_sha}" = "${EXPECTED_PARENT_SHA}"
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${head_sha}"

          mapfile -t launcher_delta < <(git diff --name-only "${EXPECTED_PARENT_SHA}..${head_sha}" | sort)
          test "${#launcher_delta[@]}" = "1"
          test "${launcher_delta[0]}" = "${LAUNCHER_PATH}"

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}")"
          test "$(jq -r '.state' <<<"${pr_json}")" = "open"
          test "$(jq -r '.draft' <<<"${pr_json}")" = "true"
          test "$(jq -r '.base.ref' <<<"${pr_json}")" = "main"
          test "$(jq -r '.head.repo.full_name' <<<"${pr_json}")" = "${GITHUB_REPOSITORY}"
          test "$(jq -r '.head.ref' <<<"${pr_json}")" = "${TARGET_BRANCH}"
          test "$(jq -r '.head.sha' <<<"${pr_json}")" = "${head_sha}"

          git fetch --no-tags origin "main:refs/remotes/origin/main"
          main_git_sha="$(git rev-parse refs/remotes/origin/main)"
          main_api_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "${main_git_sha}" = "${main_api_sha}"
          git merge-base --is-ancestor "${main_git_sha}" "${head_sha}"
          printf 'freshness main=%s head=%s authoritative=git_ancestor\n' "${main_api_sha}" "${head_sha}"

      - name: Validate Work Map schema classification
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/work-map-schema-classification-contract.mjs
          node http-generic-api/scripts/work-map-schema-classification.mjs

      - name: Refresh canonical Spec014 registry bindings
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-governed-hostinger-storage-orchestration
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-retail-commerce-operations-growth-os

      - name: Verify refreshed Spec014 bindings
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-governed-hostinger-storage-orchestration --check
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-retail-commerce-operations-growth-os --check

      - name: Validate bounded producer delta
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t producer_delta < <(git diff --name-only | sort)
          printf 'producer_delta_count=%s\n' "${#producer_delta[@]}"
          if [ "${#producer_delta[@]}" -gt 0 ]; then
            printf 'producer_delta=%s\n' "${producer_delta[*]}"
          fi
          for path in "${producer_delta[@]}"; do
            case "${path}" in
              "${HOSTINGER_MANIFEST}"|"${HOSTINGER_TASKS}"|"${RETAIL_MANIFEST}") ;;
              *) printf 'Unexpected producer output: %s\n' "${path}" >&2; exit 1 ;;
            esac
          done
          test -z "$(git diff --name-only -- docs/work-maps)"

      - name: Run governed Spec Kit Work Map gate
        shell: bash
        run: |
          set -euo pipefail
          export WORK_MAP_CHANGED_FILES_JSON="$(jq -cn \
            --arg a '.changes/e2e/github-repository-policy-1049-bootstrap-repair.json' \
            --arg b 'docs/work-maps/README.md' \
            --arg c 'docs/work-maps/data-model-domain-map.md' \
            --arg d 'docs/work-maps/work-map-coverage-matrix.md' \
            --arg e 'docs/work-maps/repository-automation-map.md' \
            --arg f 'http-generic-api/migrations/1050_github_repository_policy_controller_bootstrap_repair.sql' \
            --arg g 'http-generic-api/test-github-repository-policy-1050-bootstrap-repair.mjs' \
            --arg h "${HOSTINGER_MANIFEST}" \
            --arg i "${HOSTINGER_TASKS}" \
            --arg j "${RETAIL_MANIFEST}" \
            '[ $a,$b,$c,$d,$e,$f,$g,$h,$i,$j ]')"
          node http-generic-api/scripts/spec-kit-work-map-governance-gate.mjs --ci --changed

      - name: Commit bounded Spec014 convergence and remove launcher
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          launcher_head="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${launcher_head}"

          git rm "${LAUNCHER_PATH}"
          git add "${HOSTINGER_MANIFEST}" "${HOSTINGER_TASKS}" "${RETAIL_MANIFEST}"
          mapfile -t staged < <(git diff --cached --name-only | sort)
          test "${#staged[@]}" -ge 1
          test "${#staged[@]}" -le 4
          printf 'staged_count=%s\n' "${#staged[@]}"
          printf 'staged=%s\n' "${staged[*]}"
          launcher_staged=false
          for path in "${staged[@]}"; do
            case "${path}" in
              "${LAUNCHER_PATH}") launcher_staged=true ;;
              "${HOSTINGER_MANIFEST}"|"${HOSTINGER_TASKS}"|"${RETAIL_MANIFEST}") ;;
              *) printf 'Unexpected staged output: %s\n' "${path}" >&2; exit 1 ;;
            esac
          done
          test "${launcher_staged}" = "true"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(spec-014): refresh final Work Map registry bindings'
          result_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "${launcher_head}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          pushed_sha="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${pushed_sha}" = "${result_sha}"
          echo "result_sha=${result_sha}" >> "$GITHUB_OUTPUT"
          printf 'result_sha=%s launcher_removed=true force_push=false protected_ref_mutation=false provider_dispatch=false database_mutation=false migration_apply=false secrets_included=false\n' "${result_sha}"

      - name: Dispatch canonical Work Map writer after launcher removal
        id: autofix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_SHA: ${{ steps.publish.outputs.result_sha }}
        run: |
          set -euo pipefail
          [[ "${RESULT_SHA}" =~ ^[0-9a-f]{40}$ ]]
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${RESULT_SHA}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WRITER_WORKFLOW}" --jq '.state')" = "active"

          dispatch_started_at="$(date -u -d '5 seconds ago' +'%Y-%m-%dT%H:%M:%SZ')"
          payload="$(jq -cn --arg ref main --arg branch "${TARGET_BRANCH}" --arg expected_head_sha "${RESULT_SHA}" '{ref:$ref,inputs:{branch:$branch,expected_head_sha:$expected_head_sha}}')"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/${WRITER_WORKFLOW}/dispatches" --input - <<<"${payload}"

          delegated_run_id=""
          for _ in $(seq 1 30); do
            delegated_run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WRITER_WORKFLOW}/runs?event=workflow_dispatch&per_page=30" --jq "[.workflow_runs[] | select(.created_at >= \"${dispatch_started_at}\" and .head_branch == \"main\")] | sort_by(.created_at) | last | .id // empty")"
            if [[ -n "${delegated_run_id}" ]]; then break; fi
            sleep 2
          done
          [[ "${delegated_run_id}" =~ ^[1-9][0-9]*$ ]]
          echo "run_id=${delegated_run_id}" >> "$GITHUB_OUTPUT"
          printf 'delegated_work_map_autofix_run_id=%s expected_head_sha=%s\n' "${delegated_run_id}" "${RESULT_SHA}"

      - name: Wait for canonical writer and dispatch final Spec014 readback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOFIX_RUN_ID: ${{ steps.autofix.outputs.run_id }}
        run: |
          set -euo pipefail
          [[ "${AUTOFIX_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          conclusion=""
          for _ in $(seq 1 90); do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${AUTOFIX_RUN_ID}" --jq '.status')"
            if [[ "${status}" = "completed" ]]; then
              conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${AUTOFIX_RUN_ID}" --jq '.conclusion')"
              break
            fi
            sleep 5
          done
          test "${conclusion}" = "success"

          final_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          [[ "${final_head}" =~ ^[0-9a-f]{40}$ ]]
          readback_payload="$(jq -cn --arg ref "${TARGET_BRANCH}" '{ref:$ref}')"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/${READBACK_WORKFLOW}/dispatches" --input - <<<"${readback_payload}"
          printf 'final_head_sha=%s final_readback_dispatched=true force_push=false protected_ref_mutation=false database_mutation=false migration_apply=false\n' "${final_head}"
