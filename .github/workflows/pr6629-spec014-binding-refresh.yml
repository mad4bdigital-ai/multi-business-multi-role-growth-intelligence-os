name: PR 6629 Governed Work Map Autofix Dispatch

on:
  push:
    branches:
      - fix/repository-policy-1049-bootstrap-repair-6627

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: pr6629-governed-work-map-autofix-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch exact-head canonical Work Map writer
    if: github.actor == 'mad4bdigital-ai'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      TARGET_BRANCH: fix/repository-policy-1049-bootstrap-repair-6627
      TARGET_PR: '6629'
      EXPECTED_PARENT_SHA: efe027adf9a1427e0c2f472ca1f6a593e40e1108
      LAUNCHER_PATH: .github/workflows/pr6629-spec014-binding-refresh.yml
      WRITER_WORKFLOW: spec-kit-work-map-autofix.yml
    steps:
      - name: Checkout exact dispatcher commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Validate exact branch ancestry and PR identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}"
          head_sha="$(git rev-parse HEAD)"
          parent_sha="$(git rev-parse HEAD^)"
          test "${parent_sha}" = "${EXPECTED_PARENT_SHA}"
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${head_sha}"

          mapfile -t dispatcher_delta < <(git diff --name-only "${EXPECTED_PARENT_SHA}..${head_sha}" | sort)
          test "${#dispatcher_delta[@]}" = "1"
          test "${dispatcher_delta[0]}" = "${LAUNCHER_PATH}"

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}")"
          test "$(jq -r '.state' <<<"${pr_json}")" = "open"
          test "$(jq -r '.base.ref' <<<"${pr_json}")" = "main"
          test "$(jq -r '.head.repo.full_name' <<<"${pr_json}")" = "${GITHUB_REPOSITORY}"
          test "$(jq -r '.head.ref' <<<"${pr_json}")" = "${TARGET_BRANCH}"
          test "$(jq -r '.head.sha' <<<"${pr_json}")" = "${head_sha}"

          git fetch --no-tags origin "main:refs/remotes/origin/main"
          main_git_sha="$(git rev-parse refs/remotes/origin/main)"
          main_api_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "${main_git_sha}" = "${main_api_sha}"
          git merge-base --is-ancestor "${main_git_sha}" "${head_sha}"

          writer_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WRITER_WORKFLOW}" --jq '.state')"
          test "${writer_state}" = "active"
          printf 'authorized_dispatch main=%s head=%s writer_state=%s\n' "${main_api_sha}" "${head_sha}" "${writer_state}"

      - name: Dispatch sole governed Work Map writer
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${head_sha}"

          dispatch_started_at="$(date -u -d '5 seconds ago' +'%Y-%m-%dT%H:%M:%SZ')"
          payload="$(jq -cn \
            --arg ref main \
            --arg branch "${TARGET_BRANCH}" \
            --arg expected_head_sha "${head_sha}" \
            '{ref:$ref,inputs:{branch:$branch,expected_head_sha:$expected_head_sha}}')"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${WRITER_WORKFLOW}/dispatches" \
            --input - <<<"${payload}"

          delegated_run_id=""
          for _ in $(seq 1 30); do
            delegated_run_id="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${WRITER_WORKFLOW}/runs?event=workflow_dispatch&per_page=30" \
              --jq "[.workflow_runs[] | select(.created_at >= \"${dispatch_started_at}\" and .head_branch == \"main\")] | sort_by(.created_at) | last | .id // empty")"
            if [[ -n "${delegated_run_id}" ]]; then
              break
            fi
            sleep 2
          done
          [[ "${delegated_run_id}" =~ ^[1-9][0-9]*$ ]]
          echo "run_id=${delegated_run_id}" >> "$GITHUB_OUTPUT"
          printf 'delegated_run_id=%s expected_head_sha=%s force_push=false protected_ref_mutation=false database_mutation=false migration_apply=false\n' "${delegated_run_id}" "${head_sha}"
