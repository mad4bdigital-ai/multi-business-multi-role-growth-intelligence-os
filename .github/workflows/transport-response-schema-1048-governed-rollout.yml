name: Governed Migration 1048 Transport Response Schema Rollout

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  readiness:
    name: Authorize and dry-run Migration 1048
    permissions:
      contents: read
      issues: write
    if: >-
      github.event.issue.number == 6531 &&
      !github.event.issue.pull_request &&
      github.event.comment.body == 'AUTHORIZE_GOVERNED_MIGRATION_1048_TRANSPORT_RESPONSE_CHUNK_SCHEMA_RECOVERY' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    concurrency:
      group: transport-response-schema-1048-readiness
      cancel-in-progress: false
    env:
      ROLLOUT_PHASE: readiness
      RUNTIME_BASE_URL: https://auth.mad4b.com
      BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
      GH_READ_TOKEN: ${{ github.token }}
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      CONTROL_ISSUE: '6531'
      EVIDENCE_DIR: .artifacts/transport-response-schema-1048-readiness
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Execute Production-bound authorization and dry-run
        run: node .github/ops/transport-response-schema-1048-governed-rollout.mjs

      - name: Publish checksum-bound readiness marker
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const summaryPath = `${process.env.EVIDENCE_DIR}/summary.json`;
            const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
            if (summary.result === 'ready_for_apply') {
              const marker = String(summary.readiness_marker || '');
              if (!marker.startsWith('TRANSPORT_RESPONSE_SCHEMA_1048_READINESS result=pass ')) {
                core.setFailed('Malformed Migration 1048 readiness marker');
                return;
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 6531,
                body: marker,
              });
            } else if (summary.result !== 'already_applied') {
              core.setFailed(`Unexpected Migration 1048 readiness result: ${summary.result}`);
            }

      - name: Upload no-secret readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transport-response-schema-1048-readiness-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish readiness summary
        if: always()
        shell: bash
        run: |
          node <<'NODE' >>"${GITHUB_STEP_SUMMARY}"
          const fs = require('node:fs');
          const dir = process.env.EVIDENCE_DIR;
          const summaryPath = `${dir}/summary.json`;
          const failurePath = `${dir}/failure.json`;
          if (fs.existsSync(summaryPath)) {
            const s = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
            process.stdout.write(`## Migration 1048 readiness: pass\n\n- Result: ${s.result}\n- Production SHA: \`${s.production_sha}\`\n- Migration blob: \`${s.migration_blob_sha}\`\n- Checksum: \`${s.checksum}\`\n- Statements: ${s.statement_count}\n- Authorization: ${s.authorization || 'already_applied'}\n- Dry run: ${s.dry_run || 'already_applied'}\n- Readiness marker: \`${s.readiness_marker || 'not_required'}\`\n- Secrets included: ${s.secrets_included}\n`);
          } else {
            const f = fs.existsSync(failurePath) ? JSON.parse(fs.readFileSync(failurePath, 'utf8')) : {};
            process.stdout.write(`## Migration 1048 readiness: fail\n\n- Stage: ${f.stage || 'unknown'}\n- Production SHA: \`${f.production_sha || 'unverified'}\`\n- Error code: ${f.error?.code || 'workflow_failed'}\n- Apply sent: ${f.apply_sent || false}\n- Apply retried: ${f.apply_retried || false}\n- Secrets included: ${f.secrets_included ?? false}\n`);
          }
          NODE

  apply:
    name: Apply Migration 1048 exactly once and certify
    if: >-
      github.event.issue.number == 6531 &&
      !github.event.issue.pull_request &&
      github.event.comment.body == 'APPLY_1048_TRANSPORT_RESPONSE_CHUNK_SCHEMA_RECOVERY' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    concurrency:
      group: transport-response-schema-1048-apply
      cancel-in-progress: false
    env:
      ROLLOUT_PHASE: apply
      RUNTIME_BASE_URL: https://auth.mad4b.com
      BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
      GH_READ_TOKEN: ${{ github.token }}
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      CONTROL_ISSUE: '6531'
      EVIDENCE_DIR: .artifacts/transport-response-schema-1048-apply
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Execute exactly-once Apply and same-cycle certification
        run: node .github/ops/transport-response-schema-1048-governed-rollout.mjs

      - name: Upload no-secret Apply evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transport-response-schema-1048-apply-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish Apply summary
        if: always()
        shell: bash
        run: |
          node <<'NODE' >>"${GITHUB_STEP_SUMMARY}"
          const fs = require('node:fs');
          const dir = process.env.EVIDENCE_DIR;
          const summaryPath = `${dir}/summary.json`;
          const failurePath = `${dir}/failure.json`;
          if (fs.existsSync(summaryPath)) {
            const s = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
            process.stdout.write(`## Migration 1048 Apply: pass\n\n- Result: ${s.result}\n- Production SHA: \`${s.production_sha}\`\n- Migration blob: \`${s.migration_blob_sha}\`\n- Checksum: \`${s.checksum}\`\n- Statements: ${s.statement_count}\n- Apply sent by this run: ${s.apply_sent_by_this_run}\n- Apply retried: ${s.apply_retried}\n- Exact ledger: ${s.exact_apply_ledger_verified}\n- Readiness: ${s.readiness_view?.readiness_status || 'unverified'}\n- Secrets included: ${s.secrets_included}\n`);
          } else {
            const f = fs.existsSync(failurePath) ? JSON.parse(fs.readFileSync(failurePath, 'utf8')) : {};
            process.stdout.write(`## Migration 1048 Apply: fail\n\n- Stage: ${f.stage || 'unknown'}\n- Production SHA: \`${f.production_sha || 'unverified'}\`\n- Error code: ${f.error?.code || 'workflow_failed'}\n- Apply sent: ${f.apply_sent ?? false}\n- Apply retried: ${f.apply_retried ?? false}\n- Exact ledger verified: ${f.exact_apply_ledger_verified ?? false}\n- Secrets included: ${f.secrets_included ?? false}\n`);
          }
          NODE

  verify:
    name: Verify Migration 1048 ledger and readiness
    if: >-
      github.event.issue.number == 6531 &&
      !github.event.issue.pull_request &&
      github.event.comment.body == 'VERIFY_GOVERNED_MIGRATION_1048_TRANSPORT_RESPONSE_CHUNK_SCHEMA_RECOVERY' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    concurrency:
      group: transport-response-schema-1048-verify
      cancel-in-progress: false
    env:
      ROLLOUT_PHASE: verify
      RUNTIME_BASE_URL: https://auth.mad4b.com
      BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
      GH_READ_TOKEN: ${{ github.token }}
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      CONTROL_ISSUE: '6531'
      EVIDENCE_DIR: .artifacts/transport-response-schema-1048-verify
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify exact ledger and readiness without Apply
        run: node .github/ops/transport-response-schema-1048-governed-rollout.mjs

      - name: Upload no-secret verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transport-response-schema-1048-verify-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish verification summary
        if: always()
        shell: bash
        run: |
          node <<'NODE' >>"${GITHUB_STEP_SUMMARY}"
          const fs = require('node:fs');
          const dir = process.env.EVIDENCE_DIR;
          const summaryPath = `${dir}/summary.json`;
          const failurePath = `${dir}/failure.json`;
          if (fs.existsSync(summaryPath)) {
            const s = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
            process.stdout.write(`## Migration 1048 verification: pass\n\n- Production SHA: \`${s.production_sha}\`\n- Migration blob: \`${s.migration_blob_sha}\`\n- Checksum: \`${s.checksum}\`\n- Statements: ${s.statement_count}\n- Exact ledger: ${s.exact_apply_ledger_verified}\n- Readiness: ${s.readiness_view?.readiness_status || 'unverified'}\n- Apply sent by this run: ${s.apply_sent_by_this_run}\n- Secrets included: ${s.secrets_included}\n`);
          } else {
            const f = fs.existsSync(failurePath) ? JSON.parse(fs.readFileSync(failurePath, 'utf8')) : {};
            process.stdout.write(`## Migration 1048 verification: fail\n\n- Stage: ${f.stage || 'unknown'}\n- Error code: ${f.error?.code || 'workflow_failed'}\n- Apply sent: ${f.apply_sent ?? false}\n- Apply retried: ${f.apply_retried ?? false}\n`);
          }
          NODE
