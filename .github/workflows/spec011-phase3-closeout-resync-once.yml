name: Spec 011 Phase 3 Closeout Resync Once

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened
  push:
    branches:
      - gpt/spec-011-phase3-delegation-policy-runtime-closeout-20260731
    paths:
      - .github/workflows/spec011-phase3-closeout-resync-once.yml

permissions:
  contents: write

concurrency:
  group: spec011-phase3-closeout-resync-once
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'gpt/spec-011-phase3-delegation-policy-runtime-closeout-20260731'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@v4
        with:
          ref: gpt/spec-011-phase3-delegation-policy-runtime-closeout-20260731
          fetch-depth: 0

      - name: Merge latest main and reconcile JSON evidence
        shell: bash
        run: |
          set -euo pipefail
          branch="gpt/spec-011-phase3-delegation-policy-runtime-closeout-20260731"
          completion="specs/011-durable-governed-execution-and-agent-delegation/completion.json"
          manifest="specs/011-durable-governed-execution-and-agent-delegation/manifest.json"
          workflow=".github/workflows/spec011-phase3-closeout-resync-once.yml"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          pre_head="$(git rev-parse HEAD)"
          merge_base="$(git merge-base "$pre_head" origin/main)"
          mkdir -p /tmp/spec011-json-merge
          for path in "$completion" "$manifest"; do
            name="$(basename "$path")"
            git show "$merge_base:$path" > "/tmp/spec011-json-merge/base-$name"
            git show "$pre_head:$path" > "/tmp/spec011-json-merge/ours-$name"
            git show "origin/main:$path" > "/tmp/spec011-json-merge/latest-$name"
          done

          git merge --no-ff --no-commit origin/main || true

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/spec011-json-merge')
          missing = object()

          def merge_value(base, ours, latest, path='$'):
              if ours == base:
                  return latest
              if latest == base:
                  return ours
              if ours == latest:
                  return ours
              if isinstance(base, dict) and isinstance(ours, dict) and isinstance(latest, dict):
                  result = {}
                  keys = list(latest)
                  keys += [k for k in ours if k not in keys]
                  keys += [k for k in base if k not in keys]
                  for key in keys:
                      b = base.get(key, missing)
                      o = ours.get(key, missing)
                      l = latest.get(key, missing)
                      child = f'{path}.{key}'
                      if o is missing and b is missing:
                          if l is not missing:
                              result[key] = l
                      elif l is missing and b is missing:
                          if o is not missing:
                              result[key] = o
                      elif o is missing:
                          if l != b:
                              raise RuntimeError(f'conflicting deletion at {child}')
                      elif l is missing:
                          if o != b:
                              raise RuntimeError(f'conflicting deletion at {child}')
                      elif b is missing:
                          if o == l:
                              result[key] = o
                          elif isinstance(o, dict) and isinstance(l, dict):
                              result[key] = merge_value({}, o, l, child)
                          elif isinstance(o, list) and isinstance(l, list):
                              result[key] = merge_value([], o, l, child)
                          else:
                              raise RuntimeError(f'conflicting addition at {child}')
                      else:
                          result[key] = merge_value(b, o, l, child)
                  return result
              if isinstance(base, list) and isinstance(ours, list) and isinstance(latest, list):
                  if all(isinstance(x, dict) and 'number' in x for x in base + ours + latest):
                      bmap = {x['number']: x for x in base}
                      omap = {x['number']: x for x in ours}
                      lmap = {x['number']: x for x in latest}
                      order = [x['number'] for x in latest] + [x['number'] for x in ours if x['number'] not in lmap]
                      result = []
                      for number in order:
                          b = bmap.get(number, missing)
                          o = omap.get(number, missing)
                          l = lmap.get(number, missing)
                          child = f'{path}[number={number}]'
                          if b is missing:
                              if o is missing:
                                  result.append(l)
                              elif l is missing:
                                  result.append(o)
                              elif o == l:
                                  result.append(o)
                              else:
                                  result.append(merge_value({}, o, l, child))
                          elif o is missing:
                              if l != b:
                                  raise RuntimeError(f'conflicting array deletion at {child}')
                          elif l is missing:
                              if o != b:
                                  raise RuntimeError(f'conflicting array deletion at {child}')
                          else:
                              result.append(merge_value(b, o, l, child))
                      return result
                  result = list(latest)
                  for item in ours:
                      if item not in base and item not in result:
                          result.append(item)
                  for item in base:
                      if item not in ours and item in result and item in latest:
                          result.remove(item)
                  return result
              raise RuntimeError(f'conflicting scalar change at {path}')

          for name, target in [
              ('completion.json', Path('specs/011-durable-governed-execution-and-agent-delegation/completion.json')),
              ('manifest.json', Path('specs/011-durable-governed-execution-and-agent-delegation/manifest.json')),
          ]:
              base = json.loads((root / f'base-{name}').read_text())
              ours = json.loads((root / f'ours-{name}').read_text())
              latest = json.loads((root / f'latest-{name}').read_text())
              target.write_text(json.dumps(merge_value(base, ours, latest), indent=2, ensure_ascii=False) + '\n')
          PY

          git add "$completion" "$manifest"
          test -z "$(git diff --name-only --diff-filter=U)"
          python3 -m json.tool "$completion" >/dev/null
          python3 -m json.tool "$manifest" >/dev/null
          rm -f "$workflow"
          git add -A
          git commit -m "chore(spec-011): resync delegation closeout with main"
          git push origin "HEAD:$branch"
