name: Governed Local Connector Production Closure

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  issue-smoke:
    name: Verify Local Connector closure issue trigger
    runs-on: ubuntu-latest
    steps:
      - name: Verify v13 smoke command and record runner allocation
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
          SMOKE_TOKEN: RUN_LOCAL_CONNECTOR_PRODUCTION_CLOSURE_SMOKE_V13_PR_3945
        run: |
          set -euo pipefail
          BODY=$(jq -r '.comment.body // ""' "$GITHUB_EVENT_PATH")
          ISSUE=$(jq -r '.issue.number // 0' "$GITHUB_EVENT_PATH")
          ASSOCIATION=$(jq -r '.comment.author_association // ""' "$GITHUB_EVENT_PATH")
          if [[ "$BODY" != "$SMOKE_TOKEN" || "$ISSUE" != "3945" ]]; then
            exit 0
          fi
          case "$ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR) ;;
            *) echo "Untrusted author association: $ASSOCIATION"; exit 1 ;;
          esac
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPOSITORY}/issues/3945/comments" \
            -f body="LOCAL_CONNECTOR_CLOSURE_SMOKE result=pass run_id=${GITHUB_RUN_ID} trigger=issue-v13-unconditional runner=ubuntu-latest event_sha=${GITHUB_SHA}"
