name: Governed Local Connector Production Closure

on:
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - ".github/workflows/governed-local-connector-production-closure.yml"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  close-production-acceptance:
    name: Close Production Local Connector acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUNTIME_BASE_URL: https://auth.mad4b.com
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      HOTFIX_MERGE_SHA: 792ff63af82791e9a482029f5078931fa0707c8c
      ADMIN_USER_ID: 00000000-0000-4000-a000-000000000002
      PLATFORM_TENANT_ID: 00000000-0000-4000-a000-000000000001
      DEVICE_ID: mohammedlap
      BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
      GH_READ_TOKEN: ${{ github.token }}
      EVIDENCE_PATH: ${{ runner.temp }}/governed-local-connector-production-closure.json
      CLOSURE_TOKEN: RUN_LOCAL_CONNECTOR_PRODUCTION_CLOSURE_ISSUE_V14_PR_3945_792FF63A
    steps:
      - name: Verify exact governed command
        id: command
        run: |
          set -euo pipefail
          EXECUTE=false
          TRIGGER=none
          if [[ "$GITHUB_EVENT_NAME" == "issue_comment" ]]; then
            BODY=$(jq -r '.comment.body // ""' "$GITHUB_EVENT_PATH")
            ISSUE=$(jq -r '.issue.number // 0' "$GITHUB_EVENT_PATH")
            IS_PR=$(jq -r 'if .issue.pull_request then "true" else "false" end' "$GITHUB_EVENT_PATH")
            ASSOCIATION=$(jq -r '.comment.author_association // ""' "$GITHUB_EVENT_PATH")
            if [[ "$BODY" == "$CLOSURE_TOKEN" && "$ISSUE" == "3945" ]]; then
              test "$IS_PR" = "true"
              case "$ASSOCIATION" in
                OWNER|MEMBER|COLLABORATOR) ;;
                *) echo "Untrusted author association: $ASSOCIATION"; exit 1 ;;
              esac
              EXECUTE=true
              TRIGGER=issue-v14
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            MESSAGE=$(jq -r '.head_commit.message // ""' "$GITHUB_EVENT_PATH")
            REF=$(jq -r '.ref // ""' "$GITHUB_EVENT_PATH")
            if [[ "$REF" == "refs/heads/main" && "$MESSAGE" == *"$CLOSURE_TOKEN"* ]]; then
              EXECUTE=true
              TRIGGER=main-push-v15
            fi
          fi
          echo "execute=$EXECUTE" >> "$GITHUB_OUTPUT"
          echo "trigger=$TRIGGER" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted default branch
        if: steps.command.outputs.execute == 'true'
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v6
        if: steps.command.outputs.execute == 'true'
        with:
          node-version: "22"

      - name: Record visible closure start
        if: steps.command.outputs.execute == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_SOURCE: ${{ steps.command.outputs.trigger }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPOSITORY}/issues/3945/comments" \
            -f body="GOVERNED_LOCAL_CONNECTOR_PRODUCTION_CLOSURE status=started run_id=${GITHUB_RUN_ID} trigger=${TRIGGER_SOURCE} trusted_ref=main event_sha=${GITHUB_SHA}"

      - name: Verify exact merged Production PR
        if: steps.command.outputs.execute == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MERGED=$(gh api "/repos/${REPOSITORY}/pulls/3945" --jq '.merged')
          MERGE_SHA=$(gh api "/repos/${REPOSITORY}/pulls/3945" --jq '.merge_commit_sha')
          test "$MERGED" = "true"
          test "$MERGE_SHA" = "$HOTFIX_MERGE_SHA"

      - name: Execute bounded closure
        if: steps.command.outputs.execute == 'true'
        id: closure
        run: node .github/scripts/governed-local-connector-production-closure.mjs

      - name: Upload bounded closure evidence
        if: always() && steps.command.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: governed-local-connector-production-closure-${{ github.run_id }}
          path: ${{ env.EVIDENCE_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Record governed closure outcome on Production PR
        if: always() && steps.command.outputs.execute == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_SOURCE: ${{ steps.command.outputs.trigger }}
          CLOSURE_RESULT: ${{ steps.closure.outputs.result }}
          PRODUCTION_SHA: ${{ steps.closure.outputs.production_sha }}
          COMMAND_ID: ${{ steps.closure.outputs.command_id }}
          ROUTE_COUNT: ${{ steps.closure.outputs.registered_route_count }}
          HEALTH_AGE: ${{ steps.closure.outputs.health_age_seconds }}
          FAILURE_MESSAGE: ${{ steps.closure.outputs.failure_message }}
        run: |
          set -euo pipefail
          RESULT="${CLOSURE_RESULT:-unknown}"
          BODY="GOVERNED_LOCAL_CONNECTOR_PRODUCTION_CLOSURE result=${RESULT} run_id=${GITHUB_RUN_ID} trigger=${TRIGGER_SOURCE} event_sha=${GITHUB_SHA} production_sha=${PRODUCTION_SHA:-unverified} command_id=${COMMAND_ID:-none} registered_route_count=${ROUTE_COUNT:-unknown} health_age_seconds=${HEALTH_AGE:-unknown} artifact=governed-local-connector-production-closure-${GITHUB_RUN_ID} migration_apply=false provider_mutation=false credential_rotation=false"
          if [[ "$RESULT" != "pass" && -n "${FAILURE_MESSAGE:-}" ]]; then
            BODY="${BODY} failure=${FAILURE_MESSAGE}"
          fi
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPOSITORY}/issues/3945/comments" \
            -f body="$BODY"
