name: Materialize activation awareness canonical user JWT

on:
  push:
    branches:
      - fix/activation-awareness-canonical-user-jwt-4451-20260808
    paths:
      - .github/workflows/materialize-activation-awareness-canonical-user-jwt.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v5
        with:
          ref: fix/activation-awareness-canonical-user-jwt-4451-20260808
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact current main ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          test "$(git rev-parse origin/main)" = "24e3be31d71c5ae2940931ca8e9853731eb9974b"

      - name: Apply canonical User JWT boundary and regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}")
              p.write_text(text.replace(old, new, 1))

          route = Path("http-generic-api/routes/activationAwarenessRoutes.js")
          text = route.read_text()
          old_import = 'import jwt from "jsonwebtoken";\n'
          if text.count(old_import) != 1:
              raise SystemExit("activationAwarenessRoutes: jsonwebtoken import anchor mismatch")
          text = text.replace(old_import, 'import { createUserJwtMiddleware } from "../userJwtAuth.js";\n', 1)

          old_verifier = '''const JWT_SECRET = process.env.JWT_SECRET || "development_fallback_secret_only";\nconst ALLOWED_PROFILES = new Set(["evidence", "summary", "dashboard", "diagnostic", "full"]);\n\nfunction verifyUserJwt(authHeader) {\n  if (!authHeader || !authHeader.startsWith("Bearer ")) return null;\n  try {\n    return jwt.verify(authHeader.slice(7), JWT_SECRET);\n  } catch {\n    return null;\n  }\n}\n'''
          new_verifier = '''const requireCanonicalUserJwt = createUserJwtMiddleware();\nconst ALLOWED_PROFILES = new Set(["evidence", "summary", "dashboard", "diagnostic", "full"]);\n'''
          if text.count(old_verifier) != 1:
              raise SystemExit("activationAwarenessRoutes: local verifier block anchor mismatch")
          text = text.replace(old_verifier, new_verifier, 1)

          old_payload = '  const payload = req.auth?.mode === "user_jwt" ? req.auth : verifyUserJwt(req.headers.authorization);\n'
          new_payload = '  const payload = req.auth?.mode === "user_jwt" ? req.auth : null;\n'
          if text.count(old_payload) != 1:
              raise SystemExit("activationAwarenessRoutes: membership guard payload anchor mismatch")
          text = text.replace(old_payload, new_payload, 1)

          guard_anchor = 'requireTenantUserJwt, async'
          guard_count = text.count(guard_anchor)
          if guard_count < 1:
              raise SystemExit("activationAwarenessRoutes: no tenant route guards found")
          text = text.replace(guard_anchor, 'requireCanonicalUserJwt, requireTenantUserJwt, async')

          old_export = 'export const _testingActivationAwarenessRoutes = {\n  verifyUserJwt,\n'
          if text.count(old_export) != 1:
              raise SystemExit("activationAwarenessRoutes: testing export anchor mismatch")
          text = text.replace(old_export, 'export const _testingActivationAwarenessRoutes = {\n', 1)
          route.write_text(text)

          governance = Path("http-generic-api/scripts/user-jwt-auth-governance.mjs")
          g = governance.read_text()
          old_list = '  "http-generic-api/routes/connectApiRoutes.js",\n]);'
          new_list = '  "http-generic-api/routes/connectApiRoutes.js",\n  "http-generic-api/routes/activationAwarenessRoutes.js",\n]);'
          if g.count(old_list) != 1:
              raise SystemExit("user-jwt-auth-governance: hardened list anchor mismatch")
          governance.write_text(g.replace(old_list, new_list, 1))

          test = Path("http-generic-api/test-activation-awareness-user-jwt-boundary.mjs")
          test.write_text('''import assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\nimport { verifyUserJwtAuthorization } from "./userJwtAuth.js";\nimport { HARDENED_AUTH_FILES, hardenedFileViolations } from "./scripts/user-jwt-auth-governance.mjs";\n\nconst routePath = "http-generic-api/routes/activationAwarenessRoutes.js";\nconst source = readFileSync(routePath, "utf8");\n\nassert.equal(source.includes('import jwt from "jsonwebtoken"'), false);\nassert.equal(source.includes("development_fallback_secret_only"), false);\nassert.match(source, /import \\{ createUserJwtMiddleware \\} from "\\.\\.\\/userJwtAuth\\.js";/);\nassert.match(source, /const requireCanonicalUserJwt = createUserJwtMiddleware\\(\\);/);\nassert.equal(source.includes('req.auth?.mode === "user_jwt" ? req.auth : verifyUserJwt'), false);\nassert.match(source, /req\\.auth\\?\\.mode === "user_jwt" \\? req\\.auth : null/);\n\nconst tenantRouteLines = source.split("\\n").filter((line) => /router\\.(?:get|post|patch|put|delete)\\("\\/tenant\\//.test(line));\nassert.ok(tenantRouteLines.length >= 10, `expected tenant route surface, found ${tenantRouteLines.length}`);\nfor (const line of tenantRouteLines) {\n  assert.match(line, /requireCanonicalUserJwt, requireTenantUserJwt/, `tenant route bypasses canonical User JWT middleware: ${line.trim()}`);\n}\n\nassert.ok(HARDENED_AUTH_FILES.includes(routePath));\nassert.deepEqual(hardenedFileViolations(), []);\n\nlet verifyCalled = false;\nconst unavailable = verifyUserJwtAuthorization("Bearer attacker-controlled-token", {\n  env: {},\n  verifyToken() { verifyCalled = true; throw new Error("must not run without configured secret"); },\n});\nassert.equal(unavailable.ok, false);\nassert.equal(unavailable.status, 503);\nassert.equal(unavailable.code, "user_jwt_verifier_unavailable");\nassert.equal(verifyCalled, false);\n\nconst algorithmProbe = verifyUserJwtAuthorization("Bearer token", {\n  env: { JWT_SECRET: "configured-secret" },\n  verifyToken(_token, _secret, options) {\n    assert.deepEqual(options.algorithms, ["HS256"]);\n    return { user_id: "user-1", tenant_id: "stale-token-tenant", role: "owner" };\n  },\n});\nassert.equal(algorithmProbe.ok, true);\nassert.equal(algorithmProbe.claims.user_id, "user-1");\n\nassert.match(source, /fetchActiveMembership\\(\\{ userId: payload\\.user_id, tenantId: requestedTenantId \\}\\)/);\nassert.match(source, /tenant_id: membership\\.tenant_id/);\nassert.match(source, /tenant_role: membership\\.role/);\n\nconsole.log("activation awareness canonical User JWT boundary tests passed");\n''')

          e2e = {
            "$schema": "../../.specify/schemas/e2e-phases.schema.json",
            "schema_version": 1,
            "feature_key": "activation-awareness-canonical-user-jwt",
            "title": "Canonical User JWT boundary for tenant activation and resolution surfaces",
            "delivery_mode": "single_pr",
            "current_phase": "mvp",
            "scope": {"include": [
              ".changes/e2e/activation-awareness-canonical-user-jwt.json",
              "http-generic-api/routes/activationAwarenessRoutes.js",
              "http-generic-api/scripts/user-jwt-auth-governance.mjs",
              "http-generic-api/test-activation-awareness-user-jwt-boundary.mjs"
            ]},
            "merge_contract": {"minimum_phase": "mvp"},
            "phases": [{
              "id": "mvp",
              "status": "implemented",
              "objective": "Require the shared fail-closed User JWT verifier before active-membership rebinding on every tenant activation, operational-attention, resolution, repair, approval, dynamic-detail, and run-archive route while leaving Admin routes unchanged.",
              "e2e_journeys": [{
                "id": "tenant-activation-resolution-routes-use-canonical-user-jwt-before-membership-authority",
                "end_to_end": True,
                "level": "synthetic_runtime",
                "actor": "Tenant user",
                "entrypoint": "Tenant activation and resolution HTTP routes",
                "terminal_outcome": "Every tenant route is authenticated by the shared User JWT middleware with no fallback secret before tenant and role are rebound from active database membership; missing verifier configuration fails closed and Admin routes remain unchanged.",
                "steps": [
                  "Authenticate the tenant request through createUserJwtMiddleware before route-local membership resolution.",
                  "Fail with verifier-unavailable semantics when JWT_SECRET is not configured instead of accepting a repository fallback secret.",
                  "Restrict token verification to the canonical HS256 algorithm contract.",
                  "Resolve the caller tenant and tenant role from active membership plus active tenant state rather than trusting token role claims.",
                  "Apply the composed canonical-auth then membership guard to every /tenant/ activation and resolution route, including task-source repair and skill-approval mutations.",
                  "Keep Admin activation routes and their backend API-key guard unchanged.",
                  "Ratchet activationAwarenessRoutes.js into the hardened User JWT governance file set."
                ],
                "assertions": [
                  "activationAwarenessRoutes.js contains no jsonwebtoken import, local token verifier, or development fallback secret.",
                  "All /tenant/ routes compose requireCanonicalUserJwt before requireTenantUserJwt.",
                  "A bearer token cannot be verified when JWT_SECRET is missing and the canonical verifier pins HS256.",
                  "Membership database authority supplies tenant_id and tenant_role after canonical authentication.",
                  "The hardened-file governance scanner permanently covers activationAwarenessRoutes.js.",
                  "No repair, approval, provider, database, Production, secret, or external-send side effect is introduced by this auth-only change."
                ],
                "tests": [
                  {"id": "user-jwt-auth-regression", "runner": "node", "working_directory": "http-generic-api", "path": "test-user-jwt-auth.mjs", "args": []},
                  {"id": "activation-awareness-user-jwt-boundary", "runner": "node", "working_directory": "http-generic-api", "path": "test-activation-awareness-user-jwt-boundary.mjs", "args": []},
                  {"id": "activation-awareness-completeness", "runner": "node", "working_directory": "http-generic-api", "path": "test-activation-awareness-completeness.mjs", "args": []}
                ],
                "evidence_paths": [
                  ".changes/e2e/activation-awareness-canonical-user-jwt.json",
                  "http-generic-api/routes/activationAwarenessRoutes.js",
                  "http-generic-api/scripts/user-jwt-auth-governance.mjs",
                  "http-generic-api/test-activation-awareness-user-jwt-boundary.mjs"
                ]
              }]
            }]
          }
          Path(".changes/e2e/activation-awareness-canonical-user-jwt.json").write_text(json.dumps(e2e, indent=2) + "\n")
          PY

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Run focused canonical auth regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check http-generic-api/routes/activationAwarenessRoutes.js
          node http-generic-api/test-user-jwt-auth.mjs
          node http-generic-api/test-activation-awareness-user-jwt-boundary.mjs
          node http-generic-api/test-activation-awareness-completeness.mjs

      - name: Remove materializer and enforce exact final scope
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-activation-awareness-canonical-user-jwt.yml
          git add -A
          git diff --cached --check
          actual="$(git diff --cached --name-only origin/main | sort)"
          expected="$(printf '%s\n' \
            '.changes/e2e/activation-awareness-canonical-user-jwt.json' \
            'http-generic-api/routes/activationAwarenessRoutes.js' \
            'http-generic-api/scripts/user-jwt-auth-governance.mjs' \
            'http-generic-api/test-activation-awareness-user-jwt-boundary.mjs' | sort)"
          test "$actual" = "$expected"

      - name: Commit canonical auth hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(auth): canonicalize tenant activation User JWT verification"
          git push origin HEAD:fix/activation-awareness-canonical-user-jwt-4451-20260808
