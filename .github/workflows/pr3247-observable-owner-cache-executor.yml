name: PR 3247 observable owner-cache executor

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - gpt/response-chunk-ownership-a23e0076

permissions:
  contents: write
  pull-requests: read

jobs:
  execute:
    if: startsWith(github.event.pull_request.head.ref, 'gpt/pr3247-observable-owner-cache-trigger-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gpt/response-chunk-ownership-a23e0076
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json
      - name: Apply robust patch and run targeted regression
        id: patch
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            python .github/scripts/pr3247_apply_owner_cache_patch.py
            node --check http-generic-api/routes/gptToolsRoutes.js
            node --check http-generic-api/test-gpt-tools-response-chunking.mjs
            git diff --check
            cd http-generic-api
            npm ci --ignore-scripts
            node test-gpt-tools-response-chunking.mjs
          ) > /tmp/pr3247-run.log 2>&1
          status=$?
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          tail -n 200 /tmp/pr3247-run.log > /tmp/pr3247-run-tail.log
          cat /tmp/pr3247-run-tail.log
          exit 0
      - name: Record fail-closed diagnostic
        if: steps.patch.outputs.status != '0'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          mkdir -p .tmp/pr3247
          {
            echo "status=failed"
            echo "executor_pr=${{ github.event.pull_request.number }}"
            echo "base_head_before=${{ github.event.pull_request.base.sha }}"
            echo "secrets_included=false"
            echo "--- log tail ---"
            cat /tmp/pr3247-run-tail.log
          } > .tmp/pr3247/runner-failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp/pr3247/runner-failure.txt
          git commit -m "chore: record PR 3247 owner-cache runner failure"
          git push origin HEAD:gpt/response-chunk-ownership-a23e0076
          exit 1
      - name: Commit clean patch
        if: steps.patch.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr3247-one-shot-owner-cache.yml
          rm -f .github/workflows/pr3247-observable-owner-cache-executor.yml
          rm -f .github/scripts/pr3247_extract_patch.py
          rm -f .github/scripts/pr3247_apply_owner_cache_patch.py
          rm -rf .tmp/pr3247
          rmdir .tmp 2>/dev/null || true
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security: enforce response chunk cache ownership"
          git push origin HEAD:gpt/response-chunk-ownership-a23e0076
