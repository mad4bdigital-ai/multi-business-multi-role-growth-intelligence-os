name: Repair PR 6509 Spec 014 Work Map Bindings

on:
  push:
    branches:
      - fix/transport-response-schema-promotion-readiness-v2-20260806
    paths:
      - .github/ops/repair-pr6509-spec014-work-map-bindings.trigger

permissions:
  contents: write

concurrency:
  group: repair-pr6509-spec014-work-map-bindings-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_BRANCH: fix/transport-response-schema-promotion-readiness-v2-20260806
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Refresh only deterministic Spec 014 bindings
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            --feature-key 014-retail-commerce-operations-growth-os

          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -ge 2
          test "${#changed[@]}" -le 3
          for path in "${changed[@]}"; do
            case "${path}" in
              specs/014-governed-hostinger-storage-orchestration/work-map-integration.json|\
              specs/014-retail-commerce-operations-growth-os/work-map-integration.json|\
              specs/014-governed-hostinger-storage-orchestration/tasks.md)
                ;;
              *)
                echo "Unexpected binding refresh path: ${path}" >&2
                exit 1
                ;;
            esac
          done
          printf '%s\n' "${changed[@]}" | grep -Fxq specs/014-governed-hostinger-storage-orchestration/work-map-integration.json
          printf '%s\n' "${changed[@]}" | grep -Fxq specs/014-retail-commerce-operations-growth-os/work-map-integration.json
          git diff --check

      - name: Validate refreshed binding contract
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --check
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            --feature-key 014-retail-commerce-operations-growth-os --check
          (
            cd http-generic-api
            node test-work-map-schema-classification.mjs
            node test-work-map-schema-classification-contract.mjs
            node test-work-map-autofix-diagnostics.mjs
            node test-spec-kit-work-map-governance-gate.mjs
            node test-spec-kit-completion-gate.mjs
            node test-spec014-refresh-final-work-map-binding.mjs
          )

      - name: Commit bounded repair and retire materializer
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${EXPECTED_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${GITHUB_SHA}"

          git rm .github/workflows/repair-pr6509-spec014-work-map-bindings.yml
          git rm .github/ops/repair-pr6509-spec014-work-map-bindings.trigger

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            specs/014-governed-hostinger-storage-orchestration/work-map-integration.json \
            specs/014-retail-commerce-operations-growth-os/work-map-integration.json
          if ! git diff --quiet -- specs/014-governed-hostinger-storage-orchestration/tasks.md; then
            git add specs/014-governed-hostinger-storage-orchestration/tasks.md
          fi
          git diff --cached --check
          git commit -m "fix(spec): refresh Spec 014 Work Map registry bindings"

          remote_head="$(git ls-remote origin "refs/heads/${EXPECTED_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${GITHUB_SHA}"
          git push origin "HEAD:${EXPECTED_BRANCH}"
