name: Governed Production Release-Cut Reconciliation
run-name: Governed Release-Cut Reconciliation · ${{ github.event.pull_request.number || inputs.expected_main_sha || github.run_id }}

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/governed-production-release-cut-reconciliation.yml"
      - ".github/scripts/production-release-cut-reconciliation.mjs"
      - ".github/tests/production-promotion-runtime.test.mjs"
      - ".changes/e2e/production-promotion-release-cut-controller.json"
      - "http-generic-api/config/repository-governance-constitution.json"
      - ".github/derived-state-governance.json"
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact current main SHA to use as first parent
        required: true
        type: string
      expected_production_sha:
        description: Exact current Production SHA to use as second parent
        required: true
        type: string
      reconciliation_branch:
        description: Non-protected release/* reconciliation branch
        required: true
        type: string
      confirmation:
        description: Type AUTHORIZE_GOVERNED_PRODUCTION_RELEASE_CUT_RECONCILIATION
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: governed-production-release-cut-reconciliation-${{ github.event.pull_request.number || inputs.expected_main_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  validate-reconciliation-pr:
    name: Validate exact two-parent release-cut reconciliation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout exact reconciliation candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact parents, tree policy, and protected-ref CAS
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPORT_DIR: ${{ runner.temp }}/production-release-cut-reconciliation
        run: |
          set -Eeuo pipefail
          mkdir -p "$REPORT_DIR"
          require_sha() { [[ "$2" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::$1 must be an exact SHA"; exit 1; }; }
          reject() { echo "::error::$1"; exit 1; }

          pr_json="$(gh api "/repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          [[ "$(jq -r '.state' <<<"$pr_json")" == open ]] || reject "reconciliation PR must remain open"
          [[ "$(jq -r '.base.ref' <<<"$pr_json")" == main ]] || reject "reconciliation PR must target main"
          [[ "$(jq -r '.head.repo.full_name' <<<"$pr_json")" == "$REPOSITORY" ]] || reject "cross-repository reconciliation is forbidden"
          branch="$(jq -r '.head.ref' <<<"$pr_json")"
          [[ "$branch" =~ ^release/production-reconciliation/[A-Za-z0-9._/-]+$ ]] || reject "reconciliation branch must use release/production-reconciliation/*"
          body="$(jq -r '.body // ""' <<<"$pr_json")"
          main_parent="$(grep -Eo 'main_parent: [0-9a-f]{40}' <<<"$body" | head -n1 | awk '{print $2}')"
          production_parent="$(grep -Eo 'production_parent: [0-9a-f]{40}' <<<"$body" | head -n1 | awk '{print $2}')"
          [[ "$body" == *"release_cut_reconciliation: true"* ]] || reject "reconciliation marker missing"
          [[ "$body" == *"tree_policy: exact_main_tree"* ]] || reject "exact tree policy marker missing"
          [[ "$body" == *"merge_method_required: merge_commit_only"* ]] || reject "merge commit-only marker missing"
          require_sha EXPECTED_HEAD_SHA "$EXPECTED_HEAD_SHA"
          require_sha MAIN_PARENT "$main_parent"
          require_sha PRODUCTION_PARENT "$production_parent"

          git fetch --prune --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/Production:refs/remotes/origin/Production'
          current_main_sha="$(git rev-parse refs/remotes/origin/main)"
          current_production_sha="$(git rev-parse refs/remotes/origin/Production)"
          parents=( $(git show -s --format=%P "$EXPECTED_HEAD_SHA") )
          [[ "${#parents[@]}" == 2 ]] || reject "reconciliation commit must have exactly two parents"
          [[ "${parents[0]}" == "$main_parent" ]] || reject "first parent must be declared main parent"
          [[ "${parents[1]}" == "$production_parent" ]] || reject "second parent must be declared Production parent"
          [[ "$(git rev-parse "${EXPECTED_HEAD_SHA}^{tree}")" == "$(git rev-parse "${main_parent}^{tree}")" ]] || reject "reconciliation tree must equal main tree"
          git merge-base --is-ancestor "$main_parent" "$current_main_sha" || reject "main parent is not contained by current main"
          [[ "$current_production_sha" == "$production_parent" ]] || reject "Production moved after reconciliation authorization"
          git merge-base --is-ancestor "$production_parent" "$EXPECTED_HEAD_SHA" || reject "reconciliation does not contain Production parent"

          jq -n \
            --arg reconciliation_sha "$EXPECTED_HEAD_SHA" \
            --arg main_sha "$main_parent" \
            --arg production_sha "$production_parent" \
            --arg current_main_sha "$current_main_sha" \
            --arg current_production_sha "$current_production_sha" \
            --argjson parents "$(printf '%s\n' "${parents[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')" \
            '{mainSha:$main_sha,productionSha:$production_sha,reconciliationSha:$reconciliation_sha,mainTreeSha:(""),reconciliationTreeSha:(""),currentMainSha:$current_main_sha,currentProductionSha:$current_production_sha,parents:$parents,protectedRefsStable:true}' \
            > "$REPORT_DIR/reconciliation-input.json"
          main_tree="$(git rev-parse "${main_parent}^{tree}")"
          reconciliation_tree="$(git rev-parse "${EXPECTED_HEAD_SHA}^{tree}")"
          jq --arg main_tree "$main_tree" --arg reconciliation_tree "$reconciliation_tree" '.mainTreeSha=$main_tree | .reconciliationTreeSha=$reconciliation_tree' "$REPORT_DIR/reconciliation-input.json" > "$REPORT_DIR/reconciliation-input.next.json"
          mv "$REPORT_DIR/reconciliation-input.next.json" "$REPORT_DIR/reconciliation-input.json"
          node .github/scripts/production-release-cut-reconciliation.mjs --input "$REPORT_DIR/reconciliation-input.json" --output "$REPORT_DIR/reconciliation-report.json"
          jq -e '.ok == true and .merge_method_required == "merge_commit_only" and .production_merge == false and .deployment_executed == false and .migration_executed == false and .secrets_included == false' "$REPORT_DIR/reconciliation-report.json" >/dev/null
          echo "report=$REPORT_DIR/reconciliation-report.json" >> "$GITHUB_OUTPUT"

      - name: Upload canonical reconciliation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-release-cut-reconciliation-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/production-release-cut-reconciliation/reconciliation-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish summary
        if: always()
        env:
          REPORT_DIR: ${{ runner.temp }}/production-release-cut-reconciliation
        shell: bash
        run: |
          jq . "$REPORT_DIR/reconciliation-report.json" >> "$GITHUB_STEP_SUMMARY"

  create-reconciliation-pr:
    name: Create exact release-cut reconciliation PR
    if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'AUTHORIZE_GOVERNED_PRODUCTION_RELEASE_CUT_RECONCILIATION'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
      EXPECTED_PRODUCTION_SHA: ${{ inputs.expected_production_sha }}
      RECONCILIATION_BRANCH: ${{ inputs.reconciliation_branch }}
      CONFIRMATION: ${{ inputs.confirmation }}
      REPORT_DIR: ${{ runner.temp }}/production-release-cut-reconciliation
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build and publish exact two-parent reconciliation branch
        id: create
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$REPORT_DIR"
          reject() { echo "::error::$1"; exit 1; }
          [[ "$CONFIRMATION" == "AUTHORIZE_GOVERNED_PRODUCTION_RELEASE_CUT_RECONCILIATION" ]] || reject "typed reconciliation confirmation mismatch"
          [[ "$GITHUB_REF_NAME" == "main" ]] || reject "reconciliation must run from trusted main"
          [[ "$GITHUB_SHA" == "$EXPECTED_MAIN_SHA" ]] || reject "main moved before reconciliation dispatch"
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]] || reject "expected main SHA invalid"
          [[ "$EXPECTED_PRODUCTION_SHA" =~ ^[0-9a-f]{40}$ ]] || reject "expected Production SHA invalid"
          [[ "$RECONCILIATION_BRANCH" =~ ^release/production-reconciliation/[A-Za-z0-9._/-]+$ ]] || reject "invalid reconciliation branch"

          git fetch --prune --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/Production:refs/remotes/origin/Production'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          current_main_sha="$(git rev-parse refs/remotes/origin/main)"
          current_production_sha="$(git rev-parse refs/remotes/origin/Production)"
          [[ "$current_main_sha" == "$EXPECTED_MAIN_SHA" ]] || reject "main moved during reconciliation preflight"
          [[ "$current_production_sha" == "$EXPECTED_PRODUCTION_SHA" ]] || reject "Production moved during reconciliation preflight"
          git cat-file -e "${EXPECTED_MAIN_SHA}^{commit}"
          git cat-file -e "${EXPECTED_PRODUCTION_SHA}^{commit}"

          existing_sha="$(git ls-remote --heads origin "refs/heads/$RECONCILIATION_BRANCH" | awk '{print $1}')"
          if [[ -n "$existing_sha" ]]; then
            parents=( $(git show -s --format=%P "$existing_sha" 2>/dev/null || true) )
            [[ "${#parents[@]}" == 2 && "${parents[0]}" == "$EXPECTED_MAIN_SHA" && "${parents[1]}" == "$EXPECTED_PRODUCTION_SHA" ]] || reject "existing reconciliation branch is not exact reusable topology"
            reconciliation_sha="$existing_sha"
          else
            reconciliation_sha="$({
              printf '%s\n\n%s\n%s\n%s\n' \
                'release: reconcile Production ancestry into main' \
                "main_parent=$EXPECTED_MAIN_SHA" \
                "production_parent=$EXPECTED_PRODUCTION_SHA" \
                'tree_policy=exact_main_tree';
            } | GIT_AUTHOR_NAME='mad4b-release-bot' \
              GIT_AUTHOR_EMAIL='mad4b-release-bot@users.noreply.github.com' \
              GIT_AUTHOR_DATE="$(git show -s --format=%cI "$EXPECTED_MAIN_SHA")" \
              GIT_COMMITTER_NAME='mad4b-release-bot' \
              GIT_COMMITTER_EMAIL='mad4b-release-bot@users.noreply.github.com' \
              GIT_COMMITTER_DATE="$(git show -s --format=%cI "$EXPECTED_MAIN_SHA")" \
              git commit-tree "$(git rev-parse "${EXPECTED_MAIN_SHA}^{tree}")" -p "$EXPECTED_MAIN_SHA" -p "$EXPECTED_PRODUCTION_SHA")"
            git push origin "$reconciliation_sha:refs/heads/$RECONCILIATION_BRANCH"
          fi

          branch_readback="$(git ls-remote --heads origin "refs/heads/$RECONCILIATION_BRANCH" | awk '{print $1}')"
          [[ "$branch_readback" == "$reconciliation_sha" ]] || reject "reconciliation branch CAS readback mismatch"
          parents=( $(git show -s --format=%P "$reconciliation_sha") )
          [[ "${#parents[@]}" == 2 && "${parents[0]}" == "$EXPECTED_MAIN_SHA" && "${parents[1]}" == "$EXPECTED_PRODUCTION_SHA" ]] || reject "reconciliation parents changed"
          [[ "$(git rev-parse "${reconciliation_sha}^{tree}")" == "$(git rev-parse "${EXPECTED_MAIN_SHA}^{tree}")" ]] || reject "reconciliation tree changed"
          current_main_sha="$(gh api "/repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          current_production_sha="$(gh api "/repos/${REPOSITORY}/git/ref/heads/Production" --jq '.object.sha')"
          [[ "$current_main_sha" == "$EXPECTED_MAIN_SHA" && "$current_production_sha" == "$EXPECTED_PRODUCTION_SHA" ]] || reject "protected refs moved before PR creation"

          body="$RUNNER_TEMP/reconciliation-pr.md"
          cat > "$body" <<EOF
          ## Governed Production release-cut reconciliation

          - release_cut_reconciliation: true
          - main_parent: $EXPECTED_MAIN_SHA
          - production_parent: $EXPECTED_PRODUCTION_SHA
          - reconciliation_head: $reconciliation_sha
          - tree_policy: exact_main_tree
          - merge_method_required: merge_commit_only
          - main_merge_authorization_required: true
          - production_promotion_authorization_required: true
          - production_merge: false
          - deployment_executed: false
          - migration_executed: false
          - provider_mutation: false
          - credential_payload_read: false
          - secrets_included: false

          This PR contains one exact two-parent commit: current main first, pinned Production second, with a tree byte-identical to main. It exists only to make the certified release-cut ancestry explicit. It must be merged using a merge commit, never squash or rebase. This PR does not deploy, migrate, grant, mutate a provider, or authorize Production promotion.
          EOF
          existing_pr="$(gh pr list --repo "$REPOSITORY" --state open --head "$RECONCILIATION_BRANCH" --base main --limit 1 --json number --jq '.[0].number // empty')"
          if [[ -n "$existing_pr" ]]; then
            gh pr edit "$existing_pr" --repo "$REPOSITORY" --title "release: reconcile Production ancestry into main" --body-file "$body"
            pr_number="$existing_pr"
          else
            pr_url="$(gh pr create --repo "$REPOSITORY" --head "$RECONCILIATION_BRANCH" --base main --title "release: reconcile Production ancestry into main" --body-file "$body")"
            pr_number="$(sed -n 's#.*/pull/\([0-9][0-9]*\).*#\1#p' <<<"$pr_url" | tail -n1)"
          fi
          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]] || reject "reconciliation PR number unresolved"
          jq -n \
            --arg reconciliation_sha "$reconciliation_sha" \
            --arg main_sha "$EXPECTED_MAIN_SHA" \
            --arg production_sha "$EXPECTED_PRODUCTION_SHA" \
            --arg branch "$RECONCILIATION_BRANCH" \
            --argjson pr "$pr_number" \
            '{schema_version:"governed_production_release_cut_reconciliation.v1",ok:true,reconciliation_sha:$reconciliation_sha,main_sha:$main_sha,production_sha:$production_sha,branch:$branch,reconciliation_pr:$pr,first_parent_is_main:true,second_parent_is_production:true,tree_matches_main:true,merge_method_required:"merge_commit_only",merge_executed:false,production_merge:false,deployment_executed:false,migration_executed:false,provider_mutation:false,credential_payload_read:false,secrets_included:false}' > "$REPORT_DIR/reconciliation-report.json"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "reconciliation_sha=$reconciliation_sha" >> "$GITHUB_OUTPUT"

      - name: Upload reconciliation creation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-release-cut-reconciliation-created-${{ github.run_id }}
          path: ${{ runner.temp }}/production-release-cut-reconciliation/reconciliation-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Governed Production release-cut reconciliation created
          - reconciliation: \\`${{ steps.create.outputs.reconciliation_sha }}\\`
          - PR: \\`${{ steps.create.outputs.pr_number }}\\`
          - merge method: \\`merge_commit_only\\`
          - Production mutation: \\`false\\`
          - Production deployment: \\`false\\`
          EOF
