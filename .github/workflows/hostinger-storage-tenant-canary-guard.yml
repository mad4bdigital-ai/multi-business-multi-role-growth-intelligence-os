name: Hostinger Storage Tenant Canary Guard

on:
  pull_request:
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.mts'
      - '**/*.cts'
      - '.github/workflows/hostinger-storage-tenant-canary-guard.yml'
      - 'specs/014-governed-hostinger-storage-orchestration/**'
  push:
    branches:
      - 'gpt/014-hostinger/tenant-canary-*'
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.mts'
      - '**/*.cts'
      - '.github/workflows/hostinger-storage-tenant-canary-guard.yml'
      - 'specs/014-governed-hostinger-storage-orchestration/**'

permissions:
  contents: read

jobs:
  tenant-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check http-generic-api/hostingerStorageTenantCanaryPolicyBase.js
          node --check http-generic-api/hostingerStorageTenantCanaryPolicy.js
          node --check http-generic-api/hostingerStorageTenantCanaryBase.js
          node --check http-generic-api/hostingerStorageTenantCanary.js
          node --check http-generic-api/test-hostinger-storage-tenant-canary.mjs
          node --check http-generic-api/test-hostinger-storage-tenant-canary-authority-cas.mjs
          node --check http-generic-api/test-hostinger-storage-tenant-canary-postmerge-hardening.mjs
          node --check http-generic-api/test-hostinger-storage-tenant-canary-token-normalization.mjs
          node --check http-generic-api/test-hostinger-storage-tenant-canary-token-delegation.mjs
      - name: Enforce synthetic Tenant boundary
        run: |
          ! grep -R -E "from ['\"]node:(child_process|fs|fs/promises|net|tls)['\"]|require\(['\"](child_process|fs|net|tls)['\"]\)|\b(exec|execFile|spawn|fork)\s*\(|shell\s*:\s*true|StrictHostKeyChecking=no|rm\s+-rf" \
            http-generic-api/hostingerStorageTenantCanaryPolicyBase.js \
            http-generic-api/hostingerStorageTenantCanaryPolicy.js \
            http-generic-api/hostingerStorageTenantCanaryBase.js \
            http-generic-api/hostingerStorageTenantCanary.js
          grep -q "synthetic_only: true" http-generic-api/hostingerStorageTenantCanaryBase.js
          grep -q "dispatch_allowed: false" http-generic-api/hostingerStorageTenantCanaryPolicyBase.js
          grep -q "production_ready: false" http-generic-api/hostingerStorageTenantCanaryBase.js
          grep -q "manual_one_shot" http-generic-api/hostingerStorageTenantCanaryPolicyBase.js
          grep -q "tenant_exclusive" http-generic-api/hostingerStorageTenantCanaryPolicyBase.js
          grep -q "immutable_plan" http-generic-api/hostingerStorageTenantCanaryPolicyBase.js
          grep -q "STORAGE_TENANT_CANARY_CANDIDATE_ITEMS_MISMATCH" http-generic-api/hostingerStorageTenantCanaryPolicyBase.js
          grep -q "STORAGE_TENANT_CANARY_PATH_PREFIX_BOUNDARY_REQUIRED" http-generic-api/hostingerStorageTenantCanaryPolicyBase.js
          grep -q "STORAGE_TENANT_CANARY_PROTOCOL_VERSION_INVALID" http-generic-api/hostingerStorageTenantCanaryPolicyBase.js
      - name: Enforce governed Base imports repository-wide
        run: |
          tenant_imports="$(grep -R -l "hostingerStorageTenantCanaryBase.js" . \
            --include='*.js' --include='*.mjs' --include='*.ts' --include='*.tsx' --include='*.mts' --include='*.cts' \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=coverage --exclude-dir=dist --exclude-dir=build \
            | sed 's#^./##' | sort)"
          policy_imports="$(grep -R -l "hostingerStorageTenantCanaryPolicyBase.js" . \
            --include='*.js' --include='*.mjs' --include='*.ts' --include='*.tsx' --include='*.mts' --include='*.cts' \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=coverage --exclude-dir=dist --exclude-dir=build \
            | sed 's#^./##' | sort)"
          test "$tenant_imports" = "http-generic-api/hostingerStorageTenantCanary.js"
          test "$policy_imports" = "http-generic-api/hostingerStorageTenantCanaryPolicy.js"
      - name: Enforce post-merge hardening contracts
        run: |
          grep -q "new WeakSet()" http-generic-api/hostingerStorageTenantCanary.js
          grep -q "createHostingerStorageTenantCanarySyntheticAdapter" http-generic-api/hostingerStorageTenantCanary.js
          grep -q "tenantCanaryAdapters.add(adapter)" http-generic-api/hostingerStorageTenantCanary.js
          grep -q "tenantCanaryAdapters.has(adapter)" http-generic-api/hostingerStorageTenantCanary.js
          grep -q "Object.isFrozen(adapter)" http-generic-api/hostingerStorageTenantCanary.js
          grep -q "hostinger_storage_synthetic_memory_adapter_v1" http-generic-api/hostingerStorageTenantCanary.js
          grep -q "spec014-hostinger-storage-synthetic-adapter-v1" http-generic-api/hostingerStorageTenantCanary.js
          grep -q "createHostingerStorageTenantCanarySyntheticAdapter" http-generic-api/test-hostinger-storage-tenant-canary.mjs
          grep -q "createHostingerStorageTenantCanarySyntheticAdapter" http-generic-api/test-hostinger-storage-tenant-canary-postmerge-hardening.mjs
          grep -F -q "Object.freeze({ ...spoofedAdapterFixture.adapter })" http-generic-api/test-hostinger-storage-tenant-canary-postmerge-hardening.mjs
          grep -q "boundedIdToken" http-generic-api/hostingerStorageTenantCanary.js
          grep -q "slice(0, 256)" http-generic-api/hostingerStorageTenantCanary.js
          grep -q "boundedHashToken" http-generic-api/hostingerStorageTenantCanary.js
          grep -q "slice(0, 64).toLowerCase()" http-generic-api/hostingerStorageTenantCanary.js
          grep -q "snapshotAuthorityRecord" http-generic-api/hostingerStorageTenantCanary.js
          grep -q "Object.getOwnPropertyDescriptors" http-generic-api/hostingerStorageTenantCanary.js
          grep -q "STORAGE_TENANT_CANARY_AUTHORITY_TOKEN_INPUT_INVALID" http-generic-api/hostingerStorageTenantCanary.js
          grep -q "base.updateAllowlist({ allowlist_id: id, expected_revision: expectedRevision, record })" http-generic-api/hostingerStorageTenantCanary.js
          grep -q "base.updateApproval({ approval_id: id, expected_evidence_digest: expectedEvidenceDigest, record })" http-generic-api/hostingerStorageTenantCanary.js
          grep -q "STORAGE_TENANT_CANARY_ALLOWLIST_TOKEN_REUSED" http-generic-api/hostingerStorageTenantCanary.js
          grep -q "STORAGE_TENANT_CANARY_APPROVAL_TOKEN_REUSED" http-generic-api/hostingerStorageTenantCanary.js
          grep -q "transitionOperation" http-generic-api/hostingerStorageTenantCanary.js
          grep -q "consumePlan" http-generic-api/hostingerStorageTenantCanary.js
          grep -q "appendJournalEvent" http-generic-api/hostingerStorageTenantCanary.js
          grep -q "recordReconciliation" http-generic-api/hostingerStorageTenantCanary.js
          grep -q "authority_context_hash" http-generic-api/hostingerStorageTenantCanary.js
          grep -q "ownership_revision" http-generic-api/hostingerStorageTenantCanary.js
          grep -q "policy_revision" http-generic-api/hostingerStorageTenantCanary.js
          grep -q "STORAGE_TENANT_CANARY_EVALUATION_NOT_STARTED" http-generic-api/hostingerStorageTenantCanaryPolicy.js
          grep -q "STORAGE_TENANT_CANARY_ALLOWLIST_NOT_STARTED" http-generic-api/hostingerStorageTenantCanaryPolicy.js
          grep -q "STORAGE_TENANT_CANARY_APPROVAL_NOT_STARTED" http-generic-api/hostingerStorageTenantCanaryPolicy.js
          grep -q "STORAGE_TENANT_CANARY_ENABLEMENT_NOT_STARTED" http-generic-api/hostingerStorageTenantCanaryPolicy.js
      - name: Enforce validation before one-shot consumption
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base = fs.readFileSync('http-generic-api/hostingerStorageTenantCanaryBase.js', 'utf8');
          const authority = base.indexOf('revalidateCurrentAuthority({ authorization, authorityStore: authority_store, now });');
          const preflight = base.indexOf('preflightSyntheticExecutorInputs({ protocol, protocolDigest: protocol_digest, repository, adapter, now });');
          const consume = base.indexOf('enablement_registry.consume({');
          if (!(authority >= 0 && preflight > authority && consume > preflight)) {
            throw new Error('Base authority and executor preflight must complete before one-shot enablement consumption.');
          }
          const wrapper = fs.readFileSync('http-generic-api/hostingerStorageTenantCanary.js', 'utf8');
          const repository = wrapper.indexOf('requireCompleteRepository(options.repository);');
          const adapter = wrapper.indexOf('requireCanonicalAdapter(options.adapter);');
          const planAuthority = wrapper.indexOf('revalidatePlanAuthority({ repository: options.repository, protocol: options.protocol });');
          const delegate = wrapper.indexOf('return executeBaseTenantCanary(options);');
          if (!(repository >= 0 && adapter > repository && planAuthority > adapter && delegate > planAuthority)) {
            throw new Error('Repository, Tenant-owned adapter brand, and plan authority preflight must complete before delegated execution.');
          }
          NODE
      - name: Validate Tenant canary
        working-directory: http-generic-api
        run: |
          node test-hostinger-storage-tenant-canary.mjs
          node test-hostinger-storage-tenant-canary-authority-cas.mjs
          node test-hostinger-storage-tenant-canary-postmerge-hardening.mjs
          node test-hostinger-storage-tenant-canary-token-normalization.mjs
          node test-hostinger-storage-tenant-canary-token-delegation.mjs
