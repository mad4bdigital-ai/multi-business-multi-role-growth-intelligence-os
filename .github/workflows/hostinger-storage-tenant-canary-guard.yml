name: Hostinger Storage Tenant Canary Guard

on:
  pull_request:
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.mts'
      - '**/*.cts'
      - '.github/workflows/hostinger-storage-tenant-canary-guard.yml'
      - 'specs/014-governed-hostinger-storage-orchestration/**'

permissions:
  contents: read

jobs:
  tenant-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install deterministic import parser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check syntax
        run: |
          node --check http-generic-api/hostingerStorageTenantCanaryPolicyBase.js
          node --check http-generic-api/hostingerStorageTenantCanaryPolicy.js
          node --check http-generic-api/hostingerStorageTenantCanaryBase.js
          node --check http-generic-api/hostingerStorageTenantCanary.js
          node --check http-generic-api/test-hostinger-storage-tenant-canary.mjs
          node --check http-generic-api/test-hostinger-storage-tenant-canary-authority-cas.mjs
          node --check http-generic-api/test-hostinger-storage-tenant-canary-postmerge-hardening.mjs
          node --check http-generic-api/test-hostinger-storage-tenant-canary-token-normalization.mjs
          node --check http-generic-api/test-hostinger-storage-tenant-canary-token-delegation.mjs
          node --check http-generic-api/test-hostinger-storage-tenant-canary-store-provenance.mjs
          node --check .github/tests/spec014/tenant-canary-repository-provenance.mjs
          node --check http-generic-api/test-hostinger-storage-tenant-canary-base-import-boundary.mjs
      - name: Enforce synthetic Tenant boundary
        run: |
          ! grep -R -E "from ['\"]node:(child_process|fs|fs/promises|net|tls)['\"]|require\(['\"](child_process|fs|net|tls)['\"]\)|\b(exec|execFile|spawn|fork)\s*\(|shell\s*:\s*true|StrictHostKeyChecking=no|rm\s+-rf" \
            http-generic-api/hostingerStorageTenantCanaryPolicyBase.js \
            http-generic-api/hostingerStorageTenantCanaryPolicy.js \
            http-generic-api/hostingerStorageTenantCanaryBase.js \
            http-generic-api/hostingerStorageTenantCanary.js
          grep -q "synthetic_only: true" http-generic-api/hostingerStorageTenantCanaryBase.js
          grep -q "dispatch_allowed: false" http-generic-api/hostingerStorageTenantCanaryPolicyBase.js
          grep -q "production_ready: false" http-generic-api/hostingerStorageTenantCanaryBase.js
          grep -q "manual_one_shot" http-generic-api/hostingerStorageTenantCanaryPolicyBase.js
          grep -q "tenant_exclusive" http-generic-api/hostingerStorageTenantCanaryPolicyBase.js
          grep -q "immutable_plan" http-generic-api/hostingerStorageTenantCanaryPolicyBase.js
          grep -q "STORAGE_TENANT_CANARY_CANDIDATE_ITEMS_MISMATCH" http-generic-api/hostingerStorageTenantCanaryPolicyBase.js
          grep -q "STORAGE_TENANT_CANARY_PATH_PREFIX_BOUNDARY_REQUIRED" http-generic-api/hostingerStorageTenantCanaryPolicyBase.js
          grep -q "STORAGE_TENANT_CANARY_PROTOCOL_VERSION_INVALID" http-generic-api/hostingerStorageTenantCanaryPolicyBase.js
      - name: Parse static and dynamic Base imports
        run: node http-generic-api/test-hostinger-storage-tenant-canary-base-import-boundary.mjs
      - name: Enforce Base runtime provenance
        run: |
          grep -q "const tenantCanaryAdapters = new WeakSet()" http-generic-api/hostingerStorageTenantCanaryBase.js
          grep -q "const tenantCanaryRepositories = new WeakSet()" http-generic-api/hostingerStorageTenantCanaryBase.js
          grep -q "const tenantCanaryAuthorityStores = new WeakSet()" http-generic-api/hostingerStorageTenantCanaryBase.js
          grep -q "const tenantCanaryEnablementRegistries = new WeakSet()" http-generic-api/hostingerStorageTenantCanaryBase.js
          grep -q "tenantCanaryAdapters.add(adapter)" http-generic-api/hostingerStorageTenantCanaryBase.js
          grep -q "tenantCanaryAdapters.has(adapter)" http-generic-api/hostingerStorageTenantCanaryBase.js
          grep -q "tenantCanaryRepositories.add(repository)" http-generic-api/hostingerStorageTenantCanaryBase.js
          grep -q "tenantCanaryRepositories.has(repository)" http-generic-api/hostingerStorageTenantCanaryBase.js
          grep -q "tenantCanaryAuthorityStores.add(store)" http-generic-api/hostingerStorageTenantCanaryBase.js
          grep -q "tenantCanaryAuthorityStores.has(store)" http-generic-api/hostingerStorageTenantCanaryBase.js
          grep -q "tenantCanaryEnablementRegistries.add(registry)" http-generic-api/hostingerStorageTenantCanaryBase.js
          grep -q "tenantCanaryEnablementRegistries.has(registry)" http-generic-api/hostingerStorageTenantCanaryBase.js
          grep -q "isCanonicalHostingerStorageSyntheticAdapter(adapter)" http-generic-api/hostingerStorageTenantCanaryBase.js
          grep -q "isCanonicalHostingerStorageControlPlaneRepository(repository)" http-generic-api/hostingerStorageTenantCanaryBase.js
          grep -q "tenant_and_synthetic_factory_owned_required" http-generic-api/hostingerStorageTenantCanaryBase.js
          grep -q "tenant_and_control_plane_factory_owned_required" http-generic-api/hostingerStorageTenantCanaryBase.js
          grep -q "authority_store_provenance" http-generic-api/hostingerStorageTenantCanaryBase.js
          grep -q "enablement_registry_provenance" http-generic-api/hostingerStorageTenantCanaryBase.js
          grep -q "Object.getOwnPropertyDescriptors" http-generic-api/hostingerStorageTenantCanaryBase.js
          grep -q "STORAGE_TENANT_CANARY_AUTHORITY_TOKEN_INPUT_INVALID" http-generic-api/hostingerStorageTenantCanaryBase.js
          grep -q "STORAGE_TENANT_CANARY_ALLOWLIST_TOKEN_REUSED" http-generic-api/hostingerStorageTenantCanaryBase.js
          grep -q "STORAGE_TENANT_CANARY_APPROVAL_TOKEN_REUSED" http-generic-api/hostingerStorageTenantCanaryBase.js
          grep -q "authority_context_hash" http-generic-api/hostingerStorageTenantCanaryBase.js
          grep -q "ownership_revision" http-generic-api/hostingerStorageTenantCanaryBase.js
          grep -q "policy_revision" http-generic-api/hostingerStorageTenantCanaryBase.js
          grep -q "from './hostingerStorageTenantCanaryBase.js';" http-generic-api/hostingerStorageTenantCanary.js
          ! grep -q "executeBaseTenantCanary" http-generic-api/hostingerStorageTenantCanary.js
          grep -q "authority_store_factory_brand_required: true" http-generic-api/test-hostinger-storage-tenant-canary-store-provenance.mjs
          grep -q "enablement_registry_factory_brand_required: true" http-generic-api/test-hostinger-storage-tenant-canary-store-provenance.mjs
          grep -q "direct_control_plane_repository_rejected: true" .github/tests/spec014/tenant-canary-repository-provenance.mjs
          grep -q "missing_adapter_is_explicit_null: true" .github/tests/spec014/tenant-canary-repository-provenance.mjs
          grep -q "existing_ast_and_store_provenance_tests_preserved: true" .github/tests/spec014/tenant-canary-repository-provenance.mjs
          grep -q "typescript_ast" http-generic-api/test-hostinger-storage-tenant-canary-base-import-boundary.mjs
      - name: Enforce policy not-before contracts
        run: |
          grep -q "STORAGE_TENANT_CANARY_EVALUATION_NOT_STARTED" http-generic-api/hostingerStorageTenantCanaryPolicy.js
          grep -q "STORAGE_TENANT_CANARY_ALLOWLIST_NOT_STARTED" http-generic-api/hostingerStorageTenantCanaryPolicy.js
          grep -q "STORAGE_TENANT_CANARY_APPROVAL_NOT_STARTED" http-generic-api/hostingerStorageTenantCanaryPolicy.js
          grep -q "STORAGE_TENANT_CANARY_ENABLEMENT_NOT_STARTED" http-generic-api/hostingerStorageTenantCanaryPolicy.js
          grep -q "Object.isFrozen(verified.blockers)" http-generic-api/test-hostinger-storage-tenant-canary.mjs
      - name: Enforce validation before one-shot consumption
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('http-generic-api/hostingerStorageTenantCanaryBase.js', 'utf8');
          const executeStart = source.indexOf('export function executeHostingerStorageTenantCanary({');
          const body = source.slice(executeStart);
          const authorityStore = body.indexOf('requireAuthorityStore(authority_store);');
          const registry = body.indexOf('requireRegistry(enablement_registry);');
          const repository = body.indexOf('requireControlPlaneRepository(repository);');
          const currentAuthority = body.indexOf('revalidateCurrentAuthority({ authorization, authorityStore: authority_store, now });');
          const preflight = body.indexOf('preflightSyntheticExecutorInputs({ protocol, protocolDigest: protocol_digest, repository, adapter, now });');
          const consume = body.indexOf('enablement_registry.consume({');
          if (!(authorityStore >= 0
            && registry > authorityStore
            && repository > registry
            && currentAuthority > repository
            && preflight > currentAuthority
            && consume > preflight)) {
            throw new Error('All Tenant provenance and authority checks must complete before one-shot consumption.');
          }
          const preflightStart = source.indexOf('function preflightSyntheticExecutorInputs({');
          const preflightBody = source.slice(preflightStart, executeStart);
          const adapterBrand = preflightBody.indexOf('tenantCanaryAdapters.has(adapter)');
          const adapterCanonical = preflightBody.indexOf('isCanonicalHostingerStorageSyntheticAdapter(adapter)');
          const aggregateRead = preflightBody.indexOf('repository.readAggregate(protocol.operation_id)');
          const authorityContext = preflightBody.indexOf("plan.authority_context_hash !== aggregate.operation.authority_context_hash");
          const ownershipRevision = preflightBody.indexOf("plan.ownership_revision !== aggregate.operation.ownership_revision");
          const policyRevision = preflightBody.indexOf("plan.policy_revision !== aggregate.operation.policy_revision");
          if (!(adapterBrand >= 0
            && adapterCanonical > adapterBrand
            && aggregateRead > adapterCanonical
            && authorityContext > aggregateRead
            && ownershipRevision > authorityContext
            && policyRevision > ownershipRevision)) {
            throw new Error('Adapter provenance and plan authority parity must be enforced before execution dispatch.');
          }
          NODE
      - name: Validate Tenant canary
        working-directory: http-generic-api
        run: |
          node test-hostinger-storage-tenant-canary.mjs
          node test-hostinger-storage-tenant-canary-authority-cas.mjs
          node test-hostinger-storage-tenant-canary-postmerge-hardening.mjs
          node test-hostinger-storage-tenant-canary-token-normalization.mjs
          node test-hostinger-storage-tenant-canary-token-delegation.mjs
          node test-hostinger-storage-tenant-canary-store-provenance.mjs
          node ../.github/tests/spec014/tenant-canary-repository-provenance.mjs
