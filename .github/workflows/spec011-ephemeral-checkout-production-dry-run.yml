name: Spec 011 Ephemeral Checkout Production Apply

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: spec011-ephemeral-checkout-production-apply
  cancel-in-progress: false

jobs:
  governed-production-apply:
    if: github.event.pull_request.head.ref == 'ops/spec011-ephemeral-checkout-production-dry-run-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out deployed Production source
        uses: actions/checkout@v5
        with:
          ref: Production
          fetch-depth: 0

      - name: Verify source ancestry and migration contract
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ae93d1557bf259a1272333951f27852c271aa4ab HEAD || {
            echo '::error::Production does not contain the reviewed Spec 011 preflight fix merge'
            exit 1
          }
          ACTUAL="$(sha256sum migrations/20260728_operation_managed_git_ephemeral_checkout.sql | awk '{print $1}')"
          EXPECTED='8fa1da6161e914b73eb3fba7ce60a0245cee8cf0b5c953bd7ee596b3183cad9c'
          [[ "$ACTUAL" == "$EXPECTED" ]] || {
            echo "::error::migration checksum mismatch: $ACTUAL"
            exit 1
          }
          STATEMENTS="$(node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { splitMigrationSqlStatements } from './migrationSqlStatements.js';
          const sql = fs.readFileSync('./migrations/20260728_operation_managed_git_ephemeral_checkout.sql', 'utf8');
          process.stdout.write(String(splitMigrationSqlStatements(sql).length));
          NODE
          )"
          [[ "$STATEMENTS" == '1' ]] || {
            echo "::error::migration statement count mismatch: $STATEMENTS"
            exit 1
          }

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Verify deployed runtime parity
        working-directory: http-generic-api
        env:
          RUNTIME_BASE_URL: https://auth.mad4b.com
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
          RUNTIME_PROFILE: queue_worker
          VERIFY_EXECUTION_LOG_ROW: 'false'
          ALLOW_ENVIRONMENT_ACCESS_BLOCKED: 'false'
        run: node verify-runtime.mjs

      - name: Apply and verify Spec 011 migration
        env:
          RUNTIME_BASE_URL: https://auth.mad4b.com
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';

          const BASE = String(process.env.RUNTIME_BASE_URL || '').replace(/\/+$/, '');
          const KEY = String(process.env.BACKEND_API_KEY || '');
          const MIGRATION = '20260728_operation_managed_git_ephemeral_checkout.sql';
          const CHECKSUM = '8fa1da6161e914b73eb3fba7ce60a0245cee8cf0b5c953bd7ee596b3183cad9c';
          const STATEMENT_COUNT = 1;
          const APPLY_CONFIRMATION = 'APPLY_20260728_OPERATION_MANAGED_GIT_EPHEMERAL_CHECKOUT';
          const PLATFORM_TENANT_ID = '00000000-0000-0000-0000-000000000000';
          const PLATFORM_ADMIN_USER_ID = '00000000-0000-4000-a000-000000000002';
          const PRODUCTION_SHA = 'fae54a372350d23d915bbe564e972b714ca363f4';
          const RESOURCE_URI = `db-migration://growth_intelligence_platform/${MIGRATION}`;
          const BINDING_SHA = '7638ce17157125c10f2074314ffb9cae11c1d49c22f1d638d9ef8640264ff14c';
          const TRANSIENT_STATUS = new Set([429, 502, 503, 504, 520]);

          assert.equal(BASE, 'https://auth.mad4b.com');
          assert.ok(KEY, 'BACKEND_API_KEY is required');

          const sensitiveKey = /(password|secret|token|authorization|cookie|api[_-]?key|credential|private[_-]?key|refresh[_-]?token|access[_-]?token)/i;
          function sanitize(value) {
            if (Array.isArray(value)) return value.map(sanitize);
            if (!value || typeof value !== 'object') return value;
            return Object.fromEntries(Object.entries(value).map(([key, child]) => [
              key,
              sensitiveKey.test(key) ? '[redacted]' : sanitize(child),
            ]));
          }

          function parsedValue(value) {
            if (typeof value !== 'string') return value;
            const text = value.trim();
            if (!text || (!text.startsWith('{') && !text.startsWith('['))) return value;
            try { return JSON.parse(text); } catch { return value; }
          }

          function findObjectWithKey(value, key, seen = new Set()) {
            value = parsedValue(value);
            if (!value || typeof value !== 'object' || seen.has(value)) return null;
            seen.add(value);
            if (Object.prototype.hasOwnProperty.call(value, key)) return value;
            for (const child of Object.values(value)) {
              const found = findObjectWithKey(child, key, seen);
              if (found) return found;
            }
            return null;
          }

          async function httpCall(pathname, body) {
            try {
              const response = await fetch(`${BASE}${pathname}`, {
                method: 'POST',
                redirect: 'error',
                headers: {
                  Authorization: `Bearer ${KEY}`,
                  Accept: 'application/json',
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify(body),
                signal: AbortSignal.timeout(180000),
              });
              const text = await response.text();
              let payload;
              try { payload = text ? JSON.parse(text) : null; }
              catch { payload = { raw_preview: text.slice(0, 500) }; }
              const result = { status: response.status, http_ok: response.ok, payload, transport_error: null };
              console.log(JSON.stringify(sanitize(result), null, 2));
              return result;
            } catch (error) {
              const result = {
                status: 0,
                http_ok: false,
                payload: null,
                transport_error: String(error?.cause?.code || error?.code || error?.message || 'transport_error'),
              };
              console.log(JSON.stringify(sanitize(result), null, 2));
              return result;
            }
          }

          function requireSuccess(result, label) {
            if (!result.http_ok || result.payload?.ok === false) {
              const error = new Error(`${label} failed with HTTP ${result.status}`);
              error.code = result.payload?.error?.code || result.payload?.error_code || result.transport_error || `${label}_failed`;
              throw error;
            }
            return result.payload;
          }

          async function safeRead(pathname, body, { attempts = 4, retry409 = false } = {}) {
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              const result = await httpCall(pathname, body);
              if (result.http_ok && result.payload?.ok !== false) return result.payload;
              const retryable = result.status === 0
                || TRANSIENT_STATUS.has(result.status)
                || result.payload?.retryable === true
                || (retry409 && result.status === 409);
              if (!retryable || attempt === attempts) return requireSuccess(result, 'safe_read');
              const delaySeconds = Math.max(5, Math.min(Number(result.payload?.retry_after || 10), 60));
              console.log(JSON.stringify({
                retrying_read_only_call: true,
                pathname,
                attempt,
                delay_seconds: delaySeconds,
                apply_retried: false,
                secrets_included: false,
              }));
              await new Promise((resolve) => setTimeout(resolve, delaySeconds * 1000));
            }
            throw new Error('safe_read_retry_exhausted');
          }

          function shellInvocation(alias, extraArgs) {
            return {
              tool: 'shell',
              action: 'run',
              alias,
              authority_context: {
                resource_type: 'shell_alias',
                resource_uri: `shell://${alias}`,
                operation_mode: alias,
                required: true,
              },
              extra_args: extraArgs,
            };
          }

          const dryRun = await safeRead('/gpt/tools/call', {
            name: 'governed_migration_execute',
            tool_args: {
              migration: MIGRATION,
              mode: 'dry_run',
              expected_checksum_sha256: CHECKSUM,
              expected_statement_count: STATEMENT_COUNT,
            },
          });
          const dryRunEvidence = findObjectWithKey(dryRun, 'applies_sql');
          assert.equal(dryRunEvidence?.applies_sql, false, 'Same-cycle dry-run must report applies_sql=false');
          assert.equal(dryRunEvidence?.mode, 'dry_run', 'Same-cycle dry-run mode mismatch');
          assert.equal(dryRunEvidence?.migration_checksum_sha256, CHECKSUM, 'Same-cycle dry-run checksum mismatch');
          assert.equal(Number(dryRunEvidence?.statement_count), STATEMENT_COUNT, 'Same-cycle dry-run statement count mismatch');
          assert.equal(dryRunEvidence?.preflight?.status, 'pass', 'Same-cycle preflight must pass');
          assert.equal(Number(dryRunEvidence?.preflight?.risk_count || 0), 0, 'Same-cycle preflight must have zero risks');
          assert.equal(dryRunEvidence?.same_cycle_readback_verified, true, 'Same-cycle dry-run readback missing');

          const envelopeCreate = requireSuccess(await httpCall('/admin/control', shellInvocation(
            'capability_resolution_envelope_create',
            [
              `--tenant-id=${PLATFORM_TENANT_ID}`,
              `--user-id=${PLATFORM_ADMIN_USER_ID}`,
              '--user-role=Admin',
              '--app-key=platform_orchestration',
              '--capability-key=governed_migration_execute',
              '--operation-intent=governed_migration_execute',
              '--runtime-surface=auth_host',
              '--requested-source-tier=platform_managed_fallback',
              `--resource-uri=${RESOURCE_URI}`,
              `--binding-sha256=${BINDING_SHA}`,
              `--expected-commit-sha=${PRODUCTION_SHA}`,
              '--requested-by=github_actions_spec011_production_apply',
              '--ttl-minutes=30',
              '--explain',
            ],
          )), 'envelope_create');
          let envelope = findObjectWithKey(envelopeCreate, 'envelope_id');
          assert.ok(envelope?.envelope_id, 'Apply envelope creation returned no envelope_id');
          assert.notEqual(envelope.envelope_status, 'blocked', `Apply envelope blocked: ${envelope.decision || 'unknown'}`);
          assert.equal(Number(envelope.blocking_gap_count || 0), 0, 'Apply envelope has blocking gaps');
          assert.equal(envelope.dispatch_allowed, true, 'Apply envelope is not dispatchable');

          if (envelope.approval_required === true || envelope.envelope_status === 'ready_requires_approval') {
            const approval = requireSuccess(await httpCall('/admin/control', shellInvocation(
              'capability_resolution_envelope_approve',
              [
                `--envelope-id=${envelope.envelope_id}`,
                '--approved-by=github_actions',
                '--decision-note=Approve one checksum-bound Spec 011 enum migration after successful same-cycle dry-run.',
                '--ttl-minutes=30',
              ],
            )), 'lifecycle_approval');
            envelope = findObjectWithKey(approval, 'envelope_id') || envelope;
          }
          assert.equal(envelope.envelope_status, 'ready_for_dispatch', 'Apply envelope is not ready_for_dispatch');

          const applyAuthorization = requireSuccess(await httpCall('/gpt/tools/call', {
            name: 'capability_resolution_envelope_apply_authorize',
            tool_args: {
              envelope_id: envelope.envelope_id,
              authorized_by: 'github_actions',
              decision_note: 'Apply-authorize one governed Spec 011 enum widening after Production parity and same-cycle dry-run.',
              ttl_minutes: 30,
            },
          }), 'apply_authorization');
          const applyAuthorizationEvidence = findObjectWithKey(applyAuthorization, 'apply_allowed');
          assert.equal(applyAuthorizationEvidence?.apply_allowed, true, 'Envelope was not apply-authorized');
          assert.equal(applyAuthorizationEvidence?.external_write_allowed, false, 'Apply policy unexpectedly permits external write');
          assert.equal(applyAuthorizationEvidence?.no_provider_call, true, 'Apply authorization must preserve no-provider boundary');
          assert.equal(applyAuthorizationEvidence?.no_credential_payload_read, true, 'Apply authorization must preserve credential boundary');

          const applyRequest = {
            name: 'governed_migration_execute',
            tool_args: {
              migration: MIGRATION,
              mode: 'apply',
              expected_checksum_sha256: CHECKSUM,
              expected_statement_count: STATEMENT_COUNT,
              confirm: APPLY_CONFIRMATION,
              capability_envelope_id: envelope.envelope_id,
            },
          };

          const applyResult = await httpCall('/gpt/tools/call', applyRequest);
          let applyEvidence = null;
          let recoveredFromAmbiguousResponse = false;
          if (applyResult.http_ok && applyResult.payload?.ok !== false) {
            applyEvidence = findObjectWithKey(applyResult.payload, 'applies_sql');
          } else if (applyResult.status === 0 || TRANSIENT_STATUS.has(applyResult.status) || applyResult.payload?.retryable === true) {
            console.log(JSON.stringify({
              apply_response_ambiguous: true,
              apply_retried: false,
              proceeding_to_readback: true,
              secrets_included: false,
            }));
            recoveredFromAmbiguousResponse = true;
          } else {
            requireSuccess(applyResult, 'migration_apply');
          }

          const readback = await safeRead('/gpt/tools/call', {
            name: 'governed_migration_schema_readback',
            tool_args: {
              migration: MIGRATION,
              expected_checksum_sha256: CHECKSUM,
              expected_statement_count: STATEMENT_COUNT,
            },
          }, { attempts: 6, retry409: true });
          assert.equal(readback?.ok, true, 'Final migration readback is not successful');
          assert.equal(readback?.readback_status, 'pass', 'Final migration readback did not pass');
          assert.equal(readback?.migration_checksum_sha256, CHECKSUM, 'Final readback checksum mismatch');
          assert.equal(Number(readback?.statement_count), STATEMENT_COUNT, 'Final readback statement count mismatch');
          assert.equal(readback?.ledger?.found, true, 'Governed migration ledger row not found');
          assert.ok(String(readback?.ledger?.run_id || ''), 'Governed migration ledger run_id is missing');
          assert.equal(readback?.ledger?.mode, 'apply', 'Governed migration ledger mode mismatch');
          assert.equal(readback?.ledger?.preflight_status, 'pass', 'Governed migration ledger preflight status mismatch');
          assert.equal(Number(readback?.ledger?.preflight_risk_count || 0), 0, 'Governed migration ledger risk count mismatch');
          assert.equal(readback?.ledger?.capability_envelope_id, envelope.envelope_id, 'Ledger capability envelope mismatch');
          for (const key of ['tables', 'columns', 'indexes', 'rule_conditions']) {
            assert.deepEqual(readback?.expectations?.missing?.[key] || [], [], `Final readback has missing ${key}`);
          }

          if (applyEvidence) {
            assert.equal(applyEvidence.applies_sql, true, 'Apply response did not confirm applies_sql=true');
            assert.equal(applyEvidence.mode, 'apply', 'Apply response mode mismatch');
            assert.equal(Number(applyEvidence.statements_executed), STATEMENT_COUNT, 'Apply response statement count mismatch');
            assert.equal(applyEvidence?.ledger?.recorded, true, 'Apply response did not confirm ledger recording');
            assert.equal(applyEvidence?.same_cycle_readback_verified, true, 'Apply response did not confirm same-cycle readback');
          } else {
            assert.equal(recoveredFromAmbiguousResponse, true, 'Missing apply evidence without an ambiguous response');
          }

          const summary = {
            schema_version: 'spec011.ephemeral_checkout_production_apply.v1',
            ok: true,
            stage: 'production_migration_apply_and_readback_complete',
            migration: MIGRATION,
            migration_checksum_sha256: CHECKSUM,
            statement_count: STATEMENT_COUNT,
            confirmation: APPLY_CONFIRMATION,
            capability_envelope_id: envelope.envelope_id,
            envelope_binding_sha256: BINDING_SHA,
            ledger_run_id: readback.ledger.run_id,
            ledger_mode: readback.ledger.mode,
            preflight_status: readback.ledger.preflight_status,
            preflight_risk_count: Number(readback.ledger.preflight_risk_count),
            schema_expectation_gaps: 0,
            migration_sql_applied: true,
            exact_enum_statement_executed: true,
            enum_values_expected: ['virtual_git_tree', 'ephemeral_checkout'],
            apply_retried: false,
            recovered_from_ambiguous_response: recoveredFromAmbiguousResponse,
            provider_call_executed: false,
            external_write_executed: false,
            secrets_included: false,
          };
          const output = path.join(process.env.RUNNER_TEMP, 'spec011-ephemeral-checkout-production-apply.json');
          fs.writeFileSync(output, JSON.stringify(summary, null, 2));
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Upload non-secret apply evidence
        uses: actions/upload-artifact@v4
        with:
          name: spec011-ephemeral-checkout-production-apply
          path: ${{ runner.temp }}/spec011-ephemeral-checkout-production-apply.json
          if-no-files-found: error
          retention-days: 30
