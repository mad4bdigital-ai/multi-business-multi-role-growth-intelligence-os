name: PR 5292 Bounded Generated Artifact Finalizer

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/pr5292-final-source-certification.yml

permissions:
  contents: write

concurrency:
  group: pr5292-bounded-generated-artifact-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    if: >-
      github.repository == 'mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os' &&
      github.event.pull_request.number == 5292 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/pr5210-surface-source-clean-20260803' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      EXPECTED_MAIN: edfc85f07a0fcac03b7258bb3c36e320b8fd1d3d
      HEAD_BRANCH: gpt/pr5210-surface-source-clean-20260803
      WORKFLOW_PATH: .github/workflows/pr5292-final-source-certification.yml
      GOVERNANCE_ARTIFACT: http-generic-api/frontend-operation-governance.generated.json
      DISPATCH_ARTIFACT: http-generic-api/frontend-surface-dispatch.generated.json

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact bounded trigger and baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          trigger_files="$(git diff --name-only HEAD^ HEAD)"
          test "$(printf '%s\n' "$trigger_files" | sed '/^$/d' | wc -l | tr -d ' ')" -eq 1
          test "$trigger_files" = "${WORKFLOW_PATH}"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${EXPECTED_MAIN}"
          git merge-base --is-ancestor "${EXPECTED_MAIN}" HEAD
          git branch -f main origin/main

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install HTTP API dependencies
        working-directory: http-generic-api
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate canonical frontend artifacts
        working-directory: http-generic-api
        env:
          CANONICAL_BASELINE_REF: main
          TARGET_REF: main
        run: npm run frontend:dispatch:generate -- --baseline-ref=main

      - name: Verify generated artifacts
        working-directory: http-generic-api
        env:
          CANONICAL_BASELINE_REF: main
          TARGET_REF: main
        run: npm run frontend:dispatch:check

      - name: Enforce exact generated write set
        shell: bash
        run: |
          set -Eeuo pipefail
          raw_status="${RUNNER_TEMP}/pr5292-finalizer-status.txt"
          actual_paths="${RUNNER_TEMP}/pr5292-finalizer-paths.txt"
          expected_paths="${RUNNER_TEMP}/pr5292-finalizer-expected.txt"

          git status --porcelain=v1 --untracked-files=all > "$raw_status"
          sed -E 's/^...//' "$raw_status" | sed -E 's/.* -> //' | sed '/^$/d' | sort -u > "$actual_paths"
          printf '%s\n' "${GOVERNANCE_ARTIFACT}" "${DISPATCH_ARTIFACT}" | sort -u > "$expected_paths"

          if ! cmp -s "$expected_paths" "$actual_paths"; then
            echo '::error::Official generator write set differs from the certified two-file set.'
            echo 'Expected:'
            cat "$expected_paths"
            echo 'Actual:'
            cat "$actual_paths"
            exit 1
          fi

      - name: Stage bounded product result and remove finalizer
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -- "${WORKFLOW_PATH}"
          git add -- "${GOVERNANCE_ARTIFACT}" "${DISPATCH_ARTIFACT}" "${WORKFLOW_PATH}"

          staged_paths="${RUNNER_TEMP}/pr5292-finalizer-staged.txt"
          expected_staged="${RUNNER_TEMP}/pr5292-finalizer-expected-staged.txt"
          git diff --cached --name-only | sort -u > "$staged_paths"
          printf '%s\n' "${WORKFLOW_PATH}" "${GOVERNANCE_ARTIFACT}" "${DISPATCH_ARTIFACT}" | sort -u > "$expected_staged"

          if ! cmp -s "$expected_staged" "$staged_paths"; then
            echo '::error::Staged paths escaped the bounded product result.'
            echo 'Expected:'
            cat "$expected_staged"
            echo 'Actual:'
            cat "$staged_paths"
            exit 1
          fi

          git diff --quiet
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Commit and push exact product result
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${HEAD_BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "${EXPECTED_HEAD}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(surface): refresh bounded frontend artifacts'
          git push origin "HEAD:refs/heads/${HEAD_BRANCH}"
