name: PR 5292 Generator Write-Set Capture

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/pr5292-final-source-certification.yml

permissions:
  contents: read

concurrency:
  group: pr5292-generator-write-set-capture
  cancel-in-progress: true

jobs:
  capture:
    if: >-
      github.repository == 'mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os' &&
      github.event.pull_request.number == 5292 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/pr5210-surface-source-clean-20260803' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      EXPECTED_MAIN: edfc85f07a0fcac03b7258bb3c36e320b8fd1d3d
      WORKFLOW_PATH: .github/workflows/pr5292-final-source-certification.yml
      DIAGNOSTIC_PATH: .github/pr5292-generator-write-set.txt

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact bounded trigger and baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          trigger_files="$(git diff --name-only HEAD^ HEAD)"
          test "$(printf '%s\n' "$trigger_files" | sed '/^$/d' | wc -l | tr -d ' ')" -eq 1
          test "$trigger_files" = "${WORKFLOW_PATH}"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${EXPECTED_MAIN}"
          git merge-base --is-ancestor "${EXPECTED_MAIN}" HEAD
          git branch -f main origin/main

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install HTTP API dependencies
        working-directory: http-generic-api
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate canonical frontend artifacts
        working-directory: http-generic-api
        env:
          CANONICAL_BASELINE_REF: main
          TARGET_REF: main
        run: npm run frontend:dispatch:generate -- --baseline-ref=main

      - name: Verify generated artifacts
        working-directory: http-generic-api
        env:
          CANONICAL_BASELINE_REF: main
          TARGET_REF: main
        run: npm run frontend:dispatch:check

      - name: Capture and validate exact generated write set
        shell: bash
        run: |
          set -Eeuo pipefail
          raw_status="${RUNNER_TEMP}/pr5292-generator-status.txt"
          normalized_paths="${RUNNER_TEMP}/pr5292-generator-paths.txt"
          unexpected_paths="${RUNNER_TEMP}/pr5292-generator-unexpected-paths.txt"

          git status --porcelain=v1 --untracked-files=all > "$raw_status"
          sed -E 's/^...//' "$raw_status" | sed -E 's/.* -> /' | sed '/^$/d' > "$normalized_paths"

          while IFS= read -r path; do
            case "$path" in
              http-generic-api/frontend-surface-dispatch.generated.json|http-generic-api/frontend-operation-governance.generated.json|openapi/frontend-runtime-routes.generated.yaml)
                ;;
              *)
                printf '%s\n' "$path" >> "$unexpected_paths"
                ;;
            esac
          done < "$normalized_paths"

          if [ -s "$unexpected_paths" ]; then
            echo '::error::Generator changed paths outside the bounded generated-artifact set.'
            cat "$unexpected_paths"
            exit 1
          fi

          if [ -s "$raw_status" ]; then
            write_set_state=nonempty
          else
            write_set_state=empty
          fi

          {
            printf 'exact_head=%s\n' "${EXPECTED_HEAD}"
            printf 'pinned_main=%s\n' "${EXPECTED_MAIN}"
            printf 'write_set_state=%s\n' "$write_set_state"
            printf '%s\n' 'raw_porcelain_begin'
            cat "$raw_status"
            printf '%s\n' 'raw_porcelain_end'
            printf '%s\n' 'normalized_paths_begin'
            cat "$normalized_paths"
            printf '%s\n' 'normalized_paths_end'
          } > "${DIAGNOSTIC_PATH}"

          test -s "${DIAGNOSTIC_PATH}"
          test -z "$(git diff --cached --name-only)"

      - name: Upload write-set diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: pr5292-generator-write-set
          path: .github/pr5292-generator-write-set.txt
          if-no-files-found: error
          retention-days: 1
