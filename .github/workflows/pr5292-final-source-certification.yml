name: PR 5292 Generator Write-Set Diagnostic

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/pr5292-final-source-certification.yml

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr5292-final-source-certification
  cancel-in-progress: true

jobs:
  diagnose:
    if: >-
      github.repository == 'mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os' &&
      github.event.pull_request.number == 5292 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/pr5210-surface-source-clean-20260803' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      TARGET_BRANCH: gpt/pr5210-surface-source-clean-20260803
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      EXPECTED_MAIN: 97e4ee7ec790844ad20ee2349125579353c693d5
      WORKFLOW_PATH: .github/workflows/pr5292-final-source-certification.yml
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact bounded trigger and current main
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "${TARGET_BRANCH}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          trigger_files="$(git diff --name-only HEAD^ HEAD)"
          test "$(printf '%s\n' "$trigger_files" | sed '/^$/d' | wc -l | tr -d ' ')" -eq 1
          test "$trigger_files" = "${WORKFLOW_PATH}"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${EXPECTED_MAIN}"
          git merge-base --is-ancestor "${EXPECTED_MAIN}" HEAD
          git branch -f main origin/main

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install HTTP API dependencies
        working-directory: http-generic-api
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate canonical frontend artifacts
        working-directory: http-generic-api
        env:
          CANONICAL_BASELINE_REF: main
          TARGET_REF: main
        run: npm run frontend:dispatch:generate -- --baseline-ref=main

      - name: Publish exact generated write set
        shell: bash
        run: |
          set -Eeuo pipefail
          status_file="${RUNNER_TEMP}/pr5292-generator-status.txt"
          git status --porcelain=v1 --untracked-files=all > "$status_file"
          changed="$(sed -E 's/^...//' "$status_file" | sed -E 's/.* -> /')"
          test -n "$changed"
          body_file="${RUNNER_TEMP}/pr5292-generator-diagnostic.md"
          {
            echo '<!-- pr5292-generator-write-set-diagnostic -->'
            echo '### PR #5292 generator write-set diagnostic'
            echo
            echo "Exact head: \`${EXPECTED_HEAD}\`"
            echo "Pinned main: \`${EXPECTED_MAIN}\`"
            echo
            echo 'Raw porcelain status after the official `frontend:dispatch:generate` command:'
            echo '```text'
            cat "$status_file"
            echo '```'
            echo
            echo 'Normalized changed paths:'
            while IFS= read -r path; do
              test -z "$path" && continue
              printf -- '- `%s`\n' "$path"
            done <<EOF
          $changed
          EOF
          } > "$body_file"
          gh pr comment 5292 --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
          cat "$body_file" >> "$GITHUB_STEP_SUMMARY"
          echo 'Diagnostic intentionally stops before any artifact commit.' >&2
          exit 1
