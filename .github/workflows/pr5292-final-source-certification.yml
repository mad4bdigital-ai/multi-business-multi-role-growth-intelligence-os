name: PR 5292 Generator Write-Set Capture

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/pr5292-final-source-certification.yml

permissions:
  contents: write

concurrency:
  group: pr5292-generator-write-set-capture
  cancel-in-progress: true

jobs:
  capture:
    if: >-
      github.repository == 'mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os' &&
      github.event.pull_request.number == 5292 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/pr5210-surface-source-clean-20260803' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      TARGET_BRANCH: gpt/pr5210-surface-source-clean-20260803
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      EXPECTED_MAIN: a61cd9e83070618001676bbc679bc937f0551875
      WORKFLOW_PATH: .github/workflows/pr5292-final-source-certification.yml
      DIAGNOSTIC_PATH: .github/pr5292-generator-write-set.txt

    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact bounded trigger and baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          trigger_files="$(git diff --name-only HEAD^ HEAD)"
          test "$(printf '%s\n' "$trigger_files" | sed '/^$/d' | wc -l | tr -d ' ')" -eq 1
          test "$trigger_files" = "${WORKFLOW_PATH}"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${EXPECTED_MAIN}"
          git merge-base --is-ancestor "${EXPECTED_MAIN}" HEAD
          git branch -f main origin/main

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install HTTP API dependencies
        working-directory: http-generic-api
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate canonical frontend artifacts
        working-directory: http-generic-api
        env:
          CANONICAL_BASELINE_REF: main
          TARGET_REF: main
        run: npm run frontend:dispatch:generate -- --baseline-ref=main

      - name: Commit only the exact generated write-set record
        shell: bash
        run: |
          set -Eeuo pipefail
          raw_status="${RUNNER_TEMP}/pr5292-generator-status.txt"
          git status --porcelain=v1 --untracked-files=all > "$raw_status"
          test -s "$raw_status"
          {
            printf 'exact_head=%s\n' "${EXPECTED_HEAD}"
            printf 'pinned_main=%s\n' "${EXPECTED_MAIN}"
            printf '%s\n' 'raw_porcelain_begin'
            cat "$raw_status"
            printf '%s\n' 'raw_porcelain_end'
            printf '%s\n' 'normalized_paths_begin'
            sed -E 's/^...//' "$raw_status" | sed -E 's/.* -> /'
            printf '%s\n' 'normalized_paths_end'
          } > "${DIAGNOSTIC_PATH}"
          git config user.name 'mad4bdigital-ai'
          git config user.email 'mad4bdigital-ai@users.noreply.github.com'
          git add -- "${DIAGNOSTIC_PATH}"
          test "$(git diff --cached --name-only)" = "${DIAGNOSTIC_PATH}"
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "$(git rev-parse HEAD)"
          git commit -m 'chore(surface): record generator write set'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
