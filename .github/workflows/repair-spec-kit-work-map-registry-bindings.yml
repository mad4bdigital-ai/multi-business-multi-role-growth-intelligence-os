name: Repair Spec Kit Work Map Registry Bindings

on:
  push:
    branches:
      - fix/certified-release-registration-clean-20260806
    paths:
      - .github/ops/repair-spec-kit-work-map-registry-bindings.trigger

permissions:
  contents: write

concurrency:
  group: repair-spec-kit-work-map-registry-bindings-${{ github.sha }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      EXPECTED_BRANCH: fix/certified-release-registration-clean-20260806
      OLD_FINGERPRINT: ea6b8ea3bee793f4009786f96f0c0dcddc320a78a1d57d1ae0d051c6a179e0f7
      NEW_FINGERPRINT: d6dd9551d69a4305520591f0961c4eabc1d55e54c08176d4dedc40a99437bffe
      OLD_INDEX_SOURCE_HASH: ef362cdb8af2bb48c6d91665c9812077526b40419a6f4afa7bd2c9ac10b6303a
      NEW_INDEX_SOURCE_HASH: 4b9f1033091688f0aedf998ecd5ea5de137f966cdf4cf440d18f4139a0822b5a
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Patch only stale registry bindings
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

          node <<'NODE'
          const fs = require('node:fs');
          const paths = [
            'specs/014-governed-hostinger-storage-orchestration/work-map-integration.json',
            'specs/014-retail-commerce-operations-growth-os/work-map-integration.json',
          ];
          for (const path of paths) {
            const document = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (document.registry?.fingerprint !== process.env.OLD_FINGERPRINT) {
              throw new Error(`${path}: unexpected current fingerprint ${document.registry?.fingerprint}`);
            }
            if (document.registry?.index_source_hash !== process.env.OLD_INDEX_SOURCE_HASH) {
              throw new Error(`${path}: unexpected current index_source_hash ${document.registry?.index_source_hash}`);
            }
            document.registry.fingerprint = process.env.NEW_FINGERPRINT;
            document.registry.index_source_hash = process.env.NEW_INDEX_SOURCE_HASH;
            fs.writeFileSync(path, `${JSON.stringify(document, null, 2)}\n`);
          }
          NODE

          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | sort > /tmp/changed.txt
          printf '%s\n' \
            specs/014-governed-hostinger-storage-orchestration/work-map-integration.json \
            specs/014-retail-commerce-operations-growth-os/work-map-integration.json | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git diff --check

      - name: Validate Work Maps and governance
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          node http-generic-api/scripts/spec-kit-work-map-governance-gate.mjs --ci --changed
          (
            cd http-generic-api
            node test-work-map-schema-classification.mjs
            node test-work-map-schema-classification-contract.mjs
            node test-work-map-autofix-diagnostics.mjs
            node test-spec-kit-work-map-governance-gate.mjs
            node test-spec-kit-completion-gate.mjs
          )

      - name: Commit bounded repair and remove temporary materializer
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${EXPECTED_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${GITHUB_SHA}"

          git rm .github/workflows/repair-spec-kit-work-map-registry-bindings.yml
          git rm .github/ops/repair-spec-kit-work-map-registry-bindings.trigger

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            specs/014-governed-hostinger-storage-orchestration/work-map-integration.json \
            specs/014-retail-commerce-operations-growth-os/work-map-integration.json
          git diff --cached --check
          git commit -m "fix(spec): refresh Work Map registry bindings"
          git push origin "HEAD:${EXPECTED_BRANCH}"
