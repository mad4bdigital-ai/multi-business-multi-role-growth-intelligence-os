name: Spec012 OAuth Exact Head Full Validation

on:
  push:
    branches:
      - gpt/read-main-tree-sha-v8-97e4ee7
    paths:
      - ".github/workflows/spec012-oauth-exact-head-full-validation.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: spec012-oauth-exact-head-full-validation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-exact-head:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 7855990b8a5e96ea86b0efbd48efd4fe833d47a9
    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@v4
        with:
          ref: 7855990b8a5e96ea86b0efbd48efd4fe833d47a9
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact identity and clean worktree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git status --porcelain)" = ""
          git diff --check HEAD^

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install locked dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Check all HTTP Generic API JavaScript modules
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in *.js *.mjs routes/*.js scripts/*.mjs wordpress/*.js; do
            node --check "${file}"
          done

      - name: Run complete Unit and Integration suite
        id: full_suite
        working-directory: http-generic-api
        env:
          TEST_SUITE_REPORT_DIR: ${{ runner.temp }}/test-suite-reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${TEST_SUITE_REPORT_DIR}"
          npm test 2>&1 | tee "${RUNNER_TEMP}/spec012-oauth-exact-head-full-suite.log"

      - name: Verify final identity and clean worktree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git status --porcelain)" = ""
          printf '%s\n' \
            "target_sha=${TARGET_SHA}" \
            "syntax=success" \
            "unit_integration=success" \
            "ref_updated=false" \
            "production_mutated=false" \
            "provider_mutated=false" \
            "database_mutated=false" \
            "migration_applied=false" \
            "credentials_accessed=false" \
            "secrets_included=false" \
            > "${RUNNER_TEMP}/spec012-oauth-exact-head-result.txt"

      - name: Upload exact-head validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec012-oauth-exact-head-full-validation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/spec012-oauth-exact-head-full-suite.log
            ${{ runner.temp }}/spec012-oauth-exact-head-result.txt
            ${{ runner.temp }}/test-suite-reports/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish exact-head terminal status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          description="exact-head Unit/Integration validation failed"
          if [[ "${JOB_STATUS}" == "success" ]]; then
            state=success
            description="exact-head syntax and full Unit/Integration passed"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="${state}" \
            -f context="exact-head-unit-integration-ubuntu2404" \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
