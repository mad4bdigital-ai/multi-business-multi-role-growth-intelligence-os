name: Incident 5021 direct finalize capability builder v3

on:
  pull_request:
    branches:
      - gpt/incident-5021/exact-head-approval-guard-20260803
    paths:
      - .github/workflows/incident-5021-direct-finalize-capability-builder.yml
      - .github/scripts/incident-5021-direct-finalize-builder.py

permissions:
  contents: write

concurrency:
  group: incident-5021-direct-finalize-capability-builder-v3
  cancel-in-progress: false

jobs:
  patch-test-publish:
    name: Patch, test, and publish direct finalize guard v3
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: gpt/incident-5021/exact-head-approval-guard-20260803
      BUILDER_BRANCH: gpt/incident-5021/direct-finalize-capability-builder-v2-20260803
      EXPECTED_TARGET_SHA: 67a07736b30721a7306c96bba1da4eb42c9f331b
    steps:
      - name: Checkout immutable target
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Verify target and fetch patch script
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"
          test "$(git status --porcelain)" = ""
          git fetch --no-tags origin "$TARGET_BRANCH" "$BUILDER_BRANCH"
          test "$(git rev-parse "origin/${TARGET_BRANCH}")" = "$EXPECTED_TARGET_SHA"
          git show "origin/${BUILDER_BRANCH}:.github/scripts/incident-5021-direct-finalize-builder.py" > /tmp/incident-5021-direct-finalize-builder.py
          python -m py_compile /tmp/incident-5021-direct-finalize-builder.py

      - name: Apply bounded patch
        run: python /tmp/incident-5021-direct-finalize-builder.py

      - name: Run focused tests and boundary checks
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/test-gpt-tools-route-syntax-regression.mjs
          node http-generic-api/test-github-repository-lifecycle.mjs
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            .changes/e2e/repository-lifecycle-draft-merge-guard.json
            http-generic-api/operationCapabilityLifecycleService.js
            http-generic-api/test-gpt-tools-route-syntax-regression.mjs
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")
          test "${#changed[@]}" -eq 3

      - name: Commit and publish without force
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/${TARGET_BRANCH}")" = "$EXPECTED_TARGET_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .changes/e2e/repository-lifecycle-draft-merge-guard.json http-generic-api/operationCapabilityLifecycleService.js http-generic-api/test-gpt-tools-route-syntax-regression.mjs
          git commit -m "fix(github): require explicit envelope for direct finalize"
          candidate_sha="$(git rev-parse HEAD)"
          test "$(git status --porcelain)" = ""
          git push origin "HEAD:${TARGET_BRANCH}"
          printf '{"schema_version":1,"status":"published","base_sha":"%s","candidate_sha":"%s","target_branch":"%s","changed_file_count":3,"tests_passed":true,"diff_check_passed":true,"force_push":false,"secrets_included":false}\n' "$EXPECTED_TARGET_SHA" "$candidate_sha" "$TARGET_BRANCH" > /tmp/incident-5021-direct-finalize-result.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incident-5021-direct-finalize-v3-${{ github.sha }}
          path: /tmp/incident-5021-direct-finalize-result.json
          if-no-files-found: warn
          retention-days: 7
