name: TEMP Build Pipeline Connectivity Diagnostic Candidate

on:
  pull_request:
    branches:
      - gpt/patch-pipeline-connectivity-5983-base-a61cd9e8
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build isolated V3 diagnostic branch
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      SOURCE_SHA: c95aa1e6578d863b5caa199b643018f30fd47853
      SOURCE_REF: gpt/work-map-post-write-exact-observable-dispatch-a61cd9e8-v2-20260804
      DIAGNOSTIC_REF: gpt/diagnose-work-map-v3-pipeline-connectivity-5983
      MAIN_SHA: a61cd9e83070618001676bbc679bc937f0551875
      CANONICAL_PR: '5983'
    steps:
      - name: Checkout exact source candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify immutable source and trigger
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.repo.full_name }}" = "${GITHUB_REPOSITORY}"
          test "${{ github.event.pull_request.head.ref }}" = "gpt/trigger-patch-pipeline-connectivity-5983"
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "${MAIN_SHA}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${SOURCE_REF}" --jq '.object.sha')" = "${SOURCE_SHA}"

      - name: Apply Pipeline Connectivity V3 and robust focused regression
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const contractPath = '.specify/pipeline-connectivity-contract.json';
          const contract = JSON.parse(fs.readFileSync(contractPath, 'utf8'));
          const legacy = new Set([
            'gh workflow run ci.yml',
            'gh workflow run spec-kit-work-map-integration.yml',
            'mad4b.spec-kit-work-map-autofix.v2',
            'WORK_MAP_AUTOFIX_V2',
          ]);
          const modern = [
            'actions/workflows/ci.yml/dispatches',
            'actions/workflows/spec-kit-work-map-integration.yml/dispatches',
            'dispatch-ci.stderr',
            'dispatch-work-map-integration.stderr',
            'ci_run_id',
            'integration_run_id',
            'mad4b.spec-kit-work-map-autofix.v3',
            'WORK_MAP_AUTOFIX_V3',
            'gh api --method POST',
          ];
          const required = (values) => [...new Set([...values.filter((value) => !legacy.has(value)), ...modern])];
          const forbidden = (values) => [...new Set([...values, 'gh workflow run ci.yml', 'gh workflow run spec-kit-work-map-integration.yml'])];
          const policy = contract.artifact_writer_policies.find((item) => item.key === 'platform-work-maps-sole-remote-writer');
          const writer = contract.pipelines.find((item) => item.key === 'spec-kit-work-map-autofix');
          const integration = contract.pipelines.find((item) => item.key === 'spec-kit-work-map-integration');
          const edge = contract.edges.find((item) => item.from === 'spec-kit-work-map-autofix' && item.to === 'spec-kit-work-map-integration');
          if (!policy || !writer || !integration || !edge) throw new Error('canonical Pipeline Connectivity records missing');
          policy.required_writer_commands = required(policy.required_writer_commands);
          policy.forbidden_writer_commands = forbidden(policy.forbidden_writer_commands);
          writer.mode = 'sole_remote_write_with_observable_exact_verification';
          writer.required_commands = required(writer.required_commands);
          writer.forbidden_commands = forbidden(writer.forbidden_commands);
          integration.required_commands = [...new Set([...integration.required_commands,'EXPECTED_CHECKED_OUT_SHA','refs/remotes/origin/${TARGET_BRANCH}','target_branch: process.env.TARGET_BRANCH'])];
          edge.type = 'dispatches_observable_exact_head_validation';
          fs.writeFileSync(contractPath, `${JSON.stringify(contract, null, 2)}\n`);

          const pipelineTestPath = 'http-generic-api/test-pipeline-connectivity-check.mjs';
          let pipelineTest = fs.readFileSync(pipelineTestPath, 'utf8');
          const oldBlock = `  assert.ok(writerWorkflow.includes("WORK_MAP_AUTOFIX_V2"));\n  assert.ok(writerWorkflow.includes("gh workflow run ci.yml"));\n  assert.ok(writerWorkflow.includes("gh workflow run spec-kit-work-map-integration.yml"));`;
          const newBlock = `  assert.ok(writerWorkflow.includes("WORK_MAP_AUTOFIX_V3"));\n  assert.ok(writerWorkflow.includes("mad4b.spec-kit-work-map-autofix.v3"));\n  assert.ok(writerWorkflow.includes("actions/workflows/ci.yml/dispatches"));\n  assert.ok(writerWorkflow.includes("actions/workflows/spec-kit-work-map-integration.yml/dispatches"));\n  assert.ok(writerWorkflow.includes("dispatch-ci.stderr"));\n  assert.ok(writerWorkflow.includes("dispatch-work-map-integration.stderr"));\n  assert.ok(writerWorkflow.includes("ci_run_id"));\n  assert.ok(writerWorkflow.includes("integration_run_id"));\n  assert.ok(!writerWorkflow.includes("gh workflow run ci.yml"));\n  assert.ok(!writerWorkflow.includes("gh workflow run spec-kit-work-map-integration.yml"));`;
          if (!pipelineTest.includes(oldBlock)) throw new Error('legacy Pipeline Connectivity assertion block missing');
          fs.writeFileSync(pipelineTestPath, pipelineTest.replace(oldBlock, newBlock));

          const focusedPath = 'http-generic-api/test-work-map-post-write-exact-verification-dispatch.mjs';
          let focused = fs.readFileSync(focusedPath, 'utf8');
          focused = focused.replace(
            /assert\.match\(\n  writerWorkflow,\n  \/\\\[\\\[ "\\\$\\\{ci_run_id\\\}"[\s\S]*?\n\);\nassert\.match\(\n  writerWorkflow,\n  \/\\\[\\\[ "\\\$\\\{integration_run_id\\\}"[\s\S]*?\n\);/u,
            `assert.ok(writerWorkflow.includes('[[ "${ci_run_id}" =~ ^[1-9][0-9]*$ ]]'), "The writer must fail closed unless a CI verification run ID is observed.");\nassert.ok(writerWorkflow.includes('[[ "${integration_run_id}" =~ ^[1-9][0-9]*$ ]]'), "The writer must fail closed unless a Work Map verification run ID is observed.");`,
          );
          fs.writeFileSync(focusedPath, focused);

          const e2ePath = '.changes/e2e/work-map-post-write-exact-verification-dispatch.json';
          const e2e = JSON.parse(fs.readFileSync(e2ePath, 'utf8'));
          const extras = ['.specify/pipeline-connectivity-contract.json','http-generic-api/test-pipeline-connectivity-check.mjs'];
          e2e.scope.include = [...new Set([...e2e.scope.include, ...extras])];
          const journey = e2e.phases.find((phase) => phase.id === 'mvp')?.e2e_journeys?.[0];
          if (!journey) throw new Error('E2E journey missing');
          journey.tests = [...journey.tests,{path:'http-generic-api/test-pipeline-connectivity-check.mjs',command:'node test-pipeline-connectivity-check.mjs'}].filter((item,index,values)=>values.findIndex((candidate)=>candidate.path===item.path)===index);
          journey.evidence_paths = [...new Set([...journey.evidence_paths, ...extras])];
          fs.writeFileSync(e2ePath, `${JSON.stringify(e2e, null, 2)}\n`);
          NODE

      - name: Run all focused contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check http-generic-api/test-work-map-post-write-exact-verification-dispatch.mjs
          node --check http-generic-api/test-pipeline-connectivity-check.mjs
          node http-generic-api/test-work-map-post-write-exact-verification-dispatch.mjs
          node http-generic-api/scripts/pipeline-connectivity-check.mjs
          node http-generic-api/test-pipeline-connectivity-check.mjs
          node -e "JSON.parse(require('node:fs').readFileSync('.changes/e2e/work-map-post-write-exact-verification-dispatch.json','utf8'))"
          git diff --check

      - name: Commit isolated diagnostic candidate
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .specify/pipeline-connectivity-contract.json \
            http-generic-api/test-pipeline-connectivity-check.mjs \
            http-generic-api/test-work-map-post-write-exact-verification-dispatch.mjs \
            .changes/e2e/work-map-post-write-exact-verification-dispatch.json
          git commit -m 'test(ci): build isolated observable Work Map dispatch candidate'
          result_head="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${DIAGNOSTIC_REF}"
          test "$(git ls-remote --exit-code origin "refs/heads/${DIAGNOSTIC_REF}" | awk '{print $1}')" = "${result_head}"
          echo "result_head=${result_head}" >> "$GITHUB_OUTPUT"

      - name: Publish result to canonical PR
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_HEAD: ${{ steps.publish.outputs.result_head }}
        run: |
          set -euo pipefail
          body="PIPELINE_V3_DIAGNOSTIC_CANDIDATE outcome=${{ job.status }} source_sha=${SOURCE_SHA} diagnostic_ref=${DIAGNOSTIC_REF} result_head_sha=${RESULT_HEAD:-none} canonical_mutated=false main_mutated=false production_mutated=false force_push=false"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${CANONICAL_PR}/comments" -f body="${body}"
