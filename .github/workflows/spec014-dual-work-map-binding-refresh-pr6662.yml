name: Spec 014 Dual Work Map Binding Refresh PR 6662

on:
  push:
    branches:
      - gpt/spec014-binding-refresh-pr6662-da89a2a-20260808

permissions:
  contents: write

concurrency:
  group: spec014-binding-refresh-pr6662-da89a2a
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_BRANCH: gpt/tenant-request-identity-collation-repair-20260808
      EXPECTED_HEAD_SHA: da89a2a502364186a64a70b5bb93f530474fbda0
    steps:
      - name: Checkout launcher
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify immutable launcher topology
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "gpt/spec014-binding-refresh-pr6662-da89a2a-20260808"
          test -f .github/workflows/spec014-dual-work-map-binding-refresh-pr6662.yml

      - name: Checkout exact target without launcher
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${TARGET_BRANCH}"
          actual="$(git rev-parse "origin/${TARGET_BRANCH}")"
          test "${actual}" = "${EXPECTED_HEAD_SHA}"
          git checkout -B "${TARGET_BRANCH}" "${EXPECTED_HEAD_SHA}"

      - name: Verify target branch exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${EXPECTED_HEAD_SHA}"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Refresh exact stale bindings via canonical producer
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-governed-hostinger-storage-orchestration
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-retail-commerce-operations-growth-os

      - name: Enforce exact generated write set
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            specs/014-governed-hostinger-storage-orchestration/work-map-integration.json \
            specs/014-retail-commerce-operations-growth-os/work-map-integration.json | sort)"
          actual="$(git diff --name-only | sort)"
          printf 'Expected write set:\n%s\nActual write set:\n%s\n' "${expected}" "${actual}"
          test "${actual}" = "${expected}"
          git diff --check

      - name: Prove idempotency and readback
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-governed-hostinger-storage-orchestration --check
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-retail-commerce-operations-growth-os --check
          node http-generic-api/scripts/spec014-final-work-map-readback.mjs > /tmp/spec014-final-work-map-readback.json
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("/tmp/spec014-final-work-map-readback.json","utf8"));if(!r.ok)process.exit(1);'

      - name: Commit manifests and fast-forward PR branch
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote}" = "${EXPECTED_HEAD_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            specs/014-governed-hostinger-storage-orchestration/work-map-integration.json \
            specs/014-retail-commerce-operations-growth-os/work-map-integration.json
          git commit -m "chore(spec-kit): refresh Work Map registry bindings"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Summary
        shell: bash
        run: |
          set -euo pipefail
          echo "target_branch=${TARGET_BRANCH}" >> "$GITHUB_STEP_SUMMARY"
          echo "source_head=${EXPECTED_HEAD_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "result_head=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "write_set=two Spec014 work-map-integration manifests only" >> "$GITHUB_STEP_SUMMARY"
          echo "production_mutation=false" >> "$GITHUB_STEP_SUMMARY"
          echo "migration_apply=false" >> "$GITHUB_STEP_SUMMARY"
