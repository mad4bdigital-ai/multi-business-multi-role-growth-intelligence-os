name: Spec 014 Dual Work Map Binding Refresh PR 6662

on:
  push:
    branches:
      - gpt/spec014-binding-refresh-pr6662-d32dbbb-20260808
    paths:
      - .github/workflows/spec014-dual-work-map-binding-refresh-pr6662.yml

permissions:
  contents: write

concurrency:
  group: spec014-dual-work-map-binding-refresh-pr6662-d32dbbb
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_TARGET_SHA: d32dbbb2583db89596ac8718577b0b9637927641
      TARGET_BRANCH: gpt/tenant-request-identity-collation-repair-20260808
      LAUNCHER_PATH: .github/workflows/spec014-dual-work-map-binding-refresh-pr6662.yml
      HOSTINGER_MANIFEST: specs/014-governed-hostinger-storage-orchestration/work-map-integration.json
      COMMERCE_MANIFEST: specs/014-retail-commerce-operations-growth-os/work-map-integration.json

    steps:
      - name: Checkout launcher
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable launcher topology
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_TARGET_SHA"
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$LAUNCHER_PATH"
          test -z "$(git status --porcelain)"

      - name: Checkout exact target without launcher
        uses: actions/checkout@v5
        with:
          ref: d32dbbb2583db89596ac8718577b0b9637927641
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Verify target branch exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_TARGET_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Refresh exact stale bindings via canonical producer
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-governed-hostinger-storage-orchestration
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-retail-commerce-operations-growth-os

      - name: Enforce exact generated write set
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain=v1 --untracked-files=all | sed -E 's/^...//' | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "$HOSTINGER_MANIFEST"
          test "${changed[1]}" = "$COMMERCE_MANIFEST"
          git diff --check

      - name: Prove idempotency and readback
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-governed-hostinger-storage-orchestration --check
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-retail-commerce-operations-growth-os --check
          REPORT_PATH="$RUNNER_TEMP/spec014-final-work-map-readback.json" node http-generic-api/scripts/spec014-final-work-map-readback.mjs
          node - "$RUNNER_TEMP/spec014-final-work-map-readback.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (report.ok !== true || (report.findings || []).length !== 0) throw new Error('readback_not_current');
          if (report.repository_mutation !== false || report.provider_dispatch !== false || report.live_database_access !== false || report.migration_apply !== false || report.secrets_included !== false) throw new Error('readback_side_effect_contract_failed');
          NODE
          node http-generic-api/test-spec014-refresh-final-work-map-binding.mjs
          git diff --check

      - name: Commit manifests and fast-forward PR branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_TARGET_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$HOSTINGER_MANIFEST" "$COMMERCE_MANIFEST"
          mapfile -t staged < <(git diff --cached --name-only | sort)
          test "${#staged[@]}" -eq 2
          test "${staged[0]}" = "$HOSTINGER_MANIFEST"
          test "${staged[1]}" = "$COMMERCE_MANIFEST"
          git commit -m 'chore(spec-kit): refresh Work Map registry bindings'
          result_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_TARGET_SHA"
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_TARGET_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "RESULT_HEAD_SHA=$result_sha" >> "$GITHUB_ENV"

      - name: Summary
        shell: bash
        run: |
          set -euo pipefail
          echo 'SPEC014_DUAL_WORK_MAP_BINDING_REFRESH=success'
          echo "RESULT_HEAD_SHA=${RESULT_HEAD_SHA}"
          echo "CHANGED_FILE=$HOSTINGER_MANIFEST"
          echo "CHANGED_FILE=$COMMERCE_MANIFEST"
          echo 'WORK_MAP_FILES_MUTATED=false'
          echo 'FORCE_PUSH=false'
          echo 'PROTECTED_BRANCH_MUTATION=false'
          echo 'PROVIDER_DISPATCH=false'
          echo 'LIVE_DATABASE_ACCESS=false'
          echo 'MIGRATION_APPLY=false'
          echo 'SECRETS_INCLUDED=false'
