name: Spec012 OAuth Production Deps Blob Publisher

on:
  push:
    branches:
      - gpt/read-main-tree-sha-v8-97e4ee7
    paths:
      - ".github/workflows/spec012-oauth-production-deps-blob-publisher.yml"

permissions:
  contents: write
  statuses: write

concurrency:
  group: spec012-oauth-production-deps-blob-publisher-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish-tested-blobs:
    runs-on: ubuntu-24.04
    env:
      SOURCE_SHA: edfc85f07a0fcac03b7258bb3c36e320b8fd1d3d
    steps:
      - name: Checkout immutable current main
        uses: actions/checkout@v4
        with:
          ref: edfc85f07a0fcac03b7258bb3c36e320b8fd1d3d
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test "$(git status --porcelain)" = ""

      - name: Apply bounded production dependency composition patch
        shell: python
        run: |
          from pathlib import Path

          replacements = [
              (
                  Path("http-generic-api/routes/index.js"),
                  "  app.use(buildTenantGptOAuthMetadataRoutes());",
                  "  app.use(buildTenantGptOAuthMetadataRoutes(deps));",
                  "production metadata-router dependency forwarding",
              ),
              (
                  Path("http-generic-api/test-spec012-t031-oauth-token-route-wiring.mjs"),
                  'const metadataMount = routeIndex.indexOf("app.use(buildTenantGptOAuthMetadataRoutes())");',
                  'const metadataMount = routeIndex.indexOf("app.use(buildTenantGptOAuthMetadataRoutes(deps))");',
                  "production composition wiring assertion",
              ),
          ]

          for path, old, new, label in replacements:
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              path.write_text(source.replace(old, new, 1), encoding="utf-8")

          contract = Path(".changes/e2e/spec012-oauth-production-dependency-composition.json")
          contract.write_text('''{
            "$schema": "../../.specify/schemas/e2e-phases.schema.json",
            "schema_version": 1,
            "feature_key": "spec012-oauth-production-dependency-composition",
            "title": "Spec 012 OAuth production dependency composition",
            "delivery_mode": "single_pr",
            "current_phase": "mvp",
            "scope": {
              "include": [
                ".changes/e2e/spec012-oauth-production-dependency-composition.json",
                "http-generic-api/routes/index.js",
                "http-generic-api/test-spec012-t031-oauth-token-route-wiring.mjs"
              ]
            },
            "merge_contract": {
              "minimum_phase": "mvp"
            },
            "phases": [
              {
                "id": "mvp",
                "status": "implemented",
                "objective": "Forward the canonical production dependency object into the governed Tenant GPT OAuth metadata and token router while preserving mount order ahead of the legacy auth router.",
                "e2e_journeys": [
                  {
                    "id": "production-registry-forwards-governed-oauth-dependencies",
                    "end_to_end": true,
                    "level": "synthetic_runtime",
                    "actor": "tenant_gpt_oauth_client",
                    "entrypoint": "POST /auth/oauth/token",
                    "terminal_outcome": "The production route registry forwards canonical dependencies, the governed metadata router prepares the token-exchange dependencies, and OAuth token requests remain handled before the legacy auth router.",
                    "steps": [
                      "Register the production route graph with the canonical dependency object.",
                      "Mount buildTenantGptOAuthMetadataRoutes(deps) before the legacy /auth router.",
                      "Build the governed verification and access-token issuance dependencies inside the metadata router.",
                      "Exercise token success, invalid-client, replay, and metadata-routing regressions through existing synthetic-runtime tests."
                    ],
                    "assertions": [
                      "The production route registry calls buildTenantGptOAuthMetadataRoutes(deps).",
                      "The metadata router builds the governed token-exchange dependency boundary before mounting the handler.",
                      "The governed token router remains mounted before buildAuthRoutes(deps).",
                      "Existing OAuth integration and replay regressions remain green without overwriting the merged diagnostic contract.",
                      "No Production, provider, deployment, database, migration, credential, protected-ref, or external-send action is authorized."
                    ],
                    "tests": [
                      {
                        "id": "spec012-t031-oauth-token-route-wiring",
                        "runner": "node",
                        "working_directory": "http-generic-api",
                        "path": "test-spec012-t031-oauth-token-route-wiring.mjs",
                        "args": []
                      },
                      {
                        "id": "tenant-gpt-oauth-token-exchange-routes",
                        "runner": "node",
                        "working_directory": "http-generic-api",
                        "path": "test-tenant-gpt-oauth-token-exchange-routes.mjs",
                        "args": []
                      },
                      {
                        "id": "integrated-auth-oauth-routes",
                        "runner": "node",
                        "working_directory": "http-generic-api",
                        "path": "test-auth-oauth-routes.mjs",
                        "args": []
                      },
                      {
                        "id": "chatgpt-mcp-metadata-routing",
                        "runner": "node",
                        "working_directory": "http-generic-api",
                        "path": "test-chatgpt-mcp-metadata-routing.mjs",
                        "args": []
                      }
                    ],
                    "evidence_paths": [
                      ".changes/e2e/spec012-oauth-production-dependency-composition.json",
                      "http-generic-api/routes/index.js",
                      "http-generic-api/test-spec012-t031-oauth-token-route-wiring.mjs"
                    ]
                  }
                ]
              },
              {
                "id": "operational",
                "status": "planned",
                "objective": "Complete governed exact-environment deployment and live OAuth exchange readback before closing T031."
              },
              {
                "id": "resilient",
                "status": "planned",
                "objective": "Prove exact-environment replay and dependency-unavailability recovery classifications."
              },
              {
                "id": "canary",
                "status": "not_applicable",
                "objective": "This repository composition repair does not authorize tenant or provider canary execution."
              },
              {
                "id": "production",
                "status": "not_applicable",
                "objective": "This PR grants no Production, deployment, provider, database, migration, credential, or external-send authority."
              }
            ],
            "secrets_included": false
          }
          ''', encoding="utf-8")

          print("REPLACEMENT_COUNT=2")
          print("CONTRACT_CREATED=true")

      - name: Create local exact candidate commit
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .changes/e2e/spec012-oauth-production-dependency-composition.json \
            http-generic-api/routes/index.js \
            http-generic-api/test-spec012-t031-oauth-token-route-wiring.mjs
          git diff --cached --check
          git commit -m "fix(oauth): forward production dependencies into governed token router"
          candidate_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "${SOURCE_SHA}"
          printf 'candidate_sha=%s\n' "${candidate_sha}" >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install locked connector dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Validate syntax and focused OAuth composition
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          node --check routes/index.js
          node --check test-spec012-t031-oauth-token-route-wiring.mjs
          node test-spec012-t031-oauth-token-route-wiring.mjs
          node test-tenant-gpt-oauth-token-exchange-routes.mjs
          node test-auth-oauth-routes.mjs
          node test-chatgpt-mcp-metadata-routing.mjs

      - name: Validate E2E references and phase contract
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/spec012-oauth-production-deps
          node http-generic-api/test-e2e-contract-reference-integrity.mjs
          node http-generic-api/test-e2e-contract-git-index-integrity.mjs
          node http-generic-api/scripts/e2e-contract-reference-integrity.mjs \
            --report-file /tmp/spec012-oauth-production-deps/e2e-contract-reference-integrity.json \
            --base "${SOURCE_SHA}" \
            --head "${CANDIDATE_SHA}"
          node http-generic-api/scripts/e2e-contract-git-index-integrity.mjs \
            --report-file /tmp/spec012-oauth-production-deps/e2e-contract-reference-integrity.json
          node http-generic-api/scripts/e2e-phase-governance.mjs check \
            --report-file /tmp/spec012-oauth-production-deps/e2e-phase-evaluation.json \
            --base "${SOURCE_SHA}" \
            --head "${CANDIDATE_SHA}"
          node http-generic-api/scripts/e2e-phase-governance.mjs run \
            --report-file /tmp/spec012-oauth-production-deps/e2e-phase-evaluation.json \
            --execution-report-file /tmp/spec012-oauth-production-deps/e2e-phase-execution.json \
            --base "${SOURCE_SHA}" \
            --head "${CANDIDATE_SHA}"

      - name: Verify exact bounded candidate inventory
        id: inventory
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            .changes/e2e/spec012-oauth-production-dependency-composition.json \
            http-generic-api/routes/index.js \
            http-generic-api/test-spec012-t031-oauth-token-route-wiring.mjs | sort)"
          actual="$(git diff --name-only "${SOURCE_SHA}" "${CANDIDATE_SHA}" | sort)"
          test "${actual}" = "${expected}"
          test "$(git rev-list --count "${SOURCE_SHA}".."${CANDIDATE_SHA}")" = "1"
          git diff --check "${SOURCE_SHA}" "${CANDIDATE_SHA}"
          printf '%s\n' "${actual}" > /tmp/spec012-oauth-production-deps/files.txt
          printf 'file_count=3\n' >> "${GITHUB_OUTPUT}"

      - name: Publish tested unreachable Git blobs
        id: blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          publish_blob() {
            local path="$1"
            local key="$2"
            local encoded sha digest
            encoded="$(base64 -w0 "${path}")"
            sha="$(jq -n --arg content "${encoded}" '{content:$content,encoding:"base64"}' \
              | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq '.sha')"
            digest="$(sha256sum "${path}" | awk '{print $1}')"
            test -n "${sha}"
            printf '%s_sha=%s\n' "${key}" "${sha}" >> "${GITHUB_OUTPUT}"
            printf '%s_digest=%s\n' "${key}" "${digest}" >> "${GITHUB_OUTPUT}"
          }
          publish_blob ".changes/e2e/spec012-oauth-production-dependency-composition.json" contract
          publish_blob "http-generic-api/routes/index.js" routes_index
          publish_blob "http-generic-api/test-spec012-t031-oauth-token-route-wiring.mjs" wiring_test

      - name: Build and upload immutable evidence
        id: evidence
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          CONTRACT_SHA: ${{ steps.blobs.outputs.contract_sha }}
          CONTRACT_DIGEST: ${{ steps.blobs.outputs.contract_digest }}
          ROUTES_INDEX_SHA: ${{ steps.blobs.outputs.routes_index_sha }}
          ROUTES_INDEX_DIGEST: ${{ steps.blobs.outputs.routes_index_digest }}
          WIRING_TEST_SHA: ${{ steps.blobs.outputs.wiring_test_sha }}
          WIRING_TEST_DIGEST: ${{ steps.blobs.outputs.wiring_test_digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/spec012-oauth-production-deps
          jq -n \
            --arg source_sha "${SOURCE_SHA}" \
            --arg candidate_sha "${CANDIDATE_SHA}" \
            --arg contract_sha "${CONTRACT_SHA}" \
            --arg contract_digest "${CONTRACT_DIGEST}" \
            --arg routes_index_sha "${ROUTES_INDEX_SHA}" \
            --arg routes_index_digest "${ROUTES_INDEX_DIGEST}" \
            --arg wiring_test_sha "${WIRING_TEST_SHA}" \
            --arg wiring_test_digest "${WIRING_TEST_DIGEST}" \
            '{source_sha:$source_sha,candidate_sha:$candidate_sha,blobs:{contract:{sha:$contract_sha,sha256:$contract_digest},routes_index:{sha:$routes_index_sha,sha256:$routes_index_digest},wiring_test:{sha:$wiring_test_sha,sha256:$wiring_test_digest}},file_count:3,ref_updated:false,production_mutated:false,provider_mutated:false,database_mutated:false,migration_applied:false,credentials_accessed:false,secrets_included:false}' \
            > /tmp/spec012-oauth-production-deps/result.json
          cat /tmp/spec012-oauth-production-deps/result.json

      - name: Upload tested blob evidence
        uses: actions/upload-artifact@v4
        with:
          name: spec012-oauth-production-deps-blobs-${{ github.run_id }}
          path: /tmp/spec012-oauth-production-deps
          if-no-files-found: error
          retention-days: 14

      - name: Publish readable terminal status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          CONTRACT_SHA: ${{ steps.blobs.outputs.contract_sha }}
          ROUTES_INDEX_SHA: ${{ steps.blobs.outputs.routes_index_sha }}
          WIRING_TEST_SHA: ${{ steps.blobs.outputs.wiring_test_sha }}
        run: |
          set -euo pipefail
          state=failure
          description="OAuth production-deps blob validation failed"
          if [[ "${JOB_STATUS}" == "success" && -n "${CONTRACT_SHA}" && -n "${ROUTES_INDEX_SHA}" && -n "${WIRING_TEST_SHA}" ]]; then
            state=success
            description="3 tested blobs published; no ref updated"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context=spec012-oauth-production-deps-blobs \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
