name: Hostinger Node.js Build Evidence Dispatch Bridge

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact current main SHA authorized for this dispatch
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: hostinger-nodejs-build-evidence-dispatch-f5c1ae88
  cancel-in-progress: false

jobs:
  dispatch-read-only-evidence:
    name: Dispatch authenticated GET-only Hostinger build evidence
    if: >-
      (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       github.event.issue.number == 4953 &&
       startsWith(github.event.comment.body, 'RUN_HOSTINGER_NODEJS_BUILD_EVIDENCE_F5C1AE88_09578A2C expected_head_sha=') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    permissions:
      contents: read
      actions: write
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      CONTROL_ISSUE: '4953'
      AUTHORIZATION_COMMENT_ID: '5161758022'
      AUTHORIZATION_USER_ID: '271942579'
      AUTHORIZATION_TOKEN: AUTHORIZE_HOSTINGER_NODEJS_BUILD_EVIDENCE_F5C1AE88_09578A2C
      TRIGGER_TOKEN: RUN_HOSTINGER_NODEJS_BUILD_EVIDENCE_F5C1AE88_09578A2C
      TARGET_WORKFLOW: hostinger-nodejs-build-evidence.yml
      TARGET_WORKFLOW_PATH: .github/workflows/hostinger-nodejs-build-evidence.yml
      TARGET_REF: main
      EXPECTED_WORKFLOW_BLOB_SHA: 09578a2c9adcd0d1254b345248c33d2ba214d41f
      ACCOUNT_USERNAME: u338416126
      DOMAIN: auth.mad4b.com
      EXPECTED_PRODUCTION_SHA: f5c1ae8840b4d4452f2908bb0f23051880bb6896
      PRODUCTION_MERGED_AT: '2026-08-03T00:53:07Z'
      BINDING_ID: f5c1ae8840b4d4452f2908bb0f23051880bb6896:09578a2c9adcd0d1254b345248c33d2ba214d41f:5161758022
      MUTATION_TARGET_BRANCH: issue-and-actions-metadata-only
      EVENT_COMMENT_BODY: ${{ github.event.comment.body || '' }}
      EVENT_COMMENT_USER_ID: ${{ github.event.comment.user.id || '' }}
      EVENT_COMMENT_ID: ${{ github.event.comment.id || 'workflow-dispatch' }}
      INPUT_EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha || '' }}
    steps:
      - name: Resolve explicit expected head SHA
        id: expected
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${MUTATION_TARGET_BRANCH}" == "main" || "${MUTATION_TARGET_BRANCH}" == "Production" ]]; then
            echo "Repository branch mutation is forbidden." >&2
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "issue_comment" ]]; then
            test "${EVENT_COMMENT_USER_ID}" = "${AUTHORIZATION_USER_ID}"
            if [[ ! "${EVENT_COMMENT_BODY}" =~ ^${TRIGGER_TOKEN}[[:space:]]expected_head_sha=([a-f0-9]{40})$ ]]; then
              echo "Invalid governed trigger format." >&2
              exit 1
            fi
            EXPECTED_HEAD_SHA="${BASH_REMATCH[1]}"
          else
            EXPECTED_HEAD_SHA="${INPUT_EXPECTED_HEAD_SHA}"
            [[ "${EXPECTED_HEAD_SHA}" =~ ^[a-f0-9]{40}$ ]]
          fi

          echo "expected_head_sha=${EXPECTED_HEAD_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Verify authorization and immutable target bindings
        id: binding
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ steps.expected.outputs.expected_head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          ISSUE_STATE="$(gh api "/repos/${REPOSITORY}/issues/${CONTROL_ISSUE}" --jq '.state')"
          test "${ISSUE_STATE}" = "open"

          AUTH_BODY="$(gh api "/repos/${REPOSITORY}/issues/comments/${AUTHORIZATION_COMMENT_ID}" --jq '.body')"
          AUTH_USER_ID="$(gh api "/repos/${REPOSITORY}/issues/comments/${AUTHORIZATION_COMMENT_ID}" --jq '.user.id')"
          test "${AUTH_USER_ID}" = "${AUTHORIZATION_USER_ID}"
          grep -Fq "${AUTHORIZATION_TOKEN}" <<<"${AUTH_BODY}"
          grep -Fq "${EXPECTED_WORKFLOW_BLOB_SHA}" <<<"${AUTH_BODY}"
          grep -Fq "${ACCOUNT_USERNAME}" <<<"${AUTH_BODY}"
          grep -Fq "${DOMAIN}" <<<"${AUTH_BODY}"
          grep -Fq "${EXPECTED_PRODUCTION_SHA}" <<<"${AUTH_BODY}"
          grep -Fq "${PRODUCTION_MERGED_AT}" <<<"${AUTH_BODY}"
          grep -Fq 'provider method: `GET` only' <<<"${AUTH_BODY}"
          grep -Fq 'provider mutation: `false`' <<<"${AUTH_BODY}"

          CURRENT_HEAD_SHA="$(gh api "/repos/${REPOSITORY}/git/ref/heads/${TARGET_REF}" --jq '.object.sha')"
          test "${CURRENT_HEAD_SHA}" = "${EXPECTED_HEAD_SHA}"

          WORKFLOW_BLOB="$(gh api "/repos/${REPOSITORY}/contents/${TARGET_WORKFLOW_PATH}?ref=${TARGET_REF}" --jq '.sha')"
          test "${WORKFLOW_BLOB}" = "${EXPECTED_WORKFLOW_BLOB_SHA}"

          WORKFLOW_STATE="$(gh api "/repos/${REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}" --jq '.state')"
          test "${WORKFLOW_STATE}" = "active"

          PRODUCTION_SHA="$(gh api "/repos/${REPOSITORY}/git/ref/heads/Production" --jq '.object.sha')"
          test "${PRODUCTION_SHA}" = "${EXPECTED_PRODUCTION_SHA}"

          COMPLETED_MARKERS="$(gh api --paginate "/repos/${REPOSITORY}/issues/${CONTROL_ISSUE}/comments?per_page=100" \
            --jq ".[] | select(.body | contains(\"HOSTINGER_NODEJS_BUILD_EVIDENCE_DISPATCH status=completed binding=${BINDING_ID}\")) | .id")"
          DISPATCHED_MARKERS="$(gh api --paginate "/repos/${REPOSITORY}/issues/${CONTROL_ISSUE}/comments?per_page=100" \
            --jq ".[] | select(.body | contains(\"HOSTINGER_NODEJS_BUILD_EVIDENCE_DISPATCH status=dispatched binding=${BINDING_ID}\")) | .id")"
          test -z "${COMPLETED_MARKERS}"
          test -z "${DISPATCHED_MARKERS}"

          BEFORE_RUN_ID="$(gh api "/repos/${REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?event=workflow_dispatch&branch=${TARGET_REF}&per_page=30" \
            --jq '[.workflow_runs[].id] | max // 0')"
          echo "before_run_id=${BEFORE_RUN_ID}" >> "${GITHUB_OUTPUT}"
          echo "target_main_sha=${CURRENT_HEAD_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Record one-time dispatch claim
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ steps.expected.outputs.expected_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          BODY="HOSTINGER_NODEJS_BUILD_EVIDENCE_DISPATCH status=claiming binding=${BINDING_ID} bridge_run_id=${GITHUB_RUN_ID} authorization_comment_id=${AUTHORIZATION_COMMENT_ID} trigger_comment_id=${EVENT_COMMENT_ID} expected_head_sha=${EXPECTED_HEAD_SHA} target_workflow_blob=${EXPECTED_WORKFLOW_BLOB_SHA} expected_production_sha=${EXPECTED_PRODUCTION_SHA} provider_get_only=true provider_mutation=false deployment=false restart=false secrets_included=false"
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPOSITORY}/issues/${CONTROL_ISSUE}/comments" \
            -f body="${BODY}"

      - name: Dispatch unchanged trusted workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg ref "${TARGET_REF}" \
            --arg account "${ACCOUNT_USERNAME}" \
            --arg expected "${EXPECTED_PRODUCTION_SHA}" \
            --arg merged "${PRODUCTION_MERGED_AT}" \
            '{ref:$ref,inputs:{account_username:$account,expected_sha:$expected,production_merged_at:$merged}}' \
            | gh api --method POST \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/dispatches" \
                --input -

      - name: Resolve dispatched run
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_RUN_ID: ${{ steps.binding.outputs.before_run_id }}
          TARGET_MAIN_SHA: ${{ steps.binding.outputs.target_main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=""
          for _ in $(seq 1 60); do
            RUN_ID="$(gh api "/repos/${REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?event=workflow_dispatch&branch=${TARGET_REF}&per_page=30" \
              --jq ".workflow_runs | map(select(.id > ${BEFORE_RUN_ID} and .head_sha == \"${TARGET_MAIN_SHA}\")) | sort_by(.id) | .[0].id // empty")"
            if [[ -n "${RUN_ID}" ]]; then break; fi
            sleep 5
          done
          test -n "${RUN_ID}"
          echo "run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"

          BODY="HOSTINGER_NODEJS_BUILD_EVIDENCE_DISPATCH status=dispatched binding=${BINDING_ID} target_run_id=${RUN_ID} bridge_run_id=${GITHUB_RUN_ID} target_main_sha=${TARGET_MAIN_SHA} expected_production_sha=${EXPECTED_PRODUCTION_SHA} provider_get_only=true provider_mutation=false deployment=false restart=false secrets_included=false"
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPOSITORY}/issues/${CONTROL_ISSUE}/comments" \
            -f body="${BODY}"

      - name: Wait for target completion
        id: completion
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: ${{ steps.target.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          CONCLUSION=""
          for _ in $(seq 1 180); do
            STATUS="$(gh api "/repos/${REPOSITORY}/actions/runs/${TARGET_RUN_ID}" --jq '.status')"
            if [[ "${STATUS}" = "completed" ]]; then
              CONCLUSION="$(gh api "/repos/${REPOSITORY}/actions/runs/${TARGET_RUN_ID}" --jq '.conclusion')"
              break
            fi
            sleep 5
          done
          test -n "${CONCLUSION}"
          echo "conclusion=${CONCLUSION}" >> "${GITHUB_OUTPUT}"

      - name: Download and validate structured evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: ${{ steps.target.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_ID=""
          for _ in $(seq 1 30); do
            ARTIFACT_ID="$(gh api "/repos/${REPOSITORY}/actions/runs/${TARGET_RUN_ID}/artifacts?per_page=100" \
              --jq ".artifacts[] | select(.name == \"hostinger-nodejs-build-evidence-${TARGET_RUN_ID}\") | .id" | head -n 1)"
            if [[ -n "${ARTIFACT_ID}" ]]; then break; fi
            sleep 2
          done
          test -n "${ARTIFACT_ID}"

          EVIDENCE_DIR="${RUNNER_TEMP}/hostinger-nodejs-build-evidence"
          mkdir -p "${EVIDENCE_DIR}"
          gh api "/repos/${REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "${RUNNER_TEMP}/hostinger-nodejs-build-evidence.zip"
          unzip -q "${RUNNER_TEMP}/hostinger-nodejs-build-evidence.zip" -d "${EVIDENCE_DIR}"
          REPORT_PATH="$(find "${EVIDENCE_DIR}" -type f -name 'hostinger-nodejs-build-evidence.json' -print -quit)"
          test -n "${REPORT_PATH}"

          SUMMARY="$(node --input-type=module - "${REPORT_PATH}" "${EXPECTED_PRODUCTION_SHA}" "${PRODUCTION_MERGED_AT}" "${DOMAIN}" <<'NODE'
          import fs from 'node:fs';
          const [reportPath, expectedSha, mergedAt, domain] = process.argv.slice(2);
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const effects = report.side_effects || {};
          const valid =
            report.contract === 'mad4b.hostinger-nodejs-build-evidence.v1' &&
            report.identity?.expected_sha === expectedSha &&
            report.identity?.expected_branch === 'Production' &&
            report.identity?.production_merged_at === mergedAt &&
            report.identity?.domain === domain &&
            report.request?.method === 'GET' &&
            report.request?.token_returned === false &&
            report.secrets_included === false &&
            effects.repository_mutation_performed === false &&
            effects.provider_dispatch_performed === false &&
            effects.provider_mutation_performed === false &&
            effects.sql_execution_performed === false &&
            effects.migration_apply_performed === false &&
            effects.database_mutation_performed === false &&
            effects.restart_performed === false &&
            effects.external_send_performed === false;
          if (!valid) throw new Error('invalid Hostinger build evidence contract');
          const safe = (value) => String(value ?? 'none').replace(/[^A-Za-z0-9._:-]/g, '_').slice(0, 200);
          process.stdout.write(JSON.stringify({
            outcome: safe(report.outcome),
            classification: safe(report.classification),
            build_uuid: safe(report.latest_build_after_merge?.uuid),
            build_state: safe(report.latest_build_after_merge?.state),
            first_failure: safe(report.first_failure?.code),
            credential_access_performed: report.side_effects?.credential_access_performed === true,
          }));
          NODE
          )"

          echo "artifact_id=${ARTIFACT_ID}" >> "${GITHUB_OUTPUT}"
          echo "outcome=$(jq -r '.outcome' <<<"${SUMMARY}")" >> "${GITHUB_OUTPUT}"
          echo "classification=$(jq -r '.classification' <<<"${SUMMARY}")" >> "${GITHUB_OUTPUT}"
          echo "build_uuid=$(jq -r '.build_uuid' <<<"${SUMMARY}")" >> "${GITHUB_OUTPUT}"
          echo "build_state=$(jq -r '.build_state' <<<"${SUMMARY}")" >> "${GITHUB_OUTPUT}"
          echo "first_failure=$(jq -r '.first_failure' <<<"${SUMMARY}")" >> "${GITHUB_OUTPUT}"
          echo "credential_access_performed=$(jq -r '.credential_access_performed' <<<"${SUMMARY}")" >> "${GITHUB_OUTPUT}"

      - name: Record completed evidence result
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: ${{ steps.target.outputs.run_id }}
          TARGET_CONCLUSION: ${{ steps.completion.outputs.conclusion }}
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact_id }}
          OUTCOME: ${{ steps.evidence.outputs.outcome }}
          CLASSIFICATION: ${{ steps.evidence.outputs.classification }}
          BUILD_UUID: ${{ steps.evidence.outputs.build_uuid }}
          BUILD_STATE: ${{ steps.evidence.outputs.build_state }}
          FIRST_FAILURE: ${{ steps.evidence.outputs.first_failure }}
          CREDENTIAL_ACCESS_PERFORMED: ${{ steps.evidence.outputs.credential_access_performed }}
        shell: bash
        run: |
          set -euo pipefail
          BODY="HOSTINGER_NODEJS_BUILD_EVIDENCE_DISPATCH status=completed binding=${BINDING_ID} target_run_id=${TARGET_RUN_ID} target_conclusion=${TARGET_CONCLUSION} artifact_id=${ARTIFACT_ID} outcome=${OUTCOME} classification=${CLASSIFICATION} build_uuid=${BUILD_UUID} build_state=${BUILD_STATE} first_failure=${FIRST_FAILURE} credential_access_performed=${CREDENTIAL_ACCESS_PERFORMED} expected_production_sha=${EXPECTED_PRODUCTION_SHA} provider_get_only=true provider_mutation=false deployment=false restart=false sql=false migration_apply=false database_mutation=false external_send=false secrets_included=false issue_remains_open=true"
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPOSITORY}/issues/${CONTROL_ISSUE}/comments" \
            -f body="${BODY}"

      - name: Record fail-closed bridge outcome
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: ${{ steps.target.outputs.run_id }}
          TARGET_CONCLUSION: ${{ steps.completion.outputs.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          BODY="HOSTINGER_NODEJS_BUILD_EVIDENCE_DISPATCH status=failed binding=${BINDING_ID} bridge_run_id=${GITHUB_RUN_ID} target_run_id=${TARGET_RUN_ID:-unresolved} target_conclusion=${TARGET_CONCLUSION:-unknown} expected_production_sha=${EXPECTED_PRODUCTION_SHA} provider_get_only=true provider_mutation=false deployment=false restart=false sql=false migration_apply=false database_mutation=false external_send=false secrets_included=false issue_remains_open=true"
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPOSITORY}/issues/${CONTROL_ISSUE}/comments" \
            -f body="${BODY}"
