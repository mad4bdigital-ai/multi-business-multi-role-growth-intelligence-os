name: PR 6502 Current Main Reconcile
run-name: PR 6502 Conflict Diagnostic · ${{ github.sha }}

on:
  push:
    paths:
      - .github/workflows/pr6502-current-main-reconcile.yml

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-6502-current-main-reconcile
  cancel-in-progress: true

jobs:
  diagnose:
    name: Diagnose exact current-main merge conflicts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_PR: "6502"
      TARGET_BRANCH: fix/push-workflow-runner-context-registration-main-ba10f269-20260806
      AUTHORIZED_PARENT_SHA: 604594cf77485cffab15cba4f36b8837c6bc87e4
      EXPECTED_MAIN_SHA: 343e4a37ba8023311922b97483ff28988f7ef13d
      ONE_SHOT_PATH: .github/workflows/pr6502-current-main-reconcile.yml
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate exact PR head and main authority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REPOSITORY}" = "mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os"
          test "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "${AUTHORIZED_PARENT_SHA}"
          test "$(git diff --name-only HEAD^ HEAD | sort)" = "${ONE_SHOT_PATH}"
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}")"
          test "$(jq -r '.state' <<<"${pr_json}")" = "open"
          test "$(jq -r '.draft' <<<"${pr_json}")" = "true"
          test "$(jq -r '.head.sha' <<<"${pr_json}")" = "${GITHUB_SHA}"
          test "$(jq -r '.base.ref' <<<"${pr_json}")" = "main"
          test "$(jq -r '.head.repo.full_name' <<<"${pr_json}")" = "${GITHUB_REPOSITORY}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "${EXPECTED_MAIN_SHA}"

      - name: Reproduce merge and print exact conflict stages
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin "${EXPECTED_MAIN_SHA}"
          set +e
          git merge --no-commit --no-ff "${EXPECTED_MAIN_SHA}"
          merge_rc=$?
          set -e
          test "${merge_rc}" -ne 0

          expected="$(printf '%s\n' \
            '.github/workflows/ueacp-multi-domain-visibility-investigation-onboarding-log-collector.yml' \
            '.github/workflows/ueacp-production-agent.yml' \
            '.github/workflows/ueacp-production-e2e-validation-journey.yml' \
            '.github/workflows/ueacp-production-runtime-smoke.yml' \
            '.github/workflows/ueacp-runtime-secrets-provisioning.yml' | sort)"
          actual="$(git diff --name-only --diff-filter=U | sort)"
          printf '%s\n' "${actual}"
          test "${actual}" = "${expected}"

          while IFS= read -r file; do
            echo "===== CONFLICT ${file} ====="
            echo "--- stage blob ids (1=base 2=ours 3=main) ---"
            git ls-files -u -- "${file}"
            echo "--- combined conflict diff ---"
            git diff --cc --unified=40 -- "${file}" || true
            echo "--- base -> ours ---"
            diff -u <(git show ":1:${file}") <(git show ":2:${file}") || true
            echo "--- base -> main ---"
            diff -u <(git show ":1:${file}") <(git show ":3:${file}") || true
          done <<< "${actual}"

          echo "Diagnostic only: no merge resolution or remote write performed."
          exit 1
