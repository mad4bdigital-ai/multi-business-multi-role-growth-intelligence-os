name: Docs Agent Main Follow-up

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact current main SHA to process
        required: true
        type: string
      base_sha:
        description: Exact first-parent base SHA for the impact note
        required: true
        type: string

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: repository-generated-artifacts-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  dispatch-exact-main:
    name: Dispatch exact main follow-up writer
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Resolve live main and dispatch exact writer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_HEAD_SHA: ${{ github.sha }}
          EVENT_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          expected_head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "${expected_head_sha}" != "${EVENT_HEAD_SHA}" ]]; then
            echo "Docs follow-up dispatcher is stale: event=${EVENT_HEAD_SHA}, current_main=${expected_head_sha}. A newer main push owns follow-up generation."
            echo "stale_dispatch=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "stale_dispatch=false" >> "$GITHUB_OUTPUT"
          [[ "${EVENT_BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          gh workflow run docs-agent-main-followup.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f expected_head_sha="${expected_head_sha}" \
            -f base_sha="${EVENT_BASE_SHA}"
          echo "Dispatched Docs Agent Main Follow-up for exact main ${expected_head_sha}."

  main-followup-pr:
    name: Main follow-up impact-note PR
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Require trusted follow-up writer identity
        env:
          REPO_AUTOSYNC_TOKEN_PRESENT: ${{ secrets.REPO_AUTOSYNC_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REPO_AUTOSYNC_TOKEN_PRESENT" != "true" ]]; then
            echo "::error::REPO_AUTOSYNC_TOKEN is required before creating a Docs Agent follow-up."
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected_head_sha }}
          token: ${{ secrets.REPO_AUTOSYNC_TOKEN }}

      - name: Pin exact main source and safe target branch
        id: target
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          git fetch --no-tags origin main
          current_head_sha="$(git rev-parse origin/main)"
          if [[ "${current_head_sha}" != "${EXPECTED_HEAD_SHA}" ]]; then
            echo "Docs follow-up run is stale: expected=${EXPECTED_HEAD_SHA}, current_main=${current_head_sha}. A newer main head owns follow-up generation."
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "${current_head_sha}" = "${EXPECTED_HEAD_SHA}"
          echo "stale=false" >> "$GITHUB_OUTPUT"
          TARGET_BRANCH="docs-agent/${EXPECTED_HEAD_SHA}"
          case "${TARGET_BRANCH}" in
            main|Production)
              echo "Refusing protected target branch ${TARGET_BRANCH}."
              exit 1
              ;;
          esac
          echo "target_branch=${TARGET_BRANCH}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.target.outputs.stale != 'true'
        with:
          node-version: "22"

      - name: Validate inter-pipeline connectivity
        if: steps.target.outputs.stale != 'true'
        run: |
          node http-generic-api/scripts/pipeline-connectivity-check.mjs
          node http-generic-api/test-pipeline-connectivity-check.mjs

      - name: Generate docs impact note for exact main commit
        if: steps.target.outputs.stale != 'true'
        id: agent
        run: node http-generic-api/scripts/docs-agent-runner.mjs --write --mode push --base '${{ inputs.base_sha }}' --head '${{ inputs.expected_head_sha }}'

      - name: Refuse follow-up mutations outside impact notes
        if: steps.target.outputs.stale != 'true' && steps.agent.outputs.should_write == 'true'
        shell: bash
        run: |
          set -euo pipefail
          changed_files=()
          while IFS= read -r -d '' entry; do
            changed_files+=("${entry:3}")
          done < <(
            git status \
              --porcelain=v1 \
              -z \
              --untracked-files=all
          )

          if (( ${#changed_files[@]} == 0 )); then
            echo "No Docs Agent follow-up changes were generated."
            exit 0
          fi

          for file in "${changed_files[@]}"; do
            case "$file" in
              docs/auto-docs-agent/*.md)
                node .github/ops/generated-artifact-governance.mjs \
                  classify \
                  --owner docs_agent \
                  --path "$file" >/dev/null
                ;;
              *)
                echo "::error::Unexpected Docs Agent mutation: $file"
                exit 1
                ;;
            esac
          done

      - name: Create governed impact-note follow-up PR
        if: steps.target.outputs.stale != 'true' && steps.agent.outputs.should_write == 'true'
        id: create_followup
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          token: ${{ secrets.REPO_AUTOSYNC_TOKEN }}
          base: main
          branch: ${{ steps.target.outputs.target_branch }}
          delete-branch: true
          title: "Docs agent: impact note for ${{ inputs.expected_head_sha }}"
          commit-message: "docs(agent): record impact for ${{ inputs.expected_head_sha }}"
          add-paths: |
            docs/auto-docs-agent/**
          labels: |
            docs
            automated
          body: |
            <!-- docs-agent-followup-source:${{ inputs.expected_head_sha }} -->

            Automated impact-note follow-up for exact main commit `${{ inputs.expected_head_sha }}`.

            Source base: `${{ inputs.base_sha }}`.
            Scope is restricted to `docs/auto-docs-agent/**`.
            Generated note risk: `${{ steps.agent.outputs.risk }}`.
            Governance-finalizer candidate: `${{ steps.agent.outputs.auto_merge_candidate }}`.
            Native GitHub auto-merge is intentionally not registered. Derived State Closure and the Governance Finalizer own any automated merge decision.
            Work Maps are excluded and remain owned by the governed Spec Kit Work Map Autofix writer.

      - name: Record governance-finalizer eligibility for safe impact notes
        if: >-
          steps.target.outputs.stale != 'true' &&
          steps.agent.outputs.should_write == 'true' &&
          steps.create_followup.outputs.pull-request-number != '' &&
          steps.agent.outputs.auto_merge_candidate == 'true'
        env:
          GH_TOKEN: ${{ secrets.REPO_AUTOSYNC_TOKEN }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          PR_NUMBER: ${{ steps.create_followup.outputs.pull-request-number }}
        shell: bash
        run: |
          set -euo pipefail
          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main_sha" != "$EXPECTED_HEAD_SHA" ]]; then
            gh pr close "$PR_NUMBER" --comment "Closing stale Docs Agent follow-up: main moved from ${EXPECTED_HEAD_SHA} to ${current_main_sha} before governance finalization."
            echo "Refused stale Docs Agent finalization."
            exit 0
          fi
          pr_head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          [[ "$pr_head_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "Docs Agent PR ${PR_NUMBER} head ${pr_head_sha} is eligible for governance finalization after Derived State Closure; native auto-merge remains disabled."

      - name: Record manual-review requirement
        if: >-
          steps.target.outputs.stale != 'true' &&
          steps.agent.outputs.should_write == 'true' &&
          steps.create_followup.outputs.pull-request-number != '' &&
          steps.agent.outputs.auto_merge_candidate != 'true'
        shell: bash
        run: |
          echo "Generated note requires manual review. Review is required."
