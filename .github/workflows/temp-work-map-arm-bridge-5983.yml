name: TEMP Work Map ARM Preflight 5983

on:
  pull_request:
    branches:
      - gpt/work-map-arm-bridge-5983-base-a61cd9e8
    types: [opened, reopened, synchronize]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  preflight:
    name: Read exact PR 5983 bridge preconditions
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      CANONICAL_PR: '5983'
      EXPECTED_MAIN_SHA: a61cd9e83070618001676bbc679bc937f0551875
      EXPECTED_HEAD_SHA: 217a5375a989d62a16102cb3c1c409466962f850
      EXPECTED_HEAD_REF: gpt/work-map-post-write-exact-observable-dispatch-a61cd9e8-v2-20260804
      AUTHORIZATION_MARKER: '<!-- work-map-autofix:authorized -->'
    steps:
      - name: Read all bridge preconditions without mutation
        id: readback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.repo.full_name }}" = "${GITHUB_REPOSITORY}"
          test "${{ github.event.pull_request.head.ref }}" = "gpt/trigger-work-map-arm-bridge-5983"

          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${CANONICAL_PR}")"
          state="$(jq -r '.state' <<<"${pr}")"
          draft="$(jq -r '.draft' <<<"${pr}")"
          base_ref="$(jq -r '.base.ref' <<<"${pr}")"
          base_sha="$(jq -r '.base.sha' <<<"${pr}")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"${pr}")"
          head_ref="$(jq -r '.head.ref' <<<"${pr}")"
          head_sha="$(jq -r '.head.sha' <<<"${pr}")"
          body="$(jq -r '.body // ""' <<<"${pr}")"
          marker_present=false
          if grep -Fq "${AUTHORIZATION_MARKER}" <<<"${body}"; then marker_present=true; fi

          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          comparison="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${EXPECTED_HEAD_SHA}")"
          behind_by="$(jq -r '.behind_by' <<<"${comparison}")"
          merge_base="$(jq -r '.merge_base_commit.sha' <<<"${comparison}")"

          autofix_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/spec-kit-work-map-autofix.yml" --jq '.state' 2>&1 || true)"
          integration_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/spec-kit-work-map-integration.yml" --jq '.state' 2>&1 || true)"
          ci_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml" --jq '.state' 2>&1 || true)"

          body_out="WORK_MAP_ARM_PREFLIGHT_5983 state=${state} draft=${draft} base_ref=${base_ref} base_sha=${base_sha} head_repo=${head_repo} head_ref=${head_ref} head_sha=${head_sha} current_main=${current_main} behind_by=${behind_by} merge_base=${merge_base} marker_present=${marker_present} autofix_state=${autofix_state} integration_state=${integration_state} ci_state=${ci_state} expected_main=${EXPECTED_MAIN_SHA} expected_head=${EXPECTED_HEAD_SHA} mutation=false"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${CANONICAL_PR}/comments" -f body="${body_out}"

          test "${state}" = 'open'
          test "${draft}" = 'false'
          test "${base_ref}" = 'main'
          test "${base_sha}" = "${EXPECTED_MAIN_SHA}"
          test "${head_repo}" = "${GITHUB_REPOSITORY}"
          test "${head_ref}" = "${EXPECTED_HEAD_REF}"
          test "${head_sha}" = "${EXPECTED_HEAD_SHA}"
          test "${current_main}" = "${EXPECTED_MAIN_SHA}"
          test "${behind_by}" = '0'
          test "${merge_base}" = "${EXPECTED_MAIN_SHA}"
          test "${marker_present}" = 'true'
          test "${autofix_state}" = 'active'
          test "${integration_state}" = 'active'
          test "${ci_state}" = 'active'
