name: TEMP Work Map ARM Bridge 5983 RUNNER_TEMP

on:
  pull_request:
    branches:
      - gpt/work-map-arm-bridge-5983-base-a61cd9e8
    types: [opened, reopened, synchronize]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  dispatch:
    name: Validate PR 5983 RUNNER_TEMP repair and dispatch writer
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      CANONICAL_PR: '5983'
      EXPECTED_MAIN_SHA: a61cd9e83070618001676bbc679bc937f0551875
      EXPECTED_HEAD_SHA: 0c0b18017388e622c9ac690ae43dd184f79cdf43
      EXPECTED_HEAD_REF: gpt/work-map-post-write-exact-observable-dispatch-a61cd9e8-v2-20260804
      AUTHORIZATION_MARKER: '<!-- work-map-autofix:authorized -->'
    steps:
      - name: Validate identity, consume marker, and dispatch candidate writer
        id: bridge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.repo.full_name }}" = "${GITHUB_REPOSITORY}"
          test "${{ github.event.pull_request.head.ref }}" = "gpt/trigger-work-map-arm-bridge-5983"
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${CANONICAL_PR}")"
          test "$(jq -r '.state' <<<"${pr}")" = 'open'
          test "$(jq -r '.draft' <<<"${pr}")" = 'false'
          test "$(jq -r '.base.sha' <<<"${pr}")" = "${EXPECTED_MAIN_SHA}"
          test "$(jq -r '.head.ref' <<<"${pr}")" = "${EXPECTED_HEAD_REF}"
          test "$(jq -r '.head.sha' <<<"${pr}")" = "${EXPECTED_HEAD_SHA}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "${EXPECTED_MAIN_SHA}"
          comparison="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${EXPECTED_HEAD_SHA}")"
          test "$(jq -r '.behind_by' <<<"${comparison}")" = '0'
          test "$(jq -r '.merge_base_commit.sha' <<<"${comparison}")" = "${EXPECTED_MAIN_SHA}"
          body="$(jq -r '.body // ""' <<<"${pr}")"
          grep -Fq "${AUTHORIZATION_MARKER}" <<<"${body}"
          for workflow in spec-kit-work-map-autofix.yml spec-kit-work-map-integration.yml ci.yml; do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}" --jq '.state')"
            if [[ "${state}" != 'active' ]]; then gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/enable"; fi
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}" --jq '.state')" = 'active'
          done
          current="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${CANONICAL_PR}")"
          test "$(jq -r '.head.sha' <<<"${current}")" = "${EXPECTED_HEAD_SHA}"
          current_body="$(jq -r '.body // ""' <<<"${current}")"
          grep -Fq "${AUTHORIZATION_MARKER}" <<<"${current_body}"
          next_body="${current_body//${AUTHORIZATION_MARKER}/}"
          payload="${RUNNER_TEMP}/consume-marker.json"
          jq -n --arg body "${next_body}" '{body:$body}' > "${payload}"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${CANONICAL_PR}" --input "${payload}" >/dev/null
          if gh api "repos/${GITHUB_REPOSITORY}/pulls/${CANONICAL_PR}" --jq '.body // ""' | grep -Fq "${AUTHORIZATION_MARKER}"; then exit 1; fi
          started="$(date -u -d '5 seconds ago' +'%Y-%m-%dT%H:%M:%SZ')"
          writer_payload="${RUNNER_TEMP}/writer-dispatch.json"
          jq -n --arg ref "${EXPECTED_HEAD_REF}" --arg branch "${EXPECTED_HEAD_REF}" --arg expected_head_sha "${EXPECTED_HEAD_SHA}" '{ref:$ref,inputs:{branch:$branch,expected_head_sha:$expected_head_sha}}' > "${writer_payload}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/spec-kit-work-map-autofix.yml/dispatches" --input "${writer_payload}"
          delegated=''
          for _ in $(seq 1 30); do
            delegated="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/spec-kit-work-map-autofix.yml/runs?event=workflow_dispatch&branch=${EXPECTED_HEAD_REF}&per_page=30" --jq "[.workflow_runs[] | select(.created_at >= \"${started}\" and .head_sha == \"${EXPECTED_HEAD_SHA}\")] | sort_by(.created_at) | last | .id // empty")"
            if [[ -n "${delegated}" ]]; then break; fi
            sleep 2
          done
          [[ "${delegated}" =~ ^[1-9][0-9]*$ ]]
          echo "delegated_run_id=${delegated}" >> "$GITHUB_OUTPUT"

      - name: Publish canonical PR evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DELEGATED_RUN_ID: ${{ steps.bridge.outputs.delegated_run_id }}
        run: |
          outcome='passed'; if [[ "${{ steps.bridge.outcome }}" != 'success' ]]; then outcome='blocked'; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${CANONICAL_PR}/comments" -f body="WORK_MAP_ARM_BRIDGE_5983_RUNNER_TEMP outcome=${outcome} expected_head_sha=${EXPECTED_HEAD_SHA} authorization_consumed=$([[ '${{ steps.bridge.outcome }}' == 'success' ]] && echo true || echo false) delegated_run_id=${DELEGATED_RUN_ID:-none}"
