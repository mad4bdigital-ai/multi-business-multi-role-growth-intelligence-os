name: PR 5292 Exact Head Core CI

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/pr5292-exact-head-core-ci.yml

permissions:
  contents: write

concurrency:
  group: pr5292-exact-head-core-ci
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.repository == 'mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/pr5210-surface-source-clean-20260803' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      TARGET_BRANCH: gpt/pr5210-surface-source-clean-20260803
      BASE_SHA: 5db9f992ff42b136fbac88f9191949a7e31ffbf0
      WORKFLOW_PATH: .github/workflows/pr5292-exact-head-core-ci.yml

    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact synchronized bounded trigger
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "${BASE_SHA}"
          git merge-base --is-ancestor "${BASE_SHA}" HEAD
          test "$(git rev-parse --abbrev-ref HEAD)" = "${TARGET_BRANCH}"
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "${WORKFLOW_PATH}"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            http-generic-api/package-lock.json

      - name: Syntax and governance gates
        shell: bash
        run: |
          set -Eeuo pipefail
          node http-generic-api/scripts/schema-docs-change-guard.mjs
          node http-generic-api/scripts/migration-placement-guard.mjs
          (cd http-generic-api && node scripts/user-jwt-auth-governance.mjs)
          (cd http-generic-api && node scripts/interruption-readiness.mjs --ci --skip-dependencies --skip-worktree)
          node validate-canonical-sources.mjs
          node build-canonicals.mjs --check
          node --check find-canonical-domain.mjs
          (cd http-generic-api && node scripts/resource-api-coverage-audit.mjs --ci --changed)
          (cd http-generic-api && node test-resource-api-architecture.mjs && node test-resource-api-service.mjs)
          node http-generic-api/scripts/spec-kit-completion-gate.mjs --ci --changed
          node validate-memory-schema.mjs
          git diff --check
          (cd http-generic-api && set -e; shopt -s nullglob; for f in *.js *.mjs routes/*.js scripts/*.mjs wordpress/*.js; do node --check "$f"; done)

      - name: Install HTTP API dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Context Kernel ratchet
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --name-only "${BASE_SHA}"...HEAD > "$RUNNER_TEMP/context-kernel-changed-files.txt"
          cd http-generic-api
          node scripts/context-kernel-hardcoding-scan.mjs --fail-on=runtime --changed-files-from="$RUNNER_TEMP/context-kernel-changed-files.txt"

      - name: Unit and integration gates
        working-directory: http-generic-api
        env:
          TEST_SUITE_REPORT_DIR: ${{ runner.temp }}/test-suite-reports
          FORCE_ROUTE_RUNTIME_TESTS: 'true'
          DEPLOYMENT_BRANCH: gpt/pr5210-surface-source-clean-20260803
          DEPLOYMENT_COMMIT_SHA: ${{ github.sha }}
        run: |
          node test-user-jwt-auth.mjs
          node test-connect-secret-boundary.mjs
          node test-tenant-connect-bootstrap-transaction.mjs
          node test-tenant-connection-self-repair-routes.mjs
          node scripts/interruption-readiness.mjs --ci --skip-merge --skip-worktree --report-file "$RUNNER_TEMP/interruption-readiness-baseline.json"
          npm test
          node test-deployment-manifest-generator.mjs
          npm run manifest:deployment
          node test-server-startup-smoke.mjs
          node test-custom-gpt-schemas.mjs
          node test-tenant-activation-contract-inventory-parity.mjs
          node test-activation-lifecycle-contract-foundation.mjs
          node test-activation-lifecycle-state-machine.mjs
          node test-activation-lifecycle-operation-service.mjs
          node test-activation-reconnect-guidance-policy.mjs
          node test-activation-contract-finalization.mjs
          node test-activation-operation-projection-foundation.mjs
          node test-activation-operation-persistence-repository.mjs
          node test-activation-delivery-acknowledgement-repository.mjs
          node test-openapi-split-governance.mjs
          node test-openapi-split-regeneration-parity.mjs
          node test-local-connector-capability-installer-grants.mjs
          node scripts/interruption-readiness.mjs --ci --skip-dependencies --skip-merge --skip-worktree --verify-evidence "$RUNNER_TEMP/interruption-readiness-baseline.json"

      - name: Execution Resolver Gate
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run typecheck
          npm test -- --runInBand
          test -f src/services/execution/dispatchPlanStep.ts
          test -f src/services/connectors/execution/resolveConnectorExecutor.ts
          test -f src/store/registries/connectorExecutorRegistry.ts
          grep -R "resolveConnectorExecutor" src/services/execution src/services/connectors/execution tests/unit
          grep -R "approval_required" src/store/registries src/services/connectors/execution tests/unit

      - name: Architecture Drift Detection
        working-directory: http-generic-api
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run validate
          MODULES="normalization mutationGovernance governedChangeControl jobRunner jobUtils executionRouting auth"
          FAIL=0
          for mod in $MODULES; do
            if [ ! -f "${mod}.js" ]; then continue; fi
            EXPORTS=$(grep "^export function\|^export async function" "${mod}.js" | sed 's/export \(async \)\?function //;s/(.*//')
            for fn in $EXPORTS; do
              if grep -qE "^(async )?function ${fn}\b" server.js; then
                echo "DRIFT: '${fn}' is exported from ${mod}.js but also defined inline in server.js"
                FAIL=1
              fi
            done
          done
          test "$FAIL" -eq 0

      - name: Restore product tree and remove temporary workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git reset --hard HEAD
          git clean -fd
          rm "${WORKFLOW_PATH}"
          mapfile -t changed < <(git status --porcelain --untracked-files=all | sed -E 's/^...//' | sed -E 's/.* -> /')
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "${WORKFLOW_PATH}"

      - name: Commit exact product-only head
        shell: bash
        run: |
          set -Eeuo pipefail
          before="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$before" = "$(git rev-parse HEAD)"
          git config user.name 'mad4bdigital-ai'
          git config user.email 'mad4bdigital-ai@users.noreply.github.com'
          git add -A
          git commit -m 'ci: certify PR 5292 core gates on exact product tree'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "$(git rev-parse HEAD)"
          test ! -e "${WORKFLOW_PATH}"
