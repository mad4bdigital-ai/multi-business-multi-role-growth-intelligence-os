name: Work Map Final Refresh Clean V2

on:
  push:
    branches:
      - gpt/work-map-final-refresh-clean-6caea6-v2-20260804
    paths:
      - .github/workflows/work-map-final-refresh-clean-v2.yml

permissions:
  contents: write

concurrency:
  group: work-map-final-refresh-clean-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact launcher
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "6caea6ca1267a45b8218a9b89af78e2151a3ea02"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/work-map-final-refresh-clean-v2.yml"
          node http-generic-api/test-work-map-autofix-validation-diagnostics.mjs

      - name: Remove launcher and generate final tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/work-map-final-refresh-clean-v2.yml
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          first_hash="$(git diff --binary -- docs/work-maps | sha256sum | awk '{print $1}')"
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          second_hash="$(git diff --binary -- docs/work-maps | sha256sum | awk '{print $1}')"
          test "$first_hash" = "$second_hash"
          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            --spec-dir specs/014-governed-hostinger-storage-orchestration \
            --write
          unexpected="$(git diff --name-only | grep -Ev '^(docs/work-maps/|specs/014-governed-hostinger-storage-orchestration/work-map-integration.json$|\.github/workflows/work-map-final-refresh-clean-v2.yml$)' || true)"
          test -z "$unexpected"
          git diff --check

      - name: Validate and publish
        shell: bash
        env:
          BRANCH: gpt/work-map-final-refresh-clean-6caea6-v2-20260804
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          REPORT_PATH="$RUNNER_TEMP/spec014-final-clean-v2.json" \
            node http-generic-api/scripts/spec014-final-work-map-readback.mjs
          node - "$RUNNER_TEMP/spec014-final-clean-v2.json" <<'NODE'
          const fs = require('node:fs');
          const r = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (r.ok !== true || (r.findings || []).length !== 0) throw new Error('readback_failed');
          if (r.classification?.ok !== true || r.classification?.coverage_percent !== 100) throw new Error('classification_failed');
          if (r.provider_dispatch !== false || r.live_database_access !== false || r.migration_apply !== false || r.secrets_included !== false) throw new Error('safety_failed');
          NODE
          test "$(git rev-parse HEAD)" = "$EVENT_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/work-maps specs/014-governed-hostinger-storage-orchestration/work-map-integration.json
          git add -u .github/workflows/work-map-final-refresh-clean-v2.yml
          for path in $(git diff --cached --name-only); do
            if [[ "$path" != ".github/workflows/work-map-final-refresh-clean-v2.yml" && "$path" != docs/work-maps/* && "$path" != "specs/014-governed-hostinger-storage-orchestration/work-map-integration.json" ]]; then exit 1; fi
          done
          git diff --cached --check
          git commit -m 'docs(work-maps): refresh final synchronized maps and binding'
          test "$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')" = "$EVENT_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"
