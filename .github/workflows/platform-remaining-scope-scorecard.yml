name: Platform Remaining Scope Scorecard

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "31 3 * * *"

permissions:
  contents: read

concurrency:
  group: platform-remaining-scope-scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: Remaining scope static scorecard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Generate remaining scope scorecard
        run: |
          set -e
          node http-generic-api/scripts/platform-remaining-scope-scorecard.mjs | tee platform-remaining-scope-scorecard.json

      - name: Publish scorecard summary
        if: always()
        run: |
          {
            echo "## Platform Remaining Scope Scorecard"
            echo
            if [ -f docs/auto-platform-scorecard/latest.md ]; then
              cat docs/auto-platform-scorecard/latest.md
            else
              echo "Scorecard markdown was not generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scorecard artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-remaining-scope-scorecard
          path: |
            platform-remaining-scope-scorecard.json
            docs/auto-platform-scorecard/latest.json
            docs/auto-platform-scorecard/latest.md
          if-no-files-found: warn
