name: Platform Remaining Scope Scorecard

on:
  workflow_dispatch:
  pull_request:
    branches: [main, Production]
  push:
    branches: [main, Production]
  schedule:
    - cron: "31 3 * * *"

permissions:
  contents: read

concurrency:
  group: platform-remaining-scope-scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: Remaining scope static scorecard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Verify fail-closed workflow contract
        run: node http-generic-api/test-platform-static-readback-fail-closed.mjs

      - name: Generate remaining scope scorecard
        run: |
          set -euo pipefail
          node http-generic-api/scripts/platform-remaining-scope-scorecard.mjs | tee platform-remaining-scope-scorecard.json
          test -s platform-remaining-scope-scorecard.json
          test -s docs/auto-platform-scorecard/latest.json
          test -s docs/auto-platform-scorecard/latest.md
          node -e '
            const fs = require("node:fs");
            const stdoutResult = JSON.parse(fs.readFileSync("platform-remaining-scope-scorecard.json", "utf8"));
            const generatedResult = JSON.parse(fs.readFileSync("docs/auto-platform-scorecard/latest.json", "utf8"));
            if (stdoutResult.ok !== true || generatedResult.ok !== true) {
              console.error("Remaining-scope scorecard did not pass", { stdoutResult, generatedResult });
              process.exit(1);
            }
          '

      - name: Publish scorecard summary
        if: always()
        run: |
          {
            echo "## Platform Remaining Scope Scorecard"
            echo
            if [ -s docs/auto-platform-scorecard/latest.md ]; then
              cat docs/auto-platform-scorecard/latest.md
            else
              echo "Scorecard markdown was not generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scorecard artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platform-remaining-scope-scorecard
          path: |
            platform-remaining-scope-scorecard.json
            docs/auto-platform-scorecard/latest.json
            docs/auto-platform-scorecard/latest.md
          if-no-files-found: error
