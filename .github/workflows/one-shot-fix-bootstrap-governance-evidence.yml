name: One-shot Bootstrap Governance Evidence Fix

on:
  push:
    branches:
      - gpt/reconciliation-lease-control-surface-v2-20260730
    paths:
      - .github/workflows/one-shot-fix-bootstrap-governance-evidence.yml

permissions:
  contents: write

concurrency:
  group: one-shot-bootstrap-governance-evidence-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governed branch
        uses: actions/checkout@v5
        with:
          ref: gpt/reconciliation-lease-control-surface-v2-20260730
          fetch-depth: 0

      - name: Patch exact SQL evidence literals
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("http-generic-api/scripts/frontend-operation-governance-generator.mjs")
          source = path.read_text(encoding="utf-8")
          replacements = [
              (
                  'const connectionMutation = "INSERT INTO \\`tenant_backend_connections\\`";',
                  'const connectionMutation = "INSERT INTO \\\\`tenant_backend_connections\\\\`";',
              ),
              (
                  'transactionBlock.includes("INSERT INTO \\`tenants\\`")',
                  'transactionBlock.includes("INSERT INTO \\\\`tenants\\\\`")',
              ),
              (
                  'transactionBlock.includes("INSERT INTO \\`memberships\\`")',
                  'transactionBlock.includes("INSERT INTO \\\\`memberships\\\\`")',
              ),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match for {old!r}, found {count}")
              source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8")
          PY

      - name: Verify syntax and exact diff
        shell: bash
        run: |
          node --check http-generic-api/scripts/frontend-operation-governance-generator.mjs
          git diff --check
          git diff -- http-generic-api/scripts/frontend-operation-governance-generator.mjs

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/one-shot-fix-bootstrap-governance-evidence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add http-generic-api/scripts/frontend-operation-governance-generator.mjs .github/workflows/one-shot-fix-bootstrap-governance-evidence.yml
          git commit -m "fix(governance): match escaped bootstrap SQL literals"
          git push origin HEAD:gpt/reconciliation-lease-control-surface-v2-20260730
