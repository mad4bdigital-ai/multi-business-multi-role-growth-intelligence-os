name: PR 1569 Finalize

on:
  push:
    branches:
      - gpt/automation-intelligence-guard-v2
    paths:
      - ".github/pr1569-patches/**"
      - ".github/workflows/pr1569-finalize.yml"

permissions:
  contents: write

concurrency:
  group: pr1569-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Reconstruct and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/pr1569-patches/gzpart-01.b64 \
            .github/pr1569-patches/gzpart-02.b64 \
            .github/pr1569-patches/gzpack-03-06.b64 \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/pr1569-final.patch
          sed -i 's/\r$//' /tmp/pr1569-final.patch
          git apply --index --3way \
            --exclude='GPT_Tenant_Connector_Instructions.md' \
            --exclude='GPT_Tenant_Connector_Knowledge.md' \
            --exclude='http-generic-api/routes/localConnectorInstallRoutes.js' \
            /tmp/pr1569-final.patch
          cat .github/pr1569-patches/supp-01.b64 \
              .github/pr1569-patches/supp-02.b64 \
              .github/pr1569-patches/supp-03.b64 \
              .github/pr1569-patches/supp-04.b64 \
            | base64 --decode > /tmp/pr1569-supplemental.zip
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import zipfile

          root = Path.cwd().resolve()
          with zipfile.ZipFile('/tmp/pr1569-supplemental.zip') as archive:
              for entry in archive.infolist():
                  normalized = entry.filename.replace('\\', '/')
                  relative = PurePosixPath(normalized)
                  if relative.is_absolute() or not relative.parts or any(part in {'', '..'} for part in relative.parts):
                      raise RuntimeError(f'Unsafe archive path: {entry.filename}')
                  target = root.joinpath(*relative.parts).resolve()
                  if target != root and root not in target.parents:
                      raise RuntimeError(f'Archive path escaped repository: {entry.filename}')
                  if entry.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(archive.read(entry))
          PY
          git add \
            GPT_Tenant_Connector_Instructions.md \
            GPT_Tenant_Connector_Knowledge.md \
            http-generic-api/routes/localConnectorInstallRoutes.js

      - name: Regenerate governed artifacts
        shell: bash
        run: |
          set -euo pipefail
          node build-canonicals.mjs
          cd http-generic-api
          npm ci --ignore-scripts
          node scripts/update-repo-planning-docs.mjs
          node scripts/platform-work-map-generator.mjs --write
          node scripts/repo-maintenance-sync.mjs --write

      - name: Run focused governance and regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd http-generic-api
          node scripts/automation-intelligence-guard.mjs
          node test-automation-intelligence-guard.mjs
          node test-agent-prompt-enrichment.mjs
          node test-agent-governance-runtime.mjs
          node test-agent-governance-admin-tool-registry.mjs
          node test-agent-tool-authorization-gate.mjs
          node test-supervisor-runtime-readiness.mjs
          node test-supervisor-chain-runtime-guards.mjs
          node test-governed-migration-reconciler-structured-log.mjs
          node test-interruption-verification-recovery.mjs
          node test-repo-maintenance-sync.mjs
          node test-surface-contract-discovery.mjs
          node test-surface-contract-governance-loop.mjs
          node test-openapi-split-regeneration-parity.mjs
          node test-openapi-route-coverage.mjs

      - name: Commit and push finalized product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --ignore-unmatch \
            .github/pr1569-patches \
            .github/workflows/pr1569-finalize.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No finalized product changes to commit."
            exit 1
          fi
          git commit -m "Finalize PR 1569 automation intelligence reconciliation"
          git push origin HEAD:gpt/automation-intelligence-guard-v2
