name: Patch OAuth Production Dependencies Current Main

on:
  pull_request:
    branches:
      - gpt/patch-oauth-deps-current-main-base
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: patch-oauth-production-deps-current-main-v2
  cancel-in-progress: false

jobs:
  patch:
    name: Apply bounded OAuth dependency composition patch
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/spec012-oauth-production-deps-0ccfc93b-20260804' &&
      github.event.pull_request.head.sha == '5644da3a793e131f9adc62828097958f0fe92a83'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      MAIN_SHA: 0ccfc93b64b70c65df423d141f91861fba0b1d4e
      OLD_BASE_SHA: 67cb77cffe94544b1b5d70997506afb4e75c3846
      SOURCE_SHA: 3861a123e3e761c52a10febf5e100a99dcd077a0
      TRIGGER_SHA: 5644da3a793e131f9adc62828097958f0fe92a83
      TARGET_BRANCH: gpt/spec012-oauth-production-deps-0ccfc93b-20260804
      SOURCE_BRANCH: gpt/spec012-oauth-production-deps-67cb77cf-20260804
      MARKER_PATH: .github/validation/patch-oauth-production-deps-current-main-v2.txt
      REPORT_DIR: .artifacts/oauth-current-main-writer
    steps:
      - name: Checkout exact target trigger
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable inputs and no OAuth overlap
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ github.event.pull_request.head.sha }}" = "$TRIGGER_SHA"
          test "$(git rev-parse HEAD)" = "$TRIGGER_SHA"
          test -f "$MARKER_PATH"
          grep -Fxq 'PATCH_OAUTH_PRODUCTION_DEPS_CURRENT_MAIN_V2' "$MARKER_PATH"
          grep -Fxq "base_sha=$MAIN_SHA" "$MARKER_PATH"
          grep -Fxq "source_sha=$SOURCE_SHA" "$MARKER_PATH"

          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/target" \
            "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/source"

          test "$(git rev-parse refs/remotes/origin/main)" = "$MAIN_SHA"
          test "$(git rev-parse refs/remotes/origin/target)" = "$TRIGGER_SHA"
          test "$(git rev-parse refs/remotes/origin/source)" = "$SOURCE_SHA"
          test "$(git rev-parse ${SOURCE_SHA}^1)" = "$OLD_BASE_SHA"
          git merge-base --is-ancestor "$OLD_BASE_SHA" "$MAIN_SHA"

          expected=(
            .changes/e2e/spec012-oauth-production-dependency-composition.json
            http-generic-api/routes/index.js
            http-generic-api/test-spec012-t031-oauth-token-route-wiring.mjs
          )
          mapfile -t source_delta < <(git diff --name-only "$OLD_BASE_SHA" "$SOURCE_SHA" | sort)
          test "${#source_delta[@]}" -eq 3
          test "$(printf '%s\n' "${source_delta[@]}")" = "$(printf '%s\n' "${expected[@]}" | sort)"

          mapfile -t main_delta < <(git diff --name-only "$OLD_BASE_SHA" "$MAIN_SHA" | sort)
          for path in "${expected[@]}"; do
            if printf '%s\n' "${main_delta[@]}" | grep -Fxq "$path"; then
              echo "Current main overlaps reviewed OAuth path: $path" >&2
              exit 1
            fi
          done
          mkdir -p "$REPORT_DIR"
          printf '%s\n' "${main_delta[@]}" > "$REPORT_DIR/main-delta.txt"
          printf 'overlap_result=pass\nmain_sha=%s\nsource_sha=%s\n' "$MAIN_SHA" "$SOURCE_SHA" > "$REPORT_DIR/identity.txt"

      - name: Apply exact reviewed three-file patch
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$REPORT_DIR"
          trap 'status=$?; { echo "status=$status"; echo "line=$LINENO"; echo "command=$BASH_COMMAND"; echo "head=$(git rev-parse HEAD)"; echo "main=$MAIN_SHA"; echo "git_status:"; git status --short; echo "name_status:"; git diff --name-status "$MAIN_SHA"; echo "numstat:"; git diff --numstat "$MAIN_SHA"; } | tee "$REPORT_DIR/apply-failure.txt"; exit "$status"' ERR

          paths=(
            .changes/e2e/spec012-oauth-production-dependency-composition.json
            http-generic-api/routes/index.js
            http-generic-api/test-spec012-t031-oauth-token-route-wiring.mjs
          )
          for path in "${paths[@]}"; do
            echo "Applying reviewed blob: $path"
            mkdir -p "$(dirname "$path")"
            git show "$SOURCE_SHA:$path" > "$path"
            source_blob="$(git rev-parse "$SOURCE_SHA:$path")"
            applied_blob="$(git hash-object "$path")"
            test "$applied_blob" = "$source_blob"
          done
          git add -N "${paths[0]}"
          rm "$MARKER_PATH"

          mapfile -t changed < <(git diff --name-only "$MAIN_SHA" | sort)
          printf 'Changed files relative to pinned main:\n%s\n' "$(printf '%s\n' "${changed[@]}")"
          test "${#changed[@]}" -eq 3
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${paths[@]}" | sort)"
          grep -Fq 'app.use(buildTenantGptOAuthMetadataRoutes(deps));' http-generic-api/routes/index.js
          if grep -Fq 'app.use(buildTenantGptOAuthMetadataRoutes());' http-generic-api/routes/index.js; then
            echo 'Stale dependency-free production mount remains.' >&2
            exit 1
          fi
          routes_stat="$(git diff --numstat "$MAIN_SHA" -- http-generic-api/routes/index.js | awk '{print $1":"$2}')"
          wiring_stat="$(git diff --numstat "$MAIN_SHA" -- http-generic-api/test-spec012-t031-oauth-token-route-wiring.mjs | awk '{print $1":"$2}')"
          echo "routes_stat=$routes_stat"
          echo "wiring_stat=$wiring_stat"
          test "$routes_stat" = '1:1'
          test "$wiring_stat" = '1:1'
          printf 'apply_result=pass\n' > "$REPORT_DIR/apply-result.txt"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install HTTP Generic API dependencies
        working-directory: http-generic-api
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run focused OAuth composition regressions
        working-directory: http-generic-api
        run: |
          set -Eeuo pipefail
          node --check routes/index.js
          node --check test-spec012-t031-oauth-token-route-wiring.mjs
          node test-spec012-t031-oauth-token-route-wiring.mjs
          node test-tenant-gpt-oauth-token-exchange-routes.mjs
          node test-auth-oauth-routes.mjs
          node test-chatgpt-mcp-metadata-routing.mjs

      - name: Validate reviewed E2E contract and references
        shell: bash
        run: |
          set -Eeuo pipefail
          node -e "JSON.parse(require('node:fs').readFileSync('.changes/e2e/spec012-oauth-production-dependency-composition.json','utf8'))"
          node http-generic-api/test-e2e-contract-reference-integrity.mjs
          mkdir -p "$REPORT_DIR"
          node http-generic-api/scripts/e2e-contract-reference-integrity.mjs \
            --base "$OLD_BASE_SHA" \
            --head "$SOURCE_SHA" \
            --report-file "$REPORT_DIR/e2e-reference.json"

      - name: Commit and push exact product result
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t changed < <(git diff --name-only "$MAIN_SHA" | sort)
          expected=(
            .changes/e2e/spec012-oauth-production-dependency-composition.json
            http-generic-api/routes/index.js
            http-generic-api/test-spec012-t031-oauth-token-route-wiring.mjs
          )
          test "${#changed[@]}" -eq 3
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected[@]}" | sort)"

          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/target"
          test "$(git rev-parse refs/remotes/origin/main)" = "$MAIN_SHA"
          test "$(git rev-parse refs/remotes/origin/target)" = "$TRIGGER_SHA"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${expected[@]}" "$MARKER_PATH"
          git commit -m 'fix(spec-012): forward production OAuth dependencies on current main'
          FINAL_SHA="$(git rev-parse HEAD)"
          test "$(git rev-parse ${FINAL_SHA}^1)" = "$TRIGGER_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

          readback="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$readback" = "$FINAL_SHA"
          mkdir -p "$REPORT_DIR"
          jq -n \
            --arg contract 'oauth_current_main_writer.v2' \
            --arg main_sha "$MAIN_SHA" \
            --arg source_sha "$SOURCE_SHA" \
            --arg trigger_sha "$TRIGGER_SHA" \
            --arg final_sha "$FINAL_SHA" \
            '{
              contract: $contract,
              result: "pass",
              main_sha: $main_sha,
              source_sha: $source_sha,
              trigger_sha: $trigger_sha,
              final_sha: $final_sha,
              changed_files: 3,
              focused_oauth_tests: "pass",
              force_push: false,
              protected_ref_mutated: false,
              production_mutated: false,
              migration_apply_executed: false,
              provider_call_executed: false,
              credential_payload_accessed: false,
              external_send_executed: false,
              secrets_included: false
            }' > "$REPORT_DIR/result.json"

      - name: Upload bounded writer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oauth-current-main-writer-${{ github.run_id }}
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 14
