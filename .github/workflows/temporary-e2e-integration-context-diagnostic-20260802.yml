name: Temporary E2E Integration Context Diagnostic 20260802

on:
  pull_request:
    branches:
      - gpt/hostinger-safe-storage-cleanup-ssh-20260801
    paths:
      - '.github/workflows/temporary-e2e-integration-context-diagnostic-20260802.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Run context-matched structured diagnostic
        continue-on-error: true
        env:
          REPORT_PATH: ${{ runner.temp }}/e2e-integration-context-diagnostic.json
          DIAG_HEAD_REF: ${{ github.head_ref }}
          DIAG_BASE_REF: ${{ github.base_ref }}
          DIAG_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DIAG_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const tests = [
            'http-generic-api/scripts/e2e-phase-governance-self-test.mjs',
            'http-generic-api/scripts/e2e-phase-init-self-test.mjs',
            'http-generic-api/scripts/e2e-parallel-work-governance-self-test.mjs',
            'http-generic-api/scripts/e2e-parallel-plan-init-self-test.mjs',
            'http-generic-api/scripts/e2e-parallel-pr-flow-self-test.mjs',
            'http-generic-api/scripts/test-e2e-parallel-test-runner-diagnostics.mjs',
            'http-generic-api/scripts/test-ci-evidence-source-stamp.mjs',
            'http-generic-api/scripts/test-ci-evidence-router.mjs',
            'http-generic-api/scripts/test-ci-evidence-pr-comment.mjs'
          ];
          const tail = value => String(value || '').replace(/\r/g, '').slice(-6000);
          const results = tests.map(test => {
            const started = Date.now();
            const child = spawnSync(process.execPath, [test], {
              encoding: 'utf8', maxBuffer: 1024 * 1024,
              env: { ...process.env, CI: 'true' }
            });
            return {
              test, passed: child.status === 0,
              exit_code: Number.isInteger(child.status) ? child.status : null,
              signal: child.signal || null,
              duration_ms: Date.now() - started,
              stdout_tail: tail(child.stdout), stderr_tail: tail(child.stderr)
            };
          });
          const first = results.find(item => !item.passed) || null;
          const report = {
            contract: 'mad4b.e2e-integration-context-diagnostic.v1',
            generated_at: new Date().toISOString(),
            context: {
              head_ref: process.env.DIAG_HEAD_REF,
              base_ref: process.env.DIAG_BASE_REF,
              head_sha: process.env.DIAG_HEAD_SHA,
              base_sha: process.env.DIAG_BASE_SHA
            },
            outcome: first ? 'failed' : 'passed',
            first_failure: first,
            results,
            routing: { source_of_truth: 'structured_report', consult_job_logs: false },
            side_effects: {
              repository_mutation_performed: false,
              provider_dispatch_performed: false,
              credential_access_performed: false,
              sql_execution_performed: false,
              migration_apply_performed: false,
              external_send_performed: false
            },
            secrets_included: false
          };
          fs.writeFileSync(process.env.REPORT_PATH, `${JSON.stringify(report, null, 2)}\n`);
          console.log(JSON.stringify({ outcome: report.outcome, first_failure: first?.test || null, passed: results.filter(x => x.passed).length, total: results.length, consult_job_logs: false }));
          process.exit(first ? 1 : 0);
          NODE
      - name: Upload structured report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-integration-context-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/e2e-integration-context-diagnostic.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce report integrity
        if: always()
        env:
          REPORT_PATH: ${{ runner.temp }}/e2e-integration-context-diagnostic.json
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            if (!fs.existsSync(process.env.REPORT_PATH)) process.exit(1);
            const r = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, "utf8"));
            const safe = r.contract === "mad4b.e2e-integration-context-diagnostic.v1" && r.routing?.consult_job_logs === false && r.secrets_included === false && Object.values(r.side_effects || {}).every(v => v === false);
            if (!safe || r.outcome !== "passed") process.exit(1);
          '
