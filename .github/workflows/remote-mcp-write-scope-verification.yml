name: Remote MCP Write-Scope Verification
run-name: Remote MCP Write-Scope Verification · ${{ inputs.target_ref }} · ${{ inputs.expected_head_sha }}

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Governed work branch to verify
        required: true
        type: string
      expected_head_sha:
        description: Exact current 40-character head SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: remote-mcp-write-scope-verification-${{ inputs.target_ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact expected head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.expected_head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify local and remote exact-head identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ inputs.target_ref }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_REF" =~ ^(gpt|fix|feat|chore|docs|release)/[A-Za-z0-9._/-]+$ ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$TARGET_REF" == "main" || "$TARGET_REF" == "Production" ]]; then
            echo "Protected branch verification target is forbidden: $TARGET_REF" >&2
            exit 1
          fi
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_REF}" --jq '.object.sha')"
          test "$local_sha" = "$EXPECTED_HEAD_SHA"
          test "$remote_sha" = "$EXPECTED_HEAD_SHA"

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Verify Remote MCP write-scope currentness
        run: npm run write-scopes:inventory:check

      - name: Verify Remote MCP write-scope contract
        run: npm run write-scopes:inventory:test
