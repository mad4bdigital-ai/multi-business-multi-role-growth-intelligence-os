name: Work Map Refresh PR 6484 R2 Once

on:
  push:
    branches:
      - gpt/fix-production-runtime-parity-runner-context-20260806
    paths:
      - .github/workflows/work-map-refresh-pr6484-r2-once.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: work-map-refresh-pr6484-r2-once
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify immutable PR binding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BRANCH: gpt/fix-production-runtime-parity-runner-context-20260806
          EXPECTED_PR: '6484'
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${EXPECTED_PR}" --jq '.state')" = open
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${EXPECTED_PR}" --jq '.draft')" = true
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${EXPECTED_PR}" --jq '.head.ref')" = "${EXPECTED_BRANCH}"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${EXPECTED_PR}" --jq '.head.sha')" = "${GITHUB_SHA}"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${EXPECTED_PR}" --jq '.base.ref')" = main

      - name: Generate final-tree Work Maps and validate bounded scope
        shell: bash
        run: |
          set -Eeuo pipefail
          writer='.github/workflows/work-map-refresh-pr6484-r2-once.yml'
          rm -f "${writer}"

          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          node http-generic-api/scripts/platform-work-map-generator.mjs --check

          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            '.github/workflows/work-map-refresh-pr6484-r2-once.yml'
            'docs/work-maps/README.md'
            'docs/work-maps/repository-automation-map.md'
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${changed[$index]}" = "${expected[$index]}"
          done

          node http-generic-api/scripts/test-production-runtime-parity-comment-bridge.mjs
          node http-generic-api/scripts/pipeline-connectivity-check.mjs
          node http-generic-api/test-pipeline-connectivity-check.mjs
          node http-generic-api/test-work-map-autofix-diagnostics.mjs

      - name: Commit and fast-forward the PR branch
        shell: bash
        env:
          EXPECTED_BRANCH: gpt/fix-production-runtime-parity-runner-context-20260806
        run: |
          set -Eeuo pipefail
          test "$(git ls-remote origin "refs/heads/${EXPECTED_BRANCH}" | awk '{print $1}')" = "${GITHUB_SHA}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/work-map-refresh-pr6484-r2-once.yml docs/work-maps/README.md docs/work-maps/repository-automation-map.md
          git commit -m 'docs(work-maps): refresh runtime parity bridge contract'
          git push origin "HEAD:refs/heads/${EXPECTED_BRANCH}"
