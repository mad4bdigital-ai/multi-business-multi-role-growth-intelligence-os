name: Dispatch Production Candidate 630a3545

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/dispatch-production-candidate-92c2c5f3-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Dispatch and observe governed Production candidate builder
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_URL="$(gh workflow run production-promotion-candidate.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f expected_main_sha=630a3545f0670268745ff66a94a510d6999b38ae \
            -f expected_production_sha=fae54a372350d23d915bbe564e972b714ca363f4 \
            -f release_branch=release/production-candidate-630a3545-fae54a37-20260730 \
            -f validation_branch=gpt/validate-production-candidate-630a3545-fae54a37 \
            -f validation_base_branch=gpt/validate-production-base-630a3545-fae54a37 \
            -f create_pull_requests=true)"
          printf '%s\n' "$RUN_URL"
          RUN_ID="${RUN_URL##*/}"
          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Unable to parse governed builder run ID from: $RUN_URL" >&2
            exit 1
          fi
          echo "builder_run_id=$RUN_ID"

          if ! gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10; then
            gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed || true
            exit 1
          fi
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,headSha,jobs
          echo 'Governed candidate builder completed successfully. This observer performed no merge, deployment, migration, provider call, credential read, or external send.'
