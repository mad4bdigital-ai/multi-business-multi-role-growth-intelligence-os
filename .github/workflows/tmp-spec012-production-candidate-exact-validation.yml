name: Temporary Spec 012 Production Candidate Exact Validation

on:
  pull_request:
    branches:
      - Production
    paths:
      - .github/workflows/tmp-spec012-production-candidate-exact-validation.yml
      - http-generic-api/**
      - specs/012-tenant-activation-lifecycle/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify immutable candidate identity and ancestry
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_MAIN_SHA: 2423f272161f73d18bcc2d492e0ed3be414d07ba
          EXPECTED_PRODUCTION_SHA: 42177d360e9c6d76b4f09eaf06bd98ac26d09abe
          TEMP_PATH: .github/workflows/tmp-spec012-production-candidate-exact-validation.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git fetch --no-tags origin main Production
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse origin/Production)" = "$EXPECTED_PRODUCTION_SHA"
          git merge-base --is-ancestor origin/main HEAD
          git merge-base --is-ancestor origin/Production HEAD
          mapfile -t changed < <(git diff --name-only origin/main HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$TEMP_PATH"
          test -z "$(git diff --name-only origin/main HEAD -- . ":(exclude)$TEMP_PATH")"

      - name: Install HTTP Generic API dependencies from lockfile
        working-directory: http-generic-api
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run complete HTTP Generic API manifest
        working-directory: http-generic-api
        run: npm test

      - name: Reverify candidate identity after tests
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain)"
