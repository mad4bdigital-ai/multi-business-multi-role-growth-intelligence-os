name: Materialize capability drift notification fanout V2

on:
  push:
    branches:
      - fix/capability-drift-notification-fanout-4450-20260808
    paths:
      - .github/workflows/materialize-capability-drift-notification-fanout-v2.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v5
        with:
          ref: fix/capability-drift-notification-fanout-4450-20260808
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact current main ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          test "$(git rev-parse origin/main)" = "a3561230aabb6b629c7ceca9587290593cea759a"

      - name: Apply bounded fanout patch with corrected regression assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('.github/workflows/materialize-capability-drift-notification-fanout.yml')
          lines = path.read_text().splitlines()
          start = next(i + 1 for i, line in enumerate(lines) if "python3 - <<'PY'" in line)
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          code = textwrap.dedent('\n'.join(lines[start:end]))
          old = r"assert.doesNotMatch(service, /channel[^\n]*email|channel[^\n]*webhook/);"
          new = "assert.match(service, /'in_app', 'active_tenant_members'/);\n  assert.match(fanoutPolicy, /external_send: false/);"
          if old not in code:
              raise SystemExit('expected malformed broad-channel assertion source not found')
          code = code.replace(old, new, 1)
          Path('/tmp/apply-capability-fanout-v2.py').write_text(code + '\n')
          PY
          python3 /tmp/apply-capability-fanout-v2.py

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/test-operational-alerting-control-plane.mjs
          node http-generic-api/scripts/test-operation-observability-service.mjs

      - name: Remove temporary workflows and enforce exact final scope
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capability-drift-notification-fanout.yml
          rm .github/workflows/diagnose-capability-drift-notification-fanout.yml
          rm .github/workflows/materialize-capability-drift-notification-fanout-v2.yml
          git add -A
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          expected = {
              '.changes/e2e/capability-drift-notification-fanout.json',
              'http-generic-api/capabilityDriftNotificationFanoutPolicy.js',
              'http-generic-api/operationalAlertService.js',
              'http-generic-api/test-operational-alerting-control-plane.mjs',
          }
          actual = set(subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only', 'origin/main'],
              text=True,
          ).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected final scope: expected={sorted(expected)} actual={sorted(actual)}')
          PY

      - name: Commit bounded fanout materialization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(observability): queue bounded capability drift tenant attention"
          git push origin HEAD:fix/capability-drift-notification-fanout-4450-20260808
