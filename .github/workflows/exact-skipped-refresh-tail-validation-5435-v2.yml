name: Exact Skipped Refresh Tail Validation 5435 V2

on:
  pull_request:
    branches: [gpt/validate-skipped-refresh-5435-tail-base-81a254bf]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

env:
  EXPECTED_MAIN_SHA: 81a254bfae492e33526f92ec2241f2d927790de2
  PREVIOUS_VALIDATED_SHA: 80187bba69b0e8a23593c5f2983c483e91bb7494
  EXPECTED_CANDIDATE_SHA: b3113b4645439bb6182d73780adac8ff74f6b0e4
  EXPECTED_CANDIDATE_REF: fix/generated-artifact-refresh-skipped-outcome-current-main-20260803
  EXPECTED_VALIDATOR_BASE_REF: gpt/validate-skipped-refresh-5435-tail-base-81a254bf
  CANONICAL_PR_NUMBER: '5435'
  EVIDENCE_DIR: /tmp/exact-skipped-refresh-tail-validation-5435-v2

jobs:
  freshness-tail:
    name: Exact tree-equivalent freshness and governance tail
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/generated-artifact-refresh-skipped-outcome-current-main-20260803'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Checkout exact synchronized candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted base, canonical PR, and current main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATOR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VALIDATOR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$VALIDATOR_BASE_REF" = "$EXPECTED_VALIDATOR_BASE_REF"
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${EXPECTED_VALIDATOR_BASE_REF}:refs/remotes/origin/${EXPECTED_VALIDATOR_BASE_REF}" \
            "+refs/heads/${EXPECTED_CANDIDATE_REF}:refs/remotes/origin/${EXPECTED_CANDIDATE_REF}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse refs/remotes/origin/${EXPECTED_VALIDATOR_BASE_REF})" = "$VALIDATOR_BASE_SHA"
          test "$(git rev-parse refs/remotes/origin/${EXPECTED_CANDIDATE_REF})" = "$EXPECTED_CANDIDATE_SHA"
          test "$(git merge-base "$EXPECTED_MAIN_SHA" "$VALIDATOR_BASE_SHA")" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-list --count "$EXPECTED_MAIN_SHA..$VALIDATOR_BASE_SHA")" -eq 1
          mapfile -t validator_files < <(git diff --name-only "$EXPECTED_MAIN_SHA...$VALIDATOR_BASE_SHA")
          test "${#validator_files[@]}" -eq 1
          test "${validator_files[0]}" = '.github/workflows/exact-skipped-refresh-tail-validation-5435-v2.yml'
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${CANONICAL_PR_NUMBER}")"
          test "$(jq -r '.state' <<<"$pr")" = 'open'
          test "$(jq -r '.draft' <<<"$pr")" = 'true'
          test "$(jq -r '.base.ref' <<<"$pr")" = 'main'
          test "$(jq -r '.base.sha' <<<"$pr")" = "$EXPECTED_MAIN_SHA"
          test "$(jq -r '.head.ref' <<<"$pr")" = "$EXPECTED_CANDIDATE_REF"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$EXPECTED_CANDIDATE_SHA"

      - name: Prove exact tree equivalence and three-file scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$EXPECTED_MAIN_SHA" "$EXPECTED_CANDIDATE_SHA")" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-list --count "$EXPECTED_CANDIDATE_SHA..$EXPECTED_MAIN_SHA")" -eq 0
          test "$(git merge-base "$PREVIOUS_VALIDATED_SHA" "$EXPECTED_CANDIDATE_SHA")" = "$PREVIOUS_VALIDATED_SHA"
          test "$(git rev-list --count "$PREVIOUS_VALIDATED_SHA..$EXPECTED_CANDIDATE_SHA")" -eq 4
          git diff --quiet "$PREVIOUS_VALIDATED_SHA" "$EXPECTED_CANDIDATE_SHA"
          parents="$(git show -s --format=%P "$EXPECTED_CANDIDATE_SHA")"
          test "$(wc -w <<<"$parents")" -eq 2
          grep -qw "$PREVIOUS_VALIDATED_SHA" <<<"$parents"
          grep -qw "$EXPECTED_MAIN_SHA" <<<"$parents"
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' \
            '.changes/e2e/governed-generated-artifact-refresh-skipped-outcome.json' \
            '.github/workflows/governed-generated-artifact-refresh-request-dispatcher.yml' \
            'http-generic-api/test-governed-generated-artifact-refresh-pr-target-bridge.mjs' \
            | sort > "$EVIDENCE_DIR/expected-files.txt"
          git diff --name-only "$EXPECTED_MAIN_SHA...$EXPECTED_CANDIDATE_SHA" | sort > "$EVIDENCE_DIR/actual-files.txt"
          diff -u "$EVIDENCE_DIR/expected-files.txt" "$EVIDENCE_DIR/actual-files.txt"
          git diff --check "$EXPECTED_MAIN_SHA...$EXPECTED_CANDIDATE_SHA"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install HTTP API dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Reconfirm focused skipped outcome and Frontend parity
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          node test-governed-generated-artifact-refresh-pr-target-bridge.mjs
          npm run frontend:dispatch:check -- --baseline-ref="$EXPECTED_MAIN_SHA"

      - name: Reconfirm Repository Tool Lifecycle and E2E integrity
        shell: bash
        env:
          CANDIDATE_SHA: ${{ env.EXPECTED_CANDIDATE_SHA }}
          BASE_SHA: ${{ env.EXPECTED_MAIN_SHA }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/repository-tool-lifecycle"
          git diff --name-status "$EXPECTED_MAIN_SHA" "$EXPECTED_CANDIDATE_SHA" > "$EVIDENCE_DIR/repository-tool-changes.tsv"
          node http-generic-api/scripts/maintenance-tools/repository-tool-lifecycle-guard.mjs \
            --changed-files "$EVIDENCE_DIR/repository-tool-changes.tsv" \
            --policy .github/repository-maintenance-tool-governance.json \
            --output-dir "$EVIDENCE_DIR/repository-tool-lifecycle"
          report="$EVIDENCE_DIR/repository-tool-lifecycle/repository-tool-lifecycle-report.json"
          test "$(jq -r '.ok' "$report")" = 'true'
          test "$(jq -r '.candidate_sha' "$report")" = "$EXPECTED_CANDIDATE_SHA"
          test "$(jq -r '.base_sha' "$report")" = "$EXPECTED_MAIN_SHA"
          node http-generic-api/scripts/e2e-contract-reference-integrity.mjs \
            --base "$EXPECTED_MAIN_SHA" \
            --head "$EXPECTED_CANDIDATE_SHA" \
            --report-file "$EVIDENCE_DIR/e2e-contract-reference-integrity.json"
          node http-generic-api/scripts/e2e-contract-git-index-integrity.mjs \
            --report-file "$EVIDENCE_DIR/e2e-contract-reference-integrity.json"
          node http-generic-api/scripts/e2e-phase-governance.mjs check \
            --base "$EXPECTED_MAIN_SHA" \
            --head "$EXPECTED_CANDIDATE_SHA" \
            --report-file "$EVIDENCE_DIR/e2e-phase-evaluation.json"
          node http-generic-api/scripts/e2e-phase-governance.mjs run \
            --base "$EXPECTED_MAIN_SHA" \
            --head "$EXPECTED_CANDIDATE_SHA" \
            --report-file "$EVIDENCE_DIR/e2e-phase-evaluation-run.json" \
            --execution-report-file "$EVIDENCE_DIR/e2e-phase-execution.json"

      - name: Final protected-main and canonical PR readback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATOR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin "refs/heads/${EXPECTED_VALIDATOR_BASE_REF}" | awk '{print $1}')" = "$VALIDATOR_BASE_SHA"
          test "$(git ls-remote origin "refs/heads/${EXPECTED_CANDIDATE_REF}" | awk '{print $1}')" = "$EXPECTED_CANDIDATE_SHA"
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${CANONICAL_PR_NUMBER}")"
          test "$(jq -r '.state' <<<"$pr")" = 'open'
          test "$(jq -r '.draft' <<<"$pr")" = 'true'
          test "$(jq -r '.base.sha' <<<"$pr")" = "$EXPECTED_MAIN_SHA"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$EXPECTED_CANDIDATE_SHA"

      - name: Publish bounded evidence summary
        if: always()
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_DIR"
          jq -n \
            --arg base_sha "$EXPECTED_MAIN_SHA" \
            --arg previous_validated_sha "$PREVIOUS_VALIDATED_SHA" \
            --arg candidate_sha "$EXPECTED_CANDIDATE_SHA" \
            --arg full_run_id "30894262829" \
            --arg full_artifact_id "8886441957" \
            --arg full_artifact_digest "sha256:7ac55fcd045dd9cac6e31f77f2d79accac1fbc83a45dd0f4d437528bb923137c" \
            --arg tail_run_id "$GITHUB_RUN_ID" \
            --arg job_status "${{ job.status }}" \
            '{contract:"mad4b.exact-skipped-refresh-tail-validation.v2",base_sha:$base_sha,previous_validated_sha:$previous_validated_sha,candidate_sha:$candidate_sha,tree_equivalence_required:true,full_validation:{run_id:$full_run_id,artifact_id:$full_artifact_id,artifact_digest:$full_artifact_digest},tail_run_id:$tail_run_id,job_status:$job_status,candidate_mutated:false,main_mutated:false,production_mutated:false,provider_call:false,credential_read:false,sql_executed:false,migration_apply:false,database_mutated:false,external_send:false,secrets_included:false}' \
            > "$EVIDENCE_DIR/summary.json"

      - name: Upload tail validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-skipped-refresh-tail-validation-5435-v2-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: warn
          retention-days: 14
