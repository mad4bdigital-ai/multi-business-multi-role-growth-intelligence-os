name: Work Map Staging Bootstrap 74a764ab

on:
  push:
    branches:
      - gpt/work-map-generated-staging-74a764ab-v2-20260801

permissions:
  contents: write

concurrency:
  group: work-map-staging-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      EXPECTED_BASE_SHA: 74a764ab175ab3a6f105aa7a076e588541ea5766
      TARGET_BRANCH: gpt/work-map-generated-staging-74a764ab-v2-20260801
      BOOTSTRAP_WORKFLOW: .github/workflows/work-map-staging-bootstrap-74a764ab.yml
    steps:
      - name: Checkout isolated staging branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Verify exact bootstrap ancestry
        shell: bash
        run: |
          set -euo pipefail
          actual_parent="$(git rev-parse HEAD^)"
          if [[ "${actual_parent}" != "${EXPECTED_BASE_SHA}" ]]; then
            echo "Refusing staging generation: expected parent ${EXPECTED_BASE_SHA}, found ${actual_parent}."
            exit 1
          fi
          if [[ "$(git branch --show-current)" != "${TARGET_BRANCH}" ]]; then
            echo "Refusing unexpected staging branch."
            exit 1
          fi

      - name: Remove bootstrap workflow before source discovery
        shell: bash
        run: git rm "${BOOTSTRAP_WORKFLOW}"

      - name: Validate governed contracts without bootstrap contamination
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/pipeline-connectivity-check.mjs
          node http-generic-api/test-pipeline-connectivity-check.mjs
          node http-generic-api/test-work-map-autofix-diagnostics.mjs

      - name: Generate exact-head Work Maps twice
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          first_hash="$(git diff --binary "${EXPECTED_BASE_SHA}" -- docs/work-maps | sha256sum | awk '{print $1}')"
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          second_hash="$(git diff --binary "${EXPECTED_BASE_SHA}" -- docs/work-maps | sha256sum | awk '{print $1}')"
          if [[ "${first_hash}" != "${second_hash}" ]]; then
            echo "Refusing non-idempotent Work Map generation."
            exit 1
          fi
          node http-generic-api/scripts/platform-work-map-generator.mjs --check

      - name: Enforce exact net diff
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only "${EXPECTED_BASE_SHA}" | grep -v '^docs/work-maps/' || true)"
          if [[ -n "${unexpected}" ]]; then
            echo "Staging net diff contains files outside docs/work-maps:"
            printf '%s\n' "${unexpected}"
            exit 1
          fi
          changed_count="$(git diff --name-only "${EXPECTED_BASE_SHA}" -- docs/work-maps | sed '/^$/d' | wc -l | tr -d ' ')"
          if [[ "${changed_count}" -eq 0 ]]; then
            echo "No Work Map changes were generated."
            exit 1
          fi
          echo "Exact-head generated Work Map file count: ${changed_count}"

      - name: Commit isolated generated maps
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/work-maps
          git add -u "${BOOTSTRAP_WORKFLOW}"
          git commit -m "docs(work-maps): regenerate exact-head governed maps"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Verify remote and net scope readback
        shell: bash
        run: |
          set -euo pipefail
          local_head="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          if [[ "${local_head}" != "${remote_head}" ]]; then
            echo "Staging push readback mismatch."
            exit 1
          fi
          unexpected="$(git diff --name-only "${EXPECTED_BASE_SHA}"...HEAD | grep -v '^docs/work-maps/' || true)"
          if [[ -n "${unexpected}" ]]; then
            echo "Remote staging diff contains unexpected files:"
            printf '%s\n' "${unexpected}"
            exit 1
          fi
