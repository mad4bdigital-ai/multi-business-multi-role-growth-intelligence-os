name: Governance DB Writer Workflow Repair Once

on:
  push:
    branches:
      - fix/governance-db-writer-authority-20260810

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Repair exact matcher and self-retire
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "83ce15fa50d417bfa4a68035d356f4e6361dfdc7"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/governance-db-writer-authority-once.yml')
          lines = p.read_text().splitlines()
          matches = [
              i for i, line in enumerate(lines)
              if "replaceOnce(applyAuthorizePath" in line
              and "authorizeCapabilityResolutionEnvelopeApply(args = parseArgs())" in line
          ]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one apply-authorize matcher line, found {len(matches)}')
          lines[matches[0]] = "          replaceOnce(applyAuthorizePath, 'export async function authorizeCapabilityResolutionEnvelopeApply(args = parseArgs()) {', 'export async function authorizeCapabilityResolutionEnvelopeApply(args = parseArgs(), deps = {}) {');"
          p.write_text("\n".join(lines) + "\n")
          PY
          git rm .github/workflows/governance-db-writer-workflow-repair-once.yml
          git diff --check
          git config user.name 'admin-assitant-growth-os[bot]'
          git config user.email '283129699+admin-assitant-growth-os[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: align governance DB writer apply-authorize matcher'
          git push origin HEAD:fix/governance-db-writer-authority-20260810
