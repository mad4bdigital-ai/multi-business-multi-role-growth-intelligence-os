name: Staging Post-Deploy Verification

on:
  # dev.mad4b.com is intentionally retired; run manually only after an approved staging rebuild.
  workflow_dispatch:
    inputs:
      operation:
        description: Verification operation to run
        required: false
        default: verify
        type: choice
        options:
          - verify
          - countersign_recovery
      expected_sha:
        description: Commit SHA expected on staging; required for recovery countersign and defaults to the workflow commit for verification
        required: false
        type: string
      timeout_seconds:
        description: Maximum time to wait for staging deployment convergence
        required: false
        default: "900"
        type: string
      evidence_run_id:
        description: GitHub run containing the no-secret local canary evidence artifact; countersign only
        required: false
        type: string
      expected_target_fingerprint:
        description: Exact Staging target fingerprint; countersign only
        required: false
        type: string
      confirmation:
        description: Type COUNTERSIGN_STAGING_RECOVERY for recovery countersign
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ inputs.operation == 'countersign_recovery' && format('staging-recovery-genuine-certification-{0}-{1}', inputs.expected_sha, inputs.expected_target_fingerprint) || 'staging-post-deploy-verification' }}
  cancel-in-progress: ${{ inputs.operation != 'countersign_recovery' }}

jobs:
  verify-staging:
    if: inputs.operation != 'countersign_recovery'
    name: Verify main on dev.mad4b.com
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      STAGING_BASE_URL: https://dev.mad4b.com
      EXPECTED_BRANCH: main
      BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
      EVENT_SHA: ${{ github.sha }}
      INPUT_EXPECTED_SHA: ${{ inputs.expected_sha }}
      INPUT_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Resolve expected deployment
        id: expected
        shell: bash
        run: |
          set -euo pipefail
          expected_commit="${INPUT_EXPECTED_SHA:-${EVENT_SHA}}"
          timeout_seconds="${INPUT_TIMEOUT_SECONDS:-900}"
          if [[ ! "${expected_commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected deployment commit must be a full 40-character SHA."
            exit 1
          fi
          if [[ ! "${timeout_seconds}" =~ ^[0-9]+$ ]] || (( timeout_seconds < 60 || timeout_seconds > 1800 )); then
            echo "::error::timeout_seconds must be between 60 and 1800."
            exit 1
          fi
          if [[ -z "${BACKEND_API_KEY}" ]]; then
            echo "::error::BACKEND_API_KEY repository secret is required for staging DB verification."
            exit 1
          fi
          echo "commit=${expected_commit}" >> "${GITHUB_OUTPUT}"
          echo "timeout_seconds=${timeout_seconds}" >> "${GITHUB_OUTPUT}"

      - name: Wait for staging to deploy the expected main commit
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ steps.expected.outputs.commit }}
          TIMEOUT_SECONDS: ${{ steps.expected.outputs.timeout_seconds }}
        run: |
          set -euo pipefail
          mkdir -p staging-verification-artifacts
          deadline=$((SECONDS + TIMEOUT_SECONDS))
          matched=false

          while (( SECONDS < deadline )); do
            tmp_file="$(mktemp)"
            if curl --fail --silent --show-error \
              --connect-timeout 15 \
              --max-time 60 \
              "${STAGING_BASE_URL}/deployment-info" \
              --output "${tmp_file}"; then
              mv "${tmp_file}" staging-verification-artifacts/deployment-info.json
              observed_branch="$(node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.stdout.write(String(p.branch||""));' staging-verification-artifacts/deployment-info.json)"
              observed_commit="$(node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.stdout.write(String(p.commit_sha||p.commit||""));' staging-verification-artifacts/deployment-info.json)"
              echo "Observed staging branch=${observed_branch:-<missing>} commit=${observed_commit:-<missing>}"
              if [[ "${observed_branch}" == "${EXPECTED_BRANCH}" && "${observed_commit}" == "${EXPECTED_COMMIT}" ]]; then
                matched=true
                break
              fi
            else
              rm -f "${tmp_file}"
              echo "Staging deployment-info is not available yet."
            fi
            sleep 20
          done

          if [[ "${matched}" != "true" ]]; then
            echo "::error::Staging did not converge to ${EXPECTED_BRANCH}@${EXPECTED_COMMIT} within ${TIMEOUT_SECONDS} seconds."
            if [[ -f staging-verification-artifacts/deployment-info.json ]]; then
              cat staging-verification-artifacts/deployment-info.json
            fi
            exit 1
          fi

      - name: Run governed staging smoke suite
        working-directory: http-generic-api
        env:
          EXPECTED_COMMIT: ${{ steps.expected.outputs.commit }}
        run: |
          set -euo pipefail
          max_attempts=5
          retry_delay_seconds=20

          for attempt in $(seq 1 "${max_attempts}"); do
            echo "Staging smoke attempt ${attempt}/${max_attempts}"
            set +e
            node scripts/dev-autopilot-smoke.mjs \
              --base-url="${STAGING_BASE_URL}" \
              --expected-branch="${EXPECTED_BRANCH}" \
              --expected-commit="${EXPECTED_COMMIT}" \
              > ../staging-verification-artifacts/staging-smoke.json
            smoke_status=$?
            set -e

            cat ../staging-verification-artifacts/staging-smoke.json
            if (( smoke_status == 0 )); then
              exit 0
            fi

            retryable="$(node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('../staging-verification-artifacts/staging-smoke.json', 'utf8'));
          const failed = (payload.checks || []).filter((check) => !check.passed).map((check) => String(check.name || ''));
          const retryablePrefixes = [
            'connector-agent version is available',
            'connector-agent manifest is available',
            'manifest has hash for ',
          ];
          process.stdout.write(
            failed.length > 0 && failed.every((name) => retryablePrefixes.some((prefix) => name.startsWith(prefix)))
              ? 'true'
              : 'false',
          );
          NODE
            )"

            if [[ "${retryable}" != "true" || "${attempt}" -ge "${max_attempts}" ]]; then
              echo "::error::Staging smoke failed with non-retryable checks or exhausted retries."
              exit "${smoke_status}"
            fi

            echo "Connector readiness is still converging; retrying in ${retry_delay_seconds} seconds."
            sleep "${retry_delay_seconds}"
          done

      - name: Publish verification summary
        if: always()
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ steps.expected.outputs.commit }}
        run: |
          {
            echo "## Staging post-deploy verification"
            echo
            echo "- Environment: ${STAGING_BASE_URL}"
            echo "- Expected branch: ${EXPECTED_BRANCH}"
            echo "- Expected commit: ${EXPECTED_COMMIT:-unresolved}"
            if [[ -f staging-verification-artifacts/staging-smoke.json ]]; then
              node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('staging-verification-artifacts/staging-smoke.json', 'utf8'));
          console.log(`- Smoke result: ${payload.ok ? 'passed' : 'failed'}`);
          console.log(`- Checks: ${payload.passed || 0} passed, ${payload.failed || 0} failed`);
          NODE
            else
              echo "- Smoke result: not completed"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-post-deploy-verification-${{ github.run_id }}
          path: staging-verification-artifacts/
          if-no-files-found: warn
          retention-days: 14

  verify-and-countersign:
    if: inputs.operation == 'countersign_recovery' && github.ref == 'refs/heads/main' && inputs.confirmation == 'COUNTERSIGN_STAGING_RECOVERY'
    name: Verify and countersign genuine Staging recovery certification
    runs-on: ubuntu-latest
    environment: staging-recovery-certification
    permissions:
      contents: read
      actions: read
    steps:
      - name: Validate bounded countersign inputs
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          EXPECTED_TARGET_FINGERPRINT: ${{ inputs.expected_target_fingerprint }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::expected_sha must be a full 40-character SHA."; exit 1; }
          [[ "${EVIDENCE_RUN_ID}" =~ ^[0-9]+$ ]] || { echo "::error::evidence_run_id must be numeric."; exit 1; }
          [[ "${EXPECTED_TARGET_FINGERPRINT}" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::expected_target_fingerprint must be a 64-character SHA-256 fingerprint."; exit 1; }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce exact main workflow authority
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_SHA}" = "${{ inputs.expected_sha }}"
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
          test "$(git rev-parse origin/main)" = "${{ inputs.expected_sha }}"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install verifier dependencies
        working-directory: http-generic-api
        run: npm ci --ignore-scripts

      - name: Download exact no-secret canary evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.evidence_run_id }}
          name: staging-recovery-canary-${{ inputs.expected_sha }}-${{ inputs.expected_target_fingerprint }}
          path: ${{ runner.temp }}/staging-recovery-canary

      - name: Independently verify and countersign
        env:
          RECOVERY_STAGING_EVIDENCE_DIRECTORY: ${{ runner.temp }}/staging-recovery-canary
          RECOVERY_STAGING_COUNTERSIGN_OUTPUT_DIRECTORY: ${{ runner.temp }}/staging-recovery-countersign
          RECOVERY_STAGING_EXPECTED_TARGET_FINGERPRINT: ${{ inputs.expected_target_fingerprint }}
          RECOVERY_STAGING_CERTIFICATION_PRIVATE_KEY: ${{ secrets.RECOVERY_STAGING_CERTIFICATION_PRIVATE_KEY }}
          RECOVERY_STAGING_CERTIFICATION_ISSUER: ${{ vars.RECOVERY_STAGING_CERTIFICATION_ISSUER }}
          RECOVERY_STAGING_CERTIFICATION_KEY_ID: ${{ vars.RECOVERY_STAGING_CERTIFICATION_KEY_ID }}
          ACTIVATION_GATEWAY_INGRESS_PUBLIC_KEY_SHA256: ${{ vars.ACTIVATION_GATEWAY_INGRESS_PUBLIC_KEY_SHA256 }}
        run: node .github/scripts/staging-recovery-verify-and-countersign.mjs

      - name: Upload signed bounded certification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-recovery-signed-certification-${{ inputs.expected_sha }}-${{ inputs.expected_target_fingerprint }}
          path: ${{ runner.temp }}/staging-recovery-countersign
          if-no-files-found: error
          retention-days: 7
