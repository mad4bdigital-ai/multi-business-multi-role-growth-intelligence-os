name: CI Runner Queue Unblock

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths: [.github/workflows/ci-runner-queue-unblock.yml]

permissions:
  contents: write

concurrency:
  group: ci-runner-queue-unblock
  cancel-in-progress: true

jobs:
  patch:
    if: >-
      github.event.pull_request.number == 6027 &&
      github.event.pull_request.head.ref == 'gpt/ci-runner-concurrency-unblock-20260804'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_BRANCH: gpt/ci-runner-concurrency-unblock-20260804
      WORKFLOW_PATH: .github/workflows/ci-runner-queue-unblock.yml
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact trigger
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "${TARGET_BRANCH}"
          test "$(git diff --name-only HEAD^ HEAD)" = "${WORKFLOW_PATH}"

      - name: Apply bounded runner remediation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          paths = [
            Path('.github/workflows/ci.yml'),
            Path('.github/workflows/frontend-surface-dispatch.yml'),
            Path('.github/workflows/repository-tool-lifecycle-governance.yml'),
            Path('.github/workflows/context-kernel-hardcoding-report.yml'),
            Path('.github/workflows/e2e-phase-governance.yml'),
          ]
          for path in paths:
            text = path.read_text()
            if 'runs-on: ubuntu-latest' not in text:
              raise SystemExit(f'missing_runner_anchor:{path}')
            path.write_text(text.replace('runs-on: ubuntu-latest', 'runs-on: ubuntu-24.04'))
          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text()
          if '  cancel-in-progress: false\n' not in text:
            raise SystemExit('missing_ci_concurrency_anchor')
          ci.write_text(text.replace('  cancel-in-progress: false\n', '  cancel-in-progress: true\n', 1))
          frontend = Path('.github/workflows/frontend-surface-dispatch.yml')
          text = frontend.read_text()
          anchor = 'permissions:\n  contents: read\n\njobs:\n'
          replacement = 'permissions:\n  contents: read\n\nconcurrency:\n  group: frontend-surface-dispatch-${{ github.event.pull_request.number || github.ref }}\n  cancel-in-progress: true\n\njobs:\n'
          if anchor not in text:
            raise SystemExit('missing_frontend_concurrency_anchor')
          frontend.write_text(text.replace(anchor, replacement, 1))
          PY

      - name: Validate diff formatting
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check

      - name: Validate E2E phase governance workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          node http-generic-api/scripts/e2e-phase-governance-self-test.mjs

      - name: Validate repository tool lifecycle workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          node http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs

      - name: Validate frontend dispatch workflow baseline
        shell: bash
        working-directory: http-generic-api
        run: |
          set -Eeuo pipefail
          node test-frontend-dispatch-workflow-baseline.mjs

      - name: Validate explicit runner pins
        shell: bash
        run: |
          set -Eeuo pipefail
          ! grep -R "runs-on: ubuntu-latest" \
            .github/workflows/ci.yml \
            .github/workflows/frontend-surface-dispatch.yml \
            .github/workflows/repository-tool-lifecycle-governance.yml \
            .github/workflows/context-kernel-hardcoding-report.yml \
            .github/workflows/e2e-phase-governance.yml

      - name: Remove temporary workflow and enforce scope
        shell: bash
        run: |
          set -Eeuo pipefail
          rm "${WORKFLOW_PATH}"
          mapfile -t changed < <(git status --porcelain=v1 | sed -E 's/^...//' | sort -u)
          test "${#changed[@]}" -eq 6
          printf '%s\n' "${changed[@]}"
          for expected in \
            "${WORKFLOW_PATH}" \
            .github/workflows/ci.yml \
            .github/workflows/frontend-surface-dispatch.yml \
            .github/workflows/repository-tool-lifecycle-governance.yml \
            .github/workflows/context-kernel-hardcoding-report.yml \
            .github/workflows/e2e-phase-governance.yml; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "$expected"
          done

      - name: Verify branch lease before commit
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          local_head="$(git rev-parse HEAD)"
          printf 'remote_head=%s\nlocal_head=%s\n' "$remote_head" "$local_head"
          test "$remote_head" = "$local_head"

      - name: Create bounded commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name mad4bdigital-ai
          git config user.email mad4bdigital-ai@users.noreply.github.com
          git add -A
          git commit -m 'ci: pin required checks and cancel superseded runs'
          test ! -e "${WORKFLOW_PATH}"

      - name: Push bounded commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Verify pushed branch readback
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          local_head="$(git rev-parse HEAD)"
          printf 'remote_head=%s\nlocal_head=%s\n' "$remote_head" "$local_head"
          test "$remote_head" = "$local_head"
          test ! -e "${WORKFLOW_PATH}"
