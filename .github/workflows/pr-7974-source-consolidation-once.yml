name: PR 7974 source consolidation once

on:
  pull_request:
    branches: [main]
    types: [edited]

permissions:
  contents: write

concurrency:
  group: pr-7974-source-consolidation-once
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.number == 7974 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      EXPECTED_PARENT: 3718b662c97bffe344f3c62f8e6cf047787c4410
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Guard exact parent and branch
        shell: bash
        run: |
          set -euo pipefail
          test "$HEAD_BRANCH" = "fix/admin-recovery-mcp-local-connector-ownership-20260908"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test -e scripts/pr-7974-source-consolidation-once.py
          test -e .github/workflows/pr-7974-source-consolidation-once.yml

      - name: Apply canonical source patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/pr-7974-source-consolidation-once.py')
          source = p.read_text(encoding='utf-8')
          old = 'source, count = production_test.subn(staging_tests, source, count=1)'
          new = 'source, count = production_test.subn(lambda _match: staging_tests, source, count=1)'
          if source.count(old) != 1:
              raise SystemExit('patch-runner replacement target mismatch')
          p.write_text(source.replace(old, new), encoding='utf-8', newline='\n')
          PY
          python scripts/pr-7974-source-consolidation-once.py

      - name: Validate focused source contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check http-generic-api/routes/localConnectorInstallRoutes.js
          node --check http-generic-api/routes/index.js
          node --check http-generic-api/test-local-connector-durable-self-healing.mjs
          node --check http-generic-api/test-recovery-composition.mjs
          node -e "JSON.parse(require('fs').readFileSync('http-generic-api/config/admin-recovery-chatgpt-connection.json','utf8')); JSON.parse(require('fs').readFileSync('.changes/e2e/local-connector-owned-transport-admin-recovery-20260908.json','utf8')); JSON.parse(require('fs').readFileSync('http-generic-api/frontend-surface-policy.json','utf8'));"
          test ! -e http-generic-api/routes/localConnectorInstallerDelegationRoutes.js
          test "$(grep -R --include='*.js' -F 'router.get("/local-connector/install/download"' http-generic-api/routes | wc -l | tr -d ' ')" = "1"
          git diff --check

      - name: Install API dependencies
        working-directory: http-generic-api
        run: npm ci --ignore-scripts

      - name: Run focused regressions
        working-directory: http-generic-api
        run: |
          set -euo pipefail
          node test-local-connector-durable-self-healing.mjs
          node test-recovery-composition.mjs
          node test-staging-recovery-admin-surface.mjs
          node test-openapi-split-governance.mjs

      - name: Commit repair and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr-7974-source-consolidation-once.yml
          rm scripts/pr-7974-source-consolidation-once.py
          git add -A
          git diff --cached --check
          git config user.name "mad4bdigital-ai"
          git config user.email "mad4b.digital@gmail.com"
          git commit -m "fix(connector): consolidate installer and staging recovery authority"
          git push origin "HEAD:${HEAD_BRANCH}"
