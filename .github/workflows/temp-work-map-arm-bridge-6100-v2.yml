name: TEMP Work Map ARM Bridge 6100 V2

on:
  pull_request:
    branches:
      - gpt/bridge-work-map-arm-base-6100-33c8dc3b
    types: [opened, reopened, synchronize]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: temp-work-map-arm-bridge-6100-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Validate synchronized canonical PR and dispatch sole writer
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      CANONICAL_PR: '6100'
      EXPECTED_MAIN_SHA: 33c8dc3b3f8a8c8950e13b674423466e6b08f9e6
      EXPECTED_HEAD_SHA: 121e9f47ba33cc05c4dcc384f08c99fe8cc864f3
      EXPECTED_HEAD_REF: gpt/hostinger-production-runtime-readback-r7-main-0ccfc93b-20260804
      AUTHORIZATION_MARKER: '<!-- work-map-autofix:authorized -->'
    steps:
      - name: Validate identity, consume marker, and dispatch official writer
        id: bridge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${CANONICAL_PR}")"
          test "$(jq -r '.state' <<<"${pr}")" = 'open'
          test "$(jq -r '.draft' <<<"${pr}")" = 'true'
          test "$(jq -r '.base.ref' <<<"${pr}")" = 'main'
          test "$(jq -r '.base.sha' <<<"${pr}")" = "${EXPECTED_MAIN_SHA}"
          test "$(jq -r '.head.repo.full_name' <<<"${pr}")" = "${GITHUB_REPOSITORY}"
          test "$(jq -r '.head.ref' <<<"${pr}")" = "${EXPECTED_HEAD_REF}"
          test "$(jq -r '.head.sha' <<<"${pr}")" = "${EXPECTED_HEAD_SHA}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "${EXPECTED_MAIN_SHA}"
          comparison="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${EXPECTED_MAIN_SHA}...${EXPECTED_HEAD_SHA}")"
          test "$(jq -r '.behind_by' <<<"${comparison}")" = '0'
          test "$(jq -r '.merge_base_commit.sha' <<<"${comparison}")" = "${EXPECTED_MAIN_SHA}"

          body="$(jq -r '.body // ""' <<<"${pr}")"
          test "$(grep -Fo "${AUTHORIZATION_MARKER}" <<<"${body}" | wc -l | tr -d ' ')" = '1'

          for workflow in spec-kit-work-map-autofix.yml spec-kit-work-map-integration.yml; do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}" --jq '.state')"
            if [[ "${state}" != 'active' ]]; then
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/enable"
            fi
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}" --jq '.state')" = 'active'
          done

          current_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${CANONICAL_PR}")"
          test "$(jq -r '.head.sha' <<<"${current_pr}")" = "${EXPECTED_HEAD_SHA}"
          current_body="$(jq -r '.body // ""' <<<"${current_pr}")"
          next_body="${current_body//${AUTHORIZATION_MARKER}/}"
          payload_file="${RUNNER_TEMP}/consume-marker.json"
          jq -n --arg body "${next_body}" '{body:$body}' > "${payload_file}"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${CANONICAL_PR}" --input "${payload_file}" >/dev/null
          if gh api "repos/${GITHUB_REPOSITORY}/pulls/${CANONICAL_PR}" --jq '.body // ""' | grep -Fq "${AUTHORIZATION_MARKER}"; then
            echo 'Authorization marker removal readback failed.' >&2
            exit 1
          fi

          dispatch_started_at="$(date -u -d '5 seconds ago' +'%Y-%m-%dT%H:%M:%SZ')"
          payload="$(jq -cn --arg ref main --arg branch "${EXPECTED_HEAD_REF}" --arg expected_head_sha "${EXPECTED_HEAD_SHA}" '{ref:$ref,inputs:{branch:$branch,expected_head_sha:$expected_head_sha}}')"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/spec-kit-work-map-autofix.yml/dispatches" --input - <<<"${payload}"

          delegated_run_id=''
          for _ in $(seq 1 30); do
            delegated_run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/spec-kit-work-map-autofix.yml/runs?event=workflow_dispatch&branch=main&per_page=30" --jq "[.workflow_runs[] | select(.created_at >= \"${dispatch_started_at}\")] | sort_by(.created_at) | last | .id // empty")"
            if [[ -n "${delegated_run_id}" ]]; then break; fi
            sleep 2
          done
          [[ "${delegated_run_id}" =~ ^[1-9][0-9]*$ ]]
          echo "delegated_run_id=${delegated_run_id}" >> "${GITHUB_OUTPUT}"

      - name: Publish canonical PR evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DELEGATED_RUN_ID: ${{ steps.bridge.outputs.delegated_run_id }}
        run: |
          set -Eeuo pipefail
          outcome='passed'
          if [[ "${{ steps.bridge.outcome }}" != 'success' ]]; then outcome='blocked'; fi
          body="WORK_MAP_ARM_BRIDGE_6100_V2 outcome=${outcome} expected_main_sha=${EXPECTED_MAIN_SHA} expected_head_sha=${EXPECTED_HEAD_SHA} target_ref=${EXPECTED_HEAD_REF} authorization_consumed=$([[ '${{ steps.bridge.outcome }}' == 'success' ]] && echo true || echo false) delegated_run_id=${DELEGATED_RUN_ID:-none} official_writer=spec-kit-work-map-autofix.yml direct_generated_edit=false candidate_content_mutation=false protected_branch_mutation=false force_push=false"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${CANONICAL_PR}/comments" -f body="${body}" >/dev/null
