              const routeSignature = String(contract?.route_signature || "").trim().replace(/^([a-z]+)\s+/i, (_, method) => `${method.toUpperCase()} `);
              const migrationFile = String(contract?.migration_file || "").trim();
              const method = routeSignature.split(/\s+/, 1)[0] || "";

