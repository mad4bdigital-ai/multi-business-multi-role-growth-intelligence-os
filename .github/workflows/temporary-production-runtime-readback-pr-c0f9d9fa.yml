name: Temporary Production Runtime Readback PR c0f9d9fa

on:
  pull_request:
    branches:
      - gpt/production-runtime-readback-base-c0f9d9fa-20260802

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOST: auth.mad4b.com
      EXPECTED_SHA: c0f9d9fa84bfbf9edf4967a11a94758cb1491ad3
      EXPECTED_BRANCH: Production
      MERGED_AT: 2026-08-02T17:11:49Z
      REPORT_DIR: production-runtime-readback
    steps:
      - name: Probe public Production runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          python3 <<'PY'
          import datetime as dt
          import hashlib
          import json
          import os
          import re
          import socket
          import ssl
          import urllib.error
          import urllib.request
          from pathlib import Path

          host = os.environ['HOST']
          expected_sha = os.environ['EXPECTED_SHA']
          expected_branch = os.environ['EXPECTED_BRANCH']
          merged_at_raw = os.environ['MERGED_AT']
          output_dir = Path(os.environ['REPORT_DIR'])
          sha_re = re.compile(r'^[0-9a-f]{40}$', re.I)

          def parse_iso(value):
              try:
                  return dt.datetime.fromisoformat(str(value).replace('Z', '+00:00'))
              except Exception:
                  return None

          def collect_shas(value, found=None):
              found = found if found is not None else set()
              if isinstance(value, dict):
                  for child in value.values():
                      collect_shas(child, found)
              elif isinstance(value, list):
                  for child in value:
                      collect_shas(child, found)
              elif isinstance(value, str) and sha_re.fullmatch(value.strip()):
                  found.add(value.strip().lower())
              return sorted(found)

          def request(path):
              url = f'https://{host}{path}'
              req = urllib.request.Request(url, headers={
                  'Accept': 'application/json',
                  'User-Agent': 'mad4b-runtime-readback/1.0',
              })
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      status = response.status
                      raw = response.read(262144)
                      headers = response.headers
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  raw = exc.read(262144)
                  headers = exc.headers
              except Exception as exc:
                  return {'ok': False, 'url': url, 'error_type': type(exc).__name__, 'error': str(exc)[:500]}
              result = {
                  'ok': 200 <= status < 300,
                  'url': url,
                  'status': status,
                  'content_type': str(headers.get('content-type') or '')[:200],
                  'body_bytes': len(raw),
                  'body_sha256': hashlib.sha256(raw).hexdigest(),
              }
              try:
                  payload = json.loads(raw.decode('utf-8'))
                  result['payload'] = payload
                  result['observed_shas'] = collect_shas(payload)
              except Exception:
                  result['payload'] = None
                  result['observed_shas'] = []
              return result

          report = {
              'contract': 'mad4b.production-runtime-readback.v1',
              'generated_at': dt.datetime.now(dt.timezone.utc).isoformat().replace('+00:00', 'Z'),
              'target': {
                  'hostname': host,
                  'expected_branch': expected_branch,
                  'expected_production_sha': expected_sha,
                  'production_merged_at': merged_at_raw,
              },
              'authority': {
                  'public_read_only': True,
                  'credential_access': False,
                  'provider_mutation': False,
                  'repository_mutation': False,
                  'protected_branch_mutation': False,
                  'secrets_included': False,
              },
          }

          try:
              addresses = sorted({row[4][0] for row in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)})
              report['dns'] = {'ok': bool(addresses), 'addresses': addresses[:20]}
          except Exception as exc:
              report['dns'] = {'ok': False, 'error_type': type(exc).__name__, 'error': str(exc)[:500]}

          try:
              context = ssl.create_default_context()
              with socket.create_connection((host, 443), timeout=15) as raw:
                  with context.wrap_socket(raw, server_hostname=host) as secured:
                      cert = secured.getpeercert()
                      report['tls'] = {
                          'ok': True,
                          'protocol': secured.version(),
                          'not_before': cert.get('notBefore'),
                          'not_after': cert.get('notAfter'),
                          'dns_names': [value for kind, value in cert.get('subjectAltName', []) if kind == 'DNS'][:30],
                      }
          except Exception as exc:
              report['tls'] = {'ok': False, 'error_type': type(exc).__name__, 'error': str(exc)[:500]}

          raw_endpoints = {path: request(path) for path in (
              '/health', '/version', '/deployment-info', '/connector-agent/version'
          )}
          health = raw_endpoints['/health']
          version = raw_endpoints['/version']
          deployment_response = raw_endpoints['/deployment-info']
          connector_agent = raw_endpoints['/connector-agent/version']
          deployment = deployment_response.get('payload') if isinstance(deployment_response.get('payload'), dict) else {}
          evidence = deployment.get('evidence') if isinstance(deployment.get('evidence'), dict) else {}
          manifest = deployment.get('deployment') if isinstance(deployment.get('deployment'), dict) else {}

          # Store bounded safe projections only; never persist arbitrary public response bodies.
          report['endpoints'] = {
              '/health': {
                  'ok': health.get('ok'), 'status': health.get('status'),
                  'body_sha256': health.get('body_sha256'),
                  'observed_shas': health.get('observed_shas', []),
              },
              '/version': {
                  'ok': version.get('ok'), 'status': version.get('status'),
                  'body_sha256': version.get('body_sha256'),
                  'observed_shas': version.get('observed_shas', []),
              },
              '/deployment-info': {
                  'ok': deployment_response.get('ok'), 'status': deployment_response.get('status'),
                  'body_sha256': deployment_response.get('body_sha256'),
                  'branch': deployment.get('branch'),
                  'branch_source': deployment.get('branch_source'),
                  'commit': deployment.get('commit'),
                  'commit_sha': deployment.get('commit_sha'),
                  'commit_source': deployment.get('commit_source'),
                  'deployed_at': deployment.get('deployed_at'),
                  'deployed_at_source': deployment.get('deployed_at_source'),
                  'observed_shas': deployment_response.get('observed_shas', []),
                  'manifest': {
                      'present': manifest.get('present'),
                      'source': manifest.get('source'),
                      'branch': manifest.get('branch'),
                      'commit': manifest.get('commit'),
                      'commit_sha': manifest.get('commit_sha'),
                      'deployed_at': manifest.get('deployed_at'),
                      'generated_at': manifest.get('generated_at'),
                  },
                  'evidence': {
                      'commit_sha_available': evidence.get('commit_sha_available'),
                      'branch_available': evidence.get('branch_available'),
                      'deployed_at_available': evidence.get('deployed_at_available'),
                      'git_detected': evidence.get('git_detected'),
                      'manifest_detected': evidence.get('manifest_detected'),
                      'canonical_manifest_detected': evidence.get('canonical_manifest_detected'),
                      'legacy_deployment_commit_detected': evidence.get('legacy_deployment_commit_detected'),
                      'manifest_error': evidence.get('manifest_error'),
                      'secrets_included': evidence.get('secrets_included'),
                  },
              },
              '/connector-agent/version': {
                  'ok': connector_agent.get('ok'), 'status': connector_agent.get('status'),
                  'body_sha256': connector_agent.get('body_sha256'),
                  'observed_shas': connector_agent.get('observed_shas', []),
              },
          }

          deployed_at = parse_iso(deployment.get('deployed_at'))
          merged_at = parse_iso(merged_at_raw)
          deployment_shas = set(deployment_response.get('observed_shas') or [])
          version_shas = set(version.get('observed_shas') or [])
          checks = {
              'dns_resolved': report['dns'].get('ok') is True,
              'tls_verified': report['tls'].get('ok') is True,
              'health_http_success': health.get('ok') is True,
              'version_http_success': version.get('ok') is True,
              'deployment_info_http_success': deployment_response.get('ok') is True,
              'deployment_branch_exact': deployment.get('branch') == expected_branch,
              'deployment_commit_exact': str(deployment.get('commit_sha') or deployment.get('commit') or '').lower() == expected_sha,
              'deployment_sha_observed': expected_sha in deployment_shas,
              'version_sha_observed': expected_sha in version_shas,
              'branch_source_explicit': str(deployment.get('branch_source') or '') not in {'', 'unavailable', 'dev_hostname_fallback'},
              'commit_source_explicit': str(deployment.get('commit_source') or '') not in {'', 'unavailable'},
              'manifest_detected': evidence.get('manifest_detected') is True,
              'canonical_manifest_detected': evidence.get('canonical_manifest_detected') is True,
              'manifest_secret_free': evidence.get('secrets_included') is False,
              'deployment_timestamp_after_merge': bool(deployed_at and merged_at and deployed_at >= merged_at),
          }
          required = list(checks)
          production_current = all(checks.values())
          if production_current:
              classification = 'production_current'
          elif deployment_response.get('ok') and deployment.get('commit_sha') and not checks['deployment_commit_exact']:
              classification = 'runtime_reload_pending'
          elif not health.get('ok') or not deployment_response.get('ok'):
              classification = 'runtime_parity_incomplete'
          else:
              classification = 'hostinger_build_pending_or_runtime_parity_incomplete'

          report.update({
              'checks': checks,
              'required_checks': required,
              'outcome': 'passed' if production_current else 'blocked',
              'classification': classification,
              'production_current': production_current,
              'first_failure': next((name for name, passed in checks.items() if not passed), None),
          })
          (output_dir / 'readback.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          lines = [
              '# Production runtime readback', '',
              f"- Outcome: **{report['outcome']}**",
              f"- Classification: `{classification}`",
              f"- Expected SHA: `{expected_sha}`",
              f"- First failure: `{report['first_failure'] or 'none'}`",
              '- Credential access: **no**',
              '- Repository/provider mutation: **no**',
              '- Secrets included: **no**', '', '## Checks', '',
          ] + [f"- {name}: **{'passed' if passed else 'failed'}**" for name, passed in checks.items()]
          (output_dir / 'readback.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(json.dumps({
              'outcome': report['outcome'],
              'classification': classification,
              'first_failure': report['first_failure'],
              'secrets_included': False,
          }, sort_keys=True))
          PY

      - name: Upload bounded runtime readback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-runtime-readback-${{ github.run_id }}
          path: production-runtime-readback/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce exact runtime parity
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('production-runtime-readback/readback.json').read_text())
          if report.get('production_current') is not True:
              raise SystemExit(f"blocked: {report.get('classification')} / {report.get('first_failure')}")
          PY
