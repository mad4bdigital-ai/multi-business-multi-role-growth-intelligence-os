name: Materialize capability drift notification fanout

on:
  push:
    branches:
      - fix/capability-drift-notification-fanout-4450-20260808
    paths:
      - .github/workflows/materialize-capability-drift-notification-fanout.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v5
        with:
          ref: fix/capability-drift-notification-fanout-4450-20260808
          fetch-depth: 0
          persist-credentials: true

      - name: Verify current main ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          test "$(git rev-parse origin/main)" = "555889dfc4b3e2b37255f94e1d3359f3ed69fec1"

      - name: Apply bounded fanout source and regression patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}")
              p.write_text(text.replace(old, new, 1))

          service = "http-generic-api/operationalAlertService.js"
          test = "http-generic-api/test-operational-alerting-control-plane.mjs"

          replace_once(
              service,
              'import { evaluateCapabilityDriftAgeEscalation } from "./capabilityDriftAlertEscalationPolicy.js";\n',
              '''import { evaluateCapabilityDriftAgeEscalation } from "./capabilityDriftAlertEscalationPolicy.js";\nimport {\n  CAPABILITY_DRIFT_NOTIFICATION_FANOUT_POLICY,\n  buildCapabilityDriftTenantNotificationKey,\n  capabilityDriftNotificationEligible,\n  evaluateCapabilityDriftTenantTargets,\n} from "./capabilityDriftNotificationFanoutPolicy.js";\n'''
          )

          replace_once(
              service,
              '''function notificationEligible(item = {}) {\n  if (item.source_type === CAPABILITY_DRIFT_SOURCE) return false;\n  if (!["critical", "high"].includes(item.severity)) return false;\n  if (!OPEN_LIFECYCLE_STATES.includes(item.lifecycle_status)) return false;\n  if (item.verification_state !== "verified") return false;\n  if (!item.source_record_id) return false;\n  if (["source_data_quality", "task_state_inconsistent"].includes(item.reason_code)) return false;\n  return true;\n}\n\n''',
              '''function notificationEligible(item = {}) {\n  if (item.source_type === CAPABILITY_DRIFT_SOURCE) return capabilityDriftNotificationEligible(item);\n  if (!["critical", "high"].includes(item.severity)) return false;\n  if (!OPEN_LIFECYCLE_STATES.includes(item.lifecycle_status)) return false;\n  if (item.verification_state !== "verified") return false;\n  if (!item.source_record_id) return false;\n  if (["source_data_quality", "task_state_inconsistent"].includes(item.reason_code)) return false;\n  return true;\n}\n\nfunction notificationCandidateFromPersisted(item = {}, row = {}) {\n  if (item.source_type !== CAPABILITY_DRIFT_SOURCE) {\n    return {\n      ...item,\n      severity: row.severity || item.severity,\n      lifecycle_status: row.lifecycle_status || item.lifecycle_status,\n    };\n  }\n  return {\n    ...item,\n    source_type: row.source_type || item.source_type,\n    source_record_id: row.source_record_id || item.source_record_id,\n    severity: row.severity || item.severity,\n    lifecycle_status: row.lifecycle_status || item.lifecycle_status,\n    verification_state: row.verification_state || item.verification_state,\n    evidence: parseConfigJson(row.evidence_json, item.evidence || {}),\n    notification_episode_started_at: row.notification_episode_started_at || null,\n  };\n}\n\nasync function resolveCapabilityDriftNotificationTargets(connection) {\n  const maxTargets = CAPABILITY_DRIFT_NOTIFICATION_FANOUT_POLICY.max_tenant_targets;\n  try {\n    const [rows] = await connection.query(\n      `SELECT DISTINCT m.tenant_id\n         FROM memberships m\n         JOIN tenants t ON t.tenant_id = m.tenant_id\n        WHERE m.status = 'active'\n          AND t.status = 'active'\n          AND m.tenant_id IS NOT NULL\n        ORDER BY m.tenant_id ASC\n        LIMIT ?`,\n      [maxTargets + 1]\n    );\n    return evaluateCapabilityDriftTenantTargets(rows);\n  } catch (error) {\n    return {\n      policy_key: CAPABILITY_DRIFT_NOTIFICATION_FANOUT_POLICY.policy_key,\n      status: "skipped_fail_closed",\n      reason: "active_tenant_target_resolution_failed",\n      error_code: String(error?.code || "tenant_target_resolution_failed").slice(0, 191),\n      max_targets: maxTargets,\n      observed_min_count: 0,\n      target_count: 0,\n      tenant_ids: [],\n      external_send: false,\n    };\n  }\n}\n\n'''
          )

          replace_once(
              service,
              '''  const [rows] = await connection.query(\n    `SELECT alert_id, lifecycle_status, lifecycle_revision, severity, first_seen_at, last_seen_at\n       FROM operational_alerts WHERE alert_key = ? LIMIT 1`,\n    [item.alert_key]\n  );\n''',
              '''  const [rows] = await connection.query(\n    `SELECT alert_id, lifecycle_status, lifecycle_revision, severity, verification_state, source_type,\n            source_record_id, reason_code, title, recommended_action_key, tenant_id, user_id, evidence_json,\n            first_seen_at, last_seen_at, DATE_FORMAT(first_seen_at, '%Y-%m-%d %H:%i:%s') AS notification_episode_started_at\n       FROM operational_alerts WHERE alert_key = ? LIMIT 1`,\n    [item.alert_key]\n  );\n'''
          )

          replace_once(
              service,
              '''  let notificationsSkipped = 0;\n  let resolutionSkipped = false;\n''',
              '''  let notificationsSkipped = 0;\n  let resolutionSkipped = false;\n  let capabilityNotificationFanout = {\n    policy_key: CAPABILITY_DRIFT_NOTIFICATION_FANOUT_POLICY.policy_key,\n    status: "not_applicable",\n    reason: null,\n    max_targets: CAPABILITY_DRIFT_NOTIFICATION_FANOUT_POLICY.max_tenant_targets,\n    target_count: 0,\n    queued_count: 0,\n    external_send: false,\n  };\n'''
          )

          replace_once(
              service,
              '''            OR o.notification_key <> CONCAT(a.alert_key, ':', a.severity, ':open')\n          )`,\n''',
              '''            OR o.notification_key <> CASE\n              WHEN a.source_type = 'v_platform_capability_gaps' THEN CONCAT(\n                a.alert_key, ':', a.severity, ':open:t:',\n                LEFT(SHA2(COALESCE(o.tenant_id, ''), 256), 24), ':e:',\n                LEFT(SHA2(DATE_FORMAT(a.first_seen_at, '%Y-%m-%d %H:%i:%s'), 256), 12)\n              )\n              ELSE CONCAT(a.alert_key, ':', a.severity, ':open')\n            END\n            OR (\n              a.source_type = 'v_platform_capability_gaps'\n              AND (\n                o.tenant_id IS NULL\n                OR NOT EXISTS (\n                  SELECT 1\n                    FROM memberships m\n                    JOIN tenants t ON t.tenant_id = m.tenant_id\n                   WHERE m.tenant_id = o.tenant_id\n                     AND m.status = 'active'\n                     AND t.status = 'active'\n                   LIMIT 1\n                )\n              )\n            )\n          )`,\n'''
          )

          replace_once(
              service,
              '''    notificationsSkipped = safeNumber(skipResult?.affectedRows);\n\n    for (const { item, row } of persistedCandidates) {\n      if (!notificationEligible({ ...item, lifecycle_status: row.lifecycle_status })) continue;\n      const notificationKey = `${item.alert_key}:${item.severity}:open`;\n      const [result] = await connection.query(\n        `INSERT INTO operational_alert_notification_outbox\n          (notification_id, notification_key, alert_id, tenant_id, user_id, channel,\n           recipient_scope, delivery_status, payload_summary_json, created_at, updated_at)\n         VALUES (?, ?, ?, ?, ?, 'in_app', 'authorized_subject', 'pending', ?, NOW(), NOW())\n         ON DUPLICATE KEY UPDATE\n           alert_id = VALUES(alert_id), tenant_id = VALUES(tenant_id), user_id = VALUES(user_id),\n           payload_summary_json = VALUES(payload_summary_json),\n           delivery_status = IF(delivery_status IN ('skipped','failed'), 'pending', delivery_status),\n           error_code = NULL, error_message = NULL, updated_at = CURRENT_TIMESTAMP`,\n        [randomUUID(), notificationKey, row.alert_id, item.tenant_id, item.user_id, JSON.stringify({ title: item.title, severity: item.severity, reason_code: item.reason_code })]\n      );\n      if (safeNumber(result?.affectedRows) > 0) queued += 1;\n    }\n''',
              '''    notificationsSkipped = safeNumber(skipResult?.affectedRows);\n\n    const notificationCandidates = persistedCandidates.map(({ item, row }) => ({\n      item,\n      row,\n      effective: notificationCandidateFromPersisted(item, row),\n    }));\n    const eligibleCapabilityNotifications = notificationCandidates.filter(({ effective }) =>\n      effective.source_type === CAPABILITY_DRIFT_SOURCE && notificationEligible(effective)\n    );\n    if (eligibleCapabilityNotifications.length > 0) {\n      capabilityNotificationFanout = subject.is_admin\n        ? await resolveCapabilityDriftNotificationTargets(connection)\n        : {\n            ...capabilityNotificationFanout,\n            status: "skipped_fail_closed",\n            reason: "platform_admin_sync_required_for_capability_fanout",\n          };\n    }\n\n    for (const { item, row, effective } of notificationCandidates) {\n      if (!notificationEligible(effective)) continue;\n      if (effective.source_type === CAPABILITY_DRIFT_SOURCE) {\n        if (capabilityNotificationFanout.status !== "ready") continue;\n        for (const tenantId of capabilityNotificationFanout.tenant_ids) {\n          const notificationKey = buildCapabilityDriftTenantNotificationKey(\n            effective.alert_key,\n            effective.severity,\n            tenantId,\n            effective.notification_episode_started_at\n          );\n          const [result] = await connection.query(\n            `INSERT INTO operational_alert_notification_outbox\n              (notification_id, notification_key, alert_id, tenant_id, user_id, channel,\n               recipient_scope, delivery_status, payload_summary_json, created_at, updated_at)\n             VALUES (?, ?, ?, ?, NULL, 'in_app', 'active_tenant_members', 'pending', ?, NOW(), NOW())\n             ON DUPLICATE KEY UPDATE\n               alert_id = VALUES(alert_id), tenant_id = VALUES(tenant_id), user_id = NULL,\n               payload_summary_json = VALUES(payload_summary_json),\n               delivery_status = IF(delivery_status IN ('skipped','failed'), 'pending', delivery_status),\n               error_code = NULL, error_message = NULL, updated_at = CURRENT_TIMESTAMP`,\n            [\n              randomUUID(),\n              notificationKey,\n              row.alert_id,\n              tenantId,\n              JSON.stringify({\n                title: effective.title,\n                severity: effective.severity,\n                reason_code: effective.reason_code,\n                source_type: CAPABILITY_DRIFT_SOURCE,\n                recommended_action_key: effective.recommended_action_key || null,\n                fanout_policy_key: CAPABILITY_DRIFT_NOTIFICATION_FANOUT_POLICY.policy_key,\n              }),\n            ]\n          );\n          if (safeNumber(result?.affectedRows) > 0) {\n            queued += 1;\n            capabilityNotificationFanout.queued_count += 1;\n          }\n        }\n        capabilityNotificationFanout = {\n          ...capabilityNotificationFanout,\n          status: "queued",\n        };\n        continue;\n      }\n      const notificationKey = `${effective.alert_key}:${effective.severity}:open`;\n      const [result] = await connection.query(\n        `INSERT INTO operational_alert_notification_outbox\n          (notification_id, notification_key, alert_id, tenant_id, user_id, channel,\n           recipient_scope, delivery_status, payload_summary_json, created_at, updated_at)\n         VALUES (?, ?, ?, ?, ?, 'in_app', 'authorized_subject', 'pending', ?, NOW(), NOW())\n         ON DUPLICATE KEY UPDATE\n           alert_id = VALUES(alert_id), tenant_id = VALUES(tenant_id), user_id = VALUES(user_id),\n           payload_summary_json = VALUES(payload_summary_json),\n           delivery_status = IF(delivery_status IN ('skipped','failed'), 'pending', delivery_status),\n           error_code = NULL, error_message = NULL, updated_at = CURRENT_TIMESTAMP`,\n        [randomUUID(), notificationKey, row.alert_id, effective.tenant_id, effective.user_id, JSON.stringify({ title: effective.title, severity: effective.severity, reason_code: effective.reason_code })]\n      );\n      if (safeNumber(result?.affectedRows) > 0) queued += 1;\n    }\n    if (capabilityNotificationFanout.tenant_ids) {\n      const { tenant_ids: _tenantIds, ...safeFanout } = capabilityNotificationFanout;\n      capabilityNotificationFanout = safeFanout;\n    }\n'''
          )

          replace_once(
              service,
              '''    notification_skipped_count: notificationsSkipped,\n    degraded_sources: incompleteSources,\n''',
              '''    notification_skipped_count: notificationsSkipped,\n    capability_notification_fanout: capabilityNotificationFanout,\n    degraded_sources: incompleteSources,\n'''
          )

          replace_once(
              service,
              '''  groupSkillApprovalRows,\n  notificationEligible,\n  mapPersistedAlert,\n''',
              '''  groupSkillApprovalRows,\n  notificationEligible,\n  notificationCandidateFromPersisted,\n  mapPersistedAlert,\n'''
          )

          replace_once(
              test,
              'import { CAPABILITY_DRIFT_ESCALATION_POLICY, evaluateCapabilityDriftAgeEscalation } from "./capabilityDriftAlertEscalationPolicy.js";\n',
              '''import { CAPABILITY_DRIFT_ESCALATION_POLICY, evaluateCapabilityDriftAgeEscalation } from "./capabilityDriftAlertEscalationPolicy.js";\nimport {\n  CAPABILITY_DRIFT_NOTIFICATION_FANOUT_POLICY,\n  buildCapabilityDriftTenantNotificationKey,\n  capabilityDriftNotificationEligible,\n  evaluateCapabilityDriftTenantTargets,\n} from "./capabilityDriftNotificationFanoutPolicy.js";\n'''
          )

          replace_once(
              test,
              '''function testCapabilityDriftAlertLifecycleProjection() {\n''',
              '''function testCapabilityDriftNotificationFanoutPolicy() {\n  const base = {\n    source_type: CAPABILITY_DRIFT_SOURCE,\n    severity: "high",\n    lifecycle_status: "open",\n    verification_state: "verified",\n    source_record_id: "tenant_tool.wordpress_publish|active_export_missing",\n    notification_episode_started_at: "2026-08-08 12:00:00",\n    evidence: {\n      age_escalation: {\n        policy_key: "capability_drift_age_escalation_v1",\n        blocker_age_hours: 24,\n      },\n    },\n  };\n  assert.equal(CAPABILITY_DRIFT_NOTIFICATION_FANOUT_POLICY.max_tenant_targets, 1000);\n  assert.equal(CAPABILITY_DRIFT_NOTIFICATION_FANOUT_POLICY.channel, "in_app");\n  assert.equal(CAPABILITY_DRIFT_NOTIFICATION_FANOUT_POLICY.recipient_scope, "active_tenant_members");\n  assert.equal(capabilityDriftNotificationEligible(base), true);\n  assert.equal(capabilityDriftNotificationEligible({\n    ...base,\n    evidence: { age_escalation: { policy_key: "capability_drift_age_escalation_v1", blocker_age_hours: 23.99 } },\n  }), false, "capability fan-out must not fire before the blocker becomes persistent");\n  assert.equal(capabilityDriftNotificationEligible({ ...base, notification_episode_started_at: null }), false);\n  assert.equal(capabilityDriftNotificationEligible({ ...base, lifecycle_status: "resolved" }), false);\n\n  const keyA = buildCapabilityDriftTenantNotificationKey("a".repeat(191), "critical", "tenant-a", "2026-08-08 12:00:00");\n  const keyAReplay = buildCapabilityDriftTenantNotificationKey("a".repeat(191), "critical", "tenant-a", "2026-08-08 12:00:00");\n  const keyTenantB = buildCapabilityDriftTenantNotificationKey("a".repeat(191), "critical", "tenant-b", "2026-08-08 12:00:00");\n  const keyNewEpisode = buildCapabilityDriftTenantNotificationKey("a".repeat(191), "critical", "tenant-a", "2026-08-09 12:00:00");\n  assert.equal(keyA, keyAReplay);\n  assert.notEqual(keyA, keyTenantB);\n  assert.notEqual(keyA, keyNewEpisode, "resolved then reopened blocker must be able to queue a new episode notification");\n  assert.ok(keyA.length <= 255, "tenant+episode notification keys must fit the existing schema");\n\n  const targetDecision = evaluateCapabilityDriftTenantTargets([\n    { tenant_id: "tenant-b" },\n    { tenant_id: "tenant-a" },\n    { tenant_id: "tenant-a" },\n    { tenant_id: null },\n  ]);\n  assert.equal(targetDecision.status, "ready");\n  assert.deepEqual(targetDecision.tenant_ids, ["tenant-a", "tenant-b"]);\n  assert.equal(targetDecision.target_count, 2);\n\n  const overCap = evaluateCapabilityDriftTenantTargets(\n    Array.from({ length: 1001 }, (_, index) => ({ tenant_id: `tenant-${String(index).padStart(4, "0")}` }))\n  );\n  assert.equal(overCap.status, "skipped_fail_closed");\n  assert.equal(overCap.reason, "active_tenant_target_cap_exceeded");\n  assert.equal(overCap.target_count, 0);\n  assert.deepEqual(overCap.tenant_ids, []);\n  assert.equal(overCap.observed_min_count, 1001);\n}\n\nfunction testCapabilityDriftAlertLifecycleProjection() {\n'''
          )

          replace_once(
              test,
              '''  assert.equal(_testingOperationalAlerts.notificationEligible({\n    ...tenantPersisted,\n    source_type: CAPABILITY_DRIFT_SOURCE,\n    severity: "high",\n    lifecycle_status: "open",\n    verification_state: "verified",\n    source_record_id: first.sourceRecordId,\n  }), false, "global capability-drift alerts must not fan out notifications before an explicit policy exists");\n''',
              '''  assert.equal(_testingOperationalAlerts.notificationEligible({\n    ...tenantPersisted,\n    source_type: CAPABILITY_DRIFT_SOURCE,\n    severity: "high",\n    lifecycle_status: "open",\n    verification_state: "verified",\n    source_record_id: first.sourceRecordId,\n  }), false, "capability alerts without persisted age-escalation evidence must not fan out");\n\n  const persistedNotificationCandidate = _testingOperationalAlerts.notificationCandidateFromPersisted(\n    {\n      ...newerLiveBaseSeverity,\n      severity: "medium",\n      evidence: { tenant_visible: true },\n    },\n    {\n      severity: "high",\n      lifecycle_status: "investigating",\n      verification_state: "verified",\n      source_type: CAPABILITY_DRIFT_SOURCE,\n      source_record_id: first.sourceRecordId,\n      evidence_json: JSON.stringify({\n        tenant_visible: true,\n        age_escalation: {\n          policy_key: "capability_drift_age_escalation_v1",\n          blocker_age_hours: 24,\n        },\n      }),\n      notification_episode_started_at: "2026-08-08 12:00:00",\n    }\n  );\n  assert.equal(persistedNotificationCandidate.severity, "high", "persisted effective severity must control fan-out, not the pre-upsert live severity");\n  assert.equal(_testingOperationalAlerts.notificationEligible(persistedNotificationCandidate), true);\n'''
          )

          replace_once(
              test,
              '''  const escalationPolicy = read("./capabilityDriftAlertEscalationPolicy.js");\n''',
              '''  const escalationPolicy = read("./capabilityDriftAlertEscalationPolicy.js");\n  const fanoutPolicy = read("./capabilityDriftNotificationFanoutPolicy.js");\n'''
          )

          replace_once(
              test,
              '''  assert.match(escalationPolicy, /critical_after_hours: 72/);\n''',
              '''  assert.match(escalationPolicy, /critical_after_hours: 72/);\n  assert.match(fanoutPolicy, /capability_drift_notification_fanout_v1/);\n  assert.match(fanoutPolicy, /minimum_blocker_age_hours: 24/);\n  assert.match(fanoutPolicy, /max_tenant_targets: 1000/);\n  assert.match(service, /FROM memberships m/);\n  assert.match(service, /JOIN tenants t ON t\.tenant_id = m\.tenant_id/);\n  assert.match(service, /m\.status = 'active'/);\n  assert.match(service, /t\.status = 'active'/);\n  assert.match(service, /maxTargets \+ 1/);\n  assert.match(service, /active_tenant_members/);\n  assert.match(service, /buildCapabilityDriftTenantNotificationKey/);\n  assert.match(service, /DATE_FORMAT\(first_seen_at, '%Y-%m-%d %H:%i:%s'\) AS notification_episode_started_at/);\n  assert.match(service, /LEFT\(SHA2\(COALESCE\(o\.tenant_id, ''\), 256\), 24\)/);\n  assert.match(service, /LEFT\(SHA2\(DATE_FORMAT\(a\.first_seen_at, '%Y-%m-%d %H:%i:%s'\), 256\), 12\)/);\n  assert.match(service, /capability_notification_fanout/);\n  assert.doesNotMatch(service, /channel[^\n]*email|channel[^\n]*webhook/);\n'''
          )

          replace_once(
              test,
              '''  testCapabilityDriftAgeSeverityEscalationPolicy();\n  testCapabilityDriftAlertLifecycleProjection();\n''',
              '''  testCapabilityDriftAgeSeverityEscalationPolicy();\n  testCapabilityDriftNotificationFanoutPolicy();\n  testCapabilityDriftAlertLifecycleProjection();\n'''
          )
          PY

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/test-operational-alerting-control-plane.mjs
          node http-generic-api/scripts/test-operation-observability-service.mjs

      - name: Remove temporary materializer and enforce exact scope
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capability-drift-notification-fanout.yml
          git add -A
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          expected = {
              ".changes/e2e/capability-drift-notification-fanout.json",
              "http-generic-api/capabilityDriftNotificationFanoutPolicy.js",
              "http-generic-api/operationalAlertService.js",
              "http-generic-api/test-operational-alerting-control-plane.mjs",
          }
          actual = set(subprocess.check_output(
              ["git", "diff", "--cached", "--name-only", "origin/main"],
              text=True,
          ).splitlines())
          if actual != expected:
              raise SystemExit(f"unexpected final scope: expected={sorted(expected)} actual={sorted(actual)}")
          PY

      - name: Commit bounded fanout materialization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(observability): queue bounded capability drift tenant attention"
          git push origin HEAD:fix/capability-drift-notification-fanout-4450-20260808
