name: Surface Callability Classification Diagnostic

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/surface-callability-classification-diagnostic.yml

permissions:
  contents: read

concurrency:
  group: surface-callability-classification-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      github.repository == 'mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/pr5210-surface-source-clean-20260803' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TARGET_BRANCH: gpt/pr5210-surface-source-clean-20260803
      WORKFLOW_PATH: .github/workflows/surface-callability-classification-diagnostic.yml
      BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify read-only bounded diagnostic trigger
        shell: bash
        run: |
          set -Eeuo pipefail
          test '${{ github.event.pull_request.head.ref }}' = "${TARGET_BRANCH}"
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          git merge-base --is-ancestor "${BASE_SHA}" HEAD
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "${WORKFLOW_PATH}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Apply exact V4 SQL-derived scope patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/surface-callability-current-main-revalidation-v4.yml').read_text(encoding='utf-8').splitlines()
          start = None
          end = None
          for index, line in enumerate(workflow):
              if line.strip() == "python3 - <<'PY'":
                  start = index + 1
                  continue
              if start is not None and line.strip() == 'PY':
                  end = index
                  break
          if start is None or end is None or end <= start:
              raise SystemExit('v4_scope_patch_extraction_failed')
          extracted = []
          for line in workflow[start:end]:
              extracted.append(line[10:] if line.startswith('          ') else line)
          target = Path('/tmp/apply-v4-sql-scope-patch.py')
          target.write_text('\n'.join(extracted) + '\n', encoding='utf-8')
          PY
          python3 /tmp/apply-v4-sql-scope-patch.py
          node --check http-generic-api/scripts/surface-callability-closure/generate_closure_contracts.mjs

      - name: Generate classification inputs
        working-directory: http-generic-api
        run: |
          node scripts/surface-contract-discovery.mjs --write
          node scripts/surface-callability-closure/generate_closure_contracts.mjs
          node scripts/surface-contract-discovery.mjs --write

      - name: Diagnose classification test
        id: classification
        working-directory: http-generic-api
        continue-on-error: true
        shell: bash
        run: |
          set +e
          diagnostics="../surface-proof/surface-classification-diagnostic"
          mkdir -p "$diagnostics"
          NO_COLOR=1 node test-surface-contract-classification.mjs > "$diagnostics/stdout.log" 2> "$diagnostics/stderr.log"
          status=$?
          printf '%s\n' "$status" > "$diagnostics/status.txt"
          for path in \
            test-surface-contract-classification.mjs \
            surface-contract-classification-evidence.json \
            resource-api-surface-callability.manifest.json; do
            if [ -f "$path" ]; then cp "$path" "$diagnostics/"; fi
          done
          if [ -f ../docs/surface-contract-safety-attestations.json ]; then cp ../docs/surface-contract-safety-attestations.json "$diagnostics/"; fi
          if [ -f ../docs/surface-contract-gap-queue.json ]; then cp ../docs/surface-contract-gap-queue.json "$diagnostics/"; fi
          git status --porcelain --untracked-files=all > "$diagnostics/worktree-status.txt"
          cat "$diagnostics/stdout.log"
          cat "$diagnostics/stderr.log" >&2
          exit "$status"

      - name: Upload classification diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surface-classification-diagnostic-${{ github.run_id }}
          path: surface-proof/surface-classification-diagnostic
          if-no-files-found: error
          retention-days: 2

      - name: Enforce classification result
        if: steps.classification.outcome != 'success'
        run: exit 1
