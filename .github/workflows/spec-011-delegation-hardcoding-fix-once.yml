name: Spec 011 Delegation Hardcoding Fix Once

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  fix:
    if: github.head_ref == 'gpt/spec-011-phase3-delegation-mariadb-certification-final3-20260730'
    runs-on: ubuntu-latest
    steps:
      - name: Check out governed PR head
        uses: actions/checkout@v5
        with:
          ref: gpt/spec-011-phase3-delegation-mariadb-certification-final3-20260730
          fetch-depth: 0

      - name: Replace fixed certification identifiers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          certification = Path('http-generic-api/scripts/delegation-mariadb-disposable-certification.mjs')
          text = certification.read_text()
          replacements = {
              'import { createHash } from "node:crypto";': 'import { createHash, randomUUID } from "node:crypto";',
              'const TENANT_ID = "11111111-1111-4111-8111-111111111111";': 'const TENANT_ID = randomUUID();',
              'const PLAN_ID = "22222222-2222-4222-8222-222222222222";': 'const PLAN_ID = randomUUID();',
              'const CAPABILITY_ENVELOPE_ID = "33333333-3333-4333-8333-333333333333";': 'const CAPABILITY_ENVELOPE_ID = randomUUID();',
              'const APPROVAL_HOLD_ID = "44444444-4444-4444-8444-444444444444";': 'const APPROVAL_HOLD_ID = randomUUID();',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing certification anchor: {old}')
              text = text.replace(old, new, 1)
          certification.write_text(text)

          test_file = Path('http-generic-api/test-delegation-grant-mariadb-runtime-binding.mjs')
          text = test_file.read_text()
          replacements = {
              'import assert from "node:assert/strict";': 'import assert from "node:assert/strict";\nimport { randomUUID } from "node:crypto";',
              'const TENANT_ID = "11111111-1111-4111-8111-111111111111";': 'const TENANT_ID = randomUUID();',
              'grant_id: "22222222-2222-4222-8222-222222222222",': 'grant_id: randomUUID(),',
              'plan_id: "33333333-3333-4333-8333-333333333333",': 'plan_id: randomUUID(),',
              'operationId: "44444444-4444-4444-8444-444444444444",': 'operationId: randomUUID(),',
              'stepId: "55555555-5555-4555-8555-555555555555",': 'stepId: randomUUID(),',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing test anchor: {old}')
              text = text.replace(old, new, 1)
          test_file.write_text(text)
          PY

      - name: Install API dependencies
        shell: bash
        run: npm ci --prefix http-generic-api

      - name: Validate hardcoding ratchet and focused test
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'http-generic-api/scripts/delegation-mariadb-disposable-certification.mjs' \
            'http-generic-api/test-delegation-grant-mariadb-runtime-binding.mjs' \
            > "$RUNNER_TEMP/spec011-hardcoding-files.txt"
          node http-generic-api/scripts/context-kernel-hardcoding-scan.mjs --fail-on=runtime --changed-files-from="$RUNNER_TEMP/spec011-hardcoding-files.txt"
          node http-generic-api/test-delegation-grant-mariadb-runtime-binding.mjs

      - name: Commit clean hardcoding fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "admin-assitant-growth-os[bot]"
          git config user.email "admin-assitant-growth-os[bot]@users.noreply.github.com"
          rm .github/workflows/spec-011-delegation-hardcoding-fix-once.yml
          git add .
          git diff --cached --check
          git commit -m "fix(spec-011): generate disposable delegation fixture identifiers"
          git push origin HEAD:gpt/spec-011-phase3-delegation-mariadb-certification-final3-20260730
