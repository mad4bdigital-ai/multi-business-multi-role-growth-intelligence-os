name: Temporary Spec 012 T033 Clean Final Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-spec012-t033-clean-final-validation.yml
      - http-generic-api/routes/tenantGptOAuthTokenExchangeRoutes.js
      - http-generic-api/scripts/manifests/test-manifest-spec012.mjs
      - http-generic-api/tenantGptAccessTokenProfile.js
      - http-generic-api/tenantGptAccessTokenVerifier.js
      - http-generic-api/tenantGptOAuthTokenExchangeBindingGuard.js
      - http-generic-api/test-spec012-t033-short-lived-bearer-profile.mjs
      - http-generic-api/test-tenant-gpt-access-token-profile.mjs
      - http-generic-api/test-tenant-gpt-access-token-verifier.mjs
      - http-generic-api/test-tenant-gpt-oauth-token-binding-hardening.mjs
      - http-generic-api/test-tenant-gpt-oauth-token-exchange-routes.mjs
      - specs/012-tenant-activation-lifecycle/implementation/pr-2o-t033-short-lived-bearer-profile.json
      - specs/012-tenant-activation-lifecycle/implementation/pr-2o-t033-short-lived-bearer-profile.md

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify exact pull-request head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Install HTTP Generic API dependencies
        working-directory: http-generic-api
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Reconcile fail-closed dependency assertions
        shell: bash
        env:
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("http-generic-api/test-tenant-gpt-oauth-token-exchange-routes.mjs")
          source = path.read_text(encoding="utf-8")
          old = '''let missingVerifierConsumeCalled = false;
          const missingVerifierHarness = createHarness({
            verifyCode: undefined,
            consumeCode: async () => {
              missingVerifierConsumeCalled = true;
              return { consumed: true, outcome: "consumed" };
            },
          });
          const missingVerifier = await runScenario(missingVerifierHarness);
          assert.equal(missingVerifier.status, 503);
          assert.equal(missingVerifier.body.error_code, "oauth_token_exchange_preconsumption_unavailable");
          assert.equal(missingVerifier.body.retry_same_code, true);
          assert.equal(missingVerifierConsumeCalled, false);

          let missingIssuerConsumeCalled = false;
          const missingIssuerHarness = createHarness({
            issueAccessToken: undefined,
            consumeCode: async () => {
              missingIssuerConsumeCalled = true;
              return { consumed: true, outcome: "consumed" };
            },
          });
          const missingIssuer = await runScenario(missingIssuerHarness);
          assert.equal(missingIssuer.status, 503);
          assert.equal(missingIssuer.body.error_code, "oauth_token_exchange_preconsumption_unavailable");
          assert.equal(missingIssuer.body.retry_same_code, true);
          assert.equal(missingIssuerConsumeCalled, false);
          '''
          new = '''assert.throws(
            () => createHarness({ verifyCode: undefined }),
            (error) => error?.code === "oauth_token_exchange_crypto_dependencies_required",
            "route construction must fail closed when the governed code verifier is unavailable",
          );

          assert.throws(
            () => createHarness({ issueAccessToken: undefined }),
            (error) => error?.code === "oauth_token_exchange_crypto_dependencies_required",
            "route construction must fail closed when the governed token issuer is unavailable",
          );
          '''
          if old not in source:
              raise SystemExit("expected missing-dependency assertion block was not found")
          source = source.replace(old, new, 1)
          source = source.replace("  missingVerifierHarness,\n  missingIssuerHarness,\n", "", 1)
          source = source.replace("  missingVerifier,\n  missingIssuer,\n", "", 1)
          if "missingVerifierHarness" in source or "missingIssuerHarness" in source:
              raise SystemExit("stale missing-dependency harness reference remains")
          path.write_text(source, encoding="utf-8")
          PY
          node --check http-generic-api/test-tenant-gpt-oauth-token-exchange-routes.mjs
          (cd http-generic-api && node test-tenant-gpt-oauth-token-exchange-routes.mjs)
          if git diff --quiet -- http-generic-api/test-tenant-gpt-oauth-token-exchange-routes.mjs; then
            echo "Route test already reconciled."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add http-generic-api/test-tenant-gpt-oauth-token-exchange-routes.mjs
            git commit -m "test(spec-012): assert fail-closed OAuth dependencies"
            git push origin "HEAD:${PR_HEAD_BRANCH}"
          fi

      - name: Check reconciled T033 syntax
        run: |
          node --check http-generic-api/routes/tenantGptOAuthTokenExchangeRoutes.js
          node --check http-generic-api/tenantGptAccessTokenProfile.js
          node --check http-generic-api/tenantGptAccessTokenVerifier.js
          node --check http-generic-api/tenantGptOAuthTokenExchangeBindingGuard.js
          node --check http-generic-api/test-tenant-gpt-access-token-profile.mjs
          node --check http-generic-api/test-tenant-gpt-access-token-verifier.mjs
          node --check http-generic-api/test-tenant-gpt-oauth-token-binding-hardening.mjs
          node --check http-generic-api/test-tenant-gpt-oauth-token-exchange-routes.mjs
          node --check http-generic-api/test-spec012-t033-short-lived-bearer-profile.mjs

      - name: Validate shared OAuth route contracts
        working-directory: http-generic-api
        run: node test-auth-oauth-routes.mjs

      - name: Validate T031 binding guard unit
        working-directory: http-generic-api
        run: node test-tenant-gpt-oauth-token-binding-guard.mjs

      - name: Validate T031 exchange route unit
        working-directory: http-generic-api
        run: node test-tenant-gpt-oauth-token-exchange-routes.mjs

      - name: Validate T031 outcome policy unit
        working-directory: http-generic-api
        run: node test-tenant-gpt-oauth-token-exchange-outcome-policy.mjs

      - name: Validate T031 OAuth token route wiring
        working-directory: http-generic-api
        run: node test-spec012-t031-oauth-token-route-wiring.mjs

      - name: Validate governed binding hardening
        working-directory: http-generic-api
        run: node test-tenant-gpt-oauth-token-binding-hardening.mjs

      - name: Validate short-lived bearer profile
        working-directory: http-generic-api
        run: node test-tenant-gpt-access-token-profile.mjs

      - name: Validate access-token verifier
        working-directory: http-generic-api
        run: node test-tenant-gpt-access-token-verifier.mjs

      - name: Validate T032 legacy audience compatibility
        working-directory: http-generic-api
        run: node test-spec012-t032-legacy-audience-compatibility.mjs

      - name: Validate T033 readiness contract
        working-directory: http-generic-api
        run: node test-spec012-t033-short-lived-bearer-profile.mjs
