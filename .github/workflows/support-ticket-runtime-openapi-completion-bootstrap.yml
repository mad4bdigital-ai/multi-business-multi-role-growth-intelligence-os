name: Bootstrap Support Ticket Runtime OpenAPI Completion

on:
  push:
    branches:
      - fix/support-ticket-runtime-openapi-completion-20260802
    paths:
      - .github/workflows/support-ticket-runtime-openapi-completion-bootstrap.yml

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Write source-bound completion contracts
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64
          payloads = {
            '.changes/e2e/support-ticket-runtime-openapi-completion.json': '',
            'http-generic-api/openapi/support-ticket-runtime-completion.yaml': '',
            'http-generic-api/test-support-ticket-runtime-openapi-completion.mjs': '',
          }
          for path, encoded in payloads.items():
            target = Path(path)
            target.parent.mkdir(parents=True, exist_ok=True)
            target.write_bytes(base64.b64decode(encoded))
          appendix = base64.b64decode('').decode('utf-8')
          registry_path = Path('http-generic-api/openapi-route-contracts.yaml')
          registry = registry_path.read_text(encoding='utf-8')
          marker = '# Complete Support Ticket runtime route coverage discovered from routes/supportTicketRoutes.js.'
          if marker in registry:
            raise SystemExit('completion registry marker already exists; refusing duplicate append')
          registry_path.write_text(registry.rstrip() + '\n' + appendix, encoding='utf-8')
          PY
      - name: Run precise completeness regression
        working-directory: http-generic-api
        run: node test-support-ticket-runtime-openapi-completion.mjs
      - name: Commit bounded completion and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/support-ticket-runtime-openapi-completion-bootstrap.yml
          git add \
            .changes/e2e/support-ticket-runtime-openapi-completion.json \
            http-generic-api/openapi-route-contracts.yaml \
            http-generic-api/openapi/support-ticket-runtime-completion.yaml \
            http-generic-api/test-support-ticket-runtime-openapi-completion.mjs
          git commit -m "fix(openapi): complete Support Ticket runtime contracts"
          git push origin HEAD:fix/support-ticket-runtime-openapi-completion-20260802
