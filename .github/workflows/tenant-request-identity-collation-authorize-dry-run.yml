name: Tenant Request Identity Collation Governed Dry Run

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  authorize-dry-run:
    name: Authorize and dry-run tenant request identity collation migration
    if: >-
      github.event.issue.number == 4449 &&
      !github.event.issue.pull_request &&
      github.event.comment.body == 'AUTHORIZE_GOVERNED_MIGRATION_20260808_TENANT_REQUEST_IDENTITY_COLLATION_ALIGNMENT' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: tenant-request-identity-collation-authorize-dry-run
      cancel-in-progress: false
    env:
      RUNTIME_BASE_URL: https://auth.mad4b.com
      BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
      GH_READ_TOKEN: ${{ github.token }}
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      CONTROL_ISSUE: '4449'
      SOURCE_PR: '6662'

    steps:
      - name: Checkout exact issue-comment event head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Re-verify same-cycle read-only readiness
        env:
          EVIDENCE_DIR: .artifacts/tenant-request-identity-collation-governed-dry-run/readiness
        run: node .github/ops/tenant-request-identity-collation-runtime-readiness.mjs

      - name: Bootstrap authorization and execute Dry Run only
        env:
          EVIDENCE_DIR: .artifacts/tenant-request-identity-collation-governed-dry-run/execution
        run: node .github/ops/tenant-request-identity-collation-authorize-dry-run.mjs

      - name: Upload no-secret governed Dry Run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenant-request-identity-collation-governed-dry-run-${{ github.run_id }}
          path: .artifacts/tenant-request-identity-collation-governed-dry-run
          if-no-files-found: error
          retention-days: 30

      - name: Publish governed Dry Run summary
        if: always()
        shell: bash
        run: |
          node <<'NODE' >>"${GITHUB_STEP_SUMMARY}"
          const fs = require('node:fs');
          const summary = '.artifacts/tenant-request-identity-collation-governed-dry-run/execution/summary.json';
          const failure = '.artifacts/tenant-request-identity-collation-governed-dry-run/execution/failure.json';
          if (fs.existsSync(summary)) {
            const s = JSON.parse(fs.readFileSync(summary, 'utf8'));
            process.stdout.write(`## Tenant request identity collation governed Dry Run\n\n- Result: ${s.result}\n- Migration: ${s.migration}\n- Checksum: \`${s.migration_checksum_sha256}\`\n- Statements: ${s.statement_count}\n- Main SHA: \`${s.main_sha}\`\n- Production SHA: \`${s.production_sha}\`\n- Authorization created: ${s.authorization_created}\n- Dry Run sent: ${s.dry_run_sent}\n- Applies SQL: ${s.applies_sql}\n- Preflight risks: ${s.preflight_risk_count}\n- Migration SQL executed: ${s.migration_sql_executed}\n- Provider call executed: ${s.provider_call_executed}\n- Secrets included: ${s.secrets_included}\n`);
          } else {
            const f = fs.existsSync(failure) ? JSON.parse(fs.readFileSync(failure, 'utf8')) : {};
            process.stdout.write(`## Tenant request identity collation governed Dry Run: fail\n\n- Stage: ${f.stage || 'unknown'}\n- Error code: ${f.error?.code || 'workflow_failed'}\n- Authorization created: ${f.authorization_created ?? false}\n- Dry Run sent: ${f.dry_run_sent ?? false}\n- Migration SQL executed: ${f.migration_sql_executed ?? false}\n- Provider call executed: ${f.provider_call_executed ?? false}\n- Secrets included: ${f.secrets_included ?? false}\n`);
          }
          NODE
