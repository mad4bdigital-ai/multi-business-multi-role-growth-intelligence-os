name: Work Map Input Driven Follow-up Writer

on:
  pull_request:
    branches:
      - gpt/exact-phase-g-schema-arm-base-20260803
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write

concurrency:
  group: work-map-input-driven-followup-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish input-driven Work Map governance
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/work-map-input-driven-branch-governance-20260804' &&
      github.event.pull_request.head.sha == '2e7df8403a7ce02e0635a7316b8401b3c0607bbb'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      EXPECTED_MAIN_SHA: 2e7df8403a7ce02e0635a7316b8401b3c0607bbb
      EXPECTED_HEAD_SHA: 2e7df8403a7ce02e0635a7316b8401b3c0607bbb
      TARGET_BRANCH: gpt/work-map-input-driven-branch-governance-20260804
      SCRIPT_BRANCH: gpt/exact-phase-g-schema-arm-base-20260803
      SCRIPT_COMMIT_SHA: 92a91f6bc463397bf201373305341c80fee24f9f
    steps:
      - name: Checkout exact clean branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify immutable clean baseline
        shell: bash
        run: |
          set -euo pipefail
          DIAGNOSTIC_ROOT="${RUNNER_TEMP}/work-map-input-driven-followup-${GITHUB_RUN_ID}"
          printf 'DIAGNOSTIC_ROOT=%s\n' "${DIAGNOSTIC_ROOT}" >> "${GITHUB_ENV}"
          mkdir -p "${DIAGNOSTIC_ROOT}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          test "$(git merge-base "${EXPECTED_MAIN_SHA}" "${EXPECTED_HEAD_SHA}")" = "${EXPECTED_MAIN_SHA}"
          test -z "$(git diff --name-only "${EXPECTED_MAIN_SHA}" "${EXPECTED_HEAD_SHA}")"
          test -z "$(git status --porcelain)"
          test "$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${EXPECTED_HEAD_SHA}"
          cat > "${DIAGNOSTIC_ROOT}/expected-files.txt" <<'EOF'
          .changes/e2e/work-map-autofix-validation-diagnostics.json
          .github/workflows/spec-kit-work-map-autofix.yml
          docs/work-maps/README.md
          docs/work-maps/repository-automation-map.md
          http-generic-api/scripts/maintenance-tools/repository-tool-lifecycle-guard.mjs
          http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs
          http-generic-api/test-work-map-autofix-validation-diagnostics.mjs
          EOF

      - name: Load immutable lifecycle transformer
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${SCRIPT_BRANCH}:refs/remotes/origin/${SCRIPT_BRANCH}"
          git merge-base --is-ancestor "${SCRIPT_COMMIT_SHA}" "refs/remotes/origin/${SCRIPT_BRANCH}"
          git show "${SCRIPT_COMMIT_SHA}:.github/scripts/apply-work-map-lifecycle-fix.py" > /tmp/apply-work-map-lifecycle-fix.py
          python -m py_compile /tmp/apply-work-map-lifecycle-fix.py

      - name: Apply repair regenerate maps and prove idempotency
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/apply-work-map-lifecycle-fix.py
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          first_hash="$(git diff --binary -- docs/work-maps | sha256sum | awk '{print $1}')"
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          second_hash="$(git diff --binary -- docs/work-maps | sha256sum | awk '{print $1}')"
          test "${first_hash}" = "${second_hash}"
          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          printf '%s\n' "${first_hash}" > "${DIAGNOSTIC_ROOT}/generated-diff-sha256.txt"

          git diff --name-only "${EXPECTED_MAIN_SHA}" | LC_ALL=C sort > "${DIAGNOSTIC_ROOT}/actual-files.txt"
          diff -u "${DIAGNOSTIC_ROOT}/expected-files.txt" "${DIAGNOSTIC_ROOT}/actual-files.txt"
          git diff --check "${EXPECTED_MAIN_SHA}"
          git diff --stat "${EXPECTED_MAIN_SHA}" > "${DIAGNOSTIC_ROOT}/diff-stat.txt"

      - name: Run every validation and capture results
        shell: bash
        run: |
          set -uo pipefail
          results="${DIAGNOSTIC_ROOT}/validation-results.tsv"
          : > "${results}"

          run_check() {
            local name="$1"
            shift
            local log="${DIAGNOSTIC_ROOT}/${name}.log"
            set +e
            "$@" >"${log}" 2>&1
            local status=$?
            set -e
            printf '%s\t%s\t%s\n' "${name}" "${status}" "${log##*/}" >> "${results}"
            cat "${log}"
          }

          run_check workflow-yaml ruby -e 'require "yaml"; YAML.load_file(ARGV[0], aliases: true)' .github/workflows/spec-kit-work-map-autofix.yml
          run_check diagnostics-regression node http-generic-api/test-work-map-autofix-validation-diagnostics.mjs
          run_check lifecycle-regression node http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs
          run_check lifecycle-guard-syntax node --check http-generic-api/scripts/maintenance-tools/repository-tool-lifecycle-guard.mjs
          run_check e2e-json node -e "JSON.parse(require('fs').readFileSync('.changes/e2e/work-map-autofix-validation-diagnostics.json','utf8'))"
          run_check marker-git-ref grep -Fq 'git check-ref-format --branch "${TARGET_BRANCH}"' .github/workflows/spec-kit-work-map-autofix.yml
          run_check marker-no-full-ref grep -Fq '[[ "${TARGET_BRANCH}" != refs/* ]]' .github/workflows/spec-kit-work-map-autofix.yml
          run_check marker-no-namespace bash -lc "! grep -Fq '^(gpt|cert|fix|feat|chore|docs|release)' .github/workflows/spec-kit-work-map-autofix.yml"
          run_check work-map-generator-check node http-generic-api/scripts/platform-work-map-generator.mjs --check

          {
            printf 'check\texit_code\tlog\n'
            cat "${results}"
          } > "${DIAGNOSTIC_ROOT}/validation-summary.tsv"
          cat "${DIAGNOSTIC_ROOT}/validation-summary.tsv"

      - name: Enforce validation success
        shell: bash
        run: |
          set -euo pipefail
          test -s "${DIAGNOSTIC_ROOT}/validation-results.tsv"
          awk -F '\t' '$2 != "0" { print; failed=1 } END { exit failed ? 1 : 0 }' "${DIAGNOSTIC_ROOT}/validation-results.tsv"

      - name: Create exact local commit and payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${EXPECTED_HEAD_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .changes/e2e/work-map-autofix-validation-diagnostics.json \
            .github/workflows/spec-kit-work-map-autofix.yml \
            docs/work-maps/README.md \
            docs/work-maps/repository-automation-map.md \
            http-generic-api/scripts/maintenance-tools/repository-tool-lifecycle-guard.mjs \
            http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs \
            http-generic-api/test-work-map-autofix-validation-diagnostics.mjs
          git commit -m "fix(ci): make Work Map branch governance input-driven"
          new_head="$(git rev-parse HEAD)"
          printf 'NEW_HEAD_SHA=%s\n' "${new_head}" >> "${GITHUB_ENV}"
          git diff --name-only "${EXPECTED_MAIN_SHA}" "${new_head}" | LC_ALL=C sort > /tmp/final-files.txt
          diff -u "${DIAGNOSTIC_ROOT}/expected-files.txt" /tmp/final-files.txt
          test -z "$(git status --porcelain)"

          payload="${DIAGNOSTIC_ROOT}/validated-payload"
          mkdir -p "${payload}/.changes/e2e" "${payload}/.github/workflows" "${payload}/docs/work-maps" "${payload}/http-generic-api/scripts/maintenance-tools" "${payload}/http-generic-api/scripts" "${payload}/http-generic-api"
          cp .changes/e2e/work-map-autofix-validation-diagnostics.json "${payload}/.changes/e2e/"
          cp .github/workflows/spec-kit-work-map-autofix.yml "${payload}/.github/workflows/"
          cp docs/work-maps/README.md "${payload}/docs/work-maps/"
          cp docs/work-maps/repository-automation-map.md "${payload}/docs/work-maps/"
          cp http-generic-api/scripts/maintenance-tools/repository-tool-lifecycle-guard.mjs "${payload}/http-generic-api/scripts/maintenance-tools/"
          cp http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs "${payload}/http-generic-api/scripts/"
          cp http-generic-api/test-work-map-autofix-validation-diagnostics.mjs "${payload}/http-generic-api/"
          printf '%s\n' "${new_head}" > "${payload}/local-commit-sha.txt"
          git show -s --format=%T "${new_head}" > "${payload}/local-tree-sha.txt"
          git show -s --format=%P "${new_head}" > "${payload}/local-parent-shas.txt"
          git diff --binary "${EXPECTED_MAIN_SHA}" "${new_head}" > "${payload}/validated.patch"
          sha256sum \
            "${payload}/.changes/e2e/work-map-autofix-validation-diagnostics.json" \
            "${payload}/.github/workflows/spec-kit-work-map-autofix.yml" \
            "${payload}/docs/work-maps/README.md" \
            "${payload}/docs/work-maps/repository-automation-map.md" \
            "${payload}/http-generic-api/scripts/maintenance-tools/repository-tool-lifecycle-guard.mjs" \
            "${payload}/http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs" \
            "${payload}/http-generic-api/test-work-map-autofix-validation-diagnostics.mjs" \
            > "${payload}/sha256sums.txt"

      - name: Run exact lifecycle and E2E gates
        shell: bash
        env:
          BASE_SHA: 2e7df8403a7ce02e0635a7316b8401b3c0607bbb
        run: |
          set -euo pipefail
          export CANDIDATE_SHA="${NEW_HEAD_SHA}"
          node http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs
          git diff --name-status "${BASE_SHA}" "${NEW_HEAD_SHA}" > /tmp/repository-tool-changes.tsv
          node http-generic-api/scripts/maintenance-tools/repository-tool-lifecycle-guard.mjs \
            --changed-files /tmp/repository-tool-changes.tsv \
            --policy .github/repository-maintenance-tool-governance.json \
            --output-dir "${DIAGNOSTIC_ROOT}/repository-tool-lifecycle"
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync(process.env.DIAGNOSTIC_ROOT + '/repository-tool-lifecycle/repository-tool-lifecycle-report.json','utf8')); if(!r.ok || r.findings.length) process.exit(1);"
          node http-generic-api/scripts/e2e-contract-reference-integrity.mjs \
            --base "${BASE_SHA}" --head "${NEW_HEAD_SHA}" \
            --report-file "${DIAGNOSTIC_ROOT}/e2e-contract-reference-integrity.json"
          node http-generic-api/scripts/e2e-contract-git-index-integrity.mjs \
            --report-file "${DIAGNOSTIC_ROOT}/e2e-contract-reference-integrity.json"
          node http-generic-api/scripts/e2e-phase-governance.mjs check \
            --base "${BASE_SHA}" --head "${NEW_HEAD_SHA}" \
            --report-file "${DIAGNOSTIC_ROOT}/e2e-phase-evaluation.json"
          test -z "$(git status --porcelain)"

      - name: Attempt fast-forward push and capture result
        shell: bash
        run: |
          set -euo pipefail
          remote_before="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          printf '%s\n' "${remote_before}" > "${DIAGNOSTIC_ROOT}/remote-before-push.txt"
          test "${remote_before}" = "${EXPECTED_HEAD_SHA}"
          set +e
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" > "${DIAGNOSTIC_ROOT}/push.log" 2>&1
          push_status=$?
          set -e
          printf '%s\n' "${push_status}" > "${DIAGNOSTIC_ROOT}/push-status.txt"
          remote_after="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          printf '%s\n' "${remote_after}" > "${DIAGNOSTIC_ROOT}/remote-after-push.txt"
          cat "${DIAGNOSTIC_ROOT}/push.log"

      - name: Upload complete follow-up evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-map-input-driven-followup-${{ github.run_id }}
          path: ${{ runner.temp }}/work-map-input-driven-followup-${{ github.run_id }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Enforce exact published head
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat "${DIAGNOSTIC_ROOT}/push-status.txt")" = "0"
          test "$(cat "${DIAGNOSTIC_ROOT}/remote-after-push.txt")" = "${NEW_HEAD_SHA}"
