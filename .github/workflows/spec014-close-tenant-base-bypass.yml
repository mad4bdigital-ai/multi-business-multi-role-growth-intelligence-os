name: Patch Spec 014 Tenant Base runtime provenance

on:
  push:
    branches:
      - gpt/014-hostinger/tenant-canary-hardening-recovery-20260801
    paths:
      - .github/workflows/spec014-close-tenant-base-bypass.yml
  pull_request:
    types: [synchronize]
    branches:
      - gpt/hostinger-safe-storage-cleanup-ssh-20260801
    paths:
      - .github/workflows/spec014-close-tenant-base-bypass.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'push' || github.head_ref == 'gpt/014-hostinger/tenant-canary-hardening-recovery-20260801'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
