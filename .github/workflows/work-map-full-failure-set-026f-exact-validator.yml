name: Work Map Full Failure Set 026F Exact Validator

on:
  push:
    branches:
      - gpt/validate-work-map-full-failure-set-026f77-20260804
    paths:
      - .github/workflows/work-map-full-failure-set-026f-exact-validator.yml

permissions:
  contents: write

concurrency:
  group: work-map-full-failure-set-026f-exact-validator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout validator event
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify launcher-only topology
        shell: bash
        env:
          EXPECTED_CANDIDATE: 026f7711b8bee2bb917060693c7f3eb131ab0a77
          LAUNCHER_PATH: .github/workflows/work-map-full-failure-set-026f-exact-validator.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_CANDIDATE"
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$LAUNCHER_PATH"

      - name: Execute all exact-candidate validation contracts
        id: contracts
        shell: bash
        env:
          EXPECTED_CANDIDATE: 026f7711b8bee2bb917060693c7f3eb131ab0a77
        run: |
          set -euo pipefail
          git checkout --detach "$EXPECTED_CANDIDATE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE"

          root="$RUNNER_TEMP/work-map-full-failure-set-026f"
          mkdir -p "$root/logs"
          results="$root/results.tsv"
          failed="$root/failed.tsv"
          : > "$results"
          : > "$failed"

          run_contract() {
            local name="$1"
            shift
            local log="$root/logs/${name}.log"
            set +e
            "$@" >"$log" 2>&1
            local exit_code=$?
            set -e
            cat "$log"
            if [[ "$exit_code" -eq 0 ]]; then
              printf '%s\tpassed\t0\n' "$name" >> "$results"
            else
              printf '%s\tfailed\t%s\n' "$name" "$exit_code" >> "$results"
              printf '%s\t%s\n' "$name" "$exit_code" >> "$failed"
            fi
          }

          run_contract syntax-platform-work-map-generator \
            node --check http-generic-api/scripts/platform-work-map-generator.mjs
          run_contract syntax-platform-work-map-schema-intelligence \
            node --check http-generic-api/scripts/platform-work-map-schema-intelligence.mjs
          run_contract syntax-work-map-schema-classification \
            node --check http-generic-api/scripts/work-map-schema-classification.mjs
          run_contract syntax-work-map-schema-classification-contract \
            node --check http-generic-api/scripts/work-map-schema-classification-contract.mjs
          run_contract syntax-pipeline-connectivity-check \
            node --check http-generic-api/scripts/pipeline-connectivity-check.mjs
          run_contract pipeline-connectivity-check \
            node http-generic-api/scripts/pipeline-connectivity-check.mjs
          run_contract pipeline-connectivity-regression \
            node http-generic-api/test-pipeline-connectivity-check.mjs
          run_contract schema-classification-contract \
            node http-generic-api/scripts/work-map-schema-classification-contract.mjs
          run_contract schema-classification \
            node http-generic-api/scripts/work-map-schema-classification.mjs
          run_contract schema-classification-regression \
            node http-generic-api/test-work-map-schema-classification.mjs
          run_contract schema-classification-contract-regression \
            node http-generic-api/test-work-map-schema-classification-contract.mjs
          run_contract complete-failure-set-regression \
            node http-generic-api/test-work-map-autofix-validation-diagnostics.mjs
          run_contract generated-work-maps-current \
            node http-generic-api/scripts/platform-work-map-generator.mjs --check
          run_contract spec014-final-work-map-readback \
            env REPORT_PATH="$root/spec014-readback.json" \
              node http-generic-api/scripts/spec014-final-work-map-readback.mjs

          failed_count="$(wc -l < "$failed" | tr -d '[:space:]')"
          contract_count="$(wc -l < "$results" | tr -d '[:space:]')"
          test "$contract_count" = "14"

          node - "$results" "$failed" "$root/spec014-readback.json" "$root/report.json" <<'NODE'
          const fs = require('node:fs');
          const [resultsPath, failedPath, readbackPath, outputPath] = process.argv.slice(2);
          const parseRows = (path) => fs.readFileSync(path, 'utf8').trim().split('\n').filter(Boolean).map((line) => {
            const parts = line.split('\t');
            return { name: parts[0], outcome: parts[1] || 'failed', exit_code: Number(parts[2] || parts[1] || 0) };
          });
          const checks = parseRows(resultsPath);
          const failures = fs.readFileSync(failedPath, 'utf8').trim().split('\n').filter(Boolean).map((line) => {
            const [name, exitCode] = line.split('\t');
            return { name, exit_code: Number(exitCode) };
          });
          const readback = JSON.parse(fs.readFileSync(readbackPath, 'utf8'));
          const expected = '026f7711b8bee2bb917060693c7f3eb131ab0a77';
          if (readback.candidate_sha !== expected) throw new Error('readback_candidate_mismatch');
          if (readback.ok !== true || (readback.findings || []).length !== 0) throw new Error('readback_failed');
          if (readback.classification?.ok !== true || readback.classification?.coverage_percent !== 100) throw new Error('classification_failed');
          const report = {
            contract: 'mad4b.work-map-full-failure-set-exact-validation.v1',
            generated_at: new Date().toISOString(),
            candidate_sha: expected,
            checks,
            check_count: checks.length,
            failures,
            failed_count: failures.length,
            complete_failure_set_regression: checks.find((item) => item.name === 'complete-failure-set-regression')?.outcome === 'passed',
            generated_work_maps_current: checks.find((item) => item.name === 'generated-work-maps-current')?.outcome === 'passed',
            spec014_final_readback: readback,
            repository_mutation: false,
            provider_dispatch: false,
            live_database_access: false,
            migration_apply: false,
            production_mutation: false,
            secrets_included: false
          };
          fs.writeFileSync(outputPath, JSON.stringify(report, null, 2) + '\n');
          NODE

          cat "$root/report.json"
          echo "failed_count=$failed_count" >> "$GITHUB_OUTPUT"
          echo "evidence_root=$root" >> "$GITHUB_OUTPUT"

      - name: Publish bounded evidence and remove launcher
        shell: bash
        env:
          BRANCH: gpt/validate-work-map-full-failure-set-026f77-20260804
          EVENT_SHA: ${{ github.sha }}
          EVIDENCE_ROOT: ${{ steps.contracts.outputs.evidence_root }}
          EVIDENCE_PATH: .github/validation/work-map-full-failure-set-026f.json
          LAUNCHER_PATH: .github/workflows/work-map-full-failure-set-026f-exact-validator.yml
        run: |
          set -euo pipefail
          git checkout -B "$BRANCH" "$EVENT_SHA"
          mkdir -p "$(dirname "$EVIDENCE_PATH")"
          cp "$EVIDENCE_ROOT/report.json" "$EVIDENCE_PATH"
          rm "$LAUNCHER_PATH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$EVIDENCE_PATH"
          git add -u "$LAUNCHER_PATH"
          git diff --cached --check
          git commit -m 'test(work-maps): publish exact full-failure-set evidence'
          remote_head="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EVENT_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Enforce exact validation result
        shell: bash
        env:
          FAILED_COUNT: ${{ steps.contracts.outputs.failed_count }}
        run: |
          set -euo pipefail
          test "$FAILED_COUNT" = "0"
