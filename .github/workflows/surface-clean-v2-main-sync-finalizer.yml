name: Surface Clean V2 Main Sync Finalizer

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/surface-clean-v2-main-sync-finalizer.yml

permissions:
  contents: write

concurrency:
  group: surface-clean-v2-main-sync-finalizer-5685
  cancel-in-progress: true

jobs:
  sync-and-finalize:
    if: >-
      github.repository == 'mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os' &&
      github.event.pull_request.number == 5685 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/surface-current-main-clean-v2-20260803' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: gpt/surface-current-main-clean-v2-20260803
      TRIGGER_SHA: ${{ github.event.pull_request.head.sha }}
      MAIN_SHA: 14433d15184bd7e7658281a356a7540e3d2d6dfe
      WORKFLOW_PATH: .github/workflows/surface-clean-v2-main-sync-finalizer.yml
      CONFLICT_PATH: http-generic-api/frontend-surface-dispatch.generated.json

    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify bounded trigger and current main
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${TRIGGER_SHA}"
          test "$(git rev-parse --abbrev-ref HEAD)" = "${TARGET_BRANCH}"
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "${WORKFLOW_PATH}"
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "${MAIN_SHA}"
          git merge-base --is-ancestor "$(git merge-base HEAD origin/main)" HEAD

      - name: Merge main and resolve generated artifact source-first
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          git merge --no-commit --no-ff "${MAIN_SHA}"
          merge_status=$?
          set -e
          test "$merge_status" -ne 0
          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          test "${#conflicts[@]}" -eq 1
          test "${conflicts[0]}" = "${CONFLICT_PATH}"
          git checkout --ours -- "${CONFLICT_PATH}"
          git add "${CONFLICT_PATH}"
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Regenerate Surface evidence from synchronized source
        working-directory: http-generic-api
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/surface-contract-discovery.mjs --write
          node scripts/surface-callability-closure/generate_closure_contracts.mjs
          node scripts/surface-contract-discovery.mjs --write
          npm run frontend:dispatch:generate -- --baseline-ref="${MAIN_SHA}"

      - name: Syntax and focused Surface gates
        working-directory: http-generic-api
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check routes/tenantLifecycleRoutes.js
          node --check scripts/surface-callability-closure/generate_closure_contracts.mjs
          node --check scripts/resource-api-callability-contracts.mjs
          node --check scripts/maintenance-tools/verify-hostinger-full-closure-safety.mjs
          node test-workspace-invitation-controls.mjs
          node test-surface-contract-sql-registry-extractor.mjs
          node test-resource-api-callability-effect-classes.mjs
          node test-resource-api-coverage.mjs
          node test-surface-callability-full-closure.mjs
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-openapi-route-coverage.mjs
          node scripts/maintenance-tools/verify-hostinger-full-closure-safety.mjs
          npm run openapi:auth:check

      - name: Prove scoped queue closure
        working-directory: http-generic-api
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const queue = JSON.parse(fs.readFileSync('../docs/surface-contract-gap-queue.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('resource-api-surface-callability.manifest.json', 'utf8'));
          const scoped = new Set(manifest.source_queue_tool_keys || []);
          const remaining = (queue.top_items || []).filter((item) => (item.remediation || []).some((action) =>
            action.action_key === 'verify_tool_registry_binding' &&
            (action.targets || []).some((key) => scoped.has(key))
          ));
          if (remaining.length) throw new Error(`surface_scoped_queue_not_zero:${remaining.length}`);
          if (manifest.source_queue_item_count !== 20) throw new Error(`surface_source_queue_item_count_mismatch:${manifest.source_queue_item_count}`);
          if ((manifest.source_queue_tool_keys || []).length !== 41) throw new Error(`surface_tool_count_mismatch:${(manifest.source_queue_tool_keys || []).length}`);
          if (manifest.source_queue_evidence_mode !== 'certified_manifest_revalidation') throw new Error(`surface_revalidation_evidence_mode_mismatch:${manifest.source_queue_evidence_mode}`);
          console.log(JSON.stringify({ok:true,repository_queue_items:queue.total_items,remaining_scoped_items:0,source_items:20,tool_keys:41,evidence_mode:manifest.source_queue_evidence_mode,secrets_included:false}));
          NODE

      - name: Remove temporary workflow and enforce bounded outputs
        shell: bash
        run: |
          set -Eeuo pipefail
          rm "${WORKFLOW_PATH}"
          cat > /tmp/allowed.txt <<'EOF'
          .github/workflows/surface-clean-v2-main-sync-finalizer.yml
          docs/surface-contract-discovery-status.json
          docs/surface-contract-discovery-status.md
          docs/surface-contract-gap-queue.json
          docs/surface-contract-gap-queue.md
          docs/surface-contract-safety-attestations.json
          http-generic-api/frontend-operation-governance.generated.json
          http-generic-api/frontend-surface-dispatch.generated.json
          http-generic-api/openapi/frontend-runtime-routes.generated.yaml
          http-generic-api/resource-api-surface-callability.manifest.json
          http-generic-api/surface-contract-classification-evidence.json
          EOF
          sort -u /tmp/allowed.txt -o /tmp/allowed.txt
          git status --porcelain --untracked-files=all | sed -E 's/^...//' | sed -E 's/.* -> //' | sort -u > /tmp/changed.txt
          unexpected="$(comm -23 /tmp/changed.txt /tmp/allowed.txt || true)"
          test -z "$unexpected" || { printf 'unexpected synchronized outputs:\n%s\n' "$unexpected"; exit 1; }
          test ! -e "${WORKFLOW_PATH}"

      - name: Commit synchronized product tree
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_before="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$remote_before" = "${TRIGGER_SHA}"
          test "$(git rev-parse origin/main)" = "${MAIN_SHA}"
          git config user.name 'mad4bdigital-ai'
          git config user.email 'mad4bdigital-ai@users.noreply.github.com'
          git add -A
          git commit -m 'chore(surface): sync main and regenerate closure evidence'
          test "$(git rev-parse HEAD^2)" = "${MAIN_SHA}"
          test "$(git rev-list --parents -n1 HEAD | awk '{print NF}')" -eq 3
          test ! -e "${WORKFLOW_PATH}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "$(git rev-parse HEAD)"
