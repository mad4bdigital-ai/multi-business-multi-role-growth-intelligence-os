name: Repair capability drift alert lifecycle

on:
  push:
    branches:
      - fix/capability-drift-alert-lifecycle-4450-4451-20260808
    paths:
      - .github/ops/repair-capability-drift-alert-lifecycle.trigger

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/capability-drift-alert-lifecycle-4450-4451-20260808
          fetch-depth: 0

      - name: Verify branch contains current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "fix/capability-drift-alert-lifecycle-4450-4451-20260808"
          git fetch origin main --no-tags
          git merge-base --is-ancestor origin/main HEAD

      - name: Configure bot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply bounded lifecycle patch
        shell: bash
        run: |
          set -euo pipefail
          cat > http-generic-api/capabilityDriftAlertAdapter.js <<'EOF_ADAPTER'
          import { createHash } from "node:crypto";
          import { buildCapabilityDriftSignals } from "./capabilityDriftSignalProjection.js";

          export const CAPABILITY_DRIFT_SOURCE = "v_platform_capability_gaps";

          function sha256(value) {
            return createHash("sha256").update(String(value || ""), "utf8").digest("hex");
          }

          function text(value = "", max = 512) {
            return String(value ?? "").trim().slice(0, max);
          }

          export function buildCapabilityDriftAlertInputs(rows = [], {
            subject = {},
            persistenceMode = false,
          } = {}) {
            const principalScope = subject.is_admin ? "admin" : "tenant";
            const tenantId = subject.tenant_id || null;
            const inputs = [];
            for (const row of Array.isArray(rows) ? rows : []) {
              const [signal] = buildCapabilityDriftSignals([row], {
                principalScope,
                tenantId,
                generatedAt: row.observed_at || new Date(),
              });
              if (!signal) continue;
              const capabilityKey = text(row.capability_key, 255);
              const gapKey = text(row.gap_key, 128).toLowerCase() || "capability_gap";
              const alertKey = `capability-drift-alert.${sha256(`${capabilityKey}|${gapKey}`)}`;
              const displayName = text(row.display_name || capabilityKey, 191) || "Capability";
              inputs.push({
                alertKey,
                sourceType: CAPABILITY_DRIFT_SOURCE,
                sourceRef: signal.source_ref,
                sourceRecordId: alertKey,
                tenantId: persistenceMode ? null : (subject.is_admin ? null : tenantId),
                category: "capability_drift",
                severity: signal.severity,
                title: `${displayName} capability readiness requires attention`,
                summary: signal.safe_customer_summary,
                reasonCode: `capability_drift_${gapKey}`,
                verificationState: "verified",
                evidenceType: "platform_capability_gap",
                evidenceRef: signal.source_ref,
                evidence: {
                  tenant_visible: true,
                  capability_key: capabilityKey,
                  gap_key: gapKey,
                  source_domain: signal.source_domain,
                  recommended_next_action: signal.recommended_next_action,
                  repair_class: signal.auto_repair.repair_class,
                  auto_repair_eligible: false,
                  execution_linked: false,
                  ...(signal.admin_evidence ? { admin_evidence: signal.admin_evidence } : {}),
                },
                occurrenceCount: 1,
                firstSeenAt: signal.last_seen_at,
                lastSeenAt: signal.last_seen_at,
                recommendedActionKey: signal.recommended_next_action,
                requiresConfirmation: false,
              });
            }
            return inputs;
          }
          EOF_ADAPTER

          mkdir -p .changes/e2e
          cat > .changes/e2e/capability-drift-alert-lifecycle.json <<'EOF_E2E'
          {
            "$schema": "../../.specify/schemas/e2e-phases.schema.json",
            "schema_version": 1,
            "feature_key": "capability-drift-alert-lifecycle",
            "title": "Persist tenant-visible capability drift in the canonical operational alert lifecycle",
            "delivery_mode": "single_pr",
            "current_phase": "mvp",
            "scope": {
              "include": [
                ".changes/e2e/capability-drift-alert-lifecycle.json",
                "http-generic-api/capabilityDriftAlertAdapter.js",
                "http-generic-api/operationalAlertService.js",
                "http-generic-api/test-operational-alerting-control-plane.mjs"
              ]
            },
            "merge_contract": {
              "minimum_phase": "mvp"
            },
            "phases": [
              {
                "id": "mvp",
                "status": "implemented",
                "objective": "Persist platform-global tenant-visible capability drift through the existing operational_alerts lifecycle while projecting it safely into each tenant read without adding a tenant mutation route or duplicating alert storage.",
                "e2e_journeys": [
                  {
                    "id": "admin-sync-persists-global-capability-drift-and-tenant-read-projects-it-safely",
                    "end_to_end": true,
                    "level": "synthetic_runtime",
                    "actor": "Platform Admin synchronizer followed by an authenticated tenant reader",
                    "entrypoint": "POST /activation/operational-attention/sync followed by GET /tenant/activation/operational-attention",
                    "terminal_outcome": "One canonical tenant-visible capability-gap alert is persisted globally, repeated healthy syncs advance occurrence/last-seen state, disappearance resolves it with lifecycle evidence, degraded source reads cannot auto-resolve it, and tenant reads project the alert into their tenant scope without admin evidence.",
                    "steps": [
                      "Read only tenant-visible rows from v_platform_capability_gaps and canonical capability/maturity views.",
                      "Map each capability+gap pair to one scope-independent operational alert key while preserving the existing safe remediation classification.",
                      "Persist through the existing operational_alerts synchronization transaction rather than a parallel table or direct side effect.",
                      "Increment occurrence_count only for this snapshot source while preserving authoritative aggregate-count behavior for existing sources.",
                      "Keep capability-drift alerts out of notification outbox until a governed tenant fan-out policy exists.",
                      "Auto-resolve a persisted capability-drift alert only when all sources are healthy and the canonical gap is no longer emitted.",
                      "Project a persisted global tenant-visible capability alert into the requesting tenant scope and strip admin_evidence from the tenant response."
                    ],
                    "assertions": [
                      "Only exposure_scope=tenant capability gaps enter the persistent operational alert source.",
                      "The same capability+gap produces one stable global alert key across tenants and observation times.",
                      "Admin synchronization persists the capability alert with tenant_id=null; tenant reads project tenant_id to the authenticated tenant.",
                      "Tenant projection strips admin_evidence while Admin projection may retain bounded internal registry evidence.",
                      "Repeated capability-drift synchronization increments occurrence_count without changing aggregate-count semantics for other sources.",
                      "Capability-drift alerts do not enter notification outbox before an explicit fan-out policy exists.",
                      "A degraded or truncated capability source prevents stale-alert auto-resolution.",
                      "No new table, migration, tenant sync mutation route, provider call, managed repair execution, Production action, or secret read is introduced."
                    ],
                    "tests": [
                      {
                        "id": "operational-alerting-capability-drift-lifecycle-regression",
                        "runner": "node",
                        "working_directory": "http-generic-api",
                        "path": "test-operational-alerting-control-plane.mjs",
                        "args": []
                      }
                    ],
                    "evidence_paths": [
                      ".changes/e2e/capability-drift-alert-lifecycle.json",
                      "http-generic-api/capabilityDriftAlertAdapter.js",
                      "http-generic-api/operationalAlertService.js",
                      "http-generic-api/test-operational-alerting-control-plane.mjs"
                    ]
                  }
                ]
              }
            ]
          }
          EOF_E2E

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          service_path = Path("http-generic-api/operationalAlertService.js")
          service = service_path.read_text()
          service = replace_once(
              service,
              'import { buildSqlCacheOperationalDiagnostics } from "./sqlCacheOperationalDiagnostics.js";\n',
              'import { buildSqlCacheOperationalDiagnostics } from "./sqlCacheOperationalDiagnostics.js";\nimport { CAPABILITY_DRIFT_SOURCE, buildCapabilityDriftAlertInputs } from "./capabilityDriftAlertAdapter.js";\n',
              "capability adapter import",
          )
          service = replace_once(
              service,
              'const SOURCE_ROW_CAPS = Object.freeze({\n',
              'const SOURCE_ROW_CAPS = Object.freeze({\n  [CAPABILITY_DRIFT_SOURCE]: 250,\n',
              "capability source row cap",
          )
          service = replace_once(
              service,
              'async function collectOperationalAlertCandidates({ subject, lookbackHours = 168, includePersisted = true } = {}) {',
              'async function collectOperationalAlertCandidates({ subject, lookbackHours = 168, includePersisted = true, persistenceMode = false } = {}) {',
              "candidate collector persistence mode",
          )
          service = replace_once(
              service,
              '  const queries = [\n    collectExecutionLogSource({ tenantExecution, boundedLookback }),\n',
              '''  const queries = [\n    collectExecutionLogSource({ tenantExecution, boundedLookback }),\n    safeRows(\n      CAPABILITY_DRIFT_SOURCE,\n      `SELECT g.capability_key, g.gap_key, g.gap_severity, g.gap_description,\n              c.display_name, c.capability_family, c.source_table, c.source_key,\n              c.runtime_status, c.exposure_scope, c.operation_class, c.risk_class,\n              c.evidence_ref, m.maturity_status, m.maturity_score, m.gap_flags,\n              NOW() AS observed_at\n         FROM v_platform_capability_gaps g\n         JOIN v_platform_capabilities_current c ON c.capability_key = g.capability_key\n         LEFT JOIN v_platform_capability_maturity m ON m.capability_key = g.capability_key\n        WHERE c.exposure_scope = 'tenant'\n        ORDER BY FIELD(g.gap_severity,'critical','high','medium','low'), g.capability_key ASC, g.gap_key ASC\n        LIMIT 250`,\n      []\n    ),\n''',
              "capability source query",
          )
          service = replace_once(
              service,
              '  alerts.push(...mapExecutionAlerts(bySource.get("execution_log")?.rows || []));\n',
              '''  alerts.push(...mapExecutionAlerts(bySource.get("execution_log")?.rows || []));\n\n  for (const input of buildCapabilityDriftAlertInputs(\n    bySource.get(CAPABILITY_DRIFT_SOURCE)?.rows || [],\n    { subject, persistenceMode }\n  )) {\n    alerts.push(candidate(input));\n  }\n''',
              "capability alert mapping",
          )
          service = replace_once(
              service,
              'function notificationEligible(item = {}) {\n  if (!["critical", "high"].includes(item.severity)) return false;\n',
              'function notificationEligible(item = {}) {\n  if (item.source_type === CAPABILITY_DRIFT_SOURCE) return false;\n  if (!["critical", "high"].includes(item.severity)) return false;\n',
              "capability notification suppression",
          )
          service = replace_once(
              service,
              'function mapPersistedAlert(row) {\n  let evidence = row.evidence_json;\n',
              'function mapPersistedAlert(row, { subject = null } = {}) {\n  let evidence = row.evidence_json;\n',
              "persisted projection signature",
          )
          service = replace_once(
              service,
              '''  if (typeof evidence === "string") {\n    try { evidence = JSON.parse(evidence); } catch { evidence = {}; }\n  }\n  return candidate({\n''',
              '''  if (typeof evidence === "string") {\n    try { evidence = JSON.parse(evidence); } catch { evidence = {}; }\n  }\n  const tenantCapabilityProjection = Boolean(\n    subject && !subject.is_admin && row.source_type === CAPABILITY_DRIFT_SOURCE && !row.tenant_id\n  );\n  if (tenantCapabilityProjection && evidence && typeof evidence === "object") {\n    const { admin_evidence: _adminEvidence, ...tenantSafeEvidence } = evidence;\n    evidence = tenantSafeEvidence;\n  }\n  return candidate({\n''',
              "tenant capability persisted evidence stripping",
          )
          service = replace_once(
              service,
              '''    sourceRecordId: row.source_record_id,\n    tenantId: row.tenant_id,\n    userId: row.user_id,\n''',
              '''    sourceRecordId: row.source_record_id,\n    tenantId: tenantCapabilityProjection ? subject.tenant_id || null : row.tenant_id,\n    userId: row.user_id,\n''',
              "tenant capability persisted scope projection",
          )
          service = replace_once(
              service,
              '        WHERE ${subject.is_admin ? "1 = 1" : "tenant_id = ?"}\n',
              '        WHERE ${subject.is_admin ? "1 = 1" : "(tenant_id = ? OR (tenant_id IS NULL AND source_type = \'v_platform_capability_gaps\'))"}\n',
              "tenant persisted global capability visibility",
          )
          service = replace_once(
              service,
              '  for (const row of bySource.get("operational_alerts")?.rows || []) alerts.push(mapPersistedAlert(row));\n',
              '  for (const row of bySource.get("operational_alerts")?.rows || []) alerts.push(mapPersistedAlert(row, { subject }));\n',
              "persisted capability tenant projection call",
          )
          service = replace_once(
              service,
              '        authority: result.authority || "sql_primary_runtime_table",\n',
              '        authority: result.authority || (result.source === CAPABILITY_DRIFT_SOURCE ? "mysql_primary_capability_gap_view" : "sql_primary_runtime_table"),\n',
              "capability source authority",
          )
          service = replace_once(
              service,
              '       occurrence_count = VALUES(occurrence_count), first_seen_at = LEAST(first_seen_at, VALUES(first_seen_at)),\n',
              '''       occurrence_count = CASE\n         WHEN VALUES(source_type) = 'v_platform_capability_gaps' THEN occurrence_count + 1\n         ELSE VALUES(occurrence_count)\n       END, first_seen_at = LEAST(first_seen_at, VALUES(first_seen_at)),\n''',
              "capability occurrence increment",
          )
          service = replace_once(
              service,
              '  const collected = await collectOperationalAlertCandidates({ subject, lookbackHours, includePersisted: false });\n',
              '  const collected = await collectOperationalAlertCandidates({ subject, lookbackHours, includePersisted: false, persistenceMode: true });\n',
              "sync persistence mode",
          )
          service = replace_once(
              service,
              '  notificationEligible,\n  summarize,\n',
              '  notificationEligible,\n  mapPersistedAlert,\n  summarize,\n',
              "testing persisted projection export",
          )
          service_path.write_text(service)

          test_path = Path("http-generic-api/test-operational-alerting-control-plane.mjs")
          test = test_path.read_text()
          test = replace_once(
              test,
              'import { _testingOperationalAlerts } from "./operationalAlertService.js";\n',
              'import { _testingOperationalAlerts } from "./operationalAlertService.js";\nimport { CAPABILITY_DRIFT_SOURCE, buildCapabilityDriftAlertInputs } from "./capabilityDriftAlertAdapter.js";\n',
              "capability lifecycle test import",
          )
          lifecycle_test = r'''
          function testCapabilityDriftAlertLifecycleProjection() {
            const tenantVisible = {
              capability_key: "tenant_tool.wordpress_publish",
              gap_key: "active_export_missing",
              gap_severity: "high",
              display_name: "WordPress Publish",
              capability_family: "tenant_tool",
              source_table: "tenant_platform_endpoint_tools",
              source_key: "wordpress_publish",
              runtime_status: "active",
              exposure_scope: "tenant",
              operation_class: "tenant_tool_dispatch",
              risk_class: "B",
              maturity_status: "runtime_exists",
              maturity_score: 4,
              gap_flags: "active_export_missing",
              evidence_ref: null,
              observed_at: "2026-08-08T15:00:00.000Z",
            };
            const internalOnly = {
              ...tenantVisible,
              capability_key: "admin_tool.internal_repair",
              source_key: "internal_repair",
              exposure_scope: "admin",
            };
            const tenantOne = buildCapabilityDriftAlertInputs([tenantVisible, internalOnly], {
              subject: { is_admin: false, tenant_id: "tenant-1" },
            });
            assert.equal(tenantOne.length, 1, "tenant alert projection must exclude admin-only capability gaps");
            const first = tenantOne[0];
            assert.match(first.alertKey, /^capability-drift-alert\.[a-f0-9]{64}$/);
            assert.equal(first.sourceType, CAPABILITY_DRIFT_SOURCE);
            assert.equal(first.tenantId, "tenant-1");
            assert.equal(first.reasonCode, "capability_drift_active_export_missing");
            assert.equal(first.occurrenceCount, 1);
            assert.equal(first.verificationState, "verified");
            assert.equal(first.requiresConfirmation, false);
            assert.equal(first.evidence.tenant_visible, true);
            assert.equal(first.evidence.auto_repair_eligible, false);
            assert.equal(first.evidence.repair_class, "platform_admin_required");
            assert.equal(first.evidence.admin_evidence, undefined);

            const tenantTwoLater = buildCapabilityDriftAlertInputs([
              { ...tenantVisible, observed_at: "2026-08-08T16:00:00.000Z" },
            ], {
              subject: { is_admin: false, tenant_id: "tenant-2" },
            });
            assert.equal(tenantTwoLater[0].alertKey, first.alertKey, "platform-global capability drift must dedupe across tenant projections and observation times");
            assert.notEqual(tenantTwoLater[0].lastSeenAt, first.lastSeenAt);

            const persistenceInput = buildCapabilityDriftAlertInputs([tenantVisible], {
              subject: { is_admin: true },
              persistenceMode: true,
            })[0];
            assert.equal(persistenceInput.alertKey, first.alertKey);
            assert.equal(persistenceInput.tenantId, null, "Admin sync must persist one global tenant-visible capability alert, not one row per tenant");
            assert.equal(persistenceInput.evidence.admin_evidence.source_table, "tenant_platform_endpoint_tools");

            const persistedRow = {
              alert_id: "alert-capability-1",
              alert_key: first.alertKey,
              fingerprint_sha256: "a".repeat(64),
              operation_fingerprint_sha256: null,
              resource_fingerprint_sha256: null,
              source_type: CAPABILITY_DRIFT_SOURCE,
              source_ref: first.sourceRef,
              source_record_id: first.sourceRecordId,
              tenant_id: null,
              user_id: null,
              workspace_id: null,
              container_key: null,
              category: "capability_drift",
              severity: "high",
              title: first.title,
              summary: first.summary,
              reason_code: first.reasonCode,
              lifecycle_status: "investigating",
              verification_state: "verified",
              evidence_type: "platform_capability_gap",
              evidence_ref: first.evidenceRef,
              evidence_json: JSON.stringify({
                tenant_visible: true,
                capability_key: tenantVisible.capability_key,
                gap_key: tenantVisible.gap_key,
                admin_evidence: { source_table: "tenant_platform_endpoint_tools", source_key: "wordpress_publish" },
              }),
              occurrence_count: 7,
              first_seen_at: "2026-08-08T12:00:00.000Z",
              last_seen_at: "2026-08-08T15:00:00.000Z",
              updated_at: "2026-08-08T15:00:00.000Z",
              recommended_action_key: first.recommendedActionKey,
              requires_confirmation: 0,
              manual_known_issue: 0,
            };
            const tenantPersisted = _testingOperationalAlerts.mapPersistedAlert(persistedRow, {
              subject: { is_admin: false, tenant_id: "tenant-1" },
            });
            assert.equal(tenantPersisted.tenant_id, "tenant-1");
            assert.equal(tenantPersisted.lifecycle_status, "investigating");
            assert.equal(tenantPersisted.occurrence_count, 7);
            assert.equal(tenantPersisted.evidence.admin_evidence, undefined, "tenant persisted projection must strip Admin registry evidence");
            const adminPersisted = _testingOperationalAlerts.mapPersistedAlert(persistedRow, {
              subject: { is_admin: true },
            });
            assert.equal(adminPersisted.tenant_id, null);
            assert.equal(adminPersisted.evidence.admin_evidence.source_table, "tenant_platform_endpoint_tools");
            assert.equal(_testingOperationalAlerts.notificationEligible({
              ...tenantPersisted,
              source_type: CAPABILITY_DRIFT_SOURCE,
              severity: "high",
              lifecycle_status: "open",
              verification_state: "verified",
              source_record_id: first.sourceRecordId,
            }), false, "global capability-drift alerts must not fan out notifications before an explicit policy exists");
          }

          '''.strip() + "\n\n"
          marker = 'function testRepositoryContracts() {'
          if test.count(marker) != 1:
              raise SystemExit("capability lifecycle test insertion marker mismatch")
          test = test.replace(marker, lifecycle_test + marker, 1)
          test = replace_once(
              test,
              '  assert.match(service, /collectExecutionLogSource/);\n',
              '''  assert.match(service, /collectExecutionLogSource/);\n  assert.match(service, /v_platform_capability_gaps/);\n  assert.match(service, /WHERE c\.exposure_scope = 'tenant'/);\n  assert.match(service, /mysql_primary_capability_gap_view/);\n  assert.match(service, /persistenceMode: true/);\n  assert.match(service, /tenant_id IS NULL AND source_type = 'v_platform_capability_gaps'/);\n  assert.match(service, /WHEN VALUES\(source_type\) = 'v_platform_capability_gaps' THEN occurrence_count \+ 1/);\n  assert.match(service, /item\.source_type === CAPABILITY_DRIFT_SOURCE/);\n''',
              "capability lifecycle repository contracts",
          )
          test = replace_once(
              test,
              '  testDedupeAndLifecyclePrecedence();\n  testSummaryAndRouteInputs();\n',
              '  testDedupeAndLifecyclePrecedence();\n  testCapabilityDriftAlertLifecycleProjection();\n  testSummaryAndRouteInputs();\n',
              "capability lifecycle test invocation",
          )
          test_path.write_text(test)
          PY

          git rm .github/workflows/repair-capability-drift-alert-lifecycle.yml
          git rm .github/ops/repair-capability-drift-alert-lifecycle.trigger
          git add -A

      - name: Run focused regression tests
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/test-operational-alerting-control-plane.mjs
          node http-generic-api/scripts/test-operation-observability-service.mjs

      - name: Assert bounded final scope
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff --cached --name-only --diff-filter=ACDMRTUXB HEAD^ | sort)"
          expected="$(printf '%s\n' \
            .changes/e2e/capability-drift-alert-lifecycle.json \
            http-generic-api/capabilityDriftAlertAdapter.js \
            http-generic-api/operationalAlertService.js \
            http-generic-api/test-operational-alerting-control-plane.mjs | sort)"
          test "$actual" = "$expected"

      - name: Commit bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --check
          git commit -m "feat(observability): persist capability drift alert lifecycle"
          git push origin HEAD:fix/capability-drift-alert-lifecycle-4450-4451-20260808
