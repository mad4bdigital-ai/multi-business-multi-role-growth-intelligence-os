name: TEMP Exact Head R7 Validation 6100 V2

on:
  pull_request:
    branches:
      - gpt/validate-r7-base-6100-0ccfc93b
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: temp-exact-head-r7-validation-6100-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate exact R7 candidate read-only
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      CANONICAL_PR: '6100'
      EXPECTED_MAIN_SHA: 0ccfc93b64b70c65df423d141f91861fba0b1d4e
      EXPECTED_HEAD_SHA: 490345cbba29f6ec2ca3195f8e9711bf3b2a01e1
      EXPECTED_HEAD_REF: gpt/hostinger-production-runtime-readback-r7-main-0ccfc93b-20260804
      REPORT_DIR: ${{ runner.temp }}/r7-exact-head-validation-6100
    steps:
      - name: Pin canonical identity before execution
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${CANONICAL_PR}")"
          test "$(jq -r '.state' <<<"${pr}")" = 'open'
          test "$(jq -r '.draft' <<<"${pr}")" = 'true'
          test "$(jq -r '.base.ref' <<<"${pr}")" = 'main'
          test "$(jq -r '.base.sha' <<<"${pr}")" = "${EXPECTED_MAIN_SHA}"
          test "$(jq -r '.head.repo.full_name' <<<"${pr}")" = "${GITHUB_REPOSITORY}"
          test "$(jq -r '.head.ref' <<<"${pr}")" = "${EXPECTED_HEAD_REF}"
          test "$(jq -r '.head.sha' <<<"${pr}")" = "${EXPECTED_HEAD_SHA}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "${EXPECTED_MAIN_SHA}"
          comparison="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${EXPECTED_HEAD_SHA}")"
          test "$(jq -r '.behind_by' <<<"${comparison}")" = '0'
          test "$(jq -r '.merge_base_commit.sha' <<<"${comparison}")" = "${EXPECTED_MAIN_SHA}"

      - name: Checkout exact canonical head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify exact scope and run contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          git fetch --no-tags origin "${EXPECTED_MAIN_SHA}"
          mkdir -p "${REPORT_DIR}"
          cat > "${REPORT_DIR}/expected-files.txt" <<'EOF'
          .changes/e2e/hostinger-production-runtime-readback-r7.json
          .github/workflows/hostinger-production-runtime-readback-r7.yml
          docs/work-maps/README.md
          docs/work-maps/repository-automation-map.md
          http-generic-api/test-hostinger-production-runtime-readback-r7.mjs
          EOF
          git diff --name-only "${EXPECTED_MAIN_SHA}...${EXPECTED_HEAD_SHA}" | sort > "${REPORT_DIR}/actual-files.txt"
          diff -u "${REPORT_DIR}/expected-files.txt" "${REPORT_DIR}/actual-files.txt"
          git diff --check "${EXPECTED_MAIN_SHA}...${EXPECTED_HEAD_SHA}"

          run_contract() {
            local name="$1"
            shift
            echo "::group::${name}"
            "$@" 2>&1 | tee "${REPORT_DIR}/${name}.log"
            echo "::endgroup::"
          }

          run_contract r7-workflow-contract node http-generic-api/test-hostinger-production-runtime-readback-r7.mjs
          run_contract e2e-reference-integrity node http-generic-api/test-e2e-contract-reference-integrity.mjs
          run_contract e2e-git-index-integrity node http-generic-api/test-e2e-contract-git-index-integrity.mjs
          run_contract pipeline-connectivity node http-generic-api/scripts/pipeline-connectivity-check.mjs
          run_contract pipeline-connectivity-regression node http-generic-api/test-pipeline-connectivity-check.mjs
          run_contract schema-classification-contract node http-generic-api/scripts/work-map-schema-classification-contract.mjs
          run_contract schema-classification node http-generic-api/scripts/work-map-schema-classification.mjs
          run_contract schema-classification-regression node http-generic-api/test-work-map-schema-classification.mjs
          run_contract schema-classification-contract-regression node http-generic-api/test-work-map-schema-classification-contract.mjs
          run_contract work-map-generator-currentness node http-generic-api/scripts/platform-work-map-generator.mjs --check
          run_contract repository-tool-lifecycle-regression node http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs
          REPORT_PATH="${REPORT_DIR}/spec014-final-work-map-readback.json" node http-generic-api/scripts/spec014-final-work-map-readback.mjs | tee "${REPORT_DIR}/spec014-final-work-map-readback.log"
          jq -e '.ok == true and ((.findings | length) == 0)' "${REPORT_DIR}/spec014-final-work-map-readback.json" >/dev/null

          jq -n \
            --arg contract mad4b.r7-exact-head-validation.v2 \
            --arg candidate_sha "${EXPECTED_HEAD_SHA}" \
            --arg main_sha "${EXPECTED_MAIN_SHA}" \
            '{contract:$contract,candidate_sha:$candidate_sha,main_sha:$main_sha,scope_files:5,contracts_passed:12,repository_content_mutation:false,protected_ref_mutation:false,provider_credential_accessed:false,provider_mutation:false,deployment:false,restart:false,sql:false,migration_apply:false,database_mutation:false,external_business_send:false,secrets_included:false}' \
            > "${REPORT_DIR}/summary.json"

      - name: Re-read canonical identity after execution
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "${EXPECTED_MAIN_SHA}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${CANONICAL_PR}" --jq '.head.sha')" = "${EXPECTED_HEAD_SHA}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"

      - name: Upload exact-head validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r7-exact-head-validation-6100-${{ github.run_id }}
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: error
          retention-days: 30
