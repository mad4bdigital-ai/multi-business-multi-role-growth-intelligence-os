name: Repository Evaluation

on:
  workflow_dispatch:
    inputs:
      include_network:
        description: Run network-dependent dependency audit
        required: false
        default: false
        type: boolean
      target_ref:
        description: Optional governed work branch for exact-head verification
        required: false
        default: ""
        type: string
      expected_head_sha:
        description: Optional exact 40-character work-branch SHA for trusted verification dispatch
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/repository-evaluation.json'
      - '!docs/repository-evaluation-summary.json'
      - '!docs/repository-evaluation.md'
  pull_request:
    paths:
      - '**'
      - '!docs/repository-evaluation.json'
      - '!docs/repository-evaluation-summary.json'
      - '!docs/repository-evaluation.md'

permissions:
  contents: read

concurrency:
  group: repository-evaluation-${{ github.workflow }}-${{ github.ref }}-${{ inputs.expected_head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Evaluate repository gaps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate exact-head verification dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.expected_head_sha != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ inputs.target_ref }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_REF" =~ ^(gpt|fix|feat|chore|docs|release)/[A-Za-z0-9._/-]+$ ]]
          [[ "$TARGET_REF" != "main" && "$TARGET_REF" != "Production" ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_REF}" --jq '.object.sha')"
          test "$remote_sha" = "$EXPECTED_HEAD_SHA"

      - name: Checkout exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_head_sha != '' && inputs.expected_head_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify local and remote exact-head identity
        if: github.event_name == 'workflow_dispatch' && inputs.expected_head_sha != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ inputs.target_ref }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_REF}" --jq '.object.sha')"
          test "$local_sha" = "$EXPECTED_HEAD_SHA"
          test "$remote_sha" = "$EXPECTED_HEAD_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install http-generic-api dependencies
        run: npm ci --ignore-scripts --prefix http-generic-api

      - name: Setup repository-supported .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'

      - name: Run required network dependency and environment probes
        shell: bash
        run: |
          set -euo pipefail
          run_audit() {
            local label="$1"
            local output="$2"
            shift 2
            set +e
            "$@" > "$output"
            local status=$?
            set -e
            node - "$label" "$output" "$status" <<'NODE'
          const fs = require('node:fs');
          const [label, output, statusText] = process.argv.slice(2);
          const status = Number(statusText);
          const report = JSON.parse(fs.readFileSync(output, 'utf8'));
          const total = Number(report.metadata?.vulnerabilities?.total ?? 0);
          if (total > 0) {
            console.error(`${label}: ${total} advisories reported`);
            process.exit(1);
          }
          if (report.error || !report.metadata) {
            console.warn(`${label}: audit service unavailable or returned no metadata; transport result is recorded but does not mask advisories`);
            process.exit(0);
          }
          if (status !== 0) {
            console.error(`${label}: audit exited ${status} without a parseable advisory count`);
            process.exit(1);
          }
          console.log(`${label}: audit passed with zero advisories`);
          NODE
          }
          run_audit root "$RUNNER_TEMP/root-npm-audit.json" npm audit --json --omit=dev
          run_audit http-generic-api "$RUNNER_TEMP/http-generic-api-npm-audit.json" npm audit --prefix http-generic-api --json --omit=dev
          dotnet --version

      - name: Capture structured network and environment evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/repository-evaluation.mjs \
            --skip-checks \
            --include-network \
            --include-environment \
            --json="$RUNNER_TEMP/repository-evaluation-probes.json" \
            --markdown="$RUNNER_TEMP/repository-evaluation-probes.md" \
            --summary="$RUNNER_TEMP/repository-evaluation-probes-summary.json"

      - name: Prepare exact base evaluation when available
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          artifact_path="docs/repository-evaluation.json"
          baseline_path="$RUNNER_TEMP/repository-evaluation-baseline.json"
          if [[ "$EVENT_NAME" == "pull_request" && "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git show "$PR_BASE_SHA:$artifact_path" > "$baseline_path" 2>/dev/null; then
            echo "EVALUATION_BASELINE=$baseline_path" >> "$GITHUB_ENV"
            echo "Using exact pull-request base evaluation baseline: $PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "pull_request" ]] && git show "origin/main:$artifact_path" > "$baseline_path" 2>/dev/null; then
            echo "EVALUATION_BASELINE=$baseline_path" >> "$GITHUB_ENV"
            echo "Using fetched main evaluation baseline as bounded fallback."
          else
            echo "No committed baseline is available for this event."
          fi

      - name: Classify read-only repository-state bootstrap
        id: repository_state
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          TARGET_REF: ${{ github.head_ref }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git diff --quiet origin/main...HEAD -- scripts/repository-inventory-verification-gate.mjs; then
            echo "Repository Evaluation bootstrap requires the Inventory verification gate to be byte-unchanged from trusted main." >&2
            exit 1
          fi

          report="$RUNNER_TEMP/repository-inventory-verification.json"
          node scripts/repository-inventory-verification-gate.mjs \
            --event-name pull_request \
            --target-ref "$TARGET_REF" \
            --expected-head-sha "$EXPECTED_HEAD_SHA" \
            --head-repository "$HEAD_REPOSITORY" \
            --base-ref "$BASE_REF" \
            --repository "$REPOSITORY" \
            --output "$report"

          outcome="$(jq -er '.outcome' "$report")"
          if [[ "$outcome" == "bootstrap_pending" ]]; then
            test "$(jq -r '.repository_mutation' "$report")" = "false"
            test "$(jq -r '.protected_branch_mutation' "$report")" = "false"
            test "$(jq -r '.force_push' "$report")" = "false"
            test "$(jq -r '.deterministic_generation_verified' "$report")" = "true"
            echo "bootstrap_pending=true" >> "$GITHUB_OUTPUT"
            echo "trusted_main_sha=$(jq -er '.trusted_main_sha' "$report")" >> "$GITHUB_OUTPUT"
          else
            echo "bootstrap_pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prove read-only Repository State bootstrap convergence
        if: steps.repository_state.outputs.bootstrap_pending == 'true'
        shell: bash
        env:
          TRUSTED_MAIN_SHA: ${{ steps.repository_state.outputs.trusted_main_sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$TRUSTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

          trusted_evaluation_paths=(
            scripts/repository-evaluation.mjs
            scripts/test-repository-evaluation.mjs
          )
          if ! git diff --quiet "$TRUSTED_MAIN_SHA"...HEAD -- "${trusted_evaluation_paths[@]}"; then
            echo "Repository Evaluation bootstrap requires Evaluation generator/test bytes to be unchanged from trusted main." >&2
            exit 1
          fi

          evaluation_outputs=(
            docs/repository-evaluation.json
            docs/repository-evaluation-summary.json
            docs/repository-evaluation.md
          )
          npm run evaluation:write -- --enforce
          : > "$RUNNER_TEMP/evaluation-first.sha256"
          for file in "${evaluation_outputs[@]}"; do
            sha256sum "$file" >> "$RUNNER_TEMP/evaluation-first.sha256"
          done

          npm run evaluation:write -- --enforce
          : > "$RUNNER_TEMP/evaluation-second.sha256"
          for file in "${evaluation_outputs[@]}"; do
            sha256sum "$file" >> "$RUNNER_TEMP/evaluation-second.sha256"
          done
          cmp "$RUNNER_TEMP/evaluation-first.sha256" "$RUNNER_TEMP/evaluation-second.sha256"

          npm run evaluation:test
          npm run evaluation:check -- --enforce

          expected_dirty="$RUNNER_TEMP/repository-state-expected-dirty.txt"
          actual_dirty="$RUNNER_TEMP/repository-state-actual-dirty.txt"
          printf '%s\n' \
            docs/repository-evaluation-summary.json \
            docs/repository-evaluation.json \
            docs/repository-evaluation.md \
            docs/repository-inventory-summary.json \
            docs/repository-inventory.json \
            docs/repository-inventory.md \
            | sort > "$expected_dirty"
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sed '/^$/d' | sort -u > "$actual_dirty"
          diff -u "$expected_dirty" "$actual_dirty"

          jq -cn \
            --arg contract "mad4b.repository-state-bootstrap-proof.v1" \
            --arg candidate_sha "$EXPECTED_HEAD_SHA" \
            --arg trusted_main_sha "$TRUSTED_MAIN_SHA" \
            --slurpfile inventory "$RUNNER_TEMP/repository-inventory-verification.json" \
            '{contract:$contract,outcome:"bootstrap_pending",candidate_sha:$candidate_sha,trusted_main_sha:$trusted_main_sha,inventory_evidence:$inventory[0],inventory_then_evaluation:true,evaluation_deterministic:true,evaluation_current_after_generation:true,dirty_set_exact_six_outputs:true,repository_mutation:false,protected_branch_mutation:false,force_push:false,secrets_included:false}' \
            > "$RUNNER_TEMP/repository-state-bootstrap-proof.json"

      - name: Run deterministic evaluation loop
        if: steps.repository_state.outputs.bootstrap_pending != 'true'
        shell: bash
        env:
          INCLUDE_NETWORK: ${{ github.event_name == 'workflow_dispatch' && inputs.include_network || false }}
        run: |
          set -euo pipefail
          args=()
          if [[ "${INCLUDE_NETWORK}" == "true" ]]; then args+=(--include-network); fi
          node scripts/repository-evaluation.mjs --enforce "${args[@]}"
          npm run inventory:check
          npm run inventory:test
          npm run evaluation:test
          node scripts/repository-evaluation.mjs --check --enforce "${args[@]}"
          git diff --exit-code -- \
            docs/repository-inventory.json \
            docs/repository-inventory-summary.json \
            docs/repository-inventory.md \
            docs/repository-evaluation.json \
            docs/repository-evaluation-summary.json \
            docs/repository-evaluation.md

      - name: Report baseline lifecycle diff
        if: env.EVALUATION_BASELINE != '' && steps.repository_state.outputs.bootstrap_pending != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/repository-evaluation.mjs --diff --baseline "$EVALUATION_BASELINE" > "$RUNNER_TEMP/repository-evaluation-baseline-diff.json"

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repository-evaluation-${{ inputs.expected_head_sha || github.sha }}
          path: |
            docs/repository-evaluation.json
            docs/repository-evaluation-summary.json
            docs/repository-evaluation.md
            ${{ runner.temp }}/repository-evaluation-baseline-diff.json
            ${{ runner.temp }}/repository-evaluation-probes.json
            ${{ runner.temp }}/repository-evaluation-probes.md
            ${{ runner.temp }}/repository-evaluation-probes-summary.json
            ${{ runner.temp }}/repository-inventory-verification.json
            ${{ runner.temp }}/repository-state-bootstrap-proof.json
          if-no-files-found: warn
