name: Repository Evaluation

on:
  workflow_dispatch:
    inputs:
      include_network:
        description: Run network-dependent dependency audit
        required: false
        default: false
        type: boolean
      target_ref:
        description: Optional governed work branch for exact-head verification
        required: false
        default: ""
        type: string
      expected_head_sha:
        description: Optional exact 40-character work-branch SHA for trusted verification dispatch
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/repository-evaluation.json'
      - '!docs/repository-evaluation-summary.json'
      - '!docs/repository-evaluation.md'
  pull_request:
    paths:
      - '**'
      - '!docs/repository-evaluation.json'
      - '!docs/repository-evaluation-summary.json'
      - '!docs/repository-evaluation.md'

# Repository Evaluation is an observability artifact. Pull-request drift is read-only advisory.
# A stale exact-main run fails only as a post-merge convergence signal for the separate governed writer.
permissions:
  contents: read

concurrency:
  group: repository-evaluation-${{ github.workflow }}-${{ github.ref }}-${{ inputs.expected_head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Evaluate repository gaps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate exact-head verification dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.expected_head_sha != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ inputs.target_ref }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_REF" =~ ^(gpt|fix|feat|chore|docs|release)/[A-Za-z0-9._/-]+$ ]]
          case "$TARGET_REF" in main|Production) echo "Protected branch verification target is forbidden: $TARGET_REF" >&2; exit 1 ;; esac
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_REF}" --jq '.object.sha')"
          test "$remote_sha" = "$EXPECTED_HEAD_SHA"

      - name: Checkout exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_head_sha != '' && inputs.expected_head_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify local and remote exact-head identity
        if: github.event_name == 'workflow_dispatch' && inputs.expected_head_sha != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ inputs.target_ref }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_REF}" --jq '.object.sha')"
          test "$local_sha" = "$EXPECTED_HEAD_SHA"
          test "$remote_sha" = "$EXPECTED_HEAD_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install http-generic-api dependencies
        run: npm ci --ignore-scripts --prefix http-generic-api

      - name: Setup repository-supported .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'

      - name: Run required network dependency and environment probes
        shell: bash
        run: |
          set -euo pipefail
          run_audit() {
            local label="$1"
            local output="$2"
            local stderr_output="$3"
            local diagnostic_output="$4"
            shift 4
            set +e
            "$@" > "$output" 2> "$stderr_output"
            local status=$?
            set -e
            node - "$label" "$output" "$stderr_output" "$diagnostic_output" "$status" <<'NODE'
          const fs = require('node:fs');
          const [label, output, stderrOutput, diagnosticOutput, statusText] = process.argv.slice(2);
          const status = Number(statusText);
          const raw = fs.readFileSync(output, 'utf8');
          const stderr = fs.readFileSync(stderrOutput, 'utf8');
          let report;
          try {
            report = JSON.parse(raw);
          } catch (error) {
            const diagnostic = {
              contract: 'mad4b.repository-evaluation-npm-audit-diagnostic.v1',
              label,
              status,
              json_valid: false,
              stdout_bytes: Buffer.byteLength(raw),
              stderr_present: stderr.trim().length > 0,
              parse_error: error instanceof Error ? error.message : String(error),
            };
            fs.writeFileSync(diagnosticOutput, `${JSON.stringify(diagnostic, null, 2)}\n`);
            console.error(`${label}: npm audit returned invalid JSON (status=${status}, stdout_bytes=${diagnostic.stdout_bytes}, stderr_present=${diagnostic.stderr_present})`);
            if (stderr.trim()) {
              console.error(`${label}: npm audit stderr follows (GitHub secret masking remains active):`);
              console.error(stderr.trim());
            }
            process.exit(1);
          }
          const total = Number(report.metadata?.vulnerabilities?.total ?? 0);
          const diagnostic = {
            contract: 'mad4b.repository-evaluation-npm-audit-diagnostic.v1',
            label,
            status,
            json_valid: true,
            stdout_bytes: Buffer.byteLength(raw),
            stderr_present: stderr.trim().length > 0,
            metadata_present: Boolean(report.metadata),
            audit_error_present: Boolean(report.error),
            audit_error_code: report.error?.code ?? null,
            vulnerabilities_total: total,
          };
          fs.writeFileSync(diagnosticOutput, `${JSON.stringify(diagnostic, null, 2)}\n`);
          if (total > 0) { console.error(`${label}: ${total} advisories reported`); process.exit(1); }
          if (report.error || !report.metadata) { console.warn(`${label}: audit service unavailable or returned no metadata; transport result is recorded but does not mask advisories`); process.exit(0); }
          if (status !== 0) { console.error(`${label}: audit exited ${status} without a parseable advisory count`); process.exit(1); }
          console.log(`${label}: audit passed with zero advisories`);
          NODE
          }
          run_audit root \
            "$RUNNER_TEMP/root-npm-audit.json" \
            "$RUNNER_TEMP/root-npm-audit.stderr" \
            "$RUNNER_TEMP/root-npm-audit-diagnostic.json" \
            npm audit --json --omit=dev
          run_audit http-generic-api \
            "$RUNNER_TEMP/http-generic-api-npm-audit.json" \
            "$RUNNER_TEMP/http-generic-api-npm-audit.stderr" \
            "$RUNNER_TEMP/http-generic-api-npm-audit-diagnostic.json" \
            npm audit --prefix http-generic-api --json --omit=dev
          dotnet --version

      - name: Capture structured network and environment evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/repository-evaluation.mjs --skip-checks --include-network --include-environment \
            --json="$RUNNER_TEMP/repository-evaluation-probes.json" \
            --markdown="$RUNNER_TEMP/repository-evaluation-probes.md" \
            --summary="$RUNNER_TEMP/repository-evaluation-probes-summary.json"

      - name: Prepare exact base evaluation when available
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          artifact_path="docs/repository-evaluation.json"
          baseline_path="$RUNNER_TEMP/repository-evaluation-baseline.json"
          if [[ "$EVENT_NAME" == "pull_request" && "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git show "$PR_BASE_SHA:$artifact_path" > "$baseline_path" 2>/dev/null; then
            echo "EVALUATION_BASELINE=$baseline_path" >> "$GITHUB_ENV"
          elif [[ "$EVENT_NAME" == "pull_request" ]] && git show "origin/main:$artifact_path" > "$baseline_path" 2>/dev/null; then
            echo "EVALUATION_BASELINE=$baseline_path" >> "$GITHUB_ENV"
          else
            echo "No committed baseline is available for this event."
          fi

      - name: Verify Evaluation currentness or classify observability drift
        id: evaluation_state
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_head_sha != '' && inputs.expected_head_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          registry=.github/derived-state-governance.json
          test "$(jq -r '.policy.observability_artifacts_publish_post_merge_only' "$registry")" = "true"
          test "$(jq -r '.policy.observability_premerge_mutation_forbidden' "$registry")" = "true"
          test "$(jq -r '.artifacts[] | select(.artifact_id=="repository_evaluation") | .artifact_class' "$registry")" = "observability"
          test "$(jq -r '.artifacts[] | select(.artifact_id=="repository_evaluation") | .merge_blocking' "$registry")" = "false"
          actual_head_sha="$(git rev-parse HEAD)"
          test "$actual_head_sha" = "$EXPECTED_HEAD_SHA"
          report="$RUNNER_TEMP/repository-evaluation-verification.json"
          set +e
          node scripts/repository-evaluation.mjs --check --enforce > "$RUNNER_TEMP/repository-evaluation-currentness.log" 2>&1
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            jq -cn --arg sha "$actual_head_sha" '{contract:"mad4b.repository-evaluation-verification.v2",outcome:"passed",evaluation_state:"current",current:true,blocking:false,artifact_class:"observability",merge_blocking:false,exact_head_sha:$sha,followup_required:false,secrets_included:false}' > "$report"
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -cn --arg sha "$actual_head_sha" '{contract:"mad4b.repository-evaluation-verification.v2",outcome:"advisory",evaluation_state:"stale_observability",current:false,blocking:false,artifact_class:"observability",merge_blocking:false,exact_head_sha:$sha,followup_required:true,followup_mode:"post_merge_observability_publish",secrets_included:false}' > "$report"
          echo "current=false" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "Repository Evaluation drift is advisory before merge; feature-PR mutation intentionally suppressed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "push" ]]; then
            echo "Repository Evaluation is stale on exact main; classified as non-blocking post-merge observability advisory." >> "$GITHUB_STEP_SUMMARY"
            echo "post_merge_observability_publish_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat "$RUNNER_TEMP/repository-evaluation-currentness.log" >&2
          echo "Exact-head Repository Evaluation verification failed; governed writer output is not current." >&2
          exit 1

      - name: Report baseline lifecycle diff
        if: env.EVALUATION_BASELINE != '' && steps.evaluation_state.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/repository-evaluation.mjs --diff --baseline "$EVALUATION_BASELINE" > "$RUNNER_TEMP/repository-evaluation-baseline-diff.json"

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repository-evaluation-${{ inputs.expected_head_sha || github.sha }}
          path: |
            docs/repository-evaluation.json
            docs/repository-evaluation-summary.json
            docs/repository-evaluation.md
            ${{ runner.temp }}/root-npm-audit-diagnostic.json
            ${{ runner.temp }}/http-generic-api-npm-audit-diagnostic.json
            ${{ runner.temp }}/repository-evaluation-baseline-diff.json
            ${{ runner.temp }}/repository-evaluation-probes.json
            ${{ runner.temp }}/repository-evaluation-probes.md
            ${{ runner.temp }}/repository-evaluation-probes-summary.json
            ${{ runner.temp }}/repository-evaluation-verification.json
            ${{ runner.temp }}/repository-evaluation-currentness.log
          if-no-files-found: warn
