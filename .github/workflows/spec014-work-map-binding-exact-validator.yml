name: Spec 014 Work Map Binding Exact Validator

on:
  push:
    branches:
      - gpt/validate-spec014-work-map-binding-7beeef-20260804
    paths:
      - .github/workflows/spec014-work-map-binding-exact-validator.yml

permissions:
  contents: write

concurrency:
  group: spec014-work-map-binding-exact-validator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout validator event
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify launcher-only topology
        shell: bash
        env:
          EXPECTED_CANDIDATE: 7beeefb5ec190bf489d32d73aa70f346f163599c
          LAUNCHER_PATH: .github/workflows/spec014-work-map-binding-exact-validator.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_CANDIDATE"
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$LAUNCHER_PATH"

      - name: Validate exact candidate checkout
        shell: bash
        env:
          EXPECTED_CANDIDATE: 7beeefb5ec190bf489d32d73aa70f346f163599c
        run: |
          set -euo pipefail
          git checkout --detach "$EXPECTED_CANDIDATE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE"
          REPORT_PATH="$RUNNER_TEMP/spec014-work-map-binding-exact.json" \
            node http-generic-api/scripts/spec014-final-work-map-readback.mjs
          node - "$RUNNER_TEMP/spec014-work-map-binding-exact.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const expected = '7beeefb5ec190bf489d32d73aa70f346f163599c';
          if (report.candidate_sha !== expected) throw new Error('candidate_sha_mismatch');
          if (report.ok !== true) throw new Error('readback_not_current');
          if ((report.findings || []).length !== 0) throw new Error('unexpected_findings');
          if (report.current_registry?.fingerprint !== 'f81e65d2452c2c04a1281d1537f2aec58a5a2228d6faa06f72faaa454d963fda') throw new Error('fingerprint_mismatch');
          if (report.manifest_registry?.fingerprint !== report.current_registry?.fingerprint) throw new Error('manifest_fingerprint_mismatch');
          if (report.repository_mutation !== false) throw new Error('invalid_repository_mutation_flag');
          if (report.provider_dispatch !== false) throw new Error('provider_dispatch_detected');
          if (report.live_database_access !== false) throw new Error('live_database_access_detected');
          if (report.migration_apply !== false) throw new Error('migration_apply_detected');
          if (report.secrets_included !== false) throw new Error('secrets_included');
          NODE

      - name: Publish bounded validation record and remove launcher
        shell: bash
        env:
          BRANCH: gpt/validate-spec014-work-map-binding-7beeef-20260804
          EVENT_SHA: ${{ github.sha }}
          EVIDENCE_PATH: .github/validation/spec014-work-map-binding-7beeef.json
          LAUNCHER_PATH: .github/workflows/spec014-work-map-binding-exact-validator.yml
        run: |
          set -euo pipefail
          git checkout -B "$BRANCH" "$EVENT_SHA"
          mkdir -p "$(dirname "$EVIDENCE_PATH")"
          cp "$RUNNER_TEMP/spec014-work-map-binding-exact.json" "$EVIDENCE_PATH"
          rm "$LAUNCHER_PATH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$EVIDENCE_PATH"
          git add -u "$LAUNCHER_PATH"
          mapfile -t staged < <(git diff --cached --name-only | sort)
          test "${#staged[@]}" -eq 2
          test "${staged[0]}" = "$EVIDENCE_PATH"
          test "${staged[1]}" = "$LAUNCHER_PATH"
          git diff --cached --check
          git commit -m 'test(spec-014): publish exact Work Map binding readback'
          remote_head="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EVENT_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Final summary
        shell: bash
        run: |
          set -euo pipefail
          echo 'SPEC014_EXACT_READBACK=success'
          echo 'CANDIDATE_SHA=7beeefb5ec190bf489d32d73aa70f346f163599c'
          echo 'FINDINGS=0'
          echo 'SECRETS_INCLUDED=false'
          echo 'PROVIDER_DISPATCH=false'
          echo 'LIVE_DATABASE_ACCESS=false'
          echo 'MIGRATION_APPLY=false'
          echo 'PRODUCTION_MUTATION=false'
