name: Hostinger Completed Build Log Evidence Dispatch R3B

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact current main SHA authorized for this R3B dispatch
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: hostinger-completed-build-log-evidence-dispatch-r3b-f5c1ae88
  cancel-in-progress: false

jobs:
  dispatch-completed-build-log-evidence-r3b:
    name: Dispatch authenticated GET-only completed-build log evidence R3B
    if: >-
      (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       github.event.issue.number == 4953 &&
       startsWith(github.event.comment.body, 'RUN_HOSTINGER_COMPLETED_BUILD_LOG_EVIDENCE_R3B_F5C1AE88_94321B27 expected_head_sha=') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    permissions:
      contents: read
      actions: write
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      CONTROL_ISSUE: '4953'
      AUTHORIZATION_COMMENT_ID: '5162389651'
      AUTHORIZATION_USER_ID: '271942579'
      AUTHORIZATION_TOKEN: AUTHORIZE_HOSTINGER_COMPLETED_BUILD_LOG_EVIDENCE_BRIDGE_R3B_F5C1AE88_94321B27
      TRIGGER_TOKEN: RUN_HOSTINGER_COMPLETED_BUILD_LOG_EVIDENCE_R3B_F5C1AE88_94321B27
      TARGET_WORKFLOW: hostinger-nodejs-completed-build-log-evidence.yml
      TARGET_WORKFLOW_PATH: .github/workflows/hostinger-nodejs-completed-build-log-evidence.yml
      TARGET_REF: main
      EXPECTED_WORKFLOW_BLOB_SHA: 94321b273e70f96180c0f058adbb291b035fd237
      ACCOUNT_USERNAME: u338416126
      DOMAIN: auth.mad4b.com
      COMPLETED_BUILD_UUID: 019fc51c-3947-7255-aa4d-f55cb8df7658
      EXPECTED_PRODUCTION_SHA: f5c1ae8840b4d4452f2908bb0f23051880bb6896
      BINDING_ID: f5c1ae8840b4d4452f2908bb0f23051880bb6896:94321b273e70f96180c0f058adbb291b035fd237:019fc51c-3947-7255-aa4d-f55cb8df7658:5162389651:R3B
      MUTATION_TARGET_BRANCH: issue-and-actions-metadata-only
      EVENT_COMMENT_BODY: ${{ github.event.comment.body || '' }}
      EVENT_COMMENT_USER_ID: ${{ github.event.comment.user.id || '' }}
      EVENT_COMMENT_ID: ${{ github.event.comment.id || 'workflow-dispatch' }}
      INPUT_EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha || '' }}

    steps:
      - name: Resolve explicit expected main head
        id: expected
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${MUTATION_TARGET_BRANCH}" == "main" || "${MUTATION_TARGET_BRANCH}" == "Production" ]]; then
            echo "Repository branch mutation is forbidden." >&2
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "issue_comment" ]]; then
            test "${EVENT_COMMENT_USER_ID}" = "${AUTHORIZATION_USER_ID}"
            if [[ ! "${EVENT_COMMENT_BODY}" =~ ^${TRIGGER_TOKEN}[[:space:]]expected_head_sha=([a-f0-9]{40})$ ]]; then
              echo "Invalid governed trigger format." >&2
              exit 1
            fi
            EXPECTED_HEAD_SHA="${BASH_REMATCH[1]}"
          else
            EXPECTED_HEAD_SHA="${INPUT_EXPECTED_HEAD_SHA}"
            [[ "${EXPECTED_HEAD_SHA}" =~ ^[a-f0-9]{40}$ ]]
          fi

          echo "expected_head_sha=${EXPECTED_HEAD_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Verify authorization and immutable bindings
        id: binding
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ steps.expected.outputs.expected_head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          ISSUE_STATE="$(gh api "/repos/${REPOSITORY}/issues/${CONTROL_ISSUE}" --jq '.state')"
          test "${ISSUE_STATE}" = "open"

          AUTH_BODY="$(gh api "/repos/${REPOSITORY}/issues/comments/${AUTHORIZATION_COMMENT_ID}" --jq '.body')"
          AUTH_USER_ID="$(gh api "/repos/${REPOSITORY}/issues/comments/${AUTHORIZATION_COMMENT_ID}" --jq '.user.id')"
          test "${AUTH_USER_ID}" = "${AUTHORIZATION_USER_ID}"
          grep -Fq "${AUTHORIZATION_TOKEN}" <<<"${AUTH_BODY}"
          grep -Fq "${TARGET_WORKFLOW_PATH}" <<<"${AUTH_BODY}"
          grep -Fq "${EXPECTED_WORKFLOW_BLOB_SHA}" <<<"${AUTH_BODY}"
          grep -Fq "${ACCOUNT_USERNAME}" <<<"${AUTH_BODY}"
          grep -Fq "${DOMAIN}" <<<"${AUTH_BODY}"
          grep -Fq "${COMPLETED_BUILD_UUID}" <<<"${AUTH_BODY}"
          grep -Fq "${EXPECTED_PRODUCTION_SHA}" <<<"${AUTH_BODY}"
          grep -Fq 'HOSTINGER_API_TOKEN' <<<"${AUTH_BODY}"
          grep -Fq 'provider method: `GET` only' <<<"${AUTH_BODY}"
          grep -Fq 'provider mutation: `false`' <<<"${AUTH_BODY}"
          grep -Fq 'build creation: `false`' <<<"${AUTH_BODY}"
          grep -Fq 'deployment: `false`' <<<"${AUTH_BODY}"
          grep -Fq 'release activation: `false`' <<<"${AUTH_BODY}"
          grep -Fq 'restart: `false`' <<<"${AUTH_BODY}"
          grep -Fq 'secrets included: `false`' <<<"${AUTH_BODY}"

          CURRENT_HEAD_SHA="$(gh api "/repos/${REPOSITORY}/git/ref/heads/${TARGET_REF}" --jq '.object.sha')"
          test "${CURRENT_HEAD_SHA}" = "${EXPECTED_HEAD_SHA}"

          WORKFLOW_BLOB="$(gh api "/repos/${REPOSITORY}/contents/${TARGET_WORKFLOW_PATH}?ref=${TARGET_REF}" --jq '.sha')"
          test "${WORKFLOW_BLOB}" = "${EXPECTED_WORKFLOW_BLOB_SHA}"

          WORKFLOW_STATE="$(gh api "/repos/${REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}" --jq '.state')"
          test "${WORKFLOW_STATE}" = "active"

          PRODUCTION_SHA="$(gh api "/repos/${REPOSITORY}/git/ref/heads/Production" --jq '.object.sha')"
          test "${PRODUCTION_SHA}" = "${EXPECTED_PRODUCTION_SHA}"

          CLAIM_MARKERS="$(gh api --paginate "/repos/${REPOSITORY}/issues/${CONTROL_ISSUE}/comments?per_page=100" \
            --jq ".[] | select(.body | contains(\"HOSTINGER_COMPLETED_BUILD_LOG_EVIDENCE_R3B_DISPATCH status=claiming binding=${BINDING_ID}\")) | .id")"
          DISPATCHED_MARKERS="$(gh api --paginate "/repos/${REPOSITORY}/issues/${CONTROL_ISSUE}/comments?per_page=100" \
            --jq ".[] | select(.body | contains(\"HOSTINGER_COMPLETED_BUILD_LOG_EVIDENCE_R3B_DISPATCH status=dispatched binding=${BINDING_ID}\")) | .id")"
          test -z "${CLAIM_MARKERS}"
          test -z "${DISPATCHED_MARKERS}"

          BEFORE_RUN_ID="$(gh api "/repos/${REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?event=workflow_dispatch&branch=${TARGET_REF}&per_page=30" \
            --jq '[.workflow_runs[].id] | max // 0')"
          echo "before_run_id=${BEFORE_RUN_ID}" >> "${GITHUB_OUTPUT}"
          echo "target_main_sha=${CURRENT_HEAD_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Record one-time R3B dispatch claim
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ steps.expected.outputs.expected_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          BODY="HOSTINGER_COMPLETED_BUILD_LOG_EVIDENCE_R3B_DISPATCH status=claiming binding=${BINDING_ID} bridge_run_id=${GITHUB_RUN_ID} authorization_comment_id=${AUTHORIZATION_COMMENT_ID} trigger_comment_id=${EVENT_COMMENT_ID} expected_head_sha=${EXPECTED_HEAD_SHA} target_workflow_blob=${EXPECTED_WORKFLOW_BLOB_SHA} completed_build_uuid=${COMPLETED_BUILD_UUID} expected_production_sha=${EXPECTED_PRODUCTION_SHA} provider_get_only=true provider_mutation=false build_creation=false deployment=false release_activation=false restart=false secrets_included=false"
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPOSITORY}/issues/${CONTROL_ISSUE}/comments" \
            -f body="${BODY}"

      - name: Dispatch unchanged trusted GET-only workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg ref "${TARGET_REF}" \
            --arg account "${ACCOUNT_USERNAME}" \
            --arg build "${COMPLETED_BUILD_UUID}" \
            --arg expected "${EXPECTED_PRODUCTION_SHA}" \
            '{ref:$ref,inputs:{account_username:$account,build_uuid:$build,expected_sha:$expected}}' \
            | gh api --method POST \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/dispatches" \
                --input -

      - name: Resolve dispatched evidence run
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_RUN_ID: ${{ steps.binding.outputs.before_run_id }}
          TARGET_MAIN_SHA: ${{ steps.binding.outputs.target_main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=""
          for _ in $(seq 1 60); do
            RUN_ID="$(gh api "/repos/${REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?event=workflow_dispatch&branch=${TARGET_REF}&per_page=30" \
              --jq ".workflow_runs | map(select(.id > ${BEFORE_RUN_ID} and .head_sha == \"${TARGET_MAIN_SHA}\")) | sort_by(.id) | .[0].id // empty")"
            if [[ -n "${RUN_ID}" ]]; then break; fi
            sleep 5
          done
          test -n "${RUN_ID}"
          echo "run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"

          BODY="HOSTINGER_COMPLETED_BUILD_LOG_EVIDENCE_R3B_DISPATCH status=dispatched binding=${BINDING_ID} target_run_id=${RUN_ID} bridge_run_id=${GITHUB_RUN_ID} target_main_sha=${TARGET_MAIN_SHA} completed_build_uuid=${COMPLETED_BUILD_UUID} expected_production_sha=${EXPECTED_PRODUCTION_SHA} provider_get_only=true provider_mutation=false build_creation=false deployment=false release_activation=false restart=false secrets_included=false issue_remains_open=true"
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPOSITORY}/issues/${CONTROL_ISSUE}/comments" \
            -f body="${BODY}"
