name: EC0 Clean Latest Main Build

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.head.ref == 'gpt/spec-012-ec0-clean-9c9b-20260730'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean EC0 branch
        uses: actions/checkout@v5
        with:
          ref: gpt/spec-012-ec0-clean-9c9b-20260730
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Fetch reviewed EC0 source
        run: git fetch origin gpt/spec-012-ec0-final-latest-main-20260730

      - name: Copy permanent EC0 files only
        run: |
          git checkout origin/gpt/spec-012-ec0-final-latest-main-20260730 -- \
            http-generic-api/contextKernel/application/executionCapsuleService.js \
            http-generic-api/contextKernel/application/index.js \
            http-generic-api/contextKernel/domain/executionCapsule.js \
            http-generic-api/contextKernel/domain/index.js \
            http-generic-api/scripts/test-manifest.mjs \
            http-generic-api/test-execution-capsule-contract.mjs \
            specs/012-unified-admin-tenant-context-kernel/ec0-execution-capsule-contract.manifest.json \
            specs/012-unified-admin-tenant-context-kernel/ec0-execution-capsule-contract.md \
            specs/012-unified-admin-tenant-context-kernel/execution-capsule-runtime-extension.manifest.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Verify clean EC0 delivery
        working-directory: http-generic-api
        run: |
          node --check contextKernel/domain/executionCapsule.js
          node --check contextKernel/application/executionCapsuleService.js
          node --check test-execution-capsule-contract.mjs
          node test-execution-capsule-contract.mjs
          node test-context-kernel-domain.mjs
          node test-context-kernel-application-use-cases.mjs
          node test-context-kernel-cross-tenant-isolation.mjs
          printf '%s\n' \
            'http-generic-api/contextKernel/application/executionCapsuleService.js' \
            'http-generic-api/contextKernel/application/index.js' \
            'http-generic-api/contextKernel/domain/executionCapsule.js' \
            'http-generic-api/contextKernel/domain/index.js' \
            'http-generic-api/test-execution-capsule-contract.mjs' \
            > "$RUNNER_TEMP/ec0-clean-runtime-files.txt"
          node scripts/context-kernel-hardcoding-scan.mjs \
            --fail-on=runtime \
            --changed-files-from="$RUNNER_TEMP/ec0-clean-runtime-files.txt"

      - name: Remove one-shot workflow
        run: git rm .github/workflows/ec0-clean-latest-main-build.yml

      - name: Commit clean EC0 delivery
        run: |
          git config user.name 'mad4b-governed-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -am 'feat(spec-012): add Execution Capsule contract'
          git push origin HEAD:gpt/spec-012-ec0-clean-9c9b-20260730
