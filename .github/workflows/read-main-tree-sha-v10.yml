name: Read Main Tree SHA V10

on:
  push:
    branches:
      - gpt/read-main-tree-sha-v8-97e4ee7
    paths:
      - ".github/workflows/read-main-tree-sha-v10.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: read-main-tree-sha-v10-${{ github.repository }}
  cancel-in-progress: false

jobs:
  read-main-tree:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout immutable current main
        uses: actions/checkout@v4
        with:
          ref: 67cb77cffe94544b1b5d70997506afb4e75c3846
          fetch-depth: 1
          persist-credentials: false
      - name: Read immutable tree identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tested_sha="$(git rev-parse HEAD)"
          test "${tested_sha}" = "67cb77cffe94544b1b5d70997506afb4e75c3846"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          test -n "${tree_sha}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=read-main-tree-sha-v10 \
            -f description="tree=${tree_sha}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          printf 'BASE_SHA=%s\nTREE_SHA=%s\nREF_UPDATED=false\nSECRETS_INCLUDED=false\n' "${tested_sha}" "${tree_sha}"
