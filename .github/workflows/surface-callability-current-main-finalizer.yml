name: Surface Callability Queue Diagnostic

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/surface-callability-current-main-finalizer.yml

permissions:
  contents: read

concurrency:
  group: surface-callability-current-main-finalizer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: >-
      github.repository == 'mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/pr5210-surface-source-clean-20260803' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      TARGET_BRANCH: gpt/pr5210-surface-source-clean-20260803
      BASE_SHA: ae26acbb7cd640ca9670c7b26b267aca45e3b337
      WORKFLOW_PATH: .github/workflows/surface-callability-current-main-finalizer.yml

    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact bounded trigger
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ github.event.pull_request.head.ref }}" = "${TARGET_BRANCH}"
          test "$(git rev-parse --abbrev-ref HEAD)" = "${TARGET_BRANCH}"
          git merge-base --is-ancestor "${BASE_SHA}" HEAD
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "${WORKFLOW_PATH}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Apply stable lifecycle fallback
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('http-generic-api/routes/tenantLifecycleRoutes.js')
          source = path.read_text(encoding='utf-8')
          old = 'err.code || "workspace_invitations_expire_stale_failed"'
          new = 'err.code || "workspace_invitations_expire_failed"'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'workspace_invitation_expire_stable_code_marker_mismatch:{count}')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY

      - name: Regenerate scoped queue evidence
        working-directory: http-generic-api
        run: |
          set -Eeuo pipefail
          node scripts/surface-contract-discovery.mjs
          node scripts/surface-callability-closure/generate_closure_contracts.mjs
          node scripts/surface-contract-discovery.mjs

      - name: Build scoped queue diagnostic
        working-directory: http-generic-api
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('resource-api-surface-callability.manifest.json', 'utf8'));
          const queue = JSON.parse(fs.readFileSync('../docs/surface-contract-gap-queue.json', 'utf8'));
          const scoped = new Set(manifest.source_queue_tool_keys || []);
          const remaining = (queue.top_items || []).flatMap((item) => {
            const matchingActions = (item.remediation || []).filter((action) =>
              action.action_key === 'verify_tool_registry_binding' &&
              (action.targets || []).some((key) => scoped.has(key))
            );
            if (!matchingActions.length) return [];
            return [{
              migration_file: item.migration_file,
              classification_status: item.classification_status ?? null,
              confidence: item.confidence ?? null,
              unmet_checks: item.unmet_checks ?? [],
              matching_actions: matchingActions.map((action) => ({
                action_key: action.action_key,
                targets: action.targets || [],
                matching_targets: (action.targets || []).filter((key) => scoped.has(key)),
              })),
              full_item: item,
            }];
          });
          const diagnostic = {
            schema: 'mad4b.surface-scoped-queue-diagnostic.v1',
            head_sha: process.env.GITHUB_SHA,
            repository_queue_items: queue.total_items ?? queue.top_items?.length ?? null,
            source_queue_item_count: manifest.source_queue_item_count,
            scoped_tool_key_count: scoped.size,
            scoped_tool_keys: [...scoped].sort(),
            remaining_scoped_item_count: remaining.length,
            remaining_scoped_items: remaining,
          };
          fs.writeFileSync('/tmp/surface-queue-diagnostics.json', `${JSON.stringify(diagnostic, null, 2)}\n`);
          console.log(JSON.stringify({
            remaining_scoped_item_count: diagnostic.remaining_scoped_item_count,
            migration_files: remaining.map((item) => item.migration_file),
          }));
          NODE

      - name: Upload scoped queue diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surface-scoped-queue-diagnostic-${{ github.sha }}
          path: |
            /tmp/surface-queue-diagnostics.json
            docs/surface-contract-gap-queue.json
            docs/surface-contract-discovery-status.json
            http-generic-api/resource-api-surface-callability.manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce diagnostic result
        working-directory: http-generic-api
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const diagnostic = JSON.parse(fs.readFileSync('/tmp/surface-queue-diagnostics.json', 'utf8'));
          if (diagnostic.remaining_scoped_item_count !== 0) {
            throw new Error(`surface_scoped_queue_not_zero:${diagnostic.remaining_scoped_item_count}:${diagnostic.remaining_scoped_items.map((item) => item.migration_file).join(',')}`);
          }
          console.log(JSON.stringify({ok:true,remaining_scoped_items:0}));
          NODE
