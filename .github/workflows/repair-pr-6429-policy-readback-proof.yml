name: Repair PR 6429 Policy Readback Proof

on:
  push:
    branches:
      - gpt/github-main-policy-controller-20260805

permissions:
  contents: write

concurrency:
  group: repair-pr-6429-policy-readback-proof
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v5
        with:
          ref: gpt/github-main-policy-controller-20260805
          fetch-depth: 0

      - name: Apply structural fail-closed readback repair
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          controller_path = Path('http-generic-api/githubRepositoryPolicyController.js')
          test_path = Path('http-generic-api/test-github-repository-policy-controller.mjs')
          manifest_path = Path('.changes/e2e/github-repository-policy-controller.json')

          def sub_once(text, pattern, replacement, label):
              updated, count = re.subn(pattern, lambda _: replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected one structural match, found {count}')
              return updated

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one exact match, found {count}')
              return text.replace(old, new, 1)

          controller = controller_path.read_text()
          controller = sub_once(
              controller,
              r'function matchesMainCondition\(detail = \{\}, defaultBranch = "main"\) \{.*?\n\}\n\nfunction evaluateRuleset',
              r'''function refPatternMatchesMain(pattern = "", defaultBranch = "main") {
            const value = compact(pattern, 255);
            if (!value) return false;
            const branchRef = `refs/heads/${defaultBranch}`;
            if (["~DEFAULT_BRANCH", "~ALL", defaultBranch, branchRef].includes(value)) return true;
            if (!value.includes("*") && !value.includes("?")) return false;
            const wildcardSafe = value
              .replace(/\*\*/g, "\u0000")
              .replace(/\*/g, "\u0001")
              .replace(/\?/g, "\u0002");
            const escaped = wildcardSafe.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const source = escaped
              .replace(/\u0000/g, ".*")
              .replace(/\u0001/g, "[^/]*")
              .replace(/\u0002/g, "[^/]");
            try {
              return new RegExp(`^${source}$`).test(branchRef);
            } catch {
              return false;
            }
          }

          function matchesMainCondition(detail = {}, defaultBranch = "main") {
            const include = uniqueStrings(detail.conditions?.ref_name?.include || []);
            const exclude = uniqueStrings(detail.conditions?.ref_name?.exclude || []);
            return include.some((pattern) => refPatternMatchesMain(pattern, defaultBranch))
              && !exclude.some((pattern) => refPatternMatchesMain(pattern, defaultBranch));
          }

          function evaluateRuleset''',
              'replace main condition matcher',
          )

          controller = sub_once(
              controller,
              r'  const rulesetDetails = rulesetsIndex\.ok\n.*?\n  const collaboratorPermissions = collaborators\.ok',
              '''  const rulesetsIndexReadable = rulesetsIndex.ok && Array.isArray(rulesetsIndex.payload);
          const rulesetIndex = rulesetsIndexReadable ? rulesetsIndex.payload : [];
          const rulesetDetails = rulesetsIndexReadable
            ? await readRulesetDetails({ owner: target.owner, repo: target.repo, index: rulesetIndex, token, fetchImpl })
            : [];
          const indexedRulesetIds = rulesetIndex.map((item) => Number(item?.id || 0)).filter(Boolean);
          const rulesetDetailsReadable = rulesetsIndexReadable
            && indexedRulesetIds.length === rulesetIndex.length
            && rulesetDetails.length === indexedRulesetIds.length
            && rulesetDetails.every((item) => item.status === 200 && item.detail);
          const collaboratorPermissions = collaborators.ok''',
              'replace ruleset detail readback',
          )

          controller = sub_once(
              controller,
              r'  const mainRulesets = evaluatedRulesets\.filter\(.*?\);\n  const managedRulesets = mainRulesets\.filter\(.*?\);',
              '''  const mainRulesets = evaluatedRulesets.filter((item) => item.enforcement === "active" && item.applies_to_main);
          const managedRulesets = evaluatedRulesets.filter((item) => item.name === GITHUB_REPOSITORY_POLICY_RULESET_NAME && item.applies_to_main);
          const activeManagedRulesets = mainRulesets.filter((item) => item.name === GITHUB_REPOSITORY_POLICY_RULESET_NAME);''',
              'replace managed ruleset counting',
          )

          controller = sub_once(
              controller,
              r'  const branchKnownUnprotected = branch\.ok.*?\n  const autoMergeAllowed = repository\.ok \? bool\(repository\.payload\?\.allow_auto_merge\) : null;\n',
              '''  const branchReadable = branch.ok
            && SHA_PATTERN.test(String(branch.payload?.commit?.sha || ""))
            && typeof branch.payload?.protected === "boolean";
          const activeRulesReadable = activeRules.ok && Array.isArray(activeRules.payload);
          const classicProtectionReadable = classicProtection.status === 404
            || (classicProtection.status === 200 && classicProtection.payload && typeof classicProtection.payload === "object");
          const repositoryAutoMergeReadable = repository.ok && typeof repository.payload?.allow_auto_merge === "boolean";
          const protectionReadable = classicProtectionReadable
            && activeRulesReadable
            && rulesetsIndexReadable
            && rulesetDetailsReadable
            && branchReadable;
          const pullRequestRequired = requiredReviewCount >= 1 || activePullRequestRules.length > 0 || mainRulesets.some((item) => item.pull_request.present);
          const directPushBlocked = protectionReadable
            && branch.payload.protected === true
            && pullRequestRequired
            && allBypassActors.length === 0;
          const autoMergeAllowed = repositoryAutoMergeReadable ? repository.payload.allow_auto_merge : null;
          ''',
              'replace policy readability proof',
          )

          controller = replace_once(
              controller,
              '    policy_state_readable: protectionReadable,\n',
              '    policy_state_readable: protectionReadable,\n    ruleset_details_readable: rulesetDetailsReadable,\n',
              'add ruleset detail proof',
          )
          controller = replace_once(
              controller,
              '    finalizer_not_bypass_proven: finalizerAppId !== null && matchingFinalizerBypassActors.length === 0,\n',
              '    finalizer_not_bypass_proven: finalizerAppId !== null && rulesetDetailsReadable && matchingFinalizerBypassActors.length === 0,\n',
              'bind bypass proof to readable details',
          )
          controller = replace_once(
              controller,
              '  if (!proof.policy_state_readable) findings.push("policy_state_unreadable");\n',
              '  if (!proof.policy_state_readable) findings.push("policy_state_unreadable");\n  if (!proof.ruleset_details_readable) findings.push("ruleset_details_unreadable");\n',
              'add ruleset detail finding',
          )
          controller = replace_once(
              controller,
              '    main_sha: branch.ok ? branch.payload?.commit?.sha || null : null,\n',
              '    main_sha: branchReadable ? branch.payload.commit.sha : null,\n',
              'fail closed main sha',
          )
          controller = replace_once(
              controller,
              '      collaborators: collaborators.status,\n    },\n',
              '      collaborators: collaborators.status,\n      ruleset_details: rulesetDetails.map((item) => ({ id: item.id, status: item.status })),\n    },\n',
              'report ruleset detail status',
          )
          controller = replace_once(
              controller,
              '    branch_protected: branch.ok ? Boolean(branch.payload?.protected) : null,\n',
              '    branch_protected: branchReadable ? branch.payload.protected : null,\n',
              'report strict branch protection state',
          )
          controller = sub_once(
              controller,
              r'    ruleset_index_count: rulesetsIndex\.ok && Array\.isArray\(rulesetsIndex\.payload\) \? rulesetsIndex\.payload\.length : null,\n    ruleset_details: evaluatedRulesets,\n    managed_ruleset_count: managedRulesets\.length,',
              '''    ruleset_index_count: rulesetsIndexReadable ? rulesetIndex.length : null,
          ruleset_details: evaluatedRulesets,
          managed_ruleset_count: managedRulesets.length,
          active_managed_ruleset_count: activeManagedRulesets.length,''',
              'report all managed rulesets',
          )
          controller_path.write_text(controller)

          tests = test_path.read_text()
          tests = sub_once(
              tests,
              r'function desiredRuleset\(\{ bypassActors = \[\], reviewCount = 1, missingCheck = null \} = \{\}\) \{',
              '''function desiredRuleset({
            bypassActors = [],
            reviewCount = 1,
            missingCheck = null,
            includeRefs = ["~DEFAULT_BRANCH"],
            excludeRefs = [],
          } = {}) {''',
              'extend desired ruleset helper',
          )
          tests = replace_once(
              tests,
              '    conditions: { ref_name: { include: ["~DEFAULT_BRANCH"], exclude: [] } },\n',
              '    conditions: { ref_name: { include: includeRefs, exclude: excludeRefs } },\n',
              'bind desired ruleset conditions',
          )
          tests = sub_once(
              tests,
              r'function createGithubFetch\(\{\n  classicStatus = 404,\n  initialRuleset = null,\n  postReadbackRuleset = null,\n  repositoryAutoMerge = false,\n\} = \{\}\) \{',
              '''function createGithubFetch({
            classicStatus = 404,
            initialRuleset = null,
            postReadbackRuleset = null,
            repositoryAutoMerge = false,
            repositoryPayload = undefined,
            branchPayload = undefined,
            rulesetDetailStatus = 200,
          } = {}) {''',
              'extend GitHub mock options',
          )
          tests = replace_once(
              tests,
              '      return response(200, { allow_auto_merge: repositoryAutoMerge });\n',
              '      return response(200, repositoryPayload === undefined ? { allow_auto_merge: repositoryAutoMerge } : repositoryPayload);\n',
              'mock repository payload',
          )
          tests = replace_once(
              tests,
              '      return response(200, { name: "main", commit: { sha: MAIN_SHA }, protected: Boolean(state.ruleset) });\n',
              '      return response(200, branchPayload === undefined\n        ? { name: "main", commit: { sha: MAIN_SHA }, protected: Boolean(state.ruleset) }\n        : branchPayload);\n',
              'mock branch payload',
          )
          tests = replace_once(
              tests,
              '      if (!state.ruleset) return response(404, { message: "Not Found" });\n      return response(200, state.postReadbackRuleset || state.ruleset);\n',
              '      if (!state.ruleset) return response(404, { message: "Not Found" });\n      if (rulesetDetailStatus !== 200) return response(rulesetDetailStatus, { message: "Ruleset detail unavailable" });\n      return response(200, state.postReadbackRuleset || state.ruleset);\n',
              'mock ruleset detail status',
          )

          insertion_marker = '    assert.equal(readback.secrets_included, false);\n  }\n'
          marker_index = tests.find(insertion_marker)
          if marker_index < 0:
              raise SystemExit('insert fail-closed regressions: first readback marker not found')
          marker_end = marker_index + len(insertion_marker)
          regressions = r'''

          {
            const excludedRuleset = desiredRuleset({ excludeRefs: ["~DEFAULT_BRANCH"] });
            const mock = createGithubFetch({ initialRuleset: excludedRuleset });
            const readback = await readGithubRepositoryPolicy({ owner: OWNER, repo: REPO }, controllerDeps(mock.fetchImpl));
            assert.equal(readback.ruleset_details[0].applies_to_main, false);
            assert.equal(readback.managed_ruleset_count, 0);
            const plan = buildGithubRepositoryPolicyPlan({ owner: OWNER, repo: REPO }, readback);
            assert.equal(plan.operation, "create_ruleset");
          }

          {
            const wildcardExcludedRuleset = desiredRuleset({ excludeRefs: ["refs/heads/ma*"] });
            const mock = createGithubFetch({ initialRuleset: wildcardExcludedRuleset });
            const readback = await readGithubRepositoryPolicy({ owner: OWNER, repo: REPO }, controllerDeps(mock.fetchImpl));
            assert.equal(readback.ruleset_details[0].applies_to_main, false);
            assert.equal(readback.managed_ruleset_count, 0);
          }

          {
            const mock = createGithubFetch({ initialRuleset: desiredRuleset(), repositoryPayload: {} });
            const readback = await readGithubRepositoryPolicy({ owner: OWNER, repo: REPO }, controllerDeps(mock.fetchImpl));
            assert.equal(readback.repository_auto_merge_allowed, null);
            assert.equal(readback.proof.auto_merge_disabled, false);
            assert.ok(readback.findings.includes("repository_auto_merge_not_disabled"));
            assert.equal(readback.proof.server_policy_gate_complete, false);
          }

          {
            const mock = createGithubFetch({ initialRuleset: desiredRuleset(), rulesetDetailStatus: 403 });
            const readback = await readGithubRepositoryPolicy({ owner: OWNER, repo: REPO }, controllerDeps(mock.fetchImpl));
            assert.equal(readback.proof.ruleset_details_readable, false);
            assert.equal(readback.proof.policy_state_readable, false);
            assert.equal(readback.proof.finalizer_not_bypass_proven, false);
            assert.ok(readback.findings.includes("ruleset_details_unreadable"));
            assert.equal(readback.proof.server_policy_gate_complete, false);
          }

          {
            const mock = createGithubFetch({
              initialRuleset: desiredRuleset(),
              branchPayload: { name: "main", commit: { sha: MAIN_SHA } },
            });
            const readback = await readGithubRepositoryPolicy({ owner: OWNER, repo: REPO }, controllerDeps(mock.fetchImpl));
            assert.equal(readback.main_sha, null);
            assert.equal(readback.branch_protected, null);
            assert.equal(readback.proof.policy_state_readable, false);
            assert.equal(readback.proof.direct_push_block_proven, false);
            assert.equal(readback.proof.server_policy_gate_complete, false);
          }

          {
            const first = { ...desiredRuleset(), id: 41, enforcement: "disabled" };
            const second = { ...desiredRuleset(), id: 42, enforcement: "evaluate" };
            const rulesets = new Map([[41, first], [42, second]]);
            const fetchImpl = async (url, options = {}) => {
              const method = String(options.method || "GET").toUpperCase();
              const path = new URL(url).pathname;
              if (path === `/repos/${OWNER}/${REPO}` && method === "GET") return response(200, { allow_auto_merge: false });
              if (path === `/repos/${OWNER}/${REPO}/branches/main` && method === "GET") return response(200, { name: "main", commit: { sha: MAIN_SHA }, protected: true });
              if (path === `/repos/${OWNER}/${REPO}/rules/branches/main` && method === "GET") return response(200, []);
              if (path === `/repos/${OWNER}/${REPO}/rulesets` && method === "GET") return response(200, [{ id: 41 }, { id: 42 }]);
              if (path === `/repos/${OWNER}/${REPO}/branches/main/protection` && method === "GET") return response(404, { message: "Branch not protected" });
              if (path === `/repos/${OWNER}/${REPO}/collaborators` && method === "GET") return response(200, []);
              const match = path.match(/\/rulesets\/(41|42)$/);
              if (match && method === "GET") return response(200, rulesets.get(Number(match[1])));
              throw new Error(`Unhandled GitHub ambiguity mock request: ${method} ${path}`);
            };
            const readback = await readGithubRepositoryPolicy({ owner: OWNER, repo: REPO }, controllerDeps(fetchImpl));
            assert.equal(readback.managed_ruleset_count, 2);
            assert.equal(readback.active_managed_ruleset_count, 0);
            const plan = buildGithubRepositoryPolicyPlan({ owner: OWNER, repo: REPO }, readback);
            assert.equal(plan.preconditions.managed_ruleset_ambiguity_absent, false);
          }
          '''
          tests = tests[:marker_end] + regressions + tests[marker_end:]
          test_path.write_text(tests)

          manifest = json.loads(manifest_path.read_text())
          assertions = manifest['phases'][0]['e2e_journeys'][0]['assertions']
          for item in [
              'Rulesets that explicitly or by pattern exclude main are never counted as applying to main.',
              'Missing branch protection booleans, missing repository auto-merge state, malformed indexes, or unreadable Ruleset details keep server_policy_gate_complete=false.',
              'Managed Ruleset ambiguity counts active and inactive matching Rulesets before any apply.',
          ]:
              if item not in assertions:
                  assertions.append(item)
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')
          PY

      - name: Install focused test dependencies
        working-directory: http-generic-api
        run: npm ci --ignore-scripts

      - name: Validate focused repair
        working-directory: http-generic-api
        run: |
          set -euo pipefail
          node --check githubRepositoryPolicyController.js
          node test-github-repository-policy-controller.mjs
          node test-repository-automation-policy-facade.mjs

      - name: Commit bounded repair and remove bootstrap workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-pr-6429-policy-readback-proof.yml
          git rm .github/workflows/diagnose-pr-6429-policy-readback-proof.yml
          git add .changes/e2e/github-repository-policy-controller.json \
            http-generic-api/githubRepositoryPolicyController.js \
            http-generic-api/test-github-repository-policy-controller.mjs
          git diff --cached --check
          git commit -m "fix(github): fail closed on ambiguous policy readback"
          git push origin HEAD:gpt/github-main-policy-controller-20260805
