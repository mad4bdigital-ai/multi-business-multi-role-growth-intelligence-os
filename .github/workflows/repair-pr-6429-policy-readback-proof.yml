name: Repair PR 6429 Policy Readback Proof

on:
  push:
    branches:
      - gpt/github-main-policy-controller-20260805

permissions:
  contents: read

concurrency:
  group: repair-pr-6429-policy-readback-proof
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v5
        with:
          ref: gpt/github-main-policy-controller-20260805
          fetch-depth: 2

      - name: Extract and execute parent bootstrap Python
        id: diagnose
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          git show HEAD^:.github/workflows/repair-pr-6429-policy-readback-proof.yml > /tmp/parent-repair.yml
          python3 - <<'PY'
          from pathlib import Path

          source = Path('/tmp/parent-repair.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if "python3 <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          body = source[start:end]
          non_empty = [len(line) - len(line.lstrip()) for line in body if line.strip()]
          indent = min(non_empty) if non_empty else 0
          Path('/tmp/pr6429-repair.py').write_text('\n'.join(line[indent:] for line in body) + '\n')
          PY
          set +e
          python3 /tmp/pr6429-repair.py > /tmp/pr6429-repair.log 2>&1
          status=$?
          set -e
          cat /tmp/pr6429-repair.log
          printf '%s\n' "$status" > /tmp/pr6429-repair-status.txt
          exit "$status"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-6429-policy-readback-repair-diagnostic
          path: |
            /tmp/parent-repair.yml
            /tmp/pr6429-repair.py
            /tmp/pr6429-repair.log
            /tmp/pr6429-repair-status.txt
          if-no-files-found: error

      - name: Fail after evidence upload
        if: steps.diagnose.outcome == 'failure'
        run: exit 1
