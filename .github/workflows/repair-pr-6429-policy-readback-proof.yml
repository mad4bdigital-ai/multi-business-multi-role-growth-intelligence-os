name: Repair PR 6429 Policy Readback Proof

on:
  push:
    branches:
      - gpt/github-main-policy-controller-20260805

permissions:
  contents: write

concurrency:
  group: repair-pr-6429-policy-readback-proof
  cancel-in-progress: false

jobs:
  format-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v5
        with:
          ref: gpt/github-main-policy-controller-20260805
          fetch-depth: 0

      - name: Normalize controller formatting by structural ranges
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def find_line(lines, value, start=0):
              for index in range(start, len(lines)):
                  if lines[index] == value:
                      return index
              raise SystemExit(f'line marker not found: {value}')

          def normalize_range(lines, start, end, base_prefixes=('const ',), continuation_prefixes=('?', ':', '&&', '||')):
              for index in range(start, end):
                  if not lines[index].strip():
                      continue
                  stripped = lines[index].lstrip()
                  if stripped.startswith(base_prefixes):
                      lines[index] = '  ' + stripped
                  elif stripped.startswith(continuation_prefixes):
                      lines[index] = '    ' + stripped

          path = Path('http-generic-api/githubRepositoryPolicyController.js')
          lines = path.read_text().splitlines()

          readback_start = find_line(lines, '  const rulesetsIndexReadable = rulesetsIndex.ok && Array.isArray(rulesetsIndex.payload);')
          readback_end = find_line(lines, '  const config = resolveGitHubAppConfig(args.action || {});', readback_start)
          normalize_range(lines, readback_start, readback_end)

          managed_start = find_line(lines, '  const mainRulesets = evaluatedRulesets.filter((item) => item.enforcement === "active" && item.applies_to_main);')
          managed_end = find_line(lines, '  const allBypassActors = mainRulesets.flatMap((item) => item.bypass_actors.map((actor) => ({ ...actor, ruleset_id: item.id, ruleset_name: item.name })));', managed_start)
          normalize_range(lines, managed_start, managed_end, continuation_prefixes=())

          proof_start = find_line(lines, '  const branchReadable = branch.ok')
          proof_end = find_line(lines, '  const proof = {', proof_start)
          normalize_range(lines, proof_start, proof_end)

          output_start = find_line(lines, '    ruleset_index_count: rulesetsIndexReadable ? rulesetIndex.length : null,')
          output_end = find_line(lines, '    bypass_actors: allBypassActors,', output_start)
          for index in range(output_start, output_end):
              if lines[index].strip():
                  lines[index] = '    ' + lines[index].lstrip()

          path.write_text('\n'.join(lines) + '\n')
          PY

      - name: Install focused test dependencies
        working-directory: http-generic-api
        run: npm ci --ignore-scripts

      - name: Validate formatted repair
        working-directory: http-generic-api
        run: |
          set -euo pipefail
          node --check githubRepositoryPolicyController.js
          node test-github-repository-policy-controller.mjs
          node test-repository-automation-policy-facade.mjs

      - name: Commit formatting and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-pr-6429-policy-readback-proof.yml
          git add http-generic-api/githubRepositoryPolicyController.js
          git diff --cached --check
          git commit -m "style(github): normalize policy readback proof repair"
          git push origin HEAD:gpt/github-main-policy-controller-20260805
