name: Register Spec 014 Tenant hardening

on:
  push:
    branches:
      - gpt/014-hostinger/tenant-canary-postmerge-hardening-20260801
    paths:
      - .github/workflows/spec014-register-tenant-canary-hardening.yml

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gpt/014-hostinger/tenant-canary-postmerge-hardening-20260801
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Register hardening workstream
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const path = 'specs/014-governed-hostinger-storage-orchestration/e2e-phases.json';
          const contract = JSON.parse(fs.readFileSync(path, 'utf8'));
          const parallel = contract.parallel_work;
          const id = 'tenant-canary-hardening';

          if (!parallel.workstreams.some((row) => row.id === id)) {
            const tenantIndex = parallel.workstreams.findIndex((row) => row.id === 'tenant-canary');
            if (tenantIndex < 0) throw new Error('tenant-canary workstream not found');
            parallel.workstreams.splice(tenantIndex + 1, 0, {
              id,
              title: 'Tenant canary post-integration hardening',
              status: 'ready_for_integration',
              owner_type: 'mixed',
              branch_pattern: 'gpt/014-hostinger/tenant-canary-postmerge-hardening-*',
              scope: {
                include: [
                  '.github/workflows/hostinger-storage-tenant-canary-guard.yml',
                  'http-generic-api/hostingerStorageTenantCanary*.js',
                  'http-generic-api/test-hostinger-storage-tenant-canary*.mjs',
                  'specs/014-governed-hostinger-storage-orchestration/evidence/tenant-canary-postmerge-hardening-*.md'
                ]
              },
              depends_on: ['tenant-canary', 'synthetic-executor', 'shared-canary'],
              deliverables: [
                'Tenant-owned unforgeable synthetic adapter provenance brand',
                'Complete repository and immutable-plan authority preflight before one-shot consumption',
                'Clock rollback and not-before enforcement',
                'Never-reusable normalized authority tokens with accessor-safe delegation',
                'Repository-wide JavaScript and TypeScript Base-import governance'
              ],
              integration_points: [
                'tenant-storage-canary-v1',
                'hostinger-storage-synthetic-executor-v1'
              ],
              required_tests: [
                { id: 'hostinger-storage-tenant-canary', runner: 'node', working_directory: 'http-generic-api', path: 'test-hostinger-storage-tenant-canary.mjs', args: [] },
                { id: 'hostinger-storage-tenant-canary-authority-cas', runner: 'node', working_directory: 'http-generic-api', path: 'test-hostinger-storage-tenant-canary-authority-cas.mjs', args: [] },
                { id: 'hostinger-storage-tenant-canary-postmerge-hardening', runner: 'node', working_directory: 'http-generic-api', path: 'test-hostinger-storage-tenant-canary-postmerge-hardening.mjs', args: [] },
                { id: 'hostinger-storage-tenant-canary-token-normalization', runner: 'node', working_directory: 'http-generic-api', path: 'test-hostinger-storage-tenant-canary-token-normalization.mjs', args: [] },
                { id: 'hostinger-storage-tenant-canary-token-delegation', runner: 'node', working_directory: 'http-generic-api', path: 'test-hostinger-storage-tenant-canary-token-delegation.mjs', args: [] }
              ],
              commit_evidence: {
                head_sha: process.env.SOURCE_SHA,
                commits: [process.env.SOURCE_SHA]
              }
            });
          }

          parallel.declared_overlaps ||= [];
          const overlapId = 'tenant-canary-post-integration-hardening';
          if (!parallel.declared_overlaps.some((row) => row.id === overlapId)) {
            parallel.declared_overlaps.push({
              id: overlapId,
              workstreams: ['tenant-canary', 'tenant-canary-hardening'],
              patterns: [
                '.github/workflows/hostinger-storage-tenant-canary-guard.yml',
                'http-generic-api/hostingerStorageTenantCanary*.js',
                'http-generic-api/test-hostinger-storage-tenant-canary*.mjs'
              ],
              reason: 'The post-integration correction hardens the already integrated Tenant Canary entry points while preserving their public contracts and adding fail-closed provenance, authority, timing, and import-boundary checks.',
              coordinator: 'spec-014-integration-rollup'
            });
          }

          const required = parallel.integration?.required_workstreams;
          if (!Array.isArray(required)) throw new Error('integration.required_workstreams missing');
          if (!required.includes(id)) {
            const tenantIndex = required.indexOf('tenant-canary');
            required.splice(tenantIndex >= 0 ? tenantIndex + 1 : required.length, 0, id);
          }

          fs.writeFileSync(path, `${JSON.stringify(contract)}\n`);
          NODE

          if git diff --quiet -- specs/014-governed-hostinger-storage-orchestration/e2e-phases.json; then
            echo 'Spec 014 hardening workstream already registered.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/014-governed-hostinger-storage-orchestration/e2e-phases.json
          git commit -m 'chore(spec-014): register Tenant canary hardening workstream'
          git push origin HEAD:gpt/014-hostinger/tenant-canary-postmerge-hardening-20260801
