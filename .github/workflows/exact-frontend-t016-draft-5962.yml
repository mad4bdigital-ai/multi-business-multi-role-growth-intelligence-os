name: Exact Frontend T016 Draft 5962

on:
  pull_request:
    branches:
      - gpt/validate-frontend-t016-draft-base-a61cd9
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: exact-frontend-t016-draft-5962-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  candidate-governance-evidence:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/validate-frontend-t016-evidence-probe-20260804' &&
      github.event.pull_request.head.sha == '180804fc1561a3f484f945d6e2a7f7877dbfac7b'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      EXPECTED_BASE_SHA: a61cd9e83070618001676bbc679bc937f0551875
      EXPECTED_HEAD_SHA: 8b93404a4ab7df1448762156a6bd22391876ad95
      GENERATED_PATH: http-generic-api/frontend-surface-dispatch.generated.json
      EXPECTED_BLOB: 1e8ded76f4bf163992cec94ebd362edfdb4a6dfd
      EXPECTED_SHA256: 31690e555cc536a185c7f8aa220628daec2ed8bbbed70f3810ef930717526ce9

    steps:
      - name: Checkout exact Frontend candidate
        uses: actions/checkout@v5
        with:
          ref: 8b93404a4ab7df1448762156a6bd22391876ad95
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable identity and one-file scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          git cat-file -e "${EXPECTED_BASE_SHA}^{commit}"
          test "$(git merge-base "${EXPECTED_BASE_SHA}" "${EXPECTED_HEAD_SHA}")" = "${EXPECTED_BASE_SHA}"
          mapfile -t files < <(git diff --name-only "${EXPECTED_BASE_SHA}"..."${EXPECTED_HEAD_SHA}")
          test "${#files[@]}" -eq 1
          test "${files[0]}" = "${GENERATED_PATH}"
          test "$(git rev-parse "${EXPECTED_HEAD_SHA}:${GENERATED_PATH}")" = "${EXPECTED_BLOB}"
          test "$(sha256sum "${GENERATED_PATH}" | awk '{print $1}')" = "${EXPECTED_SHA256}"
          git diff --check "${EXPECTED_BASE_SHA}"..."${EXPECTED_HEAD_SHA}"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install HTTP API dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Run E2E reference integrity
        id: reference_integrity
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/reference-integrity"
          node http-generic-api/test-e2e-contract-reference-integrity.mjs
          node http-generic-api/test-e2e-contract-git-index-integrity.mjs
          node http-generic-api/scripts/e2e-contract-reference-integrity.mjs \
            --base "${EXPECTED_BASE_SHA}" \
            --head "${EXPECTED_HEAD_SHA}" \
            --report-file "${RUNNER_TEMP}/reference-integrity/e2e-contract-reference-integrity.json"
          node http-generic-api/scripts/e2e-contract-git-index-integrity.mjs \
            --report-file "${RUNNER_TEMP}/reference-integrity/e2e-contract-reference-integrity.json"

      - name: Run repository-tool lifecycle governance
        id: lifecycle
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs
          git diff --name-status "${EXPECTED_BASE_SHA}" "${EXPECTED_HEAD_SHA}" > "${RUNNER_TEMP}/repository-tool-changes.tsv"
          CANDIDATE_SHA="${EXPECTED_HEAD_SHA}" BASE_SHA="${EXPECTED_BASE_SHA}" \
            node http-generic-api/scripts/maintenance-tools/repository-tool-lifecycle-guard.mjs \
              --changed-files "${RUNNER_TEMP}/repository-tool-changes.tsv" \
              --policy .github/repository-maintenance-tool-governance.json \
              --output-dir "${RUNNER_TEMP}/repository-tool-lifecycle"

      - name: Write bounded candidate governance summary
        if: always()
        shell: bash
        env:
          REFERENCE_OUTCOME: ${{ steps.reference_integrity.outcome }}
          LIFECYCLE_OUTCOME: ${{ steps.lifecycle.outcome }}
        run: |
          set -euo pipefail
          jq -n \
            --arg base_sha "${EXPECTED_BASE_SHA}" \
            --arg head_sha "${EXPECTED_HEAD_SHA}" \
            --arg generated_blob "${EXPECTED_BLOB}" \
            --arg generated_sha256 "${EXPECTED_SHA256}" \
            --arg reference_outcome "${REFERENCE_OUTCOME}" \
            --arg lifecycle_outcome "${LIFECYCLE_OUTCOME}" \
            '{base_sha:$base_sha,head_sha:$head_sha,generated_blob:$generated_blob,generated_sha256:$generated_sha256,changed_paths:["http-generic-api/frontend-surface-dispatch.generated.json"],reference_integrity:$reference_outcome,repository_tool_lifecycle:$lifecycle_outcome,protected_ref_mutated:false,production_mutated:false,provider_call:false,credential_read:false,sql_executed:false,migration_apply:false,database_mutated:false,external_send:false,secrets_included:false}' \
            > "${RUNNER_TEMP}/frontend-t016-candidate-governance-summary.json"

      - name: Upload bounded candidate governance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-frontend-t016-candidate-governance-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/frontend-t016-candidate-governance-summary.json
            ${{ runner.temp }}/reference-integrity/
            ${{ runner.temp }}/repository-tool-lifecycle/
          if-no-files-found: error
          retention-days: 14

      - name: Preserve candidate governance conclusions
        if: always()
        shell: bash
        env:
          REFERENCE_OUTCOME: ${{ steps.reference_integrity.outcome }}
          LIFECYCLE_OUTCOME: ${{ steps.lifecycle.outcome }}
        run: |
          set -euo pipefail
          test "${REFERENCE_OUTCOME}" = "success"
          test "${LIFECYCLE_OUTCOME}" = "success"

  baseline-oauth-probe:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/validate-frontend-t016-evidence-probe-20260804' &&
      github.event.pull_request.head.sha == '180804fc1561a3f484f945d6e2a7f7877dbfac7b'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      EXPECTED_BASE_SHA: a61cd9e83070618001676bbc679bc937f0551875
      PROBE_LOG: ${{ runner.temp }}/auth-oauth-base-probe.log
      PROBE_SUMMARY: ${{ runner.temp }}/auth-oauth-base-probe-summary.json

    steps:
      - name: Checkout immutable base source
        uses: actions/checkout@v5
        with:
          ref: a61cd9e83070618001676bbc679bc937f0551875
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable base source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_BASE_SHA}"
          test -z "$(git status --porcelain)"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install HTTP API dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Run exact OAuth route test and capture evidence
        id: oauth_test
        working-directory: http-generic-api
        shell: bash
        run: |
          set -uo pipefail
          set +e
          node test-auth-oauth-routes.mjs 2>&1 | tee "${PROBE_LOG}"
          status=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Write bounded base probe summary
        if: always()
        shell: bash
        env:
          TEST_EXIT_CODE: ${{ steps.oauth_test.outputs.exit_code }}
        run: |
          set -euo pipefail
          first_failure="$(grep -m1 -E '\[FAIL\]|TypeError:|AssertionError|^not ok' "${PROBE_LOG}" || true)"
          jq -n \
            --arg source_sha "${EXPECTED_BASE_SHA}" \
            --arg test_command "node test-auth-oauth-routes.mjs" \
            --arg exit_code "${TEST_EXIT_CODE:-unknown}" \
            --arg first_failure "${first_failure}" \
            '{source_sha:$source_sha,test_command:$test_command,exit_code:$exit_code,first_failure:$first_failure,protected_ref_mutated:false,production_mutated:false,provider_call:false,credential_read:false,sql_executed:false,migration_apply:false,database_mutated:false,external_send:false,secrets_included:false}' \
            > "${PROBE_SUMMARY}"

      - name: Upload bounded base probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-auth-oauth-base-probe-a61cd9-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/auth-oauth-base-probe.log
            ${{ runner.temp }}/auth-oauth-base-probe-summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Preserve exact base test conclusion
        if: always()
        shell: bash
        env:
          TEST_EXIT_CODE: ${{ steps.oauth_test.outputs.exit_code }}
        run: |
          set -euo pipefail
          test "${TEST_EXIT_CODE}" = "0"
