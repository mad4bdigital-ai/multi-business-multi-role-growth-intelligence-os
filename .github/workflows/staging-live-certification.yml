name: Staging Live Certification

on:
  workflow_dispatch:
    inputs:
      expected_candidate_sha:
        description: Exact immutable Production candidate SHA whose first parent is the main release cut
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: staging-live-certification-${{ inputs.expected_candidate_sha }}
  cancel-in-progress: true

jobs:
  certify:
    name: Staging Live Certification
    runs-on: ubuntu-24.04
    environment: staging-recovery-certification
    timeout-minutes: 12
    env:
      EXPECTED_CANDIDATE_SHA: ${{ inputs.expected_candidate_sha }}
      STAGING_CERT_APP_BASE_URL: https://dev.mad4b.com
      STAGING_CERT_EXPECTED_BRANCH: main
      STAGING_CERT_REQUIRE_GATEWAY: "true"
      STAGING_CERT_REQUIRE_GATEWAY_UPSTREAM: "true"
      STAGING_CERT_REQUIRE_READY: "true"
      STAGING_CERT_REPORT_FILE: .artifacts/staging-live-certification/report.json
      STAGING_TRUST_REPORT_FILE: .artifacts/staging-cert-trust-runtime-binding/report.json
      STAGING_AUTHORITY_REPORT_FILE: .artifacts/staging-environment-authority-closure/report.json
      ENVIRONMENT_IMPACT_REPORT_FILE: .artifacts/staging-environment-impact-closure/report.json
    steps:
      - name: Checkout exact immutable candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Install locked runtime dependencies
        working-directory: http-generic-api
        run: npm ci --ignore-scripts

      - name: Resolve exact main release cut from certified candidate
        id: identity
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::expected_candidate_sha must be an exact lowercase SHA"; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_CANDIDATE_SHA" ]] || { echo "::error::workflow head differs from expected candidate"; exit 1; }
          parent_line="$(git rev-list --parents -n 1 HEAD)"
          parent_count=$(( $(wc -w <<<"$parent_line") - 1 ))
          [[ "$parent_count" -ge 1 ]] || { echo "::error::candidate has no release-cut parent"; exit 1; }
          release_cut_sha="$(git rev-parse HEAD^1)"
          [[ "$release_cut_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::release cut is not an exact SHA"; exit 1; }
          git diff --quiet "$release_cut_sha" HEAD || { echo "::error::candidate tree differs from its main release cut"; exit 1; }
          echo "release_cut_sha=$release_cut_sha" >> "$GITHUB_OUTPUT"

      - name: Verify repository environment authorities converge
        env:
          EXPECTED_HEAD_SHA: ${{ steps.identity.outputs.release_cut_sha }}
        run: >-
          node http-generic-api/scripts/staging-environment-authority-closure.mjs
          --expected-sha "$EXPECTED_HEAD_SHA"
          --report-file "$STAGING_AUTHORITY_REPORT_FILE"

      - name: Verify environment impact and migration compatibility closure
        env:
          EXPECTED_HEAD_SHA: ${{ steps.identity.outputs.release_cut_sha }}
        run: >-
          node http-generic-api/scripts/environment-impact-closure.mjs
          --head-sha "$EXPECTED_HEAD_SHA"
          --report-file "$ENVIRONMENT_IMPACT_REPORT_FILE"

      - name: Prepare exact Staging build-context provenance
        env:
          EXPECTED_HEAD_SHA: ${{ steps.identity.outputs.release_cut_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          node http-generic-api/scripts/prepare-staging-build-context.mjs \
            --repository-path . \
            --commit "$EXPECTED_HEAD_SHA" \
            --output-dir .staging-build-context
          expected_tree="$(git rev-parse "${EXPECTED_HEAD_SHA}^{tree}")"
          context_file_set="$(jq -er '.context_file_set_sha256' .staging-build-context/.staging-build-context.json)"
          [[ "$expected_tree" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::exact tree SHA missing"; exit 1; }
          [[ "$context_file_set" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::exact context file-set digest missing"; exit 1; }
          {
            echo "STAGING_CERT_EXPECTED_TREE=$expected_tree"
            echo "STAGING_CERT_EXPECTED_CONTEXT_FILE_SET_SHA256=$context_file_set"
          } >> "$GITHUB_ENV"

      - name: Bind live Staging trusted-ingress evidence
        env:
          STAGING_CERT_EXPECTED_COMMIT: ${{ steps.identity.outputs.release_cut_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$(dirname "$STAGING_TRUST_REPORT_FILE")"
          STAGING_CERT_TRUST_ENV_FILE="$GITHUB_ENV" \
            node http-generic-api/scripts/prepare-staging-cert-trust-evidence.mjs | tee "$STAGING_TRUST_REPORT_FILE"
          jq -e --arg cut "$STAGING_CERT_EXPECTED_COMMIT" '
            .contract == "mad4b.staging-cert-trust-runtime-binding.v1" and
            .ready == true and
            .expected.deployment_sha == $cut and
            .blocking_failures == [] and
            .environment_binding_written == true and
            .safety.read_only_remote_probe == true and
            .safety.replay_claim_performed == false and
            .safety.database_mutation == false and
            .safety.provider_mutation == false and
            .safety.production_mutation == false and
            .safety.raw_public_key_reported == false and
            .safety.secrets_included == false
          ' "$STAGING_TRUST_REPORT_FILE" >/dev/null

      - name: Download exact-SHA signed Staging runtime artifact attestation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CUT_SHA: ${{ steps.identity.outputs.release_cut_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          prefix="staging-runtime-artifact-attestation-${RELEASE_CUT_SHA}-"
          runs_json="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/staging-post-deploy-verification.yml/runs?branch=main&status=success&head_sha=${RELEASE_CUT_SHA}&per_page=100"
          )"
          mapfile -t run_ids < <(
            jq -er --arg sha "$RELEASE_CUT_SHA" '
              .workflow_runs[]
              | select(
                  .head_sha == $sha
                  and .head_branch == "main"
                  and .event == "workflow_dispatch"
                  and .conclusion == "success"
                )
              | .id
            ' <<<"$runs_json"
          )
          [[ "${#run_ids[@]}" -gt 0 ]] || { echo "::error::No successful exact-SHA Staging runtime attestation workflow run exists"; exit 1; }

          candidates="$RUNNER_TEMP/staging-runtime-artifact-attestations.jsonl"
          : > "$candidates"
          for run_id in "${run_ids[@]}"; do
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
              | jq -c --arg prefix "$prefix" --arg sha "$RELEASE_CUT_SHA" --argjson run_id "$run_id" '
                  .artifacts[]
                  | select(
                      .expired == false
                      and (.name | startswith($prefix))
                      and ((.name | ltrimstr($prefix)) | test("^[0-9a-f]{64}$"))
                      and .workflow_run.id == $run_id
                      and .workflow_run.head_sha == $sha
                      and .workflow_run.head_branch == "main"
                    )
                  | {
                      id,
                      name,
                      created_at,
                      workflow_run_id: .workflow_run.id,
                      workflow_head_sha: .workflow_run.head_sha
                    }
                ' >> "$candidates"
          done

          [[ -s "$candidates" ]] || { echo "::error::No non-expired signed Staging runtime artifact attestation exists for the exact release cut"; exit 1; }
          selected="$(jq -s -er 'sort_by(.created_at) | last' "$candidates")"
          artifact_id="$(jq -er '.id' <<<"$selected")"
          artifact_name="$(jq -er '.name' <<<"$selected")"

          output_dir="$RUNNER_TEMP/staging-runtime-artifact-attestation"
          rm -rf "$output_dir"
          mkdir -p "$output_dir"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > "$RUNNER_TEMP/staging-runtime-artifact-attestation.zip"
          unzip -qq "$RUNNER_TEMP/staging-runtime-artifact-attestation.zip" -d "$output_dir"
          rm -f "$RUNNER_TEMP/staging-runtime-artifact-attestation.zip"
          mapfile -t signed_files < <(find "$output_dir" -type f -name signed-runtime-artifact-attestation.json -print)
          [[ "${#signed_files[@]}" -eq 1 ]] || { echo "::error::Expected exactly one signed-runtime-artifact-attestation.json"; exit 1; }
          {
            echo "STAGING_RUNTIME_ARTIFACT_ATTESTATION_FILE=${signed_files[0]}"
            echo "STAGING_RUNTIME_ARTIFACT_ATTESTATION_ARTIFACT_NAME=${artifact_name}"
          } >> "$GITHUB_ENV"

      - name: Verify signed Staging runtime artifact attestation and bind app image digest
        env:
          RELEASE_CUT_SHA: ${{ steps.identity.outputs.release_cut_sha }}
          RECOVERY_STAGING_CERTIFICATION_PUBLIC_KEY: ${{ vars.RECOVERY_STAGING_CERTIFICATION_PUBLIC_KEY }}
          RECOVERY_STAGING_CERTIFICATION_ISSUER: ${{ vars.RECOVERY_STAGING_CERTIFICATION_ISSUER }}
          RECOVERY_STAGING_CERTIFICATION_KEY_ID: ${{ vars.RECOVERY_STAGING_CERTIFICATION_KEY_ID }}
          ACTIVATION_GATEWAY_INGRESS_PUBLIC_KEY_SHA256: ${{ vars.ACTIVATION_GATEWAY_INGRESS_PUBLIC_KEY_SHA256 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import {
            loadStagingRuntimeArtifactAttestationTrust,
            verifyStagingRuntimeArtifactAttestation,
          } from "./http-generic-api/stagingRuntimeArtifactAttestation.js";

          const file = process.env.STAGING_RUNTIME_ARTIFACT_ATTESTATION_FILE;
          const artifactName =
            process.env.STAGING_RUNTIME_ARTIFACT_ATTESTATION_ARTIFACT_NAME;
          const expectedSha = process.env.RELEASE_CUT_SHA;
          const expectedTree = process.env.STAGING_CERT_EXPECTED_TREE;
          const expectedContext =
            process.env.STAGING_CERT_EXPECTED_CONTEXT_FILE_SET_SHA256;
          const policy = JSON.parse(
            fs.readFileSync(
              "edge/activation-gateway/generated/route-policy.staging.json",
              "utf8",
            ),
          );
          const expectedPolicyHash = String(
            policy.content_hash_sha256 || "",
          ).toLowerCase();

          if (
            !file ||
            !artifactName ||
            !/^[0-9a-f]{40}$/u.test(expectedSha || "") ||
            !/^[0-9a-f]{40}$/u.test(expectedTree || "") ||
            !/^[0-9a-f]{64}$/u.test(expectedContext || "") ||
            !/^[0-9a-f]{64}$/u.test(expectedPolicyHash)
          ) {
            throw new Error(
              "Runtime artifact attestation verification inputs are incomplete.",
            );
          }

          const record = JSON.parse(fs.readFileSync(file, "utf8"));
          const expectedArtifactName =
            `staging-runtime-artifact-attestation-${expectedSha}-${record?.payload_sha256 || ""}`;
          if (artifactName !== expectedArtifactName) {
            throw new Error(
              "Runtime artifact name disagrees with the signed payload binding.",
            );
          }

          const trust = loadStagingRuntimeArtifactAttestationTrust(process.env);
          const verified = verifyStagingRuntimeArtifactAttestation(record, {
            trust,
            expectedSha,
            expectedTree,
            expectedContextFileSetSha256: expectedContext,
            expectedPolicyHash,
          });

          const payload = verified.payload;
          const imageDigest = String(payload.app_image_digest || "").toLowerCase();
          if (
            !/^sha256:[0-9a-f]{64}$/u.test(imageDigest) ||
            payload.runtime_integrity_verified !== true ||
            payload.production_mutation_performed !== false ||
            payload.provider_mutation_performed !== false ||
            payload.database_mutation_performed !== false ||
            payload.secrets_included !== false
          ) {
            throw new Error(
              "Verified runtime artifact attestation crossed a safety or integrity boundary.",
            );
          }

          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `STAGING_CERT_APP_IMAGE_ID=${imageDigest}\n`,
          );
          NODE

      - name: Certify live Staging against exact main release cut
        env:
          STAGING_CERT_EXPECTED_COMMIT: ${{ steps.identity.outputs.release_cut_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$(dirname "$STAGING_CERT_REPORT_FILE")"
          node http-generic-api/scripts/staging-live-certification.mjs | tee "$STAGING_CERT_REPORT_FILE"
          jq -e --arg cut "$STAGING_CERT_EXPECTED_COMMIT" '
            .contract == "mad4b.staging-live-certification.v1" and
            .outcome == "ready" and .ready == true and
            .expected.branch == "main" and .expected.commit_sha == $cut and
            (.expected.activation_gateway_policy_hash | test("^[0-9a-f]{64}$")) and
            .observed.branch == "main" and .observed.commit_sha == $cut and
            .gateway.policy_source == "repository_profile" and
            .gateway.profile_validation.ok == true and
            .gateway.profile_validation.expected_policy_hash == .expected.activation_gateway_policy_hash and
            .artifact_set.complete == true and
            (.artifact_set.app.source_commit == $cut) and
            (.artifact_set.gateway.source_commit == $cut) and
            .blocking_failures == [] and .degraded_reasons == [] and
            .safety.read_only_probe == true and
            .safety.database_mutation == false and
            .safety.migration_apply == false and
            .safety.provider_mutation == false and
            .safety.production_deploy == false and
            .safety.ruleset_mutation == false and
            .safety.secrets_included == false
          ' "$STAGING_CERT_REPORT_FILE" >/dev/null

      - name: Publish bounded certification evidence
        shell: bash
        env:
          RELEASE_CUT_SHA: ${{ steps.identity.outputs.release_cut_sha }}
        run: |
          set -Eeuo pipefail
          output="$RUNNER_TEMP/staging-live-certification/evidence.json"
          mkdir -p "$(dirname "$output")"
          jq -n \
            --arg candidate "$EXPECTED_CANDIDATE_SHA" \
            --arg cut "$RELEASE_CUT_SHA" \
            --slurpfile authority "$STAGING_AUTHORITY_REPORT_FILE" \
            --slurpfile impact "$ENVIRONMENT_IMPACT_REPORT_FILE" \
            --slurpfile trust "$STAGING_TRUST_REPORT_FILE" \
            --slurpfile live "$STAGING_CERT_REPORT_FILE" \
            '{
              contract:"mad4b.staging-live-certification-evidence.v1",
              candidate_sha:$candidate,
              main_release_cut_sha:$cut,
              authority_closure:$authority[0],
              environment_impact_closure:$impact[0],
              trusted_ingress_runtime_binding:$trust[0],
              live_certification:$live[0],
              production_merge:false,
              deployment:false,
              migration_apply:false,
              grant_apply:false,
              provider_mutation:false,
              credential_payload_read:false,
              secrets_included:false
            }' > "$output"

      - name: Upload Staging live certification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-live-certification-${{ inputs.expected_candidate_sha }}
          path: ${{ runner.temp }}/staging-live-certification/evidence.json
          if-no-files-found: error
          retention-days: 30