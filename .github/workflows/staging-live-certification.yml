name: Staging Live Certification

on:
  workflow_dispatch:
    inputs:
      expected_candidate_sha:
        description: Exact immutable Production candidate SHA whose first parent is the main release cut
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-live-certification-${{ inputs.expected_candidate_sha }}
  cancel-in-progress: true

jobs:
  certify:
    name: Staging Live Certification
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      EXPECTED_CANDIDATE_SHA: ${{ inputs.expected_candidate_sha }}
      STAGING_CERT_APP_BASE_URL: https://dev.mad4b.com
      STAGING_CERT_EXPECTED_BRANCH: main
      STAGING_CERT_REQUIRE_GATEWAY: "true"
      STAGING_CERT_REQUIRE_GATEWAY_UPSTREAM: "true"
      STAGING_CERT_REQUIRE_READY: "true"
      STAGING_CERT_REPORT_FILE: .artifacts/staging-live-certification/report.json
      STAGING_AUTHORITY_REPORT_FILE: .artifacts/staging-environment-authority-closure/report.json
      ENVIRONMENT_IMPACT_REPORT_FILE: .artifacts/staging-environment-impact-closure/report.json
    steps:
      - name: Checkout exact immutable candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Resolve exact main release cut from certified candidate
        id: identity
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::expected_candidate_sha must be an exact lowercase SHA"; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_CANDIDATE_SHA" ]] || { echo "::error::workflow head differs from expected candidate"; exit 1; }
          parent_line="$(git rev-list --parents -n 1 HEAD)"
          parent_count=$(( $(wc -w <<<"$parent_line") - 1 ))
          [[ "$parent_count" -ge 1 ]] || { echo "::error::candidate has no release-cut parent"; exit 1; }
          release_cut_sha="$(git rev-parse HEAD^1)"
          [[ "$release_cut_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::release cut is not an exact SHA"; exit 1; }
          git diff --quiet "$release_cut_sha" HEAD || { echo "::error::candidate tree differs from its main release cut"; exit 1; }
          echo "release_cut_sha=$release_cut_sha" >> "$GITHUB_OUTPUT"

      - name: Verify repository environment authorities converge
        env:
          EXPECTED_HEAD_SHA: ${{ steps.identity.outputs.release_cut_sha }}
        run: >-
          node http-generic-api/scripts/staging-environment-authority-closure.mjs
          --expected-sha "$EXPECTED_HEAD_SHA"
          --report-file "$STAGING_AUTHORITY_REPORT_FILE"

      - name: Verify environment impact and migration compatibility closure
        env:
          EXPECTED_HEAD_SHA: ${{ steps.identity.outputs.release_cut_sha }}
        run: >-
          node http-generic-api/scripts/environment-impact-closure.mjs
          --head-sha "$EXPECTED_HEAD_SHA"
          --report-file "$ENVIRONMENT_IMPACT_REPORT_FILE"

      - name: Prepare exact Staging build-context provenance
        env:
          EXPECTED_HEAD_SHA: ${{ steps.identity.outputs.release_cut_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          node http-generic-api/scripts/prepare-staging-build-context.mjs \
            --repository-path . \
            --commit "$EXPECTED_HEAD_SHA" \
            --output-dir .staging-build-context
          expected_tree="$(git rev-parse "${EXPECTED_HEAD_SHA}^{tree}")"
          context_file_set="$(jq -er '.context_file_set_sha256' .staging-build-context/.staging-build-context.json)"
          [[ "$expected_tree" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::exact tree SHA missing"; exit 1; }
          [[ "$context_file_set" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::exact context file-set digest missing"; exit 1; }
          {
            echo "STAGING_CERT_EXPECTED_TREE=$expected_tree"
            echo "STAGING_CERT_EXPECTED_CONTEXT_FILE_SET_SHA256=$context_file_set"
          } >> "$GITHUB_ENV"

      - name: Verify live Staging recovery trust bridge
        env:
          EXPECTED_HEAD_SHA: ${{ steps.identity.outputs.release_cut_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          origin_health="$RUNNER_TEMP/staging-origin-health.json"
          gateway_ready="$RUNNER_TEMP/staging-gateway-ready.json"
          recovery_probe="$RUNNER_TEMP/staging-recovery-ingress-probe.json"
          expected_policy_hash="$(jq -er '.content_hash_sha256' edge/activation-gateway/generated/route-policy.staging.json)"
          [[ "$expected_policy_hash" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::repository Staging Gateway policy hash is invalid"; exit 1; }

          origin_status="$(curl --silent --show-error --max-time 15 --output "$origin_health" --write-out '%{http_code}' https://dev.mad4b.com/health)"
          [[ "$origin_status" == "200" ]] || { echo "::error::Staging origin health returned HTTP $origin_status"; cat "$origin_health"; exit 1; }
          jq -e --arg cut "$EXPECTED_HEAD_SHA" '
            .ok == true and
            .staging_recovery_trusted_ingress.contract == "mad4b.staging-recovery-trusted-ingress-health.v1" and
            .staging_recovery_trusted_ingress.environment == "staging" and
            .staging_recovery_trusted_ingress.ready == true and
            .staging_recovery_trusted_ingress.runtime_identity_ok == true and
            .staging_recovery_trusted_ingress.attestation_mode == "signature" and
            .staging_recovery_trusted_ingress.proxy_headers_enabled == true and
            .staging_recovery_trusted_ingress.caller_headers_stripped == true and
            .staging_recovery_trusted_ingress.signed_attestation_configured == true and
            .staging_recovery_trusted_ingress.canonical_host_exact == true and
            .staging_recovery_trusted_ingress.audience_exact == true and
            .staging_recovery_trusted_ingress.issuer_exact == true and
            .staging_recovery_trusted_ingress.key_id_configured == true and
            .staging_recovery_trusted_ingress.expected_deployment_sha == $cut and
            .staging_recovery_trusted_ingress.replay_directory_exact == true and
            .staging_recovery_trusted_ingress.secrets_included == false
          ' "$origin_health" >/dev/null || { echo "::error::Staging origin trusted-ingress runtime evidence is not exact"; cat "$origin_health"; exit 1; }

          gateway_status="$(curl --silent --show-error --max-time 15 --output "$gateway_ready" --write-out '%{http_code}' https://activation-dev.mad4b.com/ready)"
          [[ "$gateway_status" == "200" ]] || { echo "::error::Staging Activation Gateway ready returned HTTP $gateway_status"; cat "$gateway_ready"; exit 1; }
          jq -e --arg cut "$EXPECTED_HEAD_SHA" --arg policy "$expected_policy_hash" '
            .ok == true and .upstreamReady == true and .upstreamEvidenceVerified == true and
            .policyHash == $policy and .upstreamPolicyHash == $policy and .upstreamSourceCommit == $cut and
            .recoveryTrustedIngress.contract == "mad4b.staging.activation-recovery-origin-trust.v2" and
            .recoveryTrustedIngress.deployment_sha == $cut and
            .recoveryTrustedIngress.source_commit == $cut and
            .recoveryTrustedIngress.worker_build_sha == $cut and
            (.recoveryTrustedIngress.worker_bundle_sha256 | test("^[0-9a-f]{64}$")) and
            .recoveryTrustedIngress.policy_hash == $policy and
            .recoveryTrustedIngress.gateway_host == "activation-dev.mad4b.com" and
            .recoveryTrustedIngress.canonical_host == "activation-dev.mad4b.com" and
            .recoveryTrustedIngress.audience == "https://dev.mad4b.com" and
            .recoveryTrustedIngress.issuer == "https://activation-dev.mad4b.com" and
            (.recoveryTrustedIngress.key_id | test("^[A-Za-z0-9._:-]{16,128}$")) and
            (.recoveryTrustedIngress.public_key | startswith("-----BEGIN PUBLIC KEY-----")) and
            .recoveryTrustedIngress.trusted_ingress_mode == "signature" and
            .recoveryTrustedIngress.strip_caller_headers == true and
            .recoveryTrustedIngress.replay_store_scope == "single_filesystem" and
            .recoveryTrustedIngress.provider_credentials_included == false and
            .recoveryTrustedIngress.production_deploy == false and
            .recoveryTrustedIngress.database_mutation == false and
            .recoveryTrustedIngress.secrets_included == false
          ' "$gateway_ready" >/dev/null || { echo "::error::Staging Gateway trusted-ingress evidence is not exact"; cat "$gateway_ready"; exit 1; }

          request_id="staging-cert-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          probe_status="$(curl --silent --show-error --max-time 15 --header "x-request-id: $request_id" --output "$recovery_probe" --write-out '%{http_code}' https://activation-dev.mad4b.com/admin/recovery/staging/contract)"
          if [[ "$probe_status" == "401" ]]; then
            jq -e '.ok == false and .error.code == "missing_backend_api_key"' "$recovery_probe" >/dev/null || { echo "::error::signed Recovery probe did not reach the expected backend auth guard"; cat "$recovery_probe"; exit 1; }
          elif [[ "$probe_status" == "403" ]]; then
            jq -e '.ok == false and .error.code == "admin_backend_api_key_required"' "$recovery_probe" >/dev/null || { echo "::error::signed Recovery probe did not reach the expected admin auth guard"; cat "$recovery_probe"; exit 1; }
          else
            echo "::error::signed Recovery probe returned unexpected HTTP $probe_status"
            cat "$recovery_probe"
            exit 1
          fi

          public_key_delimiter="MAD4B_STAGING_PUBLIC_KEY_$(cat /proc/sys/kernel/random/uuid | tr '-' '_')"
          {
            echo "REMOTE_MCP_TRUSTED_INGRESS_MODE=signature"
            echo "REMOTE_MCP_TRUST_PROXY_HOST_HEADERS=true"
            echo "REMOTE_MCP_TRUSTED_INGRESS_STRIP_CALLER_HEADERS=true"
            echo "REMOTE_MCP_TRUSTED_INGRESS_KEY_ID=$(jq -er '.recoveryTrustedIngress.key_id' "$gateway_ready")"
            echo "REMOTE_MCP_TRUSTED_INGRESS_CANONICAL_HOST=activation-dev.mad4b.com"
            echo "REMOTE_MCP_TRUSTED_INGRESS_AUDIENCE=https://dev.mad4b.com"
            echo "REMOTE_MCP_TRUSTED_INGRESS_ISSUER=https://activation-dev.mad4b.com"
            echo "REMOTE_MCP_EXPECTED_DEPLOYMENT_SHA=$EXPECTED_HEAD_SHA"
            echo "RECOVERY_STAGING_INGRESS_REPLAY_DIRECTORY=/app/data/recovery-ingress"
            echo "REMOTE_MCP_TRUSTED_INGRESS_PUBLIC_KEY<<$public_key_delimiter"
            jq -er '.recoveryTrustedIngress.public_key' "$gateway_ready"
            echo "$public_key_delimiter"
          } >> "$GITHUB_ENV"

      - name: Certify live Staging against exact main release cut
        env:
          STAGING_CERT_EXPECTED_COMMIT: ${{ steps.identity.outputs.release_cut_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$(dirname "$STAGING_CERT_REPORT_FILE")"
          node http-generic-api/scripts/staging-live-certification.mjs | tee "$STAGING_CERT_REPORT_FILE"
          jq -e --arg cut "$STAGING_CERT_EXPECTED_COMMIT" '
            .contract == "mad4b.staging-live-certification.v1" and
            .outcome == "ready" and .ready == true and
            .expected.branch == "main" and .expected.commit_sha == $cut and
            (.expected.activation_gateway_policy_hash | test("^[0-9a-f]{64}$")) and
            .observed.branch == "main" and .observed.commit_sha == $cut and
            .gateway.policy_source == "repository_profile" and
            .gateway.profile_validation.ok == true and
            .gateway.profile_validation.expected_policy_hash == .expected.activation_gateway_policy_hash and
            .artifact_set.complete == true and
            (.artifact_set.app.source_commit == $cut) and
            (.artifact_set.gateway.source_commit == $cut) and
            .blocking_failures == [] and .degraded_reasons == [] and
            .safety.read_only_probe == true and
            .safety.database_mutation == false and
            .safety.migration_apply == false and
            .safety.provider_mutation == false and
            .safety.production_deploy == false and
            .safety.ruleset_mutation == false and
            .safety.secrets_included == false
          ' "$STAGING_CERT_REPORT_FILE" >/dev/null

      - name: Publish bounded certification evidence
        shell: bash
        env:
          RELEASE_CUT_SHA: ${{ steps.identity.outputs.release_cut_sha }}
        run: |
          set -Eeuo pipefail
          output="$RUNNER_TEMP/staging-live-certification/evidence.json"
          mkdir -p "$(dirname "$output")"
          jq -n \
            --arg candidate "$EXPECTED_CANDIDATE_SHA" \
            --arg cut "$RELEASE_CUT_SHA" \
            --slurpfile authority "$STAGING_AUTHORITY_REPORT_FILE" \
            --slurpfile impact "$ENVIRONMENT_IMPACT_REPORT_FILE" \
            --slurpfile live "$STAGING_CERT_REPORT_FILE" \
            '{
              contract:"mad4b.staging-live-certification-evidence.v1",
              candidate_sha:$candidate,
              main_release_cut_sha:$cut,
              authority_closure:$authority[0],
              environment_impact_closure:$impact[0],
              live_certification:$live[0],
              production_merge:false,
              deployment:false,
              migration_apply:false,
              grant_apply:false,
              provider_mutation:false,
              credential_payload_read:false,
              secrets_included:false
            }' > "$output"

      - name: Upload Staging live certification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-live-certification-${{ inputs.expected_candidate_sha }}
          path: ${{ runner.temp }}/staging-live-certification/evidence.json
          if-no-files-found: error
          retention-days: 30
