name: Spec 014 Authorized Dependency Generated Refresh Launcher

on:
  push:
    branches:
      - gpt/014-hostinger/authorized-dependency-injection-mount-readback-20260802
    paths:
      - '.github/workflows/spec014-authorized-dependency-generated-refresh-launcher.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: spec014-authorized-dependency-generated-refresh-launcher
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_REF: gpt/014-hostinger/authorized-dependency-injection-mount-readback-20260802
      LAUNCHER_PATH: .github/workflows/spec014-authorized-dependency-generated-refresh-launcher.yml
      OUTPUT_DIR: .ci-evidence/spec014-authorized-dependency-generated-refresh
    steps:
      - name: Validate exact work-branch identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" == "${TARGET_REF}" ]]
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${TARGET_REF}" != "main" ]]
          [[ "${TARGET_REF}" != "Production" ]]

      - name: Checkout exact launcher head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Apply registered generated-artifact refresh
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/maintenance-tools/generated-artifact-refresh.mjs \
            --target-ref "${TARGET_REF}" \
            --expected-head-sha "${GITHUB_SHA}" \
            --confirmation APPLY_GENERATED_ARTIFACT_REFRESH \
            --output-dir "${OUTPUT_DIR}"
          jq -e '.outcome == "passed"' "${OUTPUT_DIR}/generated-artifact-refresh-report.json" >/dev/null

      - name: Remove launcher from resulting exact head
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/${TARGET_REF}" | awk '{print $1}')"
          local_sha="$(git rev-parse HEAD)"
          [[ "$remote_sha" == "$local_sha" ]]
          git rm -- "${LAUNCHER_PATH}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(ci): remove generated refresh launcher'
          final_sha="$(git rev-parse HEAD)"
          remote_before_push="$(git ls-remote origin "refs/heads/${TARGET_REF}" | awk '{print $1}')"
          [[ "$remote_before_push" == "$remote_sha" ]]
          git push origin "HEAD:${TARGET_REF}"
          jq -cn \
            --arg contract 'mad4b.spec014-authorized-dependency-generated-refresh-launcher.v1' \
            --arg target_ref "${TARGET_REF}" \
            --arg source_sha "${GITHUB_SHA}" \
            --arg generated_sha "$remote_sha" \
            --arg final_sha "$final_sha" \
            '{contract:$contract,outcome:"passed",target_ref:$target_ref,source_sha:$source_sha,generated_sha:$generated_sha,final_sha:$final_sha,launcher_removed:true,force_push:false,protected_branch_mutation:false,secrets_included:false}' \
            > "${OUTPUT_DIR}/launcher-summary.json"

      - name: Upload canonical launcher report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec014-authorized-dependency-generated-refresh-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: error
          retention-days: 30
