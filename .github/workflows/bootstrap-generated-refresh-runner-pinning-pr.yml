name: Bootstrap Generated Refresh Runner Pinning PR

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/bootstrap-generated-refresh-runner-pinning.yml
      - .github/workflows/bootstrap-generated-refresh-runner-pinning-pr.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-generated-refresh-runner-pinning-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/ci/generated-refresh-runner-pinning-20260804'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      SOURCE_BOOTSTRAP: .github/workflows/bootstrap-generated-refresh-runner-pinning.yml
      PR_BOOTSTRAP: .github/workflows/bootstrap-generated-refresh-runner-pinning-pr.yml
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Merge fetched main snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags origin main
          base_sha="$(git rev-parse origin/main)"
          test -n "${base_sha}"
          printf 'EXPECTED_BASE_SHA=%s\n' "${base_sha}" >> "${GITHUB_ENV}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit "${base_sha}"

      - name: Verify exact bootstrap-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "${EXPECTED_BASE_SHA}" HEAD)" = "${EXPECTED_BASE_SHA}"
          git diff --name-only "${EXPECTED_BASE_SHA}"...HEAD | sort > "${RUNNER_TEMP}/bootstrap-files.txt"
          cat > "${RUNNER_TEMP}/expected-bootstrap-files.txt" <<'EOF'
          .github/workflows/bootstrap-generated-refresh-runner-pinning-pr.yml
          .github/workflows/bootstrap-generated-refresh-runner-pinning.yml
          EOF
          diff -u "${RUNNER_TEMP}/expected-bootstrap-files.txt" "${RUNNER_TEMP}/bootstrap-files.txt"

      - name: Execute bounded embedded patch and remove bootstraps
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/bootstrap-generated-refresh-runner-pinning.yml')
          lines = source.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python <<'PY'")
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          yaml_prefix = '          '
          body = lines[start + 1:end]
          invalid = [
              (offset, line)
              for offset, line in enumerate(body, start=start + 2)
              if line and not line.startswith(yaml_prefix)
          ]
          if invalid:
              line_number, line = invalid[0]
              raise SystemExit(f'embedded bootstrap indentation mismatch at line {line_number}: {line!r}')
          code = '\n'.join(line[len(yaml_prefix):] if line else '' for line in body)
          old_count_guard = "    if text.count(old) != 1:\n"
          new_count_guard = (
              "    expected_count = 2 if path == Path('.github/workflows/pr-generated-artifact-refresh.yml') else 1\n"
              "    if text.count(old) != expected_count:\n"
          )
          old_error = "raise SystemExit(f'{path}: expected exactly one {old!r}, found {text.count(old)}')"
          new_error = "raise SystemExit(f'{path}: expected {expected_count} occurrences of {old!r}, found {text.count(old)}')"
          if code.count(old_count_guard) != 1 or code.count(old_error) != 1:
              raise SystemExit('embedded runner-count contract anchor mismatch')
          code = code.replace(old_count_guard, new_count_guard, 1).replace(old_error, new_error, 1)
          cleanup_anchor = "if test_text.count(assertion_anchor) != 1:\n"
          cleanup_insert = "assertion_insert = assertion_insert.rstrip() + '\\n\\n'\n"
          if code.count(cleanup_anchor) != 1:
              raise SystemExit('embedded assertion cleanup anchor mismatch')
          code = code.replace(cleanup_anchor, cleanup_insert + cleanup_anchor, 1)
          exec(compile(code, str(source), 'exec'), {'__name__': '__main__'})
          Path('.github/workflows/bootstrap-generated-refresh-runner-pinning-pr.yml').unlink()
          PY

      - name: Verify bounded patch and focused regression
        shell: bash
        run: |
          set -uo pipefail
          fail_phase() {
            local status="$1"
            local phase="$2"
            echo "::error::PHASE_FAILED:${phase}:exit=${status}"
            git status --short
            git diff --name-status "${EXPECTED_BASE_SHA}"
            exit "${status}"
          }
          node --check http-generic-api/test-governed-generated-artifact-refresh-pr-target-bridge.mjs || fail_phase "$?" "node-check"
          (cd http-generic-api && node test-governed-generated-artifact-refresh-pr-target-bridge.mjs) || fail_phase "$?" "focused-regression"
          git add -N .changes/e2e/governed-generated-artifact-refresh-runner-pinning.json || fail_phase "$?" "register-new-contract"
          git diff --check "${EXPECTED_BASE_SHA}" || fail_phase "$?" "diff-check"
          git diff --name-only "${EXPECTED_BASE_SHA}" | sort > "${RUNNER_TEMP}/actual-files.txt" || fail_phase "$?" "changed-files"
          cat > "${RUNNER_TEMP}/expected-files.txt" <<'EOF'
          .changes/e2e/governed-generated-artifact-refresh-runner-pinning.json
          .github/workflows/governed-generated-artifact-refresh-dispatch-v2.yml
          .github/workflows/governed-generated-artifact-refresh-pr-target-bridge-v2.yml
          .github/workflows/governed-generated-artifact-refresh-request-dispatcher.yml
          .github/workflows/governed-generated-artifact-refresh.yml
          .github/workflows/pr-generated-artifact-refresh.yml
          http-generic-api/test-governed-generated-artifact-refresh-pr-target-bridge.mjs
          EOF
          diff -u "${RUNNER_TEMP}/expected-files.txt" "${RUNNER_TEMP}/actual-files.txt" || fail_phase "$?" "bounded-file-list"

      - name: Build detached bounded commit objects
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          metadata_dir="runner-pinning-metadata"
          mkdir -p "${metadata_dir}"
          log_path="${metadata_dir}/object-build.log"
          exec > >(tee -a "${log_path}") 2>&1

          fail_object_phase() {
            local phase="$1"
            local status="${2:-1}"
            printf '%s\n' "${phase}" > "${metadata_dir}/failure-phase.txt"
            echo "::error::OBJECT_PHASE_FAILED:${phase}:exit=${status}"
            exit "${status}"
          }

          base_tree="$(git rev-parse "${EXPECTED_BASE_SHA}^{tree}")" || fail_object_phase "base-tree"
          printf '%s\n' "${EXPECTED_BASE_SHA}" > "${metadata_dir}/base-commit-sha.txt"
          printf '%s\n' "${base_tree}" > "${metadata_dir}/base-tree-sha.txt"
          tree_elements="${RUNNER_TEMP}/tree-elements.json"
          printf '[]\n' > "${tree_elements}"
          cat > "${RUNNER_TEMP}/bounded-files.txt" <<'EOF'
          .changes/e2e/governed-generated-artifact-refresh-runner-pinning.json
          .github/workflows/governed-generated-artifact-refresh-dispatch-v2.yml
          .github/workflows/governed-generated-artifact-refresh-pr-target-bridge-v2.yml
          .github/workflows/governed-generated-artifact-refresh-request-dispatcher.yml
          .github/workflows/governed-generated-artifact-refresh.yml
          .github/workflows/pr-generated-artifact-refresh.yml
          http-generic-api/test-governed-generated-artifact-refresh-pr-target-bridge.mjs
          EOF

          while IFS= read -r path; do
            phase="blob:${path}"
            echo "OBJECT_PHASE_START:${phase}"
            expected_blob="$(git hash-object "${path}")" || fail_object_phase "${phase}:local-hash"
            payload="${RUNNER_TEMP}/blob-payload.json"
            response="${RUNNER_TEMP}/blob-response.json"
            error_file="${RUNNER_TEMP}/blob-error.txt"
            jq -n --rawfile content "${path}" '{content:$content,encoding:"utf-8"}' > "${payload}" || fail_object_phase "${phase}:payload"
            if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input "${payload}" > "${response}" 2> "${error_file}"; then
              cat "${error_file}"
              cat "${response}" || true
              fail_object_phase "${phase}:api"
            fi
            cat "${error_file}" || true
            cat "${response}"
            blob_sha="$(jq -r '.sha // empty' "${response}")" || fail_object_phase "${phase}:response"
            test -n "${blob_sha}" || fail_object_phase "${phase}:missing-sha"
            test "${blob_sha}" = "${expected_blob}" || fail_object_phase "${phase}:sha-mismatch"
            jq --arg path "${path}" --arg sha "${blob_sha}" '. + [{path:$path,mode:"100644",type:"blob",sha:$sha}]' "${tree_elements}" > "${tree_elements}.next" || fail_object_phase "${phase}:tree-entry"
            mv "${tree_elements}.next" "${tree_elements}" || fail_object_phase "${phase}:tree-entry-move"
            echo "OBJECT_PHASE_SUCCESS:${phase}:${blob_sha}"
          done < "${RUNNER_TEMP}/bounded-files.txt"

          cp "${tree_elements}" "${metadata_dir}/tree-elements.json"
          tree_payload="${RUNNER_TEMP}/tree-payload.json"
          tree_response="${RUNNER_TEMP}/tree-response.json"
          tree_error="${RUNNER_TEMP}/tree-error.txt"
          jq -n --arg base_tree "${base_tree}" --slurpfile tree "${tree_elements}" '{base_tree:$base_tree,tree:$tree[0]}' > "${tree_payload}" || fail_object_phase "tree:payload"
          echo "OBJECT_PHASE_START:tree"
          if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input "${tree_payload}" > "${tree_response}" 2> "${tree_error}"; then
            cat "${tree_error}"
            cat "${tree_response}" || true
            fail_object_phase "tree:api"
          fi
          cat "${tree_error}" || true
          cat "${tree_response}"
          tree_sha="$(jq -r '.sha // empty' "${tree_response}")" || fail_object_phase "tree:response"
          test -n "${tree_sha}" || fail_object_phase "tree:missing-sha"
          printf '%s\n' "${tree_sha}" > "${metadata_dir}/detached-tree-sha.txt"
          echo "OBJECT_PHASE_SUCCESS:tree:${tree_sha}"

          commit_payload="${RUNNER_TEMP}/commit-payload.json"
          commit_response="${RUNNER_TEMP}/commit-response.json"
          commit_error="${RUNNER_TEMP}/commit-error.txt"
          jq -n --arg message 'fix(ci): pin generated refresh chain runners' --arg tree "${tree_sha}" --arg parent "${EXPECTED_BASE_SHA}" '{message:$message,tree:$tree,parents:[$parent]}' > "${commit_payload}" || fail_object_phase "commit:payload"
          echo "OBJECT_PHASE_START:commit"
          if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input "${commit_payload}" > "${commit_response}" 2> "${commit_error}"; then
            cat "${commit_error}"
            cat "${commit_response}" || true
            fail_object_phase "commit:api"
          fi
          cat "${commit_error}" || true
          cat "${commit_response}"
          commit_sha="$(jq -r '.sha // empty' "${commit_response}")" || fail_object_phase "commit:response"
          test -n "${commit_sha}" || fail_object_phase "commit:missing-sha"
          printf '%s\n' "${commit_sha}" > "${metadata_dir}/detached-commit-sha.txt"
          echo "OBJECT_PHASE_SUCCESS:commit:${commit_sha}"

      - name: Export exact bounded patch and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-refresh-runner-pinning-${{ github.event.pull_request.number }}-${{ github.run_id }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          path: |
            .changes/e2e/governed-generated-artifact-refresh-runner-pinning.json
            .github/workflows/governed-generated-artifact-refresh-dispatch-v2.yml
            .github/workflows/governed-generated-artifact-refresh-pr-target-bridge-v2.yml
            .github/workflows/governed-generated-artifact-refresh-request-dispatcher.yml
            .github/workflows/governed-generated-artifact-refresh.yml
            .github/workflows/pr-generated-artifact-refresh.yml
            http-generic-api/test-governed-generated-artifact-refresh-pr-target-bridge.mjs
            runner-pinning-metadata
