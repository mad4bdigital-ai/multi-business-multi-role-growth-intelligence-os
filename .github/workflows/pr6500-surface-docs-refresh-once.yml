name: PR 6500 Surface Documentation Refresh Once

on:
  push:
    branches:
      - fix/transport-response-schema-promotion-readiness-20260806
    paths:
      - .github/ops/pr6500-surface-docs-refresh.trigger

permissions:
  contents: write

concurrency:
  group: pr6500-surface-docs-refresh-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_BRANCH: fix/transport-response-schema-promotion-readiness-20260806
      EXPECTED_MAIN_SHA: 10568a9e88bb7ecd896098cfee10bd639483029b
      WORKFLOW_PATH: .github/workflows/pr6500-surface-docs-refresh-once.yml
      TRIGGER_PATH: .github/ops/pr6500-surface-docs-refresh.trigger
      MIGRATION_FILE: 1048_transport_response_chunk_schema_recovery.sql
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Verify exact branch and pinned main
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          remote_head="$(git ls-remote origin "refs/heads/${EXPECTED_BRANCH}" | awk '{print $1}')"
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "${remote_head}" = "${GITHUB_SHA}"
          test "${remote_main}" = "${EXPECTED_MAIN_SHA}"
          test -f "${WORKFLOW_PATH}"
          test -f "${TRIGGER_PATH}"

      - name: Install connector dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Add bounded Migration 1048 documentation references
        shell: bash
        run: |
          set -euo pipefail
          files=(
            "Updating Registry Patch Index.md"
            "deployment_parity_checklist.md"
            "docs/ai-docs-agent-governance.md"
            "docs/auto-docs-agent/README.md"
            "docs/change-documentation-governance.md"
          )
          for file in "${files[@]}"; do
            test -f "${file}"
            if ! grep -Fq "${MIGRATION_FILE}" "${file}"; then
              cat >> "${file}" <<'EOF'

### Migration 1048 transport response chunk schema recovery

- Repository contract: `1048_transport_response_chunk_schema_recovery.sql` restores the durable governed response-chunk transport schema additively and idempotently.
- Safety boundary: repository documentation/readiness only; no provider call, credential read, external send/write, secret payload, deployment, or database Apply is authorized by this documentation entry.
- Production dependency: any Apply or promotion remains separately governed and requires checksum-bound preflight plus same-cycle schema readback.
EOF
            fi
            grep -Fq "${MIGRATION_FILE}" "${file}"
          done

      - name: Retire temporary writer before deterministic generation
        shell: bash
        run: |
          set -euo pipefail
          git rm "${WORKFLOW_PATH}" "${TRIGGER_PATH}"

      - name: Regenerate canonical Surface Contract and Work Maps
        shell: bash
        run: |
          set -euo pipefail
          (
            cd http-generic-api
            node scripts/surface-contract-discovery.mjs --write
            node scripts/surface-contract-discovery.mjs --check
          )
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          node http-generic-api/scripts/platform-work-map-generator.mjs --check

      - name: Enforce bounded generated diff and contract closure
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --cached --check
          {
            git diff --name-only
            git diff --cached --name-only
          } | sed '/^$/d' | sort -u > /tmp/actual.txt

          cat > /tmp/allowed.txt <<'EOF'
.github/ops/pr6500-surface-docs-refresh.trigger
.github/workflows/pr6500-surface-docs-refresh-once.yml
Updating Registry Patch Index.md
deployment_parity_checklist.md
docs/ai-docs-agent-governance.md
docs/auto-docs-agent/README.md
docs/change-documentation-governance.md
docs/surface-contract-discovery-status.md
docs/surface-contract-discovery-status.json
docs/surface-contract-gap-queue.md
docs/surface-contract-gap-queue.json
docs/work-maps/README.md
docs/work-maps/data-model-domain-map.md
docs/work-maps/observability-release-map.md
docs/work-maps/work-map-coverage-matrix.md
EOF
          unexpected="$(comm -23 /tmp/actual.txt <(sort /tmp/allowed.txt) || true)"
          if [[ -n "${unexpected}" ]]; then
            echo "Unexpected changed files:"
            printf '%s\n' "${unexpected}"
            exit 1
          fi

          required=(
            ".github/ops/pr6500-surface-docs-refresh.trigger"
            ".github/workflows/pr6500-surface-docs-refresh-once.yml"
            "Updating Registry Patch Index.md"
            "deployment_parity_checklist.md"
            "docs/ai-docs-agent-governance.md"
            "docs/auto-docs-agent/README.md"
            "docs/change-documentation-governance.md"
            "docs/surface-contract-discovery-status.md"
            "docs/surface-contract-discovery-status.json"
            "docs/surface-contract-gap-queue.md"
            "docs/surface-contract-gap-queue.json"
          )
          for file in "${required[@]}"; do
            grep -Fxq "${file}" /tmp/actual.txt || { echo "Required change missing: ${file}"; exit 1; }
          done

          for file in \
            "Updating Registry Patch Index.md" \
            "deployment_parity_checklist.md" \
            "docs/ai-docs-agent-governance.md" \
            "docs/auto-docs-agent/README.md" \
            "docs/change-documentation-governance.md"; do
            grep -Fq "${MIGRATION_FILE}" "${file}"
          done
          if grep -Fq '"migration_file": "1048_transport_response_chunk_schema_recovery.sql"' docs/surface-contract-gap-queue.json; then
            echo "Migration 1048 remains in Surface Contract Gap Queue."
            exit 1
          fi

      - name: Run focused exact-head governance checks
        shell: bash
        run: |
          set -euo pipefail
          (
            cd http-generic-api
            node scripts/surface-contract-discovery.mjs --check
            node test-transport-response-chunk-schema-recovery.mjs
            node test-work-map-schema-classification.mjs
            node test-work-map-schema-classification-contract.mjs
            node test-work-map-autofix-diagnostics.mjs
            node test-spec-kit-work-map-governance-gate.mjs
            node test-spec-kit-completion-gate.mjs
          )
          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          node http-generic-api/scripts/spec-kit-work-map-governance-gate.mjs --ci --changed

      - name: Commit and push bounded refresh
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${EXPECTED_BRANCH}" | awk '{print $1}')"
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "${remote_head}" = "${GITHUB_SHA}"
          test "${remote_main}" = "${EXPECTED_MAIN_SHA}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "Updating Registry Patch Index.md" \
            "deployment_parity_checklist.md" \
            "docs/ai-docs-agent-governance.md" \
            "docs/auto-docs-agent/README.md" \
            "docs/change-documentation-governance.md" \
            docs/surface-contract-discovery-status.md \
            docs/surface-contract-discovery-status.json \
            docs/surface-contract-gap-queue.md \
            docs/surface-contract-gap-queue.json \
            docs/work-maps/README.md \
            docs/work-maps/data-model-domain-map.md \
            docs/work-maps/observability-release-map.md \
            docs/work-maps/work-map-coverage-matrix.md

          git diff --cached --name-only | sort -u > /tmp/staged.txt
          unexpected="$(comm -23 /tmp/staged.txt <(sort /tmp/allowed.txt) || true)"
          if [[ -n "${unexpected}" ]]; then
            echo "Unexpected staged files:"
            printf '%s\n' "${unexpected}"
            exit 1
          fi
          for file in \
            ".github/ops/pr6500-surface-docs-refresh.trigger" \
            ".github/workflows/pr6500-surface-docs-refresh-once.yml" \
            "Updating Registry Patch Index.md" \
            "deployment_parity_checklist.md" \
            "docs/ai-docs-agent-governance.md" \
            "docs/auto-docs-agent/README.md" \
            "docs/change-documentation-governance.md" \
            "docs/surface-contract-discovery-status.md" \
            "docs/surface-contract-discovery-status.json" \
            "docs/surface-contract-gap-queue.md" \
            "docs/surface-contract-gap-queue.json"; do
            grep -Fxq "${file}" /tmp/staged.txt || { echo "Required staged change missing: ${file}"; exit 1; }
          done
          git diff --cached --check
          git commit -m "docs(transport): close Migration 1048 surface documentation gap"
          git push origin "HEAD:${EXPECTED_BRANCH}"
