name: Patch Spec 014 Tenant repository provenance

on:
  push:
    branches:
      - gpt/014-hostinger/tenant-canary-postmerge-hardening-20260801
    paths:
      - .github/workflows/spec014-tenant-repository-provenance-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gpt/014-hostinger/tenant-canary-postmerge-hardening-20260801
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply exact repository provenance hardening
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          function patch(path, replacements) {
            let source = fs.readFileSync(path, 'utf8');
            for (const [before, after] of replacements) {
              if (!source.includes(before)) {
                throw new Error(`Expected patch anchor not found in ${path}: ${before.slice(0, 120)}`);
              }
              source = source.replace(before, after);
            }
            fs.writeFileSync(path, source);
          }

          patch('http-generic-api/hostingerStorageTenantCanary.js', [
            [
              "import { createHostingerStorageSyntheticAdapter } from './hostingerStorageSyntheticAdapter.js';\n",
              "import { createHostingerStorageSyntheticAdapter } from './hostingerStorageSyntheticAdapter.js';\nimport {\n  createHostingerStorageControlPlaneRepository,\n  createMemoryHostingerStoragePersistenceAdapter,\n} from './hostingerStorageControlPlaneRepository.js';\n",
            ],
            [
              "const CANONICAL_ADAPTER_VERSION = 'spec014-hostinger-storage-synthetic-adapter-v1';\nconst tenantCanaryAdapters = new WeakSet();\n",
              "const CANONICAL_ADAPTER_VERSION = 'spec014-hostinger-storage-synthetic-adapter-v1';\nconst CANONICAL_REPOSITORY_VERSION = 'spec014-storage-control-plane-repository-v1';\nconst CANONICAL_REPOSITORY_ADAPTER_KEY = 'hostinger_storage_memory_test_adapter_v1';\nconst tenantCanaryAdapters = new WeakSet();\nconst tenantCanaryRepositories = new WeakSet();\n",
            ],
            [
              "export function createHostingerStorageTenantCanarySyntheticAdapter(options = {}) {\n  const adapter = createHostingerStorageSyntheticAdapter(options);\n  tenantCanaryAdapters.add(adapter);\n  return adapter;\n}\n",
              "export function createHostingerStorageTenantCanarySyntheticAdapter(options = {}) {\n  const adapter = createHostingerStorageSyntheticAdapter(options);\n  tenantCanaryAdapters.add(adapter);\n  return adapter;\n}\n\nexport function createHostingerStorageTenantCanaryControlPlaneRepository({ snapshot = null } = {}) {\n  const persistence = createMemoryHostingerStoragePersistenceAdapter({ snapshot });\n  const repository = createHostingerStorageControlPlaneRepository({ adapter: persistence });\n  tenantCanaryRepositories.add(repository);\n  return repository;\n}\n",
            ],
            [
              "function requireCompleteRepository(repository) {\n  const missing = REQUIRED_REPOSITORY_METHODS.filter((method) => typeof repository?.[method] !== 'function');\n  if (!repository || repository.production_ready === true || missing.length) {\n    throw fail(409, 'STORAGE_TENANT_CANARY_CONTROL_PLANE_INVALID', 'Tenant canary requires the complete non-production governed repository contract.', {\n      required_methods: REQUIRED_REPOSITORY_METHODS,\n      missing_methods: missing,\n    });\n  }\n}\n",
              "function requireCanonicalRepository(repository) {\n  const missing = REQUIRED_REPOSITORY_METHODS.filter((method) => typeof repository?.[method] !== 'function');\n  if (!repository\n    || !tenantCanaryRepositories.has(repository)\n    || !Object.isFrozen(repository)\n    || repository.repository_version !== CANONICAL_REPOSITORY_VERSION\n    || repository.adapter_key !== CANONICAL_REPOSITORY_ADAPTER_KEY\n    || repository.production_ready !== false\n    || missing.length) {\n    throw fail(409, 'STORAGE_TENANT_CANARY_CONTROL_PLANE_INVALID', 'Tenant canary requires a repository created by the Tenant-owned in-memory control-plane factory.', {\n      repository_provenance: 'tenant_factory_owned_required',\n      expected_repository_version: CANONICAL_REPOSITORY_VERSION,\n      expected_adapter_key: CANONICAL_REPOSITORY_ADAPTER_KEY,\n      required_methods: REQUIRED_REPOSITORY_METHODS,\n      missing_methods: missing,\n    });\n  }\n}\n",
            ],
            [
              "  requireCompleteRepository(options.repository);\n",
              "  requireCanonicalRepository(options.repository);\n",
            ],
          ]);

          patch('http-generic-api/test-hostinger-storage-tenant-canary.mjs', [
            [
              "  createHostingerStorageTenantCanarySyntheticAdapter,\n",
              "  createHostingerStorageTenantCanaryControlPlaneRepository,\n  createHostingerStorageTenantCanarySyntheticAdapter,\n",
            ],
            [
              "  return {\n    ...fixture,\n    adapter: createHostingerStorageTenantCanarySyntheticAdapter({ items }),\n  };\n",
              "  return {\n    ...fixture,\n    repository: createHostingerStorageTenantCanaryControlPlaneRepository({ snapshot: fixture.repository.exportSnapshot() }),\n    adapter: createHostingerStorageTenantCanarySyntheticAdapter({ items }),\n  };\n",
            ],
            [
              "assert.equal(verified.valid, true);\n",
              "assert.equal(verified.valid, true);\nassert.equal(Object.isFrozen(verified.blockers), true);\n",
            ],
          ]);

          patch('http-generic-api/test-hostinger-storage-tenant-canary-postmerge-hardening.mjs', [
            [
              "  createHostingerStorageTenantCanarySyntheticAdapter,\n",
              "  createHostingerStorageTenantCanaryControlPlaneRepository,\n  createHostingerStorageTenantCanarySyntheticAdapter,\n",
            ],
            [
              "  createSyntheticExecutorFixture as createBaseSyntheticExecutorFixture,\n  h,\n",
              "  createSyntheticExecutorFixture as createBaseSyntheticExecutorFixture,\n  digest,\n  h,\n",
            ],
            [
              "  return {\n    ...fixture,\n    adapter: createHostingerStorageTenantCanarySyntheticAdapter({ items }),\n  };\n",
              "  return {\n    ...fixture,\n    repository: createHostingerStorageTenantCanaryControlPlaneRepository({ snapshot: fixture.repository.exportSnapshot() }),\n    adapter: createHostingerStorageTenantCanarySyntheticAdapter({ items }),\n  };\n",
            ],
            [
              "assertUnconsumedAndUnchanged(incompleteRepositoryFixture, incompleteRepositoryPrepared.registry);\n\nconst stalePlanFixture",
              "assertUnconsumedAndUnchanged(incompleteRepositoryFixture, incompleteRepositoryPrepared.registry);\n\nconst spoofedRepositoryFixture = createSyntheticExecutorFixture({\n  run_id: 'tenant-canary-spoofed-repository-run',\n  operation_id: 'tenant-canary-spoofed-repository-operation',\n  plan_id: 'tenant-canary-spoofed-repository-plan',\n  target_id: 'tenant-canary-spoofed-repository-target',\n});\nconst spoofedRepositoryAuthorization = buildAuthorization(spoofedRepositoryFixture);\nconst spoofedRepositoryPrepared = prepare(spoofedRepositoryFixture, spoofedRepositoryAuthorization);\nconst spoofedRepository = Object.freeze({\n  repository_version: 'spec014-storage-control-plane-repository-v1',\n  adapter_key: 'hostinger_storage_memory_test_adapter_v1',\n  production_ready: false,\n  readAggregate: (...args) => spoofedRepositoryFixture.repository.readAggregate(...args),\n  transitionOperation: (...args) => spoofedRepositoryFixture.repository.transitionOperation(...args),\n  consumePlan: (...args) => spoofedRepositoryFixture.repository.consumePlan(...args),\n  appendJournalEvent: (...args) => spoofedRepositoryFixture.repository.appendJournalEvent(...args),\n  recordReconciliation: (...args) => spoofedRepositoryFixture.repository.recordReconciliation(...args),\n});\nassert.throws(\n  () => execute({\n    fixture: spoofedRepositoryFixture,\n    authorization: spoofedRepositoryAuthorization,\n    ...spoofedRepositoryPrepared,\n    repository: spoofedRepository,\n  }),\n  (error) => error.code === 'STORAGE_TENANT_CANARY_CONTROL_PLANE_INVALID'\n    && error.details?.repository_provenance === 'tenant_factory_owned_required',\n);\nassertUnconsumedAndUnchanged(spoofedRepositoryFixture, spoofedRepositoryPrepared.registry);\n\nconst stalePlanFixture",
            ],
            [
              "const stalePlanRepository = {\n  production_ready: false,\n  readAggregate: (...args) => {\n    const aggregate = stalePlanFixture.repository.readAggregate(...args);\n    return {\n      ...aggregate,\n      plans: aggregate.plans.map((plan) => plan.plan_id === stalePlanFixture.plan_id ? {\n        ...plan,\n        authority_context_hash: h('f'),\n        ownership_revision: 'ownership-stale',\n        policy_revision: 'policy-stale',\n      } : plan),\n    };\n  },\n  transitionOperation: (...args) => stalePlanFixture.repository.transitionOperation(...args),\n  consumePlan: (...args) => stalePlanFixture.repository.consumePlan(...args),\n  appendJournalEvent: (...args) => stalePlanFixture.repository.appendJournalEvent(...args),\n  recordReconciliation: (...args) => stalePlanFixture.repository.recordReconciliation(...args),\n};\n",
              "const stalePlanSnapshot = structuredClone(stalePlanFixture.repository.exportSnapshot());\nconst stalePlanRecord = stalePlanSnapshot.state.plans[stalePlanFixture.plan_id];\ndelete stalePlanRecord.record_digest;\nstalePlanRecord.authority_context_hash = h('f');\nstalePlanRecord.ownership_revision = 'ownership-stale';\nstalePlanRecord.policy_revision = 'policy-stale';\nstalePlanRecord.record_digest = digest(stalePlanRecord);\nstalePlanSnapshot.state_digest = digest(stalePlanSnapshot.state);\nconst stalePlanRepository = createHostingerStorageTenantCanaryControlPlaneRepository({ snapshot: stalePlanSnapshot });\n",
            ],
            [
              "  tenant_owned_factory_weakset_brand_required: true,\n",
              "  tenant_owned_factory_weakset_brand_required: true,\n  tenant_owned_repository_weakset_brand_required: true,\n  frozen_repository_method_copy_rejected: true,\n",
            ],
          ]);

          patch('.github/workflows/hostinger-storage-tenant-canary-guard.yml', [
            [
              "          grep -q \"createHostingerStorageTenantCanarySyntheticAdapter\" http-generic-api/hostingerStorageTenantCanary.js\n",
              "          grep -q \"createHostingerStorageTenantCanarySyntheticAdapter\" http-generic-api/hostingerStorageTenantCanary.js\n          grep -q \"createHostingerStorageTenantCanaryControlPlaneRepository\" http-generic-api/hostingerStorageTenantCanary.js\n          grep -q \"tenantCanaryRepositories.add(repository)\" http-generic-api/hostingerStorageTenantCanary.js\n          grep -q \"tenantCanaryRepositories.has(repository)\" http-generic-api/hostingerStorageTenantCanary.js\n          grep -q \"spec014-storage-control-plane-repository-v1\" http-generic-api/hostingerStorageTenantCanary.js\n          grep -q \"hostinger_storage_memory_test_adapter_v1\" http-generic-api/hostingerStorageTenantCanary.js\n",
            ],
            [
              "          grep -q \"createHostingerStorageTenantCanarySyntheticAdapter\" http-generic-api/test-hostinger-storage-tenant-canary.mjs\n",
              "          grep -q \"createHostingerStorageTenantCanarySyntheticAdapter\" http-generic-api/test-hostinger-storage-tenant-canary.mjs\n          grep -q \"createHostingerStorageTenantCanaryControlPlaneRepository\" http-generic-api/test-hostinger-storage-tenant-canary.mjs\n          grep -q \"createHostingerStorageTenantCanaryControlPlaneRepository\" http-generic-api/test-hostinger-storage-tenant-canary-postmerge-hardening.mjs\n          grep -q \"tenant_factory_owned_required\" http-generic-api/test-hostinger-storage-tenant-canary-postmerge-hardening.mjs\n          grep -q \"Object.isFrozen(verified.blockers)\" http-generic-api/test-hostinger-storage-tenant-canary.mjs\n",
            ],
            [
              "          const repository = wrapper.indexOf('requireCompleteRepository(options.repository);');\n",
              "          const repository = wrapper.indexOf('requireCanonicalRepository(options.repository);');\n",
            ],
            [
              "            throw new Error('Repository, Tenant-owned adapter brand, and plan authority preflight must complete before delegated execution.');\n",
              "            throw new Error('Tenant-owned repository brand, adapter brand, and plan authority preflight must complete before delegated execution.');\n",
            ],
          ]);
          NODE

          git rm .github/workflows/spec014-tenant-repository-provenance-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            http-generic-api/hostingerStorageTenantCanary.js \
            http-generic-api/test-hostinger-storage-tenant-canary.mjs \
            http-generic-api/test-hostinger-storage-tenant-canary-postmerge-hardening.mjs \
            .github/workflows/hostinger-storage-tenant-canary-guard.yml
          git commit -m 'fix(spec-014): require Tenant-owned repository provenance'
          git push origin HEAD:gpt/014-hostinger/tenant-canary-postmerge-hardening-20260801
