name: Incident 5021 exact-head approval candidate publisher

on:
  pull_request:
    branches:
      - gpt/incident-5021/draft-merge-guard-v2-20260803
    paths:
      - .github/scripts/incident-5021-diagnostic-v10.py
      - .github/scripts/incident-5021-diagnostic-v11.py
      - .github/workflows/incident-5021-exact-head-approval-publisher.yml

permissions:
  contents: write

concurrency:
  group: incident-5021-exact-head-approval-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: Publish tested exact-head approval candidate
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: gpt/incident-5021/exact-head-approval-guard-20260803
      BUILDER_BRANCH: gpt/incident-5021/exact-head-approval-guard-builder-v2-20260803
      EXPECTED_TARGET_SHA: 2b7cf14b23c03df97a962b6451cbb4579a39d628
      REPORT_PATH: incident-5021-builder-diagnostic-v11.json
      RESULT_PATH: incident-5021-publisher-result.json
    steps:
      - name: Checkout immutable target branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install connector dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Verify exact target and fetch tested generator
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"
          test "$(git status --porcelain)" = ""
          git fetch --no-tags origin "$TARGET_BRANCH" "$BUILDER_BRANCH"
          test "$(git rev-parse "origin/${TARGET_BRANCH}")" = "$EXPECTED_TARGET_SHA"
          git show "origin/${BUILDER_BRANCH}:.github/scripts/incident-5021-diagnostic-v10.py" > /tmp/incident-5021-diagnostic-v10.py
          git show "origin/${BUILDER_BRANCH}:.github/scripts/incident-5021-diagnostic-v11.py" > /tmp/incident-5021-diagnostic-v11.py
          python -m py_compile /tmp/incident-5021-diagnostic-v10.py /tmp/incident-5021-diagnostic-v11.py

      - name: Regenerate and test exact candidate
        shell: bash
        run: python /tmp/incident-5021-diagnostic-v11.py

      - name: Enforce structured evidence and six-file boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCHECK'
          import json
          from pathlib import Path
          report = json.loads(Path("incident-5021-builder-diagnostic-v11.json").read_text())
          expected = [
              ".changes/e2e/repository-lifecycle-draft-merge-guard.json",
              "http-generic-api/githubRepositoryLifecycle.js",
              "http-generic-api/openapi/operation-capability-lifecycle.yaml",
              "http-generic-api/operationCapabilityLifecycleService.js",
              "http-generic-api/test-github-repository-lifecycle.mjs",
              "http-generic-api/test-gpt-tools-route-syntax-regression.mjs",
          ]
          checks = [
              report.get("diagnostic_completed") is True,
              report.get("patch_returncode") == 0,
              report.get("all_tests_passed") is True,
              report.get("diff_check_returncode") == 0,
              report.get("exact_six_file_boundary") is True,
              report.get("actual_target_sha") == "2b7cf14b23c03df97a962b6451cbb4579a39d628",
              report.get("expected_target_sha") == "2b7cf14b23c03df97a962b6451cbb4579a39d628",
              report.get("changed_files_after_execution") == expected,
              report.get("secrets_included") is False,
              report.get("target_published") is False,
          ]
          if not all(checks):
              raise SystemExit("publisher evidence contract failed")
          PYCHECK
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            .changes/e2e/repository-lifecycle-draft-merge-guard.json
            http-generic-api/githubRepositoryLifecycle.js
            http-generic-api/openapi/operation-capability-lifecycle.yaml
            http-generic-api/operationCapabilityLifecycleService.js
            http-generic-api/test-github-repository-lifecycle.mjs
            http-generic-api/test-gpt-tools-route-syntax-regression.mjs
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")
          test "${#changed[@]}" -eq 6

      - name: Commit and publish candidate without force
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/${TARGET_BRANCH}")" = "$EXPECTED_TARGET_SHA"
          cp "$REPORT_PATH" "/tmp/$REPORT_PATH"
          rm -f "$REPORT_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .changes/e2e/repository-lifecycle-draft-merge-guard.json \
            http-generic-api/githubRepositoryLifecycle.js \
            http-generic-api/openapi/operation-capability-lifecycle.yaml \
            http-generic-api/operationCapabilityLifecycleService.js \
            http-generic-api/test-github-repository-lifecycle.mjs \
            http-generic-api/test-gpt-tools-route-syntax-regression.mjs
          git commit -m "fix(github): require exact-head human approval"
          candidate_sha="$(git rev-parse HEAD)"
          test "$(git status --porcelain)" = ""
          git push origin "HEAD:${TARGET_BRANCH}"
          python - "$candidate_sha" <<'PYRESULT'
          import json
          import sys
          from pathlib import Path
          candidate_sha = sys.argv[1]
          result = {
              "schema_version": 1,
              "status": "published",
              "base_sha": "2b7cf14b23c03df97a962b6451cbb4579a39d628",
              "candidate_sha": candidate_sha,
              "target_branch": "gpt/incident-5021/exact-head-approval-guard-20260803",
              "changed_file_count": 6,
              "tests_passed": True,
              "diff_check_passed": True,
              "force_push": False,
              "secrets_included": False,
          }
          Path("incident-5021-publisher-result.json").write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          PYRESULT

      - name: Upload publisher evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incident-5021-exact-head-approval-publisher-${{ github.sha }}
          path: |
            /tmp/incident-5021-builder-diagnostic-v11.json
            incident-5021-publisher-result.json
          if-no-files-found: warn
          retention-days: 7
