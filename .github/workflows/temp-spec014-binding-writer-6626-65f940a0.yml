name: TEMP Spec 014 Binding Writer 6626 65f940a0

on:
  pull_request:
    branches:
      - gpt/spec014-binding-writer-base-6626-65f940a0
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: temp-spec014-binding-writer-6626-65f940a0
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh exact Spec 014 bindings on PR 6626
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      CANONICAL_PR: '6626'
      EXPECTED_MAIN_SHA: c7bb2bc823f77703d9f75c219ed4506a895df8e0
      EXPECTED_HEAD_SHA: 65f940a0a43bd181a803bc52483d8949522c0f8b
      TARGET_BRANCH: fix/generated-artifact-refresh-eligible-request-json-20260807
      TRIGGER_BRANCH: fix/spec014-binding-refresh-trigger-6626-65f940a0-20260808
      TRIGGER_PATH: .changes/e2e/spec014-binding-refresh-trigger-6626-65f940a0.json
      AUTHORIZATION_MARKER: '<!-- spec014-final-work-map-binding-refresh:authorized head=65f940a0a43bd181a803bc52483d8949522c0f8b -->'
      HOSTINGER_FEATURE: 014-governed-hostinger-storage-orchestration
      RETAIL_FEATURE: 014-retail-commerce-operations-growth-os
      HOSTINGER_MANIFEST: specs/014-governed-hostinger-storage-orchestration/work-map-integration.json
      RETAIL_MANIFEST: specs/014-retail-commerce-operations-growth-os/work-map-integration.json
      HOSTINGER_TASKS: specs/014-governed-hostinger-storage-orchestration/tasks.md
    steps:
      - name: Initialize bounded evidence directory
        shell: bash
        run: |
          set -Eeuo pipefail
          report_dir="${RUNNER_TEMP}/spec014-binding-refresh-6626"
          rm -rf "${report_dir}"
          mkdir -p "${report_dir}"
          echo "REPORT_DIR=${report_dir}" >> "${GITHUB_ENV}"

      - name: Validate trigger, exact target identity, and consume authorization
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_PR: ${{ github.event.pull_request.number }}
        run: |
          set -Eeuo pipefail

          trigger="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${TRIGGER_PR}")"
          test "$(jq -r '.state' <<<"${trigger}")" = 'open'
          test "$(jq -r '.base.ref' <<<"${trigger}")" = 'gpt/spec014-binding-writer-base-6626-65f940a0'
          test "$(jq -r '.head.repo.full_name' <<<"${trigger}")" = "${GITHUB_REPOSITORY}"
          test "$(jq -r '.head.ref' <<<"${trigger}")" = "${TRIGGER_BRANCH}"
          trigger_files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${TRIGGER_PR}/files" --jq '.[].filename')"
          test "${trigger_files}" = "${TRIGGER_PATH}"

          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${CANONICAL_PR}")"
          test "$(jq -r '.state' <<<"${pr}")" = 'open'
          test "$(jq -r '.draft' <<<"${pr}")" = 'false'
          test "$(jq -r '.base.ref' <<<"${pr}")" = 'main'
          test "$(jq -r '.base.sha' <<<"${pr}")" = "${EXPECTED_MAIN_SHA}"
          test "$(jq -r '.head.repo.full_name' <<<"${pr}")" = "${GITHUB_REPOSITORY}"
          test "$(jq -r '.head.ref' <<<"${pr}")" = "${TARGET_BRANCH}"
          test "$(jq -r '.head.sha' <<<"${pr}")" = "${EXPECTED_HEAD_SHA}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "${EXPECTED_MAIN_SHA}"

          comparison="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${EXPECTED_MAIN_SHA}...${EXPECTED_HEAD_SHA}")"
          test "$(jq -r '.behind_by' <<<"${comparison}")" = '0'
          test "$(jq -r '.merge_base_commit.sha' <<<"${comparison}")" = "${EXPECTED_MAIN_SHA}"

          comments="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${CANONICAL_PR}/comments")"
          marker_matches="$(jq --arg marker "${AUTHORIZATION_MARKER}" '[.[] | select(.body == $marker)]' <<<"${comments}")"
          test "$(jq 'length' <<<"${marker_matches}")" = '1'
          marker_id="$(jq -r '.[0].id' <<<"${marker_matches}")"
          marker_author="$(jq -r '.[0].user.login' <<<"${marker_matches}")"
          test "${marker_author}" != 'github-actions[bot]'
          consumed_body="SPEC014_FINAL_WORK_MAP_BINDING_REFRESH consumed=true expected_head_sha=${EXPECTED_HEAD_SHA} run_id=${GITHUB_RUN_ID}"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${marker_id}" -f body="${consumed_body}" >/dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${marker_id}" --jq '.body')" = "${consumed_body}"

          jq -n \
            --arg expected_main_sha "${EXPECTED_MAIN_SHA}" \
            --arg expected_head_sha "${EXPECTED_HEAD_SHA}" \
            --arg marker_id "${marker_id}" \
            '{identity:"pinned",authorization_consumed:true,authorization_comment_id:($marker_id|tonumber),expected_main_sha:$expected_main_sha,expected_head_sha:$expected_head_sha,behind_by:0}' \
            > "${REPORT_DIR}/identity.json"

      - name: Checkout exact authorized candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Build exact-head preflight and pin current registry
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          set +e
          REPORT_PATH="${REPORT_DIR}/preflight-readback.json" \
            node http-generic-api/scripts/spec014-final-work-map-readback.mjs \
            > "${REPORT_DIR}/preflight-readback.stdout.json"
          readback_status=$?
          set -e
          test -s "${REPORT_DIR}/preflight-readback.json"
          jq -e '.candidate_sha == env.EXPECTED_HEAD_SHA' "${REPORT_DIR}/preflight-readback.json" >/dev/null
          fingerprint="$(jq -r '.current_registry.fingerprint // empty' "${REPORT_DIR}/preflight-readback.json")"
          index_source_hash="$(jq -r '.current_registry.index_source_hash // empty' "${REPORT_DIR}/preflight-readback.json")"
          coverage_source_hash="$(jq -r '.current_registry.coverage_source_hash // empty' "${REPORT_DIR}/preflight-readback.json")"
          test -n "${fingerprint}"
          test -n "${index_source_hash}"
          test -n "${coverage_source_hash}"
          echo "EXPECTED_FINGERPRINT=${fingerprint}" >> "${GITHUB_ENV}"
          echo "EXPECTED_INDEX_SOURCE_HASH=${index_source_hash}" >> "${GITHUB_ENV}"
          echo "EXPECTED_COVERAGE_SOURCE_HASH=${coverage_source_hash}" >> "${GITHUB_ENV}"
          jq -n \
            --argjson readback_status "${readback_status}" \
            --arg fingerprint "${fingerprint}" \
            --arg index_source_hash "${index_source_hash}" \
            --arg coverage_source_hash "${coverage_source_hash}" \
            '{readback_status:$readback_status,current_registry:{fingerprint:$fingerprint,index_source_hash:$index_source_hash,coverage_source_hash:$coverage_source_hash}}' \
            > "${REPORT_DIR}/registry-pin.json"

      - name: Run canonical producer for Hostinger and Retail
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"

          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            --feature-key "${HOSTINGER_FEATURE}" | tee "${REPORT_DIR}/hostinger-write.json"
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            --feature-key "${RETAIL_FEATURE}" | tee "${REPORT_DIR}/retail-write.json"

          for report in hostinger-write retail-write; do
            jq -e \
              --arg fingerprint "${EXPECTED_FINGERPRINT}" \
              --arg index_hash "${EXPECTED_INDEX_SOURCE_HASH}" \
              --arg coverage_hash "${EXPECTED_COVERAGE_SOURCE_HASH}" \
              '.ok == true and .mode == "write" and .current_registry.fingerprint == $fingerprint and .current_registry.index_source_hash == $index_hash and .current_registry.coverage_source_hash == $coverage_hash' \
              "${REPORT_DIR}/${report}.json" >/dev/null
          done

          git diff --name-only | sort > "${REPORT_DIR}/changed-files.txt"
          grep -Fxq "${HOSTINGER_MANIFEST}" "${REPORT_DIR}/changed-files.txt"
          grep -Fxq "${RETAIL_MANIFEST}" "${REPORT_DIR}/changed-files.txt"
          unexpected="$(grep -Fvx -e "${HOSTINGER_MANIFEST}" -e "${RETAIL_MANIFEST}" -e "${HOSTINGER_TASKS}" "${REPORT_DIR}/changed-files.txt" || true)"
          test -z "${unexpected}"
          git diff --check

      - name: Prove pre-commit currentness and idempotency
        shell: bash
        run: |
          set -Eeuo pipefail
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --check \
            --feature-key "${HOSTINGER_FEATURE}" | tee "${REPORT_DIR}/hostinger-check-precommit.json"
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --check \
            --feature-key "${RETAIL_FEATURE}" | tee "${REPORT_DIR}/retail-check-precommit.json"

          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            --feature-key "${HOSTINGER_FEATURE}" | tee "${REPORT_DIR}/hostinger-idempotency.json"
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            --feature-key "${RETAIL_FEATURE}" | tee "${REPORT_DIR}/retail-idempotency.json"
          jq -e '.ok == true and (.changed_files | length) == 0' "${REPORT_DIR}/hostinger-idempotency.json" >/dev/null
          jq -e '.ok == true and (.changed_files | length) == 0' "${REPORT_DIR}/retail-idempotency.json" >/dev/null

          node http-generic-api/scripts/platform-work-map-generator.mjs --check | tee "${REPORT_DIR}/work-map-currentness-precommit.json"
          REPORT_PATH="${REPORT_DIR}/hostinger-readback-precommit.json" \
            node http-generic-api/scripts/spec014-final-work-map-readback.mjs \
            | tee "${REPORT_DIR}/hostinger-readback-precommit.stdout.json"
          jq -e '.ok == true and ((.findings | length) == 0)' "${REPORT_DIR}/hostinger-readback-precommit.json" >/dev/null

      - name: Commit exact bounded write-set and validate result commit
        id: refresh
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${EXPECTED_HEAD_SHA}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${HOSTINGER_MANIFEST}" "${RETAIL_MANIFEST}" "${HOSTINGER_TASKS}"
          git diff --cached --name-only | sort > "${REPORT_DIR}/committed-files.txt"
          grep -Fxq "${HOSTINGER_MANIFEST}" "${REPORT_DIR}/committed-files.txt"
          grep -Fxq "${RETAIL_MANIFEST}" "${REPORT_DIR}/committed-files.txt"
          unexpected_cached="$(grep -Fvx -e "${HOSTINGER_MANIFEST}" -e "${RETAIL_MANIFEST}" -e "${HOSTINGER_TASKS}" "${REPORT_DIR}/committed-files.txt" || true)"
          test -z "${unexpected_cached}"

          git commit -m 'fix(spec): refresh final Spec 014 Work Map bindings'
          result_head_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_HEAD_SHA}"
          test -z "$(git status --porcelain)"

          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --check \
            --feature-key "${HOSTINGER_FEATURE}" | tee "${REPORT_DIR}/hostinger-check-result.json"
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --check \
            --feature-key "${RETAIL_FEATURE}" | tee "${REPORT_DIR}/retail-check-result.json"
          node http-generic-api/scripts/platform-work-map-generator.mjs --check | tee "${REPORT_DIR}/work-map-currentness-result.json"
          REPORT_PATH="${REPORT_DIR}/hostinger-readback-result.json" \
            node http-generic-api/scripts/spec014-final-work-map-readback.mjs \
            | tee "${REPORT_DIR}/hostinger-readback-result.stdout.json"
          jq -e '.ok == true and ((.findings | length) == 0)' "${REPORT_DIR}/hostinger-readback-result.json" >/dev/null

          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${TARGET_BRANCH}"

          observed_remote=''
          observed_pr=''
          for _ in $(seq 1 30); do
            observed_remote="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
            observed_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${CANONICAL_PR}" --jq '.head.sha')"
            if [[ "${observed_remote}" = "${result_head_sha}" && "${observed_pr}" = "${result_head_sha}" ]]; then break; fi
            sleep 2
          done
          test "${observed_remote}" = "${result_head_sha}"
          test "${observed_pr}" = "${result_head_sha}"
          echo "result_head_sha=${result_head_sha}" >> "${GITHUB_OUTPUT}"

          jq -n \
            --arg result_head_sha "${result_head_sha}" \
            --arg fingerprint "${EXPECTED_FINGERPRINT}" \
            --arg index_source_hash "${EXPECTED_INDEX_SOURCE_HASH}" \
            --arg coverage_source_hash "${EXPECTED_COVERAGE_SOURCE_HASH}" \
            '{contract:"mad4b.spec014-binding-writer-6626.v2",outcome:"passed",result_head_sha:$result_head_sha,official_script:"http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs",features:["014-governed-hostinger-storage-orchestration","014-retail-commerce-operations-growth-os"],fingerprint:$fingerprint,index_source_hash:$index_source_hash,coverage_source_hash:$coverage_source_hash,candidate_branch_only:true,changed_paths_bounded:true,idempotency_proven:true,protected_branch_mutation:false,force_push:false,provider_dispatch:false,live_database_access:false,migration_apply:false,secrets_included:false}' \
            > "${REPORT_DIR}/summary.json"

      - name: Upload bounded refresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec014-binding-refresh-6626-${{ github.run_id }}
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish canonical PR evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_HEAD_SHA: ${{ steps.refresh.outputs.result_head_sha }}
        run: |
          set -Eeuo pipefail
          outcome='passed'
          if [[ "${{ steps.refresh.outcome }}" != 'success' ]]; then outcome='blocked'; fi
          body="SPEC014_BINDING_REFRESH_6626 outcome=${outcome} run_id=${GITHUB_RUN_ID} expected_main_sha=${EXPECTED_MAIN_SHA} expected_head_sha=${EXPECTED_HEAD_SHA} result_head_sha=${RESULT_HEAD_SHA:-none} official_script=spec014-refresh-final-work-map-binding.mjs features=hostinger,retail marker_comment_consumed=true manifest_mutation_authorized=true hostinger_tasks_mutation_authorized=true idempotency_proven=$([[ \"${outcome}\" = passed ]] && echo true || echo false) protected_branch_mutation=false force_push=false provider_dispatch=false live_database_access=false migration_apply=false secrets_included=false"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${CANONICAL_PR}/comments" -f body="${body}" >/dev/null
