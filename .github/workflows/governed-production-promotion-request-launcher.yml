name: Governed Production Promotion Request Launcher

on:
  workflow_dispatch:
    inputs:
      request_pr:
        description: Open same-repository request PR targeting main
        required: true
        type: string
      expected_head_sha:
        description: Exact authorized main release-cut SHA and trusted launcher SHA
        required: true
        type: string
      expected_request_head_sha:
        description: Exact tree-identical governed request PR head SHA
        required: true
        type: string
      release_branch_prefix:
        description: Non-protected branch prefix for the Production candidate
        required: true
        type: string
      validation_branch_prefix:
        description: Non-protected branch prefix for certified candidate validation
        required: true
        type: string
      validation_base_branch_prefix:
        description: Non-protected validation-base prefix pinned to the release cut
        required: true
        type: string
      review_mode:
        description: Human or bounded AI policy review for read-only supporting gates
        required: true
        default: human
        type: choice
        options: [human, ai_policy]
      confirmation:
        description: Type AUTHORIZE_GOVERNED_PRODUCTION_PROMOTION_REQUEST
        required: true
        type: string

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: governed-production-promotion-convergence-${{ github.repository }}
  cancel-in-progress: true

jobs:
  converge-release-cut:
    name: Converge immutable Production release cut
    if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'AUTHORIZE_GOVERNED_PRODUCTION_PROMOTION_REQUEST'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      REQUEST_PR: ${{ inputs.request_pr }}
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      EXPECTED_REQUEST_HEAD_SHA: ${{ inputs.expected_request_head_sha }}
      CURRENT_HEAD_SHA: ${{ github.sha }}
      RELEASE_BRANCH_PREFIX: ${{ inputs.release_branch_prefix }}
      VALIDATION_BRANCH_PREFIX: ${{ inputs.validation_branch_prefix }}
      VALIDATION_BASE_BRANCH_PREFIX: ${{ inputs.validation_base_branch_prefix }}
      REVIEW_MODE: ${{ inputs.review_mode }}
      GATE_REGISTRY: .github/contracts/production-promotion-supporting-gates.v1.json
    steps:
      - name: Checkout exact authorized launcher
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node for promotion controller
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Preflight typed promotion controller
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test .github/tests/production-promotion-runtime.test.mjs
          node .github/scripts/production-promotion-supporting-gates.mjs \
            --registry "$GATE_REGISTRY" \
            --review-mode "$REVIEW_MODE" \
            --release-branch "${RELEASE_BRANCH_PREFIX}-preflight-probe" \
            --candidate-sha 1111111111111111111111111111111111111111 \
            --output "$RUNNER_TEMP/supporting-gate-preflight.json" >/dev/null
          jq -e '.gates | length > 0' "$RUNNER_TEMP/supporting-gate-preflight.json" >/dev/null

      - name: Resolve authorized release cut and request identity
        id: source
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          reject() { echo "::error::$1"; exit 1; }
          [[ "$CONFIRMATION" == "AUTHORIZE_GOVERNED_PRODUCTION_PROMOTION_REQUEST" ]] || reject "typed confirmation mismatch"
          [[ "$REQUEST_PR" =~ ^[1-9][0-9]*$ ]] || reject "request_pr must be a positive integer"
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || reject "expected_head_sha must be an exact lowercase SHA"
          [[ "$EXPECTED_REQUEST_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || reject "expected_request_head_sha must be an exact lowercase SHA"
          [[ "$CURRENT_HEAD_SHA" == "$EXPECTED_HEAD_SHA" ]] || reject "launcher SHA differs from the authorized release cut"
          [[ "$GITHUB_REF_NAME" == "main" ]] || reject "launcher must be dispatched from trusted main"
          case "$REVIEW_MODE" in human|ai_policy) ;; *) reject "review_mode must be human or ai_policy" ;; esac

          for prefix in "$RELEASE_BRANCH_PREFIX" "$VALIDATION_BRANCH_PREFIX" "$VALIDATION_BASE_BRANCH_PREFIX"; do
            [[ -n "$prefix" ]] || reject "branch prefix must not be empty"
            git check-ref-format --branch "${prefix}-probe" >/dev/null 2>&1 || reject "invalid branch prefix: $prefix"
            case "$prefix" in main|main/*|Production|Production/*|refs/*) reject "branch prefix must reject protected refs" ;; esac
          done
          case "$VALIDATION_BRANCH_PREFIX" in
            gpt/validate-production-candidate) ;;
            *) reject "validation branch prefix must use governed candidate namespace" ;;
          esac
          case "$VALIDATION_BASE_BRANCH_PREFIX" in
            gpt/validate-production-base) ;;
            *) reject "validation base prefix must use governed base namespace" ;;
          esac

          request_file="$RUNNER_TEMP/production-promotion-request-pr.json"
          gh api "/repos/${REPOSITORY}/pulls/${REQUEST_PR}" > "$request_file"
          [[ "$(jq -r '.state' "$request_file")" == open ]] || reject "request PR is not open"
          [[ "$(jq -r '.base.ref' "$request_file")" == main ]] || reject "request PR must target main"
          [[ "$(jq -r '.head.repo.full_name // ""' "$request_file")" == "$REPOSITORY" ]] || reject "request PR must originate from this repository"
          [[ "$(jq -r '.head.sha' "$request_file")" == "$EXPECTED_REQUEST_HEAD_SHA" ]] || reject "request PR exact head mismatch"
          [[ "$(jq -r '.title' "$request_file")" == "ops: request governed Production synchronization" ]] || reject "request PR title contract mismatch"
          REQUEST_HEAD_BRANCH="$(jq -r '.head.ref' "$request_file")"
          git check-ref-format --branch "$REQUEST_HEAD_BRANCH" >/dev/null 2>&1 || reject "request head branch is invalid"
          case "$REQUEST_HEAD_BRANCH" in main|Production|refs/*) reject "request head branch may not be protected" ;; esac

          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/Production:refs/remotes/origin/Production' \
            "+refs/heads/${REQUEST_HEAD_BRANCH}:refs/remotes/origin/${REQUEST_HEAD_BRANCH}"
          CURRENT_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          PRODUCTION_SHA="$(git rev-parse refs/remotes/origin/Production)"
          REQUEST_HEAD_READBACK="$(git rev-parse "refs/remotes/origin/${REQUEST_HEAD_BRANCH}")"
          [[ "$REQUEST_HEAD_READBACK" == "$EXPECTED_REQUEST_HEAD_SHA" ]] || reject "request branch moved after API readback"
          git cat-file -e "${EXPECTED_HEAD_SHA}^{commit}"
          git merge-base --is-ancestor "$EXPECTED_HEAD_SHA" "$CURRENT_MAIN_SHA" || reject "authorized release cut is no longer contained by current main"
          git merge-base --is-ancestor "$EXPECTED_HEAD_SHA" "$EXPECTED_REQUEST_HEAD_SHA" || reject "request head does not descend from the authorized release cut"
          git diff --quiet "$EXPECTED_HEAD_SHA" "$EXPECTED_REQUEST_HEAD_SHA" || reject "request head is not tree-identical to the authorized release cut"
          git merge-base --is-ancestor "$PRODUCTION_SHA" "$EXPECTED_HEAD_SHA" || reject "current Production contains commits absent from the authorized release cut"

          if [[ "$REVIEW_MODE" == ai_policy ]]; then
            echo "AI_POLICY_REVIEW_MODE=bounded_supporting_gates_only"
            echo "AI_POLICY_REVIEW_SCOPE=declarative_read_only_supporting_gates_and_certified_release_cut_validation"
            echo "AI_POLICY_REVIEW_FORBIDDEN=production_merge,deployment,migration,grant,provider_mutation,credential_payload_read"
          fi

          {
            echo "release_cut_sha=$EXPECTED_HEAD_SHA"
            echo "current_main_sha=$CURRENT_MAIN_SHA"
            echo "production_sha=$PRODUCTION_SHA"
            echo "request_head_branch=$REQUEST_HEAD_BRANCH"
          } >> "$GITHUB_OUTPUT"

      - name: Initialize convergence evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          evidence_dir="$RUNNER_TEMP/governed-production-promotion"
          rm -rf "$evidence_dir"
          mkdir -p "$evidence_dir"
          echo "EVIDENCE_PATH=${evidence_dir}/governed-production-promotion-convergence.json" >> "$GITHUB_ENV"

      - name: Build, validate, and converge immutable release cut
        id: converge
        shell: bash
        env:
          RELEASE_CUT_SHA: ${{ steps.source.outputs.release_cut_sha }}
          INITIAL_MAIN_SHA: ${{ steps.source.outputs.current_main_sha }}
          PRODUCTION_SHA: ${{ steps.source.outputs.production_sha }}
          REQUEST_HEAD_BRANCH: ${{ steps.source.outputs.request_head_branch }}
        run: |
          set -Eeuo pipefail
          RUN_POLL_INTERVAL_SECONDS=20
          RUN_POLL_DEADLINE_SECONDS=3900
          RUN_DISCOVERY_ATTEMPTS=40
          RUN_DISCOVERY_INTERVAL_SECONDS=5

          require_sha() { [[ "$2" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::$1 must be an exact lowercase SHA"; return 1; }; }
          require_run_id() { [[ "$2" =~ ^[1-9][0-9]*$ ]] || { echo "::error::$1 must be a positive run ID"; return 1; }; }

          resolve_dispatched_run() {
            local workflow="$1" branch="$2" expected_sha="$3" earliest="$4" run_id=""
            for _ in $(seq 1 "$RUN_DISCOVERY_ATTEMPTS"); do
              run_id="$(gh run list --repo "$REPOSITORY" --workflow "$workflow" --branch "$branch" --event workflow_dispatch --limit 100 \
                --json databaseId,headSha,createdAt,status,conclusion,event \
                | node .github/scripts/production-promotion-run-selector.mjs --earliest "$earliest" --head-sha "$expected_sha" --event workflow_dispatch 2>/dev/null || true)"
              [[ -n "$run_id" ]] && { printf '%s' "$run_id"; return 0; }
              sleep "$RUN_DISCOVERY_INTERVAL_SECONDS"
            done
            return 1
          }

          dispatch_and_capture() {
            local workflow="$1" ref="$2" expected_sha="$3" earliest="$4"
            shift 4
            local output="" run_id=""
            if ! output="$(gh workflow run "$workflow" --repo "$REPOSITORY" --ref "$ref" "$@" 2>&1)"; then
              printf '%s\n' "$output" >&2
              return 1
            fi
            printf '%s\n' "$output" >&2
            run_id="$(sed -n 's#.*actions/runs/\([0-9][0-9]*\).*#\1#p' <<<"$output" | tail -n1)"
            if [[ -z "$run_id" ]]; then
              run_id="$(resolve_dispatched_run "$workflow" "$ref" "$expected_sha" "$earliest" || true)"
            fi
            require_run_id "$workflow run" "$run_id"
            printf '%s' "$run_id"
          }

          APPROVAL_REQUIRED=0
          APPROVAL_MANIFEST="$RUNNER_TEMP/governed-production-promotion/approval-manifest.json"
          wait_run_success() {
            local run_id="$1" label="$2" allow_action_required="$3"
            local deadline=$(( $(date +%s) + RUN_POLL_DEADLINE_SECONDS )) status="" conclusion=""
            while (( $(date +%s) < deadline )); do
              local file="$RUNNER_TEMP/run-${run_id}.json" err="$RUNNER_TEMP/run-${run_id}.err"
              : > "$err"
              if gh run view "$run_id" --repo "$REPOSITORY" --json databaseId,headSha,event,status,conclusion,url > "$file" 2> "$err"; then
                status="$(jq -r '.status // ""' "$file")"
                conclusion="$(jq -r '.conclusion // ""' "$file")"
                if [[ "$status" == completed ]]; then
                  [[ "$conclusion" == success ]] && return 0
                  if [[ "$conclusion" == action_required && "$allow_action_required" == true ]]; then
                    mkdir -p "$RUNNER_TEMP/governed-production-promotion"
                    if [[ ! -s "$APPROVAL_MANIFEST" ]]; then
                      jq -n \
                        --arg operation_id "${OPERATION_ID:-unresolved}" \
                        '{schema_version:"governed_production_promotion_approval_manifest.v1",operation_id:$operation_id,state:"APPROVAL_REQUIRED",approvals_required:[],merge_executed:false,deployment_executed:false,secrets_included:false}' \
                        > "$APPROVAL_MANIFEST"
                    fi
                    jq \
                      --arg run_id "$run_id" \
                      --arg workflow "$label" \
                      --arg url "$(jq -r '.url // ""' "$file")" \
                      '.approvals_required += [{run_id:$run_id,workflow:$workflow,url:$url,reason:"github_action_required",safe_scope:"read_only_supporting_gate"}]' \
                      "$APPROVAL_MANIFEST" > "$APPROVAL_MANIFEST.next"
                    mv "$APPROVAL_MANIFEST.next" "$APPROVAL_MANIFEST"
                    APPROVAL_REQUIRED=1
                    echo "::warning::$label run $run_id requires human action; added to resumable approval manifest"
                    return 0
                  else
                    echo "::error::$label run $run_id completed with $conclusion"
                    return 1
                  fi
                fi
                sleep "$RUN_POLL_INTERVAL_SECONDS"
                continue
              fi
              if grep -Eqi 'rate limit exceeded|HTTP 403|HTTP 404|HTTP 408|HTTP 409|HTTP 429|HTTP 5[0-9][0-9]|temporarily unavailable|connection reset|timed out|EOF' "$err"; then
                echo "::warning::transient GitHub API error while polling $label"
                sleep "$RUN_POLL_INTERVAL_SECONDS"
                continue
              fi
              cat "$err" >&2
              return 1
            done
            echo "::error::$label did not complete before the bounded deadline"
            return 1
          }

          ATTEMPT_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CURRENT_PRODUCTION_SHA="$(gh api "/repos/${REPOSITORY}/git/ref/heads/Production" --jq '.object.sha')"
          [[ "$CURRENT_PRODUCTION_SHA" == "$PRODUCTION_SHA" ]] || { echo "::error::Production moved before convergence"; exit 1; }
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/Production:refs/remotes/origin/Production'
          CURRENT_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          git merge-base --is-ancestor "$RELEASE_CUT_SHA" "$CURRENT_MAIN_SHA" || { echo "::error::main no longer contains release cut"; exit 1; }
          git merge-base --is-ancestor "$PRODUCTION_SHA" "$RELEASE_CUT_SHA" || { echo "::error::Production is not contained by release cut"; exit 1; }

          CUT_SHORT="${RELEASE_CUT_SHA:0:12}"
          PRODUCTION_SHORT="${PRODUCTION_SHA:0:12}"
          OPERATION_ID="promo-${CUT_SHORT}-${PRODUCTION_SHORT}"
          RELEASE_BRANCH="${RELEASE_BRANCH_PREFIX}-${CUT_SHORT}-${PRODUCTION_SHORT}"
          VALIDATION_BRANCH="${VALIDATION_BRANCH_PREFIX}-${CUT_SHORT}-${PRODUCTION_SHORT}"
          VALIDATION_BASE_BRANCH="${VALIDATION_BASE_BRANCH_PREFIX}-${CUT_SHORT}-${PRODUCTION_SHORT}"
          OPERATION_DIR="$RUNNER_TEMP/governed-production-promotion"
          mkdir -p "$OPERATION_DIR"
          STATE_PATH="$OPERATION_DIR/${OPERATION_ID}.json"
          node .github/scripts/production-promotion-operation-state.mjs operation "$STATE_PATH" "$RELEASE_CUT_SHA" "$PRODUCTION_SHA"

          RELEASE_JSON="$(gh pr list --repo "$REPOSITORY" --state open --head "$RELEASE_BRANCH" --base Production --limit 1 --json number,headRefOid,headRefName,baseRefName)"
          VALIDATION_JSON="$(gh pr list --repo "$REPOSITORY" --state open --head "$VALIDATION_BRANCH" --base "$VALIDATION_BASE_BRANCH" --limit 1 --json number,title,headRefOid,headRefName,baseRefName)"
          EXISTING_RELEASE_PR="$(jq -r '.[0].number // empty' <<<"$RELEASE_JSON")"
          EXISTING_VALIDATION_PR="$(jq -r '.[0].number // empty' <<<"$VALIDATION_JSON")"
          RELEASE_REF_EXISTS=0
          VALIDATION_REF_EXISTS=0
          gh api "/repos/${REPOSITORY}/git/ref/heads/${RELEASE_BRANCH}" >/dev/null 2>&1 && RELEASE_REF_EXISTS=1 || true
          gh api "/repos/${REPOSITORY}/git/ref/heads/${VALIDATION_BRANCH}" >/dev/null 2>&1 && VALIDATION_REF_EXISTS=1 || true
          if [[ "$RELEASE_REF_EXISTS" == 1 && -z "$EXISTING_RELEASE_PR" ]] || [[ "$VALIDATION_REF_EXISTS" == 1 && -z "$EXISTING_VALIDATION_PR" ]]; then
            echo "::error::stale promotion branch exists without an open PR; refusing reuse or overwrite"
            exit 78
          fi
          BUILDER_RUN_ID="reused"
          if [[ -n "$EXISTING_RELEASE_PR" && -z "$EXISTING_VALIDATION_PR" ]] || [[ -z "$EXISTING_RELEASE_PR" && -n "$EXISTING_VALIDATION_PR" ]]; then
            echo "::error::partial idempotent promotion surfaces detected; refusing builder retry to prevent duplicate PRs"
            exit 78
          fi
          if [[ -z "$EXISTING_RELEASE_PR" && -z "$EXISTING_VALIDATION_PR" ]]; then
            BUILDER_RUN_ID="$(dispatch_and_capture production-promotion-candidate.yml "$REQUEST_HEAD_BRANCH" "$EXPECTED_REQUEST_HEAD_SHA" "$ATTEMPT_STARTED_AT" \
              --field expected_main_sha="$RELEASE_CUT_SHA" \
              --field expected_head_sha="$EXPECTED_REQUEST_HEAD_SHA" \
              --field expected_production_sha="$PRODUCTION_SHA" \
              --field release_branch="$RELEASE_BRANCH" \
              --field validation_branch="$VALIDATION_BRANCH" \
              --field validation_base_branch="$VALIDATION_BASE_BRANCH" \
              --field create_pull_requests=true)"
            wait_run_success "$BUILDER_RUN_ID" "release-cut candidate builder" false
          else
            echo "::notice::reusing existing idempotent promotion surfaces operation_id=$OPERATION_ID release_pr=$EXISTING_RELEASE_PR validation_pr=$EXISTING_VALIDATION_PR"
          fi

          RELEASE_JSON="$(gh pr list --repo "$REPOSITORY" --state open --head "$RELEASE_BRANCH" --base Production --limit 1 --json number,headRefOid,headRefName,baseRefName)"
          VALIDATION_JSON="$(gh pr list --repo "$REPOSITORY" --state open --head "$VALIDATION_BRANCH" --base "$VALIDATION_BASE_BRANCH" --limit 1 --json number,title,headRefOid,headRefName,baseRefName)"
          RELEASE_PR="$(jq -r '.[0].number // empty' <<<"$RELEASE_JSON")"
          VALIDATION_PR="$(jq -r '.[0].number // empty' <<<"$VALIDATION_JSON")"
          CANDIDATE_SHA="$(jq -r '.[0].headRefOid // empty' <<<"$RELEASE_JSON")"
          VALIDATION_SHA="$(jq -r '.[0].headRefOid // empty' <<<"$VALIDATION_JSON")"
          VALIDATION_TITLE="$(jq -r '.[0].title // empty' <<<"$VALIDATION_JSON")"
          [[ "$RELEASE_PR" =~ ^[1-9][0-9]*$ && "$VALIDATION_PR" =~ ^[1-9][0-9]*$ ]] || { echo "::error::builder did not create both review surfaces"; exit 1; }
          require_sha CANDIDATE_SHA "$CANDIDATE_SHA"
          [[ "$VALIDATION_SHA" == "$CANDIDATE_SHA" ]] || { echo "::error::validation/release candidate mismatch"; exit 1; }
          [[ "$VALIDATION_TITLE" == test\(release\):\ certify\ immutable\ Production\ candidate\ * ]] || { echo "::error::validation PR did not select certified release-cut contract"; exit 1; }

          git fetch --no-tags origin \
            "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}" \
            "+refs/heads/${VALIDATION_BRANCH}:refs/remotes/origin/${VALIDATION_BRANCH}" \
            "+refs/heads/${VALIDATION_BASE_BRANCH}:refs/remotes/origin/${VALIDATION_BASE_BRANCH}"
          [[ "$(git rev-parse "refs/remotes/origin/${VALIDATION_BASE_BRANCH}")" == "$RELEASE_CUT_SHA" ]] || { echo "::error::validation base is not release cut"; exit 1; }
          [[ "$(git rev-parse "${CANDIDATE_SHA}^1")" == "$RELEASE_CUT_SHA" ]] || { echo "::error::candidate first parent is not release cut"; exit 1; }
          git diff --quiet "$RELEASE_CUT_SHA" "$CANDIDATE_SHA" || { echo "::error::candidate tree differs from release cut"; exit 1; }

          CERTIFIED_RUN_ID=""
          for _ in $(seq 1 60); do
            CERTIFIED_RUN_ID="$(gh api "/repos/${REPOSITORY}/actions/workflows/production-certified-release-cut-validation.yml/runs?event=pull_request_target&per_page=100" \
              | jq --argjson pr "$VALIDATION_PR" --arg title "$VALIDATION_TITLE" --arg candidate "$CANDIDATE_SHA" -r \
                '[.workflow_runs[] | select(((.pull_requests // []) | map(.number) | index($pr)) != null or .display_title == $title) | select(.head_sha == $candidate) | select(.status != "completed" or .conclusion == "success")] | sort_by(.created_at, .id) | last | .id // empty')"
            [[ -n "$CERTIFIED_RUN_ID" ]] && break
            sleep 5
          done
          require_run_id CERTIFIED_RUN_ID "$CERTIFIED_RUN_ID"
          wait_run_success "$CERTIFIED_RUN_ID" "certified release-cut validation" false

          CERTIFIED_DIR="$RUNNER_TEMP/certified-release-cut"
          mkdir -p "$CERTIFIED_DIR"
          gh run download "$CERTIFIED_RUN_ID" --repo "$REPOSITORY" --name "certified-production-release-cut-${CANDIDATE_SHA}" --dir "$CERTIFIED_DIR"
          CERTIFIED_EVIDENCE="$(find "$CERTIFIED_DIR" -type f -name 'certified-production-release-cut.json' -print -quit)"
          test -n "$CERTIFIED_EVIDENCE"
          jq -e --arg cut "$RELEASE_CUT_SHA" --arg candidate "$CANDIDATE_SHA" --arg prod "$PRODUCTION_SHA" '
            .schema_version == "certified_production_release_cut.v1" and .ok == true and
            .certified_cut_sha == $cut and .candidate_sha == $candidate and .production_sha == $prod and
            .exact_full_ci_success == true and .candidate_tree_matches_certified_cut == true and
            .certified_cut_is_ancestor_of_current_main == true and .candidate_contains_production == true and
            .production_ref_stable_during_validation == true and .main_tip_may_advance == true and
            .merge_executed == false and .deployment_executed == false and .migration_executed == false and .secrets_included == false
          ' "$CERTIFIED_EVIDENCE" >/dev/null

          GATE_PLAN="$RUNNER_TEMP/production-promotion-supporting-gates.json"
          node .github/scripts/production-promotion-supporting-gates.mjs \
            --registry "$GATE_REGISTRY" --review-mode "$REVIEW_MODE" --release-branch "$RELEASE_BRANCH" --candidate-sha "$CANDIDATE_SHA" --output "$GATE_PLAN" >/dev/null
          GATE_REGISTRY_SHA256="$(jq -r '.registry_sha256' "$GATE_PLAN")"
          SUPPORTING_RUNS='{}'

          while IFS= read -r gate; do
            gate_id="$(jq -r '.id' <<<"$gate")"
            label="$(jq -r '.label' <<<"$gate")"
            workflow="$(jq -r '.workflow' <<<"$gate")"
            ref="$(jq -r '.ref' <<<"$gate")"
            [[ "$(gh api "/repos/${REPOSITORY}/git/ref/heads/${RELEASE_BRANCH}" --jq '.object.sha')" == "$CANDIDATE_SHA" ]] || { echo "::error::release branch moved before $label dispatch"; exit 1; }
            dispatch_args=()
            while IFS=$'\t' read -r key value; do
              [[ -n "$key" ]] || continue
              dispatch_args+=(--field "${key}=${value}")
            done < <(jq -r '.inputs | to_entries[]? | [.key,.value] | @tsv' <<<"$gate")
            gate_started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gate_run_id="$(dispatch_and_capture "$workflow" "$ref" "$CANDIDATE_SHA" "$gate_started" "${dispatch_args[@]}")"
            SUPPORTING_RUNS="$(jq --arg id "$gate_id" --arg run "$gate_run_id" '. + {($id):$run}' <<<"$SUPPORTING_RUNS")"
            echo "dispatched supporting gate $gate_id run=$gate_run_id"
          done < <(jq -c '.gates[]' "$GATE_PLAN")

          ALLOW_ACTION_REQUIRED=false
          [[ "$REVIEW_MODE" == human ]] && ALLOW_ACTION_REQUIRED=true
          while IFS= read -r gate; do
            gate_id="$(jq -r '.id' <<<"$gate")"
            label="$(jq -r '.label' <<<"$gate")"
            gate_run_id="$(jq -r --arg id "$gate_id" '.[$id]' <<<"$SUPPORTING_RUNS")"
            wait_run_success "$gate_run_id" "$label" "$ALLOW_ACTION_REQUIRED"
          done < <(jq -c '.gates[]' "$GATE_PLAN")
          if [[ "$APPROVAL_REQUIRED" == 1 ]]; then
            echo "::error::one or more supporting gates require approval; resume the same operation after approving approval-manifest.json"
            exit 78
          fi

          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/Production:refs/remotes/origin/Production' \
            "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}" \
            "+refs/heads/${VALIDATION_BRANCH}:refs/remotes/origin/${VALIDATION_BRANCH}" \
            "+refs/heads/${VALIDATION_BASE_BRANCH}:refs/remotes/origin/${VALIDATION_BASE_BRANCH}"
          FINAL_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          FINAL_PRODUCTION_SHA="$(git rev-parse refs/remotes/origin/Production)"
          [[ "$FINAL_PRODUCTION_SHA" == "$PRODUCTION_SHA" ]] || { echo "::error::Production moved during convergence"; exit 1; }
          git merge-base --is-ancestor "$RELEASE_CUT_SHA" "$FINAL_MAIN_SHA" || { echo "::error::release cut is no longer contained by current main"; exit 1; }
          git merge-base --is-ancestor "$PRODUCTION_SHA" "$RELEASE_CUT_SHA" || { echo "::error::Production is no longer contained by release cut"; exit 1; }
          [[ "$(git rev-parse "refs/remotes/origin/${RELEASE_BRANCH}")" == "$CANDIDATE_SHA" ]] || { echo "::error::release branch moved"; exit 1; }
          [[ "$(git rev-parse "refs/remotes/origin/${VALIDATION_BRANCH}")" == "$CANDIDATE_SHA" ]] || { echo "::error::validation branch moved"; exit 1; }
          [[ "$(git rev-parse "refs/remotes/origin/${VALIDATION_BASE_BRANCH}")" == "$RELEASE_CUT_SHA" ]] || { echo "::error::validation base moved"; exit 1; }
          [[ "$(git rev-parse "${CANDIDATE_SHA}^1")" == "$RELEASE_CUT_SHA" ]] || { echo "::error::candidate first parent changed"; exit 1; }
          git diff --quiet "$RELEASE_CUT_SHA" "$CANDIDATE_SHA" || { echo "::error::candidate tree drifted"; exit 1; }
          git merge-base --is-ancestor "$PRODUCTION_SHA" "$CANDIDATE_SHA" || { echo "::error::candidate lost Production ancestry"; exit 1; }

          INPUT_PATH="$RUNNER_TEMP/release-cut-convergence-input.json"
          export SUPPORTING_RUNS FINAL_MAIN_SHA RELEASE_PR VALIDATION_PR CANDIDATE_SHA BUILDER_RUN_ID CERTIFIED_RUN_ID GATE_REGISTRY_SHA256 RELEASE_CUT_SHA PRODUCTION_SHA REQUEST_PR REVIEW_MODE
          node - "$INPUT_PATH" <<'NODE'
          const fs = require('node:fs');
          const out = process.argv[2];
          const input = {
            review_mode: process.env.REVIEW_MODE,
            request_pr: process.env.REQUEST_PR,
            release_pr: process.env.RELEASE_PR,
            validation_pr: process.env.VALIDATION_PR,
            release_cut_sha: process.env.RELEASE_CUT_SHA,
            current_main_sha: process.env.FINAL_MAIN_SHA,
            production_sha: process.env.PRODUCTION_SHA,
            candidate_sha: process.env.CANDIDATE_SHA,
            builder_run_id: process.env.BUILDER_RUN_ID,
            certified_validation_run_id: process.env.CERTIFIED_RUN_ID,
            gate_registry_sha256: process.env.GATE_REGISTRY_SHA256,
            supporting_runs: JSON.parse(process.env.SUPPORTING_RUNS),
          };
          fs.writeFileSync(out, `${JSON.stringify(input, null, 2)}\n`);
          NODE
          node .github/scripts/production-promotion-release-cut-evidence.mjs --input "$INPUT_PATH" --output "$EVIDENCE_PATH"
          EVIDENCE_DIGEST="$(sha256sum "$EVIDENCE_PATH" | awk '{print $1}')"

          RELEASE_BODY="$RUNNER_TEMP/release-pr-final.md"
          cat > "$RELEASE_BODY" <<EOF
          ## Governed certified immutable Production release cut

          - release cut: \`$RELEASE_CUT_SHA\`
          - pinned main: \`$RELEASE_CUT_SHA\`
          - current main after validation: \`$FINAL_MAIN_SHA\`
          - pinned Production: \`$PRODUCTION_SHA\`
          - exact candidate: \`$CANDIDATE_SHA\`
          - certified validation run: \`$CERTIFIED_RUN_ID\`
          - builder run: \`$BUILDER_RUN_ID\`
          - review mode: \`$REVIEW_MODE\`
          - supporting gate registry: \`sha256:$GATE_REGISTRY_SHA256\`
          - convergence evidence: \`sha256:$EVIDENCE_DIGEST\`
          - release_cut_mode: true
          - main_tip_may_advance: true
          - production_ref_stable: true
          - governed_promotion_candidate: true

          The candidate tree is byte-identical to the certified release cut. Current main may advance only while retaining the release cut as an ancestor. Production must remain pinned exactly. Certified direct CI and every declaratively registered required supporting gate succeeded on the exact candidate.

          This PR promotes Git ancestry only. Merge remains separately authorized and must re-run the Release Source-Pin Gate. No deployment, SQL, migration, grant, provider mutation, credential payload read, restart, or external write is authorized by this evidence.
          EOF
          gh pr edit "$RELEASE_PR" --repo "$REPOSITORY" --body-file "$RELEASE_BODY"

          gh pr comment "$VALIDATION_PR" --repo "$REPOSITORY" --body "CERTIFIED_RELEASE_CUT_VALIDATED candidate=$CANDIDATE_SHA release_cut=$RELEASE_CUT_SHA current_main=$FINAL_MAIN_SHA Production=$PRODUCTION_SHA certified_run=$CERTIFIED_RUN_ID gate_registry=sha256:$GATE_REGISTRY_SHA256 merge_executed=false deployment_executed=false" || echo "::warning::validation evidence comment transport degraded"
          gh pr close "$VALIDATION_PR" --repo "$REPOSITORY" || echo "::warning::validation surface cleanup degraded"

          {
            echo "main_sha=$RELEASE_CUT_SHA"
            echo "current_main_sha=$FINAL_MAIN_SHA"
            echo "production_sha=$PRODUCTION_SHA"
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "release_pr=$RELEASE_PR"
            echo "validation_pr=$VALIDATION_PR"
            echo "builder_run_id=$BUILDER_RUN_ID"
            echo "exact_run_id=$CERTIFIED_RUN_ID"
            echo "evidence_digest=$EVIDENCE_DIGEST"
          } >> "$GITHUB_OUTPUT"

      - name: Upload convergence evidence and resumable state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: governed-production-promotion-convergence-${{ github.run_id }}
          path: |
            ${{ env.EVIDENCE_PATH }}
            ${{ runner.temp }}/governed-production-promotion/
          if-no-files-found: ignore
          retention-days: 30

      - name: Record request outcome without making comment transport authoritative
        if: always()
        shell: bash
        env:
          CONVERGENCE_OUTCOME: ${{ steps.converge.outcome }}
          CANDIDATE_SHA: ${{ steps.converge.outputs.candidate_sha }}
          RELEASE_PR: ${{ steps.converge.outputs.release_pr }}
          VALIDATION_PR: ${{ steps.converge.outputs.validation_pr }}
          CURRENT_MAIN_SHA: ${{ steps.converge.outputs.current_main_sha }}
        run: |
          set -Eeuo pipefail
          BODY="GOVERNED_PRODUCTION_RELEASE_CUT_CONVERGENCE outcome=${CONVERGENCE_OUTCOME} run_id=${GITHUB_RUN_ID} release_cut=${EXPECTED_HEAD_SHA} current_main=${CURRENT_MAIN_SHA:-unresolved} candidate=${CANDIDATE_SHA:-unresolved} release_pr=${RELEASE_PR:-unresolved} validation_pr=${VALIDATION_PR:-unresolved} main_tip_may_advance=true merge_executed=false deployment_executed=false"
          gh pr comment "$REQUEST_PR" --repo "$REPOSITORY" --body "$BODY" || echo "::warning::request evidence comment transport degraded"
          if [[ "$CONVERGENCE_OUTCOME" == success ]]; then
            gh pr close "$REQUEST_PR" --repo "$REPOSITORY" || echo "::warning::request surface cleanup degraded"
          fi

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Governed immutable Production release-cut convergence

          - outcome: \`${{ steps.converge.outcome }}\`
          - release cut: \`${{ steps.converge.outputs.main_sha || steps.source.outputs.release_cut_sha }}\`
          - current main: \`${{ steps.converge.outputs.current_main_sha || steps.source.outputs.current_main_sha }}\`
          - Production: \`${{ steps.converge.outputs.production_sha || steps.source.outputs.production_sha }}\`
          - candidate: \`${{ steps.converge.outputs.candidate_sha }}\`
          - certified validation run: \`${{ steps.converge.outputs.exact_run_id }}\`
          - release PR: \`${{ steps.converge.outputs.release_pr }}\`
          - main tip may advance: \`true\`
          - Production must remain stable: \`true\`
          - merge executed: false
          - deployment executed: false
          EOF
