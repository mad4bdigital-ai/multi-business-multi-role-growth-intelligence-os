name: X0 Test Manifest Registration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "http-generic-api/scripts/apply-x0-test-manifest-registration.mjs"
      - "http-generic-api/governedExecutionBaselineTelemetry.js"
      - "http-generic-api/test-governed-execution-baseline-telemetry.mjs"
      - "http-generic-api/test-governed-execution-baseline-benchmark.mjs"
      - "http-generic-api/scripts/governed-execution-baseline-benchmark.mjs"
      - ".github/workflows/x0-test-manifest-registration.yml"

permissions:
  contents: read

concurrency:
  group: x0-test-manifest-registration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  register:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/spec-011-x0-governed-execution-baseline-20260730' &&
      github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact governed PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Apply exact manifest registration
        working-directory: http-generic-api
        run: node scripts/apply-x0-test-manifest-registration.mjs

      - name: Verify X0 contracts
        working-directory: http-generic-api
        run: |
          node --check governedExecutionBaselineTelemetry.js
          node test-governed-execution-baseline-telemetry.mjs
          node test-governed-execution-baseline-benchmark.mjs
          node scripts/governed-execution-baseline-benchmark.mjs > "$RUNNER_TEMP/x0-benchmark.json"
          node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!r.ok||!r.legacy_result_unchanged||r.production_database_touched||r.provider_call_made||r.external_send_made||r.secrets_included){process.exit(1)}' "$RUNNER_TEMP/x0-benchmark.json"

      - name: Enforce exact write set
        shell: bash
        run: |
          mapfile -t CHANGED < <(git status --porcelain --untracked-files=all | sed -E 's/^...//')
          if [[ ${#CHANGED[@]} -ne 1 || "${CHANGED[0]}" != "http-generic-api/scripts/test-manifest.mjs" ]]; then
            echo "::error::Registration must change exactly the complete test manifest"
            printf '%s\n' "${CHANGED[@]}"
            exit 1
          fi

      - name: Commit complete manifest registration
        shell: bash
        env:
          TARGET_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add http-generic-api/scripts/test-manifest.mjs
          git commit -m "test(x0): register governed execution baseline suites"
          git push origin "HEAD:${TARGET_REF}"
