name: Staging Recovery External Evidence Acquisition

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main SHA deployed to Staging
        required: true
        type: string
      expected_target_fingerprint:
        description: Exact Staging Recovery target fingerprint
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-recovery-external-acquisition-${{ inputs.expected_sha }}-${{ inputs.expected_target_fingerprint }}
  cancel-in-progress: false

jobs:
  acquire:
    name: Acquire bounded Staging external evidence
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging-recovery-acquisition
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      EXPECTED_TARGET_FINGERPRINT: ${{ inputs.expected_target_fingerprint }}
      BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}

    steps:
      - name: Validate exact bounded inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::expected_sha must be a lowercase 40-character SHA."
            exit 1
          }
          [[ "$EXPECTED_TARGET_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::expected_target_fingerprint must be a 64-character SHA-256 fingerprint."
            exit 1
          }
          test -n "$BACKEND_API_KEY"

      - name: Checkout exact Staging main candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact main workflow authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install verifier dependencies
        working-directory: http-generic-api
        run: npm ci --ignore-scripts

      - name: Acquire independent same-request network evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/staging-recovery-acquisition"
          node http-generic-api/scripts/staging-recovery-acquire-network-evidence.mjs             --expected-sha "$EXPECTED_SHA"             --target-fingerprint "$EXPECTED_TARGET_FINGERPRINT"             --output "$RUNNER_TEMP/staging-recovery-acquisition/network-evidence.json"

      - name: Verify network acquisition source
        shell: bash
        run: |
          set -euo pipefail
          NETWORK_FILE="$RUNNER_TEMP/staging-recovery-acquisition/network-evidence.json"           node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { verifyRecoveryNetworkIsolationSource } from "./http-generic-api/stagingRecoveryExternalEvidence.js";
          const evidence = JSON.parse(fs.readFileSync(process.env.NETWORK_FILE, "utf8"));
          const result = verifyRecoveryNetworkIsolationSource(evidence, {
            expectedSha: process.env.EXPECTED_SHA,
            expectedTargetFingerprint: process.env.EXPECTED_TARGET_FINGERPRINT,
          });
          if (!result.verified) throw new Error(result.reason_code || "network source verification failed");
          NODE

      - name: Record PR-B1 acquisition blockers
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$RUNNER_TEMP/staging-recovery-acquisition/acquisition-status.json"           node --input-type=module <<'NODE'
          import fs from "node:fs";
          const status = {
            contract: "mad4b.recovery-external-acquisition-status.v1",
            environment: "staging",
            deployment_sha: process.env.EXPECTED_SHA,
            target_fingerprint: process.env.EXPECTED_TARGET_FINGERPRINT,
            network_source_verified: true,
            oauth_server_correlation_source_available: false,
            registration_source_attestation_available: false,
            receipt_signed: false,
            blockers: [
              {
                kind: "oauth",
                reason_code: "RECOVERY_OAUTH_SERVER_CORRELATION_SOURCE_UNAVAILABLE",
              },
              {
                kind: "registration",
                reason_code: "RECOVERY_REGISTRATION_SOURCE_ATTESTATION_UNAVAILABLE",
              },
            ],
            provider_mutation_performed: false,
            database_mutation_performed: false,
            production_mutation_performed: false,
            secrets_included: false,
          };
          fs.writeFileSync(process.env.OUTPUT, JSON.stringify(status, null, 2) + "\n", { mode: 0o600 });
          NODE

      - name: Enforce fail-closed PR-B1 hold
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .network_source_verified == true
            and .oauth_server_correlation_source_available == false
            and .registration_source_attestation_available == false
            and .receipt_signed == false
            and (.blockers | length) == 2
            and .provider_mutation_performed == false
            and .database_mutation_performed == false
            and .production_mutation_performed == false
            and .secrets_included == false
          ' "$RUNNER_TEMP/staging-recovery-acquisition/acquisition-status.json" >/dev/null
          test ! -e "$RUNNER_TEMP/staging-recovery-acquisition/acquisition-receipt.json"

      - name: Upload bounded acquisition evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-recovery-external-acquisition-${{ inputs.expected_sha }}-${{ inputs.expected_target_fingerprint }}
          path: ${{ runner.temp }}/staging-recovery-acquisition/
          if-no-files-found: error
          retention-days: 7

      - name: Publish acquisition summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Staging Recovery external acquisition — PR-B1"
            echo
            echo "- Exact SHA: $EXPECTED_SHA"
            echo "- Target fingerprint: $EXPECTED_TARGET_FINGERPRINT"
            echo "- Network source: independently probed"
            echo "- OAuth server correlation source: unavailable in PR-B1"
            echo "- Registration source attestation: unavailable in PR-B1"
            echo "- Acquisition receipt signed: no"
            echo "- Production/provider/database mutation: none"
          } >> "$GITHUB_STEP_SUMMARY"
