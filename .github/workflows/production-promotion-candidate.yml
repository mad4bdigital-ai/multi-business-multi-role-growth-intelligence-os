name: Governed Production Promotion Candidate

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact authorized main release-cut SHA
        required: true
        type: string
      expected_head_sha:
        description: Exact trusted workflow-source SHA; may be the release cut or a tree-identical governed request head
        required: true
        type: string
      expected_production_sha:
        description: Exact Production SHA that must already be contained by the release cut
        required: true
        type: string
      release_branch:
        description: Non-protected branch for the Production release candidate
        required: true
        type: string
      validation_branch:
        description: Non-protected branch for certified release-cut validation
        required: true
        type: string
      validation_base_branch:
        description: Immutable validation base branch pinned to the release cut
        required: true
        type: string
      create_pull_requests:
        description: Create or update release and validation PRs
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: governed-production-promotion-candidate-${{ inputs.expected_main_sha }}-${{ inputs.expected_production_sha }}
  cancel-in-progress: false

jobs:
  prepare-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      main_sha: ${{ steps.prepare.outputs.release_cut_sha }}
      release_cut_sha: ${{ steps.prepare.outputs.release_cut_sha }}
      current_main_sha: ${{ steps.prepare.outputs.current_main_sha }}
      production_sha: ${{ steps.prepare.outputs.production_sha }}
      candidate_sha: ${{ steps.prepare.outputs.candidate_sha }}
      candidate_tree: ${{ steps.prepare.outputs.candidate_tree }}
      release_branch: ${{ steps.prepare.outputs.release_branch }}
      validation_branch: ${{ steps.prepare.outputs.validation_branch }}
      validation_base_branch: ${{ steps.prepare.outputs.validation_base_branch }}
      candidate_mode: ${{ steps.prepare.outputs.candidate_mode }}
    steps:
      - name: Require trusted promotion review-surface identity
        env:
          REPO_AUTOSYNC_TOKEN_PRESENT: ${{ secrets.REPO_AUTOSYNC_TOKEN != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$REPO_AUTOSYNC_TOKEN_PRESENT" != "true" ]]; then
            echo "::error::REPO_AUTOSYNC_TOKEN is required before constructing Production promotion review surfaces."
            exit 1
          fi

      - name: Checkout exact trusted workflow source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.expected_head_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare immutable release-cut candidate
        id: prepare
        shell: bash
        env:
          RELEASE_CUT_SHA: ${{ inputs.expected_main_sha }}
          TRUSTED_WORKFLOW_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_PRODUCTION_SHA: ${{ inputs.expected_production_sha }}
          RELEASE_BRANCH: ${{ inputs.release_branch }}
          VALIDATION_BRANCH: ${{ inputs.validation_branch }}
          VALIDATION_BASE_BRANCH: ${{ inputs.validation_base_branch }}
        run: |
          set -Eeuo pipefail

          require_sha() {
            local label="$1"
            local value="$2"
            [[ "$value" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::$label must be an exact lowercase 40-character SHA"; exit 1; }
          }

          require_branch() {
            local label="$1"
            local value="$2"
            git check-ref-format --branch "$value" >/dev/null 2>&1 || { echo "::error::$label is not a valid Git branch name"; exit 1; }
            case "$value" in
              main|main/*|Production|Production/*|refs/*)
                echo "::error::$label must not target a protected branch or full ref"
                exit 1
                ;;
            esac
          }

          require_sha RELEASE_CUT_SHA "$RELEASE_CUT_SHA"
          require_sha TRUSTED_WORKFLOW_SHA "$TRUSTED_WORKFLOW_SHA"
          require_sha EXPECTED_PRODUCTION_SHA "$EXPECTED_PRODUCTION_SHA"
          require_branch RELEASE_BRANCH "$RELEASE_BRANCH"
          require_branch VALIDATION_BRANCH "$VALIDATION_BRANCH"
          require_branch VALIDATION_BASE_BRANCH "$VALIDATION_BASE_BRANCH"

          [[ "$RELEASE_BRANCH" != "$VALIDATION_BRANCH" && "$RELEASE_BRANCH" != "$VALIDATION_BASE_BRANCH" && "$VALIDATION_BRANCH" != "$VALIDATION_BASE_BRANCH" ]] || {
            echo "::error::release, validation, and validation-base branches must be distinct"
            exit 1
          }

          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          [[ "$CHECKED_OUT_SHA" == "$TRUSTED_WORKFLOW_SHA" ]] || { echo "::error::trusted workflow checkout mismatch"; exit 1; }
          git cat-file -e "${RELEASE_CUT_SHA}^{commit}"
          git merge-base --is-ancestor "$RELEASE_CUT_SHA" "$TRUSTED_WORKFLOW_SHA" || {
            echo "::error::trusted workflow source must contain the authorized release cut"
            exit 1
          }
          git diff --quiet "$RELEASE_CUT_SHA" "$TRUSTED_WORKFLOW_SHA" || {
            echo "::error::trusted workflow source must be tree-identical to the authorized release cut"
            exit 1
          }

          git fetch --prune --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/Production:refs/remotes/origin/Production'
          CURRENT_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          ACTUAL_PRODUCTION_SHA="$(git rev-parse refs/remotes/origin/Production)"
          require_sha CURRENT_MAIN_SHA "$CURRENT_MAIN_SHA"
          require_sha ACTUAL_PRODUCTION_SHA "$ACTUAL_PRODUCTION_SHA"

          git merge-base --is-ancestor "$RELEASE_CUT_SHA" "$CURRENT_MAIN_SHA" || {
            echo "::error::authorized release cut is no longer an ancestor of current main"
            exit 1
          }
          [[ "$ACTUAL_PRODUCTION_SHA" == "$EXPECTED_PRODUCTION_SHA" ]] || {
            echo "::error::Production moved before candidate construction: expected=$EXPECTED_PRODUCTION_SHA actual=$ACTUAL_PRODUCTION_SHA"
            exit 1
          }
          git merge-base --is-ancestor "$ACTUAL_PRODUCTION_SHA" "$RELEASE_CUT_SHA" || {
            echo "::error::current Production contains commits not present in the authorized release cut"
            exit 1
          }

          PREVIOUS_RELEASE=""
          git fetch --no-tags origin "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}" 2>/dev/null || true
          if git show-ref --verify --quiet "refs/remotes/origin/$RELEASE_BRANCH"; then
            PREVIOUS_RELEASE="$(git rev-parse "refs/remotes/origin/$RELEASE_BRANCH")"
          fi

          RELEASE_TREE="$(git rev-parse "${RELEASE_CUT_SHA}^{tree}")"
          CANDIDATE_SHA=""
          CANDIDATE_MODE="created"
          if [[ -n "$PREVIOUS_RELEASE" ]] \
            && [[ "$(git rev-parse "${PREVIOUS_RELEASE}^1" 2>/dev/null || true)" == "$RELEASE_CUT_SHA" ]] \
            && git merge-base --is-ancestor "$ACTUAL_PRODUCTION_SHA" "$PREVIOUS_RELEASE" \
            && git diff --quiet "$RELEASE_CUT_SHA" "$PREVIOUS_RELEASE"; then
            CANDIDATE_SHA="$PREVIOUS_RELEASE"
            CANDIDATE_MODE="reused"
          else
            if [[ -n "$PREVIOUS_RELEASE" ]]; then
              echo "::error::existing release branch is not the exact reusable release-cut candidate; refusing history rewrite"
              exit 1
            fi
            CANDIDATE_DATE="$(git show -s --format=%cI "$RELEASE_CUT_SHA")"
            CANDIDATE_SHA="$(
              printf '%s\n\n%s\n%s\n%s\n%s\n' \
                'release: build governed immutable Production release cut' \
                "release_cut=$RELEASE_CUT_SHA" \
                "main_at_build=$CURRENT_MAIN_SHA" \
                "production=$ACTUAL_PRODUCTION_SHA" \
                'tree_policy=exact_release_cut_tree' |
              GIT_AUTHOR_NAME='mad4b-release-bot' \
              GIT_AUTHOR_EMAIL='mad4b-release-bot@users.noreply.github.com' \
              GIT_AUTHOR_DATE="$CANDIDATE_DATE" \
              GIT_COMMITTER_NAME='mad4b-release-bot' \
              GIT_COMMITTER_EMAIL='mad4b-release-bot@users.noreply.github.com' \
              GIT_COMMITTER_DATE="$CANDIDATE_DATE" \
              git commit-tree "$RELEASE_TREE" -p "$RELEASE_CUT_SHA" -p "$ACTUAL_PRODUCTION_SHA"
            )"
          fi

          [[ "$(git rev-parse "${CANDIDATE_SHA}^1")" == "$RELEASE_CUT_SHA" ]] || { echo "::error::candidate first parent is not the release cut"; exit 1; }
          git diff --quiet "$RELEASE_CUT_SHA" "$CANDIDATE_SHA" || { echo "::error::candidate tree differs from release cut"; exit 1; }
          git merge-base --is-ancestor "$RELEASE_CUT_SHA" "$CANDIDATE_SHA" || { echo "::error::candidate does not contain release cut"; exit 1; }
          git merge-base --is-ancestor "$ACTUAL_PRODUCTION_SHA" "$CANDIDATE_SHA" || { echo "::error::candidate does not contain pinned Production"; exit 1; }

          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/Production:refs/remotes/origin/Production'
          MAIN_READBACK="$(git rev-parse refs/remotes/origin/main)"
          PRODUCTION_READBACK="$(git rev-parse refs/remotes/origin/Production)"
          [[ "$PRODUCTION_READBACK" == "$ACTUAL_PRODUCTION_SHA" ]] || { echo "::error::Production moved during candidate construction"; exit 1; }
          git merge-base --is-ancestor "$RELEASE_CUT_SHA" "$MAIN_READBACK" || { echo "::error::main no longer contains the release cut"; exit 1; }
          git merge-base --is-ancestor "$PRODUCTION_READBACK" "$RELEASE_CUT_SHA" || { echo "::error::Production is no longer contained by the release cut"; exit 1; }

          push_fast_forward_only() {
            local branch="$1"
            local target_sha="$2"
            local remote_head=""
            remote_head="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
            if [[ "$remote_head" == "$target_sha" ]]; then return 0; fi
            if [[ -n "$remote_head" ]] && ! git merge-base --is-ancestor "$remote_head" "$target_sha"; then
              echo "::error::$branch cannot move by fast-forward to $target_sha"
              exit 1
            fi
            git push origin "$target_sha:refs/heads/$branch"
          }

          push_fast_forward_only "$VALIDATION_BASE_BRANCH" "$RELEASE_CUT_SHA"
          push_fast_forward_only "$RELEASE_BRANCH" "$CANDIDATE_SHA"
          push_fast_forward_only "$VALIDATION_BRANCH" "$CANDIDATE_SHA"

          RELEASE_READBACK="$(git ls-remote --heads origin "refs/heads/$RELEASE_BRANCH" | awk '{print $1}')"
          VALIDATION_READBACK="$(git ls-remote --heads origin "refs/heads/$VALIDATION_BRANCH" | awk '{print $1}')"
          VALIDATION_BASE_READBACK="$(git ls-remote --heads origin "refs/heads/$VALIDATION_BASE_BRANCH" | awk '{print $1}')"
          [[ "$RELEASE_READBACK" == "$CANDIDATE_SHA" && "$VALIDATION_READBACK" == "$CANDIDATE_SHA" && "$VALIDATION_BASE_READBACK" == "$RELEASE_CUT_SHA" ]] || {
            echo "::error::candidate branch readback mismatch"
            exit 1
          }

          CANDIDATE_TREE="$(git rev-parse "${CANDIDATE_SHA}^{tree}")"
          {
            echo "release_cut_sha=$RELEASE_CUT_SHA"
            echo "current_main_sha=$MAIN_READBACK"
            echo "production_sha=$ACTUAL_PRODUCTION_SHA"
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "candidate_tree=$CANDIDATE_TREE"
            echo "release_branch=$RELEASE_BRANCH"
            echo "validation_branch=$VALIDATION_BRANCH"
            echo "validation_base_branch=$VALIDATION_BASE_BRANCH"
            echo "candidate_mode=$CANDIDATE_MODE"
          } >> "$GITHUB_OUTPUT"

          jq -n \
            --arg release_cut_sha "$RELEASE_CUT_SHA" \
            --arg main_sha "$MAIN_READBACK" \
            --arg production_sha "$ACTUAL_PRODUCTION_SHA" \
            --arg candidate_sha "$CANDIDATE_SHA" \
            --arg candidate_tree "$CANDIDATE_TREE" \
            --arg release_branch "$RELEASE_BRANCH" \
            --arg validation_branch "$VALIDATION_BRANCH" \
            --arg validation_base_branch "$VALIDATION_BASE_BRANCH" \
            --arg candidate_mode "$CANDIDATE_MODE" \
            '{schema_version:"production_promotion_candidate.v3",ok:true,release_mode:"certified_release_cut",release_cut_sha:$release_cut_sha,current_main_sha:$main_sha,production_sha:$ACTUAL_PRODUCTION_SHA,candidate_sha:$candidate_sha,candidate_tree:$candidate_tree,release_branch:$release_branch,validation_branch:$validation_branch,validation_base_branch:$validation_base_branch,candidate_mode:$candidate_mode,tree_policy:"exact_release_cut_tree",main_tip_may_advance:true,production_must_remain_stable:true,merge_executed:false,deployment_executed:false,migration_executed:false,provider_call_executed:false,credential_payload_read:false,secrets_included:false}' \
            > "$RUNNER_TEMP/production-promotion-candidate.json"

      - name: Upload candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-promotion-candidate-${{ steps.prepare.outputs.candidate_sha }}
          path: ${{ runner.temp }}/production-promotion-candidate.json
          if-no-files-found: error
          retention-days: 30

      - name: Create or update governed pull requests
        if: ${{ inputs.create_pull_requests }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REPO_AUTOSYNC_TOKEN }}
          RELEASE_CUT_SHA: ${{ steps.prepare.outputs.release_cut_sha }}
          CURRENT_MAIN_SHA: ${{ steps.prepare.outputs.current_main_sha }}
          PRODUCTION_SHA: ${{ steps.prepare.outputs.production_sha }}
          CANDIDATE_SHA: ${{ steps.prepare.outputs.candidate_sha }}
          RELEASE_BRANCH: ${{ steps.prepare.outputs.release_branch }}
          VALIDATION_BRANCH: ${{ steps.prepare.outputs.validation_branch }}
          VALIDATION_BASE_BRANCH: ${{ steps.prepare.outputs.validation_base_branch }}
        run: |
          set -Eeuo pipefail

          cat > "$RUNNER_TEMP/release-pr.md" <<EOF
          ## Governed immutable Production release cut

          - release cut: \`$RELEASE_CUT_SHA\`
          - pinned main: \`$RELEASE_CUT_SHA\`
          - current main at candidate build: \`$CURRENT_MAIN_SHA\`
          - pinned Production: \`$PRODUCTION_SHA\`
          - exact candidate: \`$CANDIDATE_SHA\`
          - validation base: \`$VALIDATION_BASE_BRANCH\`
          - tree policy: exact release-cut tree
          - release_cut_mode: true
          - main_tip_may_advance: true
          - governed_promotion_candidate: true

          The release remains valid if main advances only by descendants of the certified release cut. Production must remain exactly pinned, and the candidate tree must remain byte-equivalent to the release cut.

          This PR promotes Git ancestry only. It does not authorize deployment, SQL, migrations, grants, provider calls, credential reads, restarts, or external writes. Merge remains separately authorized.
          EOF

          cat > "$RUNNER_TEMP/validation-pr.md" <<EOF
          Certified immutable release-cut validation surface for \`$CANDIDATE_SHA\`.

          Candidate first parent and validation base are pinned to release cut \`$RELEASE_CUT_SHA\`. Candidate tree must remain identical to that cut. Current main may advance only while retaining the cut as an ancestor; Production must remain \`$PRODUCTION_SHA\`.

          Close without merge after evidence readback. No deployment, migration, grant, provider mutation, credential read, or Production mutation is authorized.
          EOF

          upsert_pr() {
            local head="$1" base="$2" title="$3" body_file="$4"
            local existing=""
            existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$head" --base "$base" --limit 1 --json number --jq '.[0].number // empty')"
            if [[ -n "$existing" ]]; then
              gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" --base "$base" --title "$title" --body-file "$body_file"
            else
              gh pr create --repo "$GITHUB_REPOSITORY" --head "$head" --base "$base" --title "$title" --body-file "$body_file"
            fi
          }

          upsert_pr "$RELEASE_BRANCH" Production "release: promote pinned main ${RELEASE_CUT_SHA:0:8} to Production" "$RUNNER_TEMP/release-pr.md"
          upsert_pr "$VALIDATION_BRANCH" "$VALIDATION_BASE_BRANCH" "test(release): certify immutable Production candidate ${CANDIDATE_SHA:0:8}" "$RUNNER_TEMP/validation-pr.md"

      - name: Publish summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Immutable Production release cut prepared

          - release cut: \`${{ steps.prepare.outputs.release_cut_sha }}\`
          - current main: \`${{ steps.prepare.outputs.current_main_sha }}\`
          - Production: \`${{ steps.prepare.outputs.production_sha }}\`
          - candidate: \`${{ steps.prepare.outputs.candidate_sha }}\`
          - candidate mode: \`${{ steps.prepare.outputs.candidate_mode }}\`
          - main tip may advance: \`true\`
          - Production must remain stable: \`true\`
          - merge executed: false
          - deployment executed: false
          - secrets included: false
          EOF