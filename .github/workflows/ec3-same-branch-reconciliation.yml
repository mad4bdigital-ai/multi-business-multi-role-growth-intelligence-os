name: EC3 Same-Branch Reconciliation

on:
  push:
    branches:
      - gpt/spec-012-ec3-read-dispatch-gate-20260730

permissions:
  contents: write

concurrency:
  group: ec3-same-branch-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out reconciled EC3 branch
        uses: actions/checkout@v5
        with:
          ref: gpt/spec-012-ec3-read-dispatch-gate-20260730
          fetch-depth: 0

      - name: Register EC3 test exactly once
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('http-generic-api/scripts/test-manifest.mjs')
          text = path.read_text()
          entry = '  "node test-execution-capsule-read-dispatch-gate.mjs",\n'
          anchor = '  "node test-execution-capsule-selected-read-pilot.mjs",\n'
          count = text.count(entry)
          if count > 1:
              raise SystemExit(f'EC3 command registration count is {count}, expected at most one')
          if count == 0:
              if text.count(anchor) != 1:
                  raise SystemExit('canonical EC2 registration anchor is not unique')
              text = text.replace(anchor, anchor + entry, 1)
              path.write_text(text)
          if path.read_text().count(entry) != 1:
              raise SystemExit('EC3 command registration count is not exactly one')
          PY

      - name: Run bounded EC0 through EC3 regressions
        working-directory: http-generic-api
        run: |
          node test-execution-capsule-contract.mjs
          node test-execution-capsule-shadow-adapter.mjs
          node test-execution-capsule-shadow-composition.mjs
          node test-execution-capsule-selected-read-pilot.mjs
          node test-execution-capsule-read-dispatch-gate.mjs
          node test-context-kernel-api-projection.mjs

      - name: Remove one-shot workflow and verify write set
        run: |
          rm .github/workflows/ec3-same-branch-reconciliation.yml
          python - <<'PY'
          import subprocess

          changed = sorted(subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True
          ).splitlines())
          expected = sorted([
              '.github/workflows/ec3-same-branch-reconciliation.yml',
              'http-generic-api/scripts/test-manifest.mjs',
          ])
          if changed != expected:
              raise SystemExit(f'unexpected write set: {changed}')
          PY

      - name: Commit same-branch reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ec3-same-branch-reconciliation.yml \
            http-generic-api/scripts/test-manifest.mjs
          git commit -m "test(spec-012): reconcile EC3 registration on current main"
          git push origin HEAD:gpt/spec-012-ec3-read-dispatch-gate-20260730
