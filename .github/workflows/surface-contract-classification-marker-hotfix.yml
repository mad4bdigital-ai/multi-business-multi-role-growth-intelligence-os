name: Surface Contract Classification Marker Hotfix

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: surface-contract-classification-marker-hotfix
  cancel-in-progress: false

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'gpt/surface-contract-classification-hardening-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout governed Surface branch
        uses: actions/checkout@v5
        with:
          ref: gpt/surface-contract-classification-hardening-20260730
          fetch-depth: 0
          persist-credentials: true

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Patch standalone safety marker parser structurally
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('http-generic-api/scripts/surface-contract-discovery.mjs')
          source = path.read_text(encoding='utf-8')
          old = r'''    `(?:^|\\r?\\n)\\s*(?:--|#|\\/\\*+|\\*)\\s*${token}\\s*(?:\\*\\/)?\\s*(?=\\r?\\n|$)`,'''
          new = r'''    `(?:^|\\r?\\n)\\s*(?:--|#|\\/\\*+|\\*)\\s*(?:[-*]\\s*)?${token}\\s*(?:\\*\\/)?\\s*(?=\\r?\\n|$)`,'''

          if new in source:
              print('standalone safety marker parser already supports bullets')
          else:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'safety_marker_parser_anchor_count:{count}')
              source = source.replace(old, new, 1)
              path.write_text(source, encoding='utf-8')
          PY

      - name: Verify parser behavior
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/surface-contract-discovery.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { detectSafetyMarkers } from './scripts/surface-contract-discovery.mjs';
          const result = detectSafetyMarkers(`
          -- - no_provider_call
          -- * no_credential_payload_read
          -- - no_raw_secrets
          -- * no_external_send
          -- - no_external_write
          -- * secrets_included_false
          `);
          assert(Object.values(result).every(Boolean));
          console.log({ bulleted_surface_safety_markers: true, secrets_included: false });
          NODE

      - name: Commit bounded hotfix and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/surface-contract-classification-marker-hotfix.yml
          git add http-generic-api/scripts/surface-contract-discovery.mjs
          python3 <<'PY'
          import subprocess
          expected = {
              '.github/workflows/surface-contract-classification-marker-hotfix.yml',
              'http-generic-api/scripts/surface-contract-discovery.mjs',
          }
          changed = set(filter(None, subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()))
          if changed != expected:
              raise SystemExit(f'bounded_write_set_mismatch:expected={sorted(expected)}:actual={sorted(changed)}')
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: support bulleted Surface safety markers'
          git push origin HEAD:gpt/surface-contract-classification-hardening-20260730
