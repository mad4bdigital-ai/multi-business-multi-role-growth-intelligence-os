name: Dynamic Container Finalize

on:
  push:
    branches:
      - gpt/dynamic-container-authority-foundation-20260619
    paths:
      - .github/workflows/dca-finalize.yml

permissions:
  contents: write

concurrency:
  group: dynamic-container-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gpt/dynamic-container-authority-foundation-20260619
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Merge current main with generated-file-only conflict policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dynamic-container-finalizer[bot]"
          git config user.email "dynamic-container-finalizer[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_code=$?
          set -e
          if [ "$merge_code" -ne 0 ]; then
            mapfile -t unresolved < <(git diff --name-only --diff-filter=U)
            if [ "${#unresolved[@]}" -ne 1 ] || [ "${unresolved[0]}" != "docs/repo-maintenance-status.md" ]; then
              printf 'Unexpected merge conflicts:\n%s\n' "${unresolved[*]}" >&2
              exit 1
            fi
            git checkout --theirs -- docs/repo-maintenance-status.md
            git add docs/repo-maintenance-status.md
          fi
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved merge conflicts remain." >&2
            exit 1
          fi
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m "Merge latest main into Dynamic Container Authority branch"
          fi

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Regenerate deterministic maintenance artifacts
        working-directory: http-generic-api
        run: node scripts/repo-maintenance-sync.mjs --write

      - name: Enforce generated-only mutation boundary and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/dca-finalize.yml
          mapfile -t changed < <(git status --porcelain=v1 | sed 's/^...//')
          for file in "${changed[@]}"; do
            case "$file" in
              ".github/workflows/dca-finalize.yml"|\
              "Updating Registry Patch Index.md"|\
              "deployment_parity_checklist.md"|\
              "docs/ai-docs-agent-governance.md"|\
              "docs/auto-docs-agent/README.md"|\
              "docs/change-documentation-governance.md"|\
              "docs/repo-maintenance-status.md"|\
              docs/surface-contract-*.json|\
              docs/surface-contract-*.md|\
              docs/work-maps/*)
                ;;
              *)
                echo "Unexpected generated mutation: $file" >&2
                exit 1
                ;;
            esac
          done
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate Dynamic Container maintenance artifacts"
          fi

      - name: Run full repository test manifest
        working-directory: http-generic-api
        run: npm test

      - name: Run architecture validation
        working-directory: http-generic-api
        run: npm run validate

      - name: Validate canonical generation
        run: |
          node build-canonicals.mjs --check
          node validate-canonical-sources.mjs

      - name: Verify deterministic maintenance state
        working-directory: http-generic-api
        run: node scripts/repo-maintenance-sync.mjs --check

      - name: Require clean tree
        run: git diff --exit-code && test -z "$(git status --porcelain)"

      - name: Push reconciled branch
        run: git push origin HEAD:gpt/dynamic-container-authority-foundation-20260619
