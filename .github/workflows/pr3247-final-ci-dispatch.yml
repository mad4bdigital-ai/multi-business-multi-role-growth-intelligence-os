name: PR 3247 final CI dispatch

on:
  pull_request:
    branches:
      - gpt/pr3247-ci-dispatch-base-20260730
    paths:
      - .github/workflows/pr3247-final-ci-dispatch.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch official CI on final helper branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_REF: gpt/pr3247-direct-current-main-ci-20260730
        shell: bash
        run: |
          set -euo pipefail
          started_epoch="$(date -u +%s)"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -d "{\"ref\":\"${TARGET_REF}\"}"

          for attempt in $(seq 1 30); do
            response="$(curl --fail-with-body --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/actions/workflows/ci.yml/runs?branch=${TARGET_REF}&event=workflow_dispatch&per_page=20")"
            run_id="$(jq -r --argjson started "${started_epoch}" '
              [.workflow_runs[] | select((.created_at | fromdateiso8601) >= $started)]
              | sort_by(.created_at)
              | reverse
              | .[0].id // empty
            ' <<<"${response}")"
            if [[ -n "${run_id}" ]]; then
              echo "DISPATCHED_CI_RUN_ID=${run_id}"
              echo "TARGET_REF=${TARGET_REF}"
              exit 0
            fi
            sleep 2
          done

          echo "Official CI dispatch was accepted but its run ID was not observed in time." >&2
          exit 1
