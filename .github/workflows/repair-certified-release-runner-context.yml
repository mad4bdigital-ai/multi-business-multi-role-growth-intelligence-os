name: Materialize Certified Release Repair Blobs

on:
  push:
    branches:
      - fix/certified-release-cut-runner-context-20260806

permissions:
  actions: read
  contents: write

concurrency:
  group: repair-certified-release-runner-context
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN_SHA: a55e30d340cd63917939f8264e2d5c9af8c7bd8b
      TARGET_BRANCH: fix/certified-release-cut-runner-context-20260806
      SOURCE_RUN_ID: "31080487142"
      SOURCE_ARTIFACT: certified-release-runner-context-payload-31080487142
    steps:
      - name: Checkout exact materialization head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable branch and main binding
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          [[ "$(git rev-parse refs/remotes/origin/main)" == "$EXPECTED_MAIN_SHA" ]]
          [[ "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" == "$GITHUB_SHA" ]]

      - name: Download validated source payload
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p payload
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ARTIFACT" \
            --dir payload

      - name: Verify payload hashes and contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s  %s\n' \
            '5a4c067e26aa60b36f0721578524e622af8b811691d0c1093bcd6dc116e65f5a' \
            'payload/.github/workflows/production-certified-release-cut-validation.yml' \
            'a4769b3e5b1b6272c9c1af91024664cb6bf8abf3c615a21d86d6254db9bb3dbb' \
            'payload/http-generic-api/test-production-certified-release-cut-validation-registration.mjs' \
            'a944d18ecf811df8120f555f9043ac725ae4f74a0177962745e67f430467ee57' \
            'payload/.changes/e2e/production-certified-release-cut-registration-context.json' \
            | sha256sum --check --strict

          node --check payload/http-generic-api/test-production-certified-release-cut-validation-registration.mjs
          node payload/http-generic-api/test-production-certified-release-cut-validation-registration.mjs
          python3 -m json.tool payload/.changes/e2e/production-certified-release-cut-registration-context.json >/dev/null
          ! grep -Eq '^      (EVIDENCE_PATH|CI_SUMMARY_PATH):.*runner\.temp' \
            payload/.github/workflows/production-certified-release-cut-validation.yml
          grep -Fq 'Initialize runner-local evidence paths' \
            payload/.github/workflows/production-certified-release-cut-validation.yml

      - name: Create detached Git blobs
        id: blobs
        shell: bash
        run: |
          set -Eeuo pipefail
          create_blob() {
            local path="$1"
            jq -n --arg content "$(base64 -w0 "$path")" \
              '{content: $content, encoding: "base64"}' \
              | gh api --method POST \
                  "repos/${GITHUB_REPOSITORY}/git/blobs" \
                  --input - \
                  --jq '.sha'
          }

          WORKFLOW_BLOB="$(create_blob payload/.github/workflows/production-certified-release-cut-validation.yml)"
          TEST_BLOB="$(create_blob payload/http-generic-api/test-production-certified-release-cut-validation-registration.mjs)"
          DECLARATION_BLOB="$(create_blob payload/.changes/e2e/production-certified-release-cut-registration-context.json)"

          for sha in "$WORKFLOW_BLOB" "$TEST_BLOB" "$DECLARATION_BLOB"; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          done

          {
            echo "workflow_blob=$WORKFLOW_BLOB"
            echo "test_blob=$TEST_BLOB"
            echo "declaration_blob=$DECLARATION_BLOB"
          } >> "$GITHUB_OUTPUT"

          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_run_id "$SOURCE_RUN_ID" \
            --arg source_artifact "$SOURCE_ARTIFACT" \
            --arg source_digest 'sha256:b8ca8b9c10b6d2265618d300b9c3045b1968bbfc8b5a27fe19e62a8d1064db4a' \
            --arg expected_main_sha "$EXPECTED_MAIN_SHA" \
            --arg expected_parent_sha "$GITHUB_SHA" \
            --arg workflow_blob "$WORKFLOW_BLOB" \
            --arg test_blob "$TEST_BLOB" \
            --arg declaration_blob "$DECLARATION_BLOB" \
            '{
              repository: $repository,
              source_run_id: $source_run_id,
              source_artifact: $source_artifact,
              source_digest: $source_digest,
              expected_main_sha: $expected_main_sha,
              expected_parent_sha: $expected_parent_sha,
              blobs: [
                {path: ".github/workflows/production-certified-release-cut-validation.yml", sha: $workflow_blob},
                {path: "http-generic-api/test-production-certified-release-cut-validation-registration.mjs", sha: $test_blob},
                {path: ".changes/e2e/production-certified-release-cut-registration-context.json", sha: $declaration_blob}
              ],
              delete_paths: [
                ".github/workflows/repair-certified-release-runner-context.yml",
                ".github/ops/certified-release-runner-context.trigger"
              ],
              ref_updated: false,
              production_mutated: false,
              secrets_included: false
            }' > certified-release-repair-blob-manifest.json

      - name: Upload detached blob manifest
        uses: actions/upload-artifact@v4
        with:
          name: certified-release-repair-blob-manifest-${{ github.run_id }}
          path: certified-release-repair-blob-manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify no ref mutation occurred
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          [[ "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" == "$GITHUB_SHA" ]]
          echo 'detached blobs created; no branch ref was updated by this workflow'
