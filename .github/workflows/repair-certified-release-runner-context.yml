name: Repair Certified Release Runner Context

on:
  push:
    branches:
      - fix/certified-release-cut-runner-context-20260806

permissions:
  contents: write

concurrency:
  group: repair-certified-release-runner-context
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_MAIN_SHA: a55e30d340cd63917939f8264e2d5c9af8c7bd8b
      TARGET_BRANCH: fix/certified-release-cut-runner-context-20260806
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable repair binding
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          [[ "$(git rev-parse refs/remotes/origin/main)" == "$EXPECTED_MAIN_SHA" ]]
          [[ "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" == "$GITHUB_SHA" ]]

      - name: Apply bounded registration-safe repair
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const workflowPath = '.github/workflows/production-certified-release-cut-validation.yml';
          const testPath = 'http-generic-api/test-production-certified-release-cut-validation-registration.mjs';
          const declarationPath = '.changes/e2e/production-certified-release-cut-registration-context.json';
          let source = fs.readFileSync(workflowPath, 'utf8');

          const badEvidence = /^      EVIDENCE_PATH: \$\{\{\s*runner\.temp\s*\}\}\/certified-production-release-cut\.json\n/m;
          const badSummary = /^      CI_SUMMARY_PATH: \$\{\{\s*runner\.temp\s*\}\}\/certified-release-ci\.json\n/m;
          if (!badEvidence.test(source) || !badSummary.test(source)) {
            throw new Error('expected job-level runner.temp bindings were not found exactly once');
          }
          source = source.replace(badEvidence, '').replace(badSummary, '');

          const anchor = '    steps:\n      - name: Require successful direct ARM CI gates\n';
          if (!source.includes(anchor)) {
            throw new Error('finalize steps anchor was not found');
          }
          const initialization = [
            '    steps:',
            '      - name: Initialize runner-local evidence paths',
            '        shell: bash',
            '        run: |',
            '          set -Eeuo pipefail',
            '          echo "EVIDENCE_PATH=\${RUNNER_TEMP}/certified-production-release-cut.json" >> "$GITHUB_ENV"',
            '          echo "CI_SUMMARY_PATH=\${RUNNER_TEMP}/certified-release-ci.json" >> "$GITHUB_ENV"',
            '',
            '      - name: Require successful direct ARM CI gates',
            ''
          ].join('\n');
          source = source.replace(anchor, initialization);
          fs.writeFileSync(workflowPath, source);

          const testSource = `import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const workflowUrl = new URL('../.github/workflows/production-certified-release-cut-validation.yml', import.meta.url);
          const workflow = fs.readFileSync(workflowUrl, 'utf8');
          const finalizeIndex = workflow.indexOf('\n  finalize:\n');
          assert.notEqual(finalizeIndex, -1, 'finalize job must exist');
          const finalize = workflow.slice(finalizeIndex);
          const envIndex = finalize.indexOf('\n    env:\n');
          const stepsIndex = finalize.indexOf('\n    steps:\n');
          assert.ok(envIndex >= 0 && stepsIndex > envIndex, 'finalize job env and steps must be ordered');
          const jobEnv = finalize.slice(envIndex, stepsIndex);

          assert.doesNotMatch(jobEnv, /\\$\\{\\{\\s*runner\\./, 'job-level env must not use runner context');
          assert.match(finalize, /- name: Initialize runner-local evidence paths/);
          assert.match(finalize, /EVIDENCE_PATH=\\$\\{RUNNER_TEMP\\}\\/certified-production-release-cut\\.json/);
          assert.match(finalize, /CI_SUMMARY_PATH=\\$\\{RUNNER_TEMP\\}\\/certified-release-ci\\.json/);
          assert.match(finalize, />> "\\$GITHUB_ENV"/);
          assert.match(workflow, /pull_request_target:/);
          assert.match(workflow, /name: Publish certified release-cut evidence/);

          console.log('production certified release-cut registration contract: pass');
          `;
          fs.writeFileSync(testPath, testSource.replace(/^          /gm, ''));

          const declaration = {
            '$schema': '../../.specify/schemas/e2e-phases.schema.json',
            schema_version: 1,
            feature_key: 'production-certified-release-cut-registration-context',
            title: 'Production certified release-cut registration context repair',
            delivery_mode: 'single_pr',
            current_phase: 'mvp',
            scope: {
              include: [declarationPath, workflowPath, testPath]
            },
            merge_contract: { minimum_phase: 'mvp' },
            phases: [
              {
                id: 'mvp',
                status: 'implemented',
                objective: 'Restore GitHub workflow registration by resolving runner-local evidence paths only after the runner starts.',
                e2e_journeys: [
                  {
                    id: 'register-and-run-certified-release-cut-validation',
                    end_to_end: true,
                    level: 'synthetic_runtime',
                    actor: 'GitHub Actions workflow registrar and certified release validator',
                    entrypoint: 'A trusted same-repository validation PR targets a governed certified-release base branch.',
                    terminal_outcome: 'The workflow registers jobs, initializes evidence paths from RUNNER_TEMP at step runtime, and preserves the existing immutable validation contract.',
                    steps: [
                      'Parse the workflow without evaluating runner context at job scope.',
                      'Allocate the finalize runner.',
                      'Export evidence file paths through GITHUB_ENV from RUNNER_TEMP.',
                      'Run the unchanged validation, evidence, and no-mutation checks.'
                    ],
                    assertions: [
                      'No finalize job-level environment value references runner context.',
                      'Both evidence paths are initialized in a runtime step.',
                      'The pull_request_target selector, direct ARM validation jobs, and immutable readback behavior remain unchanged.',
                      'No deployment, migration, provider call, credential payload read, or Production mutation is introduced.'
                    ],
                    tests: [
                      {
                        id: 'production-certified-release-cut-registration-contract',
                        runner: 'node',
                        working_directory: 'http-generic-api',
                        path: 'test-production-certified-release-cut-validation-registration.mjs',
                        args: []
                      }
                    ],
                    evidence_paths: [workflowPath, testPath]
                  }
                ]
              }
            ],
            secrets_included: false
          };
          fs.writeFileSync(declarationPath, `${JSON.stringify(declaration, null, 2)}\n`);
          NODE

          node http-generic-api/test-production-certified-release-cut-validation-registration.mjs
          git diff --check

      - name: Commit exact final scope and remove writer
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-certified-release-runner-context.yml
          git rm .github/ops/certified-release-runner-context.trigger
          git add \
            .github/workflows/production-certified-release-cut-validation.yml \
            http-generic-api/test-production-certified-release-cut-validation-registration.mjs \
            .changes/e2e/production-certified-release-cut-registration-context.json

          EXPECTED="$(printf '%s\n' \
            '.changes/e2e/production-certified-release-cut-registration-context.json' \
            '.github/workflows/production-certified-release-cut-validation.yml' \
            'http-generic-api/test-production-certified-release-cut-validation-registration.mjs' | sort)"
          ACTUAL="$(git diff --cached --name-only "$EXPECTED_MAIN_SHA" | sort)"
          [[ "$ACTUAL" == "$EXPECTED" ]] || {
            echo '::error::bounded repair scope mismatch'
            printf 'Expected:\n%s\nActual:\n%s\n' "$EXPECTED" "$ACTUAL"
            exit 1
          }

          git diff --cached --check
          git commit -m "fix(ci): resolve certified release paths at runner runtime"
          git push origin "HEAD:${TARGET_BRANCH}"
