name: Repair Certified Release Runner Context

on:
  push:
    branches:
      - fix/certified-release-cut-runner-context-20260806

permissions:
  contents: write

concurrency:
  group: repair-certified-release-runner-context
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_MAIN_SHA: a55e30d340cd63917939f8264e2d5c9af8c7bd8b
      TARGET_BRANCH: fix/certified-release-cut-runner-context-20260806
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable repair binding
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          [[ "$(git rev-parse refs/remotes/origin/main)" == "$EXPECTED_MAIN_SHA" ]]
          [[ "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" == "$GITHUB_SHA" ]]

      - name: Apply bounded registration-safe repair
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          workflow_path = Path('.github/workflows/production-certified-release-cut-validation.yml')
          test_path = Path('http-generic-api/test-production-certified-release-cut-validation-registration.mjs')
          declaration_path = Path('.changes/e2e/production-certified-release-cut-registration-context.json')

          source = workflow_path.read_text()
          lines = source.splitlines()
          evidence_lines = [line for line in lines if line.strip().startswith('EVIDENCE_PATH:') and 'runner.temp' in line]
          summary_lines = [line for line in lines if line.strip().startswith('CI_SUMMARY_PATH:') and 'runner.temp' in line]
          if len(evidence_lines) != 1 or len(summary_lines) != 1:
              raise SystemExit(f'expected one unsafe binding each; evidence={len(evidence_lines)} summary={len(summary_lines)}')

          lines = [line for line in lines if line not in evidence_lines and line not in summary_lines]
          finalize_index = lines.index('  finalize:')
          steps_index = next(index for index in range(finalize_index + 1, len(lines)) if lines[index] == '    steps:')
          initialization = [
              '      - name: Initialize runner-local evidence paths',
              '        shell: bash',
              '        run: |',
              '          set -Eeuo pipefail',
              '          echo "EVIDENCE_PATH=${RUNNER_TEMP}/certified-production-release-cut.json" >> "$GITHUB_ENV"',
              '          echo "CI_SUMMARY_PATH=${RUNNER_TEMP}/certified-release-ci.json" >> "$GITHUB_ENV"',
              ''
          ]
          lines[steps_index + 1:steps_index + 1] = initialization
          workflow_path.write_text('\n'.join(lines) + '\n')

          test_path.write_text("""import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const workflowUrl = new URL('../.github/workflows/production-certified-release-cut-validation.yml', import.meta.url);
          const workflow = fs.readFileSync(workflowUrl, 'utf8');
          const finalizeIndex = workflow.indexOf('  finalize:');
          assert.notEqual(finalizeIndex, -1, 'finalize job must exist');
          const finalize = workflow.slice(finalizeIndex);
          const envIndex = finalize.indexOf('    env:');
          const stepsIndex = finalize.indexOf('    steps:');
          assert.ok(envIndex >= 0 && stepsIndex > envIndex, 'finalize env must precede steps');
          const jobEnv = finalize.slice(envIndex, stepsIndex);

          assert.equal(jobEnv.includes('runner.'), false, 'job-level env must not use runner context');
          assert.ok(finalize.includes('- name: Initialize runner-local evidence paths'));
          assert.ok(finalize.includes('echo "EVIDENCE_PATH=${RUNNER_TEMP}/certified-production-release-cut.json" >> "$GITHUB_ENV"'));
          assert.ok(finalize.includes('echo "CI_SUMMARY_PATH=${RUNNER_TEMP}/certified-release-ci.json" >> "$GITHUB_ENV"'));
          assert.ok(workflow.includes('pull_request_target:'));
          assert.ok(finalize.includes('name: Publish certified release-cut evidence'));
          assert.ok(finalize.includes('- name: Require successful direct ARM CI gates'));

          console.log('production certified release-cut registration contract: pass');
          """.replace('          ', ''))

          declaration = {
              '$schema': '../../.specify/schemas/e2e-phases.schema.json',
              'schema_version': 1,
              'feature_key': 'production-certified-release-cut-registration-context',
              'title': 'Production certified release-cut registration context repair',
              'delivery_mode': 'single_pr',
              'current_phase': 'mvp',
              'scope': {'include': [str(declaration_path), str(workflow_path), str(test_path)]},
              'merge_contract': {'minimum_phase': 'mvp'},
              'phases': [
                  {
                      'id': 'mvp',
                      'status': 'implemented',
                      'objective': 'Restore workflow registration by resolving runner-local evidence paths only after runner allocation.',
                      'e2e_journeys': [
                          {
                              'id': 'register-and-run-certified-release-cut-validation',
                              'end_to_end': True,
                              'level': 'synthetic_runtime',
                              'actor': 'GitHub Actions workflow registrar and certified release validator',
                              'entrypoint': 'A trusted same-repository validation pull request targets a governed certified-release base branch.',
                              'terminal_outcome': 'The workflow registers jobs, initializes evidence paths from RUNNER_TEMP at step runtime, and preserves the immutable validation contract.',
                              'steps': [
                                  'Parse the workflow without evaluating runner context at job scope.',
                                  'Allocate the finalize runner.',
                                  'Export evidence paths through GITHUB_ENV from RUNNER_TEMP.',
                                  'Run the unchanged validation, evidence, and no-mutation checks.'
                              ],
                              'assertions': [
                                  'No finalize job-level environment value references runner context.',
                                  'Both evidence paths are initialized in a runtime step.',
                                  'The pull_request_target selector and direct ARM validation jobs remain unchanged.',
                                  'No deployment, migration, provider call, credential payload read, or Production mutation is introduced.',
                                  'secrets_included is false.'
                              ],
                              'tests': [
                                  {
                                      'id': 'production-certified-release-cut-registration-contract',
                                      'runner': 'node',
                                      'working_directory': 'http-generic-api',
                                      'path': 'test-production-certified-release-cut-validation-registration.mjs',
                                      'args': []
                                  }
                              ],
                              'evidence_paths': [str(workflow_path), str(test_path)]
                          }
                      ]
                  },
                  {'id': 'operational', 'status': 'planned', 'objective': 'Observe registration and exact-head evidence publication across Draft and Ready validation cycles.'},
                  {'id': 'resilient', 'status': 'planned', 'objective': 'Keep registration fail-closed without reintroducing job-level runner context.'},
                  {'id': 'canary', 'status': 'planned', 'objective': 'Prove a bounded same-repository validation cycle on the repaired workflow.'},
                  {'id': 'production', 'status': 'planned', 'objective': 'Use the repaired validator only through the existing governed certified-release path.'}
              ],
              'secrets_included': False
          }
          declaration_path.write_text(json.dumps(declaration, indent=2) + '\n')
          print('bounded source rewrite: pass')
          PY

          node --check http-generic-api/test-production-certified-release-cut-validation-registration.mjs
          node http-generic-api/test-production-certified-release-cut-validation-registration.mjs
          python3 -m json.tool .changes/e2e/production-certified-release-cut-registration-context.json >/dev/null
          git diff --check
          echo 'bounded generated files validation: pass'

      - name: Stage exact final scope and remove writer
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/repair-certified-release-runner-context.yml
          git rm .github/ops/certified-release-runner-context.trigger
          git add \
            .github/workflows/production-certified-release-cut-validation.yml \
            http-generic-api/test-production-certified-release-cut-validation-registration.mjs \
            .changes/e2e/production-certified-release-cut-registration-context.json

          EXPECTED="$(printf '%s\n' \
            '.changes/e2e/production-certified-release-cut-registration-context.json' \
            '.github/workflows/production-certified-release-cut-validation.yml' \
            'http-generic-api/test-production-certified-release-cut-validation-registration.mjs' | sort)"
          ACTUAL="$(git diff --cached --name-only "$EXPECTED_MAIN_SHA" | sort)"
          printf 'Expected final scope:\n%s\nActual final scope:\n%s\n' "$EXPECTED" "$ACTUAL"
          [[ "$ACTUAL" == "$EXPECTED" ]]
          git diff --cached --check
          git status --short

      - name: Commit exact final scope
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ci): resolve certified release paths at runner runtime"

      - name: Push final fast-forward commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          [[ "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" == "$GITHUB_SHA" ]]
          git push origin "HEAD:${TARGET_BRANCH}"
