name: Hostinger Production Node.js Restart Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.changes/e2e/hostinger-production-nodejs-restart.json'
      - '.github/workflows/hostinger-nodejs-production-restart.yml'
      - '.github/workflows/hostinger-nodejs-production-restart-contract.yml'
      - 'http-generic-api/scripts/hostinger-nodejs-production-restart.mjs'
      - 'http-generic-api/scripts/hostinger-nodejs-production-restart-coherent.mjs'
      - 'http-generic-api/scripts/test-hostinger-nodejs-production-restart.mjs'

permissions:
  contents: read

concurrency:
  group: hostinger-production-nodejs-restart-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate governed Hostinger Production restart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Validate restart workflow and implementation
        working-directory: http-generic-api
        run: node scripts/test-hostinger-nodejs-production-restart.mjs

      - name: Validate strict trusted-marker parser
        working-directory: http-generic-api
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { parseTrustedRestartMarker } from './scripts/hostinger-nodejs-production-restart-coherent.mjs';

          const trusted = (body, overrides = {}) => ({
            id: 42,
            body,
            user: { login: 'github-actions[bot]', type: 'Bot' },
            ...overrides,
          });
          const exact = parseTrustedRestartMarker(trusted(
            'HOSTINGER_PRODUCTION_NODEJS_RESTART status=claiming binding=sha:build expected_head_sha=abc run_id=123 restart_attempted=false',
          ));
          assert.equal(exact.id, 42);
          assert.equal(exact.fields.status, 'claiming');
          assert.equal(exact.fields.binding, 'sha:build');
          assert.equal(exact.fields.run_id, '123');

          assert.equal(parseTrustedRestartMarker(trusted(
            'HOSTINGER_PRODUCTION_NODEJS_RESTART status=claiming status=completed binding=sha:build',
          )), null, 'duplicate fields must fail closed');
          assert.equal(parseTrustedRestartMarker(trusted(
            'HOSTINGER_PRODUCTION_NODEJS_RESTART status=claiming binding=sha:build\nrestart_attempted=true',
          )), null, 'multi-line markers must fail closed');
          assert.equal(parseTrustedRestartMarker(trusted(
            'HOSTINGER_PRODUCTION_NODEJS_RESTART status=claiming binding=sha:build',
            { user: { login: 'mad4bdigital-ai', type: 'User' } },
          )), null, 'non-bot markers must be ignored');
          assert.equal(parseTrustedRestartMarker(trusted(
            'prefix HOSTINGER_PRODUCTION_NODEJS_RESTART status=claiming binding=sha:build',
          )), null, 'prefix smuggling must fail closed');
          assert.equal(parseTrustedRestartMarker(trusted(
            'HOSTINGER_PRODUCTION_NODEJS_RESTART status=claiming Binding=sha:build',
          )), null, 'non-canonical field names must fail closed');

          const productionWorkflow = fs.readFileSync('../.github/workflows/hostinger-nodejs-production-restart.yml', 'utf8');
          assert.match(productionWorkflow, /Object\.hasOwn\(fields, key\)/u);
          assert.match(productionWorkflow, /marker_parser=strict_single_line_exact_fields_v1/u);
          assert.match(productionWorkflow, /authority\.direct_field_consensus_required === true/u);
          assert.match(productionWorkflow, /authority\.conflicting_direct_fields_allowed === false/u);
          assert.match(productionWorkflow, /authority\.invalid_direct_fields_allowed === false/u);
          assert.doesNotMatch(productionWorkflow, /body\.includes\(['"]status=/u);
          console.log('strict trusted-marker and runtime-authority contract tests: passed');
          NODE

      - name: Reject conflicting direct runtime identity fields
        working-directory: http-generic-api
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { executeGovernedRestart } from './scripts/hostinger-nodejs-production-restart-coherent.mjs';

          const expectedSha = 'f5c1ae8840b4d4452f2908bb0f23051880bb6896';
          const oldSha = 'ca1e1cfe6697d251d2c50db7fa48246f18ab118f';
          const response = (body) => new Response(JSON.stringify(body), {
            status: 200,
            headers: { 'content-type': 'application/json' },
          });
          let posts = 0;
          const fetchImpl = async (url, init = {}) => {
            const value = String(url);
            if (value.includes('/nodejs/builds')) {
              return response({ data: [{
                uuid: '019fc51c-3947-7255-aa4d-f55cb8df7658',
                state: 'completed',
                created_at: '2026-08-03T00:53:09Z',
                updated_at: '2026-08-03T00:53:35Z',
                options: { source_type: 'git', entry_file: 'server.js' },
              }] });
            }
            if (init.method === 'POST') {
              posts += 1;
              return response({ ok: true });
            }
            if (value.endsWith('/health')) return response({ ok: true });
            if (value.endsWith('/version')) {
              return response({ deployed_commit_sha: oldSha, deployment_branch: 'main' });
            }
            if (value.endsWith('/deployment-info')) {
              return response({
                commit_sha: expectedSha,
                deployed_commit_sha: oldSha,
                branch: 'Production',
                deployment_branch: 'main',
              });
            }
            throw new Error(`Unexpected URL ${value}`);
          };
          const report = await executeGovernedRestart({
            accountUsername: 'u338416126',
            domain: 'auth.mad4b.com',
            expectedSha,
            expectedBuildUuid: '019fc51c-3947-7255-aa4d-f55cb8df7658',
            productionMergedAt: '2026-08-03T00:53:07Z',
            outputDir: '/tmp/hostinger-conflicting-direct-identity',
            timeoutMs: 5000,
            pollAttempts: 1,
            pollIntervalMs: 0,
            token: 'test-secret-token',
          }, {
            fetchImpl,
            sleepImpl: async () => {},
            beforeProviderMutation: async () => ({
              contract: 'mad4b.hostinger-pre-mutation-authority.v1',
              status: 'passed',
              marker_parser: 'strict_single_line_exact_fields_v1',
              secrets_included: false,
            }),
          });
          assert.equal(report.pre_runtime.current, false, 'conflicting direct identity must not be current');
          assert.equal(posts, 1, 'conflicting identity must not skip the authorized restart path');
          assert.equal(report.outcome, 'failed');
          assert.equal(report.classification, 'restart_completed_runtime_stale');
          assert.equal(report.runtime_identity_authority.direct_field_consensus_required, true);
          assert.equal(report.runtime_identity_authority.conflicting_direct_fields_allowed, false);
          assert.equal(report.runtime_identity_authority.invalid_direct_fields_allowed, false);
          console.log('conflicting direct runtime identity test: passed');
          NODE
