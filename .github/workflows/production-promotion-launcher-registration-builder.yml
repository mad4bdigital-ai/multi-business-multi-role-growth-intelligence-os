name: Production Promotion Launcher Registration Builder

on:
  push:
    branches:
      - gpt/fix-production-promotion-launcher-registration-20260803
  pull_request:
    branches:
      - gpt/fix-production-promotion-launcher-registration-base-20260803
    types: [opened, reopened, synchronize]

permissions:
  actions: write
  contents: write

concurrency:
  group: production-promotion-launcher-registration-builder
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout exact builder head
        uses: actions/checkout@v5
        with:
          ref: gpt/fix-production-promotion-launcher-registration-20260803
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify bounded initial branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "gpt/fix-production-promotion-launcher-registration-20260803"
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "415557d31e0533b8156e8058aa2a20fb844bc121"
          mapfile -t changed < <(git diff --name-only origin/main...HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/production-promotion-launcher-registration-builder.yml"

      - name: Apply registration-safe launcher repair
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const launcherPath = '.github/workflows/governed-production-promotion-request-launcher.yml';
          const testPath = 'http-generic-api/test-production-promotion-convergence-workflows.mjs';
          const builderPath = '.github/workflows/production-promotion-launcher-registration-builder.yml';
          const runnerTemp = '$' + '{{ runner.temp }}';

          let launcher = fs.readFileSync(launcherPath, 'utf8');
          const invalidJobEnv = `      EVIDENCE_PATH: ${runnerTemp}/governed-production-promotion-convergence.json\n`;
          assert.equal(launcher.split(invalidJobEnv).length - 1, 1, 'expected one invalid job-level runner.temp binding');
          launcher = launcher.replace(invalidJobEnv, '');

          const convergeStep = [
            '      - name: Build, validate, and converge protected refs',
            '        id: converge',
            '        shell: bash',
            '        run: |',
          ].join('\n');
          const repairedConvergeStep = [
            '      - name: Build, validate, and converge protected refs',
            '        id: converge',
            '        shell: bash',
            '        env:',
            `          EVIDENCE_PATH: ${runnerTemp}/governed-production-promotion-convergence.json`,
            '        run: |',
          ].join('\n');
          assert.equal(launcher.split(convergeStep).length - 1, 1, 'expected one converge step header');
          launcher = launcher.replace(convergeStep, repairedConvergeStep);

          const oldUploadPath = `          path: $` + '{{ env.EVIDENCE_PATH }}';
          const newUploadPath = `          path: ${runnerTemp}/governed-production-promotion-convergence.json`;
          assert.equal(launcher.split(oldUploadPath).length - 1, 1, 'expected one environment-based upload path');
          launcher = launcher.replace(oldUploadPath, newUploadPath);
          fs.writeFileSync(launcherPath, launcher);

          let test = fs.readFileSync(testPath, 'utf8');
          const anchor = 'for (const required of [\n  /workflow_run:/,';
          assert.equal(test.split(anchor).length - 1, 1, 'expected post-finalization assertion anchor');
          const regression = String.raw`const launcherJobHeader =
  launcher.match(/  converge-source-pinned-candidate:\n[\s\S]*?    steps:/)?.[0] ?? "";
assert.ok(launcherJobHeader, "Production promotion launcher job header must exist");
assert.doesNotMatch(
  launcherJobHeader,
  /EVIDENCE_PATH:\s*\$\{\{\s*runner\.temp\s*\}\}/,
  "runner.temp must not be evaluated in the launcher job-level environment",
);
assert.match(
  launcher,
  /id: converge\n\s+shell: bash\n\s+env:\n\s+EVIDENCE_PATH: \$\{\{ runner\.temp \}\}\/governed-production-promotion-convergence\.json\n\s+run: \|/,
  "the convergence step must receive the runner-scoped evidence path at step runtime",
);
assert.match(
  launcher,
  /path: \$\{\{ runner\.temp \}\}\/governed-production-promotion-convergence\.json/,
  "artifact upload must use runner.temp only from the step context",
);

`;
          test = test.replace(anchor, `${regression}${anchor}`);
          fs.writeFileSync(testPath, test);
          fs.rmSync(builderPath);
          NODE

      - name: Validate exact repair
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/test-production-promotion-convergence-workflows.mjs
          node --check http-generic-api/test-production-promotion-convergence-workflows.mjs
          ! grep -A20 '^  converge-source-pinned-candidate:' .github/workflows/governed-production-promotion-request-launcher.yml | grep -q 'EVIDENCE_PATH:.*runner.temp'
          runner_expr='$'"{{ runner.temp }}"
          grep -A8 'id: converge' .github/workflows/governed-production-promotion-request-launcher.yml | grep -Fq "EVIDENCE_PATH: ${runner_expr}/governed-production-promotion-convergence.json"
          grep -A6 'name: Upload convergence evidence' .github/workflows/governed-production-promotion-request-launcher.yml | grep -Fq "path: ${runner_expr}/governed-production-promotion-convergence.json"
          git diff --check
          mapfile -t effective < <(git diff --name-only origin/main)
          printf '%s\n' "${effective[@]}"
          test "${#effective[@]}" -eq 2
          test "${effective[0]}" = ".github/workflows/governed-production-promotion-request-launcher.yml"
          test "${effective[1]}" = "http-generic-api/test-production-promotion-convergence-workflows.mjs"

      - name: Publish product-only repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "415557d31e0533b8156e8058aa2a20fb844bc121"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git config user.name 'mad4bdigital-ai'
          git config user.email '271942579+mad4bdigital-ai@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ci): register governed Production promotion launcher'
          git push origin HEAD:gpt/fix-production-promotion-launcher-registration-20260803
