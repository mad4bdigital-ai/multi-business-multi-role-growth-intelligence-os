name: Pin Critical Runners Governance Patcher V10

on:
  pull_request:
    branches:
      - gpt/diag/pin-critical-runners-patcher-base-5ae197-v3-20260803
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: pin-critical-runners-governance-patcher-v10-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: 14433d15184bd7e7658281a356a7540e3d2d6dfe
  EXPECTED_HEAD_REF: gpt/ci/pin-critical-runners-governance-publish-14433d-v10-20260803
  PATCHER_BASE_REF: gpt/diag/pin-critical-runners-patcher-base-5ae197-v3-20260803
  TRIGGER_PATH: .github/diagnostics/pin-critical-runners-governance-patcher-v10.txt

jobs:
  publish:
    name: Validate governed runner candidate and publish blobs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fail closed on exact PR identity
        shell: bash
        env:
          ACTUAL_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          ACTUAL_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          ACTUAL_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$ACTUAL_HEAD_REF" = "$EXPECTED_HEAD_REF"
          test "$ACTUAL_HEAD_REPO" = "$GITHUB_REPOSITORY"
          test "$ACTUAL_BASE_REF" = "$PATCHER_BASE_REF"

      - name: Checkout exact feature trigger
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_HEAD_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable latest-main parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-list --count "$EXPECTED_MAIN_SHA"..HEAD)" = "1"
          test -f "$TRIGGER_PATH"

      - name: Decode and execute syntax-checked generator
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/patcher.py.gz.b64" <<'PATCHER_B64'

PATCHER_B64
          base64 --decode "${RUNNER_TEMP}/patcher.py.gz.b64" | gzip --decompress > "${RUNNER_TEMP}/patcher.py"
          python3 -m py_compile "${RUNNER_TEMP}/patcher.py"
          python3 "${RUNNER_TEMP}/patcher.py"

      - name: Upload immutable v10 evidence
        uses: actions/upload-artifact@v4
        with:
          name: pin-critical-runners-governance-v10-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pin-critical-runners-governance-v9.json
            ${{ runner.temp }}/reference-integrity.json
            ${{ runner.temp }}/repository-tool-lifecycle/
            ${{ runner.temp }}/expected-net.txt
            ${{ runner.temp }}/actual-net.txt
          if-no-files-found: error
          retention-days: 7

      - name: Assert no ref update occurred
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "origin/$EXPECTED_HEAD_REF")" != "$(git rev-parse HEAD)"
          echo "Validated governance-compliant blobs published; no Git ref was updated."
