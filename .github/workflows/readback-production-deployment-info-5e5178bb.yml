name: Read Back Production Deployment Info 5E5178BB

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/readback-production-deployment-info-5e5178bb.yml"

permissions:
  contents: read

concurrency:
  group: readback-production-deployment-info-5e5178bb
  cancel-in-progress: false

jobs:
  public-get-only-topology:
    name: Public GET-only Production topology readback
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/readback-production-deployment-info-5e5178bb-20260803' &&
      github.event.pull_request.user.id == 271942579
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      CONTROL_ISSUE: '4953'
      EXPECTED_PRODUCTION_SHA: 5e5178bb7d5b86fe42a5eb97e647a5d65edaaceb
      EXPECTED_BRANCH: Production
      EXPECTED_DEPLOYED_AFTER: '2026-08-03T06:16:38Z'
      REPORT_DIR: ${{ runner.temp }}/production-deployment-info-evidence
    steps:
      - name: Verify current protected authority
        id: authority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "/repos/${REPOSITORY}/issues/${CONTROL_ISSUE}" --jq '.state')" = "open"
          test "$(gh api "/repos/${REPOSITORY}/git/ref/heads/Production" --jq '.object.sha')" = "${EXPECTED_PRODUCTION_SHA}"
          MAIN_SHA="$(gh api "/repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "${MAIN_SHA}" =~ ^[a-f0-9]{40}$ ]]
          echo "main_sha=${MAIN_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Collect bounded public topology evidence
        id: collect
        continue-on-error: true
        env:
          MAIN_SHA: ${{ steps.authority.outputs.main_sha }}
        shell: bash
        run: |
          set -u -o pipefail
          mkdir -p "${REPORT_DIR}"

          fetch_endpoint() {
            local name="$1"
            local url="$2"
            local raw="${REPORT_DIR}/${name}.raw"
            local safe="${REPORT_DIR}/${name}.safe.json"
            local status
            status="$(curl --silent --show-error --max-time 20 --proto '=https' --tlsv1.2 \
              --header 'accept: application/json' \
              --output "${raw}" \
              --write-out '%{http_code}' \
              "${url}")" || status="000"
            printf '%s' "${status}" > "${REPORT_DIR}/${name}.status"
            head -c 65536 "${raw}" > "${raw}.bounded" 2>/dev/null || true
            mv "${raw}.bounded" "${raw}"
            if jq -e . "${raw}" >/dev/null 2>&1; then
              jq 'walk(if type == "object" then with_entries(if (.key | test("authorization|cookie|password|secret|token|api[_-]?key|private[_-]?key|credential"; "i")) then .value = "[REDACTED]" else . end) else . end)' \
                "${raw}" > "${safe}"
            else
              jq -n --rawfile body "${raw}" '{non_json_body: ($body | .[0:12000])}' > "${safe}"
            fi
          }

          fetch_endpoint health https://auth.mad4b.com/health
          fetch_endpoint version https://auth.mad4b.com/version
          fetch_endpoint deployment_info https://auth.mad4b.com/deployment-info
          fetch_endpoint connector_agent_version https://auth.mad4b.com/connector-agent/version

          HEALTH_STATUS="$(cat "${REPORT_DIR}/health.status")"
          VERSION_STATUS="$(cat "${REPORT_DIR}/version.status")"
          DEPLOYMENT_STATUS="$(cat "${REPORT_DIR}/deployment_info.status")"
          CONNECTOR_STATUS="$(cat "${REPORT_DIR}/connector_agent_version.status")"

          BRANCH="$(jq -r '.branch // .deployment_branch // .git_branch // .source_branch // empty' "${REPORT_DIR}/deployment_info.safe.json")"
          DEPLOYED_SHA="$(jq -r '.commit_sha // .deployed_commit_sha // .git_sha // .sha // empty' "${REPORT_DIR}/deployment_info.safe.json")"
          DEPLOYED_AT="$(jq -r '.deployed_at // .deployment_timestamp // .deployment_time // .manifest_generated_at // .generated_at // .updated_at // empty' "${REPORT_DIR}/deployment_info.safe.json")"
          RELEASE_PATH="$(jq -r '.release_path // .release_directory // .deployment_path // .manifest_path // .deployment_manifest_path // empty' "${REPORT_DIR}/deployment_info.safe.json")"
          VERSION_SHA="$(jq -r '.deployed_commit_sha // .commit_sha // .git_sha // .sha // empty' "${REPORT_DIR}/version.safe.json")"
          VERSION_BRANCH="$(jq -r '.deployment_branch // .branch // .git_branch // .source_branch // empty' "${REPORT_DIR}/version.safe.json")"

          TIMESTAMP_CURRENT=false
          if [[ -n "${DEPLOYED_AT}" ]]; then
            DEPLOYED_EPOCH="$(date -u -d "${DEPLOYED_AT}" +%s 2>/dev/null || echo 0)"
            EXPECTED_EPOCH="$(date -u -d "${EXPECTED_DEPLOYED_AFTER}" +%s)"
            if (( DEPLOYED_EPOCH >= EXPECTED_EPOCH )); then TIMESTAMP_CURRENT=true; fi
          fi

          OUTCOME=passed
          FAILURE=none
          if [[ "${HEALTH_STATUS}" != "200" ]]; then OUTCOME=failed; FAILURE=health_http_failed
          elif [[ "${VERSION_STATUS}" != "200" ]]; then OUTCOME=failed; FAILURE=version_http_failed
          elif [[ "${DEPLOYMENT_STATUS}" != "200" ]]; then OUTCOME=failed; FAILURE=deployment_info_http_failed
          elif [[ "${CONNECTOR_STATUS}" != "200" ]]; then OUTCOME=failed; FAILURE=connector_agent_http_failed
          elif [[ "${BRANCH}" != "${EXPECTED_BRANCH}" ]]; then OUTCOME=failed; FAILURE=deployment_info_branch_mismatch
          elif [[ "${DEPLOYED_SHA}" != "${EXPECTED_PRODUCTION_SHA}" ]]; then OUTCOME=failed; FAILURE=deployment_info_sha_mismatch
          elif [[ -z "${DEPLOYED_AT}" ]]; then OUTCOME=failed; FAILURE=deployment_timestamp_missing
          elif [[ "${TIMESTAMP_CURRENT}" != "true" ]]; then OUTCOME=failed; FAILURE=deployment_timestamp_stale
          fi

          jq -n \
            --arg contract mad4b.production-deployment-info-evidence.v1 \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg repository "${REPOSITORY}" \
            --arg main_sha "${MAIN_SHA}" \
            --arg expected_sha "${EXPECTED_PRODUCTION_SHA}" \
            --arg expected_branch "${EXPECTED_BRANCH}" \
            --arg expected_after "${EXPECTED_DEPLOYED_AFTER}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg outcome "${OUTCOME}" \
            --arg failure "${FAILURE}" \
            --arg health_status "${HEALTH_STATUS}" \
            --arg version_status "${VERSION_STATUS}" \
            --arg deployment_status "${DEPLOYMENT_STATUS}" \
            --arg connector_status "${CONNECTOR_STATUS}" \
            --arg branch "${BRANCH}" \
            --arg deployed_sha "${DEPLOYED_SHA}" \
            --arg deployed_at "${DEPLOYED_AT}" \
            --arg release_path "${RELEASE_PATH}" \
            --arg version_sha "${VERSION_SHA}" \
            --arg version_branch "${VERSION_BRANCH}" \
            --argjson timestamp_current "${TIMESTAMP_CURRENT}" \
            --slurpfile health "${REPORT_DIR}/health.safe.json" \
            --slurpfile version "${REPORT_DIR}/version.safe.json" \
            --slurpfile deployment "${REPORT_DIR}/deployment_info.safe.json" \
            --slurpfile connector "${REPORT_DIR}/connector_agent_version.safe.json" \
            '{
              contract: $contract,
              generated_at: $generated_at,
              identity: {
                repository: $repository,
                current_main_sha: $main_sha,
                expected_production_sha: $expected_sha,
                expected_branch: $expected_branch,
                expected_deployed_after: $expected_after,
                workflow_run_id: $run_id
              },
              outcome: $outcome,
              first_failure: (if $failure == "none" then null else {code: $failure} end),
              coherent_direct_top_level_identity: {
                branch: (if $branch == "" then null else $branch end),
                sha: (if $deployed_sha == "" then null else $deployed_sha end),
                deployed_at: (if $deployed_at == "" then null else $deployed_at end),
                release_path: (if $release_path == "" then null else $release_path end)
              },
              version_observation: {
                sha: (if $version_sha == "" then null else $version_sha end),
                branch: (if $version_branch == "" then null else $version_branch end)
              },
              checks: {
                health_http_ok: ($health_status == "200"),
                version_http_ok: ($version_status == "200"),
                deployment_info_http_ok: ($deployment_status == "200"),
                connector_agent_http_ok: ($connector_status == "200"),
                deployment_info_branch_exact: ($branch == $expected_branch),
                deployment_info_sha_exact: ($deployed_sha == $expected_sha),
                deployment_timestamp_present: ($deployed_at != ""),
                deployment_timestamp_current: $timestamp_current
              },
              endpoints: {
                health: {http_status: ($health_status | tonumber), body: $health[0]},
                version: {http_status: ($version_status | tonumber), body: $version[0]},
                deployment_info: {http_status: ($deployment_status | tonumber), body: $deployment[0]},
                connector_agent_version: {http_status: ($connector_status | tonumber), body: $connector[0]}
              },
              side_effects: {
                repository_mutation_performed: false,
                provider_dispatch_performed: false,
                credential_access_performed: false,
                provider_mutation_performed: false,
                deployment_performed: false,
                restart_performed: false,
                sql_execution_performed: false,
                migration_apply_performed: false,
                database_mutation_performed: false,
                external_send_performed: false
              },
              secrets_included: false
            }' > "${REPORT_DIR}/production-deployment-info-evidence.json"

          jq -r '[
            "# Production Deployment Info Evidence",
            "",
            "- Outcome: **" + .outcome + "**",
            "- Expected SHA: `" + .identity.expected_production_sha + "`",
            "- Deployment-info branch: `" + (.coherent_direct_top_level_identity.branch // "unavailable") + "`",
            "- Deployment-info SHA: `" + (.coherent_direct_top_level_identity.sha // "unavailable") + "`",
            "- Deployment timestamp: `" + (.coherent_direct_top_level_identity.deployed_at // "unavailable") + "`",
            "- Release path: `" + (.coherent_direct_top_level_identity.release_path // "unavailable") + "`",
            "- First failure: `" + (.first_failure.code // "none") + "`",
            "- Secrets included: `false`"
          ] | join("\n")' "${REPORT_DIR}/production-deployment-info-evidence.json" \
            > "${REPORT_DIR}/production-deployment-info-evidence.md"

      - name: Upload structured topology evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-deployment-info-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/production-deployment-info-evidence/*
          if-no-files-found: error
          retention-days: 30

      - name: Enforce coherent deployment-info decision
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          REPORT="${REPORT_DIR}/production-deployment-info-evidence.json"
          test "$(jq -r '.contract' "${REPORT}")" = "mad4b.production-deployment-info-evidence.v1"
          test "$(jq -r '.identity.expected_production_sha' "${REPORT}")" = "${EXPECTED_PRODUCTION_SHA}"
          test "$(jq -r '.identity.expected_branch' "${REPORT}")" = "Production"
          test "$(jq -r '.secrets_included' "${REPORT}")" = "false"
          jq -e '.side_effects | all(.[]; . == false)' "${REPORT}" >/dev/null
          jq '{outcome, first_failure, identity: .coherent_direct_top_level_identity, checks, secrets_included}' "${REPORT}"
          test "$(jq -r '.outcome' "${REPORT}")" = "passed"
