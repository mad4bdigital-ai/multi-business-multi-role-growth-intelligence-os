name: Derived State Closure

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open same-repository pull request to re-verify after a governed repair
        required: true
        type: string
      expected_head_sha:
        description: Exact current pull-request head SHA
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: derived-state-closure-${{ github.event.pull_request.number || inputs.pr_number || github.sha }}
  cancel-in-progress: true

jobs:
  closure:
    name: Derived State Closure
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Resolve exact candidate identity
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          EVENT_CANDIDATE_SHA: ${{ github.sha }}
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number || '' }}
          DISPATCH_EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha || '' }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            pull_request)
              [[ "$EVENT_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
              [[ "$EVENT_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
              [[ "$EVENT_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
              [[ "$EVENT_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
              pr_number="$EVENT_PR_NUMBER"
              source_head_sha="$EVENT_HEAD_SHA"
              base_sha="$EVENT_BASE_SHA"
              candidate_sha="$EVENT_CANDIDATE_SHA"
              candidate_kind="github_merge_candidate"
              ;;
            workflow_dispatch)
              test "$GITHUB_REF_NAME" = "main"
              [[ "$DISPATCH_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
              [[ "$DISPATCH_EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
              pr_file="$RUNNER_TEMP/derived-state-closure-pr.json"
              gh api "repos/${GITHUB_REPOSITORY}/pulls/${DISPATCH_PR_NUMBER}" > "$pr_file"
              test "$(jq -r '.state' "$pr_file")" = "open"
              test "$(jq -r '.base.ref' "$pr_file")" = "main"
              test "$(jq -r '.head.repo.full_name' "$pr_file")" = "$GITHUB_REPOSITORY"
              test "$(jq -r '.head.sha' "$pr_file")" = "$DISPATCH_EXPECTED_HEAD_SHA"
              test "$(jq -r '.draft' "$pr_file")" = "false"

              source_head_sha="$DISPATCH_EXPECTED_HEAD_SHA"
              base_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
              test "$(jq -r '.base.sha' "$pr_file")" = "$base_sha"
              test "$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${source_head_sha}" --jq '.behind_by')" = "0"

              candidate_sha=""
              for attempt in $(seq 1 8); do
                candidate_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${DISPATCH_PR_NUMBER}" --jq '.merge_commit_sha // empty')"
                [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]] && break
                sleep "$attempt"
              done
              [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
              pr_number="$DISPATCH_PR_NUMBER"
              candidate_kind="github_merge_candidate"
              ;;
            push)
              test "$GITHUB_REF_NAME" = "main"
              [[ "$EVENT_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
              pr_number="0"
              source_head_sha="$EVENT_CANDIDATE_SHA"
              base_sha="$EVENT_CANDIDATE_SHA"
              candidate_sha="$EVENT_CANDIDATE_SHA"
              candidate_kind="exact_main"
              ;;
            *)
              echo "Unsupported Derived State Closure event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "candidate_kind=$candidate_kind" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "source_head_sha=$source_head_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.target.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            http-generic-api/package-lock.json

      - name: Verify exact candidate identity
        shell: bash
        env:
          EXPECTED_CANDIDATE_SHA: ${{ steps.target.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Install root dependencies without lifecycle side effects
        run: npm ci --ignore-scripts

      - name: Install API dependencies without lifecycle side effects
        working-directory: http-generic-api
        run: npm ci --ignore-scripts

      - name: Validate derived-state governance contract
        run: node .github/tests/derived-state-closure.test.mjs

      - name: Verify all registered derived state at the exact candidate
        env:
          DERIVED_STATE_REPORT_FILE: ${{ runner.temp }}/derived-state-closure/report.json
          CANDIDATE_SHA: ${{ steps.target.outputs.candidate_sha }}
          CANDIDATE_KIND: ${{ steps.target.outputs.candidate_kind }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          SOURCE_HEAD_SHA: ${{ steps.target.outputs.source_head_sha }}
          BASE_SHA: ${{ steps.target.outputs.base_sha }}
        run: >-
          node scripts/derived-state-closure.mjs
          --expected-sha "$CANDIDATE_SHA"
          --candidate-kind "$CANDIDATE_KIND"
          --pr-number "$PR_NUMBER"
          --source-head-sha "$SOURCE_HEAD_SHA"
          --base-sha "$BASE_SHA"
          --report-file "$DERIVED_STATE_REPORT_FILE"

      - name: Upload canonical closure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: derived-state-closure-${{ github.run_id }}
          path: ${{ runner.temp }}/derived-state-closure/report.json
          if-no-files-found: error
          retention-days: 30
