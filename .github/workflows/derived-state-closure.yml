name: Derived State Closure

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open same-repository pull request to re-verify after a governed repair
        required: true
        type: string
      expected_head_sha:
        description: Exact current pull-request head SHA
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: derived-state-closure-${{ github.event.pull_request.number || inputs.pr_number || github.sha }}
  cancel-in-progress: true

jobs:
  closure:
    name: Derived State Closure Detector
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Resolve exact candidate identity
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          EVENT_CANDIDATE_SHA: ${{ github.sha }}
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number || '' }}
          DISPATCH_EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha || '' }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              pr_number="$EVENT_PR_NUMBER"
              source_head_sha="$EVENT_HEAD_SHA"
              base_sha="$EVENT_BASE_SHA"
              candidate_sha="$EVENT_CANDIDATE_SHA"
              candidate_kind="github_merge_candidate"
              ;;
            workflow_dispatch)
              test "$GITHUB_REF_NAME" = "main"
              [[ "$DISPATCH_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
              [[ "$DISPATCH_EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
              pr_file="$RUNNER_TEMP/derived-state-closure-pr.json"
              gh api "repos/${GITHUB_REPOSITORY}/pulls/${DISPATCH_PR_NUMBER}" > "$pr_file"
              test "$(jq -r '.state' "$pr_file")" = "open"
              test "$(jq -r '.base.ref' "$pr_file")" = "main"
              test "$(jq -r '.head.repo.full_name' "$pr_file")" = "$GITHUB_REPOSITORY"
              test "$(jq -r '.head.sha' "$pr_file")" = "$DISPATCH_EXPECTED_HEAD_SHA"
              pr_number="$DISPATCH_PR_NUMBER"
              source_head_sha="$DISPATCH_EXPECTED_HEAD_SHA"
              base_sha="$(jq -r '.base.sha' "$pr_file")"
              candidate_sha="$(jq -r '.merge_commit_sha // empty' "$pr_file")"
              candidate_kind="github_merge_candidate"
              ;;
            push)
              pr_number="0"
              source_head_sha="$EVENT_CANDIDATE_SHA"
              base_sha="$EVENT_CANDIDATE_SHA"
              candidate_sha="$EVENT_CANDIDATE_SHA"
              candidate_kind="exact_main"
              ;;
            *) echo "Unsupported event: $EVENT_NAME" >&2; exit 1 ;;
          esac
          for sha in "$source_head_sha" "$base_sha" "$candidate_sha"; do [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; done
          {
            echo "candidate_sha=$candidate_sha"
            echo "candidate_kind=$candidate_kind"
            echo "pr_number=$pr_number"
            echo "source_head_sha=$source_head_sha"
            echo "base_sha=$base_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.target.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            http-generic-api/package-lock.json

      - name: Install PowerShell validator runtime
        uses: PSModule/install-powershell@159c2929fac34e3c7fc55d75e8997fb27fc7f75a # v1
        with:
          Version: 7.5.0
          Token: ${{ github.token }}

      - name: Verify exact candidate and all JavaScript syntax
        env:
          EXPECTED_CANDIDATE_SHA: ${{ steps.target.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git ls-files -z -- '*.js' '*.mjs' '*.cjs' | xargs -0 -r -n 1 -P 4 node --check

      - name: Install dependencies without lifecycle side effects
        run: |
          npm ci --ignore-scripts --include=dev
          (cd http-generic-api && npm ci --ignore-scripts)

      - name: Validate governance contracts
        run: |
          node scripts/repository-governance-fixed-point.mjs --self-test
          node .github/tests/repository-governance-closure.test.mjs
          node .github/tests/repository-governance-fixed-point.test.mjs
          node .github/tests/repository-governance-objection-gate.test.mjs
          node .github/tests/derived-state-closure.test.mjs
          node http-generic-api/test-github-repository-policy-controller.mjs
          node http-generic-api/test-github-repository-governance-attestation.mjs
          node http-generic-api/test-github-repository-policy-live-activation-contract.mjs

      - name: Verify repository governance fixed point
        env:
          OUT: ${{ runner.temp }}/derived-state-closure
          CANDIDATE_SHA: ${{ steps.target.outputs.candidate_sha }}
          CANDIDATE_KIND: ${{ steps.target.outputs.candidate_kind }}
          BASE_SHA: ${{ steps.target.outputs.base_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          node scripts/repository-governance-fixed-point.mjs \
            --expected-sha "$CANDIDATE_SHA" --candidate-kind "$CANDIDATE_KIND" --base-sha "$BASE_SHA" \
            --report-file "$OUT/repository-governance.json"
          node - "$OUT/repository-governance.json" <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
          if (report?.fixed_point?.converged !== true) throw new Error('repository governance fixed point is not converged');
          NODE

      - name: Verify environment impact and migration compatibility closure
        env:
          OUT: ${{ runner.temp }}/derived-state-closure
          CANDIDATE_SHA: ${{ steps.target.outputs.candidate_sha }}
          CANDIDATE_KIND: ${{ steps.target.outputs.candidate_kind }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          SOURCE_HEAD_SHA: ${{ steps.target.outputs.source_head_sha }}
          BASE_SHA: ${{ steps.target.outputs.base_sha }}
        run: |
          set -euo pipefail
          node http-generic-api/scripts/environment-impact-closure.mjs \
            --base-sha "$BASE_SHA" --head-sha "$SOURCE_HEAD_SHA" --report-file "$OUT/environment-impact.json"
          node scripts/derived-state-closure.mjs \
            --expected-sha "$CANDIDATE_SHA" --candidate-kind "$CANDIDATE_KIND" --pr-number "$PR_NUMBER" \
            --source-head-sha "$SOURCE_HEAD_SHA" --base-sha "$BASE_SHA" --report-file "$OUT/report.json"

      - name: Resolve canonical producer evidence for exact candidate
        if: steps.target.outputs.pr_number != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ runner.temp }}/derived-state-closure
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          SOURCE_HEAD_SHA: ${{ steps.target.outputs.source_head_sha }}
          BASE_SHA: ${{ steps.target.outputs.base_sha }}
          CANDIDATE_SHA: ${{ steps.target.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 600 ))
          matched=""
          while [[ -z "$matched" && $(date +%s) -lt $deadline ]]; do
            runs="$RUNNER_TEMP/policy-objection-runs.json"
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/policy-objection-ci.yml/runs?event=pull_request&per_page=30" > "$runs"
            while read -r run_id; do
              dir="$RUNNER_TEMP/producer-$run_id"
              rm -rf "$dir" && mkdir -p "$dir"
              if gh run download "$run_id" -n "repository-governance-producer-evidence-$run_id" -D "$dir" >/dev/null 2>&1; then
                evidence="$dir/producer-evidence.json"
                if test -e "$evidence" && \
                   [[ "$(jq -r '.pr_number' "$evidence")" == "$PR_NUMBER" ]] && \
                   [[ "$(jq -r '.source_head_sha' "$evidence")" == "$SOURCE_HEAD_SHA" ]] && \
                   [[ "$(jq -r '.base_sha' "$evidence")" == "$BASE_SHA" ]] && \
                   [[ "$(jq -r '.merge_candidate_sha' "$evidence")" == "$CANDIDATE_SHA" ]] && \
                   [[ "$(jq -r '.executed_sha' "$evidence")" == "$CANDIDATE_SHA" ]] && \
                   [[ "$(jq -r '.fixed_point_converged' "$evidence")" == "true" ]]; then
                  cp "$evidence" "$OUT/canonical-producer-evidence.json"
                  matched="$run_id"
                  break
                fi
              fi
            done < <(jq -r '[.workflow_runs[] | select(.status=="completed" and .conclusion=="success")] | sort_by(.created_at) | reverse | .[].id' "$runs")
            [[ -n "$matched" ]] || sleep 10
          done
          [[ -n "$matched" ]]
          jq -n \
            --arg source "$SOURCE_HEAD_SHA" --arg base "$BASE_SHA" --arg candidate "$CANDIDATE_SHA" --arg pr "$PR_NUMBER" \
            --slurpfile producer "$OUT/canonical-producer-evidence.json" \
            '{source_head_sha:$source,base_sha:$base,merge_candidate_sha:$candidate,executed_sha:$candidate,pr_number:($pr|tonumber),producers:$producer}' \
            > "$OUT/evidence-snapshot.json"
          node scripts/repository-governance-evidence-finalizer.mjs \
            --snapshot-file "$OUT/evidence-snapshot.json" --report-file "$OUT/evidence-finalizer.json"

      - name: Resolve and enforce typed policy objections
        env:
          OUT: ${{ runner.temp }}/derived-state-closure
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          CANDIDATE_SHA: ${{ steps.target.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--mode source --governance-report "$OUT/repository-governance.json" --derived-report "$OUT/report.json" --report-file "$OUT/policy-objections.json")
          if [[ "$PR_NUMBER" != "0" ]]; then args=(--mode finalizer --governance-report "$OUT/repository-governance.json" --derived-report "$OUT/report.json" --evidence-report "$OUT/evidence-finalizer.json" --report-file "$OUT/policy-objections.json"); fi
          node scripts/repository-governance-objection-gate.mjs "${args[@]}"
          node - "$OUT/policy-objections.json" "$CANDIDATE_SHA" <<'NODE'
          const fs = require('fs');
          const [file, candidate] = process.argv.slice(2);
          const report = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (report.contract !== 'mad4b.repository-policy-objections.v1') throw new Error('objection contract mismatch');
          if (report.candidate_sha !== candidate) throw new Error('objection candidate mismatch');
          if (Number(report.blocking_count) !== 0) throw new Error(`blocking objections remain: ${report.blocking_count}`);
          NODE

      - name: Write exact-candidate detector identity
        if: always()
        env:
          OUT: ${{ runner.temp }}/derived-state-closure
          SOURCE_HEAD_SHA: ${{ steps.target.outputs.source_head_sha }}
          BASE_SHA: ${{ steps.target.outputs.base_sha }}
          CANDIDATE_SHA: ${{ steps.target.outputs.candidate_sha }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
        run: |
          mkdir -p "$OUT"
          jq -n --arg source "$SOURCE_HEAD_SHA" --arg base "$BASE_SHA" --arg candidate "$CANDIDATE_SHA" --arg pr "$PR_NUMBER" --arg run "$GITHUB_RUN_ID" \
            '{contract:"mad4b.derived-state-detector-identity.v1",source_head_sha:$source,base_sha:$base,merge_candidate_sha:$candidate,executed_sha:$candidate,pr_number:($pr|tonumber),source_run_id:($run|tonumber),secrets_included:false}' \
            > "$OUT/detector-identity.json"

      - name: Upload detector evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: derived-state-closure-${{ github.run_id }}
          path: ${{ runner.temp }}/derived-state-closure/
          if-no-files-found: error
          retention-days: 30
