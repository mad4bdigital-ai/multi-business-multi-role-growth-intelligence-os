name: Spec 013 Current Main Reconciliation

on:
  pull_request:
    types: [synchronize]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spec-013-current-main-reconciliation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'fix/spec-013-final-contract-closure-20260803') ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'fix/spec-013-final-contract-closure-20260803' &&
       github.actor != 'github-actions[bot]')
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Check out final closure branch
        uses: actions/checkout@v5
        with:
          ref: fix/spec-013-final-contract-closure-20260803
          fetch-depth: 0
          persist-credentials: true

      - name: Merge latest main without force
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Branch already contains latest main."
            exit 0
          fi
          git merge --no-edit origin/main
          git push origin HEAD:fix/spec-013-final-contract-closure-20260803
