name: PR 6429 Policy Review Trigger V2

on:
  push:
    branches:
      - gpt/github-main-policy-controller-20260805
    paths:
      - .github/workflows/pr6429-policy-review-trigger-v2.yml

permissions:
  contents: write

jobs:
  trigger-repair-v2:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v4
        with:
          ref: gpt/github-main-policy-controller-20260805
          fetch-depth: 0

      - name: Extract and execute bounded repair robustly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEXTRACT'
          from pathlib import Path

          workflow = Path('.github/workflows/pr6429-policy-review-repair.yml')
          lines = workflow.read_text().splitlines()
          try:
              marker_index = next(i for i, line in enumerate(lines) if line.strip() == "python3 - <<'PY'")
              start = marker_index + 1
              end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          except (StopIteration, ValueError) as exc:
              raise SystemExit(f'embedded repair script marker missing: {exc}')

          body = lines[start:end]
          indents = [len(line) - len(line.lstrip()) for line in body if line.strip()]
          if not indents:
              raise SystemExit('embedded repair script is empty')
          common_indent = min(indents)
          script = '\n'.join(line[common_indent:] if line.strip() else '' for line in body) + '\n'
          Path('/tmp/pr6429-policy-review-repair.py').write_text(script)
          PYEXTRACT
          python3 /tmp/pr6429-policy-review-repair.py

      - name: Install API dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Validate focused policy controller repair
        working-directory: http-generic-api
        run: |
          set -euo pipefail
          node test-github-repository-policy-controller.mjs
          node test-repository-automation-policy-facade.mjs
          node test-frontend-surface-dispatch.mjs

      - name: Commit bounded repair and remove bootstrap workflows
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr6429-policy-review-repair.yml
          rm .github/workflows/pr6429-policy-review-trigger.yml
          rm .github/workflows/pr6429-policy-review-trigger-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add http-generic-api/githubRepositoryPolicyController.js \
                  http-generic-api/test-github-repository-policy-controller.mjs \
                  .github/workflows/pr6429-policy-review-repair.yml \
                  .github/workflows/pr6429-policy-review-trigger.yml \
                  .github/workflows/pr6429-policy-review-trigger-v2.yml
          git diff --cached --check
          git commit -m "fix(github): fail closed on ambiguous repository policy state"
          git push origin HEAD:gpt/github-main-policy-controller-20260805
