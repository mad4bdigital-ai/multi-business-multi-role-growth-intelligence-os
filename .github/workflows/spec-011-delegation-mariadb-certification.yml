name: Spec 011 Delegation MariaDB Certification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "http-generic-api/delegationGrantMariaDbRepository.js"
      - "http-generic-api/delegationGrantMariaDbReadinessCollector.js"
      - "http-generic-api/delegationGrantMariaDbRuntimeBinding.js"
      - "http-generic-api/delegationGrantLifecycleShadowService.js"
      - "http-generic-api/delegationGrantRepositoryMutationService.js"
      - "http-generic-api/delegationGrantMariaDbValidationService.js"
      - "http-generic-api/spec011Phase5ValidationCi.js"
      - "http-generic-api/migrations/20260725_agent_delegation_grant_persistence_contract.sql"
      - "http-generic-api/scripts/delegation-mariadb-disposable-certification.mjs"
      - "http-generic-api/scripts/delegation-mariadb-production-cycle.mjs"
      - "http-generic-api/scripts/spec011-phase5-validation-lab.mjs"
      - "http-generic-api/test-delegation-grant-mariadb-*.mjs"
      - "http-generic-api/test-spec011-phase5-validation-ci.mjs"
      - ".github/workflows/spec-011-delegation-mariadb-certification.yml"
      - "specs/011-durable-governed-execution-and-agent-delegation/**"

permissions:
  contents: read

jobs:
  disposable-mariadb-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: spec011_delegation_cert_ci
          MARIADB_USER: spec011
          MARIADB_PASSWORD: spec011
          MARIADB_ROOT_PASSWORD: spec011-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: http-generic-api
    steps:
      - name: Check out pull request
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run focused contract tests
        run: |
          node test-delegation-grant-lifecycle-shadow.mjs
          node test-delegation-grant-repository-mutation.mjs
          node test-delegation-grant-mariadb-adapter-contract.mjs
          node test-delegation-grant-mariadb-readiness-collector.mjs
          node test-delegation-grant-mariadb-runtime-binding.mjs
          node test-spec011-phase5-validation-ci.mjs

      - name: Certify governed migration and lifecycle on disposable MariaDB
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: spec011_delegation_cert_ci
          DB_USER: spec011
          DB_PASSWORD: spec011
          DB_CONNECT_TIMEOUT_MS: 10000
          DELEGATION_MARIADB_CERTIFICATION_MODE: disposable
        run: node scripts/delegation-mariadb-disposable-certification.mjs

      - name: Validate certification artifact
        run: |
          node -e 'const fs=require("fs"); const p="artifacts/delegation-mariadb-certification.json"; const v=JSON.parse(fs.readFileSync(p,"utf8")); if(!v.ok||v.production_authorized!==false||!v.lifecycle?.create_verified||!v.lifecycle?.revoke_verified||!v.lifecycle?.expire_verified||v.lifecycle?.runtime_policy_ready_zero!==true) process.exit(1);'

      - name: Run Phase 5 structured validation lab
        if: always()
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: spec011_delegation_cert_ci
          DB_USER: spec011
          DB_PASSWORD: spec011
          DB_CONNECT_TIMEOUT_MS: 10000
          DELEGATION_MARIADB_CERTIFICATION_MODE: disposable
        run: node scripts/spec011-phase5-validation-lab.mjs

      - name: Require structured diagnosis artifact
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'artifacts/spec011-phase5-validation-ci.json';
          if (!fs.existsSync(path)) {
            fs.mkdirSync('artifacts', { recursive: true });
            fs.writeFileSync(path, JSON.stringify({
              ok: false,
              report_type: 'spec011_phase5_structured_ci_report',
              schema_version: 'spec011-structured-ci-diagnosis-v1',
              status: 'failed',
              gates: [{
                schema_version: 'spec011-structured-ci-diagnosis-v1',
                gate_id: 'pipeline_bootstrap',
                status: 'fail',
                code: 'STRUCTURED_DIAGNOSIS_ARTIFACT_MISSING',
                summary: 'The Phase 5 pipeline stopped before its structured diagnosis artifact was produced.',
                blockers: ['STRUCTURED_DIAGNOSIS_ARTIFACT_MISSING'],
                evidence_refs: ['workflow://spec-011-delegation-mariadb-certification'],
                remediation: ['Inspect bootstrap and dependency steps, then rerun the exact-head workflow.'],
                metadata: { failure_stage: 'pipeline_bootstrap' },
                observed_at: new Date().toISOString(),
                secrets_included: false
              }],
              failed_gate_ids: ['pipeline_bootstrap'],
              production_authorized: false,
              secrets_included: false
            }, null, 2) + '\n');
          }
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          const gates = Array.isArray(report.gates) ? report.gates : [];
          const validGate = (gate) => gate
            && gate.schema_version === 'spec011-structured-ci-diagnosis-v1'
            && typeof gate.gate_id === 'string' && gate.gate_id.length > 0
            && ['pass', 'fail', 'blocked'].includes(gate.status)
            && typeof gate.code === 'string' && gate.code.length > 0
            && typeof gate.summary === 'string' && gate.summary.length > 0
            && Array.isArray(gate.blockers)
            && Array.isArray(gate.remediation)
            && gate.secrets_included === false
            && (gate.status === 'pass' || (gate.blockers.length > 0 && gate.remediation.length > 0));
          if (report.schema_version !== 'spec011-structured-ci-diagnosis-v1'
              || gates.length === 0
              || !gates.every(validGate)
              || report.secrets_included !== false) {
            console.error('Structured diagnosis artifact is invalid.');
            process.exit(1);
          }
          if (report.status !== 'pass' || report.ok !== true) {
            console.error(`Phase 5 structured gates failed: ${JSON.stringify(report.failed_gate_ids || [])}`);
            process.exit(1);
          }
          if (report.migration_apply_authorization?.apply_authorized !== true
              || report.migration_apply_authorization?.decision !== 'authorized') {
            console.error('Migration apply authorization is not backed by verified engine evidence.');
            process.exit(1);
          }
          NODE

      - name: Upload bounded certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec011-delegation-mariadb-certification
          path: http-generic-api/artifacts/delegation-mariadb-certification.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Phase 5 structured diagnosis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec011-phase5-validation-ci
          path: http-generic-api/artifacts/spec011-phase5-validation-ci.json
          if-no-files-found: error
          retention-days: 30
