name: Staging Recovery Signed Certification

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current main SHA already deployed to local Windows/Docker Staging
        required: true
        type: string
      confirmation:
        description: Type RUN_STAGING_RECOVERY_CERTIFICATION
        required: true
        type: string
      staging_repository_path:
        description: Persistent Windows repository path that owns .env.staging and .staging-data
        required: true
        default: M:\Users\Nagy\Repo\multi-business-multi-role-growth-intelligence-os
        type: string
      registration_evidence_path:
        description: Path relative to the persistent repository containing fresh ChatGPT registration observation JSON
        required: true
        default: http-generic-api\.staging-data\app\recovery-readiness\external-evidence\chatgpt-registration.json
        type: string
      oauth_evidence_path:
        description: Path relative to the persistent repository containing fresh OAuth browser round-trip observation JSON
        required: true
        default: http-generic-api\.staging-data\app\recovery-readiness\external-evidence\oauth-browser-round-trip.json
        type: string

permissions:
  contents: read

concurrency:
  group: staging-recovery-certification
  cancel-in-progress: false

jobs:
  certify:
    name: Certify exact main on Windows Staging
    runs-on: [self-hosted, Windows]
    environment: staging
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      CONFIRMATION: ${{ inputs.confirmation }}
      STAGING_REPOSITORY_PATH: ${{ inputs.staging_repository_path }}
      REGISTRATION_EVIDENCE_PATH: ${{ inputs.registration_evidence_path }}
      OAUTH_EVIDENCE_PATH: ${{ inputs.oauth_evidence_path }}
      CERTIFICATION_PRIVATE_KEY_PEM: ${{ secrets.RECOVERY_STAGING_CERTIFICATION_PRIVATE_KEY_PEM }}
    steps:
      - name: Validate explicit Staging certification authority
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CONFIRMATION -ne 'RUN_STAGING_RECOVERY_CERTIFICATION') { throw 'Explicit Staging certification confirmation is required.' }
          if ($env:SOURCE_SHA -cnotmatch '^[a-f0-9]{40}$') { throw 'source_sha must be an exact lowercase SHA.' }
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATION_PRIVATE_KEY_PEM)) { throw 'Dedicated Staging Recovery certification private-key secret is unavailable.' }
          if (-not (Test-Path -LiteralPath $env:STAGING_REPOSITORY_PATH -PathType Container)) { throw 'Persistent Staging repository path is unavailable on this runner.' }

      - name: Require persistent repository at exact current main without mutating it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location $env:STAGING_REPOSITORY_PATH
          try {
            git fetch --no-tags origin main
            $head = (git rev-parse HEAD).Trim().ToLowerInvariant()
            $main = (git rev-parse origin/main).Trim().ToLowerInvariant()
            if ($head -ne $env:SOURCE_SHA -or $main -ne $env:SOURCE_SHA) { throw "Persistent Staging repository is not exact current main. head=$head main=$main expected=$env:SOURCE_SHA" }
            if (git status --porcelain --untracked-files=no) { throw 'Tracked persistent Staging worktree is not clean.' }
            if (-not (Test-Path -LiteralPath '.\autopilot-portable-staging\Invoke-Staging-Recovery-Certification.ps1' -PathType Leaf)) { throw 'Certification launcher is not present on exact main.' }
          }
          finally { Pop-Location }

      - name: Run genuine signed Staging Recovery certification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $keyFile = Join-Path $env:RUNNER_TEMP ("staging-recovery-certification-{0}.pem" -f [Guid]::NewGuid().ToString('N'))
          try {
            [IO.File]::WriteAllText($keyFile, $env:CERTIFICATION_PRIVATE_KEY_PEM, [Text.UTF8Encoding]::new($false))
            $registration = Join-Path $env:STAGING_REPOSITORY_PATH $env:REGISTRATION_EVIDENCE_PATH
            $oauth = Join-Path $env:STAGING_REPOSITORY_PATH $env:OAUTH_EVIDENCE_PATH
            & (Join-Path $env:STAGING_REPOSITORY_PATH 'autopilot-portable-staging\Invoke-Staging-Recovery-Certification.ps1') `
              -RepositoryPath $env:STAGING_REPOSITORY_PATH `
              -ExpectedCommit $env:SOURCE_SHA `
              -CertificationPrivateKeyPath $keyFile `
              -RegistrationEvidencePath $registration `
              -OAuthEvidencePath $oauth `
              -Confirmation RUN_STAGING_RECOVERY_CERTIFICATION
            if ($LASTEXITCODE -ne 0) { throw "Certification runner returned $LASTEXITCODE" }
          }
          finally {
            Remove-Item -LiteralPath $keyFile -Force -ErrorAction SilentlyContinue
            Remove-Item Env:CERTIFICATION_PRIVATE_KEY_PEM -ErrorAction SilentlyContinue
          }

      - name: Record safety boundary
        if: always()
        shell: pwsh
        run: |
          @"
          ### Staging Recovery signed certification
          - source SHA: ``$env:SOURCE_SHA``
          - runner boundary: ``self-hosted Windows persistent Staging host``
          - certification private key entered app container: ``false``
          - Local Connector dependency: ``false``
          - Production deployment: ``false``
          - Production mutation: ``false``
          - database/schema/migration/grant mutation: ``false``
          - DNS/ruleset mutation: ``false``
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
