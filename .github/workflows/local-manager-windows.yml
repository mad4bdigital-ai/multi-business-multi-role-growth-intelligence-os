name: Build Local Manager Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/local-manager-windows/**'
      - 'http-generic-api/routes/localManagerBetaRoutes.js'
      - 'http-generic-api/test-local-manager-tool-release-owner.mjs'
      - '.github/workflows/local-manager-windows.yml'
  pull_request:
    paths:
      - 'apps/local-manager-windows/**'
      - 'http-generic-api/routes/localManagerBetaRoutes.js'
      - 'http-generic-api/test-local-manager-tool-release-owner.mjs'
      - '.github/workflows/local-manager-windows.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: local-manager-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore apps/local-manager-windows/Mad4B.LocalManager.Windows.csproj

      - name: Publish single-file EXE
        run: >-
          dotnet publish apps/local-manager-windows/Mad4B.LocalManager.Windows.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -o dist/local-manager-windows

      - name: Rename EXE
        shell: pwsh
        run: |
          $source = 'dist/local-manager-windows/Mad4B-Local-Manager.exe'
          $projectPath = 'apps/local-manager-windows/Mad4B.LocalManager.Windows.csproj'
          [xml]$project = Get-Content -LiteralPath $projectPath
          $version = ($project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Expected <Version> in $projectPath" }
          $target = 'dist/Mad4B-Local-Manager-Setup.exe'
          $versionedTarget = "dist/Mad4B-Local-Manager-Setup-$version.exe"
          if (!(Test-Path $source)) { throw "Expected EXE not found: $source" }
          Copy-Item -LiteralPath $source -Destination $target -Force
          Copy-Item -LiteralPath $source -Destination $versionedTarget -Force
          Get-FileHash -Algorithm SHA256 -LiteralPath $target | ConvertTo-Json | Out-File -Encoding utf8 'dist/Mad4B-Local-Manager-Setup.exe.sha256.json'
          Get-FileHash -Algorithm SHA256 -LiteralPath $versionedTarget | ConvertTo-Json | Out-File -Encoding utf8 "dist/Mad4B-Local-Manager-Setup-$version.exe.sha256.json"

      - name: Validate update metadata matches EXE version
        shell: pwsh
        run: |
          $projectPath = 'apps/local-manager-windows/Mad4B.LocalManager.Windows.csproj'
          $routePath = 'http-generic-api/routes/localManagerBetaRoutes.js'
          [xml]$project = Get-Content -LiteralPath $projectPath
          $version = ($project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Expected <Version> in $projectPath" }
          $route = Get-Content -Raw -LiteralPath $routePath
          if ($route -notmatch "LOCAL_MANAGER_WINDOWS_LATEST_VERSION = `"$([regex]::Escape($version))`"") { throw "Update route does not advertise Local Manager Windows version $version" }
          if ($route -notmatch "Mad4B-Local-Manager-Setup-$([regex]::Escape($version))\.exe") { throw "Update route EXE URL does not point at the versioned $version asset" }
          if ($route -notmatch "Mad4B-Local-Manager-Setup-$([regex]::Escape($version))\.exe\.sha256\.json") { throw "Update route SHA256 URL does not point at the versioned $version checksum asset" }
          foreach ($path in @("dist/Mad4B-Local-Manager-Setup.exe", "dist/Mad4B-Local-Manager-Setup.exe.sha256.json", "dist/Mad4B-Local-Manager-Setup-$version.exe", "dist/Mad4B-Local-Manager-Setup-$version.exe.sha256.json")) {
            if (!(Test-Path -LiteralPath $path)) { throw "Expected Local Manager release artifact missing: $path" }
          }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Mad4B-Local-Manager-Windows-EXE
          path: |
            dist/Mad4B-Local-Manager-Setup*.exe
            dist/Mad4B-Local-Manager-Setup*.sha256.json
          if-no-files-found: error
