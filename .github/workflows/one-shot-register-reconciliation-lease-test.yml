name: One-shot Register Reconciliation Lease Test

on:
  push:
    branches:
      - gpt/reconciliation-lease-control-surface-v2-20260730
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: gpt/reconciliation-lease-control-surface-v2-20260730
          fetch-depth: 0

      - name: Register focused test
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'http-generic-api/scripts/test-manifest.mjs';
          const marker = '  "node test-repository-operation-lease-service.mjs",';
          const entry = '  "node test-repository-reconciliation-lease-control.mjs",';
          let source = fs.readFileSync(path, 'utf8');
          let count = source.split(entry).length - 1;
          if (count > 1) {
            throw new Error(`lease test manifest entry duplicated ${count} times`);
          }
          if (count === 0) {
            if (!source.includes(marker)) {
              throw new Error('repository operation lease marker not found');
            }
            source = source.replace(marker, `${marker}\n${entry}`);
            fs.writeFileSync(path, source);
          }
          source = fs.readFileSync(path, 'utf8');
          count = source.split(entry).length - 1;
          if (count !== 1) {
            throw new Error(`expected exactly one lease test manifest entry, found ${count}`);
          }
          NODE
          node --check http-generic-api/scripts/test-manifest.mjs

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-register-reconciliation-lease-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add http-generic-api/scripts/test-manifest.mjs .github/workflows/one-shot-register-reconciliation-lease-test.yml
          if git diff --cached --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git commit -m "test: register reconciliation lease control"
          git push origin HEAD:gpt/reconciliation-lease-control-surface-v2-20260730
