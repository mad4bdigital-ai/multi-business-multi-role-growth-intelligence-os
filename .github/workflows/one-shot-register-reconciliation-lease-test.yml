name: One-shot Register Reconciliation Lease Test

on:
  push:
    branches:
      - gpt/reconciliation-lease-control-surface-v2-20260730
    paths:
      - .github/workflows/one-shot-register-reconciliation-lease-test.yml

permissions:
  contents: write

concurrency:
  group: one-shot-register-reconciliation-lease-test
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governed branch
        uses: actions/checkout@v5
        with:
          ref: gpt/reconciliation-lease-control-surface-v2-20260730
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Register exact test command
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("http-generic-api/scripts/test-manifest.mjs")
          source = path.read_text(encoding="utf-8")
          existing = '  "node test-repository-reconciliation-lease-control.mjs",\n'
          anchor = '  "node test-repository-operation-lease-service.mjs",\n'
          if existing in source:
              raise SystemExit("lease control test is already registered")
          if source.count(anchor) != 1:
              raise SystemExit(f"expected exactly one manifest anchor, found {source.count(anchor)}")
          source = source.replace(anchor, anchor + existing, 1)
          path.write_text(source, encoding="utf-8")
          PY

      - name: Verify manifest and focused test
        shell: bash
        run: |
          node --check http-generic-api/scripts/test-manifest.mjs
          cd http-generic-api
          node test-repository-reconciliation-lease-control.mjs
          git diff --check
          git diff -- scripts/test-manifest.mjs

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/one-shot-register-reconciliation-lease-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add http-generic-api/scripts/test-manifest.mjs .github/workflows/one-shot-register-reconciliation-lease-test.yml
          git commit -m "test(governance): register reconciliation lease control"
          git push origin HEAD:gpt/reconciliation-lease-control-surface-v2-20260730
