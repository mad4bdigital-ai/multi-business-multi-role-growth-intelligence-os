name: Work Map Registry Binding PR 6484 R3 Once

on:
  push:
    branches:
      - gpt/fix-production-runtime-parity-runner-context-20260806
    paths:
      - .github/workflows/work-map-registry-binding-pr6484-r3-once.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: work-map-registry-binding-pr6484-r3-once
  cancel-in-progress: false

jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR branch head
        uses: actions/checkout@v5
        with:
          ref: gpt/fix-production-runtime-parity-runner-context-20260806
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify immutable PR binding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BRANCH: gpt/fix-production-runtime-parity-runner-context-20260806
          EXPECTED_PR: '6484'
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse --abbrev-ref HEAD)" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${EXPECTED_PR}" --jq '.state')" = open
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${EXPECTED_PR}" --jq '.draft')" = true
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${EXPECTED_PR}" --jq '.head.ref')" = "${EXPECTED_BRANCH}"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${EXPECTED_PR}" --jq '.head.sha')" = "${GITHUB_SHA}"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${EXPECTED_PR}" --jq '.base.ref')" = main

      - name: Patch the two final-tree registry bindings
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const paths = [
            'specs/014-governed-hostinger-storage-orchestration/work-map-integration.json',
            'specs/014-retail-commerce-operations-growth-os/work-map-integration.json'
          ];
          const expected = {
            fingerprint: 'e21b51645d386e808795dc8a595bc86d41409479fac8fa7126b3ad9d4a255d98',
            index_source_hash: '0809e29e13cdd54258d53f6da4f143ca0365c01788bdb1004727bce787f85410',
            coverage_source_hash: 'e12cbc5ae9c4a743221ae6d33004741f492cd91c4ae2cbc82c05b7c3fd60537b',
            map_count: 19,
            domain_count: 16,
            uncategorized_count: 0,
            taxonomy_gap_cluster_count: 0
          };
          for (const path of paths) {
            const value = JSON.parse(fs.readFileSync(path, 'utf8'));
            value.registry = { ...value.registry, ...expected };
            fs.writeFileSync(path, `${JSON.stringify(value, null, 2)}\n`);
          }
          NODE

          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            'specs/014-governed-hostinger-storage-orchestration/work-map-integration.json'
            'specs/014-retail-commerce-operations-growth-os/work-map-integration.json'
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${changed[$index]}" = "${expected[$index]}"
          done

          node - <<'NODE'
          const fs = require('node:fs');
          const paths = [
            'specs/014-governed-hostinger-storage-orchestration/work-map-integration.json',
            'specs/014-retail-commerce-operations-growth-os/work-map-integration.json'
          ];
          for (const path of paths) {
            const value = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (value.registry.fingerprint !== 'e21b51645d386e808795dc8a595bc86d41409479fac8fa7126b3ad9d4a255d98') process.exit(1);
            if (value.registry.index_source_hash !== '0809e29e13cdd54258d53f6da4f143ca0365c01788bdb1004727bce787f85410') process.exit(1);
          }
          NODE

      - name: Commit and fast-forward the two manifests
        shell: bash
        env:
          EXPECTED_BRANCH: gpt/fix-production-runtime-parity-runner-context-20260806
        run: |
          set -Eeuo pipefail
          test "$(git ls-remote origin "refs/heads/${EXPECTED_BRANCH}" | awk '{print $1}')" = "${GITHUB_SHA}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/014-governed-hostinger-storage-orchestration/work-map-integration.json specs/014-retail-commerce-operations-growth-os/work-map-integration.json
          git commit -m 'docs(work-maps): refresh final registry bindings'
          git push origin "HEAD:refs/heads/${EXPECTED_BRANCH}"
