name: Surface Callability Write Set Capture

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

permissions:
  contents: write

jobs:
  capture:
    if: >-
      github.event.pull_request.head.ref == 'gpt/surface-callability-main-reconstruction-20260803' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: gpt/surface-callability-main-reconstruction-20260803
      PINNED_HEAD: c0de8fbfdc75b0320a0f1e8e1150c8803eadf805
      VALIDATOR_PATH: .github/workflows/surface-callability-product-validation.yml
      CAPTURE_PATH: .github/workflows/surface-callability-write-set-capture.yml
      REPORT_PATH: docs/surface-finalizer-write-set.txt
    steps:
      - name: Check out exact Surface branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact capture trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PINNED_HEAD"
          test "$(git diff --name-only HEAD^ HEAD)" = "$CAPTURE_PATH"

      - name: Apply reviewed scope patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          validator = Path('.github/workflows/surface-callability-product-validation.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = validator.find(start_marker)
          if start < 0:
              raise SystemExit('validator_patch_start_missing')
          start += len(start_marker)
          end = validator.find(end_marker, start)
          if end < 0:
              raise SystemExit('validator_patch_end_missing')
          Path('/tmp/apply_surface_queue_scope.py').write_text(textwrap.dedent(validator[start:end]))
          PY
          python3 /tmp/apply_surface_queue_scope.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Regenerate Surface evidence for capture
        working-directory: http-generic-api
        run: |
          set -euo pipefail
          npm ci
          node scripts/surface-callability-closure/generate_closure_contracts.mjs
          npm run frontend:dispatch:generate
          node scripts/surface-contract-discovery.mjs --write

      - name: Capture write set and discard generated workspace
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-status > /tmp/surface-finalizer-write-set.txt
          git reset --hard HEAD
          mkdir -p "$(dirname "$REPORT_PATH")"
          cp /tmp/surface-finalizer-write-set.txt "$REPORT_PATH"
          rm -f "$CAPTURE_PATH"

      - name: Commit diagnostic report only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$REPORT_PATH" "$CAPTURE_PATH"
          git commit -m 'chore: capture exact Surface finalizer write set'
          git push origin "HEAD:${TARGET_BRANCH}"
