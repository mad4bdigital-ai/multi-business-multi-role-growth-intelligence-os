# Trigger commit: execute only from an exact helper head and self-delete before final fingerprinting.
name: PR 6429 generalized Work Map binding refresh

on:
  push:
    branches:
      - gpt/repair/pr6429-generalized-work-map-binding-20260806

permissions:
  contents: write

concurrency:
  group: pr6429-generalized-work-map-binding-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      HELPER_BRANCH: gpt/repair/pr6429-generalized-work-map-binding-20260806
      BASE_SHA: a439dd43df36f8c8505f886f972a2a793a84891f
      RETAIL_FEATURE: 014-retail-commerce-operations-growth-os
      WORKFLOW_PATH: .github/workflows/pr6429-generalized-work-map-binding-refresh.yml
      WORK_MAP_CHANGED_FILES_JSON: '["http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs","http-generic-api/test-spec014-refresh-final-work-map-binding.mjs","specs/014-retail-commerce-operations-growth-os/work-map-integration.json"]'
    steps:
      - name: Checkout exact helper head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up repository Node contract
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          check-latest: false

      - name: Verify immutable helper and runtime binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          remote_sha="$(git ls-remote origin "refs/heads/${HELPER_BRANCH}" | awk '{print $1}')"
          test "${remote_sha}" = "${GITHUB_SHA}"
          test "$(git merge-base "${BASE_SHA}" HEAD)" = "${BASE_SHA}"
          node_version="$(node --version)"
          case "${node_version}" in
            v22.*) ;;
            *) echo "Expected Node 22 from .nvmrc, got ${node_version}" >&2; exit 1 ;;
          esac
          command -v node
          node --version

      - name: Remove temporary workflow before fingerprinting
        shell: bash
        run: |
          set -euo pipefail
          rm "${WORKFLOW_PATH}"
          git add -A -- "${WORKFLOW_PATH}"

      - name: Validate generalized producer syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs
          node --check http-generic-api/test-spec014-refresh-final-work-map-binding.mjs

      - name: Refresh Retail binding with canonical registry
        shell: bash
        run: |
          set -euo pipefail
          evidence_root="${RUNNER_TEMP}/pr6429-generalized-work-map-binding-refresh"
          mkdir -p "${evidence_root}"
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            --feature-key "${RETAIL_FEATURE}" | tee "${evidence_root}/producer.json"

      - name: Verify producer and regression contracts
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --check
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            --feature-key "${RETAIL_FEATURE}" --check
          node http-generic-api/test-spec014-refresh-final-work-map-binding.mjs

      - name: Check generated Work Map parity
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/platform-work-map-generator.mjs --check

      - name: Check Work Map pipeline connectivity
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/pipeline-connectivity-check.mjs

      - name: Check schema classification contracts
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/work-map-schema-classification-contract.mjs
          node http-generic-api/scripts/work-map-schema-classification.mjs

      - name: Enforce Work Map governance gate
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/spec-kit-work-map-governance-gate.mjs --ci --changed

      - name: Run focused Work Map regressions
        shell: bash
        run: |
          set -euo pipefail
          cd http-generic-api
          node test-work-map-schema-classification.mjs
          node test-work-map-schema-classification-contract.mjs
          node test-spec-kit-work-map-governance-gate.mjs

      - name: Enforce bounded final scope
        shell: bash
        run: |
          set -euo pipefail
          manifest="specs/${RETAIL_FEATURE}/work-map-integration.json"
          git add -- "${manifest}"
          mapfile -t staged < <(git diff --cached --name-only | LC_ALL=C sort)
          printf '%s\n' "${staged[@]}"
          expected="$(printf '%s\n' "${WORKFLOW_PATH}" "${manifest}" | LC_ALL=C sort)"
          actual="$(printf '%s\n' "${staged[@]}")"
          test "${actual}" = "${expected}"

          expected_final="$(printf '%s\n' \
            'http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs' \
            'http-generic-api/test-spec014-refresh-final-work-map-binding.mjs' \
            "${manifest}" | LC_ALL=C sort)"
          candidate_final="$(git diff --cached --name-only "${BASE_SHA}" | LC_ALL=C sort)"
          printf '%s\n' "${candidate_final}"
          test "${candidate_final}" = "${expected_final}"
          printf '%s\n' "${expected_final}" > "${RUNNER_TEMP}/expected-final-scope.txt"

      - name: Commit candidate and prove final readback
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(work-maps): refresh Retail binding with generalized producer"

          actual_final="$(git diff --name-only "${BASE_SHA}...HEAD" | LC_ALL=C sort)"
          expected_final="$(cat "${RUNNER_TEMP}/expected-final-scope.txt")"
          test "${actual_final}" = "${expected_final}"
          test ! -e "${WORKFLOW_PATH}"

          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --check
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            --feature-key "${RETAIL_FEATURE}" --check
          node http-generic-api/scripts/spec-kit-work-map-governance-gate.mjs --ci --changed

          evidence_root="${RUNNER_TEMP}/pr6429-generalized-work-map-binding-refresh"
          git diff --stat "${BASE_SHA}...HEAD" > "${evidence_root}/diff-stat.txt"
          git diff --name-only "${BASE_SHA}...HEAD" > "${evidence_root}/changed-files.txt"
          final_sha="$(git rev-parse HEAD)"
          node - "${evidence_root}" "${final_sha}" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.argv[2];
          const finalSha = process.argv[3];
          const changedFiles = fs.readFileSync(path.join(root, 'changed-files.txt'), 'utf8')
            .split(/\r?\n/).filter(Boolean);
          const report = {
            contract: 'mad4b.pr6429-generalized-work-map-binding-refresh.v1',
            repository: process.env.GITHUB_REPOSITORY,
            run_id: process.env.GITHUB_RUN_ID,
            event_sha: process.env.GITHUB_SHA,
            base_sha: process.env.BASE_SHA,
            final_sha: finalSha,
            feature_key: process.env.RETAIL_FEATURE,
            node_version: process.version,
            changed_files: changedFiles,
            changed_file_count: changedFiles.length,
            force_push: false,
            remote_write_target: process.env.HELPER_BRANCH,
            production_mutation: false,
            migration_apply: false,
            provider_dispatch: false,
            secrets_included: false
          };
          fs.writeFileSync(path.join(root, 'summary.json'), `${JSON.stringify(report, null, 2)}\n`);
          NODE

      - name: Push without force after remote readback
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/${HELPER_BRANCH}" | awk '{print $1}')"
          test "${remote_sha}" = "${GITHUB_SHA}"
          git push origin "HEAD:refs/heads/${HELPER_BRANCH}"
          pushed_sha="$(git rev-parse HEAD)"
          remote_after="$(git ls-remote origin "refs/heads/${HELPER_BRANCH}" | awk '{print $1}')"
          test "${remote_after}" = "${pushed_sha}"

      - name: Upload refresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr6429-generalized-work-map-binding-refresh-${{ github.sha }}
          path: ${{ runner.temp }}/pr6429-generalized-work-map-binding-refresh
          if-no-files-found: warn
          retention-days: 14
