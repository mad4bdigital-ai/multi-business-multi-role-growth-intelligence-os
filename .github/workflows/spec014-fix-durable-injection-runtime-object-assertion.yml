name: Spec014 Fix Durable Injection Runtime Object Assertion

on:
  push:
    branches:
      - gpt/014-hostinger/durable-injection-readback-state-20260802
    paths:
      - '.github/workflows/spec014-fix-durable-injection-runtime-object-assertion.yml'

permissions:
  contents: write

concurrency:
  group: spec014-fix-durable-injection-runtime-object-assertion
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_BRANCH: gpt/014-hostinger/durable-injection-readback-state-20260802
      EXPECTED_PARENT_SHA: f5880fffcb002b75e39b57f1aa14359fc2d53103
      TEST_FILE: http-generic-api/test-hostinger-storage-durable-injection-readback-state.mjs
      LAUNCHER_FILE: .github/workflows/spec014-fix-durable-injection-runtime-object-assertion.yml
      EVIDENCE_DIR: .ci-evidence/spec014-durable-injection-runtime-object-assertion
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install exact dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Apply bounded assertion repair
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          current_stage='verify_identity'
          on_error() {
            local status=$?
            trap - ERR
            STATUS="${status}" STAGE="${current_stage}" COMMAND="${BASH_COMMAND:-unknown}" python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ['EVIDENCE_DIR'], 'summary.json').write_text(json.dumps({
            'contract': 'mad4b.spec014-durable-injection-runtime-object-assertion-repair.v1',
            'outcome': 'blocked',
            'expected_parent_sha': os.environ['EXPECTED_PARENT_SHA'],
            'target_branch': os.environ['TARGET_BRANCH'],
            'failure': {
              'stage': os.environ['STAGE'],
              'exit_status': int(os.environ['STATUS']),
              'command': os.environ['COMMAND'],
            },
            'repository_push_performed': False,
            'force_push': False,
            'job_logs_consulted': False,
            'secrets_included': False,
          }, indent=2) + '\n')
          PY
            exit "${status}"
          }
          trap on_error ERR

          remote_sha="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          local_sha="$(git rev-parse HEAD)"
          [[ "${remote_sha}" == "${local_sha}" ]]
          [[ "$(git rev-parse HEAD^)" == "${EXPECTED_PARENT_SHA}" ]]
          unexpected="$(git diff --name-only "${EXPECTED_PARENT_SHA}" HEAD | grep -vxF "${LAUNCHER_FILE}" || true)"
          [[ -z "${unexpected}" ]]

          current_stage='patch_test'
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path(os.environ['TEST_FILE'])
          text = path.read_text(encoding='utf-8')
          helper_anchor = """function deepClone(value) {
  return structuredClone(value);
}
"""
          helper_replacement = """function deepClone(value) {
  return structuredClone(value);
}

function containsRuntimeObject(value, active = new WeakSet()) {
  if (typeof value === 'function') return true;
  if (!value || typeof value !== 'object') return false;
  if (active.has(value)) return true;
  active.add(value);
  try {
    if (Object.hasOwn(value, 'tenantStorageRuntime')) return true;
    return Object.values(value).some((child) => containsRuntimeObject(child, active));
  } finally {
    active.delete(value);
  }
}
"""
          old_assertion = "assert.equal(JSON.stringify(persisted.state).includes('tenantStorageRuntime'), false);"
          new_assertion = "assert.equal(containsRuntimeObject(persisted.state), false);"
          if text.count(helper_anchor) != 1:
              raise SystemExit(f'expected one deepClone anchor, found {text.count(helper_anchor)}')
          if text.count(old_assertion) != 1:
              raise SystemExit(f'expected one invalid assertion, found {text.count(old_assertion)}')
          text = text.replace(helper_anchor, helper_replacement)
          text = text.replace(old_assertion, new_assertion)
          path.write_text(text, encoding='utf-8')
          PY

          current_stage='validate_syntax'
          node --check "${TEST_FILE}"

          current_stage='validate_focused_contract'
          node "${TEST_FILE}" > "${EVIDENCE_DIR}/focused-test.stdout" 2> "${EVIDENCE_DIR}/focused-test.stderr"

          current_stage='commit_patch'
          git rm "${LAUNCHER_FILE}"
          git add -- "${TEST_FILE}"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(spec-014): distinguish runtime object from dependency metadata'
          result_sha="$(git rev-parse HEAD)"

          current_stage='write_success_evidence'
          RESULT_SHA="${result_sha}" python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ['EVIDENCE_DIR'], 'summary.json').write_text(json.dumps({
            'contract': 'mad4b.spec014-durable-injection-runtime-object-assertion-repair.v1',
            'outcome': 'passed',
            'expected_parent_sha': os.environ['EXPECTED_PARENT_SHA'],
            'result_sha': os.environ['RESULT_SHA'],
            'target_branch': os.environ['TARGET_BRANCH'],
            'runtime_object_property_absence_verified_recursively': True,
            'dependency_key_metadata_allowed': True,
            'focused_contract_passed': True,
            'launcher_removed': True,
            'repository_push_performed': True,
            'force_push': False,
            'job_logs_consulted': False,
            'secrets_included': False,
          }, indent=2) + '\n')
          PY

          current_stage='push_patch'
          git push origin "HEAD:${TARGET_BRANCH}"
          trap - ERR

      - name: Upload structured repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec014-durable-injection-runtime-object-assertion-${{ github.run_id }}
          path: |
            ${{ env.EVIDENCE_DIR }}/summary.json
            ${{ env.EVIDENCE_DIR }}/focused-test.stdout
            ${{ env.EVIDENCE_DIR }}/focused-test.stderr
          if-no-files-found: error
          retention-days: 14
