# synchronize-trigger: production-topology-5e5178bb-v2
name: Read Back Production Topology 5E5178BB

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-production-runtime-parity-5e5178bb.yml"

permissions:
  contents: read

concurrency:
  group: readback-production-topology-5e5178bb
  cancel-in-progress: false

jobs:
  public-get-only-topology:
    name: Public GET-only Production topology
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/dispatch-production-runtime-parity-5e5178bb-20260803' &&
      github.event.pull_request.user.id == 271942579
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      CONTROL_ISSUE: '4953'
      EXPECTED_PRODUCTION_SHA: 5e5178bb7d5b86fe42a5eb97e647a5d65edaaceb
      REPORT_DIR: ${{ runner.temp }}/production-topology-5e5178bb
    steps:
      - name: Verify current protected authority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "/repos/${REPOSITORY}/issues/${CONTROL_ISSUE}" --jq '.state')" = "open"
          test "$(gh api "/repos/${REPOSITORY}/git/ref/heads/Production" --jq '.object.sha')" = "${EXPECTED_PRODUCTION_SHA}"

      - name: Fetch bounded public endpoint responses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${REPORT_DIR}"

          fetch_json() {
            local name="$1"
            local url="$2"
            local raw="${REPORT_DIR}/${name}.raw"
            local safe="${REPORT_DIR}/${name}.json"
            local status
            status="$(curl --silent --show-error --max-time 20 --proto '=https' --tlsv1.2 \
              --header 'accept: application/json' \
              --output "${raw}" \
              --write-out '%{http_code}' \
              "${url}")"
            printf '%s\n' "${status}" > "${REPORT_DIR}/${name}.http-status"
            test "$(wc -c < "${raw}")" -le 65536
            jq 'walk(if type == "object" then with_entries(if (.key | test("authorization|cookie|password|secret|token|api[_-]?key|private[_-]?key|credential"; "i")) then .value = "[REDACTED]" else . end) else . end)' \
              "${raw}" > "${safe}"
            rm -f "${raw}"
          }

          fetch_json health https://auth.mad4b.com/health
          fetch_json version https://auth.mad4b.com/version
          fetch_json deployment-info https://auth.mad4b.com/deployment-info
          fetch_json connector-agent-version https://auth.mad4b.com/connector-agent/version

          jq -n \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg expected_sha "${EXPECTED_PRODUCTION_SHA}" \
            --arg health_status "$(cat "${REPORT_DIR}/health.http-status")" \
            --arg version_status "$(cat "${REPORT_DIR}/version.http-status")" \
            --arg deployment_status "$(cat "${REPORT_DIR}/deployment-info.http-status")" \
            --arg connector_status "$(cat "${REPORT_DIR}/connector-agent-version.http-status")" \
            '{
              contract: "mad4b.production-topology-public-readback.v1",
              generated_at: $generated_at,
              run_id: $run_id,
              expected_production_sha: $expected_sha,
              http_status: {
                health: ($health_status | tonumber),
                version: ($version_status | tonumber),
                deployment_info: ($deployment_status | tonumber),
                connector_agent_version: ($connector_status | tonumber)
              },
              public_get_only: true,
              credential_access_performed: false,
              provider_mutation_performed: false,
              restart_performed: false,
              secrets_included: false
            }' > "${REPORT_DIR}/metadata.json"

      - name: Upload public topology evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-topology-5e5178bb-${{ github.run_id }}
          path: ${{ runner.temp }}/production-topology-5e5178bb/*
          if-no-files-found: error
          retention-days: 30

      - name: Prove secret-free no-mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .contract == "mad4b.production-topology-public-readback.v1" and
            .expected_production_sha == "5e5178bb7d5b86fe42a5eb97e647a5d65edaaceb" and
            .public_get_only == true and
            .credential_access_performed == false and
            .provider_mutation_performed == false and
            .restart_performed == false and
            .secrets_included == false
          ' "${REPORT_DIR}/metadata.json" >/dev/null
