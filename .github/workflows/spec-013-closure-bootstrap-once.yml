name: Spec 013 Closure Bootstrap Once

on:
  push:
    branches:
      - fix/spec-013-post-merge-contract-closure-20260731
    paths:
      - .github/workflows/spec-013-closure-bootstrap-once.yml

permissions:
  contents: write

concurrency:
  group: spec-013-closure-bootstrap-once
  cancel-in-progress: false

jobs:
  patch-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/spec-013-post-merge-contract-closure-20260731
          fetch-depth: 0
          persist-credentials: true

      - name: Repair one-shot runner and self-clean
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          target = Path('.github/workflows/spec-013-post-merge-contract-closure.yml')
          text = target.read_text()

          syntax_old = "'''.replace(/^          /gm, ''))"
          syntax_new = "''')"
          assert text.count(syntax_old) == 1, 'expected Python/JavaScript syntax defect not found exactly once'
          text = text.replace(syntax_old, syntax_new)

          actor_old = "      github.event.pull_request.head.ref == 'fix/spec-013-post-merge-contract-closure-20260731' &&\n      github.actor != 'github-actions[bot]'"
          actor_new = "      github.event.pull_request.head.ref == 'fix/spec-013-post-merge-contract-closure-20260731'"
          assert text.count(actor_old) == 1, 'one-shot actor guard shape changed'
          text = text.replace(actor_old, actor_new)

          commit_old = '''          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all'''
          commit_new = '''          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/spec-013-post-merge-contract-closure.yml
          git add --all'''
          assert text.count(commit_old) == 1, 'one-shot commit block shape changed'
          text = text.replace(commit_old, commit_new)

          target.write_text(text)
          Path('.github/workflows/spec-013-closure-bootstrap-once.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "chore(spec-013): repair bounded closure runner"
          git push origin HEAD:fix/spec-013-post-merge-contract-closure-20260731
