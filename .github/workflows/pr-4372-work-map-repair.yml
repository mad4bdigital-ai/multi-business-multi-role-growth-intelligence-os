name: PR 4372 One-shot Work Map Repair

on:
  push:
    branches:
      - gpt/governed-reconciliation-kernel-review-hardening-current-main-20260801

permissions:
  contents: write

concurrency:
  group: pr-4372-one-shot-work-map-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Regenerate and self-remove
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: gpt/governed-reconciliation-kernel-review-hardening-current-main-20260801
      SELF_PATH: .github/workflows/pr-4372-work-map-repair.yml
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify pinned remote head
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Regenerate exact-head Work Maps and prove idempotency
        shell: bash
        run: |
          set -euo pipefail
          rm "${SELF_PATH}"
          node http-generic-api/scripts/platform-work-map-generator.mjs --write

          unexpected="$(git diff --name-only | grep -v '^docs/work-maps/' | grep -v "^${SELF_PATH}$" || true)"
          if [[ -n "${unexpected}" ]]; then
            echo "Unexpected generated write set:"
            printf '%s\n' "${unexpected}"
            exit 1
          fi

          map_changes="$(git diff --name-only -- docs/work-maps | sort)"
          expected_changes="$(printf '%s\n' 'docs/work-maps/README.md' 'docs/work-maps/repository-automation-map.md' | sort)"
          test "${map_changes}" = "${expected_changes}"

          git diff --binary -- docs/work-maps > "${RUNNER_TEMP}/work-maps-first.diff"
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          git diff --binary -- docs/work-maps > "${RUNNER_TEMP}/work-maps-second.diff"
          cmp "${RUNNER_TEMP}/work-maps-first.diff" "${RUNNER_TEMP}/work-maps-second.diff"

      - name: Commit only generated maps and self-removal
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${GITHUB_SHA}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${SELF_PATH}" docs/work-maps/README.md docs/work-maps/repository-automation-map.md

          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' "${SELF_PATH}" 'docs/work-maps/README.md' 'docs/work-maps/repository-automation-map.md' | sort)"
          test "${staged}" = "${expected}"

          git commit -m 'docs(work-map): regenerate exact-head maps for PR 4372'
          git push origin "HEAD:${TARGET_BRANCH}"
