name: PR 2948 Clean Rebuild

on:
  push:
    branches:
      - gpt/pr2948-clean-scope-rebuild-20260730
    paths:
      - .github/workflows/pr2948-clean-rebuild.yml
      - http-generic-api/scripts/apply-pr2948-clean-rebuild.mjs

permissions:
  contents: write

env:
  TARGET_BRANCH: gpt/pr2948-clean-scope-rebuild-20260730

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout clean branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Apply clean-scope source port
        run: node http-generic-api/scripts/apply-pr2948-clean-rebuild.mjs

      - name: Regenerate canonical artifacts
        working-directory: http-generic-api
        run: npm run frontend:dispatch:generate -- --baseline-ref=main

      - name: Verify governance and dispatch contracts
        working-directory: http-generic-api
        run: |
          node test-dynamic-container-rollout-safety.mjs
          node test-frontend-operation-governance-generator.mjs
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-openapi-route-coverage.mjs
          npm run openapi:auth:check

      - name: Commit clean rebuilt tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr2948-clean-rebuild.yml
          git rm http-generic-api/scripts/apply-pr2948-clean-rebuild.mjs
          git add -- \
            http-generic-api/scripts/frontend-operation-governance-generator.mjs \
            http-generic-api/test-frontend-operation-governance-generator.mjs \
            http-generic-api/test-dynamic-container-rollout-safety.mjs \
            http-generic-api/frontend-operation-governance.generated.json \
            http-generic-api/frontend-surface-dispatch.generated.json \
            http-generic-api/openapi/frontend-runtime-routes.generated.yaml
          git diff --cached --check
          git commit -m "fix(governance): port canary state changes onto current generator"
          git push origin "HEAD:${TARGET_BRANCH}"
