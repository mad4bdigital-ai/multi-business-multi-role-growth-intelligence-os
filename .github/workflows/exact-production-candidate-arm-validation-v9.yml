name: Exact Production Candidate ARM Validation V9

on:
  pull_request:
    branches:
      - gpt/validate-production-arm-base-14433d15-v9
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: exact-production-candidate-arm-v9-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Exact Production Candidate Full ARM Validation
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/validate-production-candidate-14433d15-2669991a-v9' &&
      github.event.pull_request.head.sha == '9a2aaf9d331acb7fcf363cd98d63d7e809461059'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    env:
      EXPECTED_MAIN_SHA: 14433d15184bd7e7658281a356a7540e3d2d6dfe
      EXPECTED_PRODUCTION_SHA: 2669991a882c7f7939510fbbace17f462a42517c
      EXPECTED_HEAD_SHA: 9a2aaf9d331acb7fcf363cd98d63d7e809461059
      EXPECTED_HEAD_TREE: 20d8ce901a76e6f8acea30d3aca2baf52e5a1265
      EXPECTED_HEAD_REF: gpt/validate-production-candidate-14433d15-2669991a-v9
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            http-generic-api/package-lock.json

      - name: Verify immutable identity, ancestry, and tree parity
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.repo.full_name }}" = "$GITHUB_REPOSITORY"
          test "${{ github.event.pull_request.head.ref }}" = "$EXPECTED_HEAD_REF"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_HEAD_TREE"
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/Production:refs/remotes/origin/Production" \
            "+refs/heads/$EXPECTED_HEAD_REF:refs/remotes/origin/$EXPECTED_HEAD_REF"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse refs/remotes/origin/Production)" = "$EXPECTED_PRODUCTION_SHA"
          test "$(git rev-parse refs/remotes/origin/$EXPECTED_HEAD_REF)" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse "$EXPECTED_HEAD_SHA^1")" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse "$EXPECTED_HEAD_SHA^2")" = "$EXPECTED_PRODUCTION_SHA"
          test "$(git rev-parse "$EXPECTED_MAIN_SHA^{tree}")" = "$EXPECTED_HEAD_TREE"
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" "$EXPECTED_HEAD_SHA"
          git merge-base --is-ancestor "$EXPECTED_PRODUCTION_SHA" "$EXPECTED_HEAD_SHA"
          git diff --quiet "$EXPECTED_MAIN_SHA" "$EXPECTED_HEAD_SHA"
          test "$(git rev-list --parents -n 1 "$EXPECTED_HEAD_SHA" | wc -w)" -eq 3

      - name: Install deterministic dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix http-generic-api

      - name: Run canonical syntax and governance checks
        id: canonical
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/schema-docs-change-guard.mjs
          node http-generic-api/scripts/migration-placement-guard.mjs
          node http-generic-api/scripts/user-jwt-auth-governance.mjs
          node http-generic-api/scripts/interruption-readiness.mjs --ci --skip-dependencies --skip-worktree
          node validate-canonical-sources.mjs
          node build-canonicals.mjs --check
          node --check find-canonical-domain.mjs
          (cd http-generic-api && node scripts/resource-api-coverage-audit.mjs --ci --changed)
          (cd http-generic-api && node test-resource-api-architecture.mjs && node test-resource-api-service.mjs)
          node http-generic-api/scripts/spec-kit-completion-gate.mjs --ci --changed
          node validate-memory-schema.mjs
          git diff --check

      - name: Run complete Unit and Integration suite with exact provenance
        id: unit
        continue-on-error: true
        working-directory: http-generic-api
        shell: bash
        env:
          TEST_SUITE_REPORT_DIR: ${{ runner.temp }}/test-suite-reports
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_HEAD_SHA"
          GITHUB_SHA="$actual_sha" npm test

      - name: Verify exact test report provenance
        id: reports
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for report in \
            "$RUNNER_TEMP/test-suite-reports/test-manifest.json" \
            "$RUNNER_TEMP/test-suite-reports/test-suite.json"; do
            test -f "$report"
            test "$(jq -r '.status' "$report")" = passed
            test "$(jq -r '.commitSha' "$report")" = "$EXPECTED_HEAD_SHA"
            test "$(jq -r '.firstFailure' "$report")" = null
            test "$(jq -r '.secretsIncluded' "$report")" = false
          done

      - name: Verify deterministic Frontend contracts
        id: frontend
        continue-on-error: true
        working-directory: http-generic-api
        env:
          CANONICAL_BASELINE_REF: main
          TARGET_REF: Production
        shell: bash
        run: |
          set -euo pipefail
          npm run frontend:dispatch:generate -- --baseline-ref="$CANONICAL_BASELINE_REF"
          node test-frontend-dispatch-workflow-baseline.mjs
          node test-frontend-operation-governance-generator.mjs
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-openapi-route-coverage.mjs
          npm run openapi:auth:check
          test -z "$(git status --porcelain -- frontend-operation-governance.generated.json frontend-surface-dispatch.generated.json openapi/frontend-runtime-routes.generated.yaml)"

      - name: Prove runtime startup and deployment-manifest evidence
        id: runtime
        continue-on-error: true
        working-directory: http-generic-api
        env:
          FORCE_ROUTE_RUNTIME_TESTS: 'true'
          DEPLOYMENT_BRANCH: Production
          DEPLOYMENT_COMMIT_SHA: ${{ env.EXPECTED_HEAD_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          node test-deployment-manifest-generator.mjs
          npm run manifest:deployment
          node test-server-startup-smoke.mjs
          node test-hostinger-root-entrypoint.mjs
          node test-root-cause-activation-runtime-repair.mjs

      - name: Run focused Hostinger gates
        id: hostinger
        continue-on-error: true
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          node test-hostinger-storage-execution-authorization.mjs
          node test-hostinger-storage-control-plane-repository.mjs
          node test-hostinger-storage-control-plane-repository-brand.mjs
          node test-hostinger-storage-shared-canary-core-import-boundary.mjs
          node test-hostinger-storage-shared-canary.mjs

      - name: Run repository tool lifecycle governance
        id: lifecycle
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs
          mkdir -p "$RUNNER_TEMP/repository-tool-lifecycle"
          git diff --name-status "$EXPECTED_MAIN_SHA" "$EXPECTED_HEAD_SHA" > "$RUNNER_TEMP/repository-tool-changes.tsv"
          BASE_SHA="$EXPECTED_MAIN_SHA" CANDIDATE_SHA="$EXPECTED_HEAD_SHA" \
            node http-generic-api/scripts/maintenance-tools/repository-tool-lifecycle-guard.mjs \
              --changed-files "$RUNNER_TEMP/repository-tool-changes.tsv" \
              --policy .github/repository-maintenance-tool-governance.json \
              --output-dir "$RUNNER_TEMP/repository-tool-lifecycle"

      - name: Run Execution Resolver Gate
        id: resolver
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm test -- --runInBand

      - name: Run Architecture Drift Detection
        id: architecture
        continue-on-error: true
        working-directory: http-generic-api
        run: npm run validate

      - name: Run exact E2E evaluation and execution
        id: e2e
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/e2e-phase-governance.mjs check \
            --base "$EXPECTED_MAIN_SHA" \
            --head "$EXPECTED_HEAD_SHA" \
            --report-file "$RUNNER_TEMP/e2e-phase-evaluation.json"
          node http-generic-api/scripts/e2e-phase-governance.mjs run \
            --base "$EXPECTED_MAIN_SHA" \
            --head "$EXPECTED_HEAD_SHA" \
            --report-file "$RUNNER_TEMP/e2e-phase-evaluation-run.json" \
            --execution-report-file "$RUNNER_TEMP/e2e-phase-execution.json"

      - name: Build structured exact-candidate summary
        if: always()
        shell: bash
        env:
          CANONICAL: ${{ steps.canonical.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          REPORTS: ${{ steps.reports.outcome }}
          FRONTEND: ${{ steps.frontend.outcome }}
          RUNTIME: ${{ steps.runtime.outcome }}
          HOSTINGER: ${{ steps.hostinger.outcome }}
          LIFECYCLE: ${{ steps.lifecycle.outcome }}
          RESOLVER: ${{ steps.resolver.outcome }}
          ARCHITECTURE: ${{ steps.architecture.outcome }}
          E2E: ${{ steps.e2e.outcome }}
        run: |
          set -euo pipefail
          jq -n \
            --arg candidate_sha "$EXPECTED_HEAD_SHA" \
            --arg candidate_tree "$EXPECTED_HEAD_TREE" \
            --arg main_sha "$EXPECTED_MAIN_SHA" \
            --arg production_sha "$EXPECTED_PRODUCTION_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg canonical "$CANONICAL" \
            --arg unit "$UNIT" \
            --arg reports "$REPORTS" \
            --arg frontend "$FRONTEND" \
            --arg runtime "$RUNTIME" \
            --arg hostinger "$HOSTINGER" \
            --arg lifecycle "$LIFECYCLE" \
            --arg resolver "$RESOLVER" \
            --arg architecture "$ARCHITECTURE" \
            --arg e2e "$E2E" \
            '{contract:"mad4b.production-candidate-arm-validation.v1",candidate_sha:$candidate_sha,candidate_tree:$candidate_tree,main_sha:$main_sha,production_sha:$production_sha,run_id:$run_id,candidate_tree_matches_main:true,main_ancestry_preserved:true,production_ancestry_preserved:true,stages:{canonical:$canonical,unit_integration:$unit,report_provenance:$reports,frontend:$frontend,runtime_startup:$runtime,hostinger_guards:$hostinger,repository_lifecycle:$lifecycle,execution_resolver:$resolver,architecture:$architecture,e2e:$e2e},production_mutated:false,deployment_executed:false,provider_call_executed:false,credential_payload_read:false,sql_executed:false,migration_apply:false,database_mutated:false,external_send:false,secrets_included:false}' \
            > "$RUNNER_TEMP/exact-production-candidate-arm-summary.json"

      - name: Upload exact validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-production-candidate-arm-v9-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/exact-production-candidate-arm-summary.json
            ${{ runner.temp }}/e2e-phase-*.json
            ${{ runner.temp }}/test-suite-reports/*.json
            ${{ runner.temp }}/repository-tool-lifecycle/**
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce all exact-candidate stages
        if: always()
        shell: bash
        env:
          CANONICAL: ${{ steps.canonical.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          REPORTS: ${{ steps.reports.outcome }}
          FRONTEND: ${{ steps.frontend.outcome }}
          RUNTIME: ${{ steps.runtime.outcome }}
          HOSTINGER: ${{ steps.hostinger.outcome }}
          LIFECYCLE: ${{ steps.lifecycle.outcome }}
          RESOLVER: ${{ steps.resolver.outcome }}
          ARCHITECTURE: ${{ steps.architecture.outcome }}
          E2E: ${{ steps.e2e.outcome }}
        run: |
          set -euo pipefail
          for outcome in "$CANONICAL" "$UNIT" "$REPORTS" "$FRONTEND" "$RUNTIME" "$HOSTINGER" "$LIFECYCLE" "$RESOLVER" "$ARCHITECTURE" "$E2E"; do
            test "$outcome" = success
          done
