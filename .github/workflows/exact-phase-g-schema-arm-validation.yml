name: Exact Phase G Schema ARM Validation

on:
  pull_request:
    branches:
      - gpt/exact-phase-g-schema-arm-base-20260803
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write

concurrency:
  group: spec012-oauth-route-parity-publish-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish validated Spec 012 OAuth route parity repair
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      EXPECTED_HEAD_REF: gpt/spec012-oauth-token-route-test-parity-20260804
      EXPECTED_MAIN_SHA: a61cd9e83070618001676bbc679bc937f0551875
      TARGET_BRANCH: gpt/spec012-oauth-token-route-test-parity-20260804
      MARKER_PATH: .github/validation/spec012-oauth-route-failure-diagnostic-v3.txt
      SCRIPT_BRANCH: gpt/exact-phase-g-schema-arm-base-20260803
      BASE_TRANSFORM_SHA: 24b41f1ee9deff4bc62bdfe511af21324bbbb296
      REPLAY_PATCH_SHA: b1e04f2e0143b66ef30b0550edf5ffdd63ed1fab
      E2E_PATH: .changes/e2e/spec012-t031-oauth-token-route-test-parity.json
    steps:
      - name: Verify event identity
        shell: bash
        env:
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          test "${EVENT_HEAD_REPOSITORY}" = "${GITHUB_REPOSITORY}"
          test "${EVENT_HEAD_REF}" = "${EXPECTED_HEAD_REF}"

      - name: Checkout exact marker head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Verify marker-only scope and load patches
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_ROOT="${RUNNER_TEMP}/spec012-oauth-route-parity-${GITHUB_RUN_ID}"
          printf 'EVIDENCE_ROOT=%s\n' "${EVIDENCE_ROOT}" >> "${GITHUB_ENV}"
          mkdir -p "${EVIDENCE_ROOT}"
          head_sha="$(git rev-parse HEAD)"
          printf 'TRIGGER_HEAD_SHA=%s\n' "${head_sha}" >> "${GITHUB_ENV}"
          test "$(git merge-base "${EXPECTED_MAIN_SHA}" "${head_sha}")" = "${EXPECTED_MAIN_SHA}"
          printf '%s\n' "${MARKER_PATH}" > /tmp/expected-marker.txt
          git diff --name-only "${EXPECTED_MAIN_SHA}" "${head_sha}" | LC_ALL=C sort > /tmp/actual-marker.txt
          diff -u /tmp/expected-marker.txt /tmp/actual-marker.txt
          test -f "${MARKER_PATH}"
          test "$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${head_sha}"
          test -z "$(git status --porcelain)"
          npm ci --prefix http-generic-api
          git fetch --no-tags origin "refs/heads/${SCRIPT_BRANCH}:refs/remotes/origin/${SCRIPT_BRANCH}"
          for sha in "${BASE_TRANSFORM_SHA}" "${REPLAY_PATCH_SHA}"; do
            git merge-base --is-ancestor "${sha}" "refs/remotes/origin/${SCRIPT_BRANCH}"
          done
          git show "${BASE_TRANSFORM_SHA}:.github/scripts/apply-spec012-oauth-route-test-parity.py" > /tmp/apply-base.py
          git show "${REPLAY_PATCH_SHA}:.github/scripts/apply-spec012-oauth-replay-readback-fix.py" > /tmp/apply-replay.py
          python -m py_compile /tmp/apply-base.py /tmp/apply-replay.py

      - name: Apply repair converge maps and prove idempotency
        shell: bash
        run: |
          set -euo pipefail
          rm "${MARKER_PATH}"
          python /tmp/apply-base.py
          python /tmp/apply-replay.py
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          git diff --name-only -- docs/work-maps | LC_ALL=C sort > "${EVIDENCE_ROOT}/generated-files.txt"
          python - "${E2E_PATH}" "${EVIDENCE_ROOT}/generated-files.txt" <<'PY'
          import json, sys
          from pathlib import Path
          e2e = Path(sys.argv[1])
          generated = [line.strip() for line in Path(sys.argv[2]).read_text().splitlines() if line.strip()]
          payload = json.loads(e2e.read_text())
          for values in (payload['scope']['include'], payload['phases'][0]['e2e_journeys'][0]['evidence_paths']):
              for value in generated:
                  if value not in values:
                      values.append(value)
          e2e.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n')
          PY
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          first_hash="$(git diff --binary -- docs/work-maps | sha256sum | awk '{print $1}')"
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          second_hash="$(git diff --binary -- docs/work-maps | sha256sum | awk '{print $1}')"
          test "${first_hash}" = "${second_hash}"
          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          printf '%s\n' "${first_hash}" > "${EVIDENCE_ROOT}/generated-diff-sha256.txt"

          cat > "${EVIDENCE_ROOT}/core-files.txt" <<'EOF'
          .changes/e2e/spec012-t031-oauth-token-route-test-parity.json
          http-generic-api/routes/tenantGptOAuthTokenExchangeRoutes.js
          http-generic-api/tenantGptOAuthTokenExchangeBindingGuard.js
          http-generic-api/test-auth-oauth-routes.mjs
          http-generic-api/test-spec012-t031-oauth-token-route-wiring.mjs
          EOF
          cat "${EVIDENCE_ROOT}/core-files.txt" "${EVIDENCE_ROOT}/generated-files.txt" | LC_ALL=C sort -u > "${EVIDENCE_ROOT}/expected-files.txt"
          {
            git diff --name-only "${EXPECTED_MAIN_SHA}"
            git ls-files --others --exclude-standard
          } | grep -v -F "${MARKER_PATH}" | LC_ALL=C sort -u > "${EVIDENCE_ROOT}/actual-files.txt"
          diff -u "${EVIDENCE_ROOT}/expected-files.txt" "${EVIDENCE_ROOT}/actual-files.txt"
          git diff --check "${EXPECTED_MAIN_SHA}"
          git diff --stat "${EXPECTED_MAIN_SHA}" > "${EVIDENCE_ROOT}/diff-stat.txt"

      - name: Run OAuth route governance and replay tests
        shell: bash
        run: |
          set -euo pipefail
          node --check http-generic-api/routes/tenantGptOAuthTokenExchangeRoutes.js
          node --check http-generic-api/tenantGptOAuthTokenExchangeBindingGuard.js
          node http-generic-api/test-tenant-gpt-oauth-token-binding-guard.mjs
          node http-generic-api/test-tenant-gpt-oauth-token-binding-hardening.mjs
          node http-generic-api/test-tenant-gpt-oauth-token-exchange-routes.mjs
          node http-generic-api/test-auth-oauth-routes.mjs
          node http-generic-api/test-spec012-t031-oauth-token-route-wiring.mjs
          node http-generic-api/test-tenant-gpt-oauth-token-exchange-outcome-policy.mjs
          (cd http-generic-api && node scripts/user-jwt-auth-governance.mjs --baseline-ref="${EXPECTED_MAIN_SHA}")
          ! grep -Fq 'from "jsonwebtoken"' http-generic-api/routes/tenantGptOAuthTokenExchangeRoutes.js
          ! grep -Fq 'development_fallback_secret_only' http-generic-api/routes/tenantGptOAuthTokenExchangeRoutes.js
          grep -Fq 'oauth_token_exchange_crypto_dependencies_required' http-generic-api/routes/tenantGptOAuthTokenExchangeRoutes.js
          grep -Fq 'getPool: () => oauthClientPool' http-generic-api/test-auth-oauth-routes.mjs

      - name: Create exact local commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${TRIGGER_HEAD_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while IFS= read -r path; do git add -- "$path"; done < "${EVIDENCE_ROOT}/expected-files.txt"
          git add -u -- "${MARKER_PATH}"
          git commit -m "fix(auth): restore governed OAuth route integration parity"
          new_head="$(git rev-parse HEAD)"
          printf 'NEW_HEAD_SHA=%s\n' "${new_head}" >> "${GITHUB_ENV}"
          git diff --name-only "${EXPECTED_MAIN_SHA}" "${new_head}" | LC_ALL=C sort > /tmp/final-files.txt
          diff -u "${EVIDENCE_ROOT}/expected-files.txt" /tmp/final-files.txt
          test -z "$(git status --porcelain)"

      - name: Run exact E2E and Repository Tool Lifecycle gates
        shell: bash
        env:
          BASE_SHA: a61cd9e83070618001676bbc679bc937f0551875
        run: |
          set -euo pipefail
          export CANDIDATE_SHA="${NEW_HEAD_SHA}"
          node http-generic-api/scripts/e2e-contract-reference-integrity.mjs --base "${BASE_SHA}" --head "${NEW_HEAD_SHA}" --report-file "${EVIDENCE_ROOT}/e2e-contract-reference-integrity.json"
          node http-generic-api/scripts/e2e-contract-git-index-integrity.mjs --report-file "${EVIDENCE_ROOT}/e2e-contract-reference-integrity.json"
          node http-generic-api/scripts/e2e-phase-governance.mjs check --base "${BASE_SHA}" --head "${NEW_HEAD_SHA}" --report-file "${EVIDENCE_ROOT}/e2e-phase-evaluation.json"
          git diff --name-status "${BASE_SHA}" "${NEW_HEAD_SHA}" > /tmp/repository-tool-changes.tsv
          node http-generic-api/scripts/maintenance-tools/repository-tool-lifecycle-guard.mjs --changed-files /tmp/repository-tool-changes.tsv --policy .github/repository-maintenance-tool-governance.json --output-dir "${EVIDENCE_ROOT}/repository-tool-lifecycle"
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync(process.env.EVIDENCE_ROOT + '/repository-tool-lifecycle/repository-tool-lifecycle-report.json','utf8')); if(!r.ok || r.findings.length) process.exit(1);"
          test -z "$(git status --porcelain)"

      - name: Push exact validated commit without force
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${TRIGGER_HEAD_SHA}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          test "$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${NEW_HEAD_SHA}"

      - name: Upload bounded publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec012-oauth-route-parity-${{ github.run_id }}
          path: ${{ runner.temp }}/spec012-oauth-route-parity-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
