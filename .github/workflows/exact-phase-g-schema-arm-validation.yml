name: Exact Phase G Schema ARM Validation

on:
  pull_request:
    branches:
      - gpt/exact-phase-g-schema-arm-base-20260803
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: exact-phase-g-schema-arm-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  closure-validation:
    name: Exact Lifecycle and Frontend Closure
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/work-map-phase-g-schema-classification-20260803' &&
      github.event.pull_request.head.sha == '55dfe403c741f996e30979dca9adfeb9c18a2612'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      EXPECTED_MAIN_SHA: dd929093dd83d2c91ac817ff60d324eca2b71e51
      EXPECTED_HEAD_SHA: 55dfe403c741f996e30979dca9adfeb9c18a2612
      CI_CANDIDATE_KIND: head
      CI_CANDIDATE_SHA: 55dfe403c741f996e30979dca9adfeb9c18a2612
      CI_SOURCE_HEAD_SHA: 55dfe403c741f996e30979dca9adfeb9c18a2612
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Verify immutable identity synchronization and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          git cat-file -e "${EXPECTED_MAIN_SHA}^{commit}"
          test "$(git merge-base "${EXPECTED_MAIN_SHA}" "${EXPECTED_HEAD_SHA}")" = "${EXPECTED_MAIN_SHA}"
          test "$(git diff --name-only "${EXPECTED_MAIN_SHA}" "${EXPECTED_HEAD_SHA}" | wc -l)" = "14"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Install HTTP API dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Reconfirm E2E contract reference integrity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node http-generic-api/test-e2e-contract-reference-integrity.mjs
          node http-generic-api/test-e2e-contract-git-index-integrity.mjs
          node http-generic-api/scripts/e2e-contract-reference-integrity.mjs --base "${EXPECTED_MAIN_SHA}" --head "${EXPECTED_HEAD_SHA}" --report-file artifacts/e2e-contract-reference-integrity.json
          node http-generic-api/scripts/e2e-contract-git-index-integrity.mjs --report-file artifacts/e2e-contract-reference-integrity.json

      - name: Run Repository Tool Lifecycle with exact SHA inputs
        shell: bash
        env:
          BASE_SHA: dd929093dd83d2c91ac817ff60d324eca2b71e51
          CANDIDATE_SHA: 55dfe403c741f996e30979dca9adfeb9c18a2612
        run: |
          set -euo pipefail
          node http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs
          git diff --name-status "${BASE_SHA}" "${CANDIDATE_SHA}" > /tmp/repository-tool-changes.tsv
          node http-generic-api/scripts/maintenance-tools/repository-tool-lifecycle-guard.mjs --changed-files /tmp/repository-tool-changes.tsv --policy .github/repository-maintenance-tool-governance.json --output-dir .artifacts/repository-tool-lifecycle
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('.artifacts/repository-tool-lifecycle/repository-tool-lifecycle-report.json','utf8')); if(!r.ok || r.findings.length || r.base_sha !== process.env.BASE_SHA || r.candidate_sha !== process.env.CANDIDATE_SHA) process.exit(1);"

      - name: Run deterministic Frontend parity
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          CANONICAL_BASELINE_REF=main TARGET_REF=main npm run frontend:dispatch:generate -- --baseline-ref=main
          node test-frontend-dispatch-workflow-baseline.mjs
          node test-frontend-operation-governance-generator.mjs
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-openapi-route-coverage.mjs
          npm run openapi:auth:check
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-schema-classification-closure-${{ github.run_id }}
          path: |
            artifacts/e2e-contract-reference-integrity.json
            .artifacts/repository-tool-lifecycle/
          if-no-files-found: error
          retention-days: 14
