name: Exact Phase G Schema ARM Validation

on:
  pull_request:
    branches:
      - gpt/exact-phase-g-schema-arm-base-20260803
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: exact-phase-g-schema-arm-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend-parity:
    name: Exact Frontend digest parity
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/frontend-dispatch-digest-refresh-20260803' &&
      github.event.pull_request.head.sha == '8c26be76724989b4d2d5bb8f1c4a6832bdebbb12'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      EXPECTED_MAIN_SHA: 5db9f992ff42b136fbac88f9191949a7e31ffbf0
      EXPECTED_HEAD_SHA: 8c26be76724989b4d2d5bb8f1c4a6832bdebbb12
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable identity and synchronization
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          git cat-file -e "${EXPECTED_MAIN_SHA}^{commit}"
          test "$(git merge-base "${EXPECTED_MAIN_SHA}" "${EXPECTED_HEAD_SHA}")" = "${EXPECTED_MAIN_SHA}"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install HTTP API dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Verify deterministic Frontend parity
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          CANONICAL_BASELINE_REF=main TARGET_REF=main npm run frontend:dispatch:generate -- --baseline-ref=main
          node test-frontend-dispatch-workflow-baseline.mjs
          node test-frontend-operation-governance-generator.mjs
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-openapi-route-coverage.mjs
          npm run openapi:auth:check
          test -z "$(git status --porcelain --untracked-files=no)"
