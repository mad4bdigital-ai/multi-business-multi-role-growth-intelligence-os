name: Exact Phase G Schema ARM Validation

on:
  pull_request:
    branches:
      - gpt/exact-phase-g-schema-arm-base-20260803
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write

concurrency:
  group: exact-phase-g-schema-arm-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh-work-maps:
    name: Refresh synchronized canonical Work Maps
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/work-map-phase-g-schema-classification-20260803' &&
      github.event.pull_request.head.sha == '55dfe403c741f996e30979dca9adfeb9c18a2612'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      EXPECTED_MAIN_SHA: dd929093dd83d2c91ac817ff60d324eca2b71e51
      EXPECTED_HEAD_SHA: 55dfe403c741f996e30979dca9adfeb9c18a2612
      TARGET_BRANCH: gpt/work-map-phase-g-schema-classification-20260803
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@v5
        with:
          ref: gpt/work-map-phase-g-schema-classification-20260803
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Verify immutable identity synchronization and source scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          git cat-file -e "${EXPECTED_MAIN_SHA}^{commit}"
          test "$(git merge-base "${EXPECTED_MAIN_SHA}" "${EXPECTED_HEAD_SHA}")" = "${EXPECTED_MAIN_SHA}"
          test "$(git diff --name-only "${EXPECTED_MAIN_SHA}" "${EXPECTED_HEAD_SHA}" | wc -l)" = "14"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Install HTTP API dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Regenerate twice and enforce docs-only delta
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/work-map-schema-classification-contract.mjs
          node http-generic-api/scripts/work-map-schema-classification.mjs
          node http-generic-api/test-work-map-schema-classification.mjs

          node http-generic-api/scripts/platform-work-map-generator.mjs --write | tee /tmp/pass1.json
          grep -q '"ok": true' /tmp/pass1.json
          grep -q '"secrets_included": false' /tmp/pass1.json
          first_hash="$(git diff --binary -- docs/work-maps | sha256sum | awk '{print $1}')"

          node http-generic-api/scripts/platform-work-map-generator.mjs --write | tee /tmp/pass2.json
          grep -q '"ok": true' /tmp/pass2.json
          grep -q '"drift_files": \[\]' /tmp/pass2.json
          grep -q '"secrets_included": false' /tmp/pass2.json
          second_hash="$(git diff --binary -- docs/work-maps | sha256sum | awk '{print $1}')"
          test "${first_hash}" = "${second_hash}"
          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          git diff --check

          changed="$(git diff --name-only)"
          if [ -z "${changed}" ]; then
            echo 'canonical_refresh_needed=no'
            exit 0
          fi
          test -z "$(printf '%s\n' "${changed}" | grep -Ev '^docs/work-maps/' || true)"
          test -z "$(git status --porcelain --untracked-files=no | awk '{print $2}' | grep -Ev '^docs/work-maps/' || true)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/work-maps
          git commit -m "docs(work-map): refresh synchronized repository maps"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
