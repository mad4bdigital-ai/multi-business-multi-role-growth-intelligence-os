name: Exact Phase G Schema ARM Validation

on:
  pull_request:
    branches:
      - gpt/exact-phase-g-schema-arm-base-20260803
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: spec012-oauth-injection-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: Exact Spec 012 OAuth Request Injection Validation
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      EXPECTED_HEAD_REF: gpt/spec012-oauth-token-route-test-parity-20260804
      EXPECTED_MAIN_SHA: a61cd9e83070618001676bbc679bc937f0551875
      MARKER_PATH: .github/validation/spec012-oauth-route-failure-diagnostic-v3.txt
      SCRIPT_BRANCH: gpt/exact-phase-g-schema-arm-base-20260803
      SCRIPT_COMMIT_SHA: b3eed7a469070fb1abf3a156a59bb774458a1227
    steps:
      - name: Verify event identity before checkout
        shell: bash
        env:
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          test "${EVENT_HEAD_REPOSITORY}" = "${GITHUB_REPOSITORY}"
          test "${EVENT_HEAD_REF}" = "${EXPECTED_HEAD_REF}"

      - name: Checkout exact marker head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Verify marker-only identity and load immutable repair
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_ROOT="${RUNNER_TEMP}/spec012-oauth-injection-${GITHUB_RUN_ID}"
          printf 'EVIDENCE_ROOT=%s\n' "${EVIDENCE_ROOT}" >> "${GITHUB_ENV}"
          mkdir -p "${EVIDENCE_ROOT}"
          ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_MAIN_SHA}"
          test -f "${MARKER_PATH}"
          printf '%s\n' "${MARKER_PATH}" > /tmp/expected-marker.txt
          git diff --name-only "${EXPECTED_MAIN_SHA}" "${ACTUAL_HEAD_SHA}" | LC_ALL=C sort > /tmp/actual-marker.txt
          diff -u /tmp/expected-marker.txt /tmp/actual-marker.txt
          test -z "$(git status --porcelain)"
          printf 'validated_head_sha=%s\n' "${ACTUAL_HEAD_SHA}" > "${EVIDENCE_ROOT}/identity.txt"
          printf 'validated_parent_sha=%s\n' "${EXPECTED_MAIN_SHA}" >> "${EVIDENCE_ROOT}/identity.txt"
          npm ci --prefix http-generic-api
          git fetch --no-tags origin "refs/heads/${SCRIPT_BRANCH}:refs/remotes/origin/${SCRIPT_BRANCH}"
          git merge-base --is-ancestor "${SCRIPT_COMMIT_SHA}" "refs/remotes/origin/${SCRIPT_BRANCH}"
          git show "${SCRIPT_COMMIT_SHA}:.github/scripts/apply-spec012-oauth-request-injection-repair.py" > /tmp/apply-spec012-oauth-request-injection-repair.py
          python -m py_compile /tmp/apply-spec012-oauth-request-injection-repair.py

      - name: Remove marker and apply exact three-file repair
        shell: bash
        run: |
          set -euo pipefail
          rm -- "${MARKER_PATH}"
          python /tmp/apply-spec012-oauth-request-injection-repair.py
          cat > /tmp/expected-files.txt <<'EOF'
          http-generic-api/routes/index.js
          http-generic-api/test-auth-oauth-routes.mjs
          http-generic-api/test-spec012-t031-oauth-token-route-wiring.mjs
          EOF
          LC_ALL=C sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          git diff --name-only "${EXPECTED_MAIN_SHA}" | LC_ALL=C sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          git diff --check "${EXPECTED_MAIN_SHA}"
          git diff --stat "${EXPECTED_MAIN_SHA}" > "${EVIDENCE_ROOT}/diff-stat.txt"
          cp /tmp/actual-files.txt "${EVIDENCE_ROOT}/changed-files.txt"

      - name: Run exact OAuth request-injection validations
        shell: bash
        run: |
          set -uo pipefail
          results="${EVIDENCE_ROOT}/validation-results.tsv"
          : > "${results}"
          run_check() {
            local name="$1"; shift
            local log="${EVIDENCE_ROOT}/${name}.log"
            set +e
            "$@" >"${log}" 2>&1
            local status=$?
            set -e
            printf '%s\t%s\t%s\n' "${name}" "${status}" "${log##*/}" >> "${results}"
            cat "${log}"
          }
          run_check route-index-syntax node --check http-generic-api/routes/index.js
          run_check token-route node http-generic-api/test-tenant-gpt-oauth-token-exchange-routes.mjs
          run_check auth-oauth-integration node http-generic-api/test-auth-oauth-routes.mjs
          run_check route-wiring node http-generic-api/test-spec012-t031-oauth-token-route-wiring.mjs
          run_check dependency-mount grep -Fq 'app.use(buildTenantGptOAuthMetadataRoutes(deps));' http-generic-api/routes/index.js
          run_check injected-test-pool grep -Fq 'buildTenantGptOAuthMetadataRoutes({ getPool: () => oauthClientPool })' http-generic-api/test-auth-oauth-routes.mjs
          {
            printf 'check\texit_code\tlog\n'
            cat "${results}"
          } > "${EVIDENCE_ROOT}/validation-summary.tsv"
          cat "${EVIDENCE_ROOT}/validation-summary.tsv"

      - name: Upload bounded OAuth injection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec012-oauth-injection-${{ github.run_id }}
          path: ${{ runner.temp }}/spec012-oauth-injection-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14

      - name: Enforce exact validation success
        shell: bash
        run: |
          set -euo pipefail
          test -s "${EVIDENCE_ROOT}/validation-results.tsv"
          awk -F '\t' '$2 != "0" { print; failed=1 } END { exit failed ? 1 : 0 }' "${EVIDENCE_ROOT}/validation-results.tsv"
