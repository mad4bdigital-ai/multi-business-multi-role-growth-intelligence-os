name: Exact Phase G Schema ARM Validation

on:
  pull_request:
    branches:
      - gpt/exact-phase-g-schema-arm-base-20260803
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: spec012-oauth-suite-diagnostic-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  diagnose:
    name: Exact Spec 012 OAuth Full Suite Diagnostic
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      EXPECTED_HEAD_REF: gpt/spec012-oauth-token-route-test-parity-20260804
      EXPECTED_MAIN_SHA: a61cd9e83070618001676bbc679bc937f0551875
      EXPECTED_HEAD_SHA: 3b8885cb8c75bfe93809ce39f7c66bf8bdeb0732
    steps:
      - name: Verify event identity
        shell: bash
        env:
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          test "${EVENT_HEAD_REPOSITORY}" = "${GITHUB_REPOSITORY}"
          test "${EVENT_HEAD_REF}" = "${EXPECTED_HEAD_REF}"
          test "${EVENT_HEAD_SHA}" = "${EXPECTED_HEAD_SHA}"

      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Verify exact scope and install API dependencies
        shell: bash
        run: |
          set -euo pipefail
          DIAGNOSTIC_ROOT="${RUNNER_TEMP}/spec012-oauth-suite-diagnostic-${GITHUB_RUN_ID}"
          REPORT_ROOT="${RUNNER_TEMP}/spec012-oauth-suite-reports-${GITHUB_RUN_ID}"
          printf 'DIAGNOSTIC_ROOT=%s\n' "${DIAGNOSTIC_ROOT}" >> "${GITHUB_ENV}"
          printf 'REPORT_ROOT=%s\n' "${REPORT_ROOT}" >> "${GITHUB_ENV}"
          mkdir -p "${DIAGNOSTIC_ROOT}" "${REPORT_ROOT}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          test "$(git merge-base "${EXPECTED_MAIN_SHA}" "${EXPECTED_HEAD_SHA}")" = "${EXPECTED_MAIN_SHA}"
          cat > "${DIAGNOSTIC_ROOT}/expected-files.txt" <<'EOF'
          .changes/e2e/spec012-t031-oauth-token-route-test-parity.json
          docs/work-maps/README.md
          docs/work-maps/repository-automation-map.md
          http-generic-api/routes/tenantGptOAuthTokenExchangeRoutes.js
          http-generic-api/tenantGptOAuthTokenExchangeBindingGuard.js
          http-generic-api/test-auth-oauth-routes.mjs
          http-generic-api/test-spec012-t031-oauth-token-route-wiring.mjs
          EOF
          git diff --name-only "${EXPECTED_MAIN_SHA}" "${EXPECTED_HEAD_SHA}" | LC_ALL=C sort > "${DIAGNOSTIC_ROOT}/actual-files.txt"
          diff -u "${DIAGNOSTIC_ROOT}/expected-files.txt" "${DIAGNOSTIC_ROOT}/actual-files.txt"
          git diff --check "${EXPECTED_MAIN_SHA}" "${EXPECTED_HEAD_SHA}"
          test -z "$(git status --porcelain --untracked-files=no)"
          npm ci --prefix http-generic-api > "${DIAGNOSTIC_ROOT}/npm-ci.log" 2>&1

      - name: Run Context Kernel and full API suite with durable logs
        shell: bash
        working-directory: http-generic-api
        env:
          TEST_SUITE_REPORT_DIR: ${{ runner.temp }}/spec012-oauth-suite-reports-${{ github.run_id }}
        run: |
          set -uo pipefail
          results="${DIAGNOSTIC_ROOT}/results.tsv"
          : > "${results}"
          git diff --name-only "${EXPECTED_MAIN_SHA}" "${EXPECTED_HEAD_SHA}" > "${DIAGNOSTIC_ROOT}/changed-files.txt"

          run_check() {
            local name="$1"
            shift
            local log="${DIAGNOSTIC_ROOT}/${name}.log"
            set +e
            "$@" >"${log}" 2>&1
            local status=$?
            set -e
            printf '%s\t%s\t%s\n' "${name}" "${status}" "${log##*/}" >> "${results}"
            cat "${log}"
          }

          run_check context-kernel \
            node scripts/context-kernel-hardcoding-scan.mjs --fail-on=runtime --changed-files-from="${DIAGNOSTIC_ROOT}/changed-files.txt"
          run_check api-npm-test npm test

          {
            printf 'check\texit_code\tlog\n'
            cat "${results}"
          } > "${DIAGNOSTIC_ROOT}/summary.tsv"
          cat "${DIAGNOSTIC_ROOT}/summary.tsv"
          find "${REPORT_ROOT}" -maxdepth 3 -type f -print | LC_ALL=C sort > "${DIAGNOSTIC_ROOT}/report-files.txt" || true
          git status --porcelain --untracked-files=all > "${DIAGNOSTIC_ROOT}/worktree-status.txt"

      - name: Upload exact suite diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec012-oauth-suite-diagnostic-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/spec012-oauth-suite-diagnostic-${{ github.run_id }}/
            ${{ runner.temp }}/spec012-oauth-suite-reports-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce suite success
        shell: bash
        run: |
          set -euo pipefail
          test -s "${DIAGNOSTIC_ROOT}/results.tsv"
          awk -F '\t' '$2 != "0" { print; failed=1 } END { exit failed ? 1 : 0 }' "${DIAGNOSTIC_ROOT}/results.tsv"
