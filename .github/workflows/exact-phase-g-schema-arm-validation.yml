name: Exact Phase G Schema ARM Validation

on:
  pull_request:
    branches:
      - gpt/exact-phase-g-schema-arm-base-20260803
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write

concurrency:
  group: work-map-sync-regeneration-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate synchronized Work Map documentation
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/work-map-input-driven-branch-governance-20260804' &&
      github.event.pull_request.head.sha == '8bf8f07927e2201c650d5dd0619a7f60aff838b9'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      EXPECTED_HEAD_SHA: 8bf8f07927e2201c650d5dd0619a7f60aff838b9
      TARGET_BRANCH: gpt/work-map-input-driven-branch-governance-20260804
    steps:
      - name: Checkout exact synchronized head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify immutable identity
        shell: bash
        run: |
          set -euo pipefail
          DIAGNOSTIC_ROOT="${RUNNER_TEMP}/work-map-sync-regeneration-${GITHUB_RUN_ID}"
          printf 'DIAGNOSTIC_ROOT=%s\n' "${DIAGNOSTIC_ROOT}" >> "${GITHUB_ENV}"
          mkdir -p "${DIAGNOSTIC_ROOT}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          test "$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${EXPECTED_HEAD_SHA}"
          test -z "$(git status --porcelain)"

      - name: Regenerate twice and prove bounded idempotency
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          git diff --name-only | LC_ALL=C sort > "${DIAGNOSTIC_ROOT}/first-files.txt"
          cat > "${DIAGNOSTIC_ROOT}/expected-files.txt" <<'EOF'
          docs/work-maps/README.md
          docs/work-maps/repository-automation-map.md
          EOF
          diff -u "${DIAGNOSTIC_ROOT}/expected-files.txt" "${DIAGNOSTIC_ROOT}/first-files.txt"
          first_hash="$(git diff --binary -- docs/work-maps | sha256sum | awk '{print $1}')"
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          second_hash="$(git diff --binary -- docs/work-maps | sha256sum | awk '{print $1}')"
          test "${first_hash}" = "${second_hash}"
          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          git diff --check
          printf '%s\n' "${first_hash}" > "${DIAGNOSTIC_ROOT}/generated-diff-sha256.txt"
          git diff --stat > "${DIAGNOSTIC_ROOT}/diff-stat.txt"

      - name: Revalidate governance regressions
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; YAML.load_file(ARGV[0], aliases: true)' .github/workflows/spec-kit-work-map-autofix.yml
          node http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs
          node http-generic-api/test-work-map-autofix-validation-diagnostics.mjs

      - name: Commit generated parity and push fast-forward
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${EXPECTED_HEAD_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/work-maps/README.md docs/work-maps/repository-automation-map.md
          git commit -m "docs(work-maps): refresh synchronized governance maps"
          new_head="$(git rev-parse HEAD)"
          printf 'NEW_HEAD_SHA=%s\n' "${new_head}" >> "${GITHUB_ENV}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          test "$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${new_head}"

      - name: Upload regeneration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-map-sync-regeneration-${{ github.run_id }}
          path: ${{ runner.temp }}/work-map-sync-regeneration-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
