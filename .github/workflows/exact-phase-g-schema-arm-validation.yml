name: Exact Phase G Schema ARM Validation

on:
  pull_request:
    branches:
      - gpt/exact-phase-g-schema-arm-base-20260803
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: exact-phase-g-schema-arm-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unresolved-provenance:
    name: Exact unresolved schema provenance
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/work-map-phase-g-schema-classification-20260803' &&
      github.event.pull_request.head.sha == '198c1c6f0d77cd162ffe472a56e76cf9f22e025b'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      EXPECTED_MAIN_SHA: 14433d15184bd7e7658281a356a7540e3d2d6dfe
      EXPECTED_HEAD_SHA: 198c1c6f0d77cd162ffe472a56e76cf9f22e025b
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          git cat-file -e "${EXPECTED_MAIN_SHA}^{commit}"
          test "$(git merge-base "${EXPECTED_MAIN_SHA}" "${EXPECTED_HEAD_SHA}")" = "${EXPECTED_MAIN_SHA}"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Capture source and contract provenance
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/unresolved-schema-provenance.txt"
          : > "${report}"

          for object in \
            managed_execution_bindings \
            managed_execution_events \
            storage_authorized_injection_rollbacks \
            storage_authorized_injection_states \
            v_storage_cleanup_operation_readback
          do
            echo "===== ${object} =====" | tee -a "${report}"
            git grep -n -C 10 -F "${object}" -- \
              ':!docs/work-maps/**' \
              ':!http-generic-api/frontend-surface-dispatch.generated.json' \
              ':!http-generic-api/frontend-operation-governance.generated.json' \
              ':!openapi/**' \
              2>/dev/null | tee -a "${report}" || true
            echo | tee -a "${report}"
          done

          echo '===== RELATED REGISTRY RULES =====' | tee -a "${report}"
          node --input-type=module <<'NODE' | tee -a "${report}"
          import fs from 'node:fs';
          const registry = JSON.parse(fs.readFileSync('.specify/work-map-schema-classification-registry.json', 'utf8'));
          const terms = ['managed_execution', 'storage_', 'cleanup', 'injection'];
          for (const rule of registry.rules ?? []) {
            const text = JSON.stringify(rule);
            if (terms.some((term) => text.includes(term))) console.log(JSON.stringify(rule, null, 2));
          }
          NODE

          echo '===== RELATED SPEC AND MIGRATION FILENAMES =====' | tee -a "${report}"
          git grep -l -E 'managed_execution|authorized_injection|storage_cleanup_operation_readback' -- \
            'specs/**' 'http-generic-api/migrations/**' '.specify/**' \
            2>/dev/null | sort -u | tee -a "${report}" || true

      - name: Upload provenance
        uses: actions/upload-artifact@v4
        with:
          name: exact-unresolved-schema-provenance-${{ github.run_id }}
          path: ${{ runner.temp }}/unresolved-schema-provenance.txt
          if-no-files-found: error
          retention-days: 14
