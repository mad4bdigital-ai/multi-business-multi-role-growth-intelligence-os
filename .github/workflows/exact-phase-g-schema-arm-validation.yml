name: Exact Phase G Schema ARM Validation

on:
  pull_request:
    branches:
      - gpt/exact-phase-g-schema-arm-base-20260803
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: spec012-oauth-replay-readback-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: Exact Spec 012 OAuth Replay Readback Validation
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      EXPECTED_HEAD_REF: gpt/spec012-oauth-token-route-test-parity-20260804
      EXPECTED_MAIN_SHA: a61cd9e83070618001676bbc679bc937f0551875
      MARKER_PATH: .github/validation/spec012-oauth-route-failure-diagnostic-v3.txt
      SCRIPT_BRANCH: gpt/exact-phase-g-schema-arm-base-20260803
      BASE_TRANSFORM_SHA: 24b41f1ee9deff4bc62bdfe511af21324bbbb296
      REPLAY_PATCH_SHA: b1e04f2e0143b66ef30b0550edf5ffdd63ed1fab
    steps:
      - name: Verify event identity
        shell: bash
        env:
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          test "${EVENT_HEAD_REPOSITORY}" = "${GITHUB_REPOSITORY}"
          test "${EVENT_HEAD_REF}" = "${EXPECTED_HEAD_REF}"

      - name: Checkout exact marker head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Verify marker-only scope and load patches
        shell: bash
        run: |
          set -euo pipefail
          DIAGNOSTIC_ROOT="${RUNNER_TEMP}/spec012-oauth-replay-readback-${GITHUB_RUN_ID}"
          printf 'DIAGNOSTIC_ROOT=%s\n' "${DIAGNOSTIC_ROOT}" >> "${GITHUB_ENV}"
          mkdir -p "${DIAGNOSTIC_ROOT}"
          head_sha="$(git rev-parse HEAD)"
          test "$(git merge-base "${EXPECTED_MAIN_SHA}" "${head_sha}")" = "${EXPECTED_MAIN_SHA}"
          printf '%s\n' "${MARKER_PATH}" > /tmp/expected-files.txt
          git diff --name-only "${EXPECTED_MAIN_SHA}" "${head_sha}" | LC_ALL=C sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          test -f "${MARKER_PATH}"
          test -z "$(git status --porcelain)"
          npm ci --prefix http-generic-api
          git fetch --no-tags origin "refs/heads/${SCRIPT_BRANCH}:refs/remotes/origin/${SCRIPT_BRANCH}"
          for sha in "${BASE_TRANSFORM_SHA}" "${REPLAY_PATCH_SHA}"; do
            git merge-base --is-ancestor "${sha}" "refs/remotes/origin/${SCRIPT_BRANCH}"
          done
          git show "${BASE_TRANSFORM_SHA}:.github/scripts/apply-spec012-oauth-route-test-parity.py" > /tmp/apply-base.py
          git show "${REPLAY_PATCH_SHA}:.github/scripts/apply-spec012-oauth-replay-readback-fix.py" > /tmp/apply-replay.py
          python -m py_compile /tmp/apply-base.py /tmp/apply-replay.py

      - name: Apply corrected patches
        shell: bash
        run: |
          set -euo pipefail
          rm "${MARKER_PATH}"
          python /tmp/apply-base.py
          python /tmp/apply-replay.py
          git diff --check

      - name: Run OAuth replay and wiring validations independently
        shell: bash
        run: |
          set -uo pipefail
          results="${DIAGNOSTIC_ROOT}/validation-results.tsv"
          : > "${results}"
          run_check() {
            local name="$1"; shift
            local log="${DIAGNOSTIC_ROOT}/${name}.log"
            set +e
            "$@" >"${log}" 2>&1
            local status=$?
            set -e
            printf '%s\t%s\t%s\n' "${name}" "${status}" "${log##*/}" >> "${results}"
            cat "${log}"
          }
          run_check token-route node http-generic-api/test-tenant-gpt-oauth-token-exchange-routes.mjs
          run_check auth-oauth-integration node http-generic-api/test-auth-oauth-routes.mjs
          run_check route-wiring node http-generic-api/test-spec012-t031-oauth-token-route-wiring.mjs
          run_check outcome-policy node http-generic-api/test-tenant-gpt-oauth-token-exchange-outcome-policy.mjs
          run_check jwt-governance bash -lc "cd http-generic-api && node scripts/user-jwt-auth-governance.mjs --baseline-ref=${EXPECTED_MAIN_SHA}"
          run_check no-jwt-import bash -lc "! grep -Fq 'from \"jsonwebtoken\"' http-generic-api/routes/tenantGptOAuthTokenExchangeRoutes.js"
          run_check no-fallback-secret bash -lc "! grep -Fq 'development_fallback_secret_only' http-generic-api/routes/tenantGptOAuthTokenExchangeRoutes.js"
          {
            printf 'check\texit_code\tlog\n'
            cat "${results}"
          } > "${DIAGNOSTIC_ROOT}/validation-summary.tsv"
          cat "${DIAGNOSTIC_ROOT}/validation-summary.tsv"

      - name: Upload replay validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec012-oauth-replay-readback-${{ github.run_id }}
          path: ${{ runner.temp }}/spec012-oauth-replay-readback-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14

      - name: Enforce validation success
        shell: bash
        run: |
          set -euo pipefail
          awk -F '\t' '$2 != "0" { print; failed=1 } END { exit failed ? 1 : 0 }' "${DIAGNOSTIC_ROOT}/validation-results.tsv"
