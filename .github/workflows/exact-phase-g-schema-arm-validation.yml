name: Exact Phase G Schema ARM Validation

on:
  pull_request:
    branches:
      - gpt/exact-phase-g-schema-arm-base-20260803
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: work-map-syntax-governance-diagnostic-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  diagnose:
    name: Exact Work Map Syntax Governance Diagnostic
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/work-map-input-driven-branch-governance-20260804' &&
      github.event.pull_request.head.sha == 'e222f742df95b3b5ddd1fb4e5ff9f1fc1581a850'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      EXPECTED_MAIN_SHA: 97e4ee7ec790844ad20ee2349125579353c693d5
      EXPECTED_HEAD_SHA: e222f742df95b3b5ddd1fb4e5ff9f1fc1581a850
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify identity and install dependencies
        shell: bash
        run: |
          set -euo pipefail
          DIAGNOSTIC_ROOT="${RUNNER_TEMP}/work-map-syntax-governance-${GITHUB_RUN_ID}"
          printf 'DIAGNOSTIC_ROOT=%s\n' "${DIAGNOSTIC_ROOT}" >> "${GITHUB_ENV}"
          mkdir -p "${DIAGNOSTIC_ROOT}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          test "$(git merge-base "${EXPECTED_MAIN_SHA}" "${EXPECTED_HEAD_SHA}")" = "${EXPECTED_MAIN_SHA}"
          git update-ref refs/remotes/origin/main "${EXPECTED_MAIN_SHA}"
          npm ci
          npm ci --prefix http-generic-api

      - name: Run syntax and governance checks independently
        shell: bash
        run: |
          set -uo pipefail
          results="${DIAGNOSTIC_ROOT}/validation-results.tsv"
          : > "${results}"

          run_check() {
            local name="$1"
            shift
            local log="${DIAGNOSTIC_ROOT}/${name}.log"
            set +e
            "$@" >"${log}" 2>&1
            local status=$?
            set -e
            printf '%s\t%s\t%s\n' "${name}" "${status}" "${log##*/}" >> "${results}"
            cat "${log}"
          }

          run_check schema-docs-change-guard node http-generic-api/scripts/schema-docs-change-guard.mjs
          run_check migration-placement-guard node http-generic-api/scripts/migration-placement-guard.mjs
          run_check user-jwt-auth-governance bash -lc "cd http-generic-api && node scripts/user-jwt-auth-governance.mjs --baseline-ref=${EXPECTED_MAIN_SHA}"
          run_check interruption-readiness bash -lc 'cd http-generic-api && node scripts/interruption-readiness.mjs --ci --skip-dependencies --skip-worktree'
          run_check validate-canonical-sources node validate-canonical-sources.mjs
          run_check build-canonicals-check node build-canonicals.mjs --check
          run_check spec-kit-completion-gate node http-generic-api/scripts/spec-kit-completion-gate.mjs --ci --changed
          run_check validate-memory-schema node validate-memory-schema.mjs
          run_check http-generic-api-js-syntax bash -lc 'cd http-generic-api && shopt -s nullglob && for f in *.js *.mjs routes/*.js scripts/*.mjs wordpress/*.js; do node --check "$f" || exit $?; done'

          {
            printf 'check\texit_code\tlog\n'
            cat "${results}"
          } > "${DIAGNOSTIC_ROOT}/validation-summary.tsv"
          cat "${DIAGNOSTIC_ROOT}/validation-summary.tsv"

      - name: Upload syntax governance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-map-syntax-governance-${{ github.run_id }}
          path: ${{ runner.temp }}/work-map-syntax-governance-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14

      - name: Enforce syntax governance success
        shell: bash
        run: |
          set -euo pipefail
          test -s "${DIAGNOSTIC_ROOT}/validation-results.tsv"
          awk -F '\t' '$2 != "0" { print; failed=1 } END { exit failed ? 1 : 0 }' "${DIAGNOSTIC_ROOT}/validation-results.tsv"
