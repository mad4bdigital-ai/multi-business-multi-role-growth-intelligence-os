name: Exact Phase G Schema ARM Validation

on:
  pull_request:
    branches:
      - gpt/exact-phase-g-schema-arm-base-20260803
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: exact-phase-g-schema-arm-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  phase-g-contract-diagnostic:
    name: Exact Phase G Contract Diagnostic
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/work-map-phase-g-schema-classification-20260803' &&
      github.event.pull_request.head.sha == '198c1c6f0d77cd162ffe472a56e76cf9f22e025b'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      EXPECTED_MAIN_SHA: 14433d15184bd7e7658281a356a7540e3d2d6dfe
      EXPECTED_HEAD_SHA: 198c1c6f0d77cd162ffe472a56e76cf9f22e025b
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Verify immutable identity and exact scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          git cat-file -e "${EXPECTED_MAIN_SHA}^{commit}"
          test "$(git merge-base "${EXPECTED_MAIN_SHA}" "${EXPECTED_HEAD_SHA}")" = "${EXPECTED_MAIN_SHA}"
          cat > /tmp/expected.txt <<'EOF'
          .specify/work-map-schema-classification-registry.json
          docs/work-maps/README.md
          docs/work-maps/activation-access-map.md
          docs/work-maps/connector-provider-map.md
          docs/work-maps/data-model-domain-map.md
          docs/work-maps/delivery-support-map.md
          docs/work-maps/observability-release-map.md
          docs/work-maps/platform-resource-graph-map.md
          docs/work-maps/policy-authority-map.md
          docs/work-maps/repository-automation-map.md
          docs/work-maps/work-map-coverage-matrix.md
          docs/work-maps/workflow-task-orchestration-map.md
          http-generic-api/test-work-map-schema-classification.mjs
          specs/011-dynamic-multi-tenant-growth-control-plane/e2e-phases.json
          EOF
          git diff --name-only "${EXPECTED_MAIN_SHA}" "${EXPECTED_HEAD_SHA}" | LC_ALL=C sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Install HTTP API dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Run every Phase G contract with captured result
        shell: bash
        run: |
          set -uo pipefail
          report="${RUNNER_TEMP}/phase-g-contract-diagnostic.txt"
          : > "${report}"
          failed=0

          run_check() {
            local label="$1"
            shift
            echo "===== ${label} =====" | tee -a "${report}"
            "$@" 2>&1 | tee -a "${report}"
            local rc=${PIPESTATUS[0]}
            echo "exit_code=${rc}" | tee -a "${report}"
            if [ "${rc}" -ne 0 ]; then failed=1; fi
            echo | tee -a "${report}"
          }

          run_check syntax-generator node --check http-generic-api/scripts/platform-work-map-generator.mjs
          run_check syntax-intelligence node --check http-generic-api/scripts/platform-work-map-schema-intelligence.mjs
          run_check syntax-classification node --check http-generic-api/scripts/work-map-schema-classification.mjs
          run_check syntax-classification-contract node --check http-generic-api/scripts/work-map-schema-classification-contract.mjs
          run_check syntax-pipeline-connectivity node --check http-generic-api/scripts/pipeline-connectivity-check.mjs
          run_check pipeline-connectivity node http-generic-api/scripts/pipeline-connectivity-check.mjs
          run_check pipeline-connectivity-test node http-generic-api/test-pipeline-connectivity-check.mjs
          run_check classification-contract-script node http-generic-api/scripts/work-map-schema-classification-contract.mjs
          run_check classification-script node http-generic-api/scripts/work-map-schema-classification.mjs
          run_check classification-test node http-generic-api/test-work-map-schema-classification.mjs
          run_check classification-contract-test node http-generic-api/test-work-map-schema-classification-contract.mjs

          echo '===== TRACKED STATUS =====' | tee -a "${report}"
          git status --porcelain --untracked-files=no | tee -a "${report}"
          exit "${failed}"

      - name: Upload Phase G contract diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-phase-g-contract-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/phase-g-contract-diagnostic.txt
          if-no-files-found: error
          retention-days: 14
