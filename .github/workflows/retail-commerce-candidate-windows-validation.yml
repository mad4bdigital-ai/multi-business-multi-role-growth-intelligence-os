name: Retail Commerce Candidate Windows Validation

on:
  pull_request:
    branches:
      - gpt/validate-retail-commerce-candidate-windows-20260803
    paths:
      - .changes/e2e/retail-commerce-candidate-windows-validation-v2.json

permissions:
  contents: read

concurrency:
  group: retail-commerce-candidate-windows-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate exact Retail Commerce candidate
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      EXPECTED_BASE_SHA: 118c25118f4eb89a5975f9a5d4787549c6da544d
      EXPECTED_CANDIDATE_SHA: 69e32d69c818101016d84d355097e10bc260a413
      EXPECTED_CANDIDATE_BRANCH: gpt/retail-commerce-reference-package-cleanroom-20260803
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Enforce immutable candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_CANDIDATE_SHA}"
          git fetch --no-tags origin main "${EXPECTED_CANDIDATE_BRANCH}"
          test "$(git rev-parse origin/${EXPECTED_CANDIDATE_BRANCH})" = "${EXPECTED_CANDIDATE_SHA}"
          git merge-base --is-ancestor "${EXPECTED_BASE_SHA}" "${EXPECTED_CANDIDATE_SHA}"
          git diff --name-only "${EXPECTED_BASE_SHA}...${EXPECTED_CANDIDATE_SHA}" > candidate-files.txt
          test "$(wc -l < candidate-files.txt | tr -d ' ')" = "49"
          test -z "$(grep -v '^specs/014-retail-commerce-operations-growth-os/' candidate-files.txt || true)"
      - name: Parse all Retail Commerce JSON contracts
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = 'specs/014-retail-commerce-operations-growth-os';
          const files = [];
          const walk = (dir) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.name.endsWith('.json')) files.push(full);
            }
          };
          walk(root);
          for (const file of files.sort()) JSON.parse(fs.readFileSync(file, 'utf8'));
          console.log(JSON.stringify({ ok: true, json_files: files.length }));
          NODE
      - name: Validate Work Map and Spec Kit contracts
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/spec-kit-work-map-integration-gate.mjs
          node http-generic-api/scripts/spec-kit-completion-gate.mjs
      - name: Evaluate and execute exact E2E phase contract
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/e2e-phase-governance.mjs check --base "${EXPECTED_BASE_SHA}" --head "${EXPECTED_CANDIDATE_SHA}" --report-file "${RUNNER_TEMP}/e2e-phase-evaluation.json"
          node http-generic-api/scripts/e2e-phase-governance.mjs run --base "${EXPECTED_BASE_SHA}" --head "${EXPECTED_CANDIDATE_SHA}" --report-file "${RUNNER_TEMP}/e2e-phase-evaluation.json" --execution-report-file "${RUNNER_TEMP}/e2e-phase-execution.json"
      - name: Record bounded validation summary
        if: always()
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          console.log(JSON.stringify({
            candidate_sha: process.env.EXPECTED_CANDIDATE_SHA,
            base_sha: process.env.EXPECTED_BASE_SHA,
            candidate_branch: process.env.EXPECTED_CANDIDATE_BRANCH,
            repository_mutation: false,
            provider_mutation: false,
            database_mutation: false,
            deployment: false,
            production_mutation: false,
            secrets_included: false
          }));
          NODE
