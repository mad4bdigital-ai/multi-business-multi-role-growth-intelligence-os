name: Governed Production Candidate Builder ARM Live 20260803

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/governed-production-candidate-builder-arm-live-20260803.yml

permissions:
  contents: write

concurrency:
  group: governed-production-candidate-builder-arm-live-20260803
  cancel-in-progress: false

jobs:
  build-candidate:
    name: Build live-ref pinned Production candidate
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/build-production-candidate-live-refs-20260803-v2' &&
      github.event.pull_request.user.id == 271942579
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      REQUEST_PR: ${{ github.event.pull_request.number }}
      REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      REQUEST_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      WORKFLOW_PATH: .github/workflows/governed-production-candidate-builder-arm-live-20260803.yml
      FIX_MERGE_SHA: c7f7be81b811caf3c1112372ab1089fc5ee3714c
    steps:
      - name: Checkout exact request head with full ancestry
        uses: actions/checkout@v5
        with:
          ref: ${{ env.REQUEST_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify one-file immutable request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${REQUEST_HEAD_SHA}"
          test "${REQUEST_HEAD_REF}" = "gpt/build-production-candidate-live-refs-20260803-v2"
          mapfile -t changed_files < <(
            gh api --paginate "/repos/${REPOSITORY}/pulls/${REQUEST_PR}/files?per_page=100" --jq '.[].filename'
          )
          test "${#changed_files[@]}" -eq 1
          test "${changed_files[0]}" = "${WORKFLOW_PATH}"

      - name: Pin current protected refs for this execution
        id: refs
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/Production:refs/remotes/origin/Production"
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          production_sha="$(git rev-parse refs/remotes/origin/Production)"
          test "${#main_sha}" -eq 40
          test "${#production_sha}" -eq 40
          git merge-base --is-ancestor "${FIX_MERGE_SHA}" "${main_sha}"
          if git diff --quiet "${production_sha}" "${main_sha}" -- http-generic-api/executionResolution.js; then
            echo 'Production unexpectedly already matches main executionResolution.js; refusing duplicate candidate.' >&2
            exit 1
          fi
          echo "main_sha=${main_sha}" >> "${GITHUB_OUTPUT}"
          echo "production_sha=${production_sha}" >> "${GITHUB_OUTPUT}"
          echo "main_tree=$(git rev-parse "${main_sha}^{tree}")" >> "${GITHUB_OUTPUT}"

      - name: Construct deterministic two-parent candidate
        id: candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          main_sha='${{ steps.refs.outputs.main_sha }}'
          production_sha='${{ steps.refs.outputs.production_sha }}'
          main_tree='${{ steps.refs.outputs.main_tree }}'

          export GIT_AUTHOR_NAME='mad4bdigital-ai'
          export GIT_AUTHOR_EMAIL='271942579+mad4bdigital-ai@users.noreply.github.com'
          export GIT_COMMITTER_NAME='mad4bdigital-ai'
          export GIT_COMMITTER_EMAIL='271942579+mad4bdigital-ai@users.noreply.github.com'
          export GIT_AUTHOR_DATE='2026-08-03T17:06:00Z'
          export GIT_COMMITTER_DATE='2026-08-03T17:06:00Z'

          candidate_sha="$(printf '%s\n\n%s\n%s\n%s\n' \
            'release: reconcile current main snapshot with Production ancestry' \
            "Pinned main: ${main_sha}" \
            "Pinned Production: ${production_sha}" \
            'Final tree is byte-identical to pinned main; both protected ancestries are preserved.' \
            | git commit-tree "${main_tree}" -p "${main_sha}" -p "${production_sha}")"
          candidate_tree="$(git rev-parse "${candidate_sha}^{tree}")"
          candidate_branch="release/production-candidate-20260803-${candidate_sha:0:8}-v1"

          test "${candidate_tree}" = "${main_tree}"
          test "$(git show -s --format=%P "${candidate_sha}")" = "${main_sha} ${production_sha}"
          git diff --quiet "${main_sha}" "${candidate_sha}" --
          git merge-base --is-ancestor "${main_sha}" "${candidate_sha}"
          git merge-base --is-ancestor "${production_sha}" "${candidate_sha}"

          echo "candidate_sha=${candidate_sha}" >> "${GITHUB_OUTPUT}"
          echo "candidate_tree=${candidate_tree}" >> "${GITHUB_OUTPUT}"
          echo "candidate_branch=${candidate_branch}" >> "${GITHUB_OUTPUT}"

      - name: Re-read refs and publish immutable candidate without force
        shell: bash
        run: |
          set -Eeuo pipefail
          main_sha='${{ steps.refs.outputs.main_sha }}'
          production_sha='${{ steps.refs.outputs.production_sha }}'
          candidate_sha='${{ steps.candidate.outputs.candidate_sha }}'
          candidate_branch='${{ steps.candidate.outputs.candidate_branch }}'

          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/Production:refs/remotes/origin/Production"
          test "$(git rev-parse refs/remotes/origin/main)" = "${main_sha}"
          test "$(git rev-parse refs/remotes/origin/Production)" = "${production_sha}"

          existing="$(git ls-remote --heads origin "refs/heads/${candidate_branch}" | awk '{print $1}')"
          if [[ -n "${existing}" ]]; then
            test "${existing}" = "${candidate_sha}"
          else
            git push origin "${candidate_sha}:refs/heads/${candidate_branch}"
          fi
          test "$(git ls-remote --heads origin "refs/heads/${candidate_branch}" | awk '{print $1}')" = "${candidate_sha}"

      - name: Write no-secret construction evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          evidence_dir="${RUNNER_TEMP}/production-candidate"
          mkdir -p "${evidence_dir}"
          jq -n \
            --arg main_sha '${{ steps.refs.outputs.main_sha }}' \
            --arg production_sha '${{ steps.refs.outputs.production_sha }}' \
            --arg fix_merge_sha "${FIX_MERGE_SHA}" \
            --arg candidate_sha '${{ steps.candidate.outputs.candidate_sha }}' \
            --arg candidate_tree '${{ steps.candidate.outputs.candidate_tree }}' \
            --arg candidate_branch '${{ steps.candidate.outputs.candidate_branch }}' \
            --arg source_run_id "${GITHUB_RUN_ID}" \
            --argjson request_pr "${REQUEST_PR}" \
            '{
              contract:"mad4b.governed-production-candidate-construction.v1",
              request_pr:$request_pr,
              source_run_id:$source_run_id,
              main_sha:$main_sha,
              production_sha:$production_sha,
              fix_merge_sha:$fix_merge_sha,
              candidate_sha:$candidate_sha,
              candidate_tree:$candidate_tree,
              candidate_branch:$candidate_branch,
              candidate_tree_matches_main:true,
              main_ancestry_preserved:true,
              production_ancestry_preserved:true,
              protected_ref_mutation_performed:false,
              force_push_performed:false,
              release_pr_created:false,
              deployment_performed:false,
              provider_call_performed:false,
              credential_payload_read:false,
              sql_execution_performed:false,
              migration_apply_performed:false,
              database_mutation_performed:false,
              external_send_performed:false,
              secrets_included:false
            }' > "${evidence_dir}/summary.json"
          cat "${evidence_dir}/summary.json"

      - name: Upload construction evidence
        uses: actions/upload-artifact@v4
        with:
          name: governed-production-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/production-candidate/summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Emit candidate identity
        shell: bash
        run: |
          echo "GOVERNED_PRODUCTION_CANDIDATE=BUILT"
          echo "main_sha=${{ steps.refs.outputs.main_sha }}"
          echo "production_sha=${{ steps.refs.outputs.production_sha }}"
          echo "candidate_sha=${{ steps.candidate.outputs.candidate_sha }}"
          echo "candidate_tree=${{ steps.candidate.outputs.candidate_tree }}"
          echo "candidate_branch=${{ steps.candidate.outputs.candidate_branch }}"
          echo "release_pr_created=false"
          echo "deployment_performed=false"
          echo "secrets_included=false"
