name: Hostinger Storage Final Work Map Readback Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/hostinger-storage-final-work-map-readback-guard.yml"
      - ".specify/spec-kit-work-map-integration-policy.json"
      - ".specify/work-map-schema-classification-registry.json"
      - "docs/work-maps/**"
      - "http-generic-api/scripts/spec014-final-work-map-readback.mjs"
      - "http-generic-api/scripts/spec-kit-work-map-governance-gate.mjs"
      - "http-generic-api/scripts/spec-kit-work-map-integration-gate.mjs"
      - "http-generic-api/scripts/work-map-schema-classification.mjs"
      - "specs/014-governed-hostinger-storage-orchestration/work-map-integration.json"
      - "specs/014-governed-hostinger-storage-orchestration/tasks.md"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  final-work-map-readback:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 6306 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/validate/runtime-parity-final-head-c58ee81-20260804' &&
      github.event.pull_request.base.ref == 'main' &&
      github.actor == 'mad4bdigital-ai'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      TARGET_PR: '5985'
      TARGET_BRANCH: gpt/add-runtime-parity-comment-bridge-v2-20260804
      TARGET_SHA: 249f55bb55d986d4f7615a522247d2ecdc724b47
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout immutable target candidate
        uses: actions/checkout@v5
        with:
          ref: 249f55bb55d986d4f7615a522247d2ecdc724b47
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable target identity and scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}")"
          test "$(jq -r '.state' <<<"${pr_json}")" = open
          test "$(jq -r '.draft' <<<"${pr_json}")" = false
          test "$(jq -r '.base.ref' <<<"${pr_json}")" = main
          test "$(jq -r '.head.repo.full_name' <<<"${pr_json}")" = "${GITHUB_REPOSITORY}"
          test "$(jq -r '.head.ref' <<<"${pr_json}")" = "${TARGET_BRANCH}"
          test "$(jq -r '.head.sha' <<<"${pr_json}")" = "${TARGET_SHA}"

          compare_json="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${TARGET_SHA}")"
          test "$(jq -r '.behind_by' <<<"${compare_json}")" = 0
          status="$(jq -r '.status' <<<"${compare_json}")"
          [[ "${status}" = ahead || "${status}" = identical ]]

          actual_scope="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}/files" --jq '.[].filename' | sort)"
          expected_scope="$(printf '%s\n' \
            '.changes/e2e/production-runtime-parity-comment-bridge.json' \
            '.github/workflows/production-runtime-parity-comment-bridge.yml' \
            'docs/work-maps/README.md' \
            'docs/work-maps/repository-automation-map.md' \
            'http-generic-api/scripts/test-production-runtime-parity-comment-bridge.mjs' \
            'specs/014-governed-hostinger-storage-orchestration/work-map-integration.json' | sort)"
          test "${actual_scope}" = "${expected_scope}"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate bridge and Work Map generation contract
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check http-generic-api/scripts/test-production-runtime-parity-comment-bridge.mjs
          node http-generic-api/scripts/test-production-runtime-parity-comment-bridge.mjs
          node --check http-generic-api/scripts/platform-work-map-generator.mjs
          node --check http-generic-api/scripts/platform-work-map-schema-intelligence.mjs
          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          node --check http-generic-api/scripts/spec014-final-work-map-readback.mjs

      - name: Build structured exact-head readback
        id: readback
        shell: bash
        run: |
          set -u
          report_dir="${RUNNER_TEMP}/spec014-final-work-map-readback"
          mkdir -p "$report_dir"
          set +e
          REPORT_PATH="${report_dir}/summary.json" \
            node http-generic-api/scripts/spec014-final-work-map-readback.mjs \
            > "${report_dir}/stdout.json"
          status=$?
          set -e
          cp "${report_dir}/summary.json" "${report_dir}/spec014-final-work-map-readback.json"
          node - "$report_dir" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = process.argv[2];
          const report = JSON.parse(fs.readFileSync(path.join(dir, 'summary.json'), 'utf8'));
          const rows = [
            '# Runtime Parity Final Head Work Map Readback',
            '',
            `- Target PR: **#5985**`,
            `- Candidate SHA: \`${report.candidate_sha}\``,
            `- Outcome: **${report.ok ? 'passed' : 'failed'}**`,
            `- Current registry fingerprint: \`${report.current_registry.fingerprint}\``,
            `- Manifest fingerprint: \`${report.manifest_registry?.fingerprint || 'missing'}\``,
            `- Work Maps: \`${report.current_registry.map_count}\``,
            `- Classification coverage: \`${report.classification.coverage_percent}%\``,
            `- Findings: \`${report.findings.length}\``,
            `- Secrets included: \`${report.secrets_included}\``,
            '',
            '## Findings',
            '',
            ...(report.findings.length
              ? report.findings.map((finding) => `- \`${finding.code}\`: \`${JSON.stringify(finding)}\``)
              : ['- None.']),
            '',
          ];
          fs.writeFileSync(path.join(dir, 'summary.md'), `${rows.join('\n')}\n`);
          NODE
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Upload structured readback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-parity-final-head-readback-249f55-${{ github.run_id }}
          path: ${{ runner.temp }}/spec014-final-work-map-readback
          if-no-files-found: error
          retention-days: 14

      - name: Publish workflow summary
        if: always()
        shell: bash
        run: cat "${RUNNER_TEMP}/spec014-final-work-map-readback/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce structured readback decision
        shell: bash
        run: |
          node - "${RUNNER_TEMP}/spec014-final-work-map-readback/summary.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!report.ok) process.exit(1);
          if (report.secrets_included !== false) process.exit(1);
          if (report.candidate_sha !== '249f55bb55d986d4f7615a522247d2ecdc724b47') process.exit(1);
          NODE
