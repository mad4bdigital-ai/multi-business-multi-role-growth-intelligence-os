name: Spec 014 Wave 1 Readback Table Name Repair Writer

on:
  push:
    branches:
      - fix/spec014-wave1-readback-table-name-20260805

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Verify immutable repair identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "fix/spec014-wave1-readback-table-name-20260805"
          test "$(git rev-parse HEAD^)" = "dfb1550970e5d2ed340ab63e233fcecf0edc5466"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "dfb1550970e5d2ed340ab63e233fcecf0edc5466"

      - name: Apply bounded table-name readback repair and regression
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const runnerPath = '.github/ops/spec014-wave1-apply.mjs';
          const testPath = 'http-generic-api/test-spec014-wave1-apply-contract.mjs';
          const contractPath = '.changes/e2e/spec014-wave1-apply-contract.json';

          let runner = fs.readFileSync(runnerPath, 'utf8');
          const oldMap = ".map((row) => String(typeof row === 'string' ? row : row.table || row.table_name || row.name || ''))";
          const newMap = ".map((row) =>\n        String(\n          typeof row === 'string'\n            ? row\n            : row.table || row.table_name || row.TABLE_NAME || row.name || '',\n        ),\n      )";
          const mapCount = runner.split(oldMap).length - 1;
          if (mapCount !== 1) throw new Error(`Expected one legacy table-name map, found ${mapCount}`);
          runner = runner.replace(oldMap, newMap);
          fs.writeFileSync(runnerPath, runner);

          let test = fs.readFileSync(testPath, 'utf8');
          const testMarker = "assert.match(runner, /exactTables/);\n";
          const testInsertion = `${testMarker}assert.match(runner, /row\\.TABLE_NAME/);\n`;
          const testCount = test.split(testMarker).length - 1;
          if (testCount !== 1) throw new Error(`Expected one exactTables assertion marker, found ${testCount}`);
          if (test.includes('assert.match(runner, /row\\.TABLE_NAME/);')) {
            throw new Error('TABLE_NAME regression already exists unexpectedly');
          }
          test = test.replace(testMarker, testInsertion);
          fs.writeFileSync(testPath, test);

          let contract = fs.readFileSync(contractPath, 'utf8');
          const oldAssertion = '            "Success requires exact Apply ledger metadata and all four foundation tables.",';
          const newAssertion = '            "Success requires exact Apply ledger metadata and all four foundation tables, including readback rows that expose the canonical information_schema TABLE_NAME field.",';
          const contractCount = contract.split(oldAssertion).length - 1;
          if (contractCount !== 1) throw new Error(`Expected one table certification assertion, found ${contractCount}`);
          contract = contract.replace(oldAssertion, newAssertion);
          fs.writeFileSync(contractPath, contract);
          NODE

          node --check .github/ops/spec014-wave1-apply.mjs
          node http-generic-api/test-spec014-wave1-apply-contract.mjs
          node -e "JSON.parse(require('fs').readFileSync('.changes/e2e/spec014-wave1-apply-contract.json','utf8'))"
          grep -F "row.TABLE_NAME" .github/ops/spec014-wave1-apply.mjs

      - name: Retire writer and publish final three-file repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/spec014-wave1-readback-table-name-repair-writer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .changes/e2e/spec014-wave1-apply-contract.json \
            .github/ops/spec014-wave1-apply.mjs \
            http-generic-api/test-spec014-wave1-apply-contract.mjs
          git commit -m "fix(spec014): recognize canonical TABLE_NAME in Apply readback"

          mapfile -t changed < <(git diff --name-only origin/main...HEAD | sort)
          expected=(
            ".changes/e2e/spec014-wave1-apply-contract.json"
            ".github/ops/spec014-wave1-apply.mjs"
            "http-generic-api/test-spec014-wave1-apply-contract.mjs"
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}"
          done

          remote_head="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
