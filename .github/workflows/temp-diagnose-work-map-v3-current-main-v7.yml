name: TEMP Diagnose Work Map V3 Current Main V7

on:
  pull_request:
    branches:
      - gpt/base-diagnose-work-map-v3-main-07264baf-v7-20260804
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose focused Pipeline Connectivity assertion
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      MAIN_SHA: 07264baf9957a26bb853df03e7cdb579c7a5c7e7
      SOURCE_SHA: f1bc371bb27ccf249ddc3ca3d7081dc8a3eb995e
      SOURCE_REF: gpt/work-map-post-write-exact-observable-dispatch-a61cd9e8-v2-20260804
      TRIGGER_REF: gpt/trigger-diagnose-work-map-v3-main-07264baf-v7-20260804
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v5
        with:
          ref: ${{ env.MAIN_SHA }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Reconstruct exact tested source without publishing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.repo.full_name }}" = "${GITHUB_REPOSITORY}"
          test "${{ github.event.pull_request.head.ref }}" = "${TRIGGER_REF}"
          test "$(git rev-parse HEAD)" = "${MAIN_SHA}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "${MAIN_SHA}"
          git fetch --no-tags origin "+refs/heads/${SOURCE_REF}:refs/remotes/origin/reviewed-source"
          test "$(git rev-parse refs/remotes/origin/reviewed-source)" = "${SOURCE_SHA}"
          git checkout "${SOURCE_SHA}" -- \
            .changes/e2e/work-map-post-write-exact-verification-dispatch.json \
            .github/workflows/ci.yml \
            .github/workflows/spec-kit-work-map-autofix.yml \
            .github/workflows/spec-kit-work-map-integration.yml \
            http-generic-api/test-work-map-post-write-exact-verification-dispatch.mjs
          python3 <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/spec-kit-work-map-autofix.yml')
          source = path.read_text()
          old = '          [[ "${TARGET_BRANCH}" =~ ^(gpt|cert|fix|feat|chore|docs|release)/[A-Za-z0-9._/-]+$ ]]'
          new = '          [[ "${TARGET_BRANCH}" != refs/* ]]'
          if source.count(old) != 1:
              raise SystemExit('reviewed branch-prefix assertion is not unique')
          path.write_text(source.replace(old, new))
          PY
          node <<'NODE'
          const fs = require('node:fs');
          const contractPath = '.specify/pipeline-connectivity-contract.json';
          const contract = JSON.parse(fs.readFileSync(contractPath, 'utf8'));
          const legacy = new Set(['gh workflow run ci.yml','gh workflow run spec-kit-work-map-integration.yml','mad4b.spec-kit-work-map-autofix.v2','WORK_MAP_AUTOFIX_V2']);
          const modern = ['RESULT_HEAD_SHA','gh api --method POST','actions/workflows/ci.yml/dispatches','actions/workflows/spec-kit-work-map-integration.yml/dispatches','ci_dispatch_exit_code','integration_dispatch_exit_code','ci_run_id','integration_run_id','head_sha ==','mad4b.spec-kit-work-map-autofix.v3','WORK_MAP_AUTOFIX_V3'];
          const required = (values) => [...new Set([...values.filter((value) => !legacy.has(value)), ...modern])];
          const forbidden = (values) => [...new Set([...values, ...legacy])];
          const policy = contract.artifact_writer_policies.find((row) => row.key === 'platform-work-maps-sole-remote-writer');
          const writer = contract.pipelines.find((row) => row.key === 'spec-kit-work-map-autofix');
          if (!policy || !writer) throw new Error('canonical Work Map writer records missing');
          policy.required_writer_commands = required(policy.required_writer_commands);
          policy.forbidden_writer_commands = forbidden(policy.forbidden_writer_commands);
          writer.required_commands = required(writer.required_commands);
          writer.forbidden_commands = forbidden(writer.forbidden_commands);
          fs.writeFileSync(contractPath, `${JSON.stringify(contract, null, 2)}\n`);

          const testPath = 'http-generic-api/test-pipeline-connectivity-check.mjs';
          let source = fs.readFileSync(testPath, 'utf8');
          const policyAnchor = `  assert.deepEqual(\n    writerPolicy.non_writer_pipelines.map((row) => row.pipeline).sort(),\n    ["docs-agent", "openapi-auto-sync", "spec-kit-work-map-integration", "work-map-recovery-bridge"].sort(),\n  );`;
          const policyInsert = `${policyAnchor}\n  assert.ok(writerPolicy.required_writer_commands.includes("WORK_MAP_AUTOFIX_V3"));\n  assert.ok(writerPolicy.required_writer_commands.includes("actions/workflows/ci.yml/dispatches"));\n  assert.ok(writerPolicy.required_writer_commands.includes("actions/workflows/spec-kit-work-map-integration.yml/dispatches"));\n  assert.ok(writerPolicy.forbidden_writer_commands.includes("WORK_MAP_AUTOFIX_V2"));\n  assert.ok(writerPolicy.forbidden_writer_commands.includes("gh workflow run ci.yml"));\n  assert.ok(writerPolicy.forbidden_writer_commands.includes("gh workflow run spec-kit-work-map-integration.yml"));`;
          if (!source.includes(policyAnchor)) throw new Error('stable writer policy assertion anchor missing');
          source = source.replace(policyAnchor, policyInsert);
          const oldBlock = `  assert.ok(writerWorkflow.includes("WORK_MAP_AUTOFIX_V2"));\n  assert.ok(writerWorkflow.includes("gh workflow run ci.yml"));\n  assert.ok(writerWorkflow.includes("gh workflow run spec-kit-work-map-integration.yml"));`;
          const newBlock = `  assert.ok(writerWorkflow.includes("WORK_MAP_AUTOFIX_V3"));\n  assert.ok(writerWorkflow.includes("mad4b.spec-kit-work-map-autofix.v3"));\n  assert.ok(writerWorkflow.includes("gh api --method POST"));\n  assert.ok(writerWorkflow.includes("actions/workflows/ci.yml/dispatches"));\n  assert.ok(writerWorkflow.includes("actions/workflows/spec-kit-work-map-integration.yml/dispatches"));\n  assert.ok(writerWorkflow.includes("ci_dispatch_exit_code"));\n  assert.ok(writerWorkflow.includes("integration_dispatch_exit_code"));\n  assert.ok(writerWorkflow.includes("ci_run_id"));\n  assert.ok(writerWorkflow.includes("integration_run_id"));\n  assert.ok(writerWorkflow.includes(".head_sha =="));\n  assert.ok(writerWorkflow.includes("RESULT_HEAD_SHA"));\n  assert.ok(!writerWorkflow.includes("gh workflow run ci.yml"));\n  assert.ok(!writerWorkflow.includes("gh workflow run spec-kit-work-map-integration.yml"));\n  assert.ok(!writerWorkflow.includes("WORK_MAP_AUTOFIX_V2"));\n  assert.ok(!writerWorkflow.includes("mad4b.spec-kit-work-map-autofix.v2"));`;
          if (!source.includes(oldBlock)) throw new Error('legacy writer assertion block missing');
          fs.writeFileSync(testPath, source.replace(oldBlock, newBlock));
          NODE

      - name: Run precursor checks independently
        id: precursor
        shell: bash
        run: |
          set -uo pipefail
          diagnostic_dir="${RUNNER_TEMP}/work-map-v3-diagnostic"
          mkdir -p "${diagnostic_dir}"
          summary="${diagnostic_dir}/precursor-summary.txt"
          : > "${summary}"
          overall=0
          run_check() {
            local name="$1"
            shift
            local log="${diagnostic_dir}/${name}.log"
            printf 'check=%s\ncommand=' "${name}" | tee -a "${summary}"
            printf '%q ' "$@" | tee -a "${summary}"
            printf '\n' | tee -a "${summary}"
            "$@" >"${log}" 2>&1
            local code=$?
            printf 'exit_code=%s\nlog=%s\n\n' "${code}" "${log}" | tee -a "${summary}"
            if [[ "${code}" -ne 0 ]]; then
              overall=1
            fi
          }
          run_check syntax_check node --check http-generic-api/test-pipeline-connectivity-check.mjs
          run_check exact_dispatch_test node http-generic-api/test-work-map-post-write-exact-verification-dispatch.mjs
          run_check connectivity_validator node http-generic-api/scripts/pipeline-connectivity-check.mjs
          echo "overall_exit_code=${overall}" | tee -a "${summary}"
          echo "overall_exit_code=${overall}" >> "${GITHUB_OUTPUT}"
          echo "diagnostic_dir=${diagnostic_dir}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Trace first false assert.ok in temporary copy
        id: trace
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          diagnostic_dir="${RUNNER_TEMP}/work-map-v3-diagnostic"
          mkdir -p "${diagnostic_dir}"
          source_path="http-generic-api/test-pipeline-connectivity-check.mjs"
          diagnostic_path="http-generic-api/.diagnostic-test-pipeline-connectivity-check.mjs"
          setup_code=0
          cp "${source_path}" "${diagnostic_path}" 2>"${diagnostic_dir}/trace-setup.log" || setup_code=$?
          if [[ "${setup_code}" -eq 0 ]]; then
            python3 <<'PY' >>"${RUNNER_TEMP}/work-map-v3-diagnostic/trace-setup.log" 2>&1 || setup_code=$?
          from pathlib import Path
          path = Path('http-generic-api/.diagnostic-test-pipeline-connectivity-check.mjs')
          source = path.read_text()
          anchor = 'import { validatePipelineConnectivity } from "./scripts/pipeline-connectivity-check.mjs";\n'
          call_count = source.count('assert.ok(')
          if source.count(anchor) != 1:
              raise SystemExit('diagnostic import anchor is not unique')
          if call_count < 1:
              raise SystemExit('no assert.ok calls found for instrumentation')
          source = source.replace('assert.ok(', 'diagnosticAssertOk(')
          instrumentation = '''\nconst __originalAssertOk = assert.ok.bind(assert);\nlet __assertOkIndex = 0;\nfunction diagnosticAssertOk(value, ...args) {\n  __assertOkIndex += 1;\n  if (!value) {\n    console.error(`DIAGNOSTIC_ASSERT_OK_INDEX=${__assertOkIndex}`);\n    console.error(new Error(`DIAGNOSTIC_ASSERT_OK_FALSE_${__assertOkIndex}`).stack);\n  }\n  return __originalAssertOk(value, ...args);\n}\n'''
          path.write_text(source.replace(anchor, anchor + instrumentation))
          print(f'DIAGNOSTIC_ASSERT_OK_SOURCE_COUNT={call_count}')
          PY
          fi
          if [[ "${setup_code}" -ne 0 ]]; then
            echo "trace_setup_exit_code=${setup_code}" | tee -a "${diagnostic_dir}/trace-setup.log"
            echo "trace_exit_code=${setup_code}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          {
            echo '=== ASSERT CALL INDEX ==='
            grep -n 'assert\.' "${source_path}" || true
            echo '=== INSTRUMENTED CALL INDEX ==='
            grep -n 'diagnosticAssertOk' "${diagnostic_path}" || true
          } >"${diagnostic_dir}/assert-call-index.log" 2>&1
          node "${diagnostic_path}" >"${diagnostic_dir}/trace-execution.log" 2>&1
          trace_code=$?
          echo "trace_exit_code=${trace_code}" | tee -a "${diagnostic_dir}/trace-execution.log"
          echo "trace_exit_code=${trace_code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Record bounded repository state
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          diagnostic_dir="${RUNNER_TEMP}/work-map-v3-diagnostic"
          mkdir -p "${diagnostic_dir}"
          {
            echo "expected_main_sha=${MAIN_SHA}"
            echo "reviewed_source_sha=${SOURCE_SHA}"
            echo "checked_out_sha=$(git rev-parse HEAD 2>/dev/null || true)"
            echo '=== git status --short ==='
            git status --short || true
            echo '=== git diff --name-status ==='
            git diff --name-status || true
            echo '=== bounded file hashes ==='
            sha256sum \
              .changes/e2e/work-map-post-write-exact-verification-dispatch.json \
              .github/workflows/ci.yml \
              .github/workflows/spec-kit-work-map-autofix.yml \
              .github/workflows/spec-kit-work-map-integration.yml \
              http-generic-api/test-work-map-post-write-exact-verification-dispatch.mjs \
              http-generic-api/test-pipeline-connectivity-check.mjs \
              .specify/pipeline-connectivity-contract.json \
              2>/dev/null || true
          } >"${diagnostic_dir}/repository-state.txt"

      - name: Upload read-only diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-map-v3-diagnostic-v7-${{ github.run_id }}
          path: ${{ runner.temp }}/work-map-v3-diagnostic
          if-no-files-found: error
          retention-days: 7

      - name: Report no-write boundary
        if: always()
        shell: bash
        run: |
          echo 'candidate_created=false'
          echo 'source_commit_created=false'
          echo 'generated_work_maps_written=false'
          echo 'protected_ref_mutated=false'
          echo 'force_push=false'
          echo 'production_mutated=false'

      - name: Preserve diagnostic failure result
        if: always()
        env:
          PRECURSOR_EXIT: ${{ steps.precursor.outputs.overall_exit_code }}
          TRACE_EXIT: ${{ steps.trace.outputs.trace_exit_code }}
        shell: bash
        run: |
          set -euo pipefail
          precursor="${PRECURSOR_EXIT:-99}"
          trace="${TRACE_EXIT:-99}"
          echo "precursor_exit=${precursor}"
          echo "trace_exit=${trace}"
          if [[ "${precursor}" -ne 0 || "${trace}" -ne 0 ]]; then
            exit 1
          fi
