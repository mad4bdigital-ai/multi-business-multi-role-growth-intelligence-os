name: Temporary Spec 014 Durable Registry Exact Commit Length Patch

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-spec014-durable-registry-commit-length-patch.yml'

permissions:
  contents: write

jobs:
  patch-exact-head:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/014-hostinger/durable-registry-commit-identity-repair-20260802'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact writable feature branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Enforce exact non-truncated commit length
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('http-generic-api/hostingerStorageDurableAuthorizedInjectionState.js')
          text = path.read_text(encoding='utf-8')
          old = """function commit(value, field) {
            const normalized = text(value, 64);
            if (normalized !== normalized.toLowerCase() || !COMMIT_RE.test(normalized)) {
              throw fail(400, 'STORAGE_DURABLE_INJECTION_COMMIT_INVALID', 'A lowercase Git object identity with 40 or 64 hexadecimal characters is required.', { field });
            }
            return normalized;
          }
          """
          new = """function commit(value, field) {
            const normalized = String(value ?? '').trim();
            if (normalized !== normalized.toLowerCase() || !COMMIT_RE.test(normalized)) {
              throw fail(400, 'STORAGE_DURABLE_INJECTION_COMMIT_INVALID', 'A lowercase Git object identity with exactly 40 or 64 hexadecimal characters is required.', { field });
            }
            return normalized;
          }
          """
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit('commit validator length anchor drifted')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Commit exact patch when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- http-generic-api/hostingerStorageDurableAuthorizedInjectionState.js; then
            echo 'Exact length patch already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add http-generic-api/hostingerStorageDurableAuthorizedInjectionState.js
          git commit -m 'fix(spec-014): reject truncated commit identities'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
