name: Automation Overlap Guard

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "http-generic-api/governedMigrationReconciliationRuntime.js"
      - "http-generic-api/scripts/**/*.mjs"
      - "http-generic-api/scripts/taxonomy/*.json"
      - "http-generic-api/test-automation-overlap-analyzer.mjs"
      - "http-generic-api/test-governed-migration-reconciliation-runtime-lock.mjs"
      - "http-generic-api/package.json"
      - "docs/automation-overlap-governance.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "http-generic-api/governedMigrationReconciliationRuntime.js"
      - "http-generic-api/scripts/**/*.mjs"
      - "http-generic-api/scripts/taxonomy/*.json"
      - "http-generic-api/test-automation-overlap-analyzer.mjs"
      - "http-generic-api/test-governed-migration-reconciliation-runtime-lock.mjs"
      - "http-generic-api/package.json"
      - "docs/automation-overlap-governance.md"

permissions:
  contents: read

concurrency:
  group: automation-overlap-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze automation ownership and overlap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install runtime dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Run governed overlap analysis
        working-directory: http-generic-api
        run: |
          node scripts/automation-overlap-analyzer.mjs \
            --check \
            --report-file=automation-overlap-report.json \
            --markdown-file=automation-overlap-report.md

      - name: Run focused regression tests
        working-directory: http-generic-api
        run: npm run test:automation:overlap

      - name: Publish overlap summary
        if: always()
        working-directory: http-generic-api
        run: |
          if [ -f automation-overlap-report.md ]; then
            cat automation-overlap-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload overlap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-overlap-report
          path: |
            http-generic-api/automation-overlap-report.json
            http-generic-api/automation-overlap-report.md
          if-no-files-found: warn
          retention-days: 30

  local-connector-production-closure:
    name: Governed Local Connector Production Closure
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 4076 &&
      github.event.pull_request.base.ref == 'main' &&
      github.head_ref == 'gpt/visible-local-connector-closure-run-v2-20260731' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: governed-local-connector-production-closure-pr-3945
      cancel-in-progress: true
    env:
      RUNTIME_BASE_URL: https://auth.mad4b.com
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      HOTFIX_MERGE_SHA: 792ff63af82791e9a482029f5078931fa0707c8c
      ADMIN_USER_ID: 00000000-0000-4000-a000-000000000002
      PLATFORM_TENANT_ID: 00000000-0000-4000-a000-000000000001
      DEVICE_ID: mohammedlap
      BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
      GH_READ_TOKEN: ${{ github.token }}
      EVIDENCE_PATH: ${{ runner.temp }}/governed-local-connector-production-closure.json
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Record active-workflow closure start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPOSITORY}/issues/3945/comments" \
            -f body="GOVERNED_LOCAL_CONNECTOR_PRODUCTION_CLOSURE status=started run_id=${GITHUB_RUN_ID} trigger=automation-overlap-guard trusted_ref=main event_pr=4076 supersedes_older_runs=true"

      - name: Verify exact merged Production PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MERGED=$(gh api "/repos/${REPOSITORY}/pulls/3945" --jq '.merged')
          MERGE_SHA=$(gh api "/repos/${REPOSITORY}/pulls/3945" --jq '.merge_commit_sha')
          test "$MERGED" = "true"
          test "$MERGE_SHA" = "$HOTFIX_MERGE_SHA"

      - name: Execute bounded trusted closure
        id: closure
        run: node .github/scripts/governed-local-connector-production-closure.mjs

      - name: Upload bounded closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governed-local-connector-production-closure-${{ github.run_id }}
          path: ${{ env.EVIDENCE_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Record governed closure outcome on Production PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CLOSURE_RESULT: ${{ steps.closure.outputs.result }}
          PRODUCTION_SHA: ${{ steps.closure.outputs.production_sha }}
          COMMAND_ID: ${{ steps.closure.outputs.command_id }}
          ROUTE_COUNT: ${{ steps.closure.outputs.registered_route_count }}
          HEALTH_AGE: ${{ steps.closure.outputs.health_age_seconds }}
          FAILURE_MESSAGE: ${{ steps.closure.outputs.failure_message }}
        run: |
          set -euo pipefail
          RESULT="${CLOSURE_RESULT:-unknown}"
          BODY="GOVERNED_LOCAL_CONNECTOR_PRODUCTION_CLOSURE result=${RESULT} run_id=${GITHUB_RUN_ID} trigger=automation-overlap-guard trusted_ref=main production_sha=${PRODUCTION_SHA:-unverified} command_id=${COMMAND_ID:-none} registered_route_count=${ROUTE_COUNT:-unknown} health_age_seconds=${HEALTH_AGE:-unknown} artifact=governed-local-connector-production-closure-${GITHUB_RUN_ID} event_pr=4076"
          if [[ "$RESULT" != "pass" && -n "${FAILURE_MESSAGE:-}" ]]; then
            BODY="${BODY} failure=${FAILURE_MESSAGE}"
          fi
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPOSITORY}/issues/3945/comments" \
            -f body="$BODY"
