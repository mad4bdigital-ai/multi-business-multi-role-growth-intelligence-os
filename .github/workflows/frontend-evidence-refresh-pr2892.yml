name: Temporary frontend evidence refresh PR2892

on:
  push:
    branches:
      - "gpt/frontend-workflow-auth-parity-clean-v2-20260720"

permissions:
  contents: write

jobs:
  refresh-generated:
    if: github.repository == 'mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os' && github.ref_name == 'gpt/frontend-workflow-auth-parity-clean-v2-20260720'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: http-generic-api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/frontend-workflow-auth-parity-clean-v2-20260720
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json
      - run: npm ci
      - name: Generate and commit bounded evidence
        shell: bash
        run: |
          git fetch origin main --depth=1
          npm run frontend:dispatch:generate -- --baseline-ref="main"
          UNEXPECTED="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(http-generic-api/)?(frontend-surface-dispatch\.generated\.json|openapi/frontend-runtime-routes\.generated\.yaml)$' || true)"
          if [[ -n "${UNEXPECTED}" ]]; then
            echo "::error::generator changed files outside the bounded evidence set"
            printf '%s\n' "${UNEXPECTED}"
            exit 1
          fi
          if git diff --quiet -- frontend-surface-dispatch.generated.json openapi/frontend-runtime-routes.generated.yaml; then
            echo "Generated evidence is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-surface-dispatch.generated.json openapi/frontend-runtime-routes.generated.yaml
          git commit -m "chore(ci): refresh frontend dispatch evidence"
          git push origin "HEAD:gpt/frontend-workflow-auth-parity-clean-v2-20260720"
