name: Validate GitHub Policy Controller 6429 ARM

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - ".github/workflows/validate-github-policy-controller-6429-arm.yml"

permissions:
  contents: read

concurrency:
  group: validate-github-policy-controller-6429-arm-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event.pull_request.number == 6429 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/github-main-policy-controller-20260805' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      PRODUCT_HEAD: c179da0e3c69157e70a961f544e977f8bdab51cf
      PRODUCT_BASE: d24274c667859e02f558b9161cd2318cc8961efd
    steps:
      - name: Checkout validation trigger head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify trigger changes only the ARM workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${PRODUCT_HEAD}"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --name-only HEAD^..HEAD | sort > /tmp/trigger-paths.txt
          printf '%s\n' '.github/workflows/validate-github-policy-controller-6429-arm.yml' > /tmp/expected-trigger-paths.txt
          diff -u /tmp/expected-trigger-paths.txt /tmp/trigger-paths.txt
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "${PRODUCT_BASE}"

      - name: Checkout exact product head
        uses: actions/checkout@v5
        with:
          ref: c179da0e3c69157e70a961f544e977f8bdab51cf
          fetch-depth: 0

      - name: Verify exact product scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PRODUCT_HEAD}"
          git diff --name-only "${PRODUCT_BASE}...${PRODUCT_HEAD}" | sort > /tmp/product-paths.txt
          cat > /tmp/expected-product-paths.txt <<'EOF'
          .changes/e2e/github-repository-policy-controller.json
          http-generic-api/githubRepositoryPolicyController.js
          http-generic-api/migrations/20260805_github_repository_policy_controller.sql
          http-generic-api/repositoryAutomationPolicyFacade.js
          http-generic-api/routes/repositoryAutomationRoutes.js
          http-generic-api/test-github-repository-policy-controller.mjs
          http-generic-api/test-repository-automation-policy-facade.mjs
          EOF
          diff -u /tmp/expected-product-paths.txt /tmp/product-paths.txt
          git diff --check "${PRODUCT_BASE}...${PRODUCT_HEAD}"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Verify source syntax and E2E contract
        shell: bash
        run: |
          set -euo pipefail
          node --check http-generic-api/githubRepositoryPolicyController.js
          node --check http-generic-api/repositoryAutomationPolicyFacade.js
          node --check http-generic-api/routes/repositoryAutomationRoutes.js
          node --check http-generic-api/test-github-repository-policy-controller.mjs
          node --check http-generic-api/test-repository-automation-policy-facade.mjs
          python -m json.tool .changes/e2e/github-repository-policy-controller.json >/dev/null

      - name: Install locked dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Run focused policy-controller regressions
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          node test-github-repository-policy-controller.mjs
          node test-repository-automation-policy-facade.mjs

      - name: Run complete HTTP Generic API suite
        working-directory: http-generic-api
        run: npm test

      - name: Evaluate and execute declared E2E phase
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/e2e-phase-governance.mjs check \
            --base "${PRODUCT_BASE}" \
            --head "${PRODUCT_HEAD}" \
            --report-file "${RUNNER_TEMP}/e2e-phase-evaluation.json"
          node http-generic-api/scripts/e2e-phase-governance.mjs run \
            --base "${PRODUCT_BASE}" \
            --head "${PRODUCT_HEAD}" \
            --report-file "${RUNNER_TEMP}/e2e-phase-evaluation-run.json" \
            --execution-report-file "${RUNNER_TEMP}/e2e-phase-execution.json"

      - name: Write exact-head certification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib
          report = {
              'schema_version': 'github-policy-controller-exact-head-certification-v1',
              'product_head': os.environ['PRODUCT_HEAD'],
              'product_base': os.environ['PRODUCT_BASE'],
              'focused_tests_requested': 2,
              'complete_suite_requested': True,
              'e2e_check_requested': True,
              'e2e_execution_requested': True,
              'repository_mutation': False,
              'production_mutation': False,
              'provider_calls': False,
              'database_mutation': False,
              'secrets_included': False,
          }
          pathlib.Path('/tmp/github-policy-controller-certification.json').write_text(json.dumps(report, indent=2) + '\n')
          PY

      - name: Upload exact-head certification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-policy-controller-exact-head-certification-${{ github.run_id }}
          path: |
            /tmp/github-policy-controller-certification.json
            ${{ runner.temp }}/e2e-phase-evaluation.json
            ${{ runner.temp }}/e2e-phase-evaluation-run.json
            ${{ runner.temp }}/e2e-phase-execution.json
          if-no-files-found: warn
          retention-days: 30

      - name: Verify product worktree remains read-only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PRODUCT_HEAD}"
          test -z "$(git status --porcelain)"
