name: Governed Command Registry Validation

on:
  pull_request:
    paths:
      - '.github/contracts/governed-command-registry.v1.json'
      - '.github/contracts/governed-command-parameters/**'
      - '.github/scripts/governed-command-core.mjs'
      - '.github/scripts/validate-governed-command-registry.mjs'
      - '.github/scripts/resolve-governed-command.mjs'
      - '.github/tests/governed-command-gateway.test.mjs'
      - '.github/workflows/governed-command-gateway.yml'
      - '.github/workflows/governed-command-registry-validation.yml'
      - 'docs/governed-command-gateway.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mad4b-latest-head-${{ github.workflow_ref }}-${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch' && !github.ref_protected && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/Production' && github.ref != 'refs/heads/production' && github.ref != 'refs/heads/staging' && github.ref != 'refs/heads/Staging' && !startsWith(github.ref, 'refs/heads/release/'))) && (github.event.pull_request.number || github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch' && !github.ref_protected && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/Production' && github.ref != 'refs/heads/production' && github.ref != 'refs/heads/staging' && github.ref != 'refs/heads/Staging' && !startsWith(github.ref, 'refs/heads/release/')) }}

jobs:
  contract:
    name: Validate registry, schemas, adapters, and fail-closed invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Validate registry contract
        run: node .github/scripts/validate-governed-command-registry.mjs

      - name: Run gateway contract tests
        run: node --test .github/tests/governed-command-gateway.test.mjs
