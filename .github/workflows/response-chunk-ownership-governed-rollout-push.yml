name: Governed Response Chunk Ownership Rollout Push Bridge

on:
  push:
    branches: [main]
    paths:
      - ".github/response-chunk-rollout/triggers/**"

permissions:
  contents: read
  issues: write

concurrency:
  group: response-chunk-ownership-push-bridge
  cancel-in-progress: false

jobs:
  rollout:
    name: Execute exact response chunk rollout phase
    if: >-
      startsWith(github.event.head_commit.message, 'RUN_GOVERNED_RESPONSE_CHUNK_OWNERSHIP_READINESS_PUSH_V1') ||
      startsWith(github.event.head_commit.message, 'RUN_GOVERNED_RESPONSE_CHUNK_OWNERSHIP_APPLY_PUSH_V1') ||
      startsWith(github.event.head_commit.message, 'RUN_GOVERNED_RESPONSE_CHUNK_OWNERSHIP_RUNTIME_PUSH_V1')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
      GH_READ_TOKEN: ${{ github.token }}
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      CONTROL_ISSUE: '4191'
      EVIDENCE_DIR: ${{ runner.temp }}/response-chunk-ownership-push
    steps:
      - name: Checkout exact trusted main push
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve phase and enforce one-marker write set
        id: phase
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -Eeuo pipefail
          TITLE="${COMMIT_MESSAGE%%$'\n'*}"
          case "$TITLE" in
            RUN_GOVERNED_RESPONSE_CHUNK_OWNERSHIP_READINESS_PUSH_V1)
              PHASE=readiness
              MARKER=.github/response-chunk-rollout/triggers/readiness-v1.txt
              ;;
            RUN_GOVERNED_RESPONSE_CHUNK_OWNERSHIP_APPLY_PUSH_V1)
              PHASE=apply
              MARKER=.github/response-chunk-rollout/triggers/apply-v1.txt
              ;;
            RUN_GOVERNED_RESPONSE_CHUNK_OWNERSHIP_RUNTIME_PUSH_V1)
              PHASE=runtime
              MARKER=.github/response-chunk-rollout/triggers/runtime-v1.txt
              ;;
            *)
              echo "::error::unsupported rollout push title"
              exit 1
              ;;
          esac

          mapfile -t FILES < <(git diff --name-only "${GITHUB_SHA}^" "$GITHUB_SHA")
          (( ${#FILES[@]} == 1 )) || {
            echo "::error::rollout push must change exactly one marker file"
            printf '%s\n' "${FILES[@]}"
            exit 1
          }
          [[ "${FILES[0]}" == "$MARKER" ]] || {
            echo "::error::unexpected marker path: ${FILES[0]}"
            exit 1
          }
          grep -Fxq "phase=$PHASE" "$MARKER"
          grep -Fxq "control_issue=4191" "$MARKER"
          grep -Fxq "trusted_ref=main" "$MARKER"
          grep -Fxq "secrets_included=false" "$MARKER"

          echo "phase=$PHASE" >> "$GITHUB_OUTPUT"
          echo "marker=$MARKER" >> "$GITHUB_OUTPUT"
          echo "phase=$PHASE" >> "$GITHUB_ENV"
          echo "ROLLOUT_PHASE=$PHASE" >> "$GITHUB_ENV"
          echo "EVIDENCE_DIR=${RUNNER_TEMP}/response-chunk-ownership-${PHASE}" >> "$GITHUB_ENV"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Record phase start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            '/repos/${{ github.repository }}/issues/4191/comments' \
            -f body="GOVERNED_RESPONSE_CHUNK_OWNERSHIP_${phase^^} status=started run_id=${GITHUB_RUN_ID} trigger=trusted-main-push marker=${{ steps.phase.outputs.marker }}"

      - name: Execute readiness or apply phase
        if: steps.phase.outputs.phase != 'runtime'
        run: node .github/ops/response-chunk-ownership-governed-rollout.mjs

      - name: Execute Production runtime closure
        if: steps.phase.outputs.phase == 'runtime'
        run: node .github/ops/response-chunk-ownership-runtime-closure.mjs

      - name: Upload bounded no-secret evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: response-chunk-ownership-${{ steps.phase.outputs.phase }}-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Record phase outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESOLVED_PHASE: ${{ steps.phase.outputs.phase }}
        run: |
          node <<'NODE' >"${RUNNER_TEMP}/rollout-comment.txt"
          const fs = require('node:fs');
          const phase = process.env.RESOLVED_PHASE || process.env.phase || 'unknown';
          const dir = process.env.EVIDENCE_DIR;
          const summaryPath = `${dir}/summary.json`;
          const failurePath = `${dir}/failure.json`;
          let body;
          if (fs.existsSync(summaryPath)) {
            const s = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
            if (phase === 'readiness') {
              body = `GOVERNED_RESPONSE_CHUNK_OWNERSHIP_READINESS result=pass run_id=${process.env.GITHUB_RUN_ID} production_sha=${s.production_sha} migration_blob=${s.migration_blob_sha} checksum=${s.checksum} statement_count=${s.statement_count} authorization=${s.authorization || 'already_applied'} dry_run=${s.dry_run || 'already_applied'} trigger=trusted-main-push artifact=response-chunk-ownership-readiness-${process.env.GITHUB_RUN_ID}`;
            } else if (phase === 'apply') {
              body = `GOVERNED_RESPONSE_CHUNK_OWNERSHIP_APPLY result=pass run_id=${process.env.GITHUB_RUN_ID} production_sha=${s.production_sha} migration_blob=${s.migration_blob_sha} checksum=${s.checksum} statement_count=${s.statement_count} apply_sent=${s.apply_sent_by_this_run} apply_retried=false ledger=pass readiness=pass trigger=trusted-main-push artifact=response-chunk-ownership-apply-${process.env.GITHUB_RUN_ID}`;
            } else {
              body = `GOVERNED_RESPONSE_CHUNK_OWNERSHIP_RUNTIME result=pass run_id=${process.env.GITHUB_RUN_ID} production_sha=${s.production_sha} source_merge=${s.source_merge_sha} migration_blob=${s.migration_blob_sha} checksum=${s.checksum} statement_count=${s.statement_count} ledger=pass readiness=pass durable_recovery_smoke=pass trigger=trusted-main-push artifact=response-chunk-ownership-runtime-${process.env.GITHUB_RUN_ID}`;
            }
          } else {
            const f = fs.existsSync(failurePath) ? JSON.parse(fs.readFileSync(failurePath, 'utf8')) : {};
            body = `GOVERNED_RESPONSE_CHUNK_OWNERSHIP_${phase.toUpperCase()} result=fail run_id=${process.env.GITHUB_RUN_ID} stage=${f.stage || 'unknown'} apply_sent=${f.apply_sent || false} error_code=${f.error?.code || 'workflow_failed'} trigger=trusted-main-push artifact=response-chunk-ownership-${phase}-${process.env.GITHUB_RUN_ID}`;
          }
          process.stdout.write(body);
          NODE
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            '/repos/${{ github.repository }}/issues/4191/comments' \
            -f body="$(cat "${RUNNER_TEMP}/rollout-comment.txt")"
