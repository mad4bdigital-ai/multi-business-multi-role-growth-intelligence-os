name: Repair PR 3298 Parser Reconciliation

on:
  push:
    branches:
      - gpt/reconcile-pr-3182-20260730-v2
    paths:
      - .github/workflows/fix-pr-3298-parser-regression.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-pr-3298-parser
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_MAIN_SHA: 06fc67be48816d5c1725427ea79625edeab38a27
      EXPECTED_PARENT_SHA: da194b4c699d80ab053e2767b97d80aaf9924c55
      TARGET_REF: gpt/reconcile-pr-3182-20260730-v2
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: gpt/reconcile-pr-3182-20260730-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Guard branch and main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA" || {
            echo "::error::Unexpected branch parent"
            exit 1
          }
          git fetch origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA" || {
            echo "::error::main moved before parser repair"
            exit 1
          }

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Restore declaration guard extraction
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("http-generic-api/scripts/frontend-surface-dispatch.mjs")
          source = path.read_text(encoding="utf-8")
          old = '    const routeGuards = unique(args.slice(1).flatMap((argument) => middlewareGuards(argument, aliases)));'
          new = '''    const routeGuards = unique([
              ...args.slice(1).flatMap((argument) => middlewareGuards(argument, aliases)),
              ...middlewareGuards(declaration, aliases),
            ]);'''
          if source.count(old) != 1:
              raise SystemExit(f"Expected one route guard expression, found {source.count(old)}")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY
          git diff --check

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Regenerate bounded artifacts
        working-directory: http-generic-api
        run: |
          npm run frontend:dispatch:generate -- --baseline-ref=main
          node scripts/generate-custom-gpt-schemas.mjs --write

      - name: Verify repaired contracts
        working-directory: http-generic-api
        run: |
          node test-deployment-manifest-generator.mjs
          node test-deployment-manifest.mjs
          node test-frontend-operation-governance-generator.mjs
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-openapi-route-coverage.mjs
          npm run openapi:auth:check
          npm run schemas:guard

      - name: Recheck main and commit repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA" || {
            echo "::error::main moved during parser repair"
            exit 1
          }
          rm -f .github/workflows/fix-pr-3298-parser-regression.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(frontend): preserve declaration guard discovery"
          git push origin "HEAD:${TARGET_REF}"
