name: Spec014 Latest Main Reconciliation v3

on:
  pull_request:
    branches:
      - gpt/hostinger-safe-storage-cleanup-ssh-20260801
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - '.github/workflows/spec014-latest-main-reconciliation-v3.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: spec014-latest-main-reconciliation-v3
  cancel-in-progress: true

jobs:
  reconcile:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'gpt/reconcile-spec014-latest-main-20260802-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ORIGINAL_INTEGRATION_SHA: 1c036a183e5464166c401fb9726992b4d4c591f6
      INTEGRATION_BRANCH: gpt/hostinger-safe-storage-cleanup-ssh-20260801
      RECONCILIATION_BRANCH: gpt/reconcile-spec014-latest-main-20260802-v3
      LAUNCHER_PATH: .github/workflows/spec014-latest-main-reconciliation-v3.yml
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RECONCILIATION_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Build, validate, and push artifact-first reconciliation
        shell: bash
        run: |
          set -Eeuo pipefail
          evidence_dir="${RUNNER_TEMP}/spec014-latest-main-reconciliation"
          mkdir -p "${evidence_dir}"
          current_stage='bootstrap'
          latest_main_sha=''
          latest_integration_sha=''
          reconciliation_first_parent=''
          reconciliation_commit=''
          merge_status=''
          conflict_count=''

          write_summary() {
            local outcome="$1"
            local exit_status="${2:-0}"
            local failed_command="${3:-}"
            local failed_line="${4:-}"
            set +e
            git diff --name-only --diff-filter=U | sort -u > "${evidence_dir}/unresolved.txt" 2>/dev/null || true
            git diff --cached --name-only | sort -u > "${evidence_dir}/staged.txt" 2>/dev/null || true
            git diff --name-only | sort -u > "${evidence_dir}/unstaged.txt" 2>/dev/null || true
            OUTCOME="${outcome}" \
            EXIT_STATUS="${exit_status}" \
            FAILED_COMMAND="${failed_command}" \
            FAILED_LINE="${failed_line}" \
            CURRENT_STAGE="${current_stage}" \
            LATEST_MAIN_SHA="${latest_main_sha}" \
            LATEST_INTEGRATION_SHA="${latest_integration_sha}" \
            RECONCILIATION_FIRST_PARENT="${reconciliation_first_parent}" \
            RECONCILIATION_COMMIT="${reconciliation_commit}" \
            MERGE_STATUS="${merge_status}" \
            CONFLICT_COUNT="${conflict_count}" \
            EVIDENCE_DIR="${evidence_dir}" \
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['EVIDENCE_DIR'])

          def lines(name):
              path = root / name
              if not path.exists():
                  return []
              return [line.strip() for line in path.read_text().splitlines() if line.strip()]

          outcome = os.environ['OUTCOME']
          report = {
              'contract': 'mad4b.spec014-latest-main-reconciliation-summary.v3',
              'outcome': outcome,
              'original_integration_sha': os.environ['ORIGINAL_INTEGRATION_SHA'],
              'latest_integration_sha': os.environ['LATEST_INTEGRATION_SHA'] or None,
              'latest_main_sha': os.environ['LATEST_MAIN_SHA'] or None,
              'reconciliation_first_parent_sha': os.environ['RECONCILIATION_FIRST_PARENT'] or None,
              'reconciliation_commit_sha': os.environ['RECONCILIATION_COMMIT'] or None,
              'merge_status': int(os.environ['MERGE_STATUS']) if os.environ['MERGE_STATUS'] else None,
              'conflict_count': int(os.environ['CONFLICT_COUNT']) if os.environ['CONFLICT_COUNT'] else None,
              'conflict_paths': lines('unresolved.txt') if outcome == 'blocked' else (
                  [] if os.environ['CONFLICT_COUNT'] in ('', '0') else ['http-generic-api/frontend-surface-dispatch.generated.json']
              ),
              'staged_paths': lines('staged.txt') if outcome == 'blocked' else [],
              'unstaged_paths': lines('unstaged.txt') if outcome == 'blocked' else [],
              'launcher_removed': outcome == 'passed',
              'frontend_contracts_passed': outcome == 'passed',
              'openapi_contracts_passed': outcome == 'passed',
              'crash_safe_contracts_passed': outcome == 'passed',
              'dedicated_worker_contracts_passed': outcome == 'passed',
              'verified_sql_contracts_passed': outcome == 'passed',
              'tenant_projection_contracts_passed': outcome == 'passed',
              'tenant_canary_bootstrap_passed': outcome == 'passed',
              'repository_push_target': os.environ['RECONCILIATION_BRANCH'],
              'repository_push_performed': outcome == 'passed',
              'force_push': False,
              'provider_dispatch': False,
              'credential_access': False,
              'migration_apply': False,
              'deployment': False,
              'job_logs_consulted': False,
              'secrets_included': False,
          }
          if outcome == 'blocked':
              report['failure'] = {
                  'stage': os.environ['CURRENT_STAGE'],
                  'exit_status': int(os.environ['EXIT_STATUS']),
                  'line': os.environ['FAILED_LINE'],
                  'command': os.environ['FAILED_COMMAND'],
              }
          Path(root, 'summary.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
          }

          on_error() {
            local status=$?
            local failed_command="${BASH_COMMAND:-unknown}"
            local failed_line="${BASH_LINENO[0]:-${LINENO}}"
            trap - ERR
            write_summary blocked "${status}" "${failed_command}" "${failed_line}"
            exit "${status}"
          }
          trap on_error ERR

          current_stage='verify_launcher_identity'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          launcher_head="$(git rev-parse HEAD)"
          launcher_parent="$(git rev-parse HEAD^)"
          [[ "${launcher_parent}" == "${ORIGINAL_INTEGRATION_SHA}" ]]
          unexpected_launcher_paths="$(git diff --name-only "${ORIGINAL_INTEGRATION_SHA}" "${launcher_head}" | grep -vxF "${LAUNCHER_PATH}" || true)"
          [[ -z "${unexpected_launcher_paths}" ]]

          current_stage='capture_latest_parents'
          git fetch --no-tags origin main "${INTEGRATION_BRANCH}"
          latest_main_sha="$(git rev-parse origin/main)"
          latest_integration_sha="$(git rev-parse "origin/${INTEGRATION_BRANCH}")"
          git merge-base --is-ancestor "${ORIGINAL_INTEGRATION_SHA}" "${latest_integration_sha}"

          current_stage='merge_latest_integration'
          if [[ "${latest_integration_sha}" != "${launcher_parent}" ]]; then
            git merge --no-ff --no-edit "${latest_integration_sha}"
          fi
          reconciliation_first_parent="$(git rev-parse HEAD)"

          current_stage='merge_latest_main'
          git update-ref refs/heads/main "${latest_main_sha}"
          trap - ERR
          set +e
          git merge --no-commit --no-ff "${latest_main_sha}"
          merge_status=$?
          set -e
          trap on_error ERR

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort -u)
          conflict_count="${#conflicts[@]}"
          if [[ ${merge_status} -ne 0 ]]; then
            [[ ${#conflicts[@]} -eq 1 ]]
            [[ "${conflicts[0]}" == 'http-generic-api/frontend-surface-dispatch.generated.json' ]]
            git show "${latest_integration_sha}:http-generic-api/frontend-surface-dispatch.generated.json" \
              > http-generic-api/frontend-surface-dispatch.generated.json
            git add -- http-generic-api/frontend-surface-dispatch.generated.json
          else
            [[ ${#conflicts[@]} -eq 0 ]]
          fi
          [[ -z "$(git diff --name-only --diff-filter=U)" ]]

          current_stage='install_dependencies'
          npm ci --prefix http-generic-api

          current_stage='regenerate_combined_evidence'
          (
            cd http-generic-api
            npm run frontend:dispatch:generate -- --baseline-ref=main
          )
          mapfile -t unstaged < <(git diff --name-only)
          for path in "${unstaged[@]}"; do
            case "${path}" in
              http-generic-api/frontend-operation-governance.generated.json|\
              http-generic-api/frontend-surface-dispatch.generated.json|\
              http-generic-api/openapi/frontend-runtime-routes.generated.yaml)
                ;;
              *)
                echo "Unexpected generator mutation: ${path}" >&2
                false
                ;;
            esac
          done

          current_stage='validate_combined_contracts'
          (
            cd http-generic-api
            node test-frontend-dispatch-workflow-baseline.mjs
            node test-frontend-operation-governance-generator.mjs
            node test-frontend-surface-dispatch.mjs
            node test-frontend-auth-openapi-parity.mjs
            node test-openapi-route-coverage.mjs
            npm run openapi:auth:check
            node test-hostinger-storage-crash-safe-restart-reconciler.mjs
            node test-hostinger-storage-dedicated-worker-certification.mjs
            node test-hostinger-storage-verified-sql-runtime-composition.mjs
            node test-hostinger-storage-tenant-safe-durable-projection.mjs
          )
          node .github/tests/spec014/hostinger-tenant-canary-main-bootstrap.mjs
          grep -Fq 'userJwtAuth' http-generic-api/openapi/support-tickets.yaml

          current_stage='create_reconciliation_commit'
          git rm "${LAUNCHER_PATH}"
          git add -A
          git diff --cached --check
          git commit -m 'chore: reconcile latest main into Spec 014 Integration'
          reconciliation_commit="$(git rev-parse HEAD)"
          second_parent="$(git rev-parse HEAD^2)"
          [[ "${second_parent}" == "${latest_main_sha}" ]]

          current_stage='push_reconciliation_commit'
          write_summary passed
          git push origin "HEAD:${RECONCILIATION_BRANCH}"
          trap - ERR

      - name: Upload structured reconciliation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec014-latest-main-reconciliation-${{ github.run_id }}
          path: ${{ runner.temp }}/spec014-latest-main-reconciliation/summary.json
          if-no-files-found: error
          retention-days: 14
