name: Transport branch main reconciliation once

on:
  workflow_dispatch:
  push:
    branches:
      - "fix/transport-response-delivery-20260806"

permissions:
  contents: write

concurrency:
  group: transport-main-reconcile-once
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Pin branch and main identities
        shell: bash
        env:
          TARGET_BRANCH: fix/transport-response-delivery-20260806
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          branch_sha="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${branch_sha}" = "${EXPECTED_HEAD_SHA}"
          git fetch --no-tags origin main
          git rev-parse --verify origin/main
          test "${TARGET_BRANCH}" != "main"
          test "${TARGET_BRANCH}" != "Production"

      - name: Merge main and resolve bounded generated conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U || true)"
          unexpected="$(printf '%s\n' "${conflicts}" | grep -Ev '^(docs/work-maps/README\.md|http-generic-api/frontend-operation-governance\.generated\.json|http-generic-api/frontend-surface-dispatch\.generated\.json|http-generic-api/scripts/test-manifest\.mjs)$' || true)"
          if [[ -n "${unexpected}" ]]; then
            echo "Unexpected merge conflicts:" >&2
            printf '%s\n' "${unexpected}" >&2
            exit 1
          fi

          for generated in \
            docs/work-maps/README.md \
            http-generic-api/frontend-operation-governance.generated.json \
            http-generic-api/frontend-surface-dispatch.generated.json; do
            if git diff --name-only --diff-filter=U -- "${generated}" | grep -q .; then
              git checkout --ours -- "${generated}"
              git add -- "${generated}"
            fi
          done

          if git diff --name-only --diff-filter=U -- http-generic-api/scripts/test-manifest.mjs | grep -q .; then
            git checkout --ours -- http-generic-api/scripts/test-manifest.mjs
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path("http-generic-api/scripts/test-manifest.mjs")
          text = path.read_text(encoding="utf-8")
          entries = [
              '  "node test-sink-orchestration-json-asset-lookup-failure.mjs",\n',
              '  "node test-local-connector-transport-errors.mjs",\n',
              '  "node test-transport-response-chunk-schema-recovery.mjs",\n',
          ]
          anchor = '  "node test-smoke-branch-cleanup-gate.mjs",\n'
          if text.count(anchor) != 1:
              raise SystemExit("test manifest insertion anchor mismatch")
          for entry in entries:
              if entry not in text:
                  text = text.replace(anchor, entry + anchor, 1)
          path.write_text(text, encoding="utf-8")
          PY
          git add -- http-generic-api/scripts/test-manifest.mjs

          remaining="$(git diff --name-only --diff-filter=U || true)"
          test -z "${remaining}"
          test "${merge_status}" -eq 0 || git rev-parse --verify MERGE_HEAD

          git rm .github/workflows/transport-main-reconcile-once.yml

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Regenerate merged governed evidence
        working-directory: http-generic-api
        env:
          CANONICAL_BASELINE_REF: main
        run: npm run frontend:dispatch:generate -- --baseline-ref="${CANONICAL_BASELINE_REF}"

      - name: Regenerate and verify Work Maps
        run: |
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          node http-generic-api/scripts/platform-work-map-generator.mjs --check

      - name: Verify merged transport scope
        working-directory: http-generic-api
        run: |
          node test-local-connector-transport-errors.mjs
          node test-transport-response-chunk-schema-recovery.mjs
          node test-sink-orchestration-json-asset-lookup-failure.mjs
          node test-frontend-operation-governance-generator.mjs
          node test-frontend-surface-dispatch.mjs
          node test-openapi-route-coverage.mjs

      - name: Commit merge and push without force
        shell: bash
        env:
          TARGET_BRANCH: fix/transport-response-delivery-20260806
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -m "merge(main): reconcile transport recovery branch"
          remote_sha="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_sha}" = "${EXPECTED_HEAD_SHA}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
