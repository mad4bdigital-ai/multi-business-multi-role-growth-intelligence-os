name: Surface Live Main Sync

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/surface-live-main-sync.yml

permissions:
  contents: write

concurrency:
  group: surface-live-main-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    if: >-
      github.repository == 'mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os' &&
      github.event.pull_request.number == 5685 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/surface-current-main-clean-v2-20260803' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: macos-14
    timeout-minutes: 35
    env:
      TARGET_BRANCH: gpt/surface-current-main-clean-v2-20260803
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      WORKFLOW_PATH: .github/workflows/surface-live-main-sync.yml
      TARGET_FILE: http-generic-api/frontend-surface-dispatch.generated.json
      GOVERNANCE_FILE: http-generic-api/frontend-operation-governance.generated.json
      OPENAPI_INDEX: http-generic-api/openapi/frontend-runtime-routes.generated.yaml

    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify trigger and branch lease
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          test "$(git diff --name-only HEAD^ HEAD)" = "${WORKFLOW_PATH}"
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${EXPECTED_HEAD}"

      - name: Fetch and merge live main
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'mad4bdigital-ai'
          git config user.email 'mad4bdigital-ai@users.noreply.github.com'
          git fetch origin main
          live_main="$(git rev-parse origin/main)"
          printf 'LIVE_MAIN=%s\n' "$live_main" >> "$GITHUB_ENV"
          git merge --no-ff --no-edit "$live_main" -m "Merge live main into Surface callability branch"
          source_head="$(git rev-parse HEAD)"
          printf 'SOURCE_HEAD=%s\n' "$source_head" >> "$GITHUB_ENV"
          git merge-base --is-ancestor "$live_main" "$source_head"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Regenerate synchronized artifact
        run: npm --prefix http-generic-api run frontend:dispatch:generate -- --baseline-ref="${SOURCE_HEAD}"

      - name: Verify synchronized Surface product
        shell: bash
        run: |
          set -Eeuo pipefail
          npm --prefix http-generic-api run frontend:dispatch:check
          (cd http-generic-api && node test-surface-callability-full-closure.mjs)
          node http-generic-api/scripts/maintenance-tools/verify-hostinger-full-closure-safety.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const artifact = JSON.parse(fs.readFileSync('http-generic-api/frontend-surface-dispatch.generated.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('http-generic-api/resource-api-surface-callability.manifest.json', 'utf8'));
          const keys = new Set(manifest.source_queue_tool_keys || []);
          if (artifact.schema_version !== 'frontend-surface-dispatch-v1') throw new Error('artifact_schema_mismatch');
          if (artifact?.baseline?.ref !== process.env.SOURCE_HEAD) throw new Error('artifact_baseline_ref_mismatch');
          if (manifest.source_queue_item_count !== 20) throw new Error(`surface_item_count_mismatch:${manifest.source_queue_item_count}`);
          if (keys.size !== 41) throw new Error(`surface_tool_key_count_mismatch:${keys.size}`);
          console.log(JSON.stringify({ok:true, live_main:process.env.LIVE_MAIN, source_head:process.env.SOURCE_HEAD, items:20, tool_keys:41}));
          NODE

      - name: Remove workflow and enforce bounded writes
        shell: bash
        run: |
          set -Eeuo pipefail
          rm "${WORKFLOW_PATH}"
          changed="$(git status --porcelain=v1 --untracked-files=all | cut -c4- | sort -u)"
          count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "$count" -ge 2
          test "$count" -le 4
          printf '%s\n' "$changed" | grep -Fxq "${WORKFLOW_PATH}"
          printf '%s\n' "$changed" | grep -Fxq "${TARGET_FILE}"
          while IFS= read -r path; do
            test -n "$path" || continue
            case "$path" in
              "$WORKFLOW_PATH"|"$TARGET_FILE"|"$GOVERNANCE_FILE"|"$OPENAPI_INDEX") ;;
              *) echo "Unexpected generated write: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Verify main stability and push
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${LIVE_MAIN}"
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${EXPECTED_HEAD}"
          git add -A
          git commit -m 'chore(frontend): regenerate Surface dispatch on live main'
          final_head="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "${LIVE_MAIN}" "$final_head"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "$final_head"
          test ! -e "${WORKFLOW_PATH}"
          npm --prefix http-generic-api run frontend:dispatch:check
