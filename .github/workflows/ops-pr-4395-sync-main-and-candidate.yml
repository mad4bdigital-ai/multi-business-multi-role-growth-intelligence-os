name: Ops PR 4395 Sync Main And Candidate

on:
  push:
    branches:
      - gpt/tenant-request-inbox-chunk-store-hardening-20260801

permissions:
  contents: write

jobs:
  sync-fix-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: gpt/tenant-request-inbox-chunk-store-hardening-20260801
      WORKFLOW_PATH: .github/workflows/ops-pr-4395-sync-main-and-candidate.yml
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json
      - name: Merge latest main and execute bounded candidate fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            unexpected="$(printf '%s\n' "$conflicts" | grep -v '^http-generic-api/frontend-surface-dispatch.generated.json$' || true)"
            if [ -n "$unexpected" ]; then
              printf 'Unexpected merge conflicts:\n%s\n' "$unexpected" >&2
              exit 1
            fi
            git checkout --ours -- http-generic-api/frontend-surface-dispatch.generated.json
            git add http-generic-api/frontend-surface-dispatch.generated.json
          fi
          cd http-generic-api
          npm ci
          npm run frontend:dispatch:generate
          cd ..
          rm -f "$WORKFLOW_PATH"
          git add -A
          if git diff --cached --quiet; then
            echo "No final generated cleanup commit required."
          else
            git commit -m "chore(ci): finalize main sync and generated evidence"
          fi
          git push origin "HEAD:$TARGET_BRANCH"
