name: PR 3247 trusted chunk principal propagation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - gpt/response-chunk-ownership-a23e0076

permissions:
  contents: write
  pull-requests: read

jobs:
  execute:
    if: startsWith(github.event.pull_request.head.ref, 'gpt/pr3247-principal-propagation-trigger-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gpt/response-chunk-ownership-a23e0076
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json
      - name: Apply principal propagation and run focused regressions
        id: patch
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            python .github/scripts/pr3247_prepare_principal_patcher.py
            python .github/scripts/pr3247_propagate_chunk_principals.py
            node --check http-generic-api/routes/systemLayerRoutes.js
            node --check http-generic-api/routes/activationAwarenessRoutes.js
            node --check http-generic-api/routes/activationHardRunRoutes.js
            node --check http-generic-api/routes/activationRoutes.js
            node --check http-generic-api/routes/tenantActivationOverlayRoutes.js
            node --check http-generic-api/test-gpt-tools-response-chunking.mjs
            node --check http-generic-api/test-system-layer-response-chunk-passthrough.mjs
            node --check http-generic-api/test-activation-awareness-completeness.mjs
            node --check http-generic-api/test-hard-activation-transport-semantics.mjs
            node --check http-generic-api/test-tenant-activation-session-alias.mjs
            git diff --check
            cd http-generic-api
            npm ci --ignore-scripts
            node test-gpt-tools-response-chunking.mjs
            node test-system-layer-response-chunk-passthrough.mjs
            node test-activation-awareness-completeness.mjs
            node test-hard-activation-transport-semantics.mjs
            node test-tenant-activation-session-alias.mjs
          ) > /tmp/pr3247-principal-run.log 2>&1
          status=$?
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          tail -n 240 /tmp/pr3247-principal-run.log > /tmp/pr3247-principal-run-tail.log
          cat /tmp/pr3247-principal-run-tail.log
          exit 0
      - name: Record fail-closed principal propagation diagnostic
        if: steps.patch.outputs.status != '0'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          mkdir -p .tmp
          {
            echo "status=failed"
            echo "executor_pr=${{ github.event.pull_request.number }}"
            echo "base_head_before=${{ github.event.pull_request.base.sha }}"
            echo "secrets_included=false"
            echo "--- log tail ---"
            cat /tmp/pr3247-principal-run-tail.log
          } > .tmp/pr3247-principal-propagation-failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp/pr3247-principal-propagation-failure.txt
          git commit -m "chore: record PR 3247 principal propagation failure"
          git push origin HEAD:gpt/response-chunk-ownership-a23e0076
          exit 1
      - name: Commit clean principal propagation patch
        if: steps.patch.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr3247-principal-propagation-executor.yml
          rm -f .github/scripts/pr3247_prepare_principal_patcher.py
          rm -f .github/scripts/pr3247_propagate_chunk_principals.py
          rm -f .tmp/pr3247-principal-propagation-failure.txt
          rmdir .tmp 2>/dev/null || true
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security: propagate response chunk ownership principals"
          git push origin HEAD:gpt/response-chunk-ownership-a23e0076
