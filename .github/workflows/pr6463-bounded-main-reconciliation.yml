name: PR 6463 Bounded Main Reconciliation

on:
  push:
    branches:
      - fix/retire-production-runtime-parity-bridge-6441-20260806
    paths:
      - .github/workflows/pr6463-bounded-main-reconciliation.yml

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: pr6463-bounded-main-reconciliation
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose pinned-main bounded reconciliation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_BRANCH: fix/retire-production-runtime-parity-bridge-6441-20260806
      PINNED_MAIN_SHA: faa7cd34117c7e0e18d1b55dad7968afb944378f
      PR_NUMBER: "6463"
      TEMP_WORKFLOW: .github/workflows/pr6463-bounded-main-reconciliation.yml
      RETIRED_BRIDGE_TEST: http-generic-api/scripts/test-production-runtime-parity-comment-bridge.mjs
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          token: ${{ github.token }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate exact branch and pinned main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          pr_file="${RUNNER_TEMP}/pr6463.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "${pr_file}"
          pr_state="$(jq -r '.state' "${pr_file}")"
          pr_draft="$(jq -r '.draft' "${pr_file}")"
          pr_base="$(jq -r '.base.ref' "${pr_file}")"
          pr_head_ref="$(jq -r '.head.ref' "${pr_file}")"
          pr_head_sha="$(jq -r '.head.sha' "${pr_file}")"
          git fetch --no-tags origin main
          actual_main="$(git rev-parse origin/main)"

          printf 'triggering_head=%s\nactual_head=%s\nremote_head=%s\npr_head=%s\npr_state=%s\npr_draft=%s\npr_base=%s\npr_head_ref=%s\npinned_main=%s\nactual_main=%s\n' \
            "${GITHUB_SHA}" "${actual_head}" "${remote_head}" "${pr_head_sha}" "${pr_state}" "${pr_draft}" "${pr_base}" "${pr_head_ref}" "${PINNED_MAIN_SHA}" "${actual_main}"

          test "${actual_head}" = "${GITHUB_SHA}"
          test "${remote_head}" = "${GITHUB_SHA}"
          test "${pr_state}" = "open"
          test "${pr_draft}" = "true"
          test "${pr_base}" = "main"
          test "${pr_head_ref}" = "${TARGET_BRANCH}"
          test "${pr_head_sha}" = "${GITHUB_SHA}"
          test "${actual_main}" = "${PINNED_MAIN_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Start pinned main merge
        id: merge
        shell: bash
        run: |
          set -uo pipefail
          set +e
          git merge --no-commit --no-ff "${PINNED_MAIN_SHA}"
          merge_exit=$?
          set -e
          echo "merge_exit=${merge_exit}" >> "$GITHUB_OUTPUT"
          git status --short
          if [[ "${merge_exit}" -gt 1 ]]; then
            echo "::error::git merge failed with exit ${merge_exit}"
            exit "${merge_exit}"
          fi

      - name: Inspect bounded conflict set
        env:
          MERGE_EXIT: ${{ steps.merge.outputs.merge_exit }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
          printf 'merge_exit=%s\n' "${MERGE_EXIT}"
          printf 'unmerged_count=%s\n' "${#conflicts[@]}"
          if ((${#conflicts[@]})); then
            printf 'unmerged=%s\n' "${conflicts[@]}"
          fi

          allowed=(
            ".github/workflows/pr6463-bounded-main-reconciliation.yml"
            "docs/work-maps/README.md"
            "docs/work-maps/repository-automation-map.md"
            "http-generic-api/scripts/test-production-runtime-parity-comment-bridge.mjs"
          )
          for conflict in "${conflicts[@]}"; do
            approved=false
            for expected in "${allowed[@]}"; do
              if [[ "${conflict}" = "${expected}" ]]; then
                approved=true
                break
              fi
            done
            if [[ "${approved}" != true ]]; then
              echo "::error file=${conflict}::Unexpected merge conflict"
              exit 1
            fi
          done
          if [[ "${MERGE_EXIT}" -ne 0 && ${#conflicts[@]} -eq 0 ]]; then
            echo "::error::Merge failed without an approved conflict set"
            exit 1
          fi

      - name: Preserve reconciliation workflow version
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files -u -- "${TEMP_WORKFLOW}" | grep -q .; then
            git checkout --ours -- "${TEMP_WORKFLOW}"
            git add -- "${TEMP_WORKFLOW}"
          fi

      - name: Preserve intentional bridge-test deletion
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files -u -- "${RETIRED_BRIDGE_TEST}" | grep -q .; then
            git rm --force -- "${RETIRED_BRIDGE_TEST}"
          fi

      - name: Regenerate and stage Work Maps
        shell: bash
        run: |
          set -euo pipefail
          rm -f docs/work-maps/README.md docs/work-maps/repository-automation-map.md
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          git add -- docs/work-maps/README.md docs/work-maps/repository-automation-map.md

      - name: Assert resolved index
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git ls-files -u
          test -z "$(git ls-files -u)"
          test -z "$(git diff --name-only --diff-filter=U)"
          test "$(git rev-parse -q --verify MERGE_HEAD)" = "${PINNED_MAIN_SHA}"

      - name: Check regenerated Work Maps
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/platform-work-map-generator.mjs --check

      - name: Publish diagnostic evidence
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_EXIT: ${{ steps.merge.outputs.merge_exit }}
        shell: bash
        run: |
          set -euo pipefail
          body="PR6463_BOUNDED_DIAGNOSTIC outcome=${{ job.status }} pinned_main_sha=${PINNED_MAIN_SHA} triggering_head_sha=${GITHUB_SHA} merge_exit=${MERGE_EXIT:-unresolved} protected_branch_mutation=false force_push=false deployment=false provider_call=false sql=false migration_apply=false secrets_included=false"
          if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="${body}" >/dev/null; then
            echo "::warning::Unable to publish diagnostic comment"
          fi
