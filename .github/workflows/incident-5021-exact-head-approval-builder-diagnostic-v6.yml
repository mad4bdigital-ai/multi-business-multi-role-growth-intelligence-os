name: Incident 5021 approval builder diagnostic v6

on:
  pull_request:
    branches:
      - gpt/incident-5021/draft-merge-guard-v2-20260803
    paths:
      - .github/workflows/incident-5021-exact-head-approval-builder-diagnostic-v6.yml

permissions:
  contents: read

concurrency:
  group: incident-5021-approval-builder-diagnostic-v6
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose complete exact-head approval candidate without publishing
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: gpt/incident-5021/exact-head-approval-guard-20260803
      BUILDER_BRANCH: gpt/incident-5021/exact-head-approval-guard-builder-20260803
      EXPECTED_TARGET_SHA: 2c89cc14d8a38a09034f0306eccff273234046e2
      SOURCE_WORKFLOW: .github/workflows/incident-5021-exact-head-approval-builder.yml
      REPORT_PATH: incident-5021-builder-diagnostic-v6.json
    steps:
      - name: Checkout immutable target branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install connector dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Verify target and fetch builder source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"
          test "$(git status --porcelain)" = ""
          git fetch --no-tags origin "$BUILDER_BRANCH"

      - name: Generate comprehensive structured diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYDIAG'
          from pathlib import Path
          import ast
          import json
          import subprocess
          import sys
          import textwrap
          import traceback

          builder_branch = "gpt/incident-5021/exact-head-approval-guard-builder-20260803"
          workflow_path = ".github/workflows/incident-5021-exact-head-approval-builder.yml"
          report_path = Path("incident-5021-builder-diagnostic-v6.json")
          expected_files = sorted([
              ".changes/e2e/repository-lifecycle-draft-merge-guard.json",
              "http-generic-api/githubRepositoryLifecycle.js",
              "http-generic-api/openapi/operation-capability-lifecycle.yaml",
              "http-generic-api/operationCapabilityLifecycleService.js",
              "http-generic-api/test-github-repository-lifecycle.mjs",
              "http-generic-api/test-gpt-tools-route-syntax-regression.mjs",
          ])
          report = {
              "schema_version": 1,
              "diagnostic": "incident_5021_exact_head_approval_builder_v6",
              "expected_target_sha": "2c89cc14d8a38a09034f0306eccff273234046e2",
              "actual_target_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "source_workflow": workflow_path,
              "source_branch": builder_branch,
              "expected_files": expected_files,
              "secrets_included": False,
              "target_published": False,
          }

          def replace_ast_node(source, node, replacement):
              lines = source.splitlines(keepends=True)
              lines[node.lineno - 1:node.end_lineno] = [replacement]
              return "".join(lines)

          def find_labelled_assignment(source, label):
              parsed = ast.parse(source)
              matches = []
              for node in ast.walk(parsed):
                  if not isinstance(node, ast.Assign) or not isinstance(node.value, ast.Call):
                      continue
                  call = node.value
                  if not isinstance(call.func, ast.Name) or call.func.id != "replace_once":
                      continue
                  if len(call.args) >= 4 and isinstance(call.args[3], ast.Constant) and call.args[3].value == label:
                      matches.append(node)
              if len(matches) != 1:
                  raise RuntimeError(f"{label}: expected one assignment, found {len(matches)}")
              return matches[0]

          try:
              raw = subprocess.check_output(
                  ["git", "show", f"origin/{builder_branch}:{workflow_path}"],
                  text=True,
                  stderr=subprocess.STDOUT,
              )
              start_marker = "          python - <<'PY'\n"
              end_marker = "\n          PY\n"
              start = raw.find(start_marker)
              if start < 0:
                  raise RuntimeError("original builder python start marker missing")
              start += len(start_marker)
              end = raw.find(end_marker, start)
              if end < 0:
                  raise RuntimeError("original builder python end marker missing")
              script = textwrap.dedent(raw[start:end])
              report["extracted_script_bytes"] = len(script.encode("utf-8"))

              parsed = ast.parse(script)
              functions = [node for node in ast.walk(parsed) if isinstance(node, ast.FunctionDef) and node.name == "replace_once"]
              if len(functions) != 1:
                  raise RuntimeError(f"replace_once definition count mismatch: {len(functions)}")
              shift_aware_replace = r'''def _shift_block(block, delta):
              output = []
              for line in block.splitlines(keepends=True):
                  ending = "\n" if line.endswith("\n") else ""
                  body = line[:-1] if ending else line
                  if not body.strip():
                      output.append(body + ending)
                      continue
                  leading = len(body) - len(body.lstrip(" "))
                  shifted = leading + delta
                  if shifted < 0 or "\t" in body[:leading]:
                      return None
                  output.append((" " * shifted) + body[leading:] + ending)
              return "".join(output)

          def replace_once(text, old, new, label):
              exact_count = text.count(old)
              if exact_count == 1:
                  return text.replace(old, new, 1)
              candidates = []
              seen = set()
              for delta in range(-16, 17):
                  candidate_old = _shift_block(old, delta)
                  candidate_new = _shift_block(new, delta)
                  if candidate_old is None or candidate_new is None or candidate_old in seen:
                      continue
                  seen.add(candidate_old)
                  count = text.count(candidate_old)
                  if count == 1:
                      candidates.append((delta, candidate_old, candidate_new))
              if len(candidates) != 1:
                  shifts = [delta for delta, _, _ in candidates]
                  raise SystemExit(f"{label}: expected one exact or uniformly shifted match, exact={exact_count}, candidate_shifts={shifts}")
              delta, candidate_old, candidate_new = candidates[0]
              print(f"{label}: applied unique indentation shift {delta}")
              return text.replace(candidate_old, candidate_new, 1)
          '''
              script = replace_ast_node(script, functions[0], shift_aware_replace)

              finalizer_call = 'lifecycle = replace_once(lifecycle, old_finalize, new_finalize, "finalizer approval gate")'
              if script.count(finalizer_call) != 1:
                  raise RuntimeError("finalizer replacement call count mismatch")
              scoped_finalizer = r'''function_anchor = "export async function finalizeGithubPullRequest(options = {}) {"
          function_start = lifecycle.find(function_anchor)
          if function_start < 0:
              raise SystemExit("finalize function anchor missing")
          next_export = lifecycle.find("\nexport ", function_start + len(function_anchor))
          function_end = len(lifecycle) if next_export < 0 else next_export
          function_text = lifecycle[function_start:function_end]
          finalizer_start_anchor = '  const pr = (await githubLifecycleRequest({ owner, repo, apiPath: `/pulls/${pullNumber}`, token, fetchImpl: options.fetchImpl })).payload;\n'
          finalizer_merge_anchor = '  const merge = await githubLifecycleRequest({\n'
          if function_text.count(finalizer_start_anchor) != 1:
              raise SystemExit(f"scoped finalizer start anchor: expected exactly one match, found {function_text.count(finalizer_start_anchor)}")
          if function_text.count(finalizer_merge_anchor) != 1:
              raise SystemExit(f"scoped finalizer merge anchor: expected exactly one match, found {function_text.count(finalizer_merge_anchor)}")
          relative_start = function_text.index(finalizer_start_anchor)
          relative_merge = function_text.index(finalizer_merge_anchor, relative_start + len(finalizer_start_anchor))
          finalizer_start = function_start + relative_start
          finalizer_merge = function_start + relative_merge
          old_finalize = lifecycle[finalizer_start:finalizer_merge + len(finalizer_merge_anchor)]
          lifecycle = replace_once(lifecycle, old_finalize, new_finalize, "finalizer approval gate")'''
              script = script.replace(finalizer_call, scoped_finalizer, 1)

              success_node = find_labelled_assignment(script, "success test approval assertions")
              success_replacement = r'''success_assertion_anchor = '  assert.equal(result.ci_gate.gate_status, "pass");\n  assert.equal(result.ancestry_readback.verified, true);\n'
          success_assertion_replacement = '  assert.equal(result.ci_gate.gate_status, "pass");\n  assert.equal(result.approval_evidence.exact_head_approval_count, 1);\n  assert.equal(result.approval_evidence.quorum_satisfied, true);\n  assert.equal(result.ancestry_readback.verified, true);\n'
          if test.count(success_assertion_anchor) != 1:
              raise SystemExit(f"success assertion anchor: expected exactly one match, found {test.count(success_assertion_anchor)}")
          test = test.replace(success_assertion_anchor, success_assertion_replacement, 1)
          '''
              script = replace_ast_node(script, success_node, success_replacement)

              compile(script, "/tmp/incident-5021-builder-diagnostic-v6.py", "exec")
              report["patched_script_compiles"] = True
              Path("/tmp/incident-5021-builder-diagnostic-v6.py").write_text(script)
              patch = subprocess.run(
                  [sys.executable, "/tmp/incident-5021-builder-diagnostic-v6.py"],
                  text=True,
                  capture_output=True,
                  check=False,
              )
              report["patch_returncode"] = patch.returncode
              report["patch_stdout_tail"] = patch.stdout.splitlines()[-100:]
              report["patch_stderr_tail"] = patch.stderr.splitlines()[-120:]

              tests = []
              if patch.returncode == 0:
                  for command in [
                      ["node", "http-generic-api/test-github-repository-lifecycle.mjs"],
                      ["node", "http-generic-api/test-gpt-tools-route-syntax-regression.mjs"],
                  ]:
                      result = subprocess.run(command, text=True, capture_output=True, check=False)
                      tests.append({
                          "command": command,
                          "returncode": result.returncode,
                          "stdout_tail": result.stdout.splitlines()[-80:],
                          "stderr_tail": result.stderr.splitlines()[-120:],
                      })
              report["tests"] = tests

              diff_check = subprocess.run(["git", "diff", "--check"], text=True, capture_output=True, check=False)
              report["diff_check_returncode"] = diff_check.returncode
              report["diff_check_stdout_tail"] = diff_check.stdout.splitlines()[-80:]
              report["diff_check_stderr_tail"] = diff_check.stderr.splitlines()[-80:]
              changed = sorted(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
              report["changed_files_after_execution"] = changed
              report["exact_six_file_boundary"] = changed == expected_files
              report["all_tests_passed"] = bool(tests) and all(test["returncode"] == 0 for test in tests)
              report["diagnostic_completed"] = True
          except Exception as exc:
              report["diagnostic_completed"] = False
              report["diagnostic_error"] = f"{type(exc).__name__}: {exc}"
              report["diagnostic_traceback_tail"] = traceback.format_exc().splitlines()[-40:]

          report_path.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          print(report_path.read_text())
          PYDIAG

      - name: Upload comprehensive structured diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incident-5021-builder-diagnostic-v6-${{ github.sha }}
          path: incident-5021-builder-diagnostic-v6.json
          if-no-files-found: error
          retention-days: 7

      - name: Fail unless candidate is fully clean
        shell: bash
        run: |
          python - <<'PYCHECK'
          import json
          from pathlib import Path
          report = json.loads(Path("incident-5021-builder-diagnostic-v6.json").read_text())
          checks = [
              report.get("diagnostic_completed") is True,
              report.get("patch_returncode") == 0,
              report.get("all_tests_passed") is True,
              report.get("diff_check_returncode") == 0,
              report.get("exact_six_file_boundary") is True,
          ]
          if not all(checks):
              raise SystemExit("candidate diagnostic is not fully clean; inspect structured artifact")
          print("candidate diagnostic fully clean")
          PYCHECK
