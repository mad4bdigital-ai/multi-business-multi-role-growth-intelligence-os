name: Governed Production Candidate Dispatch Push Request
run-name: Governed Production Candidate Dispatch Push Request · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - ".github/production-promotion-requests/dispatch-4241.txt"

permissions:
  contents: read
  pull-requests: read

jobs:
  request:
    name: Publish marker-bound read-only dispatch request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      REQUEST_PR: "4241"
      MARKER: .github/production-promotion-requests/dispatch-4241.txt
      REPORT_DIR: /tmp/governed-production-candidate-dispatch-request
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Validate exact marker-only request contract
        shell: bash
        run: |
          set -euo pipefail
          test -f "$MARKER"
          grep -Fxq 'request_pr=4241' "$MARKER"
          grep -Fxq 'trigger_revision=push-v1-marker-only' "$MARKER"
          grep -Fxq 'dispatch_token=DISPATCH_GOVERNED_PRODUCTION_CANDIDATE_BUILDER' "$MARKER"
          grep -Fxq 'main_readback=live' "$MARKER"
          grep -Fxq 'production_readback=live' "$MARKER"
          grep -Fxq 'merge_authorized=false' "$MARKER"
          grep -Fxq 'deployment_authorized=false' "$MARKER"
          grep -Fxq 'migration_authorized=false' "$MARKER"
          grep -Fxq 'provider_call_authorized=false' "$MARKER"
          grep -Fxq 'credential_payload_read_authorized=false' "$MARKER"
          mapfile -t changed < <(git diff --name-only "${GITHUB_SHA}^1" "$GITHUB_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$MARKER"

      - name: Evaluate exact request without repository mutation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${REPORT_DIR}"
          mkdir -p "${REPORT_DIR}"

          pr="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${REPOSITORY}/pulls/${REQUEST_PR}")"
          title="$(jq -r '.title' <<<"${pr}")"
          state="$(jq -r '.state' <<<"${pr}")"
          draft="$(jq -r '.draft' <<<"${pr}")"
          base_ref="$(jq -r '.base.ref' <<<"${pr}")"
          target_ref="$(jq -r '.head.ref' <<<"${pr}")"
          head_repository="$(jq -r '.head.repo.full_name' <<<"${pr}")"
          expected_head_sha="$(jq -r '.head.sha' <<<"${pr}")"

          outcome="eligible"
          reason=""
          if [[ "${title}" != "ops: request governed Production synchronization" ]]; then
            outcome="blocked"; reason="unexpected_request_title"
          elif [[ "${state}" != "open" ]]; then
            outcome="blocked"; reason="request_pull_request_not_open"
          elif [[ "${draft}" == "true" ]]; then
            outcome="blocked"; reason="request_pull_request_is_draft"
          elif [[ "${base_ref}" != "main" ]]; then
            outcome="blocked"; reason="unexpected_base_branch"
          elif [[ "${head_repository}" != "${REPOSITORY}" ]]; then
            outcome="blocked"; reason="cross_repository_request_forbidden"
          elif [[ ! "${target_ref}" =~ ^(gpt|cert|fix|feat|chore|docs|release)/[A-Za-z0-9._/-]+$ ]]; then
            outcome="blocked"; reason="invalid_governed_request_branch"
          elif [[ "${target_ref}" == "main" || "${target_ref}" == "Production" ]]; then
            outcome="blocked"; reason="protected_request_branch_forbidden"
          fi

          main_sha="$(gh api "/repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          production_sha="$(gh api "/repos/${REPOSITORY}/git/ref/heads/Production" --jq '.object.sha')"
          [[ "${expected_head_sha}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${main_sha}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${production_sha}" =~ ^[0-9a-f]{40}$ ]]

          jq -n \
            --arg contract "mad4b.governed-production-candidate-dispatch-request.v1" \
            --arg outcome "${outcome}" \
            --arg reason "${reason}" \
            --arg target_ref "${target_ref}" \
            --arg expected_head_sha "${expected_head_sha}" \
            --arg expected_main_sha "${main_sha}" \
            --arg expected_production_sha "${production_sha}" \
            --arg source_event "${GITHUB_EVENT_NAME}" \
            --argjson request_pr "${REQUEST_PR}" \
            --argjson source_run_id "${GITHUB_RUN_ID}" \
            '{contract:$contract,outcome:$outcome,reason:(if ($reason|length)>0 then $reason else null end),request_pr:$request_pr,target_ref:$target_ref,expected_head_sha:$expected_head_sha,expected_main_sha:$expected_main_sha,expected_production_sha:$expected_production_sha,source_run_id:$source_run_id,source_event:$source_event,candidate_code_checkout:false,repository_mutation_performed:false,merge_executed:false,deployment_executed:false,migration_executed:false,provider_call_executed:false,credential_payload_read:false,secrets_included:false}' \
            > "${REPORT_DIR}/request.json"

      - name: Upload marker-bound dispatch request
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: governed-production-candidate-dispatch-request-${{ github.run_id }}
          path: ${{ env.REPORT_DIR }}/request.json
          if-no-files-found: error
          retention-days: 14
