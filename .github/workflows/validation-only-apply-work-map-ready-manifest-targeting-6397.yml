name: Validation-only Apply Work Map Manifest Bindings 6397

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validation-only-apply-work-map-ready-manifest-targeting-6397.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    name: Apply exact-head manifest-only binding refresh
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_PR: "6397"
      TARGET_BRANCH: "fix/work-map-integration-post-allocation-root-20260805"
      EXPECTED_HEAD_SHA: "03a3846c067d65105834751980d4079939507fc5"
      EXPECTED_BASE_SHA: "81525a9e0a16ed86a6ab96b849ff26ad3405bd04"
      REGISTRY_FINGERPRINT: "0d5e83fdf5c64b989cec0745f9fea9a98156bd9f12348cfe6e30417fe6bfd314"
      INDEX_SOURCE_HASH: "8af1fafcb8ce298f42ea750cf75a52c575a836450930fe56b2f589bda3c2e5ce"
      COVERAGE_SOURCE_HASH: "e12cbc5ae9c4a743221ae6d33004741f492cd91c4ae2cbc82c05b7c3fd60537b"
    steps:
      - name: Initialize bounded evidence directory
        shell: bash
        run: |
          set -euo pipefail
          evidence_root="${RUNNER_TEMP}/work-map-manifest-bindings-6397"
          echo "EVIDENCE_ROOT=${evidence_root}" >> "${GITHUB_ENV}"
          mkdir -p "${evidence_root}"

      - name: Validate exact target pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}" > "${EVIDENCE_ROOT}/target-pr.json"
          jq -e --arg branch "${TARGET_BRANCH}" --arg head "${EXPECTED_HEAD_SHA}" --arg base "${EXPECTED_BASE_SHA}" '
            .state == "open" and
            .draft == false and
            .head.repo.full_name == env.GITHUB_REPOSITORY and
            .head.ref == $branch and
            .head.sha == $head and
            .base.ref == "main" and
            .base.sha == $base
          ' "${EVIDENCE_ROOT}/target-pr.json" >/dev/null

      - name: Checkout exact target head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh exact ready-manifest bindings
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");

          const bindings = {
            fingerprint: process.env.REGISTRY_FINGERPRINT,
            index_source_hash: process.env.INDEX_SOURCE_HASH,
            coverage_source_hash: process.env.COVERAGE_SOURCE_HASH,
          };
          const manifestPaths = [
            "specs/014-governed-hostinger-storage-orchestration/work-map-integration.json",
            "specs/014-retail-commerce-operations-growth-os/work-map-integration.json",
          ];

          for (const [field, value] of Object.entries(bindings)) {
            if (!/^[0-9a-f]{64}$/.test(value || "")) {
              throw new Error(`invalid ${field} binding`);
            }
          }

          for (const manifestPath of manifestPaths) {
            const original = fs.readFileSync(manifestPath, "utf8");
            const parsed = JSON.parse(original);
            if (parsed.review_state !== "ready_for_implementation") {
              throw new Error(`${manifestPath}: only ready_for_implementation manifests may be refreshed`);
            }
            if (!parsed.registry || typeof parsed.registry !== "object" || Array.isArray(parsed.registry)) {
              throw new Error(`${manifestPath}: registry object is required`);
            }

            for (const [field, value] of Object.entries(bindings)) {
              if (!Object.prototype.hasOwnProperty.call(parsed.registry, field)) {
                throw new Error(`${manifestPath}: missing registry.${field}`);
              }
              parsed.registry[field] = value;
            }

            const updated = `${JSON.stringify(parsed, null, 2)}\n`;
            const readback = JSON.parse(updated);
            for (const [field, value] of Object.entries(bindings)) {
              if (readback.registry[field] !== value) {
                throw new Error(`${manifestPath}: ${field} readback mismatch`);
              }
            }
            fs.writeFileSync(manifestPath, updated);
          }
          NODE

      - name: Verify exact two-file mutation and contracts
        shell: bash
        run: |
          set -euo pipefail
          cat > "${EVIDENCE_ROOT}/expected-files.txt" <<'EOF'
          specs/014-governed-hostinger-storage-orchestration/work-map-integration.json
          specs/014-retail-commerce-operations-growth-os/work-map-integration.json
          EOF
          git diff --name-only | sort > "${EVIDENCE_ROOT}/actual-files.txt"
          diff -u "${EVIDENCE_ROOT}/expected-files.txt" "${EVIDENCE_ROOT}/actual-files.txt"
          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          node http-generic-api/scripts/work-map-schema-classification-contract.mjs
          node http-generic-api/scripts/work-map-schema-classification.mjs
          REPORT_PATH="${EVIDENCE_ROOT}/final-work-map-readback.json" \
            node http-generic-api/scripts/spec014-final-work-map-readback.mjs
          node http-generic-api/scripts/spec-kit-work-map-governance-gate.mjs --ci --changed
          git diff --check

      - name: Commit and push manifest-only refresh
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${EXPECTED_HEAD_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            specs/014-governed-hostinger-storage-orchestration/work-map-integration.json \
            specs/014-retail-commerce-operations-growth-os/work-map-integration.json
          git commit -m "chore(work-maps): refresh ready manifest bindings"
          result_head="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          remote_after="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_after}" = "${result_head}"
          echo "RESULT_HEAD_SHA=${result_head}" >> "${GITHUB_ENV}"

      - name: Publish bounded mutation evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg contract "mad4b.validation-only-manifest-binding-updater.v4" \
            --arg expected_head_sha "${EXPECTED_HEAD_SHA}" \
            --arg result_head_sha "${RESULT_HEAD_SHA:-unresolved}" \
            --arg fingerprint "${REGISTRY_FINGERPRINT}" \
            --arg index_source_hash "${INDEX_SOURCE_HASH}" \
            --arg coverage_source_hash "${COVERAGE_SOURCE_HASH}" \
            '{
              contract:$contract,
              expected_head_sha:$expected_head_sha,
              result_head_sha:$result_head_sha,
              bindings:{
                fingerprint:$fingerprint,
                index_source_hash:$index_source_hash,
                coverage_source_hash:$coverage_source_hash
              },
              changed_files:[
                "specs/014-governed-hostinger-storage-orchestration/work-map-integration.json",
                "specs/014-retail-commerce-operations-growth-os/work-map-integration.json"
              ],
              force_push:false,
              protected_ref_mutation:false,
              runtime_contact:false,
              deployment:false,
              database_access:false,
              provider_action:false,
              migration_apply:false,
              secrets_included:false
            }' > "${EVIDENCE_ROOT}/result.json"
          sha256sum "${EVIDENCE_ROOT}"/* > "${EVIDENCE_ROOT}/SHA256SUMS.txt" || true

      - name: Upload bounded updater evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-map-manifest-bindings-updater-6397-${{ github.run_id }}
          path: ${{ runner.temp }}/work-map-manifest-bindings-6397
          if-no-files-found: error
          retention-days: 14
