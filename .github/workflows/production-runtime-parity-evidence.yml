name: Production Runtime Parity Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - '.changes/e2e/production-runtime-parity-evidence.json'
      - '.changes/e2e/runtime-recovery-schema-less-control-plane-20260823.json'
      - '.github/workflows/production-runtime-parity-evidence.yml'
      - '.github/ops/production-runtime-recovery-autodeploy.mjs'
      - '.github/ops/production-runtime-recovery-policy.mjs'
      - '.github/ops/production-runtime-recovery-routes.json'
      - '.github/ops/test-production-runtime-recovery.mjs'
      - '.github/ops/test-production-runtime-recovery-policy.mjs'
      - 'http-generic-api/governedMigrationExecutionTool.js'
      - 'http-generic-api/scripts/governed-migration-runner.mjs'
      - 'http-generic-api/scripts/governed-migration-runner-bootstrap.mjs'
      - 'http-generic-api/runtimeRecoverySnapshot.js'
      - 'http-generic-api/test-runtime-recovery-snapshot-routes.mjs'
      - 'http-generic-api/scripts/production-runtime-parity-evidence.mjs'
      - 'http-generic-api/scripts/test-production-runtime-parity-evidence.mjs'
      - 'http-generic-api/config/deployment-branch-policy.json'
      - 'http-generic-api/config/runtime-bootstrap-contract.json'
      - 'http-generic-api/runtimeBootstrapContract.js'
      - 'http-generic-api/runtimeBootstrapStatus.js'
      - 'http-generic-api/scripts/hostinger-runtime-bootstrap.mjs'
      - 'http-generic-api/test-runtime-bootstrap-contract.mjs'
      - 'http-generic-api/test-runtime-gate-deployment-info-parity.mjs'
      - 'http-generic-api/routes/deploymentInfoRoutes.js'
      - 'http-generic-api/server.js'
      - 'http-generic-api/package.json'
      - 'http-generic-api/.env.example'
      - 'http-generic-api/Dockerfile'
      - '.github/governance/test-authority-registry.json'
      - 'docs/governance/hostinger-runtime-bootstrap.md'
      - 'docs/governance/configuration-drift-policy.json'
      - '.changes/e2e/hostinger-runtime-bootstrap-contract-20260823.json'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character Production deployment SHA
        required: true
        type: string
      expected_branch:
        description: Exact deployment branch reported by /version
        required: false
        default: Production
        type: string
      auth_url:
        description: Hostinger Production auth runtime /version endpoint
        required: true
        default: https://auth.mad4b.com/version
        type: string
      deployment_info_url:
        description: Hostinger Production auth runtime /deployment-info endpoint
        required: false
        default: https://auth.mad4b.com/deployment-info
        type: string
      runtime_bootstrap_url:
        description: Protected Hostinger-side runtime_env dry-run endpoint; only used with hostinger_runtime_env source.
        required: false
        default: https://auth.mad4b.com/deployment-info/runtime-bootstrap-dry-run
        type: string
      strategy:
        description: Optional recovery control-plane mode; disabled leaves the existing parity workflow unchanged.
        required: false
        default: disabled
        type: choice
        options:
          - disabled
          - verify
          - snapshot
          - primary
          - fallback
      source_mode:
        description: Snapshot source; used only by snapshot strategy.
        required: false
        default: sql
        type: choice
        options:
          - sql
          - github_snapshot
          - repository_snapshot
      apply_execution:
        description: Perform governed recovery mutations. Snapshot is always read-only.
        required: false
        default: false
        type: boolean
      confirmation:
        description: For recovery strategies use RECOVER:<strategy>:<exact-sha>.

        required: false
        type: string
      target_key:
        description: Fallback target key from RUNTIME_RECOVERY_TARGETS_JSON.
        required: false
        default: runtime
        type: string
      bootstrap_mode:
        description: Disabled by default; plan is local metadata, dry_run is DB read-only, and migration/grants require separate approvals.
        required: false
        default: disabled
        type: choice
        options:
          - disabled
          - plan
          - dry_run
          - apply_migration
          - apply_grants
      bootstrap_target_key:
        description: Repository-owned bootstrap target key; runtime-env discovery uses the same default key without reading target database input.
        required: false
        default: production-runtime
        type: string
      bootstrap_target_source:
        description: Target source; repository_allowlist uses GitHub target binding, hostinger_runtime_env calls the protected Hostinger runtime dry-run route and is dry-run-only.
        required: false
        default: repository_allowlist
        type: choice
        options:
          - repository_allowlist
          - hostinger_runtime_env
      bootstrap_target_database:
        description: Exact bootstrap database identifier matching the repository-owned target.
        required: false
        type: string
      bootstrap_migration:
        description: 20260815 is the only apply candidate; 225/1048 remain verification-only.
        required: false
        default: 20260815_custom_gpt_mcp_catalog_levels.sql
        type: string
      bootstrap_migration_confirmation:
        description: Required only for apply_migration; APPLY_HOSTINGER_RUNTIME_MIGRATION:sha:target-key:migration-file.
        required: false
        type: string
      bootstrap_grants_confirmation:
        description: Required only for apply_grants; APPLY_HOSTINGER_RUNTIME_GRANTS:sha:target-key:principal:principal-host.
        required: false
        type: string
      bootstrap_bundle_manifest:
        description: Optional exact generated schema bundle manifest for zero-table apply.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-runtime-parity-evidence-${{ github.event.pull_request.number || inputs.expected_sha || github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Structured Evidence Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Enforce trusted workflow dispatch ref
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]

      - name: Validate production runtime parity reporter
        working-directory: http-generic-api
        run: node scripts/test-production-runtime-parity-evidence.mjs

      - name: Validate recovery operator, centralized policy, and runner ancestry
        run: node --test .github/ops/test-production-runtime-recovery.mjs .github/ops/test-production-runtime-recovery-policy.mjs

      - name: Install contract test dependencies without lifecycle scripts
        working-directory: http-generic-api
        run: npm ci --ignore-scripts

      - name: Validate explicit bootstrap contract and source-only parity tests
        working-directory: http-generic-api
        run: |
          set -Eeuo pipefail
          node --test test-runtime-bootstrap-contract.mjs
          node --test test-runtime-gate-deployment-info-parity.mjs
          node scripts/hostinger-runtime-bootstrap.mjs --plan

  bootstrap:
    name: Execute Explicit Runtime Bootstrap Contract
    if: github.event_name == 'workflow_dispatch' && inputs.bootstrap_mode != 'disabled'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: Production
    concurrency:
      group: production-runtime-bootstrap-production
      cancel-in-progress: false
    env:
      BOOTSTRAP_MODE: ${{ inputs.bootstrap_mode }}
      BOOTSTRAP_EXPECTED_SHA: ${{ inputs.expected_sha }}
      BOOTSTRAP_EXPECTED_BRANCH: ${{ inputs.expected_branch }}
      BOOTSTRAP_EXPECTED_REPOSITORY: ${{ github.repository }}
      BOOTSTRAP_TARGET_KEY: ${{ inputs.bootstrap_target_key }}
      BOOTSTRAP_TARGET_SOURCE: ${{ inputs.bootstrap_target_source }}
      BOOTSTRAP_TARGET_DATABASE: ${{ inputs.bootstrap_target_database }}
      BOOTSTRAP_MIGRATION: ${{ inputs.bootstrap_migration }}
      BOOTSTRAP_MIGRATION_CONFIRMATION: ${{ inputs.bootstrap_migration_confirmation }}
      BOOTSTRAP_GRANTS_CONFIRMATION: ${{ inputs.bootstrap_grants_confirmation }}
      BOOTSTRAP_SCHEMA_BUNDLE_MANIFEST: ${{ inputs.bootstrap_bundle_manifest }}
      RUNTIME_BOOTSTRAP_TARGETS_JSON: ${{ vars.RUNTIME_BOOTSTRAP_TARGETS_JSON }}
      BOOTSTRAP_GOVERNANCE_DATABASE: ${{ vars.BOOTSTRAP_GOVERNANCE_DATABASE }}
    steps:
      - name: Validate bootstrap target source scope
        env:
          BOOTSTRAP_MODE: ${{ inputs.bootstrap_mode }}
          BOOTSTRAP_TARGET_SOURCE: ${{ inputs.bootstrap_target_source }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${BOOTSTRAP_TARGET_SOURCE}" == "hostinger_runtime_env" && "${BOOTSTRAP_MODE}" != "dry_run" ]]; then
            echo '{"ok":false,"code":"hostinger_runtime_env_dry_run_only","secrets_included":false}' >&2
            exit 1
          fi

      - name: Validate trusted dispatch ref and exact Production head
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_BRANCH: ${{ inputs.expected_branch }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "${EXPECTED_BRANCH}" == "Production" ]]
          production_sha="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/Production" --jq '.object.sha')"
          [[ "${production_sha,,}" == "${EXPECTED_SHA,,}" ]]
      - name: Checkout exact Production source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Require live Hostinger runtime parity before bootstrap
        if: inputs.bootstrap_mode != 'plan'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_BRANCH: ${{ inputs.expected_branch }}
          VERSION_URL: ${{ inputs.auth_url }}
          DEPLOYMENT_INFO_URL: ${{ inputs.deployment_info_url }}
          PARITY_RESULT_PATH: ${{ github.workspace }}/.bootstrap/production-runtime-bootstrap/hostinger-parity.json
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "${EXPECTED_BRANCH}" == "Production" ]]
          [[ "${VERSION_URL}" == "https://auth.mad4b.com/version" ]]
          [[ "${DEPLOYMENT_INFO_URL}" == "https://auth.mad4b.com/deployment-info" ]]
          mkdir -p "$(dirname "${PARITY_RESULT_PATH}")"
          version_file="${PARITY_RESULT_PATH}.version.json"
          deployment_file="${PARITY_RESULT_PATH}.deployment-info.json"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --connect-timeout 10 --max-time 30 "${VERSION_URL}" --output "${version_file}"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --connect-timeout 10 --max-time 30 "${DEPLOYMENT_INFO_URL}" --output "${deployment_file}"
          [[ "$(wc -c < "${version_file}")" -le 65536 ]]
          [[ "$(wc -c < "${deployment_file}")" -le 65536 ]]
          version_sha="$(jq -er '.gitCommitFull // .git_commit_full // .deployment.deployed_commit_sha // empty' "${version_file}")"
          deployment_sha="$(jq -er '.gitCommitFull // .git_commit_full // .commit_sha // .deployment.deployed_commit_sha // empty' "${deployment_file}")"
          deployment_branch="$(jq -er '.gitBranch // .git_branch // .branch // .deployment.branch // empty' "${deployment_file}")"
          [[ "${version_sha,,}" == "${EXPECTED_SHA,,}" ]]
          [[ "${deployment_sha,,}" == "${EXPECTED_SHA,,}" ]]
          [[ "${deployment_branch}" == "${EXPECTED_BRANCH}" ]]
          jq -n \
            --arg expected_sha "${EXPECTED_SHA,,}" \
            --arg expected_branch "${EXPECTED_BRANCH}" \
            --arg version_sha "${version_sha,,}" \
            --arg deployment_sha "${deployment_sha,,}" \
            --arg deployment_branch "${deployment_branch}" \
            '{contract:"mad4b.hostinger.bootstrap-runtime-parity.v1",read_only:true,mutation_performed:false,provider_mutation_performed:false,expected_sha:$expected_sha,expected_branch:$expected_branch,version_sha:$version_sha,deployment_info_sha:$deployment_sha,deployment_info_branch:$deployment_branch,version_url:"https://auth.mad4b.com/version",deployment_info_url:"https://auth.mad4b.com/deployment-info",secrets_included:false}' \
            > "${PARITY_RESULT_PATH}"
          rm -f "${version_file}" "${deployment_file}"
      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install database client without lifecycle scripts
        if: inputs.bootstrap_mode != 'plan' && inputs.bootstrap_target_source == 'repository_allowlist'
        working-directory: http-generic-api
        run: npm ci --ignore-scripts
      - name: Run selected repository bootstrap contract mode
        if: inputs.bootstrap_target_source == 'repository_allowlist'
        env:
          MYSQL_BOOTSTRAP_HOST: ${{ vars.MYSQL_BOOTSTRAP_HOST }}
          MYSQL_BOOTSTRAP_PORT: ${{ vars.MYSQL_BOOTSTRAP_PORT || '3306' }}
          MYSQL_BOOTSTRAP_DATABASE: ${{ inputs.bootstrap_target_database }}
          MYSQL_BOOTSTRAP_USER: ${{ secrets.MYSQL_BOOTSTRAP_USER }}
          MYSQL_BOOTSTRAP_PASSWORD: ${{ secrets.MYSQL_BOOTSTRAP_PASSWORD }}
          BOOTSTRAP_RESULT_PATH: ${{ github.workspace }}/.bootstrap/production-runtime-bootstrap/result.json
        run: |
          set -Eeuo pipefail
          mkdir -p "$(dirname "${BOOTSTRAP_RESULT_PATH}")"
          node http-generic-api/scripts/hostinger-runtime-bootstrap.mjs
      - name: Run Hostinger-side runtime environment dry-run
        if: inputs.bootstrap_target_source == 'hostinger_runtime_env'
        env:
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_BRANCH: ${{ inputs.expected_branch }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          TARGET_KEY: ${{ inputs.bootstrap_target_key }}
          MIGRATION: ${{ inputs.bootstrap_migration }}
          RUNTIME_BOOTSTRAP_URL: ${{ inputs.runtime_bootstrap_url }}
          BOOTSTRAP_RESULT_PATH: ${{ github.workspace }}/.bootstrap/production-runtime-bootstrap/result.json
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "${EXPECTED_BRANCH}" == "Production" ]]
          [[ "${RUNTIME_BOOTSTRAP_URL}" == "https://auth.mad4b.com/deployment-info/runtime-bootstrap-dry-run" ]]
          [[ -n "${BACKEND_API_KEY}" ]]
          mkdir -p "$(dirname "${BOOTSTRAP_RESULT_PATH}")"
          payload_file="${RUNNER_TEMP}/runtime-bootstrap-dry-run-payload.json"
          header_file="${RUNNER_TEMP}/runtime-bootstrap-dry-run-header.txt"
          result_file="${BOOTSTRAP_RESULT_PATH}"
          jq -n \
            --arg expected_sha "${EXPECTED_SHA,,}" \
            --arg expected_branch "${EXPECTED_BRANCH}" \
            --arg expected_repository "${EXPECTED_REPOSITORY}" \
            --arg target_key "${TARGET_KEY}" \
            --arg migration "${MIGRATION}" \
            '{expected_sha:$expected_sha,expected_branch:$expected_branch,expected_repository:$expected_repository,target_key:$target_key,migration:$migration}' \
            > "${payload_file}"
          printf 'header = "x-api-key: %s"\n' "${BACKEND_API_KEY}" > "${header_file}"
          http_status="$(curl --proto '=https' --tlsv1.2 --silent --show-error --connect-timeout 10 --max-time 300 --config "${header_file}" -H 'content-type: application/json' --data-binary "@${payload_file}" -o "${result_file}" -w '%{http_code}' "${RUNTIME_BOOTSTRAP_URL}")"
          rm -f "${payload_file}" "${header_file}"
          [[ "$(wc -c < "${result_file}")" -le 49152 ]]
          jq -e --argjson status "${http_status}" '
            (.secrets_included == false) and
            ((.. | objects | keys[]) as $key | ($key == "database" or $key == "principal" or $key == "password" or $key == "secret" or $key == "connection_string") | not) and
            (.mode == "dry_run") and
            (.operation == "read_only") and
            (.target_source == "runtime_env") and
            (.database_mutation_performed == false) and
            (.migration_apply_performed == false) and
            (.grant_mutation_performed == false) and
            ($status == 200)
          ' "${result_file}" >/dev/null || {
            echo '{"ok":false,"code":"hostinger_runtime_env_dry_run_failed_or_unsafe","secrets_included":false}' >&2
            exit 1
          }
      - name: Upload bounded no-secret bootstrap evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-runtime-bootstrap-${{ inputs.bootstrap_mode }}-${{ inputs.expected_sha }}-${{ github.run_id }}
          path: ${{ github.workspace }}/.bootstrap/production-runtime-bootstrap/
          if-no-files-found: warn
          retention-days: 30

  live:
    name: Live Production Runtime Parity
    if: github.event_name == 'workflow_dispatch' && inputs.strategy == 'disabled'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Validate immutable dispatch identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_BRANCH: ${{ inputs.expected_branch }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EXPECTED_BRANCH}" == "Production" ]]
          production_sha="$(git rev-parse refs/remotes/origin/Production)"
          [[ "${production_sha}" == "${EXPECTED_SHA}" ]]

      - name: Generate structured Hostinger Production parity evidence
        id: parity
        continue-on-error: true
        shell: bash
        working-directory: http-generic-api
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_BRANCH: ${{ inputs.expected_branch }}
          AUTH_URL: ${{ inputs.auth_url }}
          PRODUCTION_RUNTIME_PARITY_EVIDENCE_DIR: ${{ runner.temp }}/production-runtime-parity-evidence
        run: |
          set -euo pipefail
          node scripts/production-runtime-parity-evidence.mjs \
            --expected-sha "${EXPECTED_SHA}" \
            --expected-branch "${EXPECTED_BRANCH}" \
            --endpoint "auth=${AUTH_URL}" \
            --output-dir "${PRODUCTION_RUNTIME_PARITY_EVIDENCE_DIR}"

      - name: Upload structured live parity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-runtime-parity-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/production-runtime-parity-evidence/*
          if-no-files-found: error
          retention-days: 30

      - name: Enforce structured Hostinger Production parity decision
        if: always()
        working-directory: http-generic-api
        env:
          REPORT_PATH: ${{ runner.temp }}/production-runtime-parity-evidence/production-runtime-parity-evidence.json
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const reportPath = process.env.REPORT_PATH;
            if (!reportPath || !fs.existsSync(reportPath)) {
              console.error(JSON.stringify({ ok: false, error: "production_runtime_parity_report_missing", secrets_included: false }));
              process.exit(1);
            }
            const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
            const effects = report.side_effects || {};
            const endpoints = Array.isArray(report.endpoints) ? report.endpoints : [];
            const auth = endpoints.find((endpoint) => endpoint.name === "auth");
            const valid =
              report.contract === "mad4b.production-runtime-parity-evidence.v1" &&
              report.identity?.expected_sha === process.env.EXPECTED_SHA &&
              report.identity?.expected_branch === "Production" &&
              report.identity?.tooling_sha === process.env.GITHUB_SHA &&
              endpoints.length === 1 &&
              auth?.required === true &&
              auth?.status === "passed" &&
              report.first_failure === null &&
              report.secrets_included === false &&
              report.routing?.consult_job_logs === false &&
              effects.repository_mutation_performed === false &&
              effects.provider_dispatch_performed === false &&
              effects.credential_access_performed === false &&
              effects.sql_execution_performed === false &&
              effects.migration_apply_performed === false &&
              effects.external_send_performed === false;
            if (!valid || report.outcome !== "passed") {
              console.error(JSON.stringify({
                ok: false,
                outcome: report.outcome || "evidence_error",
                first_failure: report.first_failure || { code: "invalid_structured_report" },
                consult_job_logs: false,
                secrets_included: false
              }));
              process.exit(1);
            }
            console.log(JSON.stringify({
              ok: true,
              outcome: report.outcome,
              expected_sha: report.identity.expected_sha,
              passed_endpoint: "auth",
              secrets_included: false
            }));
          '

  recovery:
    name: Recover Production after Hostinger Auto Deploy
    if: github.event_name == 'workflow_dispatch' && inputs.strategy != 'disabled'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: Production
    concurrency:
      group: production-runtime-recovery-production
      cancel-in-progress: false
    env:
      RECOVERY_STRATEGY: ${{ inputs.strategy }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      APPLY_EXECUTION: ${{ inputs.strategy == 'snapshot' && 'false' || inputs.apply_execution }}
      RECOVERY_CONFIRMATION: ${{ inputs.confirmation }}
      RECOVERY_TARGET_KEY: ${{ inputs.target_key }}
      RUNTIME_RECOVERY_SOURCE_MODE: ${{ inputs.source_mode }}
      PRODUCTION_SOURCE_BRANCH: ${{ vars.PRODUCTION_SOURCE_BRANCH || 'Production' }}
      PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL || 'https://auth.mad4b.com' }}
      GITHUB_TOKEN: ${{ github.token }}
      PRODUCTION_VERIFY_ATTEMPTS: ${{ vars.PRODUCTION_VERIFY_ATTEMPTS || '36' }}
      PRODUCTION_VERIFY_INTERVAL_SECONDS: ${{ vars.PRODUCTION_VERIFY_INTERVAL_SECONDS || '10' }}
      PRODUCTION_PROBE_AUTH_HEADER: ${{ vars.PRODUCTION_PROBE_AUTH_HEADER || 'Authorization' }}
      RUNTIME_RECOVERY_PROBES_JSON: ${{ vars.RUNTIME_RECOVERY_PROBES_JSON }}
      PRIMARY_GOVERNED_STEPS_JSON: ${{ vars.PRIMARY_GOVERNED_STEPS_JSON }}
      RUNTIME_RECOVERY_FINAL_PROBES_JSON: ${{ vars.RUNTIME_RECOVERY_FINAL_PROBES_JSON }}
      RUNTIME_RECOVERY_SNAPSHOT_JSON: ${{ vars.RUNTIME_RECOVERY_SNAPSHOT_JSON }}
      RUNTIME_RECOVERY_CATALOG_JSON: ${{ vars.RUNTIME_RECOVERY_CATALOG_JSON }}
      RUNTIME_RECOVERY_SESSION_CONTEXT_JSON: ${{ vars.RUNTIME_RECOVERY_SESSION_CONTEXT_JSON }}
      RUNTIME_RECOVERY_SNAPSHOT_PATH: ${{ vars.RUNTIME_RECOVERY_SNAPSHOT_PATH || 'http-generic-api/config/runtime-recovery-repository-snapshot.json' }}
      RUNTIME_RECOVERY_TARGETS_JSON: ${{ vars.RUNTIME_RECOVERY_TARGETS_JSON }}
      RUNTIME_RECOVERY_ALLOW_CREATE_DATABASE: ${{ vars.RUNTIME_RECOVERY_ALLOW_CREATE_DATABASE || 'false' }}
    steps:
      - name: Validate exact Production head before checkout
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
          actual_sha="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${PRODUCTION_SOURCE_BRANCH}" --jq '.object.sha')"
          test "${actual_sha,,}" = "${EXPECTED_SHA,,}"

      - name: Checkout exact Production source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Verify recovery route, operator, centralized policy, and runner ancestry contracts
        run: node --test .github/ops/test-production-runtime-recovery.mjs .github/ops/test-production-runtime-recovery-policy.mjs

      - name: Validate configured recovery plan against reviewed policy
        run: node .github/ops/production-runtime-recovery-policy.mjs preflight

      - name: Install MariaDB dependency for explicit fallback apply only
        if: inputs.strategy == 'fallback' && inputs.apply_execution
        working-directory: http-generic-api
        run: npm ci --ignore-scripts

      - name: Initialize bounded evidence path
        shell: bash
        run: |
          set -Eeuo pipefail
          evidence_dir="${RUNNER_TEMP}/production-runtime-recovery"
          mkdir -p "${evidence_dir}"
          echo "RUNTIME_RECOVERY_RESULT_PATH=${evidence_dir}/result.json" >> "${GITHUB_ENV}"
          echo "EVIDENCE_DIR=${evidence_dir}" >> "${GITHUB_ENV}"

      - name: Execute selected recovery strategy through centralized policy
        env:
          PRODUCTION_PROBE_AUTH_VALUE: ${{ inputs.strategy != 'snapshot' && secrets.PRODUCTION_PROBE_AUTH_VALUE || '' }}
          MYSQL_BOOTSTRAP_HOST: ${{ inputs.strategy == 'fallback' && vars.MYSQL_BOOTSTRAP_HOST || '' }}
          MYSQL_BOOTSTRAP_PORT: ${{ inputs.strategy == 'fallback' && (vars.MYSQL_BOOTSTRAP_PORT || '3306') || '' }}
          MYSQL_BOOTSTRAP_USER: ${{ inputs.strategy == 'fallback' && secrets.MYSQL_BOOTSTRAP_USER || '' }}
          MYSQL_BOOTSTRAP_PASSWORD: ${{ inputs.strategy == 'fallback' && secrets.MYSQL_BOOTSTRAP_PASSWORD || '' }}
        run: node .github/ops/production-runtime-recovery-policy.mjs execute

      - name: Verify fallback least-privilege grants in same cycle
        if: inputs.strategy == 'fallback' && inputs.apply_execution
        env:
          MYSQL_BOOTSTRAP_HOST: ${{ vars.MYSQL_BOOTSTRAP_HOST }}
          MYSQL_BOOTSTRAP_PORT: ${{ vars.MYSQL_BOOTSTRAP_PORT || '3306' }}
          MYSQL_BOOTSTRAP_USER: ${{ secrets.MYSQL_BOOTSTRAP_USER }}
          MYSQL_BOOTSTRAP_PASSWORD: ${{ secrets.MYSQL_BOOTSTRAP_PASSWORD }}
        run: node .github/ops/production-runtime-recovery-policy.mjs grant-readback

      - name: Verify live response-chunk persistence binding
        if: inputs.apply_execution && (inputs.strategy == 'primary' || inputs.strategy == 'fallback')
        env:
          PRODUCTION_PROBE_AUTH_VALUE: ${{ secrets.PRODUCTION_PROBE_AUTH_VALUE }}
        run: node .github/ops/production-runtime-recovery-policy.mjs persistence-readback

      - name: Reverify immutable Production head
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          actual_sha="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${PRODUCTION_SOURCE_BRANCH}" --jq '.object.sha')"
          test "${actual_sha,,}" = "${EXPECTED_SHA,,}"

      - name: Upload bounded no-secret recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-runtime-recovery-${{ inputs.strategy }}-${{ inputs.source_mode }}-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 30
