name: Production Runtime Parity Evidence

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/production-runtime-parity-evidence.yml'

permissions:
  contents: read

concurrency:
  group: registered-production-runtime-parity-42177d36-v1
  cancel-in-progress: false

jobs:
  exact-runtime-parity:
    name: Exact Production 42177d36 Runtime Parity
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/validate-registered-runtime-parity-42177d36-v1-20260804' &&
      github.event.pull_request.user.id == 271942579
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    env:
      EXPECTED_BASE_SHA: 97e4ee7ec790844ad20ee2349125579353c693d5
      EXPECTED_PRODUCTION_SHA: 42177d360e9c6d76b4f09eaf06bd98ac26d09abe
      EXPECTED_BRANCH: Production
      AUTH_URL: https://auth.mad4b.com/version
      WORKFLOW_PATH: .github/workflows/production-runtime-parity-evidence.yml
      REPORT_DIR: ${{ runner.temp }}/production-runtime-parity-42177d36

    steps:
      - name: Checkout exact one-file validation head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable validation scope and Production ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          test "${BASE_SHA}" = "${EXPECTED_BASE_SHA}"
          test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
          changed_files="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          test "${changed_files}" = "${WORKFLOW_PATH}"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "${EXPECTED_BASE_SHA}"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/Production" --jq '.object.sha')" = "${EXPECTED_PRODUCTION_SHA}"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Validate canonical parity reporter contract
        working-directory: http-generic-api
        run: node scripts/test-production-runtime-parity-evidence.mjs

      - name: Generate structured public runtime parity evidence
        id: parity
        continue-on-error: true
        shell: bash
        working-directory: http-generic-api
        run: |
          set -Eeuo pipefail
          node scripts/production-runtime-parity-evidence.mjs \
            --expected-sha "${EXPECTED_PRODUCTION_SHA}" \
            --expected-branch "${EXPECTED_BRANCH}" \
            --endpoint "auth=${AUTH_URL}" \
            --output-dir "${REPORT_DIR}"

      - name: Print bounded parity summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -s "${REPORT_DIR}/production-runtime-parity-evidence.json" ]]; then
            jq '{contract,outcome,identity,endpoints,first_failure,routing,side_effects,secrets_included}' \
              "${REPORT_DIR}/production-runtime-parity-evidence.json"
          else
            echo '{"outcome":"error","first_failure":{"code":"production_runtime_parity_report_missing"},"secrets_included":false}'
          fi

      - name: Upload exact runtime parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-runtime-parity-42177d36-${{ github.run_id }}
          path: ${{ env.REPORT_DIR }}/*
          if-no-files-found: error
          retention-days: 30

      - name: Enforce exact Production runtime parity
        if: always()
        shell: bash
        env:
          PARITY_STEP_OUTCOME: ${{ steps.parity.outcome }}
        run: |
          set -Eeuo pipefail
          test "${PARITY_STEP_OUTCOME}" = success
          REPORT="${REPORT_DIR}/production-runtime-parity-evidence.json"
          test -s "${REPORT}"
          jq -e --arg expected "${EXPECTED_PRODUCTION_SHA}" '
            .contract == "mad4b.production-runtime-parity-evidence.v1" and
            .outcome == "passed" and
            .identity.expected_sha == $expected and
            .identity.expected_branch == "Production" and
            ([.endpoints[] | select(.name == "auth" and .required == true and .status == "passed")] | length) == 1 and
            .first_failure == null and
            .routing.consult_job_logs == false and
            .side_effects.repository_mutation_performed == false and
            .side_effects.provider_dispatch_performed == false and
            .side_effects.credential_access_performed == false and
            .side_effects.sql_execution_performed == false and
            .side_effects.migration_apply_performed == false and
            .side_effects.external_send_performed == false and
            .secrets_included == false
          ' "${REPORT}" >/dev/null
