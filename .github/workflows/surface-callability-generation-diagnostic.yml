name: Surface Callability SQL Scope Diagnostic

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/surface-callability-generation-diagnostic.yml

permissions:
  contents: read

concurrency:
  group: surface-callability-generation-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      github.repository == 'mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/pr5210-surface-source-clean-20260803' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TARGET_BRANCH: gpt/pr5210-surface-source-clean-20260803
      WORKFLOW_PATH: .github/workflows/surface-callability-generation-diagnostic.yml
      BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify read-only bounded diagnostic trigger
        shell: bash
        run: |
          set -Eeuo pipefail
          test '${{ github.event.pull_request.head.ref }}' = "${TARGET_BRANCH}"
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          git merge-base --is-ancestor "${BASE_SHA}" HEAD
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "${WORKFLOW_PATH}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Prove SQL-derived permanent Surface scope
        id: sql-scope
        working-directory: http-generic-api
        continue-on-error: true
        shell: bash
        run: |
          set +e
          diagnostics="../surface-proof/surface-sql-scope-diagnostic"
          mkdir -p "$diagnostics"
          node --input-type=module > "$diagnostics/stdout.log" 2> "$diagnostics/stderr.log" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { extractRegistryToolRegistrations } from './scripts/surface-contract-sql-registry-extractor.mjs';

          const manifest = JSON.parse(fs.readFileSync('resource-api-surface-callability.manifest.json', 'utf8'));
          const expectedKeys = [...new Set(manifest.source_queue_tool_keys || [])].sort();
          const expectedSet = new Set(expectedKeys);
          const manifestBindings = (manifest.contracts || []).flatMap((contract) => contract.tool_bindings || []);
          const manifestByKey = new Map();
          const duplicateManifestKeys = [];
          for (const binding of manifestBindings) {
            if (manifestByKey.has(binding.tool_key)) duplicateManifestKeys.push(binding.tool_key);
            manifestByKey.set(binding.tool_key, binding.migration_file);
          }

          const matchesByKey = new Map(expectedKeys.map((key) => [key, []]));
          const migrationFiles = fs.readdirSync('migrations').filter((file) => file.endsWith('.sql')).sort();
          for (const migrationFile of migrationFiles) {
            const source = fs.readFileSync(path.join('migrations', migrationFile), 'utf8');
            for (const registration of extractRegistryToolRegistrations(source)) {
              if (!expectedSet.has(registration.tool_key)) continue;
              matchesByKey.get(registration.tool_key).push({
                migration_file: `migrations/${migrationFile}`,
                http_method: registration.http_method || null,
                http_path: registration.http_path || null,
              });
            }
          }

          const missing = expectedKeys.filter((key) => matchesByKey.get(key).length === 0);
          const duplicates = expectedKeys.filter((key) => matchesByKey.get(key).length > 1).map((key) => ({ key, matches: matchesByKey.get(key) }));
          const mappingMismatches = expectedKeys.flatMap((key) => {
            const matches = matchesByKey.get(key);
            if (matches.length !== 1) return [];
            const expectedMigration = manifestByKey.get(key) || null;
            return matches[0].migration_file === expectedMigration ? [] : [{ key, expected_migration: expectedMigration, actual_migration: matches[0].migration_file }];
          });
          const discoveredMappings = expectedKeys.flatMap((key) => matchesByKey.get(key).map((match) => ({ tool_key: key, ...match })));
          const migrationCount = new Set(discoveredMappings.map((item) => item.migration_file)).size;
          const manifestMigrationCount = new Set(manifestBindings.map((item) => item.migration_file)).size;

          const report = {
            schema: 'mad4b.surface-sql-scope-diagnostic.v1',
            event_head: process.env.GITHUB_SHA,
            expected_tool_count: expectedKeys.length,
            manifest_binding_count: manifestBindings.length,
            manifest_migration_count: manifestMigrationCount,
            discovered_tool_registration_count: discoveredMappings.length,
            discovered_migration_count: migrationCount,
            missing,
            duplicates,
            duplicate_manifest_keys: [...new Set(duplicateManifestKeys)].sort(),
            mapping_mismatches: mappingMismatches,
            mappings: discoveredMappings,
            status: 'PASS',
          };

          const failures = [];
          if (expectedKeys.length !== 41) failures.push(`expected_tool_count:${expectedKeys.length}`);
          if (manifestBindings.length !== 41) failures.push(`manifest_binding_count:${manifestBindings.length}`);
          if (manifestMigrationCount !== 20) failures.push(`manifest_migration_count:${manifestMigrationCount}`);
          if (migrationCount !== 20) failures.push(`discovered_migration_count:${migrationCount}`);
          if (missing.length) failures.push(`missing:${missing.length}`);
          if (duplicates.length) failures.push(`duplicates:${duplicates.length}`);
          if (duplicateManifestKeys.length) failures.push(`duplicate_manifest_keys:${duplicateManifestKeys.length}`);
          if (mappingMismatches.length) failures.push(`mapping_mismatches:${mappingMismatches.length}`);
          if (failures.length) report.status = 'FAIL';

          fs.writeFileSync('../surface-proof/surface-sql-scope-diagnostic/report.json', `${JSON.stringify(report, null, 2)}\n`);
          console.log(JSON.stringify({ status: report.status, expected_tools: expectedKeys.length, migrations: migrationCount, failures }));
          if (failures.length) process.exit(1);
          NODE
          status=$?
          printf '%s\n' "$status" > "$diagnostics/status.txt"
          cat "$diagnostics/stdout.log"
          cat "$diagnostics/stderr.log" >&2
          exit "$status"

      - name: Upload SQL scope diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surface-sql-scope-diagnostic-${{ github.run_id }}
          path: surface-proof/surface-sql-scope-diagnostic
          if-no-files-found: error
          retention-days: 2

      - name: Enforce SQL scope proof
        if: steps.sql-scope.outcome != 'success'
        run: exit 1
