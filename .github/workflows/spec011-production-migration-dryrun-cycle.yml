name: Spec 011 Production Migration Dry Run Cycle

on:
  push:
    branches:
      - gpt/spec011-production-migration-dryrun-cycle-20260730
    paths:
      - .github/spec011-production-migration-dryrun-trigger.json

permissions:
  contents: write

concurrency:
  group: spec011-production-migration-dryrun
  cancel-in-progress: true

jobs:
  production-readback-and-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout bounded operational branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate bounded cycle inputs
        shell: bash
        env:
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$BACKEND_API_KEY" || {
            echo "::error::BACKEND_API_KEY repository secret is unavailable"
            exit 1
          }
          node --check http-generic-api/scripts/spec011-production-migration-dryrun-cycle.mjs
          node - <<'NODE'
          const fs = require('node:fs');
          const path = '.github/spec011-production-migration-dryrun-trigger.json';
          const trigger = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (trigger.authorize_only_and_dry_run !== true || trigger.apply_allowed === true) {
            throw new Error('trigger must forbid migration apply');
          }
          NODE

      - name: Verify deployed Production and run authorization plus dry-run
        shell: bash
        env:
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
          BASE_URL: https://auth.mad4b.com
          TRIGGER_PATH: .github/spec011-production-migration-dryrun-trigger.json
          EVIDENCE_PATH: ${{ runner.temp }}/spec011-production-migration-dryrun-evidence.json
        run: |
          set -euo pipefail
          node http-generic-api/scripts/spec011-production-migration-dryrun-cycle.mjs

      - name: Persist sanitized governed evidence
        if: always()
        shell: bash
        env:
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
          SOURCE_EVIDENCE: ${{ runner.temp }}/spec011-production-migration-dryrun-evidence.json
          TARGET_EVIDENCE: ops-evidence/spec011/production-migration-dryrun-latest.json
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$TARGET_EVIDENCE")"
          if [[ ! -s "$SOURCE_EVIDENCE" ]]; then
            printf '%s\n' '{"schema_version":"spec011.production_migration_dryrun.v1","ok":false,"error":{"message":"workflow ended before the bounded script wrote evidence"},"apply_executed":false,"migration_sql_executed":false,"secrets_included":false}' > "$SOURCE_EVIDENCE"
          fi
          node - "$SOURCE_EVIDENCE" "$TARGET_EVIDENCE" "$JOB_STATUS" "$RUN_ID" "$RUN_ATTEMPT" "$HEAD_SHA" <<'NODE'
          const fs = require('node:fs');
          const [source, target, jobStatus, runId, runAttempt, headSha] = process.argv.slice(2);
          const evidence = JSON.parse(fs.readFileSync(source, 'utf8'));
          evidence.workflow = {
            name: 'Spec 011 Production Migration Dry Run Cycle',
            job_status: jobStatus,
            run_id: Number(runId),
            run_attempt: Number(runAttempt),
            trigger_sha: headSha,
          };
          evidence.apply_executed = false;
          evidence.migration_sql_executed = false;
          evidence.secrets_included = false;
          fs.writeFileSync(target, JSON.stringify(evidence, null, 2) + '\n');
          NODE
          if grep -Fq -- "$BACKEND_API_KEY" "$TARGET_EVIDENCE"; then
            echo "::error::credential material detected in evidence"
            rm -f "$TARGET_EVIDENCE"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET_EVIDENCE"
          if ! git diff --cached --quiet; then
            git commit -m "evidence(spec-011): record Production migration dry-run cycle"
            git push origin "HEAD:$BRANCH_NAME"
          fi

      - name: Upload non-secret governed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec011-production-migration-dryrun-${{ github.sha }}
          path: ${{ runner.temp }}/spec011-production-migration-dryrun-evidence.json
          if-no-files-found: warn
          retention-days: 30
