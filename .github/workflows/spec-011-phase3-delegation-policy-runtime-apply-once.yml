name: Spec 011 Phase 3 Delegation Policy Runtime Apply Once

on:
  push:
    branches:
      - gpt/spec-011-phase3-delegation-policy-runtime-wave-20260731
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: spec-011-phase3-delegation-policy-runtime-wave
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'gpt/spec-011-phase3-delegation-policy-runtime-wave-20260731'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gpt/spec-011-phase3-delegation-policy-runtime-wave-20260731
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Synchronize latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Apply integrated delegation runtime wave
        run: python3 .github/scripts/spec011-phase3-delegation-policy-runtime-apply.py

      - name: Validate integrated delegation runtime wave
        working-directory: http-generic-api
        run: |
          node --check delegationExecutionPolicyService.js
          node --check sequentialPlanOrchestrator.js
          node --check routes/agentRegistryRoutes.js
          node test-delegation-execution-policy-runtime.mjs
          node test-sequential-plan-orchestrator.mjs
          node test-agent-delegation-opt-in.mjs
          node test-delegation-grant-shadow.mjs
          node test-delegation-grant-lifecycle-shadow.mjs
          node test-delegation-grant-repository-mutation.mjs
          node test-delegation-grant-mariadb-runtime-binding.mjs
          node test-test-manifest-runner.mjs

      - name: Enforce bounded wave write set
        run: |
          allowed='^(http-generic-api/delegationExecutionPolicyService\.js|http-generic-api/test-delegation-execution-policy-runtime\.mjs|http-generic-api/sequentialPlanOrchestrator\.js|http-generic-api/test-sequential-plan-orchestrator\.mjs|http-generic-api/routes/agentRegistryRoutes\.js|http-generic-api/scripts/manifests/test-manifest-spec011\.mjs|specs/011-durable-governed-execution-and-agent-delegation/phase3-delegation-policy-runtime-wave\.md|specs/011-durable-governed-execution-and-agent-delegation/tasks\.md|\.github/scripts/spec011-phase3-delegation-policy-runtime-apply\.py|\.github/workflows/spec-011-phase3-delegation-policy-runtime-apply-once\.yml)$'
          unexpected="$(git diff --name-only origin/main | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected files in wave diff:\n%s\n' "$unexpected"
            exit 1
          fi

      - name: Commit clean synchronized wave
        run: |
          rm -f .github/scripts/spec011-phase3-delegation-policy-runtime-apply.py
          rm -f .github/workflows/spec-011-phase3-delegation-policy-runtime-apply-once.yml
          git add -A
          git commit -m "feat(spec-011): integrate delegation policy runtime wave"
          git fetch origin gpt/spec-011-phase3-delegation-policy-runtime-wave-20260731
          git merge --no-edit origin/gpt/spec-011-phase3-delegation-policy-runtime-wave-20260731
          git push origin HEAD:gpt/spec-011-phase3-delegation-policy-runtime-wave-20260731
