name: Exact Repository Write Prerequisite ARM Validation 5899

on:
  pull_request:
    branches:
      - gpt/validate-repository-write-prerequisite-arm-base-58b98727-v2
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: exact-repository-write-prerequisite-arm-5899-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  exact-candidate:
    name: Exact Repository Write Prerequisite Full Validation
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/repository-write-prerequisite-main-58b98727-20260804-v2' &&
      github.event.pull_request.head.sha == '74a0871c4f57cee753835ca655b0ca42d205ed7d'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    env:
      EXPECTED_MAIN_SHA: 58b98727e1ef254dd117a49619d4a9259fdaaf65
      EXPECTED_HEAD_SHA: 74a0871c4f57cee753835ca655b0ca42d205ed7d
      EXPECTED_HEAD_REF: gpt/repository-write-prerequisite-main-58b98727-20260804-v2
      REPORT_DIR: ${{ runner.temp }}/exact-repository-write-prerequisite-arm-5899
      TEST_SUITE_REPORT_DIR: ${{ runner.temp }}/test-suite-reports

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            http-generic-api/package-lock.json

      - name: Verify immutable identity, topology, scope, and blobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR/repository-tool-lifecycle" "$TEST_SUITE_REPORT_DIR"
          test "${{ github.event.pull_request.base.ref }}" = 'gpt/validate-repository-write-prerequisite-arm-base-58b98727-v2'
          test "${{ github.event.pull_request.head.repo.full_name }}" = "$GITHUB_REPOSITORY"
          test "${{ github.event.pull_request.head.ref }}" = "$EXPECTED_HEAD_REF"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main" "+refs/heads/$EXPECTED_HEAD_REF:refs/remotes/origin/$EXPECTED_HEAD_REF"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse refs/remotes/origin/$EXPECTED_HEAD_REF)" = "$EXPECTED_HEAD_SHA"
          test "$(git merge-base "$EXPECTED_MAIN_SHA" "$EXPECTED_HEAD_SHA")" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-list --count "$EXPECTED_MAIN_SHA..$EXPECTED_HEAD_SHA")" -eq 1
          test "$(git rev-parse "$EXPECTED_HEAD_SHA^")" = "$EXPECTED_MAIN_SHA"

          cat > "$REPORT_DIR/expected-files.txt" <<'FILES'
          .changes/e2e/repository-write-workflow-prerequisites.json
          .github/workflows/e2e-contract-reference-integrity.yml
          .github/workflows/http-generic-api-fanout-relocation-apply.yml
          .github/workflows/http-generic-api-fanout-relocation.yml
          .github/workflows/repository-write-workflow-prerequisite-guard.yml
          .github/workflows/supervisor-runtime-assurance-alert.yml
          .github/workflows/supervisor-runtime-assurance.yml
          .specify/pipeline-connectivity-contract.json
          docs/runbooks/supervisor-runtime-assurance.md
          http-generic-api/scripts/pipeline-connectivity-check.mjs
          http-generic-api/test-fanout-relocation-ci.mjs
          http-generic-api/test-pipeline-connectivity-check.mjs
          http-generic-api/test-supervisor-runtime-assurance-automation.mjs
          FILES
          git diff --name-only "$EXPECTED_MAIN_SHA" "$EXPECTED_HEAD_SHA" > "$REPORT_DIR/actual-files.txt"
          diff -u "$REPORT_DIR/expected-files.txt" "$REPORT_DIR/actual-files.txt"
          test "$(wc -l < "$REPORT_DIR/actual-files.txt")" -eq 13
          git diff --name-status "$EXPECTED_MAIN_SHA" "$EXPECTED_HEAD_SHA" > "$REPORT_DIR/changes.tsv"

          test "$(git rev-parse "$EXPECTED_HEAD_SHA:.changes/e2e/repository-write-workflow-prerequisites.json")" = '396051ce2761653ef290ea3b470d00fb6b507300'
          test "$(git rev-parse "$EXPECTED_HEAD_SHA:.github/workflows/e2e-contract-reference-integrity.yml")" = 'a8de68b97820dc2d971d62c40edd82f7f2931a2a'
          test "$(git rev-parse "$EXPECTED_HEAD_SHA:.github/workflows/http-generic-api-fanout-relocation-apply.yml")" = '117af13e8fb26c3b4f61df99cfe11f2ba1156d84'
          test "$(git rev-parse "$EXPECTED_HEAD_SHA:.github/workflows/http-generic-api-fanout-relocation.yml")" = 'ecc63915c44e4f73854868814fb7f33c4eb63e02'
          test "$(git rev-parse "$EXPECTED_HEAD_SHA:.github/workflows/repository-write-workflow-prerequisite-guard.yml")" = '3cdbcbb27935a2f45f1c1e2a0497c204b2625d2f'
          test "$(git rev-parse "$EXPECTED_HEAD_SHA:.github/workflows/supervisor-runtime-assurance-alert.yml")" = 'f86c2d9a91c8e7a665fbd94ab050a761b0e31e9c'
          test "$(git rev-parse "$EXPECTED_HEAD_SHA:.github/workflows/supervisor-runtime-assurance.yml")" = '1dbbacb29572783eac1dc6502f7cf5f70eec1219'
          test "$(git rev-parse "$EXPECTED_HEAD_SHA:.specify/pipeline-connectivity-contract.json")" = '486cf6fbc709382893566054243fc37af52ca2ef'
          test "$(git rev-parse "$EXPECTED_HEAD_SHA:docs/runbooks/supervisor-runtime-assurance.md")" = '3a0d431c92615bba1efe460b97c2c1155953caa9'
          test "$(git rev-parse "$EXPECTED_HEAD_SHA:http-generic-api/scripts/pipeline-connectivity-check.mjs")" = '0e99af7b4aaf8789a4d7d4fa3ec41f2d3ce3cd64'
          test "$(git rev-parse "$EXPECTED_HEAD_SHA:http-generic-api/test-fanout-relocation-ci.mjs")" = 'bc572739103dca3655c80e10711dd677cebd1dcb'
          test "$(git rev-parse "$EXPECTED_HEAD_SHA:http-generic-api/test-pipeline-connectivity-check.mjs")" = '4384af5bc05277a3769915988ed3ea31684d340d'
          test "$(git rev-parse "$EXPECTED_HEAD_SHA:http-generic-api/test-supervisor-runtime-assurance-automation.mjs")" = '375cc8b154b1e96e046ac4433066bff1668b006f'

      - name: Install HTTP API dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Run canonical syntax and governance checks
        shell: bash
        run: |
          set -euo pipefail
          node --check http-generic-api/scripts/pipeline-connectivity-check.mjs
          node --check http-generic-api/test-pipeline-connectivity-check.mjs
          node --check http-generic-api/test-fanout-relocation-ci.mjs
          node --check http-generic-api/test-supervisor-runtime-assurance-automation.mjs
          node http-generic-api/scripts/schema-docs-change-guard.mjs
          node http-generic-api/scripts/migration-placement-guard.mjs
          node http-generic-api/scripts/user-jwt-auth-governance.mjs
          node http-generic-api/scripts/interruption-readiness.mjs --ci --skip-dependencies --skip-worktree
          node validate-canonical-sources.mjs
          node build-canonicals.mjs --check
          node --check find-canonical-domain.mjs
          (cd http-generic-api && node scripts/resource-api-coverage-audit.mjs --ci --changed)
          (cd http-generic-api && node test-resource-api-architecture.mjs && node test-resource-api-service.mjs)
          node http-generic-api/scripts/spec-kit-completion-gate.mjs --ci --changed
          node validate-memory-schema.mjs
          git diff --check

      - name: Run focused repository write-boundary regressions
        working-directory: http-generic-api
        run: |
          set -euo pipefail
          node test-pipeline-connectivity-check.mjs
          node test-fanout-relocation-ci.mjs
          node test-supervisor-runtime-assurance-automation.mjs

      - name: Run complete Unit and Integration suite with exact provenance
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          GITHUB_SHA="$EXPECTED_HEAD_SHA" TEST_SUITE_REPORT_DIR="$TEST_SUITE_REPORT_DIR" npm test

      - name: Verify exact Unit and Integration report provenance
        shell: bash
        run: |
          set -euo pipefail
          for report in \
            "$TEST_SUITE_REPORT_DIR/test-manifest.json" \
            "$TEST_SUITE_REPORT_DIR/test-suite.json"; do
            test -f "$report"
            test "$(jq -r '.status' "$report")" = 'passed'
            test "$(jq -r '.commitSha' "$report")" = "$EXPECTED_HEAD_SHA"
            test "$(jq -r '.firstFailure' "$report")" = 'null'
            test "$(jq -r '.secretsIncluded' "$report")" = 'false'
          done

      - name: Prove runtime startup and deployment evidence
        working-directory: http-generic-api
        env:
          FORCE_ROUTE_RUNTIME_TESTS: 'true'
          DEPLOYMENT_BRANCH: ${{ env.EXPECTED_HEAD_REF }}
          DEPLOYMENT_COMMIT_SHA: ${{ env.EXPECTED_HEAD_SHA }}
        run: |
          set -euo pipefail
          node test-deployment-manifest-generator.mjs
          npm run manifest:deployment
          node test-server-startup-smoke.mjs
          node test-hostinger-root-entrypoint.mjs
          node test-root-cause-activation-runtime-repair.mjs

      - name: Run changed-range Repository Tool Lifecycle
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs
          BASE_SHA="$EXPECTED_MAIN_SHA" CANDIDATE_SHA="$EXPECTED_HEAD_SHA" \
            node http-generic-api/scripts/maintenance-tools/repository-tool-lifecycle-guard.mjs \
              --changed-files "$REPORT_DIR/changes.tsv" \
              --policy .github/repository-maintenance-tool-governance.json \
              --output-dir "$REPORT_DIR/repository-tool-lifecycle"
          test "$(jq -r '.ok' "$REPORT_DIR/repository-tool-lifecycle/repository-tool-lifecycle-report.json")" = 'true'
          test "$(jq '.findings | length' "$REPORT_DIR/repository-tool-lifecycle/repository-tool-lifecycle-report.json")" -eq 0

      - name: Run changed-range E2E reference and Git-index integrity
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/test-e2e-contract-reference-integrity.mjs
          node http-generic-api/test-e2e-contract-git-index-integrity.mjs
          node http-generic-api/scripts/e2e-contract-reference-integrity.mjs \
            --base "$EXPECTED_MAIN_SHA" \
            --head "$EXPECTED_HEAD_SHA" \
            --report-file "$REPORT_DIR/e2e-contract-reference-integrity.json"
          node http-generic-api/scripts/e2e-contract-git-index-integrity.mjs \
            --report-file "$REPORT_DIR/e2e-contract-reference-integrity.json"

      - name: Install root dependencies and run Execution Resolver Gate
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test -- --runInBand

      - name: Run Architecture Drift Detection
        working-directory: http-generic-api
        run: npm run validate

      - name: Run exact E2E phase evaluation and execution
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/e2e-phase-governance.mjs check \
            --base "$EXPECTED_MAIN_SHA" \
            --head "$EXPECTED_HEAD_SHA" \
            --report-file "$REPORT_DIR/e2e-phase-evaluation.json"
          node http-generic-api/scripts/e2e-phase-governance.mjs run \
            --base "$EXPECTED_MAIN_SHA" \
            --head "$EXPECTED_HEAD_SHA" \
            --report-file "$REPORT_DIR/e2e-phase-evaluation-run.json" \
            --execution-report-file "$REPORT_DIR/e2e-phase-execution.json"

      - name: Publish exact no-secret summary
        if: always()
        shell: bash
        run: |
          mkdir -p "$REPORT_DIR"
          jq -n \
            --arg base_sha "$EXPECTED_MAIN_SHA" \
            --arg head_sha "$EXPECTED_HEAD_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg job_status "${{ job.status }}" \
            '{contract:"mad4b.exact-repository-write-prerequisite-arm-validation.v7",base_sha:$base_sha,head_sha:$head_sha,run_id:$run_id,job_status:$job_status,exact_one_commit_topology:true,changed_file_count:13,candidate_mutated:false,main_mutated:false,production_mutated:false,repository_write_executed:false,deployment_executed:false,provider_call_executed:false,credential_payload_read:false,sql_executed:false,migration_apply:false,database_mutated:false,work_map_publication_executed:false,external_send:false,secrets_included:false}' \
            > "$REPORT_DIR/summary.json"

      - name: Upload exact validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-repository-write-prerequisite-arm-validation-5899-${{ github.run_id }}
          path: |
            ${{ env.REPORT_DIR }}/
            ${{ env.TEST_SUITE_REPORT_DIR }}/*.json
          if-no-files-found: warn
          retention-days: 14
