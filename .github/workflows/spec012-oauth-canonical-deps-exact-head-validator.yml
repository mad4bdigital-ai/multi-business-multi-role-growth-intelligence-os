name: SSH Approval Guard Exact-Head Validator

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/spec012-oauth-canonical-deps-exact-head-validator.yml

permissions:
  contents: read

concurrency:
  group: ssh-approval-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-exact-product-head:
    if: github.event.pull_request.head.ref == 'gpt/validate-spec012-oauth-canonical-deps-38af9e94-20260804'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      EXPECTED_MAIN_SHA: 67cb77cffe94544b1b5d70997506afb4e75c3846
      EXPECTED_PRODUCT_SHA: 9f742d015b6668945126f07019e4e08b6a305210
      PRODUCT_BRANCH: fix/tenant-ssh-cli-approval-request-test-parity-67cb77cf-20260804
      VALIDATOR_PATH: .github/workflows/spec012-oauth-canonical-deps-exact-head-validator.yml
      PRODUCT_PATH: http-generic-api/test-tenant-ssh-cli-approval-request.mjs
    steps:
      - name: Checkout validator trigger
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable identities and validator-only trigger scope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git fetch --no-tags origin main "${PRODUCT_BRANCH}"
          actual_main="$(git rev-parse origin/main)"
          actual_product="$(git rev-parse "origin/${PRODUCT_BRANCH}")"
          test "${actual_main}" = "${EXPECTED_MAIN_SHA}"
          test "${actual_product}" = "${EXPECTED_PRODUCT_SHA}"
          mapfile -t validator_files < <(git diff --name-only "${EXPECTED_MAIN_SHA}...HEAD")
          test "${#validator_files[@]}" -eq 1
          test "${validator_files[0]}" = "${VALIDATOR_PATH}"
          {
            echo "validator_head=$(git rev-parse HEAD)"
            echo "main=${actual_main}"
            echo "product=${actual_product}"
            printf 'validator_file=%s\n' "${validator_files[0]}"
          } | tee evidence/identity.txt

      - name: Checkout exact product head
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "${EXPECTED_PRODUCT_SHA}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_PRODUCT_SHA}"
          mapfile -t product_files < <(git diff --name-only "${EXPECTED_MAIN_SHA}...${EXPECTED_PRODUCT_SHA}")
          test "${#product_files[@]}" -eq 1
          test "${product_files[0]}" = "${PRODUCT_PATH}"
          git diff --check "${EXPECTED_MAIN_SHA}...${EXPECTED_PRODUCT_SHA}"
          git diff --stat "${EXPECTED_MAIN_SHA}...${EXPECTED_PRODUCT_SHA}" | tee evidence/product-scope.txt
          git diff "${EXPECTED_MAIN_SHA}...${EXPECTED_PRODUCT_SHA}" -- "${PRODUCT_PATH}" > evidence/product.patch

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install locked dependencies
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee ../evidence/npm-ci.log

      - name: Verify syntax and focused governed SSH approval contracts
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          node --check test-tenant-ssh-cli-approval-request.mjs 2>&1 | tee ../evidence/approval-request-syntax.log
          node test-tenant-ssh-cli-approval-request.mjs 2>&1 | tee ../evidence/approval-request.log
          node test-tenant-ssh-cli-approval-decision.mjs 2>&1 | tee ../evidence/approval-decision.log

      - name: Run complete HTTP Generic API manifest
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee ../evidence/http-generic-api-manifest.log

      - name: Record bounded completion evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "expected_main=${EXPECTED_MAIN_SHA}"
            echo "expected_product=${EXPECTED_PRODUCT_SHA}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_job=${GITHUB_JOB}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "secrets_included=false"
            echo "repository_mutation=false"
            echo "production_action=false"
            echo "provider_action=false"
            echo "database_mutation=false"
          } > evidence/summary.txt

      - name: Upload no-secret validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssh-approval-guard-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
