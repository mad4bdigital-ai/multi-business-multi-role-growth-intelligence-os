name: Work Map Autofix Full Failure Set Writer

on:
  pull_request:
    branches:
      - gpt/exact-phase-g-schema-arm-base-20260803
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write

concurrency:
  group: work-map-autofix-full-failure-writer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish complete Work Map validation diagnostics
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/work-map-autofix-full-failure-set-20260804'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      EXPECTED_MAIN_SHA: 773179a2dee3523c8af25262475ac83b92e46f21
      TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SCRIPT_COMMIT_SHA: 61e37a39e648f26259545d56da30f7873ca909ae
      SCRIPT_BRANCH: gpt/exact-phase-g-schema-arm-base-20260803
      TARGET_BRANCH: gpt/work-map-autofix-full-failure-set-20260804
      TRIGGER_MARKER: .github/arm-markers/work-map-full-failure-writer-trigger.txt
      DIAGNOSTIC_ROOT: ${{ runner.temp }}/work-map-full-failure-writer-${{ github.run_id }}
    steps:
      - name: Checkout exact triggered feature head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify immutable identity and marker-only trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_HEAD_SHA}"
          test "$(git merge-base "${EXPECTED_MAIN_SHA}" "${TARGET_HEAD_SHA}")" = "${EXPECTED_MAIN_SHA}"
          git diff --name-only "${EXPECTED_MAIN_SHA}" "${TARGET_HEAD_SHA}" | LC_ALL=C sort > /tmp/trigger-files.txt
          printf '%s\n' "${TRIGGER_MARKER}" > /tmp/expected-trigger-files.txt
          diff -u /tmp/expected-trigger-files.txt /tmp/trigger-files.txt
          test -f "${TRIGGER_MARKER}"
          test -z "$(git status --porcelain)"
          test "$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${TARGET_HEAD_SHA}"
          mkdir -p "${DIAGNOSTIC_ROOT}"

      - name: Load immutable transformer from ARM base
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${SCRIPT_BRANCH}:refs/remotes/origin/${SCRIPT_BRANCH}"
          git merge-base --is-ancestor "${SCRIPT_COMMIT_SHA}" "refs/remotes/origin/${SCRIPT_BRANCH}"
          git cat-file -e "${SCRIPT_COMMIT_SHA}^{commit}"
          git show "${SCRIPT_COMMIT_SHA}:.github/scripts/apply-work-map-full-failure-set.py" > /tmp/apply-work-map-full-failure-set.py
          python -m py_compile /tmp/apply-work-map-full-failure-set.py

      - name: Apply bounded transformation and remove trigger marker
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/apply-work-map-full-failure-set.py
          rm "${TRIGGER_MARKER}"
          git diff --name-only "${EXPECTED_MAIN_SHA}" | LC_ALL=C sort > "${DIAGNOSTIC_ROOT}/actual-files.txt"
          cat > "${DIAGNOSTIC_ROOT}/expected-files.txt" <<'EOF'
          .changes/e2e/work-map-autofix-validation-diagnostics.json
          .github/workflows/spec-kit-work-map-autofix.yml
          http-generic-api/test-work-map-autofix-validation-diagnostics.mjs
          EOF
          LC_ALL=C sort -o "${DIAGNOSTIC_ROOT}/expected-files.txt" "${DIAGNOSTIC_ROOT}/expected-files.txt"
          diff -u "${DIAGNOSTIC_ROOT}/expected-files.txt" "${DIAGNOSTIC_ROOT}/actual-files.txt"
          test -z "$(git status --porcelain | awk '{print $2}' | grep -Ev '^(.changes/e2e/work-map-autofix-validation-diagnostics.json|.github/workflows/spec-kit-work-map-autofix.yml|http-generic-api/test-work-map-autofix-validation-diagnostics.mjs|.github/arm-markers/work-map-full-failure-writer-trigger.txt)$' || true)"
          git diff --stat "${EXPECTED_MAIN_SHA}" > "${DIAGNOSTIC_ROOT}/diff-stat.txt"

      - name: Run every validation and capture results
        shell: bash
        run: |
          set -uo pipefail
          results="${DIAGNOSTIC_ROOT}/validation-results.tsv"
          : > "${results}"

          run_check() {
            local name="$1"
            shift
            local log="${DIAGNOSTIC_ROOT}/${name}.log"
            set +e
            "$@" >"${log}" 2>&1
            local status=$?
            set -e
            printf '%s\t%s\t%s\n' "${name}" "${status}" "${log##*/}" >> "${results}"
            cat "${log}"
          }

          run_check git-diff-check git diff --check "${EXPECTED_MAIN_SHA}"
          run_check workflow-yaml ruby -e 'require "yaml"; YAML.load_file(ARGV[0], aliases: true)' .github/workflows/spec-kit-work-map-autofix.yml
          run_check diagnostics-regression node http-generic-api/test-work-map-autofix-validation-diagnostics.mjs
          run_check e2e-json node -e "JSON.parse(require('fs').readFileSync('.changes/e2e/work-map-autofix-validation-diagnostics.json','utf8'))"
          run_check e2e-reference-integrity node http-generic-api/scripts/validate-e2e-contract-references.mjs
          run_check e2e-phase-contracts node http-generic-api/scripts/validate-e2e-phase-contracts.mjs
          run_check marker-failure-tsv grep -q 'failed-validation-contracts.tsv' .github/workflows/spec-kit-work-map-autofix.yml
          run_check marker-aggregate-text grep -q 'All validation contracts were evaluated before this fail-closed gate stopped generation' .github/workflows/spec-kit-work-map-autofix.yml
          run_check marker-failure-count grep -q 'failed_validation_contracts_count' .github/workflows/spec-kit-work-map-autofix.yml
          run_check marker-failure-set grep -q 'failed_validation_contracts' .github/workflows/spec-kit-work-map-autofix.yml

          {
            printf 'check\texit_code\tlog\n'
            cat "${results}"
          } > "${DIAGNOSTIC_ROOT}/validation-summary.tsv"
          cat "${DIAGNOSTIC_ROOT}/validation-summary.tsv"

      - name: Upload bounded validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-map-full-failure-writer-${{ github.run_id }}
          path: ${{ runner.temp }}/work-map-full-failure-writer-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14

      - name: Enforce validation success
        shell: bash
        run: |
          set -euo pipefail
          test -s "${DIAGNOSTIC_ROOT}/validation-results.tsv"
          awk -F '\t' '$2 != "0" { print; failed=1 } END { exit failed ? 1 : 0 }' "${DIAGNOSTIC_ROOT}/validation-results.tsv"

      - name: Commit final three-file patch and push without force
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${TARGET_HEAD_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .changes/e2e/work-map-autofix-validation-diagnostics.json .github/workflows/spec-kit-work-map-autofix.yml http-generic-api/test-work-map-autofix-validation-diagnostics.mjs
          git add -u -- "${TRIGGER_MARKER}"
          git commit -m "ci(work-maps): persist complete validation failure set"
          new_head="$(git rev-parse HEAD)"
          git diff --name-only "${EXPECTED_MAIN_SHA}" "${new_head}" | LC_ALL=C sort > /tmp/final-files.txt
          diff -u "${DIAGNOSTIC_ROOT}/expected-files.txt" /tmp/final-files.txt
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          test "$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${new_head}"
