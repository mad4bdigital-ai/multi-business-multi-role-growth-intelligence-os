name: Derived State Main Convergence Publisher
run-name: Derived State Main Convergence Publisher · source ${{ github.event.workflow_run.id }}

on:
  workflow_run:
    workflows:
      - Governed Generated Artifact Refresh
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: derived-state-main-convergence-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish governed exact-main convergence PR
    if: >-
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      MAIN_CONVERGENCE_CONTRACT: mad4b.derived-state-main-convergence.v1
    steps:
      - name: Read exact governed writer evidence
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report_dir="${RUNNER_TEMP}/derived-state-main-convergence"
          rm -rf "$report_dir"
          mkdir -p "$report_dir/writer"
          echo "REPORT_DIR=$report_dir" >> "$GITHUB_ENV"

          source_run_file="$report_dir/source-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > "$source_run_file"
          test "$(jq -r '.path' "$source_run_file")" = ".github/workflows/governed-generated-artifact-refresh.yml"
          test "$(jq -r '.event' "$source_run_file")" = "workflow_dispatch"
          test "$(jq -r '.head_branch' "$source_run_file")" = "main"
          test "$(jq -r '.conclusion' "$source_run_file")" = "success"

          artifacts_file="$report_dir/artifacts.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" > "$artifacts_file"
          expected_name="governed-generated-artifact-refresh-${SOURCE_RUN_ID}"
          artifact_count="$(jq --arg name "$expected_name" '[.artifacts[] | select(.name == $name and .expired == false)] | length' "$artifacts_file")"
          if [[ "$artifact_count" != "1" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "reason=writer_artifact_not_unique" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          artifact_id="$(jq -r --arg name "$expected_name" '[.artifacts[] | select(.name == $name and .expired == false)][0].id' "$artifacts_file")"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$report_dir/writer.zip"
          unzip -q "$report_dir/writer.zip" -d "$report_dir/writer"

          preflight="$report_dir/writer/generated-artifact-refresh-preflight.json"
          report="$report_dir/writer/generated-artifact-refresh-report.json"
          test -f "$preflight"
          test -f "$report"
          test "$(jq -r '.contract' "$preflight")" = "mad4b.generated-artifact-refresh-preflight.v1"
          test "$(jq -r '.contract' "$report")" = "mad4b.governed-generated-artifact-refresh.v1"
          test "$(jq -r '.outcome' "$report")" = "passed"
          test "$(jq -r '.create_from_main' "$preflight")" = "true"
          test "$(jq -r '.remote_write_executed' "$preflight")" = "false"
          test "$(jq -r '.secrets_included' "$preflight")" = "false"
          test "$(jq -r '.mutation.force_push' "$report")" = "false"
          test "$(jq -r '.authority.mode' "$report")" = "trusted_generated_artifact_writer"

          recipe="$(jq -r '.recipe' "$report")"
          requested_recipe="$(jq -r '.recipe' "$preflight")"
          test "$recipe" = "$requested_recipe"
          target_ref="$(jq -r '.target_ref' "$report")"
          expected_head_sha="$(jq -r '.expected_head_sha' "$report")"
          source_main_sha="$(jq -r '.source_main_sha // empty' "$preflight")"
          result_head_sha="$(jq -r '.result_head_sha' "$report")"
          [[ "$target_ref" =~ ^chore/repository-inventory-main-sync-[0-9a-f]{12}$ ]]
          [[ "$expected_head_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$source_main_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$result_head_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$expected_head_sha" = "$source_main_sha"

          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main_sha" != "$source_main_sha" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "reason=source_main_moved" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          remote_target_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${target_ref}" --jq '.object.sha')"
          test "$remote_target_sha" = "$result_head_sha"

          compare_file="$report_dir/main-comparison.json"
          gh api "repos/${GITHUB_REPOSITORY}/compare/${source_main_sha}...${result_head_sha}" > "$compare_file"
          test "$(jq -r '.behind_by' "$compare_file")" = "0"
          ahead_by="$(jq -r '.ahead_by' "$compare_file")"
          [[ "$ahead_by" =~ ^[1-9][0-9]*$ ]]

          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "reason=exact_main_convergence_writer_proven" >> "$GITHUB_OUTPUT"
          echo "recipe=$recipe" >> "$GITHUB_OUTPUT"
          echo "target_ref=$target_ref" >> "$GITHUB_OUTPUT"
          echo "source_main_sha=$source_main_sha" >> "$GITHUB_OUTPUT"
          echo "result_head_sha=$result_head_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted source-main policy
        if: steps.source.outputs.eligible == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.source.outputs.source_main_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove bounded convergence write set
        id: scope
        if: steps.source.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RECIPE: ${{ steps.source.outputs.recipe }}
          SOURCE_MAIN_SHA: ${{ steps.source.outputs.source_main_sha }}
          RESULT_HEAD_SHA: ${{ steps.source.outputs.result_head_sha }}
        run: |
          set -euo pipefail
          registry=".github/derived-state-governance.json"
          test "$(jq -r '.contract' "$registry")" = "mad4b.repository-derived-state-governance.v1"
          jq -e --arg recipe "$RECIPE" '.convergence.post_merge_publishable_recipes | index($recipe) != null' "$registry" >/dev/null

          allowed="${RUNNER_TEMP}/derived-state-main-convergence-allowed.txt"
          actual="${RUNNER_TEMP}/derived-state-main-convergence-actual.txt"
          jq -r --arg recipe "$RECIPE" '.artifacts[] | select(.recipe == $recipe) | .outputs[]' "$registry" | sort -u > "$allowed"
          gh api "repos/${GITHUB_REPOSITORY}/compare/${SOURCE_MAIN_SHA}...${RESULT_HEAD_SHA}" \
            --jq '.files[].filename' | sort -u > "$actual"
          test -s "$actual"
          unexpected="$(comm -23 "$actual" "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "::error::Post-merge convergence branch exceeds registered recipe outputs:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          changed_count="$(wc -l < "$actual" | tr -d '[:space:]')"
          echo "changed_count=$changed_count" >> "$GITHUB_OUTPUT"

      - name: Create or reuse exact convergence pull request
        id: pr
        if: steps.scope.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REPO_AUTOSYNC_TOKEN || github.token }}
          TARGET_REF: ${{ steps.source.outputs.target_ref }}
          SOURCE_MAIN_SHA: ${{ steps.source.outputs.source_main_sha }}
          RESULT_HEAD_SHA: ${{ steps.source.outputs.result_head_sha }}
          RECIPE: ${{ steps.source.outputs.recipe }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$SOURCE_MAIN_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_REF}" --jq '.object.sha')" = "$RESULT_HEAD_SHA"

          prs_file="${REPORT_DIR}/existing-prs.json"
          gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open -f base=main -f head="${GITHUB_REPOSITORY_OWNER}:${TARGET_REF}" -f per_page=2 > "$prs_file"
          pr_count="$(jq 'length' "$prs_file")"
          if [[ "$pr_count" = "0" ]]; then
            body="<!-- derived-state-main-convergence:source=${SOURCE_MAIN_SHA} recipe=${RECIPE} writer_run=${SOURCE_RUN_ID} -->"$'\n\n'"Automated governed convergence PR produced from exact main \`${SOURCE_MAIN_SHA}\` by the registered \`${RECIPE}\` writer. Derived State Closure must converge on the exact merge candidate before guarded auto-merge can be registered."
            pr_url="$(gh pr create \
              --base main \
              --head "$TARGET_REF" \
              --title "chore(derived-state): converge ${RECIPE} from ${SOURCE_MAIN_SHA:0:12}" \
              --body "$body")"
            pr_number="${pr_url##*/}"
          elif [[ "$pr_count" = "1" ]]; then
            pr_number="$(jq -r '.[0].number' "$prs_file")"
          else
            echo "::error::More than one open PR targets the same convergence branch."
            exit 1
          fi
          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]

          pr_readback="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
          test "$(jq -r '.state' <<<"$pr_readback")" = "open"
          test "$(jq -r '.base.ref' <<<"$pr_readback")" = "main"
          test "$(jq -r '.head.repo.full_name' <<<"$pr_readback")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.head.ref' <<<"$pr_readback")" = "$TARGET_REF"
          test "$(jq -r '.head.sha' <<<"$pr_readback")" = "$RESULT_HEAD_SHA"

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Publish main-convergence provenance receipt
        if: steps.pr.outputs.pr_number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          TARGET_REF: ${{ steps.source.outputs.target_ref }}
          SOURCE_MAIN_SHA: ${{ steps.source.outputs.source_main_sha }}
          RESULT_HEAD_SHA: ${{ steps.source.outputs.result_head_sha }}
          RECIPE: ${{ steps.source.outputs.recipe }}
          CHANGED_COUNT: ${{ steps.scope.outputs.changed_count }}
        run: |
          set -euo pipefail
          comments="${RUNNER_TEMP}/derived-state-main-convergence-comments.json"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" > "$comments"
          existing="$(jq --arg run "$SOURCE_RUN_ID" --arg contract "$MAIN_CONVERGENCE_CONTRACT" '
            [ .[] | select(
                .user.login == "github-actions[bot]" and
                (.body | startswith("DERIVED_STATE_MAIN_CONVERGENCE contract=" + $contract + " ")) and
                (.body | contains("source_writer_run_id=" + $run + " "))
              )
            ] | length
          ' "$comments")"
          if (( existing == 0 )); then
            receipt="DERIVED_STATE_MAIN_CONVERGENCE contract=${MAIN_CONVERGENCE_CONTRACT} state=published source_writer_run_id=${SOURCE_RUN_ID} pr_number=${PR_NUMBER} target_ref=${TARGET_REF} base_sha=${SOURCE_MAIN_SHA} head_sha=${RESULT_HEAD_SHA} recipe=${RECIPE} changed_files=${CHANGED_COUNT} protected_branch_mutation=false force_push=false"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$receipt" >/dev/null
            echo "$receipt" >> "$GITHUB_STEP_SUMMARY"
          fi
