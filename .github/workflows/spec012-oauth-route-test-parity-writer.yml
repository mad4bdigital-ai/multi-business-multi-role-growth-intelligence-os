name: Spec 012 OAuth Route Test Parity Writer

on:
  pull_request:
    branches:
      - gpt/exact-phase-g-schema-arm-base-20260803
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write

concurrency:
  group: spec012-oauth-injection-product-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish exact OAuth request-injection repair
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/spec012-oauth-request-injection-fix-a61cd9e8-v1' &&
      github.event.pull_request.head.sha == 'e37d926a60bfe7cbca4a2968c99d039523a886ce'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      EXPECTED_MAIN_SHA: a61cd9e83070618001676bbc679bc937f0551875
      EXPECTED_HEAD_SHA: e37d926a60bfe7cbca4a2968c99d039523a886ce
      TARGET_BRANCH: gpt/spec012-oauth-request-injection-fix-a61cd9e8-v1
      MARKER_PATH: .github/validation/spec012-oauth-request-injection-writer.txt
      SCRIPT_BRANCH: gpt/exact-phase-g-schema-arm-base-20260803
      SCRIPT_COMMIT_SHA: b3eed7a469070fb1abf3a156a59bb774458a1227
    steps:
      - name: Checkout exact marker head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Verify immutable baseline and load repair
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_ROOT="${RUNNER_TEMP}/spec012-oauth-product-${GITHUB_RUN_ID}"
          printf 'EVIDENCE_ROOT=%s\n' "${EVIDENCE_ROOT}" >> "${GITHUB_ENV}"
          mkdir -p "${EVIDENCE_ROOT}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_MAIN_SHA}"
          test -f "${MARKER_PATH}"
          test "$(git diff --name-only "${EXPECTED_MAIN_SHA}" "${EXPECTED_HEAD_SHA}" | wc -l | tr -d ' ')" = "1"
          test "$(git diff --name-only "${EXPECTED_MAIN_SHA}" "${EXPECTED_HEAD_SHA}")" = "${MARKER_PATH}"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main" "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}" "+refs/heads/${SCRIPT_BRANCH}:refs/remotes/origin/${SCRIPT_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "${EXPECTED_MAIN_SHA}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "${EXPECTED_HEAD_SHA}"
          git merge-base --is-ancestor "${SCRIPT_COMMIT_SHA}" "refs/remotes/origin/${SCRIPT_BRANCH}"
          git show "${SCRIPT_COMMIT_SHA}:.github/scripts/apply-spec012-oauth-request-injection-repair.py" > /tmp/apply-spec012-oauth-request-injection-repair.py
          python -m py_compile /tmp/apply-spec012-oauth-request-injection-repair.py
          npm ci --prefix http-generic-api

      - name: Apply exact bounded repair
        shell: bash
        run: |
          set -euo pipefail
          rm -- "${MARKER_PATH}"
          python /tmp/apply-spec012-oauth-request-injection-repair.py
          cat > /tmp/expected-files.txt <<'EOF'
          http-generic-api/routes/index.js
          http-generic-api/test-auth-oauth-routes.mjs
          http-generic-api/test-spec012-t031-oauth-token-route-wiring.mjs
          EOF
          LC_ALL=C sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          git diff --name-only "${EXPECTED_MAIN_SHA}" | LC_ALL=C sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          git diff --check "${EXPECTED_MAIN_SHA}"
          cp /tmp/actual-files.txt "${EVIDENCE_ROOT}/changed-files.txt"
          git diff --stat "${EXPECTED_MAIN_SHA}" > "${EVIDENCE_ROOT}/diff-stat.txt"

      - name: Run focused and complete validations
        shell: bash
        run: |
          set -euo pipefail
          node --check http-generic-api/routes/index.js 2>&1 | tee "${EVIDENCE_ROOT}/route-index-syntax.log"
          node http-generic-api/test-tenant-gpt-oauth-token-exchange-routes.mjs 2>&1 | tee "${EVIDENCE_ROOT}/token-route.log"
          node http-generic-api/test-auth-oauth-routes.mjs 2>&1 | tee "${EVIDENCE_ROOT}/auth-oauth-integration.log"
          node http-generic-api/test-spec012-t031-oauth-token-route-wiring.mjs 2>&1 | tee "${EVIDENCE_ROOT}/route-wiring.log"
          npm --prefix http-generic-api run test:manifest 2>&1 | tee "${EVIDENCE_ROOT}/test-manifest.log"

      - name: Upload bounded product evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec012-oauth-product-${{ github.run_id }}
          path: ${{ runner.temp }}/spec012-oauth-product-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14

      - name: Commit exact product repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- "${MARKER_PATH}" http-generic-api/routes/index.js http-generic-api/test-auth-oauth-routes.mjs http-generic-api/test-spec012-t031-oauth-token-route-wiring.mjs
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "4"
          git commit -m 'fix(spec-012): restore OAuth request injection parity'

      - name: Push without force after final compare-and-swap
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main" "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "${EXPECTED_MAIN_SHA}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "${EXPECTED_HEAD_SHA}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$(git rev-parse HEAD)"
