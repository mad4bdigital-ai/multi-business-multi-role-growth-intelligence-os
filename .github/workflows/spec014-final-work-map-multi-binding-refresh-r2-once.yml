name: Spec 014 Final Work Map Multi-Binding Refresh R2 Once

on:
  push:
    branches:
      - chore/spec014-wave1-runtime-evidence-cleanup-20260804
    paths:
      - .github/workflows/spec014-final-work-map-multi-binding-refresh-r2-once.yml

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: spec014-final-work-map-multi-binding-refresh-r2-once
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh exact-head Spec 014 Work Map bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_BRANCH: chore/spec014-wave1-runtime-evidence-cleanup-20260804
      TARGET_PR: '6314'
      WORKFLOW_PATH: .github/workflows/spec014-final-work-map-multi-binding-refresh-r2-once.yml
      HOSTINGER_MANIFEST: specs/014-governed-hostinger-storage-orchestration/work-map-integration.json
      HOSTINGER_TASKS: specs/014-governed-hostinger-storage-orchestration/tasks.md
      RETAIL_MANIFEST: specs/014-retail-commerce-operations-growth-os/work-map-integration.json
    steps:
      - name: Initialize bounded evidence after runner allocation
        shell: bash
        run: |
          set -euo pipefail
          report_dir="${RUNNER_TEMP}/spec014-final-work-map-multi-binding-refresh-r2"
          rm -rf "${report_dir}"
          mkdir -p "${report_dir}"
          echo "REPORT_DIR=${report_dir}" >> "${GITHUB_ENV}"
          printf '%s\n' 'r2-governance-readback-corrected' > "${report_dir}/initialization.txt"

      - name: Checkout exact triggering head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Validate exact candidate and contracts
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}"
          test "${TARGET_BRANCH}" != "main"
          test "${TARGET_BRANCH}" != "Production"
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          remote_head="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${GITHUB_SHA}"
          for file in "${WORKFLOW_PATH}" "${HOSTINGER_MANIFEST}" "${HOSTINGER_TASKS}" "${RETAIL_MANIFEST}"; do
            test -f "${file}"
          done
          node --check http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs
          node --check http-generic-api/scripts/spec014-final-work-map-readback.mjs
          node --check http-generic-api/scripts/spec-kit-work-map-governance-gate.mjs
          printf '%s\n' "${GITHUB_SHA}" > "${REPORT_DIR}/expected-head.txt"

      - name: Build deterministic Retail binding refresher
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/refresh-retail-work-map-binding.mjs" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';

          const root = process.cwd();
          const governance = await import(pathToFileURL(path.join(root, 'http-generic-api/scripts/spec-kit-work-map-governance-gate.mjs')));
          const classificationModule = await import(pathToFileURL(path.join(root, 'http-generic-api/scripts/work-map-schema-classification.mjs')));
          const { effectiveRegistry } = governance.buildEffectiveWorkMapRegistry({ root });
          const classification = classificationModule.validateSchemaClassification({ root });

          if (!classification.ok || classification.unresolved.length !== 0 || classification.classification_coverage_percent !== 100) {
            throw new Error(`Schema classification is not ready: ${JSON.stringify(classification.findings)}`);
          }
          if (effectiveRegistry.maps.length !== 19 || effectiveRegistry.domains.length !== 16) {
            throw new Error(`Unexpected registry shape: maps=${effectiveRegistry.maps.length}, domains=${effectiveRegistry.domains.length}`);
          }
          if (effectiveRegistry.uncategorized_objects.length !== 0 || effectiveRegistry.taxonomy_gap_clusters.length !== 0) {
            throw new Error('Work Map registry contains unresolved objects or taxonomy gaps');
          }

          const manifestPath = path.join(root, process.env.RETAIL_MANIFEST);
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          if (manifest.feature_key !== '014-retail-commerce-operations-growth-os' || manifest.review_state !== 'ready_for_implementation') {
            throw new Error('Retail manifest is not eligible for deterministic refresh');
          }
          const previousRegistry = { ...(manifest.registry || {}) };
          manifest.registry = {
            fingerprint: effectiveRegistry.fingerprint,
            index_source_hash: effectiveRegistry.signature.index_source_hash,
            coverage_source_hash: effectiveRegistry.signature.coverage_source_hash,
            map_count: effectiveRegistry.maps.length,
            domain_count: effectiveRegistry.domains.length,
            uncategorized_count: effectiveRegistry.uncategorized_objects.length,
            taxonomy_gap_cluster_count: effectiveRegistry.taxonomy_gap_clusters.length,
          };
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          console.log(JSON.stringify({
            ok: true,
            contract: 'mad4b.spec014-retail-final-work-map-binding-refresh.v1',
            feature_key: manifest.feature_key,
            changed_files: [process.env.RETAIL_MANIFEST],
            previous_registry: previousRegistry,
            current_registry: manifest.registry,
            classification_coverage_percent: classification.classification_coverage_percent,
            unresolved_schema_objects: classification.unresolved.length,
            repository_mutation_scope: 'candidate_branch_only',
            provider_dispatch: false,
            live_database_access: false,
            migration_apply: false,
            secrets_included: false
          }, null, 2));
          NODE
          node --check "${RUNNER_TEMP}/refresh-retail-work-map-binding.mjs"

      - name: Run official and companion deterministic refreshers
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs | tee "${REPORT_DIR}/hostinger-generator-first.json"
          node "${RUNNER_TEMP}/refresh-retail-work-map-binding.mjs" | tee "${REPORT_DIR}/retail-generator-first.json"
          first_diff_hash="$(git diff --binary -- "${HOSTINGER_MANIFEST}" "${HOSTINGER_TASKS}" "${RETAIL_MANIFEST}" | sha256sum | awk '{print $1}')"
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs | tee "${REPORT_DIR}/hostinger-generator-second.json"
          node "${RUNNER_TEMP}/refresh-retail-work-map-binding.mjs" | tee "${REPORT_DIR}/retail-generator-second.json"
          second_diff_hash="$(git diff --binary -- "${HOSTINGER_MANIFEST}" "${HOSTINGER_TASKS}" "${RETAIL_MANIFEST}" | sha256sum | awk '{print $1}')"
          test "${first_diff_hash}" = "${second_diff_hash}"
          printf '%s\n' "${first_diff_hash}" > "${REPORT_DIR}/deterministic-diff-sha256.txt"

      - name: Enforce bounded write set and pre-commit readback
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            case "${file}" in
              "${HOSTINGER_MANIFEST}"|"${HOSTINGER_TASKS}"|"${RETAIL_MANIFEST}") ;;
              *) echo "Unexpected refresher write: ${file}" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only)
          test -n "$(git diff --name-only -- "${HOSTINGER_MANIFEST}")"
          test -n "$(git diff --name-only -- "${RETAIL_MANIFEST}")"
          git diff --check
          REPORT_PATH="${REPORT_DIR}/precommit-hostinger-readback.json" node http-generic-api/scripts/spec014-final-work-map-readback.mjs > "${REPORT_DIR}/precommit-hostinger-readback.stdout.json" 2> "${REPORT_DIR}/precommit-hostinger-readback.stderr.txt"
          set +e
          GITHUB_BASE_REF=main node http-generic-api/scripts/spec-kit-work-map-governance-gate.mjs --ci --changed > "${REPORT_DIR}/precommit-governance-gate.json" 2>&1
          governance_status=$?
          set -e
          cat "${REPORT_DIR}/precommit-governance-gate.json"
          test "${governance_status}" = '0'

      - name: Remove one-time workflow and commit bounded result
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git rm "${WORKFLOW_PATH}"
          git add -- "${HOSTINGER_MANIFEST}" "${HOSTINGER_TASKS}" "${RETAIL_MANIFEST}"
          while IFS= read -r file; do
            case "${file}" in
              "${WORKFLOW_PATH}"|"${HOSTINGER_MANIFEST}"|"${HOSTINGER_TASKS}"|"${RETAIL_MANIFEST}") ;;
              *) echo "Unexpected staged write: ${file}" >&2; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)
          git diff --cached --name-only > "${REPORT_DIR}/staged-files.txt"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(spec014): refresh final Work Map registry bindings'
          result_head="$(git rev-parse HEAD)"
          [[ "${result_head}" =~ ^[0-9a-f]{40}$ ]]
          REPORT_PATH="${REPORT_DIR}/postcommit-hostinger-readback.json" node http-generic-api/scripts/spec014-final-work-map-readback.mjs > "${REPORT_DIR}/postcommit-hostinger-readback.stdout.json" 2> "${REPORT_DIR}/postcommit-hostinger-readback.stderr.txt"
          GITHUB_BASE_REF=main node http-generic-api/scripts/spec-kit-work-map-governance-gate.mjs --ci --changed > "${REPORT_DIR}/postcommit-governance-gate.json" 2>&1
          remote_head="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${GITHUB_SHA}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          pushed_head="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${pushed_head}" = "${result_head}"
          test ! -e "${WORKFLOW_PATH}"
          printf '%s\n' "${result_head}" > "${REPORT_DIR}/result-head.txt"
          echo "result_head=${result_head}" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact-head verification
        if: steps.publish.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_HEAD: ${{ steps.publish.outputs.result_head }}
        run: |
          set -euo pipefail
          [[ "${RESULT_HEAD}" =~ ^[0-9a-f]{40}$ ]]
          remote_head="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${RESULT_HEAD}"
          gh workflow run ci.yml --ref "${TARGET_BRANCH}"
          gh workflow run spec-kit-work-map-integration.yml --ref "${TARGET_BRANCH}"
          gh workflow run hostinger-storage-final-work-map-readback-guard.yml --ref "${TARGET_BRANCH}"

      - name: Publish checkpoint to pull request
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_HEAD: ${{ steps.publish.outputs.result_head }}
        run: |
          set -euo pipefail
          outcome='success'
          if [[ "${{ job.status }}" != 'success' ]]; then outcome='failure'; fi
          body="SPEC014_FINAL_WORK_MAP_MULTI_BINDING_REFRESH_R2 outcome=${outcome} trigger_head=${GITHUB_SHA} result_head=${RESULT_HEAD:-unresolved} target_pr=${TARGET_PR} official_hostinger_generator=true retail_companion_refresh=true governance_gate=official_ci_changed protected_branch_mutation=false force_push=false runtime_provider_database_deployment_access=false secrets_included=false"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${TARGET_PR}/comments" -f body="${body}" >/dev/null

      - name: Write bounded execution summary
        if: always()
        shell: bash
        run: |
          report_dir="${REPORT_DIR:-${RUNNER_TEMP}/spec014-final-work-map-multi-binding-refresh-r2}"
          mkdir -p "${report_dir}"
          {
            echo '# Spec 014 Final Work Map Multi-Binding Refresh R2'
            echo
            echo "- Trigger head: \`${GITHUB_SHA}\`"
            echo "- Result head: \`${{ steps.publish.outputs.result_head || 'unresolved' }}\`"
            echo "- Target branch: \`${TARGET_BRANCH}\`"
            echo '- Hostinger generator: `spec014-refresh-final-work-map-binding.mjs`'
            echo '- Retail binding: deterministic companion using the same effective registry'
            echo '- Readback authority: `spec-kit-work-map-governance-gate.mjs --ci --changed`'
            echo '- Protected branch mutation: `false`'
            echo '- Force push: `false`'
            echo '- Runtime/provider/database/deployment access: `false`'
            echo '- Secrets included: `false`'
          } | tee "${report_dir}/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bounded refresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec014-final-work-map-multi-binding-refresh-r2-${{ github.run_id }}
          path: ${{ runner.temp }}/spec014-final-work-map-multi-binding-refresh-r2/
          if-no-files-found: warn
          retention-days: 30
