name: Temporary PR 6490 Registry Sync faa7cd34

on:
  push:
    branches:
      - gpt/pr-generated-artifact-runner-context-clean-main-840a3b6-20260806
    paths:
      - .github/workflows/tmp-pr6490-registry-sync-faa7cd34.yml

permissions:
  contents: write

concurrency:
  group: tmp-pr6490-registry-sync-faa7cd34
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact staging commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Validate exact branch and parent
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "gpt/pr-generated-artifact-runner-context-clean-main-840a3b6-20260806"
          test "$(git rev-parse HEAD^)" = "227a84fba9b028e1ceae43e37aca9fa7cfb339a0"
          remote_sha="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "${remote_sha}" = "${GITHUB_SHA}"

      - name: Update exact registry bindings
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const paths = [
            'specs/014-governed-hostinger-storage-orchestration/work-map-integration.json',
            'specs/014-retail-commerce-operations-growth-os/work-map-integration.json'
          ];
          const replacements = [
            ['204402e7d4ac5ceff4eec95b502e0b73f0218d7cc5bacd1c8198dc425c304ef7', 'd48f1abb27af79932a1a01c3d5c7caf93872b01c0542df45121241a050521ef5'],
            ['4c8cb6a26095cdc8d61f92aeaef7b1915d5f2de1cae336883df25a9d2d7de7dc', '5c544c8d91185340efd7a3022042263a959673043f0d0b8613840c6125ba518f'],
            ['e12cbc5ae9c4a743221ae6d33004741f492cd91c4ae2cbc82c05b7c3fd60537b', '7ece785e472b6c05d68a882a0532685775f89683324e33cad81c40cefeba7808']
          ];
          for (const path of paths) {
            let text = fs.readFileSync(path, 'utf8');
            for (const [oldValue, newValue] of replacements) {
              if (text.split(oldValue).length !== 2) throw new Error(`Unexpected binding ${oldValue} in ${path}`);
              text = text.replace(oldValue, newValue);
            }
            fs.writeFileSync(path, text);
          }
          NODE

      - name: Verify bounded diff and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-pr6490-registry-sync-faa7cd34.yml
          mapfile -t changed < <(git status --short | awk '{print $2}' | sort)
          expected=(
            .github/workflows/tmp-pr6490-registry-sync-faa7cd34.yml
            specs/014-governed-hostinger-storage-orchestration/work-map-integration.json
            specs/014-retail-commerce-operations-growth-os/work-map-integration.json
          )
          printf '%s\n' "${changed[@]}" > /tmp/changed.txt
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          node <<'NODE'
          const fs = require('node:fs');
          const expected = {
            fingerprint: 'd48f1abb27af79932a1a01c3d5c7caf93872b01c0542df45121241a050521ef5',
            index_source_hash: '5c544c8d91185340efd7a3022042263a959673043f0d0b8613840c6125ba518f',
            coverage_source_hash: '7ece785e472b6c05d68a882a0532685775f89683324e33cad81c40cefeba7808'
          };
          for (const path of [
            'specs/014-governed-hostinger-storage-orchestration/work-map-integration.json',
            'specs/014-retail-commerce-operations-growth-os/work-map-integration.json'
          ]) {
            const doc = JSON.parse(fs.readFileSync(path, 'utf8'));
            for (const [key, value] of Object.entries(expected)) {
              if (doc.registry[key] !== value) throw new Error(`${key} mismatch in ${path}`);
            }
          }
          NODE

      - name: Commit, push, and read back
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/014-governed-hostinger-storage-orchestration/work-map-integration.json \
                  specs/014-retail-commerce-operations-growth-os/work-map-integration.json \
                  .github/workflows/tmp-pr6490-registry-sync-faa7cd34.yml
          git commit -m 'chore(work-maps): sync registry bindings for main faa7cd34'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "${local_sha}" = "${remote_sha}"
