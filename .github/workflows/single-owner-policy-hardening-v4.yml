name: Single Owner Policy Hardening V4

on:
  push:
    branches: [fix/github-main-single-owner-policy-20260807]
    paths:
      - .github/workflows/single-owner-policy-hardening-v4.yml

permissions:
  actions: read
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/github-main-single-owner-policy-20260807
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json
      - name: Download validated seven-file base
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "8988288801"
        run: |
          set -euo pipefail
          rm -rf /tmp/so-input
          mkdir -p /tmp/so-input
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/so.zip
          unzip -q /tmp/so.zip -d /tmp/so-input
          (cd /tmp/so-input && sha256sum -c MANIFEST.sha256)
          test "$(find /tmp/so-input -type f ! -name MANIFEST.sha256 | wc -l)" -eq 7
          while IFS= read -r path; do
            mkdir -p "$(dirname "$path")"
            cp -- "/tmp/so-input/$path" "$path"
          done < <(cd /tmp/so-input && find . -type f ! -name MANIFEST.sha256 -printf '%P\n' | sort)
      - name: Apply pinned fail-closed hardening
        run: |
          set -euo pipefail
          git apply --check single-owner-hardening.patch
          git apply single-owner-hardening.patch
          git diff --check
      - name: Install API dependencies
        working-directory: http-generic-api
        run: npm ci
      - name: Controller syntax
        run: node --check http-generic-api/githubRepositoryPolicyController.js
      - name: Gate syntax
        run: node --check http-generic-api/scripts/single-owner-review-gate.mjs
      - name: Gate regression
        run: node http-generic-api/test-single-owner-review-gate.mjs
      - name: Controller regression
        run: node http-generic-api/test-github-repository-policy-controller.mjs
      - name: Repository automation facade regression
        run: node http-generic-api/test-repository-automation-policy-facade.mjs
      - name: Security invariants
        run: |
          set -euo pipefail
          grep -F 'collaborators?affiliation=all' http-generic-api/scripts/single-owner-review-gate.mjs
          ! grep -F 'collaborators?affiliation=direct' http-generic-api/scripts/single-owner-review-gate.mjs
          grep -F 'affiliation=all&per_page=100&page=${page}' http-generic-api/githubRepositoryPolicyController.js
          ! grep -F 'affiliation=direct' http-generic-api/githubRepositoryPolicyController.js
          grep -F 'collaborator_ownership_complete' http-generic-api/githubRepositoryPolicyController.js
          grep -F 'pull_request_target:' .github/workflows/single-owner-review-gate.yml
          ! grep -F '  pull_request:' .github/workflows/single-owner-review-gate.yml
          ! grep -F 'repository owner' http-generic-api/githubRepositoryPolicyController.js http-generic-api/migrations/1049_github_repository_policy_single_owner_mode.sql
          git diff --check
      - name: Package exact hardened seven-file patch
        run: |
          set -euo pipefail
          rm -rf hardened-patch
          mkdir hardened-patch
          cat > /tmp/expected <<'EOF'
          .changes/e2e/github-repository-policy-single-owner-mode.json
          .github/workflows/single-owner-review-gate.yml
          http-generic-api/githubRepositoryPolicyController.js
          http-generic-api/migrations/1049_github_repository_policy_single_owner_mode.sql
          http-generic-api/scripts/single-owner-review-gate.mjs
          http-generic-api/test-github-repository-policy-controller.mjs
          http-generic-api/test-single-owner-review-gate.mjs
          EOF
          sort -o /tmp/expected /tmp/expected
          while IFS= read -r path; do
            test -f "$path"
            mkdir -p "hardened-patch/$(dirname "$path")"
            cp -- "$path" "hardened-patch/$path"
          done < /tmp/expected
          (cd hardened-patch && find . -type f -print0 | sort -z | xargs -0 sha256sum > MANIFEST.sha256)
          test "$(find hardened-patch -type f ! -name MANIFEST.sha256 | wc -l)" -eq 7
      - name: Create Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > GIT_BLOBS.ndjson
          while IFS= read -r path; do
            encoded="$(base64 -w0 -- "hardened-patch/$path")"
            sha="$(gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/blobs" -f content="$encoded" -f encoding=base64 --jq .sha)"
            printf '{"path":"%s","sha":"%s"}\n' "$path" "$sha" >> GIT_BLOBS.ndjson
          done < <(find hardened-patch -type f ! -name MANIFEST.sha256 -printf '%P\n' | sort)
          test "$(wc -l < GIT_BLOBS.ndjson)" -eq 7
      - name: Upload hardened patch
        uses: actions/upload-artifact@v4
        with:
          name: single-owner-hardened-patch-v4-${{ github.sha }}
          path: hardened-patch
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - name: Upload blob map
        uses: actions/upload-artifact@v4
        with:
          name: single-owner-hardened-git-blobs-v4-${{ github.sha }}
          path: GIT_BLOBS.ndjson
          if-no-files-found: error
          retention-days: 3
