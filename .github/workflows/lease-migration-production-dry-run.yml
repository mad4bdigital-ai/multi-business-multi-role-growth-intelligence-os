name: Lease Migration Production Dry Run

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: lease-migration-production-dry-run
  cancel-in-progress: false

jobs:
  governed-production-dry-run:
    if: github.event.pull_request.head.ref == 'ops/lease-migration-production-dry-run-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out deployed Production source
        uses: actions/checkout@v5
        with:
          ref: Production
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Verify deployed runtime parity
        working-directory: http-generic-api
        env:
          RUNTIME_BASE_URL: https://auth.mad4b.com
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
          RUNTIME_PROFILE: queue_worker
          VERIFY_EXECUTION_LOG_ROW: 'false'
          ALLOW_ENVIRONMENT_ACCESS_BLOCKED: 'false'
        run: node verify-runtime.mjs

      - name: Dry-run and read back Lease registry migration
        env:
          RUNTIME_BASE_URL: https://auth.mad4b.com
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          const BASE = String(process.env.RUNTIME_BASE_URL || '').replace(/\/+$/, '');
          const KEY = String(process.env.BACKEND_API_KEY || '');
          const MIGRATION = '20260730_repository_reconciliation_lease_control_tool.sql';
          const CHECKSUM = 'fe79a8b77cbaf0aa73c46c1852354b85429482f1fa88ed9284919861bb858fdf';
          const STATEMENT_COUNT = 1;
          const RETRYABLE_STATUS = new Set([429, 502, 503, 504, 520]);

          assert.equal(BASE, 'https://auth.mad4b.com');
          assert.ok(KEY, 'BACKEND_API_KEY is required');

          const sensitiveKey = /(password|secret|token|authorization|cookie|api[_-]?key|credential|private[_-]?key|refresh[_-]?token|access[_-]?token)/i;
          function sanitize(value) {
            if (Array.isArray(value)) return value.map(sanitize);
            if (!value || typeof value !== 'object') return value;
            return Object.fromEntries(Object.entries(value).map(([key, child]) => [
              key,
              sensitiveKey.test(key) ? '[redacted]' : sanitize(child),
            ]));
          }

          function parsedValue(value) {
            if (typeof value !== 'string') return value;
            const text = value.trim();
            if (!text || (!text.startsWith('{') && !text.startsWith('['))) return value;
            try { return JSON.parse(text); } catch { return value; }
          }

          function findObjectWithKey(value, key, seen = new Set()) {
            value = parsedValue(value);
            if (!value || typeof value !== 'object' || seen.has(value)) return null;
            seen.add(value);
            if (Object.prototype.hasOwnProperty.call(value, key)) return value;
            for (const child of Object.values(value)) {
              const found = findObjectWithKey(child, key, seen);
              if (found) return found;
            }
            return null;
          }

          async function safeRequest(path, body, { attempts = 3 } = {}) {
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              const response = await fetch(`${BASE}${path}`, {
                method: 'POST',
                redirect: 'error',
                headers: {
                  Authorization: `Bearer ${KEY}`,
                  Accept: 'application/json',
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify(body),
                signal: AbortSignal.timeout(180000),
              });
              const text = await response.text();
              let payload;
              try { payload = text ? JSON.parse(text) : null; }
              catch { payload = { raw_preview: text.slice(0, 500) }; }
              const result = { attempt, status: response.status, http_ok: response.ok, payload };
              console.log(JSON.stringify(sanitize(result), null, 2));

              if (response.ok && payload?.ok !== false) return payload;

              const retryable = RETRYABLE_STATUS.has(response.status) || payload?.retryable === true;
              if (!retryable || attempt === attempts) {
                const error = new Error(`Safe governed runtime call failed for ${path} with HTTP ${response.status}`);
                error.code = payload?.error?.code || payload?.error_code || 'governed_runtime_call_failed';
                throw error;
              }
              const retryAfterSeconds = Math.max(5, Math.min(Number(payload?.retry_after || 10), 60));
              console.log(JSON.stringify({
                retrying_safe_call: true,
                path,
                attempt,
                retry_after_seconds: retryAfterSeconds,
                migration_sql_applied: false,
                secrets_included: false,
              }));
              await new Promise((resolve) => setTimeout(resolve, retryAfterSeconds * 1000));
            }
            throw new Error('safe_request_retry_exhausted');
          }

          const dryRun = await safeRequest('/gpt/tools/call', {
            name: 'governed_migration_execute',
            tool_args: {
              migration: MIGRATION,
              mode: 'dry_run',
              expected_checksum_sha256: CHECKSUM,
              expected_statement_count: STATEMENT_COUNT,
            },
          });
          const dryRunEvidence = findObjectWithKey(dryRun, 'applies_sql');
          assert.equal(dryRunEvidence?.applies_sql, false, 'Migration dry-run must report applies_sql=false');
          assert.equal(dryRunEvidence?.mode, 'dry_run', 'Migration execution mode must remain dry_run');
          assert.equal(Number(dryRunEvidence?.statement_count), STATEMENT_COUNT, 'Dry-run statement count mismatch');
          assert.equal(dryRunEvidence?.migration_checksum_sha256, CHECKSUM, 'Dry-run checksum mismatch');

          const readback = await safeRequest('/gpt/tools/call', {
            name: 'governed_migration_schema_readback',
            tool_args: {
              migration: MIGRATION,
              expected_checksum_sha256: CHECKSUM,
              expected_statement_count: STATEMENT_COUNT,
            },
          });

          console.log(JSON.stringify({
            ok: true,
            stage: 'production_dry_run_and_readback_complete',
            migration: MIGRATION,
            migration_checksum_sha256: CHECKSUM,
            statement_count: STATEMENT_COUNT,
            authorization_bootstrap_previously_verified: true,
            apply_policy_previously_verified: true,
            dispatch_certification_previously_verified: true,
            dry_run_verified: true,
            schema_readback_received: Boolean(readback),
            migration_sql_applied: false,
            provider_call_executed: false,
            external_write_executed: false,
            secrets_included: false,
          }, null, 2));
          NODE
