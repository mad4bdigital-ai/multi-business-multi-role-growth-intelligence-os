name: Temporary Durable Authority Ambiguity Patch

on:
  push:
    branches:
      - gpt/fix-durable-authority-row-ambiguity-20260802

permissions:
  contents: write

concurrency:
  group: temp-durable-authority-ambiguity-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gpt/fix-durable-authority-row-ambiguity-20260802
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Apply exact fail-closed cardinality patch
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const path = 'http-generic-api/hostingerStorageDurableTenantAuthorityStore.js';
          const source = readFileSync(path, 'utf8');
          const before = `  if ((rows || []).length > 1) {
              throw fail(409, 'STORAGE_DURABLE_AUTHORITY_ROW_AMBIGUOUS', 'Authority identity resolved to multiple durable rows.', { authority_type: authorityType, authority_id: id });
            }
            return rows?.[0] ? { record: parseRecord(rows[0], table), row_version: Number(rows[0].row_version) } : null;`;
          const after = `  const rowCount = Array.isArray(rows) ? rows.length : 0;
            if (rowCount > 1) {
              throw fail(409, 'STORAGE_DURABLE_AUTHORITY_ROW_AMBIGUOUS', 'Authority identity resolved to multiple durable rows.', { authority_type: authorityType, authority_id: id });
            }
            if (rowCount === 0) return null;
            const [row] = rows;
            return { record: parseRecord(row, table), row_version: Number(row.row_version) };`;

          if (source.includes(after)) {
            console.log('Exact cardinality patch already applied.');
            process.exit(0);
          }
          if (!source.includes(before)) {
            throw new Error('Expected durable authority loadCurrent block was not found; refusing to mutate.');
          }
          const next = source.replace(before, after);
          if (next === source || next.includes(before)) {
            throw new Error('Exact durable authority replacement did not complete.');
          }
          writeFileSync(path, next, 'utf8');
          NODE

      - name: Commit exact patch when changed
        run: |
          set -euo pipefail
          if git diff --quiet -- http-generic-api/hostingerStorageDurableTenantAuthorityStore.js; then
            echo "No patch commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add http-generic-api/hostingerStorageDurableTenantAuthorityStore.js
          git commit -m "fix(spec-014): fail closed on ambiguous authority rows"
          git push origin HEAD:gpt/fix-durable-authority-row-ambiguity-20260802
