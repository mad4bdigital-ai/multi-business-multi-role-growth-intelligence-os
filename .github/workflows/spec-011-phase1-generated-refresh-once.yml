name: Spec 011 Phase1 Generated Refresh Once

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.ref == 'gpt/spec-011-phase1-durable-control-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out phase1 branch
        uses: actions/checkout@v5
        with:
          ref: gpt/spec-011-phase1-durable-control-20260730
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore durable status validation contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service_path = Path('http-generic-api/durableExecutionControlService.js')
          service = service_path.read_text()
          transition_marker = 'export async function transitionDurableExecution({' 
          validator = '''export function assertDurableRequestedStatus(toStatus) {
            const requestedStatus = String(toStatus || "").trim();
            if (!PLAN_TRANSITIONS.has(requestedStatus)) {
              throw durableError(
                `Unknown requested plan status '${requestedStatus || "(empty)"}'.`,
                "invalid_status",
                400,
              );
            }
            return requestedStatus;
          }

          '''
          if 'export function assertDurableRequestedStatus' not in service:
              if service.count(transition_marker) != 1:
                  raise SystemExit(f'expected one transition marker, found {service.count(transition_marker)}')
              service = service.replace(transition_marker, validator + transition_marker, 1)
          old_transition = '''export async function transitionDurableExecution({
            pool,
            planId,
            tenantId = null,
            toStatus,
            actorId = null,
            reason = null,
          }) {
            return withTransaction(pool, async (connection) => {'''
          new_transition = '''export async function transitionDurableExecution({
            pool,
            planId,
            tenantId = null,
            toStatus,
            actorId = null,
            reason = null,
          }) {
            toStatus = assertDurableRequestedStatus(toStatus);
            return withTransaction(pool, async (connection) => {'''
          if service.count(old_transition) != 1:
              raise SystemExit(f'expected one transition insertion point, found {service.count(old_transition)}')
          service_path.write_text(service.replace(old_transition, new_transition, 1))

          route_path = Path('http-generic-api/routes/plannerRoutes.js')
          routes = route_path.read_text()
          old_import = '''import {
            cancelDurableExecution,'''
          new_import = '''import {
            assertDurableRequestedStatus,
            cancelDurableExecution,'''
          if routes.count(old_import) != 1:
              raise SystemExit(f'expected one durable import point, found {routes.count(old_import)}')
          routes = routes.replace(old_import, new_import, 1)

          old_body = '''      const { status, tenant_id, reason } = req.body || {};
                const result = await transitionDurableExecution({
                  pool: getPool(),
                  planId: req.params.id,
                  tenantId: tenant_id || null,
                  toStatus: status,'''
          new_body = '''      const { status, tenant_id, reason } = req.body || {};
                const requestedStatus = assertDurableRequestedStatus(status);
                const result = await transitionDurableExecution({
                  pool: getPool(),
                  planId: req.params.id,
                  tenantId: tenant_id || null,
                  toStatus: requestedStatus,'''
          if routes.count(old_body) != 1:
              raise SystemExit(f'expected one status route body, found {routes.count(old_body)}')
          routes = routes.replace(old_body, new_body, 1)

          old_catch = '''    } catch (err) {
                return res.status(500).json({ ok: false, error: { code: "plan_update_failed", message: err.message } });
              }
            });'''
          new_catch = '''    } catch (err) {
                return res.status(err.status || 500).json({
                  ok: false,
                  error: { code: err.code || "plan_update_failed", message: err.message },
                  secrets_included: false,
                });
              }
            });'''
          if routes.count(old_catch) != 1:
              raise SystemExit(f'expected one status error transport point, found {routes.count(old_catch)}')
          route_path.write_text(routes.replace(old_catch, new_catch, 1))
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Verify generator entrypoints
        working-directory: http-generic-api
        run: |
          for entrypoint in \
            scripts/openapi-autofill-missing-routes.mjs \
            scripts/frontend-operation-governance-generator.mjs \
            scripts/frontend-surface-dispatch.mjs \
            scripts/generate-custom-gpt-schemas.mjs; do
            test -f "$entrypoint" || { echo "Missing generator entrypoint: $entrypoint"; exit 1; }
          done

      - name: Generate bounded artifacts
        working-directory: http-generic-api
        run: |
          git fetch origin main --depth=1
          node scripts/openapi-autofill-missing-routes.mjs --write
          npm run frontend:dispatch:generate -- --baseline-ref=main
          node scripts/generate-custom-gpt-schemas.mjs --write

      - name: Verify generated contracts
        working-directory: http-generic-api
        run: |
          node --check durableExecutionControlService.js
          node --check routes/plannerRoutes.js
          node test-durable-execution-control-service.mjs
          node test-routes.mjs
          node test-openapi-autofill-missing-routes.mjs
          node test-frontend-operation-governance-generator.mjs
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-openapi-route-coverage.mjs
          npm run openapi:auth:check
          npm run schemas:guard

      - name: Enforce bounded write set
        shell: bash
        run: |
          allowed='^(http-generic-api/durableExecutionControlService.js|http-generic-api/routes/plannerRoutes.js|http-generic-api/openapi.yaml|http-generic-api/frontend-operation-governance.generated.json|http-generic-api/frontend-surface-dispatch.generated.json|http-generic-api/openapi/frontend-runtime-routes.generated.yaml|http-generic-api/openapi/openapi.custom-gpt.auth-dispatcher.yaml|http-generic-api/openapi/openapi.custom-gpt.activation-admin.yaml|http-generic-api/openapi/openapi.tenant-gpt.auth.yaml|http-generic-api/openapi/openapi.tenant-gpt.activation.yaml|http-generic-api/openapi.gpt-action.local-connector.yaml)$'
          bad="$(git status --porcelain --untracked-files=all | sed -E 's/^...//' | grep -Ev "$allowed" || true)"
          test -z "$bad" || { echo "Unexpected generated paths:"; echo "$bad"; exit 1; }

      - name: Commit clean generated output
        shell: bash
        run: |
          rm -f .github/workflows/spec-011-phase1-generated-refresh-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(spec-011): preserve status validation and generated parity"
          git push origin HEAD:gpt/spec-011-phase1-durable-control-20260730
