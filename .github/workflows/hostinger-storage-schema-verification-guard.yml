name: Hostinger Storage Schema Verification Guard

on:
  pull_request:
    paths:
      - '.changes/e2e/spec014-signed-schema-verification.json'
      - '.github/contracts/spec014/hostinger-storage-schema-verification.json'
      - '.github/contracts/spec014/hostinger-storage-schema-verification-attestation.schema.json'
      - '.github/contracts/spec014/hostinger-storage-schema-verification-readback-v4.sql'
      - '.github/contracts/spec014/hostinger-storage-wave4-signed-schema-verification-refresh.json'
      - '.github/workflows/hostinger-storage-schema-verification-guard.yml'
      - 'http-generic-api/hostingerStorageSchemaVerification.js'
      - 'http-generic-api/test-hostinger-storage-schema-verification.mjs'

permissions:
  contents: read

jobs:
  signed-schema-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check verifier and test syntax
        run: |
          node --check http-generic-api/hostingerStorageSchemaVerification.js
          node --check http-generic-api/test-hostinger-storage-schema-verification.mjs
      - name: Validate signed schema verification v2
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts
          node http-generic-api/test-hostinger-storage-schema-verification.mjs 2>&1 \
            | tee .artifacts/hostinger-storage-schema-verification.log
      - name: Require exact Wave 4 v2 readback bindings
        shell: bash
        run: |
          set -euo pipefail
          readback='.github/contracts/spec014/hostinger-storage-schema-verification-readback-v4.sql'
          contract='.github/contracts/spec014/hostinger-storage-schema-verification.json'
          refresh='.github/contracts/spec014/hostinger-storage-wave4-signed-schema-verification-refresh.json'
          grep -q 'spec014-hostinger-storage-schema-verification-v2' "$contract" "$refresh" http-generic-api/hostingerStorageSchemaVerification.js http-generic-api/test-hostinger-storage-schema-verification.mjs
          grep -q 'spec014_hostinger_storage_migration_readback_v4' "$contract" "$readback" "$refresh" http-generic-api/hostingerStorageSchemaVerification.js
          grep -q '20260802_04_spec014_hostinger_storage_authorized_injection_state.sql' "$contract" "$refresh" http-generic-api/hostingerStorageSchemaVerification.js
          grep -q 'hostinger_storage_durable_authorized_injection_state_schema_v1' "$contract" "$readback" "$refresh" http-generic-api/hostingerStorageSchemaVerification.js
          grep -q '652b2d50774944c4f21d92fd8a461c0e0cd18316e5875696223337eb2df5555a' "$contract" "$readback" "$refresh" http-generic-api/hostingerStorageSchemaVerification.js
          grep -q '17 AS expected_table_count' "$readback"
          grep -q 'expected_authorized_injection_state_constraint_count' "$readback"
          grep -q 'fk_storage_authorized_injection_rollback_state' "$readback"
          grep -q 'compatible_runtime_column_count: 71' http-generic-api/test-hostinger-storage-schema-verification.mjs
          grep -q 'compatible_runtime_index_column_count: 31' http-generic-api/test-hostinger-storage-schema-verification.mjs
          grep -q 'authorized_injection_state_constraint_count: 13' http-generic-api/test-hostinger-storage-schema-verification.mjs
          grep -q 'v1_attestation_replay_rejected: true' http-generic-api/test-hostinger-storage-schema-verification.mjs
      - name: Preserve T027 and public-key-only non-live boundary
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          changed_files="$(git diff --name-only "$base" "$head")"
          ! printf '%s\n' "$changed_files" | grep -Fx '.github/contracts/spec014/migrations/readback.sql'
          ! printf '%s\n' "$changed_files" | grep -Fx '.github/contracts/spec014/validate-hostinger-storage-migration-drafts.mjs'
          ! printf '%s\n' "$changed_files" | grep -E '(^|/)(db\.js|server\.js)$'
          ! git diff "$base" "$head" -- \
            http-generic-api/hostingerStorageSchemaVerification.js \
            http-generic-api/test-hostinger-storage-schema-verification.mjs \
            | grep -E -- 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|"d"[[:space:]]*:[[:space:]]*"[A-Za-z0-9_-]+"'
          ! grep -E '\b(getPool|governed_migration_execute|bootstrapGovernedMigrationAuthorization)\b' \
            http-generic-api/hostingerStorageSchemaVerification.js \
            http-generic-api/test-hostinger-storage-schema-verification.mjs
          grep -q 'live_database_access_performed: false' http-generic-api/test-hostinger-storage-schema-verification.mjs
          grep -q 'migration_apply_performed: false' http-generic-api/test-hostinger-storage-schema-verification.mjs
          grep -q 'provider_dispatch_performed: false' http-generic-api/test-hostinger-storage-schema-verification.mjs
          grep -q 'private_key_committed: false' http-generic-api/test-hostinger-storage-schema-verification.mjs
          grep -q 'production_ready: false' http-generic-api/test-hostinger-storage-schema-verification.mjs
      - name: Upload schema verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-storage-schema-verification-${{ github.run_id }}
          path: .artifacts/hostinger-storage-schema-verification.log
          if-no-files-found: warn
          retention-days: 30
