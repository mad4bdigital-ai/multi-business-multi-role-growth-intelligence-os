name: Repair Policy Controller Envelope Binding 6429

on:
  push:
    branches:
      - gpt/github-main-policy-controller-20260805

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v5
        with:
          ref: gpt/github-main-policy-controller-20260805
          fetch-depth: 0

      - name: Verify immutable launch boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git branch --show-current)" = "gpt/github-main-policy-controller-20260805"
          test "$(git rev-parse origin/main)" = "797f1a456e987f99aeac2fe3727343e361447cf1"

      - name: Apply bounded repair
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/policy-controller-repair
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/repair_policy_controller_envelope_binding_6429.py')
          text = path.read_text()
          start = text.index('envelope_test_marker = dedent(')
          end = text.index('\nenvelope_test = dedent(', start)
          replacement = 'envelope_test_marker = "  {\\n    const mock = createGithubFetch({ classicStatus: 403 });\\n"'
          text = text[:start] + replacement + text[end:]
          old_pool = '  const pool = deps.pool || getPool();\\n  const acceptedIntents = ['
          new_pool = '  const pool = deps.pool || (typeof deps.resolveCapabilityExecutionEnvelope === "function" ? null : getPool());\\n  const acceptedIntents = ['
          if text.count(old_pool) != 1:
              raise SystemExit(f'lazy pool marker: expected one match, found {text.count(old_pool)}')
          text = text.replace(old_pool, new_pool, 1)
          path.write_text(text)
          PY
          python3 .github/scripts/repair_policy_controller_envelope_binding_6429.py 2>&1 | tee .artifacts/policy-controller-repair/apply.log

      - name: Install focused test dependencies
        if: steps.apply.outcome == 'success'
        shell: bash
        run: npm ci --prefix http-generic-api --ignore-scripts

      - name: Validate focused repair
        id: validate
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            node --check http-generic-api/githubRepositoryPolicyController.js
            node --check http-generic-api/test-github-repository-policy-controller.mjs
            node http-generic-api/test-github-repository-policy-controller.mjs
            node http-generic-api/test-repository-automation-policy-facade.mjs
            git diff --check
          } 2>&1 | tee .artifacts/policy-controller-repair/validation.log

      - name: Upload repair diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-controller-envelope-repair-${{ github.run_id }}
          path: .artifacts/policy-controller-repair
          if-no-files-found: error
          retention-days: 7

      - name: Stop on repair failure
        if: steps.apply.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Stop on validation failure
        if: steps.validate.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Commit repair and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-policy-controller-envelope-binding-6429.yml
          rm .github/scripts/repair_policy_controller_envelope_binding_6429.py
          test "$(git ls-remote origin refs/heads/gpt/github-main-policy-controller-20260805 | cut -f1)" = "${GITHUB_SHA}"
          git config user.name "MAD4B"
          git config user.email "mad4b.digital@gmail.com"
          git add http-generic-api/githubRepositoryPolicyController.js http-generic-api/test-github-repository-policy-controller.mjs .github/workflows/repair-policy-controller-envelope-binding-6429.yml .github/scripts/repair_policy_controller_envelope_binding_6429.py
          git commit -m "fix(github): bind policy apply envelope to exact target"
          git push origin HEAD:gpt/github-main-policy-controller-20260805
