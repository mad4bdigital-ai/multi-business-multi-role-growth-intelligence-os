name: Phase G Registry Format Once

on:
  push:
    branches:
      - gpt/work-map-phase-g-schema-classification-20260803

permissions:
  contents: write

concurrency:
  group: phase-g-registry-format-once
  cancel-in-progress: false

jobs:
  format-and-remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: gpt/work-map-phase-g-schema-classification-20260803
          fetch-depth: 0

      - name: Format registry and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('.specify/work-map-schema-classification-registry.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          rm .github/workflows/phase-g-registry-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .specify/work-map-schema-classification-registry.json .github/workflows/phase-g-registry-format-once.yml
          git diff --cached --check
          git commit -m "chore(work-map): preserve registry formatting"
          git push origin HEAD:gpt/work-map-phase-g-schema-classification-20260803
