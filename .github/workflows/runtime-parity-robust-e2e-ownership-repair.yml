name: One-shot Runtime Parity Robust E2E Ownership Repair

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]
    paths:
      - .github/workflows/runtime-parity-robust-e2e-ownership-repair.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: runtime-parity-robust-e2e-ownership-repair-pr-5985
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.event.pull_request.number == 5985 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/add-runtime-parity-comment-bridge-v2-20260804' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      TARGET_BRANCH: gpt/add-runtime-parity-comment-bridge-v2-20260804
      EXPECTED_PARENT_SHA: 1d1630086a48854dfc3d2fa27ed54ed0ae49d58c
      LAUNCHER_PATH: .github/workflows/runtime-parity-robust-e2e-ownership-repair.yml
      PARALLEL_GOVERNANCE: http-generic-api/scripts/e2e-parallel-work-governance.mjs
      PARALLEL_TEST: http-generic-api/scripts/e2e-parallel-work-governance-self-test.mjs
      PHASE_GOVERNANCE: http-generic-api/scripts/e2e-phase-governance.mjs
      PHASE_TEST: http-generic-api/scripts/e2e-phase-governance-self-test.mjs
      MANIFEST_PATH: specs/014-governed-hostinger-storage-orchestration/work-map-integration.json
      TASKS_PATH: specs/014-governed-hostinger-storage-orchestration/tasks.md
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact repair request
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Pin request and permit only self-cleanup drift
        shell: bash
        run: |
          set -Eeuo pipefail
          request_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT_SHA}"

          git fetch --no-tags origin main "${TARGET_BRANCH}"
          main_sha="$(git rev-parse origin/main)"
          remote_sha="$(git rev-parse "origin/${TARGET_BRANCH}")"

          verify_remote() {
            local candidate="$1"
            if [[ "${candidate}" = "${request_sha}" ]]; then return 0; fi
            git merge-base --is-ancestor "${request_sha}" "${candidate}"
            mapfile -t drift < <(git diff --name-status "${request_sha}..${candidate}")
            test "${#drift[@]}" -eq 1
            test "${drift[0]}" = $'D\t'"${LAUNCHER_PATH}"
          }
          verify_remote "${remote_sha}"

          mapfile -t request_files < <(git diff --name-only "${EXPECTED_PARENT_SHA}..${request_sha}")
          test "${#request_files[@]}" -eq 1
          test "${request_files[0]}" = "${LAUNCHER_PATH}"

          actual_scope="$(git diff --name-only "${main_sha}...${EXPECTED_PARENT_SHA}" | sort)"
          expected_scope="$(printf '%s\n' \
            '.changes/e2e/production-runtime-parity-comment-bridge.json' \
            '.github/workflows/production-runtime-parity-comment-bridge.yml' \
            'docs/work-maps/README.md' \
            'docs/work-maps/repository-automation-map.md' \
            'http-generic-api/scripts/test-production-runtime-parity-comment-bridge.mjs' \
            'specs/014-governed-hostinger-storage-orchestration/work-map-integration.json' | sort)"
          test "${actual_scope}" = "${expected_scope}"

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/5985")"
          test "$(jq -r '.state' <<<"${pr_json}")" = open
          test "$(jq -r '.draft' <<<"${pr_json}")" = false
          test "$(jq -r '.base.ref' <<<"${pr_json}")" = main
          test "$(jq -r '.head.ref' <<<"${pr_json}")" = "${TARGET_BRANCH}"
          test "$(jq -r '.head.sha' <<<"${pr_json}")" = "${remote_sha}"

          echo "REQUEST_SHA=${request_sha}" >> "${GITHUB_ENV}"
          echo "PINNED_MAIN_SHA=${main_sha}" >> "${GITHUB_ENV}"
          echo "PINNED_REMOTE_SHA=${remote_sha}" >> "${GITHUB_ENV}"

      - name: Construct current-main synchronized base
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git merge-base --is-ancestor "${PINNED_MAIN_SHA}" HEAD; then
            git merge --no-ff --no-commit "${PINNED_MAIN_SHA}"
            git commit -m 'test: construct current-main synchronized repair base'
          fi
          echo "SYNC_BASE_SHA=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Apply narrow generated-binding ownership repair
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Unexpected {label} anchor count: {count}")
              return text.replace(old, new, 1)

          parallel_path = Path('http-generic-api/scripts/e2e-parallel-work-governance.mjs')
          parallel = parallel_path.read_text()
          parallel = replace_once(
              parallel,
              'const SHA_PATTERN = /^[0-9a-f]{40}$/i;\n',
              'const SHA_PATTERN = /^[0-9a-f]{40}$/i;\nconst PARALLEL_OWNERSHIP_NEUTRAL_SPEC_ARTIFACTS = new Set(["work-map-integration.json"]);\n',
              'parallel constant',
          )
          parallel = replace_once(
              parallel,
              '''function discoverContractPaths(changedFiles, policy) {
            const paths = new Set();
            for (const file of changedFiles) {
              const feature = specKeyFromFile(file, policy);
              if (feature) paths.add(normalize(path.posix.join(policy.spec_root, feature, policy.spec_contract_file)));
              if (file.endsWith(`/${policy.spec_contract_file}`)) paths.add(file);
              if (file.startsWith(`${normalize(policy.non_spec_contract_root)}/`) && file.endsWith(".json")) paths.add(file);
            }
            return [...paths].sort();
          }
          ''',
              '''function isParallelOwnershipNeutralSpecArtifact(file, policy) {
            const feature = specKeyFromFile(file, policy);
            if (!feature) return false;
            const prefix = `${normalize(policy.spec_root)}/${feature}/`;
            const relative = normalize(file).slice(prefix.length);
            return PARALLEL_OWNERSHIP_NEUTRAL_SPEC_ARTIFACTS.has(relative);
          }

          function discoverContractPaths(changedFiles, policy) {
            const paths = new Set();
            for (const file of changedFiles) {
              const feature = specKeyFromFile(file, policy);
              if (feature && !isParallelOwnershipNeutralSpecArtifact(file, policy)) {
                paths.add(normalize(path.posix.join(policy.spec_root, feature, policy.spec_contract_file)));
              }
              if (file.endsWith(`/${policy.spec_contract_file}`)) paths.add(file);
              if (file.startsWith(`${normalize(policy.non_spec_contract_root)}/`) && file.endsWith(".json")) paths.add(file);
            }
            return [...paths].sort();
          }
          ''',
              'parallel discovery',
          )
          parallel_path.write_text(parallel)

          parallel_test_path = Path('http-generic-api/scripts/e2e-parallel-work-governance-self-test.mjs')
          parallel_test = parallel_test_path.read_text()
          parallel_cases = r'''
          {
            const root = tempRepo();
            const bridgeContract = {
              schema_version: 1,
              feature_key: "generated-binding-bridge",
              title: "Generated binding bridge",
              delivery_mode: "single_pr",
              current_phase: "mvp",
              scope: { include: ["http-generic-api/example/runtime/**"] },
              merge_contract: { minimum_phase: "mvp" },
              phases: [{ id: "mvp", status: "implemented", objective: "Validate generated binding neutrality." }]
            };
            write(root, ".changes/e2e/generated-binding-bridge.json", `${JSON.stringify(bridgeContract, null, 2)}\n`);
            write(root, "specs/001-example/work-map-integration.json", "{}\n");
            write(root, "http-generic-api/example/runtime/service.mjs");
            const neutral = evaluateParallelWork({
              root, policy,
              changedFiles: [
                ".changes/e2e/generated-binding-bridge.json",
                "specs/001-example/work-map-integration.json",
                "http-generic-api/example/runtime/service.mjs"
              ],
              headRef: "gpt/generated-binding-bridge", head: "HEAD"
            });
            assert.equal(neutral.ok, true, JSON.stringify(neutral.findings));
            assert.equal(neutral.contracts.length, 0);
          }

          {
            const root = tempRepo();
            const bridgeContract = {
              schema_version: 1,
              feature_key: "generated-binding-bridge",
              title: "Generated binding bridge",
              delivery_mode: "single_pr",
              current_phase: "mvp",
              scope: { include: ["http-generic-api/example/runtime/**"] },
              merge_contract: { minimum_phase: "mvp" },
              phases: [{ id: "mvp", status: "implemented", objective: "Validate generated binding neutrality." }]
            };
            write(root, ".changes/e2e/generated-binding-bridge.json", `${JSON.stringify(bridgeContract, null, 2)}\n`);
            write(root, "specs/001-example/e2e-phases.json", `${JSON.stringify(baseContract(), null, 2)}\n`);
            write(root, "specs/001-example/work-map-integration.json", "{}\n");
            write(root, "specs/001-example/spec.md", "# Real Spec change\n");
            write(root, "http-generic-api/example/runtime/service.mjs");
            const realSpec = evaluateParallelWork({
              root, policy,
              changedFiles: [
                ".changes/e2e/generated-binding-bridge.json",
                "specs/001-example/work-map-integration.json",
                "specs/001-example/spec.md",
                "http-generic-api/example/runtime/service.mjs"
              ],
              headRef: "gpt/generated-binding-bridge", head: "HEAD"
            });
            assert.equal(realSpec.ok, true, JSON.stringify(realSpec.findings));
            assert.equal(realSpec.contracts.length, 1);
            assert.equal(realSpec.contracts[0].feature_key, "001-example");
            assert.equal(realSpec.contracts[0].active_workstream, null);
          }

          '''
          parallel_test = replace_once(
              parallel_test,
              'console.log(JSON.stringify({ ok: true, tests: 7, gate: "e2e_parallel_work_governance", secrets_included: false }));',
              parallel_cases + 'console.log(JSON.stringify({ ok: true, tests: 9, gate: "e2e_parallel_work_governance", secrets_included: false }));',
              'parallel test footer',
          )
          parallel_test_path.write_text(parallel_test)

          phase_path = Path('http-generic-api/scripts/e2e-phase-governance.mjs')
          phase = phase_path.read_text()
          phase = replace_once(
              phase,
              'const MAX_CAPTURE_BUFFER_BYTES = 16 * 1024 * 1024;\n',
              'const MAX_CAPTURE_BUFFER_BYTES = 16 * 1024 * 1024;\nconst E2E_OWNERSHIP_NEUTRAL_SPEC_ARTIFACTS = new Set(["work-map-integration.json"]);\n',
              'phase constant',
          )
          phase = replace_once(
              phase,
              '''function contractPathForSpec(feature, policy) {
            return normalize(path.posix.join(policy.spec_root, feature, policy.spec_contract_file));
          }
          ''',
              '''function contractPathForSpec(feature, policy) {
            return normalize(path.posix.join(policy.spec_root, feature, policy.spec_contract_file));
          }

          function isE2EOwnershipNeutralSpecArtifact(file, policy) {
            const feature = specKeyFromFile(file, policy);
            if (!feature) return false;
            const prefix = `${normalize(policy.spec_root)}/${feature}/`;
            const relative = normalize(file).slice(prefix.length);
            return E2E_OWNERSHIP_NEUTRAL_SPEC_ARTIFACTS.has(relative);
          }
          ''',
              'phase helper',
          )
          phase = replace_once(
              phase,
              '  const changedSpecs = new Set(changedFiles.map((file) => specKeyFromFile(file, policy)).filter(Boolean));\n',
              '  const changedSpecs = new Set(changedFiles.filter((file) => !isE2EOwnershipNeutralSpecArtifact(file, policy)).map((file) => specKeyFromFile(file, policy)).filter(Boolean));\n',
              'phase changed specs',
          )
          phase_path.write_text(phase)

          phase_test_path = Path('http-generic-api/scripts/e2e-phase-governance-self-test.mjs')
          phase_test = phase_test_path.read_text()
          phase_cases = r'''
          {
            const root = tempRepo();
            write(root, "http-generic-api/example/service.mjs");
            write(root, "http-generic-api/example/e2e.mjs", "process.exit(0);\n");
            write(root, "specs/001-example/work-map-integration.json", "{}\n");
            const bridge = contract({
              feature_key: "generated-binding-bridge",
              title: "Generated binding bridge",
              delivery_mode: "single_pr",
              scope: { include: ["http-generic-api/example/**", ".changes/e2e/generated-binding-bridge.json"] }
            });
            write(root, ".changes/e2e/generated-binding-bridge.json", `${JSON.stringify(bridge, null, 2)}\n`);
            const result = evaluateRepository({
              root, policy,
              changedFiles: [
                ".changes/e2e/generated-binding-bridge.json",
                "http-generic-api/example/service.mjs",
                "http-generic-api/example/e2e.mjs",
                "specs/001-example/work-map-integration.json"
              ]
            });
            assert.equal(result.report.ok, true, JSON.stringify(result.report.findings));
            assert.deepEqual(result.report.contracts.map((row) => row.contract_path), [".changes/e2e/generated-binding-bridge.json"]);
          }

          {
            const root = tempRepo();
            write(root, "http-generic-api/example/service.mjs");
            write(root, "http-generic-api/example/e2e.mjs", "process.exit(0);\n");
            write(root, "specs/001-example/work-map-integration.json", "{}\n");
            write(root, "specs/001-example/spec.md", "# Real Spec change\n");
            write(root, "specs/001-example/e2e-phases.json", `${JSON.stringify(contract(), null, 2)}\n`);
            const bridge = contract({
              feature_key: "generated-binding-bridge",
              title: "Generated binding bridge",
              delivery_mode: "single_pr",
              scope: { include: ["http-generic-api/example/**", ".changes/e2e/generated-binding-bridge.json"] }
            });
            write(root, ".changes/e2e/generated-binding-bridge.json", `${JSON.stringify(bridge, null, 2)}\n`);
            const result = evaluateRepository({
              root, policy,
              changedFiles: [
                ".changes/e2e/generated-binding-bridge.json",
                "http-generic-api/example/service.mjs",
                "http-generic-api/example/e2e.mjs",
                "specs/001-example/work-map-integration.json",
                "specs/001-example/spec.md"
              ]
            });
            assert.equal(result.report.ok, false);
            assert(result.report.findings.some((row) => row.code === "e2e_phase_contract_not_changed_with_feature"));
          }

          '''
          phase_test = replace_once(
              phase_test,
              'console.log(JSON.stringify({ ok: true, tests: 7, gate: "e2e_phase_governance", secrets_included: false }));',
              phase_cases + 'console.log(JSON.stringify({ ok: true, tests: 9, gate: "e2e_phase_governance", secrets_included: false }));',
              'phase test footer',
          )
          phase_test_path.write_text(phase_test)
          PY

          node --check "${PARALLEL_GOVERNANCE}"
          node --check "${PARALLEL_TEST}"
          node --check "${PHASE_GOVERNANCE}"
          node --check "${PHASE_TEST}"
          git rm -- "${LAUNCHER_PATH}"

      - name: Regenerate final Work Maps and Spec binding
        shell: bash
        run: |
          set -Eeuo pipefail
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          first_hash="$(git diff --binary -- docs/work-maps | sha256sum | awk '{print $1}')"
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          second_hash="$(git diff --binary -- docs/work-maps | sha256sum | awk '{print $1}')"
          test "${first_hash}" = "${second_hash}"
          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs
          REPORT_PATH="${RUNNER_TEMP}/precommit-readback.json" node http-generic-api/scripts/spec014-final-work-map-readback.mjs
          node - "${RUNNER_TEMP}/precommit-readback.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!report.ok || report.findings.length !== 0) process.exit(1);
          if (report.classification.coverage_percent !== 100) process.exit(1);
          if (report.secrets_included !== false) process.exit(1);
          NODE

      - name: Commit and test exact final tree locally
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A
          git commit -m 'test: construct final generated-binding ownership tree'
          local_final_sha="$(git rev-parse HEAD)"
          echo "LOCAL_FINAL_SHA=${local_final_sha}" >> "${GITHUB_ENV}"

          node "${PARALLEL_TEST}"
          node "${PHASE_TEST}"
          node http-generic-api/scripts/e2e-parallel-pr-flow-self-test.mjs
          node http-generic-api/scripts/test-production-runtime-parity-comment-bridge.mjs
          node http-generic-api/test-e2e-contract-reference-integrity.mjs
          node http-generic-api/test-e2e-contract-git-index-integrity.mjs

          node http-generic-api/scripts/e2e-parallel-pr-gate.mjs check \
            --base "${PINNED_MAIN_SHA}" \
            --head "${local_final_sha}" \
            --head-ref "${TARGET_BRANCH}" \
            --base-ref main \
            --report-file "${RUNNER_TEMP}/parallel-pr-evaluation.json"
          node - "${RUNNER_TEMP}/parallel-pr-evaluation.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!report.ok || report.pr_mode !== 'standard') process.exit(1);
          if (report.findings.length !== 0 || report.contracts.length !== 0) process.exit(1);
          if (report.secrets_included !== false) process.exit(1);
          NODE

          node http-generic-api/scripts/e2e-contract-reference-integrity.mjs \
            --base "${PINNED_MAIN_SHA}" --head "${local_final_sha}" \
            --report-file "${RUNNER_TEMP}/reference-integrity.json"
          node http-generic-api/scripts/e2e-contract-git-index-integrity.mjs \
            --report-file "${RUNNER_TEMP}/reference-integrity.json"

          node http-generic-api/scripts/e2e-phase-governance.mjs check \
            --base "${PINNED_MAIN_SHA}" --head "${local_final_sha}" \
            --report-file "${RUNNER_TEMP}/e2e-phase-evaluation.json"
          node http-generic-api/scripts/e2e-phase-governance.mjs run \
            --base "${PINNED_MAIN_SHA}" --head "${local_final_sha}" \
            --report-file "${RUNNER_TEMP}/e2e-phase-evaluation.json" \
            --execution-report-file "${RUNNER_TEMP}/e2e-phase-execution.json"

          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          REPORT_PATH="${RUNNER_TEMP}/final-readback.json" node http-generic-api/scripts/spec014-final-work-map-readback.mjs
          node - "${RUNNER_TEMP}/final-readback.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!report.ok || report.findings.length !== 0) process.exit(1);
          if (report.classification.coverage_percent !== 100) process.exit(1);
          if (report.secrets_included !== false) process.exit(1);
          NODE

      - name: Rebase validated tree onto latest permitted cleanup head
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main "${TARGET_BRANCH}"
          current_main="$(git rev-parse origin/main)"
          remote_sha="$(git rev-parse "origin/${TARGET_BRANCH}")"
          test "${current_main}" = "${PINNED_MAIN_SHA}"

          if [[ "${remote_sha}" != "${REQUEST_SHA}" ]]; then
            git merge-base --is-ancestor "${REQUEST_SHA}" "${remote_sha}"
            mapfile -t drift < <(git diff --name-status "${REQUEST_SHA}..${remote_sha}")
            test "${#drift[@]}" -eq 1
            test "${drift[0]}" = $'D\t'"${LAUNCHER_PATH}"
          fi

          git diff --binary "${SYNC_BASE_SHA}" "${LOCAL_FINAL_SHA}" -- \
            "${PARALLEL_GOVERNANCE}" "${PARALLEL_TEST}" \
            "${PHASE_GOVERNANCE}" "${PHASE_TEST}" \
            docs/work-maps "${MANIFEST_PATH}" "${TASKS_PATH}" \
            > "${RUNNER_TEMP}/permanent.patch"
          test -s "${RUNNER_TEMP}/permanent.patch"

          git reset --hard "${remote_sha}"
          if ! git merge-base --is-ancestor "${PINNED_MAIN_SHA}" HEAD; then
            git merge --no-ff --no-commit "${PINNED_MAIN_SHA}"
          fi
          if [[ -e "${LAUNCHER_PATH}" ]]; then git rm -- "${LAUNCHER_PATH}"; fi
          git apply --index "${RUNNER_TEMP}/permanent.patch"
          git add -A

          expected_tree="$(git rev-parse "${LOCAL_FINAL_SHA}^{tree}")"
          actual_tree="$(git write-tree)"
          test "${actual_tree}" = "${expected_tree}"

          git commit -m 'fix(e2e): keep generated Work Map binding ownership-neutral'
          result_sha="$(git rev-parse HEAD)"
          echo "RESULT_SHA=${result_sha}" >> "${GITHUB_ENV}"
          echo "PUSH_BASE_SHA=${remote_sha}" >> "${GITHUB_ENV}"

      - name: Verify bounded final diff and push fast-forward
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -e "${LAUNCHER_PATH}"
          mapfile -t changed < <(git diff --name-only "${PINNED_MAIN_SHA}...${RESULT_SHA}" | sort)
          test "${#changed[@]}" -ge 10
          for required in \
            '.changes/e2e/production-runtime-parity-comment-bridge.json' \
            '.github/workflows/production-runtime-parity-comment-bridge.yml' \
            "${PARALLEL_GOVERNANCE}" "${PARALLEL_TEST}" \
            "${PHASE_GOVERNANCE}" "${PHASE_TEST}" \
            'http-generic-api/scripts/test-production-runtime-parity-comment-bridge.mjs' \
            "${MANIFEST_PATH}"; do
            printf '%s\n' "${changed[@]}" | grep -Fx -- "${required}" >/dev/null
          done
          printf '%s\n' "${changed[@]}" | grep -E '^docs/work-maps/' >/dev/null
          for file in "${changed[@]}"; do
            case "${file}" in
              '.changes/e2e/production-runtime-parity-comment-bridge.json'|'.github/workflows/production-runtime-parity-comment-bridge.yml'|docs/work-maps/*|"${PARALLEL_GOVERNANCE}"|"${PARALLEL_TEST}"|"${PHASE_GOVERNANCE}"|"${PHASE_TEST}"|'http-generic-api/scripts/test-production-runtime-parity-comment-bridge.mjs'|"${MANIFEST_PATH}"|"${TASKS_PATH}") ;;
              *) echo "Unexpected final output: ${file}" >&2; exit 1 ;;
            esac
          done

          git fetch --no-tags origin main "${TARGET_BRANCH}"
          test "$(git rev-parse origin/main)" = "${PINNED_MAIN_SHA}"
          test "$(git rev-parse "origin/${TARGET_BRANCH}")" = "${PUSH_BASE_SHA}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          test "$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${RESULT_SHA}"
          echo "result_sha=${RESULT_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Publish bounded repair evidence
        if: always()
        shell: bash
        env:
          PUBLISHED_SHA: ${{ steps.publish.outputs.result_sha }}
        run: |
          outcome=passed
          if [[ "${{ job.status }}" != success ]]; then outcome=blocked; fi
          {
            echo '## Runtime Parity Robust E2E Ownership Repair'
            echo
            echo "\`ROBUST_E2E_OWNERSHIP_REPAIR outcome=${outcome} request_sha=${REQUEST_SHA:-unresolved} synchronized_base=${SYNC_BASE_SHA:-unresolved} validated_tree_sha=${LOCAL_FINAL_SHA:-unresolved} push_base_sha=${PUSH_BASE_SHA:-unresolved} result_sha=${PUBLISHED_SHA:-unresolved} pinned_main_sha=${PINNED_MAIN_SHA:-unresolved} temporary_launcher_removed=true protected_branch_mutation=false production_mutation=false force_push=false secrets_included=false\`"
          } >> "${GITHUB_STEP_SUMMARY}"
