name: Context Kernel Hardcoding Report

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit SHA to scan; defaults to the dispatched ref SHA.
        required: false
        type: string
      base_sha:
        description: Optional exact base SHA for changed-file scope.
        required: false
        type: string
  pull_request:
    branches: [main]
    paths:
      - "http-generic-api/**"
      - "src/**"
      - "specs/012-unified-admin-tenant-context-kernel/**"
      - "docs/context-kernel/**"
      - ".github/ci-evidence-routing.json"
      - ".github/workflows/context-kernel-hardcoding-report.yml"

permissions:
  contents: read

concurrency:
  group: context-kernel-hardcoding-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI_CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
  CI_BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || '' }}

jobs:
  report:
    name: Publish and enforce structured hardcoding report
    runs-on: ubuntu-latest
    steps:
      - name: Validate governed manual inputs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          REQUESTED_CANDIDATE_SHA: ${{ inputs.candidate_sha || '' }}
          REQUESTED_BASE_SHA: ${{ inputs.base_sha || '' }}
        run: |
          set -euo pipefail
          sha_pattern='^[0-9a-f]{40}$'
          if [[ -n "${REQUESTED_CANDIDATE_SHA:-}" && ! "$REQUESTED_CANDIDATE_SHA" =~ $sha_pattern ]]; then
            echo "candidate_sha must be a full lowercase 40-character commit SHA" >&2
            exit 1
          fi
          if [[ -n "${REQUESTED_BASE_SHA:-}" && ! "$REQUESTED_BASE_SHA" =~ $sha_pattern ]]; then
            echo "base_sha must be a full lowercase 40-character commit SHA" >&2
            exit 1
          fi

      - name: Checkout exact candidate head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CI_CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CI_CANDIDATE_SHA"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Test scanner behavior
        working-directory: http-generic-api
        run: node test-context-kernel-hardcoding-scan.mjs

      - name: Determine exact changed-file scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          changed_files="${RUNNER_TEMP}/context-kernel-changed-files.txt"
          if [[ -n "${CI_BASE_SHA:-}" ]]; then
            git cat-file -e "${CI_BASE_SHA}^{commit}"
            git diff --name-only "$CI_BASE_SHA"...HEAD > "$changed_files"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "pull_request event must provide an exact base SHA" >&2
            exit 1
          elif git rev-parse --verify origin/main >/dev/null 2>&1; then
            git diff --name-only origin/main...HEAD > "$changed_files"
          else
            git diff --name-only HEAD^...HEAD > "$changed_files"
          fi
          cat "$changed_files"

      - name: Generate exact-scope structured scanner report
        working-directory: http-generic-api
        run: >-
          node scripts/context-kernel-hardcoding-scan.mjs
          --report-only
          --changed-files-from="${{ runner.temp }}/context-kernel-changed-files.txt"
          --output="${{ runner.temp }}/context-kernel-hardcoding-source.json"

      - name: Build canonical report and Step Summary
        env:
          CANDIDATE_HEAD_REF: ${{ github.head_ref || github.ref_name }}
          CANDIDATE_BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const shaPattern = /^[0-9a-f]{40}$/;
          const sourceFile = process.env.RUNNER_TEMP + '/context-kernel-hardcoding-source.json';
          if (!shaPattern.test(process.env.CI_CANDIDATE_SHA || '')) throw new Error('Invalid exact candidate SHA.');
          const raw = JSON.parse(fs.readFileSync(sourceFile, 'utf8'));
          if (raw.secrets_included === true || raw.secretsIncluded === true) throw new Error('Scanner source declared secrets.');
          const active = Array.isArray(raw.findings) ? raw.findings.filter((item) => !item.suppressed) : [];
          const runtime = active.filter((item) => item.zone === 'runtime');
          const source = {
            ...raw,
            contract: 'mad4b.context-kernel-hardcoding-source.v1',
            candidate_kind: 'head',
            candidate_sha: process.env.CI_CANDIDATE_SHA,
            ok: runtime.length === 0,
            secrets_included: false
          };
          const sourceText = JSON.stringify(source, null, 2) + '\n';
          fs.writeFileSync(sourceFile, sourceText);
          if (source.contract !== 'mad4b.context-kernel-hardcoding-source.v1' || source.candidate_kind !== 'head' || source.candidate_sha !== process.env.CI_CANDIDATE_SHA || typeof source.ok !== 'boolean' || source.secrets_included !== false) {
            throw new Error('Context Kernel source evidence failed canonical validation.');
          }
          const first = runtime[0] || active[0] || null;
          const summary = {
            contract: 'mad4b.context-kernel-hardcoding-summary.v1',
            generated_at: new Date().toISOString(),
            identity: {
              workflow: 'Context Kernel Hardcoding Report',
              run_id: process.env.GITHUB_RUN_ID,
              candidate_kind: 'head',
              candidate_sha: process.env.CI_CANDIDATE_SHA,
              source_head_sha: process.env.CI_CANDIDATE_SHA,
              head_ref: process.env.CANDIDATE_HEAD_REF,
              base_ref: process.env.CANDIDATE_BASE_REF
            },
            outcome: runtime.length ? 'blocked' : 'passed',
            counts: {
              finding_count: active.length,
              runtime_finding_count: runtime.length,
              suppressed_count: Number(source.summary?.suppressed_count || 0)
            },
            first_blocking_finding: first,
            source_report: {
              contract: source.contract,
              candidate_kind: source.candidate_kind,
              candidate_sha: source.candidate_sha,
              ok: source.ok,
              secrets_included: source.secrets_included,
              scan_scope: source.scan_scope || null,
              sha256: crypto.createHash('sha256').update(sourceText).digest('hex')
            },
            routing: {
              source_of_truth: 'canonical_summary',
              structured_source_report_role: 'authoritative_input',
              workflow_job_status_role: 'transport_and_completion_signal',
              job_logs_role: 'diagnostic_only',
              consult_job_logs: false
            },
            secrets_included: false
          };
          fs.writeFileSync(process.env.RUNNER_TEMP + '/context-kernel-hardcoding-summary.json', JSON.stringify(summary, null, 2) + '\n');
          const lines = [
            '# Context Kernel hardcoding report',
            '',
            `- Outcome: **${summary.outcome}**`,
            `- Candidate kind: \`${summary.identity.candidate_kind}\``,
            `- Exact candidate SHA: \`${summary.identity.candidate_sha}\``,
            `- Head/Base: \`${summary.identity.head_ref}\` → \`${summary.identity.base_ref}\``,
            `- Source contract: \`${summary.source_report.contract}\``,
            `- Active findings: **${summary.counts.finding_count}**`,
            `- Runtime blocking findings: **${summary.counts.runtime_finding_count}**`,
            `- Suppressed findings: **${summary.counts.suppressed_count}**`,
            '- Evidence authority: **canonical summary → structured scanner report → job status**',
            '- Job logs: **diagnostic-only; not required for the decision**'
          ];
          if (first) {
            lines.push('', '## First blocking finding', '', `- Rule: \`${first.rule_id}\``, `- Path: \`${first.path}:${first.line}\``, `- Zone: \`${first.zone}\``, `- Message: ${first.message}`, `- Remediation: ${first.remediation}`, `- Bounded evidence: \`${String(first.evidence || '').replace(/`/g, '\\`')}\``);
          }
          const markdown = lines.join('\n') + '\n';
          fs.writeFileSync(process.env.RUNNER_TEMP + '/context-kernel-hardcoding-summary.md', markdown);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, markdown);
          NODE

      - name: Upload canonical hardcoding evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-kernel-hardcoding-summary-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/context-kernel-hardcoding-source.json
            ${{ runner.temp }}/context-kernel-hardcoding-summary.json
            ${{ runner.temp }}/context-kernel-hardcoding-summary.md
          if-no-files-found: error
          retention-days: 30

      - name: Enforce canonical report decision
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/context-kernel-hardcoding-summary.json', 'utf8'));
          if (report.outcome !== 'blocked') process.exit(0);
          const finding = report.first_blocking_finding || {};
          const title = `Context Kernel ${finding.rule_id || 'hardcoding finding'}`.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
          const message = `${finding.path || 'unknown'}:${finding.line || 0} ${finding.message || 'Runtime finding detected.'}`.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
          console.log(`::error title=${title}::${message}`);
          process.exit(1);
          NODE
