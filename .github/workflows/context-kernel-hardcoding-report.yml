name: Context Kernel Hardcoding Report

on:
  workflow_dispatch:
  push:
    branches:
      - gpt/post-production-local-connector-closure-20260731
  pull_request:
    branches: [main]
    paths:
      - "http-generic-api/**"
      - "src/**"
      - "specs/012-unified-admin-tenant-context-kernel/**"
      - "docs/context-kernel/**"
      - ".github/workflows/context-kernel-hardcoding-report.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: context-kernel-hardcoding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: Context Kernel Hardcoding Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Test scanner behavior
        working-directory: http-generic-api
        run: node test-context-kernel-hardcoding-scan.mjs

      - name: Generate report-only baseline
        if: always()
        run: >-
          node http-generic-api/scripts/context-kernel-hardcoding-scan.mjs
          --report-only
          --format=github
          --output="${{ runner.temp }}/context-kernel-hardcoding-report.json"

      - name: Summarize aggregate baseline
        if: always()
        env:
          REPORT_PATH: ${{ runner.temp }}/context-kernel-hardcoding-report.json
        run: |
          if [[ ! -f "$REPORT_PATH" ]]; then
            echo "::warning::Context kernel baseline report was not generated."
            exit 0
          fi
          node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, "utf8"));
            console.log(`CONTEXT_KERNEL_BASELINE_SUMMARY=${JSON.stringify(report.summary)}`);
          '

      - name: Upload baseline artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-kernel-hardcoding-report
          path: ${{ runner.temp }}/context-kernel-hardcoding-report.json
          if-no-files-found: error
          retention-days: 14

  post-production-local-connector-closure:
    name: Post-Production Local Connector Closure
    if: github.ref_name == 'gpt/post-production-local-connector-closure-20260731' || github.head_ref == 'gpt/post-production-local-connector-closure-20260731'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RUNTIME_BASE_URL: https://auth.mad4b.com
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      HOTFIX_MERGE_SHA: 792ff63af82791e9a482029f5078931fa0707c8c
      ADMIN_USER_ID: 00000000-0000-4000-a000-000000000002
      PLATFORM_TENANT_ID: 00000000-0000-4000-a000-000000000001
      DEVICE_ID: mohammedlap
      BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
      GH_READ_TOKEN: ${{ github.token }}
      EVIDENCE_PATH: ${{ runner.temp }}/local-connector-production-closure.json
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Verify Production runtime and close Local Connector acceptance
        run: node .github/scripts/post-production-local-connector-closure.mjs

      - name: Upload bounded closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-connector-production-closure-${{ github.run_id }}
          path: ${{ env.EVIDENCE_PATH }}
          if-no-files-found: warn
          retention-days: 30

      - name: Record closure workflow outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CLOSURE_JOB_STATUS: ${{ job.status }}
          CLOSURE_PR_NUMBER: "3981"
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPOSITORY}/issues/${CLOSURE_PR_NUMBER}/comments" \
            -f body="POST_PRODUCTION_LOCAL_CONNECTOR_CLOSURE_RUN status=${CLOSURE_JOB_STATUS} run_id=${GITHUB_RUN_ID} head_sha=${GITHUB_SHA} artifact=local-connector-production-closure-${GITHUB_RUN_ID}"
