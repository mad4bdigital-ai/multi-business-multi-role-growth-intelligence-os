name: HTTP Generic API Fanout Relocation Apply

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Existing same-repository work branch to update."
        required: true
        type: string
      expected_head_sha:
        description: "Exact current remote head SHA authorized for mutation."
        required: true
        type: string
      scope:
        description: "Only scripts is write-enabled."
        required: true
        default: "scripts"
        type: choice
        options:
          - scripts
      max_files:
        description: "Maximum safe files to relocate in one apply run."
        required: true
        default: "20"

permissions:
  contents: write

concurrency:
  group: http-generic-api-fanout-relocation-apply-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  fanout-relocation-apply:
    runs-on: ubuntu-24.04
    env:
      TARGET_BRANCH: ${{ inputs.target_branch }}
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      FANOUT_RELOCATION_SCOPE: ${{ inputs.scope }}
      FANOUT_RELOCATION_MAX_FILES: ${{ inputs.max_files }}
    steps:
      - name: Validate exact mutable branch identity before checkout
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format --branch "${TARGET_BRANCH}"
          [[ "${TARGET_BRANCH}" =~ ^(gpt|fix|feat|chore|docs|release|cert)/[A-Za-z0-9._/-]+$ ]]
          if [[ "${TARGET_BRANCH}" == "main" || "${TARGET_BRANCH}" == "Production" || "${TARGET_BRANCH}" == "master" ]]; then
            echo "Refusing protected branch ${TARGET_BRANCH}" >&2
            exit 1
          fi
          [[ "${EXPECTED_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          current_head_sha="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${current_head_sha}" = "${EXPECTED_HEAD_SHA}"

      - name: Checkout exact authorized head
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.expected_head_sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Re-read exact local and remote head
        shell: bash
        run: |
          set -euo pipefail
          current_head_sha="$(git rev-parse HEAD)"
          remote_head_sha="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${current_head_sha}" = "${EXPECTED_HEAD_SHA}"
          test "${remote_head_sha}" = "${EXPECTED_HEAD_SHA}"

      - name: Apply safe fanout relocations
        working-directory: http-generic-api
        env:
          FANOUT_RELOCATION_MODE: apply
          FANOUT_RELOCATION_JSON: "true"
        run: >-
          node scripts/fanout-relocation-ci.mjs
          --mode=apply
          --scope="${FANOUT_RELOCATION_SCOPE}"
          --max-files="${FANOUT_RELOCATION_MAX_FILES}"
          --json

      - name: Validate relocation tooling
        working-directory: http-generic-api
        run: node test-fanout-relocation-ci.mjs

      - name: Commit and push exact bounded relocation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No relocation changes to commit."
            exit 0
          fi
          remote_head_sha="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head_sha}" = "${EXPECTED_HEAD_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add http-generic-api/scripts .github/workflows/http-generic-api-fanout-relocation.yml
          git commit -m "Apply HTTP generic API script taxonomy relocation"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          result_head_sha="$(git rev-parse HEAD)"
          remote_head_sha="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head_sha}" = "${result_head_sha}"
