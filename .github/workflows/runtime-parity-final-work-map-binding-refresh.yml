name: One-shot Runtime Parity Final Work Map Binding Refresh

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]
    paths:
      - .github/workflows/runtime-parity-final-work-map-binding-refresh.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: runtime-parity-final-work-map-binding-refresh-pr-5985
  cancel-in-progress: true

jobs:
  refresh:
    if: >-
      github.event.pull_request.number == 5985 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/add-runtime-parity-comment-bridge-v2-20260804' &&
      github.event.pull_request.base.ref == 'main' &&
      github.actor == 'mad4bdigital-ai'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      TARGET_BRANCH: gpt/add-runtime-parity-comment-bridge-v2-20260804
      EXPECTED_PARENT_SHA: c58ee81cc0bf817cf8e6cd396cde3574800b928c
      LAUNCHER_PATH: .github/workflows/runtime-parity-final-work-map-binding-refresh.yml
      MANIFEST_PATH: specs/014-governed-hostinger-storage-orchestration/work-map-integration.json
      TASKS_PATH: specs/014-governed-hostinger-storage-orchestration/tasks.md
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact refresh request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Pin branch, parent, current main, and scope
        shell: bash
        run: |
          set -Eeuo pipefail
          current_sha="$(git rev-parse HEAD)"
          parent_sha="$(git rev-parse HEAD^)"
          remote_sha="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${parent_sha}" = "${EXPECTED_PARENT_SHA}"
          test "${remote_sha}" = "${current_sha}"

          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          test "${main_sha}" = "$(git merge-base origin/main HEAD)"
          echo "PINNED_MAIN_SHA=${main_sha}" >> "${GITHUB_ENV}"
          echo "REFRESH_REQUEST_SHA=${current_sha}" >> "${GITHUB_ENV}"

          mapfile -t request_files < <(git diff --name-only "${EXPECTED_PARENT_SHA}..HEAD")
          test "${#request_files[@]}" = 1
          test "${request_files[0]}" = "${LAUNCHER_PATH}"

          actual_scope="$(git diff --name-only origin/main...HEAD | sort)"
          expected_scope="$(printf '%s\n' \
            '.changes/e2e/production-runtime-parity-comment-bridge.json' \
            '.github/workflows/production-runtime-parity-comment-bridge.yml' \
            '.github/workflows/runtime-parity-final-work-map-binding-refresh.yml' \
            'docs/work-maps/README.md' \
            'docs/work-maps/repository-automation-map.md' \
            'http-generic-api/scripts/test-production-runtime-parity-comment-bridge.mjs' | sort)"
          test "${actual_scope}" = "${expected_scope}"

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/5985")"
          test "$(jq -r '.state' <<<"${pr_json}")" = open
          test "$(jq -r '.draft' <<<"${pr_json}")" = false
          test "$(jq -r '.head.sha' <<<"${pr_json}")" = "${current_sha}"

      - name: Refresh final binding and prove deterministic readiness
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm -- "${LAUNCHER_PATH}"
          test ! -e "${LAUNCHER_PATH}"

          node --check http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs
          node --check http-generic-api/scripts/spec014-final-work-map-readback.mjs
          node --check http-generic-api/scripts/platform-work-map-generator.mjs

          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            | tee "${RUNNER_TEMP}/binding-refresh.json"

          unexpected="$(git status --short | awk '{print $2}' | grep -Ev '^(\.github/workflows/runtime-parity-final-work-map-binding-refresh\.yml|specs/014-governed-hostinger-storage-orchestration/(work-map-integration\.json|tasks\.md))$' || true)"
          test -z "${unexpected}"

          node http-generic-api/scripts/platform-work-map-generator.mjs --check \
            | tee "${RUNNER_TEMP}/work-map-check.json"

          REPORT_PATH="${RUNNER_TEMP}/binding-readback.json" \
            node http-generic-api/scripts/spec014-final-work-map-readback.mjs \
            | tee "${RUNNER_TEMP}/binding-readback-stdout.json"

          node - "${RUNNER_TEMP}/binding-readback.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!report.ok) process.exit(1);
          if (report.findings.length !== 0) process.exit(1);
          if (report.classification.coverage_percent !== 100) process.exit(1);
          if (report.secrets_included !== false) process.exit(1);
          NODE

          git restore --source="${REFRESH_REQUEST_SHA}" --staged --worktree -- "${LAUNCHER_PATH}"
          test -f "${LAUNCHER_PATH}"
          unexpected_after_restore="$(git status --short | awk '{print $2}' | grep -Ev '^specs/014-governed-hostinger-storage-orchestration/(work-map-integration\.json|tasks\.md)$' || true)"
          test -z "${unexpected_after_restore}"

      - name: Commit and push bounded binding refresh
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${PINNED_MAIN_SHA}"
          remote_sha="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_sha}" = "${REFRESH_REQUEST_SHA}"

          changed="$(git status --short)"
          printf '%s\n' "${changed}"
          actual_changed="$(git status --short | awk '{print $2}' | sort)"
          expected_changed="$(printf '%s\n' "${MANIFEST_PATH}" "${TASKS_PATH}" | sort)"
          test "${actual_changed}" = "${expected_changed}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${MANIFEST_PATH}" "${TASKS_PATH}"
          git diff --cached --quiet && {
            echo 'Expected deterministic binding refresh changes.' >&2
            exit 1
          }
          git commit -m 'docs(work-maps): refresh final Spec 014 registry binding'
          result_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          test "$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${result_sha}"
          echo "result_sha=${result_sha}" >> "${GITHUB_OUTPUT}"

      - name: Publish bounded refresh evidence
        if: always()
        shell: bash
        env:
          RESULT_SHA: ${{ steps.publish.outputs.result_sha }}
        run: |
          set -Eeuo pipefail
          outcome=passed
          if [[ "${{ job.status }}" != success ]]; then outcome=blocked; fi
          {
            echo '## Final Work Map Binding Refresh'
            echo
            echo "\`WORK_MAP_BINDING_REFRESH outcome=${outcome} request_sha=${REFRESH_REQUEST_SHA:-unresolved} result_sha=${RESULT_SHA:-unresolved} pinned_main_sha=${PINNED_MAIN_SHA:-unresolved} files=2 temporary_workflow_removed=false protected_branch_mutation=false production_mutation=false force_push=false secrets_included=false\`"
          } >> "${GITHUB_STEP_SUMMARY}"
