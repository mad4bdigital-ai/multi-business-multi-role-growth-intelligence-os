name: EC0 Integrity and Bounds Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  review:
    if: github.event.pull_request.head.ref == 'gpt/spec-012-execution-capsule-contract-20260730'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: gpt/spec-012-execution-capsule-contract-20260730
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check review helpers before mutation
        working-directory: http-generic-api
        run: |
          node --check scripts/apply-ec0-integrity-and-bounds-review.mjs
          node --check scripts/apply-ec0-integrity-reconstruction-fix.mjs

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Apply exact integrity and bounds review
        working-directory: http-generic-api
        run: |
          node scripts/apply-ec0-integrity-and-bounds-review.mjs
          node scripts/apply-ec0-integrity-reconstruction-fix.mjs

      - name: Verify EC0 and Context Kernel contracts
        working-directory: http-generic-api
        run: |
          node --check contextKernel/domain/executionCapsule.js
          node --check contextKernel/application/executionCapsuleService.js
          node --check test-execution-capsule-contract.mjs
          node test-execution-capsule-contract.mjs
          node test-context-kernel-domain.mjs
          node test-context-kernel-application-use-cases.mjs
          node test-context-kernel-cross-tenant-isolation.mjs
          printf '%s\n' \
            'http-generic-api/contextKernel/domain/executionCapsule.js' \
            'http-generic-api/contextKernel/domain/index.js' \
            'http-generic-api/contextKernel/application/executionCapsuleService.js' \
            'http-generic-api/test-execution-capsule-contract.mjs' \
            > "$RUNNER_TEMP/ec0-integrity-files.txt"
          node scripts/context-kernel-hardcoding-scan.mjs \
            --fail-on=runtime \
            --changed-files-from="$RUNNER_TEMP/ec0-integrity-files.txt"

      - name: Enforce exact write set
        run: |
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            'http-generic-api/contextKernel/application/executionCapsuleService.js'
            'http-generic-api/contextKernel/domain/executionCapsule.js'
            'http-generic-api/contextKernel/domain/index.js'
            'http-generic-api/test-execution-capsule-contract.mjs'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")

      - name: Commit reviewed EC0 contract
        run: |
          git config user.name 'mad4b-governed-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            http-generic-api/contextKernel/application/executionCapsuleService.js \
            http-generic-api/contextKernel/domain/executionCapsule.js \
            http-generic-api/contextKernel/domain/index.js \
            http-generic-api/test-execution-capsule-contract.mjs
          git commit -m 'fix(spec-012): enforce capsule integrity and bounded dependencies'
          git push origin HEAD:gpt/spec-012-execution-capsule-contract-20260730
