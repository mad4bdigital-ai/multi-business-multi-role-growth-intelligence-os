name: Spec 011 T012 Resource Graph Hardening

on:
  push:
    branches:
      - gpt/011-ueacp-t012-bounded-resource-graph-20260730
    paths:
      - .github/workflows/spec-011-t012-resource-graph-hardening.yml

permissions:
  contents: write

concurrency:
  group: spec-011-t012-resource-graph-hardening
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gpt/011-ueacp-t012-bounded-resource-graph-20260730
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Apply bounded contract hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          root = Path('http-generic-api')

          def replace_once(path, old, new, label):
              source = path.read_text(encoding='utf-8')
              if new in source:
                  print(f'{label}: already applied')
                  return
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}_anchor_count:{count}')
              path.write_text(source.replace(old, new, 1), encoding='utf-8')

          policy = root / 'contextKernel/domain/resourceGraphPolicy.js'
          replace_once(
              policy,
              'const REASON_CODE_PATTERN = /^[A-Z][A-Z0-9_]{2,190}$/;\n',
              'const REASON_CODE_PATTERN = /^[A-Z][A-Z0-9_]{2,190}$/;\nconst RESTRICTION_STATUSES = new Set(["active", "inactive", "revoked", "expired"]);\n',
              'restriction_status_catalog',
          )
          replace_once(
              policy,
              '''function normalizeNode(record, tenantRef) {
            if (!record || typeof record !== "object" || Array.isArray(record)) {
              throw new TypeError("resource graph nodes must be objects.");
            }
            return {
              nodeRef: requireIdentifier(record.nodeRef, "node.nodeRef"),
              resourceType: requireIdentifier(record.resourceType, "node.resourceType"),
              resourceRef: requireIdentifier(record.resourceRef, "node.resourceRef"),
              tenantRef: requireIdentifier(record.tenantRef, "node.tenantRef"),
              workspaceRef: optionalIdentifier(record.workspaceRef, "node.workspaceRef"),
              status: requireIdentifier(record.status, "node.status").toLowerCase(),
              revokedAt: record.revokedAt || null,
              validFrom: record.validFrom || null,
              validUntil: record.validUntil || record.expiresAt || null,
              sourceRef: optionalIdentifier(record.sourceRef, "node.sourceRef"),
              versionRef: optionalIdentifier(record.versionRef, "node.versionRef"),
              metadata: record.metadata && typeof record.metadata === "object" && !Array.isArray(record.metadata)
                ? { ...record.metadata }
                : {},
              tenantMismatch: record.tenantRef !== tenantRef,
            };
          }
          ''',
              '''function normalizeNode(record) {
            if (!record || typeof record !== "object" || Array.isArray(record)) {
              throw new TypeError("resource graph nodes must be objects.");
            }
            return {
              nodeRef: requireIdentifier(record.nodeRef, "node.nodeRef"),
              resourceType: requireIdentifier(record.resourceType, "node.resourceType"),
              resourceRef: requireIdentifier(record.resourceRef, "node.resourceRef"),
              tenantRef: requireIdentifier(record.tenantRef, "node.tenantRef"),
              workspaceRef: optionalIdentifier(record.workspaceRef, "node.workspaceRef"),
              status: requireIdentifier(record.status, "node.status").toLowerCase(),
              revokedAt: record.revokedAt || null,
              validFrom: record.validFrom || null,
              validUntil: record.validUntil || record.expiresAt || null,
              sourceRef: optionalIdentifier(record.sourceRef, "node.sourceRef"),
              versionRef: optionalIdentifier(record.versionRef, "node.versionRef"),
              metadata: record.metadata && typeof record.metadata === "object" && !Array.isArray(record.metadata)
                ? { ...record.metadata }
                : {},
            };
          }
          ''',
              'remove_internal_tenant_mismatch',
          )
          replace_once(
              policy,
              '''  return {
            restrictionRef: requireIdentifier(record.restrictionRef, "restriction.restrictionRef"),
            nodeRef: requireIdentifier(record.nodeRef, "restriction.nodeRef"),
            effect,
            operations,
            reasonCode,
            status: requireIdentifier(record.status, "restriction.status").toLowerCase(),
          ''',
              '''  const status = requireIdentifier(record.status, "restriction.status").toLowerCase();
            if (!RESTRICTION_STATUSES.has(status)) {
              throw new TypeError(`Unsupported resource graph restriction status: ${status}`);
            }
            return {
              restrictionRef: requireIdentifier(record.restrictionRef, "restriction.restrictionRef"),
              nodeRef: requireIdentifier(record.nodeRef, "restriction.nodeRef"),
              effect,
              operations,
              reasonCode,
              status,
          ''',
              'restriction_status_fail_closed',
          )
          replace_once(
              policy,
              '''  for (const rawNode of rawNodes) {
            const node = normalizeNode(rawNode, normalizedTenantRef);
            if (nodeMap.has(node.nodeRef)) return blocked(["RESOURCE_GRAPH_NODE_REFERENCE_AMBIGUOUS"]);
            if (node.tenantMismatch) return blocked(["RESOURCE_GRAPH_CROSS_TENANT_NODE"]);
          ''',
              '''  for (const rawNode of rawNodes) {
            const node = normalizeNode(rawNode);
            if (nodeMap.has(node.nodeRef)) return blocked(["RESOURCE_GRAPH_NODE_REFERENCE_AMBIGUOUS"]);
            if (node.tenantRef !== normalizedTenantRef) return blocked(["RESOURCE_GRAPH_CROSS_TENANT_NODE"]);
          ''',
              'tenant_check_without_output_field',
          )
          replace_once(
              policy,
              '''    bounds: {
              maxDepth: normalizedMaxDepth,
              maxNodes: normalizedMaxNodes,
              relationTypes: normalizedRelationTypes,
          ''',
              '''    bounds: {
              maxDepth: normalizedMaxDepth,
              maxNodes: normalizedMaxNodes,
              maxEdges: normalizedMaxNodes * 8,
              maxRestrictions: normalizedMaxNodes * 4,
              relationTypes: normalizedRelationTypes,
          ''',
              'explicit_derived_bounds',
          )

          service = root / 'contextKernel/application/resourceGraphResolverService.js'
          replace_once(
              service,
              '''    const principalRef = requireApplicationString(principal.principalRef, "principal.principalRef");
              const subjectRef = requireApplicationString(effectiveSubject.subjectRef, "effectiveSubject.subjectRef");
          ''',
              '''    const principalType = requireApplicationString(
                principal.principalType,
                "principal.principalType",
              );
              const principalRef = requireApplicationString(principal.principalRef, "principal.principalRef");
              const subjectType = requireApplicationString(
                effectiveSubject.subjectType,
                "effectiveSubject.subjectType",
              );
              const subjectRef = requireApplicationString(effectiveSubject.subjectRef, "effectiveSubject.subjectRef");
          ''',
              'bind_actor_subject_types',
          )
          replace_once(
              service,
              '''    const snapshot = await boundedResourceGraphRepository.findBoundedResourceGraph({
                principalRef,
                subjectRef,
          ''',
              '''    const snapshot = await boundedResourceGraphRepository.findBoundedResourceGraph({
                principalType,
                principalRef,
                subjectType,
                subjectRef,
          ''',
              'repository_type_binding',
          )
          replace_once(
              service,
              '''      actor: {
                principalType: principal.principalType,
                principalRef,
              },
              effectiveSubject: {
                subjectType: effectiveSubject.subjectType,
          ''',
              '''      actor: {
                principalType,
                principalRef,
              },
              effectiveSubject: {
                subjectType,
          ''',
              'normalized_output_types',
          )

          happy = root / 'test-context-kernel-resource-graph-resolver.mjs'
          replace_once(
              happy,
              'assert.equal(Object.hasOwn(result, "credentialPayload"), false);\n',
              'assert.equal(Object.hasOwn(result, "credentialPayload"), false);\nassert.equal(result.nodes.some((node) => Object.hasOwn(node, "tenantMismatch")), false);\nassert.equal(result.bounds.maxEdges, 80);\nassert.equal(result.bounds.maxRestrictions, 40);\n',
              'happy_output_contract',
          )
          replace_once(
              happy,
              '''assert.deepEqual(calls[0], {
            principalRef: "user-a",
            subjectRef: "user-a",
          ''',
              '''assert.deepEqual(calls[0], {
            principalType: "tenant_user",
            principalRef: "user-a",
            subjectType: "tenant_user",
            subjectRef: "user-a",
          ''',
              'happy_repository_type_binding',
          )

          fail = root / 'test-context-kernel-resource-graph-fail-closed.mjs'
          replace_once(
              fail,
              'await expectBlocked(snapshot({ stale: true }), "RESOURCE_GRAPH_SNAPSHOT_STALE");\n',
              '''await expectBlocked(snapshot({ stale: true }), "RESOURCE_GRAPH_SNAPSHOT_STALE");
          await expectBlocked(
            snapshot({ nodes: [{ ...rootNode, resourceRef: "workspace-other" }] }),
            "RESOURCE_GRAPH_ROOT_IDENTITY_MISMATCH",
          );
          await assert.rejects(
            () => resolverFor(snapshot({
              restrictions: [{
                restrictionRef: "restriction-unknown-status",
                nodeRef: "workspace:workspace-a",
                effect: "deny",
                operations: ["read"],
                reasonCode: "UNKNOWN_STATUS_MUST_BLOCK",
                status: "pending",
              }],
            })).resolve(input()),
            /Unsupported resource graph restriction status: pending/,
          );
          ''',
              'fail_closed_regressions',
          )
          PY

      - name: Verify focused contract and safety boundaries
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          node --check contextKernel/domain/resourceGraphPolicy.js
          node --check contextKernel/application/resourceGraphResolverService.js
          node --check test-context-kernel-resource-graph-resolver.mjs
          node --check test-context-kernel-resource-graph-fail-closed.mjs
          node test-context-kernel-resource-graph-resolver.mjs
          node test-context-kernel-resource-graph-fail-closed.mjs

      - name: Commit bounded hardening and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/spec-011-t012-resource-graph-hardening.yml
          git add \
            http-generic-api/contextKernel/domain/resourceGraphPolicy.js \
            http-generic-api/contextKernel/application/resourceGraphResolverService.js \
            http-generic-api/test-context-kernel-resource-graph-resolver.mjs \
            http-generic-api/test-context-kernel-resource-graph-fail-closed.mjs
          python3 <<'PY'
          import subprocess
          expected = {
              '.github/workflows/spec-011-t012-resource-graph-hardening.yml',
              'http-generic-api/contextKernel/domain/resourceGraphPolicy.js',
              'http-generic-api/contextKernel/application/resourceGraphResolverService.js',
              'http-generic-api/test-context-kernel-resource-graph-resolver.mjs',
              'http-generic-api/test-context-kernel-resource-graph-fail-closed.mjs',
          }
          changed = set(filter(None, subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True
          ).splitlines()))
          if changed != expected:
              raise SystemExit(f'bounded_write_set_mismatch:expected={sorted(expected)}:actual={sorted(changed)}')
          PY
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(spec-011): harden bounded resource graph identity and restrictions"
          git push origin HEAD:gpt/011-ueacp-t012-bounded-resource-graph-20260730
