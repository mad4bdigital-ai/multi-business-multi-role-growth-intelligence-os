name: HTTP Generic API Fanout Relocation

on:
  pull_request:
    paths:
      - "http-generic-api/scripts/**"
      - "http-generic-api/test-fanout-relocation-ci.mjs"
      - ".github/workflows/http-generic-api-fanout-relocation.yml"
      - ".github/workflows/http-generic-api-fanout-relocation-apply.yml"
  workflow_dispatch:
    inputs:
      scope:
        description: "Relocation report scope."
        required: true
        default: "scripts"
        type: choice
        options:
          - scripts
          - all
      max_files:
        description: "Maximum files to include in the bounded report."
        required: true
        default: "20"

permissions:
  contents: read

jobs:
  fanout-relocation-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull-request head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout selected branch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Report fanout relocation taxonomy
        working-directory: http-generic-api
        env:
          FANOUT_RELOCATION_MODE: report
          FANOUT_RELOCATION_SCOPE: ${{ github.event.inputs.scope || 'scripts' }}
          FANOUT_RELOCATION_MAX_FILES: ${{ github.event.inputs.max_files || '20' }}
          FANOUT_RELOCATION_JSON: "true"
        run: node scripts/fanout-relocation-ci.mjs --json

      - name: Validate relocation tooling
        working-directory: http-generic-api
        run: node test-fanout-relocation-ci.mjs
