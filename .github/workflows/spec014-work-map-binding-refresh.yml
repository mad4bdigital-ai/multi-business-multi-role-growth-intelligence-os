name: Spec 014 Work Map Binding Refresh

on:
  push:
    branches:
      - gpt/spec014-work-map-binding-refresh-07a863-20260804
    paths:
      - .github/workflows/spec014-work-map-binding-refresh.yml

permissions:
  contents: write

concurrency:
  group: spec014-work-map-binding-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact launcher head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify immutable launcher topology
        shell: bash
        env:
          EXPECTED_PARENT: 07a863372f9e5437065b477d502e7eecc3ee6d36
          LAUNCHER_PATH: .github/workflows/spec014-work-map-binding-refresh.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$LAUNCHER_PATH"
          test "$(git status --porcelain | wc -l)" -eq 0

      - name: Refresh through canonical producer
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            --spec-dir specs/014-governed-hostinger-storage-orchestration \
            --write

      - name: Enforce exact generated scope
        shell: bash
        env:
          MANIFEST_PATH: specs/014-governed-hostinger-storage-orchestration/work-map-integration.json
          TASKS_PATH: specs/014-governed-hostinger-storage-orchestration/tasks.md
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain | sed -E 's/^...//' | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$MANIFEST_PATH"
          grep -q -- '- \[x\] \*\*T006\*\*' "$TASKS_PATH"
          git diff --check

      - name: Validate canonical readback
        shell: bash
        run: |
          set -euo pipefail
          REPORT_PATH="$RUNNER_TEMP/spec014-final-work-map-readback.json" \
            node http-generic-api/scripts/spec014-final-work-map-readback.mjs
          node - "$RUNNER_TEMP/spec014-final-work-map-readback.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (report.ok !== true) throw new Error('readback_not_current');
          if ((report.findings || []).length !== 0) throw new Error('unexpected_findings');
          if (report.repository_mutation !== false) throw new Error('invalid_repository_mutation_flag');
          if (report.provider_dispatch !== false) throw new Error('provider_dispatch_detected');
          if (report.live_database_access !== false) throw new Error('live_database_access_detected');
          if (report.migration_apply !== false) throw new Error('migration_apply_detected');
          if (report.secrets_included !== false) throw new Error('secrets_included');
          NODE

      - name: Remove one-shot launcher
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/spec014-work-map-binding-refresh.yml
          git diff --check

      - name: Commit generated manifest only
        shell: bash
        env:
          BRANCH: gpt/spec014-work-map-binding-refresh-07a863-20260804
          EXPECTED_EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_EVENT_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/014-governed-hostinger-storage-orchestration/work-map-integration.json
          git add -u .github/workflows/spec014-work-map-binding-refresh.yml
          mapfile -t staged < <(git diff --cached --name-only | sort)
          test "${#staged[@]}" -eq 2
          test "${staged[0]}" = ".github/workflows/spec014-work-map-binding-refresh.yml"
          test "${staged[1]}" = "specs/014-governed-hostinger-storage-orchestration/work-map-integration.json"
          git commit -m 'chore(spec-014): refresh final Work Map binding'
          remote_head="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_EVENT_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Final bounded summary
        shell: bash
        run: |
          set -euo pipefail
          echo 'SPEC014_WORK_MAP_BINDING_REFRESH=success'
          echo "RESULT_HEAD_SHA=$(git rev-parse HEAD)"
          echo 'CHANGED_FILE=specs/014-governed-hostinger-storage-orchestration/work-map-integration.json'
          echo 'SECRETS_INCLUDED=false'
          echo 'PROVIDER_DISPATCH=false'
          echo 'LIVE_DATABASE_ACCESS=false'
          echo 'MIGRATION_APPLY=false'
          echo 'PRODUCTION_MUTATION=false'
