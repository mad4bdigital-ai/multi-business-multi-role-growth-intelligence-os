name: Hostinger Storage Authorized Mount Executor Guard

on:
  pull_request:
    paths:
      - '.github/workflows/hostinger-storage-authorized-mount-executor-guard.yml'

permissions:
  contents: write

concurrency:
  group: hostinger-storage-authorized-mount-executor-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bounded-fingerprint-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Apply bounded diagnostic and restore canonical guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('http-generic-api/hostingerStorageAuthorizedMountExecutor.js')
          text = path.read_text(encoding='utf-8')
          old = "    throw fail(409, 'STORAGE_AUTHORIZED_MOUNT_DATABASE_FINGERPRINT_MISMATCH', 'Registry and runtime composition must bind the same database fingerprint.');"
          new = """    throw fail(409, 'STORAGE_AUTHORIZED_MOUNT_DATABASE_FINGERPRINT_MISMATCH', 'Registry and runtime composition must bind the same database fingerprint.', {
      registry_fingerprint: registry.database_fingerprint,
      registry_fingerprint_source: 'authorization_registry.database_fingerprint',
      registry_fingerprint_present: registry.database_fingerprint !== undefined && registry.database_fingerprint !== null,
      registry_fingerprint_type: typeof registry.database_fingerprint,
      registry_fingerprint_length: typeof registry.database_fingerprint === 'string' ? registry.database_fingerprint.length : null,
      runtime_composition_fingerprint: composition.schema_provenance.database_fingerprint,
      runtime_composition_fingerprint_source: 'runtime_composition.schema_provenance.database_fingerprint',
      runtime_composition_fingerprint_present: composition.schema_provenance.database_fingerprint !== undefined && composition.schema_provenance.database_fingerprint !== null,
      runtime_composition_fingerprint_type: typeof composition.schema_provenance.database_fingerprint,
      runtime_composition_fingerprint_length: typeof composition.schema_provenance.database_fingerprint === 'string' ? composition.schema_provenance.database_fingerprint.length : null,
    });"""
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one fingerprint mismatch guard, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git show HEAD^:.github/workflows/hostinger-storage-authorized-mount-executor-guard.yml > .github/workflows/hostinger-storage-authorized-mount-executor-guard.yml
          node --check http-generic-api/hostingerStorageAuthorizedMountExecutor.js

      - name: Persist bounded diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add http-generic-api/hostingerStorageAuthorizedMountExecutor.js .github/workflows/hostinger-storage-authorized-mount-executor-guard.yml
          git commit -m "test(spec-014): add bounded mount fingerprint diagnostic"
          git push origin HEAD:gpt/014-hostinger/authorized-mount-executor-20260802

      - name: Expose bounded mismatch through the canonical test
        run: node http-generic-api/test-hostinger-storage-authorized-mount-executor.mjs
