name: Sprint 69 Migration 1043 Readback Certification

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  certify-readback:
    name: Certify Migration 1043 ledger and readiness without Apply
    if: >-
      github.event.issue.number == 4449 &&
      !github.event.issue.pull_request &&
      github.event.comment.body == 'CERTIFY_1043_SPRINT69_TENANT_MANAGED_EXECUTION_LIFECYCLE_READBACK' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: sprint69-migration-1043-readback-certification
      cancel-in-progress: false
    env:
      RUNTIME_BASE_URL: https://auth.mad4b.com
      BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
      GH_READ_TOKEN: ${{ github.token }}
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      CONTROL_ISSUE: '4449'
      EVIDENCE_DIR: .artifacts/sprint69-1043-readback-certification
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Execute readback-only Migration 1043 certification
        run: node .github/ops/sprint69-1043-readback-certify.mjs

      - name: Upload no-secret readback certification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sprint69-1043-readback-certification-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish readback certification summary
        if: always()
        shell: bash
        run: |
          node <<'NODE' >>"${GITHUB_STEP_SUMMARY}"
          const fs = require('node:fs');
          const dir = process.env.EVIDENCE_DIR;
          const summaryPath = `${dir}/summary.json`;
          const failurePath = `${dir}/failure.json`;
          if (fs.existsSync(summaryPath)) {
            const s = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
            process.stdout.write(`## Migration 1043 readback certification: pass\n\n- Result: ${s.result}\n- Main SHA: \`${s.main_sha}\`\n- Production SHA: \`${s.production_sha}\`\n- Exact ledger: ${s.exact_apply_ledger_verified}\n- Expected objects: ${s.expected_objects_verified}\n- Readiness view: ${s.readiness_view?.readiness_status || 'unverified'}\n- Readback only: ${s.readback_only}\n- Apply sent: ${s.apply_sent}\n- Migration Apply executed: ${s.migration_apply_executed}\n- Managed control-plane write: ${s.managed_control_plane_write_executed}\n- Secrets included: ${s.secrets_included}\n`);
          } else {
            const f = fs.existsSync(failurePath) ? JSON.parse(fs.readFileSync(failurePath, 'utf8')) : {};
            process.stdout.write(`## Migration 1043 readback certification: fail\n\n- Stage: ${f.stage || 'unknown'}\n- Main SHA: \`${f.main_sha || 'unverified'}\`\n- Production SHA: \`${f.production_sha || 'unverified'}\`\n- Error code: ${f.error?.code || 'workflow_failed'}\n- Readback only: ${f.readback_only ?? true}\n- Apply sent: ${f.apply_sent ?? false}\n- Migration Apply executed: ${f.migration_apply_executed ?? false}\n- Managed control-plane write: ${f.managed_control_plane_write_executed ?? false}\n- Secrets included: ${f.secrets_included ?? false}\n`);
          }
          NODE
