name: PR 6502 Finalize Governance Artifact

on:
  push:
    branches:
      - fix/push-workflow-runner-context-registration-main-ba10f269-20260806

permissions:
  actions: read
  contents: read

concurrency:
  group: pr6502-finalize-governance-artifact
  cancel-in-progress: false

jobs:
  finalize:
    if: github.repository == 'mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact finalizer head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify bounded branch and expected remote head
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_REF_NAME}" == "fix/push-workflow-runner-context-registration-main-ba10f269-20260806" ]]
          [[ "${GITHUB_REF_NAME}" != "main" ]]
          [[ "${GITHUB_REF_NAME}" != "Production" ]]
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          remote_head_sha="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          [[ "${remote_head_sha}" == "${GITHUB_SHA}" ]]
          [[ "$(git rev-parse HEAD^{tree})" != "e449b23cf62f210c0d64fe9931094049c5cf41c5" ]]

      - name: Download verified convergence delta
        uses: actions/download-artifact@v5
        with:
          name: pr6502-governance-convergence-d8ea58610314bd3d8dbd9d98ea021fce5abf65ae
          path: ${{ runner.temp }}/verified-convergence
          github-token: ${{ github.token }}
          run-id: 31109645120

      - name: Apply verified permanent delta and validate
        shell: bash
        run: |
          set -Eeuo pipefail
          source_dir="${RUNNER_TEMP}/verified-convergence"
          expected_patch_sha="ba72e7106509c3aa1ebb97416108c8c046e2c8e8ce9d45ecb6a935342a32e3d1"
          actual_patch_sha="$(sha256sum "${source_dir}/final.patch" | awk '{print $1}')"
          [[ "${actual_patch_sha}" == "${expected_patch_sha}" ]]
          [[ "$(cat "${source_dir}/expected-parent-sha.txt")" == "d8ea58610314bd3d8dbd9d98ea021fce5abf65ae" ]]
          [[ "$(cat "${source_dir}/rendered-tree-sha.txt")" == "e449b23cf62f210c0d64fe9931094049c5cf41c5" ]]

          git apply \
            --exclude=.github/scripts/pr6502-governance-convergence.py \
            --exclude=.github/workflows/pr6502-governance-convergence.yml \
            "${source_dir}/final.patch"
          rm -f .github/workflows/pr6502-finalize-governance-artifact.yml

          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          node http-generic-api/test-push-workflow-runner-context-registration.mjs
          node http-generic-api/test-production-certified-release-cut-validation-registration.mjs
          git diff --check

      - name: Package exact final delta
        shell: bash
        run: |
          set -Eeuo pipefail
          evidence_dir="${RUNNER_TEMP}/pr6502-final-governance-delta"
          mkdir -p "${evidence_dir}/files"
          git add -A
          git diff --cached --quiet && {
            echo "::error::finalizer produced no delta"
            exit 1
          }
          printf '%s\n' "${GITHUB_SHA}" > "${evidence_dir}/expected-parent-sha.txt"
          git write-tree > "${evidence_dir}/rendered-tree-sha.txt"
          [[ "$(cat "${evidence_dir}/rendered-tree-sha.txt")" == "e449b23cf62f210c0d64fe9931094049c5cf41c5" ]]
          git diff --cached --name-status > "${evidence_dir}/name-status.txt"
          git diff --cached --name-only --diff-filter=D > "${evidence_dir}/deleted-files.txt"
          git diff --cached --name-only --diff-filter=ACMRT > "${evidence_dir}/materialized-files.txt"
          while IFS= read -r path; do
            [[ -n "${path}" ]] || continue
            mkdir -p "${evidence_dir}/files/$(dirname "${path}")"
            cp -- "${path}" "${evidence_dir}/files/${path}"
          done < "${evidence_dir}/materialized-files.txt"
          git diff --cached --binary > "${evidence_dir}/final.patch"
          sha256sum "${evidence_dir}/final.patch" > "${evidence_dir}/final.patch.sha256"

      - name: Upload exact final governance delta
        uses: actions/upload-artifact@v4
        with:
          name: pr6502-final-governance-${{ github.sha }}
          path: ${{ runner.temp }}/pr6502-final-governance-delta
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
