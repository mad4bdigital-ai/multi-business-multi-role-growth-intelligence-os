name: PR 6502 Finalize Governance Artifact

on:
  push:
    branches:
      - fix/push-workflow-runner-context-registration-main-ba10f269-20260806

permissions:
  actions: read
  contents: write

concurrency:
  group: pr6502-finalize-governance-artifact
  cancel-in-progress: false

jobs:
  export:
    if: >-
      github.repository == 'mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os' &&
      github.event.head_commit.message == 'chore(ci): export verified PR 6502 git blobs'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      EXPECTED_FINAL_TREE: e449b23cf62f210c0d64fe9931094049c5cf41c5
    steps:
      - name: Checkout exact exporter head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify bounded branch and exact remote head
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_REF_NAME}" == "fix/push-workflow-runner-context-registration-main-ba10f269-20260806" ]]
          [[ "${GITHUB_REF_NAME}" != "main" ]]
          [[ "${GITHUB_REF_NAME}" != "Production" ]]
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          remote_head_sha="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          [[ "${remote_head_sha}" == "${GITHUB_SHA}" ]]

      - name: Download verified convergence delta
        uses: actions/download-artifact@v5
        with:
          name: pr6502-governance-convergence-d8ea58610314bd3d8dbd9d98ea021fce5abf65ae
          path: ${{ runner.temp }}/verified-convergence
          github-token: ${{ github.token }}
          run-id: 31109645120

      - name: Apply and validate exact final tree
        shell: bash
        run: |
          set -Eeuo pipefail
          source_dir="${RUNNER_TEMP}/verified-convergence"
          expected_patch_sha="ba72e7106509c3aa1ebb97416108c8c046e2c8e8ce9d45ecb6a935342a32e3d1"
          actual_patch_sha="$(sha256sum "${source_dir}/final.patch" | awk '{print $1}')"
          [[ "${actual_patch_sha}" == "${expected_patch_sha}" ]]
          [[ "$(cat "${source_dir}/expected-parent-sha.txt")" == "d8ea58610314bd3d8dbd9d98ea021fce5abf65ae" ]]
          [[ "$(cat "${source_dir}/rendered-tree-sha.txt")" == "${EXPECTED_FINAL_TREE}" ]]

          git apply \
            --exclude=.github/scripts/pr6502-governance-convergence.py \
            --exclude=.github/workflows/pr6502-governance-convergence.yml \
            "${source_dir}/final.patch"
          rm -f .github/workflows/pr6502-finalize-governance-artifact.yml

          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          node http-generic-api/test-push-workflow-runner-context-registration.mjs
          node http-generic-api/test-production-certified-release-cut-validation-registration.mjs
          git diff --check
          git add -A
          rendered_tree="$(git write-tree)"
          [[ "${rendered_tree}" == "${EXPECTED_FINAL_TREE}" ]]

      - name: Create immutable Git blobs without updating a ref
        shell: bash
        run: |
          set -Eeuo pipefail
          evidence_dir="${RUNNER_TEMP}/pr6502-git-objects"
          mkdir -p "${evidence_dir}"

          cat > "${evidence_dir}/materialized-files.txt" <<'EOF'
          .changes/e2e/push-workflow-runner-context-registration.json
          .github/workflows/governed-production-promotion-post-finalization-guard.yml
          .github/workflows/governed-production-promotion-request-launcher.yml
          docs/governance/push-workflow-runner-context-registration.md
          docs/work-maps/README.md
          docs/work-maps/repository-automation-map.md
          http-generic-api/test-push-workflow-runner-context-registration.mjs
          EOF

          cat > "${evidence_dir}/deleted-files.txt" <<'EOF'
          .github/workflows/hostinger-nodejs-completed-build-log-evidence-push-r3b.yml
          .github/workflows/hostinger-nodejs-completed-build-log-evidence-r3c-windows.yml
          .github/workflows/response-chunk-ownership-governed-rollout-push.yml
          .github/workflows/ueacp-live-authority-evidence-one-shot.yml
          .github/workflows/pr6502-finalize-governance-artifact.yml
          EOF

          : > "${evidence_dir}/entries.ndjson"
          while IFS= read -r path; do
            [[ -n "${path}" ]]
            [[ -f "${path}" ]]
            local_sha="$(git hash-object "${path}")"
            payload="$(jq -n --arg content "$(base64 -w0 "${path}")" '{content:$content,encoding:"base64"}')"
            api_sha="$(gh api --method POST "/repos/${REPOSITORY}/git/blobs" --input - --jq '.sha' <<<"${payload}")"
            [[ "${api_sha}" == "${local_sha}" ]]
            jq -cn --arg path "${path}" --arg sha "${api_sha}" \
              '{path:$path,mode:"100644",type:"blob",sha:$sha}' \
              >> "${evidence_dir}/entries.ndjson"
          done < "${evidence_dir}/materialized-files.txt"

          while IFS= read -r path; do
            [[ -n "${path}" ]]
            [[ ! -e "${path}" ]]
            jq -cn --arg path "${path}" \
              '{path:$path,mode:"100644",type:"blob",sha:null}' \
              >> "${evidence_dir}/entries.ndjson"
          done < "${evidence_dir}/deleted-files.txt"

          jq -s '.' "${evidence_dir}/entries.ndjson" > "${evidence_dir}/tree-entries.json"
          [[ "$(jq 'length' "${evidence_dir}/tree-entries.json")" == "12" ]]
          printf '%s\n' "${GITHUB_SHA}" > "${evidence_dir}/expected-parent-sha.txt"
          printf '%s\n' "${EXPECTED_FINAL_TREE}" > "${evidence_dir}/expected-final-tree-sha.txt"
          git diff --cached --name-status > "${evidence_dir}/name-status.txt"
          sha256sum "${evidence_dir}/tree-entries.json" > "${evidence_dir}/tree-entries.json.sha256"

      - name: Upload verified Git object manifest
        uses: actions/upload-artifact@v4
        with:
          name: pr6502-verified-git-objects-${{ github.sha }}
          path: ${{ runner.temp }}/pr6502-git-objects
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
