name: Spec 014 Migration Drafts Builder Diagnostic Harness

on:
  pull_request:
    paths:
      - '.github/workflows/spec014-migration-drafts-builder.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: spec014-migration-drafts-builder-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout diagnostic head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Extract original builder script with push suppressed
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/spec014-migration-drafts-builder.yml > /tmp/spec014-original-builder.yml
          python3 - <<'PY'
          from pathlib import Path

          lines = Path('/tmp/spec014-original-builder.yml').read_text().splitlines()
          step_index = next(i for i, line in enumerate(lines) if line.strip() == '- name: Build clean migration-drafts workstream')
          run_index = next(i for i in range(step_index, len(lines)) if lines[i].strip() == 'run: |')
          indent = len(lines[run_index]) - len(lines[run_index].lstrip()) + 2
          body = []
          for line in lines[run_index + 1:]:
              if line.strip() and len(line) - len(line.lstrip()) < indent:
                  break
              body.append(line[indent:] if len(line) >= indent else '')
          script = '\n'.join(body) + '\n'
          original_push = 'git push origin "HEAD:refs/heads/${FINAL_BRANCH}"'
          if script.count(original_push) != 1:
              raise SystemExit('expected exactly one final push command')
          script = script.replace(original_push, "echo '[diagnostic] final push suppressed'", 1)
          Path('/tmp/spec014-builder-extracted.sh').write_text(script)
          PY
          chmod +x /tmp/spec014-builder-extracted.sh

      - name: Execute exact original builder locally
        id: exact_builder
        shell: bash
        env:
          INTEGRATION_BRANCH: gpt/hostinger-safe-storage-cleanup-ssh-20260801
          SOURCE_BRANCH: gpt/014-hostinger/migration-drafts-t024-t027-20260802
          FINAL_BRANCH: gpt/014-hostinger/migration-drafts-t024-t027-final-20260802
        run: |
          set +e
          bash -x /tmp/spec014-builder-extracted.sh > /tmp/spec014-builder.log 2>&1
          status=$?
          {
            echo
            echo '=== diagnostic footer ==='
            echo "exit_status=${status}"
            echo "branch=$(git branch --show-current 2>/dev/null || true)"
            echo "head=$(git rev-parse HEAD 2>/dev/null || true)"
            echo '--- git status ---'
            git status --short || true
            echo '--- changed files vs integration ---'
            git diff --name-only "origin/${INTEGRATION_BRANCH}...HEAD" 2>/dev/null | nl -ba || true
            echo '--- recent commits ---'
            git log --oneline -5 || true
          } >> /tmp/spec014-builder.log
          echo "exit_status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload exact diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec014-migration-drafts-builder-exact-diagnostics-${{ github.run_attempt }}
          path: |
            /tmp/spec014-builder.log
            /tmp/spec014-builder-extracted.sh
            /tmp/spec014-original-builder.yml
          if-no-files-found: error
          retention-days: 3

      - name: Fail on reproduced builder error
        if: always()
        shell: bash
        run: |
          echo "Exact original builder exit status: ${{ steps.exact_builder.outputs.exit_status }}"
          test "${{ steps.exact_builder.outputs.exit_status }}" = '0'
