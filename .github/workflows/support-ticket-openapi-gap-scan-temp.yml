name: Temporary Support Ticket OpenAPI Gap Scan

on:
  push:
    branches:
      - gpt/016-remote-mcp-oauth21-main-recovery-20260802
    paths:
      - .github/workflows/support-ticket-openapi-gap-scan-temp.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Compare runtime routes with precise registry
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const routeFile = 'http-generic-api/routes/supportTicketRoutes.js';
          const registryFile = 'http-generic-api/openapi-route-contracts.yaml';
          const source = fs.readFileSync(routeFile, 'utf8');
          const registry = fs.readFileSync(registryFile, 'utf8');
          const runtime = [];
          const routeRe = /router\.(get|post|put|patch|delete)\(\s*["'`]([^"'`]+)["'`]/g;
          for (const match of source.matchAll(routeRe)) {
            const method = match[1].toUpperCase();
            const rawPath = match[2];
            const path = rawPath.replace(/:([A-Za-z0-9_]+)/g, '{$1}');
            runtime.push({ method, raw_path: rawPath, path, key: `${method} ${path}` });
          }
          const registered = new Set();
          const contractRe = /^\s{2}(GET|POST|PUT|PATCH|DELETE)\s+(.+):\s*$/gm;
          for (const match of registry.matchAll(contractRe)) registered.add(`${match[1]} ${match[2]}`);
          const uniqueRuntime = [...new Map(runtime.map((item) => [item.key, item])).values()];
          const missing = uniqueRuntime.filter((item) => !registered.has(item.key));
          const result = {
            contract: 'mad4b.support-ticket-openapi-gap-scan.v1',
            route_file: routeFile,
            registry_file: registryFile,
            runtime_route_count: uniqueRuntime.length,
            registered_runtime_route_count: uniqueRuntime.length - missing.length,
            missing_count: missing.length,
            missing,
            all_runtime_routes: uniqueRuntime,
          };
          fs.writeFileSync('support-ticket-openapi-gap-scan.json', JSON.stringify(result, null, 2) + '\n');
          console.log(JSON.stringify(result, null, 2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Support Ticket OpenAPI gap scan\n\n- Runtime routes: ${result.runtime_route_count}\n- Registered: ${result.registered_runtime_route_count}\n- Missing: ${result.missing_count}\n\n\`\`\`json\n${JSON.stringify(missing, null, 2)}\n\`\`\`\n`);
          NODE
      - name: Upload scan report
        uses: actions/upload-artifact@v4
        with:
          name: support-ticket-openapi-gap-scan
          path: support-ticket-openapi-gap-scan.json
          if-no-files-found: error
          retention-days: 3
