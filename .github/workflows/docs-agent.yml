name: Docs Agent

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: repository-generated-artifacts-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pr-impact-note:
    name: PR docs impact preview
    if: >-
      github.event_name == 'pull_request' &&
      !startsWith(github.event.pull_request.head.ref, 'gpt/no-docs-agent/') &&
      !contains(github.event.pull_request.labels.*.name, 'skip-docs-agent') &&
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          # Pull-request workflows are defined by the protected base branch. Validate
          # the proposed merge tree so newly introduced base-owned scripts cannot be
          # missing merely because the feature branch predates them.
          ref: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate proposed merge checkout
        shell: bash
        env:
          EXPECTED_EVENT_SHA: ${{ github.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          tested_sha="$(git rev-parse HEAD)"
          if [[ "${tested_sha}" != "${EXPECTED_EVENT_SHA}" ]]; then
            echo "Docs Agent checkout mismatch: tested ${tested_sha}, expected event merge ${EXPECTED_EVENT_SHA}."
            exit 1
          fi
          if ! git merge-base --is-ancestor "${EXPECTED_BASE_SHA}" "${tested_sha}"; then
            echo "Docs Agent proposed merge does not contain expected base ${EXPECTED_BASE_SHA}."
            exit 1
          fi
          if ! git merge-base --is-ancestor "${EXPECTED_HEAD_SHA}" "${tested_sha}"; then
            echo "Docs Agent proposed merge does not contain expected PR head ${EXPECTED_HEAD_SHA}."
            exit 1
          fi
          echo "Docs Agent validated proposed merge ${tested_sha} for base ${EXPECTED_BASE_SHA} and head ${EXPECTED_HEAD_SHA}."

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate inter-pipeline connectivity
        run: |
          node http-generic-api/scripts/pipeline-connectivity-check.mjs
          node http-generic-api/test-pipeline-connectivity-check.mjs

      - name: Generate docs impact note
        id: agent
        run: node http-generic-api/scripts/docs-agent-runner.mjs --write --mode pull_request

      - name: Generate dynamic text Work Map preview
        run: node http-generic-api/scripts/platform-work-map-generator.mjs --write

      - name: Refuse preview mutations outside generated documentation
        shell: bash
        run: |
          unexpected_files="$(git diff --name-only | grep -Ev '^(docs/auto-docs-agent/|docs/work-maps/)' || true)"
          if [[ -n "${unexpected_files}" ]]; then
            echo "Docs Agent preview modified files outside generated documentation:"
            printf '%s\n' "${unexpected_files}"
            exit 1
          fi

      - name: Upload generated documentation preview
        uses: actions/upload-artifact@v4
        with:
          name: docs-agent-preview-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            docs/auto-docs-agent
            docs/work-maps
          if-no-files-found: error
          retention-days: 7

      - name: Report preview-only PR mode
        run: echo "Docs Agent pull-request runs are preview-only and never commit, push, merge, or authorize Work Map writes. Use the governed Spec Kit Work Map Autofix workflow for branch mutation."

  work-map-recovery-activation:
    name: Activate exact-head Work Map recovery
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      startsWith(github.event.pull_request.head.ref, 'gpt/') &&
      contains(github.event.pull_request.body, '<!-- work-map-autofix:authorized -->')
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      TARGET_REF: ${{ github.event.pull_request.head.ref }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      AUTHORIZATION_MARKER: '<!-- work-map-autofix:authorized -->'
      REPORT_PATH: ${{ runner.temp }}/work-map-recovery-activation.json
    steps:
      - name: Validate exact current Work Map recovery target
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          [[ "${EXPECTED_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${TARGET_REF}" =~ ^gpt/[A-Za-z0-9._/-]+$ ]]

          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r '.state' <<<"${pr}")" = "open"
          test "$(jq -r '.draft' <<<"${pr}")" = "false"
          test "$(jq -r '.base.ref' <<<"${pr}")" = "main"
          test "$(jq -r '.head.repo.full_name' <<<"${pr}")" = "${GITHUB_REPOSITORY}"
          test "$(jq -r '.head.ref' <<<"${pr}")" = "${TARGET_REF}"
          test "$(jq -r '.head.sha' <<<"${pr}")" = "${EXPECTED_HEAD_SHA}"
          jq -er '.body // ""' <<<"${pr}" | grep -Fq "${AUTHORIZATION_MARKER}"

          behind_by="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${EXPECTED_HEAD_SHA}" --jq '.behind_by')"
          if [[ "${behind_by}" != "0" ]]; then
            echo "PR head is behind main by ${behind_by} commit(s); refusing recovery activation."
            exit 1
          fi
          remote_sha="$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${TARGET_REF}" | awk '{print $1}')"
          test "${remote_sha}" = "${EXPECTED_HEAD_SHA}"
          echo "behind_by=${behind_by}" >> "$GITHUB_OUTPUT"

      - name: Enable and dispatch trusted recovery workflow
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          recovery_workflow="spec-kit-work-map-autofix-recovery-dispatch.yml"
          state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${recovery_workflow}" --jq '.state')"
          if [[ "${state}" != "active" ]]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${recovery_workflow}/enable"
          fi
          readback_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${recovery_workflow}" --jq '.state')"
          test "${readback_state}" = "active"

          dispatch_started_at="$(date -u -d '5 seconds ago' +'%Y-%m-%dT%H:%M:%SZ')"
          expected_title="Spec Kit Work Map Autofix Recovery Dispatch · PR ${PR_NUMBER}"
          payload="$(jq -cn \
            --arg ref main \
            --arg pr_number "${PR_NUMBER}" \
            '{ref:$ref,inputs:{pr_number:$pr_number,confirmation:"RECOVER_SPEC_KIT_WORK_MAP_AUTOFIX"}}')"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${recovery_workflow}/dispatches" \
            --input - <<<"${payload}"

          delegated_run_id=""
          for _ in $(seq 1 30); do
            delegated_run_id="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${recovery_workflow}/runs?event=workflow_dispatch&branch=main&per_page=30" \
              --jq "[.workflow_runs[] | select(.created_at >= \"${dispatch_started_at}\" and .display_title == \"${expected_title}\")] | sort_by(.created_at) | last | .id // empty")"
            if [[ -n "${delegated_run_id}" ]]; then
              break
            fi
            sleep 2
          done
          [[ "${delegated_run_id}" =~ ^[1-9][0-9]*$ ]]
          echo "workflow_state=${readback_state}" >> "$GITHUB_OUTPUT"
          echo "run_id=${delegated_run_id}" >> "$GITHUB_OUTPUT"

      - name: Publish activation bridge evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BEHIND_BY: ${{ steps.target.outputs.behind_by }}
          WORKFLOW_STATE: ${{ steps.dispatch.outputs.workflow_state }}
          DELEGATED_RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          outcome="passed"
          if [[ "${{ job.status }}" != "success" ]]; then
            outcome="blocked"
          fi
          jq -n \
            --arg contract "mad4b.work-map-recovery-activation-bridge.v1" \
            --arg outcome "${outcome}" \
            --arg target_ref "${TARGET_REF}" \
            --arg expected_head_sha "${EXPECTED_HEAD_SHA}" \
            --arg behind_by "${BEHIND_BY:-unknown}" \
            --arg workflow_state "${WORKFLOW_STATE:-unknown}" \
            --arg delegated_run_id "${DELEGATED_RUN_ID:-none}" \
            --argjson pr_number "${PR_NUMBER}" \
            '{contract:$contract,outcome:$outcome,pr_number:$pr_number,target_ref:$target_ref,expected_head_sha:$expected_head_sha,behind_by:$behind_by,recovery_workflow_state:$workflow_state,delegated_recovery_run_id:$delegated_run_id,direct_repository_mutation:false,protected_branch_mutation:false,force_push:false,secrets_included:false}' \
            > "${REPORT_PATH}"
          body="WORK_MAP_RECOVERY_ACTIVATION_BRIDGE outcome=${outcome} expected_head_sha=${EXPECTED_HEAD_SHA} target_ref=${TARGET_REF} behind_by=${BEHIND_BY:-unknown} recovery_workflow_state=${WORKFLOW_STATE:-unknown} delegated_recovery_run_id=${DELEGATED_RUN_ID:-none} direct_repository_mutation=false protected_branch_mutation=false force_push=false"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="${body}"

      - name: Upload activation bridge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-map-recovery-activation-${{ github.run_id }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: warn
          retention-days: 30

  main-followup-pr:
    name: Main follow-up impact-note PR
    if: >-
      github.event_name == 'push' &&
      github.actor != 'github-actions[bot]'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate inter-pipeline connectivity
        run: |
          node http-generic-api/scripts/pipeline-connectivity-check.mjs
          node http-generic-api/test-pipeline-connectivity-check.mjs

      - name: Generate docs impact note for merged commit
        id: agent
        run: node http-generic-api/scripts/docs-agent-runner.mjs --write --mode push --base '${{ github.event.before }}' --head '${{ github.event.after }}'

      - name: Refuse follow-up mutations outside impact notes
        shell: bash
        run: |
          unexpected_files="$(git diff --name-only | grep -Ev '^docs/auto-docs-agent/' || true)"
          if [[ -n "${unexpected_files}" ]]; then
            echo "Docs Agent follow-up modified files outside docs/auto-docs-agent:"
            printf '%s\n' "${unexpected_files}"
            exit 1
          fi

      - name: Create reviewed impact-note follow-up PR
        id: create_followup
        uses: peter-evans/create-pull-request@v6
        with:
          branch: docs-agent/${{ github.event.after }}
          delete-branch: true
          title: "Docs agent: impact note for ${{ github.event.after }}"
          commit-message: "docs(agent): record impact for ${{ github.event.after }}"
          add-paths: |
            docs/auto-docs-agent/**
          labels: |
            docs
            automated
          body: |
            Automated impact-note follow-up for merged commit `${{ github.event.after }}`.

            Scope is restricted to `docs/auto-docs-agent/**`.
            Work Maps are excluded and remain owned by the governed Spec Kit Work Map Autofix writer.
            Review is required; this workflow does not auto-merge the follow-up PR.
