name: Work Map Staging Generator

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: work-map-staging-generator-${{ github.repository }}-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate exact-head Work Map blobs
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/work-map-generated-staging-8b24ab06-20260801' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      SOURCE_HEAD_SHA: 8b24ab068949a529ac14e26762e2de965ea68fab
      AUTHORIZED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
      WORKFLOW_PATH: .github/workflows/docs-agent.yml
    steps:
      - name: Checkout isolated staging head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.AUTHORIZED_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Verify exact staging ancestry and remote head
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          actual_parent="$(git rev-parse HEAD^)"
          remote_head="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          if [[ "${actual_head}" != "${AUTHORIZED_HEAD_SHA}" || "${remote_head}" != "${AUTHORIZED_HEAD_SHA}" ]]; then
            echo "Refusing stale staging generation."
            exit 1
          fi
          if [[ "${actual_parent}" != "${SOURCE_HEAD_SHA}" ]]; then
            echo "Expected staging parent ${SOURCE_HEAD_SHA}, found ${actual_parent}."
            exit 1
          fi

      - name: Restore durable Docs Agent before source discovery
        shell: bash
        run: git show "${SOURCE_HEAD_SHA}:${WORKFLOW_PATH}" > "${WORKFLOW_PATH}"

      - name: Validate durable Work Map ownership contracts
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/pipeline-connectivity-check.mjs
          node http-generic-api/test-pipeline-connectivity-check.mjs
          node http-generic-api/test-work-map-autofix-diagnostics.mjs

      - name: Generate exact-head Work Maps idempotently
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          first_hash="$(git diff --binary "${SOURCE_HEAD_SHA}" -- docs/work-maps | sha256sum | awk '{print $1}')"
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          second_hash="$(git diff --binary "${SOURCE_HEAD_SHA}" -- docs/work-maps | sha256sum | awk '{print $1}')"
          if [[ "${first_hash}" != "${second_hash}" ]]; then
            echo "Refusing non-idempotent Work Map generation."
            exit 1
          fi
          node http-generic-api/scripts/platform-work-map-generator.mjs --check

      - name: Enforce Work Map-only net result
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only "${SOURCE_HEAD_SHA}" | grep -v '^docs/work-maps/' || true)"
          if [[ -n "${unexpected}" ]]; then
            echo "Staging net result contains unexpected files:"
            printf '%s\n' "${unexpected}"
            exit 1
          fi
          changed_count="$(git diff --name-only "${SOURCE_HEAD_SHA}" -- docs/work-maps | sed '/^$/d' | wc -l | tr -d ' ')"
          if [[ "${changed_count}" -eq 0 ]]; then
            echo "No generated Work Map changes found."
            exit 1
          fi
          echo "Generated Work Map count: ${changed_count}"

      - name: Commit generated maps and durable workflow restoration
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          if [[ "${remote_head}" != "${AUTHORIZED_HEAD_SHA}" ]]; then
            echo "Refusing stale staging push."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/work-maps "${WORKFLOW_PATH}"
          git commit -m "docs(work-maps): register synchronized exact-head blobs"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Verify remote scope readback
        shell: bash
        run: |
          set -euo pipefail
          local_head="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          if [[ "${local_head}" != "${remote_head}" ]]; then
            echo "Staging readback mismatch."
            exit 1
          fi
          unexpected="$(git diff --name-only "${SOURCE_HEAD_SHA}"...HEAD | grep -v '^docs/work-maps/' || true)"
          if [[ -n "${unexpected}" ]]; then
            echo "Final staging branch contains unexpected net files:"
            printf '%s\n' "${unexpected}"
            exit 1
          fi
