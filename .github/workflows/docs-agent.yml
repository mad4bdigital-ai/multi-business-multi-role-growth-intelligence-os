name: Docs Agent

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: repository-generated-artifacts-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pr-impact-note:
    name: PR docs impact preview
    if: >-
      github.event_name == 'pull_request' &&
      !startsWith(github.event.pull_request.head.ref, 'gpt/no-docs-agent/') &&
      !contains(github.event.pull_request.labels.*.name, 'skip-docs-agent') &&
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate inter-pipeline connectivity
        run: |
          node http-generic-api/scripts/pipeline-connectivity-check.mjs
          node http-generic-api/test-pipeline-connectivity-check.mjs

      - name: Generate docs impact note
        id: agent
        run: node http-generic-api/scripts/docs-agent-runner.mjs --write --mode pull_request

      - name: Generate dynamic text work maps
        run: node http-generic-api/scripts/platform-work-map-generator.mjs --write

      - name: Upload generated documentation preview
        uses: actions/upload-artifact@v4
        with:
          name: docs-agent-preview-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            docs/auto-docs-agent
            docs/work-maps
          if-no-files-found: ignore
          retention-days: 7

      - name: Report preview-only PR mode
        run: echo "Docs Agent pull-request runs are preview-only and never commit, push, or merge. Use the governed exact-head Work Map write job for generated Work Map updates."

  governed-work-map-write:
    name: Governed exact-head Work Map write
    if: >-
      github.event_name == 'pull_request' &&
      (
        (github.event.action == 'labeled' && github.event.label.name == 'docs-agent-write') ||
        (github.event.action == 'reopened' && contains(github.event.pull_request.labels.*.name, 'docs-agent-write'))
      ) &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      DIAGNOSTIC_ROOT: ${{ runner.temp }}/work-map-autofix-diagnostics
    steps:
      - name: Bootstrap Work Map diagnostic envelope
        id: bootstrap_diagnostics
        run: |
          set -euo pipefail
          mkdir -p "${DIAGNOSTIC_ROOT}"
          cat > "${DIAGNOSTIC_ROOT}/report.md" <<EOF
          # Work Map Autofix Diagnostic Report

          **Status:** bootstrap

          | Field | Value |
          |---|---|
          | Repository | \`${GITHUB_REPOSITORY}\` |
          | Workflow | \`${GITHUB_WORKFLOW}\` |
          | Run | \`${GITHUB_RUN_ID}\` (attempt ${GITHUB_RUN_ATTEMPT}) |
          | Event | \`${GITHUB_EVENT_NAME}\` / \`${{ github.event.action }}\` |
          | Pull request | \`#${PR_NUMBER}\` |
          | Target branch | \`${TARGET_BRANCH}\` |
          | Expected head | \`${EXPECTED_HEAD_SHA}\` |
          | Runner | \`${RUNNER_OS}\` / \`${RUNNER_NAME}\` |

          The governed recorder has not initialized yet. Checkout or setup failures remain visible in the workflow step ledger.
          EOF

      - uses: actions/checkout@v5
        id: checkout
        with:
          fetch-depth: 0
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        id: setup_node
        with:
          node-version: "22"

      - name: Initialize governed diagnostic report
        id: initialize_diagnostics
        run: node http-generic-api/scripts/work-map-autofix-diagnostics.mjs init --root "${DIAGNOSTIC_ROOT}"

      - name: Pin authorized branch head
        id: pin_authorized_head
        run: |
          set -euo pipefail
          diagnostic_script="$(cat <<'BASH'
          set -euo pipefail
          git check-ref-format --branch "${TARGET_BRANCH}"
          if [[ ! "${EXPECTED_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected head must be a full lowercase 40-character SHA."
            exit 1
          fi
          actual_head_sha="$(git rev-parse HEAD)"
          remote_head_sha="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          if [[ "${actual_head_sha}" != "${EXPECTED_HEAD_SHA}" ]]; then
            echo "Checked-out head mismatch. Expected ${EXPECTED_HEAD_SHA}, found ${actual_head_sha}."
            exit 1
          fi
          if [[ "${remote_head_sha}" != "${EXPECTED_HEAD_SHA}" ]]; then
            echo "Refusing stale Work Map write. Branch moved from ${EXPECTED_HEAD_SHA} to ${remote_head_sha}."
            exit 1
          fi
          BASH
          )"
          node http-generic-api/scripts/work-map-autofix-diagnostics.mjs exec --root "${DIAGNOSTIC_ROOT}" --id pin-authorized-head -- bash -lc "${diagnostic_script}"

      - name: Consume one-time write label
        id: consume_write_label
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/docs-agent-write"

      - name: Validate generator and governance contracts
        id: validate_contracts
        run: |
          set -euo pipefail
          node http-generic-api/scripts/work-map-autofix-diagnostics.mjs exec --root "${DIAGNOSTIC_ROOT}" --id pipeline-connectivity -- node http-generic-api/scripts/pipeline-connectivity-check.mjs
          node http-generic-api/scripts/work-map-autofix-diagnostics.mjs exec --root "${DIAGNOSTIC_ROOT}" --id pipeline-connectivity-regression -- node http-generic-api/test-pipeline-connectivity-check.mjs
          node http-generic-api/scripts/work-map-autofix-diagnostics.mjs exec --root "${DIAGNOSTIC_ROOT}" --id diagnostic-report-regression -- node http-generic-api/test-work-map-autofix-diagnostics.mjs
          node http-generic-api/scripts/work-map-autofix-diagnostics.mjs exec --root "${DIAGNOSTIC_ROOT}" --id schema-classification-contract -- node http-generic-api/scripts/work-map-schema-classification-contract.mjs
          node http-generic-api/scripts/work-map-autofix-diagnostics.mjs exec --root "${DIAGNOSTIC_ROOT}" --id schema-classification -- node http-generic-api/scripts/work-map-schema-classification.mjs
          node http-generic-api/scripts/work-map-autofix-diagnostics.mjs exec --root "${DIAGNOSTIC_ROOT}" --id schema-classification-regression -- node http-generic-api/test-work-map-schema-classification.mjs
          node http-generic-api/scripts/work-map-autofix-diagnostics.mjs exec --root "${DIAGNOSTIC_ROOT}" --id schema-classification-contract-regression -- node http-generic-api/test-work-map-schema-classification-contract.mjs

      - name: Regenerate Work Maps and verify idempotency
        id: regenerate_and_verify
        run: |
          set -euo pipefail
          diagnostic_script="$(cat <<'BASH'
          set -euo pipefail
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          unexpected_files="$(git diff --name-only | grep -v '^docs/work-maps/' || true)"
          if [[ -n "${unexpected_files}" ]]; then
            echo "Generator modified files outside docs/work-maps:"
            printf '%s\n' "${unexpected_files}"
            exit 1
          fi
          first_diff_hash="$(git diff --binary -- docs/work-maps | sha256sum | awk '{print $1}')"
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          second_diff_hash="$(git diff --binary -- docs/work-maps | sha256sum | awk '{print $1}')"
          if [[ "${first_diff_hash}" != "${second_diff_hash}" ]]; then
            echo "Refusing non-idempotent Work Map generation."
            exit 1
          fi
          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          BASH
          )"
          node http-generic-api/scripts/work-map-autofix-diagnostics.mjs exec --root "${DIAGNOSTIC_ROOT}" --id regenerate-and-verify-idempotency -- bash -lc "${diagnostic_script}"

      - name: Commit and push Work Maps only
        id: commit_generated_work_maps
        run: |
          set -euo pipefail
          diagnostic_script="$(cat <<'BASH'
          set -euo pipefail
          if git diff --quiet -- docs/work-maps; then
            echo "Generated Work Maps are already current; no commit created."
            exit 0
          fi
          unexpected_files="$(git diff --name-only | grep -v '^docs/work-maps/' || true)"
          if [[ -n "${unexpected_files}" ]]; then
            echo "Refusing generated commit with files outside docs/work-maps:"
            printf '%s\n' "${unexpected_files}"
            exit 1
          fi
          remote_head_sha="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          if [[ "${remote_head_sha}" != "${EXPECTED_HEAD_SHA}" ]]; then
            echo "Refusing stale generated push. Branch moved from ${EXPECTED_HEAD_SHA} to ${remote_head_sha}."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/work-maps
          unexpected_staged="$(git diff --cached --name-only | grep -v '^docs/work-maps/' || true)"
          if [[ -n "${unexpected_staged}" ]]; then
            echo "Refusing staged files outside docs/work-maps:"
            printf '%s\n' "${unexpected_staged}"
            exit 1
          fi
          git commit -m "docs(work-maps): regenerate governed platform maps"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          pushed_head_sha="$(git rev-parse HEAD)"
          remote_head_sha="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          if [[ "${remote_head_sha}" != "${pushed_head_sha}" ]]; then
            echo "Generated push readback mismatch. Expected ${pushed_head_sha}, found ${remote_head_sha}."
            exit 1
          fi
          BASH
          )"
          node http-generic-api/scripts/work-map-autofix-diagnostics.mjs exec --root "${DIAGNOSTIC_ROOT}" --id commit-and-push-work-maps -- bash -lc "${diagnostic_script}"

      - name: Finalize Work Map diagnostic report
        id: finalize_diagnostics
        if: always()
        continue-on-error: true
        env:
          WORK_MAP_JOB_STATUS: ${{ job.status }}
          WORK_MAP_STEP_OUTCOMES: >-
            {"bootstrap_diagnostics":"${{ steps.bootstrap_diagnostics.outcome }}","checkout":"${{ steps.checkout.outcome }}","setup_node":"${{ steps.setup_node.outcome }}","initialize_diagnostics":"${{ steps.initialize_diagnostics.outcome }}","pin_authorized_head":"${{ steps.pin_authorized_head.outcome }}","consume_write_label":"${{ steps.consume_write_label.outcome }}","validate_contracts":"${{ steps.validate_contracts.outcome }}","regenerate_and_verify":"${{ steps.regenerate_and_verify.outcome }}","commit_generated_work_maps":"${{ steps.commit_generated_work_maps.outcome }}"}
        run: |
          set +e
          if [[ -f "http-generic-api/scripts/work-map-autofix-diagnostics.mjs" && -f "${DIAGNOSTIC_ROOT}/report.json" ]]; then
            node http-generic-api/scripts/work-map-autofix-diagnostics.mjs finalize --root "${DIAGNOSTIC_ROOT}" --conclusion "${WORK_MAP_JOB_STATUS}"
            finalize_status=$?
          else
            finalize_status=0
            cat >> "${DIAGNOSTIC_ROOT}/report.md" <<EOF

          ## Recorder initialization

          The repository diagnostic recorder was unavailable. This normally indicates checkout or Node setup failure.
          EOF
          fi

          export WORK_MAP_STEP_OUTCOMES
          node - "${DIAGNOSTIC_ROOT}" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const root = process.argv[2];
          const steps = JSON.parse(process.env.WORK_MAP_STEP_OUTCOMES || "{}");
          const jsonFile = path.join(root, "report.json");
          if (fs.existsSync(jsonFile)) {
            const report = JSON.parse(fs.readFileSync(jsonFile, "utf8"));
            report.workflowSteps = steps;
            fs.writeFileSync(jsonFile, `${JSON.stringify(report, null, 2)}\n`);
          }
          const markdownFile = path.join(root, "report.md");
          const rows = Object.entries(steps).map(([step, outcome]) => `| \`${step}\` | ${outcome || "not-run"} |`);
          fs.appendFileSync(markdownFile, `\n## Workflow step outcomes\n\n| Step | Outcome |\n|---|---|\n${rows.join("\n")}\n`);
          NODE

          if [[ -f "${DIAGNOSTIC_ROOT}/report.md" ]]; then
            cat "${DIAGNOSTIC_ROOT}/report.md" >> "${GITHUB_STEP_SUMMARY}"
          fi
          exit "${finalize_status}"

      - name: Upload Work Map diagnostic report
        id: upload_diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: work-map-autofix-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/work-map-autofix-diagnostics
          if-no-files-found: warn
          retention-days: 14

      - name: Publish sticky Work Map diagnostic report
        id: publish_diagnostic_comment
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          report_file="${DIAGNOSTIC_ROOT}/report.md"
          if [[ ! -f "${report_file}" ]]; then
            echo "Diagnostic report file is unavailable; skipping PR publication."
            exit 0
          fi
          marker='<!-- work-map-autofix-diagnostic-report -->'
          comment_file="${RUNNER_TEMP}/work-map-autofix-diagnostic-comment.md"
          payload_file="${RUNNER_TEMP}/work-map-autofix-diagnostic-comment.json"
          {
            printf '%s\n\n' "${marker}"
            cat "${report_file}"
            printf '\n[Open workflow run](%s)\n' "${RUN_URL}"
          } > "${comment_file}"
          node - "${comment_file}" "${payload_file}" <<'NODE'
          const fs = require("node:fs");
          const body = fs.readFileSync(process.argv[2], "utf8");
          fs.writeFileSync(process.argv[3], JSON.stringify({ body }));
          NODE
          comment_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | tail -n 1)"
          if [[ -n "${comment_id}" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" --input "${payload_file}" >/dev/null
            echo "Updated Work Map diagnostic comment ${comment_id}."
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --input "${payload_file}" >/dev/null
            echo "Created Work Map diagnostic comment."
          fi

  main-followup-pr:
    name: Main follow-up docs PR
    if: >-
      github.event_name == 'push' &&
      github.actor != 'github-actions[bot]'
    permissions:
      actions: write
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate inter-pipeline connectivity
        run: |
          node http-generic-api/scripts/pipeline-connectivity-check.mjs
          node http-generic-api/test-pipeline-connectivity-check.mjs

      - name: Generate docs impact note for merged commit
        id: agent
        run: node http-generic-api/scripts/docs-agent-runner.mjs --write --mode push --base '${{ github.event.before }}' --head '${{ github.event.after }}'

      - name: Generate dynamic text work maps
        run: node http-generic-api/scripts/platform-work-map-generator.mjs --write

      - name: Create docs-only follow-up PR and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCS_AGENT_BRANCH: docs-agent/${{ github.event.after }}
          DOCS_AGENT_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- docs/auto-docs-agent docs/work-maps)" ]; then
            echo "Docs Agent: no generated docs or work-map changes to publish."
            exit 0
          fi
          git config user.name "docs-agent[bot]"
          git config user.email "docs-agent[bot]@users.noreply.github.com"
          git checkout -b "$DOCS_AGENT_BRANCH"
          git add docs/auto-docs-agent docs/work-maps
          git commit -m "Docs agent: generated documentation for ${DOCS_AGENT_SHA:0:12}"
          git push origin "$DOCS_AGENT_BRANCH"
          PR_URL=$(gh pr create \
            --base main \
            --head "$DOCS_AGENT_BRANCH" \
            --title "Docs agent: impact note for ${DOCS_AGENT_SHA:0:12}" \
            --body "Automated docs-only impact note for merged commit ${DOCS_AGENT_SHA}. This PR contains no runtime code, schema, DB, or credential changes.")
          echo "Created $PR_URL"
          gh workflow run ci.yml --ref "$DOCS_AGENT_BRANCH"
          gh workflow run spec-kit-work-map-integration.yml --ref "$DOCS_AGENT_BRANCH"
          gh pr merge "$PR_URL" --auto --squash || true
