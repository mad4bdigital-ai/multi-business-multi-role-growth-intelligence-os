name: Docs Agent Work Map Bootstrap

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: repository-generated-artifacts-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-head-bootstrap:
    name: One-time exact-head Work Map bootstrap
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/work-map-governance-final-atomic-20260731' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DURABLE_BASE_SHA: 74a764ab175ab3a6f105aa7a076e588541ea5766
      AUTHORIZED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
      DOCS_AGENT_WORKFLOW: .github/workflows/docs-agent.yml
    steps:
      - name: Checkout authorized bootstrap head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.AUTHORIZED_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Verify isolated bootstrap chain
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          if [[ "${actual_head}" != "${AUTHORIZED_HEAD_SHA}" || "${remote_head}" != "${AUTHORIZED_HEAD_SHA}" ]]; then
            echo "Refusing stale bootstrap head."
            exit 1
          fi
          git merge-base --is-ancestor "${DURABLE_BASE_SHA}" HEAD
          unexpected_bootstrap_diff="$(git diff --name-only "${DURABLE_BASE_SHA}"...HEAD | grep -v "^${DOCS_AGENT_WORKFLOW}$" || true)"
          if [[ -n "${unexpected_bootstrap_diff}" ]]; then
            echo "Bootstrap chain contains changes outside ${DOCS_AGENT_WORKFLOW}:"
            printf '%s\n' "${unexpected_bootstrap_diff}"
            exit 1
          fi

      - name: Restore durable Docs Agent before source discovery
        shell: bash
        run: git show "${DURABLE_BASE_SHA}:${DOCS_AGENT_WORKFLOW}" > "${DOCS_AGENT_WORKFLOW}"

      - name: Validate durable ownership contracts
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/pipeline-connectivity-check.mjs
          node http-generic-api/test-pipeline-connectivity-check.mjs
          node http-generic-api/test-work-map-autofix-diagnostics.mjs

      - name: Generate exact-head Work Maps twice
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          first_hash="$(git diff --binary "${DURABLE_BASE_SHA}" -- docs/work-maps | sha256sum | awk '{print $1}')"
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          second_hash="$(git diff --binary "${DURABLE_BASE_SHA}" -- docs/work-maps | sha256sum | awk '{print $1}')"
          if [[ "${first_hash}" != "${second_hash}" ]]; then
            echo "Refusing non-idempotent Work Map generation."
            exit 1
          fi
          node http-generic-api/scripts/platform-work-map-generator.mjs --check

      - name: Enforce net Work Map-only result
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only "${DURABLE_BASE_SHA}" | grep -v '^docs/work-maps/' || true)"
          if [[ -n "${unexpected}" ]]; then
            echo "Bootstrap net result contains unexpected files:"
            printf '%s\n' "${unexpected}"
            exit 1
          fi
          changed_count="$(git diff --name-only "${DURABLE_BASE_SHA}" -- docs/work-maps | sed '/^$/d' | wc -l | tr -d ' ')"
          if [[ "${changed_count}" -eq 0 ]]; then
            echo "No Work Map changes were generated."
            exit 1
          fi
          echo "Generated Work Map count: ${changed_count}"

      - name: Commit durable workflow restoration and maps
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          if [[ "${remote_head}" != "${AUTHORIZED_HEAD_SHA}" ]]; then
            echo "Refusing stale bootstrap push."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/work-maps "${DOCS_AGENT_WORKFLOW}"
          git commit -m "docs(work-maps): regenerate governed platform maps"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Verify final remote exact scope
        shell: bash
        run: |
          set -euo pipefail
          local_head="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          if [[ "${local_head}" != "${remote_head}" ]]; then
            echo "Bootstrap push readback mismatch."
            exit 1
          fi
          unexpected="$(git diff --name-only "${DURABLE_BASE_SHA}"...HEAD | grep -v '^docs/work-maps/' || true)"
          if [[ -n "${unexpected}" ]]; then
            echo "Final branch diff contains unexpected files:"
            printf '%s\n' "${unexpected}"
            exit 1
          fi
