name: PR 4395 canonical ticket UUID one-shot

on:
  push:
    branches:
      - gpt/tenant-request-inbox-chunk-store-hardening-20260801
    paths:
      - .github/workflows/pr-4395-canonical-ticket-uuid-one-shot.yml

permissions:
  contents: write

concurrency:
  group: pr-4395-canonical-ticket-uuid-one-shot
  cancel-in-progress: false

jobs:
  harden:
    if: github.repository == 'mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v5
        with:
          ref: gpt/tenant-request-inbox-chunk-store-hardening-20260801
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Apply canonical ticket UUID contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const files = [
            'http-generic-api/migrations/1041_sprint69_tenant_request_inbox_and_chunk_store_hardening.sql',
            'http-generic-api/test-tenant-request-inbox-and-chunk-hardening.mjs',
          ];
          const broad = "resource_ref REGEXP '^ticket://[0-9a-fA-F-]{36}$'";
          const canonical = "resource_ref REGEXP '^ticket://[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'";
          for (const file of files) {
            const before = fs.readFileSync(file, 'utf8');
            const occurrences = before.split(broad).length - 1;
            if (occurrences !== 1) throw new Error(`${file}: expected one broad ticket UUID contract, found ${occurrences}`);
            const after = before.replace(broad, canonical);
            if (after.includes(broad) || !after.includes(canonical)) throw new Error(`${file}: canonical replacement failed`);
            fs.writeFileSync(file, after);
          }
          NODE

      - name: Install test dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Run focused regression
        working-directory: http-generic-api
        run: node test-tenant-request-inbox-and-chunk-hardening.mjs

      - name: Run official context-kernel ratchet
        working-directory: http-generic-api
        run: |
          git diff --name-only 464c11803d8cb84ba39863c5e55e05f30dbca8da...HEAD > "$RUNNER_TEMP/context-kernel-changed-files.txt"
          node scripts/context-kernel-hardcoding-scan.mjs --fail-on=runtime --changed-files-from="$RUNNER_TEMP/context-kernel-changed-files.txt"

      - name: Commit hardened contract and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr-4395-canonical-ticket-uuid-one-shot.yml
          git add http-generic-api/migrations/1041_sprint69_tenant_request_inbox_and_chunk_store_hardening.sql \
                  http-generic-api/test-tenant-request-inbox-and-chunk-hardening.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(tenant-requests): require canonical ticket UUID refs'
          git push origin HEAD:gpt/tenant-request-inbox-chunk-store-hardening-20260801
