name: Spec 011 V4 Final Sync Once

on:
  push:
    branches:
      - gpt/reconcile/011-managed-git-worker-main-v4-20260730
    paths:
      - .github/workflows/spec011-v4-final-sync-once.yml

permissions:
  contents: write

concurrency:
  group: spec011-v4-final-sync-once
  cancel-in-progress: true

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout final branch
        uses: actions/checkout@v5
        with:
          ref: gpt/reconcile/011-managed-git-worker-main-v4-20260730
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge latest main with bounded conflict resolution
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          MERGE_EXIT=$?
          set -e

          CONFLICTS="$(git diff --name-only --diff-filter=U)"
          if [[ -n "$CONFLICTS" ]]; then
            UNEXPECTED="$(printf '%s\n' "$CONFLICTS" | grep -v '^http-generic-api/frontend-surface-dispatch.generated.json$' || true)"
            if [[ -n "$UNEXPECTED" ]]; then
              echo "::error::Unexpected final-sync conflicts"
              printf '%s\n' "$UNEXPECTED"
              exit 1
            fi
            git checkout --theirs http-generic-api/frontend-surface-dispatch.generated.json
            git add http-generic-api/frontend-surface-dispatch.generated.json
          elif [[ $MERGE_EXIT -ne 0 ]]; then
            echo "::error::Main merge failed without a classified conflict"
            exit 1
          fi

          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "::error::Unresolved conflicts remain"
            exit 1
          fi

          git rm .github/workflows/spec011-v4-final-sync-once.yml
          git commit -m "chore(spec-011): synchronize final reconciliation with main"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Regenerate bounded contracts
        working-directory: http-generic-api
        run: |
          git fetch origin main --depth=1
          npm run frontend:dispatch:generate -- --baseline-ref=main
          node scripts/generate-custom-gpt-schemas.mjs --write

      - name: Verify generated and focused contracts
        working-directory: http-generic-api
        run: |
          node test-frontend-operation-governance-generator.mjs
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-openapi-route-coverage.mjs
          npm run openapi:auth:check
          npm run schemas:guard
          node test-managed-git-ephemeral-checkout-executor.mjs
          node scripts/test-managed-git-worker-lifecycle.mjs
          node test-operation-orchestrator-managed-workspace-dependency.mjs
          node test-managed-git-repository-credential-binding.mjs
          node test-operation-orchestrator-repository-credential.mjs

      - name: Commit generated artifacts and push final head
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(git status --porcelain --untracked-files=all | sed -E 's/^...//')
          if [[ ${#CHANGED[@]} -gt 0 ]]; then
            UNEXPECTED=""
            for file in "${CHANGED[@]}"; do
              case "$file" in
                http-generic-api/frontend-operation-governance.generated.json|\
                http-generic-api/frontend-surface-dispatch.generated.json|\
                http-generic-api/openapi/frontend-runtime-routes.generated.yaml|\
                http-generic-api/openapi/openapi.custom-gpt.auth-dispatcher.yaml|\
                http-generic-api/openapi/openapi.custom-gpt.activation-admin.yaml|\
                http-generic-api/openapi/openapi.tenant-gpt.auth.yaml|\
                http-generic-api/openapi/openapi.tenant-gpt.activation.yaml|\
                http-generic-api/openapi.gpt-action.local-connector.yaml)
                  ;;
                *) UNEXPECTED+="$file"$'\n' ;;
              esac
            done
            if [[ -n "$UNEXPECTED" ]]; then
              echo "::error::Final generator changed files outside bounded artifacts"
              printf '%s' "$UNEXPECTED"
              exit 1
            fi
            git add -- "${CHANGED[@]}"
            git commit -m "chore(ci): refresh final Spec 011 artifacts"
          fi
          git push origin HEAD:gpt/reconcile/011-managed-git-worker-main-v4-20260730
