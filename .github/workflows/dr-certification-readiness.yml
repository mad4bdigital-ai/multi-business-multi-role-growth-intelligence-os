name: DR Certification Readiness

on:
  workflow_dispatch:
  schedule:
    - cron: '47 3 * * *'
  pull_request:
    paths:
      - 'http-generic-api/scripts/dr-certifiers/**'
      - 'http-generic-api/scripts/dr-certification-evidence-readback.mjs'
      - 'http-generic-api/releaseReadiness.js'
      - '.github/workflows/dr-certification-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'http-generic-api/scripts/dr-certifiers/**'
      - 'http-generic-api/scripts/dr-certification-evidence-readback.mjs'
      - 'http-generic-api/releaseReadiness.js'
      - '.github/workflows/dr-certification-readiness.yml'

permissions:
  contents: read

concurrency:
  group: mad4b-latest-head-${{ github.workflow_ref }}-${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch' && !github.ref_protected && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/Production' && github.ref != 'refs/heads/production' && github.ref != 'refs/heads/staging' && github.ref != 'refs/heads/Staging' && !startsWith(github.ref, 'refs/heads/release/'))) && (github.event.pull_request.number || github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch' && !github.ref_protected && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/Production' && github.ref != 'refs/heads/production' && github.ref != 'refs/heads/staging' && github.ref != 'refs/heads/Staging' && !startsWith(github.ref, 'refs/heads/release/')) }}

jobs:
  static-dr-certification-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Static DR certification contract checks
        run: node http-generic-api/test-dr-certification-and-toolbus-gated.mjs
