name: Work Map Reconcile Post Sync Generator V4

on:
  pull_request:
    branches:
      - gpt/validate-work-map-reconcile-6150-33c8dc3b
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: work-map-reconcile-post-sync-v4-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: 2f6634d39cf6a281efb1f7744bb1dee3a28f2cd9
  EXPECTED_HEAD_SHA: 56e460b962b0fb6fb66680a7ddc2b32a383d13a9
  TARGET_BRANCH: gpt/work-map-input-driven-governance-reconcile-20260804

jobs:
  generate:
    name: Generate exact post-sync Work Maps V4
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/work-map-input-driven-governance-reconcile-20260804' &&
      github.event.pull_request.head.sha == '56e460b962b0fb6fb66680a7ddc2b32a383d13a9'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Initialize bounded evidence
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/work-map-post-sync-v4-${GITHUB_RUN_ID}"
          printf 'EVIDENCE_ROOT=%s\n' "${root}" >> "${GITHUB_ENV}"
          mkdir -p "${root}/generated/docs/work-maps"

      - name: Checkout exact synchronized source head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Prove identity five-file scope and install dependencies
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          test "$(git rev-parse origin/main)" = "${EXPECTED_MAIN_SHA}"
          test "$(git rev-list --count HEAD..origin/main)" = "0"
          test "$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk 'NR == 1 {print $1}')" = "${EXPECTED_HEAD_SHA}"
          git diff --name-only "${EXPECTED_MAIN_SHA}...HEAD" | LC_ALL=C sort > "${EVIDENCE_ROOT}/source-files.txt"
          printf '%s\n' \
            .changes/e2e/work-map-autofix-validation-diagnostics.json \
            .github/workflows/spec-kit-work-map-autofix.yml \
            http-generic-api/scripts/maintenance-tools/repository-tool-lifecycle-guard.mjs \
            http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs \
            http-generic-api/test-work-map-autofix-validation-diagnostics.mjs \
            | LC_ALL=C sort > "${EVIDENCE_ROOT}/expected-source-files.txt"
          diff -u "${EVIDENCE_ROOT}/expected-source-files.txt" "${EVIDENCE_ROOT}/source-files.txt"
          test -z "$(git status --porcelain)"
          npm ci --prefix http-generic-api

      - name: Validate sources and generate twice
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs | tee "${EVIDENCE_ROOT}/lifecycle-regression.log"
          node http-generic-api/test-work-map-autofix-validation-diagnostics.mjs | tee "${EVIDENCE_ROOT}/diagnostics-regression.log"
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          git diff --name-only | LC_ALL=C sort > "${EVIDENCE_ROOT}/generated-files.txt"
          printf '%s\n' \
            docs/work-maps/README.md \
            docs/work-maps/repository-automation-map.md \
            | LC_ALL=C sort > "${EVIDENCE_ROOT}/expected-generated-files.txt"
          diff -u "${EVIDENCE_ROOT}/expected-generated-files.txt" "${EVIDENCE_ROOT}/generated-files.txt"
          git diff --check
          first_hash="$(git diff --binary -- docs/work-maps | sha256sum | awk '{print $1}')"
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          second_hash="$(git diff --binary -- docs/work-maps | sha256sum | awk '{print $1}')"
          test "${first_hash}" = "${second_hash}"
          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          printf '%s\n' "${first_hash}" > "${EVIDENCE_ROOT}/generated-diff-sha256.txt"
          cp docs/work-maps/README.md "${EVIDENCE_ROOT}/generated/docs/work-maps/README.md"
          cp docs/work-maps/repository-automation-map.md "${EVIDENCE_ROOT}/generated/docs/work-maps/repository-automation-map.md"

      - name: Create local commit and enforce exact E2E lifecycle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk 'NR == 1 {print $1}')" = "${EXPECTED_HEAD_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/work-maps/README.md docs/work-maps/repository-automation-map.md
          git commit -m "docs(work-maps): regenerate after current-main synchronization"
          new_head="$(git rev-parse HEAD)"
          printf 'NEW_HEAD_SHA=%s\n' "${new_head}" >> "${GITHUB_ENV}"
          printf '%s\n' "${new_head}" > "${EVIDENCE_ROOT}/local-head-sha.txt"
          git diff --name-only "${EXPECTED_MAIN_SHA}...${new_head}" | LC_ALL=C sort > "${EVIDENCE_ROOT}/final-files.txt"
          cat "${EVIDENCE_ROOT}/expected-source-files.txt" "${EVIDENCE_ROOT}/expected-generated-files.txt" | LC_ALL=C sort -u > "${EVIDENCE_ROOT}/expected-final-files.txt"
          diff -u "${EVIDENCE_ROOT}/expected-final-files.txt" "${EVIDENCE_ROOT}/final-files.txt"

          export BASE_SHA="${EXPECTED_MAIN_SHA}"
          export CANDIDATE_SHA="${new_head}"
          node http-generic-api/scripts/e2e-contract-reference-integrity.mjs --base "${BASE_SHA}" --head "${CANDIDATE_SHA}" --report-file "${EVIDENCE_ROOT}/e2e-contract-reference-integrity.json"
          node http-generic-api/scripts/e2e-contract-git-index-integrity.mjs --report-file "${EVIDENCE_ROOT}/e2e-contract-reference-integrity.json"
          node http-generic-api/scripts/e2e-phase-governance.mjs check --base "${BASE_SHA}" --head "${CANDIDATE_SHA}" --report-file "${EVIDENCE_ROOT}/e2e-phase-evaluation.json"
          git diff --name-status "${BASE_SHA}" "${CANDIDATE_SHA}" > "${EVIDENCE_ROOT}/changed-files.tsv"
          node http-generic-api/scripts/maintenance-tools/repository-tool-lifecycle-guard.mjs --changed-files "${EVIDENCE_ROOT}/changed-files.tsv" --policy .github/repository-maintenance-tool-governance.json --output-dir "${EVIDENCE_ROOT}/repository-tool-lifecycle"
          node --input-type=module -e "import fs from 'node:fs'; const p=process.env.EVIDENCE_ROOT + '/repository-tool-lifecycle/repository-tool-lifecycle-report.json'; const r=JSON.parse(fs.readFileSync(p,'utf8')); if(!r.ok || r.findings.length) process.exit(1);"
          test -z "$(git status --porcelain)"

      - name: Push exact generated commit without force
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk 'NR == 1 {print $1}')" = "${EXPECTED_HEAD_SHA}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          test "$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk 'NR == 1 {print $1}')" = "${NEW_HEAD_SHA}"
          printf '%s\n' "${NEW_HEAD_SHA}" > "${EVIDENCE_ROOT}/published-head-sha.txt"

      - name: Upload bounded post-sync evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-map-post-sync-v4-${{ github.run_id }}
          path: ${{ runner.temp }}/work-map-post-sync-v4-${{ github.run_id }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
