name: UEACP Governed Operational Evidence Cycle

on:
  pull_request:
    branches: [main]
    paths:
      - ".changes/e2e/ueacp-governed-operational-evidence-cycle.json"
      - ".github/workflows/ueacp-governed-operational-evidence-cycle.yml"
      - "http-generic-api/authorityEvidenceRepositorySnapshotCollector.js"
      - "http-generic-api/scripts/authority-evidence-repository-snapshots.mjs"
      - "http-generic-api/scripts/authority-governed-operational-evidence-cycle.mjs"
      - "http-generic-api/test-authority-evidence-repository-snapshot-collector.mjs"
      - "specs/011-unified-effective-authority-control-plane/governed-operational-evidence-cycle.md"
  workflow_dispatch:
    inputs:
      source_manifest_file:
        description: Reviewed repository-relative manifest binding exactly eight authority source files
        required: true
        type: string
      target_schema:
        description: Exact Production schema authorized for the read-only catalog census
        required: true
        type: string
      confirm:
        description: Type I_AUTHORIZE_READ_ONLY_UEACP_EVIDENCE
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ueacp-governed-operational-evidence-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Governed Operational Evidence Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Check syntax
        run: |
          node --check http-generic-api/authorityEvidenceRepositorySnapshotCollector.js
          node --check http-generic-api/scripts/authority-evidence-repository-snapshots.mjs
          node --check http-generic-api/scripts/authority-governed-operational-evidence-cycle.mjs
          node --check http-generic-api/test-authority-evidence-repository-snapshot-collector.mjs
      - name: Run repository snapshot collector regression
        working-directory: http-generic-api
        run: node test-authority-evidence-repository-snapshot-collector.mjs
      - name: Enforce no implicit operational trigger
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/ueacp-governed-operational-evidence-cycle.yml
          grep -q '^  workflow_dispatch:' "$workflow"
          ! grep -Eq '^  (push|schedule|issue_comment|workflow_run):' "$workflow"
          grep -q "vars.UEACP_LIVE_EVIDENCE_ENABLED == 'true'" "$workflow"
          grep -q 'environment: ueacp-live-evidence' "$workflow"
          grep -q 'I_AUTHORIZE_READ_ONLY_UEACP_EVIDENCE' "$workflow"
          grep -q 'ref: ${{ github.sha }}' "$workflow"

  live-read-only-cycle:
    name: Live Read-Only Evidence Cycle
    if: >-
      github.event_name == 'workflow_dispatch' &&
      vars.UEACP_LIVE_EVIDENCE_ENABLED == 'true' &&
      inputs.confirm == 'I_AUTHORIZE_READ_ONLY_UEACP_EVIDENCE'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ueacp-live-evidence
    env:
      RUNTIME_BASE_URL: https://auth.mad4b.com
      BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
      REPOSITORY: ${{ github.repository }}
      SOURCE_MANIFEST_FILE: ${{ inputs.source_manifest_file }}
      TARGET_SCHEMA: ${{ inputs.target_schema }}
      EVIDENCE_DIR: ${{ runner.temp }}/ueacp-governed-operational-evidence
    steps:
      - name: Checkout exact trusted dispatch SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Enforce trusted immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          [[ "${TARGET_SCHEMA}" =~ ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$ ]]
          [[ "${SOURCE_MANIFEST_FILE}" != /* ]]
          [[ "${SOURCE_MANIFEST_FILE}" != *..* ]]
          test -f "${SOURCE_MANIFEST_FILE}"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync(process.env.SOURCE_MANIFEST_FILE, 'utf8'));
          const head = process.env.GITHUB_SHA;
          if (manifest.contract !== 'mad4b.ueacp.authority-evidence-repository-manifest.v1') throw new Error('invalid source manifest contract');
          if (manifest.repository !== process.env.REPOSITORY) throw new Error('source manifest repository mismatch');
          if (manifest.observed_ref !== head) throw new Error(`source manifest must pin current main ${head}`);
          NODE
          mkdir -p "${EVIDENCE_DIR}"
      - name: Create short-lived read-only authorization
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const issued = new Date();
          const expires = new Date(issued.getTime() + 30 * 60 * 1000);
          const authorization = {
            contract: 'mad4b.ueacp.authority-live-evidence-authorization.v1',
            operation_mode: 'read_only_live_authority_evidence',
            operation_ref: `github.run.${process.env.GITHUB_RUN_ID}.${process.env.GITHUB_SHA}`,
            environment: 'production_runtime',
            target_schema: process.env.TARGET_SCHEMA,
            issued_at: issued.toISOString(),
            expires_at: expires.toISOString(),
            approved: true,
            read_only: true,
            applies_sql: false,
            provider_calls: false,
            credential_payload_read: false,
            external_writes: false,
            secrets_included: false
          };
          fs.writeFileSync(`${process.env.EVIDENCE_DIR}/authorization.json`, `${JSON.stringify(authorization, null, 2)}\n`);
          NODE
      - name: Collect SHA-bound repository authority snapshots
        working-directory: http-generic-api
        run: |
          node scripts/authority-evidence-repository-snapshots.mjs \
            --repository-root .. \
            --manifest-file "../${SOURCE_MANIFEST_FILE}" \
            --sources-output "${EVIDENCE_DIR}/sources.json" \
            --attestation-output "${EVIDENCE_DIR}/repository-attestation.json"
      - name: Observe live SQL catalog with same-cycle readback
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/ueacp-governed-operational-evidence/catalog-observation.json
          OBSERVED_REF: ${{ github.sha }}
        run: node .github/scripts/authority-live-census-observation.mjs
      - name: Compose immutable governed evidence packet
        working-directory: http-generic-api
        run: |
          node scripts/authority-governed-operational-evidence-cycle.mjs \
            --authorization-file "${EVIDENCE_DIR}/authorization.json" \
            --sources-file "${EVIDENCE_DIR}/sources.json" \
            --observation-file "${EVIDENCE_DIR}/catalog-observation.json" \
            --packet-output "${EVIDENCE_DIR}/live-evidence-packet.json"
      - name: Upload no-secret evidence before enforcing outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ueacp-governed-operational-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/ueacp-governed-operational-evidence/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce read-only packet boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          packet="${EVIDENCE_DIR}/live-evidence-packet.json"
          test -f "$packet"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const packet = JSON.parse(fs.readFileSync(`${process.env.EVIDENCE_DIR}/live-evidence-packet.json`, 'utf8'));
          const safe = packet.status === 'ready_for_human_ownership_review'
            && packet.read_only === true
            && packet.applies_sql === false
            && packet.runtime_authority_changed === false
            && packet.provider_calls === false
            && packet.credential_payload_read === false
            && packet.external_writes === false
            && packet.secrets_included === false
            && packet.closure_state?.t001_complete === false
            && packet.closure_state?.t002_complete === false
            && packet.closure_state?.migration_apply_authorized === false;
          if (!safe) throw new Error('UEACP live evidence packet did not satisfy the governed read-only boundary');
          console.log(JSON.stringify({ status: packet.status, packet_sha256: packet.packet_sha256, secrets_included: false }));
          NODE
