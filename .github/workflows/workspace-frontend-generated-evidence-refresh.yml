name: Workspace Frontend Generated Evidence Refresh

on:
  push:
    branches:
      - gpt/refresh-workspace-frontend-generated-evidence-20260730
    paths:
      - .github/workflows/workspace-frontend-generated-evidence-refresh.yml

permissions:
  contents: write

concurrency:
  group: workspace-frontend-generated-evidence-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout governed refresh branch
        uses: actions/checkout@v5
        with:
          ref: gpt/refresh-workspace-frontend-generated-evidence-20260730
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Generate canonical frontend evidence
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          npm run frontend:dispatch:generate -- --baseline-ref=main

      - name: Verify generator contracts
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          node test-frontend-dispatch-workflow-baseline.mjs
          node test-frontend-operation-governance-generator.mjs
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-openapi-route-coverage.mjs
          npm run openapi:auth:check

      - name: Commit bounded evidence and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/workspace-frontend-generated-evidence-refresh.yml
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          allowed = {
              '.github/workflows/workspace-frontend-generated-evidence-refresh.yml',
              'http-generic-api/frontend-operation-governance.generated.json',
              'http-generic-api/frontend-surface-dispatch.generated.json',
              'http-generic-api/openapi/frontend-runtime-routes.generated.yaml',
          }
          required = {
              '.github/workflows/workspace-frontend-generated-evidence-refresh.yml',
              'http-generic-api/frontend-surface-dispatch.generated.json',
              'http-generic-api/openapi/frontend-runtime-routes.generated.yaml',
          }
          output = subprocess.check_output(
              ['git', 'status', '--porcelain', '--untracked-files=all'],
              text=True,
          )
          changed = {line[3:] for line in output.splitlines() if line.strip()}
          unexpected = changed - allowed
          missing = required - changed
          if unexpected:
              raise SystemExit(f'unexpected_generated_write_set:{sorted(unexpected)}')
          if missing:
              raise SystemExit(f'missing_required_generated_changes:{sorted(missing)}')
          for path in changed:
              if path != '.github/workflows/workspace-frontend-generated-evidence-refresh.yml' and not Path(path).exists():
                  raise SystemExit(f'generated_file_missing:{path}')
          print({'bounded_write_set': sorted(changed), 'secrets_included': False})
          PY
          git add \
            http-generic-api/frontend-operation-governance.generated.json \
            http-generic-api/frontend-surface-dispatch.generated.json \
            http-generic-api/openapi/frontend-runtime-routes.generated.yaml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ci): refresh Workspace frontend generated evidence"
          git push origin HEAD:gpt/refresh-workspace-frontend-generated-evidence-20260730
