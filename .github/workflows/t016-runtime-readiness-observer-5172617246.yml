name: T016 Runtime Readiness Observer 5172617246

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  actions: read
  contents: read
  issues: read

concurrency:
  group: t016-runtime-readiness-observer-5172617246
  cancel-in-progress: true

jobs:
  observe:
    name: Observe exact Runtime Readiness run
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      ISSUE_NUMBER: '4449'
      AUTHORIZATION_COMMENT_ID: '5172617246'
      AUTHORIZATION_COMMENT: AUTHORIZE_GOVERNED_MIGRATION_1043_SPRINT69_TENANT_MANAGED_EXECUTION_LIFECYCLE
      WORKFLOW_FILE: sprint69-1043-runtime-readiness.yml
      WORKFLOW_NAME: Sprint 69 Migration 1043 Runtime Readiness
      REPORT_DIR: .artifacts/t016-runtime-readiness-observer
      SOURCE_DIR: .artifacts/t016-runtime-readiness-source
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Discover exact authorization-bound run
        id: discover
        shell: bash
        run: |
          node <<'NODE'
          (async () => {
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const repo = process.env.REPOSITORY;
          const issue = Number(process.env.ISSUE_NUMBER);
          const commentId = Number(process.env.AUTHORIZATION_COMMENT_ID);
          const exactBody = process.env.AUTHORIZATION_COMMENT;
          const workflowFile = process.env.WORKFLOW_FILE;
          const workflowName = process.env.WORKFLOW_NAME;
          const reportDir = process.env.REPORT_DIR;
          const outputPath = process.env.GITHUB_OUTPUT;
          const token = process.env.GH_TOKEN;
          const allowed = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
          async function api(pathname) {
            const response = await fetch(`https://api.github.com${pathname}`, {
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28',
              },
              signal: AbortSignal.timeout(30000),
            });
            const payload = await response.json();
            assert.ok(response.ok, `GitHub API ${pathname} failed: ${response.status}`);
            return payload;
          }
          function isoMs(value) {
            const parsed = Date.parse(String(value || ''));
            assert.ok(Number.isFinite(parsed), `Invalid timestamp: ${value}`);
            return parsed;
          }
          const comment = await api(`/repos/${repo}/issues/comments/${commentId}`);
          assert.equal(String(comment.body || '').trim(), exactBody);
          assert.equal(Number(String(comment.issue_url || '').split('/').pop()), issue);
          assert.equal(comment.user?.login, 'mad4bdigital-ai');
          assert.ok(allowed.has(String(comment.author_association || '').toUpperCase()));
          const boundary = isoMs(comment.created_at);
          const runs = [];
          for (let page = 1; page <= 20; page += 1) {
            const list = await api(`/repos/${repo}/actions/workflows/${encodeURIComponent(workflowFile)}/runs?event=issue_comment&per_page=100&page=${page}`);
            const pageRuns = list.workflow_runs || [];
            runs.push(...pageRuns);
            if (!pageRuns.length) break;
            const oldest = Math.min(...pageRuns.map((run) => isoMs(run.created_at)));
            if (oldest <= boundary) break;
          }
          const candidates = runs
            .filter((run) => run.name === workflowName)
            .filter((run) => run.event === 'issue_comment')
            .filter((run) => run.head_branch === 'main')
            .filter((run) => run.actor?.login === comment.user.login)
            .filter((run) => isoMs(run.created_at) >= boundary)
            .filter((run) => run.conclusion !== 'skipped')
            .sort((a, b) => isoMs(a.created_at) - isoMs(b.created_at));
          let run = candidates[0] || null;
          for (let attempt = 1; run && run.status !== 'completed' && attempt <= 100; attempt += 1) {
            await new Promise((resolve) => setTimeout(resolve, 15000));
            run = await api(`/repos/${repo}/actions/runs/${run.id}`);
          }
          let artifact = null;
          if (run?.status === 'completed') {
            const artifacts = await api(`/repos/${repo}/actions/runs/${run.id}/artifacts?per_page=100`);
            const expected = `sprint69-1043-runtime-readiness-${run.id}`;
            artifact = (artifacts.artifacts || []).find((item) => item.name === expected && item.expired === false) || null;
          }
          fs.mkdirSync(reportDir, { recursive: true });
          const discovery = {
            contract: 't016_runtime_readiness_observer_discovery.v1',
            authorization_comment_id: commentId,
            authorization_verified: true,
            authorization_actor: comment.user.login,
            authorization_association: comment.author_association,
            authorization_created_at: comment.created_at,
            run_id: run?.id || null,
            run_status: run?.status || null,
            run_conclusion: run?.conclusion || null,
            run_head_sha: run?.head_sha || null,
            artifact_id: artifact?.id || null,
            artifact_name: artifact?.name || null,
            candidate_count: candidates.length,
            repository_mutation_performed: false,
            runtime_contacted_by_observer: false,
            migration_apply_executed_by_observer: false,
            consult_job_logs: false,
            secrets_included: false,
          };
          fs.writeFileSync(path.join(reportDir, 'discovery.json'), `${JSON.stringify(discovery, null, 2)}\n`);
          fs.appendFileSync(outputPath, `run_id=${run?.id || ''}\n`);
          fs.appendFileSync(outputPath, `artifact_name=${artifact?.name || ''}\n`);
          fs.appendFileSync(outputPath, `artifact_found=${artifact ? 'true' : 'false'}\n`);
          fs.appendFileSync(outputPath, `run_conclusion=${run?.conclusion || ''}\n`);
          console.log(JSON.stringify(discovery, null, 2));
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Download exact Runtime Readiness Artifact
        if: steps.discover.outputs.artifact_found == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.discover.outputs.artifact_name }}
          path: ${{ env.SOURCE_DIR }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.discover.outputs.run_id }}

      - name: Produce bounded result
        id: result
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const reportDir = process.env.REPORT_DIR;
          const sourceDir = process.env.SOURCE_DIR;
          const outputPath = process.env.GITHUB_OUTPUT;
          const discovery = JSON.parse(fs.readFileSync(path.join(reportDir, 'discovery.json'), 'utf8'));
          const read = (name) => {
            try { return JSON.parse(fs.readFileSync(path.join(sourceDir, name), 'utf8')); }
            catch (error) { if (error.code === 'ENOENT') return null; throw error; }
          };
          const summary = read('summary.json');
          const failure = read('failure.json');
          assert.ok(!(summary && failure), 'Artifact cannot contain summary and failure together');
          let result;
          if (summary) {
            assert.equal(summary.contract, 'sprint69_1043_runtime_readiness.v1');
            assert.equal(summary.secrets_included, false);
            result = {
              status: 'pass',
              result: summary.result,
              main_sha: summary.main_sha || null,
              production_sha: summary.production_sha || null,
              migration_checksum_sha256: summary.migration_checksum_sha256 || null,
              statement_count: summary.statement_count ?? null,
              runtime_parity: summary.runtime_parity || null,
              authorization_created: summary.authorization_created ?? null,
              authorization_bootstrap: summary.authorization_bootstrap || null,
              dry_run: summary.dry_run || null,
              apply_authorized: summary.apply_authorized ?? null,
              apply_sent: summary.apply_sent ?? null,
              migration_apply_executed: summary.migration_apply_executed ?? null,
              activation_registry_sync_executed: summary.activation_registry_sync_executed ?? null,
              managed_control_plane_write_executed: summary.managed_control_plane_write_executed ?? null,
              business_data_mutation_executed: summary.business_data_mutation_executed ?? null,
              provider_call_executed: summary.provider_call_executed ?? null,
              credential_payload_accessed: summary.credential_payload_accessed ?? null,
              external_business_write_executed: summary.external_business_write_executed ?? null,
              secrets_included: false,
            };
          } else if (failure) {
            assert.equal(failure.contract, 'sprint69_1043_runtime_readiness_failure.v1');
            result = {
              status: 'fail',
              stage: failure.stage || null,
              error_code: failure.error?.code || 'runtime_readiness_failed',
              main_sha: failure.main_sha || null,
              production_sha: failure.production_sha || null,
              authorization_created: failure.authorization_created ?? null,
              apply_authorized: failure.apply_authorized ?? null,
              apply_sent: failure.apply_sent ?? null,
              migration_apply_executed: failure.migration_apply_executed ?? null,
              activation_registry_sync_executed: failure.activation_registry_sync_executed ?? null,
              secrets_included: failure.secrets_included ?? null,
            };
          } else {
            result = {
              status: 'fail',
              error_code: discovery.run_conclusion || 'artifact_not_available',
              apply_authorized: false,
              apply_sent: false,
              migration_apply_executed: false,
              secrets_included: false,
            };
          }
          const bounded = {
            contract: 't016_runtime_readiness_observer_result.v1',
            authorization_comment_id: discovery.authorization_comment_id,
            run_id: discovery.run_id,
            run_conclusion: discovery.run_conclusion,
            ...result,
            repository_mutation_performed_by_observer: false,
            runtime_contacted_by_observer: false,
            consult_job_logs: false,
          };
          fs.writeFileSync(path.join(reportDir, 'result.json'), `${JSON.stringify(bounded, null, 2)}\n`);
          fs.appendFileSync(outputPath, `result_ok=${bounded.status === 'pass' ? 'true' : 'false'}\n`);
          console.log(JSON.stringify(bounded, null, 2));
          NODE

      - name: Upload bounded observer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t016-runtime-readiness-observer-${{ github.run_id }}
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Enforce successful Runtime Readiness
        if: always()
        run: test "${{ steps.result.outputs.result_ok }}" = "true"
