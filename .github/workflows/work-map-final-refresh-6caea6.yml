name: Work Map Final Refresh 6CAEA6

on:
  push:
    branches:
      - gpt/work-map-final-refresh-6caea6-20260804
    paths:
      - .github/workflows/work-map-final-refresh-6caea6.yml

permissions:
  contents: write

concurrency:
  group: work-map-final-refresh-6caea6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact launcher head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify immutable launcher topology
        shell: bash
        env:
          EXPECTED_PARENT: 6caea6ca1267a45b8218a9b89af78e2151a3ea02
          LAUNCHER_PATH: .github/workflows/work-map-final-refresh-6caea6.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$LAUNCHER_PATH"

      - name: Validate focused diagnostics regression
        shell: bash
        run: |
          set -euo pipefail
          node --check http-generic-api/test-work-map-autofix-validation-diagnostics.mjs
          node http-generic-api/test-work-map-autofix-validation-diagnostics.mjs

      - name: Remove launcher before generation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/work-map-final-refresh-6caea6.yml
          test ! -e .github/workflows/work-map-final-refresh-6caea6.yml

      - name: Generate final-tree maps and binding
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          first_hash="$(git diff --binary -- docs/work-maps | sha256sum | awk '{print $1}')"
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          second_hash="$(git diff --binary -- docs/work-maps | sha256sum | awk '{print $1}')"
          test "$first_hash" = "$second_hash"
          node http-generic-api/scripts/platform-work-map-generator.mjs --check

          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            --spec-dir specs/014-governed-hostinger-storage-orchestration \
            --write

          unexpected="$(git diff --name-only | grep -Ev '^(docs/work-maps/|specs/014-governed-hostinger-storage-orchestration/work-map-integration.json$|\.github/workflows/work-map-final-refresh-6caea6.yml$)' || true)"
          test -z "$unexpected"
          git diff --check

      - name: Validate final readback
        shell: bash
        run: |
          set -euo pipefail
          REPORT_PATH="$RUNNER_TEMP/spec014-final-6caea6.json" \
            node http-generic-api/scripts/spec014-final-work-map-readback.mjs
          node - "$RUNNER_TEMP/spec014-final-6caea6.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (report.ok !== true || (report.findings || []).length !== 0) throw new Error('final_readback_failed');
          if (report.classification?.ok !== true || report.classification?.coverage_percent !== 100) throw new Error('classification_failed');
          if (report.provider_dispatch !== false || report.live_database_access !== false || report.migration_apply !== false || report.secrets_included !== false) throw new Error('safety_boundary_failed');
          NODE

      - name: Commit bounded final output
        shell: bash
        env:
          BRANCH: gpt/work-map-final-refresh-6caea6-20260804
          EVENT_SHA: ${{ github.sha }}
          LAUNCHER_PATH: .github/workflows/work-map-final-refresh-6caea6.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/work-maps
          git add specs/014-governed-hostinger-storage-orchestration/work-map-integration.json
          git add -u "$LAUNCHER_PATH"
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -ge 2
          for path in "${staged[@]}"; do
            if [[ "$path" != "$LAUNCHER_PATH" && "$path" != docs/work-maps/* && "$path" != "specs/014-governed-hostinger-storage-orchestration/work-map-integration.json" ]]; then
              echo "Unexpected staged path: $path"
              exit 1
            fi
          done
          git diff --cached --check
          git commit -m 'docs(work-maps): refresh final diagnostics maps and binding'
          remote_head="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EVENT_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Final safety summary
        shell: bash
        run: |
          set -euo pipefail
          echo 'WORK_MAP_FINAL_REFRESH=success'
          echo "RESULT_HEAD_SHA=$(git rev-parse HEAD)"
          echo 'SECRETS_INCLUDED=false'
          echo 'PROVIDER_DISPATCH=false'
          echo 'LIVE_DATABASE_ACCESS=false'
          echo 'MIGRATION_APPLY=false'
          echo 'PRODUCTION_MUTATION=false'
