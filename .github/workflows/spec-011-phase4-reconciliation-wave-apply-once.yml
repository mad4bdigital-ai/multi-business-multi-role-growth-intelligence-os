name: Spec 011 Phase 4 Reconciliation Wave Apply Once

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: spec-011-phase4-reconciliation-readback-wave
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'gpt/spec-011-phase4-reconciliation-readback-wave-20260731'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Synchronize latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Apply semantic phase integration
        run: node http-generic-api/scripts/spec011-phase4-reconciliation-wave-apply-once.mjs

      - name: Validate phase contracts
        working-directory: http-generic-api
        run: |
          node --check governedReconciliationKernel.js
          node --check test-governed-reconciliation-kernel.mjs
          node test-governed-reconciliation-kernel.mjs
          node test-test-manifest-runner.mjs

      - name: Enforce bounded write set
        run: |
          allowed='^(http-generic-api/governedReconciliationKernel\.js|http-generic-api/test-governed-reconciliation-kernel\.mjs|http-generic-api/scripts/manifests/test-manifest-spec011\.mjs|specs/011-durable-governed-execution-and-agent-delegation/phase4-reconciliation-readback-wave\.md|specs/011-durable-governed-execution-and-agent-delegation/phase4-reconciliation-readback-wave-delivery\.json|specs/011-durable-governed-execution-and-agent-delegation/tasks\.md|http-generic-api/frontend-surface-dispatch\.generated\.json)$'
          unexpected="$(git diff --name-only origin/main...HEAD; git diff --name-only)"
          unexpected="$(printf '%s\n' "$unexpected" | sed '/^$/d' | sort -u | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files in Phase 4 wave:"
            echo "$unexpected"
            exit 1
          fi
          test ! -e .github/workflows/spec-011-phase4-reconciliation-wave-apply-once.yml
          test ! -e http-generic-api/scripts/spec011-phase4-reconciliation-wave-apply-once.mjs

      - name: Commit and push clean phase head
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
            exit 0
          fi
          git commit -m "feat(spec-011): complete reconciliation and readback wave"
          git fetch origin "${{ github.event.pull_request.head.ref }}"
          git rebase "origin/${{ github.event.pull_request.head.ref }}"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
