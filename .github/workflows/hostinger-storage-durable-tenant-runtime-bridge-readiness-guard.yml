name: Hostinger Storage Durable Tenant Runtime Bridge Readiness Guard

on:
  pull_request:
    paths:
      - '.changes/e2e/spec014-durable-tenant-runtime-bridge-readiness.json'
      - '.github/contracts/spec014/hostinger-storage-durable-tenant-runtime-bridge-readiness.json'
      - '.github/workflows/hostinger-storage-durable-tenant-runtime-bridge-readiness-guard.yml'
      - 'http-generic-api/hostingerStorageDurableTenantRuntimeBridgeReadiness.js'
      - 'http-generic-api/test-hostinger-storage-durable-tenant-runtime-bridge-readiness.mjs'
      - 'http-generic-api/hostingerStorageVerifiedSqlRuntimeComposition.js'
      - 'http-generic-api/hostingerStorageTenantRuntime.js'
      - 'http-generic-api/hostingerStorageTenantCanaryBase.js'
      - 'http-generic-api/hostingerStorageSyntheticExecutorBase.js'
      - 'http-generic-api/routes/hostingerStorageTenantRoutes.js'

permissions:
  contents: read

concurrency:
  group: hostinger-storage-durable-tenant-runtime-bridge-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  durable-tenant-runtime-bridge-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check readiness syntax
        run: |
          node --check http-generic-api/hostingerStorageDurableTenantRuntimeBridgeReadiness.js
          node --check http-generic-api/test-hostinger-storage-durable-tenant-runtime-bridge-readiness.mjs

      - name: Validate bridge gaps and fail-closed readiness contract
        run: node http-generic-api/test-hostinger-storage-durable-tenant-runtime-bridge-readiness.mjs

      - name: Preserve repository-only non-mount boundary
        shell: bash
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          ! printf '%s\n' "$changed_files" | grep -E '^http-generic-api/(server\.js$|routes/index\.js$|routes/hostingerStorageTenantRoutes\.js$|migrations/)'
          ! grep -E "from ['\"](?:mysql2|node:child_process|node:net|node:tls)['\"]|\b(exec|execFile|spawn|fork)\s*\(" \
            http-generic-api/hostingerStorageDurableTenantRuntimeBridgeReadiness.js \
            http-generic-api/test-hostinger-storage-durable-tenant-runtime-bridge-readiness.mjs
          ! grep -E '\b(providerDispatch|dispatchProvider|governed_migration_execute|bootstrapGovernedMigrationAuthorization)\b' \
            http-generic-api/hostingerStorageDurableTenantRuntimeBridgeReadiness.js
          grep -q 'bridge_created: false' http-generic-api/hostingerStorageDurableTenantRuntimeBridgeReadiness.js
          grep -q 'authorization_created: false' http-generic-api/hostingerStorageDurableTenantRuntimeBridgeReadiness.js
          grep -q 'dependency_injected: false' http-generic-api/hostingerStorageDurableTenantRuntimeBridgeReadiness.js
          grep -q 'runtime_mounted: false' http-generic-api/hostingerStorageDurableTenantRuntimeBridgeReadiness.js
          grep -q 'provider_dispatch_allowed: false' http-generic-api/hostingerStorageDurableTenantRuntimeBridgeReadiness.js
          grep -q 'production_ready: false' http-generic-api/hostingerStorageDurableTenantRuntimeBridgeReadiness.js
          grep -q '"database_writes_performed_by_evaluator": 0' .github/contracts/spec014/hostinger-storage-durable-tenant-runtime-bridge-readiness.json
          grep -q '"provider_calls": 0' .github/contracts/spec014/hostinger-storage-durable-tenant-runtime-bridge-readiness.json
          grep -q '"secrets_included": false' .github/contracts/spec014/hostinger-storage-durable-tenant-runtime-bridge-readiness.json
