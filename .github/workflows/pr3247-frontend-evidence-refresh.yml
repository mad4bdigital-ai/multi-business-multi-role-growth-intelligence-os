name: PR 3247 frontend evidence refresh

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - gpt/response-chunk-ownership-a23e0076

permissions:
  contents: write
  pull-requests: read

jobs:
  refresh:
    if: startsWith(github.event.pull_request.head.ref, 'gpt/pr3247-frontend-evidence-trigger-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gpt/response-chunk-ownership-a23e0076
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json
      - name: Generate and validate bounded frontend evidence
        shell: bash
        run: |
          set -euo pipefail
          cd http-generic-api
          npm ci
          git fetch origin main --depth=1
          npm run frontend:dispatch:generate -- --baseline-ref=main
          node test-frontend-dispatch-workflow-baseline.mjs
          node test-frontend-operation-governance-generator.mjs
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-openapi-route-coverage.mjs
          npm run openapi:auth:check
          UNEXPECTED="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(http-generic-api/)?(frontend-operation-governance\.generated\.json|frontend-surface-dispatch\.generated\.json|openapi/frontend-runtime-routes\.generated\.yaml)$' || true)"
          if [[ -n "${UNEXPECTED}" ]]; then
            echo "::error::generator changed files outside the bounded evidence set"
            printf '%s\n' "${UNEXPECTED}"
            exit 1
          fi
      - name: Commit refreshed evidence and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr3247-frontend-evidence-refresh.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/pr3247-frontend-evidence-refresh.yml \
            http-generic-api/frontend-operation-governance.generated.json \
            http-generic-api/frontend-surface-dispatch.generated.json \
            http-generic-api/openapi/frontend-runtime-routes.generated.yaml
          if git diff --cached --quiet; then
            echo "::error::frontend evidence refresh produced no bounded changes"
            exit 1
          fi
          git commit -m "chore(ci): refresh frontend dispatch evidence"
          git push origin HEAD:gpt/response-chunk-ownership-a23e0076
