name: Exact Source Snapshot 6314

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event.pull_request.number == 6314
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind snapshot to governed candidate lineage
        shell: bash
        env:
          GOVERNED_CANDIDATE: 81d2d7bb275e16f16ee8bb98d656df0e329554ec
          ACTUAL_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${ACTUAL_HEAD}"
          git merge-base --is-ancestor "${GOVERNED_CANDIDATE}" "${ACTUAL_HEAD}"
          test "$(git diff --name-only "${GOVERNED_CANDIDATE}...${ACTUAL_HEAD}" | sort)" = ".github/workflows/exact-source-snapshot-6314.yml"

      - name: Collect governed candidate source files
        shell: bash
        env:
          GOVERNED_CANDIDATE: 81d2d7bb275e16f16ee8bb98d656df0e329554ec
        run: |
          set -euo pipefail
          mkdir -p \
            snapshot/.changes/e2e \
            snapshot/.github/workflows \
            snapshot/.specify \
            snapshot/http-generic-api/scripts \
            snapshot/specs/014-governed-hostinger-storage-orchestration
          git show "${GOVERNED_CANDIDATE}:http-generic-api/scripts/e2e-phase-governance.mjs" > snapshot/http-generic-api/scripts/e2e-phase-governance.mjs
          git show "${GOVERNED_CANDIDATE}:http-generic-api/scripts/e2e-parallel-pr-gate.mjs" > snapshot/http-generic-api/scripts/e2e-parallel-pr-gate.mjs
          git show "${GOVERNED_CANDIDATE}:http-generic-api/scripts/test-e2e-parallel-single-pr-maintenance.mjs" > snapshot/http-generic-api/scripts/test-e2e-parallel-single-pr-maintenance.mjs
          git show "${GOVERNED_CANDIDATE}:.github/workflows/e2e-phase-governance.yml" > snapshot/.github/workflows/e2e-phase-governance.yml
          git show "${GOVERNED_CANDIDATE}:.specify/e2e-phase-governance.json" > snapshot/.specify/e2e-phase-governance.json
          git show "${GOVERNED_CANDIDATE}:.changes/e2e/spec014-wave1-readback-pr-write-separation.json" > snapshot/.changes/e2e/spec014-wave1-readback-pr-write-separation.json
          git show "${GOVERNED_CANDIDATE}:specs/014-governed-hostinger-storage-orchestration/e2e-phases.json" > snapshot/specs/014-governed-hostinger-storage-orchestration/e2e-phases.json
          printf '%s\n' "${GOVERNED_CANDIDATE}" > snapshot/expected-head.txt
          find snapshot -type f -print0 | sort -z | xargs -0 sha256sum > snapshot/sha256sums.txt

      - name: Upload exact source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: exact-source-snapshot-6314-${{ github.run_id }}
          path: snapshot
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
