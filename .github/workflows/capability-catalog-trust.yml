name: Capability Catalog Trust (Read-Only)
on:
  pull_request:
    paths:
      - 'http-generic-api/capabilityCatalog*.js'
      - 'http-generic-api/test-capability-catalog-*.mjs'
      - 'http-generic-api/migrations/966_capability_catalog_trust_authority.sql'
      - 'docs/governance/capability-catalog-trust-authority-v1.md'
      - '.github/workflows/capability-catalog-trust.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  trust-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run native catalog signing, tenancy and replay contract suite
        run: |
          set -euo pipefail
          node --check http-generic-api/capabilityCatalogAuthority.js
          node --check http-generic-api/capabilityCatalogPersistence.js
          node --check http-generic-api/capabilityCatalogToolCollector.js
          node --test http-generic-api/test-capability-catalog-authority.mjs http-generic-api/test-capability-catalog-persistence.mjs http-generic-api/test-capability-catalog-tool-collector.mjs
