name: Dispatch Work Map Autofix Recovery for PR 6515

on:
  push:
    branches:
      - ops/work-map-autofix-recovery-6515-3fdbe0c3
    paths:
      - .github/ops/work-map-autofix-recovery-6515-3fdbe0c3.trigger

permissions:
  actions: write
  contents: read

concurrency:
  group: dispatch-work-map-autofix-recovery-6515-3fdbe0c3
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch governed recovery bridge
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: "6515"
      EXPECTED_HEAD_SHA: "3fdbe0c337966d3e38b03eee95710274b005f4b3"
      CONFIRMATION: "RECOVER_SPEC_KIT_WORK_MAP_AUTOFIX"
    steps:
      - name: Validate immutable dispatch inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$PR_NUMBER" = "6515"
          test "$EXPECTED_HEAD_SHA" = "3fdbe0c337966d3e38b03eee95710274b005f4b3"
          test "$CONFIRMATION" = "RECOVER_SPEC_KIT_WORK_MAP_AUTOFIX"

      - name: Dispatch repository governed recovery workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          payload="$(jq -cn \
            --arg ref main \
            --arg pr_number "$PR_NUMBER" \
            --arg expected_head_sha "$EXPECTED_HEAD_SHA" \
            --arg confirmation "$CONFIRMATION" \
            '{ref:$ref,inputs:{pr_number:$pr_number,expected_head_sha:$expected_head_sha,confirmation:$confirmation}}')"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/spec-kit-work-map-autofix-recovery-dispatch.yml/dispatches" \
            --input - <<<"$payload"
          echo "Governed recovery dispatch accepted for PR $PR_NUMBER at $EXPECTED_HEAD_SHA"
