name: Spec012 OAuth Exact Head 88439328 Validation

on:
  push:
    branches:
      - gpt/read-main-tree-sha-v8-97e4ee7
    paths:
      - ".github/workflows/spec012-oauth-exact-head-88439328.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: spec012-oauth-exact-head-88439328-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-exact-head:
    runs-on: ubuntu-24.04
    env:
      BASE_SHA: 88439328058c46a87f205cc49be47a1ab0651faf
      TARGET_SHA: 44f060b00b80d62f4fcb55c09d95e4420db54248
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@v4
        with:
          ref: 44f060b00b80d62f4fcb55c09d95e4420db54248
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact identity and bounded inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git rev-parse HEAD^)" = "${BASE_SHA}"
          test "$(git rev-list --count "${BASE_SHA}".."${TARGET_SHA}")" = "1"
          expected="$(printf '%s\n' \
            .changes/e2e/spec012-oauth-production-dependency-composition.json \
            http-generic-api/routes/index.js \
            http-generic-api/test-spec012-t031-oauth-token-route-wiring.mjs | sort)"
          actual="$(git diff --name-only "${BASE_SHA}" "${TARGET_SHA}" | sort)"
          test "${actual}" = "${expected}"
          test "$(git status --porcelain)" = ""
          git diff --check "${BASE_SHA}" "${TARGET_SHA}"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install locked dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Check all HTTP Generic API JavaScript modules
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in *.js *.mjs routes/*.js scripts/*.mjs wordpress/*.js; do
            node --check "${file}"
          done

      - name: Run complete Unit and Integration suite
        working-directory: http-generic-api
        env:
          TEST_SUITE_REPORT_DIR: ${{ runner.temp }}/test-suite-reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${TEST_SUITE_REPORT_DIR}"
          npm test 2>&1 | tee "${RUNNER_TEMP}/spec012-oauth-88439328-full-suite.log"

      - name: Validate changed-range E2E references and phases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/spec012-oauth-88439328-e2e"
          node http-generic-api/test-e2e-contract-reference-integrity.mjs
          node http-generic-api/test-e2e-contract-git-index-integrity.mjs
          node http-generic-api/scripts/e2e-contract-reference-integrity.mjs \
            --report-file "${RUNNER_TEMP}/spec012-oauth-88439328-e2e/e2e-contract-reference-integrity.json" \
            --base "${BASE_SHA}" \
            --head "${TARGET_SHA}"
          node http-generic-api/scripts/e2e-contract-git-index-integrity.mjs \
            --report-file "${RUNNER_TEMP}/spec012-oauth-88439328-e2e/e2e-contract-reference-integrity.json"
          node http-generic-api/scripts/e2e-phase-governance.mjs check \
            --report-file "${RUNNER_TEMP}/spec012-oauth-88439328-e2e/e2e-phase-evaluation.json" \
            --base "${BASE_SHA}" \
            --head "${TARGET_SHA}"
          node http-generic-api/scripts/e2e-phase-governance.mjs run \
            --report-file "${RUNNER_TEMP}/spec012-oauth-88439328-e2e/e2e-phase-evaluation.json" \
            --execution-report-file "${RUNNER_TEMP}/spec012-oauth-88439328-e2e/e2e-phase-execution.json" \
            --base "${BASE_SHA}" \
            --head "${TARGET_SHA}"

      - name: Verify final identity and clean worktree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git status --porcelain)" = ""
          printf '%s\n' \
            "base_sha=${BASE_SHA}" \
            "target_sha=${TARGET_SHA}" \
            "inventory=success" \
            "syntax=success" \
            "unit_integration=success" \
            "e2e_reference=success" \
            "e2e_phase=success" \
            "ref_updated=false" \
            "production_mutated=false" \
            "provider_mutated=false" \
            "database_mutated=false" \
            "migration_applied=false" \
            "credentials_accessed=false" \
            "secrets_included=false" \
            > "${RUNNER_TEMP}/spec012-oauth-88439328-result.txt"

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec012-oauth-exact-head-88439328-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/spec012-oauth-88439328-full-suite.log
            ${{ runner.temp }}/spec012-oauth-88439328-result.txt
            ${{ runner.temp }}/test-suite-reports/*.json
            ${{ runner.temp }}/spec012-oauth-88439328-e2e/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish terminal status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          description="exact-head validation failed"
          if [[ "${JOB_STATUS}" == "success" ]]; then
            state=success
            description="full suite and changed-range E2E passed"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="${state}" \
            -f context="exact-head-88439328-ubuntu2404" \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
