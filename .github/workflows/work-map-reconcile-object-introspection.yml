name: Work Map Reconcile Object Introspection

on:
  pull_request:
    branches:
      - gpt/work-map-reconcile-object-base-81a254bf
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: work-map-reconcile-object-introspection-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: 81a254bfae492e33526f92ec2241f2d927790de2
  EXPECTED_CANDIDATE_SHA: f3fea69731fab719ba5ad96c019e9135705b97a3
  SOURCE_BRANCH: gpt/work-map-input-driven-branch-governance-20260804
  SOURCE_SHA: e222f742df95b3b5ddd1fb4e5ff9f1fc1581a850

jobs:
  inspect:
    name: Extract exact reconciliation tree and blobs
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/work-map-input-driven-governance-reconcile-20260804' &&
      github.event.pull_request.head.sha == 'f3fea69731fab719ba5ad96c019e9135705b97a3'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout exact clean candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Extract exact Git objects
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/work-map-reconcile-objects-${GITHUB_RUN_ID}"
          mkdir -p "${root}"

          git fetch --no-tags origin main "refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/source"
          test "$(git rev-parse HEAD)" = "${EXPECTED_CANDIDATE_SHA}"
          test "$(git rev-parse origin/main)" = "${EXPECTED_MAIN_SHA}"
          test "$(git rev-parse refs/remotes/origin/source)" = "${SOURCE_SHA}"
          test -z "$(git status --porcelain)"

          candidate_tree="$(git rev-parse HEAD^{tree})"
          printf '%s\n' "${candidate_tree}" > "${root}/candidate-tree-sha.txt"
          printf '%s\n' "${EXPECTED_CANDIDATE_SHA}" > "${root}/candidate-head-sha.txt"
          printf '%s\n' "${SOURCE_SHA}" > "${root}/source-head-sha.txt"

          : > "${root}/source-tree-elements.tsv"
          for path in \
            .changes/e2e/work-map-autofix-validation-diagnostics.json \
            .github/workflows/spec-kit-work-map-autofix.yml \
            http-generic-api/scripts/maintenance-tools/repository-tool-lifecycle-guard.mjs \
            http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs \
            http-generic-api/test-work-map-autofix-validation-diagnostics.mjs
          do
            line="$(git ls-tree "${SOURCE_SHA}" -- "${path}")"
            test -n "${line}"
            printf '%s\n' "${line}" >> "${root}/source-tree-elements.tsv"
          done

          test "$(wc -l < "${root}/source-tree-elements.tsv" | tr -d '[:space:]')" = "5"
          awk '{print $4}' "${root}/source-tree-elements.tsv" | LC_ALL=C sort > "${root}/actual-paths.txt"
          printf '%s\n' \
            .changes/e2e/work-map-autofix-validation-diagnostics.json \
            .github/workflows/spec-kit-work-map-autofix.yml \
            http-generic-api/scripts/maintenance-tools/repository-tool-lifecycle-guard.mjs \
            http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs \
            http-generic-api/test-work-map-autofix-validation-diagnostics.mjs \
            | LC_ALL=C sort > "${root}/expected-paths.txt"
          diff -u "${root}/expected-paths.txt" "${root}/actual-paths.txt"

          {
            echo "candidate_sha=${EXPECTED_CANDIDATE_SHA}"
            echo "candidate_tree_sha=${candidate_tree}"
            echo "source_sha=${SOURCE_SHA}"
            echo "main_sha=${EXPECTED_MAIN_SHA}"
            echo "source_files=5"
            echo "mutation=false"
            echo "secrets_included=false"
          } > "${root}/metadata.txt"

      - name: Upload exact object evidence
        uses: actions/upload-artifact@v4
        with:
          name: work-map-reconcile-objects-${{ github.run_id }}
          path: ${{ runner.temp }}/work-map-reconcile-objects-${{ github.run_id }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
