name: Single Owner Policy Autofix

on:
  push:
    branches:
      - fix/github-main-single-owner-policy-20260807
    paths:
      - .github/workflows/single-owner-policy-autofix.yml
      - http-generic-api/scripts/apply-single-owner-policy-autofix.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/github-main-single-owner-policy-20260807
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Repair bootstrap text decoder
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('http-generic-api/scripts/apply-single-owner-policy-autofix.mjs')
          text = path.read_text()
          old = 'const decode = (value) => Buffer.from(value, "base64").toString("utf8");'
          new = 'const decode = (value) => Buffer.from(value, "base64").toString("utf8").replaceAll("\\\\n", "\\n");'
          if text.count(old) != 1:
              raise SystemExit('bootstrap decode anchor must occur exactly once')
          path.write_text(text.replace(old, new))
          PY
          rm -f single-owner-autofix-diagnostic.txt
      - name: Apply bounded policy patch
        id: autofix
        shell: bash
        run: |
          set +e
          node http-generic-api/scripts/apply-single-owner-policy-autofix.mjs > /tmp/single-owner-autofix.log 2>&1
          status=$?
          cat /tmp/single-owner-autofix.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/single-owner-autofix.log single-owner-autofix-diagnostic.txt
            exit "$status"
          fi
      - name: Persist bounded diagnostic on failure
        if: failure() && steps.autofix.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- http-generic-api/scripts/apply-single-owner-policy-autofix.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add single-owner-autofix-diagnostic.txt
          git commit -m "chore(github): record single-owner autofix diagnostic"
          git push origin HEAD:fix/github-main-single-owner-policy-20260807
      - name: Validate focused syntax and tests
        if: success()
        run: |
          node --check http-generic-api/githubRepositoryPolicyController.js
          node --check http-generic-api/scripts/single-owner-review-gate.mjs
          node http-generic-api/test-single-owner-review-gate.mjs
          node http-generic-api/test-github-repository-policy-controller.mjs
          git diff --check
      - name: Commit final bounded patch and remove bootstrap files
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(github): support governed single-owner review mode"
          git push origin HEAD:fix/github-main-single-owner-policy-20260807
