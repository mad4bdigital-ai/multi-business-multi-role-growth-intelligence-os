name: Single Owner Policy Autofix

on:
  push:
    branches:
      - fix/github-main-single-owner-policy-20260807
    paths:
      - .github/workflows/single-owner-policy-autofix.yml
      - http-generic-api/scripts/apply-single-owner-policy-autofix.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/github-main-single-owner-policy-20260807
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Repair bootstrap text decoder and legacy test anchor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('http-generic-api/scripts/apply-single-owner-policy-autofix.mjs')
          text = path.read_text()
          old_decode = 'const decode = (value) => Buffer.from(value, "base64").toString("utf8");'
          new_decode = 'const decode = (value) => Buffer.from(value, "base64").toString("utf8").replaceAll("\\\\n", "\\n");'
          if text.count(old_decode) != 1:
              raise SystemExit('bootstrap decode anchor must occur exactly once')
          text = text.replace(old_decode, new_decode)
          old_throw = '  if (first < 0) throw new Error(`autofix replacement failed: ${label}`);'
          new_throw = '  if (first < 0 && label === "single owner controller regression") return text;\n' + old_throw
          if text.count(old_throw) != 1:
              raise SystemExit('bootstrap replaceExact anchor must occur exactly once')
          path.write_text(text.replace(old_throw, new_throw))
          PY
          rm -f single-owner-autofix-diagnostic.txt
      - name: Apply bounded policy patch
        id: autofix
        shell: bash
        run: |
          set +e
          node http-generic-api/scripts/apply-single-owner-policy-autofix.mjs > /tmp/single-owner-autofix.log 2>&1
          status=$?
          cat /tmp/single-owner-autofix.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/single-owner-autofix.log single-owner-autofix-diagnostic.txt
            exit "$status"
          fi
      - name: Patch generated fixtures
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path('http-generic-api/test-github-repository-policy-controller.mjs')
          text = test_path.read_text()
          old = '''    assert.equal(first.desired_ruleset.bypass_actors.length, 0);
              assert.equal(first.desired_ruleset.rules.some((rule) => rule.type === "non_fast_forward"), true);
              assert.throws(
                () => buildGithubRepositoryPolicyPlan({ required_approving_review_count: 0 }, readback),
                (error) => error?.code === "github_repository_policy_unsafe_override_rejected"
              );'''.replace('              ', '    ')
          new = '''    assert.equal(first.desired_ruleset.bypass_actors.length, 0);
              assert.equal(first.desired_ruleset.rules.some((rule) => rule.type === "non_fast_forward"), true);
              assert.equal(first.review_policy_mode, "single_owner_attestation");
              const singleOwnerPullRequest = first.desired_ruleset.rules.find((rule) => rule.type === "pull_request").parameters;
              assert.equal(singleOwnerPullRequest.required_approving_review_count, 0);
              assert.equal(singleOwnerPullRequest.require_last_push_approval, false);
              assert.ok(GITHUB_REPOSITORY_POLICY_REQUIRED_CHECKS.includes("Single Owner Review Gate"));
              assert.throws(
                () => buildGithubRepositoryPolicyPlan({ single_owner_mode: false, required_approving_review_count: 0 }, readback),
                (error) => error?.code === "github_repository_policy_unsafe_override_rejected"
              );'''.replace('              ', '    ')
          if text.count(old) != 1:
              raise SystemExit(f'legacy test anchor count={text.count(old)}')
          test_path.write_text(text.replace(old, new))

          gate_path = Path('http-generic-api/scripts/single-owner-review-gate.mjs')
          gate = gate_path.read_text()
          bad = 'const independent = eligible.filter((item) => item.login !== author){'
          good = 'const independent = eligible.filter((item) => item.login !== author);'
          if gate.count(bad) != 1:
              raise SystemExit(f'generated gate syntax anchor count={gate.count(bad)}')
          gate_path.write_text(gate.replace(bad, good))
          PY
      - name: Persist bounded diagnostic on generator failure
        if: failure() && steps.autofix.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- http-generic-api/scripts/apply-single-owner-policy-autofix.mjs || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add single-owner-autofix-diagnostic.txt
          git commit -m "chore(github): record single-owner autofix diagnostic"
          git push origin HEAD:fix/github-main-single-owner-policy-20260807
      - name: Validate policy controller syntax
        if: success()
        run: node --check http-generic-api/githubRepositoryPolicyController.js
      - name: Validate single-owner gate syntax
        if: success()
        run: node --check http-generic-api/scripts/single-owner-review-gate.mjs
      - name: Run single-owner gate regression
        if: success()
        run: node http-generic-api/test-single-owner-review-gate.mjs
      - name: Run policy controller regression
        id: controller_regression
        if: success()
        shell: bash
        run: |
          set +e
          node http-generic-api/test-github-repository-policy-controller.mjs > /tmp/controller-regression.log 2>&1
          status=$?
          cat /tmp/controller-regression.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/controller-regression.log single-owner-autofix-diagnostic.txt
            exit "$status"
          fi
      - name: Persist controller regression diagnostic
        if: failure() && steps.controller_regression.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- http-generic-api/scripts/apply-single-owner-policy-autofix.mjs || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add single-owner-autofix-diagnostic.txt
          git commit -m "chore(github): record single-owner controller regression diagnostic"
          git push origin HEAD:fix/github-main-single-owner-policy-20260807
      - name: Validate diff hygiene
        if: success()
        run: git diff --check
      - name: Commit final bounded patch and remove bootstrap files
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(github): support governed single-owner review mode"
          git push origin HEAD:fix/github-main-single-owner-policy-20260807
