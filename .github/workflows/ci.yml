name: CI

on:
  workflow_dispatch:
  push:
  pull_request:
    branches: [main, Production]

concurrency:
  group: >-
    ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'RUN_LOCAL_CONNECTOR_PRODUCTION_CLOSURE_CI_V18_PR_3945_792FF63A') && 'ci-local-connector-closure-v18' || format('ci-{0}', github.ref) }}
  cancel-in-progress: >-
    ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, 'RUN_LOCAL_CONNECTOR_PRODUCTION_CLOSURE_CI_V18_PR_3945_792FF63A')) }}

jobs:
  syntax:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Guard schema/docs coverage for runtime changes
        run: node http-generic-api/scripts/schema-docs-change-guard.mjs

      - name: Guard governed migration seed placement
        run: node http-generic-api/scripts/migration-placement-guard.mjs

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Guard centralized fail-closed user JWT auth
        working-directory: http-generic-api
        run: node scripts/user-jwt-auth-governance.mjs

      - name: Guard merge and runtime interruption readiness
        working-directory: http-generic-api
        run: node scripts/interruption-readiness.mjs --ci --skip-dependencies --skip-worktree

      - name: Validate canonical source structure
        run: node validate-canonical-sources.mjs

      - name: Check canonical generated output
        run: node build-canonicals.mjs --check

      - name: Check canonical domain finder
        run: node --check find-canonical-domain.mjs

      - name: Block uncovered resource feature surfaces
        working-directory: http-generic-api
        run: node scripts/resource-api-coverage-audit.mjs --ci --changed

      - name: Validate resource API architecture and application service
        working-directory: http-generic-api
        run: |
          node test-resource-api-architecture.mjs
          node test-resource-api-service.mjs

      - name: Enforce Spec Kit completion governance
        run: node http-generic-api/scripts/spec-kit-completion-gate.mjs --ci --changed

      - name: Validate memory schema refs
        run: node validate-memory-schema.mjs

      - name: Check git diff hygiene
        run: git diff --check

      - name: Check all JS modules
        working-directory: http-generic-api
        run: |
          set -e
          shopt -s nullglob
          for f in *.js *.mjs routes/*.js scripts/*.mjs wordpress/*.js; do
            node --check "$f" || { echo "SYNTAX ERROR: $f"; exit 1; }
          done

  local-connector-production-closure:
    name: Governed Local Connector Production Closure
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, 'RUN_LOCAL_CONNECTOR_PRODUCTION_CLOSURE_CI_V18_PR_3945_792FF63A')
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: governed-local-connector-production-closure-pr-3945-ci-v18
      cancel-in-progress: false
    env:
      RUNTIME_BASE_URL: https://auth.mad4b.com
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      HOTFIX_MERGE_SHA: 792ff63af82791e9a482029f5078931fa0707c8c
      ADMIN_USER_ID: 00000000-0000-4000-a000-000000000002
      PLATFORM_TENANT_ID: 00000000-0000-4000-a000-000000000001
      DEVICE_ID: mohammedlap
      BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
      GH_READ_TOKEN: ${{ github.token }}
      EVIDENCE_PATH: ${{ runner.temp }}/governed-local-connector-production-closure.json
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Record governed closure start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPOSITORY}/issues/3945/comments" \
            -f body="GOVERNED_LOCAL_CONNECTOR_PRODUCTION_CLOSURE status=started run_id=${GITHUB_RUN_ID} trigger=ci-main-push-v18 trusted_ref=main workflow_noncancelling=true job_noncancelling=true"

      - name: Verify exact merged Production PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MERGED=$(gh api "/repos/${REPOSITORY}/pulls/3945" --jq '.merged')
          MERGE_SHA=$(gh api "/repos/${REPOSITORY}/pulls/3945" --jq '.merge_commit_sha')
          test "$MERGED" = "true"
          test "$MERGE_SHA" = "$HOTFIX_MERGE_SHA"

      - name: Execute bounded trusted closure
        id: closure
        run: node .github/scripts/governed-local-connector-production-closure.mjs

      - name: Upload bounded closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governed-local-connector-production-closure-${{ github.run_id }}
          path: ${{ env.EVIDENCE_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Record governed closure outcome on Production PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CLOSURE_RESULT: ${{ steps.closure.outputs.result }}
          PRODUCTION_SHA: ${{ steps.closure.outputs.production_sha }}
          COMMAND_ID: ${{ steps.closure.outputs.command_id }}
          ROUTE_COUNT: ${{ steps.closure.outputs.registered_route_count }}
          HEALTH_AGE: ${{ steps.closure.outputs.health_age_seconds }}
          FAILURE_MESSAGE: ${{ steps.closure.outputs.failure_message }}
        run: |
          set -euo pipefail
          RESULT="${CLOSURE_RESULT:-unknown}"
          BODY="GOVERNED_LOCAL_CONNECTOR_PRODUCTION_CLOSURE result=${RESULT} run_id=${GITHUB_RUN_ID} trigger=ci-main-push-v18 trusted_ref=main production_sha=${PRODUCTION_SHA:-unverified} command_id=${COMMAND_ID:-none} registered_route_count=${ROUTE_COUNT:-unknown} health_age_seconds=${HEALTH_AGE:-unknown} artifact=governed-local-connector-production-closure-${GITHUB_RUN_ID} workflow_noncancelling=true job_noncancelling=true migration_apply=false provider_mutation=false credential_rotation=false"
          if [[ "$RESULT" != "pass" && -n "${FAILURE_MESSAGE:-}" ]]; then
            BODY="${BODY} failure=${FAILURE_MESSAGE}"
          fi
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPOSITORY}/issues/3945/comments" \
            -f body="$BODY"

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Determine context-kernel hardcoding ratchet scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          CHANGED_FILES="$RUNNER_TEMP/context-kernel-changed-files.txt"
          DEFAULT_BRANCH="${DEFAULT_BRANCH:-main}"
          if [[ "$EVENT_NAME" == "pull_request" && -n "${PULL_REQUEST_BASE_SHA:-}" ]]; then
            BASE_SHA="$PULL_REQUEST_BASE_SHA"
            git diff --name-only "$BASE_SHA"...HEAD > "$CHANGED_FILES"
          elif [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "$DEFAULT_BRANCH" && -n "${PUSH_BEFORE_SHA:-}" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$PUSH_BEFORE_SHA"
            git diff --name-only "$BASE_SHA" HEAD > "$CHANGED_FILES"
          elif git rev-parse --verify "origin/$DEFAULT_BRANCH" >/dev/null 2>&1; then
            BASE_SHA="origin/$DEFAULT_BRANCH"
            git diff --name-only "$BASE_SHA"...HEAD > "$CHANGED_FILES"
          else
            BASE_SHA="$(git rev-parse HEAD^)"
            git diff --name-only "$BASE_SHA" HEAD > "$CHANGED_FILES"
          fi
          echo "Context-kernel hardcoding ratchet base: $BASE_SHA"
          echo "Changed files considered by the ratchet:"
          cat "$CHANGED_FILES"

      - name: Block context-kernel runtime hardcoding regressions
        working-directory: http-generic-api
        run: node scripts/context-kernel-hardcoding-scan.mjs --fail-on=runtime --changed-files-from="$RUNNER_TEMP/context-kernel-changed-files.txt"

      - name: Validate Connect auth, secret boundary, and atomic bootstrap
        working-directory: http-generic-api
        run: |
          node test-user-jwt-auth.mjs
          node test-connect-secret-boundary.mjs
          node test-tenant-connect-bootstrap-transaction.mjs
          node test-tenant-connection-self-repair-routes.mjs

      - name: Guard dependency and runtime interruption readiness
        working-directory: http-generic-api
        run: node scripts/interruption-readiness.mjs --ci --skip-merge --skip-worktree --report-file "$RUNNER_TEMP/interruption-readiness-baseline.json"

      - name: Run tests
        working-directory: http-generic-api
        env:
          TEST_SUITE_REPORT_DIR: ${{ runner.temp }}/test-suite-reports
        run: npm test

      - name: Upload ordered test progress reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-integration-test-progress-${{ github.run_id }}
          path: ${{ runner.temp }}/test-suite-reports/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Prove runtime startup and deployment evidence
        working-directory: http-generic-api
        env:
          FORCE_ROUTE_RUNTIME_TESTS: "true"
          DEPLOYMENT_BRANCH: "${{ github.head_ref || github.ref_name }}"
          DEPLOYMENT_COMMIT_SHA: "${{ github.sha }}"
        run: |
          node test-deployment-manifest-generator.mjs
          npm run manifest:deployment
          node test-server-startup-smoke.mjs

      - name: Run explicit governance contract checks
        working-directory: http-generic-api
        run: |
          node test-custom-gpt-schemas.mjs
          node test-tenant-activation-contract-inventory-parity.mjs
          node test-activation-lifecycle-contract-foundation.mjs
          node test-activation-lifecycle-state-machine.mjs
          node test-activation-lifecycle-operation-service.mjs
          node test-activation-reconnect-guidance-policy.mjs
          node test-activation-contract-finalization.mjs
          node test-activation-operation-projection-foundation.mjs
          node test-activation-operation-persistence-repository.mjs
          node test-activation-delivery-acknowledgement-repository.mjs
          node test-openapi-split-governance.mjs
          node test-openapi-split-regeneration-parity.mjs
          node test-local-connector-capability-installer-grants.mjs

      - name: Reject stale readiness evidence
        working-directory: http-generic-api
        run: node scripts/interruption-readiness.mjs --ci --skip-dependencies --skip-merge --skip-worktree --verify-evidence "$RUNNER_TEMP/interruption-readiness-baseline.json"

  execution-resolver-gate:
    name: Execution Resolver Gate
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Typecheck execution resolver sources
        run: npm run typecheck

      - name: Run execution resolver unit tests
        run: npm test -- --runInBand

      - name: Guard resolver runtime surface
        run: |
          set -e
          test -f src/services/execution/dispatchPlanStep.ts
          test -f src/services/connectors/execution/resolveConnectorExecutor.ts
          test -f src/store/registries/connectorExecutorRegistry.ts
          grep -R "resolveConnectorExecutor" src/services/execution src/services/connectors/execution tests/unit
          grep -R "approval_required" src/store/registries src/services/connectors/execution tests/unit

  architecture-drift:
    name: Architecture Drift Detection
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Run canonical architecture validation
        working-directory: http-generic-api
        run: npm run validate

      - name: Check for inline function redefinitions in server.js
        working-directory: http-generic-api
        run: |
          # Detect if any function name that exists in an extracted module is also defined inline in server.js.
          # This catches the class of drift where a module is added but server.js is not updated.
          MODULES="normalization mutationGovernance governedChangeControl jobRunner jobUtils executionRouting auth"
          FAIL=0
          for mod in $MODULES; do
            if [ ! -f "${mod}.js" ]; then continue; fi
            EXPORTS=$(grep "^export function\|^export async function" "${mod}.js" | sed 's/export \(async \)\?function //;s/(.*//')
            for fn in $EXPORTS; do
              if grep -qE "^(async )?function ${fn}\b" server.js; then
                echo "DRIFT: '${fn}' is exported from ${mod}.js but also defined inline in server.js"
                FAIL=1
              fi
            done
          done
          if [ "$FAIL" -eq 1 ]; then
            echo "Inline redefinition drift detected - run extraction cleanup"
            exit 1
          fi
          echo "No inline redefinition drift detected"

      - name: Check legacy execution snapshot isolation
        working-directory: http-generic-api
        run: |
          set +e
          # Permitted consumers of execution.js:
          #   execution.js itself, validate-architecture.mjs (reads the allowlist),
          #   test-*.mjs files (test suite consumers), and one-off tooling scripts.
          # Keep this aligned with EXECUTION_IMPORT_ALLOWLIST in validate-architecture.mjs.
          # test-*.mjs is a wildcard so new test files never break this check.
          MATCHES=$(grep -RInE "from [\"']\\./execution(\\.js)?[\"']|import\\([\"']\\./execution(\\.js)?[\"']\\)|require\\([\"']\\./execution(\\.js)?[\"']\\)" . \
            --include='*.js' --include='*.mjs' \
            --exclude='execution.js' \
            --exclude='validate-architecture.mjs' \
            --exclude='test-*.mjs' \
            --exclude='fix-*.mjs' \
            --exclude='extract-modules.js')
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "DRIFT: execution.js is marked snapshot_archived but is imported by runtime code:"
            echo "$MATCHES"
            exit 1
          fi
          if [ "$STATUS" -gt 1 ]; then
            echo "Failed to scan for execution.js imports"
            exit "$STATUS"
          fi
          echo "Legacy execution snapshot remains isolated"

      - name: Check server.js line count
        working-directory: http-generic-api
        run: |
          LINES=$(wc -l < server.js)
          echo "server.js: ${LINES} lines"
          if [ "$LINES" -gt 6000 ]; then
            echo "DRIFT: server.js exceeds 6000-line threshold (${LINES} lines) - decomposition may have regressed"
            exit 1
          fi
          echo "server.js size within threshold"

      - name: Check wordpress barrel export floor
        working-directory: http-generic-api
        run: |
          COUNT=$(node -e "import('./wordpress/index.js').then(m => { const n = Object.keys(m).length; console.log(n); if(n < 545) process.exit(1); })" 2>&1)
          echo "wordpress/index.js exports: $COUNT"
          if [ $? -ne 0 ]; then
            echo "DRIFT: wordpress/index.js exports dropped below 545 floor"
            exit 1
          fi
          echo "WordPress barrel export count within floor"
