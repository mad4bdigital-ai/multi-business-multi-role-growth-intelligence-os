name: CI

on:
  workflow_dispatch:
  push:
  pull_request:
    branches: [main, Production]

concurrency:
  group: ci-${{ github.ref }}-local-connector-v18
  cancel-in-progress: false

jobs:
  syntax:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Guard schema/docs coverage for runtime changes
        run: node http-generic-api/scripts/schema-docs-change-guard.mjs

      - name: Guard governed migration seed placement
        run: node http-generic-api/scripts/migration-placement-guard.mjs

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Guard centralized fail-closed user JWT auth
        working-directory: http-generic-api
        run: node scripts/user-jwt-auth-governance.mjs

      - name: Guard merge and runtime interruption readiness
        working-directory: http-generic-api
        run: node scripts/interruption-readiness.mjs --ci --skip-dependencies --skip-worktree

      - name: Validate canonical source structure
        run: node validate-canonical-sources.mjs

      - name: Check canonical generated output
        run: node build-canonicals.mjs --check

      - name: Check canonical domain finder
        run: node --check find-canonical-domain.mjs

      - name: Block uncovered resource feature surfaces
        working-directory: http-generic-api
        run: node scripts/resource-api-coverage-audit.mjs --ci --changed

      - name: Validate resource API architecture and application service
        working-directory: http-generic-api
        run: |
          node test-resource-api-architecture.mjs
          node test-resource-api-service.mjs

      - name: Enforce Spec Kit completion governance
        run: node http-generic-api/scripts/spec-kit-completion-gate.mjs --ci --changed

      - name: Validate memory schema refs
        run: node validate-memory-schema.mjs

      - name: Check git diff hygiene
        run: git diff --check

      - name: Check all JS modules
        working-directory: http-generic-api
        run: |
          set -e
          shopt -s nullglob
          for f in *.js *.mjs routes/*.js scripts/*.mjs wordpress/*.js; do
            node --check "$f" || { echo "SYNTAX ERROR: $f"; exit 1; }
          done

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Determine context-kernel hardcoding ratchet scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          CHANGED_FILES="$RUNNER_TEMP/context-kernel-changed-files.txt"
          DEFAULT_BRANCH="${DEFAULT_BRANCH:-main}"
          if [[ "$EVENT_NAME" == "pull_request" && -n "${PULL_REQUEST_BASE_SHA:-}" ]]; then
            BASE_SHA="$PULL_REQUEST_BASE_SHA"
            git diff --name-only "$BASE_SHA"...HEAD > "$CHANGED_FILES"
          elif [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "$DEFAULT_BRANCH" && -n "${PUSH_BEFORE_SHA:-}" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$PUSH_BEFORE_SHA"
            git diff --name-only "$BASE_SHA" HEAD > "$CHANGED_FILES"
          elif git rev-parse --verify "origin/$DEFAULT_BRANCH" >/dev/null 2>&1; then
            BASE_SHA="origin/$DEFAULT_BRANCH"
            git diff --name-only "$BASE_SHA"...HEAD > "$CHANGED_FILES"
          else
            BASE_SHA="$(git rev-parse HEAD^)"
            git diff --name-only "$BASE_SHA" HEAD > "$CHANGED_FILES"
          fi
          echo "Context-kernel hardcoding ratchet base: $BASE_SHA"
          echo "Changed files considered by the ratchet:"
          cat "$CHANGED_FILES"

      - name: Block context-kernel runtime hardcoding regressions
        working-directory: http-generic-api
        run: node scripts/context-kernel-hardcoding-scan.mjs --fail-on=runtime --changed-files-from="$RUNNER_TEMP/context-kernel-changed-files.txt"

      - name: Validate Connect auth, secret boundary, and atomic bootstrap
        working-directory: http-generic-api
        run: |
          node test-user-jwt-auth.mjs
          node test-connect-secret-boundary.mjs
          node test-tenant-connect-bootstrap-transaction.mjs
          node test-tenant-connection-self-repair-routes.mjs

      - name: Guard dependency and runtime interruption readiness
        working-directory: http-generic-api
        run: node scripts/interruption-readiness.mjs --ci --skip-merge --skip-worktree --report-file "$RUNNER_TEMP/interruption-readiness-baseline.json"

      - name: Run tests
        working-directory: http-generic-api
        env:
          TEST_SUITE_REPORT_DIR: ${{ runner.temp }}/test-suite-reports
        run: npm test

      - name: Upload ordered test progress reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-integration-test-progress-${{ github.run_id }}
          path: ${{ runner.temp }}/test-suite-reports/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Prove runtime startup and deployment evidence
        working-directory: http-generic-api
        env:
          FORCE_ROUTE_RUNTIME_TESTS: "true"
          DEPLOYMENT_BRANCH: "${{ github.head_ref || github.ref_name }}"
          DEPLOYMENT_COMMIT_SHA: "${{ github.sha }}"
        run: |
          node test-deployment-manifest-generator.mjs
          npm run manifest:deployment
          node test-server-startup-smoke.mjs

      - name: Run explicit governance contract checks
        working-directory: http-generic-api
        run: |
          node test-custom-gpt-schemas.mjs
          node test-tenant-activation-contract-inventory-parity.mjs
          node test-activation-lifecycle-contract-foundation.mjs
          node test-activation-lifecycle-state-machine.mjs
          node test-activation-lifecycle-operation-service.mjs
          node test-activation-reconnect-guidance-policy.mjs
          node test-activation-contract-finalization.mjs
          node test-activation-operation-projection-foundation.mjs
          node test-activation-operation-persistence-repository.mjs
          node test-activation-delivery-acknowledgement-repository.mjs
          node test-openapi-split-governance.mjs
          node test-openapi-split-regeneration-parity.mjs
          node test-local-connector-capability-installer-grants.mjs

      - name: Reject stale readiness evidence
        working-directory: http-generic-api
        run: node scripts/interruption-readiness.mjs --ci --skip-dependencies --skip-merge --skip-worktree --verify-evidence "$RUNNER_TEMP/interruption-readiness-baseline.json"

  execution-resolver-gate:
    name: Execution Resolver Gate
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Typecheck execution resolver sources
        run: npm run typecheck

      - name: Run execution resolver unit tests
        run: npm test -- --runInBand

      - name: Guard resolver runtime surface
        run: |
          set -e
          test -f src/services/execution/dispatchPlanStep.ts
          test -f src/services/connectors/execution/resolveConnectorExecutor.ts
          test -f src/store/registries/connectorExecutorRegistry.ts
          grep -R "resolveConnectorExecutor" src/services/execution src/services/connectors/execution tests/unit
          grep -R "approval_required" src/store/registries src/services/connectors/execution tests/unit

  architecture-drift:
    name: Architecture Drift Detection
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Run canonical architecture validation
        working-directory: http-generic-api
        run: npm run validate

      - name: Check for inline function redefinitions in server.js
        working-directory: http-generic-api
        run: |
          MODULES="normalization mutationGovernance governedChangeControl jobRunner jobUtils executionRouting auth"
          FAIL=0
          for mod in $MODULES; do
            if [ ! -f "${mod}.js" ]; then continue; fi
            EXPORTS=$(grep "^export function\|^export async function" "${mod}.js" | sed 's/export \(async \)\?function //;s/(.*//')
            for fn in $EXPORTS; do
              if grep -qE "^(async )?function ${fn}\b" server.js; then
                echo "DRIFT: '${fn}' is exported from ${mod}.js but also defined inline in server.js"
                FAIL=1
              fi
            done
          done
          if [ "$FAIL" -eq 1 ]; then
            echo "Inline redefinition drift detected - run extraction cleanup"
            exit 1
          fi
          echo "No inline redefinition drift detected"

      - name: Check legacy execution snapshot isolation
        working-directory: http-generic-api
        run: |
          set +e
          MATCHES=$(grep -RInE "from [\"']\\./execution(\\.js)?[\"']|import\\([\"']\\./execution(\\.js)?[\"']\\)|require\\([\"']\\./execution(\\.js)?[\"']\\)" . \
            --include='*.js' --include='*.mjs' \
            --exclude='execution.js' \
            --exclude='validate-architecture.mjs' \
            --exclude='test-*.mjs' \
            --exclude='fix-*.mjs' \
            --exclude='extract-modules.js')
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "DRIFT: execution.js is marked snapshot_archived but is imported by runtime code:"
            echo "$MATCHES"
            exit 1
          fi
          if [ "$STATUS" -gt 1 ]; then
            echo "Failed to scan for execution.js imports"
            exit "$STATUS"
          fi
          echo "Legacy execution snapshot remains isolated"

      - name: Check server.js line count
        working-directory: http-generic-api
        run: |
          LINES=$(wc -l < server.js)
          echo "server.js: ${LINES} lines"
          if [ "$LINES" -gt 6000 ]; then
            echo "DRIFT: server.js exceeds 6000-line threshold (${LINES} lines) - decomposition may have regressed"
            exit 1
          fi
          echo "server.js size within threshold"

      - name: Check wordpress barrel export floor
        working-directory: http-generic-api
        run: |
          COUNT=$(node -e "import('./wordpress/index.js').then(m => { const n = Object.keys(m).length; console.log(n); if(n < 545) process.exit(1); })" 2>&1)
          echo "wordpress/index.js exports: $COUNT"
          if [ $? -ne 0 ]; then
            echo "DRIFT: wordpress/index.js exports dropped below 545 floor"
            exit 1
          fi
          echo "WordPress barrel export count within floor"

  surface-latest-main-materialization:
    name: Surface Latest Main Materialization
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/pr5210-latest-main-ci-materialization-20260803'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_BRANCH: gpt/pr5210-latest-main-ci-materialization-20260803
      PINNED_MAIN_HEAD: 1793518f11f77ec266e831b537320bf3231cfdec
      SOURCE_BRANCH: gpt/surface-callability-main-reconstruction-20260803
      SOURCE_COMMIT: 36cc5245116fdbfb26208e8e0e40bc3b75f92ef3
      WORKFLOW_PATH: .github/workflows/ci.yml
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact governed trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PINNED_MAIN_HEAD"
          test "$(git diff --name-only HEAD^ HEAD)" = "$WORKFLOW_PATH"

      - name: Fetch certified Surface source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SOURCE_BRANCH"
          git cat-file -e "$SOURCE_COMMIT^{commit}"

      - name: Transplant bounded Surface source files
        shell: bash
        run: |
          set -euo pipefail
          git checkout "$SOURCE_COMMIT" -- \
            .changes/e2e/surface-callability-main-reconstruction.json \
            http-generic-api/agentSurfaceRuntimeService.js \
            http-generic-api/routes/agentSurfaceRoutes.js \
            http-generic-api/routes/tenantInfrastructureRoutes.js \
            http-generic-api/routes/tenantLifecycleRoutes.js \
            http-generic-api/routes/workspaceResourceRoutes.js \
            http-generic-api/scripts/resource-api-callability-contracts.mjs \
            http-generic-api/scripts/surface-callability-closure/generate_closure_contracts.mjs \
            http-generic-api/scripts/surface-contract-sql-registry-extractor.mjs \
            http-generic-api/test-resource-api-callability-effect-classes.mjs \
            http-generic-api/test-surface-contract-sql-registry-extractor.mjs

      - name: Apply startup cardinality and E2E repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path_value, old, new, label):
              path = Path(path_value)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}_marker_count:{count}')
              path.write_text(text.replace(old, new, 1))

          replace_once(
              'http-generic-api/agentSurfaceRuntimeService.js',
              '    if (!Array.isArray(rows) || rows.length !== 1) throw error(409, "tenant_agent_surface_deployment_readback_invalid", "Agent surface deployment readback must resolve exactly one row."); // MUTATION_READBACK: tenant_agent_surface_deployment_upsert\n',
              '    if (!Array.isArray(rows)) throw error(409, "tenant_agent_surface_deployment_readback_invalid", "Agent surface deployment readback must resolve exactly one row.");\n    if (rows.length !== 1) throw error(409, "tenant_agent_surface_deployment_readback_invalid", "Agent surface deployment readback must resolve exactly one row."); // MUTATION_READBACK: tenant_agent_surface_deployment_upsert\n',
              'agent_surface_readback_cardinality',
          )

          replace_once(
              'http-generic-api/routes/tenantInfrastructureRoutes.js',
              '  const pool = deps.pool || getPool();\n  const executionFacade = deps.executionFacade || null;\n',
              '''  let resolvedPool = deps.pool || null;
  const pool = new Proxy({}, {
    get(_target, property) {
      if (!resolvedPool) resolvedPool = getPool();
      const value = Reflect.get(resolvedPool, property, resolvedPool);
      return typeof value === "function" ? value.bind(resolvedPool) : value;
    },
  });
  const executionFacade = deps.executionFacade || null;
''',
              'tenant_infrastructure_lazy_pool',
          )

          contract_path = Path('.changes/e2e/surface-callability-main-reconstruction.json')
          contract = json.loads(contract_path.read_text())
          journey = contract['phases'][0]['e2e_journeys'][0]
          startup_test = {
              'id': 'surface-server-startup-without-database-environment',
              'runner': 'node',
              'working_directory': 'http-generic-api',
              'path': 'test-server-startup-smoke.mjs',
              'args': [],
          }
          if not any(item.get('id') == startup_test['id'] for item in journey['tests']):
              journey['tests'].append(startup_test)
          assertion = 'Building and starting the HTTP API without database environment variables still exposes the deployment identity endpoints; tenant infrastructure database access is resolved lazily only when an authenticated infrastructure route is invoked.'
          if assertion not in journey['assertions']:
              journey['assertions'].append(assertion)
          contract_path.write_text(json.dumps(contract, indent=2) + '\n')
          PY

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Generate frontend and Surface evidence
        working-directory: http-generic-api
        run: |
          set -euo pipefail
          npm run frontend:dispatch:generate
          node scripts/surface-contract-discovery.mjs
          node scripts/surface-callability-closure/generate_closure_contracts.mjs
          node scripts/surface-contract-discovery.mjs

      - name: Restore canonical CI workflow and commit product tree
        shell: bash
        run: |
          set -euo pipefail
          git show "$PINNED_MAIN_HEAD:$WORKFLOW_PATH" > "$WORKFLOW_PATH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: materialize scoped Surface closure on latest main'

      - name: Enforce bounded product write set
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$PINNED_MAIN_HEAD" HEAD > "$RUNNER_TEMP/surface-product-files.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path
          changed = {line.strip() for line in Path(os.environ['RUNNER_TEMP'], 'surface-product-files.txt').read_text().splitlines() if line.strip()}
          allowed = {
              '.changes/e2e/surface-callability-main-reconstruction.json',
              'docs/surface-contract-discovery-status.json',
              'docs/surface-contract-discovery-status.md',
              'docs/surface-contract-gap-queue.json',
              'docs/surface-contract-gap-queue.md',
              'docs/surface-contract-safety-attestations.json',
              'http-generic-api/agentSurfaceRuntimeService.js',
              'http-generic-api/frontend-operation-governance.generated.json',
              'http-generic-api/frontend-surface-dispatch.generated.json',
              'http-generic-api/openapi/frontend-runtime-routes.generated.yaml',
              'http-generic-api/resource-api-surface-callability.manifest.json',
              'http-generic-api/routes/agentSurfaceRoutes.js',
              'http-generic-api/routes/tenantInfrastructureRoutes.js',
              'http-generic-api/routes/tenantLifecycleRoutes.js',
              'http-generic-api/routes/workspaceResourceRoutes.js',
              'http-generic-api/scripts/resource-api-callability-contracts.mjs',
              'http-generic-api/scripts/surface-callability-closure/generate_closure_contracts.mjs',
              'http-generic-api/scripts/surface-contract-sql-registry-extractor.mjs',
              'http-generic-api/scripts/test-manifest.mjs',
              'http-generic-api/surface-contract-classification-evidence.json',
              'http-generic-api/test-resource-api-callability-effect-classes.mjs',
              'http-generic-api/test-surface-callability-full-closure.mjs',
              'http-generic-api/test-surface-contract-sql-registry-extractor.mjs',
          }
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit('surface_product_write_set_violation:' + ','.join(sorted(unexpected)))
          required = {
              '.changes/e2e/surface-callability-main-reconstruction.json',
              'http-generic-api/agentSurfaceRuntimeService.js',
              'http-generic-api/routes/tenantInfrastructureRoutes.js',
              'http-generic-api/resource-api-surface-callability.manifest.json',
              'http-generic-api/test-surface-callability-full-closure.mjs',
          }
          missing = required - changed
          if missing:
              raise SystemExit('surface_product_required_file_missing:' + ','.join(sorted(missing)))
          if '.github/workflows/ci.yml' in changed:
              raise SystemExit('temporary_ci_workflow_not_restored')
          print({'changed_files': len(changed), 'unexpected': 0})
          PY

      - name: Validate focused Surface closure
        working-directory: http-generic-api
        run: |
          set -euo pipefail
          node --check agentSurfaceRuntimeService.js
          node --check routes/agentSurfaceRoutes.js
          node --check routes/tenantInfrastructureRoutes.js
          node --check routes/tenantLifecycleRoutes.js
          node --check routes/workspaceResourceRoutes.js
          node test-surface-contract-sql-registry-extractor.mjs
          node test-resource-api-callability-effect-classes.mjs
          node test-multi-surface-agent-runtime.mjs
          node test-resource-api-coverage.mjs
          node test-surface-callability-full-closure.mjs
          node test-test-manifest-runner.mjs

      - name: Prove startup and hardcoding ratchet
        shell: bash
        run: |
          set -euo pipefail
          cd http-generic-api
          DB_HOST='' DB_NAME='' DB_USER='' DB_PASSWORD='' node test-server-startup-smoke.mjs
          git diff --name-only "$PINNED_MAIN_HEAD"...HEAD > "$RUNNER_TEMP/context-kernel-changed-files.txt"
          node test-context-kernel-hardcoding-scan.mjs
          node scripts/context-kernel-hardcoding-scan.mjs \
            --changed-files-from="$RUNNER_TEMP/context-kernel-changed-files.txt" \
            --fail-on=runtime \
            --output="$RUNNER_TEMP/context-kernel-hardcoding-surface.json"

      - name: Prove deterministic frontend output
        working-directory: http-generic-api
        run: |
          set -euo pipefail
          npm run frontend:dispatch:generate
          git diff --exit-code -- frontend-operation-governance.generated.json frontend-surface-dispatch.generated.json openapi/frontend-runtime-routes.generated.yaml

      - name: Push certified product commit
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$remote_sha" = "${{ github.event.pull_request.head.sha }}"
          git push origin "HEAD:${TARGET_BRANCH}"
