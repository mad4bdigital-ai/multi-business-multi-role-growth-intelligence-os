name: CI

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pr-3162-stage-dispatch-head:
    if: github.event_name == 'push' && github.ref_name == 'gpt/pr-3162-final-current-main-20260730'
    name: PR 3162 Stage Dispatch Head
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gpt/pr-3162-final-current-main-20260730
          fetch-depth: 0

      - name: Create a workflow-silent dispatch head
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .github/pr3162-finalize-dispatch-marker ]]; then
            echo "Dispatch marker already exists."
            exit 0
          fi
          printf '%s\n' 'PR 3162 finalizer dispatch head' > .github/pr3162-finalize-dispatch-marker
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/pr3162-finalize-dispatch-marker
          git commit -m "chore(ci): prepare PR 3162 finalizer dispatch"
          git push origin HEAD:gpt/pr-3162-final-current-main-20260730

  pr-3162-finalize:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'gpt/pr-3162-final-current-main-20260730'
    name: PR 3162 Finalize Current Main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gpt/pr-3162-final-current-main-20260730
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Reconcile latest main without overwriting newer parser work
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main gpt/pr-3162-rebuild-main-20260730-v2

          if ! git diff --quiet 75be7437d72127b41ebf18a082bcc6a8fd85c58e..origin/main -- \
            http-generic-api/scripts/frontend-surface-dispatch.mjs \
            http-generic-api/test-frontend-surface-dispatch.mjs; then
            echo "::error::latest main changed the parser or its regression suite after the verified overlap check"
            exit 1
          fi

          set +e
          git merge --no-commit --no-ff origin/main
          MERGE_STATUS=$?
          set -e
          if [[ "$MERGE_STATUS" -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            for path in "${conflicts[@]}"; do
              case "$path" in
                .github/workflows/ci.yml)
                  git checkout --theirs -- "$path"
                  git add "$path"
                  ;;
                *)
                  echo "::error::unexpected main reconciliation conflict: ${path}"
                  exit 1
                  ;;
              esac
            done
            if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
              echo "::error::unresolved main reconciliation conflicts remain"
              exit 1
            fi
          fi

          git checkout origin/main -- .github/workflows/ci.yml
          git add .github/workflows/ci.yml
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: reconcile latest main before PR 3162 finalization"
          fi

      - name: Apply validated product changes
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/gpt/pr-3162-rebuild-main-20260730-v2 -- \
            http-generic-api/scripts/frontend-surface-dispatch.mjs \
            http-generic-api/test-frontend-surface-dispatch.mjs \
            http-generic-api/openapi/local-connector-uninstall.yaml

          python3 - <<'PY'
          from pathlib import Path
          path = Path("http-generic-api/openapi.yaml")
          text = path.read_text()
          start_marker = "  /tenants/{tenant_id}/brands/{brand_key}/growth-intelligence/pilot:"
          end_marker = "  /tenants/{tenant_id}/relationships:"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit("Growth Intelligence OpenAPI start marker not found")
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit("Growth Intelligence OpenAPI end marker not found")
          section = text[start:end]
          old = "      security: [{ backendBearerAuth: [] }, { backendApiKeyAuth: [] }]"
          new = "      security: [{ adminBearerAuth: [] }, { backendApiKeyAuth: [] }]"
          count = section.count(old)
          if count != 7:
              raise SystemExit(f"Growth Intelligence auth contracts: expected 7 matches, found {count}")
          path.write_text(text[:start] + section.replace(old, new) + text[end:])
          PY

      - name: Generate and prove final parity
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          node test-frontend-surface-dispatch.mjs
          npm run frontend:dispatch:generate -- --baseline-ref=main
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-openapi-route-coverage.mjs
          npm run openapi:auth:check
          node - <<'NODE'
          const fs = require('node:fs');
          const plan = JSON.parse(fs.readFileSync('frontend-surface-dispatch.generated.json', 'utf8'));
          const counts = plan.coverage?.auth_parity_counts || {};
          const result = {
            mismatch: counts.mismatch || 0,
            unknown: counts.unknown || 0,
            missing_openapi: counts.missing_openapi || 0,
            auth_contract_gap_count: plan.coverage?.auth_contract_gap_count || 0,
            openapi_gap_count: plan.coverage?.openapi_gap_count || 0,
          };
          console.log(JSON.stringify(result, null, 2));
          if (Object.values(result).some((value) => value !== 0)) process.exit(1);
          NODE

      - name: Commit clean final product tree
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f \
            .github/pr3162-finalize-dispatch-marker \
            .github/workflows/pr-3162-final-rebuild.yml
          git diff --check

          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //')
          for path in "${changed[@]}"; do
            case "$path" in
              .github/pr3162-finalize-dispatch-marker|\
              .github/workflows/ci.yml|\
              .github/workflows/pr-3162-final-rebuild.yml|\
              http-generic-api/frontend-operation-governance.generated.json|\
              http-generic-api/frontend-surface-dispatch.generated.json|\
              http-generic-api/openapi.yaml|\
              http-generic-api/openapi/frontend-runtime-routes.generated.yaml|\
              http-generic-api/openapi/local-connector-uninstall.yaml|\
              http-generic-api/scripts/frontend-surface-dispatch.mjs|\
              http-generic-api/test-frontend-surface-dispatch.mjs)
                ;;
              *)
                echo "::error::unexpected finalization path: ${path}"
                exit 1
                ;;
            esac
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            .github/pr3162-finalize-dispatch-marker \
            .github/workflows/ci.yml \
            .github/workflows/pr-3162-final-rebuild.yml \
            http-generic-api/frontend-operation-governance.generated.json \
            http-generic-api/frontend-surface-dispatch.generated.json \
            http-generic-api/openapi.yaml \
            http-generic-api/openapi/frontend-runtime-routes.generated.yaml \
            http-generic-api/openapi/local-connector-uninstall.yaml \
            http-generic-api/scripts/frontend-surface-dispatch.mjs \
            http-generic-api/test-frontend-surface-dispatch.mjs
          git commit -m "fix: finalize PR 3162 auth parity on latest main"
          git push origin HEAD:gpt/pr-3162-final-current-main-20260730
