name: Materialize Certified Release YAML Fix

on:
  push:
    branches:
      - fix/certified-release-upload-path-context-20260806
    paths:
      - .github/ops/certified-release-yaml-fix.trigger

permissions:
  contents: write

concurrency:
  group: materialize-certified-release-yaml-fix
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact materializer head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Pin current main
        id: pin
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          BRANCH_HEAD="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" --jq .object.sha)"
          MAIN_HEAD="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          test "$BRANCH_HEAD" = "$GITHUB_SHA"
          [[ "$MAIN_HEAD" =~ ^[0-9a-f]{40}$ ]]
          echo "main_sha=$MAIN_HEAD" >> "$GITHUB_OUTPUT"
          echo "PINNED_MAIN_SHA=$MAIN_HEAD" >> "$GITHUB_ENV"

      - name: Checkout pinned main tree
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pin.outputs.main_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Patch colon-bearing conditions and regression
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PINNED_MAIN_SHA"
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/production-certified-release-cut-validation.yml')
          workflow = workflow_path.read_text()
          condition_replacements = {
              "    if: startsWith(github.event.pull_request.title, 'test(release): certify immutable Production candidate ')": "    if: \"startsWith(github.event.pull_request.title, 'test(release): certify immutable Production candidate ')\"",
              "    if: always() && startsWith(github.event.pull_request.title, 'test(release): certify immutable Production candidate ')": "    if: \"always() && startsWith(github.event.pull_request.title, 'test(release): certify immutable Production candidate ')\"",
          }
          for old, new in condition_replacements.items():
              count = workflow.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              workflow = workflow.replace(old, new)
          workflow_path.write_text(workflow)

          test_path = Path('http-generic-api/test-production-certified-release-cut-validation-registration.mjs')
          test = test_path.read_text()
          old = '''assert.ok(workflow.includes("if: startsWith(github.event.pull_request.title, 'test(release): certify immutable Production candidate ')\"));'''
          new = '''assert.ok(workflow.includes(`if: "startsWith(github.event.pull_request.title, 'test(release): certify immutable Production candidate ')"`));
assert.ok(finalize.includes(`if: "always() && startsWith(github.event.pull_request.title, 'test(release): certify immutable Production candidate ')"`));
assert.doesNotMatch(workflow, /^\\s+if:\\s+(?:always\\(\\)\\s+&&\\s+)?startsWith\\(github\\.event\\.pull_request\\.title,\\s+'test\\(release\\):/m);'''
          if test.count(old) != 1:
              raise SystemExit('expected unquoted condition assertion exactly once')
          test_path.write_text(test.replace(old, new))
          PY

          git diff --check
          test "$(git diff --name-only "$PINNED_MAIN_SHA" -- | wc -l)" -eq 2
          git diff --name-only "$PINNED_MAIN_SHA" -- | grep -Fx '.github/workflows/production-certified-release-cut-validation.yml'
          git diff --name-only "$PINNED_MAIN_SHA" -- | grep -Fx 'http-generic-api/test-production-certified-release-cut-validation-registration.mjs'
          node http-generic-api/test-production-certified-release-cut-validation-registration.mjs
          node --check http-generic-api/test-production-certified-release-cut-validation-registration.mjs

      - name: Run actionlint without unrelated shell style checks
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color -shellcheck= .github/workflows/production-certified-release-cut-validation.yml

      - name: Materialize bounded blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          MAIN_READBACK="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          test "$MAIN_READBACK" = "$PINNED_MAIN_SHA"
          WORKFLOW_BLOB="$(jq -Rs '{content: ., encoding: "utf-8"}' < .github/workflows/production-certified-release-cut-validation.yml | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          TEST_BLOB="$(jq -Rs '{content: ., encoding: "utf-8"}' < http-generic-api/test-production-certified-release-cut-validation-registration.mjs | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          [[ "$WORKFLOW_BLOB" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TEST_BLOB" =~ ^[0-9a-f]{40}$ ]]
          printf 'PINNED_MAIN_SHA=%s\nWORKFLOW_BLOB=%s\nTEST_BLOB=%s\n' "$PINNED_MAIN_SHA" "$WORKFLOW_BLOB" "$TEST_BLOB"
