name: Migration 1050 Envelope Shell-Safe One-Shot

on:
  push:
    branches:
      - fix/migration-1050-envelope-shell-safe-20260810

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact writer branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact source-only setup
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_MAIN='799a58366cdd0dd8eb06052e4fe2e3e16e7d4c5d'
          EXPECTED_BRANCH='fix/migration-1050-envelope-shell-safe-20260810'
          WRITER='.github/workflows/migration-1050-envelope-shell-safe-once.yml'
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          git fetch --no-tags origin main "${EXPECTED_BRANCH}"
          test "$(git rev-parse origin/main)" = "${EXPECTED_MAIN}"
          git merge-base --is-ancestor "${EXPECTED_MAIN}" HEAD
          mapfile -t changed < <(git diff --name-only "${EXPECTED_MAIN}"...HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "${WRITER}"

      - name: Patch caller and regression only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runner_path = Path('.github/ops/github-repository-policy-1050-governed-rollout.mjs')
          test_path = Path('http-generic-api/test-github-repository-policy-1050-governed-rollout.mjs')

          old_note = 'Approve checksum-bound Migration 1050 authorization only; no SQL, Migration 1049 retry, or GitHub provider mutation executes in readiness.'
          new_note = 'Approve checksum-bound Migration 1050 authorization only, with no SQL, Migration 1049 retry, or GitHub provider mutation executing in readiness.'

          runner = runner_path.read_text()
          count = runner.count(old_note)
          if count != 1:
              raise SystemExit(f'expected exactly one readiness envelope note to replace, found {count}')
          runner = runner.replace(old_note, new_note, 1)
          if old_note in runner:
              raise SystemExit('unsafe readiness envelope note remains after replacement')
          runner_path.write_text(runner)

          test = test_path.read_text()
          anchor = "assert.match(runner, /capability_resolution_envelope_apply_authorize/);\n"
          if test.count(anchor) != 1:
              raise SystemExit(f'regression insertion anchor count must be 1, found {test.count(anchor)}')
          regression = """const migration1050ReadinessEnvelopeDecisionNote = 'Approve checksum-bound Migration 1050 authorization only, with no SQL, Migration 1049 retry, or GitHub provider mutation executing in readiness.';
          assert.ok(runner.includes(migration1050ReadinessEnvelopeDecisionNote), 'Migration 1050 readiness envelope must use the canonical shell-safe decision note');
          for (const forbidden of [';', '&', '|', '`', '$', '<', '>']) {
            assert.equal(migration1050ReadinessEnvelopeDecisionNote.includes(forbidden), false, `Migration 1050 readiness envelope decision note contains forbidden shell metacharacter: ${forbidden}`);
          }
          assert.doesNotMatch(runner, /Approve checksum-bound Migration 1050 authorization only; no SQL/);
          """
          test = test.replace(anchor, anchor + regression, 1)
          test_path.write_text(test)
          PY

      - name: Run focused source-only verification
        shell: bash
        run: |
          set -euo pipefail
          node --check .github/ops/github-repository-policy-1050-governed-rollout.mjs
          node http-generic-api/test-github-repository-policy-1050-governed-rollout.mjs

      - name: Commit bounded repair and self-retire
        shell: bash
        run: |
          set -euo pipefail
          WRITER='.github/workflows/migration-1050-envelope-shell-safe-once.yml'
          git rm "${WRITER}"
          git add .github/ops/github-repository-policy-1050-governed-rollout.mjs \
                  http-generic-api/test-github-repository-policy-1050-governed-rollout.mjs
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -eq 3
          printf '%s\n' "${staged[@]}" | sort > /tmp/staged.txt
          printf '%s\n' \
            '.github/ops/github-repository-policy-1050-governed-rollout.mjs' \
            '.github/workflows/migration-1050-envelope-shell-safe-once.yml' \
            'http-generic-api/test-github-repository-policy-1050-governed-rollout.mjs' | sort > /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/staged.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(migration-1050): keep readiness envelope note shell-safe'
          git push origin HEAD:fix/migration-1050-envelope-shell-safe-20260810
