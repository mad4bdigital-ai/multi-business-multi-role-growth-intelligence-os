name: Surface Callability Current Main Final Validation

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/surface-callability-current-main-final-validation.yml

permissions:
  contents: write

concurrency:
  group: surface-callability-final-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: >-
      github.repository == 'mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/pr5210-surface-source-clean-20260803' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      TARGET_BRANCH: gpt/pr5210-surface-source-clean-20260803
      BASE_SHA: cf4282d5fd74b7c20cbac3ad2aa74742d135d2a5
      WORKFLOW_PATH: .github/workflows/surface-callability-current-main-final-validation.yml
      REQUEST_MARKER: .changes/ci/pr5292-governed-generated-refresh-request-20260803.txt

    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact synchronized trigger
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "${BASE_SHA}"
          git merge-base --is-ancestor "${BASE_SHA}" HEAD
          test "$(git rev-parse --abbrev-ref HEAD)" = "${TARGET_BRANCH}"
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "${WORKFLOW_PATH}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Align exact E2E scope
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('.changes/e2e/surface-callability-main-reconstruction.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          include = payload['scope']['include']
          required = '.github/repository-maintenance-tool-governance.json'
          if required not in include:
              include.insert(1, required)
          if len(include) != len(set(include)):
              raise SystemExit('surface_e2e_scope_duplicate')
          path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Generate current-main closure evidence
        working-directory: http-generic-api
        run: |
          node scripts/surface-contract-discovery.mjs --write
          node scripts/surface-callability-closure/generate_closure_contracts.mjs
          node scripts/surface-contract-discovery.mjs --write
          npm run frontend:dispatch:generate -- --baseline-ref="${BASE_SHA}"

      - name: Syntax contracts
        working-directory: http-generic-api
        run: |
          node --check agentSurfaceRuntimeService.js
          node --check routes/agentSurfaceRoutes.js
          node --check routes/tenantInfrastructureRoutes.js
          node --check routes/tenantLifecycleRoutes.js
          node --check routes/workspaceResourceRoutes.js
          node --check scripts/maintenance-tools/verify-hostinger-full-closure-safety.mjs
          node --check scripts/resource-api-callability-contracts.mjs
          node --check scripts/surface-callability-closure/generate_closure_contracts.mjs
          node --check scripts/surface-contract-sql-registry-extractor.mjs

      - name: Focused Surface validation
        working-directory: http-generic-api
        run: |
          node test-workspace-invitation-controls.mjs
          node test-surface-contract-sql-registry-extractor.mjs
          node test-resource-api-callability-effect-classes.mjs
          node test-multi-surface-agent-runtime.mjs
          node test-resource-api-coverage.mjs
          node test-surface-callability-full-closure.mjs
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-openapi-route-coverage.mjs
          node scripts/maintenance-tools/verify-hostinger-full-closure-safety.mjs
          npm run openapi:auth:check
          node test-server-startup-smoke.mjs

      - name: Prove scoped queue closure
        working-directory: http-generic-api
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const queue = JSON.parse(fs.readFileSync('../docs/surface-contract-gap-queue.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('resource-api-surface-callability.manifest.json', 'utf8'));
          const scoped = new Set(manifest.source_queue_tool_keys || []);
          const remaining = (queue.top_items || []).filter((item) => (item.remediation || []).some((action) =>
            action.action_key === 'verify_tool_registry_binding' &&
            (action.targets || []).some((key) => scoped.has(key))
          ));
          if (remaining.length) throw new Error(`surface_scoped_queue_not_zero:${remaining.length}`);
          if (manifest.source_queue_item_count !== 20) throw new Error('surface_source_queue_item_count_mismatch');
          if ((manifest.source_queue_tool_keys || []).length !== 41) throw new Error('surface_tool_count_mismatch');
          console.log(JSON.stringify({ok:true,remaining_scoped_items:0,source_items:20,tool_keys:41,secrets_included:false}));
          NODE

      - name: Remove temporary controls and bound outputs
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f "${WORKFLOW_PATH}" "${REQUEST_MARKER}"
          cat > /tmp/allowed.txt <<'EOF'
          .changes/ci/pr5292-governed-generated-refresh-request-20260803.txt
          .changes/e2e/surface-callability-main-reconstruction.json
          .github/workflows/surface-callability-current-main-final-validation.yml
          docs/surface-contract-discovery-status.json
          docs/surface-contract-discovery-status.md
          docs/surface-contract-gap-queue.json
          docs/surface-contract-gap-queue.md
          docs/surface-contract-safety-attestations.json
          http-generic-api/frontend-operation-governance.generated.json
          http-generic-api/frontend-surface-dispatch.generated.json
          http-generic-api/openapi/frontend-runtime-routes.generated.yaml
          http-generic-api/resource-api-surface-callability.manifest.json
          http-generic-api/routes/tenantLifecycleRoutes.js
          http-generic-api/scripts/surface-callability-closure/generate_closure_contracts.mjs
          http-generic-api/scripts/test-manifest.mjs
          http-generic-api/surface-contract-classification-evidence.json
          http-generic-api/test-frontend-auth-openapi-parity.mjs
          http-generic-api/test-frontend-surface-dispatch.mjs
          http-generic-api/test-surface-callability-full-closure.mjs
          EOF
          sort -u /tmp/allowed.txt -o /tmp/allowed.txt
          git status --porcelain --untracked-files=all | sed -E 's/^...//' | sed -E 's/.* -> //' | sort -u > /tmp/changed.txt
          unexpected="$(comm -23 /tmp/changed.txt /tmp/allowed.txt || true)"
          test -z "$unexpected" || { printf 'unexpected generated outputs:\n%s\n' "$unexpected"; exit 1; }
          grep -Fxq "${WORKFLOW_PATH}" /tmp/changed.txt
          grep -Fxq "${REQUEST_MARKER}" /tmp/changed.txt
          grep -Fxq '.changes/e2e/surface-callability-main-reconstruction.json' /tmp/changed.txt

      - name: Commit product-only exact-main result
        shell: bash
        run: |
          set -Eeuo pipefail
          before="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$before" = "$(git rev-parse HEAD)"
          git config user.name 'mad4bdigital-ai'
          git config user.email 'mad4bdigital-ai@users.noreply.github.com'
          git add -A
          git commit -m 'feat(surface): certify regenerated closure on latest main'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          after="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$after" = "$(git rev-parse HEAD)"
          test ! -e "${WORKFLOW_PATH}"
          test ! -e "${REQUEST_MARKER}"
