name: Production Promotion Candidate Contract

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/production-promotion-candidate.yml
      - .github/workflows/production-certified-release-cut-validation.yml
      - .github/workflows/production-promotion-candidate-contract.yml
      - http-generic-api/test-production-promotion-candidate-workflow.mjs
      - docs/production-promotion-candidate-automation.md
      - docs/production-promotion-release-cut-controller.md
  push:
    branches: [main]
    paths:
      - .github/workflows/production-promotion-candidate.yml
      - .github/workflows/production-certified-release-cut-validation.yml
      - .github/workflows/production-promotion-candidate-contract.yml
      - http-generic-api/test-production-promotion-candidate-workflow.mjs
      - docs/production-promotion-candidate-automation.md
      - docs/production-promotion-release-cut-controller.md

permissions:
  contents: read

concurrency:
  group: production-promotion-candidate-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Verify fail-closed immutable Production release-cut candidate contract
        working-directory: http-generic-api
        run: node test-production-promotion-candidate-workflow.mjs

      - name: Verify trusted promotion review-surface identity contract
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("node:fs");
          const workflow = fs.readFileSync(".github/workflows/production-promotion-candidate.yml", "utf8");
          const required = [
            "Require trusted promotion review-surface identity",
            "REPO_AUTOSYNC_TOKEN_PRESENT: ${{ secrets.REPO_AUTOSYNC_TOKEN != '' }}",
            "GH_TOKEN: ${{ secrets.REPO_AUTOSYNC_TOKEN }}",
          ];
          for (const value of required) {
            if (!workflow.includes(value)) throw new Error(`missing trusted promotion identity contract: ${value}`);
          }
          if (/GH_TOKEN:\s*\$\{\{\s*github\.token\s*\}\}/u.test(workflow)) {
            throw new Error("promotion review surfaces must not fall back to GITHUB_TOKEN");
          }
          if (workflow.indexOf("Require trusted promotion review-surface identity") > workflow.indexOf("Prepare immutable release-cut candidate")) {
            throw new Error("trusted promotion identity preflight must run before candidate mutation");
          }
          NODE

      - name: Create bounded contract evidence
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("node:fs");
          const evidence = {
            schema_version: "production_promotion_candidate_contract.v3",
            ok: true,
            release_mode: "certified_release_cut",
            workflow: ".github/workflows/production-promotion-candidate.yml",
            certified_validation_workflow: ".github/workflows/production-certified-release-cut-validation.yml",
            test: "http-generic-api/test-production-promotion-candidate-workflow.mjs",
            trusted_review_surface_identity_required: true,
            github_token_review_surface_fallback_forbidden: true,
            immutable_release_cut_required: true,
            release_cut_first_parent_required: true,
            candidate_tree_matches_release_cut_required: true,
            release_cut_ancestor_of_current_main_required: true,
            production_ref_stability_required: true,
            main_tip_may_advance: true,
            merge_executed: false,
            deployment_executed: false,
            migration_executed: false,
            provider_call_executed: false,
            credential_payload_read: false,
            secrets_included: false,
          };
          fs.writeFileSync(process.env.RUNNER_TEMP + "/production-promotion-candidate-contract.json", JSON.stringify(evidence, null, 2) + "\n");
          NODE
          test -s "$RUNNER_TEMP/production-promotion-candidate-contract.json"
          node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(value.ok!==true || value.release_mode!=="certified_release_cut" || value.trusted_review_surface_identity_required!==true || value.github_token_review_surface_fallback_forbidden!==true || value.immutable_release_cut_required!==true || value.production_ref_stability_required!==true || value.main_tip_may_advance!==true || value.secrets_included!==false) process.exit(1);' "$RUNNER_TEMP/production-promotion-candidate-contract.json"

      - name: Upload contract evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-promotion-candidate-contract
          path: ${{ runner.temp }}/production-promotion-candidate-contract.json
          if-no-files-found: error
          retention-days: 30