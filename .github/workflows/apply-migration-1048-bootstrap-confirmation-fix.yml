name: Apply Migration 1048 Bootstrap Confirmation Fix

on:
  push:
    branches:
      - fix/migration-1048-bootstrap-confirmation-20260807
    paths:
      - .github/workflows/apply-migration-1048-bootstrap-confirmation-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch canonical confirmation binding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runner_path = Path('.github/ops/transport-response-schema-1048-governed-rollout.mjs')
          test_path = Path('http-generic-api/test-transport-response-schema-1048-governed-rollout.mjs')

          runner = runner_path.read_text()
          old_constant = "const AUTH_CONFIRM = 'AUTHORIZE_GOVERNED_MIGRATION_1048_TRANSPORT_RESPONSE_SCHEMA_RECOVERY';"
          new_constant = "const BOOTSTRAP_CONFIRM = 'AUTHORIZE_GOVERNED_MIGRATION_1048_TRANSPORT_RESPONSE_CHUNK_SCHEMA_RECOVERY';"
          if runner.count(old_constant) != 1:
              raise SystemExit(f'expected exactly one legacy confirmation constant, found {runner.count(old_constant)}')
          runner = runner.replace(old_constant, new_constant, 1)
          if runner.count('confirm: AUTH_CONFIRM,') != 1:
              raise SystemExit('expected exactly one legacy bootstrap confirmation use')
          runner = runner.replace('confirm: AUTH_CONFIRM,', 'confirm: BOOTSTRAP_CONFIRM,', 1)
          runner_path.write_text(runner)

          test = test_path.read_text()
          anchor = "  \"const SOURCE_MERGE_SHA = '6503e74c60b8f6add9efade1f25ceb8afaec6209'\",\n"
          addition = (
              anchor
              + "  \"const BOOTSTRAP_CONFIRM = 'AUTHORIZE_GOVERNED_MIGRATION_1048_TRANSPORT_RESPONSE_CHUNK_SCHEMA_RECOVERY'\",\n"
              + "  \"confirm: BOOTSTRAP_CONFIRM\",\n"
          )
          if test.count(anchor) != 1:
              raise SystemExit('expected exactly one rollout-test insertion anchor')
          test = test.replace(anchor, addition, 1)
          test_path.write_text(test)
          PY

      - name: Validate runtime-derived confirmation and rollout regression
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/test-transport-response-schema-1048-governed-rollout.mjs
          node --input-type=module <<'NODE'
          import { governedMigrationAuthorizationConfirmation } from './http-generic-api/governedMigrationAuthorizationBootstrap.js';
          const migration = '1048_transport_response_chunk_schema_recovery.sql';
          const expected = 'AUTHORIZE_GOVERNED_MIGRATION_1048_TRANSPORT_RESPONSE_CHUNK_SCHEMA_RECOVERY';
          const actual = governedMigrationAuthorizationConfirmation(migration);
          if (actual !== expected) {
            throw new Error(`unexpected governed migration confirmation: ${actual}`);
          }
          console.log('governed migration confirmation contract passed');
          NODE

      - name: Enforce bounded final mutation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-migration-1048-bootstrap-confirmation.yml
          changed="$(git status --short | sed -E 's/^...//')"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 3
          printf '%s\n' "$changed" | grep -Fx '.github/ops/transport-response-schema-1048-governed-rollout.mjs'
          printf '%s\n' "$changed" | grep -Fx 'http-generic-api/test-transport-response-schema-1048-governed-rollout.mjs'
          printf '%s\n' "$changed" | grep -Fx '.github/workflows/repair-migration-1048-bootstrap-confirmation.yml'

      - name: Commit bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/ops/transport-response-schema-1048-governed-rollout.mjs http-generic-api/test-transport-response-schema-1048-governed-rollout.mjs
          git commit -m 'fix(migration): bind 1048 bootstrap confirmation to canonical filename'
          git push origin HEAD:fix/migration-1048-bootstrap-confirmation-20260807
