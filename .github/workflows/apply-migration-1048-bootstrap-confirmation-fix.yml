name: Apply Migration 1048 Bootstrap Confirmation Fix

on:
  push:
    branches:
      - fix/migration-1048-bootstrap-confirmation-20260807
    paths:
      - .github/workflows/apply-migration-1048-bootstrap-confirmation-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply transparent bounded repair script
        shell: bash
        run: |
          set -euo pipefail
          python .changes/migration-1048-authorization-handshake-repair.py

      - name: Validate bounded contract
        shell: bash
        run: |
          set -euo pipefail
          node --check .github/ops/transport-response-schema-1048-governed-rollout.mjs
          node http-generic-api/test-transport-response-schema-1048-governed-rollout.mjs

      - name: Remove transient repair artifacts
        shell: bash
        run: |
          set -euo pipefail
          git rm .changes/migration-1048-authorization-handshake.patch
          git rm .changes/migration-1048-authorization-handshake-repair.py
          git rm .github/workflows/repair-migration-1048-bootstrap-confirmation.yml
          git rm .github/workflows/apply-migration-1048-bootstrap-confirmation-fix.yml
          changed="$(git status --short | sed -E 's/^...//')"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 5
          printf '%s\n' "$changed" | grep -Fx '.github/ops/transport-response-schema-1048-governed-rollout.mjs'
          printf '%s\n' "$changed" | grep -Fx '.changes/migration-1048-authorization-handshake.patch'
          printf '%s\n' "$changed" | grep -Fx '.changes/migration-1048-authorization-handshake-repair.py'
          printf '%s\n' "$changed" | grep -Fx '.github/workflows/repair-migration-1048-bootstrap-confirmation.yml'
          printf '%s\n' "$changed" | grep -Fx '.github/workflows/apply-migration-1048-bootstrap-confirmation-fix.yml'

      - name: Commit bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/ops/transport-response-schema-1048-governed-rollout.mjs
          git commit -m 'fix(migration): honor runtime 1048 authorization challenge'
          git push origin HEAD:fix/migration-1048-bootstrap-confirmation-20260807
