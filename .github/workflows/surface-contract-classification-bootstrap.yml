name: Surface Contract Classification Bootstrap

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: surface-contract-classification-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'gpt/surface-contract-classification-hardening-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout governed classification branch
        uses: actions/checkout@v5
        with:
          ref: gpt/surface-contract-classification-hardening-20260730
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Remove redundant textual precheck from temporary applicator
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('http-generic-api/scripts/apply-surface-contract-classification-phase-a.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          output = []
          removed = 0
          for line in lines:
              if 'safety_bullet_parser_behavior_missing' in line:
                  if not output or not output[-1].lstrip().startswith("if '(?:[-*]"):
                      raise SystemExit('surface_behavior_precheck_anchor_missing')
                  output.pop()
                  removed += 1
                  continue
              output.append(line)
          if removed != 1:
              raise SystemExit(f'surface_behavior_precheck_count:{removed}')
          path.write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY

      - name: Adapt docs coverage call to current source
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('http-generic-api/scripts/apply-surface-contract-classification-phase-a.py')
          source = path.read_text(encoding='utf-8')
          old = '''    call_marker = "const documentation = docsCoverageFor(fileName, docsByPath);"
              if call_marker not in script:
                  raise SystemExit("docs_coverage_call_marker_missing")
              script = script.replace(call_marker, "const documentation = docsCoverageFor(fileName, docsByPath, source);", 1)
          '''
          new = '''    call_replacements = [
                  ("const documentation = docsCoverageFor(fileName, docsByPath);", "const documentation = docsCoverageFor(fileName, docsByPath, source);"),
                  ("const docs = docsCoverageFor(name, docsByPath);", "const docs = docsCoverageFor(name, docsByPath, source);"),
              ]
              matched_call = False
              for old_call, new_call in call_replacements:
                  if old_call in script:
                      script = script.replace(old_call, new_call, 1)
                      matched_call = True
                      break
              if not matched_call and not any(new_call in script for _, new_call in call_replacements):
                  raise SystemExit("docs_coverage_call_marker_missing")
          '''
          if old not in source:
              raise SystemExit('docs_coverage_applicator_block_missing')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply checksum-bound parser and evidence repair
        shell: bash
        run: |
          set -euo pipefail
          python3 http-generic-api/scripts/apply-surface-contract-classification-phase-a.py

      - name: Verify and regenerate bounded Surface evidence
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          before="$(node -e "const q=require('../docs/surface-contract-gap-queue.json');process.stdout.write(String(q.total_items))")"
          node --check scripts/surface-contract-sql-registry-extractor.mjs
          node --check scripts/surface-contract-discovery.mjs
          node test-surface-contract-sql-registry-extractor.mjs
          node test-surface-contract-discovery.mjs
          node scripts/surface-contract-discovery.mjs --write
          node scripts/surface-contract-discovery.mjs --check
          after="$(node -e "const q=require('../docs/surface-contract-gap-queue.json');process.stdout.write(String(q.total_items))")"
          test "$after" -lt "$before" || { echo "::error::Surface queue did not decrease: before=$before after=$after"; exit 1; }
          node - <<'NODE'
          const queue = require('../docs/surface-contract-gap-queue.json');
          const names = new Set(queue.top_items.map((item) => item.migration_file));
          if (names.has('20260714_validate_hostinger_connection_and_complete_continuation_task.sql')) throw new Error('Hostinger evidence remains queued');
          console.log({ surface_queue_after: queue.total_items, critical_after: queue.class_counts.critical_review, secrets_included: false });
          NODE

      - name: Enforce bounded product write set and commit
        shell: bash
        run: |
          set -euo pipefail
          git add \
            http-generic-api/scripts/surface-contract-sql-registry-extractor.mjs \
            http-generic-api/scripts/surface-contract-discovery.mjs \
            http-generic-api/surface-contract-classification-evidence.json \
            http-generic-api/test-surface-contract-sql-registry-extractor.mjs \
            http-generic-api/test-surface-contract-discovery.mjs \
            docs/surface-contract-discovery-status.md \
            docs/surface-contract-discovery-status.json \
            docs/surface-contract-gap-queue.md \
            docs/surface-contract-gap-queue.json
          python3 <<'PY'
          import subprocess
          allowed = {
            'http-generic-api/scripts/surface-contract-sql-registry-extractor.mjs',
            'http-generic-api/scripts/surface-contract-discovery.mjs',
            'http-generic-api/surface-contract-classification-evidence.json',
            'http-generic-api/test-surface-contract-sql-registry-extractor.mjs',
            'http-generic-api/test-surface-contract-discovery.mjs',
            'docs/surface-contract-discovery-status.md',
            'docs/surface-contract-discovery-status.json',
            'docs/surface-contract-gap-queue.md',
            'docs/surface-contract-gap-queue.json',
          }
          changed = set(filter(None, subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()))
          if changed != allowed:
            raise SystemExit(f'bounded_write_set_mismatch:missing={sorted(allowed-changed)}:extra={sorted(changed-allowed)}')
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: make Surface Contract discovery context-aware'
          git push origin HEAD:gpt/surface-contract-classification-hardening-20260730
