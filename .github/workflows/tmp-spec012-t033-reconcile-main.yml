name: Temporary Spec 012 T033 Current Main Reconciler

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/ops/tmp-spec012-t033-reconcile-main.mjs
      - .github/workflows/tmp-spec012-t033-reconcile-main.yml

permissions:
  contents: write

concurrency:
  group: spec012-t033-current-main-reconcile-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: gpt/spec-012-t033-short-lived-bearer-profile-20260804

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Reconcile T031 parity with T033 bearer profile
        shell: bash
        env:
          TARGET_BRANCH: gpt/spec-012-t033-short-lived-bearer-profile-20260804
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          node .github/ops/tmp-spec012-t033-reconcile-main.mjs
          node --check http-generic-api/routes/tenantGptOAuthTokenExchangeRoutes.js
          node --check http-generic-api/tenantGptOAuthTokenExchangeBindingGuard.js
          git diff --check
          test -n "$(git status --porcelain -- http-generic-api/routes/tenantGptOAuthTokenExchangeRoutes.js http-generic-api/tenantGptOAuthTokenExchangeBindingGuard.js)"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add http-generic-api/routes/tenantGptOAuthTokenExchangeRoutes.js http-generic-api/tenantGptOAuthTokenExchangeBindingGuard.js
          git commit -m "fix(spec012): reconcile T033 with governed T031 route parity"
          remote_head="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "${{ github.event.pull_request.head.sha }}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
