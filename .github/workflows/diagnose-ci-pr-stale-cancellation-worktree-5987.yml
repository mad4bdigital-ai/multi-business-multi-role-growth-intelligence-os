name: Diagnose CI PR Stale Cancellation Worktree 5987 v2

on:
  pull_request:
    branches:
      - gpt/diagnose-ci-pr-worktree-5987-v2-20260804
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  diagnose-worktree:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'gpt/ci-pr-stale-cancellation-main-a61cd9e8-20260804' && github.event.pull_request.head.sha == '98a5ad092344316e62945a622f783fb42fcc20a2'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      TARGET: http-generic-api/test-ci-pull-request-recovery-exact-checkout-provenance.mjs
      EXPECTED_BLOB: 9a0e8e9d500ffd5f671ccec14288782e836efcbf
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Confirm checkout fingerprint
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git hash-object "$TARGET")"
          printf 'checkout expected=%s actual=%s lines=%s\n' "$EXPECTED_BLOB" "$actual" "$(wc -l < "$TARGET")"
          test "$actual" = "$EXPECTED_BLOB"

      - name: Schema docs guard preserves candidate
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/schema-docs-change-guard.mjs
          actual="$(git hash-object "$TARGET")"
          printf 'schema-docs expected=%s actual=%s\n' "$EXPECTED_BLOB" "$actual"
          if [ "$actual" != "$EXPECTED_BLOB" ]; then git status --short; git diff -- "$TARGET"; exit 42; fi

      - name: Migration placement guard preserves candidate
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/migration-placement-guard.mjs
          actual="$(git hash-object "$TARGET")"
          printf 'migration-placement expected=%s actual=%s\n' "$EXPECTED_BLOB" "$actual"
          if [ "$actual" != "$EXPECTED_BLOB" ]; then git status --short; git diff -- "$TARGET"; exit 42; fi

      - name: User JWT governance preserves candidate
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/user-jwt-auth-governance.mjs
          actual="$(git hash-object "$TARGET")"
          printf 'user-jwt expected=%s actual=%s\n' "$EXPECTED_BLOB" "$actual"
          if [ "$actual" != "$EXPECTED_BLOB" ]; then git status --short; git diff -- "$TARGET"; exit 42; fi

      - name: Interruption readiness preserves candidate
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/interruption-readiness.mjs --ci --skip-dependencies --skip-worktree
          actual="$(git hash-object "$TARGET")"
          printf 'interruption-readiness expected=%s actual=%s\n' "$EXPECTED_BLOB" "$actual"
          if [ "$actual" != "$EXPECTED_BLOB" ]; then git status --short; git diff -- "$TARGET"; exit 42; fi

      - name: Canonical validation preserves candidate
        shell: bash
        run: |
          set -euo pipefail
