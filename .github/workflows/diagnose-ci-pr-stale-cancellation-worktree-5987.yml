          actual="$(git hash-object "$TARGET")"
          printf 'focused-regression expected=%s actual=%s\n' "$EXPECTED_BLOB" "$actual"
          if [ "$actual" != "$EXPECTED_BLOB" ]; then git status --short; git diff -- "$TARGET"; exit 42; fi
