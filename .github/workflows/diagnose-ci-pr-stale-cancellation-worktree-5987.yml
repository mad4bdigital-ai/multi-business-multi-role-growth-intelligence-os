          actual="$(git hash-object "$TARGET")"
          printf 'spec-kit expected=%s actual=%s\n' "$EXPECTED_BLOB" "$actual"
          if [ "$actual" != "$EXPECTED_BLOB" ]; then git status --short; git diff -- "$TARGET"; exit 42; fi

      - name: Memory schema validation preserves candidate
        shell: bash
        run: |
          set -euo pipefail
          node validate-memory-schema.mjs
          actual="$(git hash-object "$TARGET")"
