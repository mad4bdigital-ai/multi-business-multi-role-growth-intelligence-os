name: Auth parity diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: http-generic-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json
      - run: npm ci
      - name: Apply scoped diagnosed corrections in workspace
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path = "openapi/container-authority.yaml";
          const needle = "security: [{ backendBearerAuth: [] }, { backendApiKeyAuth: [] }]";
          const replacement = "security: [{ adminBearerAuth: [] }, { backendApiKeyAuth: [] }]";
          const toolKeys = [
            "dynamic_container_canary_promotion",
            "dynamic_container_canary_rollback",
            "dynamic_container_canary_probe_sampler",
          ];
          let source = fs.readFileSync(path, "utf8");
          for (const toolKey of toolKeys) {
            const marker = `x-registry-tool-key: ${toolKey}`;
            const markerIndex = source.indexOf(marker);
            if (markerIndex < 0 || source.indexOf(marker, markerIndex + 1) >= 0) {
              throw new Error(`Expected one marker for ${toolKey}`);
            }
            const securityIndex = source.indexOf(needle, markerIndex);
            if (securityIndex < 0 || securityIndex - markerIndex > 500) {
              throw new Error(`Expected diagnosed security declaration near ${toolKey}`);
            }
            source = source.slice(0, securityIndex) + replacement + source.slice(securityIndex + needle.length);
          }
          fs.writeFileSync(path, source);
          NODE
      - name: Resolve current main baseline
        run: |
          git fetch origin main --depth=1
          echo "BASELINE_REF=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
      - name: Generate report
        run: npm run frontend:dispatch:generate -- --baseline-ref="$BASELINE_REF"
      - name: Print remaining auth parity mismatches
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const report = JSON.parse(fs.readFileSync("frontend-surface-dispatch.generated.json", "utf8"));
          const mismatches = [];
          for (const family of report.families || []) {
            for (const operation of family.operations || []) {
              const state = operation?.auth_parity?.state;
              if (state && !["equivalent", "exempt"].includes(state)) {
                mismatches.push({
                  family_key: family.family_key,
                  signature: operation.signature,
                  state,
                  reasons: operation.auth_parity?.reasons || [],
                  runtime_auth: operation.runtime_auth,
                  openapi_auth: operation.openapi_auth,
                });
              }
            }
          }
          console.log(JSON.stringify({ mismatch_count: mismatches.length, mismatches }, null, 2));
          NODE
