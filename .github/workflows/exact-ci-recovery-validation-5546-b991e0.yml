name: Exact CI Recovery Validation 5546

on:
  pull_request:
    branches:
      - gpt/validate-ci-recovery-provenance-base-5546-b991e0
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: exact-ci-recovery-validation-5546-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Exact Candidate Preflight
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/ci-recovery-provenance-atomic-b991e0ae' &&
      github.event.pull_request.head.sha == '7162a8512b461781b7403a8de4c7ca01ad981cac'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    outputs:
      main_sha: ${{ steps.verify.outputs.main_sha }}
      head_sha: ${{ steps.verify.outputs.head_sha }}
    env:
      EXPECTED_MAIN_SHA: b991e0ae9ee9beb43582444d7f7f5a1a0c5768fe
      EXPECTED_HEAD_SHA: 7162a8512b461781b7403a8de4c7ca01ad981cac
      EXPECTED_HEAD_REF: gpt/ci-recovery-provenance-atomic-b991e0ae
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable identity, ancestry, scope, and blobs
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.repo.full_name }}" = "${GITHUB_REPOSITORY}"
          test "${{ github.event.pull_request.head.ref }}" = "${EXPECTED_HEAD_REF}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          test "$(git rev-parse HEAD^1)" = "${EXPECTED_MAIN_SHA}"
          test "$(git rev-list --count "${EXPECTED_MAIN_SHA}".."${EXPECTED_HEAD_SHA}")" -eq 1
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "${EXPECTED_MAIN_SHA}"
          mapfile -t files < <(git diff --name-only "${EXPECTED_MAIN_SHA}"..."${EXPECTED_HEAD_SHA}")
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 3
          test "${files[0]}" = '.changes/e2e/ci-pull-request-recovery-exact-checkout-provenance.json'
          test "${files[1]}" = '.github/workflows/ci-pull-request-recovery.yml'
          test "${files[2]}" = 'http-generic-api/test-ci-pull-request-recovery-exact-checkout-provenance.mjs'
          test "$(git rev-parse "${EXPECTED_HEAD_SHA}:.changes/e2e/ci-pull-request-recovery-exact-checkout-provenance.json")" = 'c946e3e7878bae8f6cac5960912ef90b64ccecb8'
          test "$(git rev-parse "${EXPECTED_HEAD_SHA}:.github/workflows/ci-pull-request-recovery.yml")" = 'e21882316db92fcccd2b67d4ff60b7f5b3e6cdb7'
          test "$(git rev-parse "${EXPECTED_HEAD_SHA}:http-generic-api/test-ci-pull-request-recovery-exact-checkout-provenance.mjs")" = 'b1de449e9c762e11782841516a10356d724ef902'
          printf 'main_sha=%s\n' "${EXPECTED_MAIN_SHA}" >> "${GITHUB_OUTPUT}"
          printf 'head_sha=%s\n' "${EXPECTED_HEAD_SHA}" >> "${GITHUB_OUTPUT}"

  core:
    name: Recovery Core and Runtime Validation
    needs: preflight
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      EXPECTED_MAIN_SHA: ${{ needs.preflight.outputs.main_sha }}
      EXPECTED_HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
      EXPECTED_HEAD_REF: gpt/ci-recovery-provenance-atomic-b991e0ae
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            http-generic-api/package-lock.json

      - name: Run canonical syntax and governance checks
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/schema-docs-change-guard.mjs
          node http-generic-api/scripts/migration-placement-guard.mjs
          node http-generic-api/scripts/user-jwt-auth-governance.mjs
          node http-generic-api/scripts/interruption-readiness.mjs --ci --skip-dependencies --skip-worktree
          node validate-canonical-sources.mjs
          node build-canonicals.mjs --check
          node --check find-canonical-domain.mjs
          (cd http-generic-api && node scripts/resource-api-coverage-audit.mjs --ci --changed)
          (cd http-generic-api && node test-resource-api-architecture.mjs && node test-resource-api-service.mjs)
          node http-generic-api/scripts/spec-kit-completion-gate.mjs --ci --changed
          node validate-memory-schema.mjs
          git diff --check
          node --check http-generic-api/test-ci-pull-request-recovery-exact-checkout-provenance.mjs

      - name: Install HTTP API dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Run focused Recovery provenance regression
        working-directory: http-generic-api
        run: node test-ci-pull-request-recovery-exact-checkout-provenance.mjs

      - name: Run complete suite through corrected Recovery identity boundary
        working-directory: http-generic-api
        env:
          TEST_SUITE_REPORT_DIR: ${{ runner.temp }}/test-suite-reports
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${EXPECTED_HEAD_SHA}"
          GITHUB_SHA="${actual_sha}" npm test

      - name: Verify structured progress reports use exact checked-out SHA
        env:
          TEST_SUITE_REPORT_DIR: ${{ runner.temp }}/test-suite-reports
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          const expected = process.env.EXPECTED_HEAD_SHA;
          const dir = process.env.TEST_SUITE_REPORT_DIR;
          for (const name of ['test-manifest.json', 'test-suite.json']) {
            const report = JSON.parse(fs.readFileSync(path.join(dir, name), 'utf8'));
            assert.equal(report.status, 'passed', `${name} status`);
            assert.equal(report.commitSha, expected, `${name} must use exact checked-out SHA`);
            assert.equal(report.firstFailure, null, `${name} firstFailure`);
            assert.equal(report.secretsIncluded, false, `${name} secretsIncluded`);
            if (name === 'test-manifest.json') {
              assert.equal(report.selectedCount, report.totalCommands);
              assert.ok(report.totalCommands > 0);
            }
          }
          NODE

      - name: Prove runtime startup and deployment evidence
        working-directory: http-generic-api
        env:
          FORCE_ROUTE_RUNTIME_TESTS: 'true'
          DEPLOYMENT_BRANCH: ${{ env.EXPECTED_HEAD_REF }}
          DEPLOYMENT_COMMIT_SHA: ${{ env.EXPECTED_HEAD_SHA }}
        run: |
          node test-deployment-manifest-generator.mjs
          npm run manifest:deployment
          node test-server-startup-smoke.mjs

      - name: Install root dependencies and run Execution Resolver Gate
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test -- --runInBand

      - name: Run Architecture Drift Detection
        working-directory: http-generic-api
        run: npm run validate

      - name: Run exact E2E phase evaluation and execution
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/e2e-phase-governance.mjs check \
            --base "${EXPECTED_MAIN_SHA}" \
            --head "${EXPECTED_HEAD_SHA}" \
            --report-file "${RUNNER_TEMP}/e2e-phase-evaluation.json"
          node http-generic-api/scripts/e2e-phase-governance.mjs run \
            --base "${EXPECTED_MAIN_SHA}" \
            --head "${EXPECTED_HEAD_SHA}" \
            --report-file "${RUNNER_TEMP}/e2e-phase-evaluation-run.json" \
            --execution-report-file "${RUNNER_TEMP}/e2e-phase-execution.json"

      - name: Upload core exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-ci-recovery-core-5546-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/test-suite-reports/*.json
            ${{ runner.temp }}/e2e-phase-*.json
          if-no-files-found: warn
          retention-days: 14

  extended:
    name: Lifecycle Contract and Frontend Validation
    needs: preflight
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      EXPECTED_MAIN_SHA: ${{ needs.preflight.outputs.main_sha }}
      EXPECTED_HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install HTTP API dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Run Repository Tool Lifecycle Governance
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs
          git diff --name-status "${EXPECTED_MAIN_SHA}" "${EXPECTED_HEAD_SHA}" > "${RUNNER_TEMP}/repository-tool-changes.tsv"
          node http-generic-api/scripts/maintenance-tools/repository-tool-lifecycle-guard.mjs \
            --changed-files "${RUNNER_TEMP}/repository-tool-changes.tsv" \
            --policy .github/repository-maintenance-tool-governance.json \
            --output-dir "${RUNNER_TEMP}/repository-tool-lifecycle"

      - name: Run E2E Contract Reference Integrity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/contract-reference"
          node http-generic-api/test-e2e-contract-reference-integrity.mjs
          node http-generic-api/test-e2e-contract-git-index-integrity.mjs
          node http-generic-api/scripts/e2e-contract-reference-integrity.mjs \
            --base "${EXPECTED_MAIN_SHA}" \
            --head "${EXPECTED_HEAD_SHA}" \
            --report-file "${RUNNER_TEMP}/contract-reference/e2e-contract-reference-integrity.json"
          node http-generic-api/scripts/e2e-contract-git-index-integrity.mjs \
            --report-file "${RUNNER_TEMP}/contract-reference/e2e-contract-reference-integrity.json"

      - name: Run Frontend generator and deterministic parity
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          CANONICAL_BASELINE_REF=main TARGET_REF=main npm run frontend:dispatch:generate -- --baseline-ref=main
          node test-frontend-dispatch-workflow-baseline.mjs
          node test-frontend-operation-governance-generator.mjs
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-openapi-route-coverage.mjs
          npm run openapi:auth:check
          UNEXPECTED="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(http-generic-api/)?(frontend-operation-governance\.generated\.json|frontend-surface-dispatch\.generated\.json|openapi/frontend-runtime-routes\.generated\.yaml)$' || true)"
          if [[ -n "${UNEXPECTED}" ]]; then
            printf '%s\n' "${UNEXPECTED}"
            exit 1
          fi
          if [[ -n "$(git status --porcelain -- frontend-operation-governance.generated.json frontend-surface-dispatch.generated.json openapi/frontend-runtime-routes.generated.yaml)" ]]; then
            git diff --no-ext-diff --unified=1 -- frontend-operation-governance.generated.json frontend-surface-dispatch.generated.json openapi/frontend-runtime-routes.generated.yaml || true
            exit 1
          fi

      - name: Publish extended no-secret summary
        if: always()
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/extended-summary"
          jq -n \
            --arg base_sha "${EXPECTED_MAIN_SHA}" \
            --arg head_sha "${EXPECTED_HEAD_SHA}" \
            '{contract:"mad4b.exact-ci-recovery-extended-validation.v1",base_sha:$base_sha,head_sha:$head_sha,repository_mutation:false,protected_ref_mutation:false,provider_call:false,credential_read:false,sql_executed:false,migration_apply:false,database_mutated:false,external_send:false,secrets_included:false}' \
            > "${RUNNER_TEMP}/extended-summary/summary.json"

      - name: Upload extended exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-ci-recovery-extended-5546-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/repository-tool-lifecycle/
            ${{ runner.temp }}/contract-reference/
            ${{ runner.temp }}/extended-summary/summary.json
          if-no-files-found: warn
          retention-days: 14

  final:
    name: Exact Validation Decision
    if: always()
    needs: [preflight, core, extended]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Publish final no-secret decision
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          CORE_RESULT: ${{ needs.core.result }}
          EXTENDED_RESULT: ${{ needs.extended.result }}
          EXPECTED_MAIN_SHA: b991e0ae9ee9beb43582444d7f7f5a1a0c5768fe
          EXPECTED_HEAD_SHA: 7162a8512b461781b7403a8de4c7ca01ad981cac
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg base_sha "${EXPECTED_MAIN_SHA}" \
            --arg head_sha "${EXPECTED_HEAD_SHA}" \
            --arg preflight "${PREFLIGHT_RESULT}" \
            --arg core "${CORE_RESULT}" \
            --arg extended "${EXTENDED_RESULT}" \
            '{contract:"mad4b.exact-ci-recovery-validation.v1",base_sha:$base_sha,head_sha:$head_sha,results:{preflight:$preflight,core:$core,extended:$extended},candidate_mutated:false,main_mutated:false,production_mutated:false,provider_call:false,credential_read:false,sql_executed:false,migration_apply:false,database_mutated:false,external_send:false,secrets_included:false}' \
            > "${RUNNER_TEMP}/exact-ci-recovery-validation-summary.json"

      - name: Upload final decision
        uses: actions/upload-artifact@v4
        with:
          name: exact-ci-recovery-validation-5546-${{ github.run_id }}
          path: ${{ runner.temp }}/exact-ci-recovery-validation-summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce exact validation
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          CORE_RESULT: ${{ needs.core.result }}
          EXTENDED_RESULT: ${{ needs.extended.result }}
        run: |
          test "${PREFLIGHT_RESULT}" = success
          test "${CORE_RESULT}" = success
          test "${EXTENDED_RESULT}" = success
