name: Bootstrap GitHub contents target branch guard

on:
  push:
    branches:
      - gpt/fix-contents-target-branch-guard-20260805

permissions:
  contents: write

concurrency:
  group: bootstrap-github-contents-target-branch-guard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor_id == 271942579
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout exact bootstrap branch
        uses: actions/checkout@v5
        with:
          ref: gpt/fix-contents-target-branch-guard-20260805
          fetch-depth: 2
          persist-credentials: true

      - name: Verify immutable bootstrap identity
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "gpt/fix-contents-target-branch-guard-20260805"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "57c78c5d95094f0b76ed6a524fb8e2816be872ea"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/bootstrap-github-contents-target-branch-guard.yml"

      - name: Publish semantic anchor inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          from pathlib import Path
          route = Path('http-generic-api/routes/adminCliRoutes.js').read_text(encoding='utf-8')
          test = Path('http-generic-api/test-github-rest-fallback-hardening.mjs').read_text(encoding='utf-8')
          markers = {
              'helper_boundary': '\n\nfunction githubBranchRefUpdateAllowed(apiTarget = "", method = "GET") {',
              'prepare_boundary': '    const branchRefUpdate = allowedBranchRefUpdate ? assertGithubBranchRefUpdateAllowed(apiTarget, fieldValues) : null;',
              'provider_body': '      body: pullClose ? pullClose.body : allowedBranchRefUpdate ? branchRefUpdate.body : allowedMutation ? fieldValues : null,',
              'output_boundary': '    const output = pullClose',
          }
          print('## Bootstrap semantic anchor inventory')
          for name, marker in markers.items():
              print(f'- {name}: {route.count(marker)}')
          test_marker = "assert(adminCliRoutes.includes('github_rest_contents_workflow_blocked'), 'GitHub REST fallback must block workflow file mutation through contents writes');"
          print(f'- test_boundary: {test.count(test_marker)}')
          print('- logs_consulted: false')
          print('- secrets_included: false')
          PY

      - name: Apply fail-closed target branch patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          route_path = Path('http-generic-api/routes/adminCliRoutes.js')
          test_path = Path('http-generic-api/test-github-rest-fallback-hardening.mjs')
          contract_path = Path('.changes/e2e/github-rest-contents-target-branch-guard.json')

          def require_once(text, marker, label):
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')

          route = route_path.read_text(encoding='utf-8')

          helper_boundary = '\n\nfunction githubBranchRefUpdateAllowed(apiTarget = "", method = "GET") {'
          require_once(route, helper_boundary, 'helper boundary')
          helper = '''

          export function assertGithubContentsMutationIntent(fieldValues = {}, defaultBranch = "") {
            const branch = String(fieldValues?.branch || "").trim();
            if (!branch) {
              const err = new Error("GitHub contents write fallback requires an explicit branch field; default-branch fallback is forbidden.");
              err.status = 400;
              err.code = "github_rest_contents_branch_required";
              throw err;
            }

            const normalizedBranch = branch.toLowerCase();
            const protectedBranches = new Set(["main", "master", "production", "prod", "staging", "release"]);
            const normalizedDefaultBranch = String(defaultBranch || "").trim().toLowerCase();
            if (normalizedDefaultBranch) protectedBranches.add(normalizedDefaultBranch);
            if (protectedBranches.has(normalizedBranch)) {
              const err = new Error("GitHub contents write fallback refuses protected or default branches.");
              err.status = 403;
              err.code = "github_rest_contents_protected_branch";
              err.details = { branch, default_branch: defaultBranch || null, secrets_included: false };
              throw err;
            }
            if (!/^(gpt|chore|fix|feature|docs|hotfix|cert)\//.test(branch)) {
              const err = new Error("GitHub contents write fallback requires a governed non-protected branch prefix.");
              err.status = 403;
              err.code = "github_rest_contents_branch_prefix_blocked";
              err.details = {
                branch,
                allowed_prefixes: ["gpt/", "chore/", "fix/", "feature/", "docs/", "hotfix/", "cert/"],
                secrets_included: false,
              };
              throw err;
            }

            const expectedBranchSha = String(fieldValues?.expected_branch_sha || "").trim();
            if (!/^[0-9a-f]{40}$/i.test(expectedBranchSha)) {
              const err = new Error("GitHub contents write fallback requires expected_branch_sha bound to the existing target ref.");
              err.status = 400;
              err.code = "github_rest_contents_expected_head_required";
              err.details = { branch, secrets_included: false };
              throw err;
            }

            const body = { ...fieldValues, branch };
            delete body.expected_branch_sha;
            return { branch, expected_branch_sha: expectedBranchSha.toLowerCase(), body, secrets_included: false };
          }

          async function prepareGithubContentsMutation({ owner, repo, token, fieldValues = {} }) {
            const repository = await githubRestJson({ owner, repo, apiPath: "", token });
            const intent = assertGithubContentsMutationIntent(fieldValues, repository?.default_branch || "");
            let branchRef;
            try {
              branchRef = await githubRestJson({
                owner,
                repo,
                apiPath: `/git/ref/heads/${encodeGithubRefPath(intent.branch)}`,
                token,
              });
            } catch (error) {
              if (Number(error?.details?.status) === 404) {
                const err = new Error("GitHub contents write target branch does not exist; default-branch fallback is forbidden.");
                err.status = 409;
                err.code = "github_rest_contents_branch_not_found";
                err.details = { branch: intent.branch, secrets_included: false };
                throw err;
              }
              throw error;
            }

            const observedBranchSha = String(branchRef?.object?.sha || "").trim().toLowerCase();
            if (!/^[0-9a-f]{40}$/i.test(observedBranchSha)) {
              const err = new Error("GitHub contents write target branch readback was malformed.");
              err.status = 502;
              err.code = "github_rest_contents_branch_ref_malformed";
              err.details = { branch: intent.branch, secrets_included: false };
              throw err;
            }
            if (observedBranchSha !== intent.expected_branch_sha) {
              const err = new Error("GitHub contents write target branch moved before mutation.");
              err.status = 409;
              err.code = "github_rest_contents_stale_branch";
              err.details = {
                branch: intent.branch,
                expected_branch_sha: intent.expected_branch_sha,
                observed_branch_sha: observedBranchSha,
                secrets_included: false,
              };
              throw err;
            }
            return { ...intent, observed_branch_sha: observedBranchSha };
          }

          async function readbackGithubContentsMutation({ owner, repo, token, contentsMutation, payload }) {
            const committedSha = String(payload?.commit?.sha || "").trim().toLowerCase();
            if (!/^[0-9a-f]{40}$/i.test(committedSha)) {
              const err = new Error("GitHub contents write response did not include a valid commit SHA.");
              err.status = 502;
              err.code = "github_rest_contents_commit_sha_missing";
              err.details = { branch: contentsMutation.branch, secrets_included: false };
              throw err;
            }
            const branchRef = await githubRestJson({
              owner,
              repo,
              apiPath: `/git/ref/heads/${encodeGithubRefPath(contentsMutation.branch)}`,
              token,
            });
            const observedBranchSha = String(branchRef?.object?.sha || "").trim().toLowerCase();
            if (observedBranchSha !== committedSha) {
              const err = new Error("GitHub contents write completed without exact branch-head readback.");
              err.status = 502;
              err.code = "github_rest_contents_branch_readback_failed";
              err.details = {
                branch: contentsMutation.branch,
                commit_sha: committedSha,
                observed_branch_sha: observedBranchSha || null,
                secrets_included: false,
              };
              throw err;
            }
            return {
              branch: contentsMutation.branch,
              previous_branch_sha: contentsMutation.observed_branch_sha,
              commit_sha: committedSha,
              observed_branch_sha: observedBranchSha,
              readback_verified: true,
              secrets_included: false,
            };
          }'''
          route = route.replace(helper_boundary, helper + helper_boundary, 1)

          prepare_boundary = '    const branchRefUpdate = allowedBranchRefUpdate ? assertGithubBranchRefUpdateAllowed(apiTarget, fieldValues) : null;'
          require_once(route, prepare_boundary, 'prepare boundary')
          prepare_code = '''    const contentsMutation = allowedContentsMutation
              ? await prepareGithubContentsMutation({ owner, repo, token, fieldValues })
              : null;
          '''
          route = route.replace(prepare_boundary, prepare_code + prepare_boundary, 1)

          provider_body = '      body: pullClose ? pullClose.body : allowedBranchRefUpdate ? branchRefUpdate.body : allowedMutation ? fieldValues : null,'
          require_once(route, provider_body, 'provider body')
          bounded_body = '''      body: pullClose
              ? pullClose.body
              : contentsMutation
                ? contentsMutation.body
                : allowedBranchRefUpdate
                  ? branchRefUpdate.body
                  : allowedMutation
                    ? fieldValues
                    : null,'''
          route = route.replace(provider_body, bounded_body, 1)

          output_boundary = '    const output = pullClose\n'
          require_once(route, output_boundary, 'output boundary')
          bounded_output = '''    const contentsMutationReadback = contentsMutation
              ? await readbackGithubContentsMutation({ owner, repo, token, contentsMutation, payload })
              : null;
            const output = contentsMutation
              ? {
                  content_write: true,
                  path: githubContentsPathFromApiTarget(apiTarget),
                  ...contentsMutationReadback,
                }
              : pullClose
          '''
          route = route.replace(output_boundary, bounded_output, 1)
          route_path.write_text(route, encoding='utf-8')

          test = test_path.read_text(encoding='utf-8')
          test_boundary = "assert(adminCliRoutes.includes('github_rest_contents_workflow_blocked'), 'GitHub REST fallback must block workflow file mutation through contents writes');"
          require_once(test, test_boundary, 'test boundary')
          test_additions = '''
          assert(adminCliRoutes.includes('assertGithubContentsMutationIntent'), 'GitHub contents writes must validate explicit target intent');
          assert(adminCliRoutes.includes('github_rest_contents_branch_required'), 'GitHub contents writes must reject an omitted branch instead of using the default branch');
          assert(adminCliRoutes.includes('github_rest_contents_protected_branch'), 'GitHub contents writes must reject protected and default branches');
          assert(adminCliRoutes.includes('github_rest_contents_branch_prefix_blocked'), 'GitHub contents writes must require a governed work-branch prefix');
          assert(adminCliRoutes.includes('github_rest_contents_expected_head_required'), 'GitHub contents writes must require an expected target head');
          assert(adminCliRoutes.includes('github_rest_contents_branch_not_found'), 'GitHub contents writes must fail closed when the requested branch does not exist');
          assert(adminCliRoutes.includes('github_rest_contents_stale_branch'), 'GitHub contents writes must reject target-ref movement before mutation');
          assert(adminCliRoutes.includes('delete body.expected_branch_sha'), 'Expected-head governance fields must not be sent to the GitHub contents endpoint');
          assert(adminCliRoutes.includes('github_rest_contents_branch_readback_failed'), 'GitHub contents writes must verify the exact resulting branch head');
          assert(adminCliRoutes.includes('content_write: true'), 'GitHub contents writes must return bounded mutation evidence');'''
          test = test.replace(test_boundary, test_boundary + test_additions, 1)
          test_path.write_text(test, encoding='utf-8')

          contract = {
            "$schema": "../../.specify/schemas/e2e-phases.schema.json",
            "schema_version": 1,
            "feature_key": "github-rest-contents-target-branch-guard",
            "title": "Fail-closed GitHub Contents target branch binding",
            "delivery_mode": "single_pr",
            "current_phase": "mvp",
            "scope": {
              "include": [
                "http-generic-api/routes/adminCliRoutes.js",
                "http-generic-api/test-github-rest-fallback-hardening.mjs",
                ".changes/e2e/github-rest-contents-target-branch-guard.json"
              ]
            },
            "merge_contract": {"minimum_phase": "mvp"},
            "phases": [
              {
                "id": "mvp",
                "status": "implemented",
                "objective": "Prevent a missing or stale requested work branch from falling back to the repository default branch during guarded GitHub Contents API writes.",
                "e2e_journeys": [
                  {
                    "id": "reject-default-branch-contents-fallback",
                    "end_to_end": True,
                    "level": "synthetic_runtime",
                    "actor": "governed repository administrator",
                    "entrypoint": "Admin CLI GitHub REST fallback contents PUT",
                    "terminal_outcome": "The mutation executes only against an existing governed non-protected branch at the exact expected head and returns same-cycle branch readback evidence.",
                    "steps": [
                      "Parse the guarded Contents API PUT request.",
                      "Require an explicit branch and expected_branch_sha.",
                      "Resolve the repository default branch and reject protected/default targets.",
                      "Read the requested branch ref and reject missing or stale identity.",
                      "Strip governance-only fields before the provider request.",
                      "Verify the resulting branch head equals the returned commit SHA."
                    ],
                    "assertions": [
                      "Omitted branch input cannot select the default branch.",
                      "A missing requested ref cannot fall back to main.",
                      "Protected and default branches are rejected.",
                      "Concurrent branch movement blocks before mutation.",
                      "Successful writes include exact same-cycle branch readback.",
                      "No Production, provider, credential, database, migration, deployment, force-push, or external-send authority is introduced."
                    ],
                    "tests": [
                      {
                        "id": "github-rest-contents-target-branch-guard",
                        "runner": "node",
                        "working_directory": "http-generic-api",
                        "path": "test-github-rest-fallback-hardening.mjs",
                        "args": []
                      }
                    ],
                    "evidence_paths": [
                      "http-generic-api/routes/adminCliRoutes.js",
                      "http-generic-api/test-github-rest-fallback-hardening.mjs",
                      ".changes/e2e/github-rest-contents-target-branch-guard.json"
                    ]
                  }
                ]
              },
              {"id": "operational", "status": "planned", "objective": "Observe governed non-protected Contents writes using exact branch identity."},
              {"id": "resilient", "status": "planned", "objective": "Exercise branch deletion, movement, and malformed provider readback races."},
              {"id": "canary", "status": "planned", "objective": "Validate the guard on a disposable repository branch without protected-ref mutation."},
              {"id": "production", "status": "planned", "objective": "Require the guard and server-side main protection before protected delivery."}
            ]
          }
          contract_path.write_text(json.dumps(contract, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate focused contract
        shell: bash
        run: |
          set -euo pipefail
          cd http-generic-api
          node --check routes/adminCliRoutes.js
          node test-github-rest-fallback-hardening.mjs
          cd ..
          node -e "JSON.parse(require('node:fs').readFileSync('.changes/e2e/github-rest-contents-target-branch-guard.json', 'utf8'))"
          git diff --check
          {
            echo '## Repository automation result'
            echo '- identity: exact'
            echo '- source patch: applied'
            echo '- syntax: passed'
            echo '- focused regression: passed'
            echo '- E2E contract JSON: passed'
            echo '- logs_consulted: false'
            echo '- secrets_included: false'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove bootstrap and publish bounded patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/bootstrap-github-contents-target-branch-guard.yml
          git add -A
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            ".changes/e2e/github-rest-contents-target-branch-guard.json"
            ".github/workflows/bootstrap-github-contents-target-branch-guard.yml"
            "http-generic-api/routes/adminCliRoutes.js"
            "http-generic-api/test-github-rest-fallback-hardening.mjs"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          git config user.name "mad4b-repository-automation"
          git config user.email "repository-automation@mad4b.com"
          git commit -m "fix(github): bind contents writes to exact work branch"
          git push origin HEAD:gpt/fix-contents-target-branch-guard-20260805
