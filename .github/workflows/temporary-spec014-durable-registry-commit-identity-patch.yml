name: Temporary Spec 014 Durable Registry Commit Identity Patch

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-spec014-durable-registry-commit-identity-patch.yml'
      - 'http-generic-api/hostingerStorageDurableAuthorizedInjectionState.js'

permissions:
  contents: write

concurrency:
  group: temporary-spec014-durable-registry-commit-identity-patch-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  patch-exact-head:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/014-hostinger/durable-registry-commit-identity-repair-20260802'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact writable feature branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact commit-identity patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('http-generic-api/hostingerStorageDurableAuthorizedInjectionState.js')
          text = path.read_text(encoding='utf-8')

          if "const COMMIT_RE = /^(?:[0-9a-f]{40}|[0-9a-f]{64})$/u;" not in text:
              anchor = "const SHA256_RE = /^[0-9a-f]{64}$/u;\n"
              replacement = anchor + "const COMMIT_RE = /^(?:[0-9a-f]{40}|[0-9a-f]{64})$/u;\n"
              if text.count(anchor) != 1:
                  raise SystemExit('SHA256 regex anchor drifted')
              text = text.replace(anchor, replacement, 1)

          if "function commit(value, field)" not in text:
              anchor = """function hash(value, field) {
            const normalized = text(value, 64).toLowerCase();
            if (!SHA256_RE.test(normalized)) {
              throw fail(400, 'STORAGE_DURABLE_INJECTION_HASH_INVALID', 'A lowercase SHA-256 binding is required.', { field });
            }
            return normalized;
          }
          """
              addition = anchor + """
          function commit(value, field) {
            const normalized = text(value, 64).toLowerCase();
            if (!COMMIT_RE.test(normalized)) {
              throw fail(400, 'STORAGE_DURABLE_INJECTION_COMMIT_INVALID', 'A lowercase Git object identity with 40 or 64 hexadecimal characters is required.', { field });
            }
            return normalized;
          }
          """
              if text.count(anchor) != 1:
                  raise SystemExit('hash validator anchor drifted')
              text = text.replace(anchor, addition, 1)

          replacements = {
              "source_commit: hash(evidence.source_commit, 'schema_verification.source_commit'),":
                  "source_commit: commit(evidence.source_commit, 'schema_verification.source_commit'),",
              "deployed_runtime_sha: hash(evidence.deployed_runtime_sha, 'schema_verification.deployed_runtime_sha'),":
                  "deployed_runtime_sha: commit(evidence.deployed_runtime_sha, 'schema_verification.deployed_runtime_sha'),",
          }
          for old, new in replacements.items():
              if new in text:
                  continue
              if text.count(old) != 1:
                  raise SystemExit(f'commit field anchor drifted: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Commit exact patch when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- http-generic-api/hostingerStorageDurableAuthorizedInjectionState.js; then
            echo 'Exact source patch already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add http-generic-api/hostingerStorageDurableAuthorizedInjectionState.js
          git commit -m 'fix(spec-014): align durable registry commit identity validation'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
