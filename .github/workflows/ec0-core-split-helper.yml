name: EC0 Core Split Helper

# Synchronize trigger after PR creation.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  split-and-sync:
    if: github.event.pull_request.head.ref == 'gpt/ec0-core-split-helper-20260730'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v5
        with:
          ref: gpt/ec0-core-split-helper-20260730
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Fetch current main
        run: git fetch origin main

      - name: Restore global registration authority from main
        run: |
          git checkout origin/main -- \
            http-generic-api/scripts/test-manifest.mjs \
            http-generic-api/frontend-surface-dispatch.generated.json
          git config user.name 'mad4b-governed-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            http-generic-api/scripts/test-manifest.mjs \
            http-generic-api/frontend-surface-dispatch.generated.json
          git commit -m 'refactor(spec-012): defer EC0 global test registration'

      - name: Merge current main baseline
        run: git merge --no-edit origin/main

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Verify EC0 core contract
        working-directory: http-generic-api
        run: |
          node --check contextKernel/domain/executionCapsule.js
          node --check contextKernel/application/executionCapsuleService.js
          node --check test-execution-capsule-contract.mjs
          node test-execution-capsule-contract.mjs
          node test-context-kernel-domain.mjs
          node test-context-kernel-application-use-cases.mjs
          node test-context-kernel-cross-tenant-isolation.mjs
          printf '%s\n' \
            'http-generic-api/contextKernel/application/executionCapsuleService.js' \
            'http-generic-api/contextKernel/application/index.js' \
            'http-generic-api/contextKernel/domain/executionCapsule.js' \
            'http-generic-api/contextKernel/domain/index.js' \
            'http-generic-api/test-execution-capsule-contract.mjs' \
            > "$RUNNER_TEMP/ec0-core-runtime-files.txt"
          node scripts/context-kernel-hardcoding-scan.mjs \
            --fail-on=runtime \
            --changed-files-from="$RUNNER_TEMP/ec0-core-runtime-files.txt"

      - name: Remove temporary workflows
        run: |
          git rm \
            .github/workflows/ec0-core-split-helper.yml \
            .github/workflows/ec0-core-sync-without-global-registration.yml

      - name: Commit clean helper branch
        run: |
          git commit -m 'chore: finalize EC0 core split helper'
          git push origin HEAD:gpt/ec0-core-split-helper-20260730
