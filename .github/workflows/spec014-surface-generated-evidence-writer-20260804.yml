name: Spec 014 Surface Generated Evidence Writer 20260804

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: spec014-surface-generated-evidence-writer-20260804-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate bounded Spec 014 Surface evidence
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/014-hostinger/surface-contract-generated-evidence-current-main-20260804-v1' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TARGET_BRANCH: gpt/014-hostinger/surface-contract-generated-evidence-current-main-20260804-v1
      BASE_SHA: c1806ef4d1a6fc5bf859a39162e47c1e58290081
      WRITER_PATH: .github/workflows/spec014-surface-generated-evidence-writer-20260804.yml
      MIGRATION_FILE: 20260802_03_spec014_hostinger_storage_execution_evidence.sql
      MIGRATION_SHA256: cf484d413399bbd3a0ea9ff36155ceb8b369e1bd43c63c300a93a179e0a57096
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Verify immutable PR identity and writer-only starting delta
        shell: bash
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_EVENT_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$HEAD_REF" = "$TARGET_BRANCH"
          test "$BASE_REF" = "main"
          test "$BASE_EVENT_SHA" = "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --name-only "$BASE_SHA" HEAD | sort > "$RUNNER_TEMP/initial-files.txt"
          printf '%s\n' "$WRITER_PATH" > "$RUNNER_TEMP/expected-initial-files.txt"
          diff -u "$RUNNER_TEMP/expected-initial-files.txt" "$RUNNER_TEMP/initial-files.txt"

      - name: Install deterministic repository dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm --prefix http-generic-api ci

      - name: Regenerate governed Surface evidence
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          node scripts/repo-maintenance-sync.mjs \
            --write \
            --skip-openapi-autofill \
            --skip-work-maps \
            --report-file "$RUNNER_TEMP/spec014-surface-maintenance-report.json"

      - name: Verify generated parity and focused regressions
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          node test-surface-contract-discovery.mjs
          node test-surface-contract-gap-triage.mjs
          node scripts/repo-maintenance-sync.mjs \
            --check \
            --skip-openapi-autofill \
            --skip-work-maps \
            --report-file "$RUNNER_TEMP/spec014-surface-maintenance-check.json"

      - name: Enforce semantic Spec 014 evidence contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const migrationFile = process.env.MIGRATION_FILE;
          const expectedSha = process.env.MIGRATION_SHA256;
          const queue = JSON.parse(fs.readFileSync('docs/surface-contract-gap-queue.json', 'utf8'));
          const status = JSON.parse(fs.readFileSync('docs/surface-contract-discovery-status.json', 'utf8'));
          const attestations = JSON.parse(fs.readFileSync('docs/surface-contract-safety-attestations.json', 'utf8'));
          const item = attestations.items.find((entry) => entry.migration_file === migrationFile);

          assert.equal(queue.ok, true);
          assert.equal(queue.schema_version, 'surface-contract-gap-queue-v1');
          assert.equal(status.ok, true);
          assert.equal(status.gap_queue.total_items, queue.total_items);
          assert.equal(JSON.stringify(queue).includes(migrationFile), false, 'Spec 014 migration remains in actionable gap queue');
          assert(item, 'checksum-bound Spec 014 attestation missing');
          assert.equal(item.migration_sha256, expectedSha);
          assert.equal(item.checksum_canonicalization, 'utf8_lf_v1');
          assert.equal(item.attestation_status, 'verified_static_no_external_side_effects');
          assert.equal(item.evidence_mode, 'checksum_bound_human_review');
          assert.equal(item.review_status, 'approved_checksum_bound_internal_sql');
          assert.equal(item.execution_authorized, false);
          for (const value of Object.values(item.safety || {})) assert.equal(value, false);
          for (const value of Object.values(item.safety_markers || {})) assert.equal(value, true);

          fs.writeFileSync(process.env.RUNNER_TEMP + '/spec014-surface-semantic-evidence.json', JSON.stringify({
            ok: true,
            base_sha: process.env.BASE_SHA,
            candidate_precommit_sha: process.env.GITHUB_SHA,
            migration_file: migrationFile,
            migration_sha256: item.migration_sha256,
            queue_total_items: queue.total_items,
            migration_absent_from_gap_queue: true,
            execution_authorized: false,
            provider_mutation: false,
            production_mutation: false,
            credential_access: false,
            database_mutation: false,
            external_write: false,
            secrets_included: false
          }, null, 2) + '\n');
          NODE

      - name: Enforce generated-file allowlist
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/allowed-files.txt" <<'EOF'
          Updating Registry Patch Index.md
          deployment_parity_checklist.md
          docs/ai-docs-agent-governance.md
          docs/auto-docs-agent/README.md
          docs/change-documentation-governance.md
          docs/surface-contract-discovery-status.json
          docs/surface-contract-discovery-status.md
          docs/surface-contract-gap-queue.json
          docs/surface-contract-gap-queue.md
          docs/surface-contract-gap-trends.json
          docs/surface-contract-gap-trends.md
          docs/surface-contract-gap-triage.json
          docs/surface-contract-gap-triage.md
          docs/surface-contract-governance-compact.json
          docs/surface-contract-governance-compact.md
          docs/surface-contract-governance-dashboard.json
          docs/surface-contract-governance-dashboard.md
          docs/surface-contract-safety-attestations.json
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/allowed-files.txt"
          sort -o "$RUNNER_TEMP/allowed-files.txt" "$RUNNER_TEMP/allowed-files.txt"
          git diff --name-only | sort > "$RUNNER_TEMP/generated-files.txt"
          test -s "$RUNNER_TEMP/generated-files.txt"
          comm -23 "$RUNNER_TEMP/generated-files.txt" "$RUNNER_TEMP/allowed-files.txt" > "$RUNNER_TEMP/outside-allowlist.txt"
          test ! -s "$RUNNER_TEMP/outside-allowlist.txt"

      - name: Commit generated evidence and remove one-shot writer
        shell: bash
        run: |
          set -euo pipefail
          git rm "$WRITER_PATH"
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(spec-014): refresh generated surface-contract evidence"
          git diff --name-only "$BASE_SHA" HEAD | sort > "$RUNNER_TEMP/final-files.txt"
          comm -23 "$RUNNER_TEMP/final-files.txt" "$RUNNER_TEMP/allowed-files.txt" > "$RUNNER_TEMP/final-outside-allowlist.txt"
          test ! -s "$RUNNER_TEMP/final-outside-allowlist.txt"
          test ! -e "$WRITER_PATH"
          git push origin "HEAD:$TARGET_BRANCH"
          git rev-parse HEAD > "$RUNNER_TEMP/final-head-sha.txt"

      - name: Upload bounded generation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec014-surface-generated-evidence-writer-20260804-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/spec014-surface-maintenance-report.json
            ${{ runner.temp }}/spec014-surface-maintenance-check.json
            ${{ runner.temp }}/spec014-surface-semantic-evidence.json
            ${{ runner.temp }}/initial-files.txt
            ${{ runner.temp }}/generated-files.txt
            ${{ runner.temp }}/outside-allowlist.txt
            ${{ runner.temp }}/final-files.txt
            ${{ runner.temp }}/final-outside-allowlist.txt
            ${{ runner.temp }}/final-head-sha.txt
          if-no-files-found: warn
          retention-days: 14
