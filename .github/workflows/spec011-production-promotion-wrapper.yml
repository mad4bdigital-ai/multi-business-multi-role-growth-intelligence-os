name: Spec 011 Governed Production Candidate Wrapper

on:
  push:
    branches:
      - gpt/spec011-production-promotion-wrapper-20260730
    paths:
      - .github/spec011-production-promotion-trigger.json

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: spec011-governed-production-candidate-wrapper
  cancel-in-progress: false

jobs:
  prepare-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_MAIN_SHA: 39edefde2c148649df90abb9f4d92cd7e460195f
      EXPECTED_PRODUCTION_SHA: fbcf77ae19738fcbd31211e874bfa315da83294e
      RELEASE_BRANCH: release/spec011-production-candidate-ae93d155-20260730
      VALIDATION_BRANCH: gpt/validate-production-candidate-spec011-ae93d155-20260730
      VALIDATION_BASE_BRANCH: gpt/validate-production-base-spec011-ae93d155-20260730
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v5
        with:
          ref: gpt/spec011-production-promotion-wrapper-20260730
          fetch-depth: 0
          persist-credentials: true

      - name: Build exact source-pinned candidate
        id: prepare
        shell: bash
        run: |
          set -euo pipefail

          require_sha() {
            local label="$1"
            local value="$2"
            if [[ ! "$value" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::$label must be an exact lowercase 40-character SHA"
              exit 1
            fi
          }
          require_sha EXPECTED_MAIN_SHA "$EXPECTED_MAIN_SHA"
          require_sha EXPECTED_PRODUCTION_SHA "$EXPECTED_PRODUCTION_SHA"

          for branch in "$RELEASE_BRANCH" "$VALIDATION_BRANCH" "$VALIDATION_BASE_BRANCH"; do
            git check-ref-format --branch "$branch" >/dev/null
            case "$branch" in main|Production|refs/*) echo "::error::protected branch target rejected"; exit 1;; esac
          done

          git fetch --prune --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          ACTUAL_MAIN="$(git rev-parse refs/remotes/origin/main)"
          ACTUAL_PRODUCTION="$(git rev-parse refs/remotes/origin/Production)"
          [[ "$ACTUAL_MAIN" == "$EXPECTED_MAIN_SHA" ]] || { echo "::error::main moved: expected $EXPECTED_MAIN_SHA actual $ACTUAL_MAIN"; exit 1; }
          [[ "$ACTUAL_PRODUCTION" == "$EXPECTED_PRODUCTION_SHA" ]] || { echo "::error::Production moved: expected $EXPECTED_PRODUCTION_SHA actual $ACTUAL_PRODUCTION"; exit 1; }

          for branch in "$RELEASE_BRANCH" "$VALIDATION_BRANCH" "$VALIDATION_BASE_BRANCH"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "::error::candidate branch already exists: $branch"
              exit 1
            fi
          done

          MAIN_TREE="$(git rev-parse "$ACTUAL_MAIN^{tree}")"
          CANDIDATE_DATE="$(git show -s --format=%cI "$ACTUAL_MAIN")"
          CANDIDATE_SHA="$(
            printf '%s\n\n%s\n%s\n%s\n' \
              'release: build governed Spec 011 Production promotion candidate' \
              "main=$ACTUAL_MAIN" \
              "production=$ACTUAL_PRODUCTION" \
              'tree_policy=exact_main_tree' |
            GIT_AUTHOR_NAME='mad4b-release-bot' \
            GIT_AUTHOR_EMAIL='mad4b-release-bot@users.noreply.github.com' \
            GIT_AUTHOR_DATE="$CANDIDATE_DATE" \
            GIT_COMMITTER_NAME='mad4b-release-bot' \
            GIT_COMMITTER_EMAIL='mad4b-release-bot@users.noreply.github.com' \
            GIT_COMMITTER_DATE="$CANDIDATE_DATE" \
            git commit-tree "$MAIN_TREE" -p "$ACTUAL_MAIN" -p "$ACTUAL_PRODUCTION"
          )"

          git diff --quiet "$ACTUAL_MAIN" "$CANDIDATE_SHA" || { echo "::error::candidate tree differs from pinned main"; exit 1; }
          git merge-base --is-ancestor "$ACTUAL_MAIN" "$CANDIDATE_SHA" || { echo "::error::candidate missing main ancestry"; exit 1; }
          git merge-base --is-ancestor "$ACTUAL_PRODUCTION" "$CANDIDATE_SHA" || { echo "::error::candidate missing Production ancestry"; exit 1; }

          git fetch --prune --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/Production:refs/remotes/origin/Production'
          [[ "$(git rev-parse refs/remotes/origin/main)" == "$ACTUAL_MAIN" ]] || { echo "::error::main moved during construction"; exit 1; }
          [[ "$(git rev-parse refs/remotes/origin/Production)" == "$ACTUAL_PRODUCTION" ]] || { echo "::error::Production moved during construction"; exit 1; }

          git push origin "$ACTUAL_MAIN:refs/heads/$VALIDATION_BASE_BRANCH"
          git push origin "$CANDIDATE_SHA:refs/heads/$RELEASE_BRANCH"
          git push origin "$CANDIDATE_SHA:refs/heads/$VALIDATION_BRANCH"

          [[ "$(git ls-remote --heads origin "refs/heads/$VALIDATION_BASE_BRANCH" | awk '{print $1}')" == "$ACTUAL_MAIN" ]] || exit 1
          [[ "$(git ls-remote --heads origin "refs/heads/$RELEASE_BRANCH" | awk '{print $1}')" == "$CANDIDATE_SHA" ]] || exit 1
          [[ "$(git ls-remote --heads origin "refs/heads/$VALIDATION_BRANCH" | awk '{print $1}')" == "$CANDIDATE_SHA" ]] || exit 1

          CANDIDATE_TREE="$(git rev-parse "$CANDIDATE_SHA^{tree}")"
          {
            echo "main_sha=$ACTUAL_MAIN"
            echo "production_sha=$ACTUAL_PRODUCTION"
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "candidate_tree=$CANDIDATE_TREE"
          } >> "$GITHUB_OUTPUT"

          jq -n \
            --arg main_sha "$ACTUAL_MAIN" \
            --arg production_sha "$ACTUAL_PRODUCTION" \
            --arg candidate_sha "$CANDIDATE_SHA" \
            --arg candidate_tree "$CANDIDATE_TREE" \
            --arg release_branch "$RELEASE_BRANCH" \
            --arg validation_branch "$VALIDATION_BRANCH" \
            --arg validation_base_branch "$VALIDATION_BASE_BRANCH" \
            '{schema_version:"spec011.production_promotion_candidate.v1",ok:true,main_sha:$main_sha,production_sha:$production_sha,candidate_sha:$candidate_sha,candidate_tree:$candidate_tree,release_branch:$release_branch,validation_branch:$validation_branch,validation_base_branch:$validation_base_branch,tree_policy:"exact_main_tree",merge_executed:false,deployment_executed:false,migration_executed:false,provider_call_executed:false,credential_payload_read:false,secrets_included:false}' \
            > "$RUNNER_TEMP/spec011-production-candidate.json"

      - name: Create governed release and validation PRs
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ steps.prepare.outputs.main_sha }}
          PRODUCTION_SHA: ${{ steps.prepare.outputs.production_sha }}
          CANDIDATE_SHA: ${{ steps.prepare.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-pr.md" <<EOF
          ## Governed source-pinned Spec 011 Production candidate

          - pinned main: \`$MAIN_SHA\`
          - pinned Production: \`$PRODUCTION_SHA\`
          - exact candidate: \`$CANDIDATE_SHA\`
          - tree policy: exact pinned-main tree

          This PR promotes Git ancestry only. It does not execute deployment, SQL, migrations, provider calls, credential reads, restarts, or external writes.

          Merge remains blocked until exact-candidate CI, Production freshness readback, and post-merge Hostinger/runtime verification.
          EOF
          cat > "$RUNNER_TEMP/validation-pr.md" <<EOF
          Temporary non-merge exact-candidate validation surface for \`$CANDIDATE_SHA\`.

          Candidate tree is identical to pinned main \`$MAIN_SHA\`; validation base is pinned to that same main SHA. Close without merge after successful exact-candidate evidence.

          No deployment, SQL, migration, provider, credential, restart, or Production mutation is authorized.
          EOF
          gh pr create --head "$RELEASE_BRANCH" --base Production --title "release: promote Spec 011 candidate ${CANDIDATE_SHA:0:8} to Production" --body-file "$RUNNER_TEMP/release-pr.md"
          gh pr create --head "$VALIDATION_BRANCH" --base "$VALIDATION_BASE_BRANCH" --title "ci: validate exact Spec 011 Production candidate ${CANDIDATE_SHA:0:8}" --body-file "$RUNNER_TEMP/validation-pr.md"

      - name: Persist non-secret evidence and remove wrapper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops-evidence
          cp "$RUNNER_TEMP/spec011-production-candidate.json" ops-evidence/spec011-production-candidate.json
          rm .github/workflows/spec011-production-promotion-wrapper.yml
          rm .github/spec011-production-promotion-trigger.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(spec-011): record governed Production candidate evidence"
          git push origin HEAD:gpt/spec011-production-promotion-wrapper-20260730

      - name: Upload candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: spec011-production-candidate-${{ steps.prepare.outputs.candidate_sha }}
          path: ${{ runner.temp }}/spec011-production-candidate.json
          if-no-files-found: error
          retention-days: 30
