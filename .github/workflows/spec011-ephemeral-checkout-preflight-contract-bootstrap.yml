name: Spec 011 Ephemeral Checkout Preflight Contract Bootstrap

on:
  push:
    branches:
      - gpt/spec011-ephemeral-checkout-preflight-contract-20260730
    paths:
      - .github/spec011-ephemeral-checkout-preflight-contract-trigger.json

permissions:
  contents: write

concurrency:
  group: spec011-ephemeral-checkout-preflight-contract-bootstrap
  cancel-in-progress: true

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gpt/spec011-ephemeral-checkout-preflight-contract-20260730
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install API dependencies
        working-directory: http-generic-api
        run: npm ci --ignore-scripts

      - name: Apply and validate exact preflight contract
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/spec011-ephemeral-checkout-preflight-bootstrap.py 2>&1 | tee "$RUNNER_TEMP/spec011-preflight-bootstrap.log"

      - name: Commit source-only patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(spec-011): approve exact ephemeral checkout enum preflight"
          git push origin HEAD:gpt/spec011-ephemeral-checkout-preflight-contract-20260730

      - name: Persist bounded bootstrap failure evidence
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops-evidence/spec011
          cp "$RUNNER_TEMP/spec011-preflight-bootstrap.log" ops-evidence/spec011/preflight-bootstrap-latest.log 2>/dev/null || \
            printf '%s\n' 'bootstrap failed before log creation' > ops-evidence/spec011/preflight-bootstrap-latest.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops-evidence/spec011/preflight-bootstrap-latest.log
          if ! git diff --cached --quiet; then
            git commit -m "evidence(spec-011): record preflight bootstrap failure"
            git push origin HEAD:gpt/spec011-ephemeral-checkout-preflight-contract-20260730
          fi
