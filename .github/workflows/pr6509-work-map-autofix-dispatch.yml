name: PR 6509 Work Map Autofix Dispatch

on:
  push:
    branches:
      - fix/transport-response-schema-promotion-readiness-v2-20260806
    paths:
      - .github/workflows/pr6509-work-map-autofix-dispatch.yml

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: pr6509-work-map-autofix-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_BRANCH: fix/transport-response-schema-promotion-readiness-v2-20260806
      EXPECTED_MAIN_SHA: b8eb2e303188163f134b6257958dc77ed69c8642
      PR_NUMBER: "6509"
      ONE_SHOT_PATH: .github/workflows/pr6509-work-map-autofix-dispatch.yml
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Pin branch, PR, and main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          remote_head="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${GITHUB_SHA}"
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          test "${current_main}" = "${EXPECTED_MAIN_SHA}"
          pr_file="${RUNNER_TEMP}/pr6509.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "${pr_file}"
          test "$(jq -r '.state' "${pr_file}")" = "open"
          test "$(jq -r '.base.ref' "${pr_file}")" = "main"
          test "$(jq -r '.base.sha' "${pr_file}")" = "${EXPECTED_MAIN_SHA}"
          test "$(jq -r '.head.repo.full_name' "${pr_file}")" = "${GITHUB_REPOSITORY}"
          test "$(jq -r '.head.ref' "${pr_file}")" = "${TARGET_BRANCH}"
          test "$(jq -r '.head.sha' "${pr_file}")" = "${GITHUB_SHA}"

      - name: Retire dispatcher and dispatch governed autofix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -- "${ONE_SHOT_PATH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${ONE_SHOT_PATH}"
          git commit -m "chore(pr6509): retire work map autofix dispatcher"

          remote_head="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${GITHUB_SHA}"
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          test "${current_main}" = "${EXPECTED_MAIN_SHA}"

          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          result_head="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${result_head}"

          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          test "${current_main}" = "${EXPECTED_MAIN_SHA}"
          pr_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          test "${pr_head}" = "${result_head}"

          gh workflow run spec-kit-work-map-autofix.yml \
            --ref "${TARGET_BRANCH}" \
            -f branch="${TARGET_BRANCH}" \
            -f expected_head_sha="${result_head}"
