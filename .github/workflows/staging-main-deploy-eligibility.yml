name: Staging Main Deploy Eligibility

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Governed Staging operation
        required: true
        default: eligibility
        type: choice
        options:
          - eligibility
          - deploy_activation_worker
      source_sha:
        description: Exact current main SHA for Activation Worker deployment
        required: false
        type: string
      confirmation:
        description: Type DEPLOY_STAGING_ACTIVATION_WORKER for Worker deployment
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: staging-main-deploy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  eligibility:
    name: Staging Main Deploy Eligibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_HEAD_SHA: ${{ github.sha }}
      EXPECTED_REF: ${{ github.ref_name }}
      EXPECTED_REPOSITORY: ${{ github.repository }}
      STAGING_DEPLOY_ONLY: "true"
    steps:
      - name: Checkout exact main event commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install root dependencies without lifecycle side effects
        run: npm ci --ignore-scripts

      - name: Install API dependencies without lifecycle side effects
        working-directory: http-generic-api
        run: npm ci --ignore-scripts

      - name: Verify exact main-only deployment identity
        run: |
          test "$EXPECTED_REF" = "main"
          test "$EXPECTED_REPOSITORY" = "mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$STAGING_DEPLOY_ONLY" = "true"

      - name: Verify Staging environment authority closure
        env:
          # Keep the generated report outside the checkout before derived-state closure.
          STAGING_AUTHORITY_REPORT_FILE: ${{ runner.temp }}/staging-environment-authority-closure/report.json
        run: >-
          node http-generic-api/scripts/staging-environment-authority-closure.mjs
          --expected-sha "$EXPECTED_HEAD_SHA"
          --report-file "$STAGING_AUTHORITY_REPORT_FILE"

      - name: Verify environment impact and migration compatibility closure
        env:
          ENVIRONMENT_IMPACT_REPORT_FILE: ${{ runner.temp }}/environment-impact-closure/report.json
        run: >-
          node http-generic-api/scripts/environment-impact-closure.mjs
          --head-sha "$EXPECTED_HEAD_SHA"
          --report-file "$ENVIRONMENT_IMPACT_REPORT_FILE"

      - name: Verify repository derived-state closure
        env:
          DERIVED_STATE_REPORT_FILE: ${{ runner.temp }}/staging-derived-state-closure/report.json
        run: >-
          node scripts/derived-state-closure.mjs
          --expected-sha "$EXPECTED_HEAD_SHA"
          --candidate-kind "exact_main"
          --report-file "$DERIVED_STATE_REPORT_FILE"

      - name: Verify canonical and Brand read-only contracts
        run: |
          node http-generic-api/test-canonical-business-operation-registry.mjs
          node http-generic-api/test-workspace-brand-create.mjs
          node http-generic-api/test-workspace-brand-create-operation-governance.mjs

      - name: Verify Staging topology and environment isolation
        run: |
          node http-generic-api/test-staging-autopilot-closure.mjs
          node http-generic-api/test-staging-environment-certification-contract.mjs
          node http-generic-api/test-staging-openapi-mcp-db-boundary.mjs
          node http-generic-api/test-staging-runtime-oauth-profile.mjs
          node http-generic-api/test-staging-three-db-topology.mjs
          node http-generic-api/test-domain-family-policy.mjs
          node http-generic-api/test-e2e-contract-reference-integrity.mjs
          node http-generic-api/scripts/test-configuration-drift-guard.mjs

      - name: Verify generated artifacts are current
        working-directory: http-generic-api
        run: |
          npm run frontend:dispatch:check
          npm run ci:path-guard

      - name: Verify remote MCP semantic inventory currentness
        run: |
          node scripts/remote-mcp-write-scope-semantic-currentness.mjs
          npm run write-scopes:inventory:test

      - name: Publish fail-closed eligibility evidence
        env:
          STAGING_AUTHORITY_REPORT_FILE: ${{ runner.temp }}/staging-environment-authority-closure/report.json
        run: |
          node --input-type=module - "$EXPECTED_REPOSITORY" "$EXPECTED_REF" "$EXPECTED_HEAD_SHA" "$STAGING_AUTHORITY_REPORT_FILE" <<'NODE'
          import fs from "node:fs";
          const [, , expectedRepository, expectedRef, expectedHeadSha, authorityReportFile] = process.argv;
          if (!expectedRepository || !expectedRef || !/^[0-9a-f]{40}$/u.test(expectedHeadSha || "")) {
            throw new Error("Exact staging evidence identity arguments are required");
          }
          const registry = JSON.parse(fs.readFileSync("http-generic-api/canonical-business-operation-registry.json", "utf8"));
          const parity = JSON.parse(fs.readFileSync("http-generic-api/canonical-business-operation-parity.generated.json", "utf8"));
          const authority = JSON.parse(fs.readFileSync(authorityReportFile, "utf8"));
          if (parity.safety?.production_mutation_allowed !== false) throw new Error("Production mutation safety gate is not false");
          if (authority.converged !== true || authority.safety?.read_only !== true) throw new Error("Staging environment authority closure did not converge read-only");
          const evidence = {
            contract: "mad4b.staging-main-deploy-eligibility.v2",
            repository: expectedRepository,
            ref: expectedRef,
            exact_head_sha: expectedHeadSha,
            derived_state_closure: true,
            remote_mcp_semantic_currentness: true,
            postmerge_observability_drift_blocking: false,
            environment_authority_closure: {
              contract: authority.contract,
              converged: authority.converged,
              source_fingerprints: authority.source_fingerprints,
              gateway_policy_hash: authority.gateway?.policy_hash || null,
              db_authority_contract_status: authority.db_authority?.contract_status || null,
              environment_contract_status: authority.environment_contract?.status || null
            },
            staging_deploy_only: true,
            production_deploy: false,
            database_mutation: false,
            migration_apply: false,
            provider_mutation: false,
            ruleset_mutation: false,
            secrets_included: false,
            canonical_operation_count: registry.operations.length,
            parity_performance_gates: parity.performance_gates,
            outcome: "eligible"
          };
          fs.mkdirSync(".artifacts/staging-main-deploy-eligibility", { recursive: true });
          fs.writeFileSync(".artifacts/staging-main-deploy-eligibility/evidence.json", `${JSON.stringify(evidence, null, 2)}\n`);
          console.log(JSON.stringify(evidence));
          NODE

      - name: Upload eligibility evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-main-deploy-eligibility-${{ github.sha }}
          path: .artifacts/staging-main-deploy-eligibility/evidence.json
          if-no-files-found: error
          retention-days: 30

  deploy_activation_worker:
    name: Deploy exact main SHA to Staging Worker
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy_activation_worker' }}
    needs: eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      CONFIRMATION: ${{ inputs.confirmation }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_NAME: mad4b-activation-gateway-staging
      PUBLIC_HEALTH_URL: https://activation-dev.mad4b.com/health
      ARTIFACT_DIR: .artifacts/activation-gateway-staging
      WRANGLER_VERSION: "4.99.0"
    steps:
      - name: Validate explicit Staging-only authority
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "DEPLOY_STAGING_ACTIVATION_WORKER"
          test "$SOURCE_SHA" = "${SOURCE_SHA,,}"
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Checkout exact authorized commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Verify Cloudflare Worker API authority
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 20 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" || true)"
          if test "$status" != "200" || ! jq -e '.success == true' "$response_file" >/dev/null 2>&1; then
            jq -c '{success, errors: [.errors[]? | {code, message}], messages: [.messages[]? | {code, message}]}' "$response_file" || true
            echo "::error::Cloudflare Worker API authority preflight failed (HTTP $status). Check CLOUDFLARE_API_TOKEN, its account scope, and Workers Scripts Edit permission."
            exit 1
          fi
          echo "Cloudflare Worker API authority preflight passed."

      - name: Build signed exact-SHA Worker artifact
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/build-staging-worker.mjs \
            --source-sha="$SOURCE_SHA" \
            --output-dir="$ARTIFACT_DIR" \
            --lifetime-hours=168
          jq -e --arg sha "$SOURCE_SHA" '
            .contract == "mad4b.staging.activation-recovery-origin-trust.v1"
            and .source_commit == $sha
            and .worker_build_sha == $sha
            and .gateway_host == "activation-dev.mad4b.com"
            and .canonical_host == "activation-dev.mad4b.com"
            and .audience == "https://dev.mad4b.com"
            and .issuer == "https://activation-dev.mad4b.com"
            and (.key_id | type == "string" and length >= 16)
            and (.public_key_pem_escaped | startswith("-----BEGIN PUBLIC KEY-----\\n"))
            and .trusted_ingress_mode == "signature"
            and .strip_caller_headers == true
            and .replay_store_scope == "single_filesystem"
            and .secrets_included == false
            and ([keys[] | select(test("private|secret"; "i"))] | length == 0)
          ' "$ARTIFACT_DIR/origin-trust.json" >/dev/null

      - name: Verify pinned Wrangler deployment capability
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" --version
          npx --yes "wrangler@$WRANGLER_VERSION" deploy --help | grep -q -- '--secrets-file'

      - name: Deploy Staging Worker and bound secrets
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f "$ARTIFACT_DIR/deployment-secrets.json"' EXIT
          npx --yes "wrangler@$WRANGLER_VERSION" deploy "$ARTIFACT_DIR/worker-staging.mjs" \
            --name "$WORKER_NAME" \
            --compatibility-date 2026-08-31 \
            --secrets-file "$ARTIFACT_DIR/deployment-secrets.json"
          rm -f "$ARTIFACT_DIR/deployment-secrets.json"

      - name: Verify public exact-SHA health readback
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          for attempt in {1..12}; do
            status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 20 "$PUBLIC_HEALTH_URL" || true)"
            if test "$status" = "200" \
              && jq -e --arg sha "$SOURCE_SHA" '
                .ok == true
                and .stale == false
                and .sourceCommit == $sha
                and .workerBuildSha == $sha
                and .secretsIncluded == false
              ' "$response_file" >/dev/null; then
              jq '{ok, service, policyKey, policyHash, deploymentId, sourceCommit, workerBuildSha, workerBundleSha256, stale, secretsIncluded}' "$response_file"
              exit 0
            fi
            sleep 5
          done
          jq '{ok, service, policyKey, policyHash, deploymentId, sourceCommit, workerBuildSha, workerBundleSha256, stale, secretsIncluded}' "$response_file" || true
          exit 1

      - name: Upload deployed Recovery origin trust
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-activation-origin-trust-${{ inputs.source_sha }}
          path: ${{ env.ARTIFACT_DIR }}/origin-trust.json
          if-no-files-found: error
          retention-days: 30

      - name: Record non-secret deployment summary
        if: always()
        shell: bash
        run: |
          {
            printf '%s\n' '### Staging Activation Worker'
            printf -- '- source SHA: `%s`\n' "$SOURCE_SHA"
            printf -- '- Worker: `%s`\n' "$WORKER_NAME"
            printf '%s\n' '- Recovery origin trust artifact: `public-key-only`'
            printf '%s\n' '- Production deployment: `false`'
            printf '%s\n' '- Database mutation: `false`'
            printf '%s\n' '- secrets included in summary: `false`'
          } >> "$GITHUB_STEP_SUMMARY"
