name: Workspace Lifecycle Clean Rebuild Bootstrap

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: workspace-lifecycle-clean-rebuild-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'gpt/workspace-lifecycle-mutation-clean-main-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout clean target branch
        uses: actions/checkout@v5
        with:
          ref: gpt/workspace-lifecycle-mutation-clean-main-20260730
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Copy reviewed permanent Workspace files
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA='64b9df146b5d6b5d23d96a04f7393c6002c84a49'
          git fetch origin "$SOURCE_SHA"
          git checkout "$SOURCE_SHA" -- \
            http-generic-api/openapi/workspace-lifecycle-mutations.openapi.yaml \
            http-generic-api/resource-api-mutation-callability.manifest.json \
            http-generic-api/routes/tenantLifecycleRoutes.js \
            http-generic-api/scripts/resource-api-callability-contracts.mjs \
            http-generic-api/test-resource-api-coverage.mjs \
            http-generic-api/test-surface-contract-discovery.mjs \
            http-generic-api/test-workspace-lifecycle-foundation.mjs
          rm -f .github/workflows/workspace-lifecycle-mutation-bootstrap.yml

      - name: Verify bounded write set
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/workspace-lifecycle-mutation-bootstrap.yml',
              'http-generic-api/openapi/workspace-lifecycle-mutations.openapi.yaml',
              'http-generic-api/resource-api-mutation-callability.manifest.json',
              'http-generic-api/routes/tenantLifecycleRoutes.js',
              'http-generic-api/scripts/resource-api-callability-contracts.mjs',
              'http-generic-api/test-resource-api-coverage.mjs',
              'http-generic-api/test-surface-contract-discovery.mjs',
              'http-generic-api/test-workspace-lifecycle-foundation.mjs',
          }
          changed = set(filter(None, subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()))
          paths = {line[3:] for line in changed}
          extra = sorted(paths - allowed)
          missing = sorted(allowed - paths)
          if extra:
              raise SystemExit(f'unexpected_write_set:{extra}')
          if missing:
              raise SystemExit(f'incomplete_write_set:{missing}')
          generated = {
              'http-generic-api/frontend-surface-dispatch.generated.json',
              'http-generic-api/openapi/frontend-runtime-routes.generated.yaml',
          }
          if paths & generated:
              raise SystemExit('generated_evidence_must_be_refreshed_by_repository_authority')
          print({'bounded_write_set': True, 'changed_files': sorted(paths)})
          PY

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Verify Workspace mutation contracts
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          node --check routes/tenantLifecycleRoutes.js
          node --check scripts/resource-api-callability-contracts.mjs
          node test-workspace-lifecycle-foundation.mjs
          node test-resource-api-coverage.mjs
          node test-openapi-route-coverage.mjs
          node test-surface-contract-discovery.mjs

      - name: Commit clean permanent repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'mad4b-workspace-bootstrap'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            .github/workflows/workspace-lifecycle-mutation-bootstrap.yml \
            http-generic-api/openapi/workspace-lifecycle-mutations.openapi.yaml \
            http-generic-api/resource-api-mutation-callability.manifest.json \
            http-generic-api/routes/tenantLifecycleRoutes.js \
            http-generic-api/scripts/resource-api-callability-contracts.mjs \
            http-generic-api/test-resource-api-coverage.mjs \
            http-generic-api/test-surface-contract-discovery.mjs \
            http-generic-api/test-workspace-lifecycle-foundation.mjs
          git diff --cached --quiet && { echo 'No bounded repair changes to commit.'; exit 1; }
          git commit -m 'fix(workspace): rebuild lifecycle mutation callability on current main'
          git push origin HEAD:gpt/workspace-lifecycle-mutation-clean-main-20260730
