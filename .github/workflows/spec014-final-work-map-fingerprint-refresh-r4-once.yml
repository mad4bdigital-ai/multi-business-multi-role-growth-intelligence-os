name: Spec 014 Final Work Map Fingerprint Refresh R4 Once

on:
  push:
    branches:
      - chore/spec014-wave1-runtime-evidence-cleanup-20260804
    paths:
      - .github/workflows/spec014-final-work-map-fingerprint-refresh-r4-once.yml

permissions:
  actions: write
  contents: write

concurrency:
  group: spec014-final-work-map-fingerprint-refresh-r4-once
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_BRANCH: chore/spec014-wave1-runtime-evidence-cleanup-20260804
      R3_WORKFLOW: .github/workflows/spec014-final-work-map-fingerprint-refresh-r3-once.yml
      R4_WORKFLOW: .github/workflows/spec014-final-work-map-fingerprint-refresh-r4-once.yml
      HOSTINGER_MANIFEST: specs/014-governed-hostinger-storage-orchestration/work-map-integration.json
      HOSTINGER_TASKS: specs/014-governed-hostinger-storage-orchestration/tasks.md
      RETAIL_MANIFEST: specs/014-retail-commerce-operations-growth-os/work-map-integration.json
    steps:
      - name: Initialize bounded evidence
        shell: bash
        run: |
          set -euo pipefail
          report_dir="${RUNNER_TEMP}/spec014-final-work-map-fingerprint-refresh-r4"
          rm -rf "${report_dir}"
          mkdir -p "${report_dir}"
          echo "REPORT_DIR=${report_dir}" >> "${GITHUB_ENV}"

      - name: Checkout exact trigger head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Validate exact candidate and remove temporary surfaces
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          remote_head="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${GITHUB_SHA}"
          test -f "${R3_WORKFLOW}"
          test -f "${R4_WORKFLOW}"
          git rm "${R3_WORKFLOW}" "${R4_WORKFLOW}"
          test ! -e "${R3_WORKFLOW}"
          test ! -e "${R4_WORKFLOW}"

      - name: Build deterministic Retail binding refresher
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/refresh-retail-binding.mjs" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';
          const root = process.cwd();
          const governance = await import(pathToFileURL(path.join(root, 'http-generic-api/scripts/spec-kit-work-map-governance-gate.mjs')));
          const classificationModule = await import(pathToFileURL(path.join(root, 'http-generic-api/scripts/work-map-schema-classification.mjs')));
          const { baseRegistry, effectiveRegistry } = governance.buildEffectiveWorkMapRegistry({ root });
          const classification = classificationModule.validateSchemaClassification({ root });
          if (!classification.ok || classification.unresolved.length !== 0 || classification.classification_coverage_percent !== 100) {
            throw new Error(`Schema classification is not ready: ${JSON.stringify(classification.findings)}`);
          }
          if (effectiveRegistry.fingerprint !== baseRegistry.fingerprint) {
            throw new Error(`Canonical/effective fingerprint mismatch: ${baseRegistry.fingerprint} != ${effectiveRegistry.fingerprint}`);
          }
          if (!/^[0-9a-f]{64}$/.test(effectiveRegistry.schema_classification_fingerprint || '')) {
            throw new Error('Schema classification overlay fingerprint is missing');
          }
          const manifestPath = path.join(root, process.env.RETAIL_MANIFEST);
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          if (manifest.feature_key !== '014-retail-commerce-operations-growth-os' || manifest.review_state !== 'ready_for_implementation') {
            throw new Error('Retail manifest identity or state is invalid');
          }
          manifest.registry = {
            fingerprint: effectiveRegistry.fingerprint,
            index_source_hash: effectiveRegistry.signature.index_source_hash,
            coverage_source_hash: effectiveRegistry.signature.coverage_source_hash,
            map_count: effectiveRegistry.maps.length,
            domain_count: effectiveRegistry.domains.length,
            uncategorized_count: effectiveRegistry.uncategorized_objects.length,
            taxonomy_gap_cluster_count: effectiveRegistry.taxonomy_gap_clusters.length
          };
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          console.log(JSON.stringify({
            ok: true,
            canonical_fingerprint: manifest.registry.fingerprint,
            schema_classification_fingerprint: effectiveRegistry.schema_classification_fingerprint,
            changed_files: [process.env.RETAIL_MANIFEST],
            secrets_included: false
          }, null, 2));
          NODE
          node --check "${RUNNER_TEMP}/refresh-retail-binding.mjs"

      - name: Refresh canonical bindings and prove idempotency
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs | tee "${REPORT_DIR}/hostinger-first.json"
          node "${RUNNER_TEMP}/refresh-retail-binding.mjs" | tee "${REPORT_DIR}/retail-first.json"
          first_hash="$(git diff --binary -- "${R3_WORKFLOW}" "${R4_WORKFLOW}" "${HOSTINGER_MANIFEST}" "${HOSTINGER_TASKS}" "${RETAIL_MANIFEST}" | sha256sum | awk '{print $1}')"
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs | tee "${REPORT_DIR}/hostinger-second.json"
          node "${RUNNER_TEMP}/refresh-retail-binding.mjs" | tee "${REPORT_DIR}/retail-second.json"
          second_hash="$(git diff --binary -- "${R3_WORKFLOW}" "${R4_WORKFLOW}" "${HOSTINGER_MANIFEST}" "${HOSTINGER_TASKS}" "${RETAIL_MANIFEST}" | sha256sum | awk '{print $1}')"
          test "${first_hash}" = "${second_hash}"
          test -n "$(git diff --name-only -- "${HOSTINGER_MANIFEST}")"
          test -n "$(git diff --name-only -- "${RETAIL_MANIFEST}")"
          while IFS= read -r file; do
            case "${file}" in
              "${R3_WORKFLOW}"|"${R4_WORKFLOW}"|"${HOSTINGER_MANIFEST}"|"${HOSTINGER_TASKS}"|"${RETAIL_MANIFEST}") ;;
              *) echo "Unexpected generated write: ${file}" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only)
          git diff --check
          node http-generic-api/scripts/spec-kit-work-map-integration-gate.mjs > "${REPORT_DIR}/direct-integration-gate.json"
          node http-generic-api/scripts/spec-kit-work-map-governance-gate.mjs --all > "${REPORT_DIR}/governance-gate.json"
          node http-generic-api/test-spec-kit-work-map-governance-gate.mjs > "${REPORT_DIR}/fingerprint-separation-regression.txt"

      - name: Commit final tree and push fast-forward
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git add -- "${HOSTINGER_MANIFEST}" "${HOSTINGER_TASKS}" "${RETAIL_MANIFEST}"
          while IFS= read -r file; do
            case "${file}" in
              "${R3_WORKFLOW}"|"${R4_WORKFLOW}"|"${HOSTINGER_MANIFEST}"|"${HOSTINGER_TASKS}"|"${RETAIL_MANIFEST}") ;;
              *) echo "Unexpected staged write: ${file}" >&2; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(spec014): align canonical Work Map fingerprints'
          result_head="$(git rev-parse HEAD)"
          node http-generic-api/scripts/spec-kit-work-map-integration-gate.mjs > "${REPORT_DIR}/postcommit-direct-integration-gate.json"
          node http-generic-api/scripts/spec-kit-work-map-governance-gate.mjs --all > "${REPORT_DIR}/postcommit-governance-gate.json"
          remote_head="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${GITHUB_SHA}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          pushed_head="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${pushed_head}" = "${result_head}"
          test ! -e "${R3_WORKFLOW}"
          test ! -e "${R4_WORKFLOW}"
          printf '%s\n' "${result_head}" > "${REPORT_DIR}/result-head.txt"
          echo "result_head=${result_head}" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact-head verification
        if: steps.publish.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_HEAD: ${{ steps.publish.outputs.result_head }}
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${RESULT_HEAD}"
          gh workflow run 263500856 --ref "${TARGET_BRANCH}"
          gh workflow run 324954412 --ref "${TARGET_BRANCH}"
          gh workflow run 324182937 --ref "${TARGET_BRANCH}"
          gh workflow run 325669872 --ref "${TARGET_BRANCH}"
          gh workflow run 324252162 --ref "${TARGET_BRANCH}"

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec014-final-work-map-fingerprint-refresh-r4-${{ github.run_id }}
          path: ${{ runner.temp }}/spec014-final-work-map-fingerprint-refresh-r4/
          if-no-files-found: warn
          retention-days: 30
