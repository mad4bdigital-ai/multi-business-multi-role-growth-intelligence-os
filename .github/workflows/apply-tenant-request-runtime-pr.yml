name: Apply tenant request runtime PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/apply-tenant-request-runtime-pr.yml
      - .github/scripts/apply-tenant-request-runtime-once.py
      - .github/workflows/apply-tenant-request-runtime-once.yml

permissions:
  contents: write

concurrency:
  group: tenant-request-runtime-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'gpt/tenant-request-inbox-chunk-store-hardening-20260801'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json
      - name: Apply exact runtime patch
        run: python .github/scripts/apply-tenant-request-runtime-once.py
      - name: Install locked dependencies
        working-directory: http-generic-api
        run: npm ci --ignore-scripts
      - name: Validate runtime patch
        run: |
          node --check http-generic-api/supportTicketResolutionService.js
          node --check http-generic-api/routes/supportTicketRoutes.js
          node --check http-generic-api/governedToolResponseChunkStore.js
          node --check http-generic-api/routes/gptToolsRoutes.js
          node http-generic-api/test-tenant-request-inbox-and-chunk-hardening.mjs
          node http-generic-api/test-governed-tool-response-chunk-store.mjs
          node http-generic-api/test-gpt-tools-response-chunking.mjs
      - name: Commit permanent runtime files only
        shell: bash
        run: |
          set -euo pipefail
          git add \
            http-generic-api/supportTicketResolutionService.js \
            http-generic-api/routes/supportTicketRoutes.js \
            http-generic-api/governedToolResponseChunkStore.js \
            http-generic-api/routes/gptToolsRoutes.js \
            http-generic-api/test-gpt-tools-response-chunking.mjs
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(tenant-requests): wire inbox and harden chunk fallback"
          git push origin HEAD:gpt/tenant-request-inbox-chunk-store-hardening-20260801
