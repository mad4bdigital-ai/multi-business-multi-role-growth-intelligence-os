name: One-shot Runtime Parity Work Map Repair

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]
    paths:
      - .github/workflows/runtime-parity-work-map-arm-repair.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: runtime-parity-work-map-repair-pr-5985
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.event.pull_request.number == 5985 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/add-runtime-parity-comment-bridge-v2-20260804' &&
      github.event.pull_request.base.ref == 'main' &&
      github.actor == 'mad4bdigital-ai'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_BRANCH: gpt/add-runtime-parity-comment-bridge-v2-20260804
      EXPECTED_PARENT_SHA: 6f655da7905a414e0bd80070eac70896aae0fbdd
      REPAIR_PATH: .github/workflows/runtime-parity-work-map-arm-repair.yml

    steps:
      - name: Checkout exact repair request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Pin request and synchronize current main locally
        shell: bash
        run: |
          set -Eeuo pipefail
          current_sha="$(git rev-parse HEAD)"
          parent_sha="$(git rev-parse HEAD^)"
          remote_sha="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${parent_sha}" = "${EXPECTED_PARENT_SHA}"
          test "${remote_sha}" = "${current_sha}"

          mapfile -t request_files < <(git diff --name-only "${EXPECTED_PARENT_SHA}..HEAD")
          test "${#request_files[@]}" = 1
          test "${request_files[0]}" = "${REPAIR_PATH}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          echo "PINNED_MAIN_SHA=${main_sha}" >> "${GITHUB_ENV}"
          echo "REPAIR_REQUEST_SHA=${current_sha}" >> "${GITHUB_ENV}"

          if ! git merge-base --is-ancestor "${main_sha}" HEAD; then
            git merge --no-edit origin/main
          fi
          git merge-base --is-ancestor "${main_sha}" HEAD

          actual_scope="$(git diff --name-only origin/main...HEAD | sort)"
          expected_scope="$(printf '%s\n' \
            '.changes/e2e/production-runtime-parity-comment-bridge.json' \
            '.github/workflows/production-runtime-parity-comment-bridge.yml' \
            '.github/workflows/runtime-parity-work-map-arm-repair.yml' \
            'http-generic-api/scripts/test-production-runtime-parity-comment-bridge.mjs' | sort)"
          test "${actual_scope}" = "${expected_scope}"

      - name: Generate maps from final workflow inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm -- "${REPAIR_PATH}"
          test ! -e "${REPAIR_PATH}"

          node --check http-generic-api/scripts/platform-work-map-generator.mjs
          node --check http-generic-api/scripts/platform-work-map-schema-intelligence.mjs
          node http-generic-api/scripts/platform-work-map-generator.mjs --write

          unexpected="$(git status --short | awk '{print $2}' | grep -Ev '^(docs/work-maps/|\.github/workflows/runtime-parity-work-map-arm-repair\.yml$)' || true)"
          test -z "${unexpected}"
          first_hash="$(git diff --binary -- docs/work-maps | sha256sum | awk '{print $1}')"
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          second_hash="$(git diff --binary -- docs/work-maps | sha256sum | awk '{print $1}')"
          test "${first_hash}" = "${second_hash}"
          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          test -n "$(git diff --name-only -- docs/work-maps)"

          git restore --source="${REPAIR_REQUEST_SHA}" --staged --worktree -- "${REPAIR_PATH}"
          test -f "${REPAIR_PATH}"
          unexpected_after_restore="$(git status --short | awk '{print $2}' | grep -Ev '^docs/work-maps/' || true)"
          test -z "${unexpected_after_restore}"

      - name: Commit and push bounded map repair
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${PINNED_MAIN_SHA}"
          remote_sha="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_sha}" = "${REPAIR_REQUEST_SHA}"

          changed="$(git status --short)"
          printf '%s\n' "${changed}"
          test -n "${changed}"
          unexpected="$(git status --short | awk '{print $2}' | grep -Ev '^docs/work-maps/' || true)"
          test -z "${unexpected}"

          git add -- docs/work-maps
          git diff --cached --quiet && {
            echo 'Expected generated Work Map changes.' >&2
            exit 1
          }
          git commit -m 'docs(work-maps): regenerate runtime parity bridge maps'
          result_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          test "$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${result_sha}"
          echo "result_sha=${result_sha}" >> "${GITHUB_OUTPUT}"

      - name: Publish bounded repair evidence
        if: always()
        shell: bash
        env:
          RESULT_SHA: ${{ steps.publish.outputs.result_sha }}
        run: |
          set -Eeuo pipefail
          outcome=passed
          maps_exclude_temporary_workflow=true
          if [[ "${{ job.status }}" != success ]]; then
            outcome=blocked
            maps_exclude_temporary_workflow=false
          fi
          evidence="WORK_MAP_REPAIR outcome=${outcome} request_sha=${REPAIR_REQUEST_SHA:-unresolved} result_sha=${RESULT_SHA:-unresolved} pinned_main_sha=${PINNED_MAIN_SHA:-unresolved} maps_exclude_temporary_workflow=${maps_exclude_temporary_workflow} temporary_workflow_removed=false protected_branch_mutation=false production_mutation=false force_push=false secrets_included=false"
          {
            echo '## Work Map repair'
            echo
            printf '`%s`\n' "${evidence}"
          } >> "${GITHUB_STEP_SUMMARY}"
