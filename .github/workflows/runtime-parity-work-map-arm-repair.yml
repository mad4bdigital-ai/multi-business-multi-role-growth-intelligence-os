name: One-shot Runtime Parity Work Map ARM Repair

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]
    paths:
      - .github/workflows/runtime-parity-work-map-arm-repair.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: runtime-parity-work-map-arm-repair-pr-5985
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.pull_request.number == 5985 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/add-runtime-parity-comment-bridge-v2-20260804' &&
      github.event.pull_request.base.ref == 'main' &&
      github.actor == 'mad4bdigital-ai'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      TARGET_BRANCH: gpt/add-runtime-parity-comment-bridge-v2-20260804
      EXPECTED_PARENT_SHA: 615ef2a607d5e5ac2a2c1f3456fb32f0a71b8cc9
      REPAIR_PATH: .github/workflows/runtime-parity-work-map-arm-repair.yml
      PR_NUMBER: '5985'

    steps:
      - name: Checkout exact repair request head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Pin branch, parent, scope, and current main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          current_sha="$(git rev-parse HEAD)"
          parent_sha="$(git rev-parse HEAD^)"
          remote_sha="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${parent_sha}" = "${EXPECTED_PARENT_SHA}"
          test "${remote_sha}" = "${current_sha}"

          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          if ! git merge-base --is-ancestor "${main_sha}" HEAD; then
            echo "::error::Protected main ${main_sha} is not an ancestor of repair request ${current_sha}."
            exit 1
          fi
          echo "PINNED_MAIN_SHA=${main_sha}" >> "${GITHUB_ENV}"
          echo "REPAIR_REQUEST_SHA=${current_sha}" >> "${GITHUB_ENV}"

          mapfile -t request_files < <(git diff --name-only "${EXPECTED_PARENT_SHA}..HEAD")
          test "${#request_files[@]}" = 1
          test "${request_files[0]}" = "${REPAIR_PATH}"

          actual_scope="$(git diff --name-only origin/main...HEAD | sort)"
          expected_scope="$(printf '%s\n' \
            '.changes/e2e/production-runtime-parity-comment-bridge.json' \
            '.github/workflows/production-runtime-parity-comment-bridge.yml' \
            '.github/workflows/runtime-parity-work-map-arm-repair.yml' \
            'http-generic-api/scripts/test-production-runtime-parity-comment-bridge.mjs' | sort)"
          test "${actual_scope}" = "${expected_scope}"

          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r '.state' <<<"${pr}")" = open
          test "$(jq -r '.draft' <<<"${pr}")" = false
          test "$(jq -r '.base.ref' <<<"${pr}")" = main
          test "$(jq -r '.head.repo.full_name' <<<"${pr}")" = "${GITHUB_REPOSITORY}"
          test "$(jq -r '.head.ref' <<<"${pr}")" = "${TARGET_BRANCH}"
          test "$(jq -r '.head.sha' <<<"${pr}")" = "${current_sha}"

      - name: Remove one-shot workflow before generation
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm -- "${REPAIR_PATH}"
          test ! -e "${REPAIR_PATH}"

      - name: Regenerate Work Maps and prove idempotency
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check http-generic-api/scripts/platform-work-map-generator.mjs
          node --check http-generic-api/scripts/platform-work-map-schema-intelligence.mjs
          node http-generic-api/scripts/platform-work-map-generator.mjs --write

          unexpected="$(git diff --name-only | grep -Ev '^(docs/work-maps/|\.github/workflows/runtime-parity-work-map-arm-repair\.yml$)' || true)"
          test -z "${unexpected}"
          first_hash="$(git diff --binary -- docs/work-maps | sha256sum | awk '{print $1}')"
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          second_hash="$(git diff --binary -- docs/work-maps | sha256sum | awk '{print $1}')"
          test "${first_hash}" = "${second_hash}"
          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          test -n "$(git diff --name-only -- docs/work-maps)"

      - name: Commit and push bounded repair
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${PINNED_MAIN_SHA}"
          remote_sha="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_sha}" = "${REPAIR_REQUEST_SHA}"

          changed="$(git status --short)"
          printf '%s\n' "${changed}"
          unexpected="$(git status --short | awk '{print $2}' | grep -Ev '^(docs/work-maps/|\.github/workflows/runtime-parity-work-map-arm-repair\.yml$)' || true)"
          test -z "${unexpected}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- docs/work-maps "${REPAIR_PATH}"
          git commit -m 'docs(work-maps): regenerate runtime parity bridge maps'
          result_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          test "$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${result_sha}"
          echo "result_sha=${result_sha}" >> "${GITHUB_OUTPUT}"

      - name: Publish bounded repair evidence
        if: always()
        shell: bash
        env:
          RESULT_SHA: ${{ steps.publish.outputs.result_sha }}
        run: |
          set -Eeuo pipefail
          outcome=passed
          removed=true
          if [[ "${{ job.status }}" != success ]]; then
            outcome=blocked
            removed=false
          fi
          evidence="WORK_MAP_ARM_REPAIR outcome=${outcome} request_sha=${REPAIR_REQUEST_SHA:-unresolved} result_sha=${RESULT_SHA:-unresolved} pinned_main_sha=${PINNED_MAIN_SHA:-unresolved} temporary_workflow_removed=${removed} protected_branch_mutation=false production_mutation=false force_push=false secrets_included=false"
          {
            echo '## Work Map ARM repair'
            echo
            printf '`%s`\n' "${evidence}"
          } >> "${GITHUB_STEP_SUMMARY}"
