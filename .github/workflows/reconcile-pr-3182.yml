name: Reconcile PR 3182

on:
  push:
    branches:
      - gpt/reconcile-pr-3182-20260730-v2
    paths:
      - .github/workflows/reconcile-pr-3182.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-pr-3182-v2
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_MAIN_SHA: 06fc67be48816d5c1725427ea79625edeab38a27
      SOURCE_REF: origin/gpt/restore-post-merge-verification-20260727
      TARGET_REF: gpt/reconcile-pr-3182-20260730-v2
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v5
        with:
          ref: gpt/reconcile-pr-3182-20260730-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Guard pinned main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/main:refs/remotes/origin/main
          ACTUAL_MAIN_SHA="$(git rev-parse origin/main)"
          MERGE_BASE_SHA="$(git merge-base HEAD origin/main)"
          test "$ACTUAL_MAIN_SHA" = "$EXPECTED_MAIN_SHA" || {
            echo "::error::main moved before reconciliation: expected=$EXPECTED_MAIN_SHA actual=$ACTUAL_MAIN_SHA"
            exit 1
          }
          test "$MERGE_BASE_SHA" = "$EXPECTED_MAIN_SHA" || {
            echo "::error::reconciliation branch is not based on pinned main: merge_base=$MERGE_BASE_SHA"
            exit 1
          }

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Reapply final semantic changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/gpt/restore-post-merge-verification-20260727:refs/remotes/origin/gpt/restore-post-merge-verification-20260727
          python3 <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import tempfile

          source_ref = os.environ["SOURCE_REF"]
          expected_main = os.environ["EXPECTED_MAIN_SHA"]
          base_ref = subprocess.check_output(
              ["git", "merge-base", expected_main, source_ref], text=True
          ).strip()

          def show(ref, path):
              return subprocess.check_output(["git", "show", f"{ref}:{path}"], text=True)

          def segment(text, start_marker, end_marker):
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[start:end]

          def replace_segment(text, start_marker, end_marker, replacement):
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[:start] + replacement + text[end:]

          direct_files = [
              "http-generic-api/deploymentManifest.js",
              "http-generic-api/scripts/generate-deployment-manifest.mjs",
              "http-generic-api/test-deployment-manifest-generator.mjs",
              "http-generic-api/test-deployment-manifest.mjs",
          ]
          for path in direct_files:
              Path(path).write_text(show(source_ref, path), encoding="utf-8")

          parser_path = Path("http-generic-api/scripts/frontend-surface-dispatch.mjs")
          parser = parser_path.read_text(encoding="utf-8")
          source_parser = show(source_ref, str(parser_path))
          parser = replace_segment(
              parser,
              "function middlewareAliases",
              "function middlewareGuards",
              segment(source_parser, "function isMiddlewareAliasName", "function middlewareGuards"),
          )
          parser = replace_segment(
              parser,
              "function runtimeAuthProfile",
              "function enclosingHelper",
              segment(source_parser, "function runtimeAuthProfile", "function enclosingHelper"),
          )
          parser = replace_segment(
              parser,
              "export function parseRoutesFromFile",
              "function scopeFor",
              segment(source_parser, "function nestedRouterRouteExpansions", "function scopeFor"),
          )
          parser_path.write_text(parser, encoding="utf-8")

          test_path = "http-generic-api/test-frontend-surface-dispatch.mjs"
          ours = Path(test_path).read_text(encoding="utf-8")
          base = show(base_ref, test_path)
          theirs = show(source_ref, test_path)
          with tempfile.TemporaryDirectory() as directory:
              directory = Path(directory)
              ours_path = directory / "ours"
              base_path = directory / "base"
              theirs_path = directory / "theirs"
              ours_path.write_text(ours, encoding="utf-8")
              base_path.write_text(base, encoding="utf-8")
              theirs_path.write_text(theirs, encoding="utf-8")
              merged = subprocess.run(
                  ["git", "merge-file", "--union", "-p", str(ours_path), str(base_path), str(theirs_path)],
                  text=True,
                  capture_output=True,
                  check=False,
              )
              if merged.returncode > 1:
                  raise SystemExit(merged.stderr or "test fixture merge failed")
              Path(test_path).write_text(merged.stdout, encoding="utf-8")

          openapi_path = Path("http-generic-api/openapi.yaml")
          openapi = openapi_path.read_text(encoding="utf-8")
          operation_ids = [
              "runGrowthIntelligencePilot",
              "listGrowthIntelligenceReports",
              "getGrowthIntelligenceMetrics",
              "getGrowthIntelligenceReport",
              "decideGrowthIntelligenceAction",
              "decideGrowthIntelligenceInsight",
              "createGrowthIntelligenceReadinessAssessment",
          ]
          for operation_id in operation_ids:
              marker = f"operationId: {operation_id}"
              operation_index = openapi.index(marker)
              path_index = openapi.rfind("\n  /", 0, operation_index)
              security_index = openapi.find("\n      security:", path_index, operation_index)
              if security_index < 0:
                  raise SystemExit(f"Missing security declaration for {operation_id}")
              line_end = openapi.index("\n", security_index + 1)
              security_line = openapi[security_index:line_end]
              updated_line = security_line.replace("backendBearerAuth", "adminBearerAuth")
              if updated_line == security_line and "adminBearerAuth" not in security_line:
                  raise SystemExit(f"Unexpected security declaration for {operation_id}: {security_line}")
              openapi = openapi[:security_index] + updated_line + openapi[line_end:]
          openapi_path.write_text(openapi, encoding="utf-8")
          PY

          git diff --check
          if grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' \
            http-generic-api/scripts/frontend-surface-dispatch.mjs \
            http-generic-api/test-frontend-surface-dispatch.mjs \
            http-generic-api/openapi.yaml; then
            echo "::error::Merge markers remain after reconciliation"
            exit 1
          fi

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Generate bounded artifacts
        working-directory: http-generic-api
        run: |
          npm run frontend:dispatch:generate -- --baseline-ref=main
          node scripts/generate-custom-gpt-schemas.mjs --write

      - name: Verify reconciled contracts
        working-directory: http-generic-api
        run: |
          node test-deployment-manifest-generator.mjs
          node test-deployment-manifest.mjs
          node test-frontend-operation-governance-generator.mjs
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-openapi-route-coverage.mjs
          npm run openapi:auth:check
          npm run schemas:guard

      - name: Recheck main and commit reconciled result
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/main:refs/remotes/origin/main
          ACTUAL_MAIN_SHA="$(git rev-parse origin/main)"
          test "$ACTUAL_MAIN_SHA" = "$EXPECTED_MAIN_SHA" || {
            echo "::error::main moved during reconciliation: expected=$EXPECTED_MAIN_SHA actual=$ACTUAL_MAIN_SHA"
            exit 1
          }
          rm -f .github/workflows/reconcile-pr-3182.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(frontend): reconcile auth dispatch evidence"
          git push origin "HEAD:${TARGET_REF}"
