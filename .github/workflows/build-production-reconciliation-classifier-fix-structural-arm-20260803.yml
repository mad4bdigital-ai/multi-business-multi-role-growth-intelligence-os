name: Build Production Reconciliation Classifier Fix Structural ARM 20260803

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/build-production-reconciliation-classifier-fix-structural-arm-20260803.yml

permissions:
  contents: write

concurrency:
  group: build-production-reconciliation-classifier-fix-structural-arm-20260803
  cancel-in-progress: false

jobs:
  build-fix:
    name: Build structural reconciliation classifier fix
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/build-production-classifier-fix-structural-20260803-v4' &&
      github.event.pull_request.user.id == 271942579
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      REQUEST_PR: ${{ github.event.pull_request.number }}
      REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      REQUEST_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      WORKFLOW_PATH: .github/workflows/build-production-reconciliation-classifier-fix-structural-arm-20260803.yml
      FIX_BRANCH: gpt/fix-production-reconciliation-classifier-20260803-v4
      REQUIRED_RUNTIME_FIX_SHA: c7f7be81b811caf3c1112372ab1089fc5ee3714c
    steps:
      - name: Checkout exact request head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.REQUEST_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable one-file request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "${REQUEST_HEAD_REF}" = "gpt/build-production-classifier-fix-structural-20260803-v4"
          test "$(git rev-parse HEAD)" = "${REQUEST_HEAD_SHA}"
          mapfile -t files < <(gh api --paginate "/repos/${REPOSITORY}/pulls/${REQUEST_PR}/files?per_page=100" --jq '.[].filename')
          test "${#files[@]}" -eq 1
          test "${files[0]}" = "${WORKFLOW_PATH}"

      - name: Pin live protected refs
        id: refs
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/Production:refs/remotes/origin/Production"
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          production_sha="$(git rev-parse refs/remotes/origin/Production)"
          git merge-base --is-ancestor "${REQUIRED_RUNTIME_FIX_SHA}" "${main_sha}"
          echo "main_sha=${main_sha}" >> "${GITHUB_OUTPUT}"
          echo "production_sha=${production_sha}" >> "${GITHUB_OUTPUT}"

      - name: Reset to clean live main
        shell: bash
        run: |
          set -Eeuo pipefail
          git checkout --detach '${{ steps.refs.outputs.main_sha }}'
          test ! -e "${WORKFLOW_PATH}"

      - name: Apply structural classifier patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          gate_path = Path('http-generic-api/scripts/e2e-parallel-pr-gate.mjs')
          gate = gate_path.read_text()
          start = gate.index('function classifyProductionPromotion(')
          end = gate.index('\nfunction main()', start)
          replacement = r'''function resolveCommit(root, ref) {
            if (!ref) return null;
            try {
              const value = execFileSync("git", ["rev-parse", "--verify", `${ref}^{commit}`], {
                cwd: root,
                encoding: "utf8",
                stdio: ["ignore", "pipe", "ignore"]
              }).trim();
              return /^[0-9a-f]{40}$/.test(value) ? value : null;
            } catch {
              return null;
            }
          }

          function resolveTree(root, ref) {
            if (!ref) return null;
            try {
              const value = execFileSync("git", ["rev-parse", "--verify", `${ref}^{tree}`], {
                cwd: root,
                encoding: "utf8",
                stdio: ["ignore", "pipe", "ignore"]
              }).trim();
              return /^[0-9a-f]{40}$/.test(value) ? value : null;
            } catch {
              return null;
            }
          }

          function resolveParents(root, headSha) {
            if (!/^[0-9a-f]{40}$/.test(headSha)) return [];
            try {
              const value = execFileSync("git", ["show", "-s", "--format=%P", headSha], {
                cwd: root,
                encoding: "utf8",
                stdio: ["ignore", "pipe", "ignore"]
              }).trim();
              if (!value) return [];
              const parents = value.split(/\s+/);
              return parents.every((parent) => /^[0-9a-f]{40}$/.test(parent)) ? parents : [];
            } catch {
              return [];
            }
          }

          function classifyProductionPromotion({ root, headRef, baseRef, headSha, baseSha }) {
            if (headRef === "main" && baseRef === "Production") {
              return { allowed: true, identity: "protected_main" };
            }
            if (baseRef !== "Production") return { allowed: false, identity: null };

            const match = /^release\/production-candidate-(?:\d{8}-)?([0-9a-f]{8})(?:-v[1-9]\d*)?$/.exec(headRef);
            if (!match) return { allowed: false, identity: null };
            if (!/^[0-9a-f]{40}$/.test(headSha) || !headSha.startsWith(match[1])) {
              return { allowed: false, identity: null };
            }

            const mainRef = resolveCanonicalMainRef(root);
            if (!mainRef) return { allowed: false, identity: null };
            if (isAncestor(root, headSha, mainRef)) {
              return { allowed: true, identity: "immutable_main_snapshot" };
            }

            const mainSha = resolveCommit(root, mainRef);
            const mainTree = resolveTree(root, mainRef);
            const headTree = resolveTree(root, headSha);
            const parents = resolveParents(root, headSha);
            if (
              !mainSha ||
              !mainTree ||
              !headTree ||
              !/^[0-9a-f]{40}$/.test(baseSha || "") ||
              parents.length !== 2 ||
              parents[0] !== mainSha ||
              parents[1] !== baseSha ||
              headTree !== mainTree
            ) {
              return { allowed: false, identity: null };
            }
            return { allowed: true, identity: "history_preserving_main_reconciliation" };
          }
          '''
          gate = gate[:start] + replacement + gate[end:]

          call_start = gate.index('  const promotion = classifyProductionPromotion({')
          call_end = gate.index('  });', call_start) + len('  });')
          old_call = gate[call_start:call_end]
          if old_call.count('headSha: options.head') != 1:
              raise SystemExit('classifier call shape changed')
          new_call = old_call.replace('headSha: options.head\n', 'headSha: options.head,\n    baseSha: options.base\n')
          gate = gate[:call_start] + new_call + gate[call_end:]
          gate_path.write_text(gate)

          test_path = Path('http-generic-api/scripts/e2e-parallel-pr-flow-self-test.mjs')
          test = test_path.read_text()
          marker = 'const mismatchedImmutable = spawnSync'
          if test.count(marker) != 1:
              raise SystemExit('self-test insertion marker changed')
          insert = r'''const mainTree = run("git", ["rev-parse", `${headSha}^{tree}`], root).trim();
          const baseTree = run("git", ["rev-parse", `${baseSha}^{tree}`], root).trim();
          const reconciliationSha = run("git", ["commit-tree", mainTree, "-p", headSha, "-p", baseSha, "-m", "reconcile main and Production"], root).trim();
          const reconciliationRef = `release/production-candidate-20260803-${reconciliationSha.slice(0, 8)}-v1`;
          const reconciliationPromotion = JSON.parse(run(process.execPath, [GATE, "--root", root, "--base", baseSha, "--head", reconciliationSha, "--head-ref", reconciliationRef, "--base-ref", "Production"], root));
          assert.equal(reconciliationPromotion.ok, true, JSON.stringify(reconciliationPromotion.findings));
          assert.equal(reconciliationPromotion.production_promotion, true);
          assert.equal(reconciliationPromotion.production_promotion_identity, "history_preserving_main_reconciliation");
          assert.equal(reconciliationPromotion.phase_evaluation_base, headSha);

          const rejectedCandidates = [
            run("git", ["commit-tree", baseTree, "-p", headSha, "-p", baseSha, "-m", "wrong tree"], root).trim(),
            run("git", ["commit-tree", mainTree, "-p", workSha, "-p", baseSha, "-m", "stale first parent"], root).trim(),
            run("git", ["commit-tree", mainTree, "-p", headSha, "-p", workSha, "-m", "wrong second parent"], root).trim(),
            run("git", ["commit-tree", mainTree, "-p", headSha, "-p", baseSha, "-p", workSha, "-m", "unexpected third parent"], root).trim()
          ];
          for (const rejectedSha of rejectedCandidates) {
            const rejected = spawnSync(process.execPath, [GATE, "--root", root, "--base", baseSha, "--head", rejectedSha, "--head-ref", `release/production-candidate-20260803-${rejectedSha.slice(0, 8)}-v1`, "--base-ref", "Production"], { cwd: root, encoding: "utf8" });
            assert.notEqual(rejected.status, 0);
            assert.equal(JSON.parse(rejected.stdout).production_promotion, false);
          }

          '''
          test = test.replace(marker, insert + marker)
          test = re.sub(r'tests:\s*\d+', 'tests: 60', test, count=1)
          test_path.write_text(test)
          PY
          git diff --check
          test "$(git diff --name-only | sort)" = $'http-generic-api/scripts/e2e-parallel-pr-flow-self-test.mjs\nhttp-generic-api/scripts/e2e-parallel-pr-gate.mjs'

      - name: Validate syntax, synthetic matrix, and live-ref candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check http-generic-api/scripts/e2e-parallel-pr-gate.mjs
          node --check http-generic-api/scripts/e2e-parallel-pr-flow-self-test.mjs
          node http-generic-api/scripts/e2e-parallel-pr-flow-self-test.mjs

          main_sha='${{ steps.refs.outputs.main_sha }}'
          production_sha='${{ steps.refs.outputs.production_sha }}'
          main_tree="$(git rev-parse "${main_sha}^{tree}")"
          export GIT_AUTHOR_NAME='mad4bdigital-ai'
          export GIT_AUTHOR_EMAIL='271942579+mad4bdigital-ai@users.noreply.github.com'
          export GIT_COMMITTER_NAME='mad4bdigital-ai'
          export GIT_COMMITTER_EMAIL='271942579+mad4bdigital-ai@users.noreply.github.com'
          candidate="$(printf '%s\n' 'live reconciliation classifier regression' | git commit-tree "${main_tree}" -p "${main_sha}" -p "${production_sha}")"
          candidate_ref="release/production-candidate-20260803-${candidate:0:8}-v9"
          node http-generic-api/scripts/e2e-parallel-pr-gate.mjs check \
            --base "${production_sha}" --head "${candidate}" \
            --head-ref "${candidate_ref}" --base-ref Production \
            --report-file "${RUNNER_TEMP}/candidate-report.json"
          jq -e --arg main "${main_sha}" '.ok == true and .production_promotion == true and .production_promotion_identity == "history_preserving_main_reconciliation" and .phase_evaluation_base == $main' "${RUNNER_TEMP}/candidate-report.json" >/dev/null

      - name: Re-read refs and publish clean two-file branch
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          main_sha='${{ steps.refs.outputs.main_sha }}'
          production_sha='${{ steps.refs.outputs.production_sha }}'
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/Production:refs/remotes/origin/Production"
          test "$(git rev-parse refs/remotes/origin/main)" = "${main_sha}"
          test "$(git rev-parse refs/remotes/origin/Production)" = "${production_sha}"
          git config user.name 'mad4bdigital-ai'
          git config user.email '271942579+mad4bdigital-ai@users.noreply.github.com'
          git add http-generic-api/scripts/e2e-parallel-pr-gate.mjs http-generic-api/scripts/e2e-parallel-pr-flow-self-test.mjs
          git commit -m 'fix(e2e): accept history-preserving Production candidates'
          fix_sha="$(git rev-parse HEAD)"
          existing="$(git ls-remote --heads origin "refs/heads/${FIX_BRANCH}" | awk '{print $1}')"
          if [[ -n "${existing}" ]]; then test "${existing}" = "${fix_sha}"; else git push origin "${fix_sha}:refs/heads/${FIX_BRANCH}"; fi
          test "$(git ls-remote --heads origin "refs/heads/${FIX_BRANCH}" | awk '{print $1}')" = "${fix_sha}"
          echo "fix_sha=${fix_sha}" >> "${GITHUB_OUTPUT}"

      - name: Write and upload bounded evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${RUNNER_TEMP}/classifier-fix"
          jq -n \
            --arg main_sha '${{ steps.refs.outputs.main_sha }}' \
            --arg production_sha '${{ steps.refs.outputs.production_sha }}' \
            --arg fix_sha '${{ steps.publish.outputs.fix_sha }}' \
            --arg fix_branch "${FIX_BRANCH}" \
            --arg source_run_id "${GITHUB_RUN_ID}" \
            '{contract:"mad4b.production-reconciliation-classifier-fix.v3",source_run_id:$source_run_id,main_sha:$main_sha,production_sha:$production_sha,fix_sha:$fix_sha,fix_branch:$fix_branch,final_scope:["http-generic-api/scripts/e2e-parallel-pr-gate.mjs","http-generic-api/scripts/e2e-parallel-pr-flow-self-test.mjs"],syntax_passed:true,self_test_passed:true,live_candidate_regression_passed:true,protected_ref_mutation_performed:false,force_push_performed:false,production_merge_performed:false,deployment_performed:false,provider_call_performed:false,credential_payload_read:false,sql_execution_performed:false,migration_apply_performed:false,database_mutation_performed:false,external_send_performed:false,secrets_included:false}' \
            > "${RUNNER_TEMP}/classifier-fix/summary.json"
          cat "${RUNNER_TEMP}/classifier-fix/summary.json"

      - name: Upload fix evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-reconciliation-classifier-fix-${{ github.run_id }}
          path: ${{ runner.temp }}/classifier-fix/summary.json
          if-no-files-found: error
          retention-days: 14
