name: Spec 011 Ephemeral Checkout Preflight Current Main Bootstrap

on:
  push:
    branches:
      - gpt/spec011-ephemeral-checkout-preflight-current-main-20260730
    paths:
      - .github/spec011-ephemeral-checkout-preflight-current-main-trigger.json

permissions:
  contents: write

concurrency:
  group: spec011-ephemeral-checkout-preflight-current-main-bootstrap
  cancel-in-progress: true

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gpt/spec011-ephemeral-checkout-preflight-current-main-20260730
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Apply exact preflight contract and focused regression
        run: python3 .github/scripts/spec011-ephemeral-checkout-preflight-current-main-bootstrap.py

      - name: Commit source-only result
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          allowed = {
              'http-generic-api/releaseReadiness.js',
              'http-generic-api/test-release-readiness-migration-drift.mjs',
              '.github/workflows/spec011-ephemeral-checkout-preflight-current-main-bootstrap.yml',
              '.github/spec011-ephemeral-checkout-preflight-current-main-trigger.json',
              '.github/scripts/spec011-ephemeral-checkout-preflight-current-main-bootstrap.py',
          }
          changed = set()
          for line in subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines():
              if line:
                  changed.add(line[3:])
          unexpected = changed - allowed
          source = changed & {
              'http-generic-api/releaseReadiness.js',
              'http-generic-api/test-release-readiness-migration-drift.mjs',
          }
          if unexpected:
              raise SystemExit(f'bounded_write_set_invalid:unexpected={sorted(unexpected)}')
          if source != {
              'http-generic-api/releaseReadiness.js',
              'http-generic-api/test-release-readiness-migration-drift.mjs',
          }:
              raise SystemExit(f'source_write_set_invalid:actual={sorted(source)}')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(spec-011): approve exact ephemeral checkout migration preflight on current main"
          git push origin HEAD:gpt/spec011-ephemeral-checkout-preflight-current-main-20260730
