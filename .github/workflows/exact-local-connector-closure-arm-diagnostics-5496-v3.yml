name: Exact Local Connector Closure ARM Diagnostics 5496 v3

on:
  pull_request:
    branches:
      - gpt/validate-local-connector-closure-arm-base-5496-c7f7be81
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: exact-local-connector-closure-arm-diagnostics-5496-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Split canonical governance diagnostics
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      EXPECTED_HEAD_REF: gpt/ci/retire-local-connector-closure-final-one-commit-20260803
      EXPECTED_HEAD_SHA: d2d3fbf20998d24fda53eb05e1f0ddd004ace8e7
      EXPECTED_MAIN_SHA: c7f7be81b811caf3c1112372ab1089fc5ee3714c
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable identity and exact nine-file scope
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$HEAD_REPOSITORY" = "$REPOSITORY"
          test "$HEAD_REF" = "$EXPECTED_HEAD_REF"
          test "$HEAD_SHA" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${EXPECTED_HEAD_REF}:refs/remotes/origin/${EXPECTED_HEAD_REF}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse refs/remotes/origin/${EXPECTED_HEAD_REF})" = "$EXPECTED_HEAD_SHA"
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" "$EXPECTED_HEAD_SHA"
          test "$(git rev-list --count "${EXPECTED_MAIN_SHA}..${EXPECTED_HEAD_SHA}")" = "2"
          mapfile -t actual < <(git diff --name-only "$EXPECTED_MAIN_SHA"..."$EXPECTED_HEAD_SHA" | sort)
          expected=(
            .changes/e2e/local-connector-production-closure-automation-retirement.json
            .github/local-connector-closure/trigger-3945-792ff63a.txt
            .github/scripts/governed-local-connector-production-closure.mjs
            .github/workflows/automation-overlap-guard.yml
            .github/workflows/governed-local-connector-production-closure-pr-target.yml
            .github/workflows/governed-local-connector-production-closure-push.yml
            .github/workflows/governed-local-connector-production-closure.yml
            .github/workflows/local-connector-closure-v8-trigger.txt
            http-generic-api/scripts/local-connector-closure-automation-retirement-self-test.mjs
          )
          test "${#actual[@]}" = "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Schema docs change guard
        run: node http-generic-api/scripts/schema-docs-change-guard.mjs

      - name: Migration placement guard
        run: node http-generic-api/scripts/migration-placement-guard.mjs

      - name: User JWT auth governance
        run: node http-generic-api/scripts/user-jwt-auth-governance.mjs

      - name: Interruption readiness
        run: node http-generic-api/scripts/interruption-readiness.mjs --ci --skip-dependencies --skip-worktree

      - name: Validate canonical sources
        run: node validate-canonical-sources.mjs

      - name: Check canonical generated output
        run: node build-canonicals.mjs --check

      - name: Check canonical domain finder syntax
        run: node --check find-canonical-domain.mjs

      - name: Resource API coverage audit
        run: node http-generic-api/scripts/resource-api-coverage-audit.mjs --ci --changed

      - name: Resource API architecture regression
        run: node http-generic-api/test-resource-api-architecture.mjs

      - name: Resource API service regression
        run: node http-generic-api/test-resource-api-service.mjs

      - name: Spec Kit completion gate
        run: node http-generic-api/scripts/spec-kit-completion-gate.mjs --ci --changed

      - name: Validate memory schema
        run: node validate-memory-schema.mjs

      - name: Git diff whitespace check
        run: git diff --check

      - name: Prove retirement self-test
        shell: bash
        run: |
          set -euo pipefail
          node --check http-generic-api/scripts/local-connector-closure-automation-retirement-self-test.mjs
          (cd http-generic-api && node scripts/local-connector-closure-automation-retirement-self-test.mjs)
