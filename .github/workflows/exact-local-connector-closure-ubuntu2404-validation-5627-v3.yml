name: Exact Local Connector Closure Ubuntu 24.04 Validation 5627 v3

on:
  pull_request:
    branches:
      - gpt/validate-local-connector-closure-ubuntu2404-base-5627-0b098c77-v3
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: exact-local-connector-closure-ubuntu2404-5627-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate:
    name: Exact candidate checkout-safe validation
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Initialize bounded evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/local-connector-closure-5627-$GITHUB_RUN_ID"
          mkdir -p \
            "$evidence_dir/reference-integrity" \
            "$evidence_dir/repository-tool-lifecycle" \
            "$evidence_dir/automation-overlap" \
            "$evidence_dir/test-suite-reports"
          echo "EVIDENCE_DIR=$evidence_dir" >> "$GITHUB_ENV"
          echo "EXPECTED_HEAD_SHA=4000876f023227cc8d0237fec1c744daa8a8fcf9" >> "$GITHUB_ENV"
          echo "EXPECTED_MAIN_SHA=0b098c77a155fe9c2109ae3e4315519d7f8894d2" >> "$GITHUB_ENV"
          printf '{"candidate_pr":5627,"candidate_sha":"4000876f023227cc8d0237fec1c744daa8a8fcf9","main_sha":"0b098c77a155fe9c2109ae3e4315519d7f8894d2","runner":"ubuntu-24.04","status":"initialized","secrets_included":false}\n' \
            > "$evidence_dir/identity-start.json"

      - name: Verify immutable identity and exact scope
        id: preflight
        continue-on-error: true
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_HEAD_REF: gpt/ci/retire-local-connector-closure-0b098c77-one-commit-20260803
        run: |
          set -euo pipefail
          mark() { printf '%s\n' "$1" | tee -a "$EVIDENCE_DIR/preflight-progress.txt"; }
          test "$HEAD_REPOSITORY" = "$REPOSITORY"
          test "$HEAD_REF" = "$EXPECTED_HEAD_REF"
          test "$HEAD_SHA" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          mark event-identity-pass
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN_SHA"
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" "$EXPECTED_HEAD_SHA"
          test "$(git rev-list --count "${EXPECTED_MAIN_SHA}..${EXPECTED_HEAD_SHA}")" = "1"
          mark direct-parent-one-commit-pass
          git diff --name-only "$EXPECTED_MAIN_SHA" "$EXPECTED_HEAD_SHA" | sort > "$EVIDENCE_DIR/actual-files.txt"
          cat <<'EOF_FILES' | sort > "$EVIDENCE_DIR/expected-files.txt"
          .changes/e2e/local-connector-production-closure-automation-retirement.json
          .github/local-connector-closure/trigger-3945-792ff63a.txt
          .github/scripts/governed-local-connector-production-closure.mjs
          .github/workflows/automation-overlap-guard.yml
          .github/workflows/governed-local-connector-production-closure-pr-target.yml
          .github/workflows/governed-local-connector-production-closure-push.yml
          .github/workflows/governed-local-connector-production-closure.yml
          .github/workflows/local-connector-closure-v8-trigger.txt
          http-generic-api/scripts/local-connector-closure-automation-retirement-self-test.mjs
          EOF_FILES
          sed -i 's/^          //' "$EVIDENCE_DIR/expected-files.txt"
          sort -o "$EVIDENCE_DIR/expected-files.txt" "$EVIDENCE_DIR/expected-files.txt"
          diff -u "$EVIDENCE_DIR/expected-files.txt" "$EVIDENCE_DIR/actual-files.txt"
          test "$(wc -l < "$EVIDENCE_DIR/actual-files.txt" | tr -d ' ')" = "9"
          git diff --name-status "$EXPECTED_MAIN_SHA" "$EXPECTED_HEAD_SHA" > "$EVIDENCE_DIR/name-status.tsv"
          printf '{"ok":true,"candidate_pr":5627,"candidate_sha":"%s","main_sha":"%s","commit_count":1,"changed_files":9,"runner":"ubuntu-24.04","secrets_included":false}\n' \
            "$EXPECTED_HEAD_SHA" "$EXPECTED_MAIN_SHA" > "$EVIDENCE_DIR/preflight.json"
          mark preflight-complete

      - name: Syntax and canonical governance
        id: syntax
        if: steps.preflight.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/schema-docs-change-guard.mjs
          node http-generic-api/scripts/migration-placement-guard.mjs
          (cd http-generic-api && node scripts/user-jwt-auth-governance.mjs)
          (cd http-generic-api && node scripts/interruption-readiness.mjs --ci --skip-dependencies --skip-worktree)
          node validate-canonical-sources.mjs
          node build-canonicals.mjs --check
          node --check find-canonical-domain.mjs
          node http-generic-api/scripts/spec-kit-completion-gate.mjs --ci --changed
          node validate-memory-schema.mjs
          git diff --check

      - name: Resource API coverage and regressions
        id: resource_api
        if: steps.preflight.outcome == 'success'
        continue-on-error: true
        working-directory: http-generic-api
        env:
          GITHUB_BASE_REF: main
        run: |
          set -euo pipefail
          node scripts/resource-api-coverage-audit.mjs --ci --changed
          node test-resource-api-architecture.mjs
          node test-resource-api-service.mjs

      - name: Prove retirement and overlap safety
        id: retirement
        if: steps.preflight.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            .github/local-connector-closure/trigger-3945-792ff63a.txt \
            .github/scripts/governed-local-connector-production-closure.mjs \
            .github/workflows/governed-local-connector-production-closure-pr-target.yml \
            .github/workflows/governed-local-connector-production-closure-push.yml \
            .github/workflows/governed-local-connector-production-closure.yml \
            .github/workflows/local-connector-closure-v8-trigger.txt
          do
            test ! -e "$path"
          done
          workflow=.github/workflows/automation-overlap-guard.yml
          grep -F 'contents: read' "$workflow"
          grep -F 'cancel-in-progress: false' "$workflow"
          ! grep -E 'issues:[[:space:]]*write|pull-requests:[[:space:]]*write|contents:[[:space:]]*write|BACKEND_API_KEY|RUN_LOCAL_CONNECTOR_PRODUCTION_CLOSURE|governed-local-connector-production-closure' "$workflow"
          node --check http-generic-api/scripts/local-connector-closure-automation-retirement-self-test.mjs
          (cd http-generic-api && node scripts/local-connector-closure-automation-retirement-self-test.mjs)
          (cd http-generic-api && node scripts/automation-overlap-analyzer.mjs \
            --check \
            --report-file "$EVIDENCE_DIR/automation-overlap/report.json" \
            --markdown-file "$EVIDENCE_DIR/automation-overlap/report.md")
          (cd http-generic-api && npm run test:automation:overlap)

      - name: E2E contract reference integrity
        id: reference_integrity
        if: steps.preflight.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/test-e2e-contract-reference-integrity.mjs
          node http-generic-api/test-e2e-contract-git-index-integrity.mjs
          node http-generic-api/scripts/e2e-contract-reference-integrity.mjs \
            --base "$EXPECTED_MAIN_SHA" \
            --head "$EXPECTED_HEAD_SHA" \
            --report-file "$EVIDENCE_DIR/reference-integrity/report.json"
          node http-generic-api/scripts/e2e-contract-git-index-integrity.mjs \
            --report-file "$EVIDENCE_DIR/reference-integrity/report.json"

      - name: Repository tool lifecycle governance
        id: lifecycle
        if: steps.preflight.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs
          BASE_SHA="$EXPECTED_MAIN_SHA" CANDIDATE_SHA="$EXPECTED_HEAD_SHA" \
            node http-generic-api/scripts/maintenance-tools/repository-tool-lifecycle-guard.mjs \
              --changed-files "$EVIDENCE_DIR/name-status.tsv" \
              --policy .github/repository-maintenance-tool-governance.json \
              --output-dir "$EVIDENCE_DIR/repository-tool-lifecycle"

      - name: HTTP Generic API unit integration and architecture
        id: api_tests
        if: steps.preflight.outcome == 'success'
        continue-on-error: true
        working-directory: http-generic-api
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
          TEST_SUITE_REPORT_DIR: ${{ runner.temp }}/local-connector-closure-5627-${{ github.run_id }}/test-suite-reports
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run validate

      - name: Execution resolver typecheck and tests
        id: root_tests
        if: steps.preflight.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test -- --runInBand

      - name: Exact E2E phase evaluation and journeys
        id: e2e
        if: steps.preflight.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/e2e-phase-governance.mjs check \
            --base "$EXPECTED_MAIN_SHA" \
            --head "$EXPECTED_HEAD_SHA" \
            --report-file "$EVIDENCE_DIR/e2e-phase-evaluation.json"
          node http-generic-api/scripts/e2e-phase-governance.mjs run \
            --base "$EXPECTED_MAIN_SHA" \
            --head "$EXPECTED_HEAD_SHA" \
            --report-file "$EVIDENCE_DIR/e2e-phase-evaluation-run.json" \
            --execution-report-file "$EVIDENCE_DIR/e2e-phase-execution.json"

      - name: Write bounded validation result
        if: always()
        shell: bash
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          SYNTAX_OUTCOME: ${{ steps.syntax.outcome }}
          RESOURCE_API_OUTCOME: ${{ steps.resource_api.outcome }}
          RETIREMENT_OUTCOME: ${{ steps.retirement.outcome }}
          REFERENCE_INTEGRITY_OUTCOME: ${{ steps.reference_integrity.outcome }}
          LIFECYCLE_OUTCOME: ${{ steps.lifecycle.outcome }}
          API_TESTS_OUTCOME: ${{ steps.api_tests.outcome }}
          ROOT_TESTS_OUTCOME: ${{ steps.root_tests.outcome }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: |
          set -euo pipefail
          jq -n \
            --arg candidate_pr "5627" \
            --arg candidate_sha "$EXPECTED_HEAD_SHA" \
            --arg main_sha "$EXPECTED_MAIN_SHA" \
            --arg preflight "$PREFLIGHT_OUTCOME" \
            --arg syntax "$SYNTAX_OUTCOME" \
            --arg resource_api "$RESOURCE_API_OUTCOME" \
            --arg retirement "$RETIREMENT_OUTCOME" \
            --arg reference_integrity "$REFERENCE_INTEGRITY_OUTCOME" \
            --arg lifecycle "$LIFECYCLE_OUTCOME" \
            --arg api_tests "$API_TESTS_OUTCOME" \
            --arg root_tests "$ROOT_TESTS_OUTCOME" \
            --arg e2e "$E2E_OUTCOME" \
            '{candidate_pr:($candidate_pr|tonumber),candidate_sha:$candidate_sha,main_sha:$main_sha,runner:"ubuntu-24.04",outcomes:{preflight:$preflight,syntax:$syntax,resource_api:$resource_api,retirement:$retirement,reference_integrity:$reference_integrity,lifecycle:$lifecycle,api_tests:$api_tests,root_tests:$root_tests,e2e:$e2e},provider_mutation:false,production_mutation:false,credential_access:false,database_mutation:false,secrets_included:false}' \
            > "$EVIDENCE_DIR/result.json"
          cat "$EVIDENCE_DIR/result.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-local-connector-closure-5627-ubuntu2404-v3-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce exact validation result
        if: always()
        shell: bash
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          SYNTAX_OUTCOME: ${{ steps.syntax.outcome }}
          RESOURCE_API_OUTCOME: ${{ steps.resource_api.outcome }}
          RETIREMENT_OUTCOME: ${{ steps.retirement.outcome }}
          REFERENCE_INTEGRITY_OUTCOME: ${{ steps.reference_integrity.outcome }}
          LIFECYCLE_OUTCOME: ${{ steps.lifecycle.outcome }}
          API_TESTS_OUTCOME: ${{ steps.api_tests.outcome }}
          ROOT_TESTS_OUTCOME: ${{ steps.root_tests.outcome }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: |
          set -euo pipefail
          for outcome in \
            "$PREFLIGHT_OUTCOME" "$SYNTAX_OUTCOME" "$RESOURCE_API_OUTCOME" \
            "$RETIREMENT_OUTCOME" "$REFERENCE_INTEGRITY_OUTCOME" "$LIFECYCLE_OUTCOME" \
            "$API_TESTS_OUTCOME" "$ROOT_TESTS_OUTCOME" "$E2E_OUTCOME"
          do
            test "$outcome" = success
          done
