name: Patch R6 Production Binding 42177d36

on:
  pull_request:
    branches:
      - gpt/validate-finalization-identity-approval-arm-base-4a049185
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: patch-r6-production-binding-42177d36-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    name: Apply exact R6 binding patch
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/r6-bind-production-42177d36-current-20260804'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      EXPECTED_MAIN_SHA: 97e4ee7ec790844ad20ee2349125579353c693d5
      HEAD_REF: gpt/r6-bind-production-42177d36-current-20260804
      WORKFLOW_PATH: .github/workflows/hostinger-production-release-evidence-r6.yml
      OLD_PRODUCTION_PREFIX: 2669991A
      NEW_PRODUCTION_PREFIX: 42177D36
      REPORTER_PREFIX: 6134C0F8
      OLD_PRODUCTION_SHA: 2669991a882c7f7939510fbbace17f462a42517c
      NEW_PRODUCTION_SHA: 42177d360e9c6d76b4f09eaf06bd98ac26d09abe
      OLD_MERGED_AT: '2026-08-03T10:14:37Z'
      NEW_MERGED_AT: '2026-08-03T22:37:32Z'
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify current main and branch lease
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main" "+refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}"
          test "$(git rev-parse refs/remotes/origin/main)" = "${EXPECTED_MAIN_SHA}"
          test "$(git rev-parse refs/remotes/origin/${HEAD_REF})" = "$(git rev-parse HEAD)"
          test "$(git merge-base "${EXPECTED_MAIN_SHA}" HEAD)" = "${EXPECTED_MAIN_SHA}"

      - name: Apply exact three-value binding patch
        id: patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ['WORKFLOW_PATH'])
          text = path.read_text()
          old_token = (
              'AUTHORIZE_HOSTINGER_PRODUCTION_RELEASE_EVIDENCE_'
              + os.environ['OLD_PRODUCTION_PREFIX']
              + '_'
              + os.environ['REPORTER_PREFIX']
              + '_R6'
          )
          new_token = (
              'AUTHORIZE_HOSTINGER_PRODUCTION_RELEASE_EVIDENCE_'
              + os.environ['NEW_PRODUCTION_PREFIX']
              + '_'
              + os.environ['REPORTER_PREFIX']
              + '_R6'
          )
          replacements = [
              (
                  f"      AUTHORIZATION_TOKEN: {old_token}",
                  f"      AUTHORIZATION_TOKEN: {new_token}",
              ),
              (
                  f"      EXPECTED_PRODUCTION_SHA: {os.environ['OLD_PRODUCTION_SHA']}",
                  f"      EXPECTED_PRODUCTION_SHA: {os.environ['NEW_PRODUCTION_SHA']}",
              ),
              (
                  f"      PRODUCTION_MERGED_AT: '{os.environ['OLD_MERGED_AT']}'",
                  f"      PRODUCTION_MERGED_AT: '{os.environ['NEW_MERGED_AT']}'",
              ),
          ]
          old_present = [text.count(old) for old, _ in replacements]
          new_present = [text.count(new) for _, new in replacements]
          if old_present == [0, 0, 0] and new_present == [1, 1, 1]:
              print('R6 binding already patched; no mutation required.')
              Path('/tmp/r6-already-patched').write_text('true\n')
              raise SystemExit(0)
          if old_present != [1, 1, 1] or new_present != [0, 0, 0]:
              raise SystemExit(
                  f'Unexpected exact binding cardinality: old={old_present}, new={new_present}'
              )
          for old, new in replacements:
              text = text.replace(old, new)
          path.write_text(text)
          PY

          old_authorization_token="AUTHORIZE_HOSTINGER_PRODUCTION_RELEASE_EVIDENCE_${OLD_PRODUCTION_PREFIX}_${REPORTER_PREFIX}_R6"
          new_authorization_token="AUTHORIZE_HOSTINGER_PRODUCTION_RELEASE_EVIDENCE_${NEW_PRODUCTION_PREFIX}_${REPORTER_PREFIX}_R6"

          if [[ -f /tmp/r6-already-patched ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "changed=true" >> "${GITHUB_OUTPUT}"
          test -z "$(git diff --name-only | grep -vFx "${WORKFLOW_PATH}" || true)"
          test "$(git diff --name-only)" = "${WORKFLOW_PATH}"
          git diff --check
          grep -Fq "      AUTHORIZATION_TOKEN: ${new_authorization_token}" "${WORKFLOW_PATH}"
          grep -Fq "      EXPECTED_PRODUCTION_SHA: ${NEW_PRODUCTION_SHA}" "${WORKFLOW_PATH}"
          grep -Fq "      PRODUCTION_MERGED_AT: '${NEW_MERGED_AT}'" "${WORKFLOW_PATH}"
          ! grep -Fq "      AUTHORIZATION_TOKEN: ${old_authorization_token}" "${WORKFLOW_PATH}"
          ! grep -Fq "      EXPECTED_PRODUCTION_SHA: ${OLD_PRODUCTION_SHA}" "${WORKFLOW_PATH}"
          ! grep -Fq "      PRODUCTION_MERGED_AT: '${OLD_MERGED_AT}'" "${WORKFLOW_PATH}"

      - name: Commit exact binding patch
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${WORKFLOW_PATH}"
          test "$(git diff --cached --name-only)" = "${WORKFLOW_PATH}"
          git commit -m 'chore(r6): bind release evidence to Production 42177d36'

      - name: Push without force after remote readback
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/${HEAD_REF}" | awk '{print $1}')"
          test "${remote_sha}" = "${{ github.event.pull_request.head.sha }}"
          git push origin "HEAD:refs/heads/${HEAD_REF}"

      - name: Final readback
        shell: bash
        run: |
          set -Eeuo pipefail
          new_authorization_token="AUTHORIZE_HOSTINGER_PRODUCTION_RELEASE_EVIDENCE_${NEW_PRODUCTION_PREFIX}_${REPORTER_PREFIX}_R6"
          test -z "$(git status --porcelain)"
          grep -Fq "      AUTHORIZATION_TOKEN: ${new_authorization_token}" "${WORKFLOW_PATH}"
          grep -Fq "      EXPECTED_PRODUCTION_SHA: ${NEW_PRODUCTION_SHA}" "${WORKFLOW_PATH}"
          grep -Fq "      PRODUCTION_MERGED_AT: '${NEW_MERGED_AT}'" "${WORKFLOW_PATH}"
