name: X0 Sequential Ambiguity Guard Repair

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'gpt/spec-011-x0-governed-execution-baseline-20260730'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact governed PR head
        uses: actions/checkout@v5
        with:
          ref: gpt/spec-011-x0-governed-execution-baseline-20260730
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Apply exact ambiguity guards
        working-directory: http-generic-api
        run: node scripts/apply-x0-sequential-ambiguity-guards.mjs

      - name: Verify sequential and X0 contracts
        working-directory: http-generic-api
        run: |
          node test-sequential-plan-orchestrator.mjs
          node test-governed-execution-baseline-telemetry.mjs
          node test-governed-execution-baseline-benchmark.mjs
          printf '%s\n' \
            'http-generic-api/sequentialPlanOrchestrator.js' \
            'http-generic-api/test-sequential-plan-orchestrator.mjs' \
            > "$RUNNER_TEMP/x0-ambiguity-changed-files.txt"
          node scripts/context-kernel-hardcoding-scan.mjs \
            --fail-on=runtime \
            --changed-files-from="$RUNNER_TEMP/x0-ambiguity-changed-files.txt"

      - name: Enforce exact write set
        run: |
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            'http-generic-api/sequentialPlanOrchestrator.js'
            'http-generic-api/test-sequential-plan-orchestrator.mjs'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")

      - name: Commit ambiguity guards
        run: |
          git config user.name 'mad4b-governed-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            http-generic-api/sequentialPlanOrchestrator.js \
            http-generic-api/test-sequential-plan-orchestrator.mjs
          git commit -m 'fix(spec-011): fail closed on sequential identity ambiguity'
          git push origin HEAD:gpt/spec-011-x0-governed-execution-baseline-20260730
