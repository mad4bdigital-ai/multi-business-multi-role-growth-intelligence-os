name: Temporary Tenant Local Connector Taxonomy Materializer

on:
  push:
    branches:
      - fix/tenant-local-connector-error-taxonomy-4451-20260808

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/tenant-local-connector-error-taxonomy-4451-20260808

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Apply bounded patch
        run: python3 .github/tmp/tenant-local-connector-taxonomy-materialize.py

      - name: Run focused regressions
        working-directory: http-generic-api
        run: |
          node --check routes/connectorProxyRoutes.js
          node test-tenant-local-connector-user-jwt-proxy.mjs
          node test-tenant-local-connector-error-taxonomy.mjs

      - name: Verify bounded final scope
        run: |
          rm -f .github/workflows/tmp-tenant-local-connector-taxonomy-materializer.yml
          rm -f .github/tmp/tenant-local-connector-taxonomy-materialize.py
          git add -A
          git diff --cached --check
          actual="$(git diff --cached --name-only origin/main | sort)"
          expected="$(printf '%s\n' '.changes/e2e/tenant-local-connector-error-taxonomy.json' 'http-generic-api/routes/connectorProxyRoutes.js' 'http-generic-api/test-tenant-local-connector-error-taxonomy.mjs' | sort)"
          test "$actual" = "$expected"

      - name: Commit candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(connector): type tenant Local Connector provider failures'
          git push origin HEAD:fix/tenant-local-connector-error-taxonomy-4451-20260808
