      - name: Run focused regressions
        working-directory: http-generic-api
        run: |
          node --check routes/connectorProxyRoutes.js
          node test-tenant-local-connector-user-jwt-proxy.mjs
          node test-tenant-local-connector-error-taxonomy.mjs

