name: Observe Spec 014 Wave 1 Runtime Readiness 6215 v1

on:
  pull_request:
    branches:
      - gpt/observe-spec014-wave1-runtime-readiness-6215-v1
    types: [opened, reopened, synchronize]

permissions:
  actions: read
  contents: read

concurrency:
  group: observe-spec014-wave1-runtime-readiness-6215-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  observe:
    name: Collect terminal structured runtime evidence
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/trigger-observe-spec014-wave1-runtime-readiness-6215-v1' &&
      github.event.pull_request.base.ref == 'gpt/observe-spec014-wave1-runtime-readiness-6215-v1'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      WORKFLOW_FILE: spec014-wave1-runtime-readiness.yml
      EXPECTED_EVENT_HEAD: d76dc2bf9b073a18c2fa51cd5907cb30f0c03ab4
      EXPECTED_COMMENT_ID: '5179409708'
      EVIDENCE_DIR: ${{ runner.temp }}/spec014-wave1-runtime-observer
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Initialize bounded observer evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/target-artifact"
          jq -n \
            --arg contract "spec014_wave1_runtime_observer.v1" \
            --arg expected_head "$EXPECTED_EVENT_HEAD" \
            --arg expected_comment_id "$EXPECTED_COMMENT_ID" \
            '{contract:$contract,expected_event_head:$expected_head,expected_comment_id:$expected_comment_id,actions_read_only:true,repository_write:false,provider_call:false,migration_apply:false,secrets_included:false}' \
            > "$EVIDENCE_DIR/observer-start.json"

      - name: Discover exact issue-comment workflow run
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs?event=issue_comment&per_page=20"
          for attempt in $(seq 1 40); do
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" > "$EVIDENCE_DIR/workflow-runs.json"
            run_id="$(jq -r --arg sha "$EXPECTED_EVENT_HEAD" '
              [.workflow_runs[]
                | select(.event == "issue_comment")
                | select(.head_sha == $sha)
                | select(.name == "Spec 014 Wave 1 Runtime Readiness")]
              | sort_by(.created_at)
              | reverse
              | .[0].id // empty
            ' "$EVIDENCE_DIR/workflow-runs.json")"
            if [[ -n "$run_id" ]]; then
              printf '%s\n' "$run_id" > "$EVIDENCE_DIR/target-run-id.txt"
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "Exact issue-comment run was not discovered within bounded polling." >&2
          exit 1

      - name: Wait for terminal target run and collect jobs
        shell: bash
        env:
          TARGET_RUN_ID: ${{ steps.discover.outputs.run_id }}
        run: |
          set -euo pipefail
          run_api="https://api.github.com/repos/${REPOSITORY}/actions/runs/${TARGET_RUN_ID}"
          jobs_api="https://api.github.com/repos/${REPOSITORY}/actions/runs/${TARGET_RUN_ID}/jobs?per_page=100"
          for attempt in $(seq 1 120); do
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$run_api" > "$EVIDENCE_DIR/target-run.json"
            status="$(jq -r '.status' "$EVIDENCE_DIR/target-run.json")"
            if [[ "$status" == "completed" ]]; then
              break
            fi
            sleep 15
          done
          test "$(jq -r '.status' "$EVIDENCE_DIR/target-run.json")" = completed
          test "$(jq -r '.event' "$EVIDENCE_DIR/target-run.json")" = issue_comment
          test "$(jq -r '.head_sha' "$EVIDENCE_DIR/target-run.json")" = "$EXPECTED_EVENT_HEAD"
          test "$(jq -r '.name' "$EVIDENCE_DIR/target-run.json")" = "Spec 014 Wave 1 Runtime Readiness"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$jobs_api" > "$EVIDENCE_DIR/target-jobs.json"

      - name: Download exact runtime Artifact
        shell: bash
        env:
          TARGET_RUN_ID: ${{ steps.discover.outputs.run_id }}
        run: |
          set -euo pipefail
          artifacts_api="https://api.github.com/repos/${REPOSITORY}/actions/runs/${TARGET_RUN_ID}/artifacts?per_page=100"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$artifacts_api" > "$EVIDENCE_DIR/target-artifacts.json"
          artifact_id="$(jq -r '[.artifacts[] | select(.name | startswith("spec014-wave1-runtime-readiness-"))] | .[0].id // empty' "$EVIDENCE_DIR/target-artifacts.json")"
          test -n "$artifact_id"
          printf '%s\n' "$artifact_id" > "$EVIDENCE_DIR/target-artifact-id.txt"
          curl --fail-with-body --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            --output "$EVIDENCE_DIR/target-artifact.zip"
          unzip -q "$EVIDENCE_DIR/target-artifact.zip" -d "$EVIDENCE_DIR/target-artifact"

      - name: Validate sanitized runtime evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          summary="$EVIDENCE_DIR/target-artifact/summary.json"
          failure="$EVIDENCE_DIR/target-artifact/failure.json"
          state="$EVIDENCE_DIR/target-artifact/state.json"
          test -f "$state"
          jq -e '
            .apply_authorized == false and
            .apply_sent == false and
            .migration_apply_executed == false and
            .provider_call_executed == false and
            .credential_payload_accessed == false and
            .external_business_write_executed == false and
            .secrets_included == false
          ' "$state" >/dev/null
          if [[ -f "$summary" ]]; then
            jq -e '
              (.result == "pass" or .result == "already_applied") and
              .apply_authorized == false and
              .apply_sent == false and
              .migration_apply_executed == false and
              .provider_call_executed == false and
              .credential_payload_accessed == false and
              .external_business_write_executed == false and
              .secrets_included == false
            ' "$summary" >/dev/null
          else
            test -f "$failure"
            jq -e '
              .ok == false and
              .apply_authorized == false and
              .apply_sent == false and
              .migration_apply_executed == false and
              .provider_call_executed == false and
              .credential_payload_accessed == false and
              .external_business_write_executed == false and
              .secrets_included == false
            ' "$failure" >/dev/null
          fi

      - name: Write observer result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          target_run_id="$(cat "$EVIDENCE_DIR/target-run-id.txt" 2>/dev/null || true)"
          target_artifact_id="$(cat "$EVIDENCE_DIR/target-artifact-id.txt" 2>/dev/null || true)"
          target_status="$(jq -r '.status // "unknown"' "$EVIDENCE_DIR/target-run.json" 2>/dev/null || echo unknown)"
          target_conclusion="$(jq -r '.conclusion // "unknown"' "$EVIDENCE_DIR/target-run.json" 2>/dev/null || echo unknown)"
          evidence_result="unknown"
          if [[ -f "$EVIDENCE_DIR/target-artifact/summary.json" ]]; then
            evidence_result="$(jq -r '.result' "$EVIDENCE_DIR/target-artifact/summary.json")"
          elif [[ -f "$EVIDENCE_DIR/target-artifact/failure.json" ]]; then
            evidence_result="failure"
          fi
          jq -n \
            --arg target_run_id "$target_run_id" \
            --arg target_artifact_id "$target_artifact_id" \
            --arg target_status "$target_status" \
            --arg target_conclusion "$target_conclusion" \
            --arg evidence_result "$evidence_result" \
            '{contract:"spec014_wave1_runtime_observer_result.v1",target_run_id:$target_run_id,target_artifact_id:$target_artifact_id,target_status:$target_status,target_conclusion:$target_conclusion,evidence_result:$evidence_result,repository_write:false,migration_apply_executed:false,provider_call_executed:false,credential_payload_accessed:false,external_business_write_executed:false,secrets_included:false}' \
            > "$EVIDENCE_DIR/observer-result.json"
          cat "$EVIDENCE_DIR/observer-result.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload observer and copied runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observe-spec014-wave1-runtime-readiness-6215-v1-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 14
