name: Build Production Reconciliation Candidate V9 20260803

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/build-production-reconciliation-candidate-v9-20260803.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-production-reconciliation-candidate-v9-20260803
  cancel-in-progress: false

jobs:
  build:
    name: Build exact history-preserving Production candidate
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/build-production-reconciliation-candidate-v9-20260803' &&
      github.event.pull_request.user.id == 271942579
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      BUILDER_PR: ${{ github.event.pull_request.number }}
      REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      REQUEST_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      WORKFLOW_PATH: .github/workflows/build-production-reconciliation-candidate-v9-20260803.yml
      REQUIRED_CLASSIFIER_FIX_SHA: dd929093dd83d2c91ac817ff60d324eca2b71e51
      REQUIRED_RUNTIME_FIX_SHA: c7f7be81b811caf3c1112372ab1089fc5ee3714c

    steps:
      - name: Checkout exact one-file request
        uses: actions/checkout@v5
        with:
          ref: ${{ env.REQUEST_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable Builder boundary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "${REQUEST_HEAD_REF}" = "gpt/build-production-reconciliation-candidate-v9-20260803"
          test "$(git rev-parse HEAD)" = "${REQUEST_HEAD_SHA}"
          mapfile -t files < <(gh api --paginate "/repos/${REPOSITORY}/pulls/${BUILDER_PR}/files?per_page=100" --jq '.[].filename')
          test "${#files[@]}" -eq 1
          test "${files[0]}" = "${WORKFLOW_PATH}"

      - name: Pin live main and Production
        id: refs
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/Production:refs/remotes/origin/Production"
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          production_sha="$(git rev-parse refs/remotes/origin/Production)"
          test "${main_sha}" != "${production_sha}"
          git merge-base --is-ancestor "${REQUIRED_CLASSIFIER_FIX_SHA}" "${main_sha}"
          git merge-base --is-ancestor "${REQUIRED_RUNTIME_FIX_SHA}" "${main_sha}"
          echo "main_sha=${main_sha}" >> "${GITHUB_OUTPUT}"
          echo "production_sha=${production_sha}" >> "${GITHUB_OUTPUT}"

      - name: Reset to clean live main and validate classifier
        shell: bash
        run: |
          set -Eeuo pipefail
          git checkout --detach '${{ steps.refs.outputs.main_sha }}'
          test ! -e "${WORKFLOW_PATH}"
          test -z "$(git status --short)"
          node --check http-generic-api/scripts/e2e-parallel-pr-gate.mjs
          node http-generic-api/scripts/e2e-parallel-pr-flow-self-test.mjs

      - name: Create and classify exact reconciliation commit
        id: candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          main_sha='${{ steps.refs.outputs.main_sha }}'
          production_sha='${{ steps.refs.outputs.production_sha }}'
          main_tree="$(git rev-parse "${main_sha}^{tree}")"

          export GIT_AUTHOR_NAME='mad4bdigital-ai'
          export GIT_AUTHOR_EMAIL='271942579+mad4bdigital-ai@users.noreply.github.com'
          export GIT_COMMITTER_NAME='mad4bdigital-ai'
          export GIT_COMMITTER_EMAIL='271942579+mad4bdigital-ai@users.noreply.github.com'

          candidate_sha="$(printf '%s\n' \
            'chore(production): reconcile Production history to exact main tree' \
            '' \
            "Main parent: ${main_sha}" \
            "Production parent: ${production_sha}" \
            'Tree authority: exact current main tree' \
            'No force update, SQL, migration, provider, credential, deployment, or external-send mutation.' \
            | git commit-tree "${main_tree}" -p "${main_sha}" -p "${production_sha}")"
          candidate_ref="release/production-candidate-20260803-${candidate_sha:0:8}-v9"

          test "$(git rev-parse "${candidate_sha}^{tree}")" = "${main_tree}"
          mapfile -t parents < <(git show -s --format='%P' "${candidate_sha}")
          read -r parent_one parent_two extra <<< "${parents[0]}"
          test "${parent_one}" = "${main_sha}"
          test "${parent_two}" = "${production_sha}"
          test -z "${extra:-}"

          gate_report="${RUNNER_TEMP}/production-candidate-gate.json"
          node http-generic-api/scripts/e2e-parallel-pr-gate.mjs check \
            --base "${production_sha}" \
            --head "${candidate_sha}" \
            --head-ref "${candidate_ref}" \
            --base-ref Production \
            --report-file "${gate_report}"
          jq -e --arg main "${main_sha}" '.ok == true and .pr_mode == "standard" and .production_promotion == true and .production_promotion_identity == "history_preserving_main_reconciliation" and .phase_evaluation_base == $main' "${gate_report}"

          phase_report="${RUNNER_TEMP}/production-candidate-phase.json"
          execution_report="${RUNNER_TEMP}/production-candidate-execution.json"
          node http-generic-api/scripts/e2e-phase-governance.mjs check \
            --base "${main_sha}" \
            --head "${candidate_sha}" \
            --report-file "${phase_report}"
          node http-generic-api/scripts/e2e-phase-governance.mjs run \
            --base "${main_sha}" \
            --head "${candidate_sha}" \
            --report-file "${phase_report}" \
            --execution-report-file "${execution_report}"
          jq -e '.ok == true' "${phase_report}"
          jq -e '.ok == true' "${execution_report}"

          echo "candidate_sha=${candidate_sha}" >> "${GITHUB_OUTPUT}"
          echo "candidate_ref=${candidate_ref}" >> "${GITHUB_OUTPUT}"
          echo "main_tree=${main_tree}" >> "${GITHUB_OUTPUT}"

      - name: Reconfirm protected refs and push only candidate branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/Production:refs/remotes/origin/Production"
          test "$(git rev-parse refs/remotes/origin/main)" = '${{ steps.refs.outputs.main_sha }}'
          test "$(git rev-parse refs/remotes/origin/Production)" = '${{ steps.refs.outputs.production_sha }}'
          git push origin '${{ steps.candidate.outputs.candidate_sha }}:refs/heads/${{ steps.candidate.outputs.candidate_ref }}'

      - name: Publish bounded candidate evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## Production reconciliation candidate built'
            echo
            echo "- Main parent: `${{ steps.refs.outputs.main_sha }}`"
            echo "- Production parent: `${{ steps.refs.outputs.production_sha }}`"
            echo "- Candidate head: `${{ steps.candidate.outputs.candidate_sha }}`"
            echo "- Candidate branch: `${{ steps.candidate.outputs.candidate_ref }}`"
            echo "- Candidate tree: `${{ steps.candidate.outputs.main_tree }}` — exact current main tree"
            echo '- Parent count/order, SHA-bound branch name, classifier identity, and phase evaluation/execution passed.'
            echo '- No protected ref, Production merge, deployment, provider call, database, SQL, migration, credential, secret, or external-send mutation occurred.'
          } > "${RUNNER_TEMP}/candidate-summary.md"
          gh pr comment "${BUILDER_PR}" --repo "${REPOSITORY}" --body-file "${RUNNER_TEMP}/candidate-summary.md"
