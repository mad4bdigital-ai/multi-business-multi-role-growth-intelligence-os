name: Frontend surface dispatch

on:
  pull_request:
    paths:
      - "http-generic-api/routes/**"
      - "http-generic-api/openapi.yaml"
      - "http-generic-api/openapi/**"
      - "http-generic-api/openapi-route-coverage.allowlist.json"
      - "http-generic-api/resource-api-coverage.manifest.json"
      - "http-generic-api/frontend-surface-policy.json"
      - "http-generic-api/frontend-surface-dispatch.generated.json"
      - "http-generic-api/public/connect/**"
      - "http-generic-api/public/platform/**"
      - "http-generic-api/package.json"
      - "http-generic-api/package-lock.json"
      - "http-generic-api/scripts/frontend-surface-dispatch.mjs"
      - "http-generic-api/scripts/openapi-route-coverage.mjs"
      - "http-generic-api/scripts/openapi-runtime-auth-sync.mjs"
      - "http-generic-api/scripts/test-manifest.mjs"
      - "http-generic-api/test-*.mjs"
      - "canonicals/openapi/custom-gpt-surfaces.yaml"
      - "specs/010-unified-platform-frontend/**"
      - ".github/workflows/frontend-surface-dispatch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dispatch-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: http-generic-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json
      - run: npm ci
      - name: Apply scoped diagnosed auth parity corrections
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path = "openapi/container-authority.yaml";
          const needle = "security: [{ backendBearerAuth: [] }, { backendApiKeyAuth: [] }]";
          const replacement = "security: [{ adminBearerAuth: [] }, { backendApiKeyAuth: [] }]";
          const markers = [
            "x-registry-tool-key: dynamic_container_canary_promotion",
            "x-registry-tool-key: dynamic_container_canary_rollback",
            "x-registry-tool-key: dynamic_container_canary_probe_sampler",
            "x-registry-tool-key: dynamic_container_preview_canary_probe_sampler",
          ];
          let source = fs.readFileSync(path, "utf8");
          const initialCount = source.split(needle).length - 1;
          if (initialCount !== 5) {
            throw new Error(`Expected 5 total backend bearer declarations before scoped repair, found ${initialCount}`);
          }
          for (const marker of markers) {
            const markerIndex = source.indexOf(marker);
            if (markerIndex < 0 || source.indexOf(marker, markerIndex + 1) >= 0) {
              throw new Error(`Expected one marker for ${marker}`);
            }
            const securityIndex = source.indexOf(needle, markerIndex);
            if (securityIndex < 0 || securityIndex - markerIndex > 500) {
              throw new Error(`Expected diagnosed security declaration near ${marker}`);
            }
            source = source.slice(0, securityIndex) + replacement + source.slice(securityIndex + needle.length);
          }
          const remainingIndexes = [];
          for (let index = source.indexOf(needle); index >= 0; index = source.indexOf(needle, index + needle.length)) {
            remainingIndexes.push(index);
          }
          if (remainingIndexes.length !== 1) {
            throw new Error(`Expected only the legitimate shadow sampler declaration to remain, found ${remainingIndexes.length}`);
          }
          const remainingContext = source.slice(Math.max(0, remainingIndexes[0] - 500), Math.min(source.length, remainingIndexes[0] + needle.length + 180));
          if (!remainingContext.includes("x-registry-tool-key: dynamic_container_shadow_sampler")) {
            throw new Error("The remaining backend bearer declaration is not the expected shadow sampler declaration");
          }
          fs.writeFileSync(path, source);
          NODE
      - name: Resolve current main baseline
        run: |
          git fetch origin main --depth=1
          echo "BASELINE_REF=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
      - name: Generate source-pinned dispatch plan
        run: npm run frontend:dispatch:generate -- --baseline-ref="$BASELINE_REF"
      - name: Print remaining auth parity mismatches
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const report = JSON.parse(fs.readFileSync("frontend-surface-dispatch.generated.json", "utf8"));
          const mismatches = [];
          for (const family of report.families || []) {
            for (const operation of family.operations || []) {
              const state = operation?.auth_parity?.state;
              if (state && !["equivalent", "exempt"].includes(state)) {
                mismatches.push({ family_key: family.family_key, signature: operation.signature, state, reasons: operation.auth_parity?.reasons || [], runtime_auth: operation.runtime_auth, openapi_auth: operation.openapi_auth });
              }
            }
          }
          console.log(JSON.stringify({ mismatch_count: mismatches.length, mismatches }, null, 2));
          NODE
      - name: Verify generator contract and auth parity
        run: |
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-openapi-route-coverage.mjs
          npm run openapi:auth:check
      - name: Commit validated repair and generated evidence
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi/container-authority.yaml frontend-surface-dispatch.generated.json openapi/frontend-runtime-routes.generated.yaml
          if ! git diff --cached --quiet; then
            git commit -m "fix(openapi): complete admin auth parity alignment"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Enforce committed deterministic output
        run: |
          if [[ -n "$(git status --porcelain -- openapi/container-authority.yaml frontend-surface-dispatch.generated.json openapi/frontend-runtime-routes.generated.yaml)" ]]; then
            git diff --no-ext-diff --unified=1 -- openapi/container-authority.yaml frontend-surface-dispatch.generated.json openapi/frontend-runtime-routes.generated.yaml || true
            echo "::error::auth parity repair or generated evidence is missing or stale."
            exit 1
          fi
      - name: Upload dispatch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-surface-dispatch
          path: |
            http-generic-api/frontend-surface-dispatch.generated.json
            http-generic-api/openapi/frontend-runtime-routes.generated.yaml
          if-no-files-found: error
          retention-days: 14
