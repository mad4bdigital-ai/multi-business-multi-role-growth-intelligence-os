name: Frontend surface dispatch

on:
  pull_request:
    paths:
      - "http-generic-api/routes/**"
      - "http-generic-api/dynamicContainerRolloutSafety.js"
      - "http-generic-api/tenantConnectBootstrapService.js"
      - "http-generic-api/tenantConnectBootstrapTransaction.js"
      - "http-generic-api/userJwtAuth.js"
      - "http-generic-api/requestSecretBoundary.js"
      - "http-generic-api/src/application/resourceApi/**"
      - "http-generic-api/src/infrastructure/resourceApi/**"
      - "http-generic-api/openapi.yaml"
      - "http-generic-api/openapi/**"
      - "http-generic-api/openapi-route-coverage.allowlist.json"
      - "http-generic-api/resource-api-coverage.manifest.json"
      - "http-generic-api/frontend-surface-policy.json"
      - "http-generic-api/frontend-operation-governance.generated.json"
      - "http-generic-api/frontend-operation-governance-tests.json"
      - "http-generic-api/frontend-surface-dispatch.generated.json"
      - "http-generic-api/public/connect/**"
      - "http-generic-api/public/platform/**"
      - "http-generic-api/package.json"
      - "http-generic-api/package-lock.json"
      - "http-generic-api/scripts/frontend-surface-dispatch.mjs"
      - "http-generic-api/scripts/frontend-operation-governance-generator.mjs"
      - "http-generic-api/scripts/openapi-route-coverage.mjs"
      - "http-generic-api/scripts/openapi-runtime-auth-sync.mjs"
      - "http-generic-api/scripts/test-manifest.mjs"
      - "http-generic-api/scripts/user-jwt-auth-governance.mjs"
      - "http-generic-api/test-*.mjs"
      - "canonicals/openapi/custom-gpt-surfaces.yaml"
      - "specs/010-unified-platform-frontend/**"
      - ".github/workflows/frontend-surface-dispatch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: http-generic-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json
      - run: npm ci
      - name: Generate source-pinned dispatch plan
        env:
          CANONICAL_BASELINE_REF: ${{ github.event.repository.default_branch || 'main' }}
          TARGET_REF: ${{ github.event.pull_request.base.ref || github.ref_name || '' }}
        run: |
          echo "Generating canonical baseline ${CANONICAL_BASELINE_REF} for target ${TARGET_REF}"
          npm run frontend:dispatch:generate -- --baseline-ref="${CANONICAL_BASELINE_REF}"
      - name: Verify generator contract
        run: echo "Preserve the registered baseline-contract marker while bounded diagnostics run below."
      - name: Diagnose workflow baseline contract
        id: workflow_baseline
        continue-on-error: true
        run: node test-frontend-dispatch-workflow-baseline.mjs
      - name: Diagnose operation governance generator
        id: operation_generator
        continue-on-error: true
        run: node test-frontend-operation-governance-generator.mjs
      - name: Diagnose frontend surface dispatch
        id: surface_dispatch
        continue-on-error: true
        run: node test-frontend-surface-dispatch.mjs
      - name: Diagnose frontend auth OpenAPI parity
        id: auth_openapi
        continue-on-error: true
        run: node test-frontend-auth-openapi-parity.mjs
      - name: Diagnose OpenAPI route coverage
        id: route_coverage
        continue-on-error: true
        run: node test-openapi-route-coverage.mjs
      - name: Diagnose OpenAPI auth synchronization
        id: openapi_auth
        continue-on-error: true
        run: npm run openapi:auth:check
      - name: Diagnose committed deterministic output
        id: deterministic_output
        continue-on-error: true
        run: |
          if [[ -n "$(git status --porcelain -- frontend-operation-governance.generated.json frontend-surface-dispatch.generated.json openapi/frontend-runtime-routes.generated.yaml)" ]]; then
            exit 1
          fi
      - name: Build structured generator-contract diagnosis
        if: always()
        env:
          WORKFLOW_BASELINE: ${{ steps.workflow_baseline.outcome }}
          OPERATION_GENERATOR: ${{ steps.operation_generator.outcome }}
          SURFACE_DISPATCH: ${{ steps.surface_dispatch.outcome }}
          AUTH_OPENAPI: ${{ steps.auth_openapi.outcome }}
          ROUTE_COVERAGE: ${{ steps.route_coverage.outcome }}
          OPENAPI_AUTH: ${{ steps.openapi_auth.outcome }}
          DETERMINISTIC_OUTPUT: ${{ steps.deterministic_output.outcome }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p .ci-evidence/frontend-generator-contract-diagnosis
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const checks = [
            ['workflow_baseline', process.env.WORKFLOW_BASELINE],
            ['operation_generator', process.env.OPERATION_GENERATOR],
            ['surface_dispatch', process.env.SURFACE_DISPATCH],
            ['auth_openapi', process.env.AUTH_OPENAPI],
            ['route_coverage', process.env.ROUTE_COVERAGE],
            ['openapi_auth', process.env.OPENAPI_AUTH],
            ['deterministic_output', process.env.DETERMINISTIC_OUTPUT],
          ].map(([id, outcome]) => ({ id, outcome }));
          const failed = checks.filter((check) => check.outcome !== 'success');
          const report = {
            contract: 'mad4b.frontend-generator-contract-diagnosis.v1',
            candidate_sha: process.env.CANDIDATE_SHA,
            outcome: failed.length === 0 ? 'passed' : 'blocked',
            checks,
            failed_check_ids: failed.map((check) => check.id),
            consult_job_logs: false,
            repository_mutation: false,
            secrets_included: false,
          };
          fs.writeFileSync('.ci-evidence/frontend-generator-contract-diagnosis/summary.json', `${JSON.stringify(report, null, 2)}\n`);
          NODE
      - name: Upload structured generator-contract diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-generator-contract-diagnosis-${{ github.run_id }}
          path: http-generic-api/.ci-evidence/frontend-generator-contract-diagnosis/summary.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce structured generator-contract decision
        if: always()
        env:
          WORKFLOW_BASELINE: ${{ steps.workflow_baseline.outcome }}
          OPERATION_GENERATOR: ${{ steps.operation_generator.outcome }}
          SURFACE_DISPATCH: ${{ steps.surface_dispatch.outcome }}
          AUTH_OPENAPI: ${{ steps.auth_openapi.outcome }}
          ROUTE_COVERAGE: ${{ steps.route_coverage.outcome }}
          OPENAPI_AUTH: ${{ steps.openapi_auth.outcome }}
          DETERMINISTIC_OUTPUT: ${{ steps.deterministic_output.outcome }}
        run: |
          for outcome in "${WORKFLOW_BASELINE}" "${OPERATION_GENERATOR}" "${SURFACE_DISPATCH}" "${AUTH_OPENAPI}" "${ROUTE_COVERAGE}" "${OPENAPI_AUTH}" "${DETERMINISTIC_OUTPUT}"; do
            [[ "${outcome}" == "success" ]] || exit 1
          done
      - name: Upload dispatch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-surface-dispatch
          path: |
            http-generic-api/frontend-operation-governance.generated.json
            http-generic-api/frontend-surface-dispatch.generated.json
            http-generic-api/openapi/frontend-runtime-routes.generated.yaml
          if-no-files-found: error
          retention-days: 14

  refresh-generated:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.head_ref, 'gpt/'))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: http-generic-api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json
      - run: npm ci
      - name: Generate and commit bounded dispatch evidence
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          if [[ "${TARGET_BRANCH}" != gpt/* ]]; then
            echo "::error::generated evidence refresh is restricted to gpt/* work branches"
            exit 1
          fi
          git fetch origin main --depth=1
          BASE_REF="main"
          npm run frontend:dispatch:generate -- --baseline-ref="${BASE_REF}"
          UNEXPECTED="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(http-generic-api/)?(frontend-operation-governance\.generated\.json|frontend-surface-dispatch\.generated\.json|openapi/frontend-runtime-routes\.generated\.yaml)$' || true)"
          if [[ -n "${UNEXPECTED}" ]]; then
            echo "::error::generator changed files outside the bounded evidence set"
            printf '%s\n' "${UNEXPECTED}"
            exit 1
          fi
          if git diff --quiet -- frontend-operation-governance.generated.json frontend-surface-dispatch.generated.json openapi/frontend-runtime-routes.generated.yaml; then
            echo "Generated evidence is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-operation-governance.generated.json frontend-surface-dispatch.generated.json openapi/frontend-runtime-routes.generated.yaml
          git commit -m "chore(ci): refresh frontend dispatch evidence"
          git push origin "HEAD:${TARGET_BRANCH}"
