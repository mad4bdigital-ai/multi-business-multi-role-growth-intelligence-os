name: Frontend surface dispatch

on:
  pull_request:
    paths:
      - "http-generic-api/routes/**"
      - "http-generic-api/dynamicContainerRolloutSafety.js"
      - "http-generic-api/tenantConnectBootstrapService.js"
      - "http-generic-api/tenantConnectBootstrapTransaction.js"
      - "http-generic-api/userJwtAuth.js"
      - "http-generic-api/requestSecretBoundary.js"
      - "http-generic-api/src/application/resourceApi/**"
      - "http-generic-api/src/infrastructure/resourceApi/**"
      - "http-generic-api/openapi.yaml"
      - "http-generic-api/openapi/**"
      - "http-generic-api/openapi-route-coverage.allowlist.json"
      - "http-generic-api/resource-api-coverage.manifest.json"
      - "http-generic-api/frontend-surface-policy.json"
      - "http-generic-api/frontend-operation-governance.generated.json"
      - "http-generic-api/frontend-operation-governance-tests.json"
      - "http-generic-api/frontend-surface-dispatch.generated.json"
      - "http-generic-api/public/connect/**"
      - "http-generic-api/public/platform/**"
      - "http-generic-api/package.json"
      - "http-generic-api/package-lock.json"
      - "http-generic-api/scripts/frontend-surface-dispatch.mjs"
      - "http-generic-api/scripts/frontend-dispatch-verification-evidence.mjs"
      - "http-generic-api/scripts/test-frontend-dispatch-verification-evidence.mjs"
      - "http-generic-api/scripts/test-openapi-runtime-auth-sync-operation-insertion.mjs"
      - "http-generic-api/scripts/frontend-operation-governance-generator.mjs"
      - "http-generic-api/scripts/openapi-route-coverage.mjs"
      - "http-generic-api/scripts/openapi-runtime-auth-sync.mjs"
      - "http-generic-api/scripts/test-manifest.mjs"
      - "http-generic-api/scripts/user-jwt-auth-governance.mjs"
      - "http-generic-api/test-*.mjs"
      - "canonicals/openapi/custom-gpt-surfaces.yaml"
      - "specs/010-unified-platform-frontend/**"
      - ".github/workflows/frontend-surface-dispatch.yml"
      - ".github/workflows/frontend-surface-dispatch-refresh.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: http-generic-api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json
      - run: npm ci
      - name: Validate exact-operation OpenAPI auth repair
        run: node scripts/test-openapi-runtime-auth-sync-operation-insertion.mjs
      - name: Generate source-pinned dispatch plan and bounded auth repair
        env:
          CANONICAL_BASELINE_REF: ${{ github.event.repository.default_branch || 'main' }}
          TARGET_REF: ${{ github.event.pull_request.base.ref || github.ref_name || '' }}
        run: |
          set -euo pipefail
          echo "Synchronizing canonical baseline ${CANONICAL_BASELINE_REF} for target ${TARGET_REF}"
          git fetch origin "${CANONICAL_BASELINE_REF}" --depth=1
          git branch -f "${CANONICAL_BASELINE_REF}" "origin/${CANONICAL_BASELINE_REF}"
          node scripts/openapi-runtime-auth-sync.mjs --write
          npm run frontend:dispatch:generate -- --baseline-ref="${CANONICAL_BASELINE_REF}"
      - name: Guard bounded generated evidence set
        shell: bash
        run: |
          set -euo pipefail
          UNEXPECTED="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(http-generic-api/)?(openapi\.yaml|openapi/support-tickets\.yaml|frontend-operation-governance\.generated\.json|frontend-surface-dispatch\.generated\.json|openapi/frontend-runtime-routes\.generated\.yaml)$' || true)"
          if [[ -n "${UNEXPECTED}" ]]; then
            echo "::error::generator changed files outside the bounded evidence set"
            printf '%s\n' "${UNEXPECTED}"
            exit 1
          fi
      - name: Verify generator contract evidence reporter
        run: node scripts/test-frontend-dispatch-verification-evidence.mjs
      - name: Generate structured frontend dispatch verification evidence
        id: frontend_verification
        continue-on-error: true
        env:
          CI_CANDIDATE_KIND: ${{ github.event_name == 'pull_request' && 'merge_candidate' || 'head' }}
          CI_CANDIDATE_SHA: ${{ github.sha }}
          CI_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FRONTEND_DISPATCH_EVIDENCE_DIR: ${{ runner.temp }}/frontend-dispatch-verification-evidence
        run: node scripts/frontend-dispatch-verification-evidence.mjs --output-dir "$FRONTEND_DISPATCH_EVIDENCE_DIR"
      - name: Upload structured frontend dispatch verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dispatch-verification-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/frontend-dispatch-verification-evidence/*
          if-no-files-found: error
          retention-days: 14
      - name: Enforce structured frontend dispatch decision
        if: always()
        env:
          REPORT_PATH: ${{ runner.temp }}/frontend-dispatch-verification-evidence/frontend-dispatch-verification-evidence.json
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const reportPath = process.env.REPORT_PATH;
            if (!reportPath || !fs.existsSync(reportPath)) {
              console.error(JSON.stringify({ ok: false, error: "frontend_dispatch_structured_report_missing", secrets_included: false }));
              process.exit(1);
            }
            const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
            const valid = report.contract === "mad4b.frontend-dispatch-verification-evidence.v1" && report.secrets_included === false;
            if (!valid || report.outcome !== "passed") {
              console.error(JSON.stringify({
                ok: false,
                outcome: report.outcome || "evidence_error",
                first_failure: report.first_failure?.stage_id || "invalid_structured_report",
                consult_job_logs: report.routing?.consult_job_logs === true,
                secrets_included: false,
              }));
              process.exit(1);
            }
            console.log(JSON.stringify({ ok: true, outcome: report.outcome, candidate_sha: report.identity?.candidate_sha, secrets_included: false }));
          '
      - name: Upload bounded generated and canonical repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-surface-dispatch
          path: |
            http-generic-api/openapi.yaml
            http-generic-api/openapi/support-tickets.yaml
            http-generic-api/frontend-operation-governance.generated.json
            http-generic-api/frontend-surface-dispatch.generated.json
            http-generic-api/openapi/frontend-runtime-routes.generated.yaml
          if-no-files-found: error
          retention-days: 14

  exact-head-bootstrap:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'gpt/016-remote-mcp-oauth21-main-recovery-20260802'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: ${{ github.head_ref }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      REPORT_DIR: ${{ runner.temp }}/exact-head-frontend-evidence-bootstrap
    defaults:
      run:
        working-directory: http-generic-api
    steps:
      - name: Reject protected or unexpected target
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${TARGET_BRANCH}" != "gpt/016-remote-mcp-oauth21-main-recovery-20260802" ]]; then
            echo "::error::unexpected target branch"
            exit 1
          fi
          if [[ "${TARGET_BRANCH}" == "main" || "${TARGET_BRANCH}" == "Production" ]]; then
            echo "::error::protected branch mutation is forbidden"
            exit 1
          fi
          if [[ ! "${EXPECTED_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected head must be an exact lowercase SHA"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify exact local and remote head
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          LOCAL_HEAD_SHA="$(git rev-parse HEAD)"
          REMOTE_HEAD_SHA="$(git ls-remote --heads origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          if [[ "${LOCAL_HEAD_SHA}" != "${EXPECTED_HEAD_SHA}" || "${REMOTE_HEAD_SHA}" != "${EXPECTED_HEAD_SHA}" ]]; then
            echo "::error::branch head no longer matches the triggering exact SHA"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - run: npm ci

      - name: Generate and verify bounded evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-openapi-runtime-auth-sync-operation-insertion.mjs
          git fetch origin main --depth=1
          git branch -f main origin/main
          node scripts/openapi-runtime-auth-sync.mjs --write
          npm run frontend:dispatch:generate -- --baseline-ref=main
          UNEXPECTED="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(http-generic-api/)?(openapi\.yaml|openapi/support-tickets\.yaml|frontend-operation-governance\.generated\.json|frontend-surface-dispatch\.generated\.json|openapi/frontend-runtime-routes\.generated\.yaml)$' || true)"
          if [[ -n "${UNEXPECTED}" ]]; then
            echo "::error::generator changed files outside the bounded evidence set"
            printf '%s\n' "${UNEXPECTED}"
            exit 1
          fi
          node test-frontend-auth-openapi-parity.mjs
          npm run openapi:auth:check

      - name: Re-check exact remote head and commit bounded files
        id: commit
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_HEAD_SHA="$(git ls-remote --heads origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          LOCAL_HEAD_SHA="$(git rev-parse HEAD)"
          if [[ "${LOCAL_HEAD_SHA}" != "${EXPECTED_HEAD_SHA}" || "${REMOTE_HEAD_SHA}" != "${EXPECTED_HEAD_SHA}" ]]; then
            echo "::error::branch head changed during generation; refusing write"
            exit 1
          fi
          git add \
            http-generic-api/openapi.yaml \
            http-generic-api/openapi/support-tickets.yaml \
            http-generic-api/frontend-operation-governance.generated.json \
            http-generic-api/frontend-surface-dispatch.generated.json \
            http-generic-api/openapi/frontend-runtime-routes.generated.yaml
          if git diff --cached --quiet; then
            echo "::error::expected bounded generated evidence drift was not produced"
            exit 1
          fi
          CHANGED_FILES="$(git diff --cached --name-only | paste -sd, -)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ci): apply exact-head frontend and OpenAPI auth evidence"
          RESULT_SHA="$(git rev-parse HEAD)"
          git push origin "HEAD:${TARGET_BRANCH}"
          echo "result_sha=${RESULT_SHA}" >> "$GITHUB_OUTPUT"
          echo "changed_files=${CHANGED_FILES}" >> "$GITHUB_OUTPUT"

      - name: Write structured bootstrap evidence
        if: success()
        working-directory: .
        env:
          RESULT_SHA: ${{ steps.commit.outputs.result_sha }}
          CHANGED_FILES: ${{ steps.commit.outputs.changed_files }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${REPORT_DIR}"
          node --input-type=module -e '
            import fs from "node:fs";
            const report = {
              contract: "mad4b.exact-head-frontend-evidence-bootstrap.v1",
              outcome: "passed",
              target_branch: process.env.TARGET_BRANCH,
              expected_head_sha: process.env.EXPECTED_HEAD_SHA,
              result_sha: process.env.RESULT_SHA,
              changed_files: String(process.env.CHANGED_FILES || "").split(",").filter(Boolean),
              protected_branch_mutation: false,
              force_push: false,
              secrets_included: false,
            };
            fs.writeFileSync(`${process.env.REPORT_DIR}/result.json`, `${JSON.stringify(report, null, 2)}\n`);
          '

      - name: Upload structured bootstrap evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: exact-head-frontend-evidence-bootstrap-${{ github.run_id }}
          path: ${{ runner.temp }}/exact-head-frontend-evidence-bootstrap/result.json
          if-no-files-found: error
          retention-days: 14