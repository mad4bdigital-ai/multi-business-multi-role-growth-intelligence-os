name: Frontend surface dispatch

on:
  pull_request:
    paths:
      - "http-generic-api/routes/**"
      - "http-generic-api/dynamicContainerRolloutSafety.js"
      - "http-generic-api/tenantConnectBootstrapService.js"
      - "http-generic-api/tenantConnectBootstrapTransaction.js"
      - "http-generic-api/userJwtAuth.js"
      - "http-generic-api/requestSecretBoundary.js"
      - "http-generic-api/src/application/resourceApi/**"
      - "http-generic-api/src/infrastructure/resourceApi/**"
      - "http-generic-api/openapi.yaml"
      - "http-generic-api/openapi/**"
      - "http-generic-api/openapi-route-coverage.allowlist.json"
      - "http-generic-api/resource-api-coverage.manifest.json"
      - "http-generic-api/frontend-surface-policy.json"
      - "http-generic-api/frontend-operation-governance.generated.json"
      - "http-generic-api/frontend-operation-governance-tests.json"
      - "http-generic-api/frontend-surface-dispatch.generated.json"
      - "http-generic-api/public/connect/**"
      - "http-generic-api/public/platform/**"
      - "http-generic-api/package.json"
      - "http-generic-api/package-lock.json"
      - "http-generic-api/scripts/frontend-surface-dispatch.mjs"
      - "http-generic-api/scripts/frontend-operation-governance-generator.mjs"
      - "http-generic-api/scripts/openapi-route-coverage.mjs"
      - "http-generic-api/scripts/openapi-runtime-auth-sync.mjs"
      - "http-generic-api/scripts/test-manifest.mjs"
      - "http-generic-api/scripts/user-jwt-auth-governance.mjs"
      - "http-generic-api/test-*.mjs"
      - "canonicals/openapi/custom-gpt-surfaces.yaml"
      - "specs/010-unified-platform-frontend/**"
      - ".github/workflows/frontend-surface-dispatch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: http-generic-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json
      - run: npm ci
      - name: Generate source-pinned dispatch plan
        id: generate_plan
        continue-on-error: true
        env:
          CANONICAL_BASELINE_REF: ${{ github.event.repository.default_branch || 'main' }}
          TARGET_REF: ${{ github.event.pull_request.base.ref || github.ref_name || '' }}
        run: |
          echo "Generating canonical baseline ${CANONICAL_BASELINE_REF} for target ${TARGET_REF}"
          npm run frontend:dispatch:generate -- --baseline-ref="${CANONICAL_BASELINE_REF}"
      - name: Verify generator contract
        id: workflow_baseline
        continue-on-error: true
        run: node test-frontend-dispatch-workflow-baseline.mjs
      - name: Verify operation governance generator
        id: operation_generator
        continue-on-error: true
        run: node test-frontend-operation-governance-generator.mjs
      - name: Verify frontend surface dispatch
        id: surface_dispatch
        continue-on-error: true
        run: node test-frontend-surface-dispatch.mjs
      - name: Verify frontend auth OpenAPI parity
        id: auth_openapi
        continue-on-error: true
        run: node test-frontend-auth-openapi-parity.mjs
      - name: Verify OpenAPI route coverage
        id: route_coverage
        continue-on-error: true
        run: node test-openapi-route-coverage.mjs
      - name: Verify OpenAPI auth synchronization
        id: openapi_auth
        continue-on-error: true
        run: npm run openapi:auth:check
      - name: Check committed deterministic output
        id: deterministic_output
        continue-on-error: true
        run: |
          UNEXPECTED="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(http-generic-api/)?(frontend-operation-governance\.generated\.json|frontend-surface-dispatch\.generated\.json|openapi/frontend-runtime-routes\.generated\.yaml)$' || true)"
          if [[ -n "${UNEXPECTED}" ]]; then
            echo "::error::generator changed files outside the bounded Frontend evidence set"
            printf '%s\n' "${UNEXPECTED}"
            exit 1
          fi
          if [[ -n "$(git status --porcelain -- frontend-operation-governance.generated.json frontend-surface-dispatch.generated.json openapi/frontend-runtime-routes.generated.yaml)" ]]; then
            git diff --no-ext-diff --unified=1 -- frontend-operation-governance.generated.json frontend-surface-dispatch.generated.json openapi/frontend-runtime-routes.generated.yaml || true
            exit 1
          fi
      - name: Build structured generator-contract summary
        if: always()
        env:
          GENERATE_PLAN: ${{ steps.generate_plan.outcome }}
          WORKFLOW_BASELINE: ${{ steps.workflow_baseline.outcome }}
          OPERATION_GENERATOR: ${{ steps.operation_generator.outcome }}
          SURFACE_DISPATCH: ${{ steps.surface_dispatch.outcome }}
          AUTH_OPENAPI: ${{ steps.auth_openapi.outcome }}
          ROUTE_COVERAGE: ${{ steps.route_coverage.outcome }}
          OPENAPI_AUTH: ${{ steps.openapi_auth.outcome }}
          DETERMINISTIC_OUTPUT: ${{ steps.deterministic_output.outcome }}
          CANDIDATE_SHA: ${{ github.sha }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p .ci-evidence/frontend-generator-contract
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const checks = [
            ['workflow_baseline', process.env.WORKFLOW_BASELINE],
            ['operation_generator', process.env.OPERATION_GENERATOR],
            ['surface_dispatch', process.env.SURFACE_DISPATCH],
            ['auth_openapi', process.env.AUTH_OPENAPI],
            ['route_coverage', process.env.ROUTE_COVERAGE],
            ['openapi_auth', process.env.OPENAPI_AUTH],
            ['deterministic_output', process.env.DETERMINISTIC_OUTPUT],
          ].map(([id, outcome]) => ({ id, outcome }));
          const generation = { id: 'generate_plan', outcome: process.env.GENERATE_PLAN };
          const failed = [generation, ...checks].filter((check) => check.outcome !== 'success');
          const report = {
            contract: 'mad4b.frontend-generator-contract-summary.v1',
            candidate_sha: process.env.CANDIDATE_SHA,
            source_head_sha: process.env.SOURCE_HEAD_SHA,
            generation,
            checks,
            outcome: failed.length === 0 ? 'passed' : 'blocked',
            failed_check_ids: failed.map((check) => check.id),
            consult_job_logs: false,
            repository_mutation: false,
            secrets_included: false,
          };
          fs.writeFileSync('.ci-evidence/frontend-generator-contract/summary.json', `${JSON.stringify(report, null, 2)}\n`);
          NODE
      - name: Upload structured generator-contract summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-generator-contract-${{ github.run_id }}
          path: http-generic-api/.ci-evidence/frontend-generator-contract/summary.json
          if-no-files-found: error
          retention-days: 14
      - name: Build trusted workflow-run source evidence
        if: always()
        env:
          GENERATE_PLAN: ${{ steps.generate_plan.outcome }}
          WORKFLOW_BASELINE: ${{ steps.workflow_baseline.outcome }}
          OPERATION_GENERATOR: ${{ steps.operation_generator.outcome }}
          SURFACE_DISPATCH: ${{ steps.surface_dispatch.outcome }}
          AUTH_OPENAPI: ${{ steps.auth_openapi.outcome }}
          ROUTE_COVERAGE: ${{ steps.route_coverage.outcome }}
          OPENAPI_AUTH: ${{ steps.openapi_auth.outcome }}
          DETERMINISTIC_OUTPUT: ${{ steps.deterministic_output.outcome }}
          CANDIDATE_KIND: ${{ github.event_name == 'pull_request' && 'merge_candidate' || 'head' }}
          CANDIDATE_SHA: ${{ github.sha }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch || 'main' }}
        run: |
          mkdir -p .ci-evidence/frontend-dispatch-verification
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const stages = [
            ['generate_dispatch_plan', process.env.GENERATE_PLAN],
            ['workflow_baseline', process.env.WORKFLOW_BASELINE],
            ['operation_generator', process.env.OPERATION_GENERATOR],
            ['surface_dispatch', process.env.SURFACE_DISPATCH],
            ['auth_openapi', process.env.AUTH_OPENAPI],
            ['route_coverage', process.env.ROUTE_COVERAGE],
            ['openapi_auth', process.env.OPENAPI_AUTH],
            ['committed_generated_parity', process.env.DETERMINISTIC_OUTPUT],
          ].map(([stage_id, outcome]) => ({ stage_id, outcome }));
          const firstFailure = stages.find((stage) => stage.outcome !== 'success') || null;
          const fullSha = /^[0-9a-f]{40}$/u;
          const identityValid = fullSha.test(process.env.CANDIDATE_SHA || '')
            && fullSha.test(process.env.SOURCE_HEAD_SHA || '')
            && Boolean(process.env.HEAD_REF)
            && Boolean(process.env.BASE_REF);
          const report = {
            contract: 'mad4b.frontend-dispatch-verification-evidence.v1',
            outcome: firstFailure || !identityValid ? 'failed' : 'passed',
            identity: {
              workflow: 'Frontend surface dispatch',
              candidate_kind: process.env.CANDIDATE_KIND,
              candidate_sha: process.env.CANDIDATE_SHA,
              source_head_sha: process.env.SOURCE_HEAD_SHA,
              head_ref: process.env.HEAD_REF,
              base_ref: process.env.BASE_REF,
            },
            stages,
            first_failure: firstFailure || (identityValid ? null : {
              stage_id: 'candidate_identity',
              outcome: 'failure',
            }),
            routing: {
              consult_job_logs: false,
              delegated_writer: 'governed-generated-artifact-refresh.yml',
              dispatch_workflow: 'frontend-parity-refresh-dispatch.yml',
            },
            direct_repository_mutation: false,
            protected_branch_mutation: false,
            force_push: false,
            secrets_included: false,
          };
          fs.writeFileSync(
            '.ci-evidence/frontend-dispatch-verification/frontend-dispatch-verification-evidence.json',
            `${JSON.stringify(report, null, 2)}\n`,
          );
          NODE
      - name: Upload trusted workflow-run source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dispatch-verification-evidence-${{ github.run_id }}
          path: http-generic-api/.ci-evidence/frontend-dispatch-verification/frontend-dispatch-verification-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload dispatch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-surface-dispatch
          path: |
            http-generic-api/frontend-operation-governance.generated.json
            http-generic-api/frontend-surface-dispatch.generated.json
            http-generic-api/openapi/frontend-runtime-routes.generated.yaml
          if-no-files-found: error
          retention-days: 14
      - name: Enforce structured generator-contract decision
        if: always()
        env:
          GENERATE_PLAN: ${{ steps.generate_plan.outcome }}
          WORKFLOW_BASELINE: ${{ steps.workflow_baseline.outcome }}
          OPERATION_GENERATOR: ${{ steps.operation_generator.outcome }}
          SURFACE_DISPATCH: ${{ steps.surface_dispatch.outcome }}
          AUTH_OPENAPI: ${{ steps.auth_openapi.outcome }}
          ROUTE_COVERAGE: ${{ steps.route_coverage.outcome }}
          OPENAPI_AUTH: ${{ steps.openapi_auth.outcome }}
          DETERMINISTIC_OUTPUT: ${{ steps.deterministic_output.outcome }}
        run: |
          for outcome in "${GENERATE_PLAN}" "${WORKFLOW_BASELINE}" "${OPERATION_GENERATOR}" "${SURFACE_DISPATCH}" "${AUTH_OPENAPI}" "${ROUTE_COVERAGE}" "${OPENAPI_AUTH}" "${DETERMINISTIC_OUTPUT}"; do
            [[ "${outcome}" == "success" ]] || exit 1
          done
