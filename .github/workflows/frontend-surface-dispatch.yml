name: Frontend surface dispatch

on:
  pull_request:
    paths:
      - "http-generic-api/routes/**"
      - "http-generic-api/dynamicContainerRolloutSafety.js"
      - "http-generic-api/tenantConnectBootstrapService.js"
      - "http-generic-api/tenantConnectBootstrapTransaction.js"
      - "http-generic-api/userJwtAuth.js"
      - "http-generic-api/requestSecretBoundary.js"
      - "http-generic-api/src/application/resourceApi/**"
      - "http-generic-api/src/infrastructure/resourceApi/**"
      - "http-generic-api/openapi.yaml"
      - "http-generic-api/openapi/**"
      - "http-generic-api/openapi-route-coverage.allowlist.json"
      - "http-generic-api/resource-api-coverage.manifest.json"
      - "http-generic-api/frontend-surface-policy.json"
      - "http-generic-api/frontend-operation-governance.generated.json"
      - "http-generic-api/frontend-operation-governance-tests.json"
      - "http-generic-api/frontend-surface-dispatch.generated.json"
      - "http-generic-api/public/connect/**"
      - "http-generic-api/public/platform/**"
      - "http-generic-api/package.json"
      - "http-generic-api/package-lock.json"
      - "http-generic-api/scripts/frontend-surface-dispatch.mjs"
      - "http-generic-api/scripts/frontend-operation-governance-generator.mjs"
      - "http-generic-api/scripts/openapi-route-coverage.mjs"
      - "http-generic-api/scripts/openapi-runtime-auth-sync.mjs"
      - "http-generic-api/scripts/test-manifest.mjs"
      - "http-generic-api/scripts/user-jwt-auth-governance.mjs"
      - "http-generic-api/test-*.mjs"
      - "canonicals/openapi/custom-gpt-surfaces.yaml"
      - "specs/010-unified-platform-frontend/**"
      - ".github/workflows/frontend-surface-dispatch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: http-generic-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json
      - run: npm ci
      - name: Generate source-pinned dispatch plan
        env:
          CANONICAL_BASELINE_REF: ${{ github.event.repository.default_branch || 'main' }}
          TARGET_REF: ${{ github.event.pull_request.base.ref || github.ref_name || '' }}
        run: |
          echo "Generating canonical baseline ${CANONICAL_BASELINE_REF} for target ${TARGET_REF}"
          npm run frontend:dispatch:generate -- --baseline-ref="${CANONICAL_BASELINE_REF}"
      - name: Verify generator contract
        run: |
          node test-frontend-dispatch-workflow-baseline.mjs
          node test-frontend-operation-governance-generator.mjs
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-openapi-route-coverage.mjs
          npm run openapi:auth:check
      - name: Enforce committed deterministic output
        run: |
          if [[ -n "$(git status --porcelain -- frontend-operation-governance.generated.json frontend-surface-dispatch.generated.json openapi/frontend-runtime-routes.generated.yaml)" ]]; then
            git diff --no-ext-diff --unified=1 -- frontend-operation-governance.generated.json frontend-surface-dispatch.generated.json openapi/frontend-runtime-routes.generated.yaml || true
            echo "::error::frontend operation governance/dispatch/OpenAPI generated evidence is missing or stale; regenerate and commit it."
            exit 1
          fi
      - name: Upload dispatch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-surface-dispatch
          path: |
            http-generic-api/frontend-operation-governance.generated.json
            http-generic-api/frontend-surface-dispatch.generated.json
            http-generic-api/openapi/frontend-runtime-routes.generated.yaml
          if-no-files-found: error
          retention-days: 14

  refresh-generated:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: http-generic-api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json
      - run: npm ci
      - name: Generate and commit bounded dispatch evidence
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" != gpt/* ]]; then
            echo "::error::generated evidence refresh is restricted to gpt/* work branches"
            exit 1
          fi
          git fetch origin main --depth=1
          BASE_REF="main"
          npm run frontend:dispatch:generate -- --baseline-ref="${BASE_REF}"
          UNEXPECTED="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(http-generic-api/)?(frontend-operation-governance\.generated\.json|frontend-surface-dispatch\.generated\.json|openapi/frontend-runtime-routes\.generated\.yaml)$' || true)"
          if [[ -n "${UNEXPECTED}" ]]; then
            echo "::error::generator changed files outside the bounded evidence set"
            printf '%s\n' "${UNEXPECTED}"
            exit 1
          fi
          if git diff --quiet -- frontend-operation-governance.generated.json frontend-surface-dispatch.generated.json openapi/frontend-runtime-routes.generated.yaml; then
            echo "Generated evidence is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-operation-governance.generated.json frontend-surface-dispatch.generated.json openapi/frontend-runtime-routes.generated.yaml
          git commit -m "chore(ci): refresh frontend dispatch evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
