name: Frontend surface dispatch

on:
  push:
    branches:
      - gpt/pr-3162-final-current-main-20260730
    paths:
      - .github/workflows/frontend-surface-dispatch.yml

permissions:
  contents: write

concurrency:
  group: pr-3162-finalizer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize-pr-3162:
    name: Finalize PR 3162 on latest main
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/pr-3162-final-current-main-20260730
          fetch-depth: 0

      - name: Reconcile latest main and remove recovery scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main gpt/pr-3162-rebuild-main-20260730-v2

          if ! git diff --quiet 75be7437d72127b41ebf18a082bcc6a8fd85c58e..origin/main -- \
            http-generic-api/scripts/frontend-surface-dispatch.mjs \
            http-generic-api/test-frontend-surface-dispatch.mjs; then
            echo "::error::latest main changed the validated parser or its regression suite"
            exit 1
          fi

          set +e
          git merge --no-commit --no-ff origin/main
          MERGE_STATUS=$?
          set -e

          git checkout origin/main -- \
            .github/workflows/ci.yml \
            .github/workflows/frontend-surface-dispatch.yml
          git add \
            .github/workflows/ci.yml \
            .github/workflows/frontend-surface-dispatch.yml

          rm -f \
            .github/pr3162-finalize-dispatch-marker \
            .github/workflows/pr-3162-final-rebuild.yml
          git add -A -- \
            .github/pr3162-finalize-dispatch-marker \
            .github/workflows/pr-3162-final-rebuild.yml

          REMAINING_CONFLICTS="$(git diff --name-only --diff-filter=U)"
          if [[ -n "${REMAINING_CONFLICTS}" ]]; then
            echo "::error::unexpected reconciliation conflicts"
            printf '%s\n' "${REMAINING_CONFLICTS}"
            exit 1
          fi

          if [[ "${MERGE_STATUS}" -ne 0 ]] && ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            echo "::error::main reconciliation failed without a merge state"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m "chore: reconcile latest main and remove PR 3162 scaffolding"
          elif ! git diff --cached --quiet; then
            git commit -m "chore: remove PR 3162 scaffolding"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Apply validated parser and canonical auth contracts
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/gpt/pr-3162-rebuild-main-20260730-v2 -- \
            http-generic-api/scripts/frontend-surface-dispatch.mjs \
            http-generic-api/test-frontend-surface-dispatch.mjs \
            http-generic-api/openapi/local-connector-uninstall.yaml

          python3 - <<'PY'
          from pathlib import Path

          path = Path("http-generic-api/openapi.yaml")
          text = path.read_text()
          start_marker = "  /tenants/{tenant_id}/brands/{brand_key}/growth-intelligence/pilot:"
          end_marker = "  /tenants/{tenant_id}/relationships:"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit("Growth Intelligence OpenAPI start marker not found")
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit("Growth Intelligence OpenAPI end marker not found")

          section = text[start:end]
          old = "      security: [{ backendBearerAuth: [] }, { backendApiKeyAuth: [] }]"
          new = "      security: [{ adminBearerAuth: [] }, { backendApiKeyAuth: [] }]"
          old_count = section.count(old)
          new_count = section.count(new)
          if old_count + new_count != 7:
              raise SystemExit(
                  f"Growth Intelligence auth contracts: expected 7 total matches, "
                  f"found old={old_count}, new={new_count}"
              )
          path.write_text(text[:start] + section.replace(old, new) + text[end:])
          PY

      - name: Generate and prove final parity
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          node test-frontend-surface-dispatch.mjs
          npm run frontend:dispatch:generate -- --baseline-ref=main
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-openapi-route-coverage.mjs
          npm run openapi:auth:check
          node - <<'NODE'
          const fs = require('node:fs');
          const plan = JSON.parse(fs.readFileSync('frontend-surface-dispatch.generated.json', 'utf8'));
          const counts = plan.coverage?.auth_parity_counts || {};
          const result = {
            mismatch: counts.mismatch || 0,
            unknown: counts.unknown || 0,
            missing_openapi: counts.missing_openapi || 0,
            auth_contract_gap_count: plan.coverage?.auth_contract_gap_count || 0,
            openapi_gap_count: plan.coverage?.openapi_gap_count || 0,
          };
          console.log(JSON.stringify(result, null, 2));
          if (Object.values(result).some((value) => value !== 0)) process.exit(1);
          NODE

      - name: Commit bounded final product tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //')
          for path in "${changed[@]}"; do
            case "$path" in
              http-generic-api/frontend-operation-governance.generated.json|\
              http-generic-api/frontend-surface-dispatch.generated.json|\
              http-generic-api/openapi.yaml|\
              http-generic-api/openapi/frontend-runtime-routes.generated.yaml|\
              http-generic-api/openapi/local-connector-uninstall.yaml|\
              http-generic-api/scripts/frontend-surface-dispatch.mjs|\
              http-generic-api/test-frontend-surface-dispatch.mjs)
                ;;
              *)
                echo "::error::unexpected final product path: ${path}"
                exit 1
                ;;
            esac
          done

          git add \
            http-generic-api/frontend-operation-governance.generated.json \
            http-generic-api/frontend-surface-dispatch.generated.json \
            http-generic-api/openapi.yaml \
            http-generic-api/openapi/frontend-runtime-routes.generated.yaml \
            http-generic-api/openapi/local-connector-uninstall.yaml \
            http-generic-api/scripts/frontend-surface-dispatch.mjs \
            http-generic-api/test-frontend-surface-dispatch.mjs
          git commit -m "fix: finalize PR 3162 auth parity on latest main"
          git push origin HEAD:gpt/pr-3162-final-current-main-20260730
