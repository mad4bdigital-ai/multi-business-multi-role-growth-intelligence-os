name: Frontend surface dispatch

on:
  pull_request:
    paths:
      - "http-generic-api/routes/**"
      - "http-generic-api/openapi.yaml"
      - "http-generic-api/openapi/**"
      - "http-generic-api/openapi-route-coverage.allowlist.json"
      - "http-generic-api/resource-api-coverage.manifest.json"
      - "http-generic-api/frontend-surface-policy.json"
      - "http-generic-api/frontend-surface-dispatch.generated.json"
      - "http-generic-api/public/connect/**"
      - "http-generic-api/public/platform/**"
      - "http-generic-api/package.json"
      - "http-generic-api/package-lock.json"
      - "http-generic-api/scripts/frontend-surface-dispatch.mjs"
      - "http-generic-api/scripts/openapi-route-coverage.mjs"
      - "http-generic-api/scripts/openapi-runtime-auth-sync.mjs"
      - "http-generic-api/scripts/test-manifest.mjs"
      - "http-generic-api/test-*.mjs"
      - "canonicals/openapi/custom-gpt-surfaces.yaml"
      - "specs/010-unified-platform-frontend/**"
      - ".github/workflows/frontend-surface-dispatch.yml"
  workflow_dispatch:
    inputs:
      sync_openapi_guard:
        description: "Apply and generate the OpenAPI Response Object guard fix on the selected non-default branch"
        required: true
        default: false
        type: boolean
      baseline_ref:
        description: "Baseline ref for deterministic frontend dispatch generation"
        required: false
        default: "main"
        type: string

permissions:
  contents: read

jobs:
  dispatch-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: http-generic-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json
      - run: npm ci
      - name: Generate source-pinned dispatch plan
        run: npm run frontend:dispatch:generate -- --baseline-ref="${{ github.event.pull_request.base.ref || github.event.repository.default_branch || 'main' }}"
      - name: Verify generator contract
        run: |
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-openapi-route-coverage.mjs
          npm run openapi:auth:check
      - name: Enforce committed deterministic output
        run: |
          if [[ -n "$(git status --porcelain -- frontend-surface-dispatch.generated.json openapi/frontend-runtime-routes.generated.yaml)" ]]; then
            git diff --no-ext-diff --unified=1 -- frontend-surface-dispatch.generated.json openapi/frontend-runtime-routes.generated.yaml || true
            echo "::error::frontend dispatch/OpenAPI generated evidence is missing or stale; regenerate and commit it."
            exit 1
          fi
      - name: Upload dispatch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-surface-dispatch
          path: |
            http-generic-api/frontend-surface-dispatch.generated.json
            http-generic-api/openapi/frontend-runtime-routes.generated.yaml
          if-no-files-found: error
          retention-days: 14

  sync-openapi-guard:
    if: github.event_name == 'workflow_dispatch' && inputs.sync_openapi_guard == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        working-directory: http-generic-api
    steps:
      - name: Reject protected default branch
        working-directory: .
        run: |
          if [[ "${GITHUB_REF_NAME}" == "${{ github.event.repository.default_branch }}" ]]; then
            echo "::error::OpenAPI guard sync must target a non-default branch."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json
      - run: npm ci
      - name: Apply minimal source and generator changes
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceRequired(file, before, after, label) {
            const text = fs.readFileSync(file, 'utf8');
            if (text.includes(after)) return;
            if (!text.includes(before)) throw new Error(`Missing ${label} pattern in ${file}`);
            fs.writeFileSync(file, text.replace(before, after));
          }

          function insertAfterAll(file, anchor, addition) {
            let text = fs.readFileSync(file, 'utf8');
            if (text.includes(addition.trim())) return;
            const count = text.split(anchor).length - 1;
            if (count < 1) throw new Error(`Missing anchor in ${file}: ${anchor}`);
            text = text.split(anchor).join(anchor + addition);
            fs.writeFileSync(file, text);
          }

          replaceRequired(
            'openapi.yaml',
            '"409": { description: Incompatible case, binding mismatch, or concurrent update., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }',
            '"409": { description: "Incompatible case, binding mismatch, or concurrent update.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }',
            'quoted 409 description',
          );

          replaceRequired(
            'scripts/split-openapi.mjs',
            'import YAML from "yaml";\n\nconst __dirname = path.dirname(fileURLToPath(import.meta.url));',
            'import YAML from "yaml";\nimport { assertOpenApiResponseObjects } from "./openapi-response-object-guard.mjs";\n\nconst __dirname = path.dirname(fileURLToPath(import.meta.url));',
            'split guard import',
          );
          replaceRequired(
            'scripts/split-openapi.mjs',
            'function validateGeneratedDoc(doc, sourceDoc, surfaceKey, surface) {\n  const sourcePairs = new Set(',
            'function validateGeneratedDoc(doc, sourceDoc, surfaceKey, surface) {\n  assertOpenApiResponseObjects(doc, { source: surface.output_file || surfaceKey });\n  const sourcePairs = new Set(',
            'generated document guard',
          );
          replaceRequired(
            'scripts/split-openapi.mjs',
            '  const sourceDoc = YAML.parse(fs.readFileSync(SOURCE_OPENAPI_FILE, "utf8"));\n  const registry = YAML.parse(',
            '  const sourceDoc = YAML.parse(fs.readFileSync(SOURCE_OPENAPI_FILE, "utf8"));\n  assertOpenApiResponseObjects(sourceDoc, { source: path.relative(REPO_ROOT, SOURCE_OPENAPI_FILE) });\n  const registry = YAML.parse(',
            'canonical source guard',
          );

          replaceRequired(
            'scripts/generate-custom-gpt-schemas.mjs',
            'import YAML from "yaml";\nimport { validateOpenApiFiles } from "./openapi-builder-schema-guard.mjs";',
            'import YAML from "yaml";\nimport { validateOpenApiFiles } from "./openapi-builder-schema-guard.mjs";\nimport {\n  formatOpenApiResponseObjectIssue,\n  validateOpenApiResponseFiles,\n} from "./openapi-response-object-guard.mjs";',
            'schema orchestrator guard import',
          );
          replaceRequired(
            'scripts/generate-custom-gpt-schemas.mjs',
            '    const schemaPaths = schemaArtifacts.map((artifact) => path.join(schemaOutputDir, artifact.tempRelative));\n    const issues = validateOpenApiFiles(schemaPaths);',
            '    const schemaPaths = schemaArtifacts.map((artifact) => path.join(schemaOutputDir, artifact.tempRelative));\n    const responseObjectIssues = validateOpenApiResponseFiles(schemaPaths);\n    if (responseObjectIssues.length > 0) {\n      fail(\n        "Generated Custom GPT schemas failed OpenAPI Response Object validation.",\n        responseObjectIssues.map(formatOpenApiResponseObjectIssue),\n      );\n      return;\n    }\n\n    const issues = validateOpenApiFiles(schemaPaths);',
            'schema artifact Response Object validation',
          );

          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.scripts['openapi:response-objects:guard'] = 'node scripts/openapi-response-object-guard.mjs';
          pkg.scripts['test:openapi:response-objects'] = 'node test-openapi-response-object-guard.mjs';
          if (!pkg.scripts['schemas:guard'].includes('openapi:response-objects:guard')) {
            pkg.scripts['schemas:guard'] = pkg.scripts['schemas:guard']
              .replace('npm run schemas:check && ', 'npm run schemas:check && npm run openapi:response-objects:guard && ')
              .replace('node test-openapi-builder-schema-guard.mjs && ', 'node test-openapi-builder-schema-guard.mjs && npm run test:openapi:response-objects && ');
          }
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);

          insertAfterAll('../.github/workflows/custom-gpt-contract-guard.yml', '      - "http-generic-api/openapi*.yaml"\n', '      - "http-generic-api/openapi/**/*.yaml"\n');
          insertAfterAll('../.github/workflows/custom-gpt-contract-guard.yml', '      - "http-generic-api/scripts/openapi-builder-schema-guard.mjs"\n', '      - "http-generic-api/scripts/openapi-response-object-guard.mjs"\n');
          insertAfterAll('../.github/workflows/custom-gpt-contract-guard.yml', '      - "http-generic-api/test-openapi-lint-and-compatibility.mjs"\n', '      - "http-generic-api/test-openapi-response-object-guard.mjs"\n');
          insertAfterAll('../.github/workflows/openapi-auto-sync.yml', '      - "http-generic-api/openapi.*.yaml"\n', '      - "http-generic-api/openapi/**/*.yaml"\n');
          insertAfterAll('../.github/workflows/openapi-auto-sync.yml', '            http-generic-api/openapi.*.yaml ', '            http-generic-api/openapi/**/*.yaml ');
          NODE
      - name: Regenerate split schemas and frontend evidence
        run: |
          node scripts/split-openapi.mjs
          npm run frontend:dispatch:generate -- --baseline-ref="${{ inputs.baseline_ref || github.event.repository.default_branch || 'main' }}"
      - name: Validate complete contract
        run: |
          npm run schemas:guard
          git diff --check
      - name: Enforce changed-file allowlist
        run: |
          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //' | sort)
          allowed=(
            "../.github/workflows/custom-gpt-contract-guard.yml"
            "../.github/workflows/openapi-auto-sync.yml"
            "frontend-surface-dispatch.generated.json"
            "openapi.yaml"
            "openapi/frontend-runtime-routes.generated.yaml"
            "openapi/openapi.tenant-gpt.activation.yaml"
            "package.json"
            "scripts/generate-custom-gpt-schemas.mjs"
            "scripts/split-openapi.mjs"
          )
          for file in "${changed[@]}"; do
            matched=false
            for expected in "${allowed[@]}"; do
              if [[ "$file" == "$expected" ]]; then matched=true; break; fi
            done
            if [[ "$matched" != true ]]; then
              echo "::error::Unexpected generated or patched file: $file"
              exit 1
            fi
          done
      - name: Commit generated fix
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "OpenAPI Response Object guard fix is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ../.github/workflows/custom-gpt-contract-guard.yml ../.github/workflows/openapi-auto-sync.yml openapi.yaml openapi/openapi.tenant-gpt.activation.yaml package.json scripts/generate-custom-gpt-schemas.mjs scripts/split-openapi.mjs frontend-surface-dispatch.generated.json openapi/frontend-runtime-routes.generated.yaml
          git commit -m "fix: enforce OpenAPI Response Object generation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
