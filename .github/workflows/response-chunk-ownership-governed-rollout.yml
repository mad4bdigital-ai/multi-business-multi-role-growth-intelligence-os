name: Governed Response Chunk Ownership Rollout

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  readiness:
    name: Authorize and dry-run response chunk ownership
    if: >-
      github.event.issue.number == 4191 &&
      !github.event.issue.pull_request &&
      github.event.comment.body == 'AUTHORIZE_GOVERNED_RESPONSE_CHUNK_OWNERSHIP_ROLLOUT' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    concurrency:
      group: response-chunk-ownership-readiness
      cancel-in-progress: false
    env:
      ROLLOUT_PHASE: readiness
      RUNTIME_BASE_URL: https://auth.mad4b.com
      BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
      GH_READ_TOKEN: ${{ github.token }}
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      CONTROL_ISSUE: '4191'
      EVIDENCE_DIR: .artifacts/response-chunk-ownership-readiness
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Execute integrated readiness wave
        run: node .github/ops/response-chunk-ownership-governed-rollout.mjs

      - name: Upload no-secret readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: response-chunk-ownership-readiness-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish readiness summary
        if: always()
        shell: bash
        run: |
          node <<'NODE' >>"${GITHUB_STEP_SUMMARY}"
          const fs = require('node:fs');
          const summaryPath = `${process.env.EVIDENCE_DIR}/summary.json`;
          const failurePath = `${process.env.EVIDENCE_DIR}/failure.json`;
          if (fs.existsSync(summaryPath)) {
            const s = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
            process.stdout.write(`## Response chunk ownership readiness: pass\n\n- Production SHA: \`${s.production_sha}\`\n- Migration blob: \`${s.migration_blob_sha}\`\n- Checksum: \`${s.checksum}\`\n- Statements: ${s.statement_count}\n- Authorization: ${s.authorization || 'already_applied'}\n- Dry run: ${s.dry_run || 'already_applied'}\n`);
          } else {
            const f = fs.existsSync(failurePath) ? JSON.parse(fs.readFileSync(failurePath, 'utf8')) : {};
            process.stdout.write(`## Response chunk ownership readiness: fail\n\n- Stage: ${f.stage || 'unknown'}\n- Apply sent: ${f.apply_sent || false}\n- Error code: ${f.error?.code || 'workflow_failed'}\n`);
          }
          NODE

  apply:
    name: Apply and certify response chunk ownership
    if: >-
      github.event.issue.number == 4191 &&
      !github.event.issue.pull_request &&
      github.event.comment.body == 'APPLY_GOVERNED_RESPONSE_CHUNK_OWNERSHIP_ROLLOUT' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    concurrency:
      group: response-chunk-ownership-apply
      cancel-in-progress: false
    env:
      ROLLOUT_PHASE: apply
      RUNTIME_BASE_URL: https://auth.mad4b.com
      BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
      GH_READ_TOKEN: ${{ github.token }}
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      CONTROL_ISSUE: '4191'
      EVIDENCE_DIR: .artifacts/response-chunk-ownership-apply
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Execute integrated apply and certification wave
        run: node .github/ops/response-chunk-ownership-governed-rollout.mjs

      - name: Upload no-secret apply evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: response-chunk-ownership-apply-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish apply summary
        if: always()
        shell: bash
        run: |
          node <<'NODE' >>"${GITHUB_STEP_SUMMARY}"
          const fs = require('node:fs');
          const summaryPath = `${process.env.EVIDENCE_DIR}/summary.json`;
          const failurePath = `${process.env.EVIDENCE_DIR}/failure.json`;
          if (fs.existsSync(summaryPath)) {
            const s = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
            process.stdout.write(`## Response chunk ownership apply: pass\n\n- Production SHA: \`${s.production_sha}\`\n- Migration blob: \`${s.migration_blob_sha}\`\n- Checksum: \`${s.checksum}\`\n- Statements: ${s.statement_count}\n- Apply sent by this run: ${s.apply_sent_by_this_run}\n- Apply retried: false\n- Ledger: pass\n- Readiness: pass\n`);
          } else {
            const f = fs.existsSync(failurePath) ? JSON.parse(fs.readFileSync(failurePath, 'utf8')) : {};
            process.stdout.write(`## Response chunk ownership apply: fail\n\n- Stage: ${f.stage || 'unknown'}\n- Apply sent: ${f.apply_sent || false}\n- Error code: ${f.error?.code || 'workflow_failed'}\n`);
          }
          NODE

  runtime-closure:
    name: Verify Production response chunk ownership runtime
    if: >-
      github.event.issue.number == 4191 &&
      !github.event.issue.pull_request &&
      github.event.comment.body == 'VERIFY_GOVERNED_RESPONSE_CHUNK_OWNERSHIP_RUNTIME' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    concurrency:
      group: response-chunk-ownership-runtime-closure
      cancel-in-progress: false
    env:
      BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
      GH_READ_TOKEN: ${{ github.token }}
      EVIDENCE_DIR: .artifacts/response-chunk-ownership-runtime-closure
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify runtime parity, schema, and durable recovery
        run: node .github/ops/response-chunk-ownership-runtime-closure.mjs

      - name: Upload no-secret runtime closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: response-chunk-ownership-runtime-closure-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish runtime closure summary
        if: always()
        shell: bash
        run: |
          node <<'NODE' >>"${GITHUB_STEP_SUMMARY}"
          const fs = require('node:fs');
          const summaryPath = `${process.env.EVIDENCE_DIR}/summary.json`;
          const failurePath = `${process.env.EVIDENCE_DIR}/failure.json`;
          if (fs.existsSync(summaryPath)) {
            const s = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
            process.stdout.write(`## Response chunk ownership runtime closure: pass\n\n- Production SHA: \`${s.production_sha}\`\n- Source merge: \`${s.source_merge_sha}\`\n- Migration blob: \`${s.migration_blob_sha}\`\n- Checksum: \`${s.checksum}\`\n- Statements: ${s.statement_count}\n- Ledger: pass\n- Readiness: pass\n- Durable recovery smoke: pass\n`);
          } else {
            const f = fs.existsSync(failurePath) ? JSON.parse(fs.readFileSync(failurePath, 'utf8')) : {};
            const error = String(f.error || 'workflow_failed').replace(/\s+/g, '_').slice(0, 160);
            process.stdout.write(`## Response chunk ownership runtime closure: fail\n\n- Production SHA: \`${f.production_sha || 'unverified'}\`\n- Stage: ${f.stage || 'unknown'}\n- Error: ${error}\n`);
          }
          NODE
