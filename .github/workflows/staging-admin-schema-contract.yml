name: Staging Admin Schema Contract

on:
  pull_request:
    branches:
      - main
      - Production
    paths:
      - "canonicals/openapi/custom-gpt-surfaces.yaml"
      - "http-generic-api/openapi/openapi.custom-gpt.activation-admin.staging.yaml"
      - "http-generic-api/openapi/openapi.tenant-gpt.activation.staging.yaml"
      - "http-generic-api/openapi/openapi.tenant-gpt.auth.staging.yaml"
      - "http-generic-api/openapi/openapi.custom-gpt.auth-dispatcher.staging.yaml"
      - "http-generic-api/scripts/generate-custom-gpt-schemas.mjs"
      - "http-generic-api/scripts/generate-activation-staging-policy.mjs"
      - "http-generic-api/scripts/validate-staging-recovery-admin-openapi.mjs"
      - "http-generic-api/routes/rootDiscoveryRoutes.js"
      - "http-generic-api/test-staging-independent-schema-contract.mjs"
      - "http-generic-api/test-staging-recovery-route-policy.mjs"
      - "http-generic-api/test-staging-recovery-admin-surface.mjs"
      - "http-generic-api/package.json"
      - "http-generic-api/package-lock.json"
      - ".github/workflows/staging-admin-schema-contract.yml"
  push:
    branches:
      - main
    paths:
      - "canonicals/openapi/custom-gpt-surfaces.yaml"
      - "http-generic-api/openapi/openapi.custom-gpt.activation-admin.staging.yaml"
      - "http-generic-api/openapi/openapi.tenant-gpt.activation.staging.yaml"
      - "http-generic-api/openapi/openapi.tenant-gpt.auth.staging.yaml"
      - "http-generic-api/openapi/openapi.custom-gpt.auth-dispatcher.staging.yaml"
      - "http-generic-api/scripts/generate-custom-gpt-schemas.mjs"
      - "http-generic-api/scripts/generate-activation-staging-policy.mjs"
      - "http-generic-api/scripts/validate-staging-recovery-admin-openapi.mjs"
      - "http-generic-api/routes/rootDiscoveryRoutes.js"
      - "http-generic-api/test-staging-independent-schema-contract.mjs"
      - "http-generic-api/test-staging-recovery-route-policy.mjs"
      - "http-generic-api/test-staging-recovery-admin-surface.mjs"
      - "http-generic-api/package.json"
      - "http-generic-api/package-lock.json"
      - ".github/workflows/staging-admin-schema-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-admin-schema-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Verify Staging Admin OpenAPI contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: http-generic-api
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json
      - name: Install production dependencies
        run: npm ci
      - name: Verify generated composite Staging Admin schema
        run: |
          set -euo pipefail
          npm run schemas:check
          node scripts/validate-staging-recovery-admin-openapi.mjs
          node scripts/generate-activation-staging-policy.mjs --check
      - name: Run Registration Graph and Recovery contract tests
        run: |
          set -euo pipefail
          node test-staging-independent-schema-contract.mjs
          node test-staging-recovery-route-policy.mjs
          node test-staging-recovery-admin-surface.mjs
