name: Build Production Reconciliation Classifier Fix Live ARM 20260803

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/build-production-reconciliation-classifier-fix-live-arm-20260803.yml

permissions:
  contents: write

concurrency:
  group: build-production-reconciliation-classifier-fix-live-arm-20260803
  cancel-in-progress: false

jobs:
  build-fix:
    name: Build live-ref reconciliation classifier fix
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/build-production-classifier-fix-live-20260803-v3' &&
      github.event.pull_request.user.id == 271942579
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      REQUEST_PR: ${{ github.event.pull_request.number }}
      REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      REQUEST_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      WORKFLOW_PATH: .github/workflows/build-production-reconciliation-classifier-fix-live-arm-20260803.yml
      FIX_BRANCH: gpt/fix-production-reconciliation-classifier-20260803-v3
      REQUIRED_RUNTIME_FIX_SHA: c7f7be81b811caf3c1112372ab1089fc5ee3714c
    steps:
      - name: Checkout exact request head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.REQUEST_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable one-file builder request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "${REQUEST_HEAD_REF}" = "gpt/build-production-classifier-fix-live-20260803-v3"
          test "$(git rev-parse HEAD)" = "${REQUEST_HEAD_SHA}"
          mapfile -t changed_files < <(
            gh api --paginate "/repos/${REPOSITORY}/pulls/${REQUEST_PR}/files?per_page=100" --jq '.[].filename'
          )
          test "${#changed_files[@]}" -eq 1
          test "${changed_files[0]}" = "${WORKFLOW_PATH}"

      - name: Pin live protected refs for this execution
        id: refs
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/Production:refs/remotes/origin/Production"
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          production_sha="$(git rev-parse refs/remotes/origin/Production)"
          test "${#main_sha}" -eq 40
          test "${#production_sha}" -eq 40
          git merge-base --is-ancestor "${REQUIRED_RUNTIME_FIX_SHA}" "${main_sha}"
          echo "main_sha=${main_sha}" >> "${GITHUB_OUTPUT}"
          echo "production_sha=${production_sha}" >> "${GITHUB_OUTPUT}"

      - name: Reset to clean pinned main source
        shell: bash
        run: |
          set -Eeuo pipefail
          git checkout --detach '${{ steps.refs.outputs.main_sha }}'
          test ! -e "${WORKFLOW_PATH}"

      - name: Apply fail-closed classifier and regression patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          gate_path = Path('http-generic-api/scripts/e2e-parallel-pr-gate.mjs')
          gate = gate_path.read_text()
          old_classifier = '''function classifyProductionPromotion({ root, headRef, baseRef, headSha }) {
            if (headRef === "main" && baseRef === "Production") {
              return { allowed: true, identity: "protected_main" };
            }
            if (baseRef !== "Production") return { allowed: false, identity: null };

            const match = /^release\\/production-candidate-(?:\\d{8}-)?([0-9a-f]{8})(?:-v[1-9]\\d*)?$/.exec(headRef);
            if (!match) return { allowed: false, identity: null };
            if (!/^[0-9a-f]{40}$/.test(headSha) || !headSha.startsWith(match[1])) {
              return { allowed: false, identity: null };
            }

            const mainRef = resolveCanonicalMainRef(root);
            if (!mainRef || !isAncestor(root, headSha, mainRef)) {
              return { allowed: false, identity: null };
            }
            return { allowed: true, identity: "immutable_main_snapshot" };
          }
          '''
          new_classifier = '''function resolveCommit(root, ref) {
            if (!ref) return null;
            try {
              const value = execFileSync("git", ["rev-parse", "--verify", `${ref}^{commit}`], {
                cwd: root,
                encoding: "utf8",
                stdio: ["ignore", "pipe", "ignore"]
              }).trim();
              return /^[0-9a-f]{40}$/.test(value) ? value : null;
            } catch {
              return null;
            }
          }

          function resolveTree(root, ref) {
            if (!ref) return null;
            try {
              const value = execFileSync("git", ["rev-parse", "--verify", `${ref}^{tree}`], {
                cwd: root,
                encoding: "utf8",
                stdio: ["ignore", "pipe", "ignore"]
              }).trim();
              return /^[0-9a-f]{40}$/.test(value) ? value : null;
            } catch {
              return null;
            }
          }

          function resolveParents(root, headSha) {
            if (!/^[0-9a-f]{40}$/.test(headSha)) return [];
            try {
              const value = execFileSync("git", ["show", "-s", "--format=%P", headSha], {
                cwd: root,
                encoding: "utf8",
                stdio: ["ignore", "pipe", "ignore"]
              }).trim();
              if (!value) return [];
              const parents = value.split(/\\s+/);
              return parents.every((parent) => /^[0-9a-f]{40}$/.test(parent)) ? parents : [];
            } catch {
              return [];
            }
          }

          function classifyProductionPromotion({ root, headRef, baseRef, headSha, baseSha }) {
            if (headRef === "main" && baseRef === "Production") {
              return { allowed: true, identity: "protected_main" };
            }
            if (baseRef !== "Production") return { allowed: false, identity: null };

            const match = /^release\\/production-candidate-(?:\\d{8}-)?([0-9a-f]{8})(?:-v[1-9]\\d*)?$/.exec(headRef);
            if (!match) return { allowed: false, identity: null };
            if (!/^[0-9a-f]{40}$/.test(headSha) || !headSha.startsWith(match[1])) {
              return { allowed: false, identity: null };
            }

            const mainRef = resolveCanonicalMainRef(root);
            if (!mainRef) return { allowed: false, identity: null };
            if (isAncestor(root, headSha, mainRef)) {
              return { allowed: true, identity: "immutable_main_snapshot" };
            }

            const mainSha = resolveCommit(root, mainRef);
            const mainTree = resolveTree(root, mainRef);
            const headTree = resolveTree(root, headSha);
            const parents = resolveParents(root, headSha);
            if (
              !mainSha ||
              !mainTree ||
              !headTree ||
              !/^[0-9a-f]{40}$/.test(baseSha || "") ||
              parents.length !== 2 ||
              parents[0] !== mainSha ||
              parents[1] !== baseSha ||
              headTree !== mainTree
            ) {
              return { allowed: false, identity: null };
            }
            return { allowed: true, identity: "history_preserving_main_reconciliation" };
          }
          '''
          if gate.count(old_classifier) != 1:
              raise SystemExit('classifier anchor mismatch')
          gate = gate.replace(old_classifier, new_classifier)

          old_call = '''  const promotion = classifyProductionPromotion({
            root: options.root,
            headRef: options.headRef,
            baseRef: options.baseRef,
            headSha: options.head
          });'''
          new_call = '''  const promotion = classifyProductionPromotion({
            root: options.root,
            headRef: options.headRef,
            baseRef: options.baseRef,
            headSha: options.head,
            baseSha: options.base
          });'''
          if gate.count(old_call) != 1:
              raise SystemExit('classifier call anchor mismatch')
          gate = gate.replace(old_call, new_call)
          gate_path.write_text(gate)

          test_path = Path('http-generic-api/scripts/e2e-parallel-pr-flow-self-test.mjs')
          test = test_path.read_text()
          anchor = '''assert.equal(legacyImmutablePromotion.production_promotion_identity, "immutable_main_snapshot");
          assert.equal(legacyImmutablePromotion.phase_evaluation_base, workSha);

          const mismatchedImmutable = spawnSync'''
          inserted = '''assert.equal(legacyImmutablePromotion.production_promotion_identity, "immutable_main_snapshot");
          assert.equal(legacyImmutablePromotion.phase_evaluation_base, workSha);

          const mainTree = run("git", ["rev-parse", `${headSha}^{tree}`], root).trim();
          const baseTree = run("git", ["rev-parse", `${baseSha}^{tree}`], root).trim();
          const reconciliationSha = run("git", ["commit-tree", mainTree, "-p", headSha, "-p", baseSha, "-m", "reconcile main and Production"], root).trim();
          const reconciliationRef = `release/production-candidate-20260803-${reconciliationSha.slice(0, 8)}-v1`;
          const reconciliationPromotion = JSON.parse(run(process.execPath, [GATE, "--root", root, "--base", baseSha, "--head", reconciliationSha, "--head-ref", reconciliationRef, "--base-ref", "Production"], root));
          assert.equal(reconciliationPromotion.ok, true, JSON.stringify(reconciliationPromotion.findings));
          assert.equal(reconciliationPromotion.production_promotion, true);
          assert.equal(reconciliationPromotion.production_promotion_identity, "history_preserving_main_reconciliation");
          assert.equal(reconciliationPromotion.phase_evaluation_base, headSha);

          const wrongTreeSha = run("git", ["commit-tree", baseTree, "-p", headSha, "-p", baseSha, "-m", "wrong candidate tree"], root).trim();
          const wrongTree = spawnSync(process.execPath, [GATE, "--root", root, "--base", baseSha, "--head", wrongTreeSha, "--head-ref", `release/production-candidate-20260803-${wrongTreeSha.slice(0, 8)}-v1`, "--base-ref", "Production"], { cwd: root, encoding: "utf8" });
          assert.notEqual(wrongTree.status, 0);
          assert.equal(JSON.parse(wrongTree.stdout).production_promotion, false);

          const staleFirstParentSha = run("git", ["commit-tree", mainTree, "-p", workSha, "-p", baseSha, "-m", "stale first parent"], root).trim();
          const staleFirstParent = spawnSync(process.execPath, [GATE, "--root", root, "--base", baseSha, "--head", staleFirstParentSha, "--head-ref", `release/production-candidate-20260803-${staleFirstParentSha.slice(0, 8)}-v1`, "--base-ref", "Production"], { cwd: root, encoding: "utf8" });
          assert.notEqual(staleFirstParent.status, 0);
          assert.equal(JSON.parse(staleFirstParent.stdout).production_promotion, false);

          const wrongSecondParentSha = run("git", ["commit-tree", mainTree, "-p", headSha, "-p", workSha, "-m", "wrong second parent"], root).trim();
          const wrongSecondParent = spawnSync(process.execPath, [GATE, "--root", root, "--base", baseSha, "--head", wrongSecondParentSha, "--head-ref", `release/production-candidate-20260803-${wrongSecondParentSha.slice(0, 8)}-v1`, "--base-ref", "Production"], { cwd: root, encoding: "utf8" });
          assert.notEqual(wrongSecondParent.status, 0);
          assert.equal(JSON.parse(wrongSecondParent.stdout).production_promotion, false);

          const threeParentSha = run("git", ["commit-tree", mainTree, "-p", headSha, "-p", baseSha, "-p", workSha, "-m", "unexpected third parent"], root).trim();
          const threeParent = spawnSync(process.execPath, [GATE, "--root", root, "--base", baseSha, "--head", threeParentSha, "--head-ref", `release/production-candidate-20260803-${threeParentSha.slice(0, 8)}-v1`, "--base-ref", "Production"], { cwd: root, encoding: "utf8" });
          assert.notEqual(threeParent.status, 0);
          assert.equal(JSON.parse(threeParent.stdout).production_promotion, false);

          const mismatchedImmutable = spawnSync'''
          if test.count(anchor) != 1:
              raise SystemExit('self-test anchor mismatch')
          test = test.replace(anchor, inserted)
          test = test.replace('tests: 46', 'tests: 60')
          test_path.write_text(test)
          PY

          git diff --check
          test "$(git diff --name-only | sort)" = $'http-generic-api/scripts/e2e-parallel-pr-flow-self-test.mjs\nhttp-generic-api/scripts/e2e-parallel-pr-gate.mjs'

      - name: Run expanded self-test and live candidate regression
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check http-generic-api/scripts/e2e-parallel-pr-gate.mjs
          node --check http-generic-api/scripts/e2e-parallel-pr-flow-self-test.mjs
          node http-generic-api/scripts/e2e-parallel-pr-flow-self-test.mjs

          main_sha='${{ steps.refs.outputs.main_sha }}'
          production_sha='${{ steps.refs.outputs.production_sha }}'
          main_tree="$(git rev-parse "${main_sha}^{tree}")"
          live_candidate="$(printf '%s\n' 'classifier live reconciliation regression' | git commit-tree "${main_tree}" -p "${main_sha}" -p "${production_sha}")"
          live_ref="release/production-candidate-20260803-${live_candidate:0:8}-v9"
          node http-generic-api/scripts/e2e-parallel-pr-gate.mjs check \
            --base "${production_sha}" \
            --head "${live_candidate}" \
            --head-ref "${live_ref}" \
            --base-ref Production \
            --report-file "${RUNNER_TEMP}/live-candidate-report.json"
          jq -e --arg main "${main_sha}" '
            .ok == true and
            .production_promotion == true and
            .production_promotion_identity == "history_preserving_main_reconciliation" and
            .phase_evaluation_base == $main
          ' "${RUNNER_TEMP}/live-candidate-report.json" >/dev/null

      - name: Re-read refs, commit, and publish clean fix branch
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          main_sha='${{ steps.refs.outputs.main_sha }}'
          production_sha='${{ steps.refs.outputs.production_sha }}'
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/Production:refs/remotes/origin/Production"
          test "$(git rev-parse refs/remotes/origin/main)" = "${main_sha}"
          test "$(git rev-parse refs/remotes/origin/Production)" = "${production_sha}"

          git config user.name 'mad4bdigital-ai'
          git config user.email '271942579+mad4bdigital-ai@users.noreply.github.com'
          git add \
            http-generic-api/scripts/e2e-parallel-pr-gate.mjs \
            http-generic-api/scripts/e2e-parallel-pr-flow-self-test.mjs
          git commit -m 'fix(e2e): accept history-preserving Production candidates'
          fix_sha="$(git rev-parse HEAD)"
          existing="$(git ls-remote --heads origin "refs/heads/${FIX_BRANCH}" | awk '{print $1}')"
          if [[ -n "${existing}" ]]; then
            test "${existing}" = "${fix_sha}"
          else
            git push origin "${fix_sha}:refs/heads/${FIX_BRANCH}"
          fi
          test "$(git ls-remote --heads origin "refs/heads/${FIX_BRANCH}" | awk '{print $1}')" = "${fix_sha}"
          echo "fix_sha=${fix_sha}" >> "${GITHUB_OUTPUT}"

      - name: Write no-secret evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          evidence_dir="${RUNNER_TEMP}/classifier-fix"
          mkdir -p "${evidence_dir}"
          jq -n \
            --arg main_sha '${{ steps.refs.outputs.main_sha }}' \
            --arg production_sha '${{ steps.refs.outputs.production_sha }}' \
            --arg fix_sha '${{ steps.publish.outputs.fix_sha }}' \
            --arg fix_branch "${FIX_BRANCH}" \
            --arg source_run_id "${GITHUB_RUN_ID}" \
            --argjson request_pr "${REQUEST_PR}" \
            '{
              contract:"mad4b.production-reconciliation-classifier-fix.v2",
              request_pr:$request_pr,
              source_run_id:$source_run_id,
              main_sha:$main_sha,
              production_sha:$production_sha,
              fix_sha:$fix_sha,
              fix_branch:$fix_branch,
              expanded_self_test_passed:true,
              live_candidate_regression_passed:true,
              final_scope:["http-generic-api/scripts/e2e-parallel-pr-gate.mjs","http-generic-api/scripts/e2e-parallel-pr-flow-self-test.mjs"],
              protected_ref_mutation_performed:false,
              force_push_performed:false,
              production_merge_performed:false,
              deployment_performed:false,
              provider_call_performed:false,
              credential_payload_read:false,
              sql_execution_performed:false,
              migration_apply_performed:false,
              database_mutation_performed:false,
              external_send_performed:false,
              secrets_included:false
            }' > "${evidence_dir}/summary.json"
          cat "${evidence_dir}/summary.json"

      - name: Upload fix evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-reconciliation-classifier-fix-${{ github.run_id }}
          path: ${{ runner.temp }}/classifier-fix/summary.json
          if-no-files-found: error
          retention-days: 14
