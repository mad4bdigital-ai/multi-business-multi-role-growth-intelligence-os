name: PR 6746 Spec014 Final Work Map Binding Refresh

on:
  push:
    branches:
      - gpt/1050-governed-rollout-binding-20260809
    paths:
      - .github/workflows/pr6746-spec014-final-work-map-binding-refresh.yml

permissions:
  contents: write
  actions: write
  pull-requests: read

concurrency:
  group: pr6746-spec014-final-work-map-binding-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor == 'mad4bdigital-ai'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      TARGET_BRANCH: gpt/1050-governed-rollout-binding-20260809
      PR_NUMBER: '6746'
      EXPECTED_PARENT_SHA: 0a8df7fb3c11a1b0a90ecab6dd26c99582c05b56
      EXPECTED_MAIN_SHA: 83459d067782b9a7034bfe3fbcb2cee11010966b
      EXPECTED_FINGERPRINT: 3a4fa08746519668cfcb42ca99b48f6587d199593f4fb107c15207f220200de1
      EXPECTED_INDEX_SOURCE_HASH: 88b766a637b29997cde0f381f934d2ada8c6d56d25f0563dd72b224c3f920ba6
      LAUNCHER_PATH: .github/workflows/pr6746-spec014-final-work-map-binding-refresh.yml
      HOSTINGER_MANIFEST: specs/014-governed-hostinger-storage-orchestration/work-map-integration.json
      RETAIL_MANIFEST: specs/014-retail-commerce-operations-growth-os/work-map-integration.json
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact authorized launch head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Pin exact authorization, main, PR, and launch scope
        shell: bash
        run: |
          set -Eeuo pipefail
          current_sha="$(git rev-parse HEAD)"
          parent_sha="$(git rev-parse HEAD^)"
          remote_sha="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"

          test "${parent_sha}" = "${EXPECTED_PARENT_SHA}"
          test "${remote_sha}" = "${current_sha}"

          git fetch --no-tags origin main "${TARGET_BRANCH}"
          test "$(git rev-parse origin/main)" = "${EXPECTED_MAIN_SHA}"
          test "$(git merge-base origin/main HEAD)" = "${EXPECTED_MAIN_SHA}"

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r '.state' <<<"${pr_json}")" = open
          test "$(jq -r '.draft' <<<"${pr_json}")" = true
          test "$(jq -r '.base.ref' <<<"${pr_json}")" = main
          test "$(jq -r '.head.ref' <<<"${pr_json}")" = "${TARGET_BRANCH}"
          test "$(jq -r '.head.sha' <<<"${pr_json}")" = "${current_sha}"

          mapfile -t launch_files < <(git diff --name-only "${EXPECTED_PARENT_SHA}..HEAD")
          test "${#launch_files[@]}" = 1
          test "${launch_files[0]}" = "${LAUNCHER_PATH}"

          echo "LAUNCH_SHA=${current_sha}" >> "$GITHUB_ENV"

      - name: Run canonical deterministic binding producer and prove exact scope
        shell: bash
        run: |
          set -Eeuo pipefail

          git show "${EXPECTED_PARENT_SHA}:${HOSTINGER_MANIFEST}" > "${RUNNER_TEMP}/hostinger-before.json"
          git show "${EXPECTED_PARENT_SHA}:${RETAIL_MANIFEST}" > "${RUNNER_TEMP}/retail-before.json"

          git rm -- "${LAUNCHER_PATH}"
          test ! -e "${LAUNCHER_PATH}"

          node --check http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs
          node --check http-generic-api/scripts/platform-work-map-generator.mjs

          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            --feature-key 014-governed-hostinger-storage-orchestration \
            | tee "${RUNNER_TEMP}/hostinger-refresh.json"
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            --feature-key 014-retail-commerce-operations-growth-os \
            | tee "${RUNNER_TEMP}/retail-refresh.json"

          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            --feature-key 014-governed-hostinger-storage-orchestration --check
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            --feature-key 014-retail-commerce-operations-growth-os --check
          node http-generic-api/scripts/platform-work-map-generator.mjs --check

          mapfile -t changed < <(git status --short | sed -E 's/^.. //' | sort)
          expected="$(printf '%s\n' "${LAUNCHER_PATH}" "${HOSTINGER_MANIFEST}" "${RETAIL_MANIFEST}" | sort)"
          actual="$(printf '%s\n' "${changed[@]}" | sort)"
          test "${actual}" = "${expected}"

          node - "${RUNNER_TEMP}/hostinger-before.json" "${HOSTINGER_MANIFEST}" \
                   "${RUNNER_TEMP}/retail-before.json" "${RETAIL_MANIFEST}" <<'NODE'
          const fs = require('node:fs');
          const [hostBeforePath, hostAfterPath, retailBeforePath, retailAfterPath] = process.argv.slice(2);
          const expectedFingerprint = process.env.EXPECTED_FINGERPRINT;
          const expectedIndex = process.env.EXPECTED_INDEX_SOURCE_HASH;
          const allowed = new Set(['registry.fingerprint', 'registry.index_source_hash']);
          function read(p) { return JSON.parse(fs.readFileSync(p, 'utf8')); }
          function diffs(a, b, prefix = '') {
            const keys = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
            const out = [];
            for (const key of keys) {
              const p = prefix ? `${prefix}.${key}` : key;
              const av = a?.[key];
              const bv = b?.[key];
              const bothObjects = av && bv && typeof av === 'object' && typeof bv === 'object' && !Array.isArray(av) && !Array.isArray(bv);
              if (bothObjects) out.push(...diffs(av, bv, p));
              else if (JSON.stringify(av) !== JSON.stringify(bv)) out.push(p);
            }
            return out;
          }
          for (const [beforePath, afterPath] of [[hostBeforePath, hostAfterPath], [retailBeforePath, retailAfterPath]]) {
            const before = read(beforePath);
            const after = read(afterPath);
            const changed = diffs(before, after);
            if (changed.length !== 2 || changed.some((p) => !allowed.has(p))) {
              throw new Error(`Unexpected manifest mutation: ${JSON.stringify(changed)}`);
            }
            if (after.registry?.fingerprint !== expectedFingerprint) throw new Error('Unexpected fingerprint');
            if (after.registry?.index_source_hash !== expectedIndex) throw new Error('Unexpected index_source_hash');
          }
          NODE

      - name: Commit, re-check, and push bounded binding refresh
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- "${LAUNCHER_PATH}" "${HOSTINGER_MANIFEST}" "${RETAIL_MANIFEST}"

          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' "${LAUNCHER_PATH}" "${HOSTINGER_MANIFEST}" "${RETAIL_MANIFEST}" | sort)"
          test "${staged}" = "${expected}"

          git commit -m 'fix(spec014): refresh final Work Map registry bindings'
          result_sha="$(git rev-parse HEAD)"

          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            --feature-key 014-governed-hostinger-storage-orchestration --check
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            --feature-key 014-retail-commerce-operations-growth-os --check
          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          test -z "$(git status --porcelain)"

          git fetch --no-tags origin main "${TARGET_BRANCH}"
          test "$(git rev-parse origin/main)" = "${EXPECTED_MAIN_SHA}"
          test "$(git rev-parse origin/${TARGET_BRANCH})" = "${LAUNCH_SHA}"
          test "$(git merge-base origin/main HEAD)" = "${EXPECTED_MAIN_SHA}"

          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          test "$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${result_sha}"
          echo "result_sha=${result_sha}" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact-head CI and Work Map verification
        shell: bash
        env:
          RESULT_SHA: ${{ steps.publish.outputs.result_sha }}
        run: |
          set -Eeuo pipefail
          test -n "${RESULT_SHA}"
          gh workflow run ci.yml --repo "${GITHUB_REPOSITORY}" --ref "${TARGET_BRANCH}"
          gh workflow run spec-kit-work-map-integration.yml --repo "${GITHUB_REPOSITORY}" --ref "${TARGET_BRANCH}"
          {
            echo '## Spec014 Final Work Map Binding Refresh'
            echo
            echo "WORK_MAP_BINDING_REFRESH outcome=passed authorized_parent=${EXPECTED_PARENT_SHA} launch_sha=${LAUNCH_SHA} result_sha=${RESULT_SHA} pinned_main_sha=${EXPECTED_MAIN_SHA} final_manifest_files=2 temporary_workflow_present=false force_push=false protected_branch_mutation=false production_mutation=false migration_apply=false provider_dispatch=false secrets_included=false"
          } >> "$GITHUB_STEP_SUMMARY"
