name: Spec 014 Schema Classification Workstream Generator

on:
  pull_request:
    branches:
      - gpt/hostinger-safe-storage-cleanup-ssh-20260801
    paths:
      - '.github/scripts/finalize-spec014-storage-schema-registry.mjs'
      - '.github/workflows/spec014-storage-schema-registry-finalizer.yml'

permissions:
  contents: write

concurrency:
  group: spec014-schema-classification-workstream-generator
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout helper candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Preserve generator and reset to exact T023 implementation
        run: |
          cp .github/scripts/finalize-spec014-storage-schema-registry.mjs /tmp/generate-spec014-schema-classification-workstream.mjs
          git checkout --detach c17f29be718851ad43df8c99450f04b1e11842cd
          test "$(git rev-parse HEAD)" = 'c17f29be718851ad43df8c99450f04b1e11842cd'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Add ready schema-classification workstream
        run: |
          node --check /tmp/generate-spec014-schema-classification-workstream.mjs
          node /tmp/generate-spec014-schema-classification-workstream.mjs
      - name: Validate exact governed write set
        run: |
          node -e "const c=JSON.parse(require('node:fs').readFileSync('specs/014-governed-hostinger-storage-orchestration/e2e-phases.json','utf8')); const w=c.parallel_work.workstreams.find(x=>x.id==='schema-classification'); if(!w||w.status!=='ready_for_integration'||w.scope.include.length!==4) process.exit(1)"
          actual="$(git diff --name-only | sort)"
          expected='specs/014-governed-hostinger-storage-orchestration/e2e-phases.json'
          test "$actual" = "$expected"
          grep -q 'gpt/014-hostinger/schema-classification-\*' specs/014-governed-hostinger-storage-orchestration/e2e-phases.json
          grep -q 'ready_for_integration' specs/014-governed-hostinger-storage-orchestration/e2e-phases.json
      - name: Create schema-classification PR branch
        run: |
          branch='gpt/014-hostinger/schema-classification-t023-20260802'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add specs/014-governed-hostinger-storage-orchestration/e2e-phases.json
          git commit -m 'docs(spec-014): declare schema classification workstream ready'
          git push origin "HEAD:refs/heads/$branch"
