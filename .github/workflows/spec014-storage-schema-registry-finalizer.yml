name: Spec 014 Contracts Workstream Classifier

on:
  pull_request:
    branches:
      - gpt/hostinger-safe-storage-cleanup-ssh-20260801
    paths:
      - '.github/scripts/finalize-spec014-storage-schema-registry.mjs'
      - '.github/workflows/spec014-storage-schema-registry-finalizer.yml'

permissions:
  contents: write

concurrency:
  group: spec014-contracts-workstream-classifier
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout helper candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Preserve classifier and reset to exact T023 candidate
        run: |
          cp .github/scripts/finalize-spec014-storage-schema-registry.mjs /tmp/classify-spec014-contracts-workstream.mjs
          git checkout --detach c17f29be718851ad43df8c99450f04b1e11842cd
          test "$(git rev-parse HEAD)" = 'c17f29be718851ad43df8c99450f04b1e11842cd'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Extend contracts workstream ownership
        run: |
          node --check /tmp/classify-spec014-contracts-workstream.mjs
          node /tmp/classify-spec014-contracts-workstream.mjs
      - name: Validate exact governed write set
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('specs/014-governed-hostinger-storage-orchestration/e2e-phases.json','utf8'))"
          actual="$(git diff --name-only | sort)"
          expected='specs/014-governed-hostinger-storage-orchestration/e2e-phases.json'
          test "$actual" = "$expected"
          grep -q 'gpt/014-hostinger/contracts-\*' specs/014-governed-hostinger-storage-orchestration/e2e-phases.json
          grep -q 'hostinger-storage-schema-classification-contract' specs/014-governed-hostinger-storage-orchestration/e2e-phases.json
      - name: Create workstream-classified PR branch
        run: |
          branch='gpt/014-hostinger/contracts-schema-classification-20260802'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add specs/014-governed-hostinger-storage-orchestration/e2e-phases.json
          git commit -m 'docs(spec-014): classify schema registry under contracts workstream'
          git push origin "HEAD:refs/heads/$branch"
