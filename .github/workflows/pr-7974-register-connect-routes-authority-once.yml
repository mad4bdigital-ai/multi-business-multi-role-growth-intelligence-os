name: PR 7974 register connect-routes authority once

on:
  push:
    branches:
      - fix/admin-recovery-mcp-local-connector-ownership-20260908

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'mad4bdigital-ai'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Guard exact parent and repair only the existing authority
        shell: bash
        env:
          EXPECTED_PARENT: 48f667c16b7f8db4b110bd4a95bd4d5f1abab6a8
          TARGET_BRANCH: fix/admin-recovery-mcp-local-connector-ownership-20260908
          REGISTRY: .github/governance/test-authority-registry.json
          SELF: .github/workflows/pr-7974-register-connect-routes-authority-once.yml
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          changed="$(git diff --name-only "$EXPECTED_PARENT" HEAD)"
          test "$changed" = "$SELF"

          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('.github/governance/test-authority-registry.json')
          text = p.read_text(encoding='utf-8')
          data = json.loads(text)
          target = 'http-generic-api/test-connect-routes.mjs'
          owners = [a['id'] for a in data['invariant_authorities'] if target in a.get('test_paths', [])]
          if owners:
              raise SystemExit(f'target already registered unexpectedly: {owners}')
          authority = next(a for a in data['invariant_authorities'] if a['id'] == 'local_connector_environment_and_transport_isolation')
          anchor = 'http-generic-api/test-local-manager-tool-release-owner.mjs'
          if anchor not in authority['test_paths']:
              raise SystemExit('expected authority anchor missing')
          marker = '        "http-generic-api/test-local-manager-tool-release-owner.mjs",\n'
          if text.count(marker) != 1:
              raise SystemExit(f'expected unique textual anchor, got {text.count(marker)}')
          text = text.replace(marker, marker + '        "http-generic-api/test-connect-routes.mjs",\n', 1)
          parsed = json.loads(text)
          owners = [a['id'] for a in parsed['invariant_authorities'] if target in a.get('test_paths', [])]
          if owners != ['local_connector_environment_and_transport_isolation']:
              raise SystemExit(f'unexpected owner after repair: {owners}')
          p.write_text(text, encoding='utf-8')
          PY

          node scripts/repository-governance-fixed-point.mjs --self-test
          node .github/tests/repository-governance-fixed-point.test.mjs
          node http-generic-api/test-connect-routes.mjs

          git diff --check
          test "$(git diff --name-only)" = "$REGISTRY"
          git rm "$SELF"
          test "$(git diff --name-only | sort)" = "$(printf '%s\n%s\n' "$SELF" "$REGISTRY" | sort)"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$REGISTRY" "$SELF"
          git commit -m "fix(governance): register connector route test authority"
          git push origin HEAD:"$TARGET_BRANCH"
