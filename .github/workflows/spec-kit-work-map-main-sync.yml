name: Spec Kit Work Map Main Sync

on:
  push:
    branches:
      - gpt/spec-kit-work-map-integration-fabric-20260731
    paths:
      - .github/workflows/spec-kit-work-map-main-sync.yml
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/spec-kit-work-map-main-sync.yml

permissions:
  actions: write
  contents: write

concurrency:
  group: spec-kit-work-map-main-sync
  cancel-in-progress: true

jobs:
  reconcile:
    name: Converge latest branch and main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: gpt/spec-kit-work-map-integration-fabric-20260731

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Reconcile, validate, and push with a branch lease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: gpt/spec-kit-work-map-integration-fabric-20260731
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Convergence attempt ${attempt}."
            git fetch --no-tags origin main "${TARGET_BRANCH}"
            branch_sha="$(git rev-parse "origin/${TARGET_BRANCH}")"
            main_sha="$(git rev-parse origin/main)"
            git checkout --detach "${branch_sha}"
            git reset --hard "${branch_sha}"
            git clean -fd

            echo "Branch ${branch_sha}; main ${main_sha}."
            if git merge-base --is-ancestor "${main_sha}" "${branch_sha}"; then
              echo "Branch already contains latest main; only removing the temporary synchronizer."
              rm -f .github/workflows/spec-kit-work-map-main-sync.yml
              git add -A .github/workflows/spec-kit-work-map-main-sync.yml
              git commit -m "chore: remove completed Work Map synchronizer"
            else
              set +e
              git merge --no-ff --no-commit "${main_sha}"
              merge_status=$?
              set -e

              if [[ ${merge_status} -ne 0 ]]; then
                mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
                printf 'Detected conflicts:\n'
                printf ' - %s\n' "${conflicts[@]}"
                for path in "${conflicts[@]}"; do
                  case "${path}" in
                    docs/work-maps/*)
                      git checkout --ours -- "${path}"
                      git add "${path}"
                      ;;
                    *)
                      echo "Unexpected semantic conflict: ${path}"
                      exit 1
                      ;;
                  esac
                done
              fi

              unresolved="$(git diff --name-only --diff-filter=U)"
              if [[ -n "${unresolved}" ]]; then
                echo "Unresolved conflicts remain:"
                printf '%s\n' "${unresolved}"
                exit 1
              fi

              node http-generic-api/scripts/platform-work-map-generator.mjs --write
              node http-generic-api/scripts/platform-work-map-generator.mjs --check
              git add docs/work-maps
              rm -f .github/workflows/spec-kit-work-map-main-sync.yml
              git add -A .github/workflows/spec-kit-work-map-main-sync.yml

              if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- . ':!http-generic-api/package-lock.json'; then
                echo "Conflict markers detected."
                exit 1
              fi

              git commit -m "chore: merge latest main into Work Map integration branch"
            fi

            node --check http-generic-api/scripts/platform-work-map-schema-intelligence.mjs
            node --check http-generic-api/scripts/work-map-schema-classification.mjs
            node --check http-generic-api/scripts/work-map-schema-classification-contract.mjs
            node --check http-generic-api/scripts/spec-kit-work-map-integration-gate.mjs
            node --check http-generic-api/scripts/spec-kit-work-map-governance-gate.mjs
            node --check http-generic-api/scripts/pipeline-connectivity-check.mjs
            node http-generic-api/scripts/pipeline-connectivity-check.mjs
            node http-generic-api/test-pipeline-connectivity-check.mjs
            node http-generic-api/scripts/work-map-schema-classification-contract.mjs
            node http-generic-api/scripts/work-map-schema-classification.mjs
            node http-generic-api/test-work-map-schema-classification.mjs
            node http-generic-api/test-work-map-schema-classification-contract.mjs
            node http-generic-api/test-spec-kit-work-map-governance-gate.mjs
            node http-generic-api/test-platform-work-map-generator.mjs
            node http-generic-api/scripts/platform-work-map-generator.mjs --check
            git diff --check HEAD^ HEAD

            remote_head_sha="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
            if [[ "${remote_head_sha}" != "${branch_sha}" ]]; then
              echo "Branch moved from ${branch_sha} to ${remote_head_sha}; retrying from the new head."
              continue
            fi

            git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
            pushed_head_sha="$(git rev-parse HEAD)"
            remote_head_sha="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
            if [[ "${remote_head_sha}" != "${pushed_head_sha}" ]]; then
              echo "Push readback mismatch. Expected ${pushed_head_sha}, found ${remote_head_sha}."
              exit 1
            fi

            gh workflow run ci.yml --ref "${TARGET_BRANCH}"
            gh workflow run spec-kit-work-map-integration.yml --ref "${TARGET_BRANCH}"
            echo "Integrated head: ${pushed_head_sha}"
            exit 0
          done

          echo "Branch kept moving during all convergence attempts."
          exit 1
