name: Hostinger Storage Tenant Canary Guard

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - '.github/workflows/hostinger-storage-tenant-canary-canonical-guard.yml'
      - '.changes/e2e/spec014-tenant-canary-canonical-evidence.json'
      - 'http-generic-api/scripts/hostinger-tenant-canary-ci.mjs'
      - 'http-generic-api/scripts/test-hostinger-tenant-canary-ci.mjs'
      - 'http-generic-api/hostingerStorageTenantCanary*.js'
      - 'http-generic-api/test-hostinger-storage-tenant-canary*.mjs'
      - '.github/tests/spec014/tenant-canary-repository-provenance.mjs'

permissions:
  contents: read

concurrency:
  group: hostinger-storage-tenant-canary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tenant-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      TARGET_REF: ${{ github.event.pull_request.head.ref }}
      REPORT_DIR: .ci-evidence/hostinger-storage-tenant-canary
    steps:
      - name: Validate exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CI_SOURCE_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${TARGET_REF}" =~ ^[A-Za-z0-9._/-]+$ ]]

      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CI_SOURCE_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify local and remote exact-head identity
        shell: bash
        run: |
          set -euo pipefail
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin "refs/heads/${TARGET_REF}" | awk '{print $1}')"
          [[ "$local_sha" == "$CI_SOURCE_HEAD_SHA" ]]
          [[ "$remote_sha" == "$CI_SOURCE_HEAD_SHA" ]]

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Execute canonical Tenant Canary checks
        id: guard
        continue-on-error: true
        run: node http-generic-api/scripts/hostinger-tenant-canary-ci.mjs --report-dir "${REPORT_DIR}"

      - name: Upload canonical Tenant Canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-storage-tenant-canary-${{ github.run_id }}-summary
          path: |
            ${{ env.REPORT_DIR }}/hostinger-storage-tenant-canary-summary.json
            ${{ env.REPORT_DIR }}/hostinger-storage-tenant-canary-summary.md
          if-no-files-found: error
          retention-days: 30

      - name: Enforce canonical Tenant Canary decision
        if: always()
        shell: bash
        env:
          GUARD_STEP_OUTCOME: ${{ steps.guard.outcome }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const reportPath = path.join(process.env.REPORT_DIR, 'hostinger-storage-tenant-canary-summary.json');
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const fullSha = /^[0-9a-f]{40}$/u;
          if (report.contract !== 'mad4b.hostinger-guard-summary.v1') throw new Error('Tenant Canary canonical contract mismatch.');
          if (report.workflow !== 'Hostinger Storage Tenant Canary Guard') throw new Error('Tenant Canary workflow identity mismatch.');
          if (report.guard_key !== 'hostinger-storage-tenant-canary') throw new Error('Tenant Canary guard identity mismatch.');
          if (report.identity?.candidate_kind !== 'head') throw new Error('Tenant Canary candidate kind mismatch.');
          if (!fullSha.test(report.identity?.candidate_sha || '')) throw new Error('Tenant Canary candidate SHA is invalid.');
          if (report.identity.candidate_sha !== process.env.CI_SOURCE_HEAD_SHA) throw new Error('Tenant Canary report is stale or substituted.');
          if (report.secrets_included !== false) throw new Error('Tenant Canary report must declare secrets_included=false.');
          if (report.job_logs_consulted !== false) throw new Error('Tenant Canary canonical decision must not consult Job logs.');
          if (report.repository_mutation_performed !== false || report.provider_dispatch_performed !== false || report.credential_access_performed !== false) {
            throw new Error('Tenant Canary report crossed its read-only safety boundary.');
          }
          const selected = report.checks?.selected_count;
          const passed = report.checks?.passed_count;
          const failed = report.checks?.failed_count;
          if (![selected, passed, failed].every((value) => Number.isInteger(value) && value >= 0)) throw new Error('Tenant Canary report counts are invalid.');
          if (!Array.isArray(report.results) || selected !== report.results.length || passed + failed !== selected) throw new Error('Tenant Canary report counts are inconsistent.');
          if (!Array.isArray(report.integrity_findings)) throw new Error('Tenant Canary integrity findings are invalid.');
          if (report.outcome === 'passed') {
            if (failed !== 0 || passed !== selected || report.integrity_findings.length !== 0 || report.first_failure !== null) {
              throw new Error('Passed Tenant Canary report contains a blocker.');
            }
            if (process.env.GUARD_STEP_OUTCOME !== 'success') throw new Error('Runner step failed despite a passed report.');
            process.exit(0);
          }
          if (report.outcome !== 'failed') throw new Error('Tenant Canary report outcome is invalid.');
          const failure = report.first_failure || report.integrity_findings[0] || {};
          const title = `Tenant Canary ${failure.code || 'blocked'}`
            .replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
          const message = `${failure.check_id || 'integrity'}: ${failure.stderr_tail || failure.stdout_tail || failure.detail || 'Canonical report blocked.'}`
            .replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
          console.log(`::error title=${title}::${message.slice(0, 1000)}`);
          process.exit(1);
          NODE
