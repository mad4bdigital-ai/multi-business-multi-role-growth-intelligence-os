name: Work Map Reconcile Generated Artifacts Writer V2

on:
  pull_request:
    branches:
      - gpt/work-map-reconcile-object-base-81a254bf
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: work-map-reconcile-generated-artifacts-v2-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: 33c8dc3b3f8a8c8950e13b674423466e6b08f9e6
  EXPECTED_HEAD_SHA: f64191ef70b58c8698a708f0fb93c91c537c9944
  TARGET_BRANCH: gpt/work-map-input-driven-governance-reconcile-20260804

jobs:
  generate:
    name: Generate and publish exact reconciled Work Maps V2
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/work-map-input-driven-governance-reconcile-20260804' &&
      github.event.pull_request.head.sha == 'f64191ef70b58c8698a708f0fb93c91c537c9944'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Initialize bounded evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/work-map-reconcile-generation-v2-${GITHUB_RUN_ID}"
          printf 'EVIDENCE_ROOT=%s\n' "${evidence}" >> "${GITHUB_ENV}"
          mkdir -p "${evidence}"
          {
            echo "expected_main_sha=${EXPECTED_MAIN_SHA}"
            echo "expected_head_sha=${EXPECTED_HEAD_SHA}"
            echo "target_branch=${TARGET_BRANCH}"
          } > "${evidence}/expected-identity.txt"

      - name: Checkout exact synchronized source candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prove immutable identity and five-file source scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          actual_head="$(git rev-parse HEAD)"
          actual_main="$(git rev-parse origin/main)"
          remote_head="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk 'NR == 1 {print $1}')"
          behind_count="$(git rev-list --count HEAD..origin/main)"
          {
            echo "actual_head_sha=${actual_head}"
            echo "actual_main_sha=${actual_main}"
            echo "remote_head_sha=${remote_head}"
            echo "behind_count=${behind_count}"
          } > "${EVIDENCE_ROOT}/actual-identity.txt"
          test "${actual_head}" = "${EXPECTED_HEAD_SHA}"
          test "${actual_main}" = "${EXPECTED_MAIN_SHA}"
          test "${remote_head}" = "${EXPECTED_HEAD_SHA}"
          test "${behind_count}" = "0"
          git merge-base --is-ancestor "${EXPECTED_MAIN_SHA}" HEAD
          git diff --name-only "${EXPECTED_MAIN_SHA}...HEAD" | LC_ALL=C sort > "${EVIDENCE_ROOT}/source-files.txt"
          printf '%s\n' \
            .changes/e2e/work-map-autofix-validation-diagnostics.json \
            .github/workflows/spec-kit-work-map-autofix.yml \
            http-generic-api/scripts/maintenance-tools/repository-tool-lifecycle-guard.mjs \
            http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs \
            http-generic-api/test-work-map-autofix-validation-diagnostics.mjs \
            | LC_ALL=C sort > "${EVIDENCE_ROOT}/expected-source-files.txt"
          diff -u "${EVIDENCE_ROOT}/expected-source-files.txt" "${EVIDENCE_ROOT}/source-files.txt"
          test -z "$(git status --porcelain)"

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install locked API dependencies
        run: npm ci --prefix http-generic-api

      - name: Validate reconciled sources before generation
        shell: bash
        run: |
          set -euo pipefail
          node --check http-generic-api/scripts/maintenance-tools/repository-tool-lifecycle-guard.mjs
          node --check http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs
          node --check http-generic-api/test-work-map-autofix-validation-diagnostics.mjs
          node http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs | tee "${EVIDENCE_ROOT}/lifecycle-regression.log"
          node http-generic-api/test-work-map-autofix-validation-diagnostics.mjs | tee "${EVIDENCE_ROOT}/diagnostics-regression.log"

      - name: Generate twice and prove exact bounded idempotency
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          git diff --name-only | LC_ALL=C sort > "${EVIDENCE_ROOT}/generated-files.txt"
          printf '%s\n' \
            docs/work-maps/README.md \
            docs/work-maps/repository-automation-map.md \
            | LC_ALL=C sort > "${EVIDENCE_ROOT}/expected-generated-files.txt"
          diff -u "${EVIDENCE_ROOT}/expected-generated-files.txt" "${EVIDENCE_ROOT}/generated-files.txt"
          git diff --check
          first_hash="$(git diff --binary -- docs/work-maps | sha256sum | awk '{print $1}')"
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          second_hash="$(git diff --binary -- docs/work-maps | sha256sum | awk '{print $1}')"
          test "${first_hash}" = "${second_hash}"
          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          printf '%s\n' "${first_hash}" > "${EVIDENCE_ROOT}/generated-diff-sha256.txt"
          git diff --stat > "${EVIDENCE_ROOT}/generated-diff-stat.txt"

      - name: Create exact local generated-artifact commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk 'NR == 1 {print $1}')" = "${EXPECTED_HEAD_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/work-maps/README.md docs/work-maps/repository-automation-map.md
          git commit -m "docs(work-maps): regenerate reconciled governance maps"
          new_head="$(git rev-parse HEAD)"
          printf 'NEW_HEAD_SHA=%s\n' "${new_head}" >> "${GITHUB_ENV}"
          printf '%s\n' "${new_head}" > "${EVIDENCE_ROOT}/local-head-sha.txt"
          git diff --name-only "${EXPECTED_MAIN_SHA}...${new_head}" | LC_ALL=C sort > "${EVIDENCE_ROOT}/final-files.txt"
          cat "${EVIDENCE_ROOT}/expected-source-files.txt" "${EVIDENCE_ROOT}/expected-generated-files.txt" | LC_ALL=C sort -u > "${EVIDENCE_ROOT}/expected-final-files.txt"
          diff -u "${EVIDENCE_ROOT}/expected-final-files.txt" "${EVIDENCE_ROOT}/final-files.txt"
          test -z "$(git status --porcelain)"

      - name: Run exact E2E and lifecycle gates on local head
        shell: bash
        run: |
          set -euo pipefail
          export CANDIDATE_SHA="${NEW_HEAD_SHA}"
          node http-generic-api/scripts/e2e-contract-reference-integrity.mjs \
            --base "${EXPECTED_MAIN_SHA}" --head "${NEW_HEAD_SHA}" \
            --report-file "${EVIDENCE_ROOT}/e2e-contract-reference-integrity.json"
          node http-generic-api/scripts/e2e-contract-git-index-integrity.mjs \
            --report-file "${EVIDENCE_ROOT}/e2e-contract-reference-integrity.json"
          node http-generic-api/scripts/e2e-phase-governance.mjs check \
            --base "${EXPECTED_MAIN_SHA}" --head "${NEW_HEAD_SHA}" \
            --report-file "${EVIDENCE_ROOT}/e2e-phase-evaluation.json"
          git diff --name-status "${EXPECTED_MAIN_SHA}" "${NEW_HEAD_SHA}" > "${EVIDENCE_ROOT}/changed-files.tsv"
          node http-generic-api/scripts/maintenance-tools/repository-tool-lifecycle-guard.mjs \
            --changed-files "${EVIDENCE_ROOT}/changed-files.tsv" \
            --policy .github/repository-maintenance-tool-governance.json \
            --output-dir "${EVIDENCE_ROOT}/repository-tool-lifecycle"
          node --input-type=module -e "import fs from 'node:fs'; const p=process.env.EVIDENCE_ROOT + '/repository-tool-lifecycle/repository-tool-lifecycle-report.json'; const r=JSON.parse(fs.readFileSync(p,'utf8')); if(!r.ok || r.findings.length) process.exit(1);"
          test -z "$(git status --porcelain)"

      - name: Push exact validated generated commit without force
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk 'NR == 1 {print $1}')" = "${EXPECTED_HEAD_SHA}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" 2>&1 | tee "${EVIDENCE_ROOT}/push.log"
          test "$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk 'NR == 1 {print $1}')" = "${NEW_HEAD_SHA}"
          printf '%s\n' "${NEW_HEAD_SHA}" > "${EVIDENCE_ROOT}/published-head-sha.txt"

      - name: Upload bounded generation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-map-reconcile-generation-v2-${{ github.run_id }}
          path: ${{ runner.temp }}/work-map-reconcile-generation-v2-${{ github.run_id }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
