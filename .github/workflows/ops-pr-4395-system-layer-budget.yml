name: Ops PR 4395 System Layer Budget

on:
  push:
    branches:
      - gpt/ops/pr-4395-system-layer-budget-20260801

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: gpt/tenant-request-inbox-chunk-store-hardening-20260801
      EXPECTED_TARGET_HEAD: 0be79226974240f489f96f34ca899acb4a7406e7
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Lock target head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_TARGET_HEAD}"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Bind the system-layer response budget
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'http-generic-api/routes/systemLayerRoutes.js';
          const source = fs.readFileSync(file, 'utf8');
          const before = `        max_chars: Number(responseOptions.max_chars || source?.max_chars || 45000),
        cursor: Number(responseOptions.cursor || source?.cursor || 0),`;
          const after = `        max_chars: Number(responseOptions.max_chars || source?.max_chars || 45000),
        client_response_budget_chars: Number(
          responseOptions.client_response_budget_chars
          || source?.client_response_budget_chars
          || responseOptions.inline_fallback_max_chars
          || source?.inline_fallback_max_chars
          || 150000,
        ),
        response_envelope_overhead_chars: Number(
          responseOptions.response_envelope_overhead_chars
          || source?.response_envelope_overhead_chars
          || 5000,
        ),
        cursor: Number(responseOptions.cursor || source?.cursor || 0),`;
          const count = source.split(before).length - 1;
          if (count !== 1) throw new Error(`Expected one system-layer response option block, found ${count}.`);
          fs.writeFileSync(file, source.replace(before, after));
          NODE
          git diff --check

      - name: Install locked dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Run system-layer and chunk regressions
        working-directory: http-generic-api
        run: |
          node test-platform-routes.mjs
          node test-gpt-tools-response-chunking.mjs
          node test-governed-tool-response-chunk-store.mjs

      - name: Commit and push without force
        shell: bash
        run: |
          set -euo pipefail
          git add http-generic-api/routes/systemLayerRoutes.js
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "1"
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(system-layer): declare large response budget"
          actual="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$actual" = "${EXPECTED_TARGET_HEAD}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Delete isolated operations branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --path-as-is \
            --request DELETE \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/gpt%2Fops%2Fpr-4395-system-layer-budget-20260801"
