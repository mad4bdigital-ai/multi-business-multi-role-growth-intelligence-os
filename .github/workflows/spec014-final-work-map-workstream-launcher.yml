name: Spec 014 Final Work Map Workstream Launcher

on:
  push:
    branches:
      - gpt/014-hostinger/final-work-map-exact-head-readback-20260802
    paths:
      - ".github/workflows/spec014-final-work-map-workstream-launcher.yml"

permissions:
  contents: write

env:
  EXPECTED_PARENT: 3fdded3ce97bf024fe9fbb71f362aaf52a3d09f3
  TARGET_BRANCH: gpt/014-hostinger/final-work-map-exact-head-readback-20260802
  LAUNCHER_PATH: .github/workflows/spec014-final-work-map-workstream-launcher.yml
  CONTRACT_PATH: specs/014-governed-hostinger-storage-orchestration/e2e-phases.json

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout launcher commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify bounded launcher identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$LAUNCHER_PATH"

      - name: Register exact Work Map workstream
        shell: bash
        run: |
          set -euo pipefail
          node - "$CONTRACT_PATH" "$EXPECTED_PARENT" <<'NODE'
          const fs = require('node:fs');
          const contractPath = process.argv[2];
          const evidenceHead = process.argv[3];
          const contract = JSON.parse(fs.readFileSync(contractPath, 'utf8'));
          const parallel = contract.parallel_work;
          if (!parallel?.enabled || !Array.isArray(parallel.workstreams)) {
            throw new Error('Spec 014 parallel_work contract is unavailable');
          }
          const id = 'final-work-map-readback';
          if (parallel.workstreams.some((row) => row.id === id)) {
            throw new Error(`${id} is already registered`);
          }
          parallel.workstreams.push({
            id,
            title: 'Final Work Map and schema-classification exact-head readback',
            status: 'ready_for_integration',
            owner_type: 'mixed',
            branch_pattern: 'gpt/014-hostinger/final-work-map-exact-head-readback-*',
            scope: {
              include: [
                '.changes/e2e/spec014-final-work-map-exact-head-readback.json',
                '.github/workflows/hostinger-storage-final-work-map-readback-guard.yml',
                'http-generic-api/scripts/spec014-final-work-map-readback.mjs',
                'http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs',
                'specs/014-governed-hostinger-storage-orchestration/e2e-phases.json',
                'specs/014-governed-hostinger-storage-orchestration/evidence/final-work-map-exact-head-readback-20260802.md',
                'specs/014-governed-hostinger-storage-orchestration/tasks.md',
                'specs/014-governed-hostinger-storage-orchestration/work-map-integration.json'
              ]
            },
            depends_on: ['contracts', 'schema-classification'],
            deliverables: [
              'Exact-head Work Map and schema-classification readback with structured fail-closed evidence',
              'Deterministic bounded registry-binding producer and permanent T006 evidence'
            ],
            integration_points: [
              'spec014-work-map-exact-head-readback-v1',
              'work-map-schema-classification-registry-v1'
            ],
            required_tests: [
              {
                id: 'spec014-final-work-map-exact-head-readback',
                runner: 'node',
                working_directory: '.',
                path: 'http-generic-api/scripts/spec014-final-work-map-readback.mjs',
                args: []
              }
            ],
            commit_evidence: {
              head_sha: evidenceHead,
              commits: [evidenceHead]
            }
          });
          parallel.declared_overlaps = Array.isArray(parallel.declared_overlaps)
            ? parallel.declared_overlaps
            : [];
          parallel.declared_overlaps.push({
            id: 'contracts-final-work-map-governance-binding',
            workstreams: ['contracts', id],
            patterns: [
              'specs/014-governed-hostinger-storage-orchestration/e2e-phases.json',
              'specs/014-governed-hostinger-storage-orchestration/evidence/final-work-map-exact-head-readback-20260802.md',
              'specs/014-governed-hostinger-storage-orchestration/tasks.md',
              'specs/014-governed-hostinger-storage-orchestration/work-map-integration.json'
            ],
            reason: 'The contracts workstream owns the Spec package broadly while this bounded readback owns only final Work Map governance bindings and T006 evidence.',
            coordinator: 'spec-014-integration-rollup'
          });
          if (!parallel.integration || !Array.isArray(parallel.integration.required_workstreams)) {
            throw new Error('Spec 014 integration.required_workstreams is unavailable');
          }
          if (!parallel.integration.required_workstreams.includes(id)) {
            parallel.integration.required_workstreams.push(id);
          }
          fs.writeFileSync(contractPath, `${JSON.stringify(contract)}\n`);
          NODE

      - name: Remove launcher and verify exact write set
        shell: bash
        run: |
          set -euo pipefail
          rm "$LAUNCHER_PATH"
          mapfile -t changed < <(git status --short | sed -E 's/^.. //' | sort)
          expected=("$LAUNCHER_PATH" "$CONTRACT_PATH")
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")

      - name: Commit and push bounded registration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LAUNCHER_PATH" "$CONTRACT_PATH"
          git commit -m "chore(spec-014): register final Work Map readback workstream"
          git push origin "HEAD:${TARGET_BRANCH}"
