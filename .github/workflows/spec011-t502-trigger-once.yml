name: Spec 011 T502 Trigger Once

on:
  push:
    branches:
      - gpt/spec-011-t502-governed-remote-git-transport-20260730
    paths:
      - .github/workflows/spec011-t502-trigger-once.yml

permissions:
  contents: write

concurrency:
  group: spec011-t502-trigger-once
  cancel-in-progress: true

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: gpt/spec-011-t502-governed-remote-git-transport-20260730
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Extract and execute bounded integration patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/spec011-t502-bootstrap-once.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          lines = source[start:end]
          prefix = min(len(line) - len(line.lstrip()) for line in lines if line.strip())
          Path('/tmp/spec011-t502-patch.py').write_text('\n'.join(line[prefix:] for line in lines) + '\n')
          PY
          python /tmp/spec011-t502-patch.py
      - name: Verify focused T500-T502 contracts
        working-directory: http-generic-api
        run: |
          node --check managedGitRemoteTransport.js
          node --check routes/operationOrchestratorRoutes.js
          node test-managed-git-ephemeral-checkout-executor.mjs
          node scripts/test-managed-git-worker-lifecycle.mjs
          node test-operation-orchestrator-managed-workspace-dependency.mjs
          node test-managed-git-repository-credential-binding.mjs
          node test-operation-orchestrator-repository-credential.mjs
          node test-managed-git-remote-transport.mjs
          node test-operation-orchestrator-managed-git-transport.mjs
      - name: Remove temporary workflows and push verified integration
        shell: bash
        run: |
          rm .github/workflows/spec011-t502-bootstrap-once.yml
          rm .github/workflows/spec011-t502-trigger-once.yml
          git config user.name "mad4bdigital-ai[bot]"
          git config user.email "271942579+mad4bdigital-ai@users.noreply.github.com"
          git add http-generic-api specs/011-database-driven-operation-fabric .github/workflows/spec011-t502-bootstrap-once.yml .github/workflows/spec011-t502-trigger-once.yml
          git commit -m "feat(spec-011): integrate governed remote Git transport"
          git push origin HEAD:gpt/spec-011-t502-governed-remote-git-transport-20260730
