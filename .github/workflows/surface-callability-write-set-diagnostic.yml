name: Surface Callability Write Set Diagnostic

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.ref == 'gpt/surface-callability-main-reconstruction-20260803' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: gpt/surface-callability-main-reconstruction-20260803
      PINNED_FINALIZER_HEAD: f17c6335ce90d7fac84cb67184e8277d7af43195
      VALIDATOR_PATH: .github/workflows/surface-callability-product-validation.yml
      DIAGNOSTIC_PATH: .github/workflows/surface-callability-write-set-diagnostic.yml
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out exact diagnostic branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Verify exact diagnostic trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PINNED_FINALIZER_HEAD"
          test "$(git diff --name-only HEAD^ HEAD)" = "$DIAGNOSTIC_PATH"

      - name: Apply reviewed scope patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          validator = Path('.github/workflows/surface-callability-product-validation.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = validator.find(start_marker)
          if start < 0:
              raise SystemExit('validator_patch_start_missing')
          start += len(start_marker)
          end = validator.find(end_marker, start)
          if end < 0:
              raise SystemExit('validator_patch_end_missing')
          Path('/tmp/apply_surface_queue_scope.py').write_text(textwrap.dedent(validator[start:end]))
          PY
          python3 /tmp/apply_surface_queue_scope.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install and regenerate evidence
        working-directory: http-generic-api
        run: |
          set -euo pipefail
          npm ci
          node scripts/surface-callability-closure/generate_closure_contracts.mjs
          npm run frontend:dispatch:generate
          node scripts/surface-contract-discovery.mjs --write

      - name: Publish exact write set to PR audit thread
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Surface finalizer write-set diagnostic'
            echo
            echo 'Pinned product source: `821760b10c485dd7877fbbb43d4c3179ec19b5a7`'
            echo 'Diagnostic head: `'
            git rev-parse HEAD
            echo '`'
            echo
            echo '```text'
            git diff --name-status
            echo '```'
            echo
            echo 'Diagnostic only: no branch push, no Production/deploy/database/provider/credential/external-send mutation.'
          } > /tmp/surface-write-set-comment.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" --method POST --raw-field body="$(cat /tmp/surface-write-set-comment.md)"
