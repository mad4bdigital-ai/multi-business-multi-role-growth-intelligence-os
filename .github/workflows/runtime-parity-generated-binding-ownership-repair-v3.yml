name: Runtime Parity Generated Binding Ownership Diagnostic V3

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/runtime-parity-generated-binding-ownership-repair-v3.yml

permissions:
  contents: read

concurrency:
  group: runtime-parity-generated-binding-ownership-diagnostic-v3
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event.pull_request.number == 5985
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      EXPECTED_BRANCH: gpt/add-runtime-parity-comment-bridge-v2-20260804
      EXPECTED_PARENT: bc1da4020ad451ce31ccf4efb42566e71b7efb52
      EXPECTED_MAIN: 30b48a17bae1921d796e7e49b1f72a9ab5a871ff
      REPORT_DIR: ${{ runner.temp }}/generated-binding-focused

    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable parent, base, and diagnostic scope
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          test "${GITHUB_HEAD_REF}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${EVENT_HEAD}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${EXPECTED_MAIN}"
          python3 - <<'PY'
          import subprocess
          expected = {
              '.changes/e2e/production-runtime-parity-comment-bridge.json',
              '.github/workflows/production-runtime-parity-comment-bridge.yml',
              '.github/workflows/runtime-parity-generated-binding-ownership-repair-v3.yml',
              'docs/work-maps/README.md',
              'docs/work-maps/repository-automation-map.md',
              'http-generic-api/scripts/test-production-runtime-parity-comment-bridge.mjs',
              'specs/014-governed-hostinger-storage-orchestration/work-map-integration.json',
          }
          actual = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True
          ).splitlines())
          if actual != expected:
              raise SystemExit(f'diagnostic scope mismatch: expected={sorted(expected)} actual={sorted(actual)}')
          PY

      - name: Materialize proposed ownership patch locally
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          def regex_once(text, pattern, replacement, label):
              updated, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'{label}: expected one target, found {count}')
              return updated

          helper = '''function isGeneratedSpecIntegrationPath(file, policy) {
            const feature = specKeyFromFile(file, policy);
            if (!feature) return false;
            return normalize(file) === normalize(path.posix.join(policy.spec_root, feature, "work-map-integration.json"));
          }

          '''

          parallel_path = Path('http-generic-api/scripts/e2e-parallel-work-governance.mjs')
          parallel = parallel_path.read_text()
          parallel = regex_once(
              parallel,
              r'(?=function discoverContractPaths\(changedFiles, policy\) \{)',
              helper,
              'parallel helper insertion'
          )
          parallel = regex_once(
              parallel,
              r'(for \(const file of changedFiles\) \{\n)(\s*)(const feature = specKeyFromFile\(file, policy\);)',
              r'\1\2if (isGeneratedSpecIntegrationPath(file, policy)) continue;\n\2\3',
              'parallel ownership discovery'
          )
          parallel_path.write_text(parallel)

          phase_path = Path('http-generic-api/scripts/e2e-phase-governance.mjs')
          phase = phase_path.read_text()
          phase = regex_once(
              phase,
              r'(?=function discoverContractPaths\(policy, changedFiles\) \{)',
              helper,
              'phase helper insertion'
          )
          phase = regex_once(
              phase,
              r'  const changedSpecs = new Set\(changedFiles\.map\(\(file\) => specKeyFromFile\(file, policy\)\)\.filter\(Boolean\)\);',
              '''  const changedSpecs = new Set(
            changedFiles
              .filter((file) => !isGeneratedSpecIntegrationPath(file, policy))
              .map((file) => specKeyFromFile(file, policy))
              .filter(Boolean)
          );''',
              'phase ownership discovery'
          )
          phase_path.write_text(phase)

          parallel_test_path = Path('http-generic-api/scripts/e2e-parallel-work-governance-self-test.mjs')
          parallel_test = parallel_test_path.read_text()
          parallel_regressions = '''{
            const root = tempRepo();
            const generatedBinding = "specs/001-example/work-map-integration.json";
            write(root, generatedBinding, "{}\\n");
            const report = evaluateParallelWork({
              root,
              policy,
              changedFiles: [generatedBinding],
              headRef: "gpt/unrelated-runtime-change",
              head: "HEAD"
            });
            assert.equal(report.ok, true, JSON.stringify(report.findings));
            assert.equal(report.contracts.length, 0);
          }

          {
            const generatedBinding = "specs/001-example/work-map-integration.json";
            const report = evaluate(baseContract(), [generatedBinding, "specs/001-example/spec.md"]);
            assert.equal(report.ok, true, JSON.stringify(report.findings));
            assert.equal(report.contracts[0].active_workstream, "contracts");
          }

          console.log(JSON.stringify({ ok: true, tests: 9, gate: "e2e_parallel_work_governance", secrets_included: false }));'''
          parallel_test = regex_once(
              parallel_test,
              r'console\.log\(JSON\.stringify\(\{ ok: true, tests: 7, gate: "e2e_parallel_work_governance", secrets_included: false \}\)\);\s*$',
              parallel_regressions,
              'parallel regression insertion'
          )
          parallel_test_path.write_text(parallel_test + '\n')

          phase_test_path = Path('http-generic-api/scripts/e2e-phase-governance-self-test.mjs')
          phase_test = phase_test_path.read_text()
          phase_regressions = '''{
            const root = tempRepo();
            const independentContract = ".changes/e2e/001-example.json";
            const generatedBinding = "specs/001-example/work-map-integration.json";
            write(root, "http-generic-api/example/e2e.mjs", "process.exit(0);\\n");
            write(root, independentContract, `${JSON.stringify(contract(), null, 2)}\\n`);
            write(root, generatedBinding, "{}\\n");
            const result = evaluateRepository({ root, policy, changedFiles: [independentContract, generatedBinding] });
            assert.equal(result.report.ok, true, JSON.stringify(result.report.findings));
            assert.equal(result.report.contracts.length, 1);
            assert.equal(result.report.contracts[0].contract_path, independentContract);
          }

          {
            const root = tempRepo();
            const independentContract = ".changes/e2e/001-example.json";
            const generatedBinding = "specs/001-example/work-map-integration.json";
            write(root, "http-generic-api/example/e2e.mjs", "process.exit(0);\\n");
            write(root, independentContract, `${JSON.stringify(contract(), null, 2)}\\n`);
            write(root, generatedBinding, "{}\\n");
            write(root, "specs/001-example/spec.md", "# Real spec change\\n");
            const result = evaluateRepository({
              root,
              policy,
              changedFiles: [independentContract, generatedBinding, "specs/001-example/spec.md"]
            });
            assert.equal(result.report.ok, false);
            assert(result.report.findings.some((row) => row.code === "missing_spec_e2e_phase_contract"));
          }

          console.log(JSON.stringify({ ok: true, tests: 9, gate: "e2e_phase_governance", secrets_included: false }));'''
          phase_test = regex_once(
              phase_test,
              r'console\.log\(JSON\.stringify\(\{ ok: true, tests: 7, gate: "e2e_phase_governance", secrets_included: false \}\)\);\s*$',
              phase_regressions,
              'phase regression insertion'
          )
          phase_test_path.write_text(phase_test + '\n')

          contract_path = Path('.changes/e2e/production-runtime-parity-comment-bridge.json')
          contract_data = json.loads(contract_path.read_text())
          self_test = 'http-generic-api/scripts/e2e-parallel-work-governance-self-test.mjs'
          if self_test not in contract_data['scope']['include']:
              contract_data['scope']['include'].append(self_test)
              contract_data['scope']['include'].sort()
          journey = next(row for row in contract_data['phases'] if row.get('id') == 'mvp')['e2e_journeys'][0]
          if self_test not in journey['evidence_paths']:
              journey['evidence_paths'].append(self_test)
              journey['evidence_paths'].sort()
          contract_path.write_text(json.dumps(contract_data, indent=2) + '\n')
          PY

      - name: Run focused tests independently and preserve output
        id: focused
        continue-on-error: true
        shell: bash
        working-directory: http-generic-api
        run: |
          set -uo pipefail
          mkdir -p "${REPORT_DIR}"
          run_case() {
            local name="$1"
            shift
            set +e
            "$@" >"${REPORT_DIR}/${name}.log" 2>&1
            local status=$?
            set -e
            printf '%s\n' "${status}" >"${REPORT_DIR}/${name}.status"
            {
              echo "===== ${name} status=${status} ====="
              cat "${REPORT_DIR}/${name}.log"
            } | tee -a "${REPORT_DIR}/combined.log"
          }
          set -e
          run_case check_parallel node --check scripts/e2e-parallel-work-governance.mjs
          run_case check_phase node --check scripts/e2e-phase-governance.mjs
          run_case check_parallel_test node --check scripts/e2e-parallel-work-governance-self-test.mjs
          run_case check_phase_test node --check scripts/e2e-phase-governance-self-test.mjs
          run_case parallel_self_test node scripts/e2e-parallel-work-governance-self-test.mjs
          run_case phase_self_test node scripts/e2e-phase-governance-self-test.mjs
          run_case parallel_flow_self_test node scripts/e2e-parallel-pr-flow-self-test.mjs
          run_case bridge_test node scripts/test-production-runtime-parity-comment-bridge.mjs
          git diff -- http-generic-api/scripts/e2e-parallel-work-governance.mjs \
            http-generic-api/scripts/e2e-phase-governance.mjs \
            http-generic-api/scripts/e2e-parallel-work-governance-self-test.mjs \
            http-generic-api/scripts/e2e-phase-governance-self-test.mjs \
            .changes/e2e/production-runtime-parity-comment-bridge.json \
            >"${REPORT_DIR}/proposed.patch"
          if find "${REPORT_DIR}" -name '*.status' -exec grep -L '^0$' {} + | grep -q .; then
            exit 1
          fi

      - name: Upload focused diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-parity-generated-binding-focused-${{ github.run_id }}
          path: ${{ env.REPORT_DIR }}/*
          if-no-files-found: error
          retention-days: 14

      - name: Enforce diagnostic outcome
        if: always()
        shell: bash
        env:
          FOCUSED_OUTCOME: ${{ steps.focused.outcome }}
        run: |
          set -Eeuo pipefail
          test "${FOCUSED_OUTCOME}" = success
