name: Runtime Parity Generated Binding Ownership Repair V6

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .runtime-parity-ownership-repair-v6.trigger

permissions:
  contents: write

concurrency:
  group: runtime-parity-generated-binding-ownership-repair-v6-pr-5985
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.number == 5985
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      EXPECTED_BRANCH: gpt/add-runtime-parity-comment-bridge-v2-20260804
      EXPECTED_MAIN: 93430fd5e709f49d7a47e2830382b6578a7a22e6
      EXPECTED_PRELAUNCH: 81c48864c69acd2b85b1fe6ad7ca6dfa1b3d0006
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      TEMP_WORKFLOW: .github/workflows/runtime-parity-generated-binding-ownership-repair-v3.yml
      TEMP_SCRIPT: .github/scripts/runtime-parity-ownership-repair-v6.sh
      TEMP_TRIGGER: .runtime-parity-ownership-repair-v6.trigger

    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Execute bounded synchronized repair
        shell: bash
        run: bash .github/scripts/runtime-parity-ownership-repair-v6.sh
