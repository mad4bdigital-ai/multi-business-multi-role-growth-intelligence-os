name: Surface Callability Current Main V2 Finalizer

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/surface-callability-current-main-v2-finalizer.yml

permissions:
  contents: read

concurrency:
  group: surface-callability-current-main-v2-finalizer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose-generation:
    if: >-
      github.repository == 'mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os' &&
      github.event.pull_request.number == 5685 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/surface-current-main-clean-v2-20260803' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      TARGET_BRANCH: gpt/surface-current-main-clean-v2-20260803
      BASE_SHA: cf4282d5fd74b7c20cbac3ad2aa74742d135d2a5
      WORKFLOW_PATH: .github/workflows/surface-callability-current-main-v2-finalizer.yml

    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Verify exact bounded trigger
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "${TARGET_BRANCH}"
          git merge-base --is-ancestor "${BASE_SHA}" HEAD
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "${WORKFLOW_PATH}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Discovery before closure
        working-directory: http-generic-api
        run: node scripts/surface-contract-discovery.mjs --write

      - name: Generate closure contracts
        id: closure-generator
        working-directory: http-generic-api
        continue-on-error: true
        shell: bash
        run: |
          set +e
          diagnostic="../surface-closure-generator.log"
          NO_COLOR=1 node scripts/surface-callability-closure/generate_closure_contracts.mjs > "$diagnostic" 2>&1
          status=$?
          printf '%s\n' "$status" > ../surface-closure-generator-status.txt
          cat "$diagnostic"
          exit "$status"

      - name: Upload closure generator diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surface-closure-generator-diagnostic-${{ github.run_id }}
          path: |
            surface-closure-generator.log
            surface-closure-generator-status.txt
          if-no-files-found: error
          retention-days: 1

      - name: Enforce closure generator
        if: steps.closure-generator.outcome != 'success'
        run: exit 1

      - name: Discovery after closure
        working-directory: http-generic-api
        run: node scripts/surface-contract-discovery.mjs --write

      - name: Generate frontend dispatch
        working-directory: http-generic-api
        run: npm run frontend:dispatch:generate -- --baseline-ref="${BASE_SHA}"
