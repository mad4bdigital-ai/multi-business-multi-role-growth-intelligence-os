name: CI Runner Main Sync

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths: [.github/workflows/ci-runner-main-sync.yml]

permissions:
  contents: write

concurrency:
  group: ci-runner-main-sync-6027
  cancel-in-progress: true

jobs:
  sync:
    if: >-
      github.event.pull_request.number == 6027 &&
      github.event.pull_request.head.ref == 'gpt/ci-runner-concurrency-unblock-20260804'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_BRANCH: gpt/ci-runner-concurrency-unblock-20260804
      WORKFLOW_PATH: .github/workflows/ci-runner-main-sync.yml
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact trigger and branch lease
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "${TARGET_BRANCH}"
          test "$(git diff --name-only HEAD^ HEAD)" = "${WORKFLOW_PATH}"
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "$(git rev-parse HEAD)"

      - name: Merge stable live main
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name mad4bdigital-ai
          git config user.email mad4bdigital-ai@users.noreply.github.com
          git fetch origin main
          git rev-parse origin/main > /tmp/main-sha.txt
          git merge --no-ff --no-edit origin/main

      - name: Validate synchronized five-file scope
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t changed < <(git diff --name-only origin/main...HEAD | sort -u)
          test "${#changed[@]}" -eq 6
          printf '%s\n' "${changed[@]}"
          for expected in \
            "${WORKFLOW_PATH}" \
            .github/workflows/ci.yml \
            .github/workflows/frontend-surface-dispatch.yml \
            .github/workflows/repository-tool-lifecycle-governance.yml \
            .github/workflows/context-kernel-hardcoding-report.yml \
            .github/workflows/e2e-phase-governance.yml; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "$expected"
          done
          git diff --check origin/main...HEAD
          node http-generic-api/scripts/e2e-phase-governance-self-test.mjs
          node http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs
          (cd http-generic-api && node test-frontend-dispatch-workflow-baseline.mjs)

      - name: Remove temporary workflow and commit synchronized result
        shell: bash
        run: |
          set -Eeuo pipefail
          rm "${WORKFLOW_PATH}"
          git add -A
          git commit -m 'ci: synchronize runner queue remediation with main'
          test ! -e "${WORKFLOW_PATH}"
          mapfile -t changed < <(git diff --name-only origin/main...HEAD | sort -u)
          test "${#changed[@]}" -eq 5
          printf '%s\n' "${changed[@]}"

      - name: Verify live main stability
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_main="$(cat /tmp/main-sha.txt)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$expected_main"

      - name: Record synchronized commit metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/sync-commit
          git rev-parse HEAD > /tmp/sync-commit/commit-sha.txt
          git rev-parse 'HEAD^{tree}' > /tmp/sync-commit/tree-sha.txt
          git rev-parse HEAD^ > /tmp/sync-commit/parent-sha.txt
          cat /tmp/main-sha.txt > /tmp/sync-commit/main-sha.txt
          git show --stat --oneline --decorate=short HEAD > /tmp/sync-commit/summary.txt

      - name: Upload synchronized commit metadata
        uses: actions/upload-artifact@v4
        with:
          name: ci-runner-main-sync-${{ github.event.pull_request.head.sha }}
          path: /tmp/sync-commit
          if-no-files-found: error
          retention-days: 1

      - name: Attempt bounded push
        shell: bash
        run: |
          set -Eeuo pipefail
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
