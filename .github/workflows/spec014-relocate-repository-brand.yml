name: Relocate Spec 014 repository provenance brand

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - gpt/hostinger-safe-storage-cleanup-ssh-20260801
    paths:
      - .github/workflows/spec014-relocate-repository-brand.yml

permissions:
  contents: write

jobs:
  relocate:
    if: github.head_ref == 'gpt/014-hostinger/control-plane-repository-brand-20260801'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gpt/014-hostinger/control-plane-repository-brand-20260801
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Correct workstream identity and publish clean branch
        env:
          TARGET_BRANCH: gpt/014-hostinger/repository-provenance-brand-20260801
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          IMPLEMENTATION_SHA="$(git rev-parse HEAD^)"
          export IMPLEMENTATION_SHA

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const contractPath = 'specs/014-governed-hostinger-storage-orchestration/e2e-phases.json';
          const contract = JSON.parse(fs.readFileSync(contractPath, 'utf8'));
          const workstream = contract.parallel_work.workstreams.find((row) => row.id === 'control-plane-repository-brand');
          if (!workstream) throw new Error('control-plane-repository-brand workstream not found');

          workstream.branch_pattern = 'gpt/014-hostinger/repository-provenance-brand-*';
          workstream.scope.include = workstream.scope.include.filter(
            (path) => path !== 'specs/014-governed-hostinger-storage-orchestration/evidence/control-plane-repository-brand-*.md',
          );
          workstream.commit_evidence = {
            head_sha: process.env.IMPLEMENTATION_SHA,
            commits: [process.env.IMPLEMENTATION_SHA],
          };

          fs.writeFileSync(contractPath, `${JSON.stringify(contract)}\n`);
          fs.rmSync('.github/workflows/spec014-relocate-repository-brand.yml');
          NODE

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(spec-014): isolate repository provenance workstream'
          git remote set-url origin "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
