## Purpose

Canonical governance mutations must not depend on the ordinary runtime database identity having broad write authority. The platform therefore uses a dedicated Governance DB writer identity for capability-envelope and governed-migration control-plane writes.

## Credential contract

Required for governance mutation surfaces:

- \`GOVERNANCE_DB_USER\`
- \`GOVERNANCE_DB_PASSWORD\`

Optional physical-location overrides:

- \`GOVERNANCE_DB_HOST\` (defaults only to \`DB_HOST\`)
- \`GOVERNANCE_DB_PORT\` (defaults only to \`DB_PORT\` / 3306)
- \`GOVERNANCE_DB_NAME\` (defaults only to \`DB_NAME\`)
- \`GOVERNANCE_DB_CONNECTION_LIMIT\` (bounded to 1..5)
- \`GOVERNANCE_DB_CONNECT_TIMEOUT_MS\`

The governance user/password **never** fall back to \`DB_USER\` or \`DB_PASSWORD\`. Missing governance identity fails closed with \`GOVERNANCE_DB_CONFIG_MISSING\` and no secret values in the error contract.

## Writer boundary

The dedicated identity is used for bounded canonical governance mutations in:

- capability resolution envelope creation;
- capability resolution envelope approval;
- capability envelope apply authorization;
- governed migration authorization bootstrap and checksum rotation;
- migration executor apply-policy/certification bootstrap writes;
- migration authorization envelope reference marking when invoked by the bootstrap flow.

Normal authority resolution and ordinary runtime reads remain on the runtime pool unless the same writer transaction must perform its own same-cycle readback.

## Production minimum privilege contract

Provision the dedicated MariaDB principal using hosting/database administrative authority. Do not provision from application code and do not grant the runtime DB account broader access merely to satisfy governance flows.

Initial required set:

| Table | Operations |
|---|---|
| \`capability_resolution_envelope_ledger\` | SELECT, INSERT, UPDATE |
| \`approval_holds\` | INSERT |
| \`governed_migration_authorization_registry\` | SELECT, INSERT, UPDATE |
| \`capability_apply_authorization_policy_registry\` | SELECT, INSERT, UPDATE |
| \`runtime_dispatch_certification_registry\` | SELECT, INSERT, UPDATE |
| \`governed_migration_ledger\` | SELECT |

Do not grant schema-wide write, ALL PRIVILEGES, DELETE, DROP, ALTER, CREATE, FILE, PROCESS, SUPER, or account-management privileges unless a later reviewed contract proves a concrete need.

## Rollout rule

1. Merge source repair through normal PR governance.
2. Promote/deploy through the normal Production lifecycle.
3. Provision the dedicated MariaDB principal and the reviewed table privileges outside application runtime.
4. Configure \`GOVERNANCE_DB_*\` secrets without exposing values to GitHub/logs/evidence.
5. Prove exact Production runtime parity.
6. Run a bounded no-secret governance-writer readiness probe/readback.
7. Re-read migration ledger/state.
8. Obtain a fresh checksum/state-bound readiness authorization before retrying a governed migration readiness cycle.

A previously consumed readiness token is never reusable after a failed cycle.

## Incident reference

Issue #6813 records the Production failure that established this boundary. Readiness run \`31379417191\` failed at envelope creation with \`ER_TABLEACCESS_DENIED_ERROR\` before migration dry-run or Apply.
`);

