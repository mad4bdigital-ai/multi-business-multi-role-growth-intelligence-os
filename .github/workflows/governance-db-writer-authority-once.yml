let governancePool = null;

function text(value = "") {
  return String(value ?? "").trim();
}

function boundedConnectionLimit(value) {
  const parsed = Number(value);
  if (!Number.isFinite(parsed)) return 2;
  return Math.min(Math.max(Math.trunc(parsed), 1), 5);
}

export function resolveGovernanceDbConfig(env = process.env) {
  const host = text(env.GOVERNANCE_DB_HOST || env.DB_HOST);
  const database = text(env.GOVERNANCE_DB_NAME || env.DB_NAME);
  const user = text(env.GOVERNANCE_DB_USER);
  const password = text(env.GOVERNANCE_DB_PASSWORD);
  const missing = [];
  if (!host) missing.push(env.GOVERNANCE_DB_HOST ? "GOVERNANCE_DB_HOST" : "DB_HOST");
  if (!database) missing.push(env.GOVERNANCE_DB_NAME ? "GOVERNANCE_DB_NAME" : "DB_NAME");
  if (!user) missing.push("GOVERNANCE_DB_USER");
  if (!password) missing.push("GOVERNANCE_DB_PASSWORD");
  if (missing.length) {
    const error = new Error(\`Missing required Governance DB configuration: \${missing.join(", ")}\`);
    error.code = "GOVERNANCE_DB_CONFIG_MISSING";
    error.details = { missing, secrets_included: false };
    throw error;
  }
  return {
    host,
    port: Number(env.GOVERNANCE_DB_PORT || env.DB_PORT) || 3306,
    database,
    user,
    password,
    waitForConnections: true,
    connectionLimit: boundedConnectionLimit(env.GOVERNANCE_DB_CONNECTION_LIMIT),
    queueLimit: 0,
    connectTimeout: Number(env.GOVERNANCE_DB_CONNECT_TIMEOUT_MS || env.DB_CONNECT_TIMEOUT_MS) || 10000,
    timezone: "Z",
    enableKeepAlive: true,
    keepAliveInitialDelay: 10000,
  };
}

export function governanceDbAuthoritySummary(env = process.env) {
  const config = resolveGovernanceDbConfig(env);
  return {
    authority: "governance_db_writer",
    host_configured: Boolean(config.host),
    database_configured: Boolean(config.database),
    user_configured: Boolean(config.user),
    password_configured: Boolean(config.password),
    connection_limit: config.connectionLimit,
    runtime_identity_fallback_allowed: false,
    secrets_included: false,
  };
}

export function getGovernancePool() {
  if (!governancePool) governancePool = mysql.createPool(resolveGovernanceDbConfig());
  return governancePool;
}

export async function closeGovernancePool() {
  const current = governancePool;
  governancePool = null;
  if (current) await current.end();
}
`);

