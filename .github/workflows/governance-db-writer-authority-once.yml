name: Governance DB Writer Authority One Shot

on:
  push:
    branches:
      - fix/governance-db-writer-authority-20260810

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    if: github.repository == 'mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact source base and one-shot diff
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_MAIN=83ce15fa50d417bfa4a68035d356f4e6361dfdc7
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git merge-base --is-ancestor "$EXPECTED_MAIN" HEAD
          test "$(git diff --name-only "$EXPECTED_MAIN"...HEAD)" = ".github/workflows/governance-db-writer-authority-once.yml"

      - name: Apply bounded governance DB writer patch
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          function read(path) { return fs.readFileSync(path, 'utf8'); }
          function write(path, value) { fs.writeFileSync(path, value); }
          function writeB64(path, payload) { fs.mkdirSync(require('node:path').dirname(path), { recursive: true }); write(path, Buffer.from(payload, 'base64').toString('utf8')); }
          function replaceOnce(path, from, to) {
            const source = read(path);
            const index = source.indexOf(from);
            if (index < 0) throw new Error(`Missing replacement target in ${path}: ${from.slice(0, 100)}`);
            if (source.indexOf(from, index + from.length) >= 0) throw new Error(`Replacement target is ambiguous in ${path}: ${from.slice(0, 100)}`);
            write(path, source.slice(0, index) + to + source.slice(index + from.length));
          }
          function replaceAllExact(path, from, to, expectedCount) {
            const source = read(path);
            const count = source.split(from).length - 1;
            if (count !== expectedCount) throw new Error(`Expected ${expectedCount} replacements in ${path}, found ${count}: ${from.slice(0, 100)}`);
            write(path, source.split(from).join(to));
          }
          writeB64('http-generic-api/governanceDb.js', '');
          writeB64('http-generic-api/test-governance-db-writer-authority.mjs', '');
          writeB64('docs/governance/governance-db-writer-authority.md', '');
          writeB64('.changes/e2e/governance-db-writer-authority.json', '');

          const createPath = 'http-generic-api/scripts/capability-resolution-envelope-create.mjs';
          replaceOnce(createPath, 'import { getPool } from "../db.js";\n', 'import { getPool } from "../db.js";\nimport { closeGovernancePool, getGovernancePool } from "../governanceDb.js";\n');
          replaceOnce(createPath, 'export async function createCapabilityResolutionEnvelopeLedger(args = parseArgs()) {\n', 'export async function createCapabilityResolutionEnvelopeLedger(args = parseArgs(), deps = {}) {\n');
          replaceOnce(createPath, '  const pool = getPool();\n  const repositoryPolicyDryRun = await buildRepositoryPolicyEnvelopeDryRun({ dryRunArgs, bindingContext, pool });\n', '  const pool = deps.readPool || getPool();\n  const writePool = deps.writePool || getGovernancePool();\n  const repositoryPolicyDryRun = await buildRepositoryPolicyEnvelopeDryRun({ dryRunArgs, bindingContext, pool });\n');
          replaceOnce(createPath, '  await pool.query(`INSERT INTO capability_resolution_envelope_ledger\n', '  await writePool.query(`INSERT INTO capability_resolution_envelope_ledger\n');
          replaceOnce(createPath, '\nif (import.meta.url === `file://${process.argv[1]}`)', '\nasync function closeCliPools() {\n  await closeGovernancePool().catch(() => {});\n  try { await getPool().end(); } catch {}\n}\n\nif (import.meta.url === `file://${process.argv[1]}`)');
          replaceAllExact(createPath, 'await getPool().end().catch(()=>{});', 'await closeCliPools();', 2);

          const approvePath = 'http-generic-api/scripts/capability-resolution-envelope-approve.mjs';
          replaceOnce(approvePath, 'import { getPool } from "../db.js";\n', 'import { getPool } from "../db.js";\nimport { closeGovernancePool, getGovernancePool } from "../governanceDb.js";\n');
          replaceOnce(approvePath, 'export async function approveCapabilityResolutionEnvelope(args = parseArgs()) {\n', 'export async function approveCapabilityResolutionEnvelope(args = parseArgs(), deps = {}) {\n');
          replaceOnce(approvePath, '  const pool = getPool();\n  const row = await loadEnvelope(pool, envelopeId);\n', '  const pool = deps.readPool || getPool();\n  const writePool = deps.writePool || getGovernancePool();\n  const row = await loadEnvelope(pool, envelopeId);\n');
          replaceOnce(approvePath, '  await pool.query(\n    `INSERT INTO approval_holds\n', '  await writePool.query(\n    `INSERT INTO approval_holds\n');
          replaceOnce(approvePath, '  await pool.query(\n    `UPDATE capability_resolution_envelope_ledger\n', '  await writePool.query(\n    `UPDATE capability_resolution_envelope_ledger\n');
          replaceOnce(approvePath, '\nif (import.meta.url === `file://${process.argv[1]}`) {\n', '\nasync function closeCliPools() {\n  await closeGovernancePool().catch(() => {});\n  try { await getPool().end(); } catch {}\n}\n\nif (import.meta.url === `file://${process.argv[1]}`) {\n');
          replaceAllExact(approvePath, 'await getPool().end().catch(() => {});', 'await closeCliPools();', 2);

          const applyAuthorizePath = 'http-generic-api/scripts/capability-resolution-envelope-apply-authorize.mjs';
          replaceOnce(applyAuthorizePath, 'import { getPool } from "../db.js";\n', 'import { getPool } from "../db.js";\nimport { closeGovernancePool, getGovernancePool } from "../governanceDb.js";\n');
          replaceOnce(applyAuthorizePath, 'export async function authorizeCapabilityResolutionEnvelopeApply(args = parseArgs()) {\n', 'export async function authorizeCapabilityResolutionEnvelopeApply(args = parseArgs(), deps = {}) {\n');
          replaceOnce(applyAuthorizePath, '  const pool = getPool();\n  const row = await loadEnvelope(pool, envelopeId);\n', '  const pool = deps.readPool || getPool();\n  const writePool = deps.writePool || getGovernancePool();\n  const row = await loadEnvelope(pool, envelopeId);\n');
          replaceOnce(applyAuthorizePath, '  await pool.query(\n    `INSERT INTO approval_holds\n', '  await writePool.query(\n    `INSERT INTO approval_holds\n');
          replaceOnce(applyAuthorizePath, '  await pool.query(\n    `UPDATE capability_resolution_envelope_ledger\n', '  await writePool.query(\n    `UPDATE capability_resolution_envelope_ledger\n');
          replaceOnce(applyAuthorizePath, '\nif (import.meta.url === `file://${process.argv[1]}`) {\n', '\nasync function closeCliPools() {\n  await closeGovernancePool().catch(() => {});\n  try { await getPool().end(); } catch {}\n}\n\nif (import.meta.url === `file://${process.argv[1]}`) {\n');
          replaceAllExact(applyAuthorizePath, 'await getPool().end().catch(() => {});', 'await closeCliPools();', 2);

          const bootstrapPath = 'http-generic-api/governedMigrationAuthorizationBootstrap.js';
          replaceOnce(bootstrapPath, 'import { getPool } from "./db.js";\n', 'import { getPool } from "./db.js";\nimport { getGovernancePool } from "./governanceDb.js";\n');
          replaceOnce(bootstrapPath, 'async function reauthorizeExistingMigration({\n  pool,\n  candidate,\n', 'async function reauthorizeExistingMigration({\n  pool,\n  writePool,\n  candidate,\n');
          replaceAllExact(bootstrapPath, 'const connection = typeof pool.getConnection === "function" ? await pool.getConnection() : pool;', 'const connection = typeof writePool.getConnection === "function" ? await writePool.getConnection() : writePool;', 2);
          replaceAllExact(bootstrapPath, 'if (connection !== pool && typeof connection.release === "function") connection.release();', 'if (connection !== writePool && typeof connection.release === "function") connection.release();', 2);
          replaceOnce(bootstrapPath, 'export async function bootstrapGovernedMigrationAuthorization(input = {}, deps = {}) {\n  const pool = deps.pool || getPool();\n', 'export async function bootstrapGovernedMigrationAuthorization(input = {}, deps = {}) {\n  const pool = deps.pool || getPool();\n  const writePool = deps.writePool || deps.pool || getGovernancePool();\n');
          replaceOnce(bootstrapPath, '      return reauthorizeExistingMigration({\n        pool,\n        candidate,\n', '      return reauthorizeExistingMigration({\n        pool,\n        writePool,\n        candidate,\n');
          replaceAllExact(bootstrapPath, 'await ensureMigrationExecutorApplyPolicy(pool)', 'await ensureMigrationExecutorApplyPolicy(writePool)', 2);
          replaceAllExact(bootstrapPath, 'await ensureMigrationExecutorDispatchCertification(pool)', 'await ensureMigrationExecutorDispatchCertification(writePool)', 2);
          replaceAllExact(bootstrapPath, 'await markReferenced({\n    pool,\n', 'await markReferenced({\n    pool: writePool,\n', 3);

          const manifestPath = 'http-generic-api/scripts/test-manifest.mjs';
          replaceOnce(manifestPath, '  "node test-governed-migration-authorization-bootstrap.mjs",\n', '  "node test-governed-migration-authorization-bootstrap.mjs",\n  "node test-governance-db-writer-authority.mjs",\n');
          NODE

      - name: Validate source repair
        shell: bash
        run: |
          set -euo pipefail
          cd http-generic-api
          node --check governanceDb.js
          node --check scripts/capability-resolution-envelope-create.mjs
          node --check scripts/capability-resolution-envelope-approve.mjs
          node --check scripts/capability-resolution-envelope-apply-authorize.mjs
          node --check governedMigrationAuthorizationBootstrap.js
          node test-governance-db-writer-authority.mjs
          node test-capability-resolution-envelope-ledger.mjs
          node test-capability-envelope-apply-authorization-tool.mjs
          node test-governed-migration-authorization-bootstrap.mjs

      - name: Self-retire and commit bounded source diff
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/governance-db-writer-authority-once.yml
          git diff --check
          actual=$(git status --short | sed -E 's/^.. //' | sort)
          expected=$(printf '%s\n' \
            '.changes/e2e/governance-db-writer-authority.json' \
            'docs/governance/governance-db-writer-authority.md' \
            'http-generic-api/governanceDb.js' \
            'http-generic-api/governedMigrationAuthorizationBootstrap.js' \
            'http-generic-api/scripts/capability-resolution-envelope-apply-authorize.mjs' \
            'http-generic-api/scripts/capability-resolution-envelope-approve.mjs' \
            'http-generic-api/scripts/capability-resolution-envelope-create.mjs' \
            'http-generic-api/scripts/test-manifest.mjs' \
            'http-generic-api/test-governance-db-writer-authority.mjs')
          printf '%s\n' "$actual"
          test "$actual" = "$expected"
          git config user.name 'admin-assitant-growth-os[bot]'
          git config user.email '283129699+admin-assitant-growth-os[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(db): isolate governance writer authority'
          git push origin HEAD:fix/governance-db-writer-authority-20260810
