name: Repair PR 6650 Spec014 Work Map Bindings

on:
  push:
    branches:
      - fix/work-map-writer-delegation-p1-6647
    paths:
      - .github/ops/repair-pr6650-spec014-work-map-bindings.trigger

permissions:
  contents: write
  actions: write

concurrency:
  group: repair-pr6650-spec014-work-map-bindings
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Refresh exact-head Work Maps and Spec014 bindings
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BRANCH: fix/work-map-writer-delegation-p1-6647
          EXPECTED_PRE_REPAIR_HEAD: c61fc5e9ea32f800f2e796aeddb3450bd7307810
          WORKFLOW_FILE: .github/workflows/repair-pr6650-spec014-work-map-bindings.yml
          TRIGGER_FILE: .github/ops/repair-pr6650-spec014-work-map-bindings.trigger
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          git fetch origin main "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse origin/${EXPECTED_BRANCH})" = "${GITHUB_SHA}"

          previous_head="$(sed -n 's/^previous_head=//p' "$TRIGGER_FILE")"
          launcher_head="$(sed -n 's/^launcher_head=//p' "$TRIGGER_FILE")"
          repair_contract="$(sed -n 's/^repair_contract=//p' "$TRIGGER_FILE")"
          test "$previous_head" = "$EXPECTED_PRE_REPAIR_HEAD"
          test "$launcher_head" = "$(git rev-parse HEAD^)"
          test "$(git rev-parse HEAD~2)" = "$EXPECTED_PRE_REPAIR_HEAD"
          test "$repair_contract" = "final-worktree-supported-spec014-cli-v4"
          git merge-base --is-ancestor origin/main HEAD
          test "$(git rev-list --count HEAD..origin/main)" -eq 0

          # Temporary writer/trigger are Work Map sources. Remove them from the
          # worktree before generation so the committed final state is canonical.
          rm -f "$WORKFLOW_FILE" "$TRIGGER_FILE"

          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-governed-hostinger-storage-orchestration
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-retail-commerce-operations-growth-os

          # Converge to the fixed point, then prove idempotency/currentness.
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-governed-hostinger-storage-orchestration
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-retail-commerce-operations-growth-os
          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-governed-hostinger-storage-orchestration --check
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-retail-commerce-operations-growth-os --check

          mapfile -t CHANGED < <(git status --short | sed -E 's/^.. //' | sort)
          test "${#CHANGED[@]}" -gt 0
          for file in "${CHANGED[@]}"; do
            case "$file" in
              "$WORKFLOW_FILE"|"$TRIGGER_FILE"|docs/work-maps/*|specs/014-governed-hostinger-storage-orchestration/work-map-integration.json|specs/014-governed-hostinger-storage-orchestration/tasks.md|specs/014-retail-commerce-operations-growth-os/work-map-integration.json)
                ;;
              *)
                echo "Unexpected repair write: $file"
                exit 1
                ;;
            esac
          done

          git status --short | grep -Fq "$WORKFLOW_FILE"
          git status --short | grep -Fq "$TRIGGER_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            "$WORKFLOW_FILE" \
            "$TRIGGER_FILE" \
            docs/work-maps \
            specs/014-governed-hostinger-storage-orchestration/work-map-integration.json \
            specs/014-governed-hostinger-storage-orchestration/tasks.md \
            specs/014-retail-commerce-operations-growth-os/work-map-integration.json
          git diff --cached --quiet && { echo "Repair produced no staged change"; exit 1; }
          git commit -m "fix(spec014): converge final Work Map bindings for PR 6650"
          NEW_HEAD="$(git rev-parse HEAD)"

          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-governed-hostinger-storage-orchestration --check
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-retail-commerce-operations-growth-os --check
          test -z "$(git status --porcelain)"

          git fetch origin "${EXPECTED_BRANCH}"
          test "$(git rev-parse origin/${EXPECTED_BRANCH})" = "${GITHUB_SHA}"
          git push origin "HEAD:${EXPECTED_BRANCH}"

          gh workflow run spec-kit-work-map-integration.yml --repo "${GITHUB_REPOSITORY}" --ref "${EXPECTED_BRANCH}"
          gh workflow run ci.yml --repo "${GITHUB_REPOSITORY}" --ref "${EXPECTED_BRANCH}"
          echo "result_head=${NEW_HEAD}" >> "$GITHUB_STEP_SUMMARY"
