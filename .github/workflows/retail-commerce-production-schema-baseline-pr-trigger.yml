name: Retail Commerce Production Schema Baseline PR Trigger

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: retail-commerce-production-schema-baseline-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  production-schema-baseline:
    name: Collect PR-triggered SELECT-only Production schema evidence
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.id == 271942579 &&
      github.event.pull_request.draft == true &&
      startsWith(github.event.pull_request.head.ref, 'gpt/retail-commerce-production-schema-baseline-trigger-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_CONNECTION_LIMIT: "1"
      DB_CONNECT_TIMEOUT_MS: "10000"
      TRIGGER_PATH: .github/ops/retail-commerce-production-schema-baseline-trigger.json
      REQUIRED_CONFIRMATION: READ_ONLY_RETAIL_COMMERCE_SCHEMA_BASELINE

    steps:
      - name: Checkout exact trusted main tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize runtime report directory
        shell: bash
        run: |
          set -euo pipefail
          report_dir="${RUNNER_TEMP}/retail-commerce-production-schema-baseline"
          echo "REPORT_PATH=${report_dir}/retail-commerce-production-schema-baseline.json" >> "${GITHUB_ENV}"
          mkdir -p "${report_dir}"

      - name: Verify trigger scope and immutable read-only binding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${BASE_SHA}"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "${BASE_SHA}"

          mapfile -t changed_files < <(gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename')
          test "${#changed_files[@]}" -eq 1
          test "${changed_files[0]}" = "${TRIGGER_PATH}"

          trigger_json="${RUNNER_TEMP}/retail-commerce-schema-trigger.json"
          gh api "/repos/${GITHUB_REPOSITORY}/contents/${TRIGGER_PATH}?ref=${HEAD_SHA}" --jq '.content' \
            | tr -d '\n' | base64 --decode > "${trigger_json}"

          jq -e '
            .contract == "mad4b.retail-commerce-production-schema-baseline-trigger.v1" and
            .expected_main_sha == $base and
            .expected_trigger_branch == $head_ref and
            .confirmation == $confirmation and
            (.trigger_nonce | type == "string" and length >= 16) and
            .select_only == true and
            .row_data_read == false and
            .freeform_sql_accepted == false and
            .migration_dry_run == false and
            .migration_apply == false and
            .database_mutation == false and
            .provider_call == false and
            .credential_values_returned == false and
            .external_send == false and
            .secrets_included == false
          ' --arg base "${BASE_SHA}" --arg head_ref "${HEAD_REF}" --arg confirmation "${REQUIRED_CONFIRMATION}" "${trigger_json}" >/dev/null

          echo "BASELINE_SOURCE_SHA=${BASE_SHA}" >> "${GITHUB_ENV}"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install connector dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Prove collector SELECT-only contract
        working-directory: http-generic-api
        run: node test-retail-commerce-production-schema-baseline.mjs

      - name: Verify Production database secret bindings exist
        shell: bash
        run: |
          set -euo pipefail
          for key in DB_HOST DB_NAME DB_USER DB_PASSWORD; do
            test -n "${!key:-}"
          done

      - name: Collect authoritative Production schema and migration-ledger baseline
        id: collect
        continue-on-error: true
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          node scripts/retail-commerce-production-schema-baseline.mjs --report="${REPORT_PATH}"
          jq --arg sha "${BASELINE_SOURCE_SHA}" '.source_repository_sha = $sha' "${REPORT_PATH}" > "${REPORT_PATH}.tmp"
          mv "${REPORT_PATH}.tmp" "${REPORT_PATH}"

      - name: Publish bounded evidence summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s "${REPORT_PATH}" ]]; then
            jq '{contract,generated_at,source_repository_sha,authoritative_database_connection_succeeded,baseline_collected,parity_status,gap_count:(.gaps|length? // 0),safety}' "${REPORT_PATH}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo '{"baseline_collected":false,"reason":"report_missing","secrets_included":false}' >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload Production schema baseline Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retail-commerce-production-schema-baseline-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.base.sha }}
          path: ${{ runner.temp }}/retail-commerce-production-schema-baseline
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed when collection did not succeed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "${REPORT_PATH}"
          jq -e --arg sha "${BASELINE_SOURCE_SHA}" '.source_repository_sha == $sha and .authoritative_database_connection_succeeded == true and .baseline_collected == true and .safety.select_only == true and .safety.row_data_read == false and .safety.migration_apply == false and .safety.database_mutation == false and .safety.secrets_included == false' "${REPORT_PATH}" >/dev/null
          test "${{ steps.collect.outcome }}" = "success"
