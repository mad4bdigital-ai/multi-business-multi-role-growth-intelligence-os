name: T019 Evidence Closeout

on:
  push:
    branches:
      - gpt/011-ueacp-t019-evidence-closeout-20260730
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: t019-evidence-closeout
  cancel-in-progress: false

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout T019 evidence branch
        uses: actions/checkout@v5
        with:
          ref: gpt/011-ueacp-t019-evidence-closeout-20260730
          fetch-depth: 0
          persist-credentials: true

      - name: Record exact T019 evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          root = Path('specs/011-unified-effective-authority-control-plane')

          tasks_path = root / 'tasks.md'
          tasks = tasks_path.read_text(encoding='utf-8')
          old_task = '- [ ] T019 Run shadow-only parity with no execution effect.'
          new_task = '- [x] T019 Run shadow-only parity with no execution effect.'
          if tasks.count(old_task) != 1:
              raise SystemExit(f't019_task_anchor_count:{tasks.count(old_task)}')
          tasks_path.write_text(tasks.replace(old_task, new_task, 1), encoding='utf-8')

          completion_path = root / 'completion.json'
          completion = json.loads(completion_path.read_text(encoding='utf-8'))
          completion['last_updated_at'] = '2026-07-30T21:24:00Z'
          delivery = completion['delivery']
          implementation_prs = delivery['implementation_prs']
          if not any(item.get('number') == 3863 for item in implementation_prs):
              implementation_prs.append({
                  'number': 3863,
                  'status': 'merged',
                  'role': 't019_shadow_authority_parity_comparator',
                  'head_sha': '73b7bd5f143010b02c4555b324f8baec7df17268',
                  'merge_sha': '16c5065efeaa6db0b881f535339cff0c5744d5f0',
                  'merged_at': '2026-07-30T21:21:55Z',
              })

          evidence = completion['evidence']
          implementation = evidence['implementation']
          merged_slices = implementation['merged_slices']
          if 'T019_shadow_authority_parity_comparator' not in merged_slices:
              merged_slices.append('T019_shadow_authority_parity_comparator')

          implementation_ci = evidence['implementation_ci']
          if not any(item.get('pr') == 3863 for item in implementation_ci):
              implementation_ci.append({
                  'status': 'pass',
                  'pr': 3863,
                  'head_sha': '73b7bd5f143010b02c4555b324f8baec7df17268',
                  'required_ci_run': 30582655383,
                  'required_checks': [
                      'Syntax Check',
                      'Architecture Drift Detection',
                      'Execution Resolver Gate',
                      'Unit & Integration Tests',
                  ],
                  'additional_checks': [
                      'Automation Overlap Guard',
                      'Context Kernel Hardcoding Report',
                      'Docs Agent',
                      'Frontend surface dispatch',
                      'HTTP Generic API Fanout Relocation',
                      'Platform Completion Cleanup Readback',
                      'Platform Remaining Scope Scorecard',
                  ],
              })

          security = evidence['security_review']
          security['status'] = 'bounded_t010_t019_review_passed_remaining_feature_review_open'
          reviewed_prs = security.setdefault('reviewed_prs', [])
          if 3863 not in reviewed_prs:
              reviewed_prs.append(3863)
          security['latest_review_id'] = 4823218002

          evidence['migrations']['status'] = 'not_executed_by_recovery_or_t010_t019_slices'
          production = evidence['production_verification']
          production.pop('not_required_for_shadow_only_t010_t016_slices', None)
          production['not_required_for_shadow_only_t010_t019_slices'] = True

          audit = evidence['post_merge_audit']
          audit['status'] = 'complete_for_recovery_and_t010_t019_slices'
          audit['t019_main_readback_sha'] = '16c5065efeaa6db0b881f535339cff0c5744d5f0'
          audit['t019_shadow_authority_parity_comparator_present'] = True
          audit['t019_exact_identity_dimensions_compared'] = True
          audit['t019_directional_overgrant_undergrant_classification'] = True
          audit['t019_explicit_data_quality_blocks_parity'] = True
          audit['t019_invalid_optional_refs_fail_closed'] = True
          audit['t019_output_remains_shadow_only'] = True
          audit['t019_required_ci_run'] = 30582655383
          audit['runtime_enforcement_enabled'] = False

          evidence['release_readiness']['status'] = 'recovery_chain_and_t010_t019_delivery_closed_remaining_feature_delivery_in_progress'
          safety = evidence['safety_readback']
          safety.pop('t010_t016_runtime_enforcement_enabled', None)
          safety['t010_t019_runtime_enforcement_enabled'] = False

          completion_path.write_text(json.dumps(completion, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          manifest_path = root / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          implementation_delivery = manifest['implementation_delivery']
          merged_prs = implementation_delivery['merged_prs']
          if not any(item.get('number') == 3863 for item in merged_prs):
              merged_prs.append({
                  'number': 3863,
                  'role': 't019_shadow_authority_parity_comparator',
                  'head_sha': '73b7bd5f143010b02c4555b324f8baec7df17268',
                  'merge_sha': '16c5065efeaa6db0b881f535339cff0c5744d5f0',
              })
          completed_tasks = implementation_delivery['completed_tasks']
          if 'T019' not in completed_tasks:
              completed_tasks.append('T019')
          invariants = manifest['non_negotiable_invariants']
          for invariant in [
              'shadow_parity_never_changes_runtime_authority',
              'security_relevant_shadow_overgrant_blocks_rollout',
              'invalid_shadow_metadata_degrades_to_data_quality_evidence',
          ]:
              if invariant not in invariants:
                  invariants.append(invariant)
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          readme_path = root / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          t016_anchor = '''  - post-merge Custom GPT Contract Guard, Frontend dispatch, and HTTP Generic API Fanout Relocation succeeded
- Superseded implementation recovery: PR `#3351`'''
          t019_block = '''  - post-merge Custom GPT Contract Guard, Frontend dispatch, and HTTP Generic API Fanout Relocation succeeded
- Merged T019 slice: PR `#3863`
  - bounded, in-memory shadow authority parity comparator
  - compares exact resource, capability, connection, action, decision, reason-code, and readiness evidence
  - classifies directional legacy/effective over-grants and under-grants; security-relevant over-grants block rollout evidence
  - explicit data-quality issues and invalid optional manifest/revision references fail closed as typed comparison evidence
  - reviewed head `73b7bd5f143010b02c4555b324f8baec7df17268`
  - merge SHA `16c5065efeaa6db0b881f535339cff0c5744d5f0`
  - required CI run `30582655383`: 4/4 success
  - supporting checks: 7/7 success
  - no runtime authority change, execution, persistence, provider call, credential read, write, deployment, or Production promotion
- Superseded implementation recovery: PR `#3351`'''
          if readme.count(t016_anchor) != 1:
              raise SystemExit(f't019_readme_insert_anchor_count:{readme.count(t016_anchor)}')
          readme = readme.replace(t016_anchor, t019_block, 1)
          readme = readme.replace(
              '- Runtime enforcement or PEP cutover from T010–T016: none',
              '- Runtime enforcement or PEP cutover from T010–T019: none',
              1,
          )
          readme = readme.replace(
              'The stale recovery chain and bounded T010–T016 delivery chain are closed.',
              'The stale recovery chain and bounded T010–T019 delivery chain are closed.',
              1,
          )
          evidence_anchor = '- T016: PR `#3811`, reviewed head `71a84a874740d9b90ee5f0e92017b0b758245783`, merge SHA `53731f12575866e59e4645abff52f8c9446b1d8a`.'
          evidence_replacement = evidence_anchor + '\n- T019: PR `#3863`, reviewed head `73b7bd5f143010b02c4555b324f8baec7df17268`, merge SHA `16c5065efeaa6db0b881f535339cff0c5744d5f0`.'
          if readme.count(evidence_anchor) != 1:
              raise SystemExit(f't019_readme_evidence_anchor_count:{readme.count(evidence_anchor)}')
          readme = readme.replace(evidence_anchor, evidence_replacement, 1)
          readme = readme.replace(
              'T014 and T016 remain non-authoritative even when their evidence resolves to `allow`:',
              'T014, T016, and T019 remain non-authoritative shadow outputs:',
              1,
          )
          readme_path.write_text(readme, encoding='utf-8')
          PY

      - name: Validate bounded evidence update
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool specs/011-unified-effective-authority-control-plane/completion.json >/dev/null
          python3 -m json.tool specs/011-unified-effective-authority-control-plane/manifest.json >/dev/null
          grep -Fq -- '- [x] T019 Run shadow-only parity with no execution effect.' specs/011-unified-effective-authority-control-plane/tasks.md
          grep -Fq -- '- [ ] T021 Add revisions/version support where absent.' specs/011-unified-effective-authority-control-plane/tasks.md
          grep -Fq -- 'The overall Spec remains `in_progress`' specs/011-unified-effective-authority-control-plane/README.md

      - name: Commit four-file closeout and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/t019-evidence-closeout.yml
          git add \
            specs/011-unified-effective-authority-control-plane/README.md \
            specs/011-unified-effective-authority-control-plane/completion.json \
            specs/011-unified-effective-authority-control-plane/manifest.json \
            specs/011-unified-effective-authority-control-plane/tasks.md
          python3 <<'PY'
          import subprocess
          expected = {
              '.github/workflows/t019-evidence-closeout.yml',
              'specs/011-unified-effective-authority-control-plane/README.md',
              'specs/011-unified-effective-authority-control-plane/completion.json',
              'specs/011-unified-effective-authority-control-plane/manifest.json',
              'specs/011-unified-effective-authority-control-plane/tasks.md',
          }
          changed = set(filter(None, subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True
          ).splitlines()))
          if changed != expected:
              raise SystemExit(f'bounded_write_set_mismatch:expected={sorted(expected)}:actual={sorted(changed)}')
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(spec-011): record merged T019 shadow parity slice'
          git push origin HEAD:gpt/011-ueacp-t019-evidence-closeout-20260730
