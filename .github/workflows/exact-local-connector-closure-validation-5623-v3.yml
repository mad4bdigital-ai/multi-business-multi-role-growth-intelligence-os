name: Exact Local Connector Closure Validation 5623 v3

on:
  pull_request:
    branches:
      - gpt/validate-local-connector-closure-ubuntu2404-base-5623-0b098c-v3
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: exact-local-connector-closure-5623-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate:
    name: Exact full-suite read-only validation
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      EXPECTED_MAIN_SHA: 0b098c77a155fe9c2109ae3e4315519d7f8894d2
      EXPECTED_HEAD_SHA: f3409d584ea8f59e3571eabc266b872bba60b805
      EXPECTED_HEAD_REF: gpt/ci/retire-local-connector-closure-0b098c-cleanroom-20260803

    steps:
      - name: Initialize bounded evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/local-connector-closure-5623-$GITHUB_RUN_ID"
          mkdir -p "$evidence_dir/reference-integrity" "$evidence_dir/repository-tool-lifecycle" "$evidence_dir/test-suite-reports"
          echo "EVIDENCE_DIR=$evidence_dir" >> "$GITHUB_ENV"
          printf '{"candidate_pr":5623,"candidate_sha":"%s","main_sha":"%s","runner":"ubuntu-24.04","status":"initialized","secrets_included":false}\n' \
            "$EXPECTED_HEAD_SHA" "$EXPECTED_MAIN_SHA" > "$evidence_dir/identity-start.json"

      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Verify immutable identity and exact nine-file scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          test "$EVENT_HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$EVENT_HEAD_REF" = "$EXPECTED_HEAD_REF"
          test "$EVENT_HEAD_SHA" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-list --count "${EXPECTED_MAIN_SHA}..${EXPECTED_HEAD_SHA}")" = "1"

          git diff --name-only "$EXPECTED_MAIN_SHA" "$EXPECTED_HEAD_SHA" | sort > "$EVIDENCE_DIR/actual-files.txt"
          cat <<'EOF_FILES' | sed 's/^          //' | sort > "$EVIDENCE_DIR/expected-files.txt"
          .changes/e2e/local-connector-production-closure-automation-retirement.json
          .github/local-connector-closure/trigger-3945-792ff63a.txt
          .github/scripts/governed-local-connector-production-closure.mjs
          .github/workflows/automation-overlap-guard.yml
          .github/workflows/governed-local-connector-production-closure-pr-target.yml
          .github/workflows/governed-local-connector-production-closure-push.yml
          .github/workflows/governed-local-connector-production-closure.yml
          .github/workflows/local-connector-closure-v8-trigger.txt
          http-generic-api/scripts/local-connector-closure-automation-retirement-self-test.mjs
          EOF_FILES
          diff -u "$EVIDENCE_DIR/expected-files.txt" "$EVIDENCE_DIR/actual-files.txt"
          test "$(wc -l < "$EVIDENCE_DIR/actual-files.txt" | tr -d ' ')" = "9"
          git diff --name-status "$EXPECTED_MAIN_SHA" "$EXPECTED_HEAD_SHA" > "$EVIDENCE_DIR/name-status.tsv"
          git diff --check "$EXPECTED_MAIN_SHA" "$EXPECTED_HEAD_SHA"
          printf '{"ok":true,"commit_count":1,"changed_files":9,"network_fetch_used":false,"secrets_included":false}\n' > "$EVIDENCE_DIR/preflight.json"

      - name: Run syntax and canonical governance
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/schema-docs-change-guard.mjs
          node http-generic-api/scripts/migration-placement-guard.mjs
          (cd http-generic-api && node scripts/user-jwt-auth-governance.mjs)
          (cd http-generic-api && node scripts/interruption-readiness.mjs --ci --skip-dependencies --skip-worktree)
          node validate-canonical-sources.mjs
          node build-canonicals.mjs --check
          node --check find-canonical-domain.mjs
          node http-generic-api/scripts/spec-kit-completion-gate.mjs --ci --changed
          node validate-memory-schema.mjs

      - name: Run Resource API coverage and regressions
        working-directory: http-generic-api
        env:
          GITHUB_BASE_REF: main
        run: |
          set -euo pipefail
          node scripts/resource-api-coverage-audit.mjs --ci --changed
          node test-resource-api-architecture.mjs
          node test-resource-api-service.mjs

      - name: Prove Local Connector closure retirement
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            .github/local-connector-closure/trigger-3945-792ff63a.txt \
            .github/scripts/governed-local-connector-production-closure.mjs \
            .github/workflows/governed-local-connector-production-closure-pr-target.yml \
            .github/workflows/governed-local-connector-production-closure-push.yml \
            .github/workflows/governed-local-connector-production-closure.yml \
            .github/workflows/local-connector-closure-v8-trigger.txt
          do
            test ! -e "$path"
          done
          workflow=.github/workflows/automation-overlap-guard.yml
          grep -F 'contents: read' "$workflow"
          ! grep -E 'issues:[[:space:]]*write|pull-requests:[[:space:]]*write|contents:[[:space:]]*write|BACKEND_API_KEY|RUN_LOCAL_CONNECTOR_PRODUCTION_CLOSURE|governed-local-connector-production-closure' "$workflow"
          node --check http-generic-api/scripts/local-connector-closure-automation-retirement-self-test.mjs
          (cd http-generic-api && node scripts/local-connector-closure-automation-retirement-self-test.mjs)

      - name: Run E2E reference integrity
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/test-e2e-contract-reference-integrity.mjs
          node http-generic-api/test-e2e-contract-git-index-integrity.mjs
          node http-generic-api/scripts/e2e-contract-reference-integrity.mjs \
            --base "$EXPECTED_MAIN_SHA" \
            --head "$EXPECTED_HEAD_SHA" \
            --report-file "$EVIDENCE_DIR/reference-integrity/report.json"
          node http-generic-api/scripts/e2e-contract-git-index-integrity.mjs \
            --report-file "$EVIDENCE_DIR/reference-integrity/report.json"

      - name: Run repository lifecycle governance
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs
          BASE_SHA="$EXPECTED_MAIN_SHA" CANDIDATE_SHA="$EXPECTED_HEAD_SHA" \
            node http-generic-api/scripts/maintenance-tools/repository-tool-lifecycle-guard.mjs \
              --changed-files "$EVIDENCE_DIR/name-status.tsv" \
              --policy .github/repository-maintenance-tool-governance.json \
              --output-dir "$EVIDENCE_DIR/repository-tool-lifecycle"

      - name: Run HTTP Generic API unit integration and architecture
        working-directory: http-generic-api
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
          TEST_SUITE_REPORT_DIR: ${{ runner.temp }}/local-connector-closure-5623-${{ github.run_id }}/test-suite-reports
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run validate

      - name: Run execution resolver typecheck and tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test -- --runInBand

      - name: Run exact E2E phase evaluation and journeys
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/e2e-phase-governance.mjs check \
            --base "$EXPECTED_MAIN_SHA" \
            --head "$EXPECTED_HEAD_SHA" \
            --report-file "$EVIDENCE_DIR/e2e-phase-evaluation.json"
          node http-generic-api/scripts/e2e-phase-governance.mjs run \
            --base "$EXPECTED_MAIN_SHA" \
            --head "$EXPECTED_HEAD_SHA" \
            --report-file "$EVIDENCE_DIR/e2e-phase-evaluation-run.json" \
            --execution-report-file "$EVIDENCE_DIR/e2e-phase-execution.json"

      - name: Write successful bounded result
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg candidate_sha "$EXPECTED_HEAD_SHA" \
            --arg main_sha "$EXPECTED_MAIN_SHA" \
            '{ok:true,candidate_pr:5623,candidate_sha:$candidate_sha,main_sha:$main_sha,runner:"ubuntu-24.04",commit_count:1,changed_files:9,outcomes:{preflight:"success",syntax:"success",resource_api:"success",retirement:"success",reference_integrity:"success",lifecycle:"success",api_tests:"success",root_tests:"success",e2e:"success"},provider_mutation:false,production_mutation:false,credential_access:false,database_mutation:false,secrets_included:false}' \
            > "$EVIDENCE_DIR/result.json"
          cat "$EVIDENCE_DIR/result.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-local-connector-closure-5623-v3-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 14
