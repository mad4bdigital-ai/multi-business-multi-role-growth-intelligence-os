name: Exact T016 Readiness Ubuntu 24.04 Validation 5715 Draft v3

on:
  pull_request:
    branches:
      - gpt/validate-t016-readiness-ubuntu2404-base-5715-draft-v3
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: exact-t016-readiness-ubuntu2404-5715-draft-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate:
    name: Exact candidate marker-backed validation
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Initialize bounded evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/t016-readiness-5715-draft-v3-$GITHUB_RUN_ID"
          mkdir -p \
            "$evidence_dir/gates" \
            "$evidence_dir/reference-integrity" \
            "$evidence_dir/repository-tool-lifecycle" \
            "$evidence_dir/test-suite-reports"
          echo "EVIDENCE_DIR=$evidence_dir" >> "$GITHUB_ENV"
          echo "EXPECTED_HEAD_SHA=2d9183ce9bc01a7f6d14062d3b7d0a6f6a9f3f11" >> "$GITHUB_ENV"
          echo "EXPECTED_MAIN_SHA=14433d15184bd7e7658281a356a7540e3d2d6dfe" >> "$GITHUB_ENV"
          printf '{"candidate_pr":5715,"candidate_sha":"2d9183ce9bc01a7f6d14062d3b7d0a6f6a9f3f11","main_sha":"14433d15184bd7e7658281a356a7540e3d2d6dfe","runner":"ubuntu-24.04","status":"initialized","runtime_contacted":false,"repository_mutation_performed":false,"secrets_included":false}\n' \
            > "$evidence_dir/identity-start.json"

      - name: Run exact marker-backed validation gates
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_HEAD_REF: gpt/ops/t016-readiness-current-main-clean-20260803
          GITHUB_BASE_REF: main
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
          TEST_SUITE_REPORT_DIR: ${{ runner.temp }}/t016-readiness-5715-draft-v3-${{ github.run_id }}/test-suite-reports
        run: |
          set -euo pipefail
          pass_gate() {
            local gate="$1"
            touch "$EVIDENCE_DIR/gates/${gate}.pass"
            printf '%s\n' "$gate" | tee -a "$EVIDENCE_DIR/passed-gates.txt"
          }

          test "$HEAD_REPOSITORY" = "$REPOSITORY"
          test "$HEAD_REF" = "$EXPECTED_HEAD_REF"
          test "$HEAD_SHA" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD^^)" = "$EXPECTED_MAIN_SHA"
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" "$EXPECTED_HEAD_SHA"
          test "$(git rev-list --count "${EXPECTED_MAIN_SHA}..${EXPECTED_HEAD_SHA}")" = "2"
          git diff --name-only "$EXPECTED_MAIN_SHA" "$EXPECTED_HEAD_SHA" | sort > "$EVIDENCE_DIR/actual-files.txt"
          cat <<'EOF_FILES' | sed 's/^          //' | sort > "$EVIDENCE_DIR/expected-files.txt"
          .changes/e2e/sprint69-1043-t016-readiness-path-repair.json
          .github/ops/sprint69-1043-runtime-readiness-backfill.mjs
          .github/ops/sprint69-1043-runtime-readiness.mjs
          .github/workflows/sprint69-1043-runtime-readiness-backfill.yml
          http-generic-api/routes/adminCliRoutes.js
          http-generic-api/test-capability-envelope-create-alias-path.mjs
          http-generic-api/test-sprint69-1043-runtime-readiness-contract.mjs
          EOF_FILES
          diff -u "$EVIDENCE_DIR/expected-files.txt" "$EVIDENCE_DIR/actual-files.txt"
          test "$(wc -l < "$EVIDENCE_DIR/actual-files.txt" | tr -d ' ')" = "7"
          git diff --name-status "$EXPECTED_MAIN_SHA" "$EXPECTED_HEAD_SHA" > "$EVIDENCE_DIR/name-status.tsv"
          printf '{"ok":true,"candidate_pr":5715,"candidate_sha":"%s","main_sha":"%s","commit_count":2,"changed_files":7,"runner":"ubuntu-24.04","runtime_contacted":false,"repository_mutation_performed":false,"secrets_included":false}\n' \
            "$EXPECTED_HEAD_SHA" "$EXPECTED_MAIN_SHA" > "$EVIDENCE_DIR/preflight.json"
          pass_gate preflight

          node --check .github/ops/sprint69-1043-runtime-readiness.mjs
          node --check .github/ops/sprint69-1043-runtime-readiness-backfill.mjs
          node --check http-generic-api/routes/adminCliRoutes.js
          (cd http-generic-api && node test-capability-envelope-create-alias-path.mjs)
          (cd http-generic-api && node test-sprint69-1043-runtime-readiness-contract.mjs)
          pass_gate focused

          node http-generic-api/scripts/schema-docs-change-guard.mjs
          node http-generic-api/scripts/migration-placement-guard.mjs
          (cd http-generic-api && node scripts/user-jwt-auth-governance.mjs)
          (cd http-generic-api && node scripts/interruption-readiness.mjs --ci --skip-dependencies --skip-worktree)
          node validate-canonical-sources.mjs
          node build-canonicals.mjs --check
          node --check find-canonical-domain.mjs
          node http-generic-api/scripts/spec-kit-completion-gate.mjs --ci --changed
          node validate-memory-schema.mjs
          git diff --check
          pass_gate syntax

          (cd http-generic-api && node scripts/resource-api-coverage-audit.mjs --ci --changed)
          (cd http-generic-api && node test-resource-api-architecture.mjs)
          (cd http-generic-api && node test-resource-api-service.mjs)
          pass_gate resource_api

          node http-generic-api/test-e2e-contract-reference-integrity.mjs
          node http-generic-api/test-e2e-contract-git-index-integrity.mjs
          node http-generic-api/scripts/e2e-contract-reference-integrity.mjs \
            --base "$EXPECTED_MAIN_SHA" \
            --head "$EXPECTED_HEAD_SHA" \
            --report-file "$EVIDENCE_DIR/reference-integrity/report.json"
          node http-generic-api/scripts/e2e-contract-git-index-integrity.mjs \
            --report-file "$EVIDENCE_DIR/reference-integrity/report.json"
          pass_gate reference_integrity

          node http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs
          BASE_SHA="$EXPECTED_MAIN_SHA" CANDIDATE_SHA="$EXPECTED_HEAD_SHA" \
            node http-generic-api/scripts/maintenance-tools/repository-tool-lifecycle-guard.mjs \
              --changed-files "$EVIDENCE_DIR/name-status.tsv" \
              --policy .github/repository-maintenance-tool-governance.json \
              --output-dir "$EVIDENCE_DIR/repository-tool-lifecycle"
          pass_gate lifecycle

          (cd http-generic-api && npm ci)
          (cd http-generic-api && npm test)
          (cd http-generic-api && npm run validate)
          pass_gate api_tests

          npm ci
          npm run typecheck
          npm test -- --runInBand
          pass_gate root_tests

          node http-generic-api/scripts/e2e-phase-governance.mjs check \
            --base "$EXPECTED_MAIN_SHA" \
            --head "$EXPECTED_HEAD_SHA" \
            --report-file "$EVIDENCE_DIR/e2e-phase-evaluation.json"
          node http-generic-api/scripts/e2e-phase-governance.mjs run \
            --base "$EXPECTED_MAIN_SHA" \
            --head "$EXPECTED_HEAD_SHA" \
            --report-file "$EVIDENCE_DIR/e2e-phase-evaluation-run.json" \
            --execution-report-file "$EVIDENCE_DIR/e2e-phase-execution.json"
          pass_gate e2e

      - name: Write marker-backed validation result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          gates='preflight focused syntax resource_api reference_integrity lifecycle api_tests root_tests e2e'
          status=pass
          for gate in $gates; do
            if [ ! -f "$EVIDENCE_DIR/gates/${gate}.pass" ]; then
              status=fail
            fi
          done
          jq -n \
            --arg status "$status" \
            --arg candidate_sha "$EXPECTED_HEAD_SHA" \
            --arg main_sha "$EXPECTED_MAIN_SHA" \
            --arg passed_gates "$(tr '\n' ',' < "$EVIDENCE_DIR/passed-gates.txt" 2>/dev/null || true)" \
            '{candidate_pr:5715,candidate_sha:$candidate_sha,main_sha:$main_sha,runner:"ubuntu-24.04",status:$status,passed_gates:($passed_gates|split(",")|map(select(length>0))),expected_gate_count:9,runtime_contacted:false,capability_envelope_created:false,apply_authorized:false,migration_apply_executed:false,activation_registry_sync_executed:false,provider_mutation:false,production_mutation:false,credential_access:false,database_mutation:false,repository_mutation_performed:false,secrets_included:false}' \
            > "$EVIDENCE_DIR/result.json"
          cat "$EVIDENCE_DIR/result.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-t016-readiness-5715-draft-ubuntu2404-v3-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce marker-backed validation result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for gate in \
            preflight focused syntax resource_api reference_integrity \
            lifecycle api_tests root_tests e2e
          do
            test -f "$EVIDENCE_DIR/gates/${gate}.pass"
          done
          test "$(find "$EVIDENCE_DIR/gates" -maxdepth 1 -type f -name '*.pass' | wc -l | tr -d ' ')" = "9"
          test "$(jq -r '.status' "$EVIDENCE_DIR/result.json")" = "pass"
          test "$(jq -r '.candidate_sha' "$EVIDENCE_DIR/result.json")" = "$EXPECTED_HEAD_SHA"
          test "$(jq -r '.repository_mutation_performed' "$EVIDENCE_DIR/result.json")" = "false"
          test "$(jq -r '.secrets_included' "$EVIDENCE_DIR/result.json")" = "false"
