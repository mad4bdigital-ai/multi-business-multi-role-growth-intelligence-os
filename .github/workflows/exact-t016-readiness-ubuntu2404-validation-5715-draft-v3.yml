name: T016 Final Main Sync and No-op Frontend Parity 5715

on:
  pull_request:
    branches:
      - gpt/validate-t016-readiness-ubuntu2404-base-5715-draft-v3
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: t016-final-main-sync-noop-parity-5715
  cancel-in-progress: false

jobs:
  sync:
    name: Synchronize exact main and prove generated no-op
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/ops/t016-readiness-current-main-clean-20260803' &&
      github.event.pull_request.head.sha == 'bb979c1ddae031b145cdc757f64808495a6beb25'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    env:
      TARGET_BRANCH: gpt/ops/t016-readiness-current-main-clean-20260803
      EXPECTED_HEAD: bb979c1ddae031b145cdc757f64808495a6beb25
      EXPECTED_MAIN: 4a049185f8eff3232bf1a6ed0a176525e72d980d
      GENERATED_PATH: http-generic-api/frontend-surface-dispatch.generated.json
      EVIDENCE_DIR: /tmp/t016-final-main-sync-${{ github.run_id }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify immutable refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${EXPECTED_HEAD}"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${EXPECTED_MAIN}"
          test -z "$(git status --porcelain)"
          mkdir -p "${EVIDENCE_DIR}"

      - name: Merge exact main normally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'mad4bdigital-ai'
          git config user.email '271942579+mad4bdigital-ai@users.noreply.github.com'
          git merge --no-ff --no-edit "${EXPECTED_MAIN}"
          final_head="$(git rev-parse HEAD)"
          echo "FINAL_HEAD=${final_head}" >> "$GITHUB_ENV"
          git merge-base --is-ancestor "${EXPECTED_MAIN}" "${final_head}"
          printf '%s\n' "${final_head}" > "${EVIDENCE_DIR}/final-head.txt"

      - name: Prove deterministic generated no-op
        shell: bash
        run: |
          set -euo pipefail
          before="$(sha256sum "${GENERATED_PATH}" | awk '{print $1}')"
          node http-generic-api/scripts/generate-frontend-surface-dispatch.mjs
          after="$(sha256sum "${GENERATED_PATH}" | awk '{print $1}')"
          test "${before}" = "${after}"
          test -z "$(git diff --name-only)"
          node http-generic-api/scripts/generate-frontend-surface-dispatch.mjs
          test "$(sha256sum "${GENERATED_PATH}" | awk '{print $1}')" = "${after}"
          test -z "$(git diff --name-only)"
          printf '%s\n' "${after}" > "${EVIDENCE_DIR}/generated-sha256.txt"

      - name: Run focused Frontend and T016 tests
        shell: bash
        run: |
          set -euo pipefail
          node --check http-generic-api/routes/adminCliRoutes.js
          node --check .github/ops/sprint69-1043-runtime-readiness.mjs
          node --check .github/ops/sprint69-1043-runtime-readiness-backfill.mjs
          (
            cd http-generic-api
            node test-capability-envelope-create-alias-path.mjs
            node test-sprint69-1043-runtime-readiness-contract.mjs
            node test-frontend-dispatch-workflow-baseline.mjs
            node test-frontend-generator-openapi-ownership.mjs
            node test-frontend-operation-governance-generator.mjs
            node test-frontend-surface-dispatch-generator.mjs
          )
          node http-generic-api/test-e2e-contract-reference-integrity.mjs
          node http-generic-api/test-e2e-contract-git-index-integrity.mjs
          git diff --check "${EXPECTED_MAIN}...${FINAL_HEAD}"

      - name: Validate exact seven-file scope and E2E
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${EXPECTED_MAIN}" "${FINAL_HEAD}" | sort > "${EVIDENCE_DIR}/actual-scope.txt"
          cat <<'EOF' | sort > "${EVIDENCE_DIR}/expected-scope.txt"
          .changes/e2e/sprint69-1043-t016-readiness-path-repair.json
          .github/ops/sprint69-1043-runtime-readiness-backfill.mjs
          .github/ops/sprint69-1043-runtime-readiness.mjs
          .github/workflows/sprint69-1043-runtime-readiness-backfill.yml
          http-generic-api/routes/adminCliRoutes.js
          http-generic-api/test-capability-envelope-create-alias-path.mjs
          http-generic-api/test-sprint69-1043-runtime-readiness-contract.mjs
          EOF
          diff -u "${EVIDENCE_DIR}/expected-scope.txt" "${EVIDENCE_DIR}/actual-scope.txt"
          test "$(wc -l < "${EVIDENCE_DIR}/actual-scope.txt" | tr -d ' ')" = '7'
          node http-generic-api/scripts/e2e-contract-reference-integrity.mjs \
            --base "${EXPECTED_MAIN}" --head "${FINAL_HEAD}" \
            --report-file "${EVIDENCE_DIR}/reference-integrity.json"
          node http-generic-api/scripts/e2e-contract-git-index-integrity.mjs \
            --report-file "${EVIDENCE_DIR}/reference-integrity.json"
          node http-generic-api/scripts/e2e-phase-governance.mjs check \
            --base "${EXPECTED_MAIN}" --head "${FINAL_HEAD}" \
            --report-file "${EVIDENCE_DIR}/e2e-evaluation.json"
          node http-generic-api/scripts/e2e-phase-governance.mjs run \
            --base "${EXPECTED_MAIN}" --head "${FINAL_HEAD}" \
            --report-file "${EVIDENCE_DIR}/e2e-evaluation-run.json" \
            --execution-report-file "${EVIDENCE_DIR}/e2e-execution.json"

      - name: Revalidate refs and push normally
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${EXPECTED_HEAD}"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${EXPECTED_MAIN}"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Write bounded evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          jq -n \
            --arg expected_head "${EXPECTED_HEAD}" \
            --arg main_sha "${EXPECTED_MAIN}" \
            --arg final_head "${FINAL_HEAD:-}" \
            '{contract:"t016_final_main_sync_noop_parity.v1",pr:5715,expected_head:$expected_head,main_sha:$main_sha,final_head:($final_head|select(length>0)),generated_changed:false,effective_file_count:7,ordinary_push:true,force_push:false,protected_ref_mutation:false,runtime_contacted:false,capability_envelope_created:false,apply_authorized:false,apply_sent:false,migration_apply_executed:false,activation_registry_sync_executed:false,database_mutation:false,provider_call_executed:false,credential_payload_accessed:false,external_business_write_executed:false,secrets_included:false}' \
            > "${EVIDENCE_DIR}/summary.json"

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t016-final-main-sync-noop-parity-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 14
