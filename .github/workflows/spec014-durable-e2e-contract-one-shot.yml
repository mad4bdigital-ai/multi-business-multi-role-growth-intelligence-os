name: Spec 014 Durable E2E Contract One Shot

on:
  push:
    branches:
      - gpt/014-hostinger/control-plane-durable-v1-20260801

permissions:
  contents: write

concurrency:
  group: spec014-durable-e2e-contract-one-shot
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout durable control-plane branch
        uses: actions/checkout@v5
        with:
          ref: gpt/014-hostinger/control-plane-durable-v1-20260801
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Reconcile durable-control-plane E2E ownership and tests
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'specs/014-governed-hostinger-storage-orchestration/e2e-phases.json';
          const contract = JSON.parse(fs.readFileSync(file, 'utf8'));
          const workstream = contract.parallel_work?.workstreams?.find((item) => item.id === 'durable-control-plane');
          if (!workstream) throw new Error('durable-control-plane workstream not found');

          const requiredScope = [
            'http-generic-api/hostingerStorageControlPlaneRepository.js',
            'http-generic-api/hostingerStorageExecutionAuthorization.js',
            'http-generic-api/hostingerStorageExecutionAuthorizationV2.js',
            'http-generic-api/test-hostinger-storage-control-plane-repository.mjs',
            'http-generic-api/test-hostinger-storage-execution-authorization.mjs'
          ];
          workstream.scope ??= { include: [] };
          workstream.scope.include ??= [];
          for (const item of requiredScope) {
            if (!workstream.scope.include.includes(item)) workstream.scope.include.push(item);
          }
          workstream.scope.include.sort();

          const requiredTests = [
            {
              id: 'hostinger-storage-execution-authorization',
              runner: 'node',
              working_directory: 'http-generic-api',
              path: 'test-hostinger-storage-execution-authorization.mjs',
              args: []
            },
            {
              id: 'hostinger-storage-control-plane-repository',
              runner: 'node',
              working_directory: 'http-generic-api',
              path: 'test-hostinger-storage-control-plane-repository.mjs',
              args: []
            }
          ];
          workstream.required_tests ??= [];
          for (const test of requiredTests) {
            const index = workstream.required_tests.findIndex((item) => item.id === test.id);
            if (index >= 0) workstream.required_tests[index] = test;
            else workstream.required_tests.push(test);
          }
          workstream.required_tests.sort((left, right) => left.id.localeCompare(right.id));

          fs.writeFileSync(file, `${JSON.stringify(contract)}\n`);
          NODE

      - name: Run focused durable-control-plane tests
        working-directory: http-generic-api
        run: |
          set -euo pipefail
          node test-hostinger-storage-execution-authorization.mjs
          node test-hostinger-storage-control-plane-repository.mjs

      - name: Remove one-shot workflow and commit final contract
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/spec014-durable-e2e-contract-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specs/014-governed-hostinger-storage-orchestration/e2e-phases.json .github/workflows/spec014-durable-e2e-contract-one-shot.yml
          git diff --cached --quiet && { echo 'No contract change produced' >&2; exit 2; }
          git commit -m "test(spec-014): bind durable control plane to E2E contract"
          git push origin HEAD:gpt/014-hostinger/control-plane-durable-v1-20260801
