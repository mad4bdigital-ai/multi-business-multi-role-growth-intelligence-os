name: Diagnose Production Reconciliation Candidate V10 Prerequisites

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/build-production-reconciliation-candidate-v10-20260804.yml

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: diagnose-production-reconciliation-candidate-v10-prerequisites
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose exact prerequisite failure
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/build-production-reconciliation-candidate-v10-20260804' &&
      github.event.pull_request.user.id == 271942579
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      BUILDER_PR: ${{ github.event.pull_request.number }}
      REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      REQUEST_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      WORKFLOW_PATH: .github/workflows/build-production-reconciliation-candidate-v10-20260804.yml
      REQUIRED_RUNTIME_FIX_SHA: c7f7be81b811caf3c1112372ab1089fc5ee3714c
      REQUIRED_CLASSIFIER_FIX_SHA: dd929093dd83d2c91ac817ff60d324eca2b71e51
      REQUIRED_WORK_MAP_FIX_SHA: ec8fa387014b9481dd3e7ab0cc4fd2708cafb865
      REQUIRED_DDL_GUARD_FIX_SHA: 773179a2dee3523c8af25262475ac83b92e46f21
      DDL_TEST: http-generic-api/test-hostinger-storage-durable-authorized-injection-schema-ddl.mjs
      DDL_WORKFLOW_TEST: http-generic-api/test-hostinger-storage-durable-authorized-injection-schema-ddl-workflow.mjs
      PARALLEL_PR_GATE: http-generic-api/scripts/e2e-parallel-pr-gate.mjs

    steps:
      - name: Checkout exact one-file request
        uses: actions/checkout@v5
        with:
          ref: ${{ env.REQUEST_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable diagnostic boundary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "${REQUEST_HEAD_REF}" = 'gpt/build-production-reconciliation-candidate-v10-20260804'
          test "$(git rev-parse HEAD)" = "${REQUEST_HEAD_SHA}"
          mapfile -t files < <(gh api --paginate "/repos/${REPOSITORY}/pulls/${BUILDER_PR}/files?per_page=100" --jq '.[].filename')
          test "${#files[@]}" -eq 1
          test "${files[0]}" = "${WORKFLOW_PATH}"

      - name: Pin live protected refs and required ancestry
        id: refs
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/Production:refs/remotes/origin/Production'
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          production_sha="$(git rev-parse refs/remotes/origin/Production)"
          test "${main_sha}" != "${production_sha}"
          for required in \
            "${REQUIRED_RUNTIME_FIX_SHA}" \
            "${REQUIRED_CLASSIFIER_FIX_SHA}" \
            "${REQUIRED_WORK_MAP_FIX_SHA}" \
            "${REQUIRED_DDL_GUARD_FIX_SHA}"; do
            git merge-base --is-ancestor "${required}" "${main_sha}"
          done
          echo "main_sha=${main_sha}" >> "${GITHUB_OUTPUT}"
          echo "production_sha=${production_sha}" >> "${GITHUB_OUTPUT}"

      - name: Execute labeled prerequisite diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          log="${RUNNER_TEMP}/v10-prerequisite-diagnostic.log"
          set +e
          (
            set -Eeuo pipefail
            checkpoint() { printf '\n===== %s =====\n' "$1"; }

            checkpoint 'checkout detached live main'
            git checkout --detach '${{ steps.refs.outputs.main_sha }}'

            checkpoint 'temporary Builder workflow absent from live main'
            test ! -e "${WORKFLOW_PATH}"

            checkpoint 'initial clean worktree'
            initial_status="$(git status --short)"
            printf '%s\n' "${initial_status}"
            test -z "${initial_status}"

            checkpoint 'syntax: canonical Production promotion gate'
            node --check "${PARALLEL_PR_GATE}"

            checkpoint 'syntax: DDL parity test'
            node --check "${DDL_TEST}"

            checkpoint 'syntax: DDL workflow contract test'
            node --check "${DDL_WORKFLOW_TEST}"

            checkpoint 'canonical reconciliation classifier self-test'
            node http-generic-api/scripts/e2e-parallel-pr-flow-self-test.mjs

            checkpoint 'Hostinger DDL parity test'
            node "${DDL_TEST}"

            checkpoint 'Hostinger DDL workflow executable contract test'
            node "${DDL_WORKFLOW_TEST}"

            checkpoint 'Work Map explicit-only registry contract'
            node http-generic-api/scripts/work-map-schema-classification-contract.mjs

            checkpoint 'Work Map current schema classification'
            node http-generic-api/scripts/work-map-schema-classification.mjs

            checkpoint 'generated Work Map currentness'
            node http-generic-api/scripts/platform-work-map-generator.mjs --check

            checkpoint 'final clean worktree'
            final_status="$(git status --short)"
            printf '%s\n' "${final_status}"
            test -z "${final_status}"
          ) >"${log}" 2>&1
          status=$?
          set -e
          cat "${log}"

          if [[ "${status}" -ne 0 ]]; then
            {
              echo '## Builder V10 prerequisite diagnostic failed'
              echo
              echo '- No candidate commit or branch was created.'
              echo '- The final checkpoint shown below identifies the failing command.'
              echo
              echo '```text'
              tail -n 320 "${log}"
              echo '```'
            } > "${RUNNER_TEMP}/failure.md"
            gh pr comment "${BUILDER_PR}" --repo "${REPOSITORY}" --body-file "${RUNNER_TEMP}/failure.md"
            exit "${status}"
          fi

          {
            echo '## Builder V10 prerequisite diagnostic passed'
            echo
            echo '- Every prerequisite command passed on the exact live main checkout.'
            echo '- Initial and final worktrees were clean.'
            echo '- No candidate commit or branch was created by this diagnostic run.'
          } > "${RUNNER_TEMP}/success.md"
          gh pr comment "${BUILDER_PR}" --repo "${REPOSITORY}" --body-file "${RUNNER_TEMP}/success.md"
