name: Build Production Reconciliation Candidate V10 20260804

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/build-production-reconciliation-candidate-v10-20260804.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-production-reconciliation-candidate-v10-20260804
  cancel-in-progress: false

jobs:
  build:
    name: Build exact governed Production reconciliation candidate
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/build-production-reconciliation-candidate-v10-20260804' &&
      github.event.pull_request.user.id == 271942579
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      BUILDER_PR: ${{ github.event.pull_request.number }}
      REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      REQUEST_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      WORKFLOW_PATH: .github/workflows/build-production-reconciliation-candidate-v10-20260804.yml
      REQUIRED_RUNTIME_FIX_SHA: c7f7be81b811caf3c1112372ab1089fc5ee3714c
      REQUIRED_CLASSIFIER_FIX_SHA: dd929093dd83d2c91ac817ff60d324eca2b71e51
      REQUIRED_WORK_MAP_FIX_SHA: ec8fa387014b9481dd3e7ab0cc4fd2708cafb865
      REQUIRED_DDL_GUARD_FIX_SHA: 773179a2dee3523c8af25262475ac83b92e46f21
      DDL_WORKFLOW: .github/workflows/hostinger-storage-durable-authorized-injection-schema-ddl-guard.yml
      DDL_TEST: http-generic-api/test-hostinger-storage-durable-authorized-injection-schema-ddl.mjs
      DDL_WORKFLOW_TEST: http-generic-api/test-hostinger-storage-durable-authorized-injection-schema-ddl-workflow.mjs
      PARALLEL_PR_GATE: http-generic-api/scripts/e2e-parallel-pr-gate.mjs
      PHASE_CONTRACT: specs/014-governed-hostinger-storage-orchestration/e2e-phases.json

    steps:
      - name: Checkout exact one-file request
        uses: actions/checkout@v5
        with:
          ref: ${{ env.REQUEST_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable Builder boundary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "${REQUEST_HEAD_REF}" = 'gpt/build-production-reconciliation-candidate-v10-20260804'
          test "$(git rev-parse HEAD)" = "${REQUEST_HEAD_SHA}"
          mapfile -t files < <(gh api --paginate "/repos/${REPOSITORY}/pulls/${BUILDER_PR}/files?per_page=100" --jq '.[].filename')
          test "${#files[@]}" -eq 1
          test "${files[0]}" = "${WORKFLOW_PATH}"

      - name: Pin live protected refs and required ancestry
        id: refs
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/Production:refs/remotes/origin/Production'
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          production_sha="$(git rev-parse refs/remotes/origin/Production)"
          test "${main_sha}" != "${production_sha}"
          for required in \
            "${REQUIRED_RUNTIME_FIX_SHA}" \
            "${REQUIRED_CLASSIFIER_FIX_SHA}" \
            "${REQUIRED_WORK_MAP_FIX_SHA}" \
            "${REQUIRED_DDL_GUARD_FIX_SHA}"; do
            git merge-base --is-ancestor "${required}" "${main_sha}"
          done
          echo "main_sha=${main_sha}" >> "${GITHUB_OUTPUT}"
          echo "production_sha=${production_sha}" >> "${GITHUB_OUTPUT}"

      - name: Reset to clean live main and run prerequisite regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          git checkout --detach '${{ steps.refs.outputs.main_sha }}'
          test ! -e "${WORKFLOW_PATH}"
          test -z "$(git status --short)"

          node --check "${PARALLEL_PR_GATE}"
          node --check "${DDL_TEST}"
          node --check "${DDL_WORKFLOW_TEST}"
          node http-generic-api/scripts/e2e-parallel-pr-flow-self-test.mjs
          node "${DDL_TEST}"
          node "${DDL_WORKFLOW_TEST}"
          node http-generic-api/scripts/work-map-schema-classification-contract.mjs
          node http-generic-api/scripts/work-map-schema-classification.mjs
          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          test -z "$(git status --short)"

      - name: Create exact reconciliation commit
        id: candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          main_sha='${{ steps.refs.outputs.main_sha }}'
          production_sha='${{ steps.refs.outputs.production_sha }}'
          main_tree="$(git rev-parse "${main_sha}^{tree}")"

          export GIT_AUTHOR_NAME='mad4bdigital-ai'
          export GIT_AUTHOR_EMAIL='271942579+mad4bdigital-ai@users.noreply.github.com'
          export GIT_COMMITTER_NAME='mad4bdigital-ai'
          export GIT_COMMITTER_EMAIL='271942579+mad4bdigital-ai@users.noreply.github.com'

          candidate_sha="$(printf '%s\n' \
            'chore(production): reconcile Production history to exact main tree' \
            '' \
            "Main parent: ${main_sha}" \
            "Production parent: ${production_sha}" \
            'Tree authority: exact current main tree' \
            'No force update, SQL, migration, provider, credential, deployment, or external-send mutation.' \
            | git commit-tree "${main_tree}" -p "${main_sha}" -p "${production_sha}")"
          candidate_ref="release/production-candidate-20260804-${candidate_sha:0:8}-v10"

          test "$(git rev-parse "${candidate_sha}^{tree}")" = "${main_tree}"
          read -r parent_one parent_two extra <<< "$(git show -s --format='%P' "${candidate_sha}")"
          test "${parent_one}" = "${main_sha}"
          test "${parent_two}" = "${production_sha}"
          test -z "${extra:-}"
          test -z "$(git diff --name-only "${main_sha}" "${candidate_sha}")"

          echo "candidate_sha=${candidate_sha}" >> "${GITHUB_OUTPUT}"
          echo "candidate_ref=${candidate_ref}" >> "${GITHUB_OUTPUT}"
          echo "main_tree=${main_tree}" >> "${GITHUB_OUTPUT}"

      - name: Validate canonical Production promotion identity
        shell: bash
        run: |
          set -Eeuo pipefail
          report="${RUNNER_TEMP}/production-candidate-gate.json"
          node "${PARALLEL_PR_GATE}" check \
            --base '${{ steps.refs.outputs.production_sha }}' \
            --head '${{ steps.candidate.outputs.candidate_sha }}' \
            --head-ref '${{ steps.candidate.outputs.candidate_ref }}' \
            --base-ref Production \
            --report-file "${report}"
          jq -e --arg main '${{ steps.refs.outputs.main_sha }}' '
            .ok == true and
            .pr_mode == "standard" and
            .production_promotion == true and
            .production_promotion_identity == "history_preserving_main_reconciliation" and
            .phase_evaluation_base == $main
          ' "${report}"

      - name: Validate exact Hostinger DDL release classification
        shell: bash
        run: |
          set -Eeuo pipefail
          classifier="${RUNNER_TEMP}/ddl-candidate-classifier.mjs"
          output="${RUNNER_TEMP}/ddl-candidate-output.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path
          source = Path(os.environ['DDL_WORKFLOW']).read_text()
          marker = "node --input-type=module <<'NODE'\n"
          start = source.index(marker) + len(marker)
          end = source.index('\n          NODE', start)
          Path(os.environ['RUNNER_TEMP'], 'ddl-candidate-classifier.mjs').write_text(source[start:end])
          PY

          PHASE_CONTRACT="${PHASE_CONTRACT}" \
          PARALLEL_PR_GATE="${PARALLEL_PR_GATE}" \
          BASE_REF=Production \
          BASE_SHA='${{ steps.refs.outputs.production_sha }}' \
          HEAD_REF='${{ steps.candidate.outputs.candidate_ref }}' \
          HEAD_SHA='${{ steps.candidate.outputs.candidate_sha }}' \
          HEAD_REPOSITORY="${REPOSITORY}" \
          REPOSITORY="${REPOSITORY}" \
          RUNNER_TEMP="${RUNNER_TEMP}" \
          GITHUB_OUTPUT="${output}" \
          node "${classifier}"

          grep -Fxq 'candidate_mode=release' "${output}"
          grep -Fxq 'candidate_mode_source=canonical_e2e_parallel_pr_gate' "${output}"
          grep -Fxq 'release_identity=history_preserving_main_reconciliation' "${output}"
          grep -Fxq 'canonical_promotion_validated=true' "${output}"
          grep -Fxq 'promotion_gate_outcome=success' "${output}"
          grep -Fxq 'promotion_phase_evaluation_base=${{ steps.refs.outputs.main_sha }}' "${output}"

      - name: Validate phase execution and current generated governance
        shell: bash
        run: |
          set -Eeuo pipefail
          phase_report="${RUNNER_TEMP}/production-candidate-phase.json"
          execution_report="${RUNNER_TEMP}/production-candidate-execution.json"
          node http-generic-api/scripts/e2e-phase-governance.mjs check \
            --base '${{ steps.refs.outputs.main_sha }}' \
            --head '${{ steps.candidate.outputs.candidate_sha }}' \
            --report-file "${phase_report}"
          node http-generic-api/scripts/e2e-phase-governance.mjs run \
            --base '${{ steps.refs.outputs.main_sha }}' \
            --head '${{ steps.candidate.outputs.candidate_sha }}' \
            --report-file "${phase_report}" \
            --execution-report-file "${execution_report}"
          jq -e '.ok == true' "${phase_report}"
          jq -e '.ok == true' "${execution_report}"
          node build-canonicals.mjs --check
          git diff --check
          test -z "$(git status --short)"

      - name: Reconfirm protected refs and push only candidate branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/Production:refs/remotes/origin/Production'
          test "$(git rev-parse refs/remotes/origin/main)" = '${{ steps.refs.outputs.main_sha }}'
          test "$(git rev-parse refs/remotes/origin/Production)" = '${{ steps.refs.outputs.production_sha }}'
          git push origin '${{ steps.candidate.outputs.candidate_sha }}:refs/heads/${{ steps.candidate.outputs.candidate_ref }}'

      - name: Publish exact candidate evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## Production reconciliation candidate V10 built'
            echo
            echo '- Main parent: `${{ steps.refs.outputs.main_sha }}`'
            echo '- Production parent: `${{ steps.refs.outputs.production_sha }}`'
            echo '- Candidate head: `${{ steps.candidate.outputs.candidate_sha }}`'
            echo '- Candidate branch: `${{ steps.candidate.outputs.candidate_ref }}`'
            echo '- Candidate tree: `${{ steps.candidate.outputs.main_tree }}` — exact current main tree'
            echo '- Canonical E2E identity: `history_preserving_main_reconciliation`'
            echo '- Hostinger DDL mode: `release` from `canonical_e2e_parallel_pr_gate`'
            echo '- Work Map classification/currentness and canonical generated-source checks: passed'
            echo '- Phase check/execution and protected-ref reread: passed'
            echo '- No protected ref, Production merge, deployment, provider, database, SQL, migration, credential, secret, or external-send mutation occurred'
          } > "${RUNNER_TEMP}/candidate-summary.md"
          gh pr comment "${BUILDER_PR}" --repo "${REPOSITORY}" --body-file "${RUNNER_TEMP}/candidate-summary.md"
