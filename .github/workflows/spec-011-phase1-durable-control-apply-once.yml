name: Spec 011 Phase1 Durable Control Apply Once

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'gpt/spec-011-phase1-durable-control-20260730'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: gpt/spec-011-phase1-durable-control-20260730
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply bounded integration patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          orchestrator_path = Path('http-generic-api/sequentialPlanOrchestrator.js')
          orchestrator = orchestrator_path.read_text()
          if 'defaultSequentialStepExecutor' not in orchestrator:
              orchestrator = orchestrator.replace('defaultStepExecutor', 'defaultSequentialStepExecutor')
          old_retry = 'const retryable = !succeeded && Number(step.attempt_count || 0) < Number(step.max_attempts || 1);'
          new_retry = 'const retryable = !succeeded && !error?.non_retryable && Number(step.attempt_count || 0) < Number(step.max_attempts || 1);'
          orchestrator = replace_once(orchestrator, old_retry, new_retry, 'non-retryable unknown outcome guard')
          old_export = 'async function defaultSequentialStepExecutor(step, { pool, actorId = null }) {'
          new_export = 'export async function defaultSequentialStepExecutor(step, { pool, actorId = null }) {'
          orchestrator = replace_once(orchestrator, old_export, new_export, 'default executor export')
          orchestrator_path.write_text(orchestrator)

          routes_path = Path('http-generic-api/routes/plannerRoutes.js')
          routes = routes_path.read_text()
          old_import = '''import {
            getSequentialPlanTimeline,
            persistCompiledSequentialPlan,
            resumeSequentialPlan,
            runSequentialPlan,
            SEQUENTIAL_PLAN_RUN_JOB_TYPE,
            tickSequentialPlan,
          } from "../sequentialPlanOrchestrator.js";'''
          new_import = '''import {
            persistCompiledSequentialPlan,
            resumeSequentialPlan,
            SEQUENTIAL_PLAN_RUN_JOB_TYPE,
          } from "../sequentialPlanOrchestrator.js";
          import {
            cancelDurableExecution,
            explainDurableExecution,
            getBoundedDurableTimeline,
            getDurableExecutionStatus,
            runDurableExecution,
            tickDurableExecution,
            transitionDurableExecution,
          } from "../durableExecutionControlService.js";'''
          routes = replace_once(routes, old_import, new_import, 'planner imports')

          old_status = '''      const { status } = req.body || {};
                const VALID = ["draft", "validated", "approved", "executing", "awaiting_approval", "paused", "blocked", "completed", "failed", "cancelled"];
                if (!VALID.includes(status)) {
                  return res.status(400).json({ ok: false, error: { code: "invalid_status", message: `status must be one of: ${VALID.join(", ")}` } });
                }
                await getPool().query("UPDATE `execution_plans` SET plan_status = ?, runtime_status = ? WHERE plan_id = ?", [persistedPlanStatus(status), status, req.params.id]);
                return res.status(200).json({ ok: true, plan_id: req.params.id, plan_status: status });'''
          new_status = '''      const { status, tenant_id, reason } = req.body || {};
                const result = await transitionDurableExecution({
                  pool: getPool(),
                  planId: req.params.id,
                  tenantId: tenant_id || null,
                  toStatus: status,
                  actorId: principalActor(req),
                  reason: reason || null,
                });
                return res.status(200).json(result);'''
          routes = replace_once(routes, old_status, new_status, 'guarded status route')
          routes = routes.replace('tickSequentialPlan({ pool: getPool(), planId: req.params.id, actorId: principalActor(req) })', 'tickDurableExecution({ pool: getPool(), planId: req.params.id, actorId: principalActor(req) })')
          routes = routes.replace('const result = await runSequentialPlan({', 'const result = await runDurableExecution({')

          marker = '''  router.post("/planner/plans/:id/resume", requireBackendApiKey, async (req, res) => {'''
          added_routes = '''  router.get("/planner/plans/:id/status", requireBackendApiKey, async (req, res) => {
            try {
              const result = await getDurableExecutionStatus({
                pool: getPool(),
                planId: req.params.id,
                tenantId: req.query?.tenant_id || null,
              });
              if (!result) return res.status(404).json({ ok: false, error: { code: "durable_execution_not_found", message: "Execution plan not found." }, secrets_included: false });
              return res.status(200).json({ ok: true, ...result });
            } catch (err) {
              return res.status(err.status || 500).json({ ok: false, error: { code: err.code || "durable_execution_status_failed", message: err.message }, secrets_included: false });
            }
          });

          router.get("/planner/plans/:id/explain", requireBackendApiKey, async (req, res) => {
            try {
              const result = await explainDurableExecution({
                pool: getPool(),
                planId: req.params.id,
                tenantId: req.query?.tenant_id || null,
              });
              if (!result) return res.status(404).json({ ok: false, error: { code: "durable_execution_not_found", message: "Execution plan not found." }, secrets_included: false });
              return res.status(200).json({ ok: true, ...result });
            } catch (err) {
              return res.status(err.status || 500).json({ ok: false, error: { code: err.code || "durable_execution_explain_failed", message: err.message }, secrets_included: false });
            }
          });

          router.post("/planner/plans/:id/cancel", requireBackendApiKey, async (req, res) => {
            try {
              const result = await cancelDurableExecution({
                pool: getPool(),
                planId: req.params.id,
                tenantId: req.body?.tenant_id || null,
                actorId: principalActor(req),
                reason: req.body?.reason || null,
              });
              return res.status(200).json(result);
            } catch (err) {
              return res.status(err.status || 500).json({ ok: false, error: { code: err.code || "durable_execution_cancel_failed", message: err.message }, secrets_included: false });
            }
          });

          ''' + marker
          routes = replace_once(routes, marker, added_routes, 'durable control routes')
          old_timeline = 'const timeline = await getSequentialPlanTimeline({ pool: getPool(), planId: req.params.id });'
          new_timeline = '''const timeline = await getBoundedDurableTimeline({
                pool: getPool(),
                planId: req.params.id,
                tenantId: req.query?.tenant_id || null,
                limit: req.query?.limit || 100,
              });'''
          routes = replace_once(routes, old_timeline, new_timeline, 'bounded timeline route')
          routes_path.write_text(routes)

          manifest_path = Path('http-generic-api/scripts/test-manifest.mjs')
          manifest = manifest_path.read_text()
          command = '  "node test-durable-execution-control-service.mjs",\n'
          if command not in manifest:
              head, tail = manifest.rsplit('];', 1)
              manifest = head + command + '];' + tail
          manifest_path.write_text(manifest)

          tasks_path = Path('specs/011-durable-governed-execution-and-agent-delegation/tasks.md')
          tasks = tasks_path.read_text()
          for task in range(100, 107):
              old = f'- [ ] T{task}'
              new = f'- [x] T{task}'
              if old not in tasks and new not in tasks:
                  raise SystemExit(f'missing task marker T{task}')
              tasks = tasks.replace(old, new, 1)
          tasks_path.write_text(tasks)
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Run focused contracts
        working-directory: http-generic-api
        run: |
          node --check durableExecutionControlService.js
          node --check sequentialPlanOrchestrator.js
          node --check routes/plannerRoutes.js
          node test-durable-execution-control-service.mjs
          node test-sequential-plan-orchestrator.mjs
          node test-migration-placement-guard.mjs

      - name: Validate bounded write set
        shell: bash
        run: |
          allowed='^(http-generic-api/durableExecutionControlService.js|http-generic-api/migrations/20260730_spec011_durable_execution_control.sql|http-generic-api/test-durable-execution-control-service.mjs|http-generic-api/sequentialPlanOrchestrator.js|http-generic-api/routes/plannerRoutes.js|http-generic-api/scripts/test-manifest.mjs|specs/011-durable-governed-execution-and-agent-delegation/phase1-durable-control-runtime.md|specs/011-durable-governed-execution-and-agent-delegation/tasks.md|.github/workflows/spec-011-phase1-durable-control-apply-once.yml)$'
          bad="$(git diff --name-only HEAD | grep -Ev "$allowed" || true)"
          test -z "$bad" || { echo "Unexpected paths:"; echo "$bad"; exit 1; }

      - name: Commit clean implementation
        shell: bash
        run: |
          rm -f .github/workflows/spec-011-phase1-durable-control-apply-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add http-generic-api/sequentialPlanOrchestrator.js \
                  http-generic-api/routes/plannerRoutes.js \
                  http-generic-api/scripts/test-manifest.mjs \
                  specs/011-durable-governed-execution-and-agent-delegation/tasks.md \
                  .github/workflows/spec-011-phase1-durable-control-apply-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat(spec-011): integrate durable execution control"
          git push origin HEAD:gpt/spec-011-phase1-durable-control-20260730
