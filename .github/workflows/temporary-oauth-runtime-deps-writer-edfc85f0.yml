name: Temporary OAuth Runtime Dependency Writer edfc85f0

on:
  pull_request:
    branches:
      - gpt/writer-oauth-runtime-deps-edfc85f0-20260804
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: temporary-oauth-runtime-deps-writer-edfc85f0
  cancel-in-progress: false

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/trigger-oauth-runtime-deps-edfc85f0-20260804' &&
      github.event.pull_request.head.sha == '8981d012fce4ef90dd445774c720665514a37043'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout immutable trigger head
        uses: actions/checkout@v4
        with:
          ref: gpt/trigger-oauth-runtime-deps-edfc85f0-20260804
          fetch-depth: 0
          persist-credentials: true

      - name: Prove exact repository state
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "8981d012fce4ef90dd445774c720665514a37043"
          test "$(git rev-parse HEAD^)" = "edfc85f07a0fcac03b7258bb3c36e320b8fd1d3d"
          test "$(git rev-parse origin/main)" = "edfc85f07a0fcac03b7258bb3c36e320b8fd1d3d"
          test -z "$(git status --porcelain)"

      - name: Apply exact runtime dependency composition patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          replacements = [
              (
                  Path("http-generic-api/routes/index.js"),
                  "  app.use(buildTenantGptOAuthMetadataRoutes());\n",
                  "  app.use(buildTenantGptOAuthMetadataRoutes(deps));\n",
              ),
              (
                  Path("http-generic-api/test-spec012-t031-oauth-token-route-wiring.mjs"),
                  'const metadataMount = routeIndex.indexOf("app.use(buildTenantGptOAuthMetadataRoutes())");\n',
                  'const metadataMount = routeIndex.indexOf("app.use(buildTenantGptOAuthMetadataRoutes(deps))");\n',
              ),
          ]

          for path, old, new in replacements:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"exact replacement count for {path}: expected 1, got {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          trigger = Path(".changes/tmp/oauth-runtime-deps-trigger-edfc85f0.json")
          if not trigger.is_file():
              raise SystemExit("temporary trigger file is missing")
          trigger.unlink()

          expected = {
              ".changes/tmp/oauth-runtime-deps-trigger-edfc85f0.json",
              "http-generic-api/routes/index.js",
              "http-generic-api/test-spec012-t031-oauth-token-route-wiring.mjs",
          }
          actual = set(subprocess.check_output(
              ["git", "diff", "--name-only"], text=True,
          ).splitlines())
          if actual != expected:
              raise SystemExit(f"unexpected patch scope: {sorted(actual)}")
          PY
          git diff --check
          git diff --stat

      - name: Install locked API dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Run focused OAuth composition regressions
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          node test-spec012-t031-oauth-token-route-wiring.mjs
          node test-auth-oauth-routes.mjs
          node test-tenant-gpt-oauth-token-exchange-routes.mjs
          node test-spec012-t032-legacy-audience-compatibility.mjs

      - name: Run complete Unit and Integration suite
        working-directory: http-generic-api
        env:
          TEST_SUITE_REPORT_DIR: ${{ runner.temp }}/test-suite-reports
        run: npm test

      - name: Prove runtime startup and deployment evidence
        working-directory: http-generic-api
        env:
          FORCE_ROUTE_RUNTIME_TESTS: "true"
          DEPLOYMENT_BRANCH: gpt/fix-oauth-runtime-deps-edfc85f0-20260804
          DEPLOYMENT_COMMIT_SHA: candidate-pending
        shell: bash
        run: |
          set -euo pipefail
          node test-deployment-manifest-generator.mjs
          npm run manifest:deployment
          node test-server-startup-smoke.mjs

      - name: Run canonical architecture validation
        working-directory: http-generic-api
        run: npm run validate

      - name: Install locked root dependencies
        run: npm ci

      - name: Validate Execution Resolver
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm test -- --runInBand

      - name: Create atomic direct-parent commit and push without force
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "edfc85f07a0fcac03b7258bb3c36e320b8fd1d3d"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git reset --soft origin/main
          mapfile -t staged < <(git diff --cached --name-only)
          expected=(
            "http-generic-api/routes/index.js"
            "http-generic-api/test-spec012-t031-oauth-token-route-wiring.mjs"
          )
          test "${#staged[@]}" -eq "${#expected[@]}"
          printf '%s\n' "${staged[@]}" | sort > "$RUNNER_TEMP/staged.txt"
          printf '%s\n' "${expected[@]}" | sort > "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/staged.txt"
          git diff --cached --check
          git commit -m "fix(oauth): forward runtime dependency composition"
          final_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "edfc85f07a0fcac03b7258bb3c36e320b8fd1d3d"
          git push origin HEAD:refs/heads/gpt/fix-oauth-runtime-deps-edfc85f0-20260804
          remote_sha="$(git ls-remote origin refs/heads/gpt/fix-oauth-runtime-deps-edfc85f0-20260804 | awk '{print $1}')"
          test "$remote_sha" = "$final_sha"
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"

      - name: Record bounded writer evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oauth-runtime-deps-evidence"
          cp -R "$RUNNER_TEMP/test-suite-reports" "$RUNNER_TEMP/oauth-runtime-deps-evidence/" 2>/dev/null || true
          {
            echo "base_sha=edfc85f07a0fcac03b7258bb3c36e320b8fd1d3d"
            echo "trigger_sha=8981d012fce4ef90dd445774c720665514a37043"
            echo "final_sha=${{ steps.publish.outputs.final_sha }}"
            echo "job_status=${{ job.status }}"
            echo "final_branch=gpt/fix-oauth-runtime-deps-edfc85f0-20260804"
            echo "force_push=false"
            echo "secrets_included=false"
          } > "$RUNNER_TEMP/oauth-runtime-deps-evidence/metadata.txt"
          git status --short > "$RUNNER_TEMP/oauth-runtime-deps-evidence/final-worktree.txt"

      - name: Upload bounded writer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oauth-runtime-deps-writer-${{ github.run_id }}
          path: ${{ runner.temp }}/oauth-runtime-deps-evidence
          if-no-files-found: error
          retention-days: 14
