name: Spec014 Main Reconciliation 3535db5a

on:
  pull_request:
    branches:
      - gpt/hostinger-safe-storage-cleanup-ssh-20260801
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - '.github/workflows/spec014-main-reconciliation-3535db5a.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: spec014-main-reconciliation-3535db5a-e6431697
  cancel-in-progress: true

jobs:
  reconcile:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'gpt/reconcile-spec014-main-3535db5a-e6431697-20260802'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MAIN_SHA: 3535db5a438c29fc074bb41c303aa9c5663a36df
      INTEGRATION_SHA: e64316978042c25fece8abcd021888c654785eed
      RECONCILIATION_BRANCH: gpt/reconcile-spec014-main-3535db5a-e6431697-20260802
      LAUNCHER_PATH: .github/workflows/spec014-main-reconciliation-3535db5a.yml
    steps:
      - name: Checkout exact reconciliation branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RECONCILIATION_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Reconcile exact main and publish structured result
        shell: bash
        run: |
          set -Eeuo pipefail
          evidence_dir="${RUNNER_TEMP}/spec014-main-reconciliation"
          summary_path="${evidence_dir}/summary.json"
          mkdir -p "${evidence_dir}"
          current_stage='bootstrap'

          write_failure_summary() {
            local status="$1"
            local failed_command="$2"
            local failed_line="$3"
            set +e
            git diff --name-only --diff-filter=U | sort -u > "${evidence_dir}/unresolved.txt" 2>/dev/null || true
            git diff --cached --name-only | sort -u > "${evidence_dir}/staged.txt" 2>/dev/null || true
            git diff --name-only | sort -u > "${evidence_dir}/unstaged.txt" 2>/dev/null || true
            git status --porcelain=v1 > "${evidence_dir}/status.txt" 2>/dev/null || true
            STATUS="${status}" \
            FAILED_COMMAND="${failed_command}" \
            FAILED_LINE="${failed_line}" \
            CURRENT_STAGE="${current_stage}" \
            EVIDENCE_DIR="${evidence_dir}" \
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['EVIDENCE_DIR'])

          def lines(name):
              path = root / name
              if not path.exists():
                  return []
              return [line.strip() for line in path.read_text().splitlines() if line.strip()]

          report = {
              'contract': 'mad4b.spec014-main-reconciliation-summary.v1',
              'outcome': 'blocked',
              'integration_sha': os.environ['INTEGRATION_SHA'],
              'main_sha': os.environ['MAIN_SHA'],
              'reconciliation_branch': os.environ['RECONCILIATION_BRANCH'],
              'failure': {
                  'stage': os.environ['CURRENT_STAGE'],
                  'exit_status': int(os.environ['STATUS']),
                  'line': os.environ['FAILED_LINE'],
                  'command': os.environ['FAILED_COMMAND'],
              },
              'unresolved_conflict_paths': lines('unresolved.txt'),
              'staged_paths': lines('staged.txt'),
              'unstaged_paths': lines('unstaged.txt'),
              'status_entries': lines('status.txt'),
              'repository_push_performed': False,
              'provider_dispatch': False,
              'credential_access': False,
              'migration_apply': False,
              'deployment': False,
              'job_logs_consulted': False,
              'secrets_included': False,
          }
          Path(root, 'summary.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
          }

          on_error() {
            local status=$?
            local failed_command="${BASH_COMMAND:-unknown}"
            local failed_line="${BASH_LINENO[0]:-${LINENO}}"
            trap - ERR
            write_failure_summary "${status}" "${failed_command}" "${failed_line}"
            exit "${status}"
          }
          trap on_error ERR

          current_stage='verify_exact_launcher_parent'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          launcher_head="$(git rev-parse HEAD)"
          launcher_parent="$(git rev-parse HEAD^)"
          [[ "${launcher_parent}" == "${INTEGRATION_SHA}" ]]
          git diff --quiet "${INTEGRATION_SHA}" "${launcher_head}" -- . \
            ":(exclude)${LAUNCHER_PATH}"

          current_stage='merge_exact_main'
          git fetch --no-tags origin "${MAIN_SHA}"
          git update-ref refs/heads/main "${MAIN_SHA}"
          trap - ERR
          set +e
          git merge --no-commit --no-ff "${MAIN_SHA}"
          merge_status=$?
          set -e
          trap on_error ERR

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort -u)
          [[ ${merge_status} -ne 0 ]]
          [[ ${#conflicts[@]} -eq 1 ]]
          [[ "${conflicts[0]}" == 'http-generic-api/frontend-surface-dispatch.generated.json' ]]

          current_stage='resolve_diagnosed_generated_conflict'
          git show "${INTEGRATION_SHA}:http-generic-api/frontend-surface-dispatch.generated.json" \
            > http-generic-api/frontend-surface-dispatch.generated.json
          git add -- http-generic-api/frontend-surface-dispatch.generated.json
          [[ -z "$(git diff --name-only --diff-filter=U)" ]]

          current_stage='install_dependencies'
          npm ci --prefix http-generic-api

          current_stage='regenerate_combined_frontend_evidence'
          (
            cd http-generic-api
            npm run frontend:dispatch:generate -- --baseline-ref=main
          )

          mapfile -t unstaged < <(git diff --name-only)
          for path in "${unstaged[@]}"; do
            case "${path}" in
              http-generic-api/frontend-operation-governance.generated.json|\
              http-generic-api/frontend-surface-dispatch.generated.json|\
              http-generic-api/openapi/frontend-runtime-routes.generated.yaml)
                ;;
              *)
                echo "Unexpected generator mutation: ${path}" >&2
                false
                ;;
            esac
          done

          current_stage='validate_combined_contracts'
          (
            cd http-generic-api
            node test-frontend-dispatch-workflow-baseline.mjs
            node test-frontend-operation-governance-generator.mjs
            node test-frontend-surface-dispatch.mjs
            node test-frontend-auth-openapi-parity.mjs
            node test-openapi-route-coverage.mjs
            npm run openapi:auth:check
            node test-hostinger-storage-crash-safe-restart-reconciler.mjs
            node test-hostinger-storage-verified-sql-runtime-composition.mjs
            node test-hostinger-storage-tenant-safe-durable-projection.mjs
          )
          node .github/tests/spec014/hostinger-tenant-canary-main-bootstrap.mjs
          grep -Fq 'userJwtAuth' http-generic-api/openapi/support-tickets.yaml

          current_stage='create_two_parent_commit'
          git rm "${LAUNCHER_PATH}"
          git add -A
          git diff --cached --check
          git commit -m 'chore: reconcile current main into Spec 014 Integration'

          read -r commit first_parent second_parent extra < <(git rev-list --parents -n 1 HEAD)
          [[ -n "${commit}" ]]
          [[ "${first_parent}" == "${launcher_head}" ]]
          [[ "${second_parent}" == "${MAIN_SHA}" ]]
          [[ -z "${extra:-}" ]]

          current_stage='write_success_summary'
          COMMIT_SHA="${commit}" \
          FIRST_PARENT="${first_parent}" \
          SECOND_PARENT="${second_parent}" \
          LAUNCHER_HEAD="${launcher_head}" \
          EVIDENCE_DIR="${evidence_dir}" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = {
              'contract': 'mad4b.spec014-main-reconciliation-summary.v1',
              'outcome': 'passed',
              'reconciliation_commit_sha': os.environ['COMMIT_SHA'],
              'first_parent_sha': os.environ['FIRST_PARENT'],
              'second_parent_sha': os.environ['SECOND_PARENT'],
              'launcher_head_sha': os.environ['LAUNCHER_HEAD'],
              'integration_sha': os.environ['INTEGRATION_SHA'],
              'main_sha': os.environ['MAIN_SHA'],
              'conflict_paths': ['http-generic-api/frontend-surface-dispatch.generated.json'],
              'conflict_resolution': 'regenerated_from_combined_tree_with_exact_main_baseline',
              'frontend_contracts_passed': True,
              'openapi_contracts_passed': True,
              'crash_safe_contracts_passed': True,
              'tenant_canary_bootstrap_passed': True,
              'launcher_removed': True,
              'repository_push_target': os.environ['RECONCILIATION_BRANCH'],
              'repository_push_performed': True,
              'provider_dispatch': False,
              'credential_access': False,
              'migration_apply': False,
              'deployment': False,
              'job_logs_consulted': False,
              'secrets_included': False,
          }
          Path(os.environ['EVIDENCE_DIR'], 'summary.json').write_text(json.dumps(report, indent=2) + '\n')
          PY

          current_stage='push_reconciliation_commit'
          git push origin "HEAD:${RECONCILIATION_BRANCH}"
          trap - ERR

      - name: Upload reconciliation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec014-main-reconciliation-${{ github.run_id }}
          path: ${{ runner.temp }}/spec014-main-reconciliation/summary.json
          if-no-files-found: error
          retention-days: 14
