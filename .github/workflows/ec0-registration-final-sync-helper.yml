name: EC0 Registration Final Sync Helper

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync-and-verify:
    if: github.event.pull_request.head.ref == 'gpt/ec0-registration-final-sync-helper-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v5
        with:
          ref: gpt/ec0-registration-final-sync-helper-20260730
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Synchronize current main without generated conflict
        run: |
          git fetch origin main
          git config user.name 'mad4b-governed-bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout origin/main -- http-generic-api/frontend-surface-dispatch.generated.json
          if ! git diff --quiet -- http-generic-api/frontend-surface-dispatch.generated.json; then
            git add http-generic-api/frontend-surface-dispatch.generated.json
            git commit -m 'chore(spec-012): align generated artifact before final sync'
          fi
          git merge --no-edit origin/main

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Verify EC0 registration and contracts
        working-directory: http-generic-api
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('scripts/test-manifest.mjs', 'utf8');
          const matches = source.match(/node test-execution-capsule-contract\.mjs/g) || [];
          if (matches.length !== 1) throw new Error(`Expected one EC0 manifest entry, found ${matches.length}`);
          NODE
          node test-execution-capsule-contract.mjs
          node test-context-kernel-domain.mjs
          node test-context-kernel-application-use-cases.mjs
          node test-context-kernel-cross-tenant-isolation.mjs

      - name: Generate bounded artifacts using repository authority
        working-directory: http-generic-api
        run: |
          node scripts/openapi-autofill-missing-routes.mjs --write
          npm run frontend:dispatch:generate -- --baseline-ref=main
          node scripts/generate-custom-gpt-schemas.mjs --write

      - name: Verify generated contracts
        working-directory: http-generic-api
        run: |
          node test-frontend-operation-governance-generator.mjs
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-openapi-route-coverage.mjs
          npm run openapi:auth:check
          npm run schemas:guard

      - name: Remove helper and enforce bounded write set
        run: |
          git rm .github/workflows/ec0-registration-final-sync-helper.yml
          mapfile -t CHANGED < <(git status --porcelain --untracked-files=all | sed -E 's/^...//' | sort)
          UNEXPECTED=''
          for file in "${CHANGED[@]}"; do
            case "$file" in
              .github/workflows/ec0-registration-final-sync-helper.yml|\
              http-generic-api/openapi.yaml|\
              http-generic-api/frontend-operation-governance.generated.json|\
              http-generic-api/frontend-surface-dispatch.generated.json|\
              http-generic-api/openapi/frontend-runtime-routes.generated.yaml|\
              http-generic-api/openapi/openapi.custom-gpt.auth-dispatcher.yaml|\
              http-generic-api/openapi/openapi.custom-gpt.activation-admin.yaml|\
              http-generic-api/openapi/openapi.tenant-gpt.auth.yaml|\
              http-generic-api/openapi/openapi.tenant-gpt.activation.yaml|\
              http-generic-api/openapi.gpt-action.local-connector.yaml)
                ;;
              *)
                UNEXPECTED+="$file"$'\n'
                ;;
            esac
          done
          if [[ -n "$UNEXPECTED" ]]; then
            echo '::error::Final sync changed files outside the bounded artifact set'
            printf '%s' "$UNEXPECTED"
            exit 1
          fi

      - name: Commit clean synchronized helper
        run: |
          git add -A
          git commit -m 'chore(spec-012): finalize EC0 registration sync'
          git push origin HEAD:gpt/ec0-registration-final-sync-helper-20260730
