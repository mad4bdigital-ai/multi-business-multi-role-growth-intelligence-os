name: Spec Kit Work Map Autofix Recovery Dispatch
run-name: Spec Kit Work Map Autofix Recovery Dispatch · PR ${{ inputs.pr_number || 'unresolved' }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open same-repository pull request targeting main
        required: true
        type: string
      expected_head_sha:
        description: Exact current pull-request head SHA authorized for recovery
        required: true
        type: string
      confirmation:
        description: Type RECOVER_SPEC_KIT_WORK_MAP_AUTOFIX
        required: true
        type: string

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: work-map-writer-delegation-${{ github.repository }}-pr-${{ inputs.pr_number || github.run_id }}
  cancel-in-progress: false
  queue: max

jobs:
  dispatch:
    name: Re-enable and dispatch sole governed Work Map writer
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      REQUESTED_PR_NUMBER: ${{ inputs.pr_number }}
      REQUESTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      MANUAL_CONFIRMATION: ${{ inputs.confirmation }}
      COMMAND_ACTOR: ${{ github.actor }}
      AUTHORIZATION_MARKER: '<!-- work-map-autofix:authorized -->'
    steps:
      - name: Initialize bounded report directory after runner allocation
        shell: bash
        run: |
          set -euo pipefail
          report_dir="${RUNNER_TEMP}/spec-kit-work-map-autofix-recovery"
          rm -rf "${report_dir}"
          mkdir -p "${report_dir}"
          echo "REPORT_DIR=${report_dir}" >> "${GITHUB_ENV}"

      - name: Resolve and validate exact same-repository target
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${MANUAL_CONFIRMATION}" = "RECOVER_SPEC_KIT_WORK_MAP_AUTOFIX"
          [[ "${REQUESTED_PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          [[ "${REQUESTED_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]

          pr_file="${REPORT_DIR}/pull-request.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${REQUESTED_PR_NUMBER}" > "${pr_file}"

          state="$(jq -r '.state' "${pr_file}")"
          base_ref="$(jq -r '.base.ref' "${pr_file}")"
          head_repo="$(jq -r '.head.repo.full_name' "${pr_file}")"
          target_branch="$(jq -r '.head.ref' "${pr_file}")"
          current_head_sha="$(jq -r '.head.sha' "${pr_file}")"
          body="$(jq -r '.body // ""' "${pr_file}")"

          test "${state}" = "open"
          test "${base_ref}" = "main"
          test "${head_repo}" = "${GITHUB_REPOSITORY}"
          [[ "${target_branch}" =~ ^(gpt|cert|fix|feat|chore|docs|release)/[A-Za-z0-9._/-]+$ ]]
          [[ "${target_branch}" != "main" && "${target_branch}" != "Production" ]]
          test "${current_head_sha}" = "${REQUESTED_HEAD_SHA}"
          grep -Fq "${AUTHORIZATION_MARKER}" <<<"${body}"

          compare_file="${REPORT_DIR}/main-comparison.json"
          gh api "repos/${GITHUB_REPOSITORY}/compare/main...${REQUESTED_HEAD_SHA}" > "${compare_file}"
          behind_by="$(jq -r '.behind_by' "${compare_file}")"
          test "${behind_by}" = "0"

          echo "pr_number=${REQUESTED_PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "target_branch=${target_branch}" >> "$GITHUB_OUTPUT"
          echo "expected_head_sha=${REQUESTED_HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "behind_by=${behind_by}" >> "$GITHUB_OUTPUT"

      - name: Re-enable governed Work Map workflows and verify active state
        id: workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in spec-kit-work-map-autofix.yml spec-kit-work-map-integration.yml; do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}" --jq '.state')"
            if [[ "${state}" != "active" ]]; then
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/enable"
            fi
            readback_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}" --jq '.state')"
            test "${readback_state}" = "active"
          done
          echo "writer_state=active" >> "$GITHUB_OUTPUT"
          echo "integration_state=active" >> "$GITHUB_OUTPUT"

      - name: Consume one-time authorization marker
        id: authorization
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
        run: |
          set -euo pipefail
          pr_file="${REPORT_DIR}/authorization-pr.json"
          payload_file="${REPORT_DIR}/authorization-payload.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "${pr_file}"
          node - "${pr_file}" "${payload_file}" "${AUTHORIZATION_MARKER}" <<'NODE'
          const fs = require('node:fs');
          const [prFile, payloadFile, marker] = process.argv.slice(2);
          const pr = JSON.parse(fs.readFileSync(prFile, 'utf8'));
          const body = String(pr.body || '');
          if (!body.includes(marker)) {
            console.error('One-time Work Map authorization marker is missing.');
            process.exit(1);
          }
          const nextBody = body.replace(marker, '').replace(/\n{3,}/g, '\n\n').trimEnd();
          fs.writeFileSync(payloadFile, JSON.stringify({ body: nextBody }));
          NODE
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --input "${payload_file}" >/dev/null
          if gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.body // ""' | grep -Fq "${AUTHORIZATION_MARKER}"; then
            echo "Authorization marker removal readback failed."
            exit 1
          fi
          echo "consumed=true" >> "$GITHUB_OUTPUT"

      - name: Issue exact one-time writer delegation grant
        id: delegation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          TARGET_BRANCH: ${{ steps.target.outputs.target_branch }}
          EXPECTED_HEAD_SHA: ${{ steps.target.outputs.expected_head_sha }}
          AUTHORIZATION_CONSUMED: ${{ steps.authorization.outputs.consumed }}
        run: |
          set -euo pipefail
          test "${AUTHORIZATION_CONSUMED}" = "true"
          grant_body="WORK_MAP_WRITER_DELEGATION contract=mad4b.work-map-writer-delegation.v1 state=issued recovery_run_id=${GITHUB_RUN_ID} recovery_run_attempt=${GITHUB_RUN_ATTEMPT} pr_number=${PR_NUMBER} target_branch=${TARGET_BRANCH} expected_head_sha=${EXPECTED_HEAD_SHA} authorization_consumed=true"
          delegation_comment_id="$(gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -f body="${grant_body}" \
            --jq '.id')"
          [[ "${delegation_comment_id}" =~ ^[1-9][0-9]*$ ]]
          readback_body="$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${delegation_comment_id}" --jq '.body')"
          test "${readback_body}" = "${grant_body}"
          echo "comment_id=${delegation_comment_id}" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact-head sole governed Work Map writer
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          TARGET_BRANCH: ${{ steps.target.outputs.target_branch }}
          EXPECTED_HEAD_SHA: ${{ steps.target.outputs.expected_head_sha }}
          DELEGATION_COMMENT_ID: ${{ steps.delegation.outputs.comment_id }}
        run: |
          set -euo pipefail
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          [[ "${DELEGATION_COMMENT_ID}" =~ ^[1-9][0-9]*$ ]]
          dispatch_started_at="$(date -u -d '5 seconds ago' +'%Y-%m-%dT%H:%M:%SZ')"
          payload="$(jq -cn \
            --arg ref main \
            --arg pr_number "${PR_NUMBER}" \
            --arg branch "${TARGET_BRANCH}" \
            --arg expected_head_sha "${EXPECTED_HEAD_SHA}" \
            --arg recovery_run_id "${GITHUB_RUN_ID}" \
            --arg delegation_comment_id "${DELEGATION_COMMENT_ID}" \
            '{ref:$ref,inputs:{pr_number:$pr_number,branch:$branch,expected_head_sha:$expected_head_sha,recovery_run_id:$recovery_run_id,delegation_comment_id:$delegation_comment_id}}')"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/spec-kit-work-map-autofix.yml/dispatches" \
            --input - <<<"${payload}"

          delegated_run_id=""
          for _ in $(seq 1 30); do
            delegated_run_id="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/spec-kit-work-map-autofix.yml/runs?event=workflow_dispatch&per_page=30" \
              --jq "[.workflow_runs[] | select(.created_at >= \"${dispatch_started_at}\" and .head_branch == \"main\" and .actor.login == \"github-actions[bot]\")] | sort_by(.created_at) | last | .id // empty")"
            if [[ -n "${delegated_run_id}" ]]; then
              break
            fi
            sleep 2
          done
          [[ "${delegated_run_id}" =~ ^[1-9][0-9]*$ ]]
          echo "run_id=${delegated_run_id}" >> "$GITHUB_OUTPUT"

      - name: Publish structured recovery evidence on target PR
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          TARGET_BRANCH: ${{ steps.target.outputs.target_branch }}
          EXPECTED_HEAD_SHA: ${{ steps.target.outputs.expected_head_sha }}
          BEHIND_BY: ${{ steps.target.outputs.behind_by }}
          WRITER_STATE: ${{ steps.workflows.outputs.writer_state }}
          INTEGRATION_STATE: ${{ steps.workflows.outputs.integration_state }}
          AUTHORIZATION_CONSUMED: ${{ steps.authorization.outputs.consumed }}
          DELEGATION_COMMENT_ID: ${{ steps.delegation.outputs.comment_id }}
          DELEGATED_RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          outcome="passed"
          if [[ "${{ job.status }}" != "success" ]]; then
            outcome="blocked"
          fi

          if [[ "${outcome}" = "blocked" && "${DELEGATION_COMMENT_ID:-}" =~ ^[1-9][0-9]*$ ]]; then
            current_body="$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${DELEGATION_COMMENT_ID}" --jq '.body // ""')"
            if grep -Fq ' state=issued ' <<<"${current_body}"; then
              revoked_body="${current_body/ state=issued / state=revoked recovery_outcome=blocked }"
              jq -n --arg body "${revoked_body}" '{body:$body}' > "${REPORT_DIR}/delegation-revoke-payload.json"
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${DELEGATION_COMMENT_ID}" \
                --input "${REPORT_DIR}/delegation-revoke-payload.json" >/dev/null
            fi
          fi

          jq -n \
            --arg contract "mad4b.spec-kit-work-map-autofix-recovery.v3" \
            --arg outcome "${outcome}" \
            --arg source_event "${GITHUB_EVENT_NAME}" \
            --arg actor "${COMMAND_ACTOR}" \
            --arg recovery_run_id "${GITHUB_RUN_ID}" \
            --arg target_branch "${TARGET_BRANCH:-unresolved}" \
            --arg expected_head_sha "${EXPECTED_HEAD_SHA:-unresolved}" \
            --arg behind_by "${BEHIND_BY:-unknown}" \
            --arg writer_state "${WRITER_STATE:-unknown}" \
            --arg integration_state "${INTEGRATION_STATE:-unknown}" \
            --arg authorization_consumed "${AUTHORIZATION_CONSUMED:-false}" \
            --arg delegation_comment_id "${DELEGATION_COMMENT_ID:-none}" \
            --arg delegated_run_id "${DELEGATED_RUN_ID:-none}" \
            --argjson pr_number "${PR_NUMBER:-0}" \
            '{contract:$contract,outcome:$outcome,source_event:$source_event,actor:$actor,recovery_run_id:$recovery_run_id,pr_number:$pr_number,target_branch:$target_branch,expected_head_sha:$expected_head_sha,behind_by:$behind_by,writer_state:$writer_state,integration_state:$integration_state,authorization_consumed:$authorization_consumed,delegation_comment_id:$delegation_comment_id,delegated_run_id:$delegated_run_id,direct_repository_mutation:false,protected_branch_mutation:false,force_push:false,secrets_included:false}' \
            > "${REPORT_DIR}/report.json"

          if [[ "${PR_NUMBER:-}" =~ ^[1-9][0-9]*$ ]]; then
            body="WORK_MAP_AUTOFIX_RECOVERY outcome=${outcome} source_event=${GITHUB_EVENT_NAME} actor=${COMMAND_ACTOR} recovery_run_id=${GITHUB_RUN_ID} expected_head_sha=${EXPECTED_HEAD_SHA:-unresolved} target_branch=${TARGET_BRANCH:-unresolved} behind_by=${BEHIND_BY:-unknown} writer_state=${WRITER_STATE:-unknown} integration_state=${INTEGRATION_STATE:-unknown} authorization_consumed=${AUTHORIZATION_CONSUMED:-false} delegation_comment_id=${DELEGATION_COMMENT_ID:-none} delegated_run_id=${DELEGATED_RUN_ID:-none} direct_repository_mutation=false protected_branch_mutation=false force_push=false"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="${body}"
          fi

      - name: Upload bounded recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-kit-work-map-autofix-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/spec-kit-work-map-autofix-recovery/
          if-no-files-found: warn
          retention-days: 30
