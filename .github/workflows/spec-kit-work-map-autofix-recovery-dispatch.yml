name: Spec Kit Work Map Autofix Recovery Dispatch
run-name: Spec Kit Work Map Autofix Recovery Dispatch · PR ${{ github.event.issue.number || github.event.pull_request.number || inputs.pr_number || 'unresolved' }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open same-repository pull request targeting main
        required: true
        type: string
      confirmation:
        description: Type RECOVER_SPEC_KIT_WORK_MAP_AUTOFIX
        required: true
        type: string
  pull_request_target:
    branches: [main]
    types: [synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: spec-kit-work-map-autofix-recovery-${{ github.event.issue.number || github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Re-enable and dispatch sole governed Work Map writer
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request_target' &&
        github.actor != 'github-actions[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.draft == false &&
        contains(github.event.pull_request.body, '<!-- work-map-autofix:authorized -->')
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.actor != 'github-actions[bot]' &&
        github.event.comment.body == '/recover-work-maps'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REQUESTED_PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event_name == 'issue_comment' && github.event.issue.number || github.event.pull_request.number }}
      MANUAL_CONFIRMATION: ${{ inputs.confirmation || '' }}
      COMMENT_COMMAND: ${{ github.event.comment.body || '' }}
      COMMAND_ACTOR: ${{ github.actor }}
      AUTHORIZATION_MARKER: '<!-- work-map-autofix:authorized -->'
      REPORT_DIR: ${{ runner.temp }}/spec-kit-work-map-autofix-recovery
    steps:
      - name: Resolve and validate exact same-repository target
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "${REPORT_DIR}"
          mkdir -p "${REPORT_DIR}"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${MANUAL_CONFIRMATION}" != "RECOVER_SPEC_KIT_WORK_MAP_AUTOFIX" ]]; then
            echo "Manual recovery requires exact typed confirmation."
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "issue_comment" ]]; then
            if [[ "${COMMENT_COMMAND}" != "/recover-work-maps" ]]; then
              echo "Unexpected recovery comment command."
              exit 1
            fi
            actor_permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${COMMAND_ACTOR}/permission" --jq '.permission')"
            case "${actor_permission}" in
              admin|maintain|write) ;;
              *)
                echo "Actor ${COMMAND_ACTOR} lacks write-level repository permission; permission=${actor_permission}."
                exit 1
                ;;
            esac
          fi
          [[ "${REQUESTED_PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]

          pr_file="${REPORT_DIR}/pull-request.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${REQUESTED_PR_NUMBER}" > "${pr_file}"

          state="$(jq -r '.state' "${pr_file}")"
          draft="$(jq -r '.draft' "${pr_file}")"
          base_ref="$(jq -r '.base.ref' "${pr_file}")"
          head_repo="$(jq -r '.head.repo.full_name' "${pr_file}")"
          target_branch="$(jq -r '.head.ref' "${pr_file}")"
          expected_head_sha="$(jq -r '.head.sha' "${pr_file}")"
          body="$(jq -r '.body // ""' "${pr_file}")"

          test "${state}" = "open"
          test "${draft}" = "false"
          test "${base_ref}" = "main"
          test "${head_repo}" = "${GITHUB_REPOSITORY}"
          [[ "${target_branch}" =~ ^(gpt|cert|fix|feat|chore|docs|release)/[A-Za-z0-9._/-]+$ ]]
          [[ "${target_branch}" != "main" && "${target_branch}" != "Production" ]]
          [[ "${expected_head_sha}" =~ ^[0-9a-f]{40}$ ]]
          grep -Fq "${AUTHORIZATION_MARKER}" <<<"${body}"

          compare_file="${REPORT_DIR}/main-comparison.json"
          gh api "repos/${GITHUB_REPOSITORY}/compare/main...${expected_head_sha}" > "${compare_file}"
          behind_by="$(jq -r '.behind_by' "${compare_file}")"
          if [[ "${behind_by}" != "0" ]]; then
            echo "Target branch is behind main by ${behind_by} commit(s); refusing stale recovery dispatch."
            exit 1
          fi

          echo "pr_number=${REQUESTED_PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "target_branch=${target_branch}" >> "$GITHUB_OUTPUT"
          echo "expected_head_sha=${expected_head_sha}" >> "$GITHUB_OUTPUT"
          echo "behind_by=${behind_by}" >> "$GITHUB_OUTPUT"

      - name: Re-enable governed Work Map workflows and verify active state
        id: workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in spec-kit-work-map-autofix.yml spec-kit-work-map-integration.yml; do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}" --jq '.state')"
            if [[ "${state}" != "active" ]]; then
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/enable"
            fi
            readback_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}" --jq '.state')"
            if [[ "${readback_state}" != "active" ]]; then
              echo "Workflow ${workflow} did not become active; readback=${readback_state}."
              exit 1
            fi
          done
          echo "writer_state=active" >> "$GITHUB_OUTPUT"
          echo "integration_state=active" >> "$GITHUB_OUTPUT"

      - name: Consume one-time authorization marker
        id: authorization
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
        run: |
          set -euo pipefail
          pr_file="${REPORT_DIR}/authorization-pr.json"
          payload_file="${REPORT_DIR}/authorization-payload.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "${pr_file}"
          node - "${pr_file}" "${payload_file}" "${AUTHORIZATION_MARKER}" <<'NODE'
          const fs = require('node:fs');
          const [prFile, payloadFile, marker] = process.argv.slice(2);
          const pr = JSON.parse(fs.readFileSync(prFile, 'utf8'));
          const body = String(pr.body || '');
          if (!body.includes(marker)) {
            console.error('One-time Work Map authorization marker is missing.');
            process.exit(1);
          }
          const nextBody = body.replace(marker, '').replace(/\n{3,}/g, '\n\n').trimEnd();
          fs.writeFileSync(payloadFile, JSON.stringify({ body: nextBody }));
          NODE
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --input "${payload_file}" >/dev/null
          if gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.body // ""' | grep -Fq "${AUTHORIZATION_MARKER}"; then
            echo "Authorization marker removal readback failed."
            exit 1
          fi
          echo "consumed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact-head sole governed Work Map writer
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ steps.target.outputs.target_branch }}
          EXPECTED_HEAD_SHA: ${{ steps.target.outputs.expected_head_sha }}
        run: |
          set -euo pipefail
          dispatch_started_at="$(date -u -d '5 seconds ago' +'%Y-%m-%dT%H:%M:%SZ')"
          payload="$(jq -cn \
            --arg ref main \
            --arg branch "${TARGET_BRANCH}" \
            --arg expected_head_sha "${EXPECTED_HEAD_SHA}" \
            '{ref:$ref,inputs:{branch:$branch,expected_head_sha:$expected_head_sha}}')"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/spec-kit-work-map-autofix.yml/dispatches" \
            --input - <<<"${payload}"

          delegated_run_id=""
          for _ in $(seq 1 30); do
            delegated_run_id="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/spec-kit-work-map-autofix.yml/runs?event=workflow_dispatch&per_page=30" \
              --jq "[.workflow_runs[] | select(.created_at >= \"${dispatch_started_at}\" and .head_branch == \"main\")] | sort_by(.created_at) | last | .id // empty")"
            if [[ -n "${delegated_run_id}" ]]; then
              break
            fi
            sleep 2
          done
          if [[ ! "${delegated_run_id}" =~ ^[1-9][0-9]*$ ]]; then
            echo "The Work Map writer dispatch was accepted but no delegated run was observed."
            exit 1
          fi
          echo "run_id=${delegated_run_id}" >> "$GITHUB_OUTPUT"

      - name: Publish structured recovery evidence on target PR
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          TARGET_BRANCH: ${{ steps.target.outputs.target_branch }}
          EXPECTED_HEAD_SHA: ${{ steps.target.outputs.expected_head_sha }}
          BEHIND_BY: ${{ steps.target.outputs.behind_by }}
          WRITER_STATE: ${{ steps.workflows.outputs.writer_state }}
          INTEGRATION_STATE: ${{ steps.workflows.outputs.integration_state }}
          AUTHORIZATION_CONSUMED: ${{ steps.authorization.outputs.consumed }}
          DELEGATED_RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          outcome="passed"
          if [[ "${{ job.status }}" != "success" ]]; then
            outcome="blocked"
          fi
          jq -n \
            --arg contract "mad4b.spec-kit-work-map-autofix-recovery.v1" \
            --arg outcome "${outcome}" \
            --arg source_event "${GITHUB_EVENT_NAME}" \
            --arg actor "${COMMAND_ACTOR}" \
            --arg target_branch "${TARGET_BRANCH:-unresolved}" \
            --arg expected_head_sha "${EXPECTED_HEAD_SHA:-unresolved}" \
            --arg behind_by "${BEHIND_BY:-unknown}" \
            --arg writer_state "${WRITER_STATE:-unknown}" \
            --arg integration_state "${INTEGRATION_STATE:-unknown}" \
            --arg authorization_consumed "${AUTHORIZATION_CONSUMED:-false}" \
            --arg delegated_run_id "${DELEGATED_RUN_ID:-none}" \
            --argjson pr_number "${PR_NUMBER:-0}" \
            '{contract:$contract,outcome:$outcome,source_event:$source_event,actor:$actor,pr_number:$pr_number,target_branch:$target_branch,expected_head_sha:$expected_head_sha,behind_by:$behind_by,writer_state:$writer_state,integration_state:$integration_state,authorization_consumed:$authorization_consumed,delegated_run_id:$delegated_run_id,direct_repository_mutation:false,protected_branch_mutation:false,force_push:false,secrets_included:false}' \
            > "${REPORT_DIR}/report.json"

          if [[ "${PR_NUMBER:-}" =~ ^[1-9][0-9]*$ ]]; then
            body="WORK_MAP_AUTOFIX_RECOVERY outcome=${outcome} source_event=${GITHUB_EVENT_NAME} actor=${COMMAND_ACTOR} expected_head_sha=${EXPECTED_HEAD_SHA:-unresolved} target_branch=${TARGET_BRANCH:-unresolved} behind_by=${BEHIND_BY:-unknown} writer_state=${WRITER_STATE:-unknown} integration_state=${INTEGRATION_STATE:-unknown} authorization_consumed=${AUTHORIZATION_CONSUMED:-false} delegated_run_id=${DELEGATED_RUN_ID:-none} direct_repository_mutation=false protected_branch_mutation=false force_push=false"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="${body}"
          fi

      - name: Upload bounded recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-kit-work-map-autofix-recovery-${{ github.run_id }}
          path: ${{ env.REPORT_DIR }}/
          if-no-files-found: warn
          retention-days: 30
