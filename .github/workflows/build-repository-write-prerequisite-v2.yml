name: Validate Repository Write Workflow Prerequisite V6

on:
  pull_request:
    branches:
      - gpt/diag/repository-write-prerequisite-builder-94f9d786-v2
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: repository-write-prerequisite-validator-v6-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  EXPECTED_MAIN_SHA: 4a049185f8eff3232bf1a6ed0a176525e72d980d
  EXPECTED_CANDIDATE_SHA: d1303696bd2afa52183bc758211647424af0b102
  EXPECTED_CANDIDATE_REF: gpt/ci/repository-write-workflow-prerequisite-4a049185-20260804
  EXPECTED_BASE_REF: gpt/diag/repository-write-prerequisite-builder-94f9d786-v2
  EXPECTED_TRIGGER_REF: gpt/diag/trigger-validate-repository-write-prerequisite-4a049185-v5

jobs:
  validate:
    name: Exact Repository Write Prerequisite ARM Validation
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - name: Validate trigger identity
        shell: bash
        env:
          ACTUAL_BASE_REF: ${{ github.event.pull_request.base.ref }}
          ACTUAL_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          ACTUAL_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          test "$ACTUAL_BASE_REF" = "$EXPECTED_BASE_REF"
          test "$ACTUAL_HEAD_REF" = "$EXPECTED_TRIGGER_REF"
          test "$ACTUAL_HEAD_REPO" = "$GITHUB_REPOSITORY"

      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            http-generic-api/package-lock.json

      - name: Run exact-head full validation
        shell: bash
        run: |
          set -euo pipefail
          report_dir="$RUNNER_TEMP/repository-write-prerequisite-v6"
          mkdir -p "$report_dir/repository-tool-lifecycle" "$RUNNER_TEMP/test-suite-reports"

          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main" "+refs/heads/$EXPECTED_CANDIDATE_REF:refs/remotes/origin/$EXPECTED_CANDIDATE_REF"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse refs/remotes/origin/$EXPECTED_CANDIDATE_REF)" = "$EXPECTED_CANDIDATE_SHA"
          test "$(git rev-parse "$EXPECTED_CANDIDATE_SHA^1")" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-list --count "$EXPECTED_MAIN_SHA..$EXPECTED_CANDIDATE_SHA")" -eq 1
          test "$(git diff --name-only "$EXPECTED_MAIN_SHA" "$EXPECTED_CANDIDATE_SHA" | wc -l)" -eq 10
          git diff --name-status "$EXPECTED_MAIN_SHA" "$EXPECTED_CANDIDATE_SHA" > "$report_dir/changes.tsv"

          npm ci
          npm ci --prefix http-generic-api

          node http-generic-api/test-fanout-relocation-ci.mjs
          node http-generic-api/test-pipeline-connectivity-check.mjs
          node http-generic-api/test-supervisor-runtime-assurance-automation.mjs
          node http-generic-api/test-e2e-contract-reference-integrity.mjs
          node http-generic-api/test-e2e-contract-git-index-integrity.mjs

          node http-generic-api/scripts/schema-docs-change-guard.mjs
          node http-generic-api/scripts/migration-placement-guard.mjs
          node http-generic-api/scripts/user-jwt-auth-governance.mjs
          node http-generic-api/scripts/interruption-readiness.mjs --ci --skip-dependencies --skip-worktree
          node validate-canonical-sources.mjs
          node build-canonicals.mjs --check
          node http-generic-api/scripts/spec-kit-completion-gate.mjs --ci --changed
          node validate-memory-schema.mjs
          git diff --check

          (cd http-generic-api && TEST_SUITE_REPORT_DIR="$RUNNER_TEMP/test-suite-reports" GITHUB_SHA="$EXPECTED_CANDIDATE_SHA" npm test)
          for report in "$RUNNER_TEMP/test-suite-reports/test-manifest.json" "$RUNNER_TEMP/test-suite-reports/test-suite.json"; do
            test "$(jq -r '.status' "$report")" = passed
            test "$(jq -r '.commitSha' "$report")" = "$EXPECTED_CANDIDATE_SHA"
            test "$(jq -r '.firstFailure' "$report")" = null
            test "$(jq -r '.secretsIncluded' "$report")" = false
          done

          (cd http-generic-api && FORCE_ROUTE_RUNTIME_TESTS=true node test-server-startup-smoke.mjs)
          (cd http-generic-api && node test-hostinger-root-entrypoint.mjs)
          (cd http-generic-api && node test-root-cause-activation-runtime-repair.mjs)

          node http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs
          BASE_SHA="$EXPECTED_MAIN_SHA" CANDIDATE_SHA="$EXPECTED_CANDIDATE_SHA" node http-generic-api/scripts/maintenance-tools/repository-tool-lifecycle-guard.mjs --changed-files "$report_dir/changes.tsv" --policy .github/repository-maintenance-tool-governance.json --output-dir "$report_dir/repository-tool-lifecycle"
          node http-generic-api/scripts/e2e-contract-reference-integrity.mjs --base "$EXPECTED_MAIN_SHA" --head "$EXPECTED_CANDIDATE_SHA" --report-file "$report_dir/e2e-contract-reference-integrity.json"
          node http-generic-api/scripts/e2e-contract-git-index-integrity.mjs --report-file "$report_dir/e2e-contract-reference-integrity.json"

          npm run typecheck
          npm test -- --runInBand
          (cd http-generic-api && npm run validate)

          node http-generic-api/scripts/e2e-phase-governance.mjs check --base "$EXPECTED_MAIN_SHA" --head "$EXPECTED_CANDIDATE_SHA" --report-file "$report_dir/e2e-phase-evaluation.json"
          node http-generic-api/scripts/e2e-phase-governance.mjs run --base "$EXPECTED_MAIN_SHA" --head "$EXPECTED_CANDIDATE_SHA" --report-file "$report_dir/e2e-phase-evaluation-run.json" --execution-report-file "$report_dir/e2e-phase-execution.json"

          jq -n --arg base "$EXPECTED_MAIN_SHA" --arg candidate "$EXPECTED_CANDIDATE_SHA" --arg run_id "$GITHUB_RUN_ID" '{contract:"mad4b.repository-write-prerequisite-exact-validation.v6",status:"passed",base_sha:$base,candidate_sha:$candidate,run_id:$run_id,exact_one_commit_topology:true,changed_file_count:10,repository_write_executed:false,production_mutated:false,deployment_executed:false,provider_call_executed:false,credential_payload_read:false,sql_executed:false,migration_apply:false,database_mutated:false,work_map_publication_executed:false,external_send:false,secrets_included:false}' > "$report_dir/summary.json"

      - name: Upload exact validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-write-prerequisite-validation-v6-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/repository-write-prerequisite-v6/
            ${{ runner.temp }}/test-suite-reports/*.json
          if-no-files-found: warn
          retention-days: 14
