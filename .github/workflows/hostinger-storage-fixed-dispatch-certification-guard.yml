name: Hostinger Storage Fixed Dispatch Certification Guard

on:
  pull_request:
    paths:
      - '.changes/e2e/spec014-fixed-dispatch-certification.json'
      - '.github/contracts/spec014/hostinger-storage-fixed-dispatch-certification.json'
      - '.github/workflows/hostinger-storage-fixed-dispatch-certification-guard.yml'
      - 'http-generic-api/hostingerStorageFixedDispatchCertification.js'
      - 'http-generic-api/test-hostinger-storage-fixed-dispatch-certification.mjs'
      - 'http-generic-api/hostingerStorageDedicatedWorkerCertification.js'

permissions:
  contents: read

concurrency:
  group: hostinger-storage-fixed-dispatch-certification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fixed-dispatch-certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check certification syntax
        run: |
          node --check http-generic-api/hostingerStorageDedicatedWorkerCertification.js
          node --check http-generic-api/hostingerStorageFixedDispatchCertification.js
          node --check http-generic-api/test-hostinger-storage-fixed-dispatch-certification.mjs

      - name: Validate fixed dispatch certification
        run: |
          node http-generic-api/test-hostinger-storage-dedicated-worker-certification.mjs
          node http-generic-api/test-hostinger-storage-fixed-dispatch-certification.mjs

      - name: Validate downstream bridge readiness remains fail-closed
        run: node http-generic-api/test-hostinger-storage-durable-tenant-runtime-bridge-readiness.mjs

      - name: Preserve repository-only default-off boundary
        shell: bash
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          ! printf '%s\n' "$changed_files" | grep -E '^http-generic-api/(migrations/|server\.js$|routes/)'
          ! grep -E "from ['\"](?:node:child_process|node:net|node:tls|ssh2)['\"]|\b(exec|execFile|spawn|fork)\s*\(" \
            http-generic-api/hostingerStorageFixedDispatchCertification.js \
            http-generic-api/test-hostinger-storage-fixed-dispatch-certification.mjs
          ! grep -E '\b(providerDispatch|dispatchProvider|resolveCredentialValue|readCredentialValue|connectHostinger|sshConnect|mutateExact|readbackItem)\b' \
            http-generic-api/hostingerStorageFixedDispatchCertification.js
          grep -q 'ready_for_separate_mount_authorization' http-generic-api/hostingerStorageFixedDispatchCertification.js
          grep -q 'dispatch_job_enqueued: false' http-generic-api/hostingerStorageFixedDispatchCertification.js
          grep -q 'worker_invoked: false' http-generic-api/hostingerStorageFixedDispatchCertification.js
          grep -q 'provider_dispatch_allowed: false' http-generic-api/hostingerStorageFixedDispatchCertification.js
          grep -q 'production_ready: false' http-generic-api/hostingerStorageFixedDispatchCertification.js
          grep -q '"dispatch_job_enqueued": false' .github/contracts/spec014/hostinger-storage-fixed-dispatch-certification.json
          grep -q '"provider_dispatch_allowed": false' .github/contracts/spec014/hostinger-storage-fixed-dispatch-certification.json
          grep -q '"production_ready": false' .github/contracts/spec014/hostinger-storage-fixed-dispatch-certification.json
          grep -q '"secrets_included": false' .github/contracts/spec014/hostinger-storage-fixed-dispatch-certification.json
