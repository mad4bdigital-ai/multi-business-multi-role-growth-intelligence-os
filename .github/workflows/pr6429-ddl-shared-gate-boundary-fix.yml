name: PR 6429 DDL shared gate boundary fix

on:
  push:
    branches:
      - gpt/fix/ddl-shared-gate-boundary-20260806

permissions:
  contents: write

concurrency:
  group: pr6429-ddl-shared-gate-boundary-fix
  cancel-in-progress: true

jobs:
  stage-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORK_BRANCH: gpt/fix/ddl-shared-gate-boundary-20260806
      BASE_BRANCH: gpt/github-main-policy-controller-20260805
      BASE_SHA: 4d081fe1d677bbbd440b1d4c2e7eb050332bbfa9
      PERMANENT_WORKFLOW: .github/workflows/hostinger-storage-durable-authorized-injection-schema-ddl-guard.yml
      PERMANENT_TEST: http-generic-api/test-hostinger-storage-durable-authorized-injection-schema-ddl-workflow.mjs
      STAGING_WORKFLOW: .ci-staging/pr6429-hostinger-storage-durable-authorized-injection-schema-ddl-guard.yml
      PATCH_SCRIPT: .github/scripts/pr6429-ddl-shared-gate-boundary-fix.cjs
      BOOTSTRAP_SCRIPT: .github/scripts/pr6429-ddl-shared-gate-boundary-bootstrap.cjs
      TEST_REBUILD_SCRIPT: .github/scripts/pr6429-ddl-shared-gate-test-rebuild.cjs
    steps:
      - name: Checkout exact helper head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          check-latest: false

      - name: Build and validate exact candidate
        shell: bash
        run: |
          set -euo pipefail
          evidence_root="${RUNNER_TEMP}/ddl-shared-gate-boundary-fix"
          mkdir -p "${evidence_root}"

          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git ls-remote --exit-code origin "refs/heads/${WORK_BRANCH}" | awk '{print $1}')" = "${GITHUB_SHA}"
          test "$(git ls-remote --exit-code origin "refs/heads/${BASE_BRANCH}" | awk '{print $1}')" = "${BASE_SHA}"
          git merge-base --is-ancestor "${BASE_SHA}" HEAD
          case "$(node --version)" in v22.*) ;; *) exit 1 ;; esac

          node "${BOOTSTRAP_SCRIPT}" | tee "${evidence_root}/bootstrap.json"
          PATCH_DIAGNOSTIC_PATH="${evidence_root}/patch-diagnostics.txt" node "${PATCH_SCRIPT}"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/hostinger-storage-durable-authorized-injection-schema-ddl-guard.yml')
          source = path.read_text()
          escaped = r'\${'
          count = source.count(escaped)
          if count == 0:
              raise SystemExit('expected generated escaped expressions were not found')
          source = source.replace(escaped, '${')
          if escaped in source:
              raise SystemExit('escaped workflow expressions remain after normalization')
          path.write_text(source)
          print({'ok': True, 'normalized_expression_count': count})
          PY

          BASE_SHA="${BASE_SHA}" node "${TEST_REBUILD_SCRIPT}" | tee "${evidence_root}/test-rebuild.json"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('http-generic-api/test-hostinger-storage-durable-authorized-injection-schema-ddl-workflow.mjs')
          source = path.read_text()
          anchor = "assert.equal(source.includes('git push'), false, 'workflow must not mutate repository state');"
          assertion = "assert.equal(source.includes('\\\\${'), false, 'workflow must not contain escaped GitHub or shell expressions');"
          if source.count(anchor) != 1:
              raise SystemExit('workflow mutation assertion anchor must occur exactly once')
          path.write_text(source.replace(anchor, assertion + '\n' + anchor))
          PY

          node "${PERMANENT_TEST}" | tee "${evidence_root}/workflow-test.json"
          node http-generic-api/test-hostinger-storage-durable-authorized-injection-schema-ddl.mjs | tee "${evidence_root}/ddl-parity-test.json"
          node http-generic-api/scripts/e2e-phase-governance.mjs check --base "${BASE_SHA}" --head HEAD --report-file "${evidence_root}/phase-governance.json"

          mkdir -p "$(dirname "${STAGING_WORKFLOW}")"
          cp "${PERMANENT_WORKFLOW}" "${STAGING_WORKFLOW}"
          sha256sum "${STAGING_WORKFLOW}" "${PERMANENT_TEST}" > "${evidence_root}/staged-file-sha256.txt"
          git checkout "${GITHUB_SHA}" -- "${PERMANENT_WORKFLOW}"
          git rm "${PATCH_SCRIPT}" "${BOOTSTRAP_SCRIPT}" "${TEST_REBUILD_SCRIPT}"
          git add "${STAGING_WORKFLOW}" "${PERMANENT_TEST}"

          expected="$(mktemp)"
          actual="$(mktemp)"
          cat > "${expected}" <<'EOF'
          .ci-staging/pr6429-hostinger-storage-durable-authorized-injection-schema-ddl-guard.yml
          .github/scripts/pr6429-ddl-shared-gate-boundary-bootstrap.cjs
          .github/scripts/pr6429-ddl-shared-gate-boundary-fix.cjs
          .github/scripts/pr6429-ddl-shared-gate-test-rebuild.cjs
          http-generic-api/test-hostinger-storage-durable-authorized-injection-schema-ddl-workflow.mjs
          EOF
          sed -i 's/^          //' "${expected}"
          sort -o "${expected}" "${expected}"
          git diff --cached --name-only | sort > "${actual}"
          diff -u "${expected}" "${actual}"
          git diff --quiet -- "${PERMANENT_WORKFLOW}"
          test ! -e "${PATCH_SCRIPT}"
          test ! -e "${BOOTSTRAP_SCRIPT}"
          test ! -e "${TEST_REBUILD_SCRIPT}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(ci): stage validated DDL guard blob"
          candidate_sha="$(git rev-parse HEAD)"
          printf '{"ok":true,"source_sha":"%s","candidate_sha":"%s","base_sha":"%s","staged_workflow":"%s","secrets_included":false}\n' \
            "${GITHUB_SHA}" "${candidate_sha}" "${BASE_SHA}" "${STAGING_WORKFLOW}" > "${evidence_root}/staging-readback.json"

          test "$(git ls-remote --exit-code origin "refs/heads/${WORK_BRANCH}" | awk '{print $1}')" = "${GITHUB_SHA}"
          test "$(git ls-remote --exit-code origin "refs/heads/${BASE_BRANCH}" | awk '{print $1}')" = "${BASE_SHA}"
          git push origin "HEAD:refs/heads/${WORK_BRANCH}"

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ddl-shared-gate-boundary-stage-${{ github.sha }}
          path: ${{ runner.temp }}/ddl-shared-gate-boundary-fix
          if-no-files-found: warn
          retention-days: 14
