name: Spec 016 Generated Artifact Refresh Bootstrap

on:
  push:
    branches:
      - "gpt/016-remote-mcp-oauth21-main-recovery-20260802"

permissions:
  contents: write

concurrency:
  group: spec016-generated-artifact-refresh-bootstrap
  cancel-in-progress: false

jobs:
  refresh-and-clean:
    if: >-
      github.event.head_commit.message != 'chore(ci): refresh generated contract artifacts' &&
      github.event.head_commit.message != 'chore(ci): remove Spec 016 generated refresh bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_REF: gpt/016-remote-mcp-oauth21-main-recovery-20260802
      OUTPUT_DIR: ${{ runner.temp }}/spec016-generated-artifact-refresh-bootstrap
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Validate bounded target
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" == "${TARGET_REF}" ]]
          [[ "${TARGET_REF}" != "main" && "${TARGET_REF}" != "Production" ]]
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]

      - name: Run registered exact-head refresh tool
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/maintenance-tools/generated-artifact-refresh.mjs \
            --target-ref "${TARGET_REF}" \
            --expected-head-sha "${GITHUB_SHA}" \
            --confirmation "APPLY_GENERATED_ARTIFACT_REFRESH" \
            --output-dir "${OUTPUT_DIR}"
          jq -e '.contract == "mad4b.governed-generated-artifact-refresh.v1" and .outcome == "passed"' \
            "${OUTPUT_DIR}/generated-artifact-refresh-report.json" >/dev/null

      - name: Remove bootstrap from resulting exact head
        shell: bash
        run: |
          set -euo pipefail
          report="${OUTPUT_DIR}/generated-artifact-refresh-report.json"
          result_sha="$(jq -r '.commit_sha // .expected_head_sha' "${report}")"
          [[ "${result_sha}" =~ ^[0-9a-f]{40}$ ]]
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin "refs/heads/${TARGET_REF}" | awk '{print $1}')"
          [[ "${local_sha}" == "${result_sha}" ]]
          [[ "${remote_sha}" == "${result_sha}" ]]
          git rm -- .github/workflows/spec016-generated-artifact-refresh-bootstrap.yml
          git commit -m "chore(ci): remove Spec 016 generated refresh bootstrap"
          cleanup_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin "refs/heads/${TARGET_REF}" | awk '{print $1}')"
          [[ "${remote_sha}" == "${result_sha}" ]]
          git push origin "HEAD:${TARGET_REF}"
          jq --arg cleanup_sha "${cleanup_sha}" '. + {bootstrap_cleanup_sha:$cleanup_sha,bootstrap_removed:true}' \
            "${report}" > "${report}.tmp"
          mv "${report}.tmp" "${report}"

      - name: Upload canonical bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec016-generated-artifact-refresh-bootstrap-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: error
          retention-days: 14
