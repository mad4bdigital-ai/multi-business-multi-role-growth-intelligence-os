name: Spec 011 Frontend Dispatch Refresh Bootstrap

on:
  push:
    branches:
      - gpt/spec011-refresh-frontend-dispatch-current-main-20260730
    paths:
      - .github/spec011-frontend-dispatch-refresh-trigger.json

permissions:
  contents: write

concurrency:
  group: spec011-frontend-dispatch-refresh-bootstrap
  cancel-in-progress: true

jobs:
  refresh-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gpt/spec011-refresh-frontend-dispatch-current-main-20260730
          fetch-depth: 0
          persist-credentials: true

      - name: Merge latest main without rewriting branch history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --no-tags origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Generate and verify bounded frontend dispatch evidence
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          npm run frontend:dispatch:generate -- --baseline-ref=main
          node test-frontend-dispatch-workflow-baseline.mjs
          node test-frontend-operation-governance-generator.mjs
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-openapi-route-coverage.mjs
          npm run openapi:auth:check

      - name: Commit generated-only refresh and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/spec011-frontend-dispatch-refresh-bootstrap.yml
          rm -f .github/spec011-frontend-dispatch-refresh-trigger.json
          python3 - <<'PY'
          import subprocess
          allowed = {
              'http-generic-api/frontend-operation-governance.generated.json',
              'http-generic-api/frontend-surface-dispatch.generated.json',
              'http-generic-api/openapi/frontend-runtime-routes.generated.yaml',
              '.github/workflows/spec011-frontend-dispatch-refresh-bootstrap.yml',
              '.github/spec011-frontend-dispatch-refresh-trigger.json',
          }
          changed = set(filter(None, subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()))
          paths = {line[3:] for line in changed}
          unexpected = paths - allowed
          generated = paths & {
              'http-generic-api/frontend-operation-governance.generated.json',
              'http-generic-api/frontend-surface-dispatch.generated.json',
              'http-generic-api/openapi/frontend-runtime-routes.generated.yaml',
          }
          if unexpected:
              raise SystemExit(f'bounded_write_set_invalid:unexpected={sorted(unexpected)}')
          if not generated:
              raise SystemExit('generated_evidence_was_already_current_or_not_written')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(ci): refresh current-main frontend dispatch evidence"
          git push origin HEAD:gpt/spec011-refresh-frontend-dispatch-current-main-20260730
