name: Exact T016 Readiness Ubuntu 24.04 Validation 5715 Final Draft v5

on:
  pull_request:
    branches: [gpt/validate-t016-readiness-ubuntu2404-base-5715-final-draft-v5]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: exact-t016-readiness-5715-final-draft-v5-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Initialize evidence
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/t016-5715-final-draft-v5-$GITHUB_RUN_ID"
          mkdir -p "$dir/gates" "$dir/reference-integrity" "$dir/repository-tool-lifecycle" "$dir/test-suite-reports"
          echo "EVIDENCE_DIR=$dir" >> "$GITHUB_ENV"
          echo "EXPECTED_HEAD=bb979c1ddae031b145cdc757f64808495a6beb25" >> "$GITHUB_ENV"
          echo "EXPECTED_MAIN=94f9d7867dac7af8875fedbbc585cbf7eee3c037" >> "$GITHUB_ENV"
          echo "EXPECTED_PRE_SYNC=bb6dcde51cab9d0bce18095e15b35fec072bfee2" >> "$GITHUB_ENV"
      - name: Run nine exact gates
        shell: bash
        env:
          TEST_SUITE_REPORT_DIR: ${{ runner.temp }}/t016-5715-final-draft-v5-${{ github.run_id }}/test-suite-reports
        run: |
          set -euo pipefail
          pass(){ touch "$EVIDENCE_DIR/gates/$1.pass"; echo "$1" | tee -a "$EVIDENCE_DIR/passed-gates.txt"; }

          test "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}"
          test "${{ github.event.pull_request.head.ref }}" = "gpt/ops/t016-readiness-current-main-clean-20260803"
          test "${{ github.event.pull_request.head.sha }}" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_PRE_SYNC"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_MAIN"
          test "$(git rev-list --parents -n 1 HEAD | awk '{print NF-1}')" = "2"
          git merge-base --is-ancestor "$EXPECTED_MAIN" "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$EXPECTED_PRE_SYNC" "$EXPECTED_HEAD"
          test "$(git rev-list --count "$EXPECTED_MAIN..$EXPECTED_HEAD")" = "4"
          git diff --name-only "$EXPECTED_MAIN" "$EXPECTED_HEAD" | sort > "$EVIDENCE_DIR/actual-files.txt"
          printf '%s\n' \
            .changes/e2e/sprint69-1043-t016-readiness-path-repair.json \
            .github/ops/sprint69-1043-runtime-readiness-backfill.mjs \
            .github/ops/sprint69-1043-runtime-readiness.mjs \
            .github/workflows/sprint69-1043-runtime-readiness-backfill.yml \
            http-generic-api/routes/adminCliRoutes.js \
            http-generic-api/test-capability-envelope-create-alias-path.mjs \
            http-generic-api/test-sprint69-1043-runtime-readiness-contract.mjs | sort > "$EVIDENCE_DIR/expected-files.txt"
          diff -u "$EVIDENCE_DIR/expected-files.txt" "$EVIDENCE_DIR/actual-files.txt"
          test "$(wc -l < "$EVIDENCE_DIR/actual-files.txt" | tr -d ' ')" = "7"
          git diff --name-status "$EXPECTED_MAIN" "$EXPECTED_HEAD" > "$EVIDENCE_DIR/name-status.tsv"
          pass preflight

          node --check .github/ops/sprint69-1043-runtime-readiness.mjs
          node --check .github/ops/sprint69-1043-runtime-readiness-backfill.mjs
          node --check http-generic-api/routes/adminCliRoutes.js
          (cd http-generic-api && node test-capability-envelope-create-alias-path.mjs)
          (cd http-generic-api && node test-sprint69-1043-runtime-readiness-contract.mjs)
          pass focused

          node http-generic-api/scripts/schema-docs-change-guard.mjs
          node http-generic-api/scripts/migration-placement-guard.mjs
          (cd http-generic-api && node scripts/user-jwt-auth-governance.mjs)
          (cd http-generic-api && node scripts/interruption-readiness.mjs --ci --skip-dependencies --skip-worktree)
          node validate-canonical-sources.mjs
          node build-canonicals.mjs --check
          node --check find-canonical-domain.mjs
          node http-generic-api/scripts/spec-kit-completion-gate.mjs --ci --changed
          node validate-memory-schema.mjs
          git diff --check
          pass syntax

          (cd http-generic-api && node scripts/resource-api-coverage-audit.mjs --ci --changed)
          (cd http-generic-api && node test-resource-api-architecture.mjs)
          (cd http-generic-api && node test-resource-api-service.mjs)
          pass resource_api

          node http-generic-api/test-e2e-contract-reference-integrity.mjs
          node http-generic-api/test-e2e-contract-git-index-integrity.mjs
          node http-generic-api/scripts/e2e-contract-reference-integrity.mjs --base "$EXPECTED_MAIN" --head "$EXPECTED_HEAD" --report-file "$EVIDENCE_DIR/reference-integrity/report.json"
          node http-generic-api/scripts/e2e-contract-git-index-integrity.mjs --report-file "$EVIDENCE_DIR/reference-integrity/report.json"
          pass reference_integrity

          node http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs
          BASE_SHA="$EXPECTED_MAIN" CANDIDATE_SHA="$EXPECTED_HEAD" node http-generic-api/scripts/maintenance-tools/repository-tool-lifecycle-guard.mjs --changed-files "$EVIDENCE_DIR/name-status.tsv" --policy .github/repository-maintenance-tool-governance.json --output-dir "$EVIDENCE_DIR/repository-tool-lifecycle"
          pass lifecycle

          (cd http-generic-api && npm ci && npm test && npm run validate)
          pass api_tests

          npm ci
          npm run typecheck
          npm test -- --runInBand
          pass root_tests

          node http-generic-api/scripts/e2e-phase-governance.mjs check --base "$EXPECTED_MAIN" --head "$EXPECTED_HEAD" --report-file "$EVIDENCE_DIR/e2e-phase-evaluation.json"
          node http-generic-api/scripts/e2e-phase-governance.mjs run --base "$EXPECTED_MAIN" --head "$EXPECTED_HEAD" --report-file "$EVIDENCE_DIR/e2e-phase-evaluation-run.json" --execution-report-file "$EVIDENCE_DIR/e2e-phase-execution.json"
          pass e2e
      - name: Write result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status=pass
          for gate in preflight focused syntax resource_api reference_integrity lifecycle api_tests root_tests e2e; do
            test -f "$EVIDENCE_DIR/gates/$gate.pass" || status=fail
          done
          jq -n --arg status "$status" --arg head "$EXPECTED_HEAD" --arg main "$EXPECTED_MAIN" --arg pre "$EXPECTED_PRE_SYNC" --arg passed "$(tr '\n' ',' < "$EVIDENCE_DIR/passed-gates.txt" 2>/dev/null || true)" '{candidate_pr:5715,candidate_sha:$head,main_sha:$main,pre_sync_sha:$pre,status:$status,history_preserving_reconciliation:true,changed_files:7,commit_count_over_main:4,passed_gates:($passed|split(",")|map(select(length>0))),expected_gate_count:9,runtime_contacted:false,capability_envelope_created:false,apply_authorized:false,migration_apply_executed:false,activation_registry_sync_executed:false,provider_mutation:false,production_mutation:false,credential_access:false,database_mutation:false,repository_mutation_performed:false,secrets_included:false}' > "$EVIDENCE_DIR/result.json"
          cat "$EVIDENCE_DIR/result.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-t016-readiness-5715-final-draft-v5-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 14
      - name: Enforce result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for gate in preflight focused syntax resource_api reference_integrity lifecycle api_tests root_tests e2e; do test -f "$EVIDENCE_DIR/gates/$gate.pass"; done
          test "$(find "$EVIDENCE_DIR/gates" -type f -name '*.pass' | wc -l | tr -d ' ')" = "9"
          test "$(jq -r .status "$EVIDENCE_DIR/result.json")" = pass
          test "$(jq -r .candidate_sha "$EVIDENCE_DIR/result.json")" = "$EXPECTED_HEAD"
          test "$(jq -r .repository_mutation_performed "$EVIDENCE_DIR/result.json")" = false
          test "$(jq -r .secrets_included "$EVIDENCE_DIR/result.json")" = false
