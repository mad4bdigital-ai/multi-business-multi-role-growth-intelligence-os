name: Incident 6426 Repository Policy Controller Bootstrap

on:
  push:
    branches:
      - gpt/incident-6426/repository-policy-controller-93430fd5-20260805

permissions:
  contents: write

concurrency:
  group: incident-6426-policy-controller-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact bootstrap head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify immutable bootstrap identity
        shell: bash
        env:
          EXPECTED_BRANCH: gpt/incident-6426/repository-policy-controller-93430fd5-20260805
          EXPECTED_MAIN_SHA: 93430fd5e709f49d7a47e2830382b6578a7a22e6
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse "$EXPECTED_MAIN_SHA")" = "$EXPECTED_MAIN_SHA"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Apply bounded repository policy controller patch
        shell: bash
        env:
          PATCH_SCRIPT_B64: ...