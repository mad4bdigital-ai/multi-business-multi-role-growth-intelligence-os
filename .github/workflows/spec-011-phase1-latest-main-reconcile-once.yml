name: Spec 011 Phase1 Latest Main Reconcile Once

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.ref == 'gpt/spec-011-phase1-durable-control-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out governed PR head
        uses: actions/checkout@v5
        with:
          ref: gpt/spec-011-phase1-durable-control-20260730
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Finalize manifest on latest remote head
        shell: bash
        run: |
          set -euo pipefail
          branch='gpt/spec-011-phase1-durable-control-20260730'

          patch_manifest() {
            python3 - <<'PY'
          from pathlib import Path

          path = Path('http-generic-api/scripts/test-manifest.mjs')
          lines = path.read_text().splitlines()
          command = '  "node test-durable-execution-control-service.mjs",'
          if command not in lines:
              close_index = max(i for i, line in enumerate(lines) if line.strip() == '];')
              previous = close_index - 1
              while previous >= 0 and not lines[previous].strip():
                  previous -= 1
              if previous < 0:
                  raise SystemExit('test manifest has no insertion predecessor')
              if not lines[previous].rstrip().endswith(','):
                  lines[previous] = lines[previous].rstrip() + ','
              lines.insert(close_index, command)
              path.write_text('\n'.join(lines) + '\n')
          PY
          }

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          for attempt in 1 2 3; do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            patch_manifest
            rm -f .github/workflows/spec-011-phase1-latest-main-reconcile-once.yml

            cd http-generic-api
            node --check durableExecutionControlService.js
            node --check routes/plannerRoutes.js
            node --check scripts/test-manifest.mjs
            node test-durable-execution-control-service.mjs
            node test-test-manifest-runner.mjs
            node test-frontend-surface-dispatch.mjs
            node test-frontend-auth-openapi-parity.mjs
            cd ..

            changed="$(git status --porcelain --untracked-files=all | sed -E 's/^...//')"
            bad="$(printf '%s\n' "$changed" | grep -Ev '^(http-generic-api/scripts/test-manifest.mjs|.github/workflows/spec-011-phase1-latest-main-reconcile-once.yml)$' || true)"
            test -z "$bad" || { echo 'Unexpected finalizer paths:'; echo "$bad"; exit 1; }

            git add -A
            git diff --cached --quiet && exit 0
            git commit -m 'fix(spec-011): finalize latest-main durable control manifest'
            if git push origin HEAD:"$branch"; then
              exit 0
            fi
            echo "Push raced on attempt $attempt; retrying from latest remote head."
          done

          echo 'Unable to finalize after three race-safe attempts.'
          exit 1
