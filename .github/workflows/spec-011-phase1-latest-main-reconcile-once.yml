name: Spec 011 Phase1 Latest Main Reconcile Once

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.ref == 'gpt/spec-011-phase1-durable-control-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out governed PR head
        uses: actions/checkout@v5
        with:
          ref: gpt/spec-011-phase1-durable-control-20260730
          fetch-depth: 0
          persist-credentials: true

      - name: Register focused test additively
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('http-generic-api/scripts/test-manifest.mjs')
          lines = path.read_text().splitlines()
          command = '  "node test-durable-execution-control-service.mjs",'
          if command not in lines:
              close_index = max(i for i, line in enumerate(lines) if line.strip() == '];')
              previous = close_index - 1
              while previous >= 0 and not lines[previous].strip():
                  previous -= 1
              if previous < 0:
                  raise SystemExit('test manifest has no insertion predecessor')
              if not lines[previous].rstrip().endswith(','):
                  lines[previous] = lines[previous].rstrip() + ','
              lines.insert(close_index, command)
              path.write_text('\n'.join(lines) + '\n')
          PY

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Verify focused source contracts
        working-directory: http-generic-api
        run: |
          node --check durableExecutionControlService.js
          node --check routes/plannerRoutes.js
          node --check scripts/test-manifest.mjs
          node test-durable-execution-control-service.mjs
          node test-test-manifest-runner.mjs

      - name: Generate bounded artifacts from latest main
        working-directory: http-generic-api
        run: |
          git fetch origin main --depth=1
          node scripts/openapi-precise-contract-registry-sync.mjs --write
          node scripts/openapi-autofill-missing-routes.mjs --write
          npm run frontend:dispatch:generate -- --baseline-ref=main
          node scripts/generate-custom-gpt-schemas.mjs --write

      - name: Verify generated contracts
        working-directory: http-generic-api
        run: |
          node test-openapi-autofill-missing-routes.mjs
          node test-frontend-operation-governance-generator.mjs
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-openapi-route-coverage.mjs
          npm run openapi:auth:check
          npm run schemas:guard

      - name: Enforce bounded write set
        shell: bash
        run: |
          allowed='^(http-generic-api/scripts/test-manifest.mjs|http-generic-api/openapi.yaml|http-generic-api/frontend-operation-governance.generated.json|http-generic-api/frontend-surface-dispatch.generated.json|http-generic-api/openapi/frontend-runtime-routes.generated.yaml|http-generic-api/openapi/openapi.custom-gpt.auth-dispatcher.yaml|http-generic-api/openapi/openapi.custom-gpt.activation-admin.yaml|http-generic-api/openapi/openapi.tenant-gpt.auth.yaml|http-generic-api/openapi/openapi.tenant-gpt.activation.yaml|http-generic-api/openapi.gpt-action.local-connector.yaml)$'
          bad="$(git status --porcelain --untracked-files=all | sed -E 's/^...//' | grep -Ev "$allowed" || true)"
          test -z "$bad" || { echo 'Unexpected generated paths:'; echo "$bad"; exit 1; }

      - name: Commit clean reconciled output
        shell: bash
        run: |
          rm -f .github/workflows/spec-011-phase1-latest-main-reconcile-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix(spec-011): reconcile durable control with latest main'
          git push origin HEAD:gpt/spec-011-phase1-durable-control-20260730
