name: Temporary Work Map Impact 657af2d0

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: tmp-work-map-impact-657af2d0-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TARGET_SHA: 657af2d0ede22143924493b6d3107f876bc518ec

jobs:
  impact:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact candidate tree
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable identity
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
          printf 'target_sha=%s\n' "$actual"

      - name: Generate twice and prove deterministic bounded impact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/work-map-impact"
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          git diff --binary -- docs/work-maps > "$RUNNER_TEMP/work-map-impact/first.patch"
          git diff --name-only | sort > "$RUNNER_TEMP/work-map-impact/changed-files.txt"
          first_hash="$(sha256sum "$RUNNER_TEMP/work-map-impact/first.patch" | awk '{print $1}' | tr -d '\\')"

          unexpected="$(git diff --name-only | grep -Ev '^(docs/work-maps/README\.md|docs/work-maps/repository-automation-map\.md)$' || true)"
          test -z "$unexpected"

          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          git diff --binary -- docs/work-maps > "$RUNNER_TEMP/work-map-impact/second.patch"
          second_hash="$(sha256sum "$RUNNER_TEMP/work-map-impact/second.patch" | awk '{print $1}' | tr -d '\\')"
          test "$first_hash" = "$second_hash"
          cmp "$RUNNER_TEMP/work-map-impact/first.patch" "$RUNNER_TEMP/work-map-impact/second.patch"

          cp docs/work-maps/README.md "$RUNNER_TEMP/work-map-impact/README.md"
          cp docs/work-maps/repository-automation-map.md "$RUNNER_TEMP/work-map-impact/repository-automation-map.md"
          git diff --numstat -- docs/work-maps > "$RUNNER_TEMP/work-map-impact/numstat.txt"
          printf 'target_sha=%s\nfirst_hash=%s\nsecond_hash=%s\n' "$TARGET_SHA" "$first_hash" "$second_hash" | tee "$RUNNER_TEMP/work-map-impact/summary.txt"
          cat "$RUNNER_TEMP/work-map-impact/changed-files.txt"
          cat "$RUNNER_TEMP/work-map-impact/numstat.txt"

      - name: Upload deterministic evidence
        uses: actions/upload-artifact@v4
        with:
          name: work-map-impact-657af2d0-${{ github.run_id }}
          path: ${{ runner.temp }}/work-map-impact
          if-no-files-found: error
          retention-days: 7
