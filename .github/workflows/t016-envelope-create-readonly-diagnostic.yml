name: T016 Envelope Create Read-only Diagnostic

on:
  push:
    branches:
      - agent/validate-t016-readiness-artifact-base-435c001
    paths:
      - '.github/workflows/t016-envelope-create-readonly-diagnostic.yml'
      - '.github/ops/t016-envelope-readonly-diagnostic.mjs'

permissions:
  contents: read
  issues: write

concurrency:
  group: t016-envelope-readonly-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    name: Diagnose envelope schema and resolver without writes
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      RUNTIME_BASE_URL: https://auth.mad4b.com
      BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      ISSUE_NUMBER: '4449'
      PRODUCTION_SHA: 2669991a882c7f7939510fbbace17f462a42517c
      REPORT_DIR: /tmp/t016-envelope-readonly-diagnostic-${{ github.run_id }}
    steps:
      - name: Checkout trusted diagnostic branch
        uses: actions/checkout@v5
        with:
          ref: agent/validate-t016-readiness-artifact-base-435c001
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Run and publish bounded read-only diagnostic
        run: node .github/ops/t016-envelope-readonly-diagnostic.mjs

      - name: Upload no-secret read-only diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t016-envelope-create-readonly-diagnostic-${{ github.run_id }}
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: error
          retention-days: 30
