name: PR 6470 Atomic Work Map Refresh And Seal Helper

on:
  push:
    branches:
      - gpt/generated/pr6429-work-map-refresh-20260806
    paths:
      - .github/workflows/pr6470-work-map-binding-refresh-helper.yml

permissions:
  contents: write

jobs:
  refresh-and-seal:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact helper branch
        uses: actions/checkout@v5
        with:
          ref: gpt/generated/pr6429-work-map-refresh-20260806
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Generate and validate Work Maps on the final tree
        shell: bash
        run: |
          set -euo pipefail
          helper='.github/workflows/pr6470-work-map-binding-refresh-helper.yml'
          readme='docs/work-maps/README.md'
          domain_map='docs/work-maps/data-model-domain-map.md'
          coverage='docs/work-maps/work-map-coverage-matrix.md'

          test -f "${helper}"
          rm "${helper}"
          test ! -e "${helper}"

          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          node http-generic-api/scripts/platform-work-map-generator.mjs --check

          changed="$(git diff --name-only | LC_ALL=C sort)"
          for required in "${helper}" "${readme}" "${domain_map}" "${coverage}"; do
            printf '%s\n' "${changed}" | grep -Fx "${required}"
          done
          unexpected="$(printf '%s\n' "${changed}" | grep -Fvx \
            -e "${helper}" \
            -e "${readme}" \
            -e "${domain_map}" \
            -e "${coverage}" || true)"
          if [[ -n "${unexpected}" ]]; then
            echo 'Unexpected generated-tree changes:'
            printf '%s\n' "${unexpected}"
            exit 1
          fi

          node http-generic-api/scripts/work-map-schema-classification-contract.mjs
          node http-generic-api/scripts/work-map-schema-classification.mjs
          node http-generic-api/scripts/spec-kit-work-map-governance-gate.mjs --ci --changed

      - name: Seal Spec 014 binding and prove final readback
        shell: bash
        run: |
          set -euo pipefail
          helper='.github/workflows/pr6470-work-map-binding-refresh-helper.yml'
          readme='docs/work-maps/README.md'
          domain_map='docs/work-maps/data-model-domain-map.md'
          coverage='docs/work-maps/work-map-coverage-matrix.md'
          manifest='specs/014-governed-hostinger-storage-orchestration/work-map-integration.json'
          tasks='specs/014-governed-hostinger-storage-orchestration/tasks.md'

          test ! -e "${helper}"
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs

          changed="$(git diff --name-only | LC_ALL=C sort)"
          for required in "${helper}" "${readme}" "${domain_map}" "${coverage}" "${manifest}"; do
            printf '%s\n' "${changed}" | grep -Fx "${required}"
          done
          unexpected="$(printf '%s\n' "${changed}" | grep -Fvx \
            -e "${helper}" \
            -e "${readme}" \
            -e "${domain_map}" \
            -e "${coverage}" \
            -e "${manifest}" \
            -e "${tasks}" || true)"
          if [[ -n "${unexpected}" ]]; then
            echo 'Unexpected sealed-tree changes:'
            printf '%s\n' "${unexpected}"
            exit 1
          fi

          report="${RUNNER_TEMP}/spec014-final-work-map-readback.json"
          REPORT_PATH="${report}" node http-generic-api/scripts/spec014-final-work-map-readback.mjs
          node - "${report}" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!report.ok || report.findings.length !== 0 || report.secrets_included !== false) {
            throw new Error(`Final Work Map readback failed: ${JSON.stringify(report.findings)}`);
          }
          NODE

      - name: Commit final maps, binding, and helper deletion atomically
        shell: bash
        run: |
          set -euo pipefail
          helper='.github/workflows/pr6470-work-map-binding-refresh-helper.yml'
          readme='docs/work-maps/README.md'
          domain_map='docs/work-maps/data-model-domain-map.md'
          coverage='docs/work-maps/work-map-coverage-matrix.md'
          manifest='specs/014-governed-hostinger-storage-orchestration/work-map-integration.json'
          tasks='specs/014-governed-hostinger-storage-orchestration/tasks.md'

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "${helper}" "${readme}" "${domain_map}" "${coverage}" "${manifest}" "${tasks}"

          staged="$(git diff --cached --name-only | LC_ALL=C sort)"
          for required in "${helper}" "${readme}" "${domain_map}" "${coverage}" "${manifest}"; do
            printf '%s\n' "${staged}" | grep -Fx "${required}"
          done
          unexpected="$(printf '%s\n' "${staged}" | grep -Fvx \
            -e "${helper}" \
            -e "${readme}" \
            -e "${domain_map}" \
            -e "${coverage}" \
            -e "${manifest}" \
            -e "${tasks}" || true)"
          if [[ -n "${unexpected}" ]]; then
            echo 'Unexpected staged final-tree changes:'
            printf '%s\n' "${unexpected}"
            exit 1
          fi

          git diff --cached --check
          git commit -m "docs(work-maps): refresh and seal PR 6429 exact-head maps"
          git push origin HEAD:gpt/generated/pr6429-work-map-refresh-20260806
