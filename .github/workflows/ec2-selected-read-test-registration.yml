name: EC2 Selected Read Test Registration

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ec2-selected-read-test-registration
  cancel-in-progress: false

jobs:
  register:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'gpt/spec-012-ec2-selected-read-pilot-20260730'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v5
        with:
          ref: gpt/spec-012-ec2-selected-read-pilot-20260730
          fetch-depth: 0

      - name: Repair response parity assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('http-generic-api/test-execution-capsule-selected-read-pilot.mjs')
          text = path.read_text()
          replacements = {
              'assert.deepEqual(pilotTenantResponse, baselineTenantResponse);': '''assert.equal(pilotTenantResponse.statusCode, baselineTenantResponse.statusCode);\nassert.deepEqual(pilotTenantResponse.body, baselineTenantResponse.body);''',
              'assert.deepEqual(pilotAdminResponse, baselineAdminResponse);': '''assert.equal(pilotAdminResponse.statusCode, baselineAdminResponse.statusCode);\nassert.deepEqual(pilotAdminResponse.body, baselineAdminResponse.body);''',
              'assert.deepEqual(rollbackResponse, baselineTenantResponse);': '''assert.equal(rollbackResponse.statusCode, baselineTenantResponse.statusCode);\nassert.deepEqual(rollbackResponse.body, baselineTenantResponse.body);''',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected assertion: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Register EC2 test exactly once
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('http-generic-api/scripts/test-manifest.mjs')
          text = path.read_text()
          entry = '  "node test-execution-capsule-selected-read-pilot.mjs",\n'
          anchor = '  "node test-execution-capsule-shadow-composition.mjs",\n'
          if text.count(entry) != 0:
              raise SystemExit('EC2 command already registered before bounded registration')
          if text.count(anchor) != 1:
              raise SystemExit('canonical EC1 registration anchor is not unique')
          text = text.replace(anchor, anchor + entry, 1)
          path.write_text(text)
          if path.read_text().count(entry) != 1:
              raise SystemExit('EC2 command registration count is not exactly one')
          PY

      - name: Run bounded EC0 EC1 EC2 regressions
        working-directory: http-generic-api
        run: |
          node test-execution-capsule-contract.mjs
          node test-execution-capsule-shadow-adapter.mjs
          node test-execution-capsule-shadow-composition.mjs
          node test-execution-capsule-selected-read-pilot.mjs
          node test-context-kernel-api-projection.mjs

      - name: Remove one-shot workflow and verify write set
        run: |
          rm .github/workflows/ec2-selected-read-test-registration.yml
          python - <<'PY'
          import subprocess

          changed = sorted(subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True
          ).splitlines())
          expected = sorted([
              '.github/workflows/ec2-selected-read-test-registration.yml',
              'http-generic-api/scripts/test-manifest.mjs',
              'http-generic-api/test-execution-capsule-selected-read-pilot.mjs',
          ])
          if changed != expected:
              raise SystemExit(f'unexpected write set: {changed}')
          PY

      - name: Commit bounded EC2 registration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ec2-selected-read-test-registration.yml \
            http-generic-api/scripts/test-manifest.mjs \
            http-generic-api/test-execution-capsule-selected-read-pilot.mjs
          git commit -m "test(spec-012): register EC2 selected read pilot"
          git push origin HEAD:gpt/spec-012-ec2-selected-read-pilot-20260730
