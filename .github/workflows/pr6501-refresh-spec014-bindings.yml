name: PR 6501 Refresh Spec 014 Bindings

on:
  push:
    branches:
      - fix/transport-response-schema-promotion-readiness-v2-20260806
    paths:
      - .github/workflows/pr6501-refresh-spec014-bindings.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: pr6501-refresh-spec014-bindings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Refresh only the two stale Spec 014 bindings
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import { buildEffectiveWorkMapRegistry } from "./http-generic-api/scripts/spec-kit-work-map-governance-gate.mjs";

          const expected = {
            fingerprint: "d8fff3801dbe57d0fc6bc2b59026811a339f8f601f1b061187f1caf4f70d54e1",
            index_source_hash: "278f8215a431a3b897e4cf35cf2d35023c5db20ab6116fe8c6ae7d30ff53ed15",
            coverage_source_hash: "94f80f821614acd525a093ebb84b5de0d7811c2428784fc155a43be8a6131379",
          };
          const targets = [
            "specs/014-governed-hostinger-storage-orchestration/work-map-integration.json",
            "specs/014-retail-commerce-operations-growth-os/work-map-integration.json",
          ];

          const { effectiveRegistry } = buildEffectiveWorkMapRegistry({ root: process.cwd() });
          const calculated = {
            fingerprint: effectiveRegistry.fingerprint,
            index_source_hash: effectiveRegistry.signature.index_source_hash,
            coverage_source_hash: effectiveRegistry.signature.coverage_source_hash,
          };
          if (JSON.stringify(calculated) !== JSON.stringify(expected)) {
            throw new Error(`Exact-head registry differs from the gate diagnostic: ${JSON.stringify({ expected, calculated })}`);
          }
          if (effectiveRegistry.maps.length !== 19 || effectiveRegistry.domains.length !== 16) {
            throw new Error(`Unexpected registry shape maps=${effectiveRegistry.maps.length} domains=${effectiveRegistry.domains.length}`);
          }
          if (effectiveRegistry.uncategorized_objects.length !== 0 || effectiveRegistry.taxonomy_gap_clusters.length !== 0) {
            throw new Error("Registry contains unresolved objects or taxonomy gaps");
          }

          for (const target of targets) {
            const absolute = path.resolve(target);
            const document = JSON.parse(fs.readFileSync(absolute, "utf8"));
            if (!targets.includes(`specs/${document.feature_key}/work-map-integration.json`)) {
              throw new Error(`Unexpected feature identity in ${target}: ${document.feature_key}`);
            }
            if (document.review_state !== "ready_for_implementation") {
              throw new Error(`Ineligible review state in ${target}: ${document.review_state}`);
            }
            document.registry = {
              fingerprint: calculated.fingerprint,
              index_source_hash: calculated.index_source_hash,
              coverage_source_hash: calculated.coverage_source_hash,
              map_count: effectiveRegistry.maps.length,
              domain_count: effectiveRegistry.domains.length,
              uncategorized_count: effectiveRegistry.uncategorized_objects.length,
              taxonomy_gap_cluster_count: effectiveRegistry.taxonomy_gap_clusters.length,
            };
            fs.writeFileSync(absolute, `${JSON.stringify(document, null, 2)}\n`);
          }
          NODE

          changed="$(git diff --name-only)"
          expected_changed=$'specs/014-governed-hostinger-storage-orchestration/work-map-integration.json\nspecs/014-retail-commerce-operations-growth-os/work-map-integration.json'
          test "${changed}" = "${expected_changed}"

          # The generated repository automation map inventories workflow files.
          # Remove this one-shot writer from the working tree before currentness validation.
          git rm .github/workflows/pr6501-refresh-spec014-bindings.yml

      - name: Validate generated maps, classification, and governed Spec bindings
        shell: bash
        env:
          WORK_MAP_CHANGED_FILES_JSON: '["specs/014-governed-hostinger-storage-orchestration/work-map-integration.json","specs/014-retail-commerce-operations-growth-os/work-map-integration.json"]'
        run: |
          set -euo pipefail
          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          node http-generic-api/scripts/work-map-schema-classification-contract.mjs
          node http-generic-api/scripts/work-map-schema-classification.mjs
          node http-generic-api/scripts/spec-kit-work-map-governance-gate.mjs --changed

      - name: Commit bounded repair
        id: publish
        shell: bash
        env:
          TARGET_BRANCH: fix/transport-response-schema-promotion-readiness-v2-20260806
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            specs/014-governed-hostinger-storage-orchestration/work-map-integration.json \
            specs/014-retail-commerce-operations-growth-os/work-map-integration.json

          staged="$(git diff --cached --name-only)"
          expected_staged=$'.github/workflows/pr6501-refresh-spec014-bindings.yml\nspecs/014-governed-hostinger-storage-orchestration/work-map-integration.json\nspecs/014-retail-commerce-operations-growth-os/work-map-integration.json'
          test "${staged}" = "${expected_staged}"

          git commit -m "fix(work-map): refresh Spec 014 registry bindings"
          remote_head="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${GITHUB_SHA}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          result_head="$(git rev-parse HEAD)"
          test "$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${result_head}"
          echo "result_head=${result_head}" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact-head verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: fix/transport-response-schema-promotion-readiness-v2-20260806
          RESULT_HEAD: ${{ steps.publish.outputs.result_head }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RESULT_HEAD}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${RESULT_HEAD}"
          gh workflow run ci.yml --ref "${TARGET_BRANCH}"
          gh workflow run spec-kit-work-map-integration.yml --ref "${TARGET_BRANCH}"
          gh workflow run hostinger-storage-final-work-map-readback-guard.yml --ref "${TARGET_BRANCH}"
