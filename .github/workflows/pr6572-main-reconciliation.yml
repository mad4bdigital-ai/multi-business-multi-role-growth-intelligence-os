name: PR 6572 Main Reconciliation

on:
  push:
    branches:
      - docs/migration-1042-surface-contract-remediation-20260807

permissions:
  contents: write

concurrency:
  group: pr6572-main-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_PARENT_SHA: 01c0e9c3c52b3c154c997375497a55d1fd4bfb1b
      EXPECTED_MAIN_SHA: c6ef3287182e4ab6b776aa5407dc54fca6d98ce9
      TARGET_BRANCH: docs/migration-1042-surface-contract-remediation-20260807
      HELPER_PATH: .github/workflows/pr6572-main-reconciliation.yml
    steps:
      - name: Checkout exact reconciliation head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: docs/migration-1042-surface-contract-remediation-20260807

      - name: Validate immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT_SHA}"
          branch_remote="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          main_remote="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test "${branch_remote}" = "${GITHUB_SHA}"
          test "${main_remote}" = "${EXPECTED_MAIN_SHA}"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${EXPECTED_MAIN_SHA}"

      - name: Merge main fail-closed and preserve generated surfaces
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          set +e
          git merge --no-commit --no-ff "${EXPECTED_MAIN_SHA}"
          merge_status=$?
          set -e

          mapfile -t unmerged < <(git diff --name-only --diff-filter=U | sort)
          if [[ ${#unmerged[@]} -gt 0 ]]; then
            for path in "${unmerged[@]}"; do
              case "$path" in
                docs/work-maps/README.md|specs/014-governed-hostinger-storage-orchestration/work-map-integration.json|specs/014-retail-commerce-operations-growth-os/work-map-integration.json) ;;
                *) echo "Unexpected merge conflict: $path" >&2; exit 1 ;;
              esac
            done
          elif [[ ${merge_status} -ne 0 ]]; then
            echo "Merge failed without classifiable conflicts" >&2
            exit 1
          fi

          for path in \
            docs/work-maps/README.md \
            specs/014-governed-hostinger-storage-orchestration/work-map-integration.json \
            specs/014-retail-commerce-operations-growth-os/work-map-integration.json; do
            git checkout "${GITHUB_SHA}" -- "$path"
            git add "$path"
          done

          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --quiet "${GITHUB_SHA}" -- \
            docs/work-maps/README.md \
            specs/014-governed-hostinger-storage-orchestration/work-map-integration.json \
            specs/014-retail-commerce-operations-growth-os/work-map-integration.json

          git rm -f "${HELPER_PATH}"
          git commit -m 'chore: reconcile current main into Migration 1042 remediation'

      - name: Verify bounded merge result
        id: result
        shell: bash
        run: |
          set -euo pipefail
          result_head="$(git rev-parse HEAD)"
          echo "result_head=${result_head}" >> "$GITHUB_OUTPUT"
          test "$(git rev-parse HEAD^1)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^2)" = "${EXPECTED_MAIN_SHA}"
          test ! -e "${HELPER_PATH}"

          mapfile -t changed < <(git diff --name-only "${EXPECTED_MAIN_SHA}..HEAD" | sort)
          test "${#changed[@]}" -eq 12
          expected=$(cat <<'EOF'
.changes/e2e/migration-1042-surface-contract-remediation.json
docs/work-maps/README.md
docs/work-maps/data-model-domain-map.md
docs/work-maps/delivery-support-map.md
docs/work-maps/observability-release-map.md
docs/work-maps/work-map-coverage-matrix.md
http-generic-api/migrations/1042_sprint69_support_ticket_lifecycle_sla_dedupe.sql
http-generic-api/scripts/surface-contract-auto-remediator.mjs
http-generic-api/test-migration-1042-rerun-safety.mjs
http-generic-api/test-surface-contract-auto-remediation.mjs
specs/014-governed-hostinger-storage-orchestration/work-map-integration.json
specs/014-retail-commerce-operations-growth-os/work-map-integration.json
EOF
)
          actual="$(printf '%s\n' "${changed[@]}")"
          test "${actual}" = "${expected}"

      - name: Push fast-forward after remote readback
        shell: bash
        run: |
          set -euo pipefail
          result_head="${{ steps.result.outputs.result_head }}"
          branch_remote="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          main_remote="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test "${branch_remote}" = "${GITHUB_SHA}"
          test "${main_remote}" = "${EXPECTED_MAIN_SHA}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          remote_after="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_after}" = "${result_head}"

      - name: Publish reconciliation evidence
        if: always()
        shell: bash
        run: |
          {
            echo "contract=mad4b.pr6572-main-reconciliation.v1"
            echo "source_head=${GITHUB_SHA}"
            echo "expected_parent=${EXPECTED_PARENT_SHA}"
            echo "expected_main=${EXPECTED_MAIN_SHA}"
            echo "result_head=${{ steps.result.outputs.result_head }}"
            echo "generated_overlap_content_changed=false"
            echo "force_push=false"
            echo "migration_apply=false"
            echo "live_database_access=false"
            echo "provider_dispatch=false"
            echo "production_mutation=false"
          } >> "$GITHUB_STEP_SUMMARY"
