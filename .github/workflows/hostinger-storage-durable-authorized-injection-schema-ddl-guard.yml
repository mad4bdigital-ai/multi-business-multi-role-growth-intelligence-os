name: Hostinger Storage Durable Authorized Injection Schema DDL Guard

on:
  pull_request:
    paths:
      - '.changes/e2e/spec014-durable-authorized-injection-schema-ddl.json'
      - '.changes/e2e/spec014-durable-authorized-injection-schema-ddl-rollup-boundary.json'
      - '.github/contracts/spec014/hostinger-storage-durable-authorized-injection-state.json'
      - '.github/contracts/spec014/sql/hostinger-storage-durable-authorized-injection-state.sql'
      - '.github/workflows/hostinger-storage-durable-authorized-injection-schema-ddl-guard.yml'
      - 'http-generic-api/scripts/e2e-parallel-pr-gate.mjs'
      - 'http-generic-api/test-hostinger-storage-durable-authorized-injection-schema-ddl.mjs'
      - 'http-generic-api/test-hostinger-storage-durable-authorized-injection-schema-ddl-workflow.mjs'

permissions:
  contents: read

concurrency:
  group: hostinger-storage-durable-authorized-injection-schema-ddl-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  durable-authorized-injection-schema-ddl:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REPORT_DIR: .ci-evidence/spec014-durable-authorized-injection-schema-ddl
      DDL_FILE: .github/contracts/spec014/sql/hostinger-storage-durable-authorized-injection-state.sql
      CONTRACT_FILE: .github/contracts/spec014/hostinger-storage-durable-authorized-injection-state.json
      PHASE_CONTRACT: specs/014-governed-hostinger-storage-orchestration/e2e-phases.json
      PARALLEL_PR_GATE: http-generic-api/scripts/e2e-parallel-pr-gate.mjs
      MODULE_FILE: http-generic-api/hostingerStorageDurableAuthorizedInjectionState.js
      TEST_FILE: http-generic-api/test-hostinger-storage-durable-authorized-injection-schema-ddl.mjs
      WORKFLOW_TEST_FILE: http-generic-api/test-hostinger-storage-durable-authorized-injection-schema-ddl-workflow.mjs
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Classify governed candidate mode
        id: candidate_mode
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { join } from 'node:path';

          const raw = readFileSync(process.env.PHASE_CONTRACT, 'utf8');
          const contract = JSON.parse(raw);
          const governedContract = contract.feature_key === '014-governed-hostinger-storage-orchestration'
            && contract.delivery_mode === 'multi_pr'
            && contract.parallel_work?.enabled === true
            && contract.parallel_work?.merge_policy === 'workstream_commits_then_e2e_rollup'
            && contract.parallel_work?.no_partial_feature_merge === true;
          const isGovernedRollup = process.env.BASE_REF === 'main' && governedContract;
          const sameRepository = process.env.HEAD_REPOSITORY === process.env.REPOSITORY;
          const productionTarget = process.env.BASE_REF === 'Production';
          const acceptedReleaseIdentities = new Set([
            'protected_main',
            'immutable_main_snapshot',
            'history_preserving_main_reconciliation',
          ]);

          let promotionReport = {};
          let promotionGateOutcome = 'not_applicable';
          if (productionTarget && sameRepository && governedContract) {
            const promotionReportPath = join(process.env.RUNNER_TEMP, 'canonical-production-promotion.json');
            try {
              execFileSync(
                process.execPath,
                [
                  process.env.PARALLEL_PR_GATE,
                  'check',
                  '--base', process.env.BASE_SHA,
                  '--head', process.env.HEAD_SHA,
                  '--head-ref', process.env.HEAD_REF,
                  '--base-ref', process.env.BASE_REF,
                  '--report-file', promotionReportPath,
                ],
                { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] },
              );
              promotionReport = JSON.parse(readFileSync(promotionReportPath, 'utf8'));
              promotionGateOutcome = 'success';
            } catch (error) {
              promotionGateOutcome = 'failure';
              try {
                promotionReport = JSON.parse(readFileSync(promotionReportPath, 'utf8'));
              } catch {
                promotionReport = {};
              }
              const diagnostic = error?.stderr?.toString?.() || error?.message || 'canonical promotion gate failed';
              throw new Error(`canonical Production promotion classification failed: ${diagnostic}`);
            }
          }

          const releaseIdentity = String(promotionReport.production_promotion_identity || 'none');
          const canonicalPromotionValidated = promotionGateOutcome === 'success'
            && promotionReport.ok === true
            && promotionReport.production_promotion === true
            && acceptedReleaseIdentities.has(releaseIdentity);
          const isGovernedRelease = productionTarget
            && sameRepository
            && governedContract
            && canonicalPromotionValidated;
          const mode = isGovernedRollup ? 'integration' : isGovernedRelease ? 'release' : 'feature';
          const modeSource = isGovernedRelease
            ? 'canonical_e2e_parallel_pr_gate'
            : 'governed_phase_contract';
          const phaseEvaluationBase = String(promotionReport.phase_evaluation_base || '');
          const immutableReleaseSourceInMain = releaseIdentity === 'immutable_main_snapshot';
          const digest = createHash('sha256').update(raw).digest('hex');

          appendFileSync(process.env.GITHUB_OUTPUT, `candidate_mode=${mode}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `candidate_mode_source=${modeSource}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `release_identity=${isGovernedRelease ? releaseIdentity : 'none'}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `canonical_promotion_validated=${canonicalPromotionValidated}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `promotion_gate_outcome=${promotionGateOutcome}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `promotion_phase_evaluation_base=${phaseEvaluationBase}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `immutable_release_source_in_main=${immutableReleaseSourceInMain}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `phase_contract_digest=${digest}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `feature_key=${String(contract.feature_key || '')}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `delivery_mode=${String(contract.delivery_mode || '')}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `merge_policy=${String(contract.parallel_work?.merge_policy || '')}\n`);
          NODE

      - name: Check DDL parity and workflow regression syntax
        id: syntax
        continue-on-error: true
        run: |
          node --check "${PARALLEL_PR_GATE}"
          node --check "${TEST_FILE}"
          node --check "${WORKFLOW_TEST_FILE}"

      - name: Execute canonical Module to DDL parity contract
        id: focused_test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${REPORT_DIR}"
          node "${TEST_FILE}" \
            > "${REPORT_DIR}/focused-test.stdout" \
            2> "${REPORT_DIR}/focused-test.stderr"

      - name: Validate rollup-aware workflow contract
        id: workflow_contract
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${REPORT_DIR}"
          node "${WORKFLOW_TEST_FILE}" \
            > "${REPORT_DIR}/workflow-test.stdout" \
            2> "${REPORT_DIR}/workflow-test.stderr"

      - name: Preserve contract-local authority boundary
        id: boundary
        continue-on-error: true
        env:
          CANDIDATE_MODE: ${{ steps.candidate_mode.outputs.candidate_mode }}
        shell: bash
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          allowed='^(\.changes/e2e/spec014-durable-authorized-injection-schema-ddl(-rollup-boundary)?\.json|\.github/contracts/spec014/hostinger-storage-durable-authorized-injection-state\.json|\.github/contracts/spec014/sql/hostinger-storage-durable-authorized-injection-state\.sql|\.github/workflows/hostinger-storage-durable-authorized-injection-schema-ddl-guard\.yml|http-generic-api/scripts/e2e-parallel-pr-gate\.mjs|http-generic-api/test-hostinger-storage-durable-authorized-injection-schema-ddl(-workflow)?\.mjs)$'
          candidate_mode="${CANDIDATE_MODE:-feature}"
          [[ "${candidate_mode}" == "feature" || "${candidate_mode}" == "integration" || "${candidate_mode}" == "release" ]]
          if [[ "${candidate_mode}" == "feature" ]]; then
            unexpected="$(printf '%s\n' "${changed_files}" | grep -Ev "${allowed}" || true)"
            [[ -z "${unexpected}" ]]
            ! printf '%s\n' "${changed_files}" | grep -E '(^|/)(migrations?|deploy|production|provider)(/|$)'
            ! printf '%s\n' "${changed_files}" | grep -E '^http-generic-api/(server\.js$|routes/)'
          fi
          grep -q 'CONTRACT-LOCAL DDL ONLY' "${DDL_FILE}"
          grep -q 'not part of the promoted runtime migration sequence' "${DDL_FILE}"
          grep -q '"contract_local_only": true' "${CONTRACT_FILE}"
          grep -q '"governed_runtime_migration_promoted": false' "${CONTRACT_FILE}"
          grep -q '"migration_apply_authorized": false' "${CONTRACT_FILE}"
          ! grep -E '\b(DROP|TRUNCATE)[[:space:]]+TABLE\b' "${DDL_FILE}"
          ! grep -E '\b(governed_migration_execute|bootstrapGovernedMigrationAuthorization|providerDispatch|dispatchProvider)\b' \
            "${DDL_FILE}" "${TEST_FILE}" "${WORKFLOW_TEST_FILE}"

      - name: Build structured guard summary
        if: always()
        shell: bash
        env:
          MODE_OUTCOME: ${{ steps.candidate_mode.outcome }}
          CANDIDATE_MODE: ${{ steps.candidate_mode.outputs.candidate_mode }}
          CANDIDATE_MODE_SOURCE: ${{ steps.candidate_mode.outputs.candidate_mode_source }}
          RELEASE_IDENTITY: ${{ steps.candidate_mode.outputs.release_identity }}
          CANONICAL_PROMOTION_VALIDATED: ${{ steps.candidate_mode.outputs.canonical_promotion_validated }}
          PROMOTION_GATE_OUTCOME: ${{ steps.candidate_mode.outputs.promotion_gate_outcome }}
          PROMOTION_PHASE_EVALUATION_BASE: ${{ steps.candidate_mode.outputs.promotion_phase_evaluation_base }}
          IMMUTABLE_RELEASE_SOURCE_IN_MAIN: ${{ steps.candidate_mode.outputs.immutable_release_source_in_main }}
          PHASE_CONTRACT_DIGEST: ${{ steps.candidate_mode.outputs.phase_contract_digest }}
          CONTRACT_FEATURE_KEY: ${{ steps.candidate_mode.outputs.feature_key }}
          CONTRACT_DELIVERY_MODE: ${{ steps.candidate_mode.outputs.delivery_mode }}
          CONTRACT_MERGE_POLICY: ${{ steps.candidate_mode.outputs.merge_policy }}
          SYNTAX_OUTCOME: ${{ steps.syntax.outcome }}
          TEST_OUTCOME: ${{ steps.focused_test.outcome }}
          WORKFLOW_CONTRACT_OUTCOME: ${{ steps.workflow_contract.outcome }}
          BOUNDARY_OUTCOME: ${{ steps.boundary.outcome }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_CANDIDATE_SHA: ${{ github.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          mkdir -p "${REPORT_DIR}"
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          stages = {
            'candidate_mode_classification': os.environ['MODE_OUTCOME'],
            'syntax': os.environ['SYNTAX_OUTCOME'],
            'module_ddl_parity': os.environ['TEST_OUTCOME'],
            'workflow_contract': os.environ['WORKFLOW_CONTRACT_OUTCOME'],
            'contract_local_boundary': os.environ['BOUNDARY_OUTCOME'],
          }
          failed = [name for name, outcome in stages.items() if outcome != 'success']
          focused = {}
          focused_path = Path(os.environ['REPORT_DIR'], 'focused-test.stdout')
          try:
            focused = json.loads(focused_path.read_text()) if focused_path.exists() else {}
          except Exception:
            focused = {}
          candidate_mode = os.environ.get('CANDIDATE_MODE') or 'unknown'
          if candidate_mode not in ('feature', 'integration', 'release'):
            failed.insert(0, 'candidate_mode_invalid')
          ddl_matches_registry_sql = (
            stages['module_ddl_parity'] == 'success'
            and focused.get('ddl_matches_registry_sql') is True
          )
          contract_local_only = (
            stages['contract_local_boundary'] == 'success'
            and focused.get('contract_local_only') is True
            and focused.get('governed_runtime_migration_promoted') is False
            and focused.get('migration_apply_authorized') is False
          )
          report = {
            'contract': 'mad4b.spec014-durable-authorized-injection-schema-ddl-guard.v1',
            'outcome': 'passed' if not failed else 'failed',
            'candidate_kind': 'head',
            'candidate_mode': candidate_mode,
            'candidate_mode_source': os.environ.get('CANDIDATE_MODE_SOURCE') or 'unknown',
            'release_identity': os.environ.get('RELEASE_IDENTITY') or 'none',
            'canonical_promotion_validated': os.environ.get('CANONICAL_PROMOTION_VALIDATED') == 'true',
            'promotion_gate_outcome': os.environ.get('PROMOTION_GATE_OUTCOME') or 'unknown',
            'promotion_phase_evaluation_base': os.environ.get('PROMOTION_PHASE_EVALUATION_BASE') or None,
            'immutable_release_source_in_main': os.environ.get('IMMUTABLE_RELEASE_SOURCE_IN_MAIN') == 'true',
            'governed_phase_contract': os.environ['PHASE_CONTRACT'],
            'governed_phase_contract_digest': os.environ.get('PHASE_CONTRACT_DIGEST') or None,
            'contract_feature_key': os.environ.get('CONTRACT_FEATURE_KEY') or None,
            'contract_delivery_mode': os.environ.get('CONTRACT_DELIVERY_MODE') or None,
            'contract_merge_policy': os.environ.get('CONTRACT_MERGE_POLICY') or None,
            'exact_candidate_sha': os.environ['CANDIDATE_SHA'],
            'source_sha': os.environ['CANDIDATE_SHA'],
            'merge_candidate_sha': os.environ['MERGE_CANDIDATE_SHA'],
            'head_ref': os.environ['HEAD_REF'],
            'base_ref': os.environ['BASE_REF'],
            'stages': stages,
            'first_failure': failed[0] if failed else None,
            'canonical_registry_modified': False,
            'ddl_contract_present': focused.get('ddl_contract_present') is True,
            'ddl_matches_registry_sql': ddl_matches_registry_sql,
            'contract_local_only': contract_local_only,
            'feature_scope_allowlist_enforced': candidate_mode == 'feature',
            'rollup_scope_allowlist_skipped': candidate_mode == 'integration',
            'release_scope_allowlist_skipped': candidate_mode == 'release',
            'governed_runtime_migration_promoted': False,
            'migration_apply_authorized': False,
            'live_database_access': False,
            'provider_dispatch_allowed': False,
            'production_ready': False,
            'repository_mutation_performed': False,
            'job_logs_consulted': False,
            'secrets_included': False,
          }
          Path(os.environ['REPORT_DIR'], 'summary.json').write_text(json.dumps(report, indent=2) + '\n')
          PY

      - name: Upload structured DDL guard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec014-durable-authorized-injection-schema-ddl-${{ github.run_id }}
          path: |
            ${{ env.REPORT_DIR }}/summary.json
            ${{ env.REPORT_DIR }}/focused-test.stdout
            ${{ env.REPORT_DIR }}/focused-test.stderr
            ${{ env.REPORT_DIR }}/workflow-test.stdout
            ${{ env.REPORT_DIR }}/workflow-test.stderr
          if-no-files-found: error
          retention-days: 14

      - name: Enforce structured guard decision
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path(os.environ['REPORT_DIR'], 'summary.json').read_text())
          if report.get('outcome') != 'passed':
              raise SystemExit(f"durable authorized injection DDL guard failed: {report.get('first_failure')}")
          PY
