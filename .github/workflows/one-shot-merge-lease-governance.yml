name: One-shot Semantic Lease Governance Merge

on:
  push:
    branches:
      - gpt/reconciliation-lease-control-surface-v2-20260730
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout governed branch
        uses: actions/checkout@v5
        with:
          ref: gpt/reconciliation-lease-control-surface-v2-20260730
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Merge Lease governance semantically
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(source, needle, replacement, label) {
            const first = source.indexOf(needle);
            if (first < 0) throw new Error(`missing anchor: ${label}`);
            if (source.indexOf(needle, first + needle.length) >= 0) throw new Error(`non-unique anchor: ${label}`);
            return source.slice(0, first) + replacement + source.slice(first + needle.length);
          }

          const registryPath = 'http-generic-api/frontend-operation-governance-tests.json';
          const registry = JSON.parse(fs.readFileSync(registryPath, 'utf8'));
          const leaseEntry = {
            file: 'test-repository-reconciliation-lease-control.mjs',
            evidence_scope: 'repository-reconciliation-lease-control',
          };
          const existingLeaseEntries = registry.tests.filter((entry) => entry.file === leaseEntry.file);
          if (existingLeaseEntries.length > 1) throw new Error('duplicate lease registry entries');
          if (existingLeaseEntries.length === 0) registry.tests.push(leaseEntry);
          fs.writeFileSync(registryPath, `${JSON.stringify(registry, null, 2)}\n`, 'utf8');

          const generatorPath = 'http-generic-api/scripts/frontend-operation-governance-generator.mjs';
          let generator = fs.readFileSync(generatorPath, 'utf8');
          const leaseConstants = `const LEASE_ROUTE_FILE = "routes/repositoryAutomationRoutes.js";\nconst LEASE_CONTROL_FILE = "repositoryReconciliationLeaseControl.js";\nconst LEASE_SERVICE_FILE = "repositoryOperationLeaseService.js";\nconst LEASE_TEST_FILE = "test-repository-reconciliation-lease-control.mjs";\n`;
          if (!generator.includes('const LEASE_ROUTE_FILE =')) {
            generator = replaceOnce(
              generator,
              'const BOOTSTRAP_TEST_FILE = "test-tenant-connect-bootstrap-transaction.mjs";\n',
              `const BOOTSTRAP_TEST_FILE = "test-tenant-connect-bootstrap-transaction.mjs";\n${leaseConstants}`,
              'lease constants'
            );
          }

          const leaseEvaluator = `function evaluateLeaseRecipe(context) {\n  const recipe = {\n    recipe_id: "repository-reconciliation-lease-control-v1",\n    rule_id: "generated-repository-reconciliation-lease-control-governance",\n    operation: "POST /admin/repository-automation/reconciliation-lease",\n    source_file: LEASE_ROUTE_FILE,\n    owner: "repository-automation",\n    rationale: "Acquires, renews, or releases one repository reconciliation lease only after Admin authentication, exact resource and fingerprint capability-envelope binding, apply authorization, and typed confirmation; each durable mutation is verified inside the same SQL transaction before commit and rolls back on mutation or readback failure.",\n    preflight_mode: "capability_envelope_resource_and_fingerprint_binding",\n    approval_mode: "runtime_authorization_and_typed_confirmation",\n    parameter_bindings: {\n      action: "request.body.action",\n      capability_envelope_id: "request.body.capability_envelope_id",\n      repository_owner: "request.body.owner|request.body.repository_owner",\n      repository_name: "request.body.repo|request.body.repository_name",\n      branch_name: "request.body.branch|request.body.branch_name",\n      expected_base_sha: "request.body.expected_base_sha",\n      expected_branch_sha: "request.body.expected_branch_sha",\n      lease_id: "response.lease.lease_id",\n      resource_fingerprint: "response.lease.resource_fingerprint",\n    },\n  };\n  const route = context.leaseRoutes.get(recipe.operation);\n  const controlSource = context.sourceByFile.get(LEASE_CONTROL_FILE);\n  const runBlock = extractFunctionBlock(controlSource, "runRepositoryReconciliationLeaseControl");\n  const envelopeBlock = extractFunctionBlock(controlSource, "requireCapabilityEnvelope");\n  const leaseSource = context.sourceByFile.get(LEASE_SERVICE_FILE);\n  const acquireBlock = extractFunctionBlock(leaseSource, "acquireRepositoryOperationLease");\n  const renewBlock = extractFunctionBlock(leaseSource, "renewRepositoryOperationLease");\n  const releaseBlock = extractFunctionBlock(leaseSource, "releaseRepositoryOperationLease");\n  const claimedTests = context.testEvidence.byOperation.get(recipe.operation) || [];\n  const transactionalBlocks = [acquireBlock, renewBlock, releaseBlock];\n  const gates = [\n    evidenceGate("route_present", route, LEASE_ROUTE_FILE),\n    evidenceGate("admin_guard", route?.route_guards?.includes("requireAdminPrincipal") && route?.route_guards?.includes("requireBackendApiKey"), "requireAdminPrincipal/requireBackendApiKey"),\n    evidenceGate("route_service_binding", route?.declaration?.includes("runRepositoryReconciliationLeaseControl"), "runRepositoryReconciliationLeaseControl"),\n    evidenceGate("control_function_present", runBlock, "runRepositoryReconciliationLeaseControl"),\n    evidenceGate("defense_in_depth_admin_check", runBlock.includes("assertAdminCaller"), "assertAdminCaller"),\n    evidenceGate("typed_confirmation", runBlock.includes("assertTypedConfirmation"), "assertTypedConfirmation"),\n    evidenceGate("force_bypass_rejected", controlSource.includes("assertNoForceFlags") && controlSource.includes("repository_reconciliation_lease_control_force_forbidden"), "assertNoForceFlags/force_forbidden"),\n    evidenceGate("capability_envelope_exact_binding", envelopeBlock.includes("resolveCapabilityExecutionEnvelope") && envelopeBlock.includes("expectedResourceUri") && envelopeBlock.includes("expectedBindingSha256"), "expectedResourceUri/expectedBindingSha256"),\n    evidenceGate("capability_envelope_apply_authorization", envelopeBlock.includes("resolved.apply_allowed !== true"), "apply_allowed"),\n    evidenceGate("lease_specific_intent", envelopeBlock.includes("repository_reconciliation_lease_control") && !envelopeBlock.includes('"repo_mutation"'), "lease-specific intent/no generic repo_mutation"),\n    evidenceGate("envelope_reference_before_service_dispatch", ordered(envelopeBlock, "markCapabilityEnvelopeReferenced", "return resolved") && ordered(runBlock, "await requireCapabilityEnvelope", "await leaseDependencies"), "envelope reference before lease service dispatch"),\n    evidenceGate("all_actions_dispatched", runBlock.includes("acquireRepositoryOperationLease") && runBlock.includes("renewRepositoryOperationLease") && runBlock.includes("releaseRepositoryOperationLease"), "acquire/renew/release dispatch"),\n    evidenceGate("transaction_scope_all_actions", transactionalBlocks.every((block) => block.includes("getConnection") && block.includes("beginTransaction") && block.includes("connection.commit")), "getConnection/beginTransaction/commit"),\n    evidenceGate("transaction_rollback_all_actions", transactionalBlocks.every((block) => block.includes("connection.rollback") && block.includes("connection.release")), "rollback/release"),\n    evidenceGate("acquire_transactional_readback", (ordered(acquireBlock, "INSERT INTO repository_operation_leases", "const created = await readLeaseById") || ordered(acquireBlock, "UPDATE repository_operation_leases", "const renewed = await readLeaseById")) && acquireBlock.includes("repository_operation_lease_readback_failed"), "acquire/reuse readback before commit"),\n    evidenceGate("renew_transactional_readback", ordered(renewBlock, "UPDATE repository_operation_leases", "const renewed = await readLeaseById"), "renew readback before commit"),\n    evidenceGate("release_transactional_readback", ordered(releaseBlock, "UPDATE repository_operation_leases", "const released = await readLeaseById") && releaseBlock.includes('released.status !== "released"'), "release readback before commit"),\n    evidenceGate("registered_operation_test", claimedTests.includes(LEASE_TEST_FILE), LEASE_TEST_FILE),\n  ];\n  return { recipe, gates, evidenceFiles: [LEASE_ROUTE_FILE, LEASE_CONTROL_FILE, LEASE_SERVICE_FILE, LEASE_TEST_FILE] };\n}\n\n`;
          if (!generator.includes('function evaluateLeaseRecipe')) {
            generator = replaceOnce(generator, 'export function buildOperationGovernance', `${leaseEvaluator}export function buildOperationGovernance`, 'lease evaluator');
          }
          if (!generator.includes('    LEASE_ROUTE_FILE,\n    LEASE_CONTROL_FILE,')) {
            generator = replaceOnce(
              generator,
              '    BOOTSTRAP_TRANSACTION_FILE,\n    BOOTSTRAP_TEST_FILE,\n  ]);',
              '    BOOTSTRAP_TRANSACTION_FILE,\n    BOOTSTRAP_TEST_FILE,\n    LEASE_ROUTE_FILE,\n    LEASE_CONTROL_FILE,\n    LEASE_SERVICE_FILE,\n    LEASE_TEST_FILE,\n  ]);',
              'lease evidence files'
            );
          }
          if (!generator.includes('    leaseRoutes: routeRegistry')) {
            generator = replaceOnce(
              generator,
              '    bootstrapRoutes: routeRegistry(sourceByFile.get(BOOTSTRAP_ROUTE_FILE), BOOTSTRAP_ROUTE_FILE),\n  };',
              '    bootstrapRoutes: routeRegistry(sourceByFile.get(BOOTSTRAP_ROUTE_FILE), BOOTSTRAP_ROUTE_FILE),\n    leaseRoutes: routeRegistry(sourceByFile.get(LEASE_ROUTE_FILE), LEASE_ROUTE_FILE),\n  };',
              'lease route registry'
            );
          }
          if (!generator.includes('    evaluateLeaseRecipe(context),')) {
            generator = replaceOnce(
              generator,
              '    ...CANARY_RECIPES.map((recipe) => evaluateCanaryRecipe(recipe, context)),\n    evaluateBootstrapRecipe(context),\n  ];',
              '    ...CANARY_RECIPES.map((recipe) => evaluateCanaryRecipe(recipe, context)),\n    evaluateBootstrapRecipe(context),\n    evaluateLeaseRecipe(context),\n  ];',
              'lease evaluation'
            );
          }
          fs.writeFileSync(generatorPath, generator, 'utf8');

          const testPath = 'http-generic-api/test-frontend-operation-governance-generator.mjs';
          let test = fs.readFileSync(testPath, 'utf8');
          if (!test.includes('const LEASE_OPERATION =')) {
            test = replaceOnce(
              test,
              'await import("./test-dynamic-container-rollout-safety.mjs");\n\nconst CANARY_OPERATIONS',
              'await import("./test-dynamic-container-rollout-safety.mjs");\n\nconst LEASE_OPERATION = "POST /admin/repository-automation/reconciliation-lease";\nconst CANARY_OPERATIONS',
              'lease operation constant'
            );
          }
          if (!test.includes('  LEASE_OPERATION,\n  "POST /connect/bootstrap"')) {
            test = replaceOnce(
              test,
              '  ...CANARY_OPERATIONS,\n  "POST /connect/bootstrap",',
              '  ...CANARY_OPERATIONS,\n  LEASE_OPERATION,\n  "POST /connect/bootstrap",',
              'lease expected operation'
            );
          }
          if (!test.includes('  "routes/repositoryAutomationRoutes.js",')) {
            test = replaceOnce(
              test,
              '  "tenantConnectBootstrapTransaction.js",\n  "test-tenant-connect-bootstrap-transaction.mjs",\n];',
              '  "tenantConnectBootstrapTransaction.js",\n  "test-tenant-connect-bootstrap-transaction.mjs",\n  "routes/repositoryAutomationRoutes.js",\n  "repositoryReconciliationLeaseControl.js",\n  "repositoryOperationLeaseService.js",\n  "test-repository-reconciliation-lease-control.mjs",\n];',
              'lease evidence files in test'
            );
          }
          if (!test.includes('frontend operation governance rejected candidates:')) {
            test = replaceOnce(
              test,
              'assert.equal(plan.schema_version, "frontend-operation-governance-v1");\nassert.deepEqual(plan.coverage, {',
              'assert.equal(plan.schema_version, "frontend-operation-governance-v1");\nif (plan.rejected_candidates.length) {\n  console.error("frontend operation governance rejected candidates:");\n  console.error(JSON.stringify(plan.rejected_candidates, null, 2));\n}\nassert.deepEqual(plan.coverage, {',
              'rejected candidate diagnostics'
            );
          }
          test = test.replace('  candidate_count: 8,\n  generated_rule_count: 8,', '  candidate_count: 9,\n  generated_rule_count: 9,');
          test = test.replace('assert.equal(writeResult.plan.coverage.generated_rule_count, 8);', 'assert.equal(writeResult.plan.coverage.generated_rule_count, 9);');
          if (!test.includes('const leaseRule = plan.operation_rules.find')) {
            test = replaceOnce(
              test,
              '}\nassert.deepEqual(plan.safety, {',
              `}\nconst leaseRule = plan.operation_rules.find((rule) => rule.operation === LEASE_OPERATION);\nassert.equal(leaseRule.rule_id, "generated-repository-reconciliation-lease-control-governance");\nassert.equal(leaseRule.preflight.mode, "capability_envelope_resource_and_fingerprint_binding");\nassert.equal(leaseRule.approval.mode, "runtime_authorization_and_typed_confirmation");\nassert.equal(leaseRule.parameter_bindings.lease_id, "response.lease.lease_id");\nassert.deepEqual(leaseRule.evidence_refs, [\n  "routes/repositoryAutomationRoutes.js",\n  "repositoryReconciliationLeaseControl.js",\n  "repositoryOperationLeaseService.js",\n  "test-repository-reconciliation-lease-control.mjs",\n]);\nassert.deepEqual(plan.safety, {`,
              'lease rule assertions'
            );
          }
          if (!test.includes('const noLeaseApplyFixture =')) {
            const leaseRegressions = `const noLeaseApplyFixture = createFixture();\nreplaceEvidence(\n  noLeaseApplyFixture,\n  "repositoryReconciliationLeaseControl.js",\n  "resolved.apply_allowed !== true",\n  "resolved.applyEvidenceRemoved !== true"\n);\nconst noLeaseApplyPlan = buildOperationGovernance({ apiRoot: noLeaseApplyFixture });\nassert(rejection(noLeaseApplyPlan, LEASE_OPERATION).missing_evidence.includes("capability_envelope_apply_authorization"));\n\nconst noLeaseConfirmationFixture = createFixture();\nreplaceEvidence(\n  noLeaseConfirmationFixture,\n  "repositoryReconciliationLeaseControl.js",\n  "assertTypedConfirmation(action, args.confirm)",\n  "typedConfirmationEvidenceRemoved(action, args.confirm)"\n);\nconst noLeaseConfirmationPlan = buildOperationGovernance({ apiRoot: noLeaseConfirmationFixture });\nassert(rejection(noLeaseConfirmationPlan, LEASE_OPERATION).missing_evidence.includes("typed_confirmation"));\n\nconst noLeaseReadbackFixture = createFixture();\nreplaceEvidence(\n  noLeaseReadbackFixture,\n  "repositoryOperationLeaseService.js",\n  "const released = await readLeaseById(connection, leaseId)",\n  "const released = await releaseReadbackEvidenceRemoved(connection, leaseId)"\n);\nconst noLeaseReadbackPlan = buildOperationGovernance({ apiRoot: noLeaseReadbackFixture });\nassert(rejection(noLeaseReadbackPlan, LEASE_OPERATION).missing_evidence.includes("release_transactional_readback"));\n\nconst noLeaseTestFixture = createFixture();\nreplaceEvidence(\n  noLeaseTestFixture,\n  "test-repository-reconciliation-lease-control.mjs",\n  \\`// frontend-surface-operation: \\${LEASE_OPERATION}\\`,\n  "// operation claim removed for fail-closed regression"\n);\nconst noLeaseTestPlan = buildOperationGovernance({ apiRoot: noLeaseTestFixture });\nassert(rejection(noLeaseTestPlan, LEASE_OPERATION).missing_evidence.includes("registered_operation_test"));\n\nconst noLeaseRegistrationFixture = createFixture();\nreplaceEvidence(\n  noLeaseRegistrationFixture,\n  "frontend-operation-governance-tests.json",\n  '\"file\": \"test-repository-reconciliation-lease-control.mjs\"',\n  '\"file\": \"test-unregistered-repository-reconciliation-lease-control.mjs\"'\n);\nconst noLeaseRegistrationPlan = buildOperationGovernance({ apiRoot: noLeaseRegistrationFixture });\nassert(rejection(noLeaseRegistrationPlan, LEASE_OPERATION).missing_evidence.includes("registered_operation_test"));\n\n`;
            test = replaceOnce(test, 'console.log("generated frontend operation governance evidence tests passed");', `${leaseRegressions}console.log("generated frontend operation governance evidence tests passed");`, 'lease regressions');
          }
          fs.writeFileSync(testPath, test, 'utf8');
          NODE

      - name: Run focused governance tests
        working-directory: http-generic-api
        run: |
          node test-frontend-operation-governance-generator.mjs
          node test-repository-reconciliation-lease-control.mjs
          node test-repository-operation-lease-service.mjs

      - name: Commit semantic merge and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            http-generic-api/frontend-operation-governance-tests.json \
            http-generic-api/scripts/frontend-operation-governance-generator.mjs \
            http-generic-api/test-frontend-operation-governance-generator.mjs
          git rm .github/workflows/one-shot-merge-lease-governance.yml
          git commit -m "test: merge lease governance with expanded canary rules"
          git push origin HEAD:gpt/reconciliation-lease-control-surface-v2-20260730
