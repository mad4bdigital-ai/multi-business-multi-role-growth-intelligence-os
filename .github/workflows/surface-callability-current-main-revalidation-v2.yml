name: Surface Callability Superseded Revalidation V2

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/surface-callability-current-main-revalidation-v2.yml

permissions:
  contents: read

concurrency:
  group: surface-callability-superseded-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  retired:
    if: >-
      github.repository == 'mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os' &&
      github.event.pull_request.head.ref == 'gpt/pr5210-surface-source-clean-20260803' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-22.04
    steps:
      - name: Confirm V2 is inert
        run: echo 'superseded_by_surface_callability_current_main_revalidation_v3=true'
