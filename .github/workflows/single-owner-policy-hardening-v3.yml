name: Single Owner Policy Hardening V3

on:
  push:
    branches:
      - fix/github-main-single-owner-policy-20260807
    paths:
      - .github/workflows/single-owner-policy-hardening-v3.yml

permissions:
  actions: read
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/github-main-single-owner-policy-20260807
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Download and verify validated patch
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "8988288801"
        run: |
          set -euo pipefail
          rm -rf /tmp/single-owner-input
          mkdir -p /tmp/single-owner-input
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/single-owner.zip
          unzip -q /tmp/single-owner.zip -d /tmp/single-owner-input
          (cd /tmp/single-owner-input && sha256sum -c MANIFEST.sha256)
          test "$(find /tmp/single-owner-input -type f ! -name MANIFEST.sha256 | wc -l)" -eq 7

      - name: Overlay exact seven-file patch
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            mkdir -p "$(dirname "$path")"
            cp -- "/tmp/single-owner-input/$path" "$path"
          done < <(cd /tmp/single-owner-input && find . -type f ! -name MANIFEST.sha256 -printf '%P\n' | sort)

      - name: Apply fail-closed hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 anchor, found {count}")
              p.write_text(text.replace(old, new, 1))

          def replace_exact_count(path, old, new, expected, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{label}: expected {expected} anchors, found {count}")
              p.write_text(text.replace(old, new))

          gate = "http-generic-api/scripts/single-owner-review-gate.mjs"
          gate_test = "http-generic-api/test-single-owner-review-gate.mjs"
          workflow = ".github/workflows/single-owner-review-gate.yml"
          controller = "http-generic-api/githubRepositoryPolicyController.js"
          controller_test = "http-generic-api/test-github-repository-policy-controller.mjs"

          replace_once(gate, '''async function listAll(url, token) {
            const items = [];
            for (let page = 1; page <= 10; page += 1) {
              const separator = url.includes("?") ? "&" : "?";
              const batch = await api(`${url}${separator}per_page=100&page=${page}`, token);
              if (!Array.isArray(batch)) throw new Error(`Expected array from ${url}`);
              items.push(...batch);
              if (batch.length < 100) break;
            }
            return items;
          }'''.replace('          ', ''), '''async function listAll(url, token) {
            const items = [];
            for (let page = 1; page <= 10; page += 1) {
              const separator = url.includes("?") ? "&" : "?";
              const batch = await api(`${url}${separator}per_page=100&page=${page}`, token);
              if (!Array.isArray(batch)) throw new Error(`Expected array from ${url}`);
              items.push(...batch);
              if (batch.length < 100) return items;
            }
            throw new Error(`Pagination safety bound exceeded for ${url}`);
          }'''.replace('          ', ''), "gate bounded pagination")
          replace_once(gate, "collaborators?affiliation=direct", "collaborators?affiliation=all", "gate effective collaborators")
          replace_once(gate,
              "  const singleOwnerEligible = eligible.length === 1 && eligible[0].login === author && author === owner;",
              "  const singleOwnerEligible = eligible.length === 1 && eligible[0].login === author;",
              "gate organization namespace is not human identity")

          replace_once(workflow, "  pull_request:\n", "  pull_request_target:\n", "trusted PR trigger")
          old_ref = "          ref: $" + "{{ github.event.pull_request.head.sha || github.sha }}"
          replace_once(workflow, old_ref, "          ref: main", "trusted main checkout")

          replace_once(controller,
              "  return (Array.isArray(readback?.direct_collaborators) ? readback.direct_collaborators : []).filter((item) =>",
              "  const collaborators = Array.isArray(readback?.collaborators) ? readback.collaborators : readback?.direct_collaborators;\n  return (Array.isArray(collaborators) ? collaborators : []).filter((item) =>",
              "controller effective collaborator source")
          replace_once(controller,
              "  return eligible.length === 1 && eligible[0].login === target.owner;",
              "  return readback?.proof?.collaborator_ownership_complete === true && eligible.length === 1;",
              "controller organization namespace is not human identity")

          permission_anchor = "async function readCollaboratorPermissions({ owner, repo, collaborators, token, fetchImpl }) {"
          helper = '''async function readAllCollaborators({ owner, repo, token, fetchImpl }) {
            const items = [];
            for (let page = 1; page <= 10; page += 1) {
              const result = await githubRequest({
                apiPath: `/repos/${encode(owner)}/${encode(repo)}/collaborators?affiliation=all&per_page=100&page=${page}`,
                token,
                fetchImpl,
              });
              if (!result.ok || !Array.isArray(result.payload)) {
                return { ok: false, status: result.status, payload: [], complete: false };
              }
              items.push(...result.payload);
              if (result.payload.length < 100) {
                return { ok: true, status: result.status, payload: items, complete: true };
              }
            }
            return { ok: false, status: 409, payload: [], complete: false };
          }

          '''.replace('          ', '') + permission_anchor
          replace_once(controller, permission_anchor, helper, "controller bounded collaborator reader")
          replace_once(controller,
              'githubRequest({ apiPath: `${base}/collaborators?affiliation=direct&per_page=100`, token, fetchImpl }),',
              'readAllCollaborators({ owner: target.owner, repo: target.repo, token, fetchImpl }),',
              "controller effective collaborator request")

          old_permission_block = '''  const collaboratorPermissions = collaborators.ok
            ? await readCollaboratorPermissions({ owner: target.owner, repo: target.repo, collaborators: collaborators.payload, token, fetchImpl })
            : [];
          const eligibleHumans = collaboratorPermissions.filter((item) =>
            item?.type === "User" && ["write", "maintain", "admin"].includes(compact(item?.permission || item?.role_name || "", 32).toLowerCase())
          );
          const singleOwnerEligible = eligibleHumans.length === 1 && eligibleHumans[0].login === target.owner;'''.replace('          ', '')
          new_permission_block = '''  const collaboratorPermissions = collaborators.ok && collaborators.complete === true
            ? await readCollaboratorPermissions({ owner: target.owner, repo: target.repo, collaborators: collaborators.payload, token, fetchImpl })
            : [];
          const collaboratorPermissionsReadable = collaborators.ok
            && collaborators.complete === true
            && Array.isArray(collaborators.payload)
            && collaboratorPermissions.length === collaborators.payload.length
            && collaboratorPermissions.every((item) =>
              item?.status === 200 && Boolean(compact(item?.permission || item?.role_name || "", 32))
            );
          const eligibleHumans = collaboratorPermissionsReadable
            ? collaboratorPermissions.filter((item) =>
              item?.type === "User" && ["write", "maintain", "admin"].includes(compact(item?.permission || item?.role_name || "", 32).toLowerCase())
            )
            : [];
          const singleOwnerEligible = collaboratorPermissionsReadable && eligibleHumans.length === 1;'''.replace('          ', '')
          replace_once(controller, old_permission_block, new_permission_block, "controller complete permission proof")
          replace_once(controller,
              "  const proof = {\n    policy_state_readable: protectionReadable,",
              "  const proof = {\n    policy_state_readable: protectionReadable,\n    collaborator_ownership_complete: collaboratorPermissionsReadable,",
              "controller ownership proof field")
          replace_once(controller,
              '  if (!proof.policy_state_readable) findings.push("policy_state_unreadable");',
              '  if (!proof.policy_state_readable) findings.push("policy_state_unreadable");\n  if (!proof.collaborator_ownership_complete) findings.push("collaborator_ownership_incomplete");',
              "controller ownership finding")
          replace_once(controller,
              "    direct_collaborators: collaboratorPermissions,\n    eligible_human_collaborators:",
              "    collaborators: collaboratorPermissions,\n    direct_collaborators: collaboratorPermissions,\n    eligible_human_collaborators:",
              "controller collaborator output")

          replace_once(gate_test,
              'import assert from "node:assert/strict";\n',
              'import assert from "node:assert/strict";\nimport fs from "node:fs";\n',
              "gate test fs import")
          replace_once(gate_test,
              'const owner = "mad4bdigital-ai";\nconst admin = { login: owner, type: "User", permissions: { admin: true, maintain: true, push: true } };',
              'const owner = "mad4bdigital-ai";\nconst soleHuman = "repository-owner";\nconst admin = { login: soleHuman, type: "User", permissions: { admin: true, maintain: true, push: true } };',
              "gate organization fixture")
          replace_exact_count(gate_test, "    author: owner,", "    author: soleHuman,", 4, "gate sole-human authors")
          replace_exact_count(gate_test, "      user: { login: owner },", "      user: { login: soleHuman },", 3, "gate sole-human review identities")
          marker = '\nconsole.log(JSON.stringify({ ok: true, test: "single_owner_review_gate", secrets_included: false }));\n'
          extra_gate_tests = r'''
          {
            const result = evaluateReviewGate({
              owner,
              author: "automation-bot",
              headSha: sha,
              collaborators: [admin],
              reviews: [{
                user: { login: soleHuman },
                state: "APPROVED",
                commit_id: sha,
                submitted_at: "2026-08-07T00:00:00Z",
                body: "approved",
              }],
            });
            assert.equal(result.ok, true);
            assert.equal(result.mode, "independent_approval");
          }

          {
            const gateSource = fs.readFileSync(new URL("./scripts/single-owner-review-gate.mjs", import.meta.url), "utf8");
            const workflowSource = fs.readFileSync(new URL("../.github/workflows/single-owner-review-gate.yml", import.meta.url), "utf8");
            assert.match(gateSource, /collaborators\?affiliation=all/);
            assert.doesNotMatch(gateSource, /collaborators\?affiliation=direct/);
            assert.match(gateSource, /Pagination safety bound exceeded/);
            assert.match(workflowSource, /pull_request_target:/);
            assert.doesNotMatch(workflowSource, /^  pull_request:/m);
            assert.match(workflowSource, /ref: main/);
            assert.doesNotMatch(workflowSource, /pull_request\.head\.sha \|\| github\.sha/);
          }

          '''.replace('          ', '')
          replace_once(gate_test, marker, "\n" + extra_gate_tests + marker.lstrip("\n"), "gate security regressions")

          replace_once(controller_test,
              'const OWNER = "mad4bdigital-ai";\nconst REPO =',
              'const OWNER = "mad4bdigital-ai";\nconst SOLE_HUMAN = "repository-owner";\nconst REPO =',
              "controller sole-human fixture")
          replace_once(controller_test,
              "  rulesetDetailStatus = 200,\n} = {}) {",
              "  rulesetDetailStatus = 200,\n  collaboratorPermissionStatus = 200,\n} = {}) {",
              "controller permission fixture option")
          old_routes = '''    if (path === `/repos/${OWNER}/${REPO}/collaborators` && method === "GET") {
            return response(200, [{ login: OWNER, type: "User" }]);
          }
          if (path === `/repos/${OWNER}/${REPO}/collaborators/${OWNER}/permission` && method === "GET") {
            return response(200, { permission: "admin", role_name: "admin" });
          }'''.replace('          ', '')
          new_routes = '''    if (path === `/repos/${OWNER}/${REPO}/collaborators` && method === "GET") {
            assert.equal(parsed.searchParams.get("affiliation"), "all");
            assert.equal(parsed.searchParams.get("per_page"), "100");
            assert.ok(Number(parsed.searchParams.get("page")) >= 1);
            return response(200, [{ login: SOLE_HUMAN, type: "User" }]);
          }
          if (path === `/repos/${OWNER}/${REPO}/collaborators/${SOLE_HUMAN}/permission` && method === "GET") {
            return collaboratorPermissionStatus === 200
              ? response(200, { permission: "admin", role_name: "admin" })
              : response(collaboratorPermissionStatus, { message: "permission unavailable" });
          }'''.replace('          ', '')
          replace_once(controller_test, old_routes, new_routes, "controller collaborator fixtures")
          partial_marker = '''  {
            let fetchCalls = 0;
            let authorizeCalls = 0;'''.replace('          ', '')
          partial_test = '''  {
            const mock = createGithubFetch({ collaboratorPermissionStatus: 403 });
            const readback = await readGithubRepositoryPolicy({ owner: OWNER, repo: REPO }, controllerDeps(mock.fetchImpl));
            assert.equal(readback.proof.collaborator_ownership_complete, false);
            assert.equal(readback.single_owner_mode_eligible, false);
            assert.ok(readback.findings.includes("collaborator_ownership_incomplete"));
            const plan = buildGithubRepositoryPolicyPlan({ owner: OWNER, repo: REPO }, readback);
            assert.equal(plan.review_policy_mode, "independent_approval");
            const pullRequest = plan.desired_ruleset.rules.find((rule) => rule.type === "pull_request").parameters;
            assert.equal(pullRequest.required_approving_review_count, 1);
            assert.equal(pullRequest.require_last_push_approval, true);
          }

          '''.replace('          ', '') + partial_marker
          replace_once(controller_test, partial_marker, partial_test, "controller partial permission fail-closed regression")
          PY

      - name: Install API dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Validate hardened patch
        run: |
          set -euo pipefail
          node --check http-generic-api/githubRepositoryPolicyController.js
          node --check http-generic-api/scripts/single-owner-review-gate.mjs
          node http-generic-api/test-single-owner-review-gate.mjs
          node http-generic-api/test-github-repository-policy-controller.mjs
          node http-generic-api/test-repository-automation-policy-facade.mjs
          grep -F 'collaborators?affiliation=all' http-generic-api/scripts/single-owner-review-gate.mjs
          ! grep -F 'collaborators?affiliation=direct' http-generic-api/scripts/single-owner-review-gate.mjs
          grep -F 'affiliation=all&per_page=100&page=${page}' http-generic-api/githubRepositoryPolicyController.js
          ! grep -F 'affiliation=direct' http-generic-api/githubRepositoryPolicyController.js
          grep -F 'collaborator_ownership_complete' http-generic-api/githubRepositoryPolicyController.js
          grep -F 'pull_request_target:' .github/workflows/single-owner-review-gate.yml
          ! grep -F '  pull_request:' .github/workflows/single-owner-review-gate.yml
          git diff --check

      - name: Package exact hardened seven-file patch
        run: |
          set -euo pipefail
          rm -rf hardened-patch
          mkdir hardened-patch
          cat > /tmp/expected <<'EOF'
          .changes/e2e/github-repository-policy-single-owner-mode.json
          .github/workflows/single-owner-review-gate.yml
          http-generic-api/githubRepositoryPolicyController.js
          http-generic-api/migrations/1049_github_repository_policy_single_owner_mode.sql
          http-generic-api/scripts/single-owner-review-gate.mjs
          http-generic-api/test-github-repository-policy-controller.mjs
          http-generic-api/test-single-owner-review-gate.mjs
          EOF
          sort -o /tmp/expected /tmp/expected
          while IFS= read -r path; do
            test -f "$path"
            mkdir -p "hardened-patch/$(dirname "$path")"
            cp -- "$path" "hardened-patch/$path"
          done < /tmp/expected
          (cd hardened-patch && find . -type f -print0 | sort -z | xargs -0 sha256sum > MANIFEST.sha256)
          test "$(find hardened-patch -type f ! -name MANIFEST.sha256 | wc -l)" -eq 7

      - name: Create Git blobs from hardened files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd hardened-patch
          : > GIT_BLOBS.ndjson
          while IFS= read -r path; do
            encoded="$(base64 -w0 -- "$path")"
            sha="$(gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/blobs" -f content="$encoded" -f encoding=base64 --jq .sha)"
            printf '{"path":"%s","sha":"%s"}\n' "$path" "$sha" >> GIT_BLOBS.ndjson
          done < <(find . -type f ! -name MANIFEST.sha256 ! -name GIT_BLOBS.ndjson -printf '%P\n' | sort)
          test "$(wc -l < GIT_BLOBS.ndjson)" -eq 7
          cp GIT_BLOBS.ndjson ../GIT_BLOBS.ndjson

      - name: Upload hardened patch
        uses: actions/upload-artifact@v4
        with:
          name: single-owner-hardened-patch-v3-${{ github.sha }}
          path: hardened-patch
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

      - name: Upload hardened Git blob map
        uses: actions/upload-artifact@v4
        with:
          name: single-owner-hardened-git-blobs-v3-${{ github.sha }}
          path: GIT_BLOBS.ndjson
          if-no-files-found: error
          retention-days: 3
