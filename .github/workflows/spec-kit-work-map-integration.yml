name: Spec Kit Work Map Integration

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".specify/**"
      - "specs/**"
      - "docs/work-maps/**"
      - "http-generic-api/migrations/**"
      - "http-generic-api/scripts/platform-work-map-*.mjs"
      - "http-generic-api/scripts/spec-kit-work-map-*.mjs"
      - "http-generic-api/scripts/work-map-schema-classification.mjs"
      - "http-generic-api/scripts/work-map-schema-classification-contract.mjs"
      - "http-generic-api/scripts/work-map-autofix-diagnostics.mjs"
      - "http-generic-api/scripts/pipeline-connectivity-check.mjs"
      - "http-generic-api/test-work-map-schema-classification.mjs"
      - "http-generic-api/test-work-map-schema-classification-contract.mjs"
      - "http-generic-api/test-work-map-autofix-diagnostics.mjs"
      - "http-generic-api/test-spec-kit-work-map-governance-gate.mjs"
      - "http-generic-api/test-pipeline-connectivity-check.mjs"
      - ".specify/pipeline-connectivity-contract.json"
      - ".github/workflows/**"
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: spec-kit-work-map-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  work-map-integration:
    name: Work Map Integration Gate
    runs-on: ubuntu-latest
    env:
      EXPECTED_CHECKED_OUT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Initialize bounded Work Map repair directory after runner allocation
        shell: bash
        run: |
          set -euo pipefail
          repair_root="${RUNNER_TEMP}/work-map-repair-candidate"
          echo "WORK_MAP_REPAIR_ROOT=${repair_root}" >> "${GITHUB_ENV}"
          rm -rf "${repair_root}"
          mkdir -p "${repair_root}"

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_CHECKED_OUT_SHA }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Resolve exact workflow-dispatch pull request identity
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_CHECKED_OUT_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "${GITHUB_REF_NAME}" ]]

          pr_file="${RUNNER_TEMP}/work-map-integration-target-pr.json"
          gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open \
            -f base=main \
            -f head="${GITHUB_REPOSITORY_OWNER}:${GITHUB_REF_NAME}" \
            -f per_page=2 > "${pr_file}"

          pr_count="$(jq 'length' "${pr_file}")"
          test "${pr_count}" = "1"
          test "$(jq -r '.[0].head.repo.full_name' "${pr_file}")" = "${GITHUB_REPOSITORY}"
          test "$(jq -r '.[0].head.ref' "${pr_file}")" = "${GITHUB_REF_NAME}"
          test "$(jq -r '.[0].head.sha' "${pr_file}")" = "${EXPECTED_CHECKED_OUT_SHA}"
          test "$(jq -r '.[0].base.ref' "${pr_file}")" = "main"
          test "$(jq -r '.[0].state' "${pr_file}")" = "open"

          target_pr="$(jq -r '.[0].number' "${pr_file}")"
          [[ "${target_pr}" =~ ^[1-9][0-9]*$ ]]
          echo "TARGET_PR=${target_pr}" >> "${GITHUB_ENV}"

      - name: Validate canonical Work Map modules
        run: |
          node --check http-generic-api/scripts/platform-work-map-schema-intelligence.mjs
          node --check http-generic-api/scripts/work-map-schema-classification.mjs
          node --check http-generic-api/scripts/work-map-schema-classification-contract.mjs
          node --check http-generic-api/scripts/work-map-autofix-diagnostics.mjs
          node --check http-generic-api/scripts/pipeline-connectivity-check.mjs
          node --check http-generic-api/scripts/spec-kit-work-map-integration-gate.mjs
          node --check http-generic-api/scripts/spec-kit-work-map-governance-gate.mjs
          node --check http-generic-api/test-work-map-schema-classification.mjs
          node --check http-generic-api/test-work-map-schema-classification-contract.mjs
          node --check http-generic-api/test-work-map-autofix-diagnostics.mjs
          node --check http-generic-api/test-spec-kit-work-map-governance-gate.mjs
          node --check http-generic-api/test-pipeline-connectivity-check.mjs

      - name: Validate inter-pipeline connectivity
        run: |
          node http-generic-api/scripts/pipeline-connectivity-check.mjs
          node http-generic-api/test-pipeline-connectivity-check.mjs
          node http-generic-api/test-work-map-autofix-diagnostics.mjs

      - name: Verify generated Work Maps are current
        id: work_map_currentness
        continue-on-error: true
        run: node http-generic-api/scripts/platform-work-map-generator.mjs --check

      - name: Generate exact-head Work Map repair candidate
        id: generate_repair_candidate
        if: steps.work_map_currentness.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          tested_head_sha="$(git rev-parse HEAD)"
          if [[ "${tested_head_sha}" != "${EXPECTED_CHECKED_OUT_SHA}" ]]; then
            echo "Repair candidate checkout mismatch. Expected ${EXPECTED_CHECKED_OUT_SHA}, found ${tested_head_sha}."
            exit 1
          fi
          export WORK_MAP_TESTED_HEAD_SHA="${tested_head_sha}"

          rm -rf "${WORK_MAP_REPAIR_ROOT}"
          mkdir -p "${WORK_MAP_REPAIR_ROOT}/docs"
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          node http-generic-api/scripts/platform-work-map-generator.mjs --check

          unexpected_files="$(git diff --name-only | grep -v '^docs/work-maps/' || true)"
          if [[ -n "${unexpected_files}" ]]; then
            echo "Repair generation modified files outside docs/work-maps:"
            printf '%s\n' "${unexpected_files}"
            exit 1
          fi

          cp -R docs/work-maps "${WORK_MAP_REPAIR_ROOT}/docs/work-maps"
          git diff --name-only -- docs/work-maps > "${WORK_MAP_REPAIR_ROOT}/changed-files.txt"

          node - "${WORK_MAP_REPAIR_ROOT}" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const root = process.argv[2];
          const readme = fs.readFileSync(path.join(root, "docs/work-maps/README.md"), "utf8");
          const sourceHash = readme.match(/Source hash: `([0-9a-f]{64})`/)?.[1] || null;
          const changedFiles = fs.readFileSync(path.join(root, "changed-files.txt"), "utf8")
            .split(/\r?\n/)
            .map((value) => value.trim())
            .filter(Boolean);
          const report = {
            contract: "mad4b.work-map-repair-candidate.v1",
            repository: process.env.GITHUB_REPOSITORY,
            run_id: process.env.GITHUB_RUN_ID,
            run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            event_name: process.env.GITHUB_EVENT_NAME,
            event_sha: process.env.GITHUB_SHA,
            expected_head_sha: process.env.EXPECTED_CHECKED_OUT_SHA,
            tested_head_sha: process.env.WORK_MAP_TESTED_HEAD_SHA,
            source_hash_sha256: sourceHash,
            changed_files: changedFiles,
            changed_count: changedFiles.length,
            allowed_root: "docs/work-maps",
            generated_from_exact_checked_out_head:
              process.env.WORK_MAP_TESTED_HEAD_SHA === process.env.EXPECTED_CHECKED_OUT_SHA,
            remote_write_executed: false,
            secrets_included: false,
          };
          fs.writeFileSync(path.join(root, "report.json"), `${JSON.stringify(report, null, 2)}\n`);
          NODE

      - name: Upload exact-head Work Map repair candidate
        if: steps.work_map_currentness.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: work-map-repair-candidate-${{ github.event_name == 'pull_request' && github.event.pull_request.number || env.TARGET_PR || 'main' }}-${{ env.EXPECTED_CHECKED_OUT_SHA }}
          path: ${{ runner.temp }}/work-map-repair-candidate
          if-no-files-found: error
          retention-days: 14

      - name: Fail closed on stale generated Work Maps
        if: steps.work_map_currentness.outcome == 'failure'
        run: |
          echo "Generated Work Maps are stale. Use the exact-head repair candidate artifact from this run through the governed writer."
          exit 1

      - name: Require complete schema classification
        run: |
          node http-generic-api/scripts/work-map-schema-classification-contract.mjs
          node http-generic-api/scripts/work-map-schema-classification.mjs

      - name: Evaluate complete Spec Kit Work Map integration
        id: work_map_governance
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_root="${RUNNER_TEMP}/work-map-governance-diagnostic"
          mkdir -p "${diagnostic_root}"
          tested_head_sha="$(git rev-parse HEAD)"
          if [[ "${tested_head_sha}" != "${EXPECTED_CHECKED_OUT_SHA}" ]]; then
            echo "Work Map governance checkout mismatch. Expected ${EXPECTED_CHECKED_OUT_SHA}, found ${tested_head_sha}."
            exit 1
          fi

          set +e
          node http-generic-api/scripts/spec-kit-work-map-governance-gate.mjs --ci --changed > "${diagnostic_root}/gate-output.json" 2>&1
          exit_code=$?
          set -e

          cat "${diagnostic_root}/gate-output.json"
          printf 'contract=mad4b.work-map-governance-diagnostic.v1\nrepository=%s\nrun_id=%s\nevent_name=%s\ntarget_pr=%s\nexpected_head_sha=%s\ntested_head_sha=%s\nexit_code=%s\nremote_write_executed=false\n' \
            "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}" "${GITHUB_EVENT_NAME}" "${TARGET_PR:-}" "${EXPECTED_CHECKED_OUT_SHA}" "${tested_head_sha}" "${exit_code}" \
            > "${diagnostic_root}/metadata.txt"
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"

      - name: Upload bounded Work Map governance diagnostic
        if: always() && steps.work_map_governance.outputs.exit_code != ''
        uses: actions/upload-artifact@v4
        with:
          name: work-map-governance-diagnostic-${{ github.event_name == 'pull_request' && github.event.pull_request.number || env.TARGET_PR || 'main' }}-${{ env.EXPECTED_CHECKED_OUT_SHA }}
          path: ${{ runner.temp }}/work-map-governance-diagnostic
          if-no-files-found: error
          retention-days: 14

      - name: Fail closed on Work Map governance findings
        if: steps.work_map_governance.outputs.exit_code != '0'
        run: |
          echo "Work Map governance rejected the exact head. Use the bounded structured diagnostic artifact from this run."
          exit 1

      - name: Run Work Map governance regression tests
        working-directory: http-generic-api
        run: |
          node test-work-map-schema-classification.mjs
          node test-work-map-schema-classification-contract.mjs
          node test-work-map-autofix-diagnostics.mjs
          node test-spec-kit-work-map-governance-gate.mjs
          node test-spec-kit-completion-gate.mjs
