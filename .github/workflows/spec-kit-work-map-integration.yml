name: Spec Kit Work Map Integration

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    # Deliberately run for every main-bound PR. The Work Map source universe is
    # code-defined and evolves; a narrow path filter previously allowed a real
    # generator input (notably workflow YAML) to bypass PR currentness and turn
    # the subsequent main push red. Keep the explicit paths below as governance
    # anchors while the leading ** makes future source additions fail closed.
    paths:
      - "**"
      - ".specify/**"
      - "specs/**"
      - "docs/work-maps/**"
      - "http-generic-api/migrations/**"
      - "http-generic-api/scripts/platform-work-map-*.mjs"
      - "http-generic-api/scripts/spec-kit-work-map-*.mjs"
      - "http-generic-api/scripts/work-map-schema-classification.mjs"
      - "http-generic-api/scripts/work-map-schema-classification-contract.mjs"
      - "http-generic-api/scripts/work-map-autofix-diagnostics.mjs"
      - "http-generic-api/scripts/pipeline-connectivity-check.mjs"
      - "http-generic-api/test-work-map-schema-classification.mjs"
      - "http-generic-api/test-work-map-schema-classification-contract.mjs"
      - "http-generic-api/test-work-map-autofix-diagnostics.mjs"
      - "http-generic-api/test-spec-kit-work-map-governance-gate.mjs"
      - "http-generic-api/test-pipeline-connectivity-check.mjs"
      - ".specify/pipeline-connectivity-contract.json"
      - ".github/workflows/**"
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: spec-kit-work-map-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  work-map-integration:
    name: Work Map Integration Gate
    runs-on: ubuntu-latest
    env:
      EXPECTED_CHECKED_OUT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Initialize bounded Work Map repair directory after runner allocation
        shell: bash
        run: |
          set -euo pipefail
          repair_root="${RUNNER_TEMP}/work-map-repair-candidate"
          echo "WORK_MAP_REPAIR_ROOT=${repair_root}" >> "${GITHUB_ENV}"
          rm -rf "${repair_root}"
          mkdir -p "${repair_root}"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_CHECKED_OUT_SHA }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Classify generated Work Map currentness scope
        id: work_map_scope
        shell: bash
        run: |
          set -euo pipefail
          # Every invocation of this workflow is a currentness boundary. PRs are
          # intentionally triggered for all main-bound changes so the workflow
          # trigger and generator source universe cannot silently diverge again.
          currentness_required=true
          echo "currentness_required=${currentness_required}" >> "${GITHUB_OUTPUT}"
          echo "Work Map generated currentness required: ${currentness_required}"

      - name: Resolve exact workflow-dispatch pull request identity
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_CHECKED_OUT_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "${GITHUB_REF_NAME}" ]]

          pr_file="${RUNNER_TEMP}/work-map-integration-target-pr.json"
          head_query="$(jq -rn --arg value "${GITHUB_REPOSITORY_OWNER}:${GITHUB_REF_NAME}" '$value | @uri')"
          gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&head=${head_query}&per_page=2" > "${pr_file}"

          pr_count="$(jq 'length' "${pr_file}")"
          test "${pr_count}" = "1"
          test "$(jq -r '.[0].head.repo.full_name' "${pr_file}")" = "${GITHUB_REPOSITORY}"
          test "$(jq -r '.[0].head.ref' "${pr_file}")" = "${GITHUB_REF_NAME}"
          test "$(jq -r '.[0].head.sha' "${pr_file}")" = "${EXPECTED_CHECKED_OUT_SHA}"
          test "$(jq -r '.[0].base.ref' "${pr_file}")" = "main"
          test "$(jq -r '.[0].state' "${pr_file}")" = "open"

          target_pr="$(jq -r '.[0].number' "${pr_file}")"
          [[ "${target_pr}" =~ ^[1-9][0-9]*$ ]]
          echo "TARGET_PR=${target_pr}" >> "${GITHUB_ENV}"

      - name: Validate canonical Work Map modules
        run: |
          node --check http-generic-api/scripts/platform-work-map-schema-intelligence.mjs
          node --check http-generic-api/scripts/work-map-schema-classification.mjs
          node --check http-generic-api/scripts/work-map-schema-classification-contract.mjs
          node --check http-generic-api/scripts/work-map-autofix-diagnostics.mjs
          node --check http-generic-api/scripts/pipeline-connectivity-check.mjs
          node --check http-generic-api/scripts/spec-kit-work-map-integration-gate.mjs
          node --check http-generic-api/scripts/spec-kit-work-map-governance-gate.mjs
          node --check http-generic-api/test-work-map-schema-classification.mjs
          node --check http-generic-api/test-work-map-schema-classification-contract.mjs
          node --check http-generic-api/test-work-map-autofix-diagnostics.mjs
          node --check http-generic-api/test-spec-kit-work-map-governance-gate.mjs
          node --check http-generic-api/test-pipeline-connectivity-check.mjs

      - name: Validate inter-pipeline connectivity
        run: |
          node http-generic-api/scripts/pipeline-connectivity-check.mjs
          node http-generic-api/test-pipeline-connectivity-check.mjs
          node http-generic-api/test-work-map-autofix-diagnostics.mjs

      - name: Verify generated Work Maps are current
        id: work_map_currentness
        if: steps.work_map_scope.outputs.currentness_required == 'true'
        continue-on-error: true
        run: node http-generic-api/scripts/platform-work-map-generator.mjs --check

      - name: Generate exact-head Work Map repair candidate
        id: generate_repair_candidate
        if: steps.work_map_scope.outputs.currentness_required == 'true' && steps.work_map_currentness.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          tested_head_sha="$(git rev-parse HEAD)"
          if [[ "${tested_head_sha}" != "${EXPECTED_CHECKED_OUT_SHA}" ]]; then
            echo "Repair candidate checkout mismatch. Expected ${EXPECTED_CHECKED_OUT_SHA}, found ${tested_head_sha}."
            exit 1
          fi
          export WORK_MAP_TESTED_HEAD_SHA="${tested_head_sha}"

          rm -rf "${WORK_MAP_REPAIR_ROOT}"
          mkdir -p "${WORK_MAP_REPAIR_ROOT}/docs"
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          node http-generic-api/scripts/platform-work-map-generator.mjs --check

          unexpected_files="$(git diff --name-only | grep -v '^docs/work-maps/' || true)"
          if [[ -n "${unexpected_files}" ]]; then
            echo "Repair generation modified files outside docs/work-maps:"
            printf '%s\n' "${unexpected_files}"
            exit 1
          fi

          mapfile -t changed_files < <(git diff --name-only -- docs/work-maps | sed '/^$/d' | sort -u)
          if (( ${#changed_files[@]} == 0 )); then
            echo "Work Map check failed but deterministic repair produced no docs/work-maps delta."
            exit 1
          fi
          printf '%s\n' "${changed_files[@]}" > "${WORK_MAP_REPAIR_ROOT}/changed-files.txt"

          for changed_file in "${changed_files[@]}"; do
            destination="${WORK_MAP_REPAIR_ROOT}/${changed_file}"
            mkdir -p "$(dirname "${destination}")"
            cp "${changed_file}" "${destination}"
          done

          source_hash="$(sed -n 's/^> Source hash: `\([0-9a-f]\{64\}\)`$/\1/p' docs/work-maps/README.md | sed -n '1p')"
          [[ "${source_hash}" =~ ^[0-9a-f]{64}$ ]]
          jq -n \
            --arg contract "mad4b.work-map-repair-candidate.v1" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg event_name "${GITHUB_EVENT_NAME}" \
            --arg event_sha "${GITHUB_SHA}" \
            --arg expected_head_sha "${EXPECTED_CHECKED_OUT_SHA}" \
            --arg tested_head_sha "${tested_head_sha}" \
            --arg source_hash_sha256 "${source_hash}" \
            --argjson changed_files "$(printf '%s\n' "${changed_files[@]}" | jq -R . | jq -s .)" \
            '{contract:$contract,repository:$repository,run_id:$run_id,run_attempt:$run_attempt,event_name:$event_name,event_sha:$event_sha,expected_head_sha:$expected_head_sha,tested_head_sha:$tested_head_sha,source_hash_sha256:$source_hash_sha256,changed_files:$changed_files,changed_count:($changed_files|length),allowed_root:"docs/work-maps",generated_from_exact_checked_out_head: true, remote_write_executed: false, secrets_included: false}' \
            > "${WORK_MAP_REPAIR_ROOT}/report.json"

          echo "changed_count=${#changed_files[@]}" >> "$GITHUB_OUTPUT"

      - name: Upload exact-head Work Map repair candidate
        if: steps.generate_repair_candidate.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: work-map-repair-candidate-${{ github.event.pull_request.number || github.ref_name }}-${{ env.EXPECTED_CHECKED_OUT_SHA }}
          path: ${{ env.WORK_MAP_REPAIR_ROOT }}/
          if-no-files-found: error
          retention-days: 14

      - name: Fail closed on stale generated Work Maps
        if: steps.work_map_scope.outputs.currentness_required == 'true' && steps.work_map_currentness.outcome == 'failure'
        shell: bash
        run: |
          echo "Generated Work Maps are stale for ${EXPECTED_CHECKED_OUT_SHA}."
          echo "The exact-head repair candidate was generated under ${WORK_MAP_REPAIR_ROOT} and uploaded for governed writer consumption."
          echo "Apply it only through the governed Work Map writer; this validator performs no remote write."
          exit 1

      - name: Require complete schema classification
        if: steps.work_map_currentness.outcome == 'success' || steps.work_map_scope.outputs.currentness_required != 'true'
        run: node http-generic-api/scripts/work-map-schema-classification.mjs --check

      - name: Evaluate complete Spec Kit Work Map integration
        id: integration
        if: steps.work_map_currentness.outcome == 'success' || steps.work_map_scope.outputs.currentness_required != 'true'
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || env.TARGET_PR || '' }}
          EXPECTED_HEAD_SHA: ${{ env.EXPECTED_CHECKED_OUT_SHA }}
        run: node http-generic-api/scripts/spec-kit-work-map-integration-gate.mjs

      - name: Upload bounded Work Map governance diagnostic
        if: steps.integration.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: work-map-integration-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-evidence/spec-kit-work-map-integration/
          if-no-files-found: error
          retention-days: 14

      - name: Fail closed on Work Map governance findings
        if: steps.integration.outcome == 'failure'
        shell: bash
        run: |
          echo "Spec Kit Work Map governance findings were detected."
          echo "Review the bounded diagnostic artifact before using the authorized autofix path."
          exit 1

      - name: Run Work Map governance regression tests
        if: steps.integration.outcome == 'success'
        run: node http-generic-api/test-spec-kit-work-map-governance-gate.mjs