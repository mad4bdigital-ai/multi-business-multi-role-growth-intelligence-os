name: Final Sprint 69 Disposable Cleanup

on:
  pull_request:
    branches:
      - Production
    paths:
      - .github/workflows/final-sprint69-disposable-cleanup.yml

permissions:
  contents: write

concurrency:
  group: final-sprint69-disposable-cleanup-20260730
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete disposable branches through Git transport
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: gpt/probe-production-runtime-parity-20260730
      SELF_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify ancestry and delete target and self branches
        shell: bash
        run: |
          set -euo pipefail

          DEFAULT_BRANCH="$(git remote show origin | sed -n '/HEAD branch/s/.*: //p')"
          test -n "$DEFAULT_BRANCH"

          git fetch --no-tags origin \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}" \
            "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/sprint69-target"

          DEFAULT_SHA="$(git rev-parse "refs/remotes/origin/${DEFAULT_BRANCH}")"
          TARGET_SHA="$(git rev-parse refs/remotes/origin/sprint69-target)"

          git merge-base --is-ancestor "$TARGET_SHA" "$DEFAULT_SHA"

          echo "CLEANUP_DEFAULT_BRANCH=$DEFAULT_BRANCH"
          echo "CLEANUP_DEFAULT_SHA=$DEFAULT_SHA"
          echo "TARGET_BRANCH_SHA=$TARGET_SHA"
          echo "TARGET_BRANCH_ANCESTOR_OF_DEFAULT=true"

          git push origin --delete "$TARGET_BRANCH"

          if git ls-remote --exit-code --heads origin "refs/heads/${TARGET_BRANCH}" >/dev/null 2>&1; then
            echo "Target branch still exists after delete" >&2
            exit 1
          fi

          echo "TARGET_BRANCH_DELETED=true"
          echo "TARGET_BRANCH_ABSENCE_READBACK=PASS"
          echo "SELF_BRANCH=$SELF_BRANCH"

          git push origin --delete "$SELF_BRANCH"
