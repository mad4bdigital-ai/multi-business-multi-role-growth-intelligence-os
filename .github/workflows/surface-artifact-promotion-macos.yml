name: Surface Artifact Promotion macOS

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/surface-artifact-promotion-macos.yml

permissions:
  contents: write

concurrency:
  group: surface-artifact-promotion-macos-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  promote:
    if: >-
      github.repository == 'mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os' &&
      github.event.pull_request.number == 5685 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/surface-current-main-clean-v2-20260803' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: macos-14
    timeout-minutes: 30
    env:
      TARGET_BRANCH: gpt/surface-current-main-clean-v2-20260803
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      WORKFLOW_PATH: .github/workflows/surface-artifact-promotion-macos.yml
      TARGET_FILE: http-generic-api/frontend-surface-dispatch.generated.json
      GOVERNANCE_FILE: http-generic-api/frontend-operation-governance.generated.json
      OPENAPI_INDEX: http-generic-api/openapi/frontend-runtime-routes.generated.yaml

    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact bounded trigger
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "${TARGET_BRANCH}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          changed="$(git diff --name-only HEAD^ HEAD)"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')" -eq 1
          test "$changed" = "${WORKFLOW_PATH}"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Regenerate from current repository authority
        shell: bash
        run: |
          set -Eeuo pipefail
          npm --prefix http-generic-api run frontend:dispatch:generate
          npm --prefix http-generic-api run frontend:dispatch:check
          node http-generic-api/test-surface-callability-full-closure.mjs
          node http-generic-api/scripts/maintenance-tools/verify-hostinger-full-closure-safety.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const artifact = JSON.parse(fs.readFileSync('http-generic-api/frontend-surface-dispatch.generated.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('http-generic-api/resource-api-surface-callability.manifest.json', 'utf8'));
          const toolKeys = new Set((manifest.items || []).flatMap((item) => item.tool_keys || item.declared_tool_targets || []));
          if (artifact.schema_version !== 'frontend-surface-dispatch-v1') throw new Error('artifact_schema_mismatch');
          if (artifact?.baseline?.ref !== 'main') throw new Error('artifact_baseline_ref_mismatch');
          if (!Array.isArray(artifact?.baseline?.authority) || artifact.baseline.authority.length === 0) throw new Error('artifact_authority_missing');
          if (manifest.item_count !== 20) throw new Error(`surface_item_count_mismatch:${manifest.item_count}`);
          if (toolKeys.size !== 41) throw new Error(`surface_tool_key_count_mismatch:${toolKeys.size}`);
          console.log(JSON.stringify({
            ok: true,
            surface_items: manifest.item_count,
            surface_tool_keys: toolKeys.size,
            authority_files: artifact.baseline.authority.length,
            source_digest: artifact.baseline.source_digest,
            secrets_included: false,
          }));
          NODE

      - name: Remove temporary workflow and enforce bounded write set
        shell: bash
        run: |
          set -Eeuo pipefail
          rm "${WORKFLOW_PATH}"
          changed="$(git status --porcelain --untracked-files=all | sed -E 's/^...//' | sed -E 's/.* -> /' | sort -u)"
          printf '%s\n' "$changed"
          count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "$count" -ge 2
          test "$count" -le 4
          printf '%s\n' "$changed" | grep -Fxq "${WORKFLOW_PATH}"
          printf '%s\n' "$changed" | grep -Fxq "${TARGET_FILE}"
          while IFS= read -r path; do
            test -n "$path" || continue
            case "$path" in
              "$WORKFLOW_PATH"|"$TARGET_FILE"|"$GOVERNANCE_FILE"|"$OPENAPI_INDEX") ;;
              *) echo "Unexpected generated write: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Commit product-only result
        shell: bash
        run: |
          set -Eeuo pipefail
          before="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$before" = "$(git rev-parse HEAD)"
          git config user.name 'mad4bdigital-ai'
          git config user.email 'mad4bdigital-ai@users.noreply.github.com'
          git add -A
          git commit -m 'chore(frontend): regenerate Surface dispatch on current authority'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          after="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$after" = "$(git rev-parse HEAD)"
          test ! -e "${WORKFLOW_PATH}"
          npm --prefix http-generic-api run frontend:dispatch:check
