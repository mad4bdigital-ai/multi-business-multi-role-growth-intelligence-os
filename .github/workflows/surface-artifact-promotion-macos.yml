name: Surface Artifact Promotion macOS

# Temporary, PR-bounded self-removing generator trigger.
on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/surface-artifact-promotion-macos.yml

permissions:
  contents: write

concurrency:
  group: surface-artifact-promotion-macos-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  promote:
    if: >-
      github.repository == 'mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os' &&
      github.event.pull_request.number == 5685 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/surface-current-main-clean-v2-20260803' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: macos-14
    timeout-minutes: 30
    env:
      TARGET_BRANCH: gpt/surface-current-main-clean-v2-20260803
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      WORKFLOW_PATH: .github/workflows/surface-artifact-promotion-macos.yml
      TARGET_FILE: http-generic-api/frontend-surface-dispatch.generated.json
      GOVERNANCE_FILE: http-generic-api/frontend-operation-governance.generated.json
      OPENAPI_INDEX: http-generic-api/openapi/frontend-runtime-routes.generated.yaml
      RAW_WRITE_SET: ${{ runner.temp }}/generated-write-set-raw.txt
      NORMALIZED_WRITE_SET: ${{ runner.temp }}/generated-write-set.txt

    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact bounded trigger
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "${TARGET_BRANCH}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          changed="$(git diff --name-only HEAD^ HEAD)"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')" -eq 1
          test "$changed" = "${WORKFLOW_PATH}"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Generate frontend dispatch
        run: npm --prefix http-generic-api run frontend:dispatch:generate -- --baseline-ref="${EXPECTED_HEAD}"

      - name: Check frontend dispatch
        run: npm --prefix http-generic-api run frontend:dispatch:check

      - name: Verify Surface full closure
        working-directory: http-generic-api
        run: node test-surface-callability-full-closure.mjs

      - name: Verify Hostinger closure safety
        run: node http-generic-api/scripts/maintenance-tools/verify-hostinger-full-closure-safety.mjs

      - name: Verify artifact schema
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const artifact = JSON.parse(fs.readFileSync('http-generic-api/frontend-surface-dispatch.generated.json', 'utf8'));
          if (artifact.schema_version !== 'frontend-surface-dispatch-v1') {
            throw new Error(`artifact_schema_mismatch:${String(artifact.schema_version)}`);
          }
          NODE

      - name: Verify artifact baseline ref
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const artifact = JSON.parse(fs.readFileSync('http-generic-api/frontend-surface-dispatch.generated.json', 'utf8'));
          if (artifact?.baseline?.ref !== process.env.EXPECTED_HEAD) {
            throw new Error(`artifact_baseline_ref_mismatch:${String(artifact?.baseline?.ref)}:${String(process.env.EXPECTED_HEAD)}`);
          }
          NODE

      - name: Verify artifact authority files
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const artifact = JSON.parse(fs.readFileSync('http-generic-api/frontend-surface-dispatch.generated.json', 'utf8'));
          if (!Array.isArray(artifact?.baseline?.authority) || artifact.baseline.authority.length === 0) {
            throw new Error(`artifact_authority_missing:${JSON.stringify(artifact?.baseline?.authority ?? null)}`);
          }
          NODE

      - name: Verify Surface item count
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('http-generic-api/resource-api-surface-callability.manifest.json', 'utf8'));
          if (manifest.source_queue_item_count !== 20) {
            throw new Error(`surface_item_count_mismatch:${String(manifest.source_queue_item_count)}`);
          }
          NODE

      - name: Verify Surface tool key count
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const artifact = JSON.parse(fs.readFileSync('http-generic-api/frontend-surface-dispatch.generated.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('http-generic-api/resource-api-surface-callability.manifest.json', 'utf8'));
          const toolKeys = new Set(manifest.source_queue_tool_keys || []);
          if (toolKeys.size !== 41) {
            throw new Error(`surface_tool_key_count_mismatch:${toolKeys.size}`);
          }
          console.log(JSON.stringify({
            ok: true,
            surface_items: manifest.source_queue_item_count,
            surface_tool_keys: toolKeys.size,
            authority_files: artifact.baseline.authority.length,
            source_digest: artifact.baseline.source_digest,
            baseline_ref: artifact.baseline.ref,
            secrets_included: false,
          }));
          NODE

      - name: Remove temporary workflow locally
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f "${WORKFLOW_PATH}"
          rm -- "${WORKFLOW_PATH}"
          test ! -e "${WORKFLOW_PATH}"

      - name: Capture raw generated write set
        shell: bash
        run: |
          set -Eeuo pipefail
          git status --porcelain=v1 --untracked-files=all > "${RAW_WRITE_SET}"
          test -s "${RAW_WRITE_SET}"
          cat "${RAW_WRITE_SET}"

      - name: Normalize generated write set
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const rawPath = process.env.RAW_WRITE_SET;
          const normalizedPath = process.env.NORMALIZED_WRITE_SET;
          const raw = fs.readFileSync(rawPath, 'utf8');
          const paths = raw
            .split(/\r?\n/u)
            .filter(Boolean)
            .map((line) => {
              const payload = line.slice(3);
              const renameSeparator = ' -> ';
              return payload.includes(renameSeparator)
                ? payload.slice(payload.lastIndexOf(renameSeparator) + renameSeparator.length)
                : payload;
            });
          const unique = [...new Set(paths)].sort();
          fs.writeFileSync(normalizedPath, `${unique.join('\n')}\n`);
          console.log(unique.join('\n'));
          if (unique.length === 0) throw new Error('generated_write_set_empty');
          NODE

      - name: Upload generated write set
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-write-set-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ env.NORMALIZED_WRITE_SET }}
            ${{ env.RAW_WRITE_SET }}
          if-no-files-found: warn
          retention-days: 1

      - name: Enforce bounded write set
        shell: bash
        run: |
          set -Eeuo pipefail
          changed="$(cat "${NORMALIZED_WRITE_SET}")"
          count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "$count" -ge 2
          test "$count" -le 4
          printf '%s\n' "$changed" | grep -Fxq "${WORKFLOW_PATH}"
          printf '%s\n' "$changed" | grep -Fxq "${TARGET_FILE}"
          while IFS= read -r path; do
            test -n "$path" || continue
            case "$path" in
              "$WORKFLOW_PATH"|"$TARGET_FILE"|"$GOVERNANCE_FILE"|"$OPENAPI_INDEX") ;;
              *) echo "Unexpected generated write: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Commit product-only result
        shell: bash
        run: |
          set -Eeuo pipefail
          before="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$before" = "$(git rev-parse HEAD)"
          git config user.name 'mad4bdigital-ai'
          git config user.email 'mad4bdigital-ai@users.noreply.github.com'
          git add -A
          git commit -m 'chore(frontend): regenerate Surface dispatch on current authority'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          after="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$after" = "$(git rev-parse HEAD)"
          test ! -e "${WORKFLOW_PATH}"
          npm --prefix http-generic-api run frontend:dispatch:check
