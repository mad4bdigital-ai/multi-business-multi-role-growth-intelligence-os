name: Spec 013 Post-Merge Contract Closure

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: spec-013-post-merge-contract-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/spec-013-post-merge-contract-closure-20260731' &&
      github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out synchronized repair branch
        uses: actions/checkout@v5
        with:
          ref: fix/spec-013-post-merge-contract-closure-20260731
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Apply bounded runtime, OpenAPI, and regression repairs
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(text, old, new, label):
              count = text.count(old)
              assert count == 1, f'{label}: expected exactly one match, found {count}'
              return text.replace(old, new)

          routes_path = Path('http-generic-api/routes/systemLayerRoutes.js')
          routes = routes_path.read_text()
          old_admin = '''  router.get("/admin/system/tools", ...adminOnly, async (req, res) => {
            const body = await buildSystemToolsListResponse(req.auth, req.query || {});
            return res.status(200).json(await chunkSystemLayerResponse(body, req.query || {}));
          });'''
          new_admin = '''  router.get("/admin/system/tools", ...adminOnly, async (req, res) => {
            try {
              const body = await buildSystemToolsListResponse(req.auth, req.query || {});
              return res.status(200).json(await chunkSystemLayerResponse(body, req.query || {}));
            } catch (error) {
              return sendSystemToolCatalogError(res, error, "admin_system_tool_catalog_list_failed");
            }
          });'''
          routes_path.write_text(replace_once(routes, old_admin, new_admin, 'admin Catalog V2 handler'))

          root_path = Path('http-generic-api/openapi.yaml')
          root = root_path.read_text()
          root_targets = [
              ('/system/tools', 'get', 'backendBearerAuth'),
              ('/system/tools/catalog-observability', 'get', 'adminBearerAuth'),
              ('/system/tools/{toolName}', 'get', 'backendBearerAuth'),
              ('/system/capabilities/resolve', 'post', 'backendBearerAuth'),
              ('/system/tools/call', 'post', 'backendBearerAuth'),
          ]
          for path, method, bearer in root_targets:
              old = f'''  {path}:
                {method}:
                  tags: [system-layer]
                  security: [{bearer}: [], backendApiKeyAuth: []]'''
              new = f'''  {path}:
                {method}:
                  tags: [system-layer]
                  security: [{{ {bearer}: [] }}, {{ backendApiKeyAuth: [] }}]'''
              root = replace_once(root, old, new, f'root OpenAPI auth alternatives for {method.upper()} {path}')
          root_path.write_text(root)

          contract_path = Path('specs/013-system-tool-catalog-v2/contracts/system-tool-catalog-v2.openapi.yaml')
          contract = contract_path.read_text()
          contract = replace_once(
              contract,
              '''security:
                - bearerAuth: []''',
              '''security:
                - bearerAuth: []
                - backendApiKeyAuth: []''',
              'Spec 013 global auth alternatives',
          )
          contract = replace_once(
              contract,
              '''      security:
                    - bearerAuth: [admin]''',
              '''      security:
                    - bearerAuth: [admin]
                    - backendApiKeyAuth: []''',
              'Spec 013 observability auth alternatives',
          )
          contract = replace_once(
              contract,
              '''    bearerAuth:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT''',
              '''    bearerAuth:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
                  backendApiKeyAuth:
                    type: apiKey
                    in: header
                    name: x-api-key''',
              'Spec 013 API-key security scheme',
          )
          contract_path.write_text(contract)

          platform_test_path = Path('http-generic-api/test-platform-routes.mjs')
          platform_test = platform_test_path.read_text()
          anchor = '''{
            const r = await get("/system/tools/runtime_endpoint_preview");'''
          inserted = '''{
            const r = await get("/admin/system/tools?cursor=not-a-valid-catalog-cursor");
            ok("Catalog V2 admin invalid cursor returns 400", r.status === 400, `got ${r.status}`);
            ok("Catalog V2 admin invalid cursor returns stable error", r.body.error?.code === "SYSTEM_TOOL_CATALOG_CURSOR_INVALID", JSON.stringify(r.body));
            ok("Catalog V2 admin invalid cursor excludes secrets", r.body.secrets_included === false, JSON.stringify(r.body));
          }
          {
            const r = await get("/system/tools/runtime_endpoint_preview");'''
          platform_test_path.write_text(replace_once(platform_test, anchor, inserted, 'Catalog V2 HTTP regression anchor'))

          regression_path = Path('http-generic-api/test-system-tool-catalog-v2-post-merge-contract.mjs')
          regression_path.write_text(dedent(r'''
              import assert from "node:assert/strict";
              import { readFileSync } from "node:fs";
              import YAML from "yaml";

              const routes = readFileSync("routes/systemLayerRoutes.js", "utf8");
              const rootText = readFileSync("openapi.yaml", "utf8");
              const root = YAML.parse(rootText);
              const spec = YAML.parse(readFileSync("../specs/013-system-tool-catalog-v2/contracts/system-tool-catalog-v2.openapi.yaml", "utf8"));

              const adminStart = routes.indexOf('router.get("/admin/system/tools"');
              const adminEnd = routes.indexOf('router.post("/admin/system/tools/call"', adminStart);
              assert.ok(adminStart >= 0 && adminEnd > adminStart, "admin Catalog V2 list handler must be discoverable");
              const adminHandler = routes.slice(adminStart, adminEnd);
              assert.match(adminHandler, /try\s*\{/u);
              assert.match(adminHandler, /sendSystemToolCatalogError/u);
              assert.match(adminHandler, /admin_system_tool_catalog_list_failed/u);

              function assertAlternatives(document, path, method, schemes) {
                const security = document.paths?.[path]?.[method]?.security ?? document.security;
                assert.ok(Array.isArray(security), `${method.toUpperCase()} ${path} must declare security alternatives`);
                assert.ok(security.every((entry) => Object.keys(entry || {}).length === 1), `${method.toUpperCase()} ${path} must not combine auth schemes in one requirement object`);
                for (const scheme of schemes) {
                  assert.ok(security.some((entry) => Object.hasOwn(entry || {}, scheme)), `${method.toUpperCase()} ${path} must independently allow ${scheme}`);
                }
              }

              for (const [path, method, schemes] of [
                ["/system/tools", "get", ["backendBearerAuth", "backendApiKeyAuth"]],
                ["/system/tools/catalog-observability", "get", ["adminBearerAuth", "backendApiKeyAuth"]],
                ["/system/tools/{toolName}", "get", ["backendBearerAuth", "backendApiKeyAuth"]],
                ["/system/capabilities/resolve", "post", ["backendBearerAuth", "backendApiKeyAuth"]],
                ["/system/tools/call", "post", ["backendBearerAuth", "backendApiKeyAuth"]],
              ]) assertAlternatives(root, path, method, schemes);

              assert.doesNotMatch(rootText, /security:\s*\[(?:backendBearerAuth|adminBearerAuth):\s*\[\],\s*backendApiKeyAuth:\s*\[\]\]/u);
              for (const [path, method] of [
                ["/system/tools", "get"],
                ["/system/tools/catalog-observability", "get"],
                ["/system/tools/{toolName}", "get"],
                ["/system/capabilities/resolve", "post"],
              ]) assertAlternatives(spec, path, method, ["bearerAuth", "backendApiKeyAuth"]);
              assert.equal(spec.components?.securitySchemes?.backendApiKeyAuth?.name, "x-api-key");
              assert.equal(spec.components?.securitySchemes?.backendApiKeyAuth?.in, "header");

              console.log("System Tool Catalog V2 post-merge runtime and OpenAPI contract regressions passed");
          ''').lstrip())

          manifest_path = Path('http-generic-api/scripts/test-manifest.mjs')
          manifest = manifest_path.read_text()
          command = '  "node test-system-tool-catalog-v2-post-merge-contract.mjs",\n'
          assert command not in manifest, 'post-merge Catalog V2 regression already registered unexpectedly'
          anchor = '  "node test-status-component-readiness-freshness.mjs",\n'
          manifest_path.write_text(replace_once(manifest, anchor, command + anchor, 'test manifest registration'))
          PY

      - name: Run focused Catalog V2 closure regressions
        working-directory: http-generic-api
        run: |
          node --check routes/systemLayerRoutes.js
          node --check test-system-tool-catalog-v2-post-merge-contract.mjs
          node test-system-tool-catalog-v2.mjs
          node test-system-tool-catalog-v2-post-merge-contract.mjs
          node test-system-layer-response-fallback.mjs
          node test-platform-routes.mjs

      - name: Refresh bounded generated artifacts and contract guards
        working-directory: http-generic-api
        run: |
          git fetch origin main --depth=1
          npm run frontend:dispatch:generate -- --baseline-ref=main
          node scripts/generate-custom-gpt-schemas.mjs --write
          node test-frontend-operation-governance-generator.mjs
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-openapi-route-coverage.mjs
          npm run openapi:auth:check
          npm run schemas:guard

      - name: Enforce bounded write set
        shell: bash
        run: |
          mapfile -t CHANGED < <(git status --porcelain --untracked-files=all | sed -E 's/^...//')
          test ${#CHANGED[@]} -gt 0
          UNEXPECTED=""
          for file in "${CHANGED[@]}"; do
            case "$file" in
              http-generic-api/routes/systemLayerRoutes.js|\
              http-generic-api/openapi.yaml|\
              http-generic-api/test-platform-routes.mjs|\
              http-generic-api/test-system-tool-catalog-v2-post-merge-contract.mjs|\
              http-generic-api/scripts/test-manifest.mjs|\
              specs/013-system-tool-catalog-v2/contracts/system-tool-catalog-v2.openapi.yaml|\
              http-generic-api/frontend-operation-governance.generated.json|\
              http-generic-api/frontend-surface-dispatch.generated.json|\
              http-generic-api/openapi/frontend-runtime-routes.generated.yaml|\
              http-generic-api/openapi/openapi.custom-gpt.auth-dispatcher.yaml|\
              http-generic-api/openapi/openapi.custom-gpt.activation-admin.yaml|\
              http-generic-api/openapi/openapi.tenant-gpt.auth.yaml|\
              http-generic-api/openapi/openapi.tenant-gpt.activation.yaml|\
              http-generic-api/openapi.gpt-action.local-connector.yaml)
                ;;
              *) UNEXPECTED+="$file"$'\n' ;;
            esac
          done
          if [[ -n "$UNEXPECTED" ]]; then
            echo '::error::Repair changed files outside the bounded allowlist'
            printf '%s' "$UNEXPECTED"
            exit 1
          fi
          git diff --check

      - name: Commit bounded repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/spec-013-post-merge-contract-closure.yml
          git add --all
          git diff --cached --check
          git commit -m "fix(spec-013): close post-merge catalog contracts"
          git push origin HEAD:fix/spec-013-post-merge-contract-closure-20260731
