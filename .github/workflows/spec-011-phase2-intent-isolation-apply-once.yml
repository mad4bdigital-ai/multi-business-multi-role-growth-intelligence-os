name: Spec 011 Phase2 Intent Isolation Apply Once

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'gpt/spec-011-phase2-intent-isolation-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out governed branch
        uses: actions/checkout@v5
        with:
          ref: gpt/spec-011-phase2-intent-isolation-20260730
          fetch-depth: 0
          persist-credentials: true

      - name: Integrate intent-first resolution and scope isolation
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          resolver = Path('http-generic-api/canonicalExecutionContractResolver.js')
          text = resolver.read_text()
          import_line = 'import { mergeIntentBinding, normalizeIntentKey, resolveExecutionIntentBinding } from "./executionIntentBindingResolver.js";\n'
          anchor = 'import { buildDynamicCapabilityEnforcementShadow } from "./dynamicCapabilityEnforcementShadow.js";\n'
          if import_line not in text:
              if anchor not in text:
                  raise SystemExit('resolver import anchor missing')
              text = text.replace(anchor, anchor + import_line, 1)
          text = text.replace(
              'export const CANONICAL_EXECUTION_CONTRACT_RESOLVER_VERSION = "canonical-execution-contract-resolver-shadow-v1";',
              'export const CANONICAL_EXECUTION_CONTRACT_RESOLVER_VERSION = "canonical-execution-contract-resolver-shadow-v2";',
              1,
          )

          normalize = '''function normalizeInput(input = {}) {
            const requestedMode = lower(input.requested_mode || "preview");
            if (!REQUESTED_MODES.has(requestedMode)) {
              throw resolverError(400, "EXECUTION_CONTRACT_MODE_INVALID", "requested_mode must be preview or apply.");
            }
            const principalScope = lower(input.principal_scope || "admin");
            if (!PRINCIPAL_SCOPES.has(principalScope)) {
              throw resolverError(400, "EXECUTION_CONTRACT_PRINCIPAL_SCOPE_INVALID", "principal_scope must be admin, tenant, or internal.");
            }
            const tenantRef = compact(input.tenant_ref) || null;
            const intentKey = normalizeIntentKey(input.intent_key);
            if (principalScope === "tenant" && !tenantRef) {
              throw resolverError(400, "EXECUTION_INTENT_TENANT_REQUIRED", "tenant_ref is required for tenant execution resolution.", {
                intent_key: intentKey,
                principal_scope: principalScope,
              });
            }
            const request = {
              intent_key: intentKey,
              parent_action_key: compact(input.parent_action_key) || null,
              endpoint_key: compact(input.endpoint_key) || null,
              capability_key: compact(input.capability_key) || null,
              requested_mode: requestedMode,
              principal_scope: principalScope,
              tenant_ref: tenantRef,
              workspace_ref: compact(input.workspace_ref) || null,
              resource_ref: compact(input.resource_ref, 512) || null,
              runtime_surface: compact(input.runtime_surface) || null,
              capability_envelope_id: compact(input.capability_envelope_id, 64) || null,
              idempotency_key: compact(input.idempotency_key, 191) || null,
              context_revision: compact(input.context_revision) || null,
              input_sha256: optionalSha(input.input_sha256, "input_sha256"),
              expected_contract_hash: optionalSha(input.expected_contract_hash, "expected_contract_hash"),
              evidence: input.evidence && typeof input.evidence === "object" && !Array.isArray(input.evidence) ? input.evidence : {},
              intent_binding: null,
            };
            if (!intentKey) requireExactBindings(request);
            return request;
          }

          function requireExactBindings(request) {
            if (!request.parent_action_key) throw resolverError(400, "EXECUTION_CONTRACT_ACTION_REQUIRED", "parent_action_key is required when intent_key is not resolved.");
            if (!request.endpoint_key) throw resolverError(400, "EXECUTION_CONTRACT_ENDPOINT_REQUIRED", "endpoint_key is required when intent_key is not resolved.");
            if (!request.capability_key) throw resolverError(400, "EXECUTION_CONTRACT_CAPABILITY_REQUIRED", "capability_key is required when intent_key is not resolved.");
          }'''
          text, count = re.subn(
              r'function normalizeInput\(input = \{\}\) \{.*?\n\}\n\nasync function loadActionRows',
              normalize + '\n\nasync function loadActionRows',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('normalizeInput replacement failed')

          scope_guard = '''
          function enforcePrincipalScope(request, action, endpoint) {
            if (request.principal_scope !== "admin" && (bool(action.admin_only) || bool(endpoint.admin_only))) {
              throw resolverError(403, "EXECUTION_CONTRACT_PRINCIPAL_SCOPE_CONFLICT", "The selected execution contract is restricted to admin principals.", {
                intent_key: request.intent_key,
                principal_scope: request.principal_scope,
                parent_action_key: request.parent_action_key,
                endpoint_key: request.endpoint_key,
              });
            }
          }
          '''
          derive_anchor = '\nfunction deriveBindings(request, action, endpoint) {'
          if 'function enforcePrincipalScope' not in text:
              if derive_anchor not in text:
                  raise SystemExit('deriveBindings anchor missing')
              text = text.replace(derive_anchor, scope_guard + derive_anchor, 1)

          selection = '''function actorScopeCompatible(actorScope, principalScope) {
            const scope = lower(actorScope);
            if (["shared", "global", "any"].includes(scope)) return true;
            const aliases = {
              admin: new Set(["admin", "platform_admin"]),
              tenant: new Set(["tenant", "tenant_user"]),
              internal: new Set(["internal", "system"]),
            };
            return aliases[principalScope]?.has(scope) || false;
          }

          function selectResourceOperation(rows, endpoint, runtimeSurface, principalScope, strictScope = false) {
            const ranked = rows
              .map((row) => ({ row, score: resourceOperationScore(row, endpoint, runtimeSurface) }))
              .filter((item) => item.score > 0)
              .sort((a, b) => b.score - a.score || String(a.row.operation_id).localeCompare(String(b.row.operation_id)));
            const scoped = ranked.filter(({ row }) => actorScopeCompatible(row.actor_scope, principalScope));
            if (ranked.length > 0 && scoped.length === 0 && strictScope) {
              throw resolverError(403, "EXECUTION_CONTRACT_PRINCIPAL_SCOPE_CONFLICT", "Resource-operation bindings exist only for a different principal scope.", {
                principal_scope: principalScope,
                runtime_surface: runtimeSurface,
                endpoint_key: endpoint.endpoint_key,
                available_scopes: [...new Set(ranked.map(({ row }) => lower(row.actor_scope)).filter(Boolean))].sort(),
              });
            }
            const candidates = scoped.length > 0 ? scoped : strictScope ? [] : ranked;
            const [selected, runnerUp] = candidates;
            if (selected && runnerUp && selected.score === runnerUp.score) {
              throw resolverError(409, "EXECUTION_CONTRACT_AMBIGUOUS", "More than one equally ranked resource operation exists.", {
                runtime_surface: runtimeSurface,
                endpoint_key: endpoint.endpoint_key,
                principal_scope: principalScope,
                candidate_count: candidates.length,
              });
            }
            return selected?.row || null;
          }'''
          text, count = re.subn(
              r'function selectResourceOperation\(rows, endpoint, runtimeSurface\) \{.*?\n\}\n\nasync function loadReadbackRows',
              selection + '\n\nasync function loadReadbackRows',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('resource operation selection replacement failed')

          start_old = '''export async function resolveCanonicalExecutionContract(input = {}, deps = {}) {
            const request = normalizeInput(input);
            const pool = deps.pool || getPool();
            const observedAt = typeof deps.now === "function" ? deps.now() : new Date().toISOString();
            const nowMs = new Date(observedAt).getTime();
            const action = selectAction(await loadActionRows(pool, request.parent_action_key), request.parent_action_key);
            const endpoint = selectEndpoint(await loadEndpointRows(pool, request.parent_action_key, request.endpoint_key), request.parent_action_key, request.endpoint_key);
            const bindings = deriveBindings(request, action, endpoint);'''
          start_new = '''export async function resolveCanonicalExecutionContract(input = {}, deps = {}) {
            const initialRequest = normalizeInput(input);
            const pool = deps.pool || getPool();
            const observedAt = typeof deps.now === "function" ? deps.now() : new Date().toISOString();
            const nowMs = new Date(observedAt).getTime();
            const intentBinding = await resolveExecutionIntentBinding(initialRequest, { pool, now: () => observedAt });
            const request = mergeIntentBinding(initialRequest, intentBinding);
            requireExactBindings(request);
            const action = selectAction(await loadActionRows(pool, request.parent_action_key), request.parent_action_key);
            const endpoint = selectEndpoint(await loadEndpointRows(pool, request.parent_action_key, request.endpoint_key), request.parent_action_key, request.endpoint_key);
            enforcePrincipalScope(request, action, endpoint);
            const bindings = deriveBindings(request, action, endpoint);'''
          if start_old not in text:
              raise SystemExit('resolver main start anchor missing')
          text = text.replace(start_old, start_new, 1)
          text = text.replace(
              'const resourceOperation = selectResourceOperation(resourceRows, endpoint, bindings.runtime_surface);',
              'const resourceOperation = selectResourceOperation(resourceRows, endpoint, bindings.runtime_surface, request.principal_scope, Boolean(request.intent_binding) || request.principal_scope === "tenant");',
              1,
          )
          text = text.replace(
              '    resolver_version: CANONICAL_EXECUTION_CONTRACT_RESOLVER_VERSION,\n    action_key: request.parent_action_key,',
              '    resolver_version: CANONICAL_EXECUTION_CONTRACT_RESOLVER_VERSION,\n    intent_key: request.intent_key,\n    intent_binding_revision: request.intent_binding?.binding_revision || null,\n    intent_binding_source_registry: request.intent_binding?.source_registry || null,\n    action_key: request.parent_action_key,',
              1,
          )
          text = text.replace(
              '    request: {\n      parent_action_key: request.parent_action_key,',
              '    request: {\n      intent_key: request.intent_key,\n      parent_action_key: request.parent_action_key,',
              1,
          )
          text = text.replace(
              '    selection: {\n      action: safeAction(action),',
              '    selection: {\n      intent_binding: request.intent_binding,\n      action: safeAction(action),',
              1,
          )
          text = text.replace(
              '    guarantees: {\n      registry_authority: "mysql_primary",',
              '    guarantees: {\n      intent_first_resolution: Boolean(request.intent_binding),\n      explicit_binding_compatibility_checked: Boolean(request.intent_binding),\n      tenant_scope_enforced: request.principal_scope !== "tenant" || Boolean(request.tenant_ref),\n      no_secret_intent_columns_selected: true,\n      registry_authority: "mysql_primary",',
              1,
          )
          resolver.write_text(text)

          manifest = Path('http-generic-api/scripts/test-manifest.mjs')
          lines = manifest.read_text().splitlines()
          commands = [
              '  "node test-canonical-execution-intent-isolation.mjs",',
              '  "node test-execution-intent-binding-migration-contract.mjs",',
          ]
          close_index = max(i for i, line in enumerate(lines) if line.strip() == '];')
          previous = close_index - 1
          while previous >= 0 and not lines[previous].strip():
              previous -= 1
          if previous >= 0 and not lines[previous].rstrip().endswith(','):
              lines[previous] = lines[previous].rstrip() + ','
          for command in commands:
              if command not in lines:
                  lines.insert(close_index, command)
                  close_index += 1
          manifest.write_text('\n'.join(lines) + '\n')

          runner = Path('http-generic-api/test-test-manifest-runner.mjs')
          runner_text = runner.read_text()
          runner_anchor = '  "node test-platform-engine-validator-runner.mjs",\n'
          additions = ''.join(f'  "{command}",\n' for command in [
              'node test-canonical-execution-intent-isolation.mjs',
              'node test-execution-intent-binding-migration-contract.mjs',
          ])
          if 'node test-canonical-execution-intent-isolation.mjs' not in runner_text:
              if runner_anchor not in runner_text:
                  raise SystemExit('test runner anchor missing')
              runner_text = runner_text.replace(runner_anchor, runner_anchor + additions, 1)
          runner.write_text(runner_text)

          tasks = Path('specs/011-durable-governed-execution-and-agent-delegation/tasks.md')
          tasks_text = tasks.read_text()
          tasks_text = tasks_text.replace('- [ ] T123 Convert selected operations to intent-first input.', '- [x] T123 Convert selected operations to intent-first input.', 1)
          tasks_text = tasks_text.replace('- [ ] T124 Add Admin and Tenant isolation and no-secret resolver tests.', '- [x] T124 Add Admin and Tenant isolation and no-secret resolver tests.', 1)
          tasks.write_text(tasks_text)
          PY

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Verify focused resolver contracts
        working-directory: http-generic-api
        shell: bash
        run: |
          node --check executionIntentBindingResolver.js
          node --check canonicalExecutionContractResolver.js
          node --check test-canonical-execution-intent-isolation.mjs
          node test-canonical-execution-contract-resolver.mjs
          node test-canonical-execution-intent-isolation.mjs
          node test-execution-intent-binding-migration-contract.mjs
          node test-test-manifest-runner.mjs

      - name: Verify hardcoding and bounded write set
        shell: bash
        run: |
          printf '%s\n' \
            'http-generic-api/executionIntentBindingResolver.js' \
            'http-generic-api/canonicalExecutionContractResolver.js' \
            'http-generic-api/test-canonical-execution-intent-isolation.mjs' \
            'http-generic-api/test-execution-intent-binding-migration-contract.mjs' \
            > "$RUNNER_TEMP/spec011-intent-changed-files.txt"
          (cd http-generic-api && node scripts/context-kernel-hardcoding-scan.mjs --fail-on=runtime --changed-files-from="$RUNNER_TEMP/spec011-intent-changed-files.txt")
          allowed='^(http-generic-api/executionIntentBindingResolver.js|http-generic-api/canonicalExecutionContractResolver.js|http-generic-api/migrations/20260730_spec011_execution_intent_contract_bindings.sql|http-generic-api/test-canonical-execution-intent-isolation.mjs|http-generic-api/test-execution-intent-binding-migration-contract.mjs|http-generic-api/scripts/test-manifest.mjs|http-generic-api/test-test-manifest-runner.mjs|specs/011-durable-governed-execution-and-agent-delegation/phase2-intent-first-admin-tenant-isolation.md|specs/011-durable-governed-execution-and-agent-delegation/tasks.md|.github/workflows/spec-011-phase2-intent-isolation-apply-once.yml)$'
          bad="$(git status --porcelain --untracked-files=all | sed -E 's/^...//' | grep -Ev "$allowed" || true)"
          test -z "$bad" || { echo 'Unexpected paths:'; echo "$bad"; exit 1; }

      - name: Commit clean integration
        shell: bash
        run: |
          rm -f .github/workflows/spec-011-phase2-intent-isolation-apply-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat(spec-011): add intent-first resolver isolation'
          git fetch origin gpt/spec-011-phase2-intent-isolation-20260730
          git rebase origin/gpt/spec-011-phase2-intent-isolation-20260730
          git push origin HEAD:gpt/spec-011-phase2-intent-isolation-20260730
