name: PR 6572 Final Work Map Binding Producer

on:
  push:
    branches:
      - docs/migration-1042-surface-contract-remediation-20260807

permissions:
  contents: write
  actions: write

concurrency:
  group: pr6572-final-work-map-binding-producer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_PARENT_SHA: ca1f0767cb6fee4e990611522bd72dec36a041aa
      TARGET_BRANCH: docs/migration-1042-surface-contract-remediation-20260807
      HELPER_PATH: .github/workflows/pr6572-final-work-map-binding-producer.yml
      HOSTINGER_MANIFEST: specs/014-governed-hostinger-storage-orchestration/work-map-integration.json
      RETAIL_MANIFEST: specs/014-retail-commerce-operations-growth-os/work-map-integration.json
    steps:
      - name: Checkout exact publisher head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: docs/migration-1042-surface-contract-remediation-20260807

      - name: Validate immutable publisher ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT_SHA}"
          remote_head="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${GITHUB_SHA}"

      - name: Remove helper before deterministic fingerprinting
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${HELPER_PATH}"
          test ! -e "${HELPER_PATH}"

      - name: Run canonical binding producers and checks
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/pr6572-final-binding-publish"
          mkdir -p "${report}"
          node --check http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            | tee "${report}/hostinger-producer.json"
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            --feature-key 014-retail-commerce-operations-growth-os \
            | tee "${report}/retail-producer.json"
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --check \
            | tee "${report}/hostinger-check.json"
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            --feature-key 014-retail-commerce-operations-growth-os --check \
            | tee "${report}/retail-check.json"

      - name: Enforce exact bounded mutation surface
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/pr6572-final-binding-publish"
          mapfile -t changed < <(git status --porcelain=v1 | sed -E 's/^...//' | sort)
          printf '%s\n' "${changed[@]}" | tee "${report}/changed-paths.txt"
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = "${HELPER_PATH}"
          printf '%s\n' "${changed[@]}" | grep -Fxq "${HOSTINGER_MANIFEST}"
          printf '%s\n' "${changed[@]}" | grep -Fxq "${RETAIL_MANIFEST}"
          git diff --check

      - name: Commit bounded binding refresh and prove readback
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/pr6572-final-binding-publish"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- "${HELPER_PATH}"
          git add -- "${HOSTINGER_MANIFEST}" "${RETAIL_MANIFEST}"
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "3"
          git commit -m 'chore(spec-014): refresh final Work Map bindings'
          result_head="$(git rev-parse HEAD)"
          echo "result_head=${result_head}" >> "$GITHUB_OUTPUT"
          echo "${result_head}" > "${report}/result-head.txt"
          REPORT_PATH="${report}/final-readback.json" \
            node http-generic-api/scripts/spec014-final-work-map-readback.mjs \
            | tee "${report}/final-readback-stdout.json"
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --check
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            --feature-key 014-retail-commerce-operations-growth-os --check
          test -z "$(git status --porcelain)"

      - name: Push without force after remote readback
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/pr6572-final-binding-publish"
          pre_push_remote="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${pre_push_remote}" = "${GITHUB_SHA}"
          result_head="${{ steps.publish.outputs.result_head }}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          remote_after="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_after}" = "${result_head}"
          {
            echo "contract=mad4b.pr6572-final-work-map-binding-publish.v1"
            echo "source_head=${GITHUB_SHA}"
            echo "result_head=${result_head}"
            echo "force_push=false"
            echo "repository_mutation=candidate_branch_only"
            echo "provider_dispatch=false"
            echo "live_database_access=false"
            echo "migration_apply=false"
            echo "secrets_included=false"
          } > "${report}/metadata.txt"

      - name: Dispatch exact-head verification workflows
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/pr6572-final-binding-publish"
          result_head="${{ steps.publish.outputs.result_head }}"
          remote_head="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${result_head}"
          for workflow in ci.yml spec-kit-work-map-integration.yml hostinger-storage-final-work-map-readback-guard.yml; do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}" --jq '.state')"
            test "${state}" = "active"
            payload="$(jq -cn --arg ref "${TARGET_BRANCH}" '{ref:$ref}')"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" --input - <<<"${payload}"
          done
          echo "verification_dispatch=true" >> "${report}/metadata.txt"

      - name: Upload bounded publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr6572-final-work-map-binding-publish-${{ github.sha }}
          path: ${{ runner.temp }}/pr6572-final-binding-publish
          if-no-files-found: warn
          retention-days: 14
