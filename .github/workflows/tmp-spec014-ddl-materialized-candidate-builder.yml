name: Temporary Spec 014 DDL Materialized Candidate Builder

on:
  push:
    branches:
      - gpt/fix-spec014-ddl-materialized-production-candidate-20260803

permissions:
  contents: write

concurrency:
  group: tmp-spec014-ddl-materialized-candidate-builder
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact builder branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Patch guarded materialized release classification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/hostinger-storage-durable-authorized-injection-schema-ddl-guard.yml')
          test_path = Path('http-generic-api/test-hostinger-storage-durable-authorized-injection-schema-ddl-workflow.mjs')

          workflow = workflow_path.read_text()
          test = test_path.read_text()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          workflow = replace_once(
              workflow,
              """          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
""",
              """          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
""",
              'classifier SHA inputs',
          )

          workflow = replace_once(
              workflow,
              """        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
""",
              """        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
""",
              'read-only main fetch and git topology import',
          )

          workflow = replace_once(
              workflow,
              """          const isGovernedRollup = process.env.BASE_REF === 'main' && governedContract;
          const isGovernedRelease = process.env.BASE_REF === 'Production'
            && process.env.HEAD_REF === 'main'
            && process.env.HEAD_REPOSITORY === process.env.REPOSITORY
            && governedContract;
          const mode = isGovernedRollup ? 'integration' : isGovernedRelease ? 'release' : 'feature';
""",
              """          const isGovernedRollup = process.env.BASE_REF === 'main' && governedContract;
          const sameRepository = process.env.HEAD_REPOSITORY === process.env.REPOSITORY;
          const directMainRelease = process.env.BASE_REF === 'Production'
            && process.env.HEAD_REF === 'main'
            && sameRepository
            && governedContract;

          const runGit = (args) => execFileSync('git', args, {
            encoding: 'utf8',
            stdio: ['ignore', 'pipe', 'pipe'],
          }).trim();
          const releaseBranchPattern = /^release\\/production-candidate-\\d{8}-([0-9a-f]{8})-v[1-9]\\d*$/;
          let materializedRelease = false;
          if (process.env.BASE_REF === 'Production'
            && sameRepository
            && governedContract
            && releaseBranchPattern.test(process.env.HEAD_REF || '')) {
            try {
              const branchMatch = releaseBranchPattern.exec(process.env.HEAD_REF || '');
              const parents = runGit(['show', '-s', '--format=%P', process.env.HEAD_SHA]).split(/\\s+/).filter(Boolean);
              const firstParent = parents[0] || '';
              const messageLines = runGit(['show', '-s', '--format=%B', process.env.HEAD_SHA]).split(/\\r?\\n/);
              const headTree = runGit(['rev-parse', `${process.env.HEAD_SHA}^{tree}`]);
              const firstParentTree = runGit(['rev-parse', `${firstParent}^{tree}`]);
              let mainContainsFirstParent = false;
              try {
                execFileSync('git', ['merge-base', '--is-ancestor', firstParent, 'refs/remotes/origin/main'], {
                  stdio: 'ignore',
                });
                mainContainsFirstParent = true;
              } catch {
                mainContainsFirstParent = false;
              }
              materializedRelease = (parents.length === 2 || parents.length === 3)
                && parents[1] === process.env.BASE_SHA
                && branchMatch?.[1] === process.env.HEAD_SHA.slice(0, 8)
                && headTree === firstParentTree
                && mainContainsFirstParent
                && messageLines[0] === 'release: build governed Production promotion candidate'
                && messageLines.includes(`main=${firstParent}`)
                && messageLines.includes(`production=${process.env.BASE_SHA}`)
                && messageLines.includes('tree_policy=exact_main_tree');
            } catch {
              materializedRelease = false;
            }
          }

          const isGovernedRelease = directMainRelease || materializedRelease;
          const mode = isGovernedRollup ? 'integration' : isGovernedRelease ? 'release' : 'feature';
""",
              'materialized release topology classifier',
          )

          test = replace_once(
              test,
              """requireFragment('HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}', 'head repository classifier input');
requireFragment('REPOSITORY: ${{ github.repository }}', 'repository identity classifier input');
""",
              """requireFragment('HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}', 'head repository classifier input');
requireFragment('REPOSITORY: ${{ github.repository }}', 'repository identity classifier input');
requireFragment('HEAD_SHA: ${{ github.event.pull_request.head.sha }}', 'exact candidate SHA classifier input');
requireFragment('BASE_SHA: ${{ github.event.pull_request.base.sha }}', 'exact Production base SHA classifier input');
requireFragment("import { execFileSync } from 'node:child_process';", 'read-only git topology reader');
requireFragment("git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'", 'current main ancestry fetch');
""",
              'workflow test classifier inputs',
          )

          test = replace_once(
              test,
              """requireFragment("process.env.BASE_REF === 'Production'", 'Production release base requirement');
requireFragment("process.env.HEAD_REF === 'main'", 'protected main release head requirement');
requireFragment('process.env.HEAD_REPOSITORY === process.env.REPOSITORY', 'same-repository release requirement');
requireFragment("isGovernedRelease ? 'release' : 'feature'", 'governed release classification');
""",
              """requireFragment("process.env.BASE_REF === 'Production'", 'Production release base requirement');
requireFragment("process.env.HEAD_REF === 'main'", 'protected main release head requirement');
requireFragment('process.env.HEAD_REPOSITORY === process.env.REPOSITORY', 'same-repository release requirement');
requireFragment('const releaseBranchPattern = /^release\\/production-candidate-\\d{8}-([0-9a-f]{8})-v[1-9]\\d*$/;', 'exact governed release branch pattern');
requireFragment("parents[1] === process.env.BASE_SHA", 'Production direct-parent requirement');
requireFragment("branchMatch?.[1] === process.env.HEAD_SHA.slice(0, 8)", 'branch-to-candidate SHA binding');
requireFragment('headTree === firstParentTree', 'exact main-tree requirement');
requireFragment("['merge-base', '--is-ancestor', firstParent, 'refs/remotes/origin/main']", 'main ancestry requirement');
requireFragment("messageLines[0] === 'release: build governed Production promotion candidate'", 'builder commit title requirement');
requireFragment('messageLines.includes(`main=${firstParent}`)', 'pinned main message binding');
requireFragment('messageLines.includes(`production=${process.env.BASE_SHA}`)', 'pinned Production message binding');
requireFragment("messageLines.includes('tree_policy=exact_main_tree')", 'tree policy message binding');
requireFragment('const isGovernedRelease = directMainRelease || materializedRelease;', 'direct-or-materialized release classification');
requireFragment("isGovernedRelease ? 'release' : 'feature'", 'governed release classification');
""",
              'workflow test materialized release contract',
          )

          test = replace_once(
              test,
              """assert.equal(source.includes('git push'), false, 'workflow must not mutate repository state');
""",
              """assert.equal(source.includes('git push'), false, 'workflow must not mutate repository state');
assert.equal(source.includes("process.env.HEAD_REF.startsWith('release/')"), false, 'release prefix alone must never grant release mode');
""",
              'broad release-prefix rejection',
          )

          test = replace_once(
              test,
              """  release_requires_main_to_production: true,
  release_requires_same_repository: true,
  branch_specific_workflow_literals: false,
""",
              """  release_requires_main_to_production: true,
  release_requires_same_repository: true,
  materialized_release_requires_exact_branch_identity: true,
  materialized_release_requires_production_parent: true,
  materialized_release_requires_exact_main_tree: true,
  materialized_release_requires_main_ancestry: true,
  materialized_release_requires_builder_message_binding: true,
  broad_release_prefix_allowed: false,
  branch_specific_workflow_literals: false,
""",
              'workflow test evidence flags',
          )

          workflow_path.write_text(workflow)
          test_path.write_text(test)
          PY

      - name: Validate bounded repair
        shell: bash
        run: |
          set -euo pipefail
          node --check http-generic-api/test-hostinger-storage-durable-authorized-injection-schema-ddl-workflow.mjs
          node http-generic-api/test-hostinger-storage-durable-authorized-injection-schema-ddl-workflow.mjs
          node http-generic-api/test-hostinger-storage-durable-authorized-injection-schema-ddl.mjs
          git diff --check

      - name: Publish final two-file candidate and remove builder
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-spec014-ddl-materialized-candidate-builder.yml
          git add -A
          changed="$(git diff --cached --name-only)"
          expected="$(printf '%s\n' \
            '.github/workflows/hostinger-storage-durable-authorized-injection-schema-ddl-guard.yml' \
            '.github/workflows/tmp-spec014-ddl-materialized-candidate-builder.yml' \
            'http-generic-api/test-hostinger-storage-durable-authorized-injection-schema-ddl-workflow.mjs')"
          if [[ "$changed" != "$expected" ]]; then
            echo '::error::unexpected builder write set'
            printf 'actual:\n%s\nexpected:\n%s\n' "$changed" "$expected"
            exit 1
          fi
          git config user.name 'mad4b-repository-automation'
          git config user.email 'mad4b-repository-automation@users.noreply.github.com'
          git commit -m 'fix(ci): validate materialized Production candidates in DDL guard'
          git push origin "HEAD:${GITHUB_REF_NAME}"
