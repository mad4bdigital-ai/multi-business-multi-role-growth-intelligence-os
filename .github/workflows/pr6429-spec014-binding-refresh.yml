name: PR 6429 Spec 014 binding refresh

# trigger: arm-v3
on:
  push:
    branches:
      - gpt/repair/pr6429-spec014-binding-20260806

permissions:
  contents: write

concurrency:
  group: pr6429-spec014-binding-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WORK_BRANCH: gpt/repair/pr6429-spec014-binding-20260806
      WORKFLOW_PATH: .github/workflows/pr6429-spec014-binding-refresh.yml
      MANIFEST_PATH: specs/014-governed-hostinger-storage-orchestration/work-map-integration.json
      TASKS_PATH: specs/014-governed-hostinger-storage-orchestration/tasks.md
    steps:
      - name: Checkout exact helper head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: gpt/repair/pr6429-spec014-binding-20260806

      - name: Verify immutable helper binding
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --exit-code origin "refs/heads/${WORK_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${{ github.sha }}"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Remove temporary workflow before fingerprinting
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${WORKFLOW_PATH}"
          git add -u -- "${WORKFLOW_PATH}"
          test ! -e "${WORKFLOW_PATH}"

      - name: Run canonical Spec 014 binding producer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pr6429-spec014-binding-refresh"
          node --check http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            | tee "${RUNNER_TEMP}/pr6429-spec014-binding-refresh/producer.json"

      - name: Enforce bounded file scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}" > "${RUNNER_TEMP}/pr6429-spec014-binding-refresh/unstaged-paths.txt"
          test "${#changed[@]}" -ge 1
          printf '%s\n' "${changed[@]}" | grep -Fxq "${MANIFEST_PATH}"
          unexpected="$(printf '%s\n' "${changed[@]}" | grep -v -E '^specs/014-governed-hostinger-storage-orchestration/(work-map-integration.json|tasks.md)$' || true)"
          if [[ -n "${unexpected}" ]]; then
            printf 'Unexpected path(s):\n%s\n' "${unexpected}" >&2
            exit 1
          fi
          git diff --check
          git add -- "${MANIFEST_PATH}"
          if ! git diff --quiet -- "${TASKS_PATH}"; then
            git add -- "${TASKS_PATH}"
          fi
          git diff --cached --name-only | sort > "${RUNNER_TEMP}/pr6429-spec014-binding-refresh/staged-paths.txt"
          grep -Fxq "${WORKFLOW_PATH}" "${RUNNER_TEMP}/pr6429-spec014-binding-refresh/staged-paths.txt"
          grep -Fxq "${MANIFEST_PATH}" "${RUNNER_TEMP}/pr6429-spec014-binding-refresh/staged-paths.txt"

      - name: Commit candidate and prove final readback
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(spec-014): refresh final Work Map binding'
          result_head="$(git rev-parse HEAD)"
          echo "${result_head}" > "${RUNNER_TEMP}/pr6429-spec014-binding-refresh/result-head.txt"
          REPORT_PATH="${RUNNER_TEMP}/pr6429-spec014-binding-refresh/readback.json" \
            node http-generic-api/scripts/spec014-final-work-map-readback.mjs \
            | tee "${RUNNER_TEMP}/pr6429-spec014-binding-refresh/readback-stdout.json"
          test -z "$(git status --porcelain)"

      - name: Push without force after remote readback
        shell: bash
        run: |
          set -euo pipefail
          pre_push_remote="$(git ls-remote --exit-code origin "refs/heads/${WORK_BRANCH}" | awk '{print $1}')"
          test "${pre_push_remote}" = "${{ github.sha }}"
          result_head="$(cat "${RUNNER_TEMP}/pr6429-spec014-binding-refresh/result-head.txt")"
          git push origin "HEAD:refs/heads/${WORK_BRANCH}"
          remote_after="$(git ls-remote --exit-code origin "refs/heads/${WORK_BRANCH}" | awk '{print $1}')"
          test "${remote_after}" = "${result_head}"
          {
            echo "source_head=${{ github.sha }}"
            echo "result_head=${result_head}"
            echo "force_push=false"
            echo "repository_mutation=helper_branch_only"
            echo "provider_dispatch=false"
            echo "live_database_access=false"
            echo "migration_apply=false"
            echo "secrets_included=false"
          } > "${RUNNER_TEMP}/pr6429-spec014-binding-refresh/bindings.txt"

      - name: Upload refresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr6429-spec014-binding-refresh-${{ github.sha }}
          path: ${{ runner.temp }}/pr6429-spec014-binding-refresh
          if-no-files-found: warn
          retention-days: 14
