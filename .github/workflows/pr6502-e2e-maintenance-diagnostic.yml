name: PR 6502 E2E Maintenance Remediation

on:
  push:
    branches:
      - fix/push-workflow-runner-context-registration-main-ba10f269-20260806

permissions:
  contents: write

concurrency:
  group: pr6502-e2e-maintenance-remediation
  cancel-in-progress: false

jobs:
  remediate:
    if: github.repository == 'mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify exact bounded head
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REF_NAME}" = "fix/push-workflow-runner-context-registration-main-ba10f269-20260806"
          test "$(git rev-parse HEAD^)" = "6fac4f45839e7ea254841e2f678f7059b5b61684"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')" = "${GITHUB_SHA}"
      - name: Restore explicit fail-closed E2E safety declaration
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = '.changes/e2e/push-workflow-runner-context-registration.json';
          const contract = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (contract.delivery_mode !== 'single_pr') throw new Error('unexpected delivery_mode');
          if (contract.current_phase !== 'resilient') throw new Error('unexpected current_phase');
          if (contract.secrets_included !== undefined && contract.secrets_included !== false) throw new Error('unsafe secrets_included value');
          contract.secrets_included = false;
          fs.writeFileSync(path, `${JSON.stringify(contract, null, 2)}\n`);
          NODE
          rm -f .github/workflows/pr6502-e2e-maintenance-diagnostic.yml
          git add -A
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.changes/e2e/push-workflow-runner-context-registration.json' '.github/workflows/pr6502-e2e-maintenance-diagnostic.yml' | sort)"
          test "$changed" = "$expected"
          git diff --cached --check
      - name: Commit and fast-forward push
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(e2e): restore explicit no-secrets maintenance declaration"
          remote_before="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "$remote_before" = "${GITHUB_SHA}"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
