name: Sync PR 3298 With Main

on:
  push:
    branches:
      - gpt/reconcile-pr-3182-20260730-v2
    paths:
      - .github/workflows/sync-pr-3298-with-main.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-pr-3298-with-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_MAIN_SHA: 3a4a643c64e16ccddafd3967c6b87b3f1b4ad7a0
      TARGET_REF: gpt/reconcile-pr-3182-20260730-v2
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: gpt/reconcile-pr-3182-20260730-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Guard and merge pinned main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/main:refs/remotes/origin/main
          ACTUAL_MAIN_SHA="$(git rev-parse origin/main)"
          test "$ACTUAL_MAIN_SHA" = "$EXPECTED_MAIN_SHA" || {
            echo "::error::main moved before sync: expected=$EXPECTED_MAIN_SHA actual=$ACTUAL_MAIN_SHA"
            exit 1
          }
          git merge --no-ff --no-edit origin/main
          git diff --check

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Verify reconciled contracts
        working-directory: http-generic-api
        run: |
          node test-deployment-manifest-generator.mjs
          node test-deployment-manifest.mjs
          node test-frontend-operation-governance-generator.mjs
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-openapi-route-coverage.mjs
          npm run openapi:auth:check
          npm run schemas:guard

      - name: Recheck main and push clean merge
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/main:refs/remotes/origin/main
          ACTUAL_MAIN_SHA="$(git rev-parse origin/main)"
          test "$ACTUAL_MAIN_SHA" = "$EXPECTED_MAIN_SHA" || {
            echo "::error::main moved during sync: expected=$EXPECTED_MAIN_SHA actual=$ACTUAL_MAIN_SHA"
            exit 1
          }
          rm -f .github/workflows/sync-pr-3298-with-main.yml
          git add -A
          git commit --amend --no-edit
          git push origin "HEAD:${TARGET_REF}"
