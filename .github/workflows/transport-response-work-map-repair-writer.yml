name: Transport Response Work Map Repair Writer

on:
  push:
    branches:
      - fix/transport-response-schema-promotion-readiness-20260806
    paths:
      - .github/workflows/transport-response-work-map-repair-writer.yml

permissions:
  contents: write

concurrency:
  group: transport-response-work-map-repair-writer
  cancel-in-progress: false

jobs:
  write:
    if: github.repository == 'mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os' && github.ref == 'refs/heads/fix/transport-response-schema-promotion-readiness-20260806'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@v5
        with:
          ref: fix/transport-response-schema-promotion-readiness-20260806
          fetch-depth: 0
          persist-credentials: true

      - name: Verify bounded writer introduction
        shell: bash
        env:
          EXPECTED_BASE_SHA: 19b2cb731ca5f057a052dad1e4ac4263e27939ec
        run: |
          set -Eeuo pipefail
          workflow='.github/workflows/transport-response-work-map-repair-writer.yml'
          test "$(git diff --name-only "${EXPECTED_BASE_SHA}" HEAD)" = "${workflow}"
          git rm "${workflow}"
          git diff --quiet "${EXPECTED_BASE_SHA}" -- .

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Generate exact Work Map repair
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check http-generic-api/scripts/platform-work-map-generator.mjs
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          node http-generic-api/scripts/platform-work-map-generator.mjs --check

      - name: Verify exact candidate identity and scope
        shell: bash
        env:
          EXPECTED_BASE_SHA: 19b2cb731ca5f057a052dad1e4ac4263e27939ec
          EXPECTED_SOURCE_HASH: 1c45413330d694a3e151d56a41763880c2889372eb683180621112a5a1942845
        run: |
          set -Eeuo pipefail
          expected="$(mktemp)"
          actual="$(mktemp)"
          cat > "${expected}" <<'EOF'
          docs/work-maps/README.md
          docs/work-maps/data-model-domain-map.md
          docs/work-maps/observability-release-map.md
          docs/work-maps/work-map-coverage-matrix.md
          EOF
          git diff --name-only "${EXPECTED_BASE_SHA}" -- . | sort > "${actual}"
          sort -o "${expected}" "${expected}"
          diff -u "${expected}" "${actual}"
          grep -Fq "Source hash: \`${EXPECTED_SOURCE_HASH}\`" docs/work-maps/README.md
          test -z "$(git diff --name-only "${EXPECTED_BASE_SHA}" -- . | grep -Ev '^docs/work-maps/(README|data-model-domain-map|observability-release-map|work-map-coverage-matrix)\.md$' || true)"

      - name: Run focused Work Map governance checks
        shell: bash
        run: |
          set -Eeuo pipefail
          node http-generic-api/scripts/pipeline-connectivity-check.mjs
          node http-generic-api/scripts/work-map-schema-classification-contract.mjs
          node http-generic-api/scripts/work-map-schema-classification.mjs
          node http-generic-api/test-platform-work-map-generator.mjs
          node http-generic-api/test-pipeline-connectivity-check.mjs
          node http-generic-api/test-work-map-schema-classification.mjs
          node http-generic-api/test-work-map-schema-classification-contract.mjs
          node http-generic-api/test-spec-kit-work-map-governance-gate.mjs

      - name: Commit bounded Work Map repair
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow='.github/workflows/transport-response-work-map-repair-writer.yml'
          git add -A
          git diff --cached --check

          expected_names="$(mktemp)"
          actual_names="$(mktemp)"
          cat > "${expected_names}" <<'EOF'
          .github/workflows/transport-response-work-map-repair-writer.yml
          docs/work-maps/README.md
          docs/work-maps/data-model-domain-map.md
          docs/work-maps/observability-release-map.md
          docs/work-maps/work-map-coverage-matrix.md
          EOF
          sort -o "${expected_names}" "${expected_names}"
          git diff --cached --name-only | sort > "${actual_names}"
          diff -u "${expected_names}" "${actual_names}"

          test "$(git diff --cached --name-status -- "${workflow}")" = "$(printf 'D\t%s' "${workflow}")"
          for path in \
            'docs/work-maps/README.md' \
            'docs/work-maps/data-model-domain-map.md' \
            'docs/work-maps/observability-release-map.md' \
            'docs/work-maps/work-map-coverage-matrix.md'
          do
            test "$(git diff --cached --name-status -- "${path}")" = "$(printf 'M\t%s' "${path}")"
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(work-maps): refresh migration 1048 readiness maps'
          git push origin HEAD:fix/transport-response-schema-promotion-readiness-20260806
