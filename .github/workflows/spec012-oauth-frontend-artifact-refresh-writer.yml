name: Spec 012 OAuth Synchronized Artifact Retirement Writer

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/spec012-oauth-frontend-artifact-refresh-writer.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: spec012-oauth-synchronized-artifact-retirement-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  verify-retire-certify-push:
    if: github.event.pull_request.number == 6128 && github.event.pull_request.head.ref == 'gpt/spec012-oauth-canonical-deps-current-main-v2-20260804'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      EXPECTED_MAIN_SHA: 07264baf9957a26bb853df03e7cdb579c7a5c7e7
      PRE_UPDATE_HEAD: e44ad94ba23f85009632393741128c3b64c4eb11
      BRANCH_NAME: gpt/spec012-oauth-canonical-deps-current-main-v2-20260804
      WORKFLOW_PATH: .github/workflows/spec012-oauth-frontend-artifact-refresh-writer.yml

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify immutable synchronized five-file envelope
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.draft }}" = "true"
          git fetch --no-tags origin main "${BRANCH_NAME}"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD^)" = "${PRE_UPDATE_HEAD}"
          test "$(git rev-parse origin/main)" = "${EXPECTED_MAIN_SHA}"
          test "$(git merge-base origin/main HEAD)" = "${EXPECTED_MAIN_SHA}"
          git merge-base --is-ancestor "${EXPECTED_MAIN_SHA}" HEAD
          test -z "$(git status --porcelain=v1)"
          mapfile -d '' -t files < <(git diff --name-only -z "${EXPECTED_MAIN_SHA}...HEAD" | sort -zu)
          expected=(
            ".changes/e2e/spec012-t031-oauth-token-route-test-parity.json"
            ".github/workflows/spec012-oauth-frontend-artifact-refresh-writer.yml"
            "http-generic-api/frontend-surface-dispatch.generated.json"
            "http-generic-api/routes/index.js"
            "http-generic-api/test-spec012-t031-oauth-token-route-wiring.mjs"
          )
          test "${#files[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${files[@]}")

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install locked dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Prove generated artifacts are current without writing
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          node scripts/frontend-operation-governance-generator.mjs --check
          node scripts/frontend-surface-dispatch.mjs --check --baseline-ref=main
          test -z "$(git status --porcelain=v1)"

      - name: Retire temporary workflow and certify final scope
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p evidence
          git rm "${WORKFLOW_PATH}"
          git commit -m "chore(spec-012): retire synchronized OAuth artifact writer"
          final_sha="$(git rev-parse HEAD)"
          mapfile -d '' -t files < <(git diff --name-only -z "${EXPECTED_MAIN_SHA}...${final_sha}" | sort -zu)
          expected=(
            ".changes/e2e/spec012-t031-oauth-token-route-test-parity.json"
            "http-generic-api/frontend-surface-dispatch.generated.json"
            "http-generic-api/routes/index.js"
            "http-generic-api/test-spec012-t031-oauth-token-route-wiring.mjs"
          )
          test "${#files[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${files[@]}")
          git diff --check "${EXPECTED_MAIN_SHA}...${final_sha}"
          test -z "$(git status --porcelain=v1)"
          echo "FINAL_SHA=${final_sha}" >> "${GITHUB_ENV}"

      - name: Validate OAuth frontend E2E and complete manifest
        shell: bash
        run: |
          set -euo pipefail
          (
            cd http-generic-api
            node test-spec012-t031-oauth-token-route-wiring.mjs
            node test-auth-oauth-routes.mjs
            node test-spec012-t033-short-lived-bearer-profile.mjs
            node test-frontend-dispatch-workflow-baseline.mjs
            node test-frontend-operation-governance-generator.mjs
            node test-frontend-surface-dispatch.mjs
            node test-frontend-auth-openapi-parity.mjs
            node test-openapi-route-coverage.mjs
            npm run openapi:auth:check
            npm run frontend:dispatch:check
          ) | tee evidence/focused-validation.log
          node http-generic-api/scripts/e2e-phase-governance.mjs check --base "${EXPECTED_MAIN_SHA}" --head "${FINAL_SHA}" --report-file evidence/e2e-phase-evaluation.json
          (cd http-generic-api && npm test) | tee evidence/http-generic-api-manifest.log

      - name: Record bounded non-effects
        shell: bash
        run: |
          set -euo pipefail
          cat > evidence/non-effects.json <<JSON
          {
            "main": "${EXPECTED_MAIN_SHA}",
            "candidate": "${FINAL_SHA}",
            "effective_changed_files": 4,
            "generated_refresh_required": false,
            "generated_artifacts_current": true,
            "history_preserved": true,
            "force_push": false,
            "repository_scope": "non_protected_branch_only",
            "production_action": false,
            "provider_action": false,
            "database_mutation": false,
            "credential_access": false,
            "secrets_included": false
          }
          JSON

      - name: Push fast-forward exact head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main "${BRANCH_NAME}"
          test "$(git rev-parse origin/${BRANCH_NAME})" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse origin/main)" = "${EXPECTED_MAIN_SHA}"
          git push origin "HEAD:${BRANCH_NAME}"
          remote_sha="$(git ls-remote --heads origin "refs/heads/${BRANCH_NAME}" | awk '{print $1}')"
          test "${remote_sha}" = "$(git rev-parse HEAD)"

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec012-oauth-synchronized-artifact-retirement-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
