name: Spec 012 OAuth Generated Drift Diagnostic

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/spec012-oauth-frontend-artifact-refresh-writer.yml

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: spec012-oauth-generated-drift-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  diagnose-only:
    if: github.event.pull_request.number == 6128 && github.event.pull_request.head.ref == 'gpt/spec012-oauth-canonical-deps-current-main-v2-20260804'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      EXPECTED_MAIN_SHA: 07264baf9957a26bb853df03e7cdb579c7a5c7e7
      PRE_DIAGNOSTIC_HEAD: 06f5da7b74cc6dfa30b0e8c6a7cc86890c4e866e
      PRE_SYNC_BASE_SHA: 0f83d8faf1abf8b0bf149f08c10f652d2a3ed3fa
      BRANCH_NAME: gpt/spec012-oauth-canonical-deps-current-main-v2-20260804
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify immutable refs and local-only boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main "${BRANCH_NAME}"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD^)" = "${PRE_DIAGNOSTIC_HEAD}"
          test "$(git rev-parse origin/main)" = "${EXPECTED_MAIN_SHA}"
          test "$(git merge-base origin/main HEAD)" = "${PRE_SYNC_BASE_SHA}"
          test -z "$(git status --porcelain)"

      - name: Merge current main locally without push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff --no-edit "${EXPECTED_MAIN_SHA}"
          test "$(git rev-parse HEAD^2)" = "${EXPECTED_MAIN_SHA}"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install locked dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Capture before state and regenerate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/before evidence/after
          cp http-generic-api/frontend-operation-governance.generated.json evidence/before/
          cp http-generic-api/frontend-surface-dispatch.generated.json evidence/before/
          (cd http-generic-api && npm run frontend:dispatch:generate -- --baseline-ref=main && npm run frontend:dispatch:check) | tee evidence/generator.log
          cp http-generic-api/frontend-operation-governance.generated.json evidence/after/
          cp http-generic-api/frontend-surface-dispatch.generated.json evidence/after/
          git status --porcelain | tee evidence/status.txt
          git diff --numstat -- \
            http-generic-api/frontend-operation-governance.generated.json \
            http-generic-api/frontend-surface-dispatch.generated.json | tee evidence/numstat.txt
          git diff --no-ext-diff -- \
            http-generic-api/frontend-operation-governance.generated.json \
            http-generic-api/frontend-surface-dispatch.generated.json > evidence/generated.diff

      - name: Summarize exact JSON changes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const names = [
            'frontend-operation-governance.generated.json',
            'frontend-surface-dispatch.generated.json'
          ];
          const digest = (buf) => crypto.createHash('sha256').update(buf).digest('hex');
          const summarize = (before, after) => {
            let count = 0;
            const paths = [];
            const walk = (a, b, path) => {
              if (Object.is(a, b)) return;
              if (Array.isArray(a) && Array.isArray(b)) {
                if (a.length !== b.length) paths.push({ path: `${path}/length`, before: a.length, after: b.length });
                const max = Math.max(a.length, b.length);
                for (let i = 0; i < max; i += 1) walk(a[i], b[i], `${path}/${i}`);
                return;
              }
              if (a && b && typeof a === 'object' && typeof b === 'object') {
                const keys = [...new Set([...Object.keys(a), ...Object.keys(b)])].sort();
                for (const key of keys) walk(a[key], b[key], `${path}/${key.replaceAll('~','~0').replaceAll('/','~1')}`);
                return;
              }
              count += 1;
              if (paths.length < 500) paths.push({ path: path || '/', before: a, after: b });
            };
            walk(before, after, '');
            return { changed_leaf_count: count, captured_paths: paths.length, paths };
          };
          const report = {};
          for (const name of names) {
            const beforeRaw = fs.readFileSync(`evidence/before/${name}`);
            const afterRaw = fs.readFileSync(`evidence/after/${name}`);
            const before = JSON.parse(beforeRaw);
            const after = JSON.parse(afterRaw);
            report[name] = {
              before_sha256: digest(beforeRaw),
              after_sha256: digest(afterRaw),
              before_baseline: before.baseline ?? null,
              after_baseline: after.baseline ?? null,
              before_top_level_keys: Object.keys(before).sort(),
              after_top_level_keys: Object.keys(after).sort(),
              ...summarize(before, after)
            };
          }
          fs.writeFileSync('evidence/json-change-summary.json', `${JSON.stringify(report, null, 2)}\n`);
          console.log(JSON.stringify(report, null, 2));
          NODE

      - name: Record non-effects
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          cat > evidence/non-effects.json <<'JSON'
          {
            "diagnostic_only": true,
            "commit_created": false,
            "push_performed": false,
            "protected_ref_write": false,
            "production_action": false,
            "provider_action": false,
            "database_mutation": false,
            "credential_access": false,
            "secrets_included": false
          }
          JSON

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec012-oauth-generated-drift-diagnostic-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
