name: T016 CWD Alias Patch Builder

on:
  pull_request:
    branches:
      - agent/validate-t016-readiness-artifact-base-435c001
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: t016-cwd-alias-patch-builder-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate exact T016 alias patch
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/sprint69-1043-readiness-backfill-rebind-5169156192-v2' &&
      github.event.pull_request.head.sha == 'a886140f30b15695016baabe9e2cfcbdac40255d'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      TARGET_BRANCH: agent/sprint69-1043-readiness-backfill-rebind-5169156192-v2
      EXPECTED_HEAD: a886140f30b15695016baabe9e2cfcbdac40255d
      PATCH_DIR: /tmp/t016-cwd-alias-patch-${{ github.run_id }}
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable target head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"

      - name: Apply bounded CWD-independent alias patch
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const routesPath = 'http-generic-api/routes/adminCliRoutes.js';
          let source = fs.readFileSync(routesPath, 'utf8');
          const approvalConstant = 'export const CAPABILITY_RESOLUTION_ENVELOPE_APPROVE_SCRIPT = fileURLToPath(new URL("../scripts/capability-resolution-envelope-approve.mjs", import.meta.url));';
          const constants = [
            'export const CAPABILITY_RESOLUTION_DRY_RUN_SCRIPT = fileURLToPath(new URL("../scripts/capability-resolution-dry-run.mjs", import.meta.url));',
            'export const CAPABILITY_RESOLUTION_ENVELOPE_CREATE_SCRIPT = fileURLToPath(new URL("../scripts/capability-resolution-envelope-create.mjs", import.meta.url));',
            approvalConstant,
          ].join('\n');
          if (!source.includes(approvalConstant)) throw new Error('approval constant anchor missing');
          if (!source.includes('CAPABILITY_RESOLUTION_DRY_RUN_SCRIPT')) source = source.replace(approvalConstant, constants);

          const staleDryRun = 'capability_resolution_dry_run: { command: process.execPath, args: ["http-generic-api/scripts/capability-resolution-dry-run.mjs"], display_name: "Dynamic capability resolution dry-run", allow_extra_args: true, max_extra_args: 28, timeout_ms: 120000, built_in: true }';
          const fixedDryRun = 'capability_resolution_dry_run: { command: process.execPath, args: [CAPABILITY_RESOLUTION_DRY_RUN_SCRIPT], display_name: "Dynamic capability resolution dry-run", allow_extra_args: true, max_extra_args: 28, timeout_ms: 120000, built_in: true }';
          const staleCreate = 'capability_resolution_envelope_create: { command: process.execPath, args: ["http-generic-api/scripts/capability-resolution-envelope-create.mjs"], display_name: "Create capability resolution envelope ledger record", allow_extra_args: true, max_extra_args: 32, timeout_ms: 120000, built_in: true }';
          const fixedCreate = 'capability_resolution_envelope_create: { command: process.execPath, args: [CAPABILITY_RESOLUTION_ENVELOPE_CREATE_SCRIPT], display_name: "Create capability resolution envelope ledger record", allow_extra_args: true, max_extra_args: 32, timeout_ms: 120000, built_in: true }';
          if (!source.includes(staleDryRun) || !source.includes(staleCreate)) throw new Error('stale alias anchors missing');
          source = source.replace(staleDryRun, fixedDryRun).replace(staleCreate, fixedCreate);
          fs.writeFileSync(routesPath, source);

          const test = `import assert from 'node:assert/strict';
import path from 'node:path';
import { access, readFile } from 'node:fs/promises';
import { fileURLToPath } from 'node:url';

const routesPath = fileURLToPath(new URL('./routes/adminCliRoutes.js', import.meta.url));
const source = await readFile(routesPath, 'utf8');
const cases = [
  { name: 'dry_run', constant: 'CAPABILITY_RESOLUTION_DRY_RUN_SCRIPT', file: 'capability-resolution-dry-run.mjs', stale: 'args: ["http-generic-api/scripts/capability-resolution-dry-run.mjs"]' },
  { name: 'envelope_create', constant: 'CAPABILITY_RESOLUTION_ENVELOPE_CREATE_SCRIPT', file: 'capability-resolution-envelope-create.mjs', stale: 'args: ["http-generic-api/scripts/capability-resolution-envelope-create.mjs"]' },
];
for (const item of cases) {
  const declaration = \`export const \${item.constant} = fileURLToPath(new URL("../scripts/\${item.file}", import.meta.url));\`;
  assert.equal(source.split(declaration).length - 1, 1, \`\${item.name} constant must exist exactly once\`);
  assert.equal(source.includes(\`args: [\${item.constant}]\`), true, \`\${item.name} alias must use resolved path\`);
  assert.equal(source.includes(item.stale), false, \`\${item.name} stale relative alias must be absent\`);
  const scriptPath = fileURLToPath(new URL(\`./scripts/\${item.file}\`, import.meta.url));
  assert.equal(path.isAbsolute(scriptPath), true);
  assert.equal(scriptPath.includes(\`\${path.sep}http-generic-api\${path.sep}http-generic-api\${path.sep}\`), false);
  await access(scriptPath);
}
console.log(JSON.stringify({ ok: true, cwd_independent_aliases: cases.map((item) => item.name), doubled_segment: false, secrets_included: false }, null, 2));
`;
          fs.writeFileSync('http-generic-api/test-capability-envelope-create-alias-path.mjs', test);
          NODE

      - name: Validate bounded patch
        shell: bash
        run: |
          set -euo pipefail
          node --check http-generic-api/routes/adminCliRoutes.js
          node http-generic-api/test-capability-envelope-create-alias-path.mjs
          git diff --check
          mkdir -p "${PATCH_DIR}/http-generic-api/routes" "${PATCH_DIR}/http-generic-api"
          cp http-generic-api/routes/adminCliRoutes.js "${PATCH_DIR}/http-generic-api/routes/adminCliRoutes.js"
          cp http-generic-api/test-capability-envelope-create-alias-path.mjs "${PATCH_DIR}/http-generic-api/test-capability-envelope-create-alias-path.mjs"
          git diff > "${PATCH_DIR}/t016-cwd-alias.patch"
          git diff --stat > "${PATCH_DIR}/stat.txt"

      - name: Upload validated patch files
        uses: actions/upload-artifact@v4
        with:
          name: t016-cwd-alias-patch-${{ github.run_id }}
          path: ${{ env.PATCH_DIR }}
          if-no-files-found: error
          retention-days: 30
