name: CI Production Exact-Head Repair Writer

on:
  push:
    branches:
      - gpt/ci-production-promotion-exact-head-checkout-20260805
    paths:
      - .github/workflows/ci-production-exact-head-repair-writer.yml

permissions:
  contents: write

concurrency:
  group: ci-production-exact-head-repair-writer
  cancel-in-progress: false

jobs:
  repair-validate-retire-push:
    if: github.ref_name == 'gpt/ci-production-promotion-exact-head-checkout-20260805'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      EXPECTED_MAIN_SHA: 35c617610623e46709495a7f1928e7def8c9c251
      BRANCH_NAME: gpt/ci-production-promotion-exact-head-checkout-20260805
      WRITER_PATH: .github/workflows/ci-production-exact-head-repair-writer.yml
      E2E_CONTRACT_PATH: .changes/e2e/ci-canonical-exact-head-checkout.json
    steps:
      - name: Checkout exact writer registration head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify immutable branch and bounded registration scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "${EXPECTED_MAIN_SHA}" HEAD
          test "$(git rev-list --count "${EXPECTED_MAIN_SHA}..HEAD")" -eq 5
          remote_main="$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')"
          remote_branch="$(git ls-remote --heads origin "refs/heads/${BRANCH_NAME}" | awk '{print $1}')"
          test "${remote_main}" = "${EXPECTED_MAIN_SHA}"
          test "${remote_branch}" = "${GITHUB_SHA}"
          mapfile -t files < <(git diff --name-only "${EXPECTED_MAIN_SHA}...HEAD" | sort)
          test "${#files[@]}" -eq 1
          test "${files[0]}" = "${WRITER_PATH}"
          test -z "$(git status --porcelain=v1)"

      - name: Patch canonical CI exact-head identity and regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          expression = "$" + "{{ github.event.pull_request.head.sha || github.sha }}"

          ci_path = Path('.github/workflows/ci.yml')
          ci = ci_path.read_text(encoding='utf-8')
          checkout_pattern = re.compile(
              r'^      - uses: actions/checkout@v5\n(?:        with:\n          fetch-depth: 0\n)?',
              re.MULTILINE,
          )
          checkout_replacement = (
              "      - uses: actions/checkout@v5\n"
              "        with:\n"
              f"          ref: {expression}\n"
              "          fetch-depth: 0\n"
          )
          ci, checkout_count = checkout_pattern.subn(checkout_replacement, ci)
          if checkout_count != 4:
              raise SystemExit(f'expected four canonical checkout blocks, rebuilt {checkout_count}')

          old_deployment = '          DEPLOYMENT_COMMIT_SHA: "' + "$" + '{{ github.sha }}"\n'
          new_deployment = f'          DEPLOYMENT_COMMIT_SHA: "{expression}"\n'
          if ci.count(old_deployment) != 1:
              raise SystemExit('canonical deployment SHA binding not found exactly once')
          ci = ci.replace(old_deployment, new_deployment)
          exact_checkout_count = ci.count(checkout_replacement)
          if exact_checkout_count != 4:
              raise SystemExit(f'canonical exact checkout blocks after rebuild: {exact_checkout_count}, expected 4')
          deployment_count = ci.count(new_deployment)
          if deployment_count != 1:
              raise SystemExit(f'canonical deployment SHA bindings after rebuild: {deployment_count}, expected 1')
          ci_path.write_text(ci, encoding='utf-8')

          test_path = Path('http-generic-api/scripts/ci-pull-request-recovery-self-test.mjs')
          test = test_path.read_text(encoding='utf-8')
          recovery_anchor = (
              'const exactCheckoutCount = recovery.split("ref: ' + expression + '").length - 1;\n'
              'assert.equal(exactCheckoutCount, 2, `expected two exact candidate checkouts, got ${exactCheckoutCount}`);\n'
          )
          if test.count(recovery_anchor) != 1:
              raise SystemExit('recovery exact-checkout assertion anchor not found exactly once')
          canonical_assertions = (
              recovery_anchor
              + '\n'
              + 'const canonicalExactCheckoutCount = canonical.split("ref: ' + expression + '").length - 1;\n'
              + 'assert.equal(canonicalExactCheckoutCount, 4, `expected four canonical exact candidate checkouts, got ${canonicalExactCheckoutCount}`);\n'
              + 'assert(canonical.includes(\'DEPLOYMENT_COMMIT_SHA: "' + expression + '"\'), "canonical deployment evidence must bind to the exact pull-request head");\n'
          )
          test = test.replace(recovery_anchor, canonical_assertions)
          if test.count('  tests: requiredRecoveryTokens.length + 8,') != 1:
              raise SystemExit('test count anchor not found exactly once')
          test = test.replace('  tests: requiredRecoveryTokens.length + 8,', '  tests: requiredRecoveryTokens.length + 10,')
          if test.count('  exact_checkout_count: exactCheckoutCount,') != 1:
              raise SystemExit('summary anchor not found exactly once')
          test = test.replace(
              '  exact_checkout_count: exactCheckoutCount,',
              '  exact_checkout_count: exactCheckoutCount,\n  canonical_exact_checkout_count: canonicalExactCheckoutCount,\n  canonical_deployment_sha_exact: true,'
          )
          test_path.write_text(test, encoding='utf-8')

          contract_path = Path('.changes/e2e/ci-canonical-exact-head-checkout.json')
          if contract_path.exists():
              raise SystemExit(f'E2E contract already exists: {contract_path}')
          contract = {
              "$schema": "../../.specify/schemas/e2e-phases.schema.json",
              "schema_version": 1,
              "feature_key": "ci-canonical-exact-head-checkout",
              "title": "Canonical CI exact pull-request head identity",
              "delivery_mode": "single_pr",
              "current_phase": "mvp",
              "scope": {
                  "include": [
                      ".changes/e2e/ci-canonical-exact-head-checkout.json",
                      ".github/workflows/ci.yml",
                      "http-generic-api/scripts/ci-pull-request-recovery-self-test.mjs"
                  ]
              },
              "merge_contract": {"minimum_phase": "mvp"},
              "phases": [
                  {
                      "id": "mvp",
                      "status": "implemented",
                      "objective": "Bind every canonical CI checkout and deployment-evidence identity to the exact pull-request head so governed Production candidates are never evaluated through GitHub's synthetic merge commit.",
                      "e2e_journeys": [
                          {
                              "id": "canonical-ci-evaluates-exact-pull-request-head",
                              "end_to_end": True,
                              "level": "synthetic_runtime",
                              "actor": "GitHub Actions pull-request runner and repository reviewer",
                              "entrypoint": "A same-repository pull request targeting main or Production triggers .github/workflows/ci.yml.",
                              "terminal_outcome": "All four canonical CI jobs check out the exact pull-request head, deployment evidence records that same identity, and the regression test rejects any return to a synthetic merge checkout without granting write or runtime authority.",
                              "steps": [
                                  "Resolve the pull-request head SHA, with github.sha retained only for non-pull-request events.",
                                  "Checkout that exact identity with complete history in Syntax, Unit and Integration, Architecture Drift, and Execution Resolver jobs.",
                                  "Run the existing Production promotion classifier and Context Kernel scope logic against the checked-out candidate.",
                                  "Bind DEPLOYMENT_COMMIT_SHA to the same exact identity before producing read-only deployment evidence.",
                                  "Execute the CI recovery self-test to prove four canonical exact-head checkout blocks and one exact deployment identity binding."
                              ],
                              "assertions": [
                                  "Canonical CI contains exactly four exact-head checkout blocks.",
                                  "Canonical deployment evidence is bound to the exact pull-request head.",
                                  "Recovery retains its two exact-head checkout blocks.",
                                  "No synthetic merge identity is introduced as candidate evidence.",
                                  "No contents write, protected-ref mutation, deployment, provider call, database action, migration, credential access, external send, or force push is introduced.",
                                  "secrets_included is false."
                              ],
                              "tests": [
                                  {
                                      "id": "canonical-ci-exact-head-regression",
                                      "runner": "node",
                                      "working_directory": "http-generic-api",
                                      "path": "scripts/ci-pull-request-recovery-self-test.mjs",
                                      "args": []
                                  }
                              ],
                              "evidence_paths": [
                                  ".changes/e2e/ci-canonical-exact-head-checkout.json",
                                  ".github/workflows/ci.yml",
                                  "http-generic-api/scripts/ci-pull-request-recovery-self-test.mjs"
                              ]
                          }
                      ]
                  },
                  {
                      "id": "operational",
                      "status": "planned",
                      "objective": "Expose the verified exact checkout identity as a typed field across canonical CI progress reports."
                  },
                  {
                      "id": "resilient",
                      "status": "planned",
                      "objective": "Prove exact identity preservation across pull-request synchronize, rerun, push, and workflow-dispatch event families."
                  },
                  {
                      "id": "canary",
                      "status": "not_applicable",
                      "objective": "This CI identity correction has no provider or runtime canary authority."
                  },
                  {
                      "id": "production",
                      "status": "not_applicable",
                      "objective": "This CI identity correction grants no Production merge or deployment authority."
                  }
              ],
              "secrets_included": False
          }
          contract_path.write_text(json.dumps(contract, indent=2) + "\n", encoding='utf-8')
          PY

          literal_expression='$'
          literal_expression+='{{ github.event.pull_request.head.sha || github.sha }}'
          test "$(grep -F -c "ref: ${literal_expression}" .github/workflows/ci.yml)" -eq 4
          test "$(grep -F -c "DEPLOYMENT_COMMIT_SHA: \"${literal_expression}\"" .github/workflows/ci.yml)" -eq 1
          node http-generic-api/scripts/ci-pull-request-recovery-self-test.mjs
          node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "${E2E_CONTRACT_PATH}"
          git diff --check

      - name: Retire writer and create exact three-file candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm "${WRITER_PATH}"
          git add "${E2E_CONTRACT_PATH}" .github/workflows/ci.yml http-generic-api/scripts/ci-pull-request-recovery-self-test.mjs
          git commit -m "fix(ci): pin canonical CI to exact pull request head"
          final_sha="$(git rev-parse HEAD)"
          mapfile -t files < <(git diff --name-only "${EXPECTED_MAIN_SHA}...${final_sha}" | sort)
          expected=(
            ".changes/e2e/ci-canonical-exact-head-checkout.json"
            ".github/workflows/ci.yml"
            "http-generic-api/scripts/ci-pull-request-recovery-self-test.mjs"
          )
          test "${#files[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${files[@]}")
          git diff --check "${EXPECTED_MAIN_SHA}...${final_sha}"
          test -z "$(git status --porcelain=v1)"
          echo "FINAL_SHA=${final_sha}" >> "${GITHUB_ENV}"

      - name: Install locked dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Validate focused contract, E2E coverage, and complete manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          node http-generic-api/scripts/ci-pull-request-recovery-self-test.mjs | tee evidence/ci-pull-request-recovery-self-test.log
          node http-generic-api/scripts/e2e-phase-governance.mjs check \
            --base "${EXPECTED_MAIN_SHA}" \
            --head "${FINAL_SHA}" \
            --report-file evidence/e2e-phase-evaluation.json
          (cd http-generic-api && npm test) | tee evidence/http-generic-api-manifest.log

      - name: Record bounded non-effects
        shell: bash
        run: |
          set -euo pipefail
          cat > evidence/non-effects.json <<JSON
          {
            "base_main": "${EXPECTED_MAIN_SHA}",
            "candidate": "${FINAL_SHA}",
            "effective_changed_files": 3,
            "canonical_exact_checkout_count": 4,
            "recovery_exact_checkout_count": 2,
            "protected_ref_write": false,
            "production_merge": false,
            "deployment": false,
            "provider_action": false,
            "database_mutation": false,
            "migration_apply": false,
            "credential_access": false,
            "force_push": false,
            "secrets_included": false
          }
          JSON

      - name: Push fast-forward exact validated head
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')"
          remote_branch="$(git ls-remote --heads origin "refs/heads/${BRANCH_NAME}" | awk '{print $1}')"
          test "${remote_main}" = "${EXPECTED_MAIN_SHA}"
          test "${remote_branch}" = "${GITHUB_SHA}"
          git push origin "HEAD:${BRANCH_NAME}"
          remote_sha="$(git ls-remote --heads origin "refs/heads/${BRANCH_NAME}" | awk '{print $1}')"
          test "${remote_sha}" = "${FINAL_SHA}"

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-production-exact-head-repair-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
