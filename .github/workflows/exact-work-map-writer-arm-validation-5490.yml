name: Exact Work Map Writer ARM Validation 5490

on:
  pull_request:
    branches:
      - gpt/validate-work-map-writer-arm-base-5490-44ed1522
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: exact-work-map-writer-arm-validation-5490-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Exact Candidate Preflight
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    outputs:
      head_sha: ${{ steps.verify.outputs.head_sha }}
      main_sha: ${{ steps.verify.outputs.main_sha }}
    steps:
      - name: Checkout exact candidate with read-only token
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable same-repository candidate
        id: verify
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_HEAD_REF: gpt/work-map-writer-diagnostics-v3-20260803
          EXPECTED_HEAD_SHA: 1747a255640b0e21b08d04502159991e4dfcdf5f
          EXPECTED_MAIN_SHA: 44ed152286be85c4573c584cbe786fb2faf94c91
        run: |
          set -euo pipefail
          test "$HEAD_REPOSITORY" = "$REPOSITORY"
          test "$HEAD_REF" = "$EXPECTED_HEAD_REF"
          test "$HEAD_SHA" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${EXPECTED_HEAD_REF}:refs/remotes/origin/${EXPECTED_HEAD_REF}"

          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse refs/remotes/origin/${EXPECTED_HEAD_REF})" = "$EXPECTED_HEAD_SHA"
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" "$EXPECTED_HEAD_SHA"
          test "$(git rev-list --count "${EXPECTED_MAIN_SHA}..${EXPECTED_HEAD_SHA}")" = "2"

          mapfile -t files < <(git diff --name-only "$EXPECTED_MAIN_SHA"..."$EXPECTED_HEAD_SHA")
          test "${#files[@]}" -eq 1
          test "${files[0]}" = ".github/workflows/spec-kit-work-map-autofix.yml"

          printf 'head_sha=%s\n' "$EXPECTED_HEAD_SHA" >> "$GITHUB_OUTPUT"
          printf 'main_sha=%s\n' "$EXPECTED_MAIN_SHA" >> "$GITHUB_OUTPUT"

  syntax:
    name: Syntax and Governance Checks
    needs: preflight
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Run canonical syntax and focused Work Map governance checks
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/schema-docs-change-guard.mjs
          node http-generic-api/scripts/migration-placement-guard.mjs
          node http-generic-api/scripts/user-jwt-auth-governance.mjs
          node http-generic-api/scripts/interruption-readiness.mjs --ci --skip-dependencies --skip-worktree
          node validate-canonical-sources.mjs
          node build-canonicals.mjs --check
          node --check find-canonical-domain.mjs
          node http-generic-api/scripts/resource-api-coverage-audit.mjs --ci --changed
          node http-generic-api/test-resource-api-architecture.mjs
          node http-generic-api/test-resource-api-service.mjs
          node http-generic-api/scripts/spec-kit-completion-gate.mjs --ci --changed
          node validate-memory-schema.mjs
          node --check http-generic-api/scripts/platform-work-map-generator.mjs
          node --check http-generic-api/scripts/platform-work-map-schema-intelligence.mjs
          node --check http-generic-api/scripts/work-map-schema-classification.mjs
          node --check http-generic-api/scripts/work-map-schema-classification-contract.mjs
          node --check http-generic-api/scripts/pipeline-connectivity-check.mjs
          node http-generic-api/scripts/pipeline-connectivity-check.mjs
          node http-generic-api/test-pipeline-connectivity-check.mjs
          node http-generic-api/test-supervisor-runtime-assurance-automation.mjs
          git diff --check

  test:
    name: Unit and Integration Tests
    needs: [preflight, syntax]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json
      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci
      - name: Run complete test suite with exact provenance
        working-directory: http-generic-api
        env:
          GITHUB_SHA: ${{ needs.preflight.outputs.head_sha }}
          TEST_SUITE_REPORT_DIR: ${{ runner.temp }}/test-suite-reports
        run: npm test
      - name: Upload ordered test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-work-map-writer-5490-test-progress-${{ github.run_id }}
          path: ${{ runner.temp }}/test-suite-reports/*.json
          if-no-files-found: warn
          retention-days: 14

  resolver:
    name: Execution Resolver Gate
    needs: [preflight, syntax]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --runInBand

  architecture:
    name: Architecture Drift Detection
    needs: [preflight, syntax]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json
      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci
      - name: Run canonical architecture validation
        working-directory: http-generic-api
        run: npm run validate

  e2e:
    name: E2E Phase Governance
    needs: [preflight, syntax]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Run exact phase evaluation and journey execution
        shell: bash
        env:
          BASE_SHA: ${{ needs.preflight.outputs.main_sha }}
          HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
        run: |
          set -euo pipefail
          node http-generic-api/scripts/e2e-phase-governance.mjs check \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --report-file "$RUNNER_TEMP/e2e-phase-evaluation.json"
          node http-generic-api/scripts/e2e-phase-governance.mjs run \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --report-file "$RUNNER_TEMP/e2e-phase-evaluation-run.json" \
            --execution-report-file "$RUNNER_TEMP/e2e-phase-execution.json"
      - name: Upload exact E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-work-map-writer-5490-e2e-${{ github.run_id }}
          path: ${{ runner.temp }}/e2e-phase-*.json
          if-no-files-found: error
          retention-days: 14

  diagnostic:
    name: Exact Scope and Writer Diagnostics Contract
    needs: [preflight, syntax]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Prove exact scope and diagnostic fail-closed contract
        shell: bash
        env:
          BASE_SHA: ${{ needs.preflight.outputs.main_sha }}
          HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only "$BASE_SHA"..."$HEAD_SHA")
          test "${#files[@]}" -eq 1
          test "${files[0]}" = ".github/workflows/spec-kit-work-map-autofix.yml"

          workflow=".github/workflows/spec-kit-work-map-autofix.yml"
          grep -F "continue-on-error: true" "$workflow"
          grep -F "validation-results.tsv" "$workflow"
          grep -F "validation-summary.md" "$workflow"
          grep -F "Validate generator and governance contracts" "$workflow"
          grep -F 'test "${failed}" = "0"' "$workflow"
          grep -F "Regenerate and prove idempotency" "$workflow"
          grep -F "Upload Work Map diagnostic evidence" "$workflow"

          gate_line="$(grep -nF "Validate generator and governance contracts" "$workflow" | head -1 | cut -d: -f1)"
          generate_line="$(grep -nF "Regenerate and prove idempotency" "$workflow" | head -1 | cut -d: -f1)"
          test "$gate_line" -lt "$generate_line"

          test "$(grep -c '^      - name: .*Work Map\|^      - name: .*pipeline\|^      - name: Syntax check platform Work Map generator' "$workflow")" -ge 11
