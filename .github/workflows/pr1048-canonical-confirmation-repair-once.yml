name: PR 1048 canonical confirmation repair once

on:
  push:
    branches:
      - fix/migration-1048-canonical-auth-confirmation-20260807
    paths:
      - .github/ops/pr1048-canonical-confirmation-repair.trigger

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v5
        with:
          ref: fix/migration-1048-canonical-auth-confirmation-20260807
          fetch-depth: 0

      - name: Verify pinned main and branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "afcec1f471be22ccdd96c204d02ccb1fc7fca1f9"
          test "$(git branch --show-current)" = "fix/migration-1048-canonical-auth-confirmation-20260807"

      - name: Patch canonical internal confirmations and regression
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          runner_path = Path('.github/ops/transport-response-schema-1048-governed-rollout.mjs')
          runner = runner_path.read_text()
          old = """const AUTH_CONFIRM = 'AUTHORIZE_GOVERNED_MIGRATION_1048_TRANSPORT_RESPONSE_SCHEMA_RECOVERY';
          const APPLY_CONFIRM = 'APPLY_GOVERNED_MIGRATION_1048_TRANSPORT_RESPONSE_SCHEMA_RECOVERY';"""
          new = """const MIGRATION_CONFIRMATION_KEY = MIGRATION
            .replace(/\\.sql$/i, '')
            .replace(/[^A-Za-z0-9]+/g, '_')
            .toUpperCase();
          const AUTH_CONFIRM = `AUTHORIZE_GOVERNED_MIGRATION_${MIGRATION_CONFIRMATION_KEY}`;
          const APPLY_CONFIRM = `APPLY_${MIGRATION_CONFIRMATION_KEY}`;"""
          if runner.count(old) != 1:
              raise SystemExit('expected exactly one stale 1048 internal confirmation block')
          runner_path.write_text(runner.replace(old, new))

          test_path = Path('http-generic-api/test-transport-response-schema-1048-governed-rollout.mjs')
          test = test_path.read_text()
          anchor = """  \"const SOURCE_MERGE_SHA = '6503e74c60b8f6add9efade1f25ceb8afaec6209'\",
          """
          addition = """  \"const SOURCE_MERGE_SHA = '6503e74c60b8f6add9efade1f25ceb8afaec6209'\",
            \"const MIGRATION_CONFIRMATION_KEY = MIGRATION\",
            \"const AUTH_CONFIRM = `AUTHORIZE_GOVERNED_MIGRATION_${MIGRATION_CONFIRMATION_KEY}`\",
            \"const APPLY_CONFIRM = `APPLY_${MIGRATION_CONFIRMATION_KEY}`\",
          """
          if test.count(anchor) != 1:
              raise SystemExit('expected exactly one rollout regression insertion point')
          test = test.replace(anchor, addition)
          console_anchor = "\nconsole.log('PASS governed Migration 1048 rollout contract');\n"
          regressions = """
          assert.doesNotMatch(
            runner,
            /const AUTH_CONFIRM = 'AUTHORIZE_GOVERNED_MIGRATION_1048_TRANSPORT_RESPONSE_SCHEMA_RECOVERY'/,
            'Authorization bootstrap must not use the Issue trigger command as its typed migration confirmation',
          );
          assert.doesNotMatch(
            runner,
            /const APPLY_CONFIRM = 'APPLY_GOVERNED_MIGRATION_1048_TRANSPORT_RESPONSE_SCHEMA_RECOVERY'/,
            'Migration Apply must not use the Issue trigger command as its typed executor confirmation',
          );
          """
          if test.count(console_anchor) != 1:
              raise SystemExit('expected exactly one rollout regression footer')
          test_path.write_text(test.replace(console_anchor, regressions + console_anchor))
          PY

      - name: Remove one-shot repair surfaces
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr1048-canonical-confirmation-repair-once.yml
          rm -f .github/ops/pr1048-canonical-confirmation-repair.trigger

      - name: Validate bounded repository-only repair
        shell: bash
        run: |
          set -euo pipefail
          node --check .github/ops/transport-response-schema-1048-governed-rollout.mjs
          node http-generic-api/test-transport-response-schema-1048-governed-rollout.mjs
          mapfile -t changed < <(git diff --name-only afcec1f471be22ccdd96c204d02ccb1fc7fca1f9 -- | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/ops/transport-response-schema-1048-governed-rollout.mjs"
          test "${changed[1]}" = "http-generic-api/test-transport-response-schema-1048-governed-rollout.mjs"
          ! git diff afcec1f471be22ccdd96c204d02ccb1fc7fca1f9 -- .github/ops/transport-response-schema-1048-governed-rollout.mjs | grep -q "mode: 'apply'.*mode: 'apply'"

      - name: Commit and push bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(db): derive Migration 1048 typed confirmations canonically"
          git push origin HEAD:fix/migration-1048-canonical-auth-confirmation-20260807
