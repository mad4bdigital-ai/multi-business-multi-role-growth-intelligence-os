name: Register Spec 014 Tenant hardening recovery

on:
  push:
    branches:
      - gpt/014-hostinger/tenant-canary-hardening-recovery-20260801
    paths:
      - .github/workflows/spec014-register-tenant-hardening-recovery.yml
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - gpt/hostinger-safe-storage-cleanup-ssh-20260801
    paths:
      - .github/workflows/spec014-register-tenant-hardening-recovery.yml

permissions:
  contents: write

jobs:
  register:
    if: github.event_name == 'push' || github.head_ref == 'gpt/014-hostinger/tenant-canary-hardening-recovery-20260801'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gpt/014-hostinger/tenant-canary-hardening-recovery-20260801
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Register current Tenant hardening workstream
        env:
          FUNCTIONAL_HEAD_SHA: 4cb39794f7a729a144da7501f6025996bf05a663
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const functionalHead = process.env.FUNCTIONAL_HEAD_SHA;
          if (!/^[0-9a-f]{40}$/.test(functionalHead)) throw new Error('Functional head SHA is invalid');

          const contractPath = 'specs/014-governed-hostinger-storage-orchestration/e2e-phases.json';
          const contract = JSON.parse(fs.readFileSync(contractPath, 'utf8'));
          const parallel = contract.parallel_work;

          const repositoryBrand = parallel.workstreams.find((row) => row.id === 'control-plane-repository-brand');
          if (repositoryBrand) {
            repositoryBrand.status = 'integrated';
            repositoryBrand.commit_evidence = {
              head_sha: 'f989e1d48c2c149d7851d98d1b1177727c889615',
              commits: ['f989e1d48c2c149d7851d98d1b1177727c889615'],
            };
          }

          const tenant = parallel.workstreams.find((row) => row.id === 'tenant-canary');
          if (!tenant) throw new Error('tenant-canary workstream not found');
          tenant.status = 'ready_for_integration';
          tenant.scope.include = [...new Set([
            '.github/workflows/hostinger-storage-tenant-canary-guard.yml',
            'http-generic-api/hostingerStorageTenantCanary*.js',
            'http-generic-api/test-hostinger-storage-tenant-canary*.mjs',
          ])];
          for (const deliverable of [
            'Tenant-owned and canonical Control Plane repository provenance before one-shot consumption',
            'Tenant-owned unforgeable synthetic adapter provenance before mutation dispatch',
            'Complete repository and immutable-plan authority preflight before one-shot consumption',
            'Execution-time clock, not-before, approval, allowlist, and enablement revalidation',
            'Never-reusable normalized authority tokens with accessor-safe single-read delegation',
            'Repository-wide JavaScript, CommonJS, and TypeScript Base-import governance',
          ]) {
            if (!tenant.deliverables.includes(deliverable)) tenant.deliverables.push(deliverable);
          }
          const requiredTests = [
            ['hostinger-storage-tenant-canary', 'test-hostinger-storage-tenant-canary.mjs'],
            ['hostinger-storage-tenant-canary-authority-cas', 'test-hostinger-storage-tenant-canary-authority-cas.mjs'],
            ['hostinger-storage-tenant-canary-postmerge-hardening', 'test-hostinger-storage-tenant-canary-postmerge-hardening.mjs'],
            ['hostinger-storage-tenant-canary-token-normalization', 'test-hostinger-storage-tenant-canary-token-normalization.mjs'],
            ['hostinger-storage-tenant-canary-token-delegation', 'test-hostinger-storage-tenant-canary-token-delegation.mjs'],
            ['hostinger-storage-tenant-canary-repository-provenance', 'test-hostinger-storage-tenant-canary-repository-provenance.mjs'],
          ];
          tenant.required_tests = requiredTests.map(([id, path]) => ({
            id,
            runner: 'node',
            working_directory: 'http-generic-api',
            path,
            args: [],
          }));
          tenant.commit_evidence = { head_sha: functionalHead, commits: [functionalHead] };

          const mvp = contract.phases.find((row) => row.id === 'mvp');
          if (mvp) {
            mvp.blockers = mvp.blockers.filter((entry) => !entry.startsWith('The Tenant-exclusive canary'));
            mvp.blockers = mvp.blockers.filter((entry) => entry !== 'The governed Control Plane repository provenance brand is ready for integration.');
            const repositoryBlocker = 'The governed Control Plane repository provenance brand is integrated; persistence remains non-production and memory-backed.';
            const tenantBlocker = 'The Tenant-exclusive canary post-merge hardening is ready for integration but remains synthetic, one-shot, and not mounted to a runtime route.';
            if (!mvp.blockers.includes(repositoryBlocker)) mvp.blockers.splice(1, 0, repositoryBlocker);
            if (!mvp.blockers.includes(tenantBlocker)) mvp.blockers.push(tenantBlocker);
          }
          fs.writeFileSync(contractPath, `${JSON.stringify(contract)}\n`);

          const guardPath = '.github/workflows/hostinger-storage-tenant-canary-guard.yml';
          let guard = fs.readFileSync(guardPath, 'utf8');
          if (!guard.includes('test-hostinger-storage-tenant-canary-repository-provenance.mjs')) {
            guard = guard.replace(
              '          node --check http-generic-api/test-hostinger-storage-tenant-canary-token-delegation.mjs\n',
              '          node --check http-generic-api/test-hostinger-storage-tenant-canary-token-delegation.mjs\n          node --check http-generic-api/test-hostinger-storage-tenant-canary-repository-provenance.mjs\n',
            );
            guard = guard.replace(
              '          grep -q "createHostingerStorageTenantCanaryControlPlaneRepository" http-generic-api/hostingerStorageTenantCanary.js\n',
              '          grep -q "createHostingerStorageTenantCanaryControlPlaneRepository" http-generic-api/hostingerStorageTenantCanary.js\n          grep -q "isCanonicalHostingerStorageControlPlaneRepository" http-generic-api/hostingerStorageTenantCanary.js\n          grep -q "tenant_and_control_plane_factory_owned_required" http-generic-api/hostingerStorageTenantCanary.js\n',
            );
            guard = guard.replace(
              '          node test-hostinger-storage-tenant-canary-token-delegation.mjs\n',
              '          node test-hostinger-storage-tenant-canary-token-delegation.mjs\n          node test-hostinger-storage-tenant-canary-repository-provenance.mjs\n',
            );
          }
          fs.writeFileSync(guardPath, guard);

          fs.rmSync('.github/workflows/spec014-register-tenant-hardening-recovery.yml');
          NODE

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(spec-014): register Tenant hardening recovery'
          git push origin HEAD:gpt/014-hostinger/tenant-canary-hardening-recovery-20260801
