name: PR 3162 rebuild on current main

on:
  push:
    branches:
      - gpt/pr-3162-rebuild-main-20260730-v2
    paths:
      - .github/workflows/pr-3162-rebuild-main.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/pr-3162-rebuild-main-20260730-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json
      - run: npm ci
        working-directory: http-generic-api
      - name: Apply bounded reconciliation patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          script_path = Path("http-generic-api/scripts/frontend-surface-dispatch.mjs")
          script = script_path.read_text()

          alias_anchor = r'''    helperRe.lastIndex = closing + 1;
            }
            for (const match of text.matchAll(/\b(?:const|let)\s+([A-Za-z0-9_$]+)\s*=\s*\([^)]*\)\s*=>\s*([\s\S]*?);/g)) {'''
          alias_replacement = r'''    helperRe.lastIndex = closing + 1;
            }
            for (const match of text.matchAll(
              /\b(?:const|let)\s+([A-Za-z0-9_$]+)\s*=\s*requireSecurityMiddleware\s*\(\s*(["'`])[^"'`]+\2\s*,\s*([A-Za-z_$][A-Za-z0-9_$]*)\s*,?\s*\)\s*;/g,
            )) {
              aliases.set(match[1], match[3]);
            }
            for (const match of text.matchAll(/\b(?:const|let)\s+([A-Za-z0-9_$]+)\s*=\s*\([^)]*\)\s*=>\s*([\s\S]*?);/g)) {'''
          script = replace_once(script, alias_anchor, alias_replacement, "security middleware alias insertion")

          alias_old = r'''  for (const match of text.matchAll(/\b(?:const|let)\s+([A-Za-z0-9_$]+)\s*=\s*([^;\n]+);/g)) {
              if (aliases.has(match[1])) continue;
              if (/^(?:require|verify|authenticate|authorize|auth)/i.test(match[1])) aliases.set(match[1], match[2]);
            }'''
          alias_new = r'''  for (const match of text.matchAll(/\b(?:const|let)\s+([A-Za-z0-9_$]+)\s*=\s*([^;\n]+);/g)) {
              if (aliases.has(match[1])) continue;
              const containsGuard = [...match[2].matchAll(/\b(?:deps\.)?([A-Za-z_$][A-Za-z0-9_$]*)\b/g)]
                .some((entry) => AUTH_GUARDS.has(entry[1]) || aliases.has(entry[1]));
              if (/^(?:require|verify|authenticate|authorize|auth)/i.test(match[1]) || containsGuard) aliases.set(match[1], match[2]);
            }'''
          script = replace_once(script, alias_old, alias_new, "guard-bearing alias detection")
          script = replace_once(
              script,
              "function runtimeAuthProfile({ routePath, routeGuards = [], inheritedGuards = [], override = null }) {",
              "export function runtimeAuthProfile({ routePath, routeGuards = [], inheritedGuards = [], override = null }) {",
              "runtime auth resolver export",
          )

          runtime_old = r'''  const hasBackendAuthenticator = hasBackend || hasBackendOrUser;
            const isolatedModes = [hasLocal, hasMcp, hasSignedQuery, hasGitHubWebhook].filter(Boolean).length;
            if (isolatedModes > 1 || (isolatedModes === 1 && (hasBackendAuthenticator || hasAdmin || hasUser))) {
              return { state: "unresolved", profile: "mixed_guard_chain", alternatives: null, principal: null, guard_chain: guardChain, evidence, configuration_dependencies: [] };
            }'''
          runtime_new = r'''  const hasBackendAuthenticator = hasBackend || hasBackendOrUser;
            const hasPrincipalAuthenticator = hasBackendAuthenticator || hasAdmin || hasUser || hasLocal;
            const hasStandaloneSignedQuery = hasSignedQuery && !hasPrincipalAuthenticator;
            const isolatedModes = [hasLocal, hasMcp, hasStandaloneSignedQuery, hasGitHubWebhook].filter(Boolean).length;
            if (hasBackendAuthenticator && hasLocal && !hasAdmin && !hasUser && !hasMcp && !hasGitHubWebhook) {
              return {
                state: "resolved",
                profile: "backend_local_manager",
                alternatives: [
                  ["backendBearerAuth", "localManagerBearerAuth"],
                  ["backendApiKeyAuth", "localManagerBearerAuth"],
                ],
                principal: "local_manager",
                guard_chain: guardChain,
                evidence,
                configuration_dependencies: ["BACKEND_API_KEY"],
              };
            }
            if (isolatedModes > 1 || (isolatedModes === 1 && (hasBackendAuthenticator || hasAdmin || hasUser))) {
              return { state: "unresolved", profile: "mixed_guard_chain", alternatives: null, principal: null, guard_chain: guardChain, evidence, configuration_dependencies: [] };
            }'''
          script = replace_once(script, runtime_old, runtime_new, "composite runtime auth profile")

          enclosing_old = r'''function enclosingHelper(source, sourceIndex) {
            const functionRe = /function\s+([A-Za-z0-9_]+)\s*\([^)]*\)\s*\{/g;
            let match;
            let enclosing = null;
            while ((match = functionRe.exec(source)) !== null && match.index < sourceIndex) {
              const opening = functionRe.lastIndex - 1;
              const closing = findMatchingBrace(source, opening);
              if (closing >= sourceIndex) {
                enclosing = {
                  name: match[1],
                  declaration_index: match.index,
                  closing,
                };
              }
            }
            return enclosing;
          }'''
          enclosing_new = r'''function enclosingHelper(source, sourceIndex) {
            const functionRe = /function\s+([A-Za-z0-9_]+)\s*\(([^)]*)\)\s*\{/g;
            let match;
            let enclosing = null;
            while ((match = functionRe.exec(source)) !== null && match.index < sourceIndex) {
              const opening = functionRe.lastIndex - 1;
              const closing = findMatchingBrace(source, opening);
              if (closing >= sourceIndex) {
                enclosing = {
                  name: match[1],
                  declaration_index: match.index,
                  closing,
                  parameters: splitTopLevelArguments(match[2])
                    .map((parameter) => parameter.match(/^[A-Za-z_$][A-Za-z0-9_$]*/)?.[0])
                    .filter(Boolean),
                };
              }
            }
            return enclosing;
          }'''
          script = replace_once(script, enclosing_old, enclosing_new, "helper parameter discovery")

          helper_anchor = r'''  return unique(expanded);
          }

          export function parseRoutesFromFile(source, file, mountPrefix = "/", { receiver = "router_or_app" } = {}) {'''
          helper_replacement = r'''  return unique(expanded);
          }

          function mountedPrefixesForReceiver(source, receiverName, startIndex = 0) {
            if (!/^[A-Za-z_$][A-Za-z0-9_$]*$/.test(receiverName)) return [];
            const useRe = new RegExp(
              `\\b[A-Za-z_$][A-Za-z0-9_$]*\\.use\\s*\\(\\s*([\\"'\\x60])([^\\"'\\x60]+)\\1\\s*,\\s*${receiverName}\\b`,
              "g",
            );
            useRe.lastIndex = startIndex;
            const prefixes = [];
            let match;
            while ((match = useRe.exec(source)) !== null) prefixes.push(normalizeRoutePath(match[2]));
            return unique(prefixes);
          }

          function helperInvocationBindings(source, sourceIndex, aliases, mountPrefix) {
            const helper = enclosingHelper(source, sourceIndex);
            const fallback = [{ mount_prefix: normalizeRoutePath(mountPrefix), guards: [] }];
            if (!helper || helper.parameters[0] !== "router") return fallback;

            const callRe = new RegExp(`\\b${helper.name}\\s*\\(`, "g");
            callRe.lastIndex = helper.closing + 1;
            const bindings = [];
            let call;
            while ((call = callRe.exec(source)) !== null) {
              const opening = source.indexOf("(", call.index);
              const closing = findMatchingDelimiter(source, opening, "(", ")");
              if (closing < 0) continue;
              const args = splitTopLevelArguments(source.slice(opening + 1, closing));
              const receiverName = args[0]?.match(/^[A-Za-z_$][A-Za-z0-9_$]*$/)?.[0];
              if (!receiverName) {
                callRe.lastIndex = closing + 1;
                continue;
              }
              const guards = unique(args.slice(1).flatMap((argument) => middlewareGuards(argument, aliases)));
              const internalPrefixes = mountedPrefixesForReceiver(source, receiverName, closing + 1);
              for (const internalPrefix of internalPrefixes.length ? internalPrefixes : ["/"]) {
                bindings.push({
                  mount_prefix: joinRoutePath(mountPrefix, internalPrefix),
                  guards,
                });
              }
              callRe.lastIndex = closing + 1;
            }

            const seen = new Set();
            const uniqueBindings = bindings.filter((binding) => {
              const key = `${binding.mount_prefix}|${binding.guards.join(",")}`;
              if (seen.has(key)) return false;
              seen.add(key);
              return true;
            });
            return uniqueBindings.length ? uniqueBindings : fallback;
          }

          export function parseRoutesFromFile(source, file, mountPrefix = "/", { receiver = "router_or_app" } = {}) {'''
          script = replace_once(script, helper_anchor, helper_replacement, "helper mount binding insertion")

          routes_old = r'''    const routeGuards = unique([
              ...args.slice(1).flatMap((argument) => middlewareGuards(argument, aliases)),
              ...middlewareGuards(declaration, aliases),
            ]);
            const expansions = staticTemplateExpansions(scanSource, match.index, match[3]);
            const routes = expansions.length ? expansions : [match[3]];
            for (const route of routes) {
              for (const expandedRoute of expandRoutePaths(route)) {
                const routePath = joinRoutePath(mountPrefix, expandedRoute);
                const inheritedGuards = activeRouterUseGuards(scanSource, match.index, routePath, aliases);
                for (const method of methods) {
                  operations.push({
                    method,
                    path: routePath,
                    signature: `${method} ${routePath}`,
                    source_file: file,
                    source_index: match.index,
                    declaration,
                    route_guards: routeGuards,
                    inherited_guards: inheritedGuards,
                  });
                }
              }
            }'''
          routes_new = r'''    const routeGuards = unique([
              ...args.slice(1).flatMap((argument) => middlewareGuards(argument, aliases)),
              ...middlewareGuards(declaration, aliases),
            ]);
            const helperBindings = helperInvocationBindings(scanSource, match.index, aliases, mountPrefix);
            const expansions = staticTemplateExpansions(scanSource, match.index, match[3]);
            const routes = expansions.length ? expansions : [match[3]];
            for (const route of routes) {
              for (const expandedRoute of expandRoutePaths(route)) {
                for (const binding of helperBindings) {
                  const routePath = joinRoutePath(binding.mount_prefix, expandedRoute);
                  const inheritedGuards = unique([
                    ...activeRouterUseGuards(scanSource, match.index, routePath, aliases),
                    ...binding.guards,
                  ]);
                  for (const method of methods) {
                    operations.push({
                      method,
                      path: routePath,
                      signature: `${method} ${routePath}`,
                      source_file: file,
                      source_index: match.index,
                      declaration,
                      route_guards: routeGuards,
                      inherited_guards: inheritedGuards,
                    });
                  }
                }
              }
            }'''
          script = replace_once(script, routes_old, routes_new, "nested helper route mounts")
          script = replace_once(
              script,
              '    if (runtimeAuth.profile === "local_manager") return "local_device";',
              '    if (["local_manager", "backend_local_manager"].includes(runtimeAuth.profile)) return "local_device";',
              "composite local scope",
          )
          script_path.write_text(script)

          test_path = Path("http-generic-api/test-frontend-surface-dispatch.mjs")
          test = test_path.read_text()
          import_old = 'import { buildDispatchPlan, expandRoutePaths, isDirectExecution, normalizeRoutePath, parseMountedRouteFiles, parseOpenApiContracts, parseOpenApiOperations, parseRoutesFromFile, parseTestEvidenceClaims, syncDispatchPlan } from "./scripts/frontend-surface-dispatch.mjs";'
          import_new = 'import { buildDispatchPlan, expandRoutePaths, isDirectExecution, normalizeRoutePath, parseMountedRouteFiles, parseOpenApiContracts, parseOpenApiOperations, parseRoutesFromFile, parseTestEvidenceClaims, runtimeAuthProfile, syncDispatchPlan } from "./scripts/frontend-surface-dispatch.mjs";'
          test = replace_once(test, import_old, import_new, "test resolver import")

          test_anchor = 'import { serializedSecurity } from "./scripts/openapi-runtime-auth-sync.mjs";\n\n'
          auth_tests = r'''import { serializedSecurity } from "./scripts/openapi-runtime-auth-sync.mjs";

          assert.equal(
            runtimeAuthProfile({
              routePath: "/local-connector/install/download-link",
              routeGuards: ["requireBackendApiKey", "verifyInstallerDownloadToken"],
            }).profile,
            "backend_or_user",
            "a signed installer token must remain a secondary validator when backend authentication is present",
          );
          assert.equal(
            runtimeAuthProfile({
              routePath: "/local-connector/install/device-download-link",
              routeGuards: ["requireFreshLocalManagerDeviceForPrivilegedInstaller", "verifyInstallerDownloadToken"],
            }).profile,
            "local_manager",
            "a signed installer token must remain a secondary validator when a Local Manager principal is present",
          );
          assert.equal(
            runtimeAuthProfile({
              routePath: "/local-connector/install/download",
              routeGuards: ["verifyInstallerDownloadToken"],
            }).profile,
            "signed_query_token",
            "a signed installer token must remain a standalone authenticator when no principal guard is present",
          );

          const compositeLocalConnectorAuth = runtimeAuthProfile({
            routePath: "/local-connector/uninstall",
            routeGuards: ["requireBackendApiKey", "requireFreshLocalManagerDeviceForPrivilegedInstaller"],
          });
          assert.equal(
            compositeLocalConnectorAuth.profile,
            "backend_local_manager",
            "the uninstall route must preserve its backend plus Local Manager composite authentication profile",
          );
          assert.deepEqual(
            compositeLocalConnectorAuth.alternatives,
            [
              ["backendBearerAuth", "localManagerBearerAuth"],
              ["backendApiKeyAuth", "localManagerBearerAuth"],
            ],
            "each uninstall security alternative must require backend and Local Manager authentication together",
          );

          '''
          test = replace_once(test, test_anchor, auth_tests, "auth regression insertion")

          simple_resource_test = r'''const explicitRequireUserRoute = parseRoutesFromFile(
            'router.get("/me/workspaces/:tenant_id/resources", requireUser, controller.tenantCatalog);',
            "routes/resourceApiRoutes.js",
          )[0];
          assert.deepEqual(explicitRequireUserRoute.route_guards, ["requireUser"]);'''
          full_route_tests = r'''const resourceApiSource = fs.readFileSync(new URL("./routes/resourceApiRoutes.js", import.meta.url), "utf8");
          const resourceApiRoutes = parseRoutesFromFile(resourceApiSource, "routes/resourceApiRoutes.js");
          for (const signature of [
            "GET /me/workspaces/{tenant_id}/resources",
            "GET /me/workspaces/{tenant_id}/resources/{resourceKey}",
            "GET /me/workspaces/{tenant_id}/resources/{resourceKey}/{resourceId}",
          ]) {
            const operation = resourceApiRoutes.find((entry) => entry.signature === signature);
            assert(operation, `${signature} must be discovered from resourceApiRoutes.js`);
            assert.deepEqual(
              operation.route_guards,
              ["requireUser"],
              `${signature} must inherit requireUser from the multiline tenantReadHandlers arrow factory`,
            );
            assert.equal(
              runtimeAuthProfile({
                routePath: operation.path,
                routeGuards: operation.route_guards,
                inheritedGuards: operation.inherited_guards,
              }).profile,
              "user_jwt",
              `${signature} must resolve to the user_jwt runtime authentication profile`,
            );
          }
          const operationOrchestratorSource = fs.readFileSync(new URL("./routes/operationOrchestratorRoutes.js", import.meta.url), "utf8");
          const operationOrchestratorRoutes = parseRoutesFromFile(
            operationOrchestratorSource,
            "routes/operationOrchestratorRoutes.js",
          );
          const operationOrchestratorSuffixes = [
            "GET /operations/contracts",
            "POST /operations/context",
            "POST /operations/preview",
            "POST /operations/execute",
            "POST /operations/status",
            "GET /operations/workers/{worker_id}",
            "GET /operations/artifacts",
            "POST /operations/ci-diagnose",
          ];
          const expectedOperationOrchestratorSignatures = ["/admin", "/tenant"]
            .flatMap((prefix) => operationOrchestratorSuffixes.map((signature) => {
              const [method, routePath] = signature.split(" ");
              return `${method} ${prefix}${routePath}`;
            }))
            .sort();
          assert.deepEqual(
            operationOrchestratorRoutes.map((operation) => operation.signature).sort(),
            expectedOperationOrchestratorSignatures,
            "operation orchestrator helper routes must preserve both admin and tenant mounts",
          );
          assert.equal(
            operationOrchestratorRoutes.some((operation) => operation.path.startsWith("/operations/")),
            false,
            "operation orchestrator helper routes must not produce phantom root operations",
          );
          assert.deepEqual(
            operationOrchestratorRoutes.find((operation) => operation.signature === "GET /admin/operations/contracts").inherited_guards,
            ["requireAdminPrincipal", "requireBackendApiKey"],
            "admin operation routes must preserve backend authentication and admin authorization",
          );
          assert.deepEqual(
            operationOrchestratorRoutes.find((operation) => operation.signature === "GET /tenant/operations/contracts").inherited_guards,
            ["requireTenantOperationPrincipal"],
            "tenant operation routes must preserve the tenant operation principal guard",
          );'''
          test = replace_once(test, simple_resource_test, full_route_tests, "real route regressions")
          test_path.write_text(test)

          openapi_path = Path("http-generic-api/openapi/local-connector-uninstall.yaml")
          if openapi_path.exists():
              raise SystemExit("standalone uninstall OpenAPI contract already exists unexpectedly")
          openapi_path.write_text(r'''openapi: 3.1.0
          info:
            title: Local Connector Uninstall
            version: 1.0.0
            description: Composite backend and Local Manager authenticated device uninstall contract.
          paths:
            /local-connector/uninstall:
              delete:
                tags: [local-manager]
                operationId: uninstallLocalConnector
                summary: Disable a Local Connector device configuration
                description: >
                  Disables the selected Local Connector device configuration and clears its stored
                  Cloudflare token, connector secret, and local API key.
                security:
                  - backendBearerAuth: []
                    localManagerBearerAuth: []
                  - backendApiKeyAuth: []
                    localManagerBearerAuth: []
                requestBody:
                  required: true
                  content:
                    application/json:
                      schema:
                        type: object
                        additionalProperties: false
                        required: [device_id]
                        properties:
                          user_id: { type: string, format: uuid }
                          tenant_id: { type: string, format: uuid }
                          device_id: { type: string, minLength: 1, maxLength: 128 }
                responses:
                  '200':
                    description: Local Connector disabled and stored credentials cleared
                    content:
                      application/json:
                        schema:
                          type: object
                          additionalProperties: false
                          required: [ok, disabled, rotated, message, secrets_included]
                          properties:
                            ok: { type: boolean, const: true }
                            disabled: { type: boolean, const: true }
                            rotated: { type: boolean, const: true }
                            message: { type: string }
                            secrets_included: { type: boolean, const: false }
                  '400': { $ref: '#/components/responses/BadRequest' }
                  '401': { $ref: '#/components/responses/Unauthorized' }
                  '403': { $ref: '#/components/responses/Forbidden' }
                  '404': { $ref: '#/components/responses/NotFound' }
                  '500': { $ref: '#/components/responses/InternalError' }
          components:
            securitySchemes:
              backendBearerAuth: { type: http, scheme: bearer, bearerFormat: Backend JWT }
              backendApiKeyAuth: { type: apiKey, in: header, name: x-api-key }
              localManagerBearerAuth: { type: http, scheme: bearer, bearerFormat: Local Manager JWT }
            schemas:
              ErrorEnvelope:
                type: object
                required: [ok, error, secrets_included]
                properties:
                  ok: { type: boolean, const: false }
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code: { type: string }
                      message: { type: string }
                  secrets_included: { type: boolean, const: false }
            responses:
              BadRequest:
                description: Required uninstall fields are missing or invalid
                content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
              Unauthorized:
                description: Composite authentication is missing or invalid
                content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
              Forbidden:
                description: Authenticated principals cannot uninstall this device
                content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
              NotFound:
                description: Local Connector configuration was not found
                content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
              InternalError:
                description: Local Connector uninstall failed
                content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
          ''')
          PY
      - name: Generate and validate frontend surface evidence
        shell: bash
        run: |
          cd http-generic-api
          node test-frontend-surface-dispatch.mjs
          npm run frontend:dispatch:generate -- --baseline-ref=main
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-openapi-route-coverage.mjs
          npm run openapi:auth:check
          git diff --check
      - name: Commit bounded reconciliation result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            http-generic-api/scripts/frontend-surface-dispatch.mjs \
            http-generic-api/test-frontend-surface-dispatch.mjs \
            http-generic-api/openapi/local-connector-uninstall.yaml \
            http-generic-api/frontend-operation-governance.generated.json \
            http-generic-api/frontend-surface-dispatch.generated.json \
            http-generic-api/openapi/frontend-runtime-routes.generated.yaml
          git commit -m "fix: rebuild PR 3162 auth parity on current main"
          git push origin HEAD:gpt/pr-3162-rebuild-main-20260730-v2
