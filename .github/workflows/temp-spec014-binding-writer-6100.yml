name: TEMP Spec 014 Binding Writer 6100

on:
  pull_request:
    branches:
      - gpt/spec014-binding-writer-base-6100-81a254bf
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: temp-spec014-binding-writer-6100-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh exact Spec 014 binding on canonical candidate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      CANONICAL_PR: '6100'
      EXPECTED_MAIN_SHA: 81a254bfae492e33526f92ec2241f2d927790de2
      EXPECTED_HEAD_SHA: 027f369739caae161a561c7b75885794ad57025d
      TARGET_BRANCH: gpt/hostinger-production-runtime-readback-r7-main-0ccfc93b-20260804
      AUTHORIZATION_MARKER: '<!-- spec014-final-work-map-binding-refresh:authorized -->'
      MANIFEST_PATH: specs/014-governed-hostinger-storage-orchestration/work-map-integration.json
      TASKS_PATH: specs/014-governed-hostinger-storage-orchestration/tasks.md
    steps:
      - name: Validate exact identity and consume one-time authorization
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          report_dir="${RUNNER_TEMP}/spec014-binding-refresh-6100"
          mkdir -p "${report_dir}"
          echo "REPORT_DIR=${report_dir}" >> "${GITHUB_ENV}"

          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${CANONICAL_PR}")"
          test "$(jq -r '.state' <<<"${pr}")" = 'open'
          test "$(jq -r '.draft' <<<"${pr}")" = 'true'
          test "$(jq -r '.base.ref' <<<"${pr}")" = 'main'
          test "$(jq -r '.base.sha' <<<"${pr}")" = "${EXPECTED_MAIN_SHA}"
          test "$(jq -r '.head.repo.full_name' <<<"${pr}")" = "${GITHUB_REPOSITORY}"
          test "$(jq -r '.head.ref' <<<"${pr}")" = "${TARGET_BRANCH}"
          test "$(jq -r '.head.sha' <<<"${pr}")" = "${EXPECTED_HEAD_SHA}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "${EXPECTED_MAIN_SHA}"

          comparison="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${EXPECTED_MAIN_SHA}...${EXPECTED_HEAD_SHA}")"
          test "$(jq -r '.behind_by' <<<"${comparison}")" = '0'
          test "$(jq -r '.merge_base_commit.sha' <<<"${comparison}")" = "${EXPECTED_MAIN_SHA}"

          body="$(jq -r '.body // ""' <<<"${pr}")"
          marker_count="$(grep -Fo "${AUTHORIZATION_MARKER}" <<<"${body}" | wc -l | tr -d ' ')"
          test "${marker_count}" = '1'
          next_body="${body//${AUTHORIZATION_MARKER}/}"
          jq -n --arg body "${next_body}" '{body:$body}' > "${report_dir}/consume-marker.json"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${CANONICAL_PR}" --input "${report_dir}/consume-marker.json" >/dev/null
          if gh api "repos/${GITHUB_REPOSITORY}/pulls/${CANONICAL_PR}" --jq '.body // ""' | grep -Fq "${AUTHORIZATION_MARKER}"; then
            echo 'Authorization marker removal readback failed.' >&2
            exit 1
          fi
          echo '{"identity":"pinned","authorization_consumed":true,"candidate_content_mutation_authorized":true,"protected_branch_mutation":false,"force_push":false}' > "${report_dir}/identity.json"

      - name: Checkout exact authorized candidate head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Run official deterministic binding refresh and readback
        id: refresh
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"

          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            | tee "${REPORT_DIR}/refresh.json"

          git diff --name-only | sort > "${REPORT_DIR}/changed-files.txt"
          grep -Fxq "${MANIFEST_PATH}" "${REPORT_DIR}/changed-files.txt"
          unexpected="$(grep -Fvx -e "${MANIFEST_PATH}" -e "${TASKS_PATH}" "${REPORT_DIR}/changed-files.txt" || true)"
          if [[ -n "${unexpected}" ]]; then
            echo 'Official refresh modified unexpected files:' >&2
            printf '%s\n' "${unexpected}" >&2
            exit 1
          fi
          git diff --check

          node http-generic-api/scripts/platform-work-map-generator.mjs --check \
            | tee "${REPORT_DIR}/work-map-currentness.json"
          REPORT_PATH="${REPORT_DIR}/spec014-final-work-map-readback.json" \
            node http-generic-api/scripts/spec014-final-work-map-readback.mjs \
            | tee "${REPORT_DIR}/spec014-final-work-map-readback.stdout.json"
          jq -e '.ok == true and ((.findings | length) == 0)' \
            "${REPORT_DIR}/spec014-final-work-map-readback.json" >/dev/null

          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${EXPECTED_HEAD_SHA}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${MANIFEST_PATH}" "${TASKS_PATH}"
          git diff --cached --name-only | sort > "${REPORT_DIR}/committed-files.txt"
          grep -Fxq "${MANIFEST_PATH}" "${REPORT_DIR}/committed-files.txt"
          unexpected_cached="$(grep -Fvx -e "${MANIFEST_PATH}" -e "${TASKS_PATH}" "${REPORT_DIR}/committed-files.txt" || true)"
          test -z "${unexpected_cached}"
          git commit -m 'docs(spec-014): refresh final Work Map registry binding'
          result_head_sha="$(git rev-parse HEAD)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${TARGET_BRANCH}"
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${result_head_sha}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${CANONICAL_PR}" --jq '.head.sha')" = "${result_head_sha}"
          echo "result_head_sha=${result_head_sha}" >> "${GITHUB_OUTPUT}"

          jq -n \
            --arg result_head_sha "${result_head_sha}" \
            '{contract:"mad4b.spec014-binding-writer-6100.v1",outcome:"passed",result_head_sha:$result_head_sha,official_script:"http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs",candidate_branch_only:true,repository_content_mutation:true,changed_paths_bounded:true,protected_branch_mutation:false,force_push:false,provider_dispatch:false,live_database_access:false,migration_apply:false,secrets_included:false}' \
            > "${REPORT_DIR}/summary.json"

      - name: Upload bounded refresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec014-binding-refresh-6100-${{ github.run_id }}
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish canonical PR evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_HEAD_SHA: ${{ steps.refresh.outputs.result_head_sha }}
        run: |
          set -Eeuo pipefail
          outcome='passed'
          if [[ "${{ steps.refresh.outcome }}" != 'success' ]]; then outcome='blocked'; fi
          body="SPEC014_BINDING_REFRESH outcome=${outcome} run_id=${GITHUB_RUN_ID} expected_main_sha=${EXPECTED_MAIN_SHA} expected_head_sha=${EXPECTED_HEAD_SHA} result_head_sha=${RESULT_HEAD_SHA:-none} authorization_consumed=$([[ '${{ steps.identity.outcome }}' == 'success' ]] && echo true || echo false) official_script=spec014-refresh-final-work-map-binding.mjs manifest_mutation_authorized=true tasks_mutation_authorized=true protected_branch_mutation=false force_push=false provider_dispatch=false live_database_access=false migration_apply=false secrets_included=false"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${CANONICAL_PR}/comments" -f body="${body}" >/dev/null
