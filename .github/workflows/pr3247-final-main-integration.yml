name: PR 3247 final main integration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - gpt/response-chunk-ownership-a23e0076

permissions:
  contents: write
  pull-requests: read

jobs:
  integrate:
    if: startsWith(github.event.pull_request.head.ref, 'gpt/pr3247-final-integration-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INTEGRATION_BRANCH: ${{ github.event.pull_request.head.ref }}
      TRIGGER_MARKER: .tmp/pr3247-final-integration-trigger.txt
      GENERATED_FILE: http-generic-api/frontend-surface-dispatch.generated.json
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json
      - name: Integrate current main and regenerate bounded evidence
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "${TRIGGER_MARKER}" ]]; then
            echo "Integration branch is already prepared; no second mutation is required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${INTEGRATION_BRANCH}" main --prune
          git reset --hard "origin/${INTEGRATION_BRANCH}"
          git branch -f main origin/main

          WORK_HEAD="$(git rev-parse HEAD)"
          MAIN_HEAD="$(git rev-parse origin/main)"
          echo "work_head_before=${WORK_HEAD}"
          echo "main_head_integrated=${MAIN_HEAD}"

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e
          if [[ ${merge_status} -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [[ ${#conflicts[@]} -ne 1 || "${conflicts[0]}" != "${GENERATED_FILE}" ]]; then
              printf 'Unexpected merge conflicts:\n%s\n' "${conflicts[*]:-none}"
              exit 1
            fi
            git checkout --theirs -- "${GENERATED_FILE}"
            git add "${GENERATED_FILE}"
            if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
              echo "::error::unresolved merge conflicts remain"
              exit 1
            fi
          fi
          git commit -m "chore: synchronize current main into draft PR 3247"

          cd http-generic-api
          npm ci
          npm run frontend:dispatch:generate -- --baseline-ref=main
          node test-frontend-dispatch-workflow-baseline.mjs
          node test-frontend-operation-governance-generator.mjs
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-openapi-route-coverage.mjs
          npm run openapi:auth:check
          cd ..

          UNEXPECTED="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(http-generic-api/)?(frontend-operation-governance\.generated\.json|frontend-surface-dispatch\.generated\.json|openapi/frontend-runtime-routes\.generated\.yaml)$' || true)"
          if [[ -n "${UNEXPECTED}" ]]; then
            echo "::error::generator changed files outside the bounded evidence set"
            printf '%s\n' "${UNEXPECTED}"
            exit 1
          fi

          rm -f "${TRIGGER_MARKER}"
          rm -f .github/workflows/pr3247-final-main-integration.yml
          rmdir .tmp 2>/dev/null || true
          git diff --check
          git add -A .github/workflows/pr3247-final-main-integration.yml \
            "${TRIGGER_MARKER}" \
            http-generic-api/frontend-operation-governance.generated.json \
            http-generic-api/frontend-surface-dispatch.generated.json \
            http-generic-api/openapi/frontend-runtime-routes.generated.yaml
          git commit -m "chore(ci): reconcile frontend evidence after main sync"
          git push origin HEAD:"${INTEGRATION_BRANCH}"
