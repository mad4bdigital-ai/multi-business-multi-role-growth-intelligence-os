name: E2E Contract Reference Integrity

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-contract-reference-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout selected branch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Run reference integrity regression tests
        run: node http-generic-api/test-e2e-contract-reference-integrity.mjs

      - name: Run path-chain and Git-index regression tests
        run: node http-generic-api/test-e2e-contract-git-index-integrity.mjs

      - name: Evaluate contract references
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          args=(--report-file artifacts/e2e-contract-reference-integrity.json)
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            test -n "${BASE_SHA}"
            test -n "${HEAD_SHA}"
            args+=(--base "${BASE_SHA}" --head "${HEAD_SHA}")
          else
            args+=(--all)
          fi
          node http-generic-api/scripts/e2e-contract-reference-integrity.mjs "${args[@]}"

      - name: Verify path chain and tracked Git object modes
        run: >-
          node http-generic-api/scripts/e2e-contract-git-index-integrity.mjs
          --report-file artifacts/e2e-contract-reference-integrity.json

      - name: Upload canonical integrity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-contract-reference-integrity-${{ github.run_id }}
          path: artifacts/e2e-contract-reference-integrity.json
          if-no-files-found: error
          retention-days: 14

  work-map-recovery-bridge:
    name: Dispatch authorized Work Map writer
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      AUTHORIZATION_MARKER: '<!-- work-map-autofix:authorized -->'
    steps:
      - name: Validate immutable PR snapshot and dispatch sole writer
        id: bridge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          [[ "${EVENT_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EVENT_BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]

          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          body="$(jq -r '.body // ""' <<<"${pr}")"
          if ! grep -Fq "${AUTHORIZATION_MARKER}" <<<"${body}"; then
            echo "PR ${PR_NUMBER} has no one-time Work Map authorization marker; bridge is a no-op."
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "authorized=true" >> "$GITHUB_OUTPUT"

          test "$(jq -r '.state' <<<"${pr}")" = "open"
          test "$(jq -r '.draft' <<<"${pr}")" = "false"
          test "$(jq -r '.base.ref' <<<"${pr}")" = "main"
          test "$(jq -r '.head.repo.full_name' <<<"${pr}")" = "${GITHUB_REPOSITORY}"
          target_ref="$(jq -r '.head.ref' <<<"${pr}")"
          expected_head_sha="$(jq -r '.head.sha' <<<"${pr}")"
          test "${target_ref}" = "${EVENT_HEAD_REF}"
          test "${expected_head_sha}" = "${EVENT_HEAD_SHA}"
          [[ "${target_ref}" =~ ^gpt/[A-Za-z0-9._/-]+$ ]]
          [[ "${target_ref}" != "main" && "${target_ref}" != "Production" ]]

          event_snapshot="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${EVENT_BASE_SHA}...${expected_head_sha}")"
          event_snapshot_behind_by="$(jq -r '.behind_by' <<<"${event_snapshot}")"
          event_snapshot_merge_base="$(jq -r '.merge_base_commit.sha' <<<"${event_snapshot}")"
          if [[ "${event_snapshot_behind_by}" != "0" || "${event_snapshot_merge_base}" != "${EVENT_BASE_SHA}" ]]; then
            echo "PR head does not contain the exact base snapshot from this event."
            exit 1
          fi

          current_behind_by="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${expected_head_sha}" --jq '.behind_by')"
          echo "target_ref=${target_ref}" >> "$GITHUB_OUTPUT"
          echo "expected_head_sha=${expected_head_sha}" >> "$GITHUB_OUTPUT"
          echo "event_base_sha=${EVENT_BASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "current_behind_by=${current_behind_by}" >> "$GITHUB_OUTPUT"

          for workflow in spec-kit-work-map-autofix.yml spec-kit-work-map-integration.yml; do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}" --jq '.state')"
            if [[ "${state}" != "active" ]]; then
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/enable"
            fi
            readback_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}" --jq '.state')"
            test "${readback_state}" = "active"
          done
          echo "writer_state=active" >> "$GITHUB_OUTPUT"
          echo "integration_state=active" >> "$GITHUB_OUTPUT"

          current_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r '.head.sha' <<<"${current_pr}")" = "${expected_head_sha}"
          current_body="$(jq -r '.body // ""' <<<"${current_pr}")"
          grep -Fq "${AUTHORIZATION_MARKER}" <<<"${current_body}"
          next_body="${current_body//${AUTHORIZATION_MARKER}/}"
          payload_file="${RUNNER_TEMP}/work-map-authorization-consume.json"
          jq -n --arg body "${next_body}" '{body:$body}' > "${payload_file}"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --input "${payload_file}" >/dev/null
          if gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.body // ""' | grep -Fq "${AUTHORIZATION_MARKER}"; then
            echo "Authorization marker removal readback failed."
            exit 1
          fi
          echo "authorization_consumed=true" >> "$GITHUB_OUTPUT"

          dispatch_started_at="$(date -u -d '5 seconds ago' +'%Y-%m-%dT%H:%M:%SZ')"
          payload="$(jq -cn \
            --arg ref main \
            --arg branch "${target_ref}" \
            --arg expected_head_sha "${expected_head_sha}" \
            '{ref:$ref,inputs:{branch:$branch,expected_head_sha:$expected_head_sha}}')"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/spec-kit-work-map-autofix.yml/dispatches" \
            --input - <<<"${payload}"

          delegated_run_id=""
          for _ in $(seq 1 30); do
            delegated_run_id="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/spec-kit-work-map-autofix.yml/runs?event=workflow_dispatch&branch=main&per_page=30" \
              --jq "[.workflow_runs[] | select(.created_at >= \"${dispatch_started_at}\")] | sort_by(.created_at) | last | .id // empty")"
            if [[ -n "${delegated_run_id}" ]]; then
              break
            fi
            sleep 2
          done
          [[ "${delegated_run_id}" =~ ^[1-9][0-9]*$ ]]
          echo "delegated_run_id=${delegated_run_id}" >> "$GITHUB_OUTPUT"

      - name: Publish Work Map writer dispatch evidence
        if: always() && steps.bridge.outputs.authorized == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ steps.bridge.outputs.target_ref }}
          EXPECTED_HEAD_SHA: ${{ steps.bridge.outputs.expected_head_sha }}
          EVENT_BASE_SHA_OUTPUT: ${{ steps.bridge.outputs.event_base_sha }}
          CURRENT_BEHIND_BY: ${{ steps.bridge.outputs.current_behind_by }}
          WRITER_STATE: ${{ steps.bridge.outputs.writer_state }}
          INTEGRATION_STATE: ${{ steps.bridge.outputs.integration_state }}
          AUTHORIZATION_CONSUMED: ${{ steps.bridge.outputs.authorization_consumed }}
          DELEGATED_RUN_ID: ${{ steps.bridge.outputs.delegated_run_id }}
        run: |
          set -euo pipefail
          outcome="passed"
          if [[ "${{ steps.bridge.outcome }}" != "success" ]]; then
            outcome="blocked"
          fi
          body="WORK_MAP_WRITER_E2E_BRIDGE outcome=${outcome} expected_head_sha=${EXPECTED_HEAD_SHA:-unresolved} event_base_sha=${EVENT_BASE_SHA_OUTPUT:-unresolved} target_ref=${TARGET_REF:-unresolved} current_behind_by=${CURRENT_BEHIND_BY:-unknown} writer_state=${WRITER_STATE:-unknown} integration_state=${INTEGRATION_STATE:-unknown} authorization_consumed=${AUTHORIZATION_CONSUMED:-false} delegated_run_id=${DELEGATED_RUN_ID:-none} direct_repository_content_mutation=false protected_branch_mutation=false force_push=false"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="${body}"
