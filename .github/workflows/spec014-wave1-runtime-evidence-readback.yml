name: Spec 014 Wave 1 Runtime Evidence Readback

on:
  issue_comment:
    types: [created]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  readback:
    name: Read exact Wave 1 runtime Artifact and report IDs
    if: >-
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 6215 &&
        !github.event.issue.pull_request &&
        github.event.comment.body == 'READBACK_SPEC014_WAVE1_RUNTIME_EVIDENCE_5179409708' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'gpt/trigger-spec014-wave1-runtime-evidence-readback-5179409708-v1' &&
        github.event.pull_request.base.ref == 'main'
      )
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      ISSUE_NUMBER: '6215'
      EVIDENCE_DIR: ${{ runner.temp }}/spec014-wave1-runtime-evidence-readback
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Read and report structured runtime evidence
        run: node .github/ops/spec014-wave1-runtime-evidence-readback.mjs

      - name: Upload copied target evidence and readback report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec014-wave1-runtime-evidence-readback-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 14
