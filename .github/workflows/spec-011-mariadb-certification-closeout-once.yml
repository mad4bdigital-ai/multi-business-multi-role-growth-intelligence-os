name: Spec 011 MariaDB Certification Closeout Once

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  closeout:
    if: github.head_ref == 'gpt/spec-011-phase3-delegation-mariadb-certification-closeout-20260730'
    runs-on: ubuntu-latest
    steps:
      - name: Check out closeout branch
        uses: actions/checkout@v5
        with:
          ref: gpt/spec-011-phase3-delegation-mariadb-certification-closeout-20260730
          fetch-depth: 0

      - name: Record certified default-off runtime evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const manifestPath = 'specs/011-durable-governed-execution-and-agent-delegation/manifest.json';
          const completionPath = 'specs/011-durable-governed-execution-and-agent-delegation/completion.json';
          const branch = 'gpt/spec-011-phase3-delegation-mariadb-certification-final3-20260730';
          const pullRequest = 3465;
          const mergeSha = 'dfd404e194b77181e1f4dd7f29a4acdf709610ed';
          const sourceMainSha = '0d6e52236a91e99ea5fda0af15f7e36d3aea147f';
          const finalCiHeadSha = '1c70c16965548500bca95fa32d6864052b1d3547';
          const finalCiBaseSha = sourceMainSha;
          const ciRunId = 30534933337;
          const certificationRunId = 30534933319;
          const frontendDispatchRunId = 30534933349;
          const mergedAt = '2026-07-30T10:42:44Z';
          const t141Status = 'open_pending_governed_lifecycle_mutations';

          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          Object.assign(manifest, {
            phase3_delegation_mariadb_certification_branch: branch,
            phase3_delegation_mariadb_certification_pull_request: pullRequest,
            phase3_delegation_mariadb_certification_merge_sha: mergeSha,
            phase3_delegation_mariadb_certification_source_main_sha: sourceMainSha,
            phase3_delegation_mariadb_certification_final_ci_head_sha: finalCiHeadSha,
            phase3_delegation_mariadb_certification_final_ci_base_sha: finalCiBaseSha,
            phase3_delegation_mariadb_certification_ci_run_id: ciRunId,
            phase3_delegation_mariadb_certification_workflow_run_id: certificationRunId,
            phase3_delegation_mariadb_frontend_dispatch_run_id: frontendDispatchRunId,
            phase3_delegation_mariadb_disposable_engine: 'mariadb:11.4',
            phase3_delegation_mariadb_disposable_certification: true,
            phase3_delegation_mariadb_runtime_binding_code_present: true,
            phase3_delegation_mariadb_runtime_binding_enabled: false,
            phase3_delegation_mariadb_runtime_policy_ready: false,
            phase3_delegation_mariadb_production_migration_applied: false,
            phase3_delegation_mariadb_production_runtime_authority: false,
            phase3_delegation_mariadb_deployment_required: false,
            phase3_delegation_mariadb_t141_status: t141Status,
          });
          const deliverables = [
            'phase3_delegation_mariadb_disposable_certification',
            'phase3_delegation_mariadb_readiness_collector',
            'phase3_delegation_mariadb_default_off_runtime_binding',
            'phase3_delegation_mariadb_governed_production_cycle',
            'phase3_delegation_fixture_identifier_generalization',
          ];
          for (const deliverable of deliverables) {
            if (!manifest.deliverables.includes(deliverable)) manifest.deliverables.push(deliverable);
          }

          const completion = JSON.parse(fs.readFileSync(completionPath, 'utf8'));
          completion.delivery.phase3_delegation_mariadb_certification_pr = {
            number: pullRequest,
            branch,
            role: 'delegation_mariadb_disposable_certification_and_default_off_runtime_binding',
            status: 'merged',
            merge_sha: mergeSha,
          };
          if (!completion.delivery.implementation_prs.some((entry) => entry.number === pullRequest)) {
            completion.delivery.implementation_prs.push({
              number: pullRequest,
              role: 'phase3_delegation_mariadb_disposable_certification_and_default_off_runtime_binding',
              status: 'merged',
              merge_sha: mergeSha,
            });
          }

          completion.evidence.phase3_delegation_mariadb_certification_runtime_binding = {
            status: 'certified_default_off_on_main',
            source_main_sha: sourceMainSha,
            pull_request: pullRequest,
            merge_sha: mergeSha,
            merged_at: mergedAt,
            readiness_collector: 'http-generic-api/delegationGrantMariaDbReadinessCollector.js',
            runtime_binding: 'http-generic-api/delegationGrantMariaDbRuntimeBinding.js',
            certification_script: 'http-generic-api/scripts/delegation-mariadb-disposable-certification.mjs',
            production_cycle: 'http-generic-api/scripts/delegation-mariadb-production-cycle.mjs',
            workflow: '.github/workflows/spec-011-delegation-mariadb-certification.yml',
            design: 'phase3-delegation-mariadb-certification-runtime-binding.md',
            disposable_engine: 'mariadb:11.4',
            governed_migration_runner_reused: true,
            disposable_migration_applied: true,
            disposable_lifecycle_mutations_verified: true,
            create_verified: true,
            revoke_verified: true,
            expire_verified: true,
            same_cycle_receipt_readback_verified: true,
            persisted_active_grant_hash_verified: true,
            mariadb_datetime_serialization_verified: true,
            fixed_customer_identifiers_present: false,
            runtime_binding_code_present: true,
            runtime_binding_enabled: false,
            runtime_policy_ready: false,
            production_migration_applied: false,
            production_database_write: false,
            production_runtime_authority: false,
            public_route: false,
            openapi_operation_added: false,
            provider_write: false,
            deployment_required: false,
            t141_status: t141Status,
            secrets_included: false,
          };
          completion.evidence.implementation.phase3_delegation_mariadb_certification_status = 'certified_default_off_on_main';
          completion.evidence.phase3_delegation_mariadb_certification_ci = {
            status: 'pass',
            head_sha: finalCiHeadSha,
            base_sha: finalCiBaseSha,
            ci_run_id: ciRunId,
            certification_run_id: certificationRunId,
            frontend_dispatch_run_id: frontendDispatchRunId,
            disposable_mariadb_certification: 'pass',
            frontend_dispatch: 'pass',
            required_checks: [
              'Syntax Check',
              'Architecture Drift Detection',
              'Execution Resolver Gate',
              'Unit & Integration Tests',
            ],
          };
          completion.evidence.phase3_delegation_mariadb_certification_migration = {
            status: 'disposable_certified_production_unapplied',
            file: 'http-generic-api/migrations/20260725_agent_delegation_grant_persistence_contract.sql',
            disposable_migration_applied: true,
            disposable_database_write: true,
            production_migration_applied: false,
            production_database_write: false,
            backfill_performed: false,
            production_same_cycle_readback_required_before_apply: true,
          };
          completion.evidence.phase3_delegation_mariadb_certification_production_verification = {
            status: 'not_executed_authorization_and_credentials_required',
            merge_sha: mergeSha,
            final_ci_head_sha: finalCiHeadSha,
            final_ci_base_sha: finalCiBaseSha,
            runtime_binding_enabled: false,
            runtime_policy_ready: false,
            production_migration_applied: false,
            production_database_write: false,
            runtime_authority: false,
            public_route: false,
            provider_dispatch_performed: false,
            deployment_required: false,
            deployment_performed_for_closeout: false,
            rollback_required: false,
            t141_status: t141Status,
            secrets_included: false,
          };
          Object.assign(completion.evidence.post_merge_audit, {
            phase3_delegation_mariadb_certification_status: 'certified_default_off_on_main',
            phase3_delegation_mariadb_certification_pull_request: pullRequest,
            phase3_delegation_mariadb_certification_merge_sha: mergeSha,
            phase3_delegation_mariadb_disposable_certification: 'pass',
            phase3_delegation_mariadb_runtime_binding_code_present: true,
            phase3_delegation_mariadb_runtime_binding_enabled: false,
            phase3_delegation_mariadb_runtime_policy_ready: false,
            phase3_delegation_mariadb_production_migration_applied: false,
            phase3_delegation_mariadb_production_runtime_authority: false,
            t141_status: t141Status,
            spec_status: 'pending_remaining_phases',
          });

          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          fs.writeFileSync(completionPath, `${JSON.stringify(completion, null, 2)}\n`);

          const manifestCheck = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const completionCheck = JSON.parse(fs.readFileSync(completionPath, 'utf8'));
          if (manifestCheck.phase3_delegation_mariadb_certification_merge_sha !== mergeSha) throw new Error('manifest merge SHA mismatch');
          if (manifestCheck.phase3_delegation_mariadb_runtime_binding_enabled !== false) throw new Error('runtime binding must remain disabled');
          if (completionCheck.evidence.phase3_delegation_mariadb_certification_runtime_binding.production_migration_applied !== false) throw new Error('production migration must remain unapplied');
          if (completionCheck.evidence.post_merge_audit.t141_status !== t141Status) throw new Error('T141 status changed unexpectedly');
          NODE

      - name: Validate bounded evidence diff
        shell: bash
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('node:fs').readFileSync('specs/011-durable-governed-execution-and-agent-delegation/manifest.json','utf8')); JSON.parse(require('node:fs').readFileSync('specs/011-durable-governed-execution-and-agent-delegation/completion.json','utf8'));"
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'specs/011-durable-governed-execution-and-agent-delegation/completion.json\nspecs/011-durable-governed-execution-and-agent-delegation/manifest.json'
          git diff --check

      - name: Commit clean closeout evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "admin-assitant-growth-os[bot]"
          git config user.email "admin-assitant-growth-os[bot]@users.noreply.github.com"
          rm .github/workflows/spec-011-mariadb-certification-closeout-once.yml
          git add .
          git diff --cached --check
          git commit -m "docs(spec-011): close out MariaDB certification evidence"
          git push origin HEAD:gpt/spec-011-phase3-delegation-mariadb-certification-closeout-20260730
