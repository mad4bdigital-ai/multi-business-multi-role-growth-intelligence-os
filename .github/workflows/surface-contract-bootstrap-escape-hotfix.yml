name: Surface Contract Bootstrap Escape Hotfix

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: surface-contract-bootstrap-escape-hotfix
  cancel-in-progress: false

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'gpt/surface-contract-classification-hardening-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout governed Surface branch
        uses: actions/checkout@v5
        with:
          ref: gpt/surface-contract-classification-hardening-20260730
          fetch-depth: 0
          persist-credentials: true

      - name: Patch bootstrap escape validation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/surface-contract-classification-bootstrap.yml')
          source = path.read_text(encoding='utf-8')
          old = r"elif '(?:[-*]\\s*)?${token}' not in script:"
          new = r"elif '(?:[-*]\\\\s*)?${token}' not in script:"
          if new in source:
              print('bootstrap escape validation already corrected')
          else:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'bootstrap_escape_anchor_count:{count}')
              source = source.replace(old, new, 1)
              path.write_text(source, encoding='utf-8')
          PY

      - name: Verify exact validation contract
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/surface-contract-classification-bootstrap.yml').read_text(encoding='utf-8')
          expected = r"elif '(?:[-*]\\\\s*)?${token}' not in script:"
          obsolete = r"elif '(?:[-*]\\s*)?${token}' not in script:"
          if source.count(expected) != 1:
              raise SystemExit('corrected_escape_validation_missing_or_duplicated')
          if obsolete in source:
              raise SystemExit('obsolete_escape_validation_still_present')
          print({'bootstrap_escape_validation': 'corrected', 'secrets_included': False})
          PY

      - name: Commit bounded hotfix and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/surface-contract-bootstrap-escape-hotfix.yml
          git add .github/workflows/surface-contract-classification-bootstrap.yml
          python3 <<'PY'
          import subprocess
          expected = {
              '.github/workflows/surface-contract-bootstrap-escape-hotfix.yml',
              '.github/workflows/surface-contract-classification-bootstrap.yml',
          }
          changed = set(filter(None, subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()))
          if changed != expected:
              raise SystemExit(f'bounded_write_set_mismatch:expected={sorted(expected)}:actual={sorted(changed)}')
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ci): correct Surface bootstrap escape validation'
          git push origin HEAD:gpt/surface-contract-classification-hardening-20260730
