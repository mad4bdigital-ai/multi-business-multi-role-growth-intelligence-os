name: Hostinger Production R5 PR Target Request
run-name: Hostinger Production R5 PR Target Request · PR #${{ github.event.pull_request.number || inputs.pr_number }}

on:
  pull_request_target:
    types: [synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open same-repository marker pull request number
        required: true
        type: string
      expected_head_sha:
        description: Exact current marker pull request head SHA
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: hostinger-production-r5-pr-request-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  request:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number }}
      EXPECTED_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_head_sha || github.event.pull_request.head.sha }}
      EXPECTED_TITLE: 'ops: request Hostinger Production R5 evidence'
      MARKER_PATH: .github/hostinger-runtime-recovery/triggers/production-release-evidence-r5-2669991a.txt
      MARKER_TOKEN: HOSTINGER_PRODUCTION_RELEASE_EVIDENCE_R5_PR_BRIDGE_V1
      CONTROL_ISSUE: '4953'
      AUTHORIZATION_COMMENT_ID: '5165194648'
      AUTHORIZATION_TOKEN: AUTHORIZE_HOSTINGER_PRODUCTION_RELEASE_EVIDENCE_2669991A_6134C0F8_R5
      AUTHORIZATION_USER_ID: '271942579'
      EXPECTED_PRODUCTION_SHA: 2669991a882c7f7939510fbbace17f462a42517c
      TARGET_WORKFLOW: hostinger-production-release-evidence-r5.yml
      TARGET_WORKFLOW_PATH: .github/workflows/hostinger-production-release-evidence-r5.yml
      TARGET_WORKFLOW_BLOB_SHA: 9652a18835135648db6c795f60687620b3153ae6
      BINDING_ID: 2669991a882c7f7939510fbbace17f462a42517c:9652a18835135648db6c795f60687620b3153ae6:5165194648:R5_PR_BRIDGE_V1
      REPORT_DIR: .ci-evidence/hostinger-production-r5-pr-request
    steps:
      - name: Evaluate exact same-repository R5 marker request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${REPORT_DIR}"
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          [[ "${EXPECTED_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]

          pr="$(gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          state="$(jq -r '.state' <<<"${pr}")"
          draft="$(jq -r '.draft' <<<"${pr}")"
          author_id="$(jq -r '.user.id' <<<"${pr}")"
          title="$(jq -r '.title' <<<"${pr}")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"${pr}")"
          head_ref="$(jq -r '.head.ref' <<<"${pr}")"
          current_head_sha="$(jq -r '.head.sha' <<<"${pr}")"
          base_ref="$(jq -r '.base.ref' <<<"${pr}")"

          files="$(gh api --paginate "/repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '[.[].filename]')"
          file_count="$(jq 'length' <<<"${files}")"
          sole_file="$(jq -r '.[0] // ""' <<<"${files}")"

          marker_api="$(gh api "/repos/${REPOSITORY}/contents/${MARKER_PATH}?ref=${current_head_sha}")"
          marker_blob_sha="$(jq -r '.sha' <<<"${marker_api}")"
          marker_body="$(jq -r '.content' <<<"${marker_api}" | tr -d '\n' | base64 --decode)"
          marker_token="$(sed -n '1p' <<<"${marker_body}")"
          marker_main_sha="$(sed -n 's/^expected_main_sha=//p' <<<"${marker_body}")"
          marker_production_sha="$(sed -n 's/^expected_production_sha=//p' <<<"${marker_body}")"
          marker_workflow="$(sed -n 's/^target_workflow=//p' <<<"${marker_body}")"
          marker_workflow_blob="$(sed -n 's/^target_workflow_blob=//p' <<<"${marker_body}")"
          marker_authorization="$(sed -n 's/^authorization_comment_id=//p' <<<"${marker_body}")"
          marker_binding="$(sed -n 's/^binding=//p' <<<"${marker_body}")"

          current_main_sha="$(gh api "/repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          current_production_sha="$(gh api "/repos/${REPOSITORY}/git/ref/heads/Production" --jq '.object.sha')"
          workflow_blob_sha="$(gh api "/repos/${REPOSITORY}/contents/${TARGET_WORKFLOW_PATH}?ref=main" --jq '.sha')"
          workflow_state="$(gh api "/repos/${REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}" --jq '.state')"
          issue_state="$(gh api "/repos/${REPOSITORY}/issues/${CONTROL_ISSUE}" --jq '.state')"
          auth_body="$(gh api "/repos/${REPOSITORY}/issues/comments/${AUTHORIZATION_COMMENT_ID}" --jq '.body')"
          auth_user_id="$(gh api "/repos/${REPOSITORY}/issues/comments/${AUTHORIZATION_COMMENT_ID}" --jq '.user.id')"

          outcome="eligible"
          reason=""
          if [[ "${state}" != "open" ]]; then outcome="blocked"; reason="pull_request_not_open"
          elif [[ "${draft}" == "true" ]]; then outcome="blocked"; reason="pull_request_is_draft"
          elif [[ "${author_id}" != "${AUTHORIZATION_USER_ID}" ]]; then outcome="blocked"; reason="pull_request_author_mismatch"
          elif [[ "${title}" != "${EXPECTED_TITLE}" ]]; then outcome="blocked"; reason="pull_request_title_mismatch"
          elif [[ "${head_repo}" != "${REPOSITORY}" ]]; then outcome="blocked"; reason="cross_repository_pull_request_forbidden"
          elif [[ ! "${head_ref}" =~ ^(gpt|cert|fix|feat|chore|docs|release)/[A-Za-z0-9._/-]+$ ]]; then outcome="blocked"; reason="invalid_governed_work_branch"
          elif [[ "${base_ref}" != "main" ]]; then outcome="blocked"; reason="unexpected_base_branch"
          elif [[ "${head_ref}" == "main" || "${head_ref}" == "Production" ]]; then outcome="blocked"; reason="protected_branch_mutation_forbidden"
          elif [[ "${current_head_sha}" != "${EXPECTED_HEAD_SHA}" ]]; then outcome="blocked"; reason="pull_request_head_mismatch"
          elif [[ "${file_count}" != "1" || "${sole_file}" != "${MARKER_PATH}" ]]; then outcome="blocked"; reason="marker_file_scope_mismatch"
          elif [[ "${marker_token}" != "${MARKER_TOKEN}" ]]; then outcome="blocked"; reason="marker_token_mismatch"
          elif [[ ! "${marker_main_sha}" =~ ^[0-9a-f]{40}$ || "${marker_main_sha}" != "${current_main_sha}" ]]; then outcome="blocked"; reason="current_main_head_mismatch"
          elif [[ "${marker_production_sha}" != "${EXPECTED_PRODUCTION_SHA}" || "${current_production_sha}" != "${EXPECTED_PRODUCTION_SHA}" ]]; then outcome="blocked"; reason="protected_production_mismatch"
          elif [[ "${marker_workflow}" != "${TARGET_WORKFLOW_PATH}" ]]; then outcome="blocked"; reason="target_workflow_path_mismatch"
          elif [[ "${marker_workflow_blob}" != "${TARGET_WORKFLOW_BLOB_SHA}" || "${workflow_blob_sha}" != "${TARGET_WORKFLOW_BLOB_SHA}" ]]; then outcome="blocked"; reason="target_workflow_blob_mismatch"
          elif [[ "${marker_authorization}" != "${AUTHORIZATION_COMMENT_ID}" || "${marker_binding}" != "${BINDING_ID}" ]]; then outcome="blocked"; reason="immutable_binding_mismatch"
          elif [[ "${workflow_state}" != "active" ]]; then outcome="blocked"; reason="target_workflow_inactive"
          elif [[ "${issue_state}" != "open" ]]; then outcome="blocked"; reason="control_issue_not_open"
          elif [[ "${auth_user_id}" != "${AUTHORIZATION_USER_ID}" ]]; then outcome="blocked"; reason="authorization_user_mismatch"
          elif ! grep -Fq "${AUTHORIZATION_TOKEN}" <<<"${auth_body}"; then outcome="blocked"; reason="authorization_token_absent"
          fi

          jq -n \
            --arg contract "mad4b.hostinger-production-release-evidence-r5-pr-request.v1" \
            --arg outcome "${outcome}" \
            --arg reason "${reason}" \
            --arg target_ref "${head_ref}" \
            --arg expected_head_sha "${EXPECTED_HEAD_SHA}" \
            --arg current_head_sha "${current_head_sha}" \
            --arg expected_main_sha "${marker_main_sha}" \
            --arg current_main_sha "${current_main_sha}" \
            --arg expected_production_sha "${EXPECTED_PRODUCTION_SHA}" \
            --arg current_production_sha "${current_production_sha}" \
            --arg marker_path "${MARKER_PATH}" \
            --arg marker_blob_sha "${marker_blob_sha}" \
            --arg target_workflow "${TARGET_WORKFLOW}" \
            --arg target_workflow_path "${TARGET_WORKFLOW_PATH}" \
            --arg target_workflow_blob_sha "${TARGET_WORKFLOW_BLOB_SHA}" \
            --arg binding "${BINDING_ID}" \
            --arg source_event "${GITHUB_EVENT_NAME}" \
            --argjson pr_number "${PR_NUMBER}" \
            --argjson source_run_id "${GITHUB_RUN_ID}" \
            '{contract:$contract,outcome:$outcome,reason:($reason|select(length>0)),pr_number:$pr_number,source_run_id:$source_run_id,source_event:$source_event,target_ref:$target_ref,expected_head_sha:$expected_head_sha,current_head_sha:$current_head_sha,expected_main_sha:$expected_main_sha,current_main_sha:$current_main_sha,expected_production_sha:$expected_production_sha,current_production_sha:$current_production_sha,marker_path:$marker_path,marker_blob_sha:$marker_blob_sha,target_workflow:$target_workflow,target_workflow_path:$target_workflow_path,target_workflow_blob_sha:$target_workflow_blob_sha,binding:$binding,candidate_code_checkout:false,repository_mutation_performed:false,provider_access_performed:false,credential_access_performed:false,protected_branch_mutation:false,force_push:false,source_of_truth:"structured_report",job_logs_role:"diagnostic_only",consult_job_logs:false,secrets_included:false}' \
            > "${REPORT_DIR}/request.json"

      - name: Upload exact-head R5 request
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-production-release-evidence-r5-pr-request-${{ github.run_id }}
          path: ${{ env.REPORT_DIR }}/request.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce read-only request contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(`${process.env.REPORT_DIR}/request.json`, 'utf8'));
          if (report.contract !== 'mad4b.hostinger-production-release-evidence-r5-pr-request.v1') process.exit(1);
          if (report.outcome !== 'eligible') process.exit(1);
          if (report.candidate_code_checkout !== false || report.repository_mutation_performed !== false) process.exit(1);
          if (report.provider_access_performed !== false || report.credential_access_performed !== false) process.exit(1);
          if (report.protected_branch_mutation !== false || report.force_push !== false) process.exit(1);
          if (report.consult_job_logs !== false || report.secrets_included !== false) process.exit(1);
          NODE
