name: Repository Tool Lifecycle Governance

on:
  pull_request:
    branches:
      - main
      - Production
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write

concurrency:
  group: repository-tool-lifecycle-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  govern:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Run repository-tool lifecycle regression
        run: node http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs

      - name: Prepare exact changed-file inventory
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA"
          git diff --name-status "$BASE_SHA" "$HEAD_SHA" > /tmp/repository-tool-changes.tsv

      - name: Evaluate repository tool lifecycle
        id: governance
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node http-generic-api/scripts/maintenance-tools/repository-tool-lifecycle-guard.mjs \
            --changed-files /tmp/repository-tool-changes.tsv \
            --policy .github/repository-maintenance-tool-governance.json \
            --output-dir .artifacts/repository-tool-lifecycle

      - name: Publish canonical repository-tool report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-tool-lifecycle-${{ github.run_id }}
          path: .artifacts/repository-tool-lifecycle/
          if-no-files-found: error
          retention-days: 14

      - name: Publish bounded step summary
        if: always()
        run: cat .artifacts/repository-tool-lifecycle/repository-tool-lifecycle-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce repository tool lifecycle
        if: steps.governance.outcome != 'success'
        run: |
          echo "Repository tool lifecycle governance failed. Read the canonical report artifact first."
          exit 1

  # BEGIN TEMP CURRENT-MAIN RECONSTRUCTION
  reconstruct-current-main:
    if: github.event.pull_request.number == 6122
    runs-on: macos-14
    timeout-minutes: 25
    env:
      TARGET_BRANCH: gpt/ci-runner-queue-unblock-current-main-20260804
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact branch lease
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "${TARGET_BRANCH}"
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "$(git rev-parse HEAD)"

      - name: Build two-parent current-main candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name mad4bdigital-ai
          git config user.email mad4bdigital-ai@users.noreply.github.com
          git fetch origin main
          git rev-parse origin/main > "$RUNNER_TEMP/main-sha.txt"
          git merge -s ours --no-commit origin/main
          test -f .git/MERGE_HEAD
          git read-tree --reset -u origin/main
          test -f .git/MERGE_HEAD

      - name: Apply bounded workflow remediation to current main
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'anchor_count_mismatch:{path}:{count}:{expected}:{old!r}')
              p.write_text(text.replace(old, new, expected))

          ci = '.github/workflows/ci.yml'
          replace_exact(ci, '  cancel-in-progress: false\n', '  cancel-in-progress: true\n')
          replace_exact(ci,
              '  syntax:\n    name: Syntax Check\n    runs-on: ubuntu-latest\n',
              '  syntax:\n    name: Syntax Check\n    runs-on: ubuntu-24.04\n')
          replace_exact(ci,
              '  test:\n    name: Unit & Integration Tests\n    runs-on: ubuntu-latest\n',
              '  test:\n    name: Unit & Integration Tests\n    runs-on: ubuntu-24.04\n')
          replace_exact(ci,
              '  execution-resolver-gate:\n    name: Execution Resolver Gate\n    runs-on: ubuntu-latest\n',
              '  execution-resolver-gate:\n    name: Execution Resolver Gate\n    runs-on: ubuntu-24.04\n')
          replace_exact(ci,
              '  architecture-drift:\n    name: Architecture Drift Detection\n    runs-on: ubuntu-latest\n',
              '  architecture-drift:\n    name: Architecture Drift Detection\n    runs-on: ubuntu-24.04\n')

          context = '.github/workflows/context-kernel-hardcoding-report.yml'
          replace_exact(context, '    runs-on: ubuntu-latest\n', '    runs-on: ubuntu-24.04\n')

          e2e = '.github/workflows/e2e-phase-governance.yml'
          replace_exact(e2e,
              '  evaluate:\n    name: Evaluate changed feature phases\n    runs-on: ubuntu-latest\n',
              '  evaluate:\n    name: Evaluate changed feature phases\n    runs-on: ubuntu-24.04\n')
          replace_exact(e2e,
              '  execute:\n    name: Execute current phase journeys\n    runs-on: ubuntu-latest\n',
              '  execute:\n    name: Execute current phase journeys\n    runs-on: ubuntu-24.04\n')
          replace_exact(e2e,
              '    needs: [evaluate, execute]\n    runs-on: ubuntu-latest\n',
              '    needs: [evaluate, execute]\n    runs-on: ubuntu-24.04\n')

          frontend = '.github/workflows/frontend-surface-dispatch.yml'
          replace_exact(frontend, '    runs-on: ubuntu-latest\n', '    runs-on: ubuntu-24.04\n')
          replace_exact(frontend,
              'permissions:\n  contents: read\n\njobs:\n',
              'permissions:\n  contents: read\n\nconcurrency:\n  group: frontend-surface-dispatch-${{ github.event.pull_request.number || github.ref }}\n  cancel-in-progress: true\n\njobs:\n')

          lifecycle = '.github/workflows/repository-tool-lifecycle-governance.yml'
          replace_exact(lifecycle, '    runs-on: ubuntu-latest\n', '    runs-on: ubuntu-24.04\n')
          PY

      - name: Validate exact five-file worktree
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check origin/main
          python3 - <<'PY'
          import subprocess
          changed = sorted(filter(None, subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main'], text=True
          ).splitlines()))
          expected = sorted([
              '.github/workflows/ci.yml',
              '.github/workflows/context-kernel-hardcoding-report.yml',
              '.github/workflows/e2e-phase-governance.yml',
              '.github/workflows/frontend-surface-dispatch.yml',
              '.github/workflows/repository-tool-lifecycle-governance.yml',
          ])
          print('\n'.join(changed))
          assert changed == expected, f'unexpected_scope:{changed}'
          PY

      - name: Validate focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node http-generic-api/scripts/e2e-phase-governance-self-test.mjs
          node http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs
          (cd http-generic-api && node test-frontend-dispatch-workflow-baseline.mjs)
          (cd http-generic-api && node test-tenant-ssh-cli-approval-request.mjs)
          grep -Fq 'cancel-in-progress: true' .github/workflows/ci.yml
          grep -Fq 'group: frontend-surface-dispatch-${{ github.event.pull_request.number || github.ref }}' .github/workflows/frontend-surface-dispatch.yml

      - name: Create exact merge commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A
          git commit -m 'ci: reconstruct runner queue remediation on current main'
          test "$(git rev-list --parents -n 1 HEAD | wc -w | tr -d ' ')" -eq 3
          mkdir -p /tmp/pr6122-current-main
          git rev-parse HEAD > /tmp/pr6122-current-main/commit-sha.txt
          git rev-parse 'HEAD^{tree}' > /tmp/pr6122-current-main/tree-sha.txt
          git rev-parse HEAD^1 > /tmp/pr6122-current-main/first-parent-sha.txt
          git rev-parse HEAD^2 > /tmp/pr6122-current-main/main-parent-sha.txt
          git show --stat --oneline HEAD > /tmp/pr6122-current-main/summary.txt

      - name: Validate committed current-main scope
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import subprocess
          changed = sorted(filter(None, subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True
          ).splitlines()))
          expected = sorted([
              '.github/workflows/ci.yml',
              '.github/workflows/context-kernel-hardcoding-report.yml',
              '.github/workflows/e2e-phase-governance.yml',
              '.github/workflows/frontend-surface-dispatch.yml',
              '.github/workflows/repository-tool-lifecycle-governance.yml',
          ])
          print('\n'.join(changed))
          assert changed == expected, f'unexpected_committed_scope:{changed}'
          PY

      - name: Verify live main remains stable
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(cat "$RUNNER_TEMP/main-sha.txt")"

      - name: Upload reconstructed commit metadata
        uses: actions/upload-artifact@v4
        with:
          name: pr6122-current-main-${{ github.event.pull_request.head.sha }}
          path: /tmp/pr6122-current-main
          if-no-files-found: error
          retention-days: 1

      - name: Push reconstructed current-main candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
  # END TEMP CURRENT-MAIN RECONSTRUCTION
