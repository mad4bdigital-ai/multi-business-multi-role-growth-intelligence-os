name: Repository Tool Lifecycle Governance

on:
  pull_request:
    branches:
      - main
      - Production
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write

concurrency:
  group: repository-tool-lifecycle-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  govern:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Run repository-tool lifecycle regression
        run: node http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs

      - name: Prepare exact changed-file inventory
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA"
          git diff --name-status "$BASE_SHA" "$HEAD_SHA" > /tmp/repository-tool-changes.tsv

      - name: Evaluate repository tool lifecycle
        id: governance
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node http-generic-api/scripts/maintenance-tools/repository-tool-lifecycle-guard.mjs \
            --changed-files /tmp/repository-tool-changes.tsv \
            --policy .github/repository-maintenance-tool-governance.json \
            --output-dir .artifacts/repository-tool-lifecycle

      - name: Publish canonical repository-tool report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-tool-lifecycle-${{ github.run_id }}
          path: .artifacts/repository-tool-lifecycle/
          if-no-files-found: error
          retention-days: 14

      - name: Publish bounded step summary
        if: always()
        run: cat .artifacts/repository-tool-lifecycle/repository-tool-lifecycle-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce repository tool lifecycle
        if: steps.governance.outcome != 'success'
        run: |
          echo "Repository tool lifecycle governance failed. Read the canonical report artifact first."
          exit 1

  # BEGIN TEMP FRONTEND CONCURRENCY FIX
  fix-frontend-concurrency-expression:
    if: github.event.pull_request.head.ref == 'gpt/ci-runner-queue-unblock-current-main-20260804'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_BRANCH: gpt/ci-runner-queue-unblock-current-main-20260804
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact branch lease
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "${TARGET_BRANCH}"
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "$(git rev-parse HEAD)"

      - name: Restore dynamic Frontend concurrency and self-delete
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          frontend = Path('.github/workflows/frontend-surface-dispatch.yml')
          text = frontend.read_text()
          old = '  group: frontend-surface-dispatch-6122\n'
          expression = '$' + '{{ github.event.pull_request.number || github.ref }}'
          new = f'  group: frontend-surface-dispatch-{expression}\n'
          if text.count(old) != 1:
              raise SystemExit(f'fixed_frontend_concurrency_anchor_mismatch:{text.count(old)}')
          frontend.write_text(text.replace(old, new, 1))

          lifecycle = Path('.github/workflows/repository-tool-lifecycle-governance.yml')
          text = lifecycle.read_text()
          if text.count('permissions:\n  contents: write\n') != 1:
              raise SystemExit('lifecycle_permission_anchor_mismatch')
          text = text.replace('permissions:\n  contents: write\n', 'permissions:\n  contents: read\n', 1)
          start_marker = '  # BEGIN TEMP FRONTEND CONCURRENCY FIX\n'
          end_marker = '  # END TEMP FRONTEND CONCURRENCY FIX\n'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('temporary_block_marker_mismatch')
          start = text.index(start_marker)
          end = text.index(end_marker) + len(end_marker)
          lifecycle.write_text(text[:start].rstrip() + '\n')
          PY

      - name: Validate bounded correction
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t changed < <(git diff --name-only | sort -u)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/workflows/frontend-surface-dispatch.yml"
          test "${changed[1]}" = ".github/workflows/repository-tool-lifecycle-governance.yml"
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          expression = '$' + '{{ github.event.pull_request.number || github.ref }}'
          expected = f'group: frontend-surface-dispatch-{expression}'
          text = Path('.github/workflows/frontend-surface-dispatch.yml').read_text()
          assert text.count(expected) == 1, 'dynamic Frontend concurrency expression missing'
          assert 'frontend-surface-dispatch-6122' not in text, 'fixed PR number remains'
          lifecycle = Path('.github/workflows/repository-tool-lifecycle-governance.yml').read_text()
          assert 'TEMP FRONTEND CONCURRENCY FIX' not in lifecycle
          assert 'permissions:\n  contents: read\n' in lifecycle
          PY
          (cd http-generic-api && node test-frontend-dispatch-workflow-baseline.mjs)
          node http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs

      - name: Create corrected commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name mad4bdigital-ai
          git config user.email mad4bdigital-ai@users.noreply.github.com
          git add -A
          git commit -m 'fix(ci): preserve dynamic Frontend concurrency key'
          mkdir -p /tmp/frontend-concurrency-commit
          git rev-parse HEAD > /tmp/frontend-concurrency-commit/commit-sha.txt
          git rev-parse 'HEAD^{tree}' > /tmp/frontend-concurrency-commit/tree-sha.txt
          git rev-parse HEAD^ > /tmp/frontend-concurrency-commit/parent-sha.txt
          git show --stat --oneline HEAD > /tmp/frontend-concurrency-commit/summary.txt

      - name: Upload corrected commit metadata
        uses: actions/upload-artifact@v4
        with:
          name: frontend-concurrency-corrected-${{ github.event.pull_request.head.sha }}
          path: /tmp/frontend-concurrency-commit
          if-no-files-found: error
          retention-days: 1

      - name: Push corrected commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
  # END TEMP FRONTEND CONCURRENCY FIX
