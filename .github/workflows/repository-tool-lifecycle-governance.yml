name: Repository Tool Lifecycle Governance

on:
  pull_request:
    branches:
      - main
      - Production
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write

concurrency:
  group: repository-tool-lifecycle-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  govern:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Run repository-tool lifecycle regression
        run: node http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs

      - name: Prepare exact changed-file inventory
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA"
          git diff --name-status "$BASE_SHA" "$HEAD_SHA" > /tmp/repository-tool-changes.tsv

      - name: Evaluate repository tool lifecycle
        id: governance
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node http-generic-api/scripts/maintenance-tools/repository-tool-lifecycle-guard.mjs \
            --changed-files /tmp/repository-tool-changes.tsv \
            --policy .github/repository-maintenance-tool-governance.json \
            --output-dir .artifacts/repository-tool-lifecycle

      - name: Publish canonical repository-tool report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-tool-lifecycle-${{ github.run_id }}
          path: .artifacts/repository-tool-lifecycle/
          if-no-files-found: error
          retention-days: 14

      - name: Publish bounded step summary
        if: always()
        run: cat .artifacts/repository-tool-lifecycle/repository-tool-lifecycle-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce repository tool lifecycle
        if: steps.governance.outcome != 'success'
        run: |
          echo "Repository tool lifecycle governance failed. Read the canonical report artifact first."
          exit 1

  # BEGIN TEMP PR6122 LIVE MAIN SYNC
  sync-pr-6122-live-main:
    if: github.event.pull_request.number == 6122
    runs-on: macos-14
    timeout-minutes: 20
    env:
      TARGET_BRANCH: gpt/ci-runner-queue-unblock-current-main-20260804
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact branch lease
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "${TARGET_BRANCH}"
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "$(git rev-parse HEAD)"

      - name: Merge stable live main
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name mad4bdigital-ai
          git config user.email mad4bdigital-ai@users.noreply.github.com
          git fetch origin main
          git rev-parse origin/main > "$RUNNER_TEMP/main-sha.txt"
          git merge --no-edit origin/main

      - name: Remove temporary sync authority
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/repository-tool-lifecycle-governance.yml')
          text = path.read_text()
          assert text.count('permissions:\n  contents: write\n') == 1
          text = text.replace('permissions:\n  contents: write\n', 'permissions:\n  contents: read\n', 1)
          start_marker = '  # BEGIN TEMP PR6122 LIVE MAIN SYNC\n'
          end_marker = '  # END TEMP PR6122 LIVE MAIN SYNC\n'
          assert text.count(start_marker) == 1 and text.count(end_marker) == 1
          start = text.index(start_marker)
          end = text.index(end_marker) + len(end_marker)
          path.write_text(text[:start].rstrip() + '\n')
          PY

      - name: Validate exact five-file result
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          committed = subprocess.check_output(['git','diff','--name-only','origin/main...HEAD'], text=True).splitlines()
          worktree = subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          changed = sorted(set(filter(None, committed + worktree)))
          expected = sorted([
            '.github/workflows/ci.yml',
            '.github/workflows/context-kernel-hardcoding-report.yml',
            '.github/workflows/e2e-phase-governance.yml',
            '.github/workflows/frontend-surface-dispatch.yml',
            '.github/workflows/repository-tool-lifecycle-governance.yml',
          ])
          print('\n'.join(changed))
          assert changed == expected, f'unexpected_scope:{changed}'
          lifecycle = Path('.github/workflows/repository-tool-lifecycle-governance.yml').read_text()
          assert 'TEMP PR6122 LIVE MAIN SYNC' not in lifecycle
          assert 'permissions:\n  contents: read\n' in lifecycle
          expression = '$' + '{{ github.event.pull_request.number || github.ref }}'
          frontend = Path('.github/workflows/frontend-surface-dispatch.yml').read_text()
          assert f'group: frontend-surface-dispatch-{expression}' in frontend
          PY

      - name: Validate focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node http-generic-api/scripts/e2e-phase-governance-self-test.mjs
          node http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs
          (cd http-generic-api && node test-frontend-dispatch-workflow-baseline.mjs)
          (cd http-generic-api && node test-tenant-ssh-cli-approval-request.mjs)
          ! grep -R "runs-on: ubuntu-latest" \
            .github/workflows/ci.yml \
            .github/workflows/context-kernel-hardcoding-report.yml \
            .github/workflows/e2e-phase-governance.yml \
            .github/workflows/frontend-surface-dispatch.yml \
            .github/workflows/repository-tool-lifecycle-governance.yml

      - name: Create synchronized commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A
          git commit -m 'ci: synchronize runner queue remediation with live main'
          mkdir -p /tmp/pr6122-live-main-sync
          git rev-parse HEAD > /tmp/pr6122-live-main-sync/commit-sha.txt
          git rev-parse 'HEAD^{tree}' > /tmp/pr6122-live-main-sync/tree-sha.txt
          git rev-parse HEAD^ > /tmp/pr6122-live-main-sync/parent-sha.txt
          git show --stat --oneline HEAD > /tmp/pr6122-live-main-sync/summary.txt

      - name: Verify live main remains stable
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(cat "$RUNNER_TEMP/main-sha.txt")"

      - name: Upload synchronized commit metadata
        uses: actions/upload-artifact@v4
        with:
          name: pr6122-live-main-sync-${{ github.event.pull_request.head.sha }}
          path: /tmp/pr6122-live-main-sync
          if-no-files-found: error
          retention-days: 1

      - name: Push synchronized commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
  # END TEMP PR6122 LIVE MAIN SYNC
