            git add http-generic-api/test-tenant-ssh-cli-approval-request.mjs
            git commit --no-edit
          fi

      - name: Remove temporary state and restore main assertion
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/ci-runner-main-resync.yml
          git checkout origin/main -- http-generic-api/test-tenant-ssh-cli-approval-request.mjs
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/repository-tool-lifecycle-governance.yml')
          text = path.read_text()
          text = text.replace('permissions:\n  contents: write\n', 'permissions:\n  contents: read\n', 1)
          start = text.index('  # BEGIN TEMP PR6027 SYNC\n')
          end = text.index('  # END TEMP PR6027 SYNC\n') + len('  # END TEMP PR6027 SYNC\n')
          path.write_text(text[:start].rstrip() + '\n')
          PY
          git add -A
          git commit -m 'ci: resync runner queue remediation with current main'

      - name: Validate exact final scope
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t changed < <(git diff --name-only origin/main...HEAD | sort -u)
          test "${#changed[@]}" -eq 5
          printf '%s\n' "${changed[@]}"
          for expected in \
            .github/workflows/ci.yml \
            .github/workflows/context-kernel-hardcoding-report.yml \
            .github/workflows/e2e-phase-governance.yml \
            .github/workflows/frontend-surface-dispatch.yml \
            .github/workflows/repository-tool-lifecycle-governance.yml; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "$expected"
          done
          test ! -e .github/workflows/ci-runner-main-resync.yml
          git diff --check origin/main...HEAD

      - name: Validate focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node http-generic-api/scripts/e2e-phase-governance-self-test.mjs
          node http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs
          (cd http-generic-api && node test-frontend-dispatch-workflow-baseline.mjs)
          (cd http-generic-api && node test-tenant-ssh-cli-approval-request.mjs)
          ! grep -R "runs-on: ubuntu-latest" \
            .github/workflows/ci.yml \
            .github/workflows/context-kernel-hardcoding-report.yml \
            .github/workflows/e2e-phase-governance.yml \
            .github/workflows/frontend-surface-dispatch.yml \
            .github/workflows/repository-tool-lifecycle-governance.yml

      - name: Verify live main stability
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          test "$(cat "$RUNNER_TEMP/main-sha.txt")" = "$(git rev-parse origin/main)"

      - name: Push synchronized result
        shell: bash
        run: |
          set -Eeuo pipefail
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
