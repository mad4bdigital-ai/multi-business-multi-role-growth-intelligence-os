name: Repository Tool Lifecycle Governance

on:
  pull_request:
    branches:
      - main
      - Production
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: repository-tool-lifecycle-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  govern:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Prepare exact changed-file inventory
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA"
          git diff --name-status "$BASE_SHA" "$HEAD_SHA" > /tmp/repository-tool-changes.tsv

      - name: Run repository-tool discovery regression
        run: node http-generic-api/scripts/test-repository-tool-discovery.mjs

      - name: Discover and catalog repository tools
        id: discovery
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node http-generic-api/scripts/maintenance-tools/repository-tool-discovery.mjs \
            --changed-files /tmp/repository-tool-changes.tsv \
            --policy .github/repository-maintenance-tool-governance.json \
            --inventory docs/repository-inventory.json \
            --output-dir .artifacts/repository-tool-lifecycle

      - name: Run configuration candidate discovery regression
        run: node http-generic-api/scripts/test-configuration-candidate-discovery.mjs

      - name: Discover hardcoded configuration candidates
        id: configuration_discovery
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node http-generic-api/scripts/maintenance-tools/configuration-candidate-discovery.mjs \
            --inventory docs/repository-inventory.json \
            --output-dir .artifacts/repository-tool-lifecycle/configuration-candidates

      - name: Run configuration drift guard regression
        run: node http-generic-api/scripts/test-configuration-drift-guard.mjs

      - name: Run platform configuration entry guard regression
        run: node http-generic-api/scripts/test-platform-configuration-entry-guard.mjs

      - name: Evaluate platform configuration entry governance
        id: platform_configuration_entry
        continue-on-error: true
        env:
          CHANGED_FILES_FILE: /tmp/repository-tool-changes.tsv
        run: |
          node http-generic-api/scripts/maintenance-tools/platform-configuration-entry-guard.mjs \
            --registry docs/governance/platform-configuration-entry-registry.json \
            --candidates .artifacts/repository-tool-lifecycle/configuration-candidates/configuration-candidates.json \
            --changed-files /tmp/repository-tool-changes.tsv \
            --baseline-policy docs/governance/configuration-drift-policy.json \
            --baseline-extension docs/governance/configuration-drift-baseline-extensions.json \
            --output .artifacts/repository-tool-lifecycle/platform-configuration-entry-guard.json \
            --fail-on-findings

      - name: Run platform configuration control plane regression
        id: platform_configuration
        run: |
          node http-generic-api/test-platform-configuration-resolver.mjs
          node http-generic-api/test-platform-configuration-registry-adapter.mjs
          node http-generic-api/test-platform-legacy-configuration-adapter.mjs

      - name: Evaluate configuration drift
        id: configuration_drift
        continue-on-error: true
        run: |
          node http-generic-api/scripts/maintenance-tools/configuration-drift-guard.mjs \
            --policy docs/governance/configuration-drift-policy.json \
            --output-dir .artifacts/repository-tool-lifecycle/configuration-drift \
            --fail-on-drift

      - name: Run repository-tool lifecycle regression
        run: node http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs

      - name: Evaluate repository tool lifecycle
        id: governance
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node http-generic-api/scripts/maintenance-tools/repository-tool-lifecycle-guard.mjs \
            --changed-files /tmp/repository-tool-changes.tsv \
            --policy .github/repository-maintenance-tool-governance.json \
            --output-dir .artifacts/repository-tool-lifecycle

      - name: Publish canonical repository-tool evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repository-tool-lifecycle-${{ github.run_id }}
          path: .artifacts/repository-tool-lifecycle/
          if-no-files-found: error
          retention-days: 14

      - name: Publish bounded step summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .artifacts/repository-tool-lifecycle/repository-tool-discovery.md ]]; then
            cat .artifacts/repository-tool-lifecycle/repository-tool-discovery.md >> "$GITHUB_STEP_SUMMARY"
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f .artifacts/repository-tool-lifecycle/configuration-candidates/configuration-candidates.md ]]; then
            cat .artifacts/repository-tool-lifecycle/configuration-candidates/configuration-candidates.md >> "$GITHUB_STEP_SUMMARY"
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f .artifacts/repository-tool-lifecycle/configuration-drift/configuration-drift-guard.md ]]; then
            cat .artifacts/repository-tool-lifecycle/configuration-drift/configuration-drift-guard.md >> "$GITHUB_STEP_SUMMARY"
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f .artifacts/repository-tool-lifecycle/platform-configuration-entry-guard.json ]]; then
            cat .artifacts/repository-tool-lifecycle/platform-configuration-entry-guard.json >> "$GITHUB_STEP_SUMMARY"
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          cat .artifacts/repository-tool-lifecycle/repository-tool-lifecycle-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce repository tool lifecycle
        if: steps.discovery.outcome != 'success' || steps.configuration_discovery.outcome != 'success' || steps.platform_configuration_entry.outcome != 'success' || steps.platform_configuration.outcome != 'success' || steps.configuration_drift.outcome != 'success' || steps.governance.outcome != 'success'
        run: |
          echo "Repository tool discovery or lifecycle governance failed. Read the canonical artifact first."
          exit 1
