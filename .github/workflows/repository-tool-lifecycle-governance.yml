name: Repository Tool Lifecycle Governance

on:
  pull_request:
    branches:
      - main
      - Production
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write

concurrency:
  group: repository-tool-lifecycle-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  govern:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Run repository-tool lifecycle regression
        run: node http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs

      - name: Prepare exact changed-file inventory
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA"
          git diff --name-status "$BASE_SHA" "$HEAD_SHA" > /tmp/repository-tool-changes.tsv

      - name: Evaluate repository tool lifecycle
        id: governance
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node http-generic-api/scripts/maintenance-tools/repository-tool-lifecycle-guard.mjs \
            --changed-files /tmp/repository-tool-changes.tsv \
            --policy .github/repository-maintenance-tool-governance.json \
            --output-dir .artifacts/repository-tool-lifecycle

      - name: Publish canonical repository-tool report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-tool-lifecycle-${{ github.run_id }}
          path: .artifacts/repository-tool-lifecycle/
          if-no-files-found: error
          retention-days: 14

      - name: Publish bounded step summary
        if: always()
        run: cat .artifacts/repository-tool-lifecycle/repository-tool-lifecycle-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce repository tool lifecycle
        if: steps.governance.outcome != 'success'
        run: |
          echo "Repository tool lifecycle governance failed. Read the canonical report artifact first."
          exit 1

  # BEGIN TEMP CLEAN PR WRITER
  write-clean-runner-fix:
    if: github.event.pull_request.head.ref == 'gpt/ci-runner-queue-unblock-current-main-20260804'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_BRANCH: gpt/ci-runner-queue-unblock-current-main-20260804
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout exact clean branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact branch and stable base
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "${TARGET_BRANCH}"
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "$(git rev-parse HEAD)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${BASE_SHA}"

      - name: Apply bounded workflow remediation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected_count=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected_count:
                  raise SystemExit(f'anchor_count_mismatch:{path}:{old!r}:{count}:{expected_count}')
              p.write_text(text.replace(old, new))

          replace_exact('.github/workflows/ci.yml', 'runs-on: ubuntu-latest', 'runs-on: ubuntu-24.04', 4)
          replace_exact('.github/workflows/ci.yml', '  cancel-in-progress: false\n', '  cancel-in-progress: true\n', 1)
          replace_exact('.github/workflows/context-kernel-hardcoding-report.yml', 'runs-on: ubuntu-latest', 'runs-on: ubuntu-24.04', 1)
          replace_exact('.github/workflows/e2e-phase-governance.yml', 'runs-on: ubuntu-latest', 'runs-on: ubuntu-24.04', 3)
          replace_exact('.github/workflows/frontend-surface-dispatch.yml', 'runs-on: ubuntu-latest', 'runs-on: ubuntu-24.04', 1)

          frontend = Path('.github/workflows/frontend-surface-dispatch.yml')
          text = frontend.read_text()
          anchor = 'permissions:\n  contents: read\n\njobs:\n'
          replacement = (
              'permissions:\n  contents: read\n\n'
              'concurrency:\n'
              '  group: frontend-surface-dispatch-${{ github.event.pull_request.number || github.ref }}\n'
              '  cancel-in-progress: true\n\n'
              'jobs:\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit('frontend_concurrency_anchor_mismatch')
          frontend.write_text(text.replace(anchor, replacement, 1))

          lifecycle = Path('.github/workflows/repository-tool-lifecycle-governance.yml')
          text = lifecycle.read_text()
          if text.count('permissions:\n  contents: write\n') != 1:
              raise SystemExit('lifecycle_permission_anchor_mismatch')
          text = text.replace('permissions:\n  contents: write\n', 'permissions:\n  contents: read\n', 1)
          start_marker = '  # BEGIN TEMP CLEAN PR WRITER\n'
          end_marker = '  # END TEMP CLEAN PR WRITER\n'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('lifecycle_temp_block_marker_mismatch')
          start = text.index(start_marker)
          end = text.index(end_marker) + len(end_marker)
          lifecycle.write_text(text[:start].rstrip() + '\n')
          PY

      - name: Validate exact five-file scope
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t changed < <(git diff --name-only "${BASE_SHA}"...HEAD; git diff --name-only)
          mapfile -t changed < <(printf '%s\n' "${changed[@]}" | sed '/^$/d' | sort -u)
          test "${#changed[@]}" -eq 5
          printf '%s\n' "${changed[@]}"
          for expected in \
            .github/workflows/ci.yml \
            .github/workflows/context-kernel-hardcoding-report.yml \
            .github/workflows/e2e-phase-governance.yml \
            .github/workflows/frontend-surface-dispatch.yml \
            .github/workflows/repository-tool-lifecycle-governance.yml; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "$expected"
          done
          git diff --check

      - name: Validate focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node http-generic-api/scripts/e2e-phase-governance-self-test.mjs
          node http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs
          (cd http-generic-api && node test-frontend-dispatch-workflow-baseline.mjs)
          (cd http-generic-api && node test-tenant-ssh-cli-approval-request.mjs)
          ! grep -R "runs-on: ubuntu-latest" \
            .github/workflows/ci.yml \
            .github/workflows/context-kernel-hardcoding-report.yml \
            .github/workflows/e2e-phase-governance.yml \
            .github/workflows/frontend-surface-dispatch.yml \
            .github/workflows/repository-tool-lifecycle-governance.yml

      - name: Create bounded clean commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name mad4bdigital-ai
          git config user.email mad4bdigital-ai@users.noreply.github.com
          git add -A
          git commit -m 'ci: pin required checks and cancel superseded runs'
          mkdir -p /tmp/clean-runner-commit
          git rev-parse HEAD > /tmp/clean-runner-commit/commit-sha.txt
          git rev-parse 'HEAD^{tree}' > /tmp/clean-runner-commit/tree-sha.txt
          git rev-parse HEAD^ > /tmp/clean-runner-commit/parent-sha.txt
          git show --stat --oneline HEAD > /tmp/clean-runner-commit/summary.txt

      - name: Verify live main remains stable
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${BASE_SHA}"

      - name: Upload clean commit metadata
        uses: actions/upload-artifact@v4
        with:
          name: clean-ci-runner-commit-${{ github.event.pull_request.head.sha }}
          path: /tmp/clean-runner-commit
          if-no-files-found: error
          retention-days: 1

      - name: Push bounded clean commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
  # END TEMP CLEAN PR WRITER
