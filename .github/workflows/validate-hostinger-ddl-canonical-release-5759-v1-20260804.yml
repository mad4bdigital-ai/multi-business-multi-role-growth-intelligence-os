name: Validate Hostinger DDL Canonical Release 5759 V1

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/validate-hostinger-ddl-canonical-release-5759-v1-20260804.yml

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: validate-hostinger-ddl-canonical-release-5759-v1-20260804
  cancel-in-progress: false

jobs:
  validate:
    name: Validate exact Hostinger DDL canonical release head
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/validate-hostinger-ddl-canonical-release-5759-v1-20260804'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      VALIDATOR_PR: ${{ github.event.pull_request.number }}
      TARGET_PR: '5759'
      TARGET_SHA: 53d125d1a0090251c89c47e8461345a9754c9136
      TARGET_BRANCH: gpt/fix-hostinger-ddl-reconciliation-identity-20260804
      EXPECTED_MAIN_SHA: ec8fa387014b9481dd3e7ab0cc4fd2708cafb865
      WORKFLOW_PATH: .github/workflows/validate-hostinger-ddl-canonical-release-5759-v1-20260804.yml

    steps:
      - name: Verify one-file validator request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mapfile -t files < <(gh api --paginate "/repos/${REPOSITORY}/pulls/${VALIDATOR_PR}/files?per_page=100" --jq '.[].filename')
          test "${#files[@]}" -eq 1
          test "${files[0]}" = "${WORKFLOW_PATH}"

      - name: Checkout exact target head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Validate immutable topology and scope
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git rev-parse refs/remotes/origin/main)" = "${EXPECTED_MAIN_SHA}"
          test "$(git merge-base "${TARGET_SHA}" "${EXPECTED_MAIN_SHA}")" = "${EXPECTED_MAIN_SHA}"
          mapfile -t changed < <(git diff --name-only "${EXPECTED_MAIN_SHA}"..."${TARGET_SHA}" | sort)
          expected=(
            '.changes/e2e/spec014-durable-authorized-injection-schema-ddl.json'
            '.github/workflows/hostinger-storage-durable-authorized-injection-schema-ddl-guard.yml'
            'http-generic-api/test-hostinger-storage-durable-authorized-injection-schema-ddl-workflow.mjs'
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do test "${changed[$index]}" = "${expected[$index]}"; done
          git diff --check "${EXPECTED_MAIN_SHA}"..."${TARGET_SHA}"

      - name: Run exact DDL, canonical release, E2E, and reference validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          log="${RUNNER_TEMP}/target-validation.log"
          set +e
          (
            set -Eeuo pipefail
            node --check http-generic-api/scripts/e2e-parallel-pr-gate.mjs
            node --check http-generic-api/test-hostinger-storage-durable-authorized-injection-schema-ddl.mjs
            node --check http-generic-api/test-hostinger-storage-durable-authorized-injection-schema-ddl-workflow.mjs
            node http-generic-api/test-hostinger-storage-durable-authorized-injection-schema-ddl.mjs
            node http-generic-api/test-hostinger-storage-durable-authorized-injection-schema-ddl-workflow.mjs

            node http-generic-api/scripts/e2e-phase-governance-self-test.mjs
            node http-generic-api/scripts/e2e-parallel-work-governance-self-test.mjs
            node http-generic-api/scripts/e2e-parallel-pr-flow-self-test.mjs

            phase_report="${RUNNER_TEMP}/phase-report.json"
            execution_report="${RUNNER_TEMP}/phase-execution.json"
            node http-generic-api/scripts/e2e-phase-governance.mjs check \
              --base "${EXPECTED_MAIN_SHA}" \
              --head "${TARGET_SHA}" \
              --report-file "${phase_report}"
            node http-generic-api/scripts/e2e-phase-governance.mjs run \
              --base "${EXPECTED_MAIN_SHA}" \
              --head "${TARGET_SHA}" \
              --report-file "${phase_report}" \
              --execution-report-file "${execution_report}"
            jq -e '.ok == true' "${phase_report}"
            jq -e '.ok == true' "${execution_report}"

            mkdir -p "${RUNNER_TEMP}/reference"
            node http-generic-api/test-e2e-contract-reference-integrity.mjs
            node http-generic-api/test-e2e-contract-git-index-integrity.mjs
            node http-generic-api/scripts/e2e-contract-reference-integrity.mjs \
              --base "${EXPECTED_MAIN_SHA}" \
              --head "${TARGET_SHA}" \
              --report-file "${RUNNER_TEMP}/reference/e2e-contract-reference-integrity.json"
            node http-generic-api/scripts/e2e-contract-git-index-integrity.mjs \
              --report-file "${RUNNER_TEMP}/reference/e2e-contract-reference-integrity.json"

            node http-generic-api/scripts/spec-kit-completion-gate.mjs --ci --changed
            node build-canonicals.mjs --check
            git diff --check
            test -z "$(git status --short)"
          ) >"${log}" 2>&1
          status=$?
          set -e
          cat "${log}"

          if [[ "${status}" -ne 0 ]]; then
            {
              echo '## Exact Hostinger DDL canonical-release validation failed'
              echo
              echo "- Target PR: #${TARGET_PR}"
              echo "- Target head: \`${TARGET_SHA}\`"
              echo "- Exact main base: \`${EXPECTED_MAIN_SHA}\`"
              echo
              echo '```text'
              tail -n 260 "${log}"
              echo '```'
            } > "${RUNNER_TEMP}/failure.md"
            gh pr comment "${TARGET_PR}" --repo "${REPOSITORY}" --body-file "${RUNNER_TEMP}/failure.md"
            gh pr comment "${VALIDATOR_PR}" --repo "${REPOSITORY}" --body-file "${RUNNER_TEMP}/failure.md"
            exit "${status}"
          fi

          {
            echo '## Exact Hostinger DDL canonical-release validation passed'
            echo
            echo "- Target head: \`${TARGET_SHA}\`"
            echo "- Exact main base: \`${EXPECTED_MAIN_SHA}\`"
            echo '- Diff boundary: exactly three governed files'
            echo '- DDL parity and executable workflow classification: passed'
            echo '- Valid history-preserving reconciliation: classified as canonical release'
            echo '- Reversed reconciliation parents: rejected fail closed'
            echo '- E2E phase self-tests, changed-phase check, and execution: passed'
            echo '- Contract reference and Git-index integrity: passed'
            echo '- Spec Kit completion and canonical generated-source check: passed'
            echo '- Final worktree: clean'
            echo '- No protected ref, Production merge, deployment, provider, SQL, migration, database, credential, secret, or external-send mutation occurred'
          } > "${RUNNER_TEMP}/success.md"
          gh pr comment "${TARGET_PR}" --repo "${REPOSITORY}" --body-file "${RUNNER_TEMP}/success.md"
          gh pr comment "${VALIDATOR_PR}" --repo "${REPOSITORY}" --body-file "${RUNNER_TEMP}/success.md"
