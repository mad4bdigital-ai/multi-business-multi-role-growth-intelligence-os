name: T016 Final Rebase

on:
  push:
    branches:
      - gpt/011-ueacp-t016-endpoint-certification-final-20260730
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: t016-final-rebase
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout final T016 branch
        uses: actions/checkout@v5
        with:
          ref: gpt/011-ueacp-t016-endpoint-certification-final-20260730
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded T016 patch from reviewed recovery branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gpt/011-ueacp-t016-endpoint-certification-recovery-20260730
          source_ref='origin/gpt/011-ueacp-t016-endpoint-certification-recovery-20260730'
          base="$(git merge-base HEAD "$source_ref")"
          paths=(
            http-generic-api/contextKernel/application/endpointCertificationResolverService.js
            http-generic-api/contextKernel/application/index.js
            http-generic-api/contextKernel/application/repositoryPorts.js
            http-generic-api/contextKernel/domain/endpointCertificationPolicy.js
            http-generic-api/contextKernel/domain/index.js
            http-generic-api/scripts/run-test-manifest.mjs
            http-generic-api/test-context-kernel-endpoint-certification-fail-closed.mjs
            http-generic-api/test-context-kernel-endpoint-certification-resolver.mjs
          )
          git diff --binary "$base".."$source_ref" -- "${paths[@]}" > /tmp/t016.patch
          test -s /tmp/t016.patch
          git apply --3way --index /tmp/t016.patch

      - name: Verify focused T016 regressions
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          node test-context-kernel-endpoint-certification-resolver.mjs
          node test-context-kernel-endpoint-certification-fail-closed.mjs

      - name: Commit bounded final branch and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/t016-final-rebase.yml
          python3 <<'PY'
          import subprocess
          expected = {
              '.github/workflows/t016-final-rebase.yml',
              'http-generic-api/contextKernel/application/endpointCertificationResolverService.js',
              'http-generic-api/contextKernel/application/index.js',
              'http-generic-api/contextKernel/application/repositoryPorts.js',
              'http-generic-api/contextKernel/domain/endpointCertificationPolicy.js',
              'http-generic-api/contextKernel/domain/index.js',
              'http-generic-api/scripts/run-test-manifest.mjs',
              'http-generic-api/test-context-kernel-endpoint-certification-fail-closed.mjs',
              'http-generic-api/test-context-kernel-endpoint-certification-resolver.mjs',
          }
          changed = set(filter(None, subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True
          ).splitlines()))
          if changed != expected:
              raise SystemExit(f'bounded_write_set_mismatch:expected={sorted(expected)}:actual={sorted(changed)}')
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(spec-011): add endpoint and certification resolver'
          git push origin HEAD:gpt/011-ueacp-t016-endpoint-certification-final-20260730
