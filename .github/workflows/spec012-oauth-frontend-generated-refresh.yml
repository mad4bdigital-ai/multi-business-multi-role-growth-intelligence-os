name: Spec 012 OAuth Frontend Generated Refresh

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/spec012-oauth-frontend-generated-refresh.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: spec012-oauth-frontend-generated-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  refresh-certify-push:
    if: github.event.pull_request.number == 6248 && github.event.pull_request.head.ref == 'gpt/spec012-oauth-canonical-deps-current-main-v3-20260804'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      EXPECTED_MAIN_SHA: b3b488082d4030e8110993fcffb74fb498930166
      PRE_WRITER_HEAD: 912ab81f7dcc4f684893a9e09e0b136d0ecfe27d
      BRANCH_NAME: gpt/spec012-oauth-canonical-deps-current-main-v3-20260804
      WORKFLOW_PATH: .github/workflows/spec012-oauth-frontend-generated-refresh.yml
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify immutable refs and bounded pre-refresh scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main "${BRANCH_NAME}"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD^)" = "${PRE_WRITER_HEAD}"
          test "$(git rev-parse origin/main)" = "${EXPECTED_MAIN_SHA}"
          merge_base="$(git merge-base origin/main HEAD)"
          mapfile -t files < <(git diff --name-only "${merge_base}...HEAD" | sort)
          expected=(
            ".changes/e2e/spec012-t031-oauth-token-route-test-parity.json"
            ".github/workflows/spec012-oauth-frontend-generated-refresh.yml"
            "http-generic-api/frontend-surface-dispatch.generated.json"
            "http-generic-api/routes/index.js"
            "http-generic-api/test-spec012-t031-oauth-token-route-wiring.mjs"
          )
          test "${#files[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${files[@]}")

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install locked dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Regenerate canonical Frontend artifacts
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          before_openapi="$(sha256sum openapi/frontend-runtime-routes.generated.yaml | awk '{print $1}')"
          npm run frontend:dispatch:generate -- --baseline-ref=main
          after_openapi="$(sha256sum openapi/frontend-runtime-routes.generated.yaml | awk '{print $1}')"
          test "${before_openapi}" = "${after_openapi}"
          mapfile -t changed < <(git status --porcelain | awk '{print $2}' | sort)
          expected=(
            "http-generic-api/frontend-operation-governance.generated.json"
            "http-generic-api/frontend-surface-dispatch.generated.json"
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${changed[@]}")

      - name: Retire writer and certify final five-file scope
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add http-generic-api/frontend-operation-governance.generated.json http-generic-api/frontend-surface-dispatch.generated.json
          git rm "${WORKFLOW_PATH}"
          git commit -m "chore(spec-012): refresh canonical Frontend artifacts"
          final_sha="$(git rev-parse HEAD)"
          mapfile -t files < <(git diff --name-only "${EXPECTED_MAIN_SHA}...${final_sha}" | sort)
          expected=(
            ".changes/e2e/spec012-t031-oauth-token-route-test-parity.json"
            "http-generic-api/frontend-operation-governance.generated.json"
            "http-generic-api/frontend-surface-dispatch.generated.json"
            "http-generic-api/routes/index.js"
            "http-generic-api/test-spec012-t031-oauth-token-route-wiring.mjs"
          )
          test "${#files[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${files[@]}")
          git diff --check "${EXPECTED_MAIN_SHA}...${final_sha}"
          echo "FINAL_SHA=${final_sha}" >> "${GITHUB_ENV}"

      - name: Verify deterministic Frontend parity
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          npm run frontend:dispatch:generate -- --baseline-ref=main
          git diff --exit-code -- frontend-operation-governance.generated.json frontend-surface-dispatch.generated.json openapi/frontend-runtime-routes.generated.yaml
          node test-frontend-dispatch-workflow-baseline.mjs
          node test-frontend-operation-governance-generator.mjs
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-openapi-route-coverage.mjs
          npm run openapi:auth:check

      - name: Verify OAuth repair and E2E authority
        shell: bash
        run: |
          set -euo pipefail
          (
            cd http-generic-api
            node test-spec012-t031-oauth-token-route-wiring.mjs
            node test-auth-oauth-routes.mjs
            node test-spec012-t033-short-lived-bearer-profile.mjs
          )
          node http-generic-api/scripts/e2e-phase-governance.mjs check --base "${EXPECTED_MAIN_SHA}" --head "${FINAL_SHA}" --report-file /tmp/spec012-oauth-e2e.json
          node --input-type=module -e '
            import fs from "node:fs";
            const r = JSON.parse(fs.readFileSync("/tmp/spec012-oauth-e2e.json", "utf8"));
            if (r.ok !== true || (r.findings || []).length !== 0) process.exit(1);
          '

      - name: Verify complete HTTP Generic API manifest
        working-directory: http-generic-api
        run: npm test

      - name: Push fast-forward refreshed head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main "${BRANCH_NAME}"
          test "$(git rev-parse origin/${BRANCH_NAME})" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse origin/main)" = "${EXPECTED_MAIN_SHA}"
          git push origin "HEAD:${BRANCH_NAME}"
