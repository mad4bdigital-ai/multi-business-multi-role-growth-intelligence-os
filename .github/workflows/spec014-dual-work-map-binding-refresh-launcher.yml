name: Spec 014 Dual Work Map Binding Refresh Launcher

on:
  push:
    branches:
      - gpt/spec014-work-map-binding-refresh-98cf806-20260807
    paths:
      - .github/workflows/spec014-dual-work-map-binding-refresh-launcher.yml

permissions:
  contents: write

concurrency:
  group: spec014-dual-work-map-binding-refresh-98cf806-20260807
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_TARGET_SHA: 98cf8066521b29c68bc3cc7554961cd174969802
      TARGET_BRANCH: fix/github-main-single-owner-review-mode-v2-20260807
      LAUNCHER_PATH: .github/workflows/spec014-dual-work-map-binding-refresh-launcher.yml
      DURABLE_MANIFEST: specs/014-governed-hostinger-durable-storage/work-map-integration.json
      ORCHESTRATION_MANIFEST: specs/014-governed-hostinger-storage-orchestration/work-map-integration.json

    steps:
      - name: Checkout exact launcher head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable launcher topology
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_TARGET_SHA"
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$LAUNCHER_PATH"
          test -z "$(git status --porcelain)"

      - name: Checkout exact target candidate without launcher
        uses: actions/checkout@v5
        with:
          ref: 98cf8066521b29c68bc3cc7554961cd174969802
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Verify target branch is still exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_TARGET_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Refresh both stale Spec 014 bindings through canonical producer
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            --feature-key 014-governed-hostinger-durable-storage
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            --feature-key 014-governed-hostinger-storage-orchestration

      - name: Enforce exact generated write set
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain=v1 --untracked-files=all | sed -E 's/^...//' | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "$DURABLE_MANIFEST"
          test "${changed[1]}" = "$ORCHESTRATION_MANIFEST"
          git diff --check

      - name: Prove producer idempotency and exact-head readback
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            --feature-key 014-governed-hostinger-durable-storage --check
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            --feature-key 014-governed-hostinger-storage-orchestration --check
          REPORT_PATH="$RUNNER_TEMP/spec014-final-work-map-readback.json" \
            node http-generic-api/scripts/spec014-final-work-map-readback.mjs
          node - "$RUNNER_TEMP/spec014-final-work-map-readback.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (report.ok !== true) throw new Error('readback_not_current');
          if ((report.findings || []).length !== 0) throw new Error('unexpected_findings');
          if (report.repository_mutation !== false) throw new Error('invalid_repository_mutation_flag');
          if (report.provider_dispatch !== false) throw new Error('provider_dispatch_detected');
          if (report.live_database_access !== false) throw new Error('live_database_access_detected');
          if (report.migration_apply !== false) throw new Error('migration_apply_detected');
          if (report.secrets_included !== false) throw new Error('secrets_included');
          NODE
          node http-generic-api/test-spec014-refresh-final-work-map-binding.mjs
          git diff --check

      - name: Commit exact generated manifests and fast-forward target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_TARGET_SHA"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$DURABLE_MANIFEST" "$ORCHESTRATION_MANIFEST"
          mapfile -t staged < <(git diff --cached --name-only | sort)
          test "${#staged[@]}" -eq 2
          test "${staged[0]}" = "$DURABLE_MANIFEST"
          test "${staged[1]}" = "$ORCHESTRATION_MANIFEST"

          git commit -m 'chore(spec-014): refresh Work Map registry bindings'
          result_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_TARGET_SHA"
          mapfile -t committed < <(git diff --name-only HEAD^ HEAD | sort)
          test "${#committed[@]}" -eq 2
          test "${committed[0]}" = "$DURABLE_MANIFEST"
          test "${committed[1]}" = "$ORCHESTRATION_MANIFEST"

          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_TARGET_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "RESULT_HEAD_SHA=$result_sha" >> "$GITHUB_ENV"

      - name: Final bounded summary
        shell: bash
        run: |
          set -euo pipefail
          echo 'SPEC014_DUAL_WORK_MAP_BINDING_REFRESH=success'
          echo "RESULT_HEAD_SHA=${RESULT_HEAD_SHA}"
          echo "CHANGED_FILE=$DURABLE_MANIFEST"
          echo "CHANGED_FILE=$ORCHESTRATION_MANIFEST"
          echo 'WORK_MAP_FILES_MUTATED=false'
          echo 'FORCE_PUSH=false'
          echo 'PROTECTED_BRANCH_MUTATION=false'
          echo 'PROVIDER_DISPATCH=false'
          echo 'LIVE_DATABASE_ACCESS=false'
          echo 'MIGRATION_APPLY=false'
          echo 'SECRETS_INCLUDED=false'
