name: Spec 014 Work Map Binding Refresh 20260806

on:
  push:
    branches:
      - fix/spec014-wave1-apply-cross-run-guard-20260805
    paths:
      - .github/workflows/spec014-work-map-binding-refresh-20260806.yml

permissions:
  contents: write

concurrency:
  group: spec014-work-map-binding-refresh-20260806
  cancel-in-progress: false

jobs:
  refresh-bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable authority boundary
        shell: bash
        env:
          EXPECTED_PARENT: ef75aa1e7ad52fce47391241025e18d5b697798f
          EXPECTED_MAIN: 52ed25f8b9765aedfde6e3e0f9dfd826ea9cf7d5
          EXPECTED_BRANCH: fix/spec014-wave1-apply-cross-run-guard-20260805
          WRITER_PATH: .github/workflows/spec014-work-map-binding-refresh-20260806.yml
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os"
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          mapfile -t last_commit_files < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#last_commit_files[@]}" -eq 1
          test "${last_commit_files[0]}" = "$WRITER_PATH"
          mapfile -t pr_files < <(git diff --name-only "$EXPECTED_MAIN...HEAD" | sort)
          expected=(
            .changes/e2e/spec014-wave1-apply-terminal-lock.json
            .github/workflows/spec014-wave1-apply.yml
            .github/workflows/spec014-work-map-binding-refresh-20260806.yml
            docs/work-maps/README.md
            docs/work-maps/repository-automation-map.md
            http-generic-api/test-spec014-wave1-apply-terminal-lock.mjs
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${pr_files[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"

      - name: Regenerate exact registry bindings
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/spec014-work-map-binding-refresh-20260806.yml
          node http-generic-api/scripts/platform-work-map-generator.mjs

      - name: Validate bounded diff and governance gate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            .github/workflows/spec014-work-map-binding-refresh-20260806.yml
            specs/014-governed-hostinger-storage-orchestration/work-map-integration.json
            specs/014-retail-commerce-operations-growth-os/work-map-integration.json
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          actual_text="$(printf '%s\n' "${changed[@]}")"
          expected_text="$(printf '%s\n' "${expected_sorted[@]}")"
          if [[ "$actual_text" != "$expected_text" ]]; then
            actual_csv="$(printf '%s,' "${changed[@]}")"
            expected_csv="$(printf '%s,' "${expected_sorted[@]}")"
            echo "::error file=.github/workflows/spec014-work-map-binding-refresh-20260806.yml,title=Unexpected generated diff::actual=${actual_csv%,}; expected=${expected_csv%,}"
            exit 1
          fi
          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          node http-generic-api/scripts/spec-kit-work-map-governance-gate.mjs --ci --changed
          node http-generic-api/test-spec-kit-work-map-governance-gate.mjs
          git diff --check

      - name: Commit and push fast-forward only
        shell: bash
        env:
          EXPECTED_REMOTE_HEAD: ${{ github.sha }}
          BRANCH: fix/spec014-wave1-apply-cross-run-guard-20260805
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$EXPECTED_REMOTE_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows/spec014-work-map-binding-refresh-20260806.yml \
            specs/014-governed-hostinger-storage-orchestration/work-map-integration.json \
            specs/014-retail-commerce-operations-growth-os/work-map-integration.json
          git commit -m "chore(spec014): regenerate terminal-lock work map bindings"
          git push origin "HEAD:refs/heads/$BRANCH"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$(git rev-parse HEAD)"
