name: Spec 014 Work Map Binding Refresh 20260806

on:
  push:
    branches:
      - fix/spec014-wave1-apply-cross-run-guard-20260805
    paths:
      - .github/workflows/spec014-work-map-binding-refresh-20260806.yml

permissions:
  contents: write

concurrency:
  group: spec014-work-map-binding-refresh-20260806
  cancel-in-progress: false

jobs:
  refresh-bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable authority boundary
        shell: bash
        env:
          EXPECTED_PARENT: 1e4d9507954434cbd8e95f959ccfcc66478633b9
          EXPECTED_MAIN: 52ed25f8b9765aedfde6e3e0f9dfd826ea9cf7d5
          EXPECTED_BRANCH: fix/spec014-wave1-apply-cross-run-guard-20260805
          WRITER_PATH: .github/workflows/spec014-work-map-binding-refresh-20260806.yml
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os"
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          mapfile -t last_commit_files < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#last_commit_files[@]}" -eq 1
          test "${last_commit_files[0]}" = "$WRITER_PATH"
          mapfile -t pr_files < <(git diff --name-only "$EXPECTED_MAIN...HEAD" | sort)
          expected=(
            .changes/e2e/spec014-wave1-apply-terminal-lock.json
            .github/workflows/spec014-wave1-apply.yml
            .github/workflows/spec014-work-map-binding-refresh-20260806.yml
            docs/work-maps/README.md
            docs/work-maps/repository-automation-map.md
            http-generic-api/test-spec014-wave1-apply-terminal-lock.mjs
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${pr_files[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"

      - name: Refresh exact registry bindings
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/spec014-work-map-binding-refresh-20260806.yml
          node <<'NODE'
          const fs = require('node:fs');
          const targets = [
            'specs/014-governed-hostinger-storage-orchestration/work-map-integration.json',
            'specs/014-retail-commerce-operations-growth-os/work-map-integration.json',
          ];
          const oldFingerprint = '0d5e83fdf5c64b989cec0745f9fea9a98156bd9f12348cfe6e30417fe6bfd314';
          const oldIndex = '8af1fafcb8ce298f42ea750cf75a52c575a836450930fe56b2f589bda3c2e5ce';
          const newFingerprint = 'fbef1e0e86697afa209337bba5ac30906dcfba34bb2c335a46f29e211d6facda';
          const newIndex = 'e29d1b4972941a89347fdbbd11cc8960d104e54aaeefe1cd935a71d098b138e4';
          const expectedCoverage = 'e12cbc5ae9c4a743221ae6d33004741f492cd91c4ae2cbc82c05b7c3fd60537b';
          for (const file of targets) {
            const doc = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (doc.review_state !== 'ready_for_implementation') throw new Error(`${file}: unexpected review_state`);
            if (doc.registry?.fingerprint !== oldFingerprint) throw new Error(`${file}: unexpected old fingerprint`);
            if (doc.registry?.index_source_hash !== oldIndex) throw new Error(`${file}: unexpected old index hash`);
            if (doc.registry?.coverage_source_hash !== expectedCoverage) throw new Error(`${file}: unexpected coverage hash`);
            if (doc.registry?.map_count !== 19 || doc.registry?.domain_count !== 16 || doc.registry?.uncategorized_count !== 0 || doc.registry?.taxonomy_gap_cluster_count !== 0) {
              throw new Error(`${file}: unexpected registry cardinality`);
            }
            doc.registry.fingerprint = newFingerprint;
            doc.registry.index_source_hash = newIndex;
            fs.writeFileSync(file, `${JSON.stringify(doc, null, 2)}\n`);
          }
          NODE

      - name: Validate bounded diff and governance gate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            .github/workflows/spec014-work-map-binding-refresh-20260806.yml
            specs/014-governed-hostinger-storage-orchestration/work-map-integration.json
            specs/014-retail-commerce-operations-growth-os/work-map-integration.json
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          node http-generic-api/scripts/spec-kit-work-map-governance-gate.mjs --ci --changed
          node http-generic-api/test-spec-kit-work-map-governance-gate.mjs
          git diff --check

      - name: Commit and push fast-forward only
        shell: bash
        env:
          EXPECTED_REMOTE_HEAD: ${{ github.sha }}
          BRANCH: fix/spec014-wave1-apply-cross-run-guard-20260805
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$EXPECTED_REMOTE_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows/spec014-work-map-binding-refresh-20260806.yml \
            specs/014-governed-hostinger-storage-orchestration/work-map-integration.json \
            specs/014-retail-commerce-operations-growth-os/work-map-integration.json
          git commit -m "chore(spec014): refresh terminal-lock work map bindings"
          git push origin "HEAD:refs/heads/$BRANCH"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$(git rev-parse HEAD)"
