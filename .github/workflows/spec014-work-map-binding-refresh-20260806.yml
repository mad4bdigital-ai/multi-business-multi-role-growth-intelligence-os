name: Spec 014 Work Map Binding Refresh 20260806

on:
  push:
    branches:
      - fix/spec014-wave1-apply-cross-run-guard-20260805
    paths:
      - .github/workflows/spec014-work-map-binding-refresh-20260806.yml

permissions:
  contents: write

concurrency:
  group: spec014-work-map-binding-refresh-20260806
  cancel-in-progress: false

jobs:
  refresh-bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable authority boundary
        shell: bash
        env:
          EXPECTED_PARENT: 7c9813c5519eda7fa89371dd88f2ca58d0c7199e
          EXPECTED_MAIN: 52ed25f8b9765aedfde6e3e0f9dfd826ea9cf7d5
          EXPECTED_BRANCH: fix/spec014-wave1-apply-cross-run-guard-20260805
          WRITER_PATH: .github/workflows/spec014-work-map-binding-refresh-20260806.yml
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os"
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          mapfile -t last_commit_files < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#last_commit_files[@]}" -eq 1
          test "${last_commit_files[0]}" = "$WRITER_PATH"
          mapfile -t pr_files < <(git diff --name-only "$EXPECTED_MAIN...HEAD" | sort)
          expected=(
            .changes/e2e/spec014-wave1-apply-terminal-lock.json
            .github/workflows/spec014-wave1-apply.yml
            .github/workflows/spec014-work-map-binding-refresh-20260806.yml
            docs/work-maps/README.md
            docs/work-maps/repository-automation-map.md
            http-generic-api/test-spec014-wave1-apply-terminal-lock.mjs
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${pr_files[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"

      - name: Remove temporary writer and verify generated state
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/spec014-work-map-binding-refresh-20260806.yml
          node http-generic-api/scripts/platform-work-map-generator.mjs
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(.github/workflows/spec014-work-map-binding-refresh-20260806.yml)
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected[@]}")"
          if ! node http-generic-api/scripts/platform-work-map-generator.mjs --check; then
            echo "::error file=.github/workflows/spec014-work-map-binding-refresh-20260806.yml,title=Generator check failed::platform-work-map-generator --check rejected the post-cleanup tree"
            exit 1
          fi
          set +e
          gate_output="$(node http-generic-api/scripts/spec-kit-work-map-governance-gate.mjs --ci --changed 2>&1)"
          gate_status=$?
          set -e
          if [[ "$gate_status" -ne 0 ]]; then
            compact="$(printf '%s' "$gate_output" | node -e '
              let raw = "";
              process.stdin.on("data", (chunk) => { raw += chunk; });
              process.stdin.on("end", () => {
                try {
                  const payload = JSON.parse(raw);
                  const findings = Array.isArray(payload.findings) ? payload.findings.slice(0, 12) : [];
                  process.stdout.write(JSON.stringify({
                    work_maps_discovered: payload.work_maps_discovered,
                    schema_domains_discovered: payload.schema_domains_discovered,
                    spec_kits_checked: payload.spec_kits_checked,
                    new_spec_kits: payload.new_spec_kits,
                    implementation_changed: payload.implementation_changed,
                    findings,
                  }));
                } catch {
                  process.stdout.write(raw.slice(-4000).replace(/\r?\n/g, " "));
                }
              });
            ')"
            echo "::error file=.github/workflows/spec014-work-map-binding-refresh-20260806.yml,title=Governance gate findings::${compact}"
            exit 1
          fi
          if ! node http-generic-api/test-spec-kit-work-map-governance-gate.mjs; then
            echo "::error file=.github/workflows/spec014-work-map-binding-refresh-20260806.yml,title=Governance regression failed::test-spec-kit-work-map-governance-gate rejected the post-cleanup tree"
            exit 1
          fi
          git diff --check

      - name: Commit and push fast-forward only
        shell: bash
        env:
          EXPECTED_REMOTE_HEAD: ${{ github.sha }}
          BRANCH: fix/spec014-wave1-apply-cross-run-guard-20260805
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$EXPECTED_REMOTE_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows/spec014-work-map-binding-refresh-20260806.yml
          git commit -m "chore(spec014): remove temporary work map writer"
          git push origin "HEAD:refs/heads/$BRANCH"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$(git rev-parse HEAD)"
