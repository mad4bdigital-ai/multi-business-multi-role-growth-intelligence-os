name: CI Evidence Publisher Live Inspection

on:
  pull_request:
    paths:
      - .github/workflows/ci-evidence-publisher-live-inspection.yml

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Capture publisher workflow and run metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: "30698015125"
        run: |
          set -euo pipefail
          mkdir -p inspection/raw
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci-evidence-pr-publisher.yml" > inspection/raw/workflow.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci-evidence-pr-publisher.yml/runs?per_page=50" > inspection/raw/runs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > inspection/raw/source.json
          jq -n \
            --slurpfile workflow inspection/raw/workflow.json \
            --slurpfile runs inspection/raw/runs.json \
            --slurpfile source inspection/raw/source.json \
            '{
              contract: "mad4b.ci-evidence-publisher-live-inspection.v1",
              workflow: {
                id: $workflow[0].id,
                name: $workflow[0].name,
                path: $workflow[0].path,
                state: $workflow[0].state,
                created_at: $workflow[0].created_at,
                updated_at: $workflow[0].updated_at
              },
              source_run: {
                id: $source[0].id,
                name: $source[0].name,
                event: $source[0].event,
                status: $source[0].status,
                conclusion: $source[0].conclusion,
                head_branch: $source[0].head_branch,
                head_sha: $source[0].head_sha,
                pull_requests: [$source[0].pull_requests[]? | {number, head, base}]
              },
              publisher_runs: [
                $runs[0].workflow_runs[]? | {
                  id,
                  name,
                  event,
                  status,
                  conclusion,
                  head_branch,
                  head_sha,
                  run_number,
                  created_at,
                  updated_at,
                  actor: .actor.login,
                  triggering_actor: .triggering_actor.login
                }
              ],
              publisher_run_count: ($runs[0].workflow_runs | length),
              secrets_included: false
            }' > inspection/publisher-live-inspection.json

      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-publisher-live-inspection-${{ github.run_id }}
          path: inspection/publisher-live-inspection.json
          if-no-files-found: error
          retention-days: 2
