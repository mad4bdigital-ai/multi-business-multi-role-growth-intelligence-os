name: PR 3265 Row Resolution Semantic Repair

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'gpt/hostinger-production-resync-policy-20260729'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governed PR head
        uses: actions/checkout@v5
        with:
          ref: gpt/hostinger-production-resync-policy-20260729
          fetch-depth: 0

      - name: Apply deterministic row-resolution repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              if old in text:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{label}: expected one old match, found {count}")
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f"{label}: neither old nor repaired form found")
              path.write_text(text, encoding="utf-8")

          trigger_path = Path("http-generic-api/repositoryMainMovedTriggerService.js")
          replace_exact(
              trigger_path,
              "`SELECT * FROM repository_main_moved_trigger_events WHERE event_fingerprint_sha256 = ? LIMIT 1`",
              "`SELECT * FROM repository_main_moved_trigger_events WHERE event_fingerprint_sha256 = ? LIMIT 2`",
              "trigger fingerprint uniqueness probe",
          )
          replace_exact(
              trigger_path,
              "`SELECT * FROM repository_main_moved_trigger_events WHERE trigger_event_id = ? LIMIT 1`",
              "`SELECT * FROM repository_main_moved_trigger_events WHERE trigger_event_id = ? LIMIT 2`",
              "trigger id uniqueness probe",
          )

          advisor_path = Path("http-generic-api/selfHealingReleaseAdvisorService.js")
          replace_exact(
              advisor_path,
              '''function uniqueAdvisorRow(rowset, context) {
            if (!Array.isArray(rowset)) {
              fail("release_advisor_resolution_invalid", "Release advisor resolution returned an invalid rowset.", 500, { context });
            }
            if (rowset.length > 1) {
              fail("release_advisor_resolution_ambiguous", "Release advisor resolution returned multiple candidates.", 409, {
                context,
                candidate_count: rowset.length,
              });
            }
            const [row] = rowset;
            return row || null;
          }
          ''',
              '''function uniqueAdvisorRow(rowset, context) {
            if (!Array.isArray(rowset)) {
              fail("release_advisor_resolution_invalid", "Release advisor resolution returned an invalid rowset.", 500, { context });
            }
            if (rowset.length > 1) {
              fail("release_advisor_resolution_ambiguous", "Release advisor resolution returned multiple candidates.", 409, {
                context,
                candidate_count: rowset.length,
              });
            }
            const [row] = rowset;
            return row || null;
          }

          function deterministicLatestAdvisorRow(rowset, context) {
            if (!Array.isArray(rowset)) {
              fail("release_advisor_resolution_invalid", "Release advisor deterministic selection returned an invalid rowset.", 500, { context });
            }
            const [row] = rowset;
            return row || null;
          }
          ''',
              "insert deterministic latest-row resolver",
          )
          replace_exact(
              advisor_path,
              '''  let verificationRows;
            if (input.runtime_verification_run_id) {
              [verificationRows] = await pool.query(`SELECT * FROM runtime_verification_runs WHERE run_id = ? LIMIT 1`, [input.runtime_verification_run_id]);
            } else {
              [verificationRows] = await pool.query(`SELECT * FROM runtime_verification_runs WHERE environment_key = ? ORDER BY completed_at DESC, started_at DESC LIMIT 1`, [input.environment_key]);
            }
            const verification = uniqueAdvisorRow(verificationRows, "runtime_verification");''',
              '''  let verificationRows;
            let verification;
            if (input.runtime_verification_run_id) {
              [verificationRows] = await pool.query(`SELECT * FROM runtime_verification_runs WHERE run_id = ? LIMIT 2`, [input.runtime_verification_run_id]);
              verification = uniqueAdvisorRow(verificationRows, "runtime_verification_run_id");
            } else {
              [verificationRows] = await pool.query(`SELECT * FROM runtime_verification_runs WHERE environment_key = ? ORDER BY completed_at DESC, started_at DESC, run_id DESC LIMIT 1`, [input.environment_key]);
              verification = deterministicLatestAdvisorRow(verificationRows, "runtime_verification_latest");
            }''',
              "verification unique/latest semantics",
          )
          replace_exact(
              advisor_path,
              "`SELECT * FROM release_operations WHERE operation_id = ? LIMIT 1`",
              "`SELECT * FROM release_operations WHERE operation_id = ? LIMIT 2`",
              "explicit operation uniqueness probe",
          )
          replace_exact(
              advisor_path,
              '''    const [rows] = await pool.query(
              `SELECT * FROM release_operations WHERE ${clauses.join(" AND ")} ORDER BY created_at DESC LIMIT 1`,
              params,
            );
            operation = uniqueAdvisorRow(rows, "release_operation");''',
              '''    const [rows] = await pool.query(
              `SELECT * FROM release_operations WHERE ${clauses.join(" AND ")} ORDER BY created_at DESC, operation_id DESC LIMIT 1`,
              params,
            );
            operation = deterministicLatestAdvisorRow(rows, "release_operation_latest");''',
              "latest operation deterministic selection",
          )
          replace_exact(
              advisor_path,
              '''    const [gateRows] = await pool.query(`SELECT * FROM release_gates WHERE operation_id = ? ORDER BY created_at DESC LIMIT 1`, [operation.operation_id]);
              gate = uniqueAdvisorRow(gateRows, "release_gate");
              const [deploymentRows] = await pool.query(`SELECT * FROM release_async_deployments WHERE operation_id = ? ORDER BY created_at DESC LIMIT 1`, [operation.operation_id]);
              asyncDeployment = uniqueAdvisorRow(deploymentRows, "release_async_deployment");''',
              '''    const [gateRows] = await pool.query(`SELECT * FROM release_gates WHERE operation_id = ? ORDER BY created_at DESC, gate_id DESC LIMIT 1`, [operation.operation_id]);
              gate = deterministicLatestAdvisorRow(gateRows, "release_gate_latest");
              const [deploymentRows] = await pool.query(`SELECT * FROM release_async_deployments WHERE operation_id = ? ORDER BY created_at DESC, async_deployment_id DESC LIMIT 1`, [operation.operation_id]);
              asyncDeployment = deterministicLatestAdvisorRow(deploymentRows, "release_async_deployment_latest");''',
              "latest gate and deployment deterministic selection",
          )
          replace_exact(
              advisor_path,
              "`SELECT * FROM release_advisor_runs WHERE advisor_run_id = ? LIMIT 1`",
              "`SELECT * FROM release_advisor_runs WHERE advisor_run_id = ? LIMIT 2`",
              "advisor run uniqueness probe",
          )
          replace_exact(
              advisor_path,
              "`SELECT advisor_run_id FROM release_advisor_runs WHERE plan_fingerprint_sha256 = ? LIMIT 1`",
              "`SELECT advisor_run_id FROM release_advisor_runs WHERE plan_fingerprint_sha256 = ? LIMIT 2`",
              "advisor plan fingerprint uniqueness probes",
          )
          advisor_text = advisor_path.read_text(encoding="utf-8")
          advisor_text = advisor_text.replace(
              '''      const duplicateRun = uniqueAdvisorRow(rows, "duplicate_plan_fingerprint_sha256");
            if (duplicateRun) return { ...(await getReleaseAdvisorRun(duplicateRun.advisor_run_id, { pool })), deduplicated: true };''',
              '''      const duplicateRun = uniqueAdvisorRow(rows, "duplicate_plan_fingerprint_sha256");
              if (duplicateRun) return { ...(await getReleaseAdvisorRun(duplicateRun.advisor_run_id, { pool })), deduplicated: true };''',
              1,
          )
          advisor_path.write_text(advisor_text, encoding="utf-8")

          trigger_test_path = Path("http-generic-api/test-repository-main-moved-trigger-coordinator.mjs")
          replace_exact(
              trigger_test_path,
              '''assert.match(service, /repository_main_moved_resolution_ambiguous/);''',
              '''assert.match(service, /repository_main_moved_resolution_ambiguous/);
          assert.match(service, /event_fingerprint_sha256 = \\? LIMIT 2/);
          assert.match(service, /trigger_event_id = \\? LIMIT 2/);''',
              "trigger ambiguity query regressions",
          )

          advisor_test_path = Path("http-generic-api/test-self-healing-release-advisor.mjs")
          replace_exact(
              advisor_test_path,
              '''assert.match(advisorService, /release_advisor_resolution_ambiguous/);''',
              '''assert.match(advisorService, /release_advisor_resolution_ambiguous/);
          assert.match(advisorService, /run_id = \\? LIMIT 2/);
          assert.match(advisorService, /operation_id = \\? LIMIT 2/);
          assert.match(advisorService, /advisor_run_id = \\? LIMIT 2/);
          assert.match(advisorService, /plan_fingerprint_sha256 = \\? LIMIT 2/);
          assert.match(advisorService, /completed_at DESC, started_at DESC, run_id DESC LIMIT 1/);
          assert.match(advisorService, /created_at DESC, operation_id DESC LIMIT 1/);
          assert.match(advisorService, /created_at DESC, gate_id DESC LIMIT 1/);
          assert.match(advisorService, /created_at DESC, async_deployment_id DESC LIMIT 1/);''',
              "advisor unique/latest query regressions",
          )
          PY

      - name: Install focused dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Validate focused contracts
        shell: bash
        run: |
          node http-generic-api/test-repository-main-moved-trigger-coordinator.mjs
          node http-generic-api/test-self-healing-release-advisor.mjs
          if grep -En '\b(rows|rowset|verificationRows|gateRows|deploymentRows|existingRows)\s*\[\s*0\s*\]' \
            http-generic-api/repositoryMainMovedTriggerService.js \
            http-generic-api/selfHealingReleaseAdvisorService.js; then
            echo "Direct first-candidate selection remains" >&2
            exit 1
          fi

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            http-generic-api/repositoryMainMovedTriggerService.js \
            http-generic-api/selfHealingReleaseAdvisorService.js \
            http-generic-api/test-repository-main-moved-trigger-coordinator.mjs \
            http-generic-api/test-self-healing-release-advisor.mjs
          git rm .github/workflows/pr3265-row-resolution-repair.yml
          git diff --cached --check
          git commit -m "fix(release): distinguish unique and latest row resolution"
          git push origin HEAD:gpt/hostinger-production-resync-policy-20260729
