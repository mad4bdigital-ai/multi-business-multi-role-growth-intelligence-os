name: Surface Callability Product Validation

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: surface-callability-product-validation-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  validate-and-materialize-evidence:
    if: >-
      github.event.pull_request.head.ref == 'gpt/surface-callability-main-reconstruction-20260803' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_BRANCH: gpt/surface-callability-main-reconstruction-20260803
      PINNED_SOURCE_HEAD: 821760b10c485dd7877fbbb43d4c3179ec19b5a7
      RUNNER_PATH: .github/workflows/surface-callability-product-validation.yml
    steps:
      - name: Check out exact product branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact validation trigger
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PINNED_SOURCE_HEAD" HEAD
          test "$(git diff --name-only "$PINNED_SOURCE_HEAD" HEAD)" = "$RUNNER_PATH"
          test "$(git rev-list --count "$PINNED_SOURCE_HEAD..HEAD")" -ge 1

      - name: Apply scoped Surface queue compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('http-generic-api/scripts/surface-callability-closure/generate_closure_contracts.mjs')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}_marker_count:{count}')
              text = text.replace(old, new, 1)

          replace_once(
              'const HOSTINGER_MIGRATION = "20260730_hostinger_production_resync_policy.sql";\n',
              '''const HOSTINGER_MIGRATION = "20260730_hostinger_production_resync_policy.sql";
          const SURFACE_CLOSURE_TOOL_KEYS = new Set([
            "brand_workspace_context_resolve",
            "connect_credential_intake_wait",
            "credential_intake_connection_status",
            "platform_resource_context_catalog",
            "platform_resource_context_diagnostic_handoff",
            "platform_resource_context_related",
            "platform_resource_context_resolve",
            "tenant_agent_surface_deployment_upsert",
            "tenant_agent_surface_preferences_update",
            "tenant_agent_surfaces_catalog",
            "tenant_agent_surfaces_get",
            "tenant_agent_surfaces_readiness",
            "tenant_capability_registry_read",
            "tenant_database_connection_status",
            "tenant_database_preflight",
            "tenant_database_query_readonly",
            "tenant_database_schema_read",
            "tenant_docs_catalog",
            "tenant_gpt_operating_guide_read",
            "tenant_ssh_cli_allowlisted_dry_run",
            "tenant_ssh_cli_allowlisted_execute",
            "tenant_ssh_cli_approval_request_create",
            "tenant_ssh_cli_approval_request_decide",
            "tenant_ssh_cli_approval_request_status",
            "tenant_ssh_cli_execute_job_result",
            "tenant_ssh_connection_status",
            "tenant_ssh_preflight",
            "tenant_ssh_probe",
            "workspace_access_request_cancel",
            "workspace_assets_list",
            "workspace_invitation_resend",
            "workspace_invitation_revoke",
            "workspace_invitations_expire_stale",
            "workspace_member_remove",
            "workspace_member_update",
            "workspace_my_access_requests_list",
            "workspace_ownership_transfer",
            "workspace_resource_grant_create",
            "workspace_resource_grant_revoke",
            "workspace_resource_grants_list",
            "workspace_vaults_list",
          ]);
          ''',
              'surface_tool_scope_insert',
          )

          replace_once(
              '''const sourceItems = queue.top_items.filter((item) => item.migration_file !== HOSTINGER_MIGRATION);
          if (sourceItems.length !== 20) throw new Error(`surface_queue_expected_20_callable_items_actual_${sourceItems.length}`);
          ''',
              '''function queueToolTargets(item) {
            return unique((item.remediation || [])
              .filter((action) => action.action_key === "verify_tool_registry_binding")
              .flatMap((action) => Array.isArray(action.targets) ? action.targets : []));
          }
          const sourceItems = queue.top_items.filter((item) => queueToolTargets(item).some((key) => SURFACE_CLOSURE_TOOL_KEYS.has(key)));
          const scopedToolKeys = unique(sourceItems.flatMap((item) => queueToolTargets(item).filter((key) => SURFACE_CLOSURE_TOOL_KEYS.has(key))));
          const missingScopedToolKeys = [...SURFACE_CLOSURE_TOOL_KEYS].filter((key) => !scopedToolKeys.includes(key)).sort();
          const unexpectedScopedToolKeys = scopedToolKeys.filter((key) => !SURFACE_CLOSURE_TOOL_KEYS.has(key));
          if (missingScopedToolKeys.length || unexpectedScopedToolKeys.length) {
            throw new Error(`surface_queue_scope_mismatch:missing=${missingScopedToolKeys.join(",")}:unexpected=${unexpectedScopedToolKeys.join(",")}`);
          }
          if (sourceItems.length !== 20) throw new Error(`surface_queue_expected_20_scoped_callable_items_actual_${sourceItems.length}`);
          ''',
              'surface_source_scope_replace',
          )

          replace_once(
              '''  const expectedToolKeys = unique((item.remediation || [])
              .filter((action) => action.action_key === "verify_tool_registry_binding")
              .flatMap((action) => Array.isArray(action.targets) ? action.targets : []));
          ''',
              '''  const discoveredToolKeys = queueToolTargets(item);
            const outOfScopeToolKeys = discoveredToolKeys.filter((key) => !SURFACE_CLOSURE_TOOL_KEYS.has(key));
            if (outOfScopeToolKeys.length) throw new Error(`surface_queue_item_scope_expanded:${relativeMigration}:${outOfScopeToolKeys.join(",")}`);
            const expectedToolKeys = discoveredToolKeys.filter((key) => SURFACE_CLOSURE_TOOL_KEYS.has(key));
          ''',
              'surface_expected_keys_replace',
          )

          replace_once(
              '  source_queue_item_count: queue.total_items,\n',
              '''  source_queue_item_count: sourceItems.length,
            source_queue_total_item_count: queue.total_items,
            source_queue_excluded_item_count: queue.total_items - sourceItems.length,
          ''',
              'surface_manifest_count_replace',
          )

          replace_once(
              'const queue = JSON.parse(fs.readFileSync("../docs/surface-contract-gap-queue.json", "utf8"));\\nassert.equal(queue.total_items, 0, JSON.stringify(queue.top_items));\\n',
              'const queue = JSON.parse(fs.readFileSync("../docs/surface-contract-gap-queue.json", "utf8"));\\nconst remainingScopedItems = queue.top_items.filter((item) => (item.remediation || []).some((action) => action.action_key === "verify_tool_registry_binding" && (action.targets || []).some((key) => manifest.source_queue_tool_keys.includes(key))));\\nassert.deepEqual(remainingScopedItems, [], JSON.stringify(remainingScopedItems));\\n',
              'surface_generated_test_queue_replace',
          )

          replace_once(
              'console.log(JSON.stringify({ ok: true, source_queue_items: queue.total_items, callable_migrations: sourceItems.length, tool_count: sourceToolKeys.length, contract_count: contracts.length, hostinger_blob_sha: hostingerBlob, hostinger_sha256: hostingerSha256, secrets_included: false }, null, 2));',
              'console.log(JSON.stringify({ ok: true, source_queue_items: sourceItems.length, repository_queue_items: queue.total_items, excluded_repository_queue_items: queue.total_items - sourceItems.length, callable_migrations: sourceItems.length, tool_count: sourceToolKeys.length, contract_count: contracts.length, hostinger_blob_sha: hostingerBlob, hostinger_sha256: hostingerSha256, secrets_included: false }, null, 2));',
              'surface_generator_summary_replace',
          )

          path.write_text(text)
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Generate Surface closure contracts
        working-directory: http-generic-api
        run: node scripts/surface-callability-closure/generate_closure_contracts.mjs

      - name: Generate frontend dispatch evidence
        working-directory: http-generic-api
        run: npm run frontend:dispatch:generate

      - name: Generate Surface discovery evidence
        working-directory: http-generic-api
        run: node scripts/surface-contract-discovery.mjs --write

      - name: Validate focused Surface closure regressions
        working-directory: http-generic-api
        run: |
          set -euo pipefail
          node --check agentSurfaceRuntimeService.js
          node --check routes/agentSurfaceRoutes.js
          node --check routes/tenantInfrastructureRoutes.js
          node --check routes/tenantLifecycleRoutes.js
          node --check routes/workspaceResourceRoutes.js
          node --check scripts/resource-api-callability-contracts.mjs
          node --check scripts/surface-contract-sql-registry-extractor.mjs
          node --check scripts/surface-callability-closure/generate_closure_contracts.mjs
          node test-surface-contract-sql-registry-extractor.mjs
          node test-resource-api-callability-effect-classes.mjs
          node test-multi-surface-agent-runtime.mjs
          node test-resource-api-coverage.mjs
          node test-surface-callability-full-closure.mjs
          node test-test-manifest-runner.mjs

      - name: Enforce scoped Surface queue zero and bounded evidence writes
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const queue = JSON.parse(fs.readFileSync('docs/surface-contract-gap-queue.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('http-generic-api/resource-api-surface-callability.manifest.json', 'utf8'));
          const scoped = queue.top_items.filter((item) => (item.remediation || []).some((action) => action.action_key === 'verify_tool_registry_binding' && (action.targets || []).some((key) => manifest.source_queue_tool_keys.includes(key))));
          if (scoped.length) {
            console.error(JSON.stringify(scoped, null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify({ surface_queue_items: 0, repository_queue_items: queue.total_items }));
          NODE

          rm -f "$RUNNER_PATH"
          git diff --name-only > /tmp/surface-product-validation-files.txt
          python3 - <<'PY'
          from pathlib import Path

          changed = [line.strip() for line in Path('/tmp/surface-product-validation-files.txt').read_text().splitlines() if line.strip()]
          allowed = {
              '.github/workflows/surface-callability-product-validation.yml',
              'docs/surface-contract-discovery-status.json',
              'docs/surface-contract-discovery-status.md',
              'docs/surface-contract-gap-queue.json',
              'docs/surface-contract-gap-queue.md',
              'docs/surface-contract-safety-attestations.json',
              'http-generic-api/frontend-operation-governance.generated.json',
              'http-generic-api/frontend-surface-dispatch.generated.json',
              'http-generic-api/openapi/frontend-runtime-routes.generated.yaml',
              'http-generic-api/resource-api-surface-callability.manifest.json',
              'http-generic-api/scripts/surface-callability-closure/generate_closure_contracts.mjs',
              'http-generic-api/surface-contract-classification-evidence.json',
              'http-generic-api/test-surface-callability-full-closure.mjs',
          }
          unexpected = sorted(set(changed).difference(allowed))
          if unexpected:
              raise SystemExit('unexpected_surface_validation_writes:' + ','.join(unexpected))
          required = {
              '.github/workflows/surface-callability-product-validation.yml',
              'docs/surface-contract-gap-queue.json',
              'http-generic-api/resource-api-surface-callability.manifest.json',
              'http-generic-api/scripts/surface-callability-closure/generate_closure_contracts.mjs',
              'http-generic-api/surface-contract-classification-evidence.json',
              'http-generic-api/test-surface-callability-full-closure.mjs',
          }
          missing = sorted(required.difference(changed))
          if missing:
              raise SystemExit('missing_surface_validation_writes:' + ','.join(missing))
          print({'changed_files': len(changed), 'unexpected': 0, 'surface_queue_items': 0})
          PY

      - name: Commit regenerated evidence and remove temporary runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: regenerate and certify scoped Surface callability evidence'
          git push origin "HEAD:${TARGET_BRANCH}"
