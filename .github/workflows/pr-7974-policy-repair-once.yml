name: PR 7974 one-shot frontend policy repair

on:
  push:
    branches:
      - fix/admin-recovery-mcp-local-connector-ownership-20260908
    paths:
      - .github/workflows/pr-7974-policy-repair-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/admin-recovery-mcp-local-connector-ownership-20260908
          fetch-depth: 0

      - name: Repair manual frontend authority
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'http-generic-api/frontend-surface-policy.json';
          const policy = JSON.parse(fs.readFileSync(file, 'utf8'));
          const misplacedId = 'local-connector-installer-delegation-signed-query-auth';
          const surfaceId = 'local-connector-installer-delegation-api-only';
          const sourceFile = 'routes/localConnectorInstallerDelegationRoutes.js';
          const signature = 'GET /local-connector/install/download';

          if (!Array.isArray(policy.rules)) throw new Error('surface_rules_missing');
          if (!Array.isArray(policy.auth_rules)) throw new Error('auth_rules_missing');
          if (!policy.rules.some((rule) => rule.rule_id === misplacedId)) {
            throw new Error(`missing_expected_misplaced_rule:${misplacedId}`);
          }

          // The operation already has canonical signed-query auth authority through
          // signed-artifact-download-auth. The misplaced rule must be deleted from
          // surface policy, not copied into auth_rules where it would create an
          // ambiguous duplicate auth override.
          policy.rules = policy.rules.filter((rule) => rule.rule_id !== misplacedId && rule.rule_id !== surfaceId);
          policy.auth_rules = policy.auth_rules.filter((rule) => rule.rule_id !== misplacedId);

          const matchingSignedAuthRules = policy.auth_rules.filter((rule) => {
            const operations = [rule.operation, ...(Array.isArray(rule.operations) ? rule.operations : [])].filter(Boolean);
            if (!operations.includes(signature)) return false;
            if (rule.source_file && rule.source_file !== sourceFile) return false;
            return rule.profile === 'signed_query_token';
          });
          if (matchingSignedAuthRules.length !== 1) {
            throw new Error(`signed_query_auth_authority_cardinality:${matchingSignedAuthRules.length}:expected_1`);
          }

          // Source + scope is the stable surface identity. Avoid over-constraining
          // the rule to a generated family key that may gain a partition suffix.
          policy.rules.push({
            rule_id: surfaceId,
            source_file: sourceFile,
            scope: 'developer',
            decision: 'api_only',
            owner: 'local-connector',
            rationale: 'The signed-query canonical installer delegation endpoint is a machine-consumed API delivery surface. It redirects or materializes the canonical installer only after existing signed-link verification and does not render a browser UI, widen installer authority, or expose generic execution.',
            evidence_refs: [
              sourceFile,
              'routes/index.js',
              'test-local-connector-durable-self-healing.mjs',
              'openapi.yaml'
            ]
          });

          fs.writeFileSync(file, `${JSON.stringify(policy, null, 2)}\n`);
          NODE

      - name: Install verification dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Generate bounded frontend projection
        working-directory: http-generic-api
        run: npm run frontend:dispatch:generate -- --baseline-ref=main

      - name: Invariant - installer delegation family is classified
        if: always()
        working-directory: http-generic-api
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const plan = JSON.parse(fs.readFileSync('frontend-surface-dispatch.generated.json', 'utf8'));
          const sourceFile = 'routes/localConnectorInstallerDelegationRoutes.js';
          const families = (plan.families || []).filter((family) => family.source_file === sourceFile);
          if (!families.length) throw new Error('installer_delegation_family_missing');
          const blocked = families.filter((family) => family.surface_decision?.decision === 'requires_review');
          if (blocked.length) throw new Error(`installer_delegation_requires_review:${blocked.map((family) => family.family_key).join(',')}`);
          NODE

      - name: Invariant - no non-installer family requires review
        if: always()
        working-directory: http-generic-api
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const plan = JSON.parse(fs.readFileSync('frontend-surface-dispatch.generated.json', 'utf8'));
          const sourceFile = 'routes/localConnectorInstallerDelegationRoutes.js';
          const blocked = (plan.families || []).filter((family) => family.source_file !== sourceFile && family.surface_decision?.decision === 'requires_review');
          if (blocked.length) throw new Error(`non_installer_families_require_review:${blocked.map((family) => family.family_key).join(',')}`);
          NODE

      - name: Invariant - no unresolved operation classifications
        if: always()
        working-directory: http-generic-api
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const plan = JSON.parse(fs.readFileSync('frontend-surface-dispatch.generated.json', 'utf8'));
          const operations = (plan.families || []).flatMap((family) => family.operations || []);
          const unresolved = operations.filter((operation) => operation.governance?.classification === 'unresolved');
          if (unresolved.length) throw new Error(`unresolved_operation_classifications:${unresolved.length}:${unresolved.map((operation) => operation.signature).join(',')}`);
          NODE

      - name: Invariant - no route family requires review
        if: always()
        working-directory: http-generic-api
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const plan = JSON.parse(fs.readFileSync('frontend-surface-dispatch.generated.json', 'utf8'));
          const blocked = (plan.families || []).filter((family) => family.surface_decision?.decision === 'requires_review');
          if (blocked.length) throw new Error(`route_families_require_review:${blocked.length}:${blocked.map((family) => family.family_key || family.key || family.source_file).join(',')}`);
          NODE

      - name: Invariant - frontend coverage is complete
        if: always()
        working-directory: http-generic-api
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const plan = JSON.parse(fs.readFileSync('frontend-surface-dispatch.generated.json', 'utf8'));
          if (plan.coverage?.coverage_complete !== true) throw new Error(`frontend_coverage_incomplete:${JSON.stringify(plan.coverage)}`);
          NODE

      - name: Invariant - OpenAPI and auth gap counts remain zero
        if: always()
        working-directory: http-generic-api
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const plan = JSON.parse(fs.readFileSync('frontend-surface-dispatch.generated.json', 'utf8'));
          const coverage = plan.coverage || {};
          if (coverage.openapi_gap_count !== 0) throw new Error(`openapi_gap_count:${coverage.openapi_gap_count}`);
          if (coverage.auth_contract_gap_count !== 0) throw new Error(`auth_contract_gap_count:${coverage.auth_contract_gap_count}`);
          NODE

      - name: Invariant - generated gaps grant no mutation authority
        if: always()
        working-directory: http-generic-api
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const plan = JSON.parse(fs.readFileSync('frontend-surface-dispatch.generated.json', 'utf8'));
          const operations = (plan.families || []).flatMap((family) => family.operations || []);
          const violating = operations.filter((operation) => String(operation.governance?.rule_id || '').startsWith('generated-gap-') && ['state_change', 'external_effect'].includes(operation.governance?.classification));
          if (violating.length) throw new Error(`generated_gap_mutation_authority:${violating.length}:${violating.map((operation) => operation.signature).join(',')}`);
          NODE

      - name: Invariant - every mutation is governed
        if: always()
        working-directory: http-generic-api
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const plan = JSON.parse(fs.readFileSync('frontend-surface-dispatch.generated.json', 'utf8'));
          const operations = (plan.families || []).flatMap((family) => family.operations || []);
          const mutations = operations.filter((operation) => ['state_change', 'external_effect'].includes(operation.governance?.classification));
          const violating = mutations.filter((operation) => operation.governance?.governed !== true);
          if (violating.length) throw new Error(`ungoverned_mutations:${violating.length}:${violating.map((operation) => operation.signature).join(',')}`);
          NODE

      - name: Invariant - every mutation exposes four controls
        if: always()
        working-directory: http-generic-api
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const plan = JSON.parse(fs.readFileSync('frontend-surface-dispatch.generated.json', 'utf8'));
          const operations = (plan.families || []).flatMap((family) => family.operations || []);
          const mutations = operations.filter((operation) => ['state_change', 'external_effect'].includes(operation.governance?.classification));
          const violating = mutations.filter((operation) => !['preflight', 'approval', 'readback', 'rollback'].every((key) => operation.governance?.controls?.[key]?.mode));
          if (violating.length) throw new Error(`mutation_controls_incomplete:${violating.length}:${violating.map((operation) => operation.signature).join(',')}`);
          NODE

      - name: Invariant - governed mutation cardinality remains 21
        if: always()
        working-directory: http-generic-api
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const plan = JSON.parse(fs.readFileSync('frontend-surface-dispatch.generated.json', 'utf8'));
          const operations = (plan.families || []).flatMap((family) => family.operations || []);
          const mutations = operations.filter((operation) => ['state_change', 'external_effect'].includes(operation.governance?.classification));
          if (mutations.length !== 21) throw new Error(`governed_mutation_cardinality:${mutations.length}:expected_21:${mutations.map((operation) => operation.signature).join(',')}`);
          NODE

      - name: Invariant - Recovery mutation signatures remain governed
        if: always()
        working-directory: http-generic-api
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const plan = JSON.parse(fs.readFileSync('frontend-surface-dispatch.generated.json', 'utf8'));
          const operations = (plan.families || []).flatMap((family) => family.operations || []);
          const mutations = operations.filter((operation) => ['state_change', 'external_effect'].includes(operation.governance?.classification));
          const required = ['POST /admin/recovery/kernel/execute', 'POST /admin/recovery/kernel/execute-approved', 'POST /admin/recovery/kernel/approval-challenge'];
          const missing = required.filter((signature) => !mutations.some((operation) => operation.signature === signature));
          if (missing.length) throw new Error(`missing_recovery_mutation_signatures:${missing.join(',')}`);
          NODE

      - name: Invariant - coverage generation is side-effect free
        if: always()
        working-directory: http-generic-api
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const plan = JSON.parse(fs.readFileSync('frontend-surface-dispatch.generated.json', 'utf8'));
          const safety = plan.safety || {};
          if (safety.executes_provider_calls !== false || safety.writes_database !== false || safety.deploys !== false) throw new Error(`unsafe_coverage_generation:${JSON.stringify(safety)}`);
          NODE

      - name: Verify canonical frontend surface coverage test
        if: always()
        working-directory: http-generic-api
        run: node test-frontend-surface-coverage-claims.mjs

      - name: Verify OpenAPI projection readiness
        if: always()
        working-directory: http-generic-api
        run: node test-openapi-projection-readiness.mjs

      - name: Commit authority repair and remove one-shot workflow
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore -- http-generic-api/frontend-operation-governance.generated.json http-generic-api/frontend-surface-dispatch.generated.json http-generic-api/openapi/frontend-runtime-routes.generated.yaml || true
          git rm .github/workflows/pr-7974-policy-repair-once.yml
          git add http-generic-api/frontend-surface-policy.json
          git diff --cached --check
          git commit -m 'fix(frontend): classify signed installer delegation surface'
          git push origin HEAD:fix/admin-recovery-mcp-local-connector-ownership-20260908
