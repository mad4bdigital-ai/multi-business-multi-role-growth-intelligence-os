name: Surface Callability Main Reconcile Once

on:
  push:
    branches:
      - gpt/surface-callability-main-clean-20260803
    paths:
      - .github/workflows/surface-callability-main-reconcile-once.yml
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: surface-callability-main-reconcile-once
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'gpt/surface-callability-main-clean-20260803'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out current-main branch
        uses: actions/checkout@v5
        with:
          ref: gpt/surface-callability-main-clean-20260803
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply full verified PR delta with bounded conflict resolution
        shell: bash
        run: |
          set -o pipefail
          {
            git fetch origin gpt/integrated-platform-governance-wave-20260731
            set +e
            git cherry-pick -m 1 --no-commit 3850d80ae6cd4d151337b2cfaf47e4f0e07b41ac
            rc=$?
            set -e
            if [[ $rc -ne 0 ]]; then
              git diff --name-only --diff-filter=U | sort > /tmp/conflicts.txt
              cat > /tmp/expected.txt <<'EOF'
          docs/surface-contract-discovery-status.json
          docs/surface-contract-discovery-status.md
          docs/surface-contract-gap-queue.json
          docs/surface-contract-gap-queue.md
          http-generic-api/frontend-surface-dispatch.generated.json
          EOF
              sort -o /tmp/expected.txt /tmp/expected.txt
              diff -u /tmp/expected.txt /tmp/conflicts.txt
              while IFS= read -r path; do git checkout --theirs -- "$path"; git add "$path"; done < /tmp/expected.txt
              test -z "$(git diff --name-only --diff-filter=U)"
              git cherry-pick --quit
            fi
            git status --short
          } 2>&1 | tee surface-main-reconcile.log

      - name: Make closure generation idempotent at queue zero
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('http-generic-api/scripts/surface-callability-closure/generate_closure_contracts.mjs')
          source = path.read_text(encoding='utf-8')
          old = '''const queue = readJson(QUEUE_PATH);
          if (queue.schema_version !== "surface-contract-gap-queue-v1" || !Array.isArray(queue.top_items)) throw new Error("surface_queue_invalid");
          const sourceItems = queue.top_items.filter((item) => item.migration_file !== HOSTINGER_MIGRATION);
          if (sourceItems.length !== 20) throw new Error(`surface_queue_expected_20_callable_items_actual_${sourceItems.length}`);
          '''
          new = '''const queue = readJson(QUEUE_PATH);
          if (queue.schema_version !== "surface-contract-gap-queue-v1" || !Array.isArray(queue.top_items)) throw new Error("surface_queue_invalid");
          function queueExpectedToolKeys(item) {
            return unique((item.remediation || [])
              .filter((action) => action.action_key === "verify_tool_registry_binding")
              .flatMap((action) => Array.isArray(action.targets) ? action.targets : []));
          }
          let sourceInputMode = "queue";
          let sourceQueueItemCount = queue.total_items;
          let sourceItems = queue.top_items
            .filter((item) => item.migration_file !== HOSTINGER_MIGRATION)
            .map((item) => ({ ...item, expected_tool_keys: queueExpectedToolKeys(item) }));
          if (!sourceItems.length) {
            if (!fs.existsSync(MANIFEST_PATH)) throw new Error("surface_queue_zero_manifest_missing");
            const priorManifest = readJson(MANIFEST_PATH);
            if (priorManifest.schema_version !== "resource-api-surface-callability-v1" || !Array.isArray(priorManifest.contracts)) {
              throw new Error("surface_queue_zero_manifest_invalid");
            }
            const migrationTools = new Map();
            for (const contract of priorManifest.contracts) {
              for (const binding of contract.tool_bindings || []) {
                const relativeMigration = String(binding.migration_file || "");
                const toolKey = String(binding.tool_key || "");
                if (!relativeMigration.startsWith("migrations/") || !toolKey) {
                  throw new Error(`surface_queue_zero_binding_invalid:${relativeMigration}:${toolKey}`);
                }
                const migrationFile = relativeMigration.slice("migrations/".length);
                if (migrationFile === HOSTINGER_MIGRATION) continue;
                const keys = migrationTools.get(migrationFile) || new Set();
                if (keys.has(toolKey)) throw new Error(`surface_queue_zero_binding_duplicate:${migrationFile}:${toolKey}`);
                keys.add(toolKey);
                migrationTools.set(migrationFile, keys);
              }
            }
            sourceItems = [...migrationTools.entries()]
              .sort(([left], [right]) => left.localeCompare(right))
              .map(([migration_file, keys]) => ({ migration_file, expected_tool_keys: [...keys].sort() }));
            sourceQueueItemCount = Number.isInteger(priorManifest.source_queue_item_count)
              ? priorManifest.source_queue_item_count
              : sourceItems.length + 1;
            sourceInputMode = "manifest";
          }
          if (sourceItems.length !== 20) throw new Error(`surface_queue_expected_20_callable_items_actual_${sourceItems.length}`);
          '''
          if old not in source:
            raise SystemExit('surface_idempotency_source_block_missing')
          source = source.replace(old, new, 1)
          old_keys = '''  const expectedToolKeys = unique((item.remediation || [])
              .filter((action) => action.action_key === "verify_tool_registry_binding")
              .flatMap((action) => Array.isArray(action.targets) ? action.targets : []));'''
          new_keys = '''  const expectedToolKeys = unique(Array.isArray(item.expected_tool_keys)
              ? item.expected_tool_keys
              : queueExpectedToolKeys(item));'''
          if old_keys not in source:
            raise SystemExit('surface_idempotency_tool_key_block_missing')
          source = source.replace(old_keys, new_keys, 1)
          source = source.replace('  source_queue_item_count: queue.total_items,', '  source_queue_item_count: sourceQueueItemCount,\n  source_input_mode: sourceInputMode,', 1)
          old_log = 'console.log(JSON.stringify({ ok: true, source_queue_items: queue.total_items, callable_migrations: sourceItems.length, tool_count: sourceToolKeys.length, contract_count: contracts.length,'
          new_log = 'console.log(JSON.stringify({ ok: true, source_queue_items: sourceQueueItemCount, source_input_mode: sourceInputMode, callable_migrations: sourceItems.length, tool_count: sourceToolKeys.length, contract_count: contracts.length,'
          if old_log not in source:
            raise SystemExit('surface_idempotency_log_block_missing')
          source = source.replace(old_log, new_log, 1)
          path.write_text(source, encoding='utf-8')
          PY
          node --check http-generic-api/scripts/surface-callability-closure/generate_closure_contracts.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Regenerate twice and validate current-main Surface evidence
        working-directory: http-generic-api
        shell: bash
        run: |
          set -o pipefail
          {
            npm run frontend:dispatch:generate
            node scripts/surface-callability-closure/generate_closure_contracts.mjs
            node scripts/surface-contract-discovery.mjs --write
            node scripts/surface-callability-closure/generate_closure_contracts.mjs
            node scripts/surface-contract-discovery.mjs --write
          } 2>&1 | tee -a ../surface-main-reconcile.log

      - name: Validate reconciled contracts
        working-directory: http-generic-api
        shell: bash
        run: |
          set -o pipefail
          {
            node --check routes/tenantLifecycleRoutes.js
            node --check routes/workspaceResourceRoutes.js
            node --check routes/tenantInfrastructureRoutes.js
            node --check routes/agentSurfaceRoutes.js
            node --check agentSurfaceRuntimeService.js
            node --check scripts/resource-api-callability-contracts.mjs
            node --check scripts/surface-contract-sql-registry-extractor.mjs
            node --check scripts/surface-callability-closure/generate_closure_contracts.mjs
            node test-surface-contract-sql-registry-extractor.mjs
            node test-resource-api-callability-effect-classes.mjs
            node test-resource-api-coverage.mjs
            node test-multi-surface-agent-runtime.mjs
            node test-tenant-database-query-readonly.mjs
            node test-tenant-ssh-cli-allowlisted-execute.mjs
            node test-surface-callability-full-closure.mjs
          } 2>&1 | tee -a ../surface-main-reconcile.log

      - name: Enforce stable queue zero and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const queue = JSON.parse(fs.readFileSync('docs/surface-contract-gap-queue.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('http-generic-api/resource-api-surface-callability.manifest.json', 'utf8'));
          if (queue.total_items !== 0 || (queue.top_items || []).length !== 0) {
            console.error(JSON.stringify(queue, null, 2));
            process.exit(1);
          }
          if (manifest.source_input_mode !== 'manifest' || manifest.source_queue_tool_keys.length !== 41 || manifest.contracts.length !== 34) {
            console.error(JSON.stringify({ source_input_mode: manifest.source_input_mode, tools: manifest.source_queue_tool_keys.length, contracts: manifest.contracts.length }, null, 2));
            process.exit(1);
          }
          NODE
          test -z "$(find http-generic-api/scripts/surface-callability-closure -maxdepth 1 -name 'patch_*.py' -print -quit)"
          test ! -e docs/.surface-coverage-diagnostic-trigger
          rm -f .github/workflows/surface-callability-main-reconcile-once.yml
          git diff --check
          git status --short | tee -a surface-main-reconcile.log

      - name: Commit reconciled product result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: reconcile idempotent Surface closure onto current main'
          git push origin HEAD:gpt/surface-callability-main-clean-20260803

      - name: Upload reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surface-callability-main-reconcile
          path: |
            surface-main-reconcile.log
            docs/surface-contract-gap-queue.json
            docs/surface-contract-discovery-status.json
            http-generic-api/resource-api-surface-callability.manifest.json
          if-no-files-found: warn
          retention-days: 14
