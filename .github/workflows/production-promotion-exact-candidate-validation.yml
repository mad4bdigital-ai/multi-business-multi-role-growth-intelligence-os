name: Exact Production Candidate Validation

on:
  pull_request:
    branches:
      - gpt/validate-production-base-r7-arm-83b7-20260804
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: exact-r7-arm-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  exact-r7-arm:
    name: Validate immutable R7 candidate on ARM
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'gpt/validate-production-candidate-r7-arm-')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      CANONICAL_PR: '5908'
      CANDIDATE_BRANCH: gpt/hostinger-production-runtime-readback-r7-20260804
      CANDIDATE_SHA: 83b7ae3d0c76e895acd2c5e1858443cf9aa0a91b
      MAIN_SHA: 58b98727e1ef254dd117a49619d4a9259fdaaf65
      EVIDENCE_DIR: ${{ runner.temp }}/exact-r7-arm
    steps:
      - name: Checkout exact canonical candidate
        uses: actions/checkout@v5
        with:
          ref: 83b7ae3d0c76e895acd2c5e1858443cf9aa0a91b
          fetch-depth: 0
          persist-credentials: false

      - name: Verify validation refs, canonical refs, and exact scope
        shell: bash
        env:
          VALIDATION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VALIDATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VALIDATION_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          VALIDATION_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -Eeuo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"

          git fetch --no-tags origin \
            "+refs/heads/${VALIDATION_HEAD_REF}:refs/remotes/origin/${VALIDATION_HEAD_REF}" \
            "+refs/heads/${VALIDATION_BASE_REF}:refs/remotes/origin/${VALIDATION_BASE_REF}" \
            "+refs/heads/${CANDIDATE_BRANCH}:refs/remotes/origin/${CANDIDATE_BRANCH}" \
            "+refs/heads/main:refs/remotes/origin/main"

          test "$(git rev-parse refs/remotes/origin/${VALIDATION_HEAD_REF})" = "${VALIDATION_HEAD_SHA}"
          test "$(git rev-parse refs/remotes/origin/${VALIDATION_BASE_REF})" = "${VALIDATION_BASE_SHA}"
          git diff --quiet "${VALIDATION_BASE_SHA}" "${VALIDATION_HEAD_SHA}"
          test "$(git rev-parse refs/remotes/origin/${CANDIDATE_BRANCH})" = "${CANDIDATE_SHA}"
          test "$(git rev-parse refs/remotes/origin/main)" = "${MAIN_SHA}"
          git merge-base --is-ancestor "${MAIN_SHA}" "${CANDIDATE_SHA}"

          git diff --name-only "${MAIN_SHA}" "${CANDIDATE_SHA}" | sort > "${EVIDENCE_DIR}/changed-files.txt"
          cat > "${EVIDENCE_DIR}/expected-files.txt" <<'EOF'
          .changes/e2e/hostinger-production-runtime-readback-r7.json
          .github/workflows/hostinger-production-runtime-readback-r7.yml
          http-generic-api/test-hostinger-production-runtime-readback-r7.mjs
          EOF
          diff -u "${EVIDENCE_DIR}/expected-files.txt" "${EVIDENCE_DIR}/changed-files.txt"
          git diff --check "${MAIN_SHA}" "${CANDIDATE_SHA}"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            http-generic-api/package-lock.json

      - name: Install API dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Validate workflow YAML and focused R7 contract
        working-directory: http-generic-api
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import YAML from 'yaml';
          const source = fs.readFileSync('../.github/workflows/hostinger-production-runtime-readback-r7.yml', 'utf8');
          const parsed = YAML.parse(source);
          if (parsed?.name !== 'Hostinger Production Runtime Readback R7') throw new Error('Unexpected workflow name');
          if (!parsed?.jobs?.readback) throw new Error('Missing readback job');
          console.log(JSON.stringify({ ok: true, workflow_yaml_valid: true, secrets_included: false }));
          NODE
          node --check test-hostinger-production-runtime-readback-r7.mjs
          node test-hostinger-production-runtime-readback-r7.mjs

      - name: Guard changed runtime hardcoding scope
        working-directory: http-generic-api
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s\n' \
            '.changes/e2e/hostinger-production-runtime-readback-r7.json' \
            '.github/workflows/hostinger-production-runtime-readback-r7.yml' \
            'http-generic-api/test-hostinger-production-runtime-readback-r7.mjs' \
            > "${RUNNER_TEMP}/r7-changed-files.txt"
          node scripts/context-kernel-hardcoding-scan.mjs --fail-on=runtime --changed-files-from="${RUNNER_TEMP}/r7-changed-files.txt"

      - name: Evaluate and execute exact E2E contract
        shell: bash
        run: |
          set -Eeuo pipefail
          node http-generic-api/scripts/e2e-phase-governance.mjs check \
            --base "${MAIN_SHA}" \
            --head "${CANDIDATE_SHA}" \
            --report-file "${EVIDENCE_DIR}/e2e-evaluation.json"
          node http-generic-api/scripts/e2e-phase-governance.mjs run \
            --base "${MAIN_SHA}" \
            --head "${CANDIDATE_SHA}" \
            --report-file "${EVIDENCE_DIR}/e2e-evaluation-run.json" \
            --execution-report-file "${EVIDENCE_DIR}/e2e-execution.json"

      - name: Run complete API Unit and Integration suite
        working-directory: http-generic-api
        env:
          EXPECTED_TEST_CANDIDATE_SHA: 83b7ae3d0c76e895acd2c5e1858443cf9aa0a91b
          TEST_SUITE_REPORT_DIR: ${{ runner.temp }}/test-suite-reports
        run: npm test

      - name: Run canonical architecture validation
        working-directory: http-generic-api
        run: npm run validate

      - name: Install root resolver dependencies
        run: npm ci

      - name: Run Execution Resolver gate
        run: |
          npm run typecheck
          npm test -- --runInBand
          test -f src/services/execution/dispatchPlanStep.ts
          test -f src/services/connectors/execution/resolveConnectorExecutor.ts
          test -f src/store/registries/connectorExecutorRegistry.ts

      - name: Re-read immutable candidate and publish summary
        if: always()
        shell: bash
        env:
          VALIDATION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VALIDATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VALIDATION_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          VALIDATION_BASE_REF: ${{ github.event.pull_request.base.ref }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          candidate_readback="$(git ls-remote origin refs/heads/${CANDIDATE_BRANCH} | awk '{print $1}')"
          main_readback="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          validation_head_readback="$(git ls-remote origin refs/heads/${VALIDATION_HEAD_REF} | awk '{print $1}')"
          validation_base_readback="$(git ls-remote origin refs/heads/${VALIDATION_BASE_REF} | awk '{print $1}')"
          jq -n \
            --arg status "${JOB_STATUS}" \
            --arg canonical_pr "${CANONICAL_PR}" \
            --arg candidate_sha "${CANDIDATE_SHA}" \
            --arg candidate_readback "${candidate_readback}" \
            --arg main_sha "${MAIN_SHA}" \
            --arg main_readback "${main_readback}" \
            --arg validation_head_sha "${VALIDATION_HEAD_SHA}" \
            --arg validation_head_readback "${validation_head_readback}" \
            --arg validation_base_sha "${VALIDATION_BASE_SHA}" \
            --arg validation_base_readback "${validation_base_readback}" \
            '{contract:"mad4b.exact-r7-arm-validation.v1",status:$status,canonical_pr:($canonical_pr|tonumber),candidate_sha:$candidate_sha,candidate_readback:$candidate_readback,main_sha:$main_sha,main_readback:$main_readback,validation_head_sha:$validation_head_sha,validation_head_readback:$validation_head_readback,validation_base_sha:$validation_base_sha,validation_base_readback:$validation_base_readback,candidate_immutable:($candidate_sha==$candidate_readback),main_immutable:($main_sha==$main_readback),validation_refs_immutable:($validation_head_sha==$validation_head_readback and $validation_base_sha==$validation_base_readback),candidate_content_mutation:false,main_mutation:false,production_mutation:false,provider_call:false,deployment:false,restart:false,credential_access:false,sql:false,migration_apply:false,database_mutation:false,force_push:false,external_send:false,secrets_included:false}' \
            > "${EVIDENCE_DIR}/summary.json"

      - name: Upload exact R7 ARM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-r7-arm-${{ github.run_id }}
          path: |
            ${{ env.EVIDENCE_DIR }}/*
            ${{ runner.temp }}/test-suite-reports/*.json
          if-no-files-found: error
          retention-days: 30
