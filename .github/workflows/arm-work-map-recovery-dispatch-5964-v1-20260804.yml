name: ARM Work Map Recovery Dispatch 5964 V1
run-name: ARM Work Map Recovery Dispatch · PR 5964

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/arm-work-map-recovery-dispatch-5964-v1-20260804.yml

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: arm-work-map-recovery-dispatch-5964-v1
  cancel-in-progress: false

jobs:
  dispatch:
    name: Verify and dispatch governed Work Map writer
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/arm-work-map-recovery-dispatch-5964-v1-20260804'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      VALIDATOR_PR: ${{ github.event.pull_request.number }}
      TARGET_PR: '5964'
      EXPECTED_MAIN_SHA: a61cd9e83070618001676bbc679bc937f0551875
      EXPECTED_TARGET_HEAD: 8ad016f584c622e72eeac9f53e3df961660ad011
      TARGET_BRANCH: gpt/ci-work-map-exact-verification-dispatch-atomic-a61cd9e8-20260804
      AUTHORIZATION_MARKER: '<!-- work-map-autofix:authorized -->'
      WORKFLOW_PATH: .github/workflows/arm-work-map-recovery-dispatch-5964-v1-20260804.yml

    steps:
      - name: Verify one-file dispatcher and exact target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mapfile -t validator_files < <(gh api --paginate "/repos/${REPOSITORY}/pulls/${VALIDATOR_PR}/files?per_page=100" --jq '.[].filename')
          test "${#validator_files[@]}" -eq 1
          test "${validator_files[0]}" = "${WORKFLOW_PATH}"

          main_sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "${main_sha}" = "${EXPECTED_MAIN_SHA}"

          pr_json="$(gh api "repos/${REPOSITORY}/pulls/${TARGET_PR}")"
          test "$(jq -r '.state' <<<"${pr_json}")" = 'open'
          test "$(jq -r '.draft' <<<"${pr_json}")" = 'true'
          test "$(jq -r '.base.ref' <<<"${pr_json}")" = 'main'
          test "$(jq -r '.base.sha' <<<"${pr_json}")" = "${EXPECTED_MAIN_SHA}"
          test "$(jq -r '.head.repo.full_name' <<<"${pr_json}")" = "${REPOSITORY}"
          test "$(jq -r '.head.ref' <<<"${pr_json}")" = "${TARGET_BRANCH}"
          test "$(jq -r '.head.sha' <<<"${pr_json}")" = "${EXPECTED_TARGET_HEAD}"
          grep -Fq "${AUTHORIZATION_MARKER}" <<<"$(jq -r '.body // ""' <<<"${pr_json}")"

          compare_json="$(gh api "repos/${REPOSITORY}/compare/${EXPECTED_MAIN_SHA}...${EXPECTED_TARGET_HEAD}")"
          test "$(jq -r '.ahead_by' <<<"${compare_json}")" = '1'
          test "$(jq -r '.behind_by' <<<"${compare_json}")" = '0'
          mapfile -t changed < <(jq -r '.files[].filename' <<<"${compare_json}" | sort)
          expected=(
            '.changes/e2e/work-map-post-write-exact-verification-dispatch.json'
            '.github/workflows/ci.yml'
            '.github/workflows/spec-kit-work-map-autofix.yml'
            '.github/workflows/spec-kit-work-map-integration.yml'
            'http-generic-api/test-work-map-post-write-exact-verification-dispatch.mjs'
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do test "${changed[$index]}" = "${expected[$index]}"; done

          test "$(gh api "repos/${REPOSITORY}/contents/.changes/e2e/work-map-post-write-exact-verification-dispatch.json?ref=${EXPECTED_TARGET_HEAD}" --jq '.sha')" = '517a0b4ec5df195330eb0b044ac0a36a28bf03b9'
          test "$(gh api "repos/${REPOSITORY}/contents/.github/workflows/ci.yml?ref=${EXPECTED_TARGET_HEAD}" --jq '.sha')" = 'a09247d50e52fe00e94b54d1a98abe822e9346e5'
          test "$(gh api "repos/${REPOSITORY}/contents/.github/workflows/spec-kit-work-map-autofix.yml?ref=${EXPECTED_TARGET_HEAD}" --jq '.sha')" = '663b64ee84221ad27e2702ec90c826b5dbaa1c3c'
          test "$(gh api "repos/${REPOSITORY}/contents/.github/workflows/spec-kit-work-map-integration.yml?ref=${EXPECTED_TARGET_HEAD}" --jq '.sha')" = 'ff41bb0c48df07d40baea2de91ec1303859c46b4'
          test "$(gh api "repos/${REPOSITORY}/contents/http-generic-api/test-work-map-post-write-exact-verification-dispatch.mjs?ref=${EXPECTED_TARGET_HEAD}" --jq '.sha')" = 'd5cad261ed259dc527403eca39b2d01de6fd4f55'

      - name: Consume one-time authorization marker
        id: authorization
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          tmp="${RUNNER_TEMP}/target-pr.json"
          payload="${RUNNER_TEMP}/target-pr-payload.json"
          gh api "repos/${REPOSITORY}/pulls/${TARGET_PR}" > "${tmp}"
          node - "${tmp}" "${payload}" "${AUTHORIZATION_MARKER}" <<'NODE'
          const fs = require('node:fs');
          const [prFile, payloadFile, marker] = process.argv.slice(2);
          const pr = JSON.parse(fs.readFileSync(prFile, 'utf8'));
          const body = String(pr.body || '');
          if (!body.includes(marker)) process.exit(1);
          const nextBody = body.replace(marker, '').replace(/\n{3,}/g, '\n\n').trimEnd();
          fs.writeFileSync(payloadFile, JSON.stringify({ body: nextBody }));
          NODE
          gh api --method PATCH "repos/${REPOSITORY}/pulls/${TARGET_PR}" --input "${payload}" >/dev/null
          if gh api "repos/${REPOSITORY}/pulls/${TARGET_PR}" --jq '.body // ""' | grep -Fq "${AUTHORIZATION_MARKER}"; then exit 1; fi
          echo 'consumed=true' >> "$GITHUB_OUTPUT"

      - name: Dispatch exact-head governed Work Map writer
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          started="$(date -u -d '5 seconds ago' +'%Y-%m-%dT%H:%M:%SZ')"
          jq -cn --arg ref main --arg branch "${TARGET_BRANCH}" --arg expected_head_sha "${EXPECTED_TARGET_HEAD}" \
            '{ref:$ref,inputs:{branch:$branch,expected_head_sha:$expected_head_sha}}' \
            | gh api --method POST "/repos/${REPOSITORY}/actions/workflows/spec-kit-work-map-autofix.yml/dispatches" --input -
          run_id=''
          for _ in $(seq 1 30); do
            run_id="$(gh api "/repos/${REPOSITORY}/actions/workflows/spec-kit-work-map-autofix.yml/runs?event=workflow_dispatch&per_page=30" --jq "[.workflow_runs[] | select(.created_at >= \"${started}\" and .head_branch == \"main\")] | sort_by(.created_at) | last | .id // empty")"
            [[ -n "${run_id}" ]] && break
            sleep 2
          done
          [[ "${run_id}" =~ ^[1-9][0-9]*$ ]]
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"

      - name: Publish immutable dispatch evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DELEGATED_RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          AUTHORIZATION_CONSUMED: ${{ steps.authorization.outputs.consumed }}
        run: |
          set -Eeuo pipefail
          outcome=passed
          [[ "${{ job.status }}" == 'success' ]] || outcome=blocked
          body="WORK_MAP_AUTOFIX_ARM_RECOVERY outcome=${outcome} expected_main_sha=${EXPECTED_MAIN_SHA} expected_head_sha=${EXPECTED_TARGET_HEAD} target_branch=${TARGET_BRANCH} authorization_consumed=${AUTHORIZATION_CONSUMED:-false} delegated_run_id=${DELEGATED_RUN_ID:-none} direct_repository_mutation=false protected_branch_mutation=false force_push=false secrets_included=false"
          gh api --method POST "repos/${REPOSITORY}/issues/${TARGET_PR}/comments" -f body="${body}" >/dev/null
          gh api --method POST "repos/${REPOSITORY}/issues/${VALIDATOR_PR}/comments" -f body="${body}" >/dev/null
