name: Governed Production Promotion Dispatch Bridge
run-name: Governed Production Promotion Dispatch · ${{ github.event.issue.number || inputs.request_pr || github.run_id }}

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      request_pr:
        description: Open same-repository Production synchronization request PR
        required: true
        type: string
      expected_request_head_sha:
        description: Exact current tree-identical request PR head SHA
        required: true
        type: string
      review_mode:
        description: Review mode for read-only promotion gates
        required: true
        default: ai_policy
        type: choice
        options: [human, ai_policy]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: governed-production-promotion-dispatch-${{ github.event.issue.number || inputs.request_pr || github.run_id }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event_name == 'issue_comment' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      REQUEST_PR: ${{ github.event_name == 'workflow_dispatch' && inputs.request_pr || github.event.issue.number }}
      MANUAL_EXPECTED_REQUEST_HEAD_SHA: ${{ inputs.expected_request_head_sha || '' }}
      REVIEW_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.review_mode || 'ai_policy' }}
      COMMENT_BODY: ${{ github.event.comment.body || '' }}
      AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association || '' }}
      HAS_PULL_REQUEST: ${{ github.event.issue.pull_request != null }}
      REPORT_DIR: /tmp/governed-production-promotion-dispatch
    steps:
      - name: Checkout exact trusted main workflow source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact governed promotion request
        id: request
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "${REPORT_DIR}"
          mkdir -p "${REPORT_DIR}"
          [[ "${REQUEST_PR}" =~ ^[1-9][0-9]*$ ]]
          case "${REVIEW_MODE}" in human|ai_policy) ;; *) echo "::error::invalid review mode"; exit 1 ;; esac

          outcome="eligible"
          reason=""
          if [[ "${GITHUB_EVENT_NAME}" == "issue_comment" ]]; then
            if [[ "${HAS_PULL_REQUEST}" != "true" ]]; then
              outcome="skipped"; reason="comment_is_not_on_pull_request"
            elif [[ "${COMMENT_BODY}" != "DISPATCH_GOVERNED_PRODUCTION_PROMOTION" ]]; then
              outcome="skipped"; reason="promotion_dispatch_token_absent"
            else
              case "${AUTHOR_ASSOCIATION}" in
                OWNER|MEMBER|COLLABORATOR) ;;
                *) outcome="blocked"; reason="untrusted_comment_author" ;;
              esac
            fi
          elif [[ ! "${MANUAL_EXPECTED_REQUEST_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            outcome="blocked"; reason="invalid_manual_expected_request_head_sha"
          fi

          request_head_sha=""
          request_head_branch=""
          main_sha=""
          production_sha=""
          if [[ "${outcome}" == "eligible" ]]; then
            pr="$(gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "repos/${REPOSITORY}/pulls/${REQUEST_PR}")"
            title="$(jq -r '.title' <<<"${pr}")"
            state="$(jq -r '.state' <<<"${pr}")"
            draft="$(jq -r '.draft' <<<"${pr}")"
            base_ref="$(jq -r '.base.ref' <<<"${pr}")"
            head_repository="$(jq -r '.head.repo.full_name // ""' <<<"${pr}")"
            request_head_branch="$(jq -r '.head.ref' <<<"${pr}")"
            request_head_sha="$(jq -r '.head.sha' <<<"${pr}")"
            main_sha="$(gh api "/repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
            production_sha="$(gh api "/repos/${REPOSITORY}/git/ref/heads/Production" --jq '.object.sha')"

            if [[ "${title}" != "ops: request governed Production synchronization" ]]; then
              outcome="blocked"; reason="unexpected_request_title"
            elif [[ "${state}" != "open" || "${draft}" == "true" ]]; then
              outcome="blocked"; reason="request_pr_not_ready"
            elif [[ "${base_ref}" != "main" ]]; then
              outcome="blocked"; reason="unexpected_base_branch"
            elif [[ "${head_repository}" != "${REPOSITORY}" ]]; then
              outcome="blocked"; reason="cross_repository_request_forbidden"
            elif [[ ! "${request_head_branch}" =~ ^(gpt|cert|fix|feat|chore|docs|release)/[A-Za-z0-9._/-]+$ ]]; then
              outcome="blocked"; reason="invalid_governed_request_branch"
            elif [[ "${request_head_branch}" == "main" || "${request_head_branch}" == "Production" ]]; then
              outcome="blocked"; reason="protected_request_branch_forbidden"
            elif [[ ! "${request_head_sha}" =~ ^[0-9a-f]{40}$ || ! "${main_sha}" =~ ^[0-9a-f]{40}$ || ! "${production_sha}" =~ ^[0-9a-f]{40}$ ]]; then
              outcome="blocked"; reason="invalid_exact_ref_identity"
            elif [[ "${GITHUB_SHA}" != "${main_sha}" ]]; then
              outcome="blocked"; reason="main_moved_before_bridge_execution"
            elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${request_head_sha}" != "${MANUAL_EXPECTED_REQUEST_HEAD_SHA}" ]]; then
              outcome="blocked"; reason="request_head_mismatch"
            fi
          fi

          if [[ "${outcome}" == "eligible" ]]; then
            git fetch --no-tags origin \
              "+refs/heads/${request_head_branch}:refs/remotes/origin/${request_head_branch}" \
              '+refs/heads/Production:refs/remotes/origin/Production'
            request_readback="$(git rev-parse "refs/remotes/origin/${request_head_branch}")"
            production_readback="$(git rev-parse refs/remotes/origin/Production)"
            if [[ "${request_readback}" != "${request_head_sha}" ]]; then
              outcome="blocked"; reason="request_branch_moved_after_api_readback"
            elif [[ "${production_readback}" != "${production_sha}" ]]; then
              outcome="blocked"; reason="production_moved_after_api_readback"
            elif ! git merge-base --is-ancestor "${main_sha}" "${request_head_sha}"; then
              outcome="blocked"; reason="request_head_does_not_descend_from_current_main"
            elif ! git diff --quiet "${main_sha}" "${request_head_sha}"; then
              outcome="blocked"; reason="request_head_tree_differs_from_current_main"
            elif ! git merge-base --is-ancestor "${production_sha}" "${main_sha}"; then
              outcome="blocked"; reason="production_not_contained_by_current_main"
            fi
          fi

          jq -n \
            --arg contract "mad4b.governed-production-promotion-dispatch.v1" \
            --arg outcome "${outcome}" \
            --arg reason "${reason}" \
            --arg request_head_branch "${request_head_branch}" \
            --arg request_head_sha "${request_head_sha}" \
            --arg main_sha "${main_sha}" \
            --arg production_sha "${production_sha}" \
            --arg review_mode "${REVIEW_MODE}" \
            --argjson request_pr "${REQUEST_PR}" \
            '{contract:$contract,outcome:$outcome,reason:(if ($reason|length)>0 then $reason else null end),request_pr:$request_pr,request_head_branch:(if ($request_head_branch|length)>0 then $request_head_branch else null end),request_head_sha:(if ($request_head_sha|length)>0 then $request_head_sha else null end),main_sha:(if ($main_sha|length)>0 then $main_sha else null end),production_sha:(if ($production_sha|length)>0 then $production_sha else null end),review_mode:$review_mode,dispatch_requested:false,launcher_run_id:null,evidence_comment_written:false,production_merge:false,deployment:false,migration_apply:false,grant_apply:false,provider_mutation:false,credential_payload_read:false,secrets_included:false}' \
            > "${REPORT_DIR}/decision.json"

          if [[ "${outcome}" == "eligible" ]]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            echo "request_head_sha=${request_head_sha}" >> "$GITHUB_OUTPUT"
            echo "main_sha=${main_sha}" >> "$GITHUB_OUTPUT"
            echo "production_sha=${production_sha}" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Suppress duplicate or dispatch full promotion launcher
        if: steps.request.outputs.eligible == 'true'
        shell: bash
        env:
          REQUEST_HEAD_SHA: ${{ steps.request.outputs.request_head_sha }}
          MAIN_SHA: ${{ steps.request.outputs.main_sha }}
          PRODUCTION_SHA: ${{ steps.request.outputs.production_sha }}
        run: |
          set -Eeuo pipefail
          current_main_sha="$(gh api "/repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          current_production_sha="$(gh api "/repos/${REPOSITORY}/git/ref/heads/Production" --jq '.object.sha')"
          current_request_head="$(gh api "/repos/${REPOSITORY}/pulls/${REQUEST_PR}" --jq '.head.sha')"
          [[ "${current_main_sha}" == "${MAIN_SHA}" ]] || { echo "::error::main moved before launcher dispatch"; exit 1; }
          [[ "${current_production_sha}" == "${PRODUCTION_SHA}" ]] || { echo "::error::Production moved before launcher dispatch"; exit 1; }
          [[ "${current_request_head}" == "${REQUEST_HEAD_SHA}" ]] || { echo "::error::request head moved before launcher dispatch"; exit 1; }

          existing_body="$(gh api "/repos/${REPOSITORY}/issues/${REQUEST_PR}/comments?per_page=100" \
            --jq "[.[] | select(.body | startswith(\"GOVERNED_PRODUCTION_PROMOTION_LAUNCH \") and contains(\"main_sha=${MAIN_SHA}\") and contains(\"production_sha=${PRODUCTION_SHA}\"))] | last.body // empty")"
          if [[ -n "${existing_body}" ]]; then
            existing_run_id="$(sed -n 's/.*launcher_run_id=\([0-9][0-9]*\).*/\1/p' <<<"${existing_body}")"
            if [[ -n "${existing_run_id}" ]]; then
              run_json="$(gh run view "${existing_run_id}" --repo "${REPOSITORY}" --json status,conclusion 2>/dev/null || true)"
              if [[ -n "${run_json}" ]]; then
                run_status="$(jq -r '.status // ""' <<<"${run_json}")"
                run_conclusion="$(jq -r '.conclusion // ""' <<<"${run_json}")"
                if [[ "${run_status}" != "completed" || "${run_conclusion}" == "success" ]]; then
                  jq '.outcome="duplicate_suppressed" | .reason="matching_launcher_run_already_active_or_successful"' "${REPORT_DIR}/decision.json" > "${REPORT_DIR}/decision.tmp"
                  mv "${REPORT_DIR}/decision.tmp" "${REPORT_DIR}/decision.json"
                  exit 0
                fi
              fi
            fi
          fi

          release_namespace="release"
          validation_namespace="gpt"
          validation_role="validate"
          promotion_scope="production"
          candidate_role="candidate"
          release_branch_prefix="${release_namespace}/${promotion_scope}-${candidate_role}"
          validation_branch_prefix="${validation_namespace}/${validation_role}-${promotion_scope}-${candidate_role}"
          validation_base_branch_prefix="${validation_namespace}/${validation_role}-${promotion_scope}-base"

          before_run_id="$(gh api "/repos/${REPOSITORY}/actions/workflows/governed-production-promotion-request-launcher.yml/runs?event=workflow_dispatch&branch=main&per_page=20" --jq '[.workflow_runs[].id] | max // 0')"
          gh workflow run governed-production-promotion-request-launcher.yml \
            --repo "${REPOSITORY}" \
            --ref main \
            --field request_pr="${REQUEST_PR}" \
            --field expected_head_sha="${MAIN_SHA}" \
            --field expected_request_head_sha="${REQUEST_HEAD_SHA}" \
            --field release_branch_prefix="${release_branch_prefix}" \
            --field validation_branch_prefix="${validation_branch_prefix}" \
            --field validation_base_branch_prefix="${validation_base_branch_prefix}" \
            --field review_mode="${REVIEW_MODE}" \
            --field confirmation="AUTHORIZE_GOVERNED_PRODUCTION_PROMOTION_REQUEST"

          launcher_run_id=""
          for _ in $(seq 1 60); do
            launcher_run_id="$(gh api "/repos/${REPOSITORY}/actions/workflows/governed-production-promotion-request-launcher.yml/runs?event=workflow_dispatch&branch=main&per_page=20" \
              --jq ".workflow_runs | map(select(.id > ${before_run_id} and .head_sha == \"${MAIN_SHA}\")) | sort_by(.id) | .[0].id // empty")"
            [[ -n "${launcher_run_id}" ]] && break
            sleep 5
          done
          [[ -n "${launcher_run_id}" ]]

          jq --argjson launcher_run_id "${launcher_run_id}" \
            '.outcome="dispatched" | .dispatch_requested=true | .launcher_run_id=$launcher_run_id' \
            "${REPORT_DIR}/decision.json" > "${REPORT_DIR}/decision.tmp"
          mv "${REPORT_DIR}/decision.tmp" "${REPORT_DIR}/decision.json"

          body="GOVERNED_PRODUCTION_PROMOTION_LAUNCH request_pr=${REQUEST_PR} launcher_run_id=${launcher_run_id} main_sha=${MAIN_SHA} production_sha=${PRODUCTION_SHA} review_mode=${REVIEW_MODE} production_merge=false deployment=false migration_apply=false grant_apply=false provider_mutation=false credential_payload_read=false"
          if gh api --method POST "/repos/${REPOSITORY}/issues/${REQUEST_PR}/comments" -f body="${body}" >/dev/null 2>&1; then
            jq '.evidence_comment_written=true' "${REPORT_DIR}/decision.json" > "${REPORT_DIR}/decision.tmp"
            mv "${REPORT_DIR}/decision.tmp" "${REPORT_DIR}/decision.json"
          else
            echo "::warning::launcher was dispatched successfully but optional PR receipt comment could not be written"
            jq '.reason="optional_receipt_comment_transport_failed"' "${REPORT_DIR}/decision.json" > "${REPORT_DIR}/decision.tmp"
            mv "${REPORT_DIR}/decision.tmp" "${REPORT_DIR}/decision.json"
          fi

      - name: Upload canonical promotion dispatch decision
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: governed-production-promotion-dispatch-${{ github.run_id }}
          path: ${{ env.REPORT_DIR }}/decision.json
          if-no-files-found: error
          retention-days: 30


  release-cut-reconciliation:
    name: Create exact release-cut reconciliation PR
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request != null && github.event.comment.body == 'AUTHORIZE_GOVERNED_PRODUCTION_RELEASE_CUT_RECONCILIATION'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      issues: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      REQUEST_PR: ${{ github.event.issue.number }}
      COMMENT_BODY: ${{ github.event.comment.body || '' }}
      AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association || '' }}
      REPORT_DIR: /tmp/governed-production-release-cut-reconciliation
    steps:
      - name: Checkout trusted main workflow source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build exact two-parent reconciliation branch and PR
        id: reconcile
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$REPORT_DIR"
          mkdir -p "$REPORT_DIR"
          reject() { echo "::error::$1"; exit 1; }
          [[ "$COMMENT_BODY" == "AUTHORIZE_GOVERNED_PRODUCTION_RELEASE_CUT_RECONCILIATION" ]] || reject "typed reconciliation authorization mismatch"
          case "$AUTHOR_ASSOCIATION" in OWNER|MEMBER|COLLABORATOR) ;; *) reject "reconciliation authorization must come from trusted repository association" ;; esac
          [[ "$REQUEST_PR" =~ ^[1-9][0-9]*$ ]] || reject "request PR number invalid"
          [[ "$GITHUB_REF_NAME" == "main" ]] || reject "reconciliation writer must run from main"

          pr="$(gh api "/repos/${REPOSITORY}/pulls/${REQUEST_PR}")"
          title="$(jq -r '.title' <<<"$pr")"
          state="$(jq -r '.state' <<<"$pr")"
          draft="$(jq -r '.draft' <<<"$pr")"
          base_ref="$(jq -r '.base.ref' <<<"$pr")"
          head_repository="$(jq -r '.head.repo.full_name // ""' <<<"$pr")"
          request_branch="$(jq -r '.head.ref' <<<"$pr")"
          request_head_sha="$(jq -r '.head.sha' <<<"$pr")"
          [[ "$title" == "ops: request governed Production synchronization" ]] || reject "reconciliation must be initiated from the governed request PR"
          [[ "$state" == open && "$draft" != true ]] || reject "governed request PR must be open and non-draft"
          [[ "$base_ref" == main && "$head_repository" == "$REPOSITORY" ]] || reject "request PR must be same-repository and target main"
          [[ "$request_branch" =~ ^(gpt|cert|fix|feat|chore|docs|release)/[A-Za-z0-9._/-]+$ ]] || reject "request branch is not governed"
          [[ "$request_head_sha" =~ ^[0-9a-f]{40}$ ]] || reject "request head is not exact"

          git fetch --prune --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/Production:refs/remotes/origin/Production'
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          production_sha="$(git rev-parse refs/remotes/origin/Production)"
          git fetch --no-tags origin "+refs/heads/${request_branch}:refs/remotes/origin/${request_branch}"
          request_readback="$(git rev-parse "refs/remotes/origin/${request_branch}")"
          [[ "$request_readback" == "$request_head_sha" ]] || reject "request branch moved during reconciliation preflight"
          [[ "$GITHUB_SHA" == "$main_sha" ]] || reject "main moved before reconciliation writer"
          git merge-base --is-ancestor "$main_sha" "$request_head_sha" || reject "request does not descend from current main"
          git diff --quiet "$main_sha" "$request_head_sha" || reject "request tree differs from current main"
          git cat-file -e "${main_sha}^{commit}"
          git cat-file -e "${production_sha}^{commit}"

          reconciliation_branch="release/production-reconciliation/${main_sha:0:12}-${production_sha:0:12}"
          existing_sha="$(git ls-remote --heads origin "refs/heads/$reconciliation_branch" | awk '{print $1}')"
          if [[ -n "$existing_sha" ]]; then
            parents=( $(git show -s --format=%P "$existing_sha" 2>/dev/null || true) )
            [[ "${#parents[@]}" == 2 && "${parents[0]}" == "$main_sha" && "${parents[1]}" == "$production_sha" ]] || reject "existing reconciliation branch is not exact reusable topology"
            reconciliation_sha="$existing_sha"
          else
            reconciliation_sha="$({
              printf '%s\n\n%s\n%s\n%s\n' \
                'release: reconcile Production ancestry into main' \
                "main_parent=$main_sha" \
                "production_parent=$production_sha" \
                'tree_policy=exact_main_tree';
            } | GIT_AUTHOR_NAME='mad4b-release-bot' \
              GIT_AUTHOR_EMAIL='mad4b-release-bot@users.noreply.github.com' \
              GIT_AUTHOR_DATE="$(git show -s --format=%cI "$main_sha")" \
              GIT_COMMITTER_NAME='mad4b-release-bot' \
              GIT_COMMITTER_EMAIL='mad4b-release-bot@users.noreply.github.com' \
              GIT_COMMITTER_DATE="$(git show -s --format=%cI "$main_sha")" \
              git commit-tree "$(git rev-parse "${main_sha}^{tree}")" -p "$main_sha" -p "$production_sha")"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
            git push origin "$reconciliation_sha:refs/heads/$reconciliation_branch"
          fi

          branch_readback="$(git ls-remote --heads origin "refs/heads/$reconciliation_branch" | awk '{print $1}')"
          [[ "$branch_readback" == "$reconciliation_sha" ]] || reject "reconciliation branch CAS readback mismatch"
          parents=( $(git show -s --format=%P "$reconciliation_sha") )
          [[ "${#parents[@]}" == 2 && "${parents[0]}" == "$main_sha" && "${parents[1]}" == "$production_sha" ]] || reject "reconciliation parents changed"
          [[ "$(git rev-parse "${reconciliation_sha}^{tree}")" == "$(git rev-parse "${main_sha}^{tree}")" ]] || reject "reconciliation tree changed"
          main_readback="$(gh api "/repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          production_readback="$(gh api "/repos/${REPOSITORY}/git/ref/heads/Production" --jq '.object.sha')"
          [[ "$main_readback" == "$main_sha" && "$production_readback" == "$production_sha" ]] || reject "protected refs moved before PR creation"

          body="$RUNNER_TEMP/reconciliation-pr.md"
          cat > "$body" <<EOF
          ## Governed Production release-cut reconciliation

          - release_cut_reconciliation: true
          - main_parent: $main_sha
          - production_parent: $production_sha
          - reconciliation_head: $reconciliation_sha
          - tree_policy: exact_main_tree
          - merge_method_required: merge_commit_only
          - main_merge_authorization_required: true
          - production_promotion_authorization_required: true
          - production_merge: false
          - deployment_executed: false
          - migration_executed: false
          - provider_mutation: false
          - credential_payload_read: false
          - secrets_included: false

          This PR contains one exact two-parent commit: current main first, pinned Production second, with a tree byte-identical to main. It must be merged using a merge commit, never squash or rebase. This PR does not deploy, migrate, grant, mutate a provider, or authorize Production promotion.
          EOF
          existing_pr="$(gh pr list --repo "$REPOSITORY" --state open --head "$reconciliation_branch" --base main --limit 1 --json number --jq '.[0].number // empty')"
          if [[ -n "$existing_pr" ]]; then
            gh pr edit "$existing_pr" --repo "$REPOSITORY" --title "release: reconcile Production ancestry into main" --body-file "$body"
            pr_number="$existing_pr"
          else
            pr_url="$(gh pr create --repo "$REPOSITORY" --head "$reconciliation_branch" --base main --title "release: reconcile Production ancestry into main" --body-file "$body")"
            pr_number="$(sed -n 's#.*/pull/\([0-9][0-9]*\).*#\1#p' <<<"$pr_url" | tail -n1)"
          fi
          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]] || reject "reconciliation PR number unresolved"
          jq -n \
            --arg reconciliation_sha "$reconciliation_sha" \
            --arg main_sha "$main_sha" \
            --arg production_sha "$production_sha" \
            --arg branch "$reconciliation_branch" \
            --argjson reconciliation_pr "$pr_number" \
            '{schema_version:"governed_production_release_cut_reconciliation.v1",ok:true,reconciliation_sha:$reconciliation_sha,main_sha:$main_sha,production_sha:$production_sha,branch:$branch,reconciliation_pr:$reconciliation_pr,first_parent_is_main:true,second_parent_is_production:true,tree_matches_main:true,merge_method_required:"merge_commit_only",merge_executed:false,production_merge:false,deployment_executed:false,migration_executed:false,provider_mutation:false,credential_payload_read:false,secrets_included:false}' > "$REPORT_DIR/reconciliation-report.json"
          echo "reconciliation_pr=$pr_number" >> "$GITHUB_OUTPUT"
          echo "reconciliation_sha=$reconciliation_sha" >> "$GITHUB_OUTPUT"

      - name: Upload reconciliation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-release-cut-reconciliation-${{ github.run_id }}
          path: ${{ env.REPORT_DIR }}/reconciliation-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish reconciliation summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Governed Production release-cut reconciliation
          - reconciliation: \\`${{ steps.reconcile.outputs.reconciliation_sha }}\\`
          - PR: \\`${{ steps.reconcile.outputs.reconciliation_pr }}\\`
          - merge method: \\`merge_commit_only\\`
          - Production mutation: \\`false\\`
          EOF
