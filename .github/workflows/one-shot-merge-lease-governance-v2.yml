name: One-shot Semantic Lease Governance Merge V2

on:
  push:
    branches:
      - gpt/reconciliation-lease-control-surface-v2-20260730

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout governed branch
        uses: actions/checkout@v5
        with:
          ref: gpt/reconciliation-lease-control-surface-v2-20260730
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Merge Lease governance semantically
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(source, needle, replacement, label) {
            const first = source.indexOf(needle);
            if (first < 0) throw new Error(`missing anchor: ${label}`);
            if (source.indexOf(needle, first + needle.length) >= 0) throw new Error(`non-unique anchor: ${label}`);
            return source.slice(0, first) + replacement + source.slice(first + needle.length);
          }

          const registryPath = 'http-generic-api/frontend-operation-governance-tests.json';
          const registry = JSON.parse(fs.readFileSync(registryPath, 'utf8'));
          const leaseEntry = {
            file: 'test-repository-reconciliation-lease-control.mjs',
            evidence_scope: 'repository-reconciliation-lease-control',
          };
          const existingLeaseEntries = registry.tests.filter((entry) => entry.file === leaseEntry.file);
          if (existingLeaseEntries.length > 1) throw new Error('duplicate lease registry entries');
          if (existingLeaseEntries.length === 0) registry.tests.push(leaseEntry);
          fs.writeFileSync(registryPath, `${JSON.stringify(registry, null, 2)}\n`, 'utf8');

          const generatorPath = 'http-generic-api/scripts/frontend-operation-governance-generator.mjs';
          let generator = fs.readFileSync(generatorPath, 'utf8');
          if (!generator.includes('const LEASE_ROUTE_FILE =')) {
            generator = replaceOnce(
              generator,
              'const BOOTSTRAP_TEST_FILE = "test-tenant-connect-bootstrap-transaction.mjs";\n',
              [
                'const BOOTSTRAP_TEST_FILE = "test-tenant-connect-bootstrap-transaction.mjs";',
                'const LEASE_ROUTE_FILE = "routes/repositoryAutomationRoutes.js";',
                'const LEASE_CONTROL_FILE = "repositoryReconciliationLeaseControl.js";',
                'const LEASE_SERVICE_FILE = "repositoryOperationLeaseService.js";',
                'const LEASE_TEST_FILE = "test-repository-reconciliation-lease-control.mjs";',
                '',
              ].join('\n'),
              'lease constants'
            );
          }

          const leaseEvaluator = [
            'function evaluateLeaseRecipe(context) {',
            '  const recipe = {',
            '    recipe_id: "repository-reconciliation-lease-control-v1",',
            '    rule_id: "generated-repository-reconciliation-lease-control-governance",',
            '    operation: "POST /admin/repository-automation/reconciliation-lease",',
            '    source_file: LEASE_ROUTE_FILE,',
            '    owner: "repository-automation",',
            '    rationale: "Acquires, renews, or releases one repository reconciliation lease only after Admin authentication, exact resource and fingerprint capability-envelope binding, apply authorization, and typed confirmation; each durable mutation is verified inside the same SQL transaction before commit and rolls back on mutation or readback failure.",',
            '    preflight_mode: "capability_envelope_resource_and_fingerprint_binding",',
            '    approval_mode: "runtime_authorization_and_typed_confirmation",',
            '    parameter_bindings: {',
            '      action: "request.body.action",',
            '      capability_envelope_id: "request.body.capability_envelope_id",',
            '      repository_owner: "request.body.owner|request.body.repository_owner",',
            '      repository_name: "request.body.repo|request.body.repository_name",',
            '      branch_name: "request.body.branch|request.body.branch_name",',
            '      expected_base_sha: "request.body.expected_base_sha",',
            '      expected_branch_sha: "request.body.expected_branch_sha",',
            '      lease_id: "response.lease.lease_id",',
            '      resource_fingerprint: "response.lease.resource_fingerprint",',
            '    },',
            '  };',
            '  const route = context.leaseRoutes.get(recipe.operation);',
            '  const controlSource = context.sourceByFile.get(LEASE_CONTROL_FILE);',
            '  const runBlock = extractFunctionBlock(controlSource, "runRepositoryReconciliationLeaseControl");',
            '  const envelopeBlock = extractFunctionBlock(controlSource, "requireCapabilityEnvelope");',
            '  const leaseSource = context.sourceByFile.get(LEASE_SERVICE_FILE);',
            '  const acquireBlock = extractFunctionBlock(leaseSource, "acquireRepositoryOperationLease");',
            '  const renewBlock = extractFunctionBlock(leaseSource, "renewRepositoryOperationLease");',
            '  const releaseBlock = extractFunctionBlock(leaseSource, "releaseRepositoryOperationLease");',
            '  const claimedTests = context.testEvidence.byOperation.get(recipe.operation) || [];',
            '  const transactionalBlocks = [acquireBlock, renewBlock, releaseBlock];',
            '  const gates = [',
            '    evidenceGate("route_present", route, LEASE_ROUTE_FILE),',
            '    evidenceGate("admin_guard", route?.route_guards?.includes("requireAdminPrincipal") && route?.route_guards?.includes("requireBackendApiKey"), "requireAdminPrincipal/requireBackendApiKey"),',
            '    evidenceGate("route_service_binding", route?.declaration?.includes("runRepositoryReconciliationLeaseControl"), "runRepositoryReconciliationLeaseControl"),',
            '    evidenceGate("control_function_present", runBlock, "runRepositoryReconciliationLeaseControl"),',
            '    evidenceGate("defense_in_depth_admin_check", runBlock.includes("assertAdminCaller"), "assertAdminCaller"),',
            '    evidenceGate("typed_confirmation", runBlock.includes("assertTypedConfirmation"), "assertTypedConfirmation"),',
            '    evidenceGate("force_bypass_rejected", controlSource.includes("assertNoForceFlags") && controlSource.includes("repository_reconciliation_lease_control_force_forbidden"), "assertNoForceFlags/force_forbidden"),',
            '    evidenceGate("capability_envelope_exact_binding", envelopeBlock.includes("resolveCapabilityExecutionEnvelope") && envelopeBlock.includes("expectedResourceUri") && envelopeBlock.includes("expectedBindingSha256"), "expectedResourceUri/expectedBindingSha256"),',
            '    evidenceGate("capability_envelope_apply_authorization", envelopeBlock.includes("resolved.apply_allowed !== true"), "apply_allowed"),',
            '    evidenceGate("lease_specific_intent", envelopeBlock.includes("repository_reconciliation_lease_control") && !envelopeBlock.includes(\'"repo_mutation"\'), "lease-specific intent/no generic repo_mutation"),',
            '    evidenceGate("envelope_reference_before_service_dispatch", ordered(envelopeBlock, "markCapabilityEnvelopeReferenced", "return resolved") && ordered(runBlock, "await requireCapabilityEnvelope", "await leaseDependencies"), "envelope reference before lease service dispatch"),',
            '    evidenceGate("all_actions_dispatched", runBlock.includes("acquireRepositoryOperationLease") && runBlock.includes("renewRepositoryOperationLease") && runBlock.includes("releaseRepositoryOperationLease"), "acquire/renew/release dispatch"),',
            '    evidenceGate("transaction_scope_all_actions", transactionalBlocks.every((block) => block.includes("getConnection") && block.includes("beginTransaction") && block.includes("connection.commit")), "getConnection/beginTransaction/commit"),',
            '    evidenceGate("transaction_rollback_all_actions", transactionalBlocks.every((block) => block.includes("connection.rollback") && block.includes("connection.release")), "rollback/release"),',
            '    evidenceGate("acquire_transactional_readback", (ordered(acquireBlock, "INSERT INTO repository_operation_leases", "const created = await readLeaseById") || ordered(acquireBlock, "UPDATE repository_operation_leases", "const renewed = await readLeaseById")) && acquireBlock.includes("repository_operation_lease_readback_failed"), "acquire/reuse readback before commit"),',
            '    evidenceGate("renew_transactional_readback", ordered(renewBlock, "UPDATE repository_operation_leases", "const renewed = await readLeaseById"), "renew readback before commit"),',
            '    evidenceGate("release_transactional_readback", ordered(releaseBlock, "UPDATE repository_operation_leases", "const released = await readLeaseById") && releaseBlock.includes(\'released.status !== "released"\'), "release readback before commit"),',
            '    evidenceGate("registered_operation_test", claimedTests.includes(LEASE_TEST_FILE), LEASE_TEST_FILE),',
            '  ];',
            '  return { recipe, gates, evidenceFiles: [LEASE_ROUTE_FILE, LEASE_CONTROL_FILE, LEASE_SERVICE_FILE, LEASE_TEST_FILE] };',
            '}',
            '',
          ].join('\n');
          if (!generator.includes('function evaluateLeaseRecipe')) {
            generator = replaceOnce(generator, 'export function buildOperationGovernance', `${leaseEvaluator}\nexport function buildOperationGovernance`, 'lease evaluator');
          }
          if (!generator.includes('    LEASE_ROUTE_FILE,\n    LEASE_CONTROL_FILE,')) {
            generator = replaceOnce(
              generator,
              '    BOOTSTRAP_TRANSACTION_FILE,\n    BOOTSTRAP_TEST_FILE,\n  ]);',
              '    BOOTSTRAP_TRANSACTION_FILE,\n    BOOTSTRAP_TEST_FILE,\n    LEASE_ROUTE_FILE,\n    LEASE_CONTROL_FILE,\n    LEASE_SERVICE_FILE,\n    LEASE_TEST_FILE,\n  ]);',
              'lease evidence files'
            );
          }
          if (!generator.includes('    leaseRoutes: routeRegistry')) {
            generator = replaceOnce(
              generator,
              '    bootstrapRoutes: routeRegistry(sourceByFile.get(BOOTSTRAP_ROUTE_FILE), BOOTSTRAP_ROUTE_FILE),\n  };',
              '    bootstrapRoutes: routeRegistry(sourceByFile.get(BOOTSTRAP_ROUTE_FILE), BOOTSTRAP_ROUTE_FILE),\n    leaseRoutes: routeRegistry(sourceByFile.get(LEASE_ROUTE_FILE), LEASE_ROUTE_FILE),\n  };',
              'lease route registry'
            );
          }
          if (!generator.includes('    evaluateLeaseRecipe(context),')) {
            generator = replaceOnce(
              generator,
              '    ...CANARY_RECIPES.map((recipe) => evaluateCanaryRecipe(recipe, context)),\n    evaluateBootstrapRecipe(context),\n  ];',
              '    ...CANARY_RECIPES.map((recipe) => evaluateCanaryRecipe(recipe, context)),\n    evaluateBootstrapRecipe(context),\n    evaluateLeaseRecipe(context),\n  ];',
              'lease evaluation'
            );
          }
          fs.writeFileSync(generatorPath, generator, 'utf8');

          const testPath = 'http-generic-api/test-frontend-operation-governance-generator.mjs';
          let test = fs.readFileSync(testPath, 'utf8');
          if (!test.includes('const LEASE_OPERATION =')) {
            test = replaceOnce(
              test,
              'await import("./test-dynamic-container-rollout-safety.mjs");\n\nconst CANARY_OPERATIONS',
              'await import("./test-dynamic-container-rollout-safety.mjs");\n\nconst LEASE_OPERATION = "POST /admin/repository-automation/reconciliation-lease";\nconst CANARY_OPERATIONS',
              'lease operation constant'
            );
          }
          if (!test.includes('  LEASE_OPERATION,\n  "POST /connect/bootstrap"')) {
            test = replaceOnce(test, '  ...CANARY_OPERATIONS,\n  "POST /connect/bootstrap",', '  ...CANARY_OPERATIONS,\n  LEASE_OPERATION,\n  "POST /connect/bootstrap",', 'lease expected operation');
          }
          if (!test.includes('  "routes/repositoryAutomationRoutes.js",')) {
            test = replaceOnce(
              test,
              '  "tenantConnectBootstrapTransaction.js",\n  "test-tenant-connect-bootstrap-transaction.mjs",\n];',
              '  "tenantConnectBootstrapTransaction.js",\n  "test-tenant-connect-bootstrap-transaction.mjs",\n  "routes/repositoryAutomationRoutes.js",\n  "repositoryReconciliationLeaseControl.js",\n  "repositoryOperationLeaseService.js",\n  "test-repository-reconciliation-lease-control.mjs",\n];',
              'lease evidence files in test'
            );
          }
          test = test.replace('  candidate_count: 8,\n  generated_rule_count: 8,', '  candidate_count: 9,\n  generated_rule_count: 9,');
          test = test.replace('assert.equal(writeResult.plan.coverage.generated_rule_count, 8);', 'assert.equal(writeResult.plan.coverage.generated_rule_count, 9);');
          if (!test.includes('const leaseRule = plan.operation_rules.find')) {
            const leaseAssertions = [
              'const leaseRule = plan.operation_rules.find((rule) => rule.operation === LEASE_OPERATION);',
              'assert.equal(leaseRule.rule_id, "generated-repository-reconciliation-lease-control-governance");',
              'assert.equal(leaseRule.preflight.mode, "capability_envelope_resource_and_fingerprint_binding");',
              'assert.equal(leaseRule.approval.mode, "runtime_authorization_and_typed_confirmation");',
              'assert.equal(leaseRule.parameter_bindings.lease_id, "response.lease.lease_id");',
              'assert.deepEqual(leaseRule.evidence_refs, [',
              '  "routes/repositoryAutomationRoutes.js",',
              '  "repositoryReconciliationLeaseControl.js",',
              '  "repositoryOperationLeaseService.js",',
              '  "test-repository-reconciliation-lease-control.mjs",',
              ']);',
            ].join('\n');
            test = replaceOnce(test, '}\nassert.deepEqual(plan.safety, {', `}\n${leaseAssertions}\nassert.deepEqual(plan.safety, {`, 'lease assertions');
          }
          if (!test.includes('const noLeaseApplyFixture =')) {
            const leaseRegressions = [
              'const noLeaseApplyFixture = createFixture();',
              'replaceEvidence(noLeaseApplyFixture, "repositoryReconciliationLeaseControl.js", "resolved.apply_allowed !== true", "resolved.applyEvidenceRemoved !== true");',
              'const noLeaseApplyPlan = buildOperationGovernance({ apiRoot: noLeaseApplyFixture });',
              'assert(rejection(noLeaseApplyPlan, LEASE_OPERATION).missing_evidence.includes("capability_envelope_apply_authorization"));',
              '',
              'const noLeaseConfirmationFixture = createFixture();',
              'replaceEvidence(noLeaseConfirmationFixture, "repositoryReconciliationLeaseControl.js", "assertTypedConfirmation(action, args.confirm)", "typedConfirmationEvidenceRemoved(action, args.confirm)");',
              'const noLeaseConfirmationPlan = buildOperationGovernance({ apiRoot: noLeaseConfirmationFixture });',
              'assert(rejection(noLeaseConfirmationPlan, LEASE_OPERATION).missing_evidence.includes("typed_confirmation"));',
              '',
              'const noLeaseReadbackFixture = createFixture();',
              'replaceEvidence(noLeaseReadbackFixture, "repositoryOperationLeaseService.js", "const released = await readLeaseById(connection, leaseId)", "const released = await releaseReadbackEvidenceRemoved(connection, leaseId)");',
              'const noLeaseReadbackPlan = buildOperationGovernance({ apiRoot: noLeaseReadbackFixture });',
              'assert(rejection(noLeaseReadbackPlan, LEASE_OPERATION).missing_evidence.includes("release_transactional_readback"));',
              '',
              'const noLeaseTestFixture = createFixture();',
              'replaceEvidence(noLeaseTestFixture, "test-repository-reconciliation-lease-control.mjs", "// frontend-surface-operation: " + LEASE_OPERATION, "// operation claim removed for fail-closed regression");',
              'const noLeaseTestPlan = buildOperationGovernance({ apiRoot: noLeaseTestFixture });',
              'assert(rejection(noLeaseTestPlan, LEASE_OPERATION).missing_evidence.includes("registered_operation_test"));',
              '',
              'const noLeaseRegistrationFixture = createFixture();',
              'replaceEvidence(noLeaseRegistrationFixture, "frontend-operation-governance-tests.json", \'"file": "test-repository-reconciliation-lease-control.mjs"\', \'"file": "test-unregistered-repository-reconciliation-lease-control.mjs"\');',
              'const noLeaseRegistrationPlan = buildOperationGovernance({ apiRoot: noLeaseRegistrationFixture });',
              'assert(rejection(noLeaseRegistrationPlan, LEASE_OPERATION).missing_evidence.includes("registered_operation_test"));',
              '',
            ].join('\n');
            test = replaceOnce(test, 'console.log("generated frontend operation governance evidence tests passed");', `${leaseRegressions}\nconsole.log("generated frontend operation governance evidence tests passed");`, 'lease regressions');
          }
          fs.writeFileSync(testPath, test, 'utf8');
          NODE

      - name: Run focused governance tests
        working-directory: http-generic-api
        run: |
          node test-frontend-operation-governance-generator.mjs
          node test-repository-reconciliation-lease-control.mjs
          node test-repository-operation-lease-service.mjs

      - name: Commit semantic merge and remove workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            http-generic-api/frontend-operation-governance-tests.json \
            http-generic-api/scripts/frontend-operation-governance-generator.mjs \
            http-generic-api/test-frontend-operation-governance-generator.mjs
          git rm -f \
            .github/workflows/one-shot-merge-lease-governance.yml \
            .github/workflows/one-shot-merge-lease-governance-v2.yml
          git commit -m "test: merge lease governance with expanded canary rules"
          git push origin HEAD:gpt/reconciliation-lease-control-surface-v2-20260730
