name: Reconcile PR 6534 with current main and Work Maps

on:
  push:
    branches:
      - gpt/migration-1048-governed-rollout-20260807
    paths:
      - .github/ops/reconcile-pr6534-main-work-maps.trigger

permissions:
  contents: write

concurrency:
  group: reconcile-pr6534-main-work-maps
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_BRANCH: gpt/migration-1048-governed-rollout-20260807
      EXPECTED_MAIN: 6dc59ef603b1db17199b5abe6a41bc68cef2d6a6
      WORKFLOW_FILE: .github/workflows/reconcile-pr6534-main-work-maps.yml
      TRIGGER_FILE: .github/ops/reconcile-pr6534-main-work-maps.trigger
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Merge exact main and regenerate canonical Work Maps
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          git fetch origin main "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse origin/${EXPECTED_BRANCH})" = "${GITHUB_SHA}"
          test "$(git rev-parse origin/main)" = "${EXPECTED_MAIN}"

          # These one-shot files must not participate in the final canonical
          # Work Map fingerprint.
          rm -f "$WORKFLOW_FILE" "$TRIGGER_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          git merge --no-commit --no-ff origin/main
          MERGE_RC=$?
          set -e

          if [ "$MERGE_RC" -ne 0 ]; then
            mapfile -t CONFLICTS < <(git diff --name-only --diff-filter=U | sort)
            test "${#CONFLICTS[@]}" -gt 0
            for file in "${CONFLICTS[@]}"; do
              case "$file" in
                docs/work-maps/README.md|docs/work-maps/repository-automation-map.md|specs/014-governed-hostinger-storage-orchestration/work-map-integration.json|specs/014-retail-commerce-operations-growth-os/work-map-integration.json)
                  git checkout --theirs -- "$file"
                  git add -- "$file"
                  ;;
                *)
                  echo "Unexpected non-generated merge conflict: $file"
                  exit 1
                  ;;
              esac
            done
          fi

          test -z "$(git diff --name-only --diff-filter=U)"

          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-governed-hostinger-storage-orchestration
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-retail-commerce-operations-growth-os
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-governed-hostinger-storage-orchestration
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-retail-commerce-operations-growth-os

          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-governed-hostinger-storage-orchestration --check
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-retail-commerce-operations-growth-os --check

          git add -A
          test -z "$(git diff --cached --name-only --diff-filter=U)"

          # Fail closed if main moved while convergence was being computed.
          git fetch origin main "${EXPECTED_BRANCH}"
          test "$(git rev-parse origin/main)" = "${EXPECTED_MAIN}"
          test "$(git rev-parse origin/${EXPECTED_BRANCH})" = "${GITHUB_SHA}"

          git commit -m "merge(main): reconcile Migration 1048 rollout after Work Map V3"
          NEW_HEAD="$(git rev-parse HEAD)"

          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-governed-hostinger-storage-orchestration --check
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-retail-commerce-operations-growth-os --check
          test -z "$(git status --porcelain)"

          git push origin "HEAD:${EXPECTED_BRANCH}"
          echo "result_head=${NEW_HEAD}" >> "$GITHUB_STEP_SUMMARY"
          echo "main_parent=${EXPECTED_MAIN}" >> "$GITHUB_STEP_SUMMARY"
