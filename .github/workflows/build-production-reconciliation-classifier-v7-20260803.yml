name: Validate Production Reconciliation Classifier Durable Head V7

on:
  push:
    branches:
      - gpt/build-production-reconciliation-classifier-v7-20260803
    paths:
      - .github/workflows/build-production-reconciliation-classifier-v7-20260803.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: validate-production-reconciliation-classifier-durable-head-v7
  cancel-in-progress: false

jobs:
  validate:
    name: Validate exact durable classifier head
    if: github.actor_id == 271942579
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      DURABLE_PR: '5729'
      DURABLE_SHA: 153d249cec999bff651a97de78dd1c3db09a0c9c
      DURABLE_BRANCH: gpt/fix-production-reconciliation-classifier-v7-20260803
      EXPECTED_MAIN_SHA: 14433d15184bd7e7658281a356a7540e3d2d6dfe
      EXPECTED_PRODUCTION_SHA: 2669991a882c7f7939510fbbace17f462a42517c

    steps:
      - name: Checkout exact durable head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DURABLE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Run official syntax and E2E governance validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          log="${RUNNER_TEMP}/durable-head-validation.log"
          set +e
          (
            set -Eeuo pipefail

            git fetch --no-tags origin \
              "+refs/heads/main:refs/remotes/origin/main" \
              "+refs/heads/Production:refs/remotes/origin/Production"
            test "$(git rev-parse HEAD)" = "${DURABLE_SHA}"
            test "$(git rev-parse refs/remotes/origin/main)" = "${EXPECTED_MAIN_SHA}"
            test "$(git rev-parse refs/remotes/origin/Production)" = "${EXPECTED_PRODUCTION_SHA}"
            test "$(git rev-parse HEAD^1)" = "${EXPECTED_MAIN_SHA}"
            git merge-base --is-ancestor c7f7be81b811caf3c1112372ab1089fc5ee3714c "${DURABLE_SHA}"

            mapfile -t changed < <(git diff --name-only "${EXPECTED_MAIN_SHA}"..."${DURABLE_SHA}" | sort)
            expected=(
              '.changes/e2e/e2e-default-branch-and-production-promotion-classification.json'
              'http-generic-api/scripts/e2e-parallel-pr-flow-self-test.mjs'
              'http-generic-api/scripts/e2e-parallel-pr-gate.mjs'
            )
            test "${#changed[@]}" -eq "${#expected[@]}"
            for index in "${!expected[@]}"; do test "${changed[$index]}" = "${expected[$index]}"; done

            node http-generic-api/scripts/schema-docs-change-guard.mjs
            node http-generic-api/scripts/migration-placement-guard.mjs
            (
              cd http-generic-api
              node scripts/user-jwt-auth-governance.mjs
              node scripts/interruption-readiness.mjs --ci --skip-dependencies --skip-worktree
            )
            node validate-canonical-sources.mjs
            node build-canonicals.mjs --check
            node --check find-canonical-domain.mjs
            (
              cd http-generic-api
              node scripts/resource-api-coverage-audit.mjs --ci --changed
              node test-resource-api-architecture.mjs
              node test-resource-api-service.mjs
            )
            node http-generic-api/scripts/spec-kit-completion-gate.mjs --ci --changed
            node validate-memory-schema.mjs
            git diff --check
            (
              cd http-generic-api
              shopt -s nullglob
              for file in *.js *.mjs routes/*.js scripts/*.mjs wordpress/*.js; do
                node --check "${file}"
              done
            )

            node http-generic-api/scripts/e2e-phase-governance-self-test.mjs
            node http-generic-api/scripts/e2e-phase-init-self-test.mjs
            node http-generic-api/scripts/e2e-parallel-work-governance-self-test.mjs
            node http-generic-api/scripts/e2e-parallel-plan-init-self-test.mjs
            node http-generic-api/scripts/e2e-parallel-pr-flow-self-test.mjs
            node http-generic-api/scripts/test-e2e-parallel-test-runner-diagnostics.mjs
            node http-generic-api/scripts/test-ci-evidence-source-stamp.mjs
            node http-generic-api/scripts/test-ci-evidence-router.mjs
            node http-generic-api/scripts/test-ci-evidence-pr-comment.mjs

            gate_report="${RUNNER_TEMP}/durable-pr-gate.json"
            node http-generic-api/scripts/e2e-parallel-pr-gate.mjs check \
              --base "${EXPECTED_MAIN_SHA}" \
              --head "${DURABLE_SHA}" \
              --head-ref "${DURABLE_BRANCH}" \
              --base-ref main \
              --report-file "${gate_report}"
            jq -e '.ok == true and .pr_mode == "standard" and .production_promotion == false and .production_promotion_identity == null' "${gate_report}"

            phase_report="${RUNNER_TEMP}/durable-phase-evaluation.json"
            execution_report="${RUNNER_TEMP}/durable-phase-execution.json"
            node http-generic-api/scripts/e2e-phase-governance.mjs check \
              --base "${EXPECTED_MAIN_SHA}" \
              --head "${DURABLE_SHA}" \
              --report-file "${phase_report}"
            node http-generic-api/scripts/e2e-phase-governance.mjs run \
              --base "${EXPECTED_MAIN_SHA}" \
              --head "${DURABLE_SHA}" \
              --report-file "${phase_report}" \
              --execution-report-file "${execution_report}"
            jq -e '.ok == true' "${phase_report}"
            jq -e '.ok == true' "${execution_report}"
          ) >"${log}" 2>&1
          status=$?
          set -e
          cat "${log}"

          if [[ "${status}" -ne 0 ]]; then
            {
              printf '## Exact durable-head validation failed\n\n'
              printf -- '- Durable PR: #%s\n' "${DURABLE_PR}"
              printf -- '- Durable head: `%s`\n' "${DURABLE_SHA}"
              printf -- '- Expected main: `%s`\n' "${EXPECTED_MAIN_SHA}"
              printf -- '- Expected Production: `%s`\n\n' "${EXPECTED_PRODUCTION_SHA}"
              printf '```text\n'
              tail -n 240 "${log}"
              printf '```\n'
            } > "${RUNNER_TEMP}/failure-comment.md"
            gh pr comment "${DURABLE_PR}" --repo "${REPOSITORY}" --body-file "${RUNNER_TEMP}/failure-comment.md"
            exit "${status}"
          fi

          {
            printf '## Exact durable-head validation passed\n\n'
            printf -- '- Durable head: `%s`\n' "${DURABLE_SHA}"
            printf -- '- Exact parent main: `%s`\n' "${EXPECTED_MAIN_SHA}"
            printf -- '- Observed Production: `%s`\n' "${EXPECTED_PRODUCTION_SHA}"
            printf -- '- Diff boundary: exactly three governed files\n'
            printf -- '- Official CI Syntax Check command set: passed\n'
            printf -- '- Full E2E governance self-test set: passed\n'
            printf -- '- Exact PR-to-main classification: standard and non-Production\n'
            printf -- '- Complete changed-phase check and execution: passed\n'
            printf -- '- Runtime fix ancestry: present\n'
            printf -- '- No protected ref, deployment, provider, database, SQL, migration, credential, secret, or external-send mutation occurred\n'
          } > "${RUNNER_TEMP}/success-comment.md"
          gh pr comment "${DURABLE_PR}" --repo "${REPOSITORY}" --body-file "${RUNNER_TEMP}/success-comment.md"
