name: OpenAPI Completion Metadata Recovery V2 Launcher

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - '.github/workflows/openapi-completion-metadata-recovery-v2-launcher.yml'

permissions:
  contents: write

concurrency:
  group: openapi-completion-metadata-recovery-v2-launcher
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'gpt/openapi-completion-metadata-recovery-v2-20260802'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REF: gpt/openapi-completion-metadata-recovery-v2-20260802
      MINIMUM_MAIN_SHA: 54d5bd3a7903646bcae2a68c5fed8cd3cbc5b92a
      SOURCE_FIX_SHA: 4dc325c79db91af6bc0abf08c1a13b1065b7674b
      SOURCE_PATH: http-generic-api/scripts/support-ticket-runtime-openapi-contracts.mjs
      CONTRACT_PATH: .changes/e2e/support-ticket-completion-certification-openapi-precision-v2.json
      TEST_PATH: http-generic-api/test-openapi-completion-metadata-root.mjs
      LAUNCHER_PATH: .github/workflows/openapi-completion-metadata-recovery-v2-launcher.yml
      REPORT_DIR: ${{ runner.temp }}/openapi-completion-metadata-recovery-v2
    steps:
      - name: Checkout exact launcher head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Transfer reviewed source and prove actual root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          current_step=preflight
          initial_sha="$(git rev-parse HEAD)"
          : >"$REPORT_DIR/preflight.stdout"
          : >"$REPORT_DIR/preflight.stderr"

          trap 'status=$?; if [[ $status -ne 0 ]]; then CURRENT_STEP="$current_step" EXIT_STATUS="$status" INITIAL_SHA="$initial_sha" python3 - <<"PY"
          import json, os, re
          from pathlib import Path
          root=Path(os.environ["REPORT_DIR"]); root.mkdir(parents=True, exist_ok=True)
          step=os.environ.get("CURRENT_STEP","unknown")
          def bounded(kind):
            path=root/f"{step}.{kind}"
            text=path.read_text(errors="replace") if path.exists() else ""
            text=re.sub(r"(?i)(authorization|api[_-]?key|token|password|secret|cookie)\\s*[:=]\\s*\\S+", r"\\1=[redacted]", text)
            return {"head":text[:1600],"tail":text[-1600:]}
          report={
            "contract":"mad4b.openapi-completion-metadata-recovery-v2-launcher.v1",
            "outcome":"blocked",
            "launcher_head_sha":os.environ.get("INITIAL_SHA"),
            "first_failure":{"step":step,"exit_status":int(os.environ.get("EXIT_STATUS","1")),"stdout":bounded("stdout"),"stderr":bounded("stderr"),"secrets_included":False},
            "repository_write_performed":False,
            "force_push":False,
            "protected_branch_mutation":False,
            "provider_dispatch":False,
            "credential_access":False,
            "external_send":False,
            "job_logs_consulted":False,
            "secrets_included":False,
          }
          (root/"summary.json").write_text(json.dumps(report,indent=2)+"\n")
          PY
          fi' EXIT

          run_step() {
            current_step="$1"
            shift
            "$@" >"$REPORT_DIR/${current_step}.stdout" 2>"$REPORT_DIR/${current_step}.stderr"
          }

          current_step=fetch_exact_sources
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "$SOURCE_FIX_SHA"
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          git merge-base --is-ancestor "$MINIMUM_MAIN_SHA" "$main_sha"
          [[ "$(git ls-remote origin "refs/heads/${TARGET_REF}" | awk '{print $1}')" == "$initial_sha" ]]

          current_step=validate_initial_delta
          mapfile -t initial_delta < <(git diff --name-only "$MINIMUM_MAIN_SHA" "$initial_sha" | sort -u)
          expected_initial=("$LAUNCHER_PATH" "$CONTRACT_PATH" "$TEST_PATH")
          mapfile -t expected_initial_sorted < <(printf '%s\n' "${expected_initial[@]}" | sort -u)
          [[ "${initial_delta[*]}" == "${expected_initial_sorted[*]}" ]]

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          current_step=merge_latest_main
          if [[ "$main_sha" != "$MINIMUM_MAIN_SHA" ]]; then
            git merge --no-ff --no-edit "$main_sha" >"$REPORT_DIR/${current_step}.stdout" 2>"$REPORT_DIR/${current_step}.stderr"
          else
            : >"$REPORT_DIR/${current_step}.stdout"
            : >"$REPORT_DIR/${current_step}.stderr"
          fi

          current_step=validate_source_not_changed_on_main
          source_parent="$(git rev-parse "${SOURCE_FIX_SHA}^")"
          source_base_blob="$(git rev-parse "${source_parent}:${SOURCE_PATH}")"
          current_main_blob="$(git rev-parse "${main_sha}:${SOURCE_PATH}")"
          [[ "$source_base_blob" == "$current_main_blob" ]]

          current_step=transfer_reviewed_source
          git show "${SOURCE_FIX_SHA}:${SOURCE_PATH}" > "$SOURCE_PATH"
          git add -- "$SOURCE_PATH"
          mapfile -t transferred < <(git diff --cached --name-only | sort -u)
          [[ "${transferred[*]}" == "$SOURCE_PATH" ]]

          run_step install_dependencies npm --prefix http-generic-api ci
          run_step check_source_syntax node --check "$SOURCE_PATH"
          run_step current_main_support_ticket_sync node http-generic-api/test-support-ticket-runtime-openapi-sync.mjs
          run_step actual_root_completion_upgrade node http-generic-api/test-openapi-completion-metadata-root.mjs

          current_step=commit_recovery
          git commit -m 'fix(openapi): recover completion-certification metadata upgrade'
          recovery_sha="$(git rev-parse HEAD)"

          current_step=remove_launcher
          git rm -- "$LAUNCHER_PATH"
          git commit -m 'chore(ci): remove completion metadata recovery launcher'
          final_sha="$(git rev-parse HEAD)"
          [[ ! -e "$LAUNCHER_PATH" ]]

          current_step=enforce_final_scope
          mapfile -t final_delta < <(git diff --name-only "$main_sha" "$final_sha" | sort -u)
          expected_final=("$CONTRACT_PATH" "$SOURCE_PATH" "$TEST_PATH")
          mapfile -t expected_final_sorted < <(printf '%s\n' "${expected_final[@]}" | sort -u)
          [[ "${final_delta[*]}" == "${expected_final_sorted[*]}" ]]

          current_step=prepush_exact_head_check
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          [[ "$(git rev-parse refs/remotes/origin/main)" == "$main_sha" ]]
          [[ "$(git ls-remote origin "refs/heads/${TARGET_REF}" | awk '{print $1}')" == "$initial_sha" ]]
          git merge-base --is-ancestor "$main_sha" "$final_sha"

          current_step=push_recovery
          git push origin "HEAD:${TARGET_REF}"

          current_step=write_canonical_report
          MAIN_SHA="$main_sha" INITIAL_SHA="$initial_sha" RECOVERY_SHA="$recovery_sha" FINAL_SHA="$final_sha" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['REPORT_DIR'])
          report={
            'contract':'mad4b.openapi-completion-metadata-recovery-v2-launcher.v1',
            'outcome':'passed',
            'main_sha':os.environ['MAIN_SHA'],
            'launcher_head_sha':os.environ['INITIAL_SHA'],
            'recovery_commit_sha':os.environ['RECOVERY_SHA'],
            'final_sha':os.environ['FINAL_SHA'],
            'source_fix_sha':'4dc325c79db91af6bc0abf08c1a13b1065b7674b',
            'final_files':[
              '.changes/e2e/support-ticket-completion-certification-openapi-precision-v2.json',
              'http-generic-api/scripts/support-ticket-runtime-openapi-contracts.mjs',
              'http-generic-api/test-openapi-completion-metadata-root.mjs',
            ],
            'actual_root_probe_passed':True,
            'current_main_sync_regression_passed':True,
            'launcher_removed':True,
            'ordinary_fast_forward_push':True,
            'repository_write_performed':True,
            'force_push':False,
            'protected_branch_mutation':False,
            'provider_dispatch':False,
            'credential_access':False,
            'external_send':False,
            'job_logs_consulted':False,
            'secrets_included':False,
          }
          (root/'summary.json').write_text(json.dumps(report,indent=2)+'\n')
          PY

      - name: Upload canonical recovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-completion-metadata-recovery-v2-${{ github.run_id }}
          path: ${{ env.REPORT_DIR }}/summary.json
          if-no-files-found: error
          retention-days: 30
