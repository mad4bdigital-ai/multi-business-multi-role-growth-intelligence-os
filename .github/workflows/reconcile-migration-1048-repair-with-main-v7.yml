name: Reconcile Migration 1048 Repair With Main V7

on:
  push:
    branches:
      - fix/migration-1048-canonical-confirmation-and-readiness-marker
    paths:
      - .github/ops/reconcile-migration-1048-repair-with-main-v7.trigger

permissions:
  contents: write

concurrency:
  group: migration-1048-reconcile-main-v7
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_MAIN: 16bf7a895bb60f0ff20f58dcf95adffd41ab2e6c
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact branch and main heads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='fix/migration-1048-canonical-confirmation-and-readiness-marker'
          branch_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')"
          main_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$branch_head" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$main_head" = "$EXPECTED_MAIN"

      - name: Merge exact main and reconstruct bounded overlap
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$EXPECTED_MAIN"
          set +e
          git merge --no-commit --no-ff "$EXPECTED_MAIN"
          merge_rc=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U || true)"
          if [ -n "$conflicts" ]; then
            while IFS= read -r path; do
              case "$path" in
                .github/ops/transport-response-schema-1048-governed-rollout.mjs|http-generic-api/test-transport-response-schema-1048-governed-rollout.mjs) ;;
                *) echo "Unexpected merge conflict: $path" >&2; exit 1 ;;
              esac
            done <<< "$conflicts"
          elif [ "$merge_rc" -ne 0 ]; then
            echo 'Merge failed without bounded conflicts' >&2
            exit "$merge_rc"
          fi

          git show "$EXPECTED_MAIN:.github/ops/transport-response-schema-1048-governed-rollout.mjs" > .github/ops/transport-response-schema-1048-governed-rollout.mjs
          git show "$EXPECTED_MAIN:http-generic-api/test-transport-response-schema-1048-governed-rollout.mjs" > http-generic-api/test-transport-response-schema-1048-governed-rollout.mjs

          python3 - <<'PY'
          from pathlib import Path

          runner = Path('.github/ops/transport-response-schema-1048-governed-rollout.mjs')
          text = runner.read_text()
          old = "const VERIFY_CONFIRM = 'VERIFY_GOVERNED_MIGRATION_1048_TRANSPORT_RESPONSE_SCHEMA_RECOVERY';"
          new = "const VERIFY_CONFIRM = `VERIFY_GOVERNED_MIGRATION_${MIGRATION_CONFIRMATION_KEY}`;"
          if text.count(old) != 1:
              raise SystemExit('current-main VERIFY confirmation anchor count != 1')
          runner.write_text(text.replace(old, new))

          test = Path('http-generic-api/test-transport-response-schema-1048-governed-rollout.mjs')
          text = test.read_text()
          replacements = {
              '  "AUTHORIZE_GOVERNED_MIGRATION_1048_TRANSPORT_RESPONSE_SCHEMA_RECOVERY",': '  "AUTHORIZE_GOVERNED_MIGRATION_1048_TRANSPORT_RESPONSE_CHUNK_SCHEMA_RECOVERY",',
              '  "APPLY_GOVERNED_MIGRATION_1048_TRANSPORT_RESPONSE_SCHEMA_RECOVERY",': '  "APPLY_1048_TRANSPORT_RESPONSE_CHUNK_SCHEMA_RECOVERY",',
              '  "VERIFY_GOVERNED_MIGRATION_1048_TRANSPORT_RESPONSE_SCHEMA_RECOVERY",': '  "VERIFY_GOVERNED_MIGRATION_1048_TRANSPORT_RESPONSE_CHUNK_SCHEMA_RECOVERY",',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'current-main workflow command anchor count != 1: {old}')
              text = text.replace(old, new)

          apply_anchor = '  "const APPLY_CONFIRM = `APPLY_${MIGRATION_CONFIRMATION_KEY}`",\n'
          verify_line = '  "const VERIFY_CONFIRM = `VERIFY_GOVERNED_MIGRATION_${MIGRATION_CONFIRMATION_KEY}`",\n'
          if text.count(apply_anchor) != 1:
              raise SystemExit('dynamic APPLY expectation anchor count != 1')
          text = text.replace(apply_anchor, apply_anchor + verify_line)

          runner_anchor = '\nfor (const expected of [\n  "const ISSUE = Number(process.env.CONTROL_ISSUE || 6531)",'
          readiness = "\n".join([
              '',
              'for (const expected of [',
              "  'issues: write',",
              "  'Publish checksum-bound readiness marker',",
              "  'actions/github-script@v7',",
              "  'summary.readiness_marker',",
              "  'TRANSPORT_RESPONSE_SCHEMA_1048_READINESS result=pass ',",
              "  'issue_number: 6531',",
              ']) {',
              '  assert.ok(workflow.includes(expected), `Migration 1048 workflow is missing readiness publication contract: ${expected}`);',
              '}',
          ])
          if text.count(runner_anchor) != 1:
              raise SystemExit('runner expectation block anchor count != 1')
          text = text.replace(runner_anchor, readiness + runner_anchor)

          console_anchor = "console.log('PASS governed Migration 1048 rollout contract');"
          obsolete = "\n".join([
              'for (const forbidden of [',
              "  'AUTHORIZE_GOVERNED_MIGRATION_1048_TRANSPORT_RESPONSE_SCHEMA_RECOVERY',",
              "  'APPLY_GOVERNED_MIGRATION_1048_TRANSPORT_RESPONSE_SCHEMA_RECOVERY',",
              "  'VERIFY_GOVERNED_MIGRATION_1048_TRANSPORT_RESPONSE_SCHEMA_RECOVERY',",
              ']) {',
              '  assert.ok(!workflow.includes(forbidden), `Migration 1048 workflow retains obsolete trigger: ${forbidden}`);',
              '  assert.ok(!runner.includes(forbidden), `Migration 1048 runner retains obsolete confirmation: ${forbidden}`);',
              '}',
              '',
          ])
          if text.count(console_anchor) != 1:
              raise SystemExit('console anchor count != 1')
          text = text.replace(console_anchor, obsolete + console_anchor)
          test.write_text(text)
          PY

          git add -- .github/ops/transport-response-schema-1048-governed-rollout.mjs http-generic-api/test-transport-response-schema-1048-governed-rollout.mjs
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Remove reconciliation scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/reconcile-migration-1048-repair-with-main-v6.yml
          rm -f .github/ops/reconcile-migration-1048-repair-with-main-v6.trigger
          rm -f .github/workflows/reconcile-migration-1048-repair-with-main-v7.yml
          rm -f .github/ops/reconcile-migration-1048-repair-with-main-v7.trigger
          git add -A -- .github/workflows/reconcile-migration-1048-repair-with-main-v6.yml .github/ops/reconcile-migration-1048-repair-with-main-v6.trigger .github/workflows/reconcile-migration-1048-repair-with-main-v7.yml .github/ops/reconcile-migration-1048-repair-with-main-v7.trigger

      - name: Run Migration 1048 regression
        run: node http-generic-api/test-transport-response-schema-1048-governed-rollout.mjs

      - name: Validate exact bounded final diff
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            '.github/ops/transport-response-schema-1048-governed-rollout.mjs' \
            '.github/workflows/transport-response-schema-1048-governed-rollout.yml' \
            'http-generic-api/test-transport-response-schema-1048-governed-rollout.mjs')"
          actual="$(git diff --name-only "$EXPECTED_MAIN" | sort)"
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check

      - name: Commit reconciled repair and push normally
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='fix/migration-1048-canonical-confirmation-and-readiness-marker'
          branch_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')"
          main_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$branch_head" = "$GITHUB_SHA"
          test "$main_head" = "$EXPECTED_MAIN"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git status --short
          git commit -m 'merge: reconcile Migration 1048 repair with current main'
          git push origin "HEAD:refs/heads/${branch}"
