name: Governed Production Candidate Marker Dispatch

on:
  push:
    branches: [main]
    paths:
      - ".github/production-promotion/trigger-4241.txt"

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

jobs:
  dispatch-exact-candidate-builder:
    name: Dispatch exact current-ref candidate builder
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      REQUEST_PR: "4241"
      MARKER: ".github/production-promotion/trigger-4241.txt"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Validate exact marker and request surface
        id: refs
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f "$MARKER"
          grep -Fxq 'request_pr=4241' "$MARKER"
          grep -Fxq 'request_title=ops: request governed Production synchronization' "$MARKER"
          grep -Fxq 'trigger_revision=production-candidate-marker-v1' "$MARKER"
          grep -Fxq 'event_scope=marker_path_only' "$MARKER"
          grep -Fxq 'builder=production-promotion-candidate.yml' "$MARKER"
          grep -Fxq 'merge_authorized=false' "$MARKER"
          grep -Fxq 'deployment_authorized=false' "$MARKER"
          grep -Fxq 'migration_authorized=false' "$MARKER"
          grep -Fxq 'provider_mutation_authorized=false' "$MARKER"
          grep -Fxq 'credential_payload_read_authorized=false' "$MARKER"

          REQUEST_JSON="$(gh pr view "$REQUEST_PR" --repo "$REPOSITORY" \
            --json title,state,baseRefName,headRefName,isCrossRepository,headRepository)"
          test "$(jq -r '.title' <<<"$REQUEST_JSON")" = 'ops: request governed Production synchronization'
          test "$(jq -r '.state' <<<"$REQUEST_JSON")" = 'OPEN'
          test "$(jq -r '.baseRefName' <<<"$REQUEST_JSON")" = 'main'
          test "$(jq -r '.isCrossRepository' <<<"$REQUEST_JSON")" = 'false'
          test "$(jq -r '.headRepository.nameWithOwner' <<<"$REQUEST_JSON")" = "$REPOSITORY"
          HEAD_REF="$(jq -r '.headRefName' <<<"$REQUEST_JSON")"
          [[ "$HEAD_REF" == gpt/request-production-promotion-* ]]

          MAIN_SHA="$(gh api "/repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          PRODUCTION_SHA="$(gh api "/repos/${REPOSITORY}/git/ref/heads/Production" --jq '.object.sha')"
          [[ "$MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PRODUCTION_SHA" =~ ^[0-9a-f]{40}$ ]]

          EXISTING_BODY="$(gh api "/repos/${REPOSITORY}/issues/${REQUEST_PR}/comments?per_page=100" \
            --jq "[.[] | select(.body | startswith(\"GOVERNED_PRODUCTION_CANDIDATE_BUILDER_DISPATCH \") and contains(\"main_sha=${MAIN_SHA}\") and contains(\"production_sha=${PRODUCTION_SHA}\"))] | last.body // empty")"

          DISPATCH_REQUIRED=true
          if [[ -n "$EXISTING_BODY" ]]; then
            EXISTING_RUN_ID="$(sed -n 's/.*builder_run_id=\([0-9][0-9]*\).*/\1/p' <<<"$EXISTING_BODY")"
            if [[ -z "$EXISTING_RUN_ID" ]]; then
              echo "::warning::matching dispatch marker has no parseable builder run; suppressing duplicate fail-closed"
              DISPATCH_REQUIRED=false
            else
              RUN_JSON="$(gh run view "$EXISTING_RUN_ID" --repo "$REPOSITORY" --json status,conclusion 2>/dev/null || true)"
              if [[ -z "$RUN_JSON" ]]; then
                echo "::warning::matching builder run cannot be read; suppressing duplicate fail-closed"
                DISPATCH_REQUIRED=false
              else
                RUN_STATUS="$(jq -r '.status // ""' <<<"$RUN_JSON")"
                RUN_CONCLUSION="$(jq -r '.conclusion // ""' <<<"$RUN_JSON")"
                if [[ "$RUN_STATUS" != 'completed' || "$RUN_CONCLUSION" == 'success' ]]; then
                  DISPATCH_REQUIRED=false
                fi
              fi
            fi
          fi

          MAIN_SHORT="${MAIN_SHA:0:12}"
          PRODUCTION_SHORT="${PRODUCTION_SHA:0:12}"
          SUFFIX="marker-${GITHUB_RUN_ID}"
          RELEASE_BRANCH="release/production-candidate-${MAIN_SHORT}-${PRODUCTION_SHORT}-${SUFFIX}"
          VALIDATION_BRANCH="gpt/validate-production-candidate-${MAIN_SHORT}-${PRODUCTION_SHORT}-${SUFFIX}"
          VALIDATION_BASE_BRANCH="gpt/validate-production-base-${MAIN_SHORT}-${PRODUCTION_SHORT}-${SUFFIX}"
          BEFORE_RUN_ID="$(gh api "/repos/${REPOSITORY}/actions/workflows/production-promotion-candidate.yml/runs?event=workflow_dispatch&branch=main&per_page=20" --jq '[.workflow_runs[].id] | max // 0')"

          {
            echo "dispatch_required=$DISPATCH_REQUIRED"
            echo "main_sha=$MAIN_SHA"
            echo "production_sha=$PRODUCTION_SHA"
            echo "release_branch=$RELEASE_BRANCH"
            echo "validation_branch=$VALIDATION_BRANCH"
            echo "validation_base_branch=$VALIDATION_BASE_BRANCH"
            echo "before_run_id=$BEFORE_RUN_ID"
          } >> "$GITHUB_OUTPUT"

          if [[ "$DISPATCH_REQUIRED" != 'true' ]]; then
            gh pr comment "$REQUEST_PR" --repo "$REPOSITORY" \
              --body "GOVERNED_PRODUCTION_CANDIDATE_MARKER_DISPATCH status=duplicate_suppressed request_pr=${REQUEST_PR} marker_run_id=${GITHUB_RUN_ID} main_sha=${MAIN_SHA} production_sha=${PRODUCTION_SHA} merge_executed=false deployment_executed=false"
          fi

      - name: Dispatch canonical exact-tree builder
        if: steps.refs.outputs.dispatch_required == 'true'
        shell: bash
        env:
          MAIN_SHA: ${{ steps.refs.outputs.main_sha }}
          PRODUCTION_SHA: ${{ steps.refs.outputs.production_sha }}
          RELEASE_BRANCH: ${{ steps.refs.outputs.release_branch }}
          VALIDATION_BRANCH: ${{ steps.refs.outputs.validation_branch }}
          VALIDATION_BASE_BRANCH: ${{ steps.refs.outputs.validation_base_branch }}
        run: |
          set -Eeuo pipefail
          gh workflow run production-promotion-candidate.yml \
            --repo "$REPOSITORY" \
            --ref main \
            --field expected_main_sha="$MAIN_SHA" \
            --field expected_production_sha="$PRODUCTION_SHA" \
            --field release_branch="$RELEASE_BRANCH" \
            --field validation_branch="$VALIDATION_BRANCH" \
            --field validation_base_branch="$VALIDATION_BASE_BRANCH" \
            --field create_pull_requests=true

      - name: Resolve dispatched builder and record evidence
        if: steps.refs.outputs.dispatch_required == 'true'
        shell: bash
        env:
          BEFORE_RUN_ID: ${{ steps.refs.outputs.before_run_id }}
          MAIN_SHA: ${{ steps.refs.outputs.main_sha }}
          PRODUCTION_SHA: ${{ steps.refs.outputs.production_sha }}
          RELEASE_BRANCH: ${{ steps.refs.outputs.release_branch }}
          VALIDATION_BRANCH: ${{ steps.refs.outputs.validation_branch }}
          VALIDATION_BASE_BRANCH: ${{ steps.refs.outputs.validation_base_branch }}
        run: |
          set -Eeuo pipefail
          BUILDER_RUN_ID=""
          for _ in $(seq 1 60); do
            BUILDER_RUN_ID="$(gh api "/repos/${REPOSITORY}/actions/workflows/production-promotion-candidate.yml/runs?event=workflow_dispatch&branch=main&per_page=20" \
              --jq ".workflow_runs | map(select(.id > ${BEFORE_RUN_ID})) | sort_by(.id) | .[0].id // empty")"
            if [[ -n "$BUILDER_RUN_ID" ]]; then
              break
            fi
            sleep 5
          done
          test -n "$BUILDER_RUN_ID"

          BODY="GOVERNED_PRODUCTION_CANDIDATE_BUILDER_DISPATCH request_pr=${REQUEST_PR} marker_run_id=${GITHUB_RUN_ID} builder_run_id=${BUILDER_RUN_ID} main_sha=${MAIN_SHA} production_sha=${PRODUCTION_SHA} release_branch=${RELEASE_BRANCH} validation_branch=${VALIDATION_BRANCH} validation_base_branch=${VALIDATION_BASE_BRANCH} merge_executed=false deployment_executed=false migration_executed=false provider_call_executed=false credential_payload_read=false secrets_included=false"
          gh pr comment "$REQUEST_PR" --repo "$REPOSITORY" --body "$BODY"

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Governed Production candidate marker dispatch

          - request PR: \`${REQUEST_PR}\`
          - dispatch required: \`${{ steps.refs.outputs.dispatch_required }}\`
          - main: \`${{ steps.refs.outputs.main_sha }}\`
          - Production: \`${{ steps.refs.outputs.production_sha }}\`
          - release branch: \`${{ steps.refs.outputs.release_branch }}\`
          - validation branch: \`${{ steps.refs.outputs.validation_branch }}\`
          - merge executed: false
          - deployment executed: false
          - migration executed: false
          EOF
