name: Platform Completion Cleanup Readback

on:
  workflow_dispatch:
  pull_request:
    branches: [main, Production]
  push:
    branches: [main, Production]
  schedule:
    - cron: "47 3 * * *"

permissions:
  contents: read

concurrency:
  group: platform-completion-cleanup-readback-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-cleanup-readback:
    name: Static cleanup/readback audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Verify fail-closed workflow contract
        run: node http-generic-api/test-platform-static-readback-fail-closed.mjs

      - name: Run platform completion cleanup/readback audit
        id: audit
        run: |
          set -euo pipefail
          node http-generic-api/scripts/platform-completion-cleanup-readback-audit.mjs | tee platform-completion-cleanup-readback-audit.json
          test -s platform-completion-cleanup-readback-audit.json
          node -e '
            const fs = require("node:fs");
            const result = JSON.parse(fs.readFileSync("platform-completion-cleanup-readback-audit.json", "utf8"));
            if (result.ok !== true || Number(result.failed_checks || 0) !== 0) {
              console.error("Cleanup/readback audit did not pass", result);
              process.exit(1);
            }
          '

      - name: Publish audit summary
        if: always()
        run: |
          {
            echo "## Platform Completion Cleanup Readback"
            echo
            echo "Static no-secret audit for Support Ticket lifecycle, External Delivery no-send certification, Session Insight capability-envelope gates, and Tool Bus transitional guardrails."
            echo
            echo '```json'
            cat platform-completion-cleanup-readback-audit.json || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-completion-cleanup-readback-audit
          path: platform-completion-cleanup-readback-audit.json
          if-no-files-found: error
