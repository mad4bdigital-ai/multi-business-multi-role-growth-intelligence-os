name: Governed Superseded PR CI Hygiene

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Open same-repository PR number"
        required: true
        type: number
      expected_head_sha:
        description: "Exact current PR head SHA (40 lowercase hex chars)"
        required: true
        type: string
      mode:
        description: "dry_run reads only; apply requests cancellation after typed confirmation"
        required: true
        default: dry_run
        type: choice
        options: [dry_run, apply]
      confirmation:
        description: "For apply only: CANCEL_SUPERSEDED_PR_CHECKS"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: governed-pr-ci-hygiene-${{ github.repository }}-pr-${{ inputs.pr_number }}
  cancel-in-progress: false
  queue: max

jobs:
  inspect-and-apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout trusted main only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false

      - name: Run offline contract regression tests
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_growthos_stale_pr_runs.py'

      - name: Inspect or cancel superseded pull-request CI
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
          RUN_MODE: ${{ inputs.mode }}
          TYPED_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          python3 .github/scripts/growthos_stale_pr_runs.py \
            --pr-number "$PR_NUMBER" \
            --expected-head-sha "$EXPECTED_HEAD" \
            --mode "$RUN_MODE" \
            --confirmation "$TYPED_CONFIRMATION"
