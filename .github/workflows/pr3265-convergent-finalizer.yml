name: PR 3265 Convergent Finalizer

on:
  pull_request:
    types: [synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: pr-3265-convergent-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.pull_request.number == 3265 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/hostinger-production-resync-policy-20260729' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout governed PR branch
        uses: actions/checkout@v5
        with:
          ref: gpt/hostinger-production-resync-policy-20260729
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Converge, validate, and merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: '3265'
          TARGET_BRANCH: gpt/hostinger-production-resync-policy-20260729
        run: |
          set -euo pipefail
          WORKFLOW_PATH='.github/workflows/pr3265-convergent-finalizer.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          ARTIFACTS=(
            http-generic-api/openapi.yaml
            http-generic-api/frontend-operation-governance.generated.json
            http-generic-api/frontend-surface-dispatch.generated.json
            http-generic-api/openapi/frontend-runtime-routes.generated.yaml
            http-generic-api/openapi/openapi.custom-gpt.auth-dispatcher.yaml
            http-generic-api/openapi/openapi.custom-gpt.activation-admin.yaml
            http-generic-api/openapi/openapi.tenant-gpt.auth.yaml
            http-generic-api/openapi/openapi.tenant-gpt.activation.yaml
            http-generic-api/openapi.gpt-action.local-connector.yaml
          )

          gh_retry() {
            local out err rc
            out="$(mktemp)"; err="$(mktemp)"
            for n in $(seq 1 30); do
              : >"$out"; : >"$err"
              set +e; "$@" >"$out" 2>"$err"; rc=$?; set -e
              if [[ $rc -eq 0 ]]; then cat "$out"; rm -f "$out" "$err"; return 0; fi
              if grep -Eqi 'rate limit exceeded|HTTP 403|secondary rate limit' "$err"; then
                echo "GitHub API rate limited; backoff ${n}/30" >&2
                sleep 90
                continue
              fi
              cat "$err" >&2; rm -f "$out" "$err"; return "$rc"
            done
            cat "$err" >&2; rm -f "$out" "$err"
            echo '::error::GitHub API remained rate limited after bounded backoff' >&2
            return 1
          }

          if [[ -f "$WORKFLOW_PATH" ]]; then
            git rm "$WORKFLOW_PATH"
            git commit -m 'chore(ci): remove temporary convergent finalizer'
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

          align_artifacts_to_main() {
            local main_sha="$1"
            local changed=0
            for file in "${ARTIFACTS[@]}"; do
              if git cat-file -e "${main_sha}:${file}" 2>/dev/null; then
                git checkout "$main_sha" -- "$file"
              fi
            done
            if ! git diff --quiet; then
              git add -- "${ARTIFACTS[@]}"
              git diff --cached --check
              git commit -m 'chore(ci): align generated artifacts before latest-main sync'
              git push origin "HEAD:${TARGET_BRANCH}"
            fi
          }

          sync_main_server_side() {
            git fetch --no-tags origin \
              '+refs/heads/main:refs/remotes/origin/main' \
              "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
            git reset --hard "refs/remotes/origin/${TARGET_BRANCH}"
            local main_sha target_sha sync_pr mergeable
            main_sha="$(git rev-parse refs/remotes/origin/main)"
            target_sha="$(git rev-parse HEAD)"
            if git merge-base --is-ancestor "$main_sha" "$target_sha"; then return 0; fi

            align_artifacts_to_main "$main_sha"
            git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
            git reset --hard "refs/remotes/origin/${TARGET_BRANCH}"

            sync_pr="$(gh_retry gh pr list --repo "$REPOSITORY" --state open --head main --base "$TARGET_BRANCH" --limit 1 --json number --jq '.[0].number // empty')"
            if [[ -z "$sync_pr" ]]; then
              sync_pr="$(gh_retry gh api --method POST "repos/${REPOSITORY}/pulls" \
                -f title='chore: convergent finalizer sync latest main into PR 3265 branch' \
                -f head=main -f base="$TARGET_BRANCH" \
                -f body='Server-side governed freshness sync created by PR #3265 convergent finalizer. No force push, migration apply, deployment, provider call, credential read, or external write.' \
                --jq '.number')"
            fi

            mergeable=''
            for poll in $(seq 1 100); do
              mergeable="$(gh_retry gh api "repos/${REPOSITORY}/pulls/${sync_pr}" --jq '.mergeable // empty')"
              if [[ "$mergeable" == 'true' ]]; then break; fi
              sleep 3
            done
            if [[ "$mergeable" != 'true' ]]; then
              echo "::error::latest-main sync PR #${sync_pr} did not become mergeable"
              exit 1
            fi

            main_sha="$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')"
            gh_retry gh api --method PUT "repos/${REPOSITORY}/pulls/${sync_pr}/merge" \
              -f merge_method=merge -f sha="$main_sha" \
              -f commit_title='Merge latest main into PR #3265 branch' \
              -f commit_message='Governed server-side freshness sync by convergent finalizer.' \
              --jq 'select(.merged == true) | .sha'
            git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
            git reset --hard "refs/remotes/origin/${TARGET_BRANCH}"
          }

          generate_and_verify() {
            (
              cd http-generic-api
              node scripts/openapi-precise-contract-registry-sync.mjs --write
              node scripts/openapi-autofill-missing-routes.mjs --write
              npm run frontend:dispatch:generate -- --baseline-ref=main
              node scripts/generate-custom-gpt-schemas.mjs --write
              node test-openapi-autofill-missing-routes.mjs
              node test-frontend-operation-governance-generator.mjs
              node test-frontend-surface-dispatch.mjs
              node test-frontend-auth-openapi-parity.mjs
              node test-openapi-route-coverage.mjs
              npm run openapi:auth:check
              npm run schemas:guard
            )
            mapfile -t CHANGED < <(git status --porcelain --untracked-files=all | sed -E 's/^...//')
            if [[ ${#CHANGED[@]} -eq 0 ]]; then return 0; fi
            local unexpected=''
            for file in "${CHANGED[@]}"; do
              case "$file" in
                http-generic-api/openapi.yaml|\
                http-generic-api/frontend-operation-governance.generated.json|\
                http-generic-api/frontend-surface-dispatch.generated.json|\
                http-generic-api/openapi/frontend-runtime-routes.generated.yaml|\
                http-generic-api/openapi/openapi.custom-gpt.auth-dispatcher.yaml|\
                http-generic-api/openapi/openapi.custom-gpt.activation-admin.yaml|\
                http-generic-api/openapi/openapi.tenant-gpt.auth.yaml|\
                http-generic-api/openapi/openapi.tenant-gpt.activation.yaml|\
                http-generic-api/openapi.gpt-action.local-connector.yaml) ;;
                *) unexpected+="$file"$'\n' ;;
              esac
            done
            if [[ -n "$unexpected" ]]; then printf '%s' "$unexpected"; exit 1; fi
            git add -- "${CHANGED[@]}"; git diff --cached --check
            git commit -m 'chore(ci): refresh converged exact-head artifacts'
            git push origin "HEAD:${TARGET_BRANCH}"
          }

          run_exact_ci() {
            local head_sha="$1" dispatched run_id deadline json status conclusion
            dispatched="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh_retry gh workflow run ci.yml --ref "$TARGET_BRANCH" >/dev/null
            run_id=''
            for lookup in $(seq 1 50); do
              run_id="$(gh_retry gh run list --workflow ci.yml --branch "$TARGET_BRANCH" --event workflow_dispatch --limit 30 --json databaseId,headSha,createdAt --jq "map(select(.headSha == \"$head_sha\" and .createdAt >= \"$dispatched\"))[0].databaseId // empty")"
              if [[ -n "$run_id" ]]; then break; fi
              sleep 6
            done
            [[ -n "$run_id" ]] || { echo '::error::exact CI run not found'; exit 1; }
            deadline="$(( $(date +%s) + 7200 ))"; json=''
            while (( $(date +%s) < deadline )); do
              json="$(gh_retry gh run view "$run_id" --json databaseId,event,headSha,status,conclusion,jobs)"
              status="$(jq -r '.status // ""' <<<"$json")"; conclusion="$(jq -r '.conclusion // ""' <<<"$json")"
              if [[ "$status" == completed ]]; then
                [[ "$conclusion" == success ]] || { echo "::error::exact CI failed: $conclusion"; exit 1; }
                break
              fi
              sleep 25
            done
            [[ "$(jq -r '.event' <<<"$json")" == workflow_dispatch ]]
            [[ "$(jq -r '.headSha' <<<"$json")" == "$head_sha" ]]
            for required in 'Syntax Check' 'Unit & Integration Tests' 'Execution Resolver Gate' 'Architecture Drift Detection'; do
              jq -e --arg required "$required" '.jobs | any(.name == $required and .conclusion == "success")' <<<"$json" >/dev/null
            done
          }

          for attempt in $(seq 1 12); do
            echo "convergent_finalizer_attempt=${attempt}"
            sync_main_server_side
            generate_and_verify
            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
            BASE_SHA="$(git rev-parse refs/remotes/origin/main)"; HEAD_SHA="$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})"
            if ! git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; then continue; fi
            run_exact_ci "$HEAD_SHA"
            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
            [[ "$(git rev-parse refs/remotes/origin/main)" == "$BASE_SHA" ]] || continue
            [[ "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" == "$HEAD_SHA" ]] || continue
            PR_JSON="$(gh_retry gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
            if [[ "$(jq -r '.state' <<<"$PR_JSON")" != open ]]; then exit 0; fi
            [[ "$(jq -r '.head.sha' <<<"$PR_JSON")" == "$HEAD_SHA" ]]
            [[ "$(jq -r '.base.sha' <<<"$PR_JSON")" == "$BASE_SHA" ]]
            MERGE_JSON="$(gh_retry gh api --method PUT "repos/${REPOSITORY}/pulls/${PR_NUMBER}/merge" \
              -f merge_method=merge -f sha="$HEAD_SHA" \
              -f commit_title='Merge PR #3265: require Production resync after every main movement' \
              -f commit_message='Exact-head CI and latest-main freshness verified by convergent finalizer. Migration remains separately governed.')"
            jq -e '.merged == true' <<<"$MERGE_JSON" >/dev/null && { echo "$MERGE_JSON"; exit 0; }
          done
          echo '::error::convergent finalizer exhausted attempts'; exit 1
