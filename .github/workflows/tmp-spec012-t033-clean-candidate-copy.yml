name: Temporary Spec 012 T033 Clean Candidate Copy

on:
  push:
    branches:
      - gpt/spec-012-t033-short-lived-bearer-profile-v2-20260804
    paths:
      - .github/workflows/tmp-spec012-t033-clean-candidate-copy.yml

permissions:
  contents: write

concurrency:
  group: spec012-t033-clean-candidate-copy
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: gpt/spec-012-t033-short-lived-bearer-profile-v2-20260804

      - name: Copy reviewed T033 scope from reconciled source
        shell: bash
        env:
          TARGET_BRANCH: gpt/spec-012-t033-short-lived-bearer-profile-v2-20260804
          SOURCE_BRANCH: gpt/spec-012-t033-short-lived-bearer-profile-20260804
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          git fetch --no-tags origin "+refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"
          paths=(
            http-generic-api/routes/tenantGptOAuthTokenExchangeRoutes.js
            http-generic-api/scripts/manifests/test-manifest-spec012.mjs
            http-generic-api/tenantGptAccessTokenProfile.js
            http-generic-api/tenantGptAccessTokenVerifier.js
            http-generic-api/tenantGptOAuthTokenExchangeBindingGuard.js
            http-generic-api/test-spec012-t033-short-lived-bearer-profile.mjs
            http-generic-api/test-tenant-gpt-access-token-profile.mjs
            http-generic-api/test-tenant-gpt-access-token-verifier.mjs
            http-generic-api/test-tenant-gpt-oauth-token-binding-hardening.mjs
            http-generic-api/test-tenant-gpt-oauth-token-exchange-routes.mjs
            specs/012-tenant-activation-lifecycle/implementation/pr-2o-t033-short-lived-bearer-profile.json
            specs/012-tenant-activation-lifecycle/implementation/pr-2o-t033-short-lived-bearer-profile.md
          )
          git checkout "refs/remotes/origin/${SOURCE_BRANCH}" -- "${paths[@]}"
          test "$(git status --porcelain | wc -l)" -eq 12
          test -z "$(git status --porcelain | grep '^.. \.github/' || true)"
          node --check http-generic-api/routes/tenantGptOAuthTokenExchangeRoutes.js
          node --check http-generic-api/tenantGptAccessTokenProfile.js
          node --check http-generic-api/tenantGptAccessTokenVerifier.js
          node --check http-generic-api/tenantGptOAuthTokenExchangeBindingGuard.js
          node --check http-generic-api/test-spec012-t033-short-lived-bearer-profile.mjs
          node --check http-generic-api/test-tenant-gpt-access-token-profile.mjs
          node --check http-generic-api/test-tenant-gpt-access-token-verifier.mjs
          node --check http-generic-api/test-tenant-gpt-oauth-token-binding-hardening.mjs
          node --check http-generic-api/test-tenant-gpt-oauth-token-exchange-routes.mjs
          git diff --check
          grep -q 'oauth_token_exchange_crypto_dependencies_required' http-generic-api/routes/tenantGptOAuthTokenExchangeRoutes.js
          grep -q 'const decodeCode = deps.decodeCode' http-generic-api/routes/tenantGptOAuthTokenExchangeRoutes.js
          grep -q 'access_token: event.access_token || null' http-generic-api/routes/tenantGptOAuthTokenExchangeRoutes.js
          grep -q 'expires_in: accessTokenTtlSeconds' http-generic-api/routes/tenantGptOAuthTokenExchangeRoutes.js
          ! grep -q 'USER_TOKEN_TTL_SECONDS' http-generic-api/routes/tenantGptOAuthTokenExchangeRoutes.js
          ! grep -q 'from "jsonwebtoken"' http-generic-api/routes/tenantGptOAuthTokenExchangeRoutes.js

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "${paths[@]}"
          git commit -m "feat(spec-012): rebuild clean T033 bearer-profile candidate"
          remote_head="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
