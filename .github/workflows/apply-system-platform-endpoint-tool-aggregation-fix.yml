name: Apply system platform endpoint aggregation fix

on:
  push:
    branches:
      - gpt/fix-system-platform-endpoint-tool-aggregation-20260801

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gpt/fix-system-platform-endpoint-tool-aggregation-20260801
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply bounded source and regression patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          route_path = Path('http-generic-api/routes/systemLayerRoutes.js')
          test_path = Path('http-generic-api/test-system-tool-catalog-v2.mjs')
          module_path = Path('http-generic-api/platformEndpointToolAggregation.js')
          workflow_path = Path('.github/workflows/apply-system-platform-endpoint-tool-aggregation-fix.yml')

          module_path.write_text(r'''function normalizedText(value) {
            return String(value || "").trim();
          }

          function uniqueSorted(values = []) {
            return [...new Set(values.map(normalizedText).filter(Boolean))].sort();
          }

          function endpointSelectorSchema(values = []) {
            const endpointKeys = uniqueSorted(values);
            return {
              type: "string",
              enum: endpointKeys,
            };
          }

          function parentActionSelectorSchema(values = []) {
            const parentActionKeys = uniqueSorted(values);
            if (parentActionKeys.length === 1) {
              return { type: "string", const: parentActionKeys[0], default: parentActionKeys[0] };
            }
            return { type: "string", enum: parentActionKeys };
          }

          function groupedDispatcherInputSchema(rows = []) {
            return {
              type: "object",
              required: ["endpoint_key"],
              properties: {
                parent_action_key: parentActionSelectorSchema(rows.map((row) => row.parent_action_key)),
                endpoint_key: endpointSelectorSchema(rows.map((row) => row.endpoint_key)),
                path_params: { type: "object", additionalProperties: true },
                query: { type: "object", additionalProperties: true },
                body: { type: "object", additionalProperties: true },
                headers: { type: "object", additionalProperties: true },
                credential_scope: { type: "string", enum: ["platform", "tenant", "user", "connection", "auto"] },
                connection_id: { type: "string" },
                app_key: { type: "string" },
                scopes: { type: "array", items: { type: "string" } },
                auth_type: { type: "string" },
                allow_platform_fallback: { type: "boolean" },
                auth_context: { type: "object", additionalProperties: true },
                mutation_approval: { type: "object", additionalProperties: true },
                dry_run: { type: "boolean" },
                preflight_only: { type: "boolean" },
                dry_run_preflight_completed: { type: "boolean" },
                approved_preflight_dry_run_validated: { type: "boolean" },
                live_execution_approved: { type: "boolean" },
                readback: { type: "object", additionalProperties: true },
                timeout_seconds: { type: "integer", minimum: 1, maximum: 120 },
              },
              additionalProperties: false,
            };
          }

          function bindingMetadata(row = {}, normalizeInputSchema = (value) => value) {
            return {
              parent_action_key: normalizedText(row.parent_action_key),
              endpoint_key: normalizedText(row.endpoint_key),
              scope_class: normalizedText(row.scope_class) || null,
              method: normalizedText(row.method).toUpperCase() || null,
              inputSchema: normalizeInputSchema(row.input_schema_json),
            };
          }

          export function aggregatePlatformEndpointToolRows(rows = [], options = {}) {
            const existingNames = options.existingNames instanceof Set
              ? options.existingNames
              : new Set(options.existingNames || []);
            const blockedNames = options.blockedNames instanceof Set
              ? options.blockedNames
              : new Set(options.blockedNames || []);
            const isAdmin = options.isAdmin === true;
            const normalizeInputSchema = typeof options.normalizeInputSchema === "function"
              ? options.normalizeInputSchema
              : (value) => value;
            const groups = new Map();

            for (const row of Array.isArray(rows) ? rows : []) {
              const toolName = normalizedText(row?.tool_name);
              const endpointKey = normalizedText(row?.endpoint_key);
              const parentActionKey = normalizedText(row?.parent_action_key);
              if (!toolName || !endpointKey || !parentActionKey) continue;
              if (existingNames.has(toolName)) continue;
              if (!isAdmin && blockedNames.has(toolName)) continue;
              if (!groups.has(toolName)) groups.set(toolName, []);
              groups.get(toolName).push(row);
            }

            return [...groups.entries()]
              .sort(([left], [right]) => left.localeCompare(right))
              .map(([toolName, groupRows]) => {
                const sortedRows = [...groupRows].sort((left, right) =>
                  `${normalizedText(left.parent_action_key)}\u0000${normalizedText(left.endpoint_key)}\u0000${normalizedText(left.scope_class)}`
                    .localeCompare(`${normalizedText(right.parent_action_key)}\u0000${normalizedText(right.endpoint_key)}\u0000${normalizedText(right.scope_class)}`));
                const bindings = sortedRows.map((row) => bindingMetadata(row, normalizeInputSchema));
                const endpointKeys = uniqueSorted(bindings.map((binding) => binding.endpoint_key));
                const parentActionKeys = uniqueSorted(bindings.map((binding) => binding.parent_action_key));
                return {
                  name: toolName,
                  description: `Registry endpoint dispatcher ${toolName} with ${bindings.length} governed endpoint binding${bindings.length === 1 ? "" : "s"}.`,
                  requires_admin: sortedRows.every((row) => normalizedText(row.scope_class) === "admin"),
                  inputSchema: groupedDispatcherInputSchema(sortedRows),
                  x_platform_endpoint: {
                    source: "platform_endpoint_tool_exports",
                    grouped: true,
                    endpoint_count: bindings.length,
                    parent_action_keys: parentActionKeys,
                    endpoint_keys: endpointKeys,
                    bindings,
                  },
                };
              });
          }

          function selectionError(status, code, message, details = {}) {
            const error = new Error(message);
            error.status = status;
            error.code = code;
            error.details = { ...details, secrets_included: false };
            return error;
          }

          export function resolvePlatformEndpointToolBinding(rows = [], options = {}) {
            const toolName = normalizedText(options.toolName);
            const args = options.args && typeof options.args === "object" ? options.args : {};
            const candidates = (Array.isArray(rows) ? rows : [])
              .filter((row) => normalizedText(row?.tool_name) === toolName)
              .sort((left, right) =>
                `${normalizedText(left.parent_action_key)}\u0000${normalizedText(left.endpoint_key)}`
                  .localeCompare(`${normalizedText(right.parent_action_key)}\u0000${normalizedText(right.endpoint_key)}`));
            if (!candidates.length) return null;

            const requestedEndpointKey = normalizedText(args.endpoint_key);
            const requestedParentActionKey = normalizedText(args.parent_action_key);
            const allowedEndpointKeys = uniqueSorted(candidates.map((row) => row.endpoint_key));

            if (candidates.length > 1 && !requestedEndpointKey) {
              throw selectionError(
                400,
                "platform_endpoint_tool_endpoint_key_required",
                "This grouped platform endpoint tool requires endpoint_key.",
                { tool_name: toolName, allowed_endpoint_keys: allowedEndpointKeys },
              );
            }

            let matches = requestedEndpointKey
              ? candidates.filter((row) => normalizedText(row.endpoint_key) === requestedEndpointKey)
              : candidates;
            if (!matches.length) {
              throw selectionError(
                400,
                "platform_endpoint_tool_endpoint_key_not_allowed",
                "endpoint_key is not exported by this platform endpoint tool.",
                { tool_name: toolName, endpoint_key: requestedEndpointKey || null, allowed_endpoint_keys: allowedEndpointKeys },
              );
            }

            if (requestedParentActionKey) {
              const parentMatches = matches.filter((row) => normalizedText(row.parent_action_key) === requestedParentActionKey);
              if (!parentMatches.length) {
                throw selectionError(
                  400,
                  "platform_endpoint_tool_parent_action_mismatch",
                  "parent_action_key does not match the selected endpoint export.",
                  {
                    tool_name: toolName,
                    endpoint_key: requestedEndpointKey || normalizedText(matches[0]?.endpoint_key),
                    parent_action_key: requestedParentActionKey,
                    allowed_parent_action_keys: uniqueSorted(matches.map((row) => row.parent_action_key)),
                  },
                );
              }
              matches = parentMatches;
            }

            if (matches.length > 1) {
              throw selectionError(
                409,
                "platform_endpoint_tool_binding_ambiguous",
                "The selected platform endpoint tool binding is ambiguous.",
                {
                  tool_name: toolName,
                  endpoint_key: requestedEndpointKey || null,
                  candidate_count: matches.length,
                  parent_action_keys: uniqueSorted(matches.map((row) => row.parent_action_key)),
                },
              );
            }

            return matches[0];
          }
          ''', encoding='utf-8')

          route = route_path.read_text(encoding='utf-8')
          import_anchor = 'import { writeResourceRecipeApplyEvidence } from "../resourceRecipeApplyEvidence.js";\n'
          aggregation_import = '''import {
            aggregatePlatformEndpointToolRows,
            resolvePlatformEndpointToolBinding,
          } from "../platformEndpointToolAggregation.js";
          '''
          if aggregation_import not in route:
            if import_anchor not in route:
              raise SystemExit('system route import anchor missing')
            route = route.replace(import_anchor, import_anchor + aggregation_import, 1)

          list_start = route.index('async function listPlatformEndpointToolsForPrincipal(')
          list_end = route.index('\nfunction isTenantRegistryToolAllowedInSystemFacade', list_start)
          list_replacement = r'''async function listPlatformEndpointToolsForPrincipal(auth, existingNames = new Set()) {
            try {
              const scopeClasses = platformEndpointToolScopeClassesForPrincipal(auth);
              const tenantClause = platformEndpointToolTenantClauseForPrincipal(auth, "x");
              const [rows] = await getPool().query(
                `SELECT x.tool_name,
                        x.parent_action_key,
                        x.endpoint_key,
                        x.scope_class,
                        x.input_schema_json,
                        e.method
                   FROM platform_endpoint_tool_exports x
                   LEFT JOIN endpoints e
                     ON e.parent_action_key = x.parent_action_key
                    AND e.endpoint_key = x.endpoint_key
                    AND e.status = 'active'
                  WHERE x.status = 'active'
                    AND x.scope_class IN (?, ?)
                    ${tenantClause.sql}
                  ORDER BY x.tool_name, x.parent_action_key, x.endpoint_key`,
                [...scopeClasses, ...tenantClause.params]
              );

              return aggregatePlatformEndpointToolRows(rows, {
                existingNames,
                blockedNames: TENANT_BLOCKED_SYSTEM_TOOL_NAMES,
                isAdmin: isAdminPrincipal(auth),
                normalizeInputSchema: normalizePlatformEndpointInputSchema,
              });
            } catch (err) {
              console.error("[systemLayerTools] Failed to list platform endpoint exports:", err?.message || err);
              return [];
            }
          }
          '''
          route = route[:list_start] + list_replacement + route[list_end:]

          call_start = route.index('async function callPlatformEndpointToolIfAvailable(')
          call_end = route.index('\nasync function callTenantEndpointRegistryToolIfAvailable', call_start)
          call_replacement = r'''async function callPlatformEndpointToolIfAvailable(name, args = {}, auth = null, deps = {}) {
            if (!isAdminPrincipal(auth) && TENANT_BLOCKED_SYSTEM_TOOL_NAMES.has(String(name || "").trim())) {
              const err = new Error("Tenant system tools cannot dispatch admin-only or state-changing platform routes.");
              err.status = 403;
              err.code = "tenant_system_tool_route_not_allowed";
              throw err;
            }

            const scopeClasses = platformEndpointToolScopeClassesForPrincipal(auth);
            const tenantClause = platformEndpointToolTenantClauseForPrincipal(auth, "x");
            const [rows] = await getPool().query(
              `SELECT x.tool_name,
                      x.parent_action_key,
                      x.endpoint_key,
                      x.scope_class,
                      e.method
                 FROM platform_endpoint_tool_exports x
                 LEFT JOIN endpoints e
                   ON e.parent_action_key = x.parent_action_key
                  AND e.endpoint_key = x.endpoint_key
                  AND e.status = 'active'
                WHERE x.tool_name = ?
                  AND x.status = 'active'
                  AND x.scope_class IN (?, ?)
                  ${tenantClause.sql}
                ORDER BY x.parent_action_key, x.endpoint_key`,
              [name, ...scopeClasses, ...tenantClause.params]
            );

            const row = resolvePlatformEndpointToolBinding(rows, { toolName: name, args });
            if (!row) return { handled: false };

            if (row.scope_class === "admin" && !isAdminPrincipal(auth)) {
              const err = new Error("This platform endpoint tool requires admin access.");
              err.status = 403;
              err.code = "platform_endpoint_tool_admin_required";
              throw err;
            }

            const payload = normalizePlatformEndpointCallArgs(row, args, auth);
            const result = await callRuntimeEndpointViaFacade(payload, deps);
            return { handled: true, result };
          }
          '''
          route = route[:call_start] + call_replacement + route[call_end:]

          old_optional = 'for (const optionalAuthField of ["user_id", "tenant_id", "target_key", "brand_key", "brand_domain", "credential_scope", "connection_id", "app_key", "scopes", "auth_type", "allow_platform_fallback", "auth_context", "dry_run"]) {'
          new_optional = 'for (const optionalAuthField of ["user_id", "tenant_id", "target_key", "brand_key", "brand_domain", "credential_scope", "connection_id", "app_key", "scopes", "auth_type", "allow_platform_fallback", "auth_context", "mutation_approval", "dry_run", "preflight_only", "dry_run_preflight_completed", "approved_preflight_dry_run_validated", "live_execution_approved", "expect_json", "execution_trace_id", "source_layer"]) {'
          if old_optional not in route:
            raise SystemExit('platform optional dispatch field anchor missing')
          route = route.replace(old_optional, new_optional, 1)
          route_path.write_text(route, encoding='utf-8')

          test = test_path.read_text(encoding='utf-8')
          test_import_anchor = '} from "./systemToolCatalogV2.js";\n'
          test_import = '''import {
            aggregatePlatformEndpointToolRows,
            resolvePlatformEndpointToolBinding,
          } from "./platformEndpointToolAggregation.js";
          '''
          if test_import not in test:
            if test_import_anchor not in test:
              raise SystemExit('catalog test import anchor missing')
            test = test.replace(test_import_anchor, test_import_anchor + test_import, 1)

          assertion_anchor = 'const legacy = listSystemToolCatalog(tools.slice(0, 80), {}, { legacyCompleteDefault: true });\n'
          assertions = r'''const platformEndpointRows = [
            {
              tool_name: "github_rest_endpoint_dispatch",
              parent_action_key: "github_api_mcp",
              endpoint_key: "github_update_pull_request",
              scope_class: "admin",
              method: "PATCH",
              input_schema_json: JSON.stringify({ type: "object", properties: { pull_number: { type: "integer" } } }),
            },
            {
              tool_name: "github_rest_endpoint_dispatch",
              parent_action_key: "github_api_mcp",
              endpoint_key: "github_list_issue_labels",
              scope_class: "admin",
              method: "GET",
              input_schema_json: JSON.stringify({ type: "object", properties: { issue_number: { type: "integer" } } }),
            },
            {
              tool_name: "github_rest_endpoint_dispatch",
              parent_action_key: "github_api_mcp",
              endpoint_key: "github_add_issue_labels",
              scope_class: "admin",
              method: "POST",
              input_schema_json: JSON.stringify({ type: "object", properties: { labels: { type: "array" } } }),
            },
          ];
          const groupedPlatformTools = aggregatePlatformEndpointToolRows(platformEndpointRows, {
            isAdmin: true,
            normalizeInputSchema: (value) => JSON.parse(value),
          });
          assert.equal(groupedPlatformTools.length, 1, "same-name platform exports must become one public descriptor");
          assert.equal(groupedPlatformTools[0].name, "github_rest_endpoint_dispatch");
          assert.deepEqual(groupedPlatformTools[0].inputSchema.required, ["endpoint_key"]);
          assert.deepEqual(groupedPlatformTools[0].inputSchema.properties.endpoint_key.enum, [
            "github_add_issue_labels",
            "github_list_issue_labels",
            "github_update_pull_request",
          ]);
          assert.equal(groupedPlatformTools[0].x_platform_endpoint.endpoint_count, 3);
          assert.equal(groupedPlatformTools[0].x_platform_endpoint.bindings.length, 3);
          assert.doesNotThrow(
            () => listSystemToolCatalog(groupedPlatformTools, { limit: 10 }),
            "grouped platform exports must not reach catalog normalization as divergent duplicate names",
          );

          const selectedPlatformBinding = resolvePlatformEndpointToolBinding(platformEndpointRows, {
            toolName: "github_rest_endpoint_dispatch",
            args: { endpoint_key: "github_add_issue_labels", parent_action_key: "github_api_mcp" },
          });
          assert.equal(selectedPlatformBinding.endpoint_key, "github_add_issue_labels");
          assert.throws(
            () => resolvePlatformEndpointToolBinding(platformEndpointRows, {
              toolName: "github_rest_endpoint_dispatch",
              args: {},
            }),
            (error) => error.code === "platform_endpoint_tool_endpoint_key_required"
              && error.status === 400
              && error.details.allowed_endpoint_keys.length === 3,
          );
          assert.throws(
            () => resolvePlatformEndpointToolBinding(platformEndpointRows, {
              toolName: "github_rest_endpoint_dispatch",
              args: { endpoint_key: "github_unknown_endpoint" },
            }),
            (error) => error.code === "platform_endpoint_tool_endpoint_key_not_allowed" && error.status === 400,
          );
          assert.throws(
            () => resolvePlatformEndpointToolBinding(platformEndpointRows, {
              toolName: "github_rest_endpoint_dispatch",
              args: { endpoint_key: "github_add_issue_labels", parent_action_key: "another_parent" },
            }),
            (error) => error.code === "platform_endpoint_tool_parent_action_mismatch" && error.status === 400,
          );

          '''
          if assertions not in test:
            if assertion_anchor not in test:
              raise SystemExit('catalog test assertion anchor missing')
            test = test.replace(assertion_anchor, assertions + assertion_anchor, 1)
          test_path.write_text(test, encoding='utf-8')

          workflow_path.unlink()
          PY
      - name: Run focused checks
        run: |
          node --check http-generic-api/platformEndpointToolAggregation.js
          node --check http-generic-api/routes/systemLayerRoutes.js
          node http-generic-api/test-system-tool-catalog-v2.mjs
      - name: Commit bounded fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add http-generic-api/platformEndpointToolAggregation.js \
                  http-generic-api/routes/systemLayerRoutes.js \
                  http-generic-api/test-system-tool-catalog-v2.mjs \
                  .github/workflows/apply-system-platform-endpoint-tool-aggregation-fix.yml
          git commit -m "fix(system-tools): aggregate shared endpoint exports"
          git push origin HEAD:gpt/fix-system-platform-endpoint-tool-aggregation-20260801
