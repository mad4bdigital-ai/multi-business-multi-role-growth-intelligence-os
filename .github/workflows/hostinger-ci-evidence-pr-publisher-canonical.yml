name: Hostinger Canonical Evidence PR Publisher

on:
  workflow_run:
    workflows:
      - Hostinger Storage Tenant Canary Guard
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: hostinger-canonical-evidence-pr-publisher-${{ github.event.workflow_run.head_sha || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.head_sha != null &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Download Hostinger Tenant Canary canonical report
        uses: actions/download-artifact@v4
        with:
          name: hostinger-storage-tenant-canary-${{ github.event.workflow_run.id }}-summary
          path: ${{ runner.temp }}/canonical
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Publish authoritative Hostinger evidence comment
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPORT_PATH: ${{ runner.temp }}/canonical/hostinger-storage-tenant-canary-summary.json
        run: |
          set -euo pipefail
          args=(
            --repository "${GITHUB_REPOSITORY}"
            --workflow-conclusion "${WORKFLOW_CONCLUSION}"
            --report "${REPORT_PATH}"
            --workflow-run-id "${WORKFLOW_RUN_ID}"
            --source-head-sha "${SOURCE_HEAD_SHA}"
          )
          if [[ -n "${PR_NUMBER:-}" ]]; then
            args+=(--pr-number "${PR_NUMBER}")
          fi
          if [[ -n "${HEAD_BRANCH:-}" ]]; then
            args+=(--head-branch "${HEAD_BRANCH}")
          fi
          node http-generic-api/scripts/hostinger-ci-evidence-pr-comment.mjs "${args[@]}"
