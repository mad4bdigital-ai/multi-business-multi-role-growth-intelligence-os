name: Transport Response Schema Promotion Readiness Writer

on:
  push:
    branches:
      - fix/transport-response-schema-promotion-readiness-20260806
    paths:
      - .github/workflows/transport-response-schema-promotion-readiness-writer.yml

permissions:
  contents: write

concurrency:
  group: transport-response-schema-promotion-readiness-writer
  cancel-in-progress: false

jobs:
  write:
    if: github.repository == 'mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os' && github.ref == 'refs/heads/fix/transport-response-schema-promotion-readiness-20260806'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact writer branch
        uses: actions/checkout@v5
        with:
          ref: fix/transport-response-schema-promotion-readiness-20260806
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install generator dependencies
        working-directory: http-generic-api
        run: npm ci --ignore-scripts

      - name: Apply bounded documentation and safety-marker repair
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          migration = Path('http-generic-api/migrations/1048_transport_response_chunk_schema_recovery.sql')
          source = migration.read_text(encoding='utf-8')
          old = """-- Safety: additive and idempotent. No provider calls, credential reads, external sends,
          -- destructive DDL, data backfill, or secret-bearing payloads. secrets_included=false.
          """
          new = """-- Safety: additive and idempotent. No provider calls, credential reads, external sends,
          -- destructive DDL, data backfill, or secret-bearing payloads. secrets_included=false.
          -- Explicit safety markers: no_provider_call, no_credential_payload_read, no_raw_secrets,
          -- no_external_send, no_external_write, secrets_included_false.
          """
          if old not in source:
              raise SystemExit('expected migration safety block not found')
          source = source.replace(old, new, 1)
          migration.write_text(source, encoding='utf-8')

          docs = [
              Path('Updating Registry Patch Index.md'),
              Path('deployment_parity_checklist.md'),
              Path('docs/ai-docs-agent-governance.md'),
              Path('docs/auto-docs-agent/README.md'),
              Path('docs/change-documentation-governance.md'),
          ]
          marker = '1048_transport_response_chunk_schema_recovery.sql'
          paragraph = (
              '> Transport response-chunk schema recovery: `1048_transport_response_chunk_schema_recovery.sql` '
              'additively and idempotently creates or reconciles the sixteen runtime-required '
              '`governed_tool_response_chunks` columns, bounded owner/expiry indexes, and '
              '`v_governed_response_chunk_transport_schema_readiness`. It performs no provider call, '
              'credential payload read, raw-secret access, external send/write, deployment, runtime mutation, '
              'or destructive data operation and declares `secrets_included=false`. Repository merge is not '
              'migration-Apply authority; completion requires a separately authorized checksum-bound preflight/Apply '
              'and same-cycle readback proving `required_column_count=16`, `present_column_count=16`, and '
              '`readiness_status=ready` before Production runtime promotion.\n'
          )
          for path in docs:
              body = path.read_text(encoding='utf-8')
              if marker in body:
                  continue
              first_newline = body.find('\n')
              if first_newline < 0:
                  raise SystemExit(f'missing heading newline in {path}')
              body = body[:first_newline + 1] + '\n' + paragraph + body[first_newline + 1:]
              path.write_text(body, encoding='utf-8')
          PY

      - name: Regenerate surface-contract evidence
        working-directory: http-generic-api
        run: node scripts/surface-contract-discovery.mjs --write

      - name: Verify migration regression
        working-directory: http-generic-api
        run: node test-transport-response-chunk-schema-recovery.mjs

      - name: Verify generated surface-contract readback
        working-directory: http-generic-api
        run: node scripts/surface-contract-discovery.mjs --check

      - name: Verify migration left the gap queue
        shell: bash
        run: |
          set -Eeuo pipefail
          ! grep -q '### .*1048_transport_response_chunk_schema_recovery.sql' docs/surface-contract-gap-queue.md

      - name: Verify five governance documentation targets
        shell: bash
        run: |
          set -Eeuo pipefail
          for target in \
            'Updating Registry Patch Index.md' \
            'deployment_parity_checklist.md' \
            'docs/ai-docs-agent-governance.md' \
            'docs/auto-docs-agent/README.md' \
            'docs/change-documentation-governance.md'; do
            grep -q '1048_transport_response_chunk_schema_recovery.sql' "$target"
          done

      - name: Verify six explicit safety markers
        shell: bash
        run: |
          set -Eeuo pipefail
          for marker in no_provider_call no_credential_payload_read no_raw_secrets no_external_send no_external_write secrets_included_false; do
            grep -q "$marker" http-generic-api/migrations/1048_transport_response_chunk_schema_recovery.sql
          done

      - name: Commit bounded repair and remove writer
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow='.github/workflows/transport-response-schema-promotion-readiness-writer.yml'
          git rm "$workflow"
          git add \
            'http-generic-api/migrations/1048_transport_response_chunk_schema_recovery.sql' \
            'Updating Registry Patch Index.md' \
            'deployment_parity_checklist.md' \
            'docs/ai-docs-agent-governance.md' \
            'docs/auto-docs-agent/README.md' \
            'docs/change-documentation-governance.md' \
            'docs/surface-contract-discovery-status.md' \
            'docs/surface-contract-discovery-status.json' \
            'docs/surface-contract-gap-queue.md' \
            'docs/surface-contract-gap-queue.json' \
            'docs/surface-contract-safety-attestations.json'

          unexpected="$(git diff --cached --name-only | grep -Ev '^(http-generic-api/migrations/1048_transport_response_chunk_schema_recovery\.sql|Updating Registry Patch Index\.md|deployment_parity_checklist\.md|docs/ai-docs-agent-governance\.md|docs/auto-docs-agent/README\.md|docs/change-documentation-governance\.md|docs/surface-contract-discovery-status\.(md|json)|docs/surface-contract-gap-queue\.(md|json)|docs/surface-contract-safety-attestations\.json|\.github/workflows/transport-response-schema-promotion-readiness-writer\.yml)$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected staged paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(transport): close response chunk schema promotion gaps'
          git push origin HEAD:fix/transport-response-schema-promotion-readiness-20260806
