name: Verify Runtime

on:
  workflow_dispatch:
    inputs:
      runtime_base_url:
        description: "Base URL of the deployed runtime (e.g. https://your-deployment.example.com)"
        required: true
        type: string
      environment_label:
        description: "Label for this deployment (e.g. staging, production)"
        required: false
        default: "unspecified"
        type: string
      runtime_profile:
        description: "Expected runtime shape: api_only, queue_worker, or custom"
        required: false
        default: "api_only"
        type: string
      expect_queue_available:
        description: "Whether this deployment is expected to have live Redis/BullMQ queue connectivity. Leave blank to derive from runtime_profile."
        required: false
        default: ""
        type: string
      expect_worker_enabled:
        description: "Whether this runtime instance is expected to run the BullMQ worker. Leave blank to derive from runtime_profile."
        required: false
        default: ""
        type: string
      verify_execution_log_row:
        description: "Whether to verify latest Execution Log Unified row parity"
        required: false
        default: "false"
        type: string
      execution_log_verify_path:
        description: "Runtime endpoint that returns the latest Execution Log Unified row"
        required: false
        default: "/governance/execution-log-latest"
        type: string
      allow_environment_access_blocked:
        description: "Allow clean skip when GitHub-hosted runner is blocked by hosting bot verification and same-cycle platform evidence exists"
        required: false
        default: "false"
        type: string
      run_repository_main_moved_fail_closed_smoke:
        description: "POST a no-secret GitHub push fixture and require the repository-main-moved ingress to fail closed with structured HTTP 503"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate-target:
    name: Allowlist exact runtime environment and destination
    runs-on: ubuntu-24.04
    outputs:
      target: ${{ steps.authorize.outputs.target }}
    steps:
      - name: Reject cross-environment or arbitrary endpoint before reading credentials
        id: authorize
        shell: bash
        env:
          RUNTIME_TARGET: ${{ inputs.runtime_base_url }}
          RUNTIME_ENVIRONMENT: ${{ inputs.environment_label }}
        run: |
          set -euo pipefail
          case "${RUNTIME_ENVIRONMENT}|${RUNTIME_TARGET}" in
            staging\|https://dev.mad4b.com)
              echo 'target=staging' >> "$GITHUB_OUTPUT"
              ;;
            production\|https://auth.mad4b.com)
              echo 'target=production' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error title=Runtime credential isolation::error_code=runtime_target_secret_scope_mismatch" >&2
              exit 1
              ;;
          esac

  verify-staging:
    name: Verify Windows Staging with repository credential
    needs: validate-target
    if: needs.validate-target.outputs.target == 'staging'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Record deployment context
        run: |
          echo "Environment:    ${{ inputs.environment_label }}"
          echo "Runtime URL:    ${{ inputs.runtime_base_url }}"
          echo "Commit:         ${{ github.sha }}"
          echo "Triggered by:   ${{ github.actor }}"
          echo "Triggered at:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Inspect execution-log sheet read attempts
        env:
          RUNTIME_BASE_URL: ${{ inputs.runtime_base_url }}
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
        run: |
          http_status="$(curl -sS --max-time 15 --proto '=https' \
            -o inspect.json -w '%{http_code}' \
            -H "Authorization: Bearer ${BACKEND_API_KEY}" \
            -H "Content-Type: application/json" \
            "${RUNTIME_BASE_URL}/governance/execution-log-latest-inspect")"
          echo "Execution-log inspection HTTP status: ${http_status}"
          # Keep response payload off GitHub Actions logs: it may contain private runtime data.

      - name: Run patch-vs-runtime verification
        working-directory: http-generic-api
        env:
          RUNTIME_BASE_URL: ${{ inputs.runtime_base_url }}
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
          RUNTIME_PROFILE: ${{ inputs.runtime_profile }}
          EXPECT_QUEUE_AVAILABLE: ${{ inputs.expect_queue_available }}
          EXPECT_WORKER_ENABLED: ${{ inputs.expect_worker_enabled }}
          VERIFY_EXECUTION_LOG_ROW: ${{ inputs.verify_execution_log_row }}
          EXECUTION_LOG_VERIFY_PATH: ${{ inputs.execution_log_verify_path }}
          ALLOW_ENVIRONMENT_ACCESS_BLOCKED: ${{ inputs.allow_environment_access_blocked }}
        run: node verify-runtime.mjs

      - name: Verify repository-main-moved fail-closed ingress
        id: repository_main_moved_smoke
        if: ${{ inputs.run_repository_main_moved_fail_closed_smoke == true }}
        working-directory: http-generic-api
        env:
          RUNTIME_BASE_URL: ${{ inputs.runtime_base_url }}
        run: node smoke-github-repository-main-moved-fail-closed.mjs

      - name: Summarize repository-main-moved smoke
        if: ${{ inputs.run_repository_main_moved_fail_closed_smoke == true && success() }}
        run: |
          echo "REPOSITORY MAIN MOVED FAIL-CLOSED SMOKE: PASS"
          echo "Delivery ID: ${{ steps.repository_main_moved_smoke.outputs.delivery_id }}"
          echo "HTTP status: ${{ steps.repository_main_moved_smoke.outputs.http_status }}"
          echo "Error code:  ${{ steps.repository_main_moved_smoke.outputs.error_code }}"

      - name: Confirm parity result
        if: success()
        run: |
          echo "DEPLOYMENT PARITY: PASS"
          echo "Commit ${{ github.sha }} has verified runtime alignment against ${{ inputs.runtime_base_url }}"

      - name: Report drift on failure
        if: failure()
        run: |
          echo "DEPLOYMENT PARITY: FAIL"
          echo "Runtime at ${{ inputs.runtime_base_url }} does not match expected behavior for commit ${{ github.sha }}"
          echo "Review the verify-runtime output above for drift class and resolution steps."
          exit 1

  verify-production:
    name: Verify Hostinger Production with environment credential
    needs: validate-target
    if: needs.validate-target.outputs.target == 'production'
    environment:
      name: Production
      deployment: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Record deployment context
        run: |
          echo "Environment:    ${{ inputs.environment_label }}"
          echo "Runtime URL:    ${{ inputs.runtime_base_url }}"
          echo "Commit:         ${{ github.sha }}"
          echo "Triggered by:   ${{ github.actor }}"
          echo "Triggered at:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Inspect execution-log sheet read attempts
        env:
          RUNTIME_BASE_URL: ${{ inputs.runtime_base_url }}
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
        run: |
          http_status="$(curl -sS --max-time 15 --proto '=https' \
            -o inspect.json -w '%{http_code}' \
            -H "Authorization: Bearer ${BACKEND_API_KEY}" \
            -H "Content-Type: application/json" \
            "${RUNTIME_BASE_URL}/governance/execution-log-latest-inspect")"
          echo "Execution-log inspection HTTP status: ${http_status}"
          # Keep response payload off GitHub Actions logs: it may contain private runtime data.

      - name: Run patch-vs-runtime verification
        working-directory: http-generic-api
        env:
          RUNTIME_BASE_URL: ${{ inputs.runtime_base_url }}
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
          RUNTIME_PROFILE: ${{ inputs.runtime_profile }}
          EXPECT_QUEUE_AVAILABLE: ${{ inputs.expect_queue_available }}
          EXPECT_WORKER_ENABLED: ${{ inputs.expect_worker_enabled }}
          VERIFY_EXECUTION_LOG_ROW: ${{ inputs.verify_execution_log_row }}
          EXECUTION_LOG_VERIFY_PATH: ${{ inputs.execution_log_verify_path }}
          ALLOW_ENVIRONMENT_ACCESS_BLOCKED: ${{ inputs.allow_environment_access_blocked }}
        run: node verify-runtime.mjs

      - name: Verify repository-main-moved fail-closed ingress
        id: repository_main_moved_smoke
        if: ${{ inputs.run_repository_main_moved_fail_closed_smoke == true }}
        working-directory: http-generic-api
        env:
          RUNTIME_BASE_URL: ${{ inputs.runtime_base_url }}
        run: node smoke-github-repository-main-moved-fail-closed.mjs

      - name: Summarize repository-main-moved smoke
        if: ${{ inputs.run_repository_main_moved_fail_closed_smoke == true && success() }}
        run: |
          echo "REPOSITORY MAIN MOVED FAIL-CLOSED SMOKE: PASS"
          echo "Delivery ID: ${{ steps.repository_main_moved_smoke.outputs.delivery_id }}"
          echo "HTTP status: ${{ steps.repository_main_moved_smoke.outputs.http_status }}"
          echo "Error code:  ${{ steps.repository_main_moved_smoke.outputs.error_code }}"

      - name: Confirm parity result
        if: success()
        run: |
          echo "DEPLOYMENT PARITY: PASS"
          echo "Commit ${{ github.sha }} has verified runtime alignment against ${{ inputs.runtime_base_url }}"

      - name: Report drift on failure
        if: failure()
        run: |
          echo "DEPLOYMENT PARITY: FAIL"
          echo "Runtime at ${{ inputs.runtime_base_url }} does not match expected behavior for commit ${{ github.sha }}"
          echo "Review the verify-runtime output above for drift class and resolution steps."
          exit 1
