name: Surface Contract Auto Remediation

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact current main SHA to remediate
        required: true
        type: string
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/surface-contract-auto-remediation.yml"
      - "http-generic-api/migrations/**"
      - "http-generic-api/scripts/surface-contract-*.mjs"
      - "docs/surface-contract-*.json"
      - "docs/surface-contract-*.md"
      - "Updating Registry Patch Index.md"
      - "deployment_parity_checklist.md"
      - "docs/ai-docs-agent-governance.md"
      - "docs/auto-docs-agent/README.md"
      - "docs/change-documentation-governance.md"
      - ".github/governance/generated-artifact-registry.json"
      - ".github/ops/generated-artifact-governance.mjs"
      - ".github/ops/github-followup-automerge-readiness.mjs"

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: repository-generated-artifacts-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  dispatch-exact-main:
    name: Dispatch exact main remediation
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Resolve live main and dispatch exact writer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_EVENT: ${{ github.event_name }}
          EVENT_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          expected_head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "${SOURCE_EVENT}" == "push" && "${expected_head_sha}" != "${EVENT_HEAD_SHA}" ]]; then
            echo "Surface remediation dispatcher is stale: event=${EVENT_HEAD_SHA}, current_main=${expected_head_sha}. A newer main push owns remediation."
            exit 0
          fi
          gh workflow run surface-contract-auto-remediation.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f expected_head_sha="${expected_head_sha}"
          echo "Dispatched Surface Contract Auto Remediation writer for exact main ${expected_head_sha}."

  remediate:
    name: Generate reviewable remediation PR
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Require trusted follow-up writer identity
        env:
          REPO_AUTOSYNC_TOKEN_PRESENT: ${{ secrets.REPO_AUTOSYNC_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REPO_AUTOSYNC_TOKEN_PRESENT" != "true" ]]; then
            echo "::error::REPO_AUTOSYNC_TOKEN is required before creating a Surface Contract follow-up."
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected_head_sha }}
          token: ${{ secrets.REPO_AUTOSYNC_TOKEN }}

      - name: Pin exact source and safe target branch
        id: target
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          git fetch --no-tags origin main
          current_head_sha="$(git rev-parse origin/main)"
          test "${current_head_sha}" = "${EXPECTED_HEAD_SHA}"
          TARGET_BRANCH="surface-contract-auto/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          case "${TARGET_BRANCH}" in
            main|Production)
              echo "Refusing protected target branch ${TARGET_BRANCH}."
              exit 1
              ;;
          esac
          echo "target_branch=${TARGET_BRANCH}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Install runtime dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Generate checksum-bound remediation
        id: remediation
        working-directory: http-generic-api
        run: node scripts/surface-contract-auto-remediator.mjs --write

      - name: Verify generated state and focused regression coverage
        working-directory: http-generic-api
        run: |
          node scripts/surface-contract-auto-remediator.mjs --check
          node scripts/surface-contract-discovery.mjs --check
          node scripts/surface-contract-gap-triage.mjs --check
          node test-surface-contract-auto-remediation.mjs
          node test-surface-contract-discovery.mjs
          node test-surface-contract-governance-loop.mjs

      - name: Evaluate new-gap promotion gate
        id: gap_gate
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output=$(node scripts/surface-contract-gap-triage.mjs --enforce-new-gaps 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "blocking=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -eq 1 ] && grep -Fq "surface-contract-gap-triage: blocking new high/critical gaps:" <<<"$output"; then
            echo "blocking=true" >> "$GITHUB_OUTPUT"
            echo "::warning::New high/critical Surface Contract gaps require review; the remediation PR will remain open."
            exit 0
          fi
          echo "surface-contract-gap-triage failed unexpectedly with exit code $status" >&2
          exit "$status"

      - name: Enforce registered documentation and generated-evidence mutation boundary
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          changed=()
          while IFS= read -r -d '' entry; do
            changed+=("${entry:3}")
          done < <(git status --porcelain=v1 -z --untracked-files=all)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for file in "${changed[@]}"; do
            case "$file" in
              "Updating Registry Patch Index.md"|\
              "deployment_parity_checklist.md"|\
              "docs/ai-docs-agent-governance.md"|\
              "docs/auto-docs-agent/README.md"|\
              "docs/change-documentation-governance.md"|\
              docs/surface-contract-*.json|\
              docs/surface-contract-*.md)
                node .github/ops/generated-artifact-governance.mjs \
                  classify \
                  --owner surface_contract_remediator \
                  --path "$file" >/dev/null
                ;;
              *)
                echo "Unexpected or unregistered auto-remediation mutation: $file" >&2
                exit 1
                ;;
            esac
          done
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Create remediation pull request
        if: steps.changes.outputs.has_changes == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.REPO_AUTOSYNC_TOKEN }}
          BRANCH: ${{ steps.target.outputs.target_branch }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          AUTO_MERGE_ELIGIBLE: ${{ steps.remediation.outputs.auto_merge_eligible }}
          MANUAL_REVIEW_COUNT: ${{ steps.remediation.outputs.manual_review_count }}
          REMAINING_QUEUE_ITEMS: ${{ steps.remediation.outputs.remaining_queue_items }}
          NEW_GAP_BLOCKING: ${{ steps.gap_gate.outputs.blocking }}
        shell: bash
        run: |
          set -euo pipefail
          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main_sha" != "$EXPECTED_HEAD_SHA" ]]; then
            echo "Skipping stale surface remediation before branch creation: expected=${EXPECTED_HEAD_SHA}, current_main=${current_main_sha}."
            exit 0
          fi
          git config user.name "surface-contract-agent[bot]"
          git config user.email "surface-contract-agent[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -- \
            "Updating Registry Patch Index.md" \
            "deployment_parity_checklist.md" \
            "docs/ai-docs-agent-governance.md" \
            "docs/auto-docs-agent/README.md" \
            "docs/change-documentation-governance.md" \
            docs/surface-contract-*.json \
            docs/surface-contract-*.md
          git commit -m "Surface contract agent: remediate documentation and safety evidence"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Surface contract agent: automated remediation" \
            --body "<!-- surface-contract-remediation-source:${EXPECTED_HEAD_SHA} -->

          Automated, checksum-bound surface-contract remediation from exact main ${EXPECTED_HEAD_SHA}. Scope is registered documentation and generated evidence only. Spec manifests are intentionally excluded because their environment impact is not uniformly repository-only. No migration SQL, runtime code, database state, credentials, provider calls, external sends, or deployment actions are changed. Governance-finalizer eligible: ${AUTO_MERGE_ELIGIBLE}. New-gap gate blocking: ${NEW_GAP_BLOCKING}. Manual-review items: ${MANUAL_REVIEW_COUNT}. Remaining queue items: ${REMAINING_QUEUE_ITEMS}. Native GitHub auto-merge is intentionally not registered; Derived State Closure and the Governance Finalizer own any automated merge decision.")
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          PR_NUMBER="$(gh pr view "$PR_URL" --json number --jq '.number')"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          if [ "$AUTO_MERGE_ELIGIBLE" = "true" ] && [ "$NEW_GAP_BLOCKING" = "false" ]; then
            current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
            if [[ "$current_main_sha" != "$EXPECTED_HEAD_SHA" ]]; then
              gh pr close "$PR_URL" --comment "Closing stale surface remediation PR: main moved from ${EXPECTED_HEAD_SHA} to ${current_main_sha}. A newer exact-head run owns regeneration."
              exit 0
            fi
            pr_head_sha="$(gh pr view "$PR_URL" --json headRefOid --jq '.headRefOid')"
            [[ "$pr_head_sha" =~ ^[0-9a-f]{40}$ ]]
            echo "Surface remediation PR ${PR_NUMBER} head ${pr_head_sha} is eligible for governance finalization after Derived State Closure; native auto-merge remains disabled."
          else
            echo "PR remains open because manual review or new-gap review is required."
          fi
