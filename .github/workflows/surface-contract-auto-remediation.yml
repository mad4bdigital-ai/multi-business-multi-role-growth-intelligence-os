name: Surface Contract Auto Remediation

on:
  workflow_dispatch:
  push:
    branches:
      - gpt/agent-capability-evidence-v1
    paths:
      - .github/workflows/surface-contract-auto-remediation.yml
      - http-generic-api/scripts/repair-agent-capability-openapi.mjs

permissions:
  contents: write

concurrency:
  group: agent-capability-openapi-repair-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-openapi:
    runs-on: ubuntu-latest
    if: github.ref_name == 'gpt/agent-capability-evidence-v1'

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Rebuild OpenAPI from current main
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e af17e3d187ba9918a0e11cfa7a79e86aed52b13e^{commit}
          git show af17e3d187ba9918a0e11cfa7a79e86aed52b13e:http-generic-api/openapi.yaml > "$RUNNER_TEMP/openapi-main.yaml"
          cd http-generic-api
          node scripts/repair-agent-capability-openapi.mjs "$RUNNER_TEMP/openapi-main.yaml" openapi.yaml

      - name: Validate repaired OpenAPI and focused tests
        working-directory: http-generic-api
        run: |
          node -e "const fs=require('node:fs');const YAML=require('yaml');YAML.parse(fs.readFileSync('openapi.yaml','utf8'));console.log('OpenAPI YAML parse passed');"
          node test-agent-governance-runtime.mjs
          node test-agent-capability-coverage.mjs
          node test-agent-capability-admin-tool-registry.mjs

      - name: Restore canonical workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git show c905faab1772142c9ded54d385fa4a5cdc041a42:.github/workflows/surface-contract-auto-remediation.yml > .github/workflows/surface-contract-auto-remediation.yml
          rm http-generic-api/scripts/repair-agent-capability-openapi.mjs
          git config user.name "growth-intelligence-platform[bot]"
          git config user.email "growth-intelligence-platform[bot]@users.noreply.github.com"
          git add http-generic-api/openapi.yaml .github/workflows/surface-contract-auto-remediation.yml http-generic-api/scripts/repair-agent-capability-openapi.mjs
          git commit -m "Repair Agent capability coverage OpenAPI contracts"
          git push origin HEAD:${GITHUB_REF_NAME}
