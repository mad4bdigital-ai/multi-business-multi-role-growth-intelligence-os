name: Surface Contract Auto Remediation

on:
  push:
    branches:
      - gpt/agent-capability-evidence-v1
    paths:
      - .github/workflows/surface-contract-auto-remediation.yml

permissions:
  contents: write

concurrency:
  group: activation-admin-schema-regeneration-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate-activation-admin-schema:
    runs-on: ubuntu-latest
    if: github.ref_name == 'gpt/agent-capability-evidence-v1'

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Generate Custom GPT schemas
        working-directory: http-generic-api
        run: npm run schemas:generate

      - name: Validate generated schemas
        working-directory: http-generic-api
        run: |
          node scripts/generate-custom-gpt-schemas.mjs --check
          node test-custom-gpt-schemas.mjs

      - name: Restore canonical workflow and commit artifact
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/surface-contract-auto-remediation.yml > .github/workflows/surface-contract-auto-remediation.yml
          git config user.name "growth-intelligence-platform[bot]"
          git config user.email "growth-intelligence-platform[bot]@users.noreply.github.com"
          git add http-generic-api/openapi/openapi.custom-gpt.activation-admin.yaml .github/workflows/surface-contract-auto-remediation.yml
          if git diff --cached --quiet; then
            echo "No activation-admin artifact drift remains."
            exit 0
          fi
          git commit -m "Regenerate Custom GPT activation admin schema"
          git push origin HEAD:${GITHUB_REF_NAME}
