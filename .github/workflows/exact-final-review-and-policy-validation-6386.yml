name: Exact Final Review and Policy Validation 6386

on:
  pull_request:
    branches:
      - gpt/validate-final-review-and-policy-base-ab53d037
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: exact-final-review-policy-6386-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  EXPECTED_MAIN_SHA: ab53d0373fb8e31c8496508760e3d4bfa8c93e84
  EXPECTED_HEAD_SHA: 03fc92351361352e5ed4f40fba6b40ac8123539b
  EXPECTED_HEAD_REF: gpt/fix-final-review-identity-current-main-v7-20260805
  TARGET_PR_NUMBER: '6386'

jobs:
  exact-candidate:
    name: Exact Final Review-State Full ARM Validation
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/fix-final-review-identity-current-main-v7-20260805' &&
      github.event.pull_request.head.sha == '03fc92351361352e5ed4f40fba6b40ac8123539b'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            http-generic-api/package-lock.json

      - name: Verify immutable identity and exact scope
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.repo.full_name }}" = "$GITHUB_REPOSITORY"
          test "${{ github.event.pull_request.head.ref }}" = "$EXPECTED_HEAD_REF"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git merge-base "$EXPECTED_MAIN_SHA" "$EXPECTED_HEAD_SHA")" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-list --count "$EXPECTED_MAIN_SHA..$EXPECTED_HEAD_SHA")" -eq 1
          test "$(git rev-parse "$EXPECTED_HEAD_SHA^")" = "$EXPECTED_MAIN_SHA"
          mapfile -t files < <(git diff --name-only "$EXPECTED_MAIN_SHA"..."$EXPECTED_HEAD_SHA")
          test "${#files[@]}" -eq 7
          test "${files[0]}" = '.changes/e2e/repository-lifecycle-draft-merge-guard.json'
          test "${files[1]}" = '.changes/e2e/repository-lifecycle-final-review-state-readback.json'
          test "${files[2]}" = 'http-generic-api/githubRepositoryLifecycle.js'
          test "${files[3]}" = 'http-generic-api/repositoryAutomationControlPlane.js'
          test "${files[4]}" = 'http-generic-api/test-github-final-review-state-readback.mjs'
          test "${files[5]}" = 'http-generic-api/test-github-repository-lifecycle.mjs'
          test "${files[6]}" = 'http-generic-api/test-repository-automation-control-plane.mjs'
          test "$(git rev-parse "$EXPECTED_HEAD_SHA:.changes/e2e/repository-lifecycle-draft-merge-guard.json")" = 'f822dea0c91347b3921cbb05302654ac7a5ba728'
          test "$(git rev-parse "$EXPECTED_HEAD_SHA:.changes/e2e/repository-lifecycle-final-review-state-readback.json")" = '598d135ea7402799e53827fc503196e3348cca40'
          test "$(git rev-parse "$EXPECTED_HEAD_SHA:http-generic-api/githubRepositoryLifecycle.js")" = '78f5a3aed14a20700b1bdcfe453c04323c36e5ed'
          test "$(git rev-parse "$EXPECTED_HEAD_SHA:http-generic-api/repositoryAutomationControlPlane.js")" = '18f037e8da34b231a78182e359a40691d4b39a26'
          test "$(git rev-parse "$EXPECTED_HEAD_SHA:http-generic-api/test-github-final-review-state-readback.mjs")" = '605803d617342bdf71b18978a53a1a4636225183'
          test "$(git rev-parse "$EXPECTED_HEAD_SHA:http-generic-api/test-github-repository-lifecycle.mjs")" = 'a2d1b319719e4b082074279b5424d8aa4f87f791'
          test "$(git rev-parse "$EXPECTED_HEAD_SHA:http-generic-api/test-repository-automation-control-plane.mjs")" = '432c5924094c482420d64d63d0502ba39af479e3'

      - name: Run canonical syntax and governance checks
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/schema-docs-change-guard.mjs
          node http-generic-api/scripts/migration-placement-guard.mjs
          node http-generic-api/scripts/user-jwt-auth-governance.mjs
          node http-generic-api/scripts/interruption-readiness.mjs --ci --skip-dependencies --skip-worktree
          node validate-canonical-sources.mjs
          node build-canonicals.mjs --check
          node --check find-canonical-domain.mjs
          (cd http-generic-api && node scripts/resource-api-coverage-audit.mjs --ci --changed)
          (cd http-generic-api && node test-resource-api-architecture.mjs && node test-resource-api-service.mjs)
          node http-generic-api/scripts/spec-kit-completion-gate.mjs --ci --changed
          node validate-memory-schema.mjs
          git diff --check
          node --check http-generic-api/githubRepositoryLifecycle.js
          node --check http-generic-api/repositoryAutomationControlPlane.js
          node --check http-generic-api/test-github-final-review-state-readback.mjs
          node --check http-generic-api/test-github-repository-lifecycle.mjs
          node --check http-generic-api/test-repository-automation-control-plane.mjs

      - name: Install HTTP API dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Run focused final review-state regressions
        working-directory: http-generic-api
        run: |
          node test-github-repository-lifecycle.mjs
          node test-github-final-review-state-readback.mjs
          node test-repository-automation-control-plane.mjs

      - name: Run complete Unit and Integration suite with exact provenance
        working-directory: http-generic-api
        shell: bash
        env:
          TEST_SUITE_REPORT_DIR: ${{ runner.temp }}/test-suite-reports
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_HEAD_SHA"
          GITHUB_SHA="$actual_sha" npm test

      - name: Verify exact test report provenance
        shell: bash
        run: |
          set -euo pipefail
          for report in "$RUNNER_TEMP/test-suite-reports/test-manifest.json" "$RUNNER_TEMP/test-suite-reports/test-suite.json"; do
            test -f "$report"
            test "$(jq -r '.status' "$report")" = 'passed'
            test "$(jq -r '.commitSha' "$report")" = "$EXPECTED_HEAD_SHA"
            test "$(jq -r '.firstFailure' "$report")" = 'null'
            test "$(jq -r '.secretsIncluded' "$report")" = 'false'
          done

      - name: Prove runtime startup and deployment evidence
        working-directory: http-generic-api
        env:
          FORCE_ROUTE_RUNTIME_TESTS: 'true'
          DEPLOYMENT_BRANCH: ${{ env.EXPECTED_HEAD_REF }}
          DEPLOYMENT_COMMIT_SHA: ${{ env.EXPECTED_HEAD_SHA }}
        run: |
          node test-deployment-manifest-generator.mjs
          npm run manifest:deployment
          node test-server-startup-smoke.mjs

      - name: Install root dependencies and run Execution Resolver Gate
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test -- --runInBand

      - name: Run Architecture Drift Detection
        working-directory: http-generic-api
        run: npm run validate

      - name: Run exact E2E phase evaluation and execution
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/e2e-phase-governance.mjs check --base "$EXPECTED_MAIN_SHA" --head "$EXPECTED_HEAD_SHA" --report-file "$RUNNER_TEMP/e2e-phase-evaluation.json"
          node http-generic-api/scripts/e2e-phase-governance.mjs run --base "$EXPECTED_MAIN_SHA" --head "$EXPECTED_HEAD_SHA" --report-file "$RUNNER_TEMP/e2e-phase-evaluation-run.json" --execution-report-file "$RUNNER_TEMP/e2e-phase-execution.json"

      - name: Re-read protected main after ARM
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN_SHA"

      - name: Publish exact no-secret ARM summary
        if: always()
        shell: bash
        run: |
          jq -n --arg base_sha "$EXPECTED_MAIN_SHA" --arg head_sha "$EXPECTED_HEAD_SHA" --arg run_id "$GITHUB_RUN_ID" '{contract:"mad4b.exact-final-review-state-arm-validation.v1",base_sha:$base_sha,head_sha:$head_sha,run_id:$run_id,test_report_provenance_verified:true,main_final_readback_expected:$base_sha,candidate_mutated:false,main_mutated:false,production_mutated:false,provider_call:false,credential_read:false,sql_executed:false,migration_apply:false,database_mutated:false,external_send:false,secrets_included:false}' > "$RUNNER_TEMP/exact-final-review-state-arm-summary.json"

      - name: Upload exact ARM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-final-review-state-arm-validation-6386-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/exact-final-review-state-arm-summary.json
            ${{ runner.temp }}/e2e-phase-*.json
            ${{ runner.temp }}/test-suite-reports/*.json
          if-no-files-found: warn
          retention-days: 14

  policy-readback:
    name: Read active main rules and bypass posture
    needs: exact-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DECLARED_FINALIZER_APP_ID: ${{ vars.GITHUB_APP_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Query current main policy and exact target state
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/main-ruleset-readback"
          mkdir -p "$evidence/rulesets"
          fetch_json() {
            local name="$1" endpoint="$2" status
            status="$(curl --silent --show-error --output "$evidence/${name}.json" --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/${endpoint}")"
            printf '%s\n' "$status" > "$evidence/${name}.status"
          }
          fetch_json repository "repos/${GITHUB_REPOSITORY}"
          fetch_json main-ref "repos/${GITHUB_REPOSITORY}/git/ref/heads/main"
          fetch_json active-rules "repos/${GITHUB_REPOSITORY}/rules/branches/main"
          fetch_json rulesets-index "repos/${GITHUB_REPOSITORY}/rulesets?includes_parents=true&per_page=100"
          fetch_json branch-protection "repos/${GITHUB_REPOSITORY}/branches/main/protection"
          fetch_json target-pr "repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR_NUMBER}"
          fetch_json target-pr-reviews "repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR_NUMBER}/reviews?per_page=100"
          fetch_json target-pr-review-comments "repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR_NUMBER}/comments?per_page=100"
          if test "$(cat "$evidence/active-rules.status")" = '200'; then
            jq -r '.[]? | .ruleset_id // empty' "$evidence/active-rules.json" | sort -u | while read -r ruleset_id; do
              test -n "$ruleset_id" || continue
              fetch_json "rulesets/${ruleset_id}" "repos/${GITHUB_REPOSITORY}/rulesets/${ruleset_id}"
            done
          fi

      - name: Build bounded server-policy assessment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'main-ruleset-readback'
          def status(name):
              p = root / f'{name}.status'
              return p.read_text().strip() if p.exists() else None
          def load(name, fallback=None):
              p = root / f'{name}.json'
              if not p.exists(): return fallback
              try: return json.loads(p.read_text())
              except Exception: return fallback
          repository = load('repository', {}) if status('repository') == '200' else {}
          main_ref = load('main-ref', {}) if status('main-ref') == '200' else {}
          active = load('active-rules', []) if status('active-rules') == '200' else []
          index = load('rulesets-index', []) if status('rulesets-index') == '200' else []
          protection = load('branch-protection', {}) if status('branch-protection') == '200' else {}
          pr = load('target-pr', {}) if status('target-pr') == '200' else {}
          reviews = load('target-pr-reviews', []) if status('target-pr-reviews') == '200' else []
          comments = load('target-pr-review-comments', []) if status('target-pr-review-comments') == '200' else []
          pr_rules, check_rules, queue_rules = [], [], []
          for rule in active if isinstance(active, list) else []:
              if not isinstance(rule, dict): continue
              item = {'type': rule.get('type'), 'ruleset_id': rule.get('ruleset_id'), 'parameters': rule.get('parameters') or {}}
              if rule.get('type') == 'pull_request': pr_rules.append(item)
              elif rule.get('type') == 'required_status_checks': check_rules.append(item)
              elif rule.get('type') == 'merge_queue': queue_rules.append(item)
          counts, stale, resolution, last_push = [], [], [], []
          for rule in pr_rules:
              p = rule['parameters']
              if isinstance(p.get('required_approving_review_count'), int): counts.append(p['required_approving_review_count'])
              if 'dismiss_stale_reviews_on_push' in p: stale.append(bool(p['dismiss_stale_reviews_on_push']))
              if 'required_review_thread_resolution' in p: resolution.append(bool(p['required_review_thread_resolution']))
              if 'require_last_push_approval' in p: last_push.append(bool(p['require_last_push_approval']))
          rp = protection.get('required_pull_request_reviews') or {}
          if isinstance(rp.get('required_approving_review_count'), int): counts.append(rp['required_approving_review_count'])
          if rp:
              stale.append(bool(rp.get('dismiss_stale_reviews')))
              resolution.append(bool((protection.get('required_conversation_resolution') or {}).get('enabled')))
              last_push.append(bool(rp.get('require_last_push_approval')))
          details, bypass = [], []
          rules_dir = root / 'rulesets'
          if rules_dir.exists():
              for p in sorted(rules_dir.glob('*.json')):
                  try: payload = json.loads(p.read_text())
                  except Exception: payload = {}
                  actors = payload.get('bypass_actors') or []
                  details.append({'id': payload.get('id'), 'name': payload.get('name'), 'enforcement': payload.get('enforcement'), 'bypass_actors': actors})
                  for a in actors:
                      if isinstance(a, dict): bypass.append(a)
          app_text = str(os.environ.get('DECLARED_FINALIZER_APP_ID') or '').strip()
          app_id = int(app_text) if app_text.isdigit() else None
          matching = [a for a in bypass if app_id is not None and a.get('actor_type') == 'Integration' and a.get('actor_id') == app_id]
          required = max(counts) if counts else None
          proof = {
              'required_reviews_proven': required is not None and required >= 1,
              'required_approving_review_count': required,
              'dismiss_stale_reviews_proven': any(stale),
              'required_review_thread_resolution_proven': any(resolution),
              'require_last_push_approval_observed': any(last_push),
              'merge_queue_rule_observed': len(queue_rules) > 0,
              'finalizer_app_identity_resolved': app_id is not None,
              'finalizer_not_bypass_proven': app_id is not None and len(details) > 0 and len(matching) == 0,
          }
          proof['server_policy_gate_complete'] = all([
              proof['required_reviews_proven'], proof['dismiss_stale_reviews_proven'],
              proof['required_review_thread_resolution_proven'], proof['finalizer_not_bypass_proven']
          ])
          assessment = {
              'contract': 'mad4b.main-server-policy-readback.v1',
              'pull_request': int(os.environ['TARGET_PR_NUMBER']),
              'expected_main_sha': os.environ['EXPECTED_MAIN_SHA'],
              'expected_head_sha': os.environ['EXPECTED_HEAD_SHA'],
              'api_status': {n: status(n) for n in ['repository','main-ref','active-rules','rulesets-index','branch-protection','target-pr','target-pr-reviews','target-pr-review-comments']},
              'observed_main_sha': ((main_ref.get('object') or {}).get('sha')),
              'target_pr_readback': {
                  'state': pr.get('state'), 'draft': pr.get('draft'),
                  'head_sha': (pr.get('head') or {}).get('sha'),
                  'base_sha': (pr.get('base') or {}).get('sha'),
                  'review_count': len(reviews) if isinstance(reviews, list) else None,
                  'inline_review_comment_count': len(comments) if isinstance(comments, list) else None,
                  'auto_merge_enabled': pr.get('auto_merge') is not None,
              },
              'repository_auto_merge_allowed': repository.get('allow_auto_merge'),
              'active_rule_count': len(active) if isinstance(active, list) else None,
              'ruleset_index_count': len(index) if isinstance(index, list) else None,
              'pull_request_rules': pr_rules,
              'required_status_check_rules': check_rules,
              'merge_queue_rules': queue_rules,
              'ruleset_details': details,
              'declared_finalizer_app_id': app_id,
              'matching_finalizer_bypass_actors': matching,
              'proof': proof,
              'repository_mutation': False, 'production_mutation': False,
              'protected_ref_mutation': False, 'secrets_included': False,
          }
          (root / 'assessment.json').write_text(json.dumps(assessment, indent=2) + '\n')
          PY

      - name: Enforce exact final main identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.observed_main_sha' "$RUNNER_TEMP/main-ruleset-readback/assessment.json")" = "$EXPECTED_MAIN_SHA"
          test "$(jq -r '.target_pr_readback.head_sha' "$RUNNER_TEMP/main-ruleset-readback/assessment.json")" = "$EXPECTED_HEAD_SHA"
          test "$(jq -r '.target_pr_readback.base_sha' "$RUNNER_TEMP/main-ruleset-readback/assessment.json")" = "$EXPECTED_MAIN_SHA"

      - name: Upload bounded policy readback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-ruleset-readback-6386-${{ github.run_id }}
          path: ${{ runner.temp }}/main-ruleset-readback
          if-no-files-found: error
          retention-days: 30
