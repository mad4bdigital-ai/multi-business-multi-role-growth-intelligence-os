name: Trigger PR 3162 rebuild

on:
  push:
    branches:
      - gpt/pr-3162-rebuild-main-20260730-v2
    paths:
      - .github/workflows/pr-3162-rebuild-trigger.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  run-bounded-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/pr-3162-rebuild-main-20260730-v2
          fetch-depth: 0

      - name: Publish run start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 3295 --repo "${{ github.repository }}" --body "Runtime-truth repair started in workflow run ${GITHUB_RUN_ID} for head ${GITHUB_SHA}."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - run: npm ci
        working-directory: http-generic-api

      - name: Repair parser, regressions, and uninstall contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          script_path = Path("http-generic-api/scripts/frontend-surface-dispatch.mjs")
          script = script_path.read_text()

          broad_alias = '''  for (const match of text.matchAll(/\\b(?:const|let)\\s+([A-Za-z0-9_$]+)\\s*=\\s*([^;\\n]+);/g)) {
            if (aliases.has(match[1])) continue;
            const containsGuard = [...match[2].matchAll(/\\b(?:deps\\.)?([A-Za-z_$][A-Za-z0-9_$]*)\\b/g)]
              .some((entry) => AUTH_GUARDS.has(entry[1]) || aliases.has(entry[1]));
            if (/^(?:require|verify|authenticate|authorize|auth)/i.test(match[1]) || containsGuard) aliases.set(match[1], match[2]);
          }'''
          safe_alias = '''  for (const match of text.matchAll(/\\b(?:const|let)\\s+([A-Za-z0-9_$]+)\\s*=\\s*([^;\\n]+);/g)) {
            if (aliases.has(match[1])) continue;
            const expression = match[2];
            const containsGuardReference = !/\\bawait\\b/.test(expression) &&
              [...expression.matchAll(/\\b(?:deps\\.)?([A-Za-z_$][A-Za-z0-9_$]*)\\b(?!\\s*\\()/g)]
                .some((entry) => AUTH_GUARDS.has(entry[1]) || aliases.has(entry[1]));
            if (/^(?:require|verify|authenticate|authorize|auth)/i.test(match[1]) || containsGuardReference) {
              aliases.set(match[1], expression);
            }
          }'''
          script = replace_once(script, broad_alias, safe_alias, "guard reference alias narrowing")

          composite_profile = '''  if (hasBackendAuthenticator && hasLocal && !hasAdmin && !hasUser && !hasMcp && !hasGitHubWebhook) {
            return {
              state: "resolved",
              profile: "backend_local_manager",
              alternatives: [
                ["backendBearerAuth", "localManagerBearerAuth"],
                ["backendApiKeyAuth", "localManagerBearerAuth"],
              ],
              principal: "local_manager",
              guard_chain: guardChain,
              evidence,
              configuration_dependencies: ["BACKEND_API_KEY"],
            };
          }
          '''
          script = replace_once(script, composite_profile, "", "remove unsupported composite auth profile")
          script = replace_once(
              script,
              '    if (["local_manager", "backend_local_manager"].includes(runtimeAuth.profile)) return "local_device";',
              '    if (runtimeAuth.profile === "local_manager") return "local_device";',
              "remove unsupported composite scope",
          )
          script_path.write_text(script)

          test_path = Path("http-generic-api/test-frontend-surface-dispatch.mjs")
          test = test_path.read_text()
          composite_test = '''const compositeLocalConnectorAuth = runtimeAuthProfile({
            routePath: "/local-connector/uninstall",
            routeGuards: ["requireBackendApiKey", "requireFreshLocalManagerDeviceForPrivilegedInstaller"],
          });
          assert.equal(
            compositeLocalConnectorAuth.profile,
            "backend_local_manager",
            "the uninstall route must preserve its backend plus Local Manager composite authentication profile",
          );
          assert.deepEqual(
            compositeLocalConnectorAuth.alternatives,
            [
              ["backendBearerAuth", "localManagerBearerAuth"],
              ["backendApiKeyAuth", "localManagerBearerAuth"],
            ],
            "each uninstall security alternative must require backend and Local Manager authentication together",
          );'''
          runtime_truth_tests = '''const aliasSafetyRoutes = parseRoutesFromFile(`
            const adminGuard = requireAdminPrincipal || ((_req, _res, next) => next());
            const device = await requireFreshLocalManagerDeviceForPrivilegedInstaller(req);
            router.get("/admin/aliased", requireBackendApiKey, adminGuard, handler);
            router.delete("/local-connector/uninstall", requireBackendApiKey, async (_req, res) => res.json({ message: "device disabled" }));
          `, "routes/aliasSafetyRoutes.js");
          assert.deepEqual(
            aliasSafetyRoutes.find((entry) => entry.signature === "GET /admin/aliased").route_guards,
            ["requireAdminPrincipal", "requireBackendApiKey"],
            "guard references used as middleware aliases must remain discoverable",
          );
          assert.deepEqual(
            aliasSafetyRoutes.find((entry) => entry.signature === "DELETE /local-connector/uninstall").route_guards,
            ["requireBackendApiKey"],
            "invoked guard results and ordinary words must not become file-global middleware aliases",
          );

          const localConnectorInstallSource = fs.readFileSync(new URL("./routes/localConnectorInstallRoutes.js", import.meta.url), "utf8");
          const uninstallOperation = parseRoutesFromFile(
            localConnectorInstallSource,
            "routes/localConnectorInstallRoutes.js",
          ).find((entry) => entry.signature === "DELETE /local-connector/uninstall");
          assert(uninstallOperation, "the Local Connector uninstall route must be discovered");
          assert.deepEqual(
            uninstallOperation.route_guards,
            ["requireBackendApiKey"],
            "uninstall must reflect its real requireBackendApiKey registration only",
          );
          const uninstallRuntimeAuth = runtimeAuthProfile({
            routePath: uninstallOperation.path,
            routeGuards: uninstallOperation.route_guards,
            inheritedGuards: uninstallOperation.inherited_guards,
          });
          assert.equal(uninstallRuntimeAuth.profile, "backend_or_user");
          assert.deepEqual(uninstallRuntimeAuth.alternatives, [["backendBearerAuth"], ["backendApiKeyAuth"]]);

          const growthIntelligenceSource = fs.readFileSync(new URL("./routes/growthIntelligenceRoutes.js", import.meta.url), "utf8");
          const growthIntelligenceRoutes = parseRoutesFromFile(
            growthIntelligenceSource,
            "routes/growthIntelligenceRoutes.js",
          );
          assert(growthIntelligenceRoutes.length > 0, "Growth Intelligence routes must be discovered");
          for (const operation of growthIntelligenceRoutes) {
            assert.deepEqual(
              operation.route_guards,
              ["requireAdminPrincipal", "requireBackendApiKey"],
              `${operation.signature} must preserve the adminGuard middleware reference`,
            );
            assert.equal(
              runtimeAuthProfile({ routePath: operation.path, routeGuards: operation.route_guards }).profile,
              "admin_backend",
            );
          }

          const uninstallOpenApi = YAML.parse(
            fs.readFileSync(new URL("./openapi/local-connector-uninstall.yaml", import.meta.url), "utf8"),
          );
          assert.deepEqual(
            uninstallOpenApi.paths["/local-connector/uninstall"].delete.security,
            [{ backendBearerAuth: [] }, { backendApiKeyAuth: [] }],
            "uninstall OpenAPI security must match requireBackendApiKey OR semantics",
          );
          assert.deepEqual(
            uninstallOpenApi.components.schemas.ErrorEnvelope.properties.error.required,
            ["code"],
            "the error contract must allow the runtime 404 response without a message",
          );'''
          test = replace_once(test, composite_test, runtime_truth_tests, "replace composite uninstall regression")
          test_path.write_text(test)

          openapi_path = Path("http-generic-api/openapi/local-connector-uninstall.yaml")
          openapi = openapi_path.read_text()
          openapi = replace_once(
              openapi,
              "description: Composite backend and Local Manager authenticated device uninstall contract.",
              "description: Backend guard authenticated Local Connector device uninstall contract.",
              "uninstall description",
          )
          openapi = replace_once(
              openapi,
              '''      security:
                  - backendBearerAuth: []
                    localManagerBearerAuth: []
                  - backendApiKeyAuth: []
                    localManagerBearerAuth: []''',
              '''      security:
                  - backendBearerAuth: []
                  - backendApiKeyAuth: []''',
              "uninstall security OR semantics",
          )
          openapi = replace_once(
              openapi,
              "    localManagerBearerAuth: { type: http, scheme: bearer, bearerFormat: Local Manager JWT }\n",
              "",
              "remove unused Local Manager scheme",
          )
          openapi = replace_once(openapi, "          required: [code, message]", "          required: [code]", "optional error message")
          openapi = replace_once(
              openapi,
              "      description: Composite authentication is missing or invalid",
              "      description: Backend guard authentication is missing or invalid",
              "unauthorized response description",
          )
          openapi_path.write_text(openapi)
          PY

      - name: Generate and prove parity
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          node test-frontend-surface-dispatch.mjs
          npm run frontend:dispatch:generate -- --baseline-ref=main
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-openapi-route-coverage.mjs
          npm run openapi:auth:check
          node - <<'NODE'
          const fs = require('node:fs');
          const plan = JSON.parse(fs.readFileSync('frontend-surface-dispatch.generated.json', 'utf8'));
          const counts = plan.coverage?.auth_parity_counts || {};
          const result = {
            mismatch: counts.mismatch || 0,
            unknown: counts.unknown || 0,
            missing_openapi: counts.missing_openapi || 0,
            auth_contract_gap_count: plan.coverage?.auth_contract_gap_count || 0,
            openapi_gap_count: plan.coverage?.openapi_gap_count || 0,
          };
          console.log(JSON.stringify(result, null, 2));
          if (Object.values(result).some((value) => value !== 0)) process.exit(1);
          NODE
          git diff --check

      - name: Commit runtime-truth repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            http-generic-api/scripts/frontend-surface-dispatch.mjs \
            http-generic-api/test-frontend-surface-dispatch.mjs \
            http-generic-api/openapi/local-connector-uninstall.yaml \
            http-generic-api/frontend-operation-governance.generated.json \
            http-generic-api/frontend-surface-dispatch.generated.json \
            http-generic-api/openapi/frontend-runtime-routes.generated.yaml
          git commit -m "fix: align PR 3162 auth parity with runtime truth"
          git push origin HEAD:gpt/pr-3162-rebuild-main-20260730-v2

      - name: Publish run completion
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 3295 --repo "${{ github.repository }}" --body "Runtime-truth repair completed in workflow run ${GITHUB_RUN_ID}; all five parity counters are zero."
