name: Staging OpenAPI Governance

on:
  pull_request:
    paths:
      - 'http-generic-api/openapi/**'
      - 'http-generic-api/config/staging-openapi-mcp-policy.json'
      - 'http-generic-api/config/admin-tenant-inspection-policy.json'
      - 'scripts/validate-staging-openapi-governance.mjs'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'http-generic-api/openapi/**'
      - 'http-generic-api/config/staging-openapi-mcp-policy.json'
      - 'http-generic-api/config/admin-tenant-inspection-policy.json'
      - 'scripts/validate-staging-openapi-governance.mjs'
      - 'package.json'

permissions:
  contents: read

jobs:
  validate:
    name: Validate Staging OpenAPI and Tenant Inspection Governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Validate governed staging schemas
        run: node scripts/validate-staging-openapi-governance.mjs
