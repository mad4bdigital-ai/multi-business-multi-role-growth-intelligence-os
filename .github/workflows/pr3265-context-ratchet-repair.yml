name: PR 3265 Context Ratchet Repair

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'gpt/hostinger-production-resync-policy-20260729'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: gpt/hostinger-production-resync-policy-20260729
          fetch-depth: 0

      - name: Apply fail-closed row resolution repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_count(text: str, old: str, new: str, expected: int, label: str) -> str:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{label}: expected {expected} matches, found {count}")
              return text.replace(old, new)

          trigger_path = Path("http-generic-api/repositoryMainMovedTriggerService.js")
          trigger = trigger_path.read_text(encoding="utf-8")
          trigger = replace_count(
              trigger,
              '''function shapeTrigger(row) {
            if (!row) return null;
            return {
              ...row,
              forced: Number(row.forced || 0) === 1,
              deleted: Number(row.deleted || 0) === 1,
              summary_json: parseJson(row.summary_json, {}),
              execution_allowed: false,
              provider_write: false,
              external_write: false,
              secrets_included: false,
            };
          }
          ''',
              '''function shapeTrigger(row) {
            if (!row) return null;
            return {
              ...row,
              forced: Number(row.forced || 0) === 1,
              deleted: Number(row.deleted || 0) === 1,
              summary_json: parseJson(row.summary_json, {}),
              execution_allowed: false,
              provider_write: false,
              external_write: false,
              secrets_included: false,
            };
          }

          function uniqueTriggerRow(rowset, context) {
            if (!Array.isArray(rowset)) {
              fail("repository_main_moved_resolution_invalid", "Repository trigger resolution returned an invalid rowset.", 500, { context });
            }
            if (rowset.length > 1) {
              fail("repository_main_moved_resolution_ambiguous", "Repository trigger resolution returned multiple candidates.", 409, {
                context,
                candidate_count: rowset.length,
              });
            }
            const [row] = rowset;
            return row || null;
          }
          ''',
              1,
              "insert uniqueTriggerRow",
          )
          trigger = replace_count(trigger, '  return shapeTrigger(rows[0] || null);', '  return shapeTrigger(uniqueTriggerRow(rows, "event_fingerprint_sha256"));', 1, "replace fingerprint first-row selection")
          trigger = replace_count(
              trigger,
              '''  if (!rows[0]) fail("repository_main_moved_trigger_not_found", "Trigger event was not found.", 404);
            return {
              ok: true,
              trigger_event: shapeTrigger(rows[0]),''',
              '''  const row = uniqueTriggerRow(rows, "trigger_event_id");
            if (!row) fail("repository_main_moved_trigger_not_found", "Trigger event was not found.", 404);
            return {
              ok: true,
              trigger_event: shapeTrigger(row),''',
              1,
              "replace trigger id first-row selection",
          )
          trigger_path.write_text(trigger, encoding="utf-8")

          advisor_path = Path("http-generic-api/selfHealingReleaseAdvisorService.js")
          advisor = advisor_path.read_text(encoding="utf-8")
          advisor = replace_count(
              advisor,
              '''function hash(value) {
            return createHash("sha256").update(JSON.stringify(stableValue(value))).digest("hex");
          }
          ''',
              '''function hash(value) {
            return createHash("sha256").update(JSON.stringify(stableValue(value))).digest("hex");
          }

          function uniqueAdvisorRow(rowset, context) {
            if (!Array.isArray(rowset)) {
              fail("release_advisor_resolution_invalid", "Release advisor resolution returned an invalid rowset.", 500, { context });
            }
            if (rowset.length > 1) {
              fail("release_advisor_resolution_ambiguous", "Release advisor resolution returned multiple candidates.", 409, {
                context,
                candidate_count: rowset.length,
              });
            }
            const [row] = rowset;
            return row || null;
          }
          ''',
              1,
              "insert uniqueAdvisorRow",
          )
          advisor = replace_count(advisor, '  const verification = verificationRows[0];', '  const verification = uniqueAdvisorRow(verificationRows, "runtime_verification");', 1, "verification row")
          advisor = replace_count(advisor, '    operation = rows[0] || null;', '    operation = uniqueAdvisorRow(rows, "release_operation");', 2, "operation rows")
          advisor = replace_count(advisor, '    gate = gateRows[0] || null;', '    gate = uniqueAdvisorRow(gateRows, "release_gate");', 1, "gate row")
          advisor = replace_count(advisor, '    asyncDeployment = deploymentRows[0] || null;', '    asyncDeployment = uniqueAdvisorRow(deploymentRows, "release_async_deployment");', 1, "deployment row")
          advisor = replace_count(
              advisor,
              '''  if (!rows[0]) fail("release_advisor_run_not_found", "Release advisor run was not found.", 404);
            const [recommendations] = await pool.query(`SELECT * FROM release_advisor_recommendations WHERE advisor_run_id = ? ORDER BY sequence_no, recommendation_id`, [id]);
            return {
              ok: true,
              advisor_run: shapeRun(rows[0]),''',
              '''  const row = uniqueAdvisorRow(rows, "advisor_run_id");
            if (!row) fail("release_advisor_run_not_found", "Release advisor run was not found.", 404);
            const [recommendations] = await pool.query(`SELECT * FROM release_advisor_recommendations WHERE advisor_run_id = ? ORDER BY sequence_no, recommendation_id`, [id]);
            return {
              ok: true,
              advisor_run: shapeRun(row),''',
              1,
              "advisor run row",
          )
          advisor = replace_count(
              advisor,
              '''  const [existingRows] = await pool.query(`SELECT advisor_run_id FROM release_advisor_runs WHERE plan_fingerprint_sha256 = ? LIMIT 1`, [plan.plan_fingerprint_sha256]);
            if (existingRows[0]) {
              return { ...(await getReleaseAdvisorRun(existingRows[0].advisor_run_id, { pool })), deduplicated: true };
            }''',
              '''  const [existingRows] = await pool.query(`SELECT advisor_run_id FROM release_advisor_runs WHERE plan_fingerprint_sha256 = ? LIMIT 1`, [plan.plan_fingerprint_sha256]);
            const existingRun = uniqueAdvisorRow(existingRows, "plan_fingerprint_sha256");
            if (existingRun) {
              return { ...(await getReleaseAdvisorRun(existingRun.advisor_run_id, { pool })), deduplicated: true };
            }''',
              1,
              "existing advisor row",
          )
          advisor = replace_count(
              advisor,
              '      if (rows[0]) return { ...(await getReleaseAdvisorRun(rows[0].advisor_run_id, { pool })), deduplicated: true };',
              '''      const duplicateRun = uniqueAdvisorRow(rows, "duplicate_plan_fingerprint_sha256");
              if (duplicateRun) return { ...(await getReleaseAdvisorRun(duplicateRun.advisor_run_id, { pool })), deduplicated: true };''',
              1,
              "duplicate advisor row",
          )
          advisor_path.write_text(advisor, encoding="utf-8")

          trigger_test_path = Path("http-generic-api/test-repository-main-moved-trigger-coordinator.mjs")
          trigger_test = trigger_test_path.read_text(encoding="utf-8")
          trigger_test = replace_count(trigger_test, 'assert.match(service, /job_enqueued: false/);', '''assert.match(service, /job_enqueued: false/);
          assert.doesNotMatch(service, /\\brows\\s*\\[\\s*0\\s*\\]/);
          assert.match(service, /repository_main_moved_resolution_ambiguous/);''', 1, "trigger row regression assertions")
          trigger_test_path.write_text(trigger_test, encoding="utf-8")

          advisor_test_path = Path("http-generic-api/test-self-healing-release-advisor.mjs")
          advisor_test = advisor_test_path.read_text(encoding="utf-8")
          advisor_test = replace_count(
              advisor_test,
              '''const migration = fs.readFileSync(path.join(__dirname, "migrations", "20260716_self_healing_release_advisor.sql"), "utf8");''',
              '''const advisorService = fs.readFileSync(path.join(__dirname, "selfHealingReleaseAdvisorService.js"), "utf8");
          assert.doesNotMatch(advisorService, /\\b(?:rows|rowset|verificationRows|gateRows|deploymentRows|existingRows)\\s*\\[\\s*0\\s*\\]/);
          assert.match(advisorService, /release_advisor_resolution_ambiguous/);

          const migration = fs.readFileSync(path.join(__dirname, "migrations", "20260716_self_healing_release_advisor.sql"), "utf8");''',
              1,
              "advisor row regression assertions",
          )
          advisor_test_path.write_text(advisor_test, encoding="utf-8")
          PY

      - name: Install focused test dependencies
        working-directory: http-generic-api
        run: npm ci --ignore-scripts

      - name: Validate focused contracts
        shell: bash
        run: |
          node http-generic-api/test-repository-main-moved-trigger-coordinator.mjs
          node http-generic-api/test-self-healing-release-advisor.mjs
          if grep -En '\b(rows|rowset|verificationRows|gateRows|deploymentRows|existingRows)\s*\[\s*0\s*\]' \
            http-generic-api/repositoryMainMovedTriggerService.js \
            http-generic-api/selfHealingReleaseAdvisorService.js; then
            echo "Direct first-candidate selection remains" >&2
            exit 1
          fi

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            http-generic-api/repositoryMainMovedTriggerService.js \
            http-generic-api/selfHealingReleaseAdvisorService.js \
            http-generic-api/test-repository-main-moved-trigger-coordinator.mjs \
            http-generic-api/test-self-healing-release-advisor.mjs
          git diff --cached --check
          git commit -m "fix(release): prove unique database row resolution"
          git push origin HEAD:gpt/hostinger-production-resync-policy-20260729
