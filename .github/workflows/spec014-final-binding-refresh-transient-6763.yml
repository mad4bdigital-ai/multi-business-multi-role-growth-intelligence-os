name: Spec014 Final Binding Refresh Transient 6763

on:
  push:
    branches:
      - fix/tenant-platform-plugin-managed-repair-4451-rebased-20260809
    paths:
      - .github/workflows/spec014-final-binding-refresh-transient-6763.yml

permissions:
  contents: write

concurrency:
  group: spec014-final-binding-refresh-transient-6763
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact launcher head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact launcher identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "eede5b21f17b3cdf4527de8295c72d5ec8f179d1"
          remote_head="$(git ls-remote --exit-code origin refs/heads/fix/tenant-platform-plugin-managed-repair-4451-rebased-20260809 | awk '{print $1}')"
          test "${remote_head}" = "${GITHUB_SHA}"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          test "${changed}" = ".github/workflows/spec014-final-binding-refresh-transient-6763.yml"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Refresh both canonical Spec014 final Work Map bindings
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          node scripts/spec014-refresh-final-work-map-binding.mjs
          node scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-retail-commerce-operations-growth-os
          node scripts/spec014-refresh-final-work-map-binding.mjs --check
          node scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-retail-commerce-operations-growth-os --check
          node scripts/spec014-final-work-map-readback.mjs

      - name: Verify bounded producer write set
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git status --porcelain --untracked-files=all | awk '{print $2}' | grep -Ev '^(specs/014-governed-hostinger-storage-orchestration/work-map-integration.json|specs/014-governed-hostinger-storage-orchestration/tasks.md|specs/014-retail-commerce-operations-growth-os/work-map-integration.json)$' || true)"
          if [[ -n "${unexpected}" ]]; then
            echo "Unexpected producer write set:"
            printf '%s\n' "${unexpected}"
            exit 1
          fi

      - name: Commit producer output and self-delete launcher
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --exit-code origin refs/heads/fix/tenant-platform-plugin-managed-repair-4451-rebased-20260809 | awk '{print $1}')"
          test "${remote_head}" = "${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specs/014-governed-hostinger-storage-orchestration/work-map-integration.json
          git add specs/014-retail-commerce-operations-growth-os/work-map-integration.json
          if ! git diff --quiet -- specs/014-governed-hostinger-storage-orchestration/tasks.md; then
            git add specs/014-governed-hostinger-storage-orchestration/tasks.md
          fi
          git rm .github/workflows/spec014-final-binding-refresh-transient-6763.yml
          git commit -m "docs(spec014): refresh final Work Map bindings"
          git push origin HEAD:refs/heads/fix/tenant-platform-plugin-managed-repair-4451-rebased-20260809
