# Evaluate bounded generated artifacts on governed non-Production work branches.
name: PR Generated Artifact Refresh

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches-ignore:
      - Production
    paths:
      - ".changes/e2e/ci-generated-artifact-evidence-routing.json"
      - ".github/ci-evidence-routing.json"
      - ".github/repository-maintenance-tool-governance.json"
      - ".github/workflows/ci-evidence-pr-publisher.yml"
      - ".github/workflows/governed-generated-artifact-refresh.yml"
      - ".github/workflows/pr-generated-artifact-refresh.yml"
      - ".github/workflows/production-promotion-generated-artifact-evidence.yml"
      - ".github/workflows/frontend-surface-dispatch.yml"
      - ".github/workflows/custom-gpt-contract-guard.yml"
      - ".github/workflows/spec-kit-work-map-autofix-recovery-dispatch.yml"
      - ".github/workflows/spec-kit-work-map-autofix.yml"
      - ".github/workflows/spec-kit-work-map-integration.yml"
      - ".specify/work-map-currentness-probe.txt"
      - "docs/**"
      - "http-generic-api/openapi.yaml"
      - "http-generic-api/openapi*.yaml"
      - "http-generic-api/openapi/**/*.yaml"
      - "http-generic-api/openapi-route-contracts.yaml"
      - "http-generic-api/routes/**"
      - "http-generic-api/scripts/frontend-operation-governance-generator.mjs"
      - "http-generic-api/scripts/frontend-surface-dispatch.mjs"
      - "http-generic-api/scripts/generate-custom-gpt-schemas.mjs"
      - "http-generic-api/scripts/generated-artifact-refresh-pr-publisher.mjs"
      - "http-generic-api/scripts/generated-artifact-refresh-runner.mjs"
      - "http-generic-api/scripts/maintenance-tools/generated-artifact-refresh.mjs"
      - "http-generic-api/scripts/test-generated-artifact-refresh-maintenance-tool.mjs"
      - "http-generic-api/scripts/test-generated-artifact-refresh-pr-publisher.mjs"
      - "http-generic-api/scripts/openapi-autofill-missing-routes.mjs"
      - "http-generic-api/scripts/openapi-precise-contract-registry-sync.mjs"
      - "http-generic-api/scripts/openapi-runtime-auth-sync.mjs"
      - "http-generic-api/scripts/repo-maintenance-sync.mjs"
      - "http-generic-api/scripts/test-manifest.mjs"
      - "http-generic-api/package.json"
      - "http-generic-api/package-lock.json"
      - "canonicals/openapi/**/*.yaml"
  workflow_dispatch:
    inputs:
      target_ref:
        description: Exact governed work branch to evaluate
        required: true
        type: string
      expected_head_sha:
        description: Exact current 40-character branch head SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pr-generated-artifact-refresh-${{ github.event.pull_request.number || inputs.target_ref || github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'github-actions[bot]' &&
       (startsWith(github.event.pull_request.head.ref, 'gpt/') ||
        startsWith(github.event.pull_request.head.ref, 'cert/')))
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EVENT_NAME: ${{ github.event_name }}
      CI_SOURCE_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_head_sha || github.event.pull_request.head.sha }}
      TARGET_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.event.pull_request.head.ref }}
      REPORT_PATH: ${{ runner.temp }}/pr-generated-artifact-refresh-summary.json
      REPORT_MARKDOWN_PATH: ${{ runner.temp }}/pr-generated-artifact-refresh-summary.md
    steps:
      - name: Validate exact candidate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CI_SOURCE_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            [[ "${TARGET_REF}" =~ ^(gpt|cert|fix|feat|chore|docs|release)/[A-Za-z0-9._/-]+$ ]]
            [[ "${TARGET_REF}" != "main" && "${TARGET_REF}" != "Production" ]]
          else
            [[ "${TARGET_REF}" =~ ^(gpt|cert)/[A-Za-z0-9._/-]+$ ]]
          fi

      - name: Checkout exact governed PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CI_SOURCE_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify local and remote exact-head identity
        shell: bash
        run: |
          set -euo pipefail
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin "refs/heads/${TARGET_REF}" | awk '{print $1}')"
          [[ "$local_sha" == "$CI_SOURCE_HEAD_SHA" ]]
          [[ "$remote_sha" == "$CI_SOURCE_HEAD_SHA" ]]

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Test canonical evidence publisher
        working-directory: http-generic-api
        run: node scripts/test-generated-artifact-refresh-pr-publisher.mjs

      - name: Test governed mutation safety
        working-directory: http-generic-api
        run: node scripts/test-generated-artifact-refresh-maintenance-tool.mjs

      - name: Evaluate generated artifacts without repository mutation
        working-directory: http-generic-api
        run: node scripts/generated-artifact-refresh-runner.mjs

      - name: Upload canonical generated-artifact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-generated-artifact-refresh-${{ github.run_id }}-summary
          path: |
            ${{ env.REPORT_PATH }}
            ${{ env.REPORT_MARKDOWN_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Enforce canonical report decision
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, 'utf8'));
          if (report.contract !== 'mad4b.pr-generated-artifact-refresh-summary.v1') {
            throw new Error('Generated-artifact canonical report contract mismatch.');
          }
          if (report.secrets_included !== false) {
            throw new Error('Generated-artifact canonical report must declare secrets_included=false.');
          }
          if (report.outcome === 'passed') process.exit(0);
          const failure = report.first_failure || {};
          const title = `Generated artifact refresh ${failure.code || 'blocked'}`
            .replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
          const message = `${failure.step || 'unknown'}: ${failure.stderr_tail || failure.stdout_tail || 'Canonical report blocked.'}`
            .replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
          console.log(`::error title=${title}::${message.slice(0, 1000)}`);
          process.exit(1);
          NODE

  work-map-recovery-activation:
    name: Activate exact-head Work Map recovery
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      startsWith(github.event.pull_request.head.ref, 'gpt/') &&
      contains(github.event.pull_request.body, '<!-- work-map-autofix:authorized -->')
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      TARGET_REF: ${{ github.event.pull_request.head.ref }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      AUTHORIZATION_MARKER: '<!-- work-map-autofix:authorized -->'
      REPORT_PATH: ${{ runner.temp }}/work-map-recovery-activation.json
    steps:
      - name: Validate exact current Work Map recovery target
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          [[ "${EXPECTED_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${TARGET_REF}" =~ ^gpt/[A-Za-z0-9._/-]+$ ]]

          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r '.state' <<<"${pr}")" = "open"
          test "$(jq -r '.draft' <<<"${pr}")" = "false"
          test "$(jq -r '.base.ref' <<<"${pr}")" = "main"
          test "$(jq -r '.head.repo.full_name' <<<"${pr}")" = "${GITHUB_REPOSITORY}"
          test "$(jq -r '.head.ref' <<<"${pr}")" = "${TARGET_REF}"
          test "$(jq -r '.head.sha' <<<"${pr}")" = "${EXPECTED_HEAD_SHA}"
          jq -er '.body // ""' <<<"${pr}" | grep -Fq "${AUTHORIZATION_MARKER}"

          behind_by="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${EXPECTED_HEAD_SHA}" --jq '.behind_by')"
          if [[ "${behind_by}" != "0" ]]; then
            echo "PR head is behind main by ${behind_by} commit(s); refusing recovery activation."
            exit 1
          fi
          remote_sha="$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${TARGET_REF}" | awk '{print $1}')"
          test "${remote_sha}" = "${EXPECTED_HEAD_SHA}"
          echo "behind_by=${behind_by}" >> "$GITHUB_OUTPUT"

      - name: Enable and dispatch trusted recovery workflow
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          recovery_workflow="spec-kit-work-map-autofix-recovery-dispatch.yml"
          state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${recovery_workflow}" --jq '.state')"
          if [[ "${state}" != "active" ]]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${recovery_workflow}/enable"
          fi
          readback_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${recovery_workflow}" --jq '.state')"
          test "${readback_state}" = "active"

          dispatch_started_at="$(date -u -d '5 seconds ago' +'%Y-%m-%dT%H:%M:%SZ')"
          expected_title="Spec Kit Work Map Autofix Recovery Dispatch · PR ${PR_NUMBER}"
          payload="$(jq -cn \
            --arg ref main \
            --arg pr_number "${PR_NUMBER}" \
            '{ref:$ref,inputs:{pr_number:$pr_number,confirmation:"RECOVER_SPEC_KIT_WORK_MAP_AUTOFIX"}}')"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${recovery_workflow}/dispatches" \
            --input - <<<"${payload}"

          delegated_run_id=""
          for _ in $(seq 1 30); do
            delegated_run_id="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${recovery_workflow}/runs?event=workflow_dispatch&branch=main&per_page=30" \
              --jq "[.workflow_runs[] | select(.created_at >= \"${dispatch_started_at}\" and .display_title == \"${expected_title}\")] | sort_by(.created_at) | last | .id // empty")"
            if [[ -n "${delegated_run_id}" ]]; then
              break
            fi
            sleep 2
          done
          [[ "${delegated_run_id}" =~ ^[1-9][0-9]*$ ]]
          echo "workflow_state=${readback_state}" >> "$GITHUB_OUTPUT"
          echo "run_id=${delegated_run_id}" >> "$GITHUB_OUTPUT"

      - name: Publish activation bridge evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BEHIND_BY: ${{ steps.target.outputs.behind_by }}
          WORKFLOW_STATE: ${{ steps.dispatch.outputs.workflow_state }}
          DELEGATED_RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          outcome="passed"
          if [[ "${{ job.status }}" != "success" ]]; then
            outcome="blocked"
          fi
          jq -n \
            --arg contract "mad4b.work-map-recovery-activation-bridge.v1" \
            --arg outcome "${outcome}" \
            --arg target_ref "${TARGET_REF}" \
            --arg expected_head_sha "${EXPECTED_HEAD_SHA}" \
            --arg behind_by "${BEHIND_BY:-unknown}" \
            --arg workflow_state "${WORKFLOW_STATE:-unknown}" \
            --arg delegated_run_id "${DELEGATED_RUN_ID:-none}" \
            --argjson pr_number "${PR_NUMBER}" \
            '{contract:$contract,outcome:$outcome,pr_number:$pr_number,target_ref:$target_ref,expected_head_sha:$expected_head_sha,behind_by:$behind_by,recovery_workflow_state:$workflow_state,delegated_recovery_run_id:$delegated_run_id,direct_repository_mutation:false,protected_branch_mutation:false,force_push:false,secrets_included:false}' \
            > "${REPORT_PATH}"
          body="WORK_MAP_RECOVERY_ACTIVATION_BRIDGE outcome=${outcome} expected_head_sha=${EXPECTED_HEAD_SHA} target_ref=${TARGET_REF} behind_by=${BEHIND_BY:-unknown} recovery_workflow_state=${WORKFLOW_STATE:-unknown} delegated_recovery_run_id=${DELEGATED_RUN_ID:-none} direct_repository_mutation=false protected_branch_mutation=false force_push=false"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="${body}"

      - name: Upload activation bridge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-map-recovery-activation-${{ github.run_id }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: warn
          retention-days: 30
