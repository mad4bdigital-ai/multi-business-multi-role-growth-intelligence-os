# Trigger bounded generated-artifact reconciliation for Brand Skills.
# Temporary governed current-main refresh trigger; remove after bounded artifacts commit.
name: PR Generated Artifact Refresh

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "http-generic-api/openapi.yaml"
      - "http-generic-api/openapi*.yaml"
      - "http-generic-api/openapi/**/*.yaml"
      - "http-generic-api/openapi-route-contracts.yaml"
      - "http-generic-api/routes/**"
      - "http-generic-api/scripts/frontend-operation-governance-generator.mjs"
      - "http-generic-api/scripts/frontend-surface-dispatch.mjs"
      - "http-generic-api/scripts/generate-custom-gpt-schemas.mjs"
      - "http-generic-api/scripts/openapi-autofill-missing-routes.mjs"
      - "http-generic-api/scripts/openapi-precise-contract-registry-sync.mjs"
      - "http-generic-api/scripts/openapi-runtime-auth-sync.mjs"
      - "http-generic-api/scripts/repo-maintenance-sync.mjs"
      - "http-generic-api/scripts/test-manifest.mjs"
      - "http-generic-api/package.json"
      - "http-generic-api/package-lock.json"
      - "canonicals/openapi/**/*.yaml"
      - ".github/workflows/frontend-surface-dispatch.yml"
      - ".github/workflows/custom-gpt-contract-guard.yml"
      - ".github/workflows/pr-generated-artifact-refresh.yml"

permissions:
  contents: read

concurrency:
  group: pr-generated-artifact-refresh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'gpt/') &&
      github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout governed PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Generate bounded artifacts
        working-directory: http-generic-api
        run: |
          git fetch origin main --depth=1
          node scripts/openapi-precise-contract-registry-sync.mjs --write
          node scripts/openapi-autofill-missing-routes.mjs --write
          npm run frontend:dispatch:generate -- --baseline-ref=main
          node scripts/generate-custom-gpt-schemas.mjs --write

      - name: Verify generated contracts before commit
        working-directory: http-generic-api
        run: |
          node test-openapi-autofill-missing-routes.mjs
          node test-frontend-operation-governance-generator.mjs
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-openapi-route-coverage.mjs
          npm run openapi:auth:check
          npm run schemas:guard

      - name: Enforce bounded write set
        shell: bash
        run: |
          mapfile -t CHANGED < <(git status --porcelain --untracked-files=all | sed -E 's/^...//')
          if [[ ${#CHANGED[@]} -eq 0 ]]; then
            echo "Generated artifacts are already current."
            exit 0
          fi

          UNEXPECTED=""
          for file in "${CHANGED[@]}"; do
            case "$file" in
              http-generic-api/openapi.yaml|\
              http-generic-api/frontend-operation-governance.generated.json|\
              http-generic-api/frontend-surface-dispatch.generated.json|\
              http-generic-api/openapi/frontend-runtime-routes.generated.yaml|\
              http-generic-api/openapi/openapi.custom-gpt.auth-dispatcher.yaml|\
              http-generic-api/openapi/openapi.custom-gpt.activation-admin.yaml|\
              http-generic-api/openapi/openapi.tenant-gpt.auth.yaml|\
              http-generic-api/openapi/openapi.tenant-gpt.activation.yaml|\
              http-generic-api/openapi.gpt-action.local-connector.yaml)
                ;;
              *)
                UNEXPECTED+="$file"$'\n'
                ;;
            esac
          done

          if [[ -n "$UNEXPECTED" ]]; then
            echo "::error::Generator changed files outside the bounded artifact set"
            printf '%s' "$UNEXPECTED"
            exit 1
          fi

      - name: Commit generated artifacts
        shell: bash
        env:
          TARGET_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          mapfile -t CHANGED < <(git status --porcelain --untracked-files=all | sed -E 's/^...//')
          if [[ ${#CHANGED[@]} -eq 0 ]]; then
            echo "No generated artifact commit is required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${CHANGED[@]}"
          git commit -m "chore(ci): refresh generated contract artifacts"
          git push origin "HEAD:${TARGET_REF}"
