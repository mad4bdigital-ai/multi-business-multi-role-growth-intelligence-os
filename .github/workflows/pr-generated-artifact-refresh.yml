# Evaluate bounded generated artifacts and full derived-state closure on every non-Production PR to main.
name: PR Generated Artifact Refresh

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:
    inputs:
      target_ref:
        description: Exact governed work branch to evaluate
        required: true
        type: string
      expected_head_sha:
        description: Exact current 40-character branch head SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pr-generated-artifact-refresh-${{ github.event.pull_request.number || inputs.target_ref || github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'github-actions[bot]')
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EVENT_NAME: ${{ github.event_name }}
      CI_SOURCE_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_head_sha || github.event.pull_request.head.sha }}
      CI_CLOSURE_CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.sha || inputs.expected_head_sha }}
      CLOSURE_CANDIDATE_KIND: ${{ github.event_name == 'pull_request' && 'github_merge_candidate' || 'exact_head' }}
      TARGET_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.event.pull_request.head.ref }}
    steps:
      - name: Initialize bounded report paths after runner allocation
        shell: bash
        run: |
          set -euo pipefail
          report_dir="${RUNNER_TEMP}/pr-generated-artifact-refresh"
          rm -rf "${report_dir}"
          mkdir -p "${report_dir}"
          echo "REPORT_PATH=${report_dir}/pr-generated-artifact-refresh-summary.json" >> "${GITHUB_ENV}"
          echo "REPORT_MARKDOWN_PATH=${report_dir}/pr-generated-artifact-refresh-summary.md" >> "${GITHUB_ENV}"
          echo "CLOSURE_REPORT_PATH=${report_dir}/derived-state-closure.json" >> "${GITHUB_ENV}"

      - name: Validate exact candidate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CI_SOURCE_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${CI_CLOSURE_CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${TARGET_REF}" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "${TARGET_REF}" != "main" && "${TARGET_REF}" != "Production" ]]

      - name: Checkout exact closure candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CI_CLOSURE_CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            http-generic-api/package-lock.json

      - name: Install root dependencies without lifecycle side effects
        run: npm ci --ignore-scripts

      - name: Install API dependencies without lifecycle side effects
        working-directory: http-generic-api
        run: npm ci --ignore-scripts

      - name: Validate derived-state governance contract
        run: node .github/tests/derived-state-closure.test.mjs

      - name: Verify exact merge-candidate derived-state closure
        id: derived_state_closure
        continue-on-error: true
        run: >-
          node .github/scripts/derived-state-closure.mjs
          --expected-sha "$CI_CLOSURE_CANDIDATE_SHA"
          --candidate-kind "$CLOSURE_CANDIDATE_KIND"
          --report-file "$CLOSURE_REPORT_PATH"

      - name: Upload canonical derived-state closure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: derived-state-closure-${{ github.run_id }}
          path: ${{ env.CLOSURE_REPORT_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Enforce derived-state closure before legacy artifact evaluation
        if: steps.derived_state_closure.outcome != 'success'
        shell: bash
        run: |
          echo "::error::Exact merge-candidate Derived State Closure did not converge. Inspect the canonical closure artifact for the governed repair recipe set."
          exit 1

      - name: Checkout exact governed PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CI_SOURCE_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify local and remote exact-head identity
        shell: bash
        run: |
          set -euo pipefail
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin "refs/heads/${TARGET_REF}" | awk '{print $1}')"
          [[ "$local_sha" == "$CI_SOURCE_HEAD_SHA" ]]
          [[ "$remote_sha" == "$CI_SOURCE_HEAD_SHA" ]]

      - name: Test canonical evidence publisher
        working-directory: http-generic-api
        run: node scripts/test-generated-artifact-refresh-pr-publisher.mjs

      - name: Test governed mutation safety
        working-directory: http-generic-api
        run: node scripts/test-generated-artifact-refresh-maintenance-tool.mjs

      - name: Evaluate generated artifacts without repository mutation
        working-directory: http-generic-api
        run: node scripts/generated-artifact-refresh-runner.mjs

      - name: Upload canonical generated-artifact evidence
        if: always() && steps.derived_state_closure.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-generated-artifact-refresh-${{ github.run_id }}-summary
          path: |
            ${{ env.REPORT_PATH }}
            ${{ env.REPORT_MARKDOWN_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Enforce canonical report decision
        if: always() && steps.derived_state_closure.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, 'utf8'));
          if (report.contract !== 'mad4b.pr-generated-artifact-refresh-summary.v1') {
            throw new Error('Generated-artifact canonical report contract mismatch.');
          }
          if (report.secrets_included !== false) {
            throw new Error('Generated-artifact canonical report must declare secrets_included=false.');
          }
          if (report.outcome === 'passed') process.exit(0);
          const failure = report.first_failure || {};
          const title = `Generated artifact refresh ${failure.code || 'blocked'}`
            .replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
          const message = `${failure.step || 'unknown'}: ${failure.stderr_tail || failure.stdout_tail || 'Canonical report blocked.'}`
            .replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
          console.log(`::error title=${title}::${message.slice(0, 1000)}`);
          process.exit(1);
          NODE
