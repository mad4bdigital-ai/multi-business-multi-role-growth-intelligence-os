name: Spec 009 Generate Current Branch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Generate Custom GPT schemas
        working-directory: http-generic-api
        run: npm run schemas:generate

      - name: Sync activation gateway bundle
        working-directory: http-generic-api
        run: npm run activation-gateway:bundle:sync

      - name: Commit generated artifacts to current branch
        shell: bash
        run: |
          git config user.name "admin-assitant-growth-os[bot]"
          git config user.email "283129699+admin-assitant-growth-os[bot]@users.noreply.github.com"
          git add http-generic-api/openapi/openapi.tenant-gpt.activation.yaml
          git add edge/activation-gateway/generated/route-policy.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Spec 009: regenerate tenant activation contracts"
          git push origin HEAD:${GITHUB_REF_NAME}
