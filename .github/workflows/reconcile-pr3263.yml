name: Reconcile PR 3263

on:
  push:
    branches:
      - gpt/workspace-lifecycle-read-callability-v1
    paths:
      - .github/workflows/reconcile-pr3263.yml

permissions:
  contents: write

concurrency:
  group: reconcile-pr3263
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout governed branch
        uses: actions/checkout@v5
        with:
          ref: gpt/workspace-lifecycle-read-callability-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Merge current main and resolve canonical OpenAPI
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          if ! git merge --no-commit --no-ff origin/main; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            unexpected="$(printf '%s\n' "$conflicts" | grep -v '^http-generic-api/openapi.yaml$' || true)"
            if [[ -n "$unexpected" ]]; then
              echo "::error::Unexpected merge conflicts"
              printf '%s\n' "$unexpected"
              exit 1
            fi
            git checkout --theirs -- http-generic-api/openapi.yaml
            git add http-generic-api/openapi.yaml
          fi

          python3 <<'PY'
          from pathlib import Path

          path = Path("http-generic-api/openapi.yaml")
          text = path.read_text(encoding="utf-8")
          operation_ids = (
              "listCurrentWorkspaceMembers",
              "listCurrentWorkspaceInvitations",
              "listCurrentWorkspaceAccessRequests",
          )
          counts = [text.count(f"operationId: {operation_id}") for operation_id in operation_ids]
          if counts == [1, 1, 1]:
              raise SystemExit(0)
          if counts != [0, 0, 0]:
              raise SystemExit(f"partial_or_duplicate_workspace_lifecycle_openapi_contract:{counts}")

          marker = "  /me/workspaces/{tenant_id}/brands:\n"
          if text.count(marker) != 1:
              raise SystemExit("workspace_brands_openapi_insertion_marker_not_unique")

          block = '''  /me/workspaces/{tenant_id}/members:
            get:
              tags: [connected-systems]
              security:
                - userJwtAuth: []
              operationId: listCurrentWorkspaceMembers
              summary: List members visible to an active workspace member
              parameters:
                - in: path
                  name: tenant_id
                  required: true
                  schema: { type: string }
              responses:
                "200": { description: Workspace members, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
                "401": { description: Authentication required }
                "403": { description: Active workspace membership required }
                "500": { description: Workspace member listing failed }
          /me/workspaces/{tenant_id}/invitations:
            get:
              tags: [connected-systems]
              security:
                - userJwtAuth: []
              operationId: listCurrentWorkspaceInvitations
              summary: List workspace invitations visible to an owner or admin
              parameters:
                - in: path
                  name: tenant_id
                  required: true
                  schema: { type: string }
                - in: query
                  name: status
                  required: false
                  schema: { type: string, default: pending }
              responses:
                "200": { description: Workspace invitations, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
                "401": { description: Authentication required }
                "403": { description: Workspace owner or admin role required }
                "500": { description: Workspace invitation listing failed }
          /me/workspaces/{tenant_id}/access-requests:
            get:
              tags: [connected-systems]
              security:
                - userJwtAuth: []
              operationId: listCurrentWorkspaceAccessRequests
              summary: List workspace access requests visible to an owner or admin
              parameters:
                - in: path
                  name: tenant_id
                  required: true
                  schema: { type: string }
                - in: query
                  name: status
                  required: false
                  schema: { type: string, default: pending }
              responses:
                "200": { description: Workspace access requests, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
                "401": { description: Authentication required }
                "403": { description: Workspace owner or admin role required }
                "500": { description: Workspace access request listing failed }
          '''
          path.write_text(text.replace(marker, block + marker), encoding="utf-8")
          PY

          git add http-generic-api/openapi.yaml
          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "::error::Unresolved merge conflicts remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Verify focused contracts
        working-directory: http-generic-api
        run: |
          node test-context-kernel-hardcoding-scan.mjs
          node test-workspace-lifecycle-foundation.mjs
          node test-resource-api-coverage.mjs
          node test-surface-contract-discovery.mjs

      - name: Regenerate deterministic artifacts
        working-directory: http-generic-api
        run: |
          npm run frontend:dispatch:generate -- --baseline-ref=main
          node scripts/generate-custom-gpt-schemas.mjs --write
          node test-frontend-operation-governance-generator.mjs
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-openapi-route-coverage.mjs
          npm run openapi:auth:check
          npm run schemas:guard

      - name: Commit governed reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/reconcile-pr3263.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Merge current main into workspace lifecycle callability branch"
          git push origin HEAD:gpt/workspace-lifecycle-read-callability-v1
