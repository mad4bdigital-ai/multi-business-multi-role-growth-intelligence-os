name: TEMP Spec 014 Binding Writer 6626 86a8adc7

on:
  pull_request:
    branches:
      - gpt/spec014-binding-writer-base-6626-a06e8e08-86a8adc7
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: temp-spec014-binding-writer-6626-86a8adc7
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh exact Spec 014 bindings on PR 6626
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      CANONICAL_PR: '6626'
      EXPECTED_MAIN_SHA: a06e8e087609508e3a1944ddaab8cf0156484529
      EXPECTED_HEAD_SHA: 86a8adc7fc7de4f28c9e8732811e978e24b9d01a
      TARGET_BRANCH: fix/generated-artifact-refresh-eligible-request-json-20260807
      TRIGGER_BRANCH: fix/spec014-binding-refresh-trigger-6626-86a8adc7-20260808
      TRIGGER_PATH: .changes/e2e/spec014-binding-refresh-trigger-6626-86a8adc7.json
      AUTHORIZATION_MARKER: '<!-- spec014-final-work-map-binding-refresh:authorized -->'
      HOSTINGER_FEATURE: 014-governed-hostinger-storage-orchestration
      RETAIL_FEATURE: 014-retail-commerce-operations-growth-os
      HOSTINGER_MANIFEST: specs/014-governed-hostinger-storage-orchestration/work-map-integration.json
      RETAIL_MANIFEST: specs/014-retail-commerce-operations-growth-os/work-map-integration.json
      HOSTINGER_TASKS: specs/014-governed-hostinger-storage-orchestration/tasks.md
      EXPECTED_FINGERPRINT: dc1be9ac9080bb7a0a895e4090c4e17f94c68a1683fbe3720df6a271223a4198
      EXPECTED_INDEX_SOURCE_HASH: 1685427e56a6eaa3fedcb62b539e960d6822db19601081a7bf730a8991f95748
      EXPECTED_COVERAGE_SOURCE_HASH: 35f4ca73a6c43f54dd62e9d6242a03f110667097719e925c7ece9b68daa5516f
    steps:
      - name: Initialize bounded evidence directory
        shell: bash
        run: |
          set -Eeuo pipefail
          report_dir="${RUNNER_TEMP}/spec014-binding-refresh-6626-86a8adc7"
          rm -rf "${report_dir}"
          mkdir -p "${report_dir}"
          echo "REPORT_DIR=${report_dir}" >> "${GITHUB_ENV}"

      - name: Validate trigger, exact target identity, and consume authorization
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_PR: ${{ github.event.pull_request.number }}
        run: |
          set -Eeuo pipefail
          trigger="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${TRIGGER_PR}")"
          test "$(jq -r '.state' <<<"${trigger}")" = 'open'
          test "$(jq -r '.base.ref' <<<"${trigger}")" = 'gpt/spec014-binding-writer-base-6626-a06e8e08-86a8adc7'
          test "$(jq -r '.head.repo.full_name' <<<"${trigger}")" = "${GITHUB_REPOSITORY}"
          test "$(jq -r '.head.ref' <<<"${trigger}")" = "${TRIGGER_BRANCH}"
          trigger_files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${TRIGGER_PR}/files" --jq '.[].filename')"
          test "${trigger_files}" = "${TRIGGER_PATH}"

          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${CANONICAL_PR}")"
          test "$(jq -r '.state' <<<"${pr}")" = 'open'
          test "$(jq -r '.draft' <<<"${pr}")" = 'false'
          test "$(jq -r '.base.ref' <<<"${pr}")" = 'main'
          test "$(jq -r '.base.sha' <<<"${pr}")" = "${EXPECTED_MAIN_SHA}"
          test "$(jq -r '.head.repo.full_name' <<<"${pr}")" = "${GITHUB_REPOSITORY}"
          test "$(jq -r '.head.ref' <<<"${pr}")" = "${TARGET_BRANCH}"
          test "$(jq -r '.head.sha' <<<"${pr}")" = "${EXPECTED_HEAD_SHA}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "${EXPECTED_MAIN_SHA}"

          comparison="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${EXPECTED_MAIN_SHA}...${EXPECTED_HEAD_SHA}")"
          test "$(jq -r '.behind_by' <<<"${comparison}")" = '0'
          test "$(jq -r '.merge_base_commit.sha' <<<"${comparison}")" = "${EXPECTED_MAIN_SHA}"

          body="$(jq -r '.body // ""' <<<"${pr}")"
          test "$(grep -Fo "${AUTHORIZATION_MARKER}" <<<"${body}" | wc -l | tr -d ' ')" = '1'
          next_body="${body//${AUTHORIZATION_MARKER}/}"
          jq -n --arg body "${next_body}" '{body:$body}' > "${REPORT_DIR}/consume-marker.json"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${CANONICAL_PR}" --input "${REPORT_DIR}/consume-marker.json" >/dev/null
          if gh api "repos/${GITHUB_REPOSITORY}/pulls/${CANONICAL_PR}" --jq '.body // ""' | grep -Fq "${AUTHORIZATION_MARKER}"; then
            echo 'Authorization marker removal readback failed.' >&2
            exit 1
          fi

          jq -n --arg expected_main_sha "${EXPECTED_MAIN_SHA}" --arg expected_head_sha "${EXPECTED_HEAD_SHA}" '{identity:"pinned",authorization_consumed:true,expected_main_sha:$expected_main_sha,expected_head_sha:$expected_head_sha,behind_by:0}' > "${REPORT_DIR}/identity.json"

      - name: Checkout exact authorized candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Run canonical producer for Hostinger and Retail
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key "${HOSTINGER_FEATURE}" | tee "${REPORT_DIR}/hostinger-write.json"
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key "${RETAIL_FEATURE}" | tee "${REPORT_DIR}/retail-write.json"
          jq -e --arg fingerprint "${EXPECTED_FINGERPRINT}" --arg index_hash "${EXPECTED_INDEX_SOURCE_HASH}" --arg coverage_hash "${EXPECTED_COVERAGE_SOURCE_HASH}" '.ok == true and .mode == "write" and .current_registry.fingerprint == $fingerprint and .current_registry.index_source_hash == $index_hash and .current_registry.coverage_source_hash == $coverage_hash' "${REPORT_DIR}/hostinger-write.json" >/dev/null
          jq -e --arg fingerprint "${EXPECTED_FINGERPRINT}" --arg index_hash "${EXPECTED_INDEX_SOURCE_HASH}" --arg coverage_hash "${EXPECTED_COVERAGE_SOURCE_HASH}" '.ok == true and .mode == "write" and .current_registry.fingerprint == $fingerprint and .current_registry.index_source_hash == $index_hash and .current_registry.coverage_source_hash == $coverage_hash' "${REPORT_DIR}/retail-write.json" >/dev/null
          git diff --name-only | sort > "${REPORT_DIR}/changed-files.txt"
          grep -Fxq "${HOSTINGER_MANIFEST}" "${REPORT_DIR}/changed-files.txt"
          grep -Fxq "${RETAIL_MANIFEST}" "${REPORT_DIR}/changed-files.txt"
          unexpected="$(grep -Fvx -e "${HOSTINGER_MANIFEST}" -e "${RETAIL_MANIFEST}" -e "${HOSTINGER_TASKS}" "${REPORT_DIR}/changed-files.txt" || true)"
          test -z "${unexpected}"
          git diff --check

      - name: Prove pre-commit currentness and idempotency
        shell: bash
        run: |
          set -Eeuo pipefail
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --check --feature-key "${HOSTINGER_FEATURE}" | tee "${REPORT_DIR}/hostinger-check-precommit.json"
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --check --feature-key "${RETAIL_FEATURE}" | tee "${REPORT_DIR}/retail-check-precommit.json"
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key "${HOSTINGER_FEATURE}" | tee "${REPORT_DIR}/hostinger-idempotency.json"
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key "${RETAIL_FEATURE}" | tee "${REPORT_DIR}/retail-idempotency.json"
          jq -e '.ok == true and (.changed_files | length) == 0' "${REPORT_DIR}/hostinger-idempotency.json" >/dev/null
          jq -e '.ok == true and (.changed_files | length) == 0' "${REPORT_DIR}/retail-idempotency.json" >/dev/null
          node http-generic-api/scripts/platform-work-map-generator.mjs --check | tee "${REPORT_DIR}/work-map-currentness-precommit.json"
          REPORT_PATH="${REPORT_DIR}/hostinger-readback-precommit.json" node http-generic-api/scripts/spec014-final-work-map-readback.mjs | tee "${REPORT_DIR}/hostinger-readback-precommit.stdout.json"
          jq -e '.ok == true and ((.findings | length) == 0)' "${REPORT_DIR}/hostinger-readback-precommit.json" >/dev/null

      - name: Commit exact bounded write-set and validate result commit
        id: refresh
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${EXPECTED_HEAD_SHA}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${HOSTINGER_MANIFEST}" "${RETAIL_MANIFEST}" "${HOSTINGER_TASKS}"
          git diff --cached --name-only | sort > "${REPORT_DIR}/committed-files.txt"
          grep -Fxq "${HOSTINGER_MANIFEST}" "${REPORT_DIR}/committed-files.txt"
          grep -Fxq "${RETAIL_MANIFEST}" "${REPORT_DIR}/committed-files.txt"
          unexpected_cached="$(grep -Fvx -e "${HOSTINGER_MANIFEST}" -e "${RETAIL_MANIFEST}" -e "${HOSTINGER_TASKS}" "${REPORT_DIR}/committed-files.txt" || true)"
          test -z "${unexpected_cached}"
          git commit -m 'fix(spec): refresh final Spec 014 Work Map bindings'
          result_head_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_HEAD_SHA}"
          test -z "$(git status --porcelain)"
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --check --feature-key "${HOSTINGER_FEATURE}" | tee "${REPORT_DIR}/hostinger-check-result.json"
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --check --feature-key "${RETAIL_FEATURE}" | tee "${REPORT_DIR}/retail-check-result.json"
          node http-generic-api/scripts/platform-work-map-generator.mjs --check | tee "${REPORT_DIR}/work-map-currentness-result.json"
          REPORT_PATH="${REPORT_DIR}/hostinger-readback-result.json" node http-generic-api/scripts/spec014-final-work-map-readback.mjs | tee "${REPORT_DIR}/hostinger-readback-result.stdout.json"
          jq -e '.ok == true and ((.findings | length) == 0)' "${REPORT_DIR}/hostinger-readback-result.json" >/dev/null
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${TARGET_BRANCH}"
          observed_remote=''
          observed_pr=''
          for _ in $(seq 1 30); do
            observed_remote="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
            observed_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${CANONICAL_PR}" --jq '.head.sha')"
            if [[ "${observed_remote}" = "${result_head_sha}" && "${observed_pr}" = "${result_head_sha}" ]]; then break; fi
            sleep 2
          done
          test "${observed_remote}" = "${result_head_sha}"
          test "${observed_pr}" = "${result_head_sha}"
          echo "result_head_sha=${result_head_sha}" >> "${GITHUB_OUTPUT}"
          jq -n --arg result_head_sha "${result_head_sha}" --arg fingerprint "${EXPECTED_FINGERPRINT}" --arg index_source_hash "${EXPECTED_INDEX_SOURCE_HASH}" --arg coverage_source_hash "${EXPECTED_COVERAGE_SOURCE_HASH}" '{contract:"mad4b.spec014-binding-writer-6626.v1",outcome:"passed",result_head_sha:$result_head_sha,official_script:"http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs",features:["014-governed-hostinger-storage-orchestration","014-retail-commerce-operations-growth-os"],fingerprint:$fingerprint,index_source_hash:$index_source_hash,coverage_source_hash:$coverage_source_hash,candidate_branch_only:true,changed_paths_bounded:true,idempotency_proven:true,protected_branch_mutation:false,force_push:false,provider_dispatch:false,live_database_access:false,migration_apply:false,secrets_included:false}' > "${REPORT_DIR}/summary.json"

      - name: Upload bounded refresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec014-binding-refresh-6626-86a8adc7-${{ github.run_id }}
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish canonical PR evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_HEAD_SHA: ${{ steps.refresh.outputs.result_head_sha }}
        run: |
          set -Eeuo pipefail
          outcome='passed'
          if [[ "${{ steps.refresh.outcome }}" != 'success' ]]; then outcome='blocked'; fi
          body="SPEC014_BINDING_REFRESH_6626 outcome=${outcome} run_id=${GITHUB_RUN_ID} expected_main_sha=${EXPECTED_MAIN_SHA} expected_head_sha=${EXPECTED_HEAD_SHA} result_head_sha=${RESULT_HEAD_SHA:-none} official_script=spec014-refresh-final-work-map-binding.mjs features=hostinger,retail manifest_mutation_authorized=true hostinger_tasks_mutation_authorized=true idempotency_proven=$([[ \"${outcome}\" = passed ]] && echo true || echo false) protected_branch_mutation=false force_push=false provider_dispatch=false live_database_access=false migration_apply=false secrets_included=false"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${CANONICAL_PR}/comments" -f body="${body}" >/dev/null
