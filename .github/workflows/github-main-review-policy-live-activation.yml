name: Governed GitHub Main Review Policy Live Activation

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  activate:
    name: Governed repository policy lifecycle
    if: >-
      github.event.issue.number == 6625 &&
      !github.event.issue.pull_request &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      contains(fromJSON('["AUTHORIZE_GITHUB_MAIN_REVIEW_POLICY_READINESS","APPLY_GITHUB_MAIN_REVIEW_POLICY","VERIFY_GITHUB_MAIN_REVIEW_POLICY","AUTHORIZE_GITHUB_PRODUCTION_POLICY_READINESS","APPLY_GITHUB_PRODUCTION_POLICY","VERIFY_GITHUB_PRODUCTION_POLICY"]'), github.event.comment.body)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    concurrency:
      group: github-repository-policy-live-${{ github.event.comment.body }}
      cancel-in-progress: false
    env:
      POLICY_PHASE: ${{ format('{0}:{1}', contains(github.event.comment.body, 'PRODUCTION') && 'Production' || 'main', startsWith(github.event.comment.body, 'AUTHORIZE_') && 'readiness' || startsWith(github.event.comment.body, 'APPLY_') && 'apply' || 'verify') }}
      RUNTIME_BASE_URL: https://auth.mad4b.com
      BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
      GH_READ_TOKEN: ${{ github.token }}
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      CONTROL_ISSUE: '6625'
      EVIDENCE_DIR: .artifacts/github-repository-policy
    steps:
      - name: Checkout exact issue-comment event head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Execute branch-parameterized repository policy lifecycle
        run: node .github/ops/github-main-review-policy-live-activation.mjs
      - name: Upload no-secret repository policy evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-repository-policy-evidence-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
