name: Spec 011 Phase1 Durable Control Closeout Once

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  closeout:
    if: github.event.pull_request.head.ref == 'gpt/spec-011-phase1-durable-control-closeout-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out closeout branch
        uses: actions/checkout@v5
        with:
          ref: gpt/spec-011-phase1-durable-control-closeout-20260730
          fetch-depth: 0
          persist-credentials: true

      - name: Record bounded closeout evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('specs/011-durable-governed-execution-and-agent-delegation')
          manifest_path = root / 'manifest.json'
          completion_path = root / 'completion.json'

          manifest = json.loads(manifest_path.read_text())
          manifest.update({
              'phase1_durable_control_branch': 'gpt/spec-011-phase1-durable-control-20260730',
              'phase1_durable_control_pull_request': 3620,
              'phase1_durable_control_merge_sha': '630a3545f0670268745ff66a94a510d6999b38ae',
              'phase1_durable_control_source_main_sha': 'e4423dc2af737cb2ae64958ab73611a8e0986d76',
              'phase1_durable_control_final_ci_head_sha': 'c72ebc8cfbff51045a1c04561b22ec157f3238d6',
              'phase1_durable_control_final_ci_base_sha': 'f1d513e592091f818cb6e22979a8dfe8d71948be',
              'phase1_durable_control_ancestry_reconciliation_head_sha': '34cbba930adcfd5ea3b8fe28694794a3cc05d29d',
              'phase1_durable_control_ci_run_id': 30582364527,
              'phase1_durable_control_generated_refresh_run_id': 30582364482,
              'phase1_durable_control_frontend_dispatch_run_id': 30582364519,
              'phase1_durable_control_hardcoding_report_run_id': 30582364690,
              'phase1_durable_control_migration_contract': 'http-generic-api/migrations/20260730_spec011_durable_execution_control.sql',
              'phase1_durable_control_production_migration_applied': False,
              'phase1_durable_control_production_database_write': False,
              'phase1_durable_control_production_deployment_performed': False,
              'phase1_durable_control_production_runtime_verified': False,
              'phase1_durable_control_tasks_status': 't100_t106_complete_on_main',
          })
          deliverables = manifest.setdefault('deliverables', [])
          for item in [
              'phase1_durable_control_runtime',
              'phase1_guarded_transition_and_terminal_invariants',
              'phase1_pending_mutation_receipt_before_dispatch',
              'phase1_unknown_outcome_readback_fail_closed',
              'phase1_canonical_status_explain_cancel_next_action',
              'phase1_unique_candidate_resolution_fail_closed',
          ]:
              if item not in deliverables:
                  deliverables.append(item)
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          completion = json.loads(completion_path.read_text())
          delivery = completion.setdefault('delivery', {})
          delivery['phase1_durable_control_pr'] = {
              'number': 3620,
              'branch': 'gpt/spec-011-phase1-durable-control-20260730',
              'role': 'phase1_durable_execution_control_runtime',
              'status': 'merged',
              'merge_sha': '630a3545f0670268745ff66a94a510d6999b38ae',
          }
          implementation_prs = delivery.setdefault('implementation_prs', [])
          if not any(item.get('number') == 3620 for item in implementation_prs):
              implementation_prs.append({
                  'number': 3620,
                  'role': 'phase1_durable_execution_control_runtime',
                  'status': 'merged',
                  'merge_sha': '630a3545f0670268745ff66a94a510d6999b38ae',
              })

          evidence = completion.setdefault('evidence', {})
          evidence['phase1_durable_control'] = {
              'status': 'complete_on_main_production_unapplied',
              'source_main_sha': 'e4423dc2af737cb2ae64958ab73611a8e0986d76',
              'pull_request': 3620,
              'merge_sha': '630a3545f0670268745ff66a94a510d6999b38ae',
              'service': 'http-generic-api/durableExecutionControlService.js',
              'orchestrator': 'http-generic-api/sequentialPlanOrchestrator.js',
              'routes': 'http-generic-api/routes/plannerRoutes.js',
              'test': 'http-generic-api/test-durable-execution-control-service.mjs',
              'migration': 'http-generic-api/migrations/20260730_spec011_durable_execution_control.sql',
              'design': 'phase1-durable-control-runtime.md',
              'tasks': ['T100', 'T101', 'T102', 'T103', 'T104', 'T105', 'T106'],
              'durable_plan_step_event_lifecycle': True,
              'guarded_transitions': True,
              'terminal_invariants': True,
              'pending_mutation_receipt_before_dispatch': True,
              'idempotent_replay': True,
              'unknown_outcome_readback_required': True,
              'canonical_status_explain_cancel_tick_run_next_action': True,
              'ambiguous_candidate_selection_fail_closed': True,
              'public_routes_present': True,
              'migration_contract_present': True,
              'production_migration_applied': False,
              'production_database_write': False,
              'production_deployment_performed': False,
              'production_runtime_verified': False,
              'provider_write_performed_for_closeout': False,
              'secrets_included': False,
          }
          evidence['phase1_durable_control_ci'] = {
              'status': 'pass',
              'head_sha': 'c72ebc8cfbff51045a1c04561b22ec157f3238d6',
              'base_sha': 'f1d513e592091f818cb6e22979a8dfe8d71948be',
              'ancestry_reconciliation_head_sha': '34cbba930adcfd5ea3b8fe28694794a3cc05d29d',
              'ci_run_id': 30582364527,
              'generated_refresh_run_id': 30582364482,
              'frontend_dispatch_run_id': 30582364519,
              'hardcoding_report_run_id': 30582364690,
              'frontend_dispatch': 'pass',
              'generated_contracts': 'pass',
              'hardcoding_ratchet': 'pass',
              'required_checks': [
                  'Syntax Check',
                  'Architecture Drift Detection',
                  'Execution Resolver Gate',
                  'Unit & Integration Tests',
              ],
          }
          evidence['phase1_durable_control_migration'] = {
              'status': 'contract_on_main_production_unapplied',
              'file': 'http-generic-api/migrations/20260730_spec011_durable_execution_control.sql',
              'production_migration_applied': False,
              'production_database_write': False,
              'backfill_performed': False,
              'same_cycle_readback_required_before_apply': True,
          }
          evidence['phase1_durable_control_production_verification'] = {
              'status': 'not_executed_migration_deployment_and_live_readback_required',
              'merge_sha': '630a3545f0670268745ff66a94a510d6999b38ae',
              'final_ci_head_sha': 'c72ebc8cfbff51045a1c04561b22ec157f3238d6',
              'production_migration_applied': False,
              'production_database_write': False,
              'production_deployment_performed': False,
              'production_runtime_verified': False,
              'provider_dispatch_performed': False,
              'rollback_required': False,
              'secrets_included': False,
          }
          audit = evidence.setdefault('post_merge_audit', {})
          audit.update({
              'phase1_durable_control_status': 'complete_on_main_production_unapplied',
              'phase1_durable_control_pull_request': 3620,
              'phase1_durable_control_merge_sha': '630a3545f0670268745ff66a94a510d6999b38ae',
              'phase1_durable_control_ci_status': 'pass',
              'phase1_durable_control_tasks': 'T100-T106_complete',
              'phase1_durable_control_production_migration_applied': False,
              'phase1_durable_control_production_runtime_verified': False,
              'spec_status': 'pending_remaining_phases',
          })
          completion_path.write_text(json.dumps(completion, indent=2) + '\n')
          PY

      - name: Validate JSON and bounded diff
        shell: bash
        run: |
          python3 -m json.tool specs/011-durable-governed-execution-and-agent-delegation/manifest.json >/dev/null
          python3 -m json.tool specs/011-durable-governed-execution-and-agent-delegation/completion.json >/dev/null
          allowed='^(specs/011-durable-governed-execution-and-agent-delegation/manifest.json|specs/011-durable-governed-execution-and-agent-delegation/completion.json|.github/workflows/spec-011-phase1-durable-control-closeout-once.yml)$'
          bad="$(git status --porcelain --untracked-files=all | sed -E 's/^...//' | grep -Ev "$allowed" || true)"
          test -z "$bad" || { echo 'Unexpected closeout paths:'; echo "$bad"; exit 1; }

      - name: Commit clean closeout
        shell: bash
        run: |
          rm -f .github/workflows/spec-011-phase1-durable-control-closeout-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'docs(spec-011): record durable control phase closeout'
          git fetch origin gpt/spec-011-phase1-durable-control-closeout-20260730
          git rebase origin/gpt/spec-011-phase1-durable-control-closeout-20260730
          git push origin HEAD:gpt/spec-011-phase1-durable-control-closeout-20260730
