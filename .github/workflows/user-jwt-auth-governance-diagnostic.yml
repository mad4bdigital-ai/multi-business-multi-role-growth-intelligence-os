name: User JWT Auth Governance Diagnostic

on:
  pull_request:
    branches: [main, Production]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: user-jwt-auth-governance-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: Publish structured JWT governance report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Generate secret-free governance report
        working-directory: http-generic-api
        env:
          BASELINE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$BASELINE_SHA" ]]; then
            args+=("--baseline-ref=$BASELINE_SHA")
          fi
          node scripts/user-jwt-auth-governance-report.mjs \
            "${args[@]}" \
            --report-file="$RUNNER_TEMP/user-jwt-auth-governance-report.json"

      - name: Upload structured governance report
        uses: actions/upload-artifact@v4
        with:
          name: user-jwt-auth-governance-${{ github.run_id }}-summary
          path: ${{ runner.temp }}/user-jwt-auth-governance-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish PR diagnosis
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          REPORT_FILE: ${{ runner.temp }}/user-jwt-auth-governance-report.json
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync(process.env.REPORT_FILE, 'utf8'));
            const marker = '<!-- mad4b-user-jwt-auth-governance-diagnostic -->';
            const findings = Array.isArray(report.violations) && report.violations.length
              ? report.violations.map((item) => `- \`${item.file}\` — \`${item.rule}\` — fingerprint \`${item.evidence_fingerprint || 'not_applicable'}\``)
              : ['- No violations found.'];
            const diagnosticError = report.diagnostic_error
              ? [
                  '',
                  '### Diagnostic generation error',
                  `- Stage: \`${report.diagnostic_error.stage || 'unknown'}\``,
                  `- Name: \`${report.diagnostic_error.name || 'Error'}\``,
                  `- Code: \`${report.diagnostic_error.code || 'none'}\``,
                  `- Message: ${report.diagnostic_error.message || 'not available'}`,
                  '- Raw stderr included: `false`',
                ]
              : [];
            const body = [
              marker,
              '## Automated User JWT auth governance diagnosis',
              '',
              `- Contract: \`${report.contract}\``,
              `- Exact candidate SHA: \`${report.candidate_sha}\``,
              `- Baseline ref: \`${report.baseline_ref || 'none'}\``,
              `- Outcome: **${report.outcome}**`,
              `- Decision detail: \`${report.decision_detail}\``,
              `- Violation count: **${report.violation_count}**`,
              '- Job logs consulted: `false`',
              '- Secrets included: `false`',
              ...diagnosticError,
              '',
              '### Findings',
              ...findings,
              '',
              'This comment is generated from the repository governance script and replaces manual Job-log inspection.',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
