name: Exact Repository Write Prerequisite E2E Tail Validation 6049 V5

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

env:
  EXPECTED_MAIN_SHA: 88439328058c46a87f205cc49be47a1ab0651faf
  EXPECTED_PARENT_SHA: 4a45cd80252999d994290e6edf8172273b11cc83
  EXPECTED_CANDIDATE_SHA: 0100da8833eb95fc881bf3f7b76cb77c56bd3313
  EXPECTED_CANDIDATE_REF: gpt/repository-write-prerequisite-main-72196dee-20260804-v5
  EXPECTED_VALIDATOR_REF: gpt/exact-repository-write-prerequisite-arm-validation-6049-v3
  CANONICAL_PR_NUMBER: '6049'
  EVIDENCE_DIR: /tmp/exact-repository-write-prerequisite-e2e-tail-validation-6049-v5

jobs:
  exact-tail:
    name: Exact one-line E2E contract tail validation
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/exact-repository-write-prerequisite-arm-validation-6049-v3'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Checkout exact validator head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify validator and canonical PR identities
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATOR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VALIDATOR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$VALIDATOR_BASE_SHA" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$VALIDATOR_HEAD_SHA"
          mapfile -t validator_files < <(git diff --name-only "$VALIDATOR_BASE_SHA"..."$VALIDATOR_HEAD_SHA")
          test "${#validator_files[@]}" -eq 1
          test "${validator_files[0]}" = '.github/workflows/exact-repository-write-prerequisite-arm-validation-6049-v3.yml'
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${CANONICAL_PR_NUMBER}")"
          test "$(jq -r '.state' <<<"$pr")" = 'open'
          test "$(jq -r '.draft' <<<"$pr")" = 'true'
          test "$(jq -r '.base.sha' <<<"$pr")" = "$EXPECTED_MAIN_SHA"
          test "$(jq -r '.head.ref' <<<"$pr")" = "$EXPECTED_CANDIDATE_REF"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$EXPECTED_CANDIDATE_SHA"

      - name: Checkout exact canonical candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Verify exact parent delta and 13-file current-main scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git merge-base "$EXPECTED_MAIN_SHA" "$EXPECTED_CANDIDATE_SHA")" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse "$EXPECTED_CANDIDATE_SHA^")" = "$EXPECTED_PARENT_SHA"

          mapfile -t parent_delta < <(git diff --name-only "$EXPECTED_PARENT_SHA"..."$EXPECTED_CANDIDATE_SHA")
          test "${#parent_delta[@]}" -eq 1
          test "${parent_delta[0]}" = '.changes/e2e/repository-write-workflow-prerequisites.json'
          test "$(git diff --numstat "$EXPECTED_PARENT_SHA"..."$EXPECTED_CANDIDATE_SHA" | awk '{print $1":"$2":"$3}')" = '1:1:.changes/e2e/repository-write-workflow-prerequisites.json'
          test "$(git show "$EXPECTED_PARENT_SHA:.changes/e2e/repository-write-workflow-prerequisites.json" | jq -r '.merge_contract.minimum_phase')" = 'resilient'
          test "$(jq -r '.merge_contract.minimum_phase' .changes/e2e/repository-write-workflow-prerequisites.json)" = 'mvp'
          test "$(jq -r '.current_phase' .changes/e2e/repository-write-workflow-prerequisites.json)" = 'resilient'

          mkdir -p "$EVIDENCE_DIR/repository-tool-lifecycle"
          printf '%s\n' \
            '.changes/e2e/repository-write-workflow-prerequisites.json' \
            '.github/workflows/e2e-contract-reference-integrity.yml' \
            '.github/workflows/http-generic-api-fanout-relocation-apply.yml' \
            '.github/workflows/http-generic-api-fanout-relocation.yml' \
            '.github/workflows/repository-write-workflow-prerequisite-guard.yml' \
            '.github/workflows/supervisor-runtime-assurance-alert.yml' \
            '.github/workflows/supervisor-runtime-assurance.yml' \
            '.specify/pipeline-connectivity-contract.json' \
            'docs/runbooks/supervisor-runtime-assurance.md' \
            'http-generic-api/scripts/pipeline-connectivity-check.mjs' \
            'http-generic-api/test-fanout-relocation-ci.mjs' \
            'http-generic-api/test-pipeline-connectivity-check.mjs' \
            'http-generic-api/test-supervisor-runtime-assurance-automation.mjs' \
            > "$EVIDENCE_DIR/expected-files.txt"
          git diff --name-only "$EXPECTED_MAIN_SHA"..."$EXPECTED_CANDIDATE_SHA" | sort > "$EVIDENCE_DIR/actual-files.txt"
          diff -u "$EVIDENCE_DIR/expected-files.txt" "$EVIDENCE_DIR/actual-files.txt"
          git diff --name-status "$EXPECTED_MAIN_SHA" "$EXPECTED_CANDIDATE_SHA" > "$EVIDENCE_DIR/repository-tool-changes.tsv"

      - name: Install HTTP API dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Run exact lifecycle and E2E reference integrity
        shell: bash
        env:
          CANDIDATE_SHA: ${{ env.EXPECTED_CANDIDATE_SHA }}
          BASE_SHA: ${{ env.EXPECTED_MAIN_SHA }}
        run: |
          set -euo pipefail
          node http-generic-api/scripts/maintenance-tools/repository-tool-lifecycle-guard.mjs \
            --changed-files "$EVIDENCE_DIR/repository-tool-changes.tsv" \
            --policy .github/repository-maintenance-tool-governance.json \
            --output-dir "$EVIDENCE_DIR/repository-tool-lifecycle"
          report="$EVIDENCE_DIR/repository-tool-lifecycle/repository-tool-lifecycle-report.json"
          test "$(jq -r '.ok' "$report")" = 'true'
          test "$(jq -r '.candidate_sha' "$report")" = "$EXPECTED_CANDIDATE_SHA"
          test "$(jq -r '.base_sha' "$report")" = "$EXPECTED_MAIN_SHA"
          test "$(jq -r '.changed_file_count' "$report")" -eq 13
          test "$(jq -r '.secrets_included' "$report")" = 'false'

          node http-generic-api/scripts/e2e-contract-reference-integrity.mjs \
            --base "$EXPECTED_MAIN_SHA" \
            --head "$EXPECTED_CANDIDATE_SHA" \
            --report-file "$EVIDENCE_DIR/e2e-contract-reference-integrity.json"
          node http-generic-api/scripts/e2e-contract-git-index-integrity.mjs \
            --report-file "$EVIDENCE_DIR/e2e-contract-reference-integrity.json"

      - name: Run exact E2E phase check and executable journeys
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/e2e-phase-governance.mjs check \
            --base "$EXPECTED_MAIN_SHA" \
            --head "$EXPECTED_CANDIDATE_SHA" \
            --report-file "$EVIDENCE_DIR/e2e-phase-evaluation.json"
          test "$(jq -r '.ok' "$EVIDENCE_DIR/e2e-phase-evaluation.json")" = 'true'
          test "$(jq -r '.findings | length' "$EVIDENCE_DIR/e2e-phase-evaluation.json")" -eq 0

          node http-generic-api/scripts/e2e-phase-governance.mjs run \
            --base "$EXPECTED_MAIN_SHA" \
            --head "$EXPECTED_CANDIDATE_SHA" \
            --report-file "$EVIDENCE_DIR/e2e-phase-evaluation-run.json" \
            --execution-report-file "$EVIDENCE_DIR/e2e-phase-execution.json"
          test "$(jq -r '.ok' "$EVIDENCE_DIR/e2e-phase-evaluation-run.json")" = 'true'
          test "$(jq -r '.ok' "$EVIDENCE_DIR/e2e-phase-execution.json")" = 'true'

      - name: Final protected-main and canonical PR readback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${CANONICAL_PR_NUMBER}")"
          test "$(jq -r '.state' <<<"$pr")" = 'open'
          test "$(jq -r '.draft' <<<"$pr")" = 'true'
          test "$(jq -r '.base.sha' <<<"$pr")" = "$EXPECTED_MAIN_SHA"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$EXPECTED_CANDIDATE_SHA"

      - name: Publish exact no-secret summary
        if: always()
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_DIR"
          jq -n \
            --arg base_sha "$EXPECTED_MAIN_SHA" \
            --arg parent_sha "$EXPECTED_PARENT_SHA" \
            --arg head_sha "$EXPECTED_CANDIDATE_SHA" \
            --arg parent_full_run_id '30866671157' \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg job_status "${{ job.status }}" \
            '{contract:"mad4b.exact-repository-write-prerequisite-e2e-tail-validation.v1",base_sha:$base_sha,parent_sha:$parent_sha,head_sha:$head_sha,parent_full_run_id:$parent_full_run_id,run_id:$run_id,job_status:$job_status,candidate_mutated:false,main_mutated:false,production_mutated:false,provider_call:false,credential_read:false,sql_executed:false,migration_apply:false,database_mutated:false,external_send:false,secrets_included:false}' \
            > "$EVIDENCE_DIR/summary.json"

      - name: Upload exact tail evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-repository-write-prerequisite-e2e-tail-validation-6049-v5-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 14
