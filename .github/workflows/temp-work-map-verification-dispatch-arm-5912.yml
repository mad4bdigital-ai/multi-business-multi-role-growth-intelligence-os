name: TEMP OAuth Baseline Diagnostic 5990

on:
  pull_request:
    branches:
      - gpt/validate-work-map-verification-dispatch-arm-base-97e4ee7e
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    name: Prove OAuth route test baseline dependency injection
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      EXPECTED_HEAD_SHA: 0a2265ff40ee8cb3e220e547bb658598d34ce05f
      EXPECTED_MAIN_SHA: a61cd9e83070618001676bbc679bc937f0551875
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.repo.full_name }}" = "${GITHUB_REPOSITORY}"
          test "${{ github.event.pull_request.head.ref }}" = "gpt/trigger-work-map-verification-dispatch-arm-full-5990"
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "${EXPECTED_MAIN_SHA}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_MAIN_SHA}"
          test "$(git diff --name-only refs/remotes/origin/main...HEAD | grep -Ec '^(http-generic-api/test-auth-oauth-routes\.mjs|http-generic-api/routes/tenantGptOAuthMetadataRoutes\.js|http-generic-api/tenantGptOAuthTokenExchangeBindingGuard\.js)$')" = "0"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Reproduce current baseline failure
        id: baseline
        working-directory: http-generic-api
        shell: bash
        run: |
          set +e
          node test-auth-oauth-routes.mjs > "$RUNNER_TEMP/oauth-baseline.log" 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -Fq 'oauth_token_exchange_preconsumption_unavailable' "$RUNNER_TEMP/oauth-baseline.log"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Apply in-run test dependency injection only
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('test-auth-oauth-routes.mjs')
          text = path.read_text()
          old = 'app.use(buildTenantGptOAuthMetadataRoutes());'
          new = 'app.use(buildTenantGptOAuthMetadataRoutes({ getPool: () => oauthClientPool }));'
          if text.count(old) != 1:
              raise SystemExit(f'expected one replacement target, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check -- test-auth-oauth-routes.mjs
          git diff --name-only | grep -Fxq 'http-generic-api/test-auth-oauth-routes.mjs'

      - name: Capture targeted test after injected pool
        id: patched
        continue-on-error: true
        working-directory: http-generic-api
        shell: bash
        run: |
          set +e
          node test-auth-oauth-routes.mjs > "$RUNNER_TEMP/oauth-patched.log" 2>&1
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/oauth-patched.log"
          exit "$status"

      - name: Restore and verify candidate unchanged
        if: always()
        shell: bash
        run: |
          git checkout -- http-generic-api/test-auth-oauth-routes.mjs
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oauth-baseline-diagnostic-5990-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/oauth-baseline.log
            ${{ runner.temp }}/oauth-patched.log
          if-no-files-found: error
          retention-days: 14

      - name: Fail after diagnostic capture
        if: steps.patched.outcome != 'success'
        shell: bash
        run: |
          echo "Injected-pool test remains failing; inspect oauth-patched.log."
          exit 1
