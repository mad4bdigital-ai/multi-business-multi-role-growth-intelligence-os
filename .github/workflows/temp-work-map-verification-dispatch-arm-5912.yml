name: TEMP Work Map Verification Dispatch Diagnostic 5912

on:
  pull_request:
    branches:
      - gpt/validate-work-map-verification-dispatch-arm-base-97e4ee7e
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    name: Capture focused dispatch regression failure
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: afcc533fc59903aac7c1f80e3e5d7bf1f425335e
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify diagnostic and candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.repo.full_name }}" = "${GITHUB_REPOSITORY}"
          test "${{ github.event.pull_request.head.ref }}" = "gpt/trigger-work-map-verification-dispatch-arm-5912-v3"
          test "$(git rev-parse HEAD)" = "afcc533fc59903aac7c1f80e3e5d7bf1f425335e"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main" "+refs/heads/gpt/ci-work-map-exact-verification-dispatch-97e4ee7e-20260804:refs/remotes/origin/candidate"
          test "$(git rev-parse refs/remotes/origin/main)" = "97e4ee7ec790844ad20ee2349125579353c693d5"
          test "$(git rev-parse refs/remotes/origin/candidate)" = "afcc533fc59903aac7c1f80e3e5d7bf1f425335e"

      - name: Capture focused regression output
        id: focused
        continue-on-error: true
        working-directory: http-generic-api
        shell: bash
        run: |
          set +e
          node test-work-map-post-write-exact-verification-dispatch.mjs > "$RUNNER_TEMP/focused.log" 2>&1
          status=$?
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/focused.log"
          exit "$status"

      - name: Upload focused diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-map-verification-dispatch-focused-diagnostic-v3-${{ github.run_id }}
          path: ${{ runner.temp }}/focused.log
          if-no-files-found: error
          retention-days: 14

      - name: Fail after diagnostic upload
        if: steps.focused.outcome != 'success'
        run: |
          echo "Focused regression failed; diagnostic artifact uploaded."
          exit 1
