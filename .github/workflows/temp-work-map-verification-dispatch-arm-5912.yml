name: TEMP OAuth Baseline Patch Proof 5990

on:
  pull_request:
    branches:
      - gpt/validate-work-map-verification-dispatch-arm-base-97e4ee7e
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  prove:
    name: Prove final one-file OAuth baseline patch
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      EXPECTED_HEAD_SHA: 0a2265ff40ee8cb3e220e547bb658598d34ce05f
      EXPECTED_MAIN_SHA: a61cd9e83070618001676bbc679bc937f0551875
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable candidate and baseline ownership
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.repo.full_name }}" = "${GITHUB_REPOSITORY}"
          test "${{ github.event.pull_request.head.ref }}" = "gpt/trigger-work-map-verification-dispatch-arm-full-5990"
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "${EXPECTED_MAIN_SHA}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_MAIN_SHA}"
          test "$(git diff --name-only refs/remotes/origin/main...HEAD | grep -Ec '^http-generic-api/test-auth-oauth-routes\.mjs$')" = "0"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Apply proposed one-file baseline patch in runner only
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('test-auth-oauth-routes.mjs')
          text = path.read_text()
          replacements = [
            ('app.use(buildTenantGptOAuthMetadataRoutes());', 'app.use(buildTenantGptOAuthMetadataRoutes({ getPool: () => oauthClientPool }));'),
            ('assert("invalid client diagnostic uses OAuth action key", invalidClientDiagnostic?.action_key === "tenant_gpt_oauth_token_exchange", JSON.stringify(invalidClientDiagnostic));', 'assert("invalid client diagnostic uses OAuth v2 action key", invalidClientDiagnostic?.action_key === "tenant_gpt_oauth_token_exchange_v2", JSON.stringify(invalidClientDiagnostic));'),
            ('assert("invalid client diagnostic captures code timing", invalidClientDiagnostic?.runtime_evidence_json?.code_timing?.ttl_seconds === 300, JSON.stringify(invalidClientDiagnostic));', 'assert("invalid client diagnostic captures bounded code expiry", Number.isFinite(invalidClientDiagnostic?.runtime_evidence_json?.code?.expires_in_seconds) && invalidClientDiagnostic.runtime_evidence_json.code.expires_in_seconds > 0 && invalidClientDiagnostic.runtime_evidence_json.code.expires_in_seconds <= 300, JSON.stringify(invalidClientDiagnostic));'),
            ('assert("invalid client diagnostic captures code age", Number.isFinite(invalidClientDiagnostic?.runtime_evidence_json?.code_timing?.age_seconds), JSON.stringify(invalidClientDiagnostic));', 'assert("invalid client diagnostic captures code age", Number.isFinite(invalidClientDiagnostic?.runtime_evidence_json?.code?.age_seconds), JSON.stringify(invalidClientDiagnostic));'),
            ('assert("success diagnostic captures lowercase token type", successDiagnostic?.runtime_evidence_json?.access_token?.token_type === "bearer", JSON.stringify(successDiagnostic));', 'assert("success diagnostic marks access token prepared", successDiagnostic?.runtime_evidence_json?.access_token_prepared === true, JSON.stringify(successDiagnostic));'),
            ('assert("success diagnostic captures token length only", successDiagnostic?.runtime_evidence_json?.access_token?.length === exchange.body.access_token.length, JSON.stringify(successDiagnostic));', 'assert("success diagnostic excludes access-token metadata", !Object.prototype.hasOwnProperty.call(successDiagnostic?.runtime_evidence_json || {}, "access_token"), JSON.stringify(successDiagnostic));'),
            ('assert("success diagnostic captures requested scope count only", successDiagnostic?.runtime_evidence_json?.requested_scope?.count === TENANT_SCOPE_LINKS.length, JSON.stringify(successDiagnostic));', 'assert("success diagnostic excludes requested-scope metadata", !Object.prototype.hasOwnProperty.call(successDiagnostic?.runtime_evidence_json || {}, "requested_scope"), JSON.stringify(successDiagnostic));'),
          ]
          for old, new in replacements:
            if text.count(old) != 1:
              raise SystemExit(f'expected one replacement target: {old[:80]}')
            text = text.replace(old, new)

          marker = '    if (sql.includes("INSERT INTO `execution_log`")) {'
          if text.count(marker) != 1:
            raise SystemExit('expected one SQL insertion marker')
          readback = '\n'.join([
            '    if (sql.includes("FROM `tenant_gpt_oauth_authorization_codes`")) {',
            '      const record = durableOAuthCodes.get(params[2]);',
            '      if (!record) return [[]];',
            '      return [[{',
            '        status: record.status,',
            '        expires_at: new Date(Date.now() + 300_000),',
            '        consumed_at: record.status === "consumed" ? new Date() : null,',
            '        client_matches: record.client_id === params[0] ? 1 : 0,',
            '        redirect_matches: record.redirect_uri_hash === params[1] ? 1 : 0,',
            '        expired_by_store: 0,',
            '      }]];',
            '    }',
            '',
          ])
          text = text.replace(marker, readback + marker)
          path.write_text(text)
          PY
          git diff --check -- test-auth-oauth-routes.mjs
          git diff --name-only | grep -Fxq 'http-generic-api/test-auth-oauth-routes.mjs'
          git diff -- test-auth-oauth-routes.mjs > "$RUNNER_TEMP/oauth-baseline-fix.patch"

      - name: Run corrected OAuth route regression
        working-directory: http-generic-api
        shell: bash
        run: |
          set -o pipefail
          node test-auth-oauth-routes.mjs 2>&1 | tee "$RUNNER_TEMP/oauth-corrected.log"

      - name: Upload proposed patch and proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oauth-baseline-patch-proof-5990-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/oauth-baseline-fix.patch
            ${{ runner.temp }}/oauth-corrected.log
          if-no-files-found: error
          retention-days: 14

      - name: Restore and verify candidate unchanged
        if: always()
        shell: bash
        run: |
          git checkout -- http-generic-api/test-auth-oauth-routes.mjs
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
