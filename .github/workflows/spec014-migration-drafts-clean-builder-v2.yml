name: Spec 014 Migration Drafts Clean Builder V2

on:
  pull_request:
    paths:
      - '.github/workflows/spec014-migration-drafts-clean-builder-v2.yml'
      - '.github/scripts/spec014-migration-drafts-clean-builder-v2.mjs'

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: spec014-migration-drafts-clean-builder-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      INTEGRATION_BRANCH: gpt/hostinger-safe-storage-cleanup-ssh-20260801
      SOURCE_BRANCH: gpt/014-hostinger/migration-drafts-t024-t027-20260802
      SOURCE_SHA: cfe4334ed9bb0a932d6aa51b1398b8e5feb4da19
      FINAL_BRANCH: gpt/014-hostinger/migration-drafts-t024-t027-clean-v2-20260802
    steps:
      - name: Checkout exact builder head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate builder automation syntax
        run: node --check .github/scripts/spec014-migration-drafts-clean-builder-v2.mjs

      - name: Build validated ancestry-clean candidate
        run: node .github/scripts/spec014-migration-drafts-clean-builder-v2.mjs

      - name: Publish builder evidence to workflow summary
        if: always()
        shell: bash
        run: |
          report="${RUNNER_TEMP}/spec014-migration-builder-summary.md"
          if [[ -f "$report" ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' '## Spec 014 migration builder evidence' '' '- Outcome: **failed before evidence initialization**' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload structured builder evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec014-migration-builder-summary-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/spec014-migration-builder-summary.json
            ${{ runner.temp }}/spec014-migration-builder-summary.md
          if-no-files-found: warn
          retention-days: 30

      - name: Upsert diagnostic PR evidence comment
        if: always()
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ${{ runner.temp }}/spec014-migration-builder-summary.md
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- spec014-migration-builder-evidence -->';
            const report = fs.existsSync(process.env.REPORT_PATH)
              ? fs.readFileSync(process.env.REPORT_PATH, 'utf8')
              : '## Spec 014 migration builder evidence\n\n- Outcome: **failed before evidence initialization**\n';
            const body = `${marker}\n${report}\nThis evidence is emitted by repository automation and is diagnostic-only; merge authority remains with the governed exact-head checks.`;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
