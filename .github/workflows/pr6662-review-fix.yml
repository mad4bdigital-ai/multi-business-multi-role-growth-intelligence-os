name: PR 6662 Work Map binding refresh
on:
  push:
    branches:
      - gpt/pr6662-review-fix-aab2bcd-20260808
    paths:
      - .github/workflows/pr6662-review-fix.yml
permissions:
  contents: write
jobs:
  refresh-bindings:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: 38d912c9c22b0f3d74dbc709df6c9c93f2a4cf0c
      EXPECTED_MAIN: a06e8e087609508e3a1944ddaab8cf0156484529
      TARGET_BRANCH: gpt/tenant-request-identity-collation-repair-20260808
    steps:
      - name: Checkout exact target
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Verify exact target and main lease
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN"
          test -z "$(git status --porcelain=v1)"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Refresh canonical Spec Kit registry bindings
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            --feature-key 014-governed-hostinger-storage-orchestration
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            --feature-key 014-retail-commerce-operations-growth-os

      - name: Validate exact two-file write set
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git status --porcelain=v1 | sed -E 's/^...//' | sort)
          printf '%s\n' "${changed[@]}"
          if [ "${#changed[@]}" -ne 2 ] || \
             [ "${changed[0]:-}" != "specs/014-governed-hostinger-storage-orchestration/work-map-integration.json" ] || \
             [ "${changed[1]:-}" != "specs/014-retail-commerce-operations-growth-os/work-map-integration.json" ]; then
            joined="$(printf '%s;' "${changed[@]}")"
            echo "::error title=PR6662 Work Map binding write set::unexpected files: $joined"
            exit 1
          fi

      - name: Verify refreshed bindings deterministically
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            --feature-key 014-governed-hostinger-storage-orchestration --check
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            --feature-key 014-retail-commerce-operations-growth-os --check
          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          node http-generic-api/scripts/work-map-schema-classification-contract.mjs
          node http-generic-api/scripts/work-map-schema-classification.mjs
          node http-generic-api/scripts/spec-kit-work-map-governance-gate.mjs --ci --changed

      - name: Run binding and governance regressions
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          node test-spec014-refresh-final-work-map-binding.mjs
          node test-spec-kit-work-map-governance-gate.mjs

      - name: Commit and fast-forward target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            specs/014-governed-hostinger-storage-orchestration/work-map-integration.json \
            specs/014-retail-commerce-operations-growth-os/work-map-integration.json
          git diff --cached --check
          git commit -m 'chore(spec): refresh Work Map registry bindings'
          NEW_HEAD="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "Fast-forwarded $TARGET_BRANCH to $NEW_HEAD"
