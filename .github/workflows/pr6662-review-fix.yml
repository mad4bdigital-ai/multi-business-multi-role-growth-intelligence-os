name: PR 6662 Verification Gate Dispatch
on:
  push:
    branches:
      - gpt/pr6662-review-fix-aab2bcd-20260808
    paths:
      - .github/workflows/pr6662-review-fix.yml
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_HEAD: 6d4b2d70c1981520363ef662ba7ee2faf1332e1c
      EXPECTED_MAIN: 719c965e955347ab1cc56ad91d96881b4b1af357
      TARGET_BRANCH: gpt/tenant-request-identity-collation-repair-20260808
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify exact target and main lease
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')" = "$EXPECTED_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$EXPECTED_MAIN"

      - name: Dispatch E2E Phase Governance
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')" = "$EXPECTED_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$EXPECTED_MAIN"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/e2e-phase-governance.yml/dispatches" -f ref="$TARGET_BRANCH"

      - name: Dispatch E2E Contract Reference Integrity
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')" = "$EXPECTED_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$EXPECTED_MAIN"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/e2e-contract-reference-integrity.yml/dispatches" -f ref="$TARGET_BRANCH"

      - name: Dispatch Frontend Surface verification
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')" = "$EXPECTED_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$EXPECTED_MAIN"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/frontend-surface-dispatch.yml/dispatches" -f ref="$TARGET_BRANCH"

      - name: Dispatch Generated Artifact evaluation
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')" = "$EXPECTED_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$EXPECTED_MAIN"
          jq -n --arg ref "$TARGET_BRANCH" --arg sha "$EXPECTED_HEAD" \
            '{ref:$ref,inputs:{target_ref:$ref,expected_head_sha:$sha}}' | \
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/pr-generated-artifact-refresh.yml/dispatches" --input -

      - name: Dispatch Branch Test Diagnostic Shards
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')" = "$EXPECTED_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$EXPECTED_MAIN"
          jq -n --arg ref "$TARGET_BRANCH" \
            '{ref:$ref,inputs:{family:"",parent_index:"0",parent_count:"1",target_size:"8",grep:"",fail_fast:false}}' | \
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/branch-test-diagnostic-shards.yml/dispatches" --input -

      - name: Dispatch Final Work Map Readback
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')" = "$EXPECTED_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$EXPECTED_MAIN"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/hostinger-storage-final-work-map-readback-guard.yml/dispatches" -f ref="$TARGET_BRANCH"
