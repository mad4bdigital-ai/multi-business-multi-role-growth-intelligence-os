name: PR 6662 Exact Head Gate Dispatch
on:
  push:
    branches:
      - gpt/pr6662-review-fix-aab2bcd-20260808
    paths:
      - .github/workflows/pr6662-review-fix.yml
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_HEAD: 6d4b2d70c1981520363ef662ba7ee2faf1332e1c
      EXPECTED_MAIN: 719c965e955347ab1cc56ad91d96881b4b1af357
      TARGET_BRANCH: gpt/tenant-request-identity-collation-repair-20260808
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify exact target and main lease
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')" = "$EXPECTED_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$EXPECTED_MAIN"

      - name: Dispatch exact-head CI
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -f ref="$TARGET_BRANCH"

      - name: Dispatch exact-head Work Map Integration
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')" = "$EXPECTED_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$EXPECTED_MAIN"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/spec-kit-work-map-integration.yml/dispatches" \
            -f ref="$TARGET_BRANCH"
