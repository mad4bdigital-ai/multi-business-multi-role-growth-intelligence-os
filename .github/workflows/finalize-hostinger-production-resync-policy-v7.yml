name: Finalize Hostinger Production Resync Policy V7

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - .github/ops/hostinger-production-resync-policy-finalize-v7.mjs
      - .github/ops/repair-capability-envelope-approval-alias-v1.mjs
      - .github/workflows/finalize-hostinger-production-resync-policy-v7.yml

permissions:
  contents: read

concurrency:
  group: finalize-hostinger-production-resync-policy-v7-2669991a
  cancel-in-progress: true

jobs:
  safety-stop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stop unsafe combined mutation path
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice::Execution disabled. The prior workflow repaired platform_runtime_config and ADMIN_SHELL_ALLOWLIST before migration ledger readback, exceeding the authorized migration-only mutation boundary."
          echo "No credential access, database mutation, migration Apply, provider call, deployment, restart, protected-ref mutation, or external send is performed by this replacement run."
