name: EC3 Certification Test Registration

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ec3-certification-test-registration
  cancel-in-progress: false

jobs:
  register:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'gpt/spec-012-ec3-read-dispatch-certification-20260730'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v5
        with:
          ref: gpt/spec-012-ec3-read-dispatch-certification-20260730
          fetch-depth: 0

      - name: Register EC3 test exactly once
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('http-generic-api/scripts/test-manifest.mjs')
          text = path.read_text()
          entry = '  "node test-execution-capsule-read-dispatch-gate.mjs",\n'
          anchor = '  "node test-execution-capsule-selected-read-pilot.mjs",\n'
          if text.count(entry) != 0:
              raise SystemExit('EC3 command already registered before certification rebuild')
          if text.count(anchor) != 1:
              raise SystemExit('canonical EC2 registration anchor is not unique')
          text = text.replace(anchor, anchor + entry, 1)
          path.write_text(text)
          if path.read_text().count(entry) != 1:
              raise SystemExit('EC3 command registration count is not exactly one')
          PY

      - name: Run bounded EC0 through EC3 regressions
        working-directory: http-generic-api
        run: |
          node test-execution-capsule-contract.mjs
          node test-execution-capsule-shadow-adapter.mjs
          node test-execution-capsule-shadow-composition.mjs
          node test-execution-capsule-selected-read-pilot.mjs
          node test-execution-capsule-read-dispatch-gate.mjs
          node test-context-kernel-api-projection.mjs

      - name: Remove one-shot workflow and verify write set
        run: |
          rm .github/workflows/ec3-certification-test-registration.yml
          python - <<'PY'
          import subprocess

          changed = sorted(subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True
          ).splitlines())
          expected = sorted([
              '.github/workflows/ec3-certification-test-registration.yml',
              'http-generic-api/scripts/test-manifest.mjs',
          ])
          if changed != expected:
              raise SystemExit(f'unexpected write set: {changed}')
          PY

      - name: Commit bounded EC3 certification registration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ec3-certification-test-registration.yml \
            http-generic-api/scripts/test-manifest.mjs
          git commit -m "test(spec-012): register EC3 certification on latest main"
          git push origin HEAD:gpt/spec-012-ec3-read-dispatch-certification-20260730
