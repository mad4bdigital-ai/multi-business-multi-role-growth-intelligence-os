name: Tenant Request Collation Repair Launcher

on:
  push:
    branches:
      - gpt/tenant-request-collation-repair-launcher-20260808

permissions:
  contents: write

concurrency:
  group: tenant-request-collation-repair-20260808
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_BRANCH: gpt/tenant-request-identity-collation-repair-20260808
      EXPECTED_HEAD_SHA: f2e100922c7092dacd50ad138227dddfe1cf924d
    steps:
      - name: Checkout launcher
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify immutable launcher and target lease
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "gpt/tenant-request-collation-repair-launcher-20260808"
          git fetch origin "${TARGET_BRANCH}"
          actual="$(git rev-parse "origin/${TARGET_BRANCH}")"
          test "${actual}" = "${EXPECTED_HEAD_SHA}"
          git checkout -B "${TARGET_BRANCH}" "${EXPECTED_HEAD_SHA}"

      - name: Apply bounded source repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          service_path = Path("http-generic-api/tenantRequestInboxService.js")
          test_path = Path("http-generic-api/test-tenant-request-inbox-and-chunk-hardening.mjs")
          migration_path = Path("http-generic-api/migrations/20260808_tenant_request_identity_collation_alignment.sql")
          e2e_path = Path(".changes/e2e/tenant-request-identity-collation-repair.json")

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return source.replace(old, new, 1)

          service = service_path.read_text()
          service = replace_once(
              service,
              'const SENSITIVE_KEY_PATTERN = /(secret|credential|token|password|private_key|cipher|api_key|authorization|cookie|raw_prompt|system_prompt)/i;\n',
              '''const SENSITIVE_KEY_PATTERN = /(secret|credential|token|password|private_key|cipher|api_key|authorization|cookie|raw_prompt|system_prompt)/i;\nconst TENANT_REQUEST_IDENTITY_COLLATION = "utf8mb4_unicode_ci";\n\nfunction canonicalTenantRequestIdentitySql(expression) {\n  return `CONVERT(${expression} USING utf8mb4) COLLATE ${TENANT_REQUEST_IDENTITY_COLLATION}`;\n}\n\nfunction tenantRequestIdentityEqualsSql(left, right) {\n  return `${canonicalTenantRequestIdentitySql(left)} = ${canonicalTenantRequestIdentitySql(right)}`;\n}\n''',
              "identity helper",
          )
          service = replace_once(
              service,
              '''       WHERE tle.tenant_id = ${alias}.tenant_id\n         AND tle.ticket_id = ${alias}.ticket_id\n''',
              '''       WHERE ${tenantRequestIdentityEqualsSql("tle.tenant_id", `${alias}.tenant_id`)}\n         AND ${tenantRequestIdentityEqualsSql("tle.ticket_id", `${alias}.ticket_id`)}\n''',
              "latest activity lifecycle identity",
          )
          service = replace_once(
              service,
              '''function caseJoinSql(hasTicketId) {\n  const relation = hasTicketId\n    ? `(c2.ticket_id = t.ticket_id OR (c2.ticket_id IS NULL AND c2.resource_ref = CONCAT('ticket://', t.ticket_id)))`\n    : `c2.resource_ref = CONCAT('ticket://', t.ticket_id)`;\n  return `LEFT JOIN tenant_resolution_cases c\n    ON c.id = (\n      SELECT c2.id\n        FROM tenant_resolution_cases c2\n       WHERE c2.tenant_id = t.tenant_id\n         AND ${relation}\n       ORDER BY c2.updated_at DESC, c2.id DESC\n       LIMIT 1\n    )`;\n}\n''',
              '''function caseJoinSql(hasTicketId) {\n  const tenantIdentity = tenantRequestIdentityEqualsSql("c2.tenant_id", "t.tenant_id");\n  const ticketIdentity = tenantRequestIdentityEqualsSql("c2.ticket_id", "t.ticket_id");\n  const resourceIdentity = tenantRequestIdentityEqualsSql("c2.resource_ref", "CONCAT('ticket://', t.ticket_id)");\n  const relation = hasTicketId\n    ? `(${ticketIdentity} OR (c2.ticket_id IS NULL AND ${resourceIdentity}))`\n    : resourceIdentity;\n  return `LEFT JOIN tenant_resolution_cases c\n    ON c.id = (\n      SELECT c2.id\n        FROM tenant_resolution_cases c2\n       WHERE ${tenantIdentity}\n         AND ${relation}\n       ORDER BY c2.updated_at DESC, c2.id DESC\n       LIMIT 1\n    )`;\n}\n''',
              "resolution case join",
          )
          service = replace_once(
              service,
              '''function candidateCaseJoinSql(hasTicketId) {\n  const relation = hasTicketId\n    ? `(candidate_case.ticket_id = t.ticket_id OR (candidate_case.ticket_id IS NULL AND candidate_case.resource_ref = CONCAT('ticket://', t.ticket_id)))`\n    : `candidate_case.resource_ref = CONCAT('ticket://', t.ticket_id)`;\n  const newerRelation = hasTicketId\n    ? `(candidate_case_newer.ticket_id = t.ticket_id OR (candidate_case_newer.ticket_id IS NULL AND candidate_case_newer.resource_ref = CONCAT('ticket://', t.ticket_id)))`\n    : `candidate_case_newer.resource_ref = CONCAT('ticket://', t.ticket_id)`;\n  return `LEFT JOIN tenant_resolution_cases candidate_case\n    ON candidate_case.tenant_id = t.tenant_id\n   AND ${relation}\n  LEFT JOIN tenant_resolution_cases candidate_case_newer\n    ON candidate_case_newer.tenant_id = t.tenant_id\n   AND ${newerRelation}\n   AND (\n     COALESCE(candidate_case_newer.updated_at, candidate_case_newer.created_at) > COALESCE(candidate_case.updated_at, candidate_case.created_at)\n     OR (\n       COALESCE(candidate_case_newer.updated_at, candidate_case_newer.created_at) = COALESCE(candidate_case.updated_at, candidate_case.created_at)\n       AND candidate_case_newer.id > candidate_case.id\n     )\n   )`;\n}\n''',
              '''function candidateCaseJoinSql(hasTicketId) {\n  const tenantIdentity = tenantRequestIdentityEqualsSql("candidate_case.tenant_id", "t.tenant_id");\n  const ticketIdentity = tenantRequestIdentityEqualsSql("candidate_case.ticket_id", "t.ticket_id");\n  const resourceIdentity = tenantRequestIdentityEqualsSql("candidate_case.resource_ref", "CONCAT('ticket://', t.ticket_id)");\n  const newerTenantIdentity = tenantRequestIdentityEqualsSql("candidate_case_newer.tenant_id", "t.tenant_id");\n  const newerTicketIdentity = tenantRequestIdentityEqualsSql("candidate_case_newer.ticket_id", "t.ticket_id");\n  const newerResourceIdentity = tenantRequestIdentityEqualsSql("candidate_case_newer.resource_ref", "CONCAT('ticket://', t.ticket_id)");\n  const relation = hasTicketId\n    ? `(${ticketIdentity} OR (candidate_case.ticket_id IS NULL AND ${resourceIdentity}))`\n    : resourceIdentity;\n  const newerRelation = hasTicketId\n    ? `(${newerTicketIdentity} OR (candidate_case_newer.ticket_id IS NULL AND ${newerResourceIdentity}))`\n    : newerResourceIdentity;\n  return `LEFT JOIN tenant_resolution_cases candidate_case\n    ON ${tenantIdentity}\n   AND ${relation}\n  LEFT JOIN tenant_resolution_cases candidate_case_newer\n    ON ${newerTenantIdentity}\n   AND ${newerRelation}\n   AND (\n     COALESCE(candidate_case_newer.updated_at, candidate_case_newer.created_at) > COALESCE(candidate_case.updated_at, candidate_case.created_at)\n     OR (\n       COALESCE(candidate_case_newer.updated_at, candidate_case_newer.created_at) = COALESCE(candidate_case.updated_at, candidate_case.created_at)\n       AND candidate_case_newer.id > candidate_case.id\n     )\n   )`;\n}\n''',
              "candidate resolution case join",
          )
          service = replace_once(
              service,
              '      extraJoin: "JOIN ticket_lifecycle_events tle ON tle.tenant_id = t.tenant_id AND tle.ticket_id = t.ticket_id",\n',
              '      extraJoin: `JOIN ticket_lifecycle_events tle ON ${tenantRequestIdentityEqualsSql("tle.tenant_id", "t.tenant_id")} AND ${tenantRequestIdentityEqualsSql("tle.ticket_id", "t.ticket_id")}`,\n',
              "candidate lifecycle join",
          )
          service = replace_once(
              service,
              '''export const _testingTenantRequestInboxService = {\n  boundedLimit,\n  caseJoinSql,\n''',
              '''export const _testingTenantRequestInboxService = {\n  boundedLimit,\n  canonicalTenantRequestIdentitySql,\n  tenantRequestIdentityEqualsSql,\n  caseJoinSql,\n  candidateCaseJoinSql,\n  latestActivitySql,\n''',
              "testing exports",
          )
          service_path.write_text(service)

          test = test_path.read_text()
          test = replace_once(
              test,
              '      assert.match(sql, /UNION ALL/u, "candidate discovery must combine bounded activity sources set-wise");\n',
              '''      assert.match(sql, /UNION ALL/u, "candidate discovery must combine bounded activity sources set-wise");\n      assert(sql.includes("CONVERT(candidate_case.ticket_id USING utf8mb4) COLLATE utf8mb4_unicode_ci"), "candidate case ticket identity must normalize collation");\n      assert(sql.includes("CONVERT(candidate_case_newer.tenant_id USING utf8mb4) COLLATE utf8mb4_unicode_ci"), "newer-case tenant identity must normalize collation");\n      assert(sql.includes("CONVERT(tle.ticket_id USING utf8mb4) COLLATE utf8mb4_unicode_ci"), "candidate lifecycle ticket identity must normalize collation");\n      assert.doesNotMatch(sql, /candidate_case\\.ticket_id = t\\.ticket_id/u, "candidate case joins must not compare mixed collations directly");\n      assert.doesNotMatch(sql, /tle\\.ticket_id = t\\.ticket_id/u, "candidate lifecycle joins must not compare mixed collations directly");\n''',
              "candidate collation assertions",
          )
          test = replace_once(
              test,
              '      assert.match(sql, /c2\\.ticket_id = t\\.ticket_id/u);\n',
              '''      assert(sql.includes("CONVERT(c2.ticket_id USING utf8mb4) COLLATE utf8mb4_unicode_ci"), "detail/list case join must normalize resolution ticket identity");\n      assert(sql.includes("CONVERT(tle.tenant_id USING utf8mb4) COLLATE utf8mb4_unicode_ci"), "latest activity must normalize lifecycle tenant identity");\n      assert.doesNotMatch(sql, /c2\\.ticket_id = t\\.ticket_id/u, "resolution case joins must not compare mixed collations directly");\n      assert.doesNotMatch(sql, /tle\\.tenant_id = t\\.tenant_id/u, "latest-activity joins must not compare mixed collations directly");\n      assert.doesNotMatch(sql, /tle\\.ticket_id = t\\.ticket_id/u, "latest-activity joins must not compare mixed collations directly");\n''',
              "exact inbox collation assertions",
          )
          test = replace_once(
              test,
              'assert.doesNotMatch(inboxService, /role:\\s*rows\\[0\\]\\.role/u, "membership role projection must not select rows[0] directly");\n',
              '''assert.doesNotMatch(inboxService, /role:\\s*rows\\[0\\]\\.role/u, "membership role projection must not select rows[0] directly");\nassert.match(inboxService, /const TENANT_REQUEST_IDENTITY_COLLATION = "utf8mb4_unicode_ci";/u, "tenant request identity joins must pin the canonical compatibility collation");\nfor (const unsafeJoin of [\n  /c2\\.tenant_id = t\\.tenant_id/u,\n  /c2\\.ticket_id = t\\.ticket_id/u,\n  /candidate_case\\.tenant_id = t\\.tenant_id/u,\n  /candidate_case\\.ticket_id = t\\.ticket_id/u,\n  /candidate_case_newer\\.tenant_id = t\\.tenant_id/u,\n  /candidate_case_newer\\.ticket_id = t\\.ticket_id/u,\n  /tle\\.tenant_id = t\\.tenant_id/u,\n  /tle\\.ticket_id = t\\.ticket_id/u,\n]) assert.doesNotMatch(inboxService, unsafeJoin, `unsafe mixed-collation identity join remains: ${unsafeJoin}`);\n''',
              "static collation ratchet",
          )
          test = replace_once(
              test,
              'assert.doesNotMatch(migration, /DELETE\\s+FROM/iu);\n',
              '''assert.doesNotMatch(migration, /DELETE\\s+FROM/iu);\n\nconst identityCollationMigration = fs.readFileSync(new URL("./migrations/20260808_tenant_request_identity_collation_alignment.sql", import.meta.url), "utf8");\nassert.match(identityCollationMigration, /ALTER TABLE `ticket_lifecycle_events`/u);\nassert.match(identityCollationMigration, /MODIFY COLUMN `ticket_id` VARCHAR\\(36\\) CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci NOT NULL/u);\nassert.match(identityCollationMigration, /MODIFY COLUMN `tenant_id` VARCHAR\\(36\\) CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci NOT NULL/u);\nassert.match(identityCollationMigration, /ALTER TABLE `tenant_resolution_cases`/u);\nassert.match(identityCollationMigration, /MODIFY COLUMN `resource_ref` VARCHAR\\(512\\) CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci NULL/u);\nassert.match(identityCollationMigration, /MODIFY COLUMN `ticket_id` CHAR\\(36\\) CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci NULL/u);\nassert.doesNotMatch(identityCollationMigration, /ALTER TABLE `tickets`/u, "bounded repair must not silently recollate the central tickets table while other ticket_* families remain uca1400");\nassert.doesNotMatch(identityCollationMigration, /DROP\\s+(TABLE|COLUMN|INDEX)/iu);\nassert.doesNotMatch(identityCollationMigration, /DELETE\\s+FROM/iu);\n''',
              "migration collation assertions",
          )
          test_path.write_text(test)

          migration_path.write_text('''-- Tenant request identity collation alignment.\n-- Source incident: Spec 017 fixture readback run 31250853393 returned ER_CANT_AGGREGATE_2COLLATIONS\n-- from the canonical Admin tenant-request detail read before any JWT/grant/provider mutation.\n--\n-- The runtime compatibility layer normalizes both sides of cross-table identity comparisons\n-- to utf8mb4_unicode_ci so reads remain available before and after this migration.\n-- This migration intentionally does not ALTER the central tickets table because other ticket_*\n-- families still inherit utf8mb4_uca1400_ai_ci; recollating tickets requires a separate whole-domain audit.\n-- No data deletion, provider call, credential access, Production mutation, or Migration Apply is performed by this source file.\n\nALTER TABLE `ticket_lifecycle_events`\n  DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;\n\nALTER TABLE `ticket_lifecycle_events`\n  MODIFY COLUMN `ticket_id` VARCHAR(36) CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci NOT NULL,\n  MODIFY COLUMN `tenant_id` VARCHAR(36) CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci NOT NULL;\n\nALTER TABLE `tenant_resolution_cases`\n  DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;\n\nALTER TABLE `tenant_resolution_cases`\n  MODIFY COLUMN `tenant_id` VARCHAR(64) CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci NOT NULL,\n  MODIFY COLUMN `resource_ref` VARCHAR(512) CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci NULL,\n  MODIFY COLUMN `ticket_id` CHAR(36) CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci NULL;\n''')

          marker = {
              "$schema": "../../.specify/schemas/e2e-phases.schema.json",
              "schema_version": 1,
              "feature_key": "tenant-request-identity-collation-repair",
              "title": "Tenant request identity collation repair",
              "delivery_mode": "single_pr",
              "current_phase": "mvp",
              "scope": {"include": [
                  "http-generic-api/tenantRequestInboxService.js",
                  "http-generic-api/test-tenant-request-inbox-and-chunk-hardening.mjs",
                  "http-generic-api/migrations/20260808_tenant_request_identity_collation_alignment.sql",
              ]},
              "merge_contract": {"minimum_phase": "mvp"},
              "phases": [{
                  "id": "mvp",
                  "status": "implemented",
                  "objective": "Keep the canonical tenant-request inbox readable across legacy utf8mb4 collation drift while introducing a bounded alignment migration for inbox-owned identity columns.",
                  "e2e_journeys": [{
                      "id": "tenant-request-cross-collation-detail-read",
                      "end_to_end": True,
                      "level": "synthetic_runtime",
                      "actor": "platform admin or authenticated tenant member",
                      "entrypoint": "GET /admin/tenant-requests/{ticketId} or tenant-scoped equivalent",
                      "terminal_outcome": "Ticket, latest lifecycle activity, and the latest resolution case are resolved without ER_CANT_AGGREGATE_2COLLATIONS and without weakening tenant scope.",
                      "steps": [
                          "Normalize cross-table tenant_id, ticket_id, and ticket resource identity expressions to utf8mb4_unicode_ci inside the canonical inbox SQL builders.",
                          "Retain bounded candidate discovery and latest-activity ordering.",
                          "Align tenant_resolution_cases and ticket_lifecycle_events identity columns through a separately governed migration source.",
                          "Keep the legacy tickets table unchanged until a whole ticket-domain collation audit can recollate every dependent ticket_* family together."
                      ],
                      "assertions": [
                          "No raw resolution-case-to-ticket tenant_id or ticket_id equality remains in the inbox builders.",
                          "No raw ticket_lifecycle_events-to-tickets tenant_id or ticket_id equality remains in candidate or latest-activity joins.",
                          "The migration pins inbox-owned identity columns to utf8mb4_unicode_ci without dropping or deleting data.",
                          "The migration is source-only in this PR and is not applied to Production."
                      ],
                      "tests": [{
                          "id": "tenant-request-identity-collation-regression",
                          "runner": "node",
                          "working_directory": "http-generic-api",
                          "path": "test-tenant-request-inbox-and-chunk-hardening.mjs",
                          "args": []
                      }],
                      "evidence_paths": [
                          "http-generic-api/tenantRequestInboxService.js",
                          "http-generic-api/migrations/20260808_tenant_request_identity_collation_alignment.sql",
                          "http-generic-api/test-tenant-request-inbox-and-chunk-hardening.mjs"
                      ]
                  }]
              }]
          }
          e2e_path.write_text(json.dumps(marker, indent=2) + "\n")
          PY

      - name: Verify syntax and focused regression
        shell: bash
        run: |
          set -euo pipefail
          node --check http-generic-api/tenantRequestInboxService.js
          npm ci --prefix http-generic-api --ignore-scripts
          node http-generic-api/test-tenant-request-inbox-and-chunk-hardening.mjs

      - name: Enforce bounded write set
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            .changes/e2e/tenant-request-identity-collation-repair.json \
            http-generic-api/migrations/20260808_tenant_request_identity_collation_alignment.sql \
            http-generic-api/tenantRequestInboxService.js \
            http-generic-api/test-tenant-request-inbox-and-chunk-hardening.mjs | sort)"
          actual="$(git diff --name-only | sort)"
          test "${actual}" = "${expected}"
          git diff --check

      - name: Commit and fast-forward target branch
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote}" = "${EXPECTED_HEAD_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .changes/e2e/tenant-request-identity-collation-repair.json \
            http-generic-api/migrations/20260808_tenant_request_identity_collation_alignment.sql \
            http-generic-api/tenantRequestInboxService.js \
            http-generic-api/test-tenant-request-inbox-and-chunk-hardening.mjs
          git commit -m "fix(tenant): normalize inbox identity collations"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
