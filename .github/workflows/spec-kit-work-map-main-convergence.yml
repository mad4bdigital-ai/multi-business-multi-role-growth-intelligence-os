name: Spec Kit Work Map Main Convergence
run-name: Work Map Main Convergence · ${{ github.event.workflow_run.head_sha || inputs.expected_head_sha || github.run_id }}

on:
  workflow_run:
    workflows:
      - Spec Kit Work Map Integration
    types:
      - completed
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact current main SHA to converge from an existing failed Work Map Integration run
        required: true
        type: string
      confirmation:
        description: Type REQUEST_WORK_MAP_MAIN_CONVERGENCE
        required: true
        type: string

# Read-only classifier/delegator for stale Work Maps observed on exact main.
# It consumes the Integration Gate's exact-head repair artifact instead of becoming another Work Map producer.
# It never writes main or Production and never writes repository content itself.
# The only mutation path is the registered governed generated-artifact writer on a SHA-specific non-protected branch.
# Contract: mad4b.work-map-main-self-convergence.v1.
env:
  WORK_MAP_MAIN_CONVERGENCE_AUTHORITY_MODE: read_only_delegator

permissions:
  actions: write
  contents: read

concurrency:
  group: work-map-main-convergence-${{ github.event.workflow_run.head_sha || inputs.expected_head_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  classify-and-dispatch:
    name: Validate exact-main repair evidence and delegate convergence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Pin exact source main and failed Integration run identity
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
          SOURCE_EVENT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event || 'workflow_dispatch' }}
          SOURCE_CONCLUSION: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion || 'manual' }}
          SOURCE_HEAD_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || '' }}
          SOURCE_HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_head_sha }}
          MANUAL_CONFIRMATION: ${{ inputs.confirmation || '' }}
        run: |
          set -euo pipefail
          test "$WORK_MAP_MAIN_CONVERGENCE_AUTHORITY_MODE" = "read_only_delegator"

          ineligible() {
            local reason="$1"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "reason=${reason}" >> "$GITHUB_OUTPUT"
            exit 0
          }

          [[ "$SOURCE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || ineligible "source_head_sha_invalid"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            [[ "$EVENT_SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || ineligible "source_run_id_invalid"
            [[ "$SOURCE_CONCLUSION" == "failure" ]] || ineligible "source_run_not_failed"
            [[ "$SOURCE_EVENT" == "push" ]] || ineligible "source_run_not_push"
            [[ "$SOURCE_HEAD_BRANCH" == "main" ]] || ineligible "source_push_not_main"
            source_run_id="$EVENT_SOURCE_RUN_ID"
          else
            [[ "$MANUAL_CONFIRMATION" == "REQUEST_WORK_MAP_MAIN_CONVERGENCE" ]] || ineligible "manual_confirmation_invalid"
            source_run_id="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/spec-kit-work-map-integration.yml/runs" \
              -f event=push \
              -f branch=main \
              -f status=completed \
              -f per_page=100 \
              --jq ".workflow_runs | map(select(.head_sha == \"${SOURCE_HEAD_SHA}\" and .conclusion == \"failure\")) | sort_by(.created_at) | last | .id // empty")"
            [[ "$source_run_id" =~ ^[1-9][0-9]*$ ]] || ineligible "manual_failed_source_run_not_found"
          fi

          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$current_main_sha" == "$SOURCE_HEAD_SHA" ]] || ineligible "source_main_head_is_stale"

          target_ref="chore/work-map-main-sync-${SOURCE_HEAD_SHA:0:12}"
          echo "eligible=pending_evidence_validation" >> "$GITHUB_OUTPUT"
          echo "reason=pending_evidence_validation" >> "$GITHUB_OUTPUT"
          echo "source_run_id=${source_run_id}" >> "$GITHUB_OUTPUT"
          echo "source_main_sha=${SOURCE_HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "target_ref=${target_ref}" >> "$GITHUB_OUTPUT"

      - name: Validate exact-head Work Map repair candidate artifact
        id: evidence
        if: steps.identity.outputs.eligible == 'pending_evidence_validation'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.identity.outputs.source_run_id }}
          SOURCE_MAIN_SHA: ${{ steps.identity.outputs.source_main_sha }}
        run: |
          set -euo pipefail

          ineligible() {
            local reason="$1"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "reason=${reason}" >> "$GITHUB_OUTPUT"
            exit 0
          }

          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || ineligible "source_run_id_invalid"
          [[ "$SOURCE_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]] || ineligible "source_main_sha_invalid"

          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$current_main_sha" == "$SOURCE_MAIN_SHA" ]] || ineligible "main_moved_before_evidence_validation"

          run_file="${RUNNER_TEMP}/work-map-main-convergence-source-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > "$run_file"
          [[ "$(jq -r '.path' "$run_file")" == ".github/workflows/spec-kit-work-map-integration.yml" ]] || ineligible "source_workflow_path_mismatch"
          [[ "$(jq -r '.event' "$run_file")" == "push" ]] || ineligible "source_run_event_mismatch"
          [[ "$(jq -r '.head_branch' "$run_file")" == "main" ]] || ineligible "source_run_branch_mismatch"
          [[ "$(jq -r '.head_sha' "$run_file")" == "$SOURCE_MAIN_SHA" ]] || ineligible "source_run_sha_mismatch"
          [[ "$(jq -r '.status' "$run_file")" == "completed" ]] || ineligible "source_run_not_completed"
          [[ "$(jq -r '.conclusion' "$run_file")" == "failure" ]] || ineligible "source_run_not_failed_readback"
          source_run_attempt="$(jq -r '.run_attempt' "$run_file")"
          [[ "$source_run_attempt" =~ ^[1-9][0-9]*$ ]] || ineligible "source_run_attempt_invalid"

          artifact_name="work-map-repair-candidate-main-${SOURCE_MAIN_SHA}"
          artifact_file="${RUNNER_TEMP}/work-map-main-convergence-artifacts.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" > "$artifact_file"
          artifact_id="$(jq -r --arg name "$artifact_name" \
            '[.artifacts[] | select(.name == $name and .expired == false)] | sort_by(.created_at) | last | .id // empty' \
            "$artifact_file")"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]] || ineligible "exact_repair_artifact_not_found"

          artifact_root="${RUNNER_TEMP}/work-map-main-convergence-repair-artifact"
          rm -rf "$artifact_root"
          mkdir -p "$artifact_root"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir "$artifact_root"

          report="$artifact_root/report.json"
          changed_file="$artifact_root/changed-files.txt"
          [[ -f "$report" && -f "$changed_file" ]] || ineligible "repair_artifact_contract_files_missing"
          [[ -z "$(find "$artifact_root" -type l -print -quit)" ]] || ineligible "repair_artifact_symlink_forbidden"

          [[ "$(jq -r '.contract' "$report")" == "mad4b.work-map-repair-candidate.v1" ]] || ineligible "repair_contract_mismatch"
          [[ "$(jq -r '.repository' "$report")" == "$GITHUB_REPOSITORY" ]] || ineligible "repair_repository_mismatch"
          [[ "$(jq -r '.run_id | tostring' "$report")" == "$SOURCE_RUN_ID" ]] || ineligible "repair_run_id_mismatch"
          [[ "$(jq -r '.run_attempt | tostring' "$report")" == "$source_run_attempt" ]] || ineligible "repair_run_attempt_mismatch"
          [[ "$(jq -r '.event_name' "$report")" == "push" ]] || ineligible "repair_event_mismatch"
          [[ "$(jq -r '.event_sha' "$report")" == "$SOURCE_MAIN_SHA" ]] || ineligible "repair_event_sha_mismatch"
          [[ "$(jq -r '.expected_head_sha' "$report")" == "$SOURCE_MAIN_SHA" ]] || ineligible "repair_expected_head_mismatch"
          [[ "$(jq -r '.tested_head_sha' "$report")" == "$SOURCE_MAIN_SHA" ]] || ineligible "repair_tested_head_mismatch"
          [[ "$(jq -r '.generated_from_exact_checked_out_head' "$report")" == "true" ]] || ineligible "repair_not_exact_checkout"
          [[ "$(jq -r '.allowed_root' "$report")" == "docs/work-maps" ]] || ineligible "repair_allowed_root_mismatch"
          [[ "$(jq -r '.remote_write_executed' "$report")" == "false" ]] || ineligible "repair_remote_write_claimed"
          [[ "$(jq -r '.secrets_included' "$report")" == "false" ]] || ineligible "repair_secret_claimed"
          [[ "$(jq -r '.source_hash_sha256 // ""' "$report")" =~ ^[0-9a-f]{64}$ ]] || ineligible "repair_source_hash_invalid"

          changed_count="$(jq -r '.changed_count' "$report")"
          [[ "$changed_count" =~ ^[1-9][0-9]*$ ]] || ineligible "repair_changed_count_invalid"
          [[ "$(jq '.changed_files | length' "$report")" == "$changed_count" ]] || ineligible "repair_changed_count_mismatch"

          report_changed="${RUNNER_TEMP}/work-map-main-convergence-report-changed.txt"
          file_changed="${RUNNER_TEMP}/work-map-main-convergence-file-changed.txt"
          jq -r '.changed_files[]' "$report" | sort -u > "$report_changed"
          sed '/^$/d' "$changed_file" | sort -u > "$file_changed"
          [[ "$(wc -l < "$report_changed" | tr -d '[:space:]')" == "$changed_count" ]] || ineligible "repair_changed_files_not_unique"
          cmp -s "$report_changed" "$file_changed" || ineligible "repair_changed_file_manifest_mismatch"

          unexpected="$(grep -Ev '^docs/work-maps/' "$report_changed" || true)"
          [[ -z "$unexpected" ]] || {
            printf '%s\n' "$unexpected"
            ineligible "repair_changed_set_exceeds_work_maps"
          }

          while IFS= read -r generated_path; do
            [[ -n "$generated_path" ]] || continue
            [[ -f "$artifact_root/$generated_path" ]] || ineligible "repair_changed_output_missing"
          done < "$report_changed"

          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "reason=exact_head_repair_evidence_valid" >> "$GITHUB_OUTPUT"
          echo "artifact_id=${artifact_id}" >> "$GITHUB_OUTPUT"
          echo "changed_count=${changed_count}" >> "$GITHUB_OUTPUT"

      - name: Reject stale or already-converged target reuse
        id: target
        if: steps.evidence.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_MAIN_SHA: ${{ steps.identity.outputs.source_main_sha }}
          TARGET_REF: ${{ steps.identity.outputs.target_ref }}
        run: |
          set -euo pipefail

          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main_sha" != "$SOURCE_MAIN_SHA" ]]; then
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            echo "reason=main_moved_before_dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_REF}" --jq '.object.sha' 2>/dev/null)"
          existing_status=$?
          set -e

          if (( existing_status != 0 )); then
            echo "dispatch=true" >> "$GITHUB_OUTPUT"
            echo "reason=target_absent" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$existing_sha" == "$SOURCE_MAIN_SHA" ]]; then
            echo "dispatch=true" >> "$GITHUB_OUTPUT"
            echo "reason=target_seeded_exact_source" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          compare_file="${RUNNER_TEMP}/work-map-main-convergence-existing-target.json"
          gh api "repos/${GITHUB_REPOSITORY}/compare/${SOURCE_MAIN_SHA}...${existing_sha}" > "$compare_file"
          merge_base_sha="$(jq -r '.merge_base_commit.sha' "$compare_file")"
          behind_by="$(jq -r '.behind_by' "$compare_file")"
          ahead_by="$(jq -r '.ahead_by' "$compare_file")"
          [[ "$merge_base_sha" == "$SOURCE_MAIN_SHA" && "$behind_by" == "0" && "$ahead_by" =~ ^[1-9][0-9]*$ ]] || {
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            echo "reason=target_branch_collision" >> "$GITHUB_OUTPUT"
            exit 0
          }

          unexpected="$(jq -r '.files[].filename' "$compare_file" | grep -Ev '^(docs/work-maps/|specs/014-governed-hostinger-storage-orchestration/work-map-integration\.json$|specs/014-governed-hostinger-storage-orchestration/tasks\.md$|specs/014-retail-commerce-operations-growth-os/work-map-integration\.json$|specs/017-remote-mcp-host-isolation-oauth-readiness/work-map-integration\.json$|specs/018-environment-promotion-runtime-integrity/work-map-integration\.json$|specs/019-governed-database-lifecycle-pressure-relief/work-map-integration\.json$)' || true)"
          if [[ -n "$unexpected" ]]; then
            printf '%s\n' "$unexpected"
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            echo "reason=existing_target_exceeds_generated_work_map_scope" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "dispatch=false" >> "$GITHUB_OUTPUT"
          echo "reason=already_converged_generated_target_exists" >> "$GITHUB_OUTPUT"
          echo "existing_head_sha=${existing_sha}" >> "$GITHUB_OUTPUT"

      - name: Dispatch governed Work Map convergence writer
        if: steps.target.outputs.dispatch == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_MAIN_SHA: ${{ steps.identity.outputs.source_main_sha }}
          TARGET_REF: ${{ steps.identity.outputs.target_ref }}
        run: |
          set -euo pipefail
          test "$WORK_MAP_MAIN_CONVERGENCE_AUTHORITY_MODE" = "read_only_delegator"
          [[ "$SOURCE_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET_REF" =~ ^chore/work-map-main-sync-[0-9a-f]{12}$ ]]

          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main_sha" = "$SOURCE_MAIN_SHA"

          payload="$(jq -cn \
            --arg ref "main" \
            --arg target_ref "$TARGET_REF" \
            --arg expected_head_sha "$SOURCE_MAIN_SHA" \
            --arg source_main_sha "$SOURCE_MAIN_SHA" \
            '{ref:$ref,inputs:{target_ref:$target_ref,expected_head_sha:$expected_head_sha,recipe:"work_map_self_hosting_bootstrap",confirmation:"APPLY_GENERATED_ARTIFACT_REFRESH",create_from_main:"true",source_main_sha:$source_main_sha}}')"

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/governed-generated-artifact-refresh.yml/dispatches" \
            --input - <<<"$payload"

          {
            echo "Governed Work Map main convergence delegated."
            echo "Source main: ${SOURCE_MAIN_SHA}"
            echo "Source Integration run: ${{ steps.identity.outputs.source_run_id }}"
            echo "Validated repair artifact: ${{ steps.evidence.outputs.artifact_id }}"
            echo "Target branch: ${TARGET_REF}"
            echo "Direct repository mutation by dispatcher: false"
            echo "Protected branch mutation: false"
            echo "Force push: false"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish no-op or refusal summary
        if: always() && steps.target.outputs.dispatch != 'true'
        shell: bash
        env:
          IDENTITY_ELIGIBLE: ${{ steps.identity.outputs.eligible }}
          IDENTITY_REASON: ${{ steps.identity.outputs.reason }}
          EVIDENCE_ELIGIBLE: ${{ steps.evidence.outputs.eligible }}
          EVIDENCE_REASON: ${{ steps.evidence.outputs.reason }}
          TARGET_REASON: ${{ steps.target.outputs.reason }}
        run: |
          {
            echo "Work Map main convergence did not dispatch a writer."
            echo "Identity: ${IDENTITY_ELIGIBLE:-not_run} / ${IDENTITY_REASON:-not_run}"
            echo "Evidence: ${EVIDENCE_ELIGIBLE:-not_run} / ${EVIDENCE_REASON:-not_run}"
            echo "Target: ${TARGET_REASON:-not_run}"
            echo "Direct repository mutation by dispatcher: false"
            echo "Protected branch mutation: false"
            echo "Force push: false"
          } >> "$GITHUB_STEP_SUMMARY"