name: Spec 014 Final Work Map Binding Refresh Once

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/spec014-final-work-map-binding-refresh-once-fee13eee.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: spec014-final-work-map-binding-refresh-once-fee13eee
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh final Work Map binding and remove launcher
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/014-hostinger/final-work-map-binding-refresh-fee13eee-20260804' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      TARGET_BRANCH: gpt/014-hostinger/final-work-map-binding-refresh-fee13eee-20260804
      EXPECTED_PARENT_SHA: fee13eeefa60e334910af9629789bf20c853d969
      LAUNCHER_PATH: .github/workflows/spec014-final-work-map-binding-refresh-once-fee13eee.yml
      MANIFEST_PATH: specs/014-governed-hostinger-storage-orchestration/work-map-integration.json
      TASKS_PATH: specs/014-governed-hostinger-storage-orchestration/tasks.md
    steps:
      - name: Checkout exact launcher head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify immutable launcher identity and scope
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          event_head="${{ github.event.pull_request.head.sha }}"
          parent="$(git rev-parse HEAD^1)"
          remote_head="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$actual_head" = "$event_head"
          test "$remote_head" = "$event_head"
          test "$parent" = "$EXPECTED_PARENT_SHA"
          test "$(git diff --name-only "$EXPECTED_PARENT_SHA"...HEAD)" = "$LAUNCHER_PATH"
          test "$(git diff --diff-filter=A --name-only "$EXPECTED_PARENT_SHA"...HEAD)" = "$LAUNCHER_PATH"

      - name: Run deterministic producer and exact-head readback
        shell: bash
        run: |
          set -euo pipefail
          node --check http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs
          node --check http-generic-api/scripts/spec014-final-work-map-readback.mjs
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs | tee "${RUNNER_TEMP}/binding-refresh.json"
          node http-generic-api/scripts/spec014-final-work-map-readback.mjs --report "${RUNNER_TEMP}/final-work-map-readback.json"

      - name: Enforce bounded producer output
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          test -n "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -v -E "^(${MANIFEST_PATH}|${TASKS_PATH})$" || true)"
          test -z "$unexpected"
          printf '%s\n' "$changed" | grep -Fx "$MANIFEST_PATH"
          node -e "const m=require('./${MANIFEST_PATH}'); if(m.registry.fingerprint!=='0c1254ea1e160c4778dfb348f597d731ef4d0c46fe8ae1994f6fe5d347047ed4'||m.registry.index_source_hash!=='ab22d12f5efa539164c46a93c8895273257bfce430e644da9849b07f59029c58') process.exit(1)"

      - name: Remove launcher and publish deterministic refresh
        shell: bash
        run: |
          set -euo pipefail
          rm "$LAUNCHER_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          staged="$(git diff --cached --name-only | sort)"
          unexpected="$(printf '%s\n' "$staged" | grep -v -E "^(${LAUNCHER_PATH}|${MANIFEST_PATH}|${TASKS_PATH})$" || true)"
          test -z "$unexpected"
          printf '%s\n' "$staged" | grep -Fx "$LAUNCHER_PATH"
          printf '%s\n' "$staged" | grep -Fx "$MANIFEST_PATH"
          git commit -m "docs(spec-014): refresh final Work Map registry binding"
          final_diff="$(git diff --name-only "$EXPECTED_PARENT_SHA"...HEAD | sort)"
          unexpected="$(printf '%s\n' "$final_diff" | grep -v -E "^(${MANIFEST_PATH}|${TASKS_PATH})$" || true)"
          test -z "$unexpected"
          printf '%s\n' "$final_diff" | grep -Fx "$MANIFEST_PATH"
          remote_head="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "${{ github.event.pull_request.head.sha }}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Upload deterministic refresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec014-final-work-map-binding-refresh-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/binding-refresh.json
            ${{ runner.temp }}/final-work-map-readback.json
          if-no-files-found: warn
          retention-days: 14
