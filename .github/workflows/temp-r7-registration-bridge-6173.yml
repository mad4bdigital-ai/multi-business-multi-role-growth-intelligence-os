name: TEMP R7 Registration Bridge 6173

on:
  pull_request:
    branches:
      - gpt/r7-registration-bridge-base-6173-2f6634d3
    types: [opened, reopened, synchronize]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: temp-r7-registration-bridge-6173-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-and-dispatch:
    name: Validate registration fix and dispatch sole Work Map writer
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      CANONICAL_PR: '6173'
      EXPECTED_MAIN_SHA: 2f6634d39cf6a281efb1f7744bb1dee3a28f2cd9
      EXPECTED_HEAD_SHA: b7ca33cce9a19f39fce7a6b9f6b8d01d66f876a6
      EXPECTED_HEAD_REF: fix/hostinger-production-r7-registration-context-20260804
      AUTHORIZATION_MARKER: '<!-- work-map-autofix:authorized -->'
    steps:
      - name: Pin canonical identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${CANONICAL_PR}")"
          test "$(jq -r '.state' <<<"${pr}")" = 'open'
          test "$(jq -r '.draft' <<<"${pr}")" = 'true'
          test "$(jq -r '.base.ref' <<<"${pr}")" = 'main'
          test "$(jq -r '.base.sha' <<<"${pr}")" = "${EXPECTED_MAIN_SHA}"
          test "$(jq -r '.head.repo.full_name' <<<"${pr}")" = "${GITHUB_REPOSITORY}"
          test "$(jq -r '.head.ref' <<<"${pr}")" = "${EXPECTED_HEAD_REF}"
          test "$(jq -r '.head.sha' <<<"${pr}")" = "${EXPECTED_HEAD_SHA}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "${EXPECTED_MAIN_SHA}"
          comparison="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${EXPECTED_MAIN_SHA}...${EXPECTED_HEAD_SHA}")"
          test "$(jq -r '.behind_by' <<<"${comparison}")" = '0'
          test "$(jq -r '.merge_base_commit.sha' <<<"${comparison}")" = "${EXPECTED_MAIN_SHA}"

      - name: Checkout exact registration-fix candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Run focused R7 registration regression
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          node --check http-generic-api/test-hostinger-production-runtime-readback-r7.mjs
          node http-generic-api/test-hostinger-production-runtime-readback-r7.mjs
          if grep -Eq '^      REPORT_DIR:[[:space:]]*\$\{\{[[:space:]]*runner\.temp' .github/workflows/hostinger-production-runtime-readback-r7.yml; then
            echo 'Invalid pre-runner REPORT_DIR context remains.' >&2
            exit 1
          fi
          grep -Fq 'report_dir="${RUNNER_TEMP}/hostinger-production-runtime-readback-r7"' .github/workflows/hostinger-production-runtime-readback-r7.yml
          grep -Fq 'echo "REPORT_DIR=${report_dir}" >> "${GITHUB_ENV}"' .github/workflows/hostinger-production-runtime-readback-r7.yml

      - name: Consume marker and dispatch official Work Map writer
        id: bridge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          current_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${CANONICAL_PR}")"
          test "$(jq -r '.head.sha' <<<"${current_pr}")" = "${EXPECTED_HEAD_SHA}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "${EXPECTED_MAIN_SHA}"
          body="$(jq -r '.body // ""' <<<"${current_pr}")"
          test "$(grep -Fo "${AUTHORIZATION_MARKER}" <<<"${body}" | wc -l | tr -d ' ')" = '1'
          next_body="${body//${AUTHORIZATION_MARKER}/}"
          payload_file="${RUNNER_TEMP}/consume-marker.json"
          jq -n --arg body "${next_body}" '{body:$body}' > "${payload_file}"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${CANONICAL_PR}" --input "${payload_file}" >/dev/null
          if gh api "repos/${GITHUB_REPOSITORY}/pulls/${CANONICAL_PR}" --jq '.body // ""' | grep -Fq "${AUTHORIZATION_MARKER}"; then
            echo 'Authorization marker removal readback failed.' >&2
            exit 1
          fi

          for workflow in spec-kit-work-map-autofix.yml spec-kit-work-map-integration.yml; do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}" --jq '.state')"
            if [[ "${state}" != 'active' ]]; then
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/enable"
            fi
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}" --jq '.state')" = 'active'
          done

          dispatch_started_at="$(date -u -d '5 seconds ago' +'%Y-%m-%dT%H:%M:%SZ')"
          payload="$(jq -cn --arg ref main --arg branch "${EXPECTED_HEAD_REF}" --arg expected_head_sha "${EXPECTED_HEAD_SHA}" '{ref:$ref,inputs:{branch:$branch,expected_head_sha:$expected_head_sha}}')"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/spec-kit-work-map-autofix.yml/dispatches" --input - <<<"${payload}"

          delegated_run_id=''
          for _ in $(seq 1 30); do
            delegated_run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/spec-kit-work-map-autofix.yml/runs?event=workflow_dispatch&branch=main&per_page=30" --jq "[.workflow_runs[] | select(.created_at >= \"${dispatch_started_at}\")] | sort_by(.created_at) | last | .id // empty")"
            if [[ -n "${delegated_run_id}" ]]; then break; fi
            sleep 2
          done
          [[ "${delegated_run_id}" =~ ^[1-9][0-9]*$ ]]
          echo "delegated_run_id=${delegated_run_id}" >> "${GITHUB_OUTPUT}"

      - name: Publish bounded bridge evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DELEGATED_RUN_ID: ${{ steps.bridge.outputs.delegated_run_id }}
        run: |
          set -Eeuo pipefail
          outcome='passed'
          if [[ "${{ steps.bridge.outcome }}" != 'success' ]]; then outcome='blocked'; fi
          body="R7_REGISTRATION_BRIDGE outcome=${outcome} expected_main_sha=${EXPECTED_MAIN_SHA} expected_head_sha=${EXPECTED_HEAD_SHA} focused_regression=$([[ '${{ steps.bridge.outcome }}' == 'success' ]] && echo passed || echo blocked) authorization_consumed=$([[ '${{ steps.bridge.outcome }}' == 'success' ]] && echo true || echo false) delegated_run_id=${DELEGATED_RUN_ID:-none} direct_generated_edit=false candidate_content_mutation=false protected_branch_mutation=false force_push=false provider_access=false deployment=false secrets_included=false"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${CANONICAL_PR}/comments" -f body="${body}" >/dev/null
