name: Bootstrap GitHub Repository Policy Controller 6426

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-github-repository-policy-controller-6426.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-github-repository-policy-controller-6426-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/github-main-policy-controller-20260805'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Verify branch boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "gpt/github-main-policy-controller-20260805"
          test "$(git rev-parse origin/main)" = "93430fd5e709f49d7a47e2830382b6578a7a22e6"

      - name: Materialize bounded change set
        shell: bash
        env:
          PAYLOAD_00: ''
          PAYLOAD_01: ''
          PAYLOAD_02: ''
          PAYLOAD_03: ''
          PAYLOAD_04: ''
          PAYLOAD_05: ''
          PAYLOAD_06: ''
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/github-policy-controller.tar.gz"
          printf '%s%s%s%s%s%s%s' "$PAYLOAD_00" "$PAYLOAD_01" "$PAYLOAD_02" "$PAYLOAD_03" "$PAYLOAD_04" "$PAYLOAD_05" "$PAYLOAD_06" | base64 --decode > "$payload"
          python - "$payload" <<'PY'
          import pathlib, sys, tarfile
          archive = pathlib.Path(sys.argv[1])
          root = pathlib.Path.cwd().resolve()
          with tarfile.open(archive, 'r:gz') as tar:
              for member in tar.getmembers():
                  target = (root / member.name).resolve()
                  if root not in target.parents and target != root:
                      raise SystemExit(f'unsafe archive path: {member.name}')
              tar.extractall(root)
          PY
          git diff --check
          node --check http-generic-api/githubRepositoryPolicyController.js
          node --check http-generic-api/repositoryAutomationPolicyFacade.js
          node --check http-generic-api/routes/repositoryAutomationRoutes.js
          node --check http-generic-api/test-github-repository-policy-controller.mjs
          node --check http-generic-api/test-repository-automation-policy-facade.mjs
          python -m json.tool .changes/e2e/github-repository-policy-controller.json >/dev/null

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci --ignore-scripts

      - name: Run focused fail-closed regressions
        working-directory: http-generic-api
        run: |
          node test-github-repository-policy-controller.mjs
          node test-repository-automation-policy-facade.mjs

      - name: Commit and push without force
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .changes/e2e/github-repository-policy-controller.json \
            http-generic-api/githubRepositoryPolicyController.js \
            http-generic-api/repositoryAutomationPolicyFacade.js \
            http-generic-api/routes/repositoryAutomationRoutes.js \
            http-generic-api/migrations/20260805_github_repository_policy_controller.sql \
            http-generic-api/test-github-repository-policy-controller.mjs \
            http-generic-api/test-repository-automation-policy-facade.mjs
          git diff --cached --quiet && { echo 'No implementation changes materialized' >&2; exit 1; }
          git commit -m "feat(github): add governed main policy controller"
          git push origin HEAD:gpt/github-main-policy-controller-20260805
