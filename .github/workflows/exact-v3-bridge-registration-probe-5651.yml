name: Exact V3 Bridge Registration Probe 5651

on:
  pull_request:
    branches:
      - gpt/validate-v3-bridge-arm-base-b1e411
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  probe:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/governed-generated-refresh-pr-target-v3-20260802' &&
      github.event.pull_request.head.sha == '33328e71227f9f61b4e7d40e6db322b76b381a2e'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Record registration
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.sha }}" = "33328e71227f9f61b4e7d40e6db322b76b381a2e"
          echo "V3 bridge ARM base workflow registered"
