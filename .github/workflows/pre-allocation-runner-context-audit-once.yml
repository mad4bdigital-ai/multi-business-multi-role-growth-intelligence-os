name: Pre-allocation Runner Context Audit Once

on:
  push:
    branches:
      - gpt/audit-pre-allocation-runner-context-20260806
    paths:
      - .github/workflows/pre-allocation-runner-context-audit-once.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact audit branch
        uses: actions/checkout@v5
        with:
          ref: gpt/audit-pre-allocation-runner-context-20260806
          fetch-depth: 1
          persist-credentials: false

      - name: Audit runner context availability
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const workflowDir = '.github/workflows';
          const files = fs.readdirSync(workflowDir)
            .filter((name) => /\.ya?ml$/u.test(name))
            .sort();
          const findings = [];

          for (const name of files) {
            const file = path.join(workflowDir, name);
            const lines = fs.readFileSync(file, 'utf8').split(/\r?\n/u);
            const stack = [];

            for (let index = 0; index < lines.length; index += 1) {
              const raw = lines[index];
              const trimmed = raw.trim();
              if (!trimmed || trimmed.startsWith('#')) continue;

              const indent = raw.match(/^ */u)?.[0].length || 0;
              while (stack.length > 0 && stack.at(-1).indent >= indent) stack.pop();

              const keyMatch = trimmed.match(/^([A-Za-z0-9_.-]+):(?:\s|$)/u);
              if (keyMatch) stack.push({ key: keyMatch[1], indent });

              if (!/\$\{\{\s*runner\./u.test(raw)) continue;
              const insideSteps = stack.some((entry) => entry.key === 'steps');
              if (!insideSteps) {
                findings.push({
                  file,
                  line: index + 1,
                  text: trimmed.slice(0, 500),
                  context: stack.map((entry) => entry.key).join('.'),
                });
              }
            }
          }

          const report = {
            contract: 'mad4b.pre-allocation-runner-context-audit.v1',
            workflow_count: files.length,
            finding_count: findings.length,
            findings,
            secrets_included: false,
          };
          console.log(JSON.stringify(report, null, 2));
          if (findings.length > 0) process.exit(1);
          NODE
