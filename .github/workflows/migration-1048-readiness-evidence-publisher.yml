name: Migration 1048 Readiness Evidence Publisher

on:
  workflow_run:
    workflows:
      - Governed Migration 1048 Transport Response Schema Rollout
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: migration-1048-readiness-publisher-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'issue_comment' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_sha != null
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Discover readiness evidence artifact
        id: readiness
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const expected = `transport-response-schema-1048-readiness-${context.payload.workflow_run.id}`;
            const response = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
              per_page: 100,
            });
            const matches = response.data.artifacts.filter((artifact) => artifact.name === expected && artifact.expired === false);
            if (matches.length > 1) {
              core.setFailed(`Ambiguous Migration 1048 readiness artifact: ${matches.length}`);
              return;
            }
            core.setOutput('found', matches.length === 1 ? 'true' : 'false');
            core.setOutput('name', expected);

      - name: Download exact readiness evidence
        if: steps.readiness.outputs.found == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ steps.readiness.outputs.name }}
          path: ${{ runner.temp }}/migration-1048-readiness
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Publish checksum-bound readiness marker to control issue
        if: steps.readiness.outputs.found == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONTROL_ISSUE: '6531'
          READINESS_SUMMARY_PATH: ${{ runner.temp }}/migration-1048-readiness/summary.json
        run: node http-generic-api/scripts/migration-1048-readiness-issue-publisher.mjs
