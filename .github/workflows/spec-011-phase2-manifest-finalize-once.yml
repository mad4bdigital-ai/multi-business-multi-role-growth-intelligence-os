name: Spec 011 Phase2 Manifest Finalize Once

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'gpt/spec-011-phase2-intent-isolation-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out governed branch
        uses: actions/checkout@v5
        with:
          ref: gpt/spec-011-phase2-intent-isolation-20260730
          fetch-depth: 0
          persist-credentials: true

      - name: Register focused tests additively
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('http-generic-api/scripts/test-manifest.mjs')
          lines = path.read_text().splitlines()
          commands = [
              '  "node test-canonical-execution-intent-isolation.mjs",',
              '  "node test-execution-intent-binding-migration-contract.mjs",',
          ]
          close_index = max(i for i, line in enumerate(lines) if line.strip() == '];')
          previous = close_index - 1
          while previous >= 0 and not lines[previous].strip():
              previous -= 1
          if previous < 0:
              raise SystemExit('test manifest has no insertion predecessor')
          if not lines[previous].rstrip().endswith(','):
              lines[previous] = lines[previous].rstrip() + ','
          for command in commands:
              if command not in lines:
                  lines.insert(close_index, command)
                  close_index += 1
          path.write_text('\n'.join(lines) + '\n')
          PY

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Verify resolver, isolation, migration, and manifest contracts
        working-directory: http-generic-api
        shell: bash
        run: |
          node --check executionIntentBindingResolver.js
          node --check canonicalExecutionContractResolver.js
          node --check scripts/test-manifest.mjs
          node test-canonical-execution-contract-resolver.mjs
          node test-canonical-execution-intent-isolation.mjs
          node test-execution-intent-binding-migration-contract.mjs
          node test-test-manifest-runner.mjs
          printf '%s\n' \
            'http-generic-api/canonicalExecutionContractResolver.js' \
            'http-generic-api/executionIntentBindingResolver.js' \
            'http-generic-api/test-canonical-execution-contract-resolver.mjs' \
            'http-generic-api/test-canonical-execution-intent-isolation.mjs' \
            'http-generic-api/test-execution-intent-binding-migration-contract.mjs' \
            > "$RUNNER_TEMP/spec011-intent-final-files.txt"
          node scripts/context-kernel-hardcoding-scan.mjs \
            --fail-on=runtime \
            --changed-files-from="$RUNNER_TEMP/spec011-intent-final-files.txt"

      - name: Enforce bounded write set
        shell: bash
        run: |
          allowed='^(http-generic-api/scripts/test-manifest.mjs|.github/workflows/spec-011-phase2-manifest-finalize-once.yml)$'
          bad="$(git status --porcelain --untracked-files=all | sed -E 's/^...//' | grep -Ev "$allowed" || true)"
          test -z "$bad" || { echo 'Unexpected finalizer paths:'; echo "$bad"; exit 1; }

      - name: Commit clean manifest integration
        shell: bash
        run: |
          rm -f .github/workflows/spec-011-phase2-manifest-finalize-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'test(spec-011): register intent resolver isolation contracts'
          git fetch origin gpt/spec-011-phase2-intent-isolation-20260730
          git rebase origin/gpt/spec-011-phase2-intent-isolation-20260730
          git push origin HEAD:gpt/spec-011-phase2-intent-isolation-20260730
