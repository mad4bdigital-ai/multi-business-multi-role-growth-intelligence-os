name: Work Map Diagnostics E123 Exact Validator

on:
  push:
    branches:
      - gpt/validate-work-map-diagnostics-e123-20260804
    paths:
      - .github/workflows/work-map-diagnostics-e123-exact-validator.yml

permissions:
  contents: write

concurrency:
  group: work-map-diagnostics-e123-exact-validator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout validator event
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify launcher-only topology
        shell: bash
        env:
          EXPECTED_CANDIDATE: e123688d3346a0d173d81989354de4cdc7bf44b4
          LAUNCHER_PATH: .github/workflows/work-map-diagnostics-e123-exact-validator.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_CANDIDATE"
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$LAUNCHER_PATH"

      - name: Execute bounded exact-candidate diagnostics
        id: diagnostics
        shell: bash
        env:
          EXPECTED_CANDIDATE: e123688d3346a0d173d81989354de4cdc7bf44b4
        run: |
          set -euo pipefail
          git checkout --detach "$EXPECTED_CANDIDATE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE"

          diagnostic_root="$RUNNER_TEMP/work-map-diagnostics-e123"
          mkdir -p "$diagnostic_root/logs"
          results="$diagnostic_root/results.tsv"
          : > "$results"

          run_check() {
            local name="$1"
            shift
            local log="$diagnostic_root/logs/${name}.log"
            set +e
            "$@" >"$log" 2>&1
            local exit_code=$?
            set -e
            cat "$log"
            if [[ "$exit_code" -eq 0 ]]; then
              printf '%s\tpassed\t0\n' "$name" >> "$results"
            else
              printf '%s\tfailed\t%s\n' "$name" "$exit_code" >> "$results"
            fi
          }

          run_check syntax-work-map-generator \
            node --check http-generic-api/scripts/platform-work-map-generator.mjs
          run_check syntax-diagnostics-regression \
            node --check http-generic-api/test-work-map-autofix-validation-diagnostics.mjs
          run_check diagnostics-regression \
            node http-generic-api/test-work-map-autofix-validation-diagnostics.mjs
          run_check generated-work-maps-current \
            node http-generic-api/scripts/platform-work-map-generator.mjs --check
          run_check spec014-final-readback \
            env REPORT_PATH="$diagnostic_root/spec014-final-readback.json" \
              node http-generic-api/scripts/spec014-final-work-map-readback.mjs

          failed_count="$(awk -F '\t' '$2 == "failed" { count += 1 } END { print count + 0 }' "$results")"
          node - "$results" "$diagnostic_root/spec014-final-readback.json" "$diagnostic_root/report.json" "$failed_count" <<'NODE'
          const fs = require('node:fs');
          const [resultsPath, readbackPath, outputPath, failedCountRaw] = process.argv.slice(2);
          const rows = fs.readFileSync(resultsPath, 'utf8').trim().split('\n').filter(Boolean).map((line) => {
            const [name, outcome, exitCode] = line.split('\t');
            return { name, outcome, exit_code: Number(exitCode) };
          });
          let readback = null;
          if (fs.existsSync(readbackPath)) {
            try { readback = JSON.parse(fs.readFileSync(readbackPath, 'utf8')); } catch {}
          }
          const report = {
            contract: 'mad4b.work-map-autofix-diagnostics-exact-validation.v1',
            generated_at: new Date().toISOString(),
            candidate_sha: 'e123688d3346a0d173d81989354de4cdc7bf44b4',
            checks: rows,
            failed_count: Number(failedCountRaw),
            failed_checks: rows.filter((row) => row.outcome === 'failed').map((row) => `${row.name}:${row.exit_code}`),
            generated_work_maps_current: rows.find((row) => row.name === 'generated-work-maps-current')?.outcome === 'passed',
            diagnostics_regression_passed: rows.find((row) => row.name === 'diagnostics-regression')?.outcome === 'passed',
            spec014_final_readback: readback,
            repository_mutation: false,
            provider_dispatch: false,
            live_database_access: false,
            migration_apply: false,
            production_mutation: false,
            secrets_included: false
          };
          fs.writeFileSync(outputPath, JSON.stringify(report, null, 2) + '\n');
          NODE

          cat "$diagnostic_root/report.json"
          echo "failed_count=$failed_count" >> "$GITHUB_OUTPUT"
          echo "diagnostic_root=$diagnostic_root" >> "$GITHUB_OUTPUT"

      - name: Publish bounded evidence and remove launcher
        shell: bash
        env:
          BRANCH: gpt/validate-work-map-diagnostics-e123-20260804
          EVENT_SHA: ${{ github.sha }}
          DIAGNOSTIC_ROOT: ${{ steps.diagnostics.outputs.diagnostic_root }}
          EVIDENCE_PATH: .github/validation/work-map-diagnostics-e123.json
          LAUNCHER_PATH: .github/workflows/work-map-diagnostics-e123-exact-validator.yml
        run: |
          set -euo pipefail
          git checkout -B "$BRANCH" "$EVENT_SHA"
          mkdir -p "$(dirname "$EVIDENCE_PATH")"
          cp "$DIAGNOSTIC_ROOT/report.json" "$EVIDENCE_PATH"
          rm "$LAUNCHER_PATH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$EVIDENCE_PATH"
          git add -u "$LAUNCHER_PATH"
          git diff --cached --check
          git commit -m 'test(work-maps): publish exact diagnostics evidence'
          remote_head="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EVENT_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Enforce diagnostic outcome
        shell: bash
        env:
          FAILED_COUNT: ${{ steps.diagnostics.outputs.failed_count }}
        run: |
          set -euo pipefail
          test "$FAILED_COUNT" = "0"
