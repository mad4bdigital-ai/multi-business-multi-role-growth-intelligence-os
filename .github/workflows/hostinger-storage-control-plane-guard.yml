name: Hostinger Storage Control Plane Guard

on:
  pull_request:
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.mts'
      - '**/*.cts'
      - '.github/workflows/hostinger-storage-control-plane-guard.yml'
      - '.github/validation-triggers/spec014-wave1-runtime-evidence-readback-5179409708-v1.txt'
      - 'specs/014-governed-hostinger-storage-orchestration/**'

permissions:
  contents: read

jobs:
  storage-control-plane:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check module syntax
        run: |
          node --check http-generic-api/hostingerStorageExecutionAuthorization.js
          node --check http-generic-api/hostingerStorageExecutionAuthorizationV2.js
          node --check http-generic-api/hostingerStorageControlPlaneRepositoryBase.js
          node --check http-generic-api/hostingerStorageControlPlaneRepository.js
          node --check http-generic-api/test-hostinger-storage-execution-authorization.mjs
          node --check http-generic-api/test-hostinger-storage-control-plane-repository.mjs
          node --check http-generic-api/test-hostinger-storage-control-plane-repository-brand.mjs
      - name: Enforce governed repository factory
        run: |
          BASE_IMPORT_RE='hostingerStorageControlPlaneRepositoryBase(\.js)?'
          test "$(grep -R -E -l "$BASE_IMPORT_RE" . \
            --include='*.js' --include='*.mjs' --include='*.cjs' --include='*.ts' --include='*.tsx' --include='*.mts' --include='*.cts' \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=coverage --exclude-dir=dist --exclude-dir=build \
            | sed 's#^./##' | sort)" = "http-generic-api/hostingerStorageControlPlaneRepository.js"
          probe='control-plane-base-import-probe.cjs'
          printf "require('./http-generic-api/hostingerStorageControlPlaneRepositoryBase')\n" > "$probe"
          grep -E -q "$BASE_IMPORT_RE" "$probe"
          rm "$probe"
          grep -q "new WeakSet()" http-generic-api/hostingerStorageControlPlaneRepository.js
          grep -q "canonicalPersistenceAdapters.add(adapter)" http-generic-api/hostingerStorageControlPlaneRepository.js
          grep -q "canonicalPersistenceAdapters.has(adapter)" http-generic-api/hostingerStorageControlPlaneRepository.js
          grep -q "isCanonicalMemoryHostingerStoragePersistenceAdapter" http-generic-api/hostingerStorageControlPlaneRepository.js
          grep -q "const adapter = options?.adapter" http-generic-api/hostingerStorageControlPlaneRepository.js
          grep -q "createBaseHostingerStorageControlPlaneRepository({ adapter })" http-generic-api/hostingerStorageControlPlaneRepository.js
          grep -q "canonicalRepositories.add(repository)" http-generic-api/hostingerStorageControlPlaneRepository.js
          grep -q "canonicalRepositories.has(repository)" http-generic-api/hostingerStorageControlPlaneRepository.js
          grep -q "isCanonicalHostingerStorageControlPlaneRepository" http-generic-api/hostingerStorageControlPlaneRepository.js
      - name: Block runtime process dispatch in the control-plane core
        run: |
          ! grep -R -E "from ['\"]node:child_process['\"]|require\(['\"]child_process['\"]\)|\b(exec|execFile|spawn|fork)\s*\(" \
            http-generic-api/hostingerStorageExecutionAuthorization.js \
            http-generic-api/hostingerStorageExecutionAuthorizationV2.js \
            http-generic-api/hostingerStorageControlPlaneRepositoryBase.js \
            http-generic-api/hostingerStorageControlPlaneRepository.js
          grep -q "dispatch_allowed: false" http-generic-api/hostingerStorageExecutionAuthorizationV2.js
          grep -q "provider_dispatch_default_off: true" http-generic-api/hostingerStorageExecutionAuthorizationV2.js
          grep -q "production_ready: false" http-generic-api/hostingerStorageControlPlaneRepositoryBase.js
      - name: Reject ambiguous approval candidates
        working-directory: http-generic-api
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { resolveHostingerStorageApprovalSet } from './hostingerStorageExecutionAuthorization.js';
          const h = (character) => character.repeat(64);
          const plan = {
            plan_hash: h('1'),
            candidate_set_hash: h('2'),
            authority_context_hash: h('3'),
            ownership_revision: 'ownership-r1',
            policy_revision: 'policy-r1',
            impact_set_hash: h('4'),
          };
          const approval = {
            approval_id: 'approval-1',
            slot: 'workspace_owner:workspace-1',
            workspace_id: 'workspace-1',
            status: 'approved',
            invalidated: false,
            decided_at_epoch: 850,
            expires_at_epoch: 1700,
            plan_hash: plan.plan_hash,
            candidate_set_hash: plan.candidate_set_hash,
            authority_context_hash: plan.authority_context_hash,
            ownership_revision: plan.ownership_revision,
            policy_revision: plan.policy_revision,
            impact_set_hash: plan.impact_set_hash,
            approver_principal_id: 'principal-1',
            approver_authority_ref: 'authority/workspace-owner-1',
            evidence_digest: h('5'),
            secrets_included: false,
          };
          const single = resolveHostingerStorageApprovalSet({
            plan_envelope: plan,
            required_slots: [approval.slot],
            approval_records: [approval],
            now_epoch: 1000,
          });
          assert.equal(single.ready, true);
          const ambiguous = resolveHostingerStorageApprovalSet({
            plan_envelope: plan,
            required_slots: [approval.slot],
            approval_records: [
              approval,
              { ...approval, approval_id: 'approval-2', decided_at_epoch: 860, evidence_digest: h('6') },
            ],
            now_epoch: 1000,
          });
          assert.equal(ambiguous.ready, false);
          assert.deepEqual(ambiguous.approval_set.approvals, []);
          assert(ambiguous.blockers.includes(`STORAGE_APPROVAL_SLOT_AMBIGUOUS:${approval.slot}`));
          NODE
      - name: Validate unified execution authorization bundle
        working-directory: http-generic-api
        run: node test-hostinger-storage-execution-authorization.mjs
      - name: Validate CAS repository and restart-safe journal contract
        working-directory: http-generic-api
        run: node test-hostinger-storage-control-plane-repository.mjs
      - name: Validate repository provenance brand
        working-directory: http-generic-api
        run: node test-hostinger-storage-control-plane-repository-brand.mjs

  collect-spec014-wave1-runtime-evidence:
    name: Collect exact Spec 014 Wave 1 runtime Artifact
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/trigger-spec014-wave1-runtime-evidence-readback-5179409708-v1' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      ISSUE_NUMBER: '6215'
      EVIDENCE_DIR: ${{ runner.temp }}/spec014-wave1-runtime-evidence-readback
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Read and report structured runtime evidence
        run: node .github/ops/spec014-wave1-runtime-evidence-readback.mjs

      - name: Upload copied target evidence and readback report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec014-wave1-runtime-evidence-readback-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 14
