name: PR 6463 Main Reconciliation Scope Diagnostic
run-name: Diagnose PR 6463 final generated-artifact scope

on:
  push:
    branches:
      - fix/retire-production-runtime-parity-bridge-6441-20260806
    paths:
      - .github/workflows/pr6463-main-ancestry-sync.yml

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr6463-main-reconciliation-scope-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    name: Reconcile in-memory and expose exact final scope
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_BRANCH: fix/retire-production-runtime-parity-bridge-6441-20260806
      BASELINE_MAIN_SHA: faa7cd34117c7e0e18d1b55dad7968afb944378f
      PINNED_MAIN_SHA: ba10f269e831efa2c210b2729d1b31723a171052
      PR_NUMBER: "6463"
      TEMP_WORKFLOW: .github/workflows/pr6463-main-ancestry-sync.yml
      RETIREMENT_TOMBSTONE: .changes/e2e/production-runtime-parity-comment-bridge.json
      RETIREMENT_CONTRACT: .changes/e2e/production-runtime-parity-comment-bridge-retirement.json
      RETIRED_BRIDGE_WORKFLOW: .github/workflows/production-runtime-parity-comment-bridge.yml
      RETIRED_BRIDGE_TEST: http-generic-api/scripts/test-production-runtime-parity-comment-bridge.mjs
      RETIREMENT_SELF_TEST: http-generic-api/scripts/production-runtime-parity-comment-bridge-retirement-self-test.mjs
    steps:
      - name: Checkout exact triggering head without push credentials
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Verify immutable branch, draft PR, and pinned main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main "${TARGET_BRANCH}"
          pr_file="${RUNNER_TEMP}/pr6463.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "${pr_file}"

          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse origin/${TARGET_BRANCH})" = "${GITHUB_SHA}"
          test "$(git rev-parse origin/main)" = "${PINNED_MAIN_SHA}"
          test "$(jq -r '.state' "${pr_file}")" = "open"
          test "$(jq -r '.draft' "${pr_file}")" = "true"
          test "$(jq -r '.base.ref' "${pr_file}")" = "main"
          test "$(jq -r '.head.repo.full_name' "${pr_file}")" = "${GITHUB_REPOSITORY}"
          test "$(jq -r '.head.ref' "${pr_file}")" = "${TARGET_BRANCH}"
          test "$(jq -r '.head.sha' "${pr_file}")" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "${BASELINE_MAIN_SHA}" HEAD
          test -z "$(git status --porcelain)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge pinned main with bounded generated-artifact conflict resolution
        shell: bash
        run: |
          set -euo pipefail
          set +e
          git merge --no-commit --no-ff "${PINNED_MAIN_SHA}"
          merge_status=$?
          set -e

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
          if (( merge_status != 0 )) && (( ${#conflicts[@]} == 0 )); then
            echo "::error::Merge failed without a resolvable conflict set"
            exit "${merge_status}"
          fi

          allowed_conflicts=(
            "docs/work-maps/README.md"
            "docs/work-maps/data-model-domain-map.md"
            "docs/work-maps/observability-release-map.md"
            "docs/work-maps/repository-automation-map.md"
            "docs/work-maps/work-map-coverage-matrix.md"
            "specs/014-governed-hostinger-storage-orchestration/work-map-integration.json"
            "specs/014-retail-commerce-operations-growth-os/work-map-integration.json"
          )
          for path in "${conflicts[@]}"; do
            approved=false
            for expected in "${allowed_conflicts[@]}"; do
              if [[ "${path}" = "${expected}" ]]; then
                approved=true
                break
              fi
            done
            if [[ "${approved}" != true ]]; then
              echo "::error file=${path}::Unexpected merge conflict"
              exit 1
            fi
            git checkout --theirs -- "${path}"
            git add -- "${path}"
          done

          test "$(git rev-parse MERGE_HEAD)" = "${PINNED_MAIN_SHA}"
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Remove diagnostic one-shot before generated-artifact refresh
        shell: bash
        run: |
          set -euo pipefail
          git rm -- "${TEMP_WORKFLOW}"
          test ! -e "${TEMP_WORKFLOW}"

      - name: Regenerate final Work Maps from combined sources
        shell: bash
        run: |
          set -euo pipefail
          rm -f docs/work-maps/README.md docs/work-maps/repository-automation-map.md
          node http-generic-api/scripts/platform-work-map-generator.mjs --write

      - name: Refresh opted-in Spec Kit registry bindings
        shell: bash
        run: |
          set -euo pipefail
          registry_report="${RUNNER_TEMP}/work-map-registry.json"
          node http-generic-api/scripts/spec-kit-work-map-integration-gate.mjs --registry-report > "${registry_report}"
          node - "${registry_report}" <<'NODE'
          const fs = require('node:fs');
          const [reportPath] = process.argv.slice(2);
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const registry = report.registry;
          if (!report.ok || !registry || !/^[0-9a-f]{64}$/.test(registry.fingerprint || '')) {
            throw new Error('Invalid Work Map registry report');
          }
          const expected = {
            fingerprint: registry.fingerprint,
            index_source_hash: registry.signature?.index_source_hash,
            coverage_source_hash: registry.signature?.coverage_source_hash,
            map_count: registry.maps?.length,
            domain_count: registry.domains?.length,
            uncategorized_count: registry.uncategorized_objects?.length,
            taxonomy_gap_cluster_count: registry.taxonomy_gap_clusters?.length,
          };
          for (const key of ['index_source_hash', 'coverage_source_hash']) {
            if (!/^[0-9a-f]{64}$/.test(expected[key] || '')) throw new Error(`Invalid ${key}`);
          }
          const targets = [
            ['specs/014-governed-hostinger-storage-orchestration/work-map-integration.json', '014-governed-hostinger-storage-orchestration'],
            ['specs/014-retail-commerce-operations-growth-os/work-map-integration.json', '014-retail-commerce-operations-growth-os'],
          ];
          for (const [file, featureKey] of targets) {
            const original = fs.readFileSync(file, 'utf8');
            const parsed = JSON.parse(original);
            if (parsed.feature_key !== featureKey || parsed.review_state !== 'ready_for_implementation') {
              throw new Error(`Unexpected manifest identity/state: ${file}`);
            }
            const lines = original.replace(/\r\n/g, '\n').split('\n');
            let inRegistry = false;
            const seen = new Set();
            const next = lines.map((line) => {
              if (/^  "registry": \{$/.test(line)) {
                inRegistry = true;
                return line;
              }
              if (inRegistry && /^  },$/.test(line)) {
                inRegistry = false;
                return line;
              }
              if (!inRegistry) return line;
              for (const [key, value] of Object.entries(expected)) {
                const match = line.match(new RegExp(`^(    "${key}": )("[^"]*"|-?[0-9]+)(,?)$`));
                if (!match) continue;
                seen.add(key);
                const rendered = typeof value === 'string' ? JSON.stringify(value) : String(value);
                return `${match[1]}${rendered}${match[3]}`;
              }
              return line;
            });
            const missing = Object.keys(expected).filter((key) => !seen.has(key));
            if (missing.length) throw new Error(`Missing registry fields in ${file}: ${missing.join(',')}`);
            const output = next.join('\n');
            const validated = JSON.parse(output);
            for (const [key, value] of Object.entries(expected)) {
              if (validated.registry[key] !== value) throw new Error(`Binding refresh failed for ${file}:${key}`);
            }
            fs.writeFileSync(file, output);
          }
          NODE

      - name: Stage exact generated outputs
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            docs/work-maps/README.md \
            docs/work-maps/data-model-domain-map.md \
            docs/work-maps/observability-release-map.md \
            docs/work-maps/repository-automation-map.md \
            docs/work-maps/work-map-coverage-matrix.md \
            specs/014-governed-hostinger-storage-orchestration/work-map-integration.json \
            specs/014-retail-commerce-operations-growth-os/work-map-integration.json
          test -z "$(git diff --name-only --diff-filter=U)"
          test -z "$(git diff --name-only)"

      - name: Prove Work Map currentness
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/platform-work-map-generator.mjs --check

      - name: Prove Spec Kit Work Map governance
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/spec-kit-work-map-governance-gate.mjs --ci --changed

      - name: Prove Production parity bridge retirement
        shell: bash
        run: |
          set -euo pipefail
          node "${RETIREMENT_SELF_TEST}"

      - name: Capture final scope membership without publishing
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          actual_file="${RUNNER_TEMP}/pr6463-actual-scope.txt"
          allowed_file="${RUNNER_TEMP}/pr6463-allowed-scope.txt"
          unexpected_file="${RUNNER_TEMP}/pr6463-unexpected-scope.txt"

          git diff --cached --name-only "${PINNED_MAIN_SHA}" | sort -u > "${actual_file}"
          cat > "${allowed_file}" <<'EOF'
          .changes/e2e/production-runtime-parity-comment-bridge-retirement.json
          .changes/e2e/production-runtime-parity-comment-bridge.json
          .github/workflows/production-runtime-parity-comment-bridge.yml
          docs/work-maps/README.md
          docs/work-maps/data-model-domain-map.md
          docs/work-maps/observability-release-map.md
          docs/work-maps/repository-automation-map.md
          docs/work-maps/work-map-coverage-matrix.md
          http-generic-api/scripts/production-runtime-parity-comment-bridge-retirement-self-test.mjs
          http-generic-api/scripts/test-production-runtime-parity-comment-bridge.mjs
          specs/014-governed-hostinger-storage-orchestration/work-map-integration.json
          specs/014-retail-commerce-operations-growth-os/work-map-integration.json
          EOF
          sort -u -o "${allowed_file}" "${allowed_file}"
          comm -13 "${allowed_file}" "${actual_file}" > "${unexpected_file}"

          contains() {
            local key="$1"
            local path="$2"
            if grep -Fxq -- "${path}" "${actual_file}"; then
              echo "${key}=true" >> "${GITHUB_OUTPUT}"
            else
              echo "${key}=false" >> "${GITHUB_OUTPUT}"
            fi
          }

          contains retirement_contract ".changes/e2e/production-runtime-parity-comment-bridge-retirement.json"
          contains tombstone ".changes/e2e/production-runtime-parity-comment-bridge.json"
          contains retired_workflow ".github/workflows/production-runtime-parity-comment-bridge.yml"
          contains workmap_readme "docs/work-maps/README.md"
          contains workmap_data_model "docs/work-maps/data-model-domain-map.md"
          contains workmap_observability "docs/work-maps/observability-release-map.md"
          contains workmap_repository "docs/work-maps/repository-automation-map.md"
          contains workmap_coverage "docs/work-maps/work-map-coverage-matrix.md"
          contains retirement_self_test "http-generic-api/scripts/production-runtime-parity-comment-bridge-retirement-self-test.mjs"
          contains retired_test "http-generic-api/scripts/test-production-runtime-parity-comment-bridge.mjs"
          contains spec_storage "specs/014-governed-hostinger-storage-orchestration/work-map-integration.json"
          contains spec_retail "specs/014-retail-commerce-operations-growth-os/work-map-integration.json"

          actual_count="$(wc -l < "${actual_file}" | tr -d ' ')"
          echo "actual_count=${actual_count}" >> "${GITHUB_OUTPUT}"
          if [[ -s "${unexpected_file}" ]]; then
            echo "unexpected=true" >> "${GITHUB_OUTPUT}"
          else
            echo "unexpected=false" >> "${GITHUB_OUTPUT}"
          fi

          echo "Actual bounded scope (${actual_count} paths):"
          cat "${actual_file}"
          echo "Unexpected paths:"
          cat "${unexpected_file}"

      - name: Scope includes retirement contract
        if: steps.scope.outputs.retirement_contract == 'true'
        run: echo present
      - name: Scope includes governance tombstone
        if: steps.scope.outputs.tombstone == 'true'
        run: echo present
      - name: Scope deletes retired workflow
        if: steps.scope.outputs.retired_workflow == 'true'
        run: echo present
      - name: Scope includes Work Map README
        if: steps.scope.outputs.workmap_readme == 'true'
        run: echo present
      - name: Scope includes data-model Work Map
        if: steps.scope.outputs.workmap_data_model == 'true'
        run: echo present
      - name: Scope includes observability Work Map
        if: steps.scope.outputs.workmap_observability == 'true'
        run: echo present
      - name: Scope includes repository Work Map
        if: steps.scope.outputs.workmap_repository == 'true'
        run: echo present
      - name: Scope includes Work Map coverage matrix
        if: steps.scope.outputs.workmap_coverage == 'true'
        run: echo present
      - name: Scope includes retirement self-test
        if: steps.scope.outputs.retirement_self_test == 'true'
        run: echo present
      - name: Scope deletes retired bridge test
        if: steps.scope.outputs.retired_test == 'true'
        run: echo present
      - name: Scope includes storage Spec binding
        if: steps.scope.outputs.spec_storage == 'true'
        run: echo present
      - name: Scope includes retail Spec binding
        if: steps.scope.outputs.spec_retail == 'true'
        run: echo present
      - name: Scope contains no unexpected paths
        if: steps.scope.outputs.unexpected == 'false'
        run: echo clean

      - name: Stop after bounded scope diagnosis without commit or push
        shell: bash
        run: |
          echo "Diagnostic-only run. No commit or push is permitted."
          exit 1
