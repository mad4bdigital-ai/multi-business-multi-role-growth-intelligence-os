name: Diagnose GitHub Repository Policy Controller Bootstrap 6426

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - ".github/workflows/bootstrap-github-repository-policy-controller-6426-retry.yml"

permissions:
  contents: read

concurrency:
  group: diagnose-github-repository-policy-controller-6426-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/github-main-policy-controller-20260805' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout exact work-branch head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact branch and base boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF}" = "gpt/github-main-policy-controller-20260805"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "93430fd5e709f49d7a47e2830382b6578a7a22e6"

      - name: Parse bounded payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import pathlib
          import re

          source = pathlib.Path('.github/workflows/bootstrap-github-repository-policy-controller-6426.yml')
          text = source.read_text()
          matches = re.findall(r"^\s+PAYLOAD_(\d+): '([^']*)'\s*$", text, re.MULTILINE)
          parts = sorted((int(index), value) for index, value in matches)
          observed = [index for index, _ in parts]
          expected = list(range(7))
          print({'expected_parts': expected, 'observed_parts': observed, 'encoded_bytes': sum(len(value) for _, value in parts)})
          if observed != expected:
              raise SystemExit(f'payload parts mismatch: expected={expected} observed={observed}')
          payload = ''.join(value for _, value in parts)
          archive = pathlib.Path('/tmp/github-policy-controller.tar.gz')
          archive.write_bytes(base64.b64decode(payload, validate=True))
          print({'archive': str(archive), 'archive_bytes': archive.stat().st_size})
          PY

      - name: Inspect archive members
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import tarfile

          archive = pathlib.Path('/tmp/github-policy-controller.tar.gz')
          with tarfile.open(archive, 'r:gz') as bundle:
              members = bundle.getmembers()
              print({'member_count': len(members), 'members': [member.name for member in members]})
          PY

      - name: Extract bounded payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import tarfile

          root = pathlib.Path.cwd().resolve()
          archive = pathlib.Path('/tmp/github-policy-controller.tar.gz')
          with tarfile.open(archive, 'r:gz') as bundle:
              for member in bundle.getmembers():
                  target = (root / member.name).resolve()
                  if root not in target.parents and target != root:
                      raise SystemExit(f'unsafe archive path: {member.name}')
              bundle.extractall(root)
          PY
          git status --short

      - name: Verify exact materialized paths
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain | sed -E 's/^...//' | sort > /tmp/materialized-paths.txt
          cat /tmp/materialized-paths.txt
          cat > /tmp/expected-paths.txt <<'EOF'
          .changes/e2e/github-repository-policy-controller.json
          http-generic-api/githubRepositoryPolicyController.js
          http-generic-api/migrations/20260805_github_repository_policy_controller.sql
          http-generic-api/repositoryAutomationPolicyFacade.js
          http-generic-api/routes/repositoryAutomationRoutes.js
          http-generic-api/test-github-repository-policy-controller.mjs
          http-generic-api/test-repository-automation-policy-facade.mjs
          EOF
          diff -u /tmp/expected-paths.txt /tmp/materialized-paths.txt

      - name: Verify diff formatting
        run: git diff --check

      - name: Verify controller syntax
        run: node --check http-generic-api/githubRepositoryPolicyController.js

      - name: Verify facade syntax
        run: node --check http-generic-api/repositoryAutomationPolicyFacade.js

      - name: Verify route syntax
        run: node --check http-generic-api/routes/repositoryAutomationRoutes.js

      - name: Verify controller test syntax
        run: node --check http-generic-api/test-github-repository-policy-controller.mjs

      - name: Verify facade test syntax
        run: node --check http-generic-api/test-repository-automation-policy-facade.mjs

      - name: Verify E2E JSON
        run: python -m json.tool .changes/e2e/github-repository-policy-controller.json >/dev/null

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci --ignore-scripts

      - name: Run controller regression
        working-directory: http-generic-api
        run: node test-github-repository-policy-controller.mjs

      - name: Run facade regression
        working-directory: http-generic-api
        run: node test-repository-automation-policy-facade.mjs

      - name: Verify read-only diagnostic worktree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git status --porcelain | sed -E 's/^...//' | sort | diff -u /tmp/expected-paths.txt -
