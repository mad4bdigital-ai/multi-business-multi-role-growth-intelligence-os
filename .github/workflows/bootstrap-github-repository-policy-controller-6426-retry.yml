name: Recover GitHub Repository Policy Controller Payload 6426

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - ".github/workflows/bootstrap-github-repository-policy-controller-6426-retry.yml"

permissions:
  contents: read

concurrency:
  group: recover-github-repository-policy-controller-6426-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  recover:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/github-main-policy-controller-20260805' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout exact work-branch head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact branch and base boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF}" = "gpt/github-main-policy-controller-20260805"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "5f4b41aaefd8633aae07c1418ab955f8c4ed49d1"
          git merge-base --is-ancestor FETCH_HEAD HEAD
          test "$(git rev-parse f415b33da5a154c571689f8dea4a4a04b87f162f^{commit})" = "f415b33da5a154c571689f8dea4a4a04b87f162f"

      - name: Recover and verify original bounded payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import base64
          import hashlib
          import io
          import json
          import pathlib
          import re
          import subprocess
          import tarfile

          source_commit = 'f415b33da5a154c571689f8dea4a4a04b87f162f'
          source_path = '.github/workflows/bootstrap-github-repository-policy-controller-6426.yml'
          text = subprocess.check_output(['git', 'show', f'{source_commit}:{source_path}'], text=True)
          parts = []
          seen = set()
          for line_number, line in enumerate(text.splitlines(), start=1):
              match = re.match(r'^\s*PAYLOAD_(\d+):\s*(.+?)\s*$', line)
              if not match:
                  continue
              index = int(match.group(1))
              if index in seen:
                  raise SystemExit(f'duplicate payload index: {index}')
              seen.add(index)
              value = ast.literal_eval(match.group(2))
              if not isinstance(value, str) or re.search(r'[^A-Za-z0-9+/=]', value):
                  raise SystemExit(f'invalid payload part: {index}')
              parts.append((index, value, line_number))
          parts.sort(key=lambda item: item[0])
          observed = [index for index, _, _ in parts]
          expected = list(range(7))
          if observed != expected:
              raise SystemExit(f'payload indexes mismatch: {observed}')
          payload = ''.join(value for _, value, _ in parts)
          decoded = base64.b64decode(payload, validate=True)
          expected_members = [
              '.changes/e2e/github-repository-policy-controller.json',
              'http-generic-api/githubRepositoryPolicyController.js',
              'http-generic-api/migrations/20260805_github_repository_policy_controller.sql',
              'http-generic-api/repositoryAutomationPolicyFacade.js',
              'http-generic-api/routes/repositoryAutomationRoutes.js',
              'http-generic-api/test-github-repository-policy-controller.mjs',
              'http-generic-api/test-repository-automation-policy-facade.mjs',
          ]
          with tarfile.open(fileobj=io.BytesIO(decoded), mode='r:gz') as bundle:
              members = sorted(member.name for member in bundle.getmembers() if member.isfile())
          if members != sorted(expected_members):
              raise SystemExit(f'archive member mismatch: {members}')
          pathlib.Path('/tmp/github-policy-controller-original.b64').write_text(payload)
          pathlib.Path('/tmp/github-policy-controller-original.tar.gz').write_bytes(decoded)
          report = {
              'schema_version': 'github-policy-controller-original-payload-v1',
              'source_commit': source_commit,
              'source_path': source_path,
              'source_blob_sha': 'ff14d88cb5cd8077f8dbc2df56b61984b26f6426',
              'observed_indexes': observed,
              'part_lengths': [len(value) for _, value, _ in parts],
              'encoded_bytes': len(payload),
              'encoded_modulo_4': len(payload) % 4,
              'payload_sha256': hashlib.sha256(payload.encode()).hexdigest(),
              'archive_sha256': hashlib.sha256(decoded).hexdigest(),
              'archive_bytes': len(decoded),
              'archive_members': members,
              'secrets_included': False,
          }
          pathlib.Path('/tmp/original-payload-report.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          print(json.dumps(report, sort_keys=True))
          PY

      - name: Upload verified original payload
        uses: actions/upload-artifact@v4
        with:
          name: github-policy-controller-original-payload-${{ github.run_id }}
          path: |
            /tmp/github-policy-controller-original.b64
            /tmp/github-policy-controller-original.tar.gz
            /tmp/original-payload-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify read-only worktree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain)"
