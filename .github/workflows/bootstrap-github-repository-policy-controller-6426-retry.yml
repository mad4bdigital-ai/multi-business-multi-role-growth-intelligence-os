name: Capture GitHub Repository Policy Controller Payload 6426

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - ".github/workflows/bootstrap-github-repository-policy-controller-6426-retry.yml"

permissions:
  contents: read

concurrency:
  group: capture-github-repository-policy-controller-6426-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/github-main-policy-controller-20260805' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout exact work-branch head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact branch and base boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF}" = "gpt/github-main-policy-controller-20260805"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "5f4b41aaefd8633aae07c1418ab955f8c4ed49d1"
          git merge-base --is-ancestor FETCH_HEAD HEAD

      - name: Capture bounded payload without decoding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import json
          import pathlib
          import re

          source = pathlib.Path('.github/workflows/bootstrap-github-repository-policy-controller-6426.yml')
          parts = []
          seen = set()
          for line_number, line in enumerate(source.read_text().splitlines(), start=1):
              match = re.match(r'^\s*PAYLOAD_(\d+):\s*(.+?)\s*$', line)
              if not match:
                  continue
              index = int(match.group(1))
              if index in seen:
                  raise SystemExit(f'duplicate payload index: {index}')
              seen.add(index)
              value = ast.literal_eval(match.group(2))
              if not isinstance(value, str) or re.search(r'[^A-Za-z0-9+/=]', value):
                  raise SystemExit(f'invalid payload part: {index}')
              parts.append((index, value, line_number))
          parts.sort(key=lambda item: item[0])
          observed = [index for index, _, _ in parts]
          expected = list(range(7))
          if observed != expected:
              raise SystemExit(f'payload indexes mismatch: {observed}')
          payload = ''.join(value for _, value, _ in parts)
          pathlib.Path('/tmp/github-policy-controller.b64').write_text(payload)
          report = {
              'schema_version': 'github-policy-controller-payload-capture-v1',
              'expected_indexes': expected,
              'observed_indexes': observed,
              'line_numbers': [line_number for _, _, line_number in parts],
              'part_lengths': [len(value) for _, value, _ in parts],
              'encoded_bytes': len(payload),
              'encoded_modulo_4': len(payload) % 4,
              'payload_sha256': __import__('hashlib').sha256(payload.encode()).hexdigest(),
              'secrets_included': False,
          }
          pathlib.Path('/tmp/payload-capture.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          print(json.dumps(report, sort_keys=True))
          PY

      - name: Upload bounded payload capture
        uses: actions/upload-artifact@v4
        with:
          name: github-policy-controller-payload-capture-${{ github.run_id }}
          path: |
            /tmp/github-policy-controller.b64
            /tmp/payload-capture.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify read-only worktree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain)"
