name: Finalize GitHub Repository Policy Controller 6426

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - ".github/workflows/bootstrap-github-repository-policy-controller-6426-retry.yml"

permissions:
  contents: write

concurrency:
  group: finalize-github-repository-policy-controller-6426-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: >-
      github.event.pull_request.number == 6429 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/github-main-policy-controller-20260805' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - name: Checkout exact work-branch head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify immutable branch and baseline
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF}" = "gpt/github-main-policy-controller-20260805"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "d24274c667859e02f558b9161cd2318cc8961efd"
          git merge-base --is-ancestor FETCH_HEAD HEAD
          git diff --name-only FETCH_HEAD...HEAD | sort > /tmp/pre-finalizer-paths.txt
          cat > /tmp/expected-pre-finalizer-paths.txt <<'EOF'
          .github/workflows/bootstrap-github-repository-policy-controller-6426-retry.yml
          .github/workflows/bootstrap-github-repository-policy-controller-6426.yml
          EOF
          diff -u /tmp/expected-pre-finalizer-paths.txt /tmp/pre-finalizer-paths.txt

      - name: Recover checksum-bound seven-file archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import base64
          import hashlib
          import io
          import pathlib
          import re
          import subprocess
          import tarfile

          source_commit = 'f415b33da5a154c571689f8dea4a4a04b87f162f'
          source_path = '.github/workflows/bootstrap-github-repository-policy-controller-6426.yml'
          source_blob_sha = subprocess.check_output(
              ['git', 'rev-parse', f'{source_commit}:{source_path}'], text=True
          ).strip()
          if source_blob_sha != 'ff14d88cb5cd8077f8dbc2df56b61984b26f6426':
              raise SystemExit(f'original source blob mismatch: {source_blob_sha}')
          text = subprocess.check_output(['git', 'show', f'{source_commit}:{source_path}'], text=True)
          parts = []
          for line in text.splitlines():
              match = re.match(r'^\s*PAYLOAD_(\d+):\s*(.+?)\s*$', line)
              if match:
                  parts.append((int(match.group(1)), ast.literal_eval(match.group(2))))
          parts.sort(key=lambda item: item[0])
          if [index for index, _ in parts] != list(range(7)):
              raise SystemExit('original payload indexes are not exactly 0..6')
          corrupted = ''.join(value for _, value in parts)
          if hashlib.sha256(corrupted.encode()).hexdigest() != 'b9028aeaa76534b029853d6c28f72ca396ab0f27854dd5c6cea298709db6931c':
              raise SystemExit('original corrupted payload checksum mismatch')
          if len(corrupted) != 27131:
              raise SystemExit(f'original corrupted payload length mismatch: {len(corrupted)}')

          corrected = corrupted[:17280] + 'R' + corrupted[17280:]
          if hashlib.sha256(corrected.encode()).hexdigest() != '575ed433c9d60444d233646fa8e0fd67f67688bea5872beb1c0512302e87e2fd':
              raise SystemExit('corrected payload checksum mismatch')
          archive = base64.b64decode(corrected, validate=True)
          if hashlib.sha256(archive).hexdigest() != '12efacd46549db68743b9b59f31919ef432cff98338ea82bd737e3f8f5887f5f':
              raise SystemExit('recovered archive checksum mismatch')

          expected = sorted([
              '.changes/e2e/github-repository-policy-controller.json',
              'http-generic-api/githubRepositoryPolicyController.js',
              'http-generic-api/migrations/20260805_github_repository_policy_controller.sql',
              'http-generic-api/repositoryAutomationPolicyFacade.js',
              'http-generic-api/routes/repositoryAutomationRoutes.js',
              'http-generic-api/test-github-repository-policy-controller.mjs',
              'http-generic-api/test-repository-automation-policy-facade.mjs',
          ])
          root = pathlib.Path.cwd().resolve()
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as bundle:
              file_members = [member for member in bundle.getmembers() if member.isfile()]
              normalized = sorted(member.name.removeprefix('./') for member in file_members)
              if normalized != expected:
                  raise SystemExit(f'recovered archive path mismatch: {normalized}')
              for member in bundle.getmembers():
                  target = (root / member.name).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f'unsafe archive member: {member.name}')
              bundle.extractall(root, filter='data')
          print({
              'ok': True,
              'source_blob_sha': source_blob_sha,
              'corrected_payload_sha256': hashlib.sha256(corrected.encode()).hexdigest(),
              'archive_sha256': hashlib.sha256(archive).hexdigest(),
              'permanent_path_count': len(expected),
              'secrets_included': False,
          })
          PY

      - name: Verify recovered source syntax and contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check http-generic-api/githubRepositoryPolicyController.js
          node --check http-generic-api/repositoryAutomationPolicyFacade.js
          node --check http-generic-api/routes/repositoryAutomationRoutes.js
          node --check http-generic-api/test-github-repository-policy-controller.mjs
          node --check http-generic-api/test-repository-automation-policy-facade.mjs
          python -m json.tool .changes/e2e/github-repository-policy-controller.json >/dev/null

      - name: Install locked dependencies
        working-directory: http-generic-api
        run: npm ci --ignore-scripts

      - name: Run policy-controller regression
        working-directory: http-generic-api
        run: node test-github-repository-policy-controller.mjs

      - name: Run repository-policy facade regression
        working-directory: http-generic-api
        run: node test-repository-automation-policy-facade.mjs

      - name: Retire both temporary bootstrap workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/bootstrap-github-repository-policy-controller-6426.yml \
            .github/workflows/bootstrap-github-repository-policy-controller-6426-retry.yml
          git add -A

      - name: Verify exact permanent seven-file result
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-final-paths.txt <<'EOF'
          .changes/e2e/github-repository-policy-controller.json
          http-generic-api/githubRepositoryPolicyController.js
          http-generic-api/migrations/20260805_github_repository_policy_controller.sql
          http-generic-api/repositoryAutomationPolicyFacade.js
          http-generic-api/routes/repositoryAutomationRoutes.js
          http-generic-api/test-github-repository-policy-controller.mjs
          http-generic-api/test-repository-automation-policy-facade.mjs
          EOF
          git diff --cached --name-only origin/main | sort > /tmp/final-paths.txt
          diff -u /tmp/expected-final-paths.txt /tmp/final-paths.txt
          test ! -e .github/workflows/bootstrap-github-repository-policy-controller-6426.yml
          test ! -e .github/workflows/bootstrap-github-repository-policy-controller-6426-retry.yml
          git diff --cached --check

      - name: Commit and push exact recovered candidate
        shell: bash
        env:
          EXPECTED_REMOTE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_HEAD_REF}" | awk '{print $1}')"
          test "${remote_head}" = "${EXPECTED_REMOTE_HEAD}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(github): add governed main policy controller"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
