name: Production Recovery Resilient Certification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "http-generic-api/productionRecoveryControlStore.js"
      - "http-generic-api/scripts/production-recovery-control-store-resilient-certification.mjs"
      - "http-generic-api/scripts/e2e-production-recovery-control-store-resilient.mjs"
      - ".github/workflows/production-recovery-resilient-certification.yml"
      - ".changes/e2e/production-recovery-control-store-7999.json"
      - "docs/governance/production-recovery-control-store-7999.md"

permissions:
  contents: read

concurrency:
  group: production-recovery-resilient-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  disposable-mariadb-resilient-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: recovery_resilient_ci
          MARIADB_USER: recovery_ci
          MARIADB_PASSWORD: recovery-ci-only
          MARIADB_ROOT_PASSWORD: recovery-ci-root-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: http-generic-api
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate resilient certification source boundary
        run: node scripts/e2e-production-recovery-control-store-resilient.mjs

      - name: Certify resilient Recovery control store on disposable MariaDB
        env:
          PRODUCTION_RECOVERY_RESILIENT_CERTIFICATION_MODE: disposable_ci
          ENVIRONMENT: ci
          RUNTIME_CLASS: ci_disposable_mariadb
          RECOVERY_RESILIENT_TEST_DB_HOST: 127.0.0.1
          RECOVERY_RESILIENT_TEST_DB_PORT: 3306
          RECOVERY_RESILIENT_TEST_DB_NAME: recovery_resilient_ci
          RECOVERY_RESILIENT_TEST_DB_USER: recovery_ci
          RECOVERY_RESILIENT_TEST_DB_PASSWORD: recovery-ci-only
        run: node scripts/production-recovery-control-store-resilient-certification.mjs

      - name: Validate bounded certification evidence
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'artifacts/production-recovery-control-store-resilient.json';
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          const requiredTrue = [
            'approval_race_single_winner',
            'execution_ticket_race_single_winner',
            'execution_ticket_replay_rejected',
            'fencing_takeover_monotonic',
            'stale_fence_rejected',
            'restart_durability_verified',
            'ambiguous_claim_retry_resolved_existing',
            'append_only_evidence_replay_safe',
            'no_secret_receipt_verified',
          ];
          if (report.ok !== true
              || report.mode !== 'disposable_ci'
              || report.production_authorized !== false
              || report.production_database_connection_performed !== false
              || report.production_database_mutation_performed !== false
              || report.provider_mutation_performed !== false
              || report.deployment_or_restart_executed !== false
              || report.live_activation_performed !== false
              || report.secrets_included !== false
              || !requiredTrue.every((key) => report[key] === true)) {
            process.exit(1);
          }
          NODE

      - name: Upload resilient certification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-recovery-resilient-certification
          path: http-generic-api/artifacts/production-recovery-control-store-resilient.json
          if-no-files-found: error
          retention-days: 30
