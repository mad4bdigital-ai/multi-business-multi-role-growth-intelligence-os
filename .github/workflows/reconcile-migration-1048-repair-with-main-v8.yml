name: Reconcile Migration 1048 Repair With Main V8

on:
  push:
    branches:
      - fix/migration-1048-canonical-confirmation-and-readiness-marker
    paths:
      - .github/ops/reconcile-migration-1048-repair-with-main-v8.trigger

permissions:
  contents: write

concurrency:
  group: migration-1048-reconcile-main-v8
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_MAIN: 16bf7a895bb60f0ff20f58dcf95adffd41ab2e6c
      REPAIR_BRANCH: fix/migration-1048-canonical-confirmation-and-readiness-marker
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Guard immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$REPAIR_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse "origin/$REPAIR_BRANCH")" = "$GITHUB_SHA"

      - name: Reconstruct desired files from current main
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/transport-response-schema-1048-governed-rollout.yml /tmp/desired-workflow.yml
          git show "$EXPECTED_MAIN:.github/ops/transport-response-schema-1048-governed-rollout.mjs" > .github/ops/transport-response-schema-1048-governed-rollout.mjs
          git show "$EXPECTED_MAIN:http-generic-api/test-transport-response-schema-1048-governed-rollout.mjs" > http-generic-api/test-transport-response-schema-1048-governed-rollout.mjs
          cp /tmp/desired-workflow.yml .github/workflows/transport-response-schema-1048-governed-rollout.yml

          python3 - <<'PY'
          from pathlib import Path

          runner_path = Path('.github/ops/transport-response-schema-1048-governed-rollout.mjs')
          runner = runner_path.read_text()
          old_verify = "const VERIFY_CONFIRM = 'VERIFY_GOVERNED_MIGRATION_1048_TRANSPORT_RESPONSE_SCHEMA_RECOVERY';"
          new_verify = "const VERIFY_CONFIRM = `VERIFY_GOVERNED_MIGRATION_${MIGRATION_CONFIRMATION_KEY}`;"
          if runner.count(old_verify) != 1:
              raise SystemExit('expected exactly one stale VERIFY confirmation in main runner')
          runner_path.write_text(runner.replace(old_verify, new_verify))

          test_path = Path('http-generic-api/test-transport-response-schema-1048-governed-rollout.mjs')
          text = test_path.read_text()
          replacements = {
              '  "AUTHORIZE_GOVERNED_MIGRATION_1048_TRANSPORT_RESPONSE_SCHEMA_RECOVERY",': '  "AUTHORIZE_GOVERNED_MIGRATION_1048_TRANSPORT_RESPONSE_CHUNK_SCHEMA_RECOVERY",',
              '  "APPLY_GOVERNED_MIGRATION_1048_TRANSPORT_RESPONSE_SCHEMA_RECOVERY",': '  "APPLY_1048_TRANSPORT_RESPONSE_CHUNK_SCHEMA_RECOVERY",',
              '  "VERIFY_GOVERNED_MIGRATION_1048_TRANSPORT_RESPONSE_SCHEMA_RECOVERY",': '  "VERIFY_GOVERNED_MIGRATION_1048_TRANSPORT_RESPONSE_CHUNK_SCHEMA_RECOVERY",',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one workflow trigger anchor: {old}')
              text = text.replace(old, new)

          apply_expected = '  "const APPLY_CONFIRM = `APPLY_${MIGRATION_CONFIRMATION_KEY}`",\n'
          verify_expected = '  "const VERIFY_CONFIRM = `VERIFY_GOVERNED_MIGRATION_${MIGRATION_CONFIRMATION_KEY}`",\n'
          if text.count(apply_expected) != 1:
              raise SystemExit('expected exactly one dynamic APPLY assertion anchor')
          text = text.replace(apply_expected, apply_expected + verify_expected)

          marker = 'const applyModeLiterals = runner.match'
          readiness_block = '''for (const expected of [
  'issues: write',
  'Publish checksum-bound readiness marker',
  'actions/github-script@v7',
  'summary.readiness_marker',
  'TRANSPORT_RESPONSE_SCHEMA_1048_READINESS result=pass ',
  'issue_number: 6531',
]) {
  assert.ok(workflow.includes(expected), `Migration 1048 workflow is missing readiness publication contract: ${expected}`);
}

for (const forbidden of [
  'AUTHORIZE_GOVERNED_MIGRATION_1048_TRANSPORT_RESPONSE_SCHEMA_RECOVERY',
  'APPLY_GOVERNED_MIGRATION_1048_TRANSPORT_RESPONSE_SCHEMA_RECOVERY',
  'VERIFY_GOVERNED_MIGRATION_1048_TRANSPORT_RESPONSE_SCHEMA_RECOVERY',
]) {
  assert.ok(!workflow.includes(forbidden), `Migration 1048 workflow retains obsolete confirmation: ${forbidden}`);
  assert.ok(!runner.includes(forbidden), `Migration 1048 runner retains obsolete confirmation: ${forbidden}`);
}

'''
          if text.count(marker) != 1:
              raise SystemExit('expected exactly one apply-mode assertion anchor')
          text = text.replace(marker, readiness_block + marker)
          test_path.write_text(text)
          PY

      - name: Run exact Migration 1048 regression
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/test-transport-response-schema-1048-governed-rollout.mjs
          grep -Fq 'TRANSPORT_RESPONSE_SCHEMA_1048_READINESS result=pass ' .github/workflows/transport-response-schema-1048-governed-rollout.yml
          grep -Fq 'const VERIFY_CONFIRM = `VERIFY_GOVERNED_MIGRATION_${MIGRATION_CONFIRMATION_KEY}`;' .github/ops/transport-response-schema-1048-governed-rollout.mjs

      - name: Build bounded merge commit from main tree
        id: build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          runner_blob="$(git hash-object -w .github/ops/transport-response-schema-1048-governed-rollout.mjs)"
          workflow_blob="$(git hash-object -w .github/workflows/transport-response-schema-1048-governed-rollout.yml)"
          test_blob="$(git hash-object -w http-generic-api/test-transport-response-schema-1048-governed-rollout.mjs)"

          export GIT_INDEX_FILE="$RUNNER_TEMP/migration-1048-v8.index"
          rm -f "$GIT_INDEX_FILE"
          git read-tree "$EXPECTED_MAIN^{tree}"
          git update-index --add --cacheinfo "100644,$runner_blob,.github/ops/transport-response-schema-1048-governed-rollout.mjs"
          git update-index --add --cacheinfo "100644,$workflow_blob,.github/workflows/transport-response-schema-1048-governed-rollout.yml"
          git update-index --add --cacheinfo "100644,$test_blob,http-generic-api/test-transport-response-schema-1048-governed-rollout.mjs"
          tree_sha="$(git write-tree)"
          commit_sha="$(printf '%s\n' 'merge: reconcile Migration 1048 repair with current main' | git commit-tree "$tree_sha" -p "$GITHUB_SHA" -p "$EXPECTED_MAIN")"

          actual="$(git diff-tree --no-commit-id --name-only -r "$EXPECTED_MAIN" "$commit_sha" | sort)"
          expected="$(printf '%s\n' \
            '.github/ops/transport-response-schema-1048-governed-rollout.mjs' \
            '.github/workflows/transport-response-schema-1048-governed-rollout.yml' \
            'http-generic-api/test-transport-response-schema-1048-governed-rollout.mjs' | sort)"
          test "$actual" = "$expected"
          test "$(git rev-parse "$commit_sha^1")" = "$GITHUB_SHA"
          test "$(git rev-parse "$commit_sha^2")" = "$EXPECTED_MAIN"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Re-guard refs and push fast-forward only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$REPAIR_BRANCH"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse "origin/$REPAIR_BRANCH")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" '${{ steps.build.outputs.commit_sha }}'
          git push origin '${{ steps.build.outputs.commit_sha }}':"refs/heads/$REPAIR_BRANCH"

      - name: Verify remote exact result
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$REPAIR_BRANCH"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse "origin/$REPAIR_BRANCH")" = '${{ steps.build.outputs.commit_sha }}'
          actual="$(git diff --name-only "$EXPECTED_MAIN" "origin/$REPAIR_BRANCH" | sort)"
          expected="$(printf '%s\n' \
            '.github/ops/transport-response-schema-1048-governed-rollout.mjs' \
            '.github/workflows/transport-response-schema-1048-governed-rollout.yml' \
            'http-generic-api/test-transport-response-schema-1048-governed-rollout.mjs' | sort)"
          test "$actual" = "$expected"
