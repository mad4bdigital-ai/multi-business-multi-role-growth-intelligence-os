name: Repair PR 6610 Spec014 Work Map Bindings

on:
  push:
    branches:
      - gpt/spec017-protected-managed-execution-canary
    paths:
      - .github/ops/repair-pr6610-spec014-work-map-bindings.trigger

permissions:
  contents: write
  actions: write

concurrency:
  group: repair-pr6610-spec014-work-map-bindings
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Refresh final exact-head Work Maps and Spec014 bindings
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BRANCH: gpt/spec017-protected-managed-execution-canary
          WORKFLOW_FILE: .github/workflows/repair-pr6610-spec014-work-map-bindings.yml
          TRIGGER_FILE: .github/ops/repair-pr6610-spec014-work-map-bindings.trigger
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          git fetch origin main "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse origin/${EXPECTED_BRANCH})" = "${GITHUB_SHA}"
          git merge-base --is-ancestor origin/main HEAD

          # The one-shot repair workflow is itself a Work Map source. Remove the
          # temporary writer and trigger before generating the canonical final tree.
          rm -f "$WORKFLOW_FILE" "$TRIGGER_FILE"

          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-governed-hostinger-storage-orchestration
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-retail-commerce-operations-growth-os

          # Converge once more, then prove idempotent final state.
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-governed-hostinger-storage-orchestration
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-retail-commerce-operations-growth-os
          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-governed-hostinger-storage-orchestration --check
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-retail-commerce-operations-growth-os --check

          mapfile -t CHANGED < <(git status --short | sed -E 's/^.. //' | sort)
          test "${#CHANGED[@]}" -gt 0
          for file in "${CHANGED[@]}"; do
            case "$file" in
              "$WORKFLOW_FILE"|"$TRIGGER_FILE"|docs/work-maps/*|specs/014-governed-hostinger-storage-orchestration/work-map-integration.json|specs/014-governed-hostinger-storage-orchestration/tasks.md|specs/014-retail-commerce-operations-growth-os/work-map-integration.json)
                ;;
              *)
                echo "Unexpected repair write: $file"
                exit 1
                ;;
            esac
          done

          git status --short | grep -Fq "$WORKFLOW_FILE"
          git status --short | grep -Fq "$TRIGGER_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            "$WORKFLOW_FILE" \
            "$TRIGGER_FILE" \
            docs/work-maps \
            specs/014-governed-hostinger-storage-orchestration/work-map-integration.json \
            specs/014-governed-hostinger-storage-orchestration/tasks.md \
            specs/014-retail-commerce-operations-growth-os/work-map-integration.json
          git diff --cached --quiet && { echo "Repair produced no staged change"; exit 1; }
          git commit -m "fix(spec014): converge final Work Map bindings for PR 6610"
          NEW_HEAD="$(git rev-parse HEAD)"

          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-governed-hostinger-storage-orchestration --check
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-retail-commerce-operations-growth-os --check
          test -z "$(git status --porcelain)"

          git fetch origin main "${EXPECTED_BRANCH}"
          test "$(git rev-parse origin/${EXPECTED_BRANCH})" = "${GITHUB_SHA}"
          git merge-base --is-ancestor origin/main HEAD
          git push origin "HEAD:${EXPECTED_BRANCH}"

          gh workflow run spec-kit-work-map-integration.yml --repo "${GITHUB_REPOSITORY}" --ref "${EXPECTED_BRANCH}"
          gh workflow run ci.yml --repo "${GITHUB_REPOSITORY}" --ref "${EXPECTED_BRANCH}"
          echo "result_head=${NEW_HEAD}" >> "$GITHUB_STEP_SUMMARY"
