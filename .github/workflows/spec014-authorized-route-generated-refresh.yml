name: Spec 014 Authorized Route Generated Refresh

on:
  pull_request:
    branches:
      - gpt/hostinger-safe-storage-cleanup-ssh-20260801
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - '.github/workflows/spec014-authorized-route-generated-refresh.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: spec014-authorized-route-generated-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'gpt/014-hostinger/authorized-route-resolution-20260802'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_REF: gpt/014-hostinger/authorized-route-resolution-20260802
      LAUNCHER_FILE: .github/workflows/spec014-authorized-route-generated-refresh.yml
      OUTPUT_DIR: /tmp/spec014-authorized-route-generated-refresh
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Generate bounded Frontend evidence
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          remote_sha="$(git ls-remote origin "refs/heads/${TARGET_REF}" | awk '{print $1}')"
          local_sha="$(git rev-parse HEAD)"
          [[ "$remote_sha" == "$EXPECTED_HEAD_SHA" ]]
          [[ "$local_sha" == "$EXPECTED_HEAD_SHA" ]]

          cd http-generic-api
          npm ci
          npm run frontend:dispatch:generate -- --baseline-ref=main
          node test-frontend-dispatch-workflow-baseline.mjs
          node test-frontend-operation-governance-generator.mjs
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-openapi-route-coverage.mjs
          npm run openapi:auth:check
          cd ..

          mapfile -t changed_files < <(git status --porcelain --untracked-files=all \
            | sed -E 's/^...//' \
            | sed -E 's/.* -> //' \
            | sed '/^$/d' \
            | sort -u)
          allowed_regex='^http-generic-api/(frontend-operation-governance\.generated\.json|frontend-surface-dispatch\.generated\.json|openapi/frontend-runtime-routes\.generated\.yaml)$'
          for file in "${changed_files[@]}"; do
            [[ "$file" == "$LAUNCHER_FILE" || "$file" =~ $allowed_regex ]] || {
              echo "Unexpected generated write path: $file" >&2
              exit 1
            }
          done

          mapfile -t generated_files < <(printf '%s\n' "${changed_files[@]}" | grep -E "$allowed_regex" || true)
          if (( ${#generated_files[@]} > 0 )); then
            remote_sha="$(git ls-remote origin "refs/heads/${TARGET_REF}" | awk '{print $1}')"
            [[ "$remote_sha" == "$EXPECTED_HEAD_SHA" ]]
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- "${generated_files[@]}"
            git commit -m 'chore(ci): refresh generated Frontend route evidence'
            generated_sha="$(git rev-parse HEAD)"
            git push origin "HEAD:${TARGET_REF}"
          else
            generated_sha="$EXPECTED_HEAD_SHA"
          fi

          jq -n \
            --arg contract 'mad4b.spec014-authorized-route-generated-refresh.v1' \
            --arg target_ref "$TARGET_REF" \
            --arg expected_head_sha "$EXPECTED_HEAD_SHA" \
            --arg generated_commit_sha "$generated_sha" \
            --argjson changed_files "$(printf '%s\n' "${generated_files[@]}" | jq -R . | jq -s .)" \
            '{contract:$contract,outcome:"generated",target_ref:$target_ref,expected_head_sha:$expected_head_sha,generated_commit_sha:$generated_commit_sha,changed_files:$changed_files,allowed_changed_paths_only:true,normal_fast_forward_push:true,force_push:false,protected_branch_mutation:false,secrets_included:false}' \
            > "$OUTPUT_DIR/generated-refresh.json"

      - name: Remove temporary launcher with normal fast-forward push
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/${TARGET_REF}" | awk '{print $1}')"
          local_sha="$(git rev-parse HEAD)"
          [[ "$remote_sha" == "$local_sha" ]]
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm "$LAUNCHER_FILE"
          git commit -m 'chore(spec-014): remove authorized route refresh launcher'
          final_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:${TARGET_REF}"
          remote_final_sha="$(git ls-remote origin "refs/heads/${TARGET_REF}" | awk '{print $1}')"
          [[ "$remote_final_sha" == "$final_sha" ]]
          jq --arg final_sha "$final_sha" \
            '.outcome="passed" | .final_commit_sha=$final_sha | .launcher_removed=true' \
            "$OUTPUT_DIR/generated-refresh.json" > "$OUTPUT_DIR/generated-refresh.final.json"
          mv "$OUTPUT_DIR/generated-refresh.final.json" "$OUTPUT_DIR/generated-refresh.json"

      - name: Upload structured refresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec014-authorized-route-generated-refresh-${{ github.run_id }}
          path: /tmp/spec014-authorized-route-generated-refresh/
          if-no-files-found: error
          retention-days: 14
