name: E2E Phase Governance

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: e2e-phase-governance-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

env:
  CI_CANDIDATE_KIND: ${{ github.event_name == 'merge_group' && 'merge_candidate' || 'head' }}
  CI_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
  CI_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}

jobs:
  evaluate:
    name: Evaluate changed feature phases
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.parallel.outputs.mode }}
      feature_key: ${{ steps.parallel.outputs.feature_key }}
      contract_path: ${{ steps.parallel.outputs.contract_path }}
      workstream_id: ${{ steps.parallel.outputs.workstream_id }}
      production_promotion: ${{ steps.parallel.outputs.production_promotion }}
      production_promotion_identity: ${{ steps.parallel.outputs.production_promotion_identity }}
      phase_evaluation_base: ${{ steps.parallel.outputs.phase_evaluation_base }}
    steps:
      - name: Checkout exact candidate tree
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CI_CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Run governance and evidence self-tests
        run: |
          node http-generic-api/scripts/e2e-phase-governance-self-test.mjs
          node http-generic-api/scripts/e2e-phase-init-self-test.mjs
          node http-generic-api/scripts/e2e-parallel-work-governance-self-test.mjs
          node http-generic-api/scripts/e2e-parallel-plan-init-self-test.mjs
          node http-generic-api/scripts/e2e-parallel-pr-flow-self-test.mjs
          node http-generic-api/scripts/test-e2e-parallel-test-runner-diagnostics.mjs
          node http-generic-api/scripts/test-ci-evidence-source-stamp.mjs
          node http-generic-api/scripts/test-ci-evidence-router.mjs
          node http-generic-api/scripts/test-ci-evidence-pr-comment.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const workflow = fs.readFileSync('.github/workflows/e2e-phase-governance.yml', 'utf8');
          const runIdExpression = '$' + '{{ github.run_id }}';
          const sourceOnlyPattern = `pattern: e2e-phase-e*-${runIdExpression}`;
          const selfContaminatingPattern = `pattern: e2e-phase-*-${runIdExpression}`;
          assert.equal(workflow.includes(sourceOnlyPattern), true, 'The canonical summarizer must download only evaluation/execution source artifacts.');
          assert.equal(workflow.includes(selfContaminatingPattern), false, 'The canonical summarizer must not redownload its own prior summary artifact on a rerun.');
          assert.equal(workflow.includes(`name: e2e-phase-evaluation-${runIdExpression}`), true, 'Evaluation evidence must retain the governed artifact name.');
          assert.equal(workflow.includes(`name: e2e-phase-execution-${runIdExpression}`), true, 'Execution evidence must retain the governed artifact name.');
          assert.equal(workflow.includes(`name: e2e-phase-summary-${runIdExpression}`), true, 'Canonical summaries must remain a separate output artifact.');
          assert.equal(workflow.includes('phase_evaluation_base: $' + '{{ steps.parallel.outputs.phase_evaluation_base }}'), true, 'The evaluate job must expose the governed promotion source baseline.');
          assert.equal((workflow.match(/PROMOTION_PHASE_BASE:/g) || []).length, 2, 'Evaluation and execution must both consume the governed promotion source baseline.');
          assert.equal((workflow.match(/EVALUATION_BASE_SHA="\$\{PROMOTION_PHASE_BASE:-\$\{PR_BASE_SHA:-\}\}"/g) || []).length, 2, 'Both phase operations must fail closed onto the promotion baseline before the PR base.');
          console.log(JSON.stringify({ ok: true, test: 'e2e_phase_artifact_routing_and_promotion_baseline', rerun_summary_self_contamination_blocked: true, promotion_history_reinterpretation_blocked: true, secrets_included: false }));
          NODE

      - name: Classify and validate parallel PR mode
        id: parallel
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          HEAD_SHA: ${{ env.CI_CANDIDATE_SHA }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref || '' }}
        run: |
          set -euo pipefail
          args=(check
            --head-ref "${HEAD_REF}"
            --base-ref "${BASE_REF}"
            --github-output "${GITHUB_OUTPUT}"
            --report-file "${RUNNER_TEMP}/e2e-parallel-work-evaluation.json")
          if [[ -n "${BASE_SHA:-}" ]]; then args+=(--base "$BASE_SHA"); fi
          args+=(--head "$HEAD_SHA")
          node http-generic-api/scripts/e2e-parallel-pr-gate.mjs "${args[@]}"

      - name: Evaluate complete phase contract
        if: steps.parallel.outputs.mode != 'workstream'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          PROMOTION_PHASE_BASE: ${{ steps.parallel.outputs.phase_evaluation_base }}
          HEAD_SHA: ${{ env.CI_CANDIDATE_SHA }}
        run: |
          set -euo pipefail
          EVALUATION_BASE_SHA="${PROMOTION_PHASE_BASE:-${PR_BASE_SHA:-}}"
          args=(check --report-file "${RUNNER_TEMP}/e2e-phase-evaluation.json" --head "$HEAD_SHA")
          if [[ -n "${EVALUATION_BASE_SHA:-}" ]]; then args+=(--base "$EVALUATION_BASE_SHA"); fi
          node http-generic-api/scripts/e2e-phase-governance.mjs "${args[@]}"

      - name: Stamp evaluation reports with exact candidate identity
        if: always()
        run: >-
          node http-generic-api/scripts/ci-evidence-source-stamp.mjs
          --candidate-kind "${CI_CANDIDATE_KIND}"
          --candidate-sha "${CI_CANDIDATE_SHA}"
          --file "${RUNNER_TEMP}/e2e-parallel-work-evaluation.json"
          --file "${RUNNER_TEMP}/e2e-phase-evaluation.json"

      - name: Upload phase evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-phase-evaluation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/e2e-phase-evaluation.json
            ${{ runner.temp }}/e2e-parallel-work-evaluation.json
          if-no-files-found: error
          retention-days: 30

  execute:
    name: Execute current phase journeys
    runs-on: ubuntu-latest
    needs: evaluate
    steps:
      - name: Checkout exact candidate tree
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CI_CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            http-generic-api/package-lock.json

      - name: Install connector dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Execute active workstream tests
        if: needs.evaluate.outputs.mode == 'workstream'
        run: >-
          node http-generic-api/scripts/e2e-parallel-test-runner.mjs
          --contract "${{ needs.evaluate.outputs.contract_path }}"
          --mode workstream
          --workstream-id "${{ needs.evaluate.outputs.workstream_id }}"
          --report-file "${{ runner.temp }}/e2e-parallel-execution.json"

      - name: Execute integration convergence tests
        if: needs.evaluate.outputs.mode == 'integration'
        run: >-
          node http-generic-api/scripts/e2e-parallel-test-runner.mjs
          --contract "${{ needs.evaluate.outputs.contract_path }}"
          --mode integration
          --report-file "${{ runner.temp }}/e2e-parallel-execution.json"

      - name: Execute declared current-phase E2E journeys
        if: needs.evaluate.outputs.mode != 'workstream'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          PROMOTION_PHASE_BASE: ${{ needs.evaluate.outputs.phase_evaluation_base }}
          HEAD_SHA: ${{ env.CI_CANDIDATE_SHA }}
        run: |
          set -euo pipefail
          EVALUATION_BASE_SHA="${PROMOTION_PHASE_BASE:-${PR_BASE_SHA:-}}"
          args=(run
            --head "$HEAD_SHA"
            --report-file "${RUNNER_TEMP}/e2e-phase-evaluation.json"
            --execution-report-file "${RUNNER_TEMP}/e2e-phase-execution.json")
          if [[ -n "${EVALUATION_BASE_SHA:-}" ]]; then args+=(--base "$EVALUATION_BASE_SHA"); fi
          node http-generic-api/scripts/e2e-phase-governance.mjs "${args[@]}"

      - name: Stamp execution reports with exact candidate identity
        if: always()
        run: >-
          node http-generic-api/scripts/ci-evidence-source-stamp.mjs
          --candidate-kind "${CI_CANDIDATE_KIND}"
          --candidate-sha "${CI_CANDIDATE_SHA}"
          --file "${RUNNER_TEMP}/e2e-parallel-execution.json"
          --file "${RUNNER_TEMP}/e2e-phase-evaluation.json"
          --file "${RUNNER_TEMP}/e2e-phase-execution.json"

      - name: Upload phase execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-phase-execution-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/e2e-phase-evaluation.json
            ${{ runner.temp }}/e2e-phase-execution.json
            ${{ runner.temp }}/e2e-parallel-execution.json
          if-no-files-found: error
          retention-days: 30

  summarize:
    name: Publish canonical evidence report
    if: ${{ always() }}
    needs: [evaluate, execute]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate tree
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CI_CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Download structured phase reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-phase-e*-${{ github.run_id }}
          path: ${{ runner.temp }}/e2e-phase-reports
          merge-multiple: true

      - name: Build canonical evidence summary
        env:
          EVALUATE_JOB_RESULT: ${{ needs.evaluate.result }}
          EXECUTE_JOB_RESULT: ${{ needs.execute.result }}
          CANDIDATE_HEAD_REF: ${{ github.head_ref || github.ref_name }}
          CANDIDATE_BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref || '' }}
        run: >-
          node http-generic-api/scripts/ci-evidence-router.mjs
          --input-dir "${{ runner.temp }}/e2e-phase-reports"
          --policy-file ".github/ci-evidence-routing.json"
          --json-output "${{ runner.temp }}/e2e-phase-summary.json"
          --markdown-output "${{ runner.temp }}/e2e-phase-summary.md"
          --workflow "E2E Phase Governance"
          --run-id "${{ github.run_id }}"
          --candidate-kind "${CI_CANDIDATE_KIND}"
          --candidate-sha "${CI_CANDIDATE_SHA}"
          --source-head-sha "${CI_SOURCE_HEAD_SHA}"
          --head-ref "${CANDIDATE_HEAD_REF}"
          --base-ref "${CANDIDATE_BASE_REF}"
          --evaluate-result "${EVALUATE_JOB_RESULT}"
          --execute-result "${EXECUTE_JOB_RESULT}"

      - name: Upload canonical evidence summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-phase-summary-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/e2e-phase-summary.json
            ${{ runner.temp }}/e2e-phase-summary.md
          if-no-files-found: error
          retention-days: 30
