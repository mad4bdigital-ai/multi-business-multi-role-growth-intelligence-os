name: E2E Phase Governance

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: e2e-phase-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Evaluate changed feature phases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Run governance self-tests
        run: node http-generic-api/scripts/e2e-phase-governance-self-test.mjs

      - name: Evaluate changed feature phases
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          node http-generic-api/scripts/e2e-phase-governance.mjs check
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --report-file "${{ runner.temp }}/e2e-phase-evaluation.json"

      - name: Upload phase evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-phase-evaluation-${{ github.run_id }}
          path: ${{ runner.temp }}/e2e-phase-evaluation.json
          if-no-files-found: warn
          retention-days: 30

  execute:
    name: Execute current phase journeys
    runs-on: ubuntu-latest
    needs: evaluate
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            http-generic-api/package-lock.json

      - name: Install connector dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Execute declared current-phase E2E journeys
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          node http-generic-api/scripts/e2e-phase-governance.mjs run
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --report-file "${{ runner.temp }}/e2e-phase-evaluation.json"
          --execution-report-file "${{ runner.temp }}/e2e-phase-execution.json"

      - name: Upload phase execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-phase-execution-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/e2e-phase-evaluation.json
            ${{ runner.temp }}/e2e-phase-execution.json
          if-no-files-found: warn
          retention-days: 30
