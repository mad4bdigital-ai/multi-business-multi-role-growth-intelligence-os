name: Spec014 Final Binding Refresh Transient

on:
  push:
    branches:
      - fix/tenant-platform-plugin-managed-repair-4451-20260809
    paths:
      - ".github/workflows/spec014-final-binding-refresh-transient.yml"

permissions:
  contents: write

env:
  EXPECTED_PARENT: 311fb8797c3a027b1d38b16464d46fe01f0cf802
  TARGET_BRANCH: fix/tenant-platform-plugin-managed-repair-4451-20260809
  LAUNCHER_PATH: .github/workflows/spec014-final-binding-refresh-transient.yml
  HOSTINGER_MANIFEST: specs/014-governed-hostinger-storage-orchestration/work-map-integration.json
  HOSTINGER_TASKS: specs/014-governed-hostinger-storage-orchestration/tasks.md
  RETAIL_MANIFEST: specs/014-retail-commerce-operations-growth-os/work-map-integration.json

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact launcher commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify exact launcher identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$LAUNCHER_PATH"
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Run canonical Spec014 binding producers and checks
        shell: bash
        run: |
          set -euo pipefail
          report_dir="${RUNNER_TEMP}/spec014-final-binding-refresh"
          rm -rf "$report_dir"
          mkdir -p "$report_dir"

          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            | tee "$report_dir/hostinger-refresh.json"
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            --feature-key 014-retail-commerce-operations-growth-os \
            | tee "$report_dir/retail-refresh.json"

          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs --check \
            | tee "$report_dir/hostinger-check.json"
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            --feature-key 014-retail-commerce-operations-growth-os --check \
            | tee "$report_dir/retail-check.json"

          REPORT_PATH="$report_dir/hostinger-readback.json" \
            node http-generic-api/scripts/spec014-final-work-map-readback.mjs \
            > "$report_dir/hostinger-readback.stdout.json"

      - name: Remove launcher and verify bounded write set
        shell: bash
        run: |
          set -euo pipefail
          rm "$LAUNCHER_PATH"
          mapfile -t changed < <(git status --porcelain --untracked-files=all | sed -E 's/^.. //' | sort)
          printf '%s\n' "${changed[@]}"

          printf '%s\n' "${changed[@]}" | grep -Fxq "$LAUNCHER_PATH"
          printf '%s\n' "${changed[@]}" | grep -Fxq "$HOSTINGER_MANIFEST"
          printf '%s\n' "${changed[@]}" | grep -Fxq "$RETAIL_MANIFEST"

          for file in "${changed[@]}"; do
            case "$file" in
              "$LAUNCHER_PATH"|"$HOSTINGER_MANIFEST"|"$HOSTINGER_TASKS"|"$RETAIL_MANIFEST") ;;
              *) echo "Unexpected write outside bounded Spec014 refresh set: $file"; exit 1 ;;
            esac
          done

      - name: Commit and push deterministic binding refresh
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LAUNCHER_PATH" "$HOSTINGER_MANIFEST" "$HOSTINGER_TASKS" "$RETAIL_MANIFEST"
          git commit -m "chore(spec-014): refresh final Work Map bindings"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Upload bounded refresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec014-final-binding-refresh-${{ github.run_id }}
          path: ${{ runner.temp }}/spec014-final-binding-refresh
          if-no-files-found: warn
          retention-days: 30
