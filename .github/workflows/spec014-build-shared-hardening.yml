name: Build Spec 014 Shared hardening

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/spec014-build-shared-hardening.yml
      - http-generic-api/scripts/build-spec014-shared-hardening.mjs

permissions:
  contents: read

jobs:
  build:
    if: github.head_ref == 'gpt/014-hostinger/shared-canary-postmerge-hardening-20260801'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gpt/014-hostinger/shared-canary-postmerge-hardening-20260801
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply Shared hardening transformation
        run: node http-generic-api/scripts/build-spec014-shared-hardening.mjs
      - name: Package transformed candidate
        run: |
          tar -czf /tmp/spec014-shared-hardening-candidate.tgz \
            http-generic-api/hostingerStorageSharedCanary.js \
            http-generic-api/test-hostinger-storage-shared-canary.mjs \
            http-generic-api/test-hostinger-storage-shared-canary-core-import-boundary.mjs \
            .github/workflows/hostinger-storage-shared-canary-guard.yml \
            specs/014-governed-hostinger-storage-orchestration/e2e-phases.json \
            specs/014-governed-hostinger-storage-orchestration/evidence/shared-canary-postmerge-hardening-20260801.md
      - name: Upload transformed candidate
        uses: actions/upload-artifact@v4
        with:
          name: spec014-shared-hardening-candidate-${{ github.run_id }}
          path: /tmp/spec014-shared-hardening-candidate.tgz
          if-no-files-found: error
          retention-days: 1
