name: Finalize Spec 014 Tenant hardening contract

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/spec014-finalize-tenant-hardening-contract.yml'
      - 'http-generic-api/hostingerStorageTenantCanary*.js'
      - 'http-generic-api/test-hostinger-storage-tenant-canary*.mjs'
  push:
    branches:
      - gpt/014-hostinger/tenant-canary-hardening-final-20260801
    paths:
      - .github/workflows/spec014-finalize-tenant-hardening-contract.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'gpt/014-hostinger/tenant-canary-hardening-final-20260801' || github.ref_name == 'gpt/014-hostinger/tenant-canary-hardening-final-20260801'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gpt/014-hostinger/tenant-canary-hardening-final-20260801
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Finalize contract and remove workflow
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const path = 'specs/014-governed-hostinger-storage-orchestration/e2e-phases.json';
          const contract = JSON.parse(fs.readFileSync(path, 'utf8'));
          const workstreams = contract.parallel_work.workstreams;

          const repositoryBrand = workstreams.find((row) => row.id === 'control-plane-repository-brand');
          if (!repositoryBrand) throw new Error('control-plane-repository-brand workstream missing');
          repositoryBrand.status = 'integrated';
          repositoryBrand.commit_evidence = {
            head_sha: '2a3820232edf11248e2721b630eb3c9be1195e7d',
            commits: [
              '37f58a8f5348be20eeeb2c06b778b4552a84ac4a',
              '2a3820232edf11248e2721b630eb3c9be1195e7d'
            ],
          };

          const tenant = workstreams.find((row) => row.id === 'tenant-canary');
          if (!tenant) throw new Error('tenant-canary workstream missing');
          tenant.status = 'ready_for_integration';
          tenant.depends_on = [...new Set([...(tenant.depends_on || []), 'control-plane-repository-brand'])];
          tenant.deliverables = [...new Set([
            ...(tenant.deliverables || []),
            'Factory-owned synthetic adapter and Control Plane repository provenance before delegated execution',
            'Factory-owned authority-store and one-shot registry provenance before delegated execution',
            'Execution-time authority, time-window, and immutable-plan revision revalidation',
            'ABA-safe normalized authority-token snapshots with accessor rejection',
            'TypeScript-AST Base import boundary for static, dynamic, CommonJS, TypeScript, and constant-composed imports',
            'Immutable verification blockers and one-shot preservation on every preflight failure'
          ])];
          const tests = [
            ['hostinger-storage-tenant-canary-postmerge-hardening', 'test-hostinger-storage-tenant-canary-postmerge-hardening.mjs'],
            ['hostinger-storage-tenant-canary-token-normalization', 'test-hostinger-storage-tenant-canary-token-normalization.mjs'],
            ['hostinger-storage-tenant-canary-token-delegation', 'test-hostinger-storage-tenant-canary-token-delegation.mjs'],
            ['hostinger-storage-tenant-canary-store-provenance', 'test-hostinger-storage-tenant-canary-store-provenance.mjs'],
            ['hostinger-storage-tenant-canary-base-import-boundary', 'test-hostinger-storage-tenant-canary-base-import-boundary.mjs']
          ];
          tenant.required_tests ||= [];
          for (const [id, testPath] of tests) {
            if (!tenant.required_tests.some((row) => row.id === id)) {
              tenant.required_tests.push({ id, runner: 'node', working_directory: 'http-generic-api', path: testPath, args: [] });
            }
          }
          tenant.commit_evidence = {
            head_sha: 'b44eea226940ca32ff8e39aa6674d4f7c43c7a92',
            commits: ['b44eea226940ca32ff8e39aa6674d4f7c43c7a92'],
          };

          const mvp = contract.phases.find((phase) => phase.id === 'mvp');
          if (!mvp) throw new Error('MVP phase missing');
          mvp.blockers = (mvp.blockers || []).filter((value) =>
            !value.startsWith('The governed Control Plane repository provenance brand')
            && !value.startsWith('The Tenant-exclusive canary')
          );
          const repositoryStatement = 'The governed Control Plane repository provenance brand is integrated; persistence remains non-production and memory-backed.';
          const tenantStatement = 'The Tenant-exclusive canary post-merge hardening is ready for integration but remains synthetic, one-shot, and not mounted to a runtime route.';
          const sharedIndex = mvp.blockers.findIndex((value) => value.startsWith('The Shared/Platform canary'));
          const insertAt = sharedIndex >= 0 ? sharedIndex : mvp.blockers.length;
          mvp.blockers.splice(insertAt, 0, repositoryStatement, tenantStatement);

          fs.writeFileSync(path, `${JSON.stringify(contract)}\n`);
          fs.rmSync('.github/workflows/spec014-finalize-tenant-hardening-contract.yml');
          NODE

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(spec-014): register final Tenant hardening workstream'
          git push origin HEAD:gpt/014-hostinger/tenant-canary-hardening-final-20260801
