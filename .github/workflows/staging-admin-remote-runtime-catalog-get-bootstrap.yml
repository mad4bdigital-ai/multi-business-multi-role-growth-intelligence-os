name: Staging Admin Remote Runtime Catalog GET Bootstrap

on:
  push:
    branches:
      - fix/staging-admin-remote-runtime-target-catalog-get-20260916

permissions:
  contents: write
  actions: write

concurrency:
  group: staging-admin-remote-runtime-catalog-get-bootstrap
  cancel-in-progress: false

jobs:
  patch:
    if: github.repository == 'mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Verify bootstrap boundary
        shell: bash
        env:
          EXPECTED_BASE: a1b4c05e7fa65e22acde57e9efb04750218c5704
          EXPECTED_BRANCH: fix/staging-admin-remote-runtime-target-catalog-get-20260916
          BOOTSTRAP_PATH: .github/workflows/staging-admin-remote-runtime-catalog-get-bootstrap.yml
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$BOOTSTRAP_PATH"

      - name: Apply bounded source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one anchor, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          route_path = "http-generic-api/routes/platformPluginRoutes.js"
          route_anchor = '  router.post("/platform/remote-runtime/targets/catalog", ...requireAdmin, async (req, res) => {\n'
          get_route = '''  router.get("/platform/remote-runtime/targets/catalog", ...requireAdmin, async (req, res) => {
            try {
              const result = await listRemoteRuntimeTargets({
                tenantId: req.query.tenant_id || null,
                userId: req.query.user_id || null,
                targetKind: req.query.target_kind || null,
                providerFamily: req.query.provider_family || null,
                status: req.query.status || null,
                includeCommands: req.query.include_commands === undefined ? true : bool(req.query.include_commands),
                limit: boundedInt(req.query.limit, 100, 1, 250),
              });
              return res.status(200).json(result);
            } catch (err) { return errorResponse(res, err, "remote_runtime_catalog_failed"); }
          });

'''
          replace_once(route_path, route_anchor, get_route + route_anchor)

          openapi_path = "http-generic-api/openapi.yaml"
          openapi_anchor = '''  /platform/remote-runtime/targets/catalog:
    post:
'''
          openapi_get = '''  /platform/remote-runtime/targets/catalog:
    get:
      x-openai-isConsequential: false
      x-custom-gpt-surfaces: [admin_core]
      tags: [platform-plugins]
      security:
        - adminBearerAuth: []
        - backendApiKeyAuth: []
      operationId: getRemoteRuntimeTargetCatalog
      summary: Read Remote Runtime target catalog
      description: >-
        Read-only Admin catalog of Remote Runtime targets and command allowlists.
        This operation never opens SSH, local shell, or filesystem access; never
        returns credential values; never mutates targets; and grants no deployment authority.
      parameters:
        - name: tenant_id
          in: query
          required: false
          schema: { type: string }
        - name: user_id
          in: query
          required: false
          schema: { type: string }
        - name: target_kind
          in: query
          required: false
          schema: { type: string, enum: [hosting_account, local_path] }
        - name: provider_family
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [planned, active, disabled, archived] }
        - name: include_commands
          in: query
          required: false
          schema: { type: boolean, default: true }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 250, default: 100 }
      responses:
        "200":
          description: Read-only Remote Runtime target catalog
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
'''
          replace_once(openapi_path, openapi_anchor, openapi_get)

          generator_path = "http-generic-api/scripts/build-staging-admin-openapi.mjs"
          generator_anchor = '  "/admin/system/connectors/{system_id}",\n'
          replace_once(generator_path, generator_anchor, generator_anchor + '  "/platform/remote-runtime/targets/catalog",\n')

          remote_test = "http-generic-api/test-remote-runtime-catalog-probe.mjs"
          replace_once(
              remote_test,
              '// frontend-surface-operation: POST /platform/remote-runtime/targets/catalog\n',
              '// frontend-surface-operation: GET /platform/remote-runtime/targets/catalog\n// frontend-surface-operation: POST /platform/remote-runtime/targets/catalog\n',
          )
          route_assert_anchor = 'assert(routes.includes("/platform/remote-runtime/targets/catalog"), "routes must expose remote runtime catalog path");\n'
          route_assert_block = '''assert(routes.includes('router.get("/platform/remote-runtime/targets/catalog"'), "routes must expose GET remote runtime catalog path");
const getCatalogRouteStart = routes.indexOf('router.get("/platform/remote-runtime/targets/catalog"');
const getCatalogRouteEnd = routes.indexOf("\\n  router.", getCatalogRouteStart + 1);
assert.notEqual(getCatalogRouteStart, -1, "GET catalog route must exist");
const getCatalogRouteSource = routes.slice(getCatalogRouteStart, getCatalogRouteEnd === -1 ? routes.length : getCatalogRouteEnd);
assert.match(getCatalogRouteSource, /listRemoteRuntimeTargets/);
assert.match(getCatalogRouteSource, /req\\.query/);
assert.doesNotMatch(getCatalogRouteSource, /req\\.body/);
assert.doesNotMatch(getCatalogRouteSource, /upsertRemoteRuntimeTarget|validateRemoteRuntimeTarget|executeHostingerSshTargetProbe|executeHostingerSshDeployRelease/);
'''
          replace_once(remote_test, route_assert_anchor, route_assert_anchor + route_assert_block)
          openapi_assert_anchor = 'assert(openapi.includes("operationId: remoteRuntimeTargetCatalog"), "OpenAPI must expose stable catalog operationId");\n'
          replace_once(
              remote_test,
              openapi_assert_anchor,
              openapi_assert_anchor + 'assert(openapi.includes("operationId: getRemoteRuntimeTargetCatalog"), "OpenAPI must expose stable GET catalog operationId");\n',
          )

          env_test = "http-generic-api/test-custom-gpt-environment-aware-contract.mjs"
          env_anchor = 'assert.ok(operations(stagingSchema).every(({ method }) => method === "GET"));\n'
          env_block = '''const stagingRemoteRuntimeCatalog = stagingSchema.paths?.["/platform/remote-runtime/targets/catalog"];
assert.ok(stagingRemoteRuntimeCatalog?.get, "Staging Admin must expose GET Remote Runtime target catalog");
assert.equal(stagingRemoteRuntimeCatalog?.post, undefined, "Staging Admin must not expose POST Remote Runtime target catalog");
assert.equal(stagingRemoteRuntimeCatalog.get.operationId, "getRemoteRuntimeTargetCatalog");
assert.equal(stagingSchema.paths?.["/gpt/tools/call"], undefined, "Staging Admin must not promote tools/call mutation transport");
'''
          replace_once(env_test, env_anchor, env_anchor + env_block)
          PY

      - name: Verify source-only patch
        shell: bash
        run: |
          set -euo pipefail
          node --check http-generic-api/routes/platformPluginRoutes.js
          cd http-generic-api
          node test-remote-runtime-catalog-probe.mjs
          git diff --check

      - name: Commit bounded source patch and remove bootstrap
        shell: bash
        env:
          BOOTSTRAP_PATH: .github/workflows/staging-admin-remote-runtime-catalog-get-bootstrap.yml
        run: |
          set -euo pipefail
          git config user.name "mad4b-governed-bootstrap"
          git config user.email "mad4b.digital@gmail.com"
          rm "$BOOTSTRAP_PATH"
          git add \
            http-generic-api/routes/platformPluginRoutes.js \
            http-generic-api/openapi.yaml \
            http-generic-api/scripts/build-staging-admin-openapi.mjs \
            http-generic-api/test-remote-runtime-catalog-probe.mjs \
            http-generic-api/test-custom-gpt-environment-aware-contract.mjs \
            "$BOOTSTRAP_PATH"
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/staging-admin-remote-runtime-catalog-get-bootstrap.yml \
            http-generic-api/openapi.yaml \
            http-generic-api/routes/platformPluginRoutes.js \
            http-generic-api/scripts/build-staging-admin-openapi.mjs \
            http-generic-api/test-custom-gpt-environment-aware-contract.mjs \
            http-generic-api/test-remote-runtime-catalog-probe.mjs | sort)"
          test "$staged" = "$expected"
          git commit -m "fix(staging-admin): expose remote runtime target catalog read-only"
          git push origin HEAD:fix/staging-admin-remote-runtime-target-catalog-get-20260916

      - name: Dispatch governed generated OpenAPI refresh
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: fix/staging-admin-remote-runtime-target-catalog-get-20260916
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin "refs/heads/${TARGET_REF}" | awk '{print $1}')"
          test "$remote_sha" = "$head_sha"
          payload="$(jq -cn \
            --arg ref main \
            --arg target_ref "$TARGET_REF" \
            --arg expected_head_sha "$head_sha" \
            '{ref:$ref,inputs:{target_ref:$target_ref,expected_head_sha:$expected_head_sha,recipe:"frontend_openapi_refresh",confirmation:"APPLY_GENERATED_ARTIFACT_REFRESH",create_from_main:"false",source_main_sha:""}}')"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/governed-generated-artifact-refresh.yml/dispatches" \
            --input - <<<"$payload"
          echo "SOURCE_PATCH_HEAD=${head_sha}" >> "$GITHUB_STEP_SUMMARY"
