name: Spec 012 OAuth Ready ARM

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: spec012-oauth-ready-arm-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  validate-ready:
    if: >-
      github.event.pull_request.base.ref == 'gpt/spec012-oauth-ready-arm-base-20260804' &&
      github.event.pull_request.head.ref == 'gpt/spec012-oauth-canonical-deps-current-main-v3-20260804' &&
      github.event.pull_request.head.sha == '6b03d895408df15c6a733873735c6a395471b00d'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      BASE_SHA: cbdefb09bfe899f97ec8fe983b672e870d7f8c4a
      HEAD_SHA: 6b03d895408df15c6a733873735c6a395471b00d
      TARGET_PR: '6248'
      GH_TOKEN: ${{ github.token }}
      TEST_SUITE_REPORT_DIR: /tmp/spec012-ready-test-reports

    steps:
      - name: Checkout exact Ready candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify target PR Ready identity ancestry and five-file scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
          test "$(git rev-parse origin/main)" = "${BASE_SHA}"
          test "$(git merge-base origin/main HEAD)" = "${BASE_SHA}"
          target="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}")"
          test "$(jq -r '.state' <<<"${target}")" = "open"
          test "$(jq -r '.draft' <<<"${target}")" = "false"
          test "$(jq -r '.base.ref' <<<"${target}")" = "main"
          test "$(jq -r '.base.sha' <<<"${target}")" = "${BASE_SHA}"
          test "$(jq -r '.head.sha' <<<"${target}")" = "${HEAD_SHA}"
          mapfile -t files < <(git diff --name-only "${BASE_SHA}...${HEAD_SHA}" | sort)
          expected=(
            ".changes/e2e/spec012-t031-oauth-token-route-test-parity.json"
            "http-generic-api/frontend-operation-governance.generated.json"
            "http-generic-api/frontend-surface-dispatch.generated.json"
            "http-generic-api/routes/index.js"
            "http-generic-api/test-spec012-t031-oauth-token-route-wiring.mjs"
          )
          test "${#files[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${files[@]}")
          test -z "$(git status --porcelain=v1)"

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            http-generic-api/package-lock.json

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          (cd http-generic-api && npm ci)

      - name: Revalidate OAuth Frontend OpenAPI and full HTTP manifest
        shell: bash
        run: |
          set -euo pipefail
          (
            cd http-generic-api
            node test-spec012-t031-oauth-token-route-wiring.mjs
            node test-auth-oauth-routes.mjs
            node test-spec012-t033-short-lived-bearer-profile.mjs
            npm run frontend:dispatch:generate -- --baseline-ref=main
            git diff --exit-code -- frontend-operation-governance.generated.json frontend-surface-dispatch.generated.json openapi/frontend-runtime-routes.generated.yaml
            node test-frontend-dispatch-workflow-baseline.mjs
            node test-frontend-operation-governance-generator.mjs
            node test-frontend-surface-dispatch.mjs
            node test-frontend-auth-openapi-parity.mjs
            node test-openapi-route-coverage.mjs
            npm run openapi:auth:check
            npm test
          )

      - name: Revalidate runtime resolver and architecture
        shell: bash
        run: |
          set -euo pipefail
          (cd http-generic-api && FORCE_ROUTE_RUNTIME_TESTS=true DEPLOYMENT_BRANCH=gpt/spec012-oauth-canonical-deps-current-main-v3-20260804 DEPLOYMENT_COMMIT_SHA="${HEAD_SHA}" node test-deployment-manifest-generator.mjs)
          (cd http-generic-api && npm run manifest:deployment)
          (cd http-generic-api && FORCE_ROUTE_RUNTIME_TESTS=true DEPLOYMENT_BRANCH=gpt/spec012-oauth-canonical-deps-current-main-v3-20260804 DEPLOYMENT_COMMIT_SHA="${HEAD_SHA}" node test-server-startup-smoke.mjs)
          npm run typecheck
          npm test -- --runInBand
          (cd http-generic-api && npm run validate)

      - name: Revalidate exact E2E and repository lifecycle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/spec012-ready/e2e /tmp/spec012-ready/lifecycle
          node http-generic-api/test-e2e-contract-reference-integrity.mjs
          node http-generic-api/test-e2e-contract-git-index-integrity.mjs
          node http-generic-api/scripts/e2e-contract-reference-integrity.mjs --base "${BASE_SHA}" --head "${HEAD_SHA}" --report-file /tmp/spec012-ready/e2e/reference.json
          node http-generic-api/scripts/e2e-contract-git-index-integrity.mjs --report-file /tmp/spec012-ready/e2e/reference.json
          node http-generic-api/scripts/e2e-phase-governance.mjs check --base "${BASE_SHA}" --head "${HEAD_SHA}" --report-file /tmp/spec012-ready/e2e/phase.json
          node http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs
          git diff --name-status "${BASE_SHA}" "${HEAD_SHA}" > /tmp/spec012-ready/lifecycle/changes.tsv
          BASE_SHA="${BASE_SHA}" CANDIDATE_SHA="${HEAD_SHA}" node http-generic-api/scripts/maintenance-tools/repository-tool-lifecycle-guard.mjs --changed-files /tmp/spec012-ready/lifecycle/changes.tsv --policy .github/repository-maintenance-tool-governance.json --output-dir /tmp/spec012-ready/lifecycle/report
