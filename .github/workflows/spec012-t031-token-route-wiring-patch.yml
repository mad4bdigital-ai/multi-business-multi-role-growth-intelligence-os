name: Spec 012 T031 Token Route Patch

on:
  push:
    branches:
      - gpt/spec-012-t031-token-route-ambiguity-wiring-20260804
    paths:
      - .github/workflows/spec012-t031-token-route-wiring-patch.yml
      - http-generic-api/scripts/apply-spec012-t031-token-route-wiring.mjs
      - http-generic-api/scripts/apply-spec012-t031-token-cache-headers.mjs
  pull_request:
    types: [opened, reopened]
    branches: [main]
    paths:
      - .github/workflows/spec012-t031-token-route-wiring-patch.yml
      - http-generic-api/scripts/apply-spec012-t031-token-route-wiring.mjs
      - http-generic-api/scripts/apply-spec012-t031-token-cache-headers.mjs
      - http-generic-api/test-tenant-gpt-oauth-token-route-ambiguity.mjs

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gpt/spec-012-t031-token-route-ambiguity-wiring-20260804
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply bounded route patch
        run: |
          node http-generic-api/scripts/apply-spec012-t031-token-route-wiring.mjs
          node http-generic-api/scripts/apply-spec012-t031-token-cache-headers.mjs
      - name: Verify allowed patch scope
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            http-generic-api/routes/authRoutes.js \
            http-generic-api/test-spec012-t031-oauth-code-consumption-foundation.mjs | sort)"
          test "$changed" = "$expected"
      - name: Check syntax
        run: |
          node --check http-generic-api/routes/authRoutes.js
          node --check http-generic-api/test-tenant-gpt-oauth-token-route-ambiguity.mjs
          node --check http-generic-api/test-spec012-t031-oauth-code-consumption-foundation.mjs
      - name: Run focused T031 tests
        working-directory: http-generic-api
        run: |
          cp test-tenant-gpt-oauth-token-route-ambiguity.mjs /tmp/t031-route-test.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'test-tenant-gpt-oauth-token-route-ambiguity.mjs';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace(
            'throw new Error(`Unexpected token-route query: ${sql} ${JSON.stringify(params)}`);',
            'console.error("T031_UNEXPECTED_QUERY", sql, JSON.stringify(params)); throw new Error(`Unexpected token-route query: ${sql} ${JSON.stringify(params)}`);',
          );
          source = source.replace(
            'assert.equal(success.status, 200, JSON.stringify(success));',
            'if (success.status !== 200) { await new Promise((resolve) => setTimeout(resolve, 0)); console.error("T031_SUCCESS_FAILURE", JSON.stringify({ success, diagnostics: harness.diagnostics }, null, 2)); }\n  assert.equal(success.status, 200, JSON.stringify(success));',
          );
          source = source.replace(
            'assert.equal(result.body.secrets_included, false);',
            'assert.equal(result.body.secrets_included, false, `secrets_included ${JSON.stringify(result)}`);',
          );
          source = source.replace(
            'assert.equal(result.cacheControl.includes("no-store"), true);',
            'assert.equal(result.cacheControl.includes("no-store"), true, `cache-control ${JSON.stringify(result)}`);',
          );
          source = source.replace(
            'assert.equal(result.pragma.includes("no-cache"), true);',
            'assert.equal(result.pragma.includes("no-cache"), true, `pragma ${JSON.stringify(result)}`);',
          );
          fs.writeFileSync(path, source);
          NODE
          set +e
          node test-tenant-gpt-oauth-token-route-ambiguity.mjs
          route_status=$?
          cp /tmp/t031-route-test.mjs test-tenant-gpt-oauth-token-route-ambiguity.mjs
          set -e
          test "$route_status" -eq 0
          node test-spec012-t031-oauth-code-consumption-foundation.mjs
      - name: Commit verified patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add http-generic-api/routes/authRoutes.js \
            http-generic-api/test-spec012-t031-oauth-code-consumption-foundation.mjs
          git commit -m "fix(spec-012): wire token exchange ambiguity policy"
          git push origin HEAD:gpt/spec-012-t031-token-route-ambiguity-wiring-20260804
