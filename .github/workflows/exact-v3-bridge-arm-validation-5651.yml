name: Exact V3 Bridge ARM Validation 5651

on:
  pull_request:
    branches:
      - gpt/validate-v3-bridge-arm-base-b1e411
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: exact-v3-bridge-arm-validation-5651-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  exact-candidate:
    name: Exact V3 Bridge Candidate Full Validation
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/governed-generated-refresh-pr-target-v3-20260802' &&
      github.event.pull_request.head.sha == '81f8a6e8766550a7d205b9c5178f830f75f03379'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      EXPECTED_MAIN_SHA: b1e411e2fa863f5c69b9deefd3fe3c0ef818c6e5
      EXPECTED_HEAD_SHA: 81f8a6e8766550a7d205b9c5178f830f75f03379
      EXPECTED_HEAD_REF: gpt/governed-generated-refresh-pr-target-v3-20260802
      TEST_SUITE_REPORT_DIR: ${{ runner.temp }}/test-suite-reports
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            http-generic-api/package-lock.json

      - name: Verify immutable identity and exact four-file scope
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.repo.full_name }}" = "${GITHUB_REPOSITORY}"
          test "${{ github.event.pull_request.head.ref }}" = "${EXPECTED_HEAD_REF}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          git cat-file -e "${EXPECTED_MAIN_SHA}^{commit}"
          test "$(git merge-base "${EXPECTED_MAIN_SHA}" "${EXPECTED_HEAD_SHA}")" = "${EXPECTED_MAIN_SHA}"
          mapfile -t files < <(git diff --name-only "${EXPECTED_MAIN_SHA}"..."${EXPECTED_HEAD_SHA}")
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 4
          test "${files[0]}" = '.changes/e2e/governed-generated-artifact-refresh-pr-target-v3.json'
          test "${files[1]}" = '.github/workflows/governed-generated-artifact-refresh-pr-target-v3.yml'
          test "${files[2]}" = '.github/workflows/governed-generated-artifact-refresh-request-dispatcher-v3.yml'
          test "${files[3]}" = 'http-generic-api/test-governed-generated-artifact-refresh-pr-target-v3.mjs'
          git diff --check "${EXPECTED_MAIN_SHA}"..."${EXPECTED_HEAD_SHA}"

      - name: Run canonical syntax and governance checks
        shell: bash
        run: |
          set -euo pipefail
          node --check http-generic-api/test-governed-generated-artifact-refresh-pr-target-v3.mjs
          node http-generic-api/scripts/schema-docs-change-guard.mjs
          node http-generic-api/scripts/migration-placement-guard.mjs
          node http-generic-api/scripts/user-jwt-auth-governance.mjs
          node http-generic-api/scripts/interruption-readiness.mjs --ci --skip-dependencies --skip-worktree
          node validate-canonical-sources.mjs
          node build-canonicals.mjs --check
          node http-generic-api/scripts/spec-kit-completion-gate.mjs --ci --changed
          node validate-memory-schema.mjs

      - name: Install HTTP API dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Run focused V3 bridge contract regression
        working-directory: http-generic-api
        run: node test-governed-generated-artifact-refresh-pr-target-v3.mjs

      - name: Run complete Unit and Integration suite
        working-directory: http-generic-api
        env:
          GITHUB_SHA: ${{ env.EXPECTED_HEAD_SHA }}
        run: npm test

      - name: Prove runtime startup and deployment evidence
        working-directory: http-generic-api
        env:
          FORCE_ROUTE_RUNTIME_TESTS: 'true'
          DEPLOYMENT_BRANCH: ${{ env.EXPECTED_HEAD_REF }}
          DEPLOYMENT_COMMIT_SHA: ${{ env.EXPECTED_HEAD_SHA }}
        run: |
          node test-deployment-manifest-generator.mjs
          npm run manifest:deployment
          node test-server-startup-smoke.mjs

      - name: Install root dependencies and run Execution Resolver Gate
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test -- --runInBand

      - name: Run Architecture Drift Detection
        working-directory: http-generic-api
        run: npm run validate

      - name: Run exact E2E phase evaluation and execution
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/e2e-phase-governance.mjs check \
            --base "${EXPECTED_MAIN_SHA}" \
            --head "${EXPECTED_HEAD_SHA}" \
            --report-file "${RUNNER_TEMP}/e2e-phase-evaluation.json"
          node http-generic-api/scripts/e2e-phase-governance.mjs run \
            --base "${EXPECTED_MAIN_SHA}" \
            --head "${EXPECTED_HEAD_SHA}" \
            --report-file "${RUNNER_TEMP}/e2e-phase-evaluation-run.json" \
            --execution-report-file "${RUNNER_TEMP}/e2e-phase-execution.json"

      - name: Publish exact no-secret summary
        if: always()
        shell: bash
        run: |
          jq -n \
            --arg base_sha "${EXPECTED_MAIN_SHA}" \
            --arg head_sha "${EXPECTED_HEAD_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg job_status "${{ job.status }}" \
            '{contract:"mad4b.exact-v3-bridge-arm-validation.v1",base_sha:$base_sha,head_sha:$head_sha,run_id:$run_id,job_status:$job_status,candidate_mutated:false,main_mutated:false,production_mutated:false,workflow_dispatch_performed:false,provider_call:false,credential_read:false,sql_executed:false,migration_apply:false,database_mutated:false,external_send:false,secrets_included:false}' \
            > "${RUNNER_TEMP}/exact-v3-bridge-arm-validation-summary.json"

      - name: Upload exact validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-v3-bridge-arm-validation-5651-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/exact-v3-bridge-arm-validation-summary.json
            ${{ runner.temp }}/e2e-phase-*.json
            ${{ runner.temp }}/test-suite-reports/*.json
          if-no-files-found: warn
          retention-days: 14
