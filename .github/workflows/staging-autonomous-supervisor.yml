name: Staging Autonomous Supervisor Safety
on:
  pull_request:
    paths:
      - 'autopilot-portable-staging/Staging-AutonomousSupervisor.ps1'
      - 'autopilot-portable-staging/autonomous-operations-policy.json'
      - 'autopilot-portable-staging/Install-AutoDeployTask.ps1'
      - 'autopilot-portable-staging/Uninstall-AutoDeployTask.ps1'
      - 'autopilot-portable-staging/Install-AutonomousSupervisorTask.ps1'
      - 'autopilot-portable-staging/test/Test-AutonomousSupervisor.ps1'
      - '.github/workflows/staging-autonomous-supervisor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-powershell-5:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse policies and run fail-closed fixture scenarios
        shell: powershell
        run: ./autopilot-portable-staging/test/Test-AutonomousSupervisor.ps1
