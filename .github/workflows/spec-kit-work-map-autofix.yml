name: Spec Kit Work Map Autofix

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Existing same-repository pull-request branch to update
        required: true
        type: string
      expected_head_sha:
        description: Exact branch head SHA authorized for regeneration
        required: true
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: spec-kit-work-map-artifacts-${{ github.repository }}-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate Work Maps
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      TARGET_BRANCH: ${{ inputs.branch }}
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
    steps:
      - name: Initialize diagnostics and validate inputs
        id: initialize
        run: |
          set -euo pipefail
          diagnostic_root="${GITHUB_WORKSPACE}/.work-map-autofix-diagnostics"
          echo "DIAGNOSTIC_ROOT=${diagnostic_root}" >> "$GITHUB_ENV"
          mkdir -p "${diagnostic_root}"
          : > "${diagnostic_root}/validation-results.tsv"

          git check-ref-format --branch "${TARGET_BRANCH}"
          [[ "${TARGET_BRANCH}" =~ ^(gpt|cert|fix|feat|chore|docs|release)/[A-Za-z0-9._/-]+$ ]]
          [[ "${TARGET_BRANCH}" != "main" && "${TARGET_BRANCH}" != "Production" ]]
          [[ "${EXPECTED_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]

          cat > "${diagnostic_root}/report.md" <<EOF
          # Work Map Autofix Diagnostic Report

          | Field | Value |
          |---|---|
          | Repository | \`${GITHUB_REPOSITORY}\` |
          | Run | \`${GITHUB_RUN_ID}\` |
          | Target branch | \`${TARGET_BRANCH}\` |
          | Expected head | \`${EXPECTED_HEAD_SHA}\` |
          EOF

      - name: Checkout exact authorized head
        id: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 22
        id: setup_node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Pin branch and pull request identity
        id: pin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          actual_head_sha="$(git rev-parse HEAD)"
          remote_head_sha="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${actual_head_sha}" = "${EXPECTED_HEAD_SHA}"
          test "${remote_head_sha}" = "${EXPECTED_HEAD_SHA}"

          pr_file="${RUNNER_TEMP}/work-map-autofix-target-pr.json"
          gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open \
            -f base=main \
            -f head="${GITHUB_REPOSITORY_OWNER}:${TARGET_BRANCH}" \
            -f per_page=2 > "${pr_file}"
          pr_count="$(jq 'length' "${pr_file}")"
          test "${pr_count}" = "1"
          test "$(jq -r '.[0].head.repo.full_name' "${pr_file}")" = "${GITHUB_REPOSITORY}"
          test "$(jq -r '.[0].head.ref' "${pr_file}")" = "${TARGET_BRANCH}"
          test "$(jq -r '.[0].head.sha' "${pr_file}")" = "${EXPECTED_HEAD_SHA}"
          test "$(jq -r '.[0].base.ref' "${pr_file}")" = "main"
          echo "pr_number=$(jq -r '.[0].number' "${pr_file}")" >> "$GITHUB_OUTPUT"

      - name: Validate generator and governance contracts
        id: validate
        run: |
          set -euo pipefail
          validation_results="${DIAGNOSTIC_ROOT}/validation-results.tsv"
          failed_contract_file="${DIAGNOSTIC_ROOT}/failed-validation-contract.txt"

          run_contract() {
            local contract_name="$1"
            shift

            echo "::group::${contract_name}"
            set +e
            "$@"
            local exit_code=$?
            set -e
            echo "::endgroup::"

            if [[ "${exit_code}" -ne 0 ]]; then
              printf '%s\tfailed\t%s\n' "${contract_name}" "${exit_code}" >> "${validation_results}"
              printf '%s\n' "${contract_name}" > "${failed_contract_file}"
              cat >> "${DIAGNOSTIC_ROOT}/report.md" <<EOF

          ## Validation failure

          | Field | Value |
          |---|---|
          | Contract | \`${contract_name}\` |
          | Exit code | \`${exit_code}\` |
          EOF
              return "${exit_code}"
            fi

            printf '%s\tpassed\t0\n' "${contract_name}" >> "${validation_results}"
          }

          run_contract "syntax-platform-work-map-generator" \
            node --check http-generic-api/scripts/platform-work-map-generator.mjs
          run_contract "syntax-platform-work-map-schema-intelligence" \
            node --check http-generic-api/scripts/platform-work-map-schema-intelligence.mjs
          run_contract "syntax-work-map-schema-classification" \
            node --check http-generic-api/scripts/work-map-schema-classification.mjs
          run_contract "syntax-work-map-schema-classification-contract" \
            node --check http-generic-api/scripts/work-map-schema-classification-contract.mjs
          run_contract "syntax-pipeline-connectivity-check" \
            node --check http-generic-api/scripts/pipeline-connectivity-check.mjs
          run_contract "pipeline-connectivity-check" \
            node http-generic-api/scripts/pipeline-connectivity-check.mjs
          run_contract "pipeline-connectivity-regression" \
            node http-generic-api/test-pipeline-connectivity-check.mjs
          run_contract "schema-classification-contract" \
            node http-generic-api/scripts/work-map-schema-classification-contract.mjs
          run_contract "schema-classification" \
            node http-generic-api/scripts/work-map-schema-classification.mjs
          run_contract "schema-classification-regression" \
            node http-generic-api/test-work-map-schema-classification.mjs
          run_contract "schema-classification-contract-regression" \
            node http-generic-api/test-work-map-schema-classification-contract.mjs

      - name: Regenerate and prove idempotency
        id: generate
        run: |
          set -euo pipefail
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          unexpected_files="$(git diff --name-only | grep -v '^docs/work-maps/' || true)"
          if [[ -n "${unexpected_files}" ]]; then
            echo "Generator modified files outside docs/work-maps:"
            printf '%s\n' "${unexpected_files}"
            exit 1
          fi

          first_diff_hash="$(git diff --binary -- docs/work-maps | sha256sum | awk '{print $1}')"
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          second_diff_hash="$(git diff --binary -- docs/work-maps | sha256sum | awk '{print $1}')"
          test "${first_diff_hash}" = "${second_diff_hash}"
          node http-generic-api/scripts/platform-work-map-generator.mjs --check

      - name: Commit and push governed Work Maps
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          changed=false
          result_head_sha="${EXPECTED_HEAD_SHA}"

          if ! git diff --quiet -- docs/work-maps; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/work-maps
            git commit -m "docs(work-maps): regenerate governed platform maps"

            remote_head_sha="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
            test "${remote_head_sha}" = "${EXPECTED_HEAD_SHA}"
            git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

            result_head_sha="$(git rev-parse HEAD)"
            remote_head_sha="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
            test "${remote_head_sha}" = "${result_head_sha}"
            changed=true
          fi

          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          echo "result_head_sha=${result_head_sha}" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact-head verification
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT_HEAD_SHA: ${{ steps.publish.outputs.result_head_sha }}
        run: |
          set -euo pipefail
          [[ "${RESULT_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          remote_head_sha="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head_sha}" = "${RESULT_HEAD_SHA}"
          gh workflow run ci.yml --ref "${TARGET_BRANCH}"
          gh workflow run spec-kit-work-map-integration.yml --ref "${TARGET_BRANCH}"

      - name: Finalize diagnostic evidence
        id: diagnostics
        if: always()
        continue-on-error: true
        env:
          PR_NUMBER: ${{ steps.pin.outputs.pr_number }}
          CHANGED: ${{ steps.publish.outputs.changed }}
          RESULT_HEAD_SHA: ${{ steps.publish.outputs.result_head_sha }}
          JOB_STATUS: ${{ job.status }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${DIAGNOSTIC_ROOT}"

          failed_validation_contract="none"
          if [[ -s "${DIAGNOSTIC_ROOT}/failed-validation-contract.txt" ]]; then
            failed_validation_contract="$(tr -d '\r\n' < "${DIAGNOSTIC_ROOT}/failed-validation-contract.txt")"
          fi

          cat >> "${DIAGNOSTIC_ROOT}/report.md" <<EOF

          ## Result

          | Field | Value |
          |---|---|
          | Job status | \`${JOB_STATUS}\` |
          | Failed validation contract | \`${failed_validation_contract}\` |
          | Generated changes | \`${CHANGED:-unknown}\` |
          | Result head | \`${RESULT_HEAD_SHA:-unresolved}\` |
          | Protected branch mutation | \`false\` |
          | Force push | \`false\` |
          EOF

          jq -n \
            --arg contract "mad4b.spec-kit-work-map-autofix.v2" \
            --arg outcome "${JOB_STATUS}" \
            --arg target_branch "${TARGET_BRANCH}" \
            --arg expected_head_sha "${EXPECTED_HEAD_SHA}" \
            --arg failed_validation_contract "${failed_validation_contract}" \
            --arg result_head_sha "${RESULT_HEAD_SHA:-unresolved}" \
            --arg changed "${CHANGED:-unknown}" \
            '{contract:$contract,outcome:$outcome,target_branch:$target_branch,expected_head_sha:$expected_head_sha,failed_validation_contract:$failed_validation_contract,result_head_sha:$result_head_sha,changed:$changed,direct_protected_branch_mutation:false,force_push:false,secrets_included:false}' \
            > "${DIAGNOSTIC_ROOT}/report.json"

          if [[ "${PR_NUMBER:-}" =~ ^[1-9][0-9]*$ ]]; then
            body="WORK_MAP_AUTOFIX_V2 outcome=${JOB_STATUS} expected_head_sha=${EXPECTED_HEAD_SHA} failed_validation_contract=${failed_validation_contract} result_head_sha=${RESULT_HEAD_SHA:-unresolved} changed=${CHANGED:-unknown} protected_branch_mutation=false force_push=false"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="${body}" >/dev/null
          fi

      - name: Upload Work Map diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-map-autofix-diagnostics-${{ github.run_id }}
          path: .work-map-autofix-diagnostics
          if-no-files-found: warn
          retention-days: 14
