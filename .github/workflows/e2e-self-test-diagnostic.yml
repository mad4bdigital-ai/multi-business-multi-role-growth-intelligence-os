name: E2E Governance Self-Test Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: e2e-self-test-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    name: Identify failing governance self-test
    if: github.head_ref == 'gpt/014-hostinger/current-main-connector-evidence-reconciliation-20260802'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate tree
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Self-test — phase governance
        run: node http-generic-api/scripts/e2e-phase-governance-self-test.mjs

      - name: Self-test — phase init
        run: node http-generic-api/scripts/e2e-phase-init-self-test.mjs

      - name: Self-test — parallel work governance
        run: node http-generic-api/scripts/e2e-parallel-work-governance-self-test.mjs

      - name: Self-test — parallel plan init
        run: node http-generic-api/scripts/e2e-parallel-plan-init-self-test.mjs

      - name: Self-test — parallel PR flow
        run: node http-generic-api/scripts/e2e-parallel-pr-flow-self-test.mjs

      - name: Self-test — parallel runner diagnostics
        run: node http-generic-api/scripts/test-e2e-parallel-test-runner-diagnostics.mjs

      - name: Self-test — evidence source stamp
        run: node http-generic-api/scripts/test-ci-evidence-source-stamp.mjs

      - name: Self-test — evidence router
        run: node http-generic-api/scripts/test-ci-evidence-router.mjs

      - name: Self-test — evidence PR comment
        run: node http-generic-api/scripts/test-ci-evidence-pr-comment.mjs
