name: Sprint 69 Migration 1006 Governed Rollout

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      confirmation_comment_id:
        description: Exact readiness authorization comment ID 5170518874 on Issue #4122
        required: true
        type: string
      expected_main_sha:
        description: Exact main SHA authorized for this readiness run
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '.github/ops/triggers/sprint69-1006-readiness-trigger.json'

permissions:
  contents: read

jobs:
  readiness:
    name: Authorize and dry-run Migration 1006
    if: >-
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 4122 &&
        !github.event.issue.pull_request &&
        github.event.comment.body == 'AUTHORIZE_GOVERNED_MIGRATION_1006_SPRINT69_AGENT_CAPABILITY_EVIDENCE_COVERAGE' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        inputs.confirmation_comment_id != '' &&
        inputs.expected_main_sha != ''
      ) || (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: sprint69-migration-1006-readiness
      cancel-in-progress: false
    env:
      ROLLOUT_PHASE: readiness
      RUNTIME_BASE_URL: https://auth.mad4b.com
      BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
      GH_READ_TOKEN: ${{ github.token }}
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      CONTROL_ISSUE: '4122'
      EVIDENCE_DIR: .artifacts/sprint69-1006-readiness
      READINESS_TRIGGER_PATH: .github/ops/triggers/sprint69-1006-readiness-trigger.json
      DISPATCH_CONFIRMATION_COMMENT_ID: ${{ inputs.confirmation_comment_id }}
      DISPATCH_EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Validate push fallback operator authorization
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/ops/validate-sprint69-1006-readiness-trigger.mjs

      - name: Validate manual dispatch operator authorization
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/ops/validate-sprint69-1006-readiness-trigger.mjs

      - name: Execute integrated readiness wave
        id: rollout
        run: node .github/ops/sprint69-1006-governed-rollout.mjs

      - name: Upload no-secret readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint69-1006-readiness-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish readiness summary
        if: always()
        shell: bash
        run: |
          node <<'NODE' >>"${GITHUB_STEP_SUMMARY}"
          const fs = require('node:fs');
          const summaryPath = `${process.env.EVIDENCE_DIR}/summary.json`;
          const failurePath = `${process.env.EVIDENCE_DIR}/failure.json`;
          if (fs.existsSync(summaryPath)) {
            const s = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
            process.stdout.write(`## Migration 1006 readiness: pass\n\n- Production SHA: \`${s.production_sha}\`\n- Checksum: \`${s.checksum}\`\n- Statements: ${s.statement_count}\n- Authorization: ${s.authorization || 'already_applied'}\n- Dry run: ${s.dry_run || 'already_applied'}\n`);
          } else {
            const f = fs.existsSync(failurePath) ? JSON.parse(fs.readFileSync(failurePath, 'utf8')) : {};
            process.stdout.write(`## Migration 1006 readiness: fail\n\n- Stage: ${f.stage || 'unknown'}\n- Error code: ${f.error?.code || 'workflow_failed'}\n`);
          }
          NODE

  apply:
    name: Apply and certify Migration 1006
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 4122 &&
      !github.event.issue.pull_request &&
      github.event.comment.body == 'APPLY_1006_SPRINT69_AGENT_CAPABILITY_EVIDENCE_COVERAGE' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: sprint69-migration-1006-apply
      cancel-in-progress: false
    env:
      ROLLOUT_PHASE: apply
      RUNTIME_BASE_URL: https://auth.mad4b.com
      BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
      GH_READ_TOKEN: ${{ github.token }}
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      CONTROL_ISSUE: '4122'
      EVIDENCE_DIR: .artifacts/sprint69-1006-apply
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Execute integrated apply and certification wave
        id: rollout
        run: node .github/ops/sprint69-1006-governed-rollout.mjs

      - name: Upload no-secret apply evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint69-1006-apply-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish apply summary
        if: always()
        shell: bash
        run: |
          node <<'NODE' >>"${GITHUB_STEP_SUMMARY}"
          const fs = require('node:fs');
          const summaryPath = `${process.env.EVIDENCE_DIR}/summary.json`;
          const failurePath = `${process.env.EVIDENCE_DIR}/failure.json`;
          if (fs.existsSync(summaryPath)) {
            const s = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
            process.stdout.write(`## Migration 1006 apply: pass\n\n- Production SHA: \`${s.production_sha}\`\n- Checksum: \`${s.checksum}\`\n- Statements: ${s.statement_count}\n- Apply sent by this run: ${s.apply_sent_by_this_run}\n- Apply retried: false\n- Ledger: pass\n- Dependency gate 1007: pass\n`);
          } else {
            const f = fs.existsSync(failurePath) ? JSON.parse(fs.readFileSync(failurePath, 'utf8')) : {};
            process.stdout.write(`## Migration 1006 apply: fail\n\n- Stage: ${f.stage || 'unknown'}\n- Apply sent: ${f.apply_sent || false}\n- Error code: ${f.error?.code || 'workflow_failed'}\n`);
          }
          NODE
