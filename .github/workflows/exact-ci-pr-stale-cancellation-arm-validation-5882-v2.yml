name: Exact CI PR Stale Cancellation ARM Validation 5921
run-name: Exact ARM Draft validation · PR 5921

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/exact-ci-pr-stale-cancellation-arm-validation-5882-v2.yml

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: exact-ci-pr-stale-cancellation-arm-validation-5921
  cancel-in-progress: false

jobs:
  exact-candidate:
    name: Exact Draft Candidate Full Validation
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/exact-ci-pr-stale-cancellation-arm-validation-5882-v2'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      VALIDATOR_PR: ${{ github.event.pull_request.number }}
      TARGET_PR: '5921'
      VALIDATOR_WORKFLOW: .github/workflows/exact-ci-pr-stale-cancellation-arm-validation-5882-v2.yml
      EXPECTED_MAIN_SHA: 97e4ee7ec790844ad20ee2349125579353c693d5
      EXPECTED_HEAD_SHA: 440ceb3dfe3c05cf48144b5fdc4fc4ac454115f1
      EXPECTED_HEAD_REF: gpt/ci-pr-stale-cancellation-main-97e4ee7e-20260804

    steps:
      - name: Initialize report directory
        shell: bash
        run: |
          set -euo pipefail
          echo "REPORT_DIR=${RUNNER_TEMP}/exact-ci-validation-5921" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/exact-ci-validation-5921"

      - name: Verify validator surface and canonical PR identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t validator_files < <(gh api --paginate "/repos/${REPOSITORY}/pulls/${VALIDATOR_PR}/files?per_page=100" --jq '.[].filename')
          test "${#validator_files[@]}" -eq 1
          test "${validator_files[0]}" = "${VALIDATOR_WORKFLOW}"
          main_sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "${main_sha}" = "${EXPECTED_MAIN_SHA}"
          pr_json="$(gh api "repos/${REPOSITORY}/pulls/${TARGET_PR}")"
          test "$(jq -r '.state' <<<"${pr_json}")" = 'open'
          test "$(jq -r '.draft' <<<"${pr_json}")" = 'true'
          test "$(jq -r '.base.ref' <<<"${pr_json}")" = 'main'
          test "$(jq -r '.base.sha' <<<"${pr_json}")" = "${EXPECTED_MAIN_SHA}"
          test "$(jq -r '.head.repo.full_name' <<<"${pr_json}")" = "${REPOSITORY}"
          test "$(jq -r '.head.ref' <<<"${pr_json}")" = "${EXPECTED_HEAD_REF}"
          test "$(jq -r '.head.sha' <<<"${pr_json}")" = "${EXPECTED_HEAD_SHA}"
          compare_json="$(gh api "repos/${REPOSITORY}/compare/${EXPECTED_MAIN_SHA}...${EXPECTED_HEAD_SHA}")"
          test "$(jq -r '.ahead_by' <<<"${compare_json}")" = '2'
          test "$(jq -r '.behind_by' <<<"${compare_json}")" = '0'
          test "$(jq '.files | length' <<<"${compare_json}")" = '6'

      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            http-generic-api/package-lock.json

      - name: Verify immutable topology, scope, and Blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main" "+refs/heads/${EXPECTED_HEAD_REF}:refs/remotes/origin/${EXPECTED_HEAD_REF}"
          test "$(git rev-parse refs/remotes/origin/main)" = "${EXPECTED_MAIN_SHA}"
          test "$(git rev-parse refs/remotes/origin/${EXPECTED_HEAD_REF})" = "${EXPECTED_HEAD_SHA}"
          test "$(git merge-base "${EXPECTED_MAIN_SHA}" "${EXPECTED_HEAD_SHA}")" = "${EXPECTED_MAIN_SHA}"
          test "$(git rev-list --count "${EXPECTED_MAIN_SHA}..${EXPECTED_HEAD_SHA}")" -eq 2
          mapfile -t files < <(git diff --name-only "${EXPECTED_MAIN_SHA}"..."${EXPECTED_HEAD_SHA}")
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 6
          test "${files[0]}" = '.changes/e2e/ci-pull-request-recovery-exact-checkout-provenance.json'
          test "${files[1]}" = '.github/workflows/ci-pull-request-recovery.yml'
          test "${files[2]}" = '.github/workflows/ci.yml'
          test "${files[3]}" = 'docs/work-maps/README.md'
          test "${files[4]}" = 'docs/work-maps/repository-automation-map.md'
          test "${files[5]}" = 'http-generic-api/test-ci-pull-request-recovery-exact-checkout-provenance.mjs'
          test "$(git rev-parse "${EXPECTED_HEAD_SHA}:.changes/e2e/ci-pull-request-recovery-exact-checkout-provenance.json")" = '98563a3aa27fe26f5f6ec336e3b6e72dc41b1bd9'
          test "$(git rev-parse "${EXPECTED_HEAD_SHA}:.github/workflows/ci-pull-request-recovery.yml")" = 'a93265700c7637750b0b0dd828ba51762221fe42'
          test "$(git rev-parse "${EXPECTED_HEAD_SHA}:.github/workflows/ci.yml")" = '1c496f7770f784f8e3aa2dc1b3c310c379c2d54f'
          test "$(git rev-parse "${EXPECTED_HEAD_SHA}:docs/work-maps/README.md")" = 'b8f547f0aa5ab458327c81947c80e3516f6f0f32'
          test "$(git rev-parse "${EXPECTED_HEAD_SHA}:docs/work-maps/repository-automation-map.md")" = 'e3867915727db3fdd6dd8522d32cd99dd4ddeb15'
          test "$(git rev-parse "${EXPECTED_HEAD_SHA}:http-generic-api/test-ci-pull-request-recovery-exact-checkout-provenance.mjs")" = '9a0e8e9d500ffd5f671ccec14288782e836efcbf'

      - name: Install HTTP API dependencies before governance
        working-directory: http-generic-api
        run: npm ci

      - name: Run canonical syntax, governance, and generated Work Map checks
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/schema-docs-change-guard.mjs
          node http-generic-api/scripts/migration-placement-guard.mjs
          node http-generic-api/scripts/user-jwt-auth-governance.mjs
          node http-generic-api/scripts/interruption-readiness.mjs --ci --skip-dependencies --skip-worktree
          node validate-canonical-sources.mjs
          node build-canonicals.mjs --check
          node --check find-canonical-domain.mjs
          (cd http-generic-api && node scripts/resource-api-coverage-audit.mjs --ci --changed)
          (cd http-generic-api && node test-resource-api-architecture.mjs && node test-resource-api-service.mjs)
          node http-generic-api/scripts/spec-kit-completion-gate.mjs --ci --changed
          node validate-memory-schema.mjs
          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          node http-generic-api/scripts/pipeline-connectivity-check.mjs
          node http-generic-api/scripts/work-map-schema-classification-contract.mjs
          node http-generic-api/scripts/work-map-schema-classification.mjs
          git diff --check
          node --check http-generic-api/test-ci-pull-request-recovery-exact-checkout-provenance.mjs
          node -e "JSON.parse(require('node:fs').readFileSync('.changes/e2e/ci-pull-request-recovery-exact-checkout-provenance.json','utf8'))"

      - name: Run focused cancellation and Work Map regressions
        working-directory: http-generic-api
        run: |
          node test-ci-pull-request-recovery-exact-checkout-provenance.mjs
          node test-pipeline-connectivity-check.mjs
          node test-work-map-schema-classification.mjs
          node test-work-map-schema-classification-contract.mjs

      - name: Run complete Unit and Integration suite with exact provenance
        working-directory: http-generic-api
        shell: bash
        env:
          TEST_SUITE_REPORT_DIR: ${{ runner.temp }}/test-suite-reports
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${EXPECTED_HEAD_SHA}"
          GITHUB_SHA="${actual_sha}" npm test

      - name: Verify exact test report provenance
        shell: bash
        run: |
          set -euo pipefail
          for report in "$RUNNER_TEMP/test-suite-reports/test-manifest.json" "$RUNNER_TEMP/test-suite-reports/test-suite.json"; do
            test -f "$report"
            test "$(jq -r '.status' "$report")" = 'passed'
            test "$(jq -r '.commitSha' "$report")" = "$EXPECTED_HEAD_SHA"
            test "$(jq -r '.firstFailure' "$report")" = 'null'
            test "$(jq -r '.secretsIncluded' "$report")" = 'false'
          done

      - name: Prove runtime startup and deployment evidence
        working-directory: http-generic-api
        env:
          FORCE_ROUTE_RUNTIME_TESTS: 'true'
          DEPLOYMENT_BRANCH: ${{ env.EXPECTED_HEAD_REF }}
          DEPLOYMENT_COMMIT_SHA: ${{ env.EXPECTED_HEAD_SHA }}
        run: |
          node test-deployment-manifest-generator.mjs
          npm run manifest:deployment
          node test-server-startup-smoke.mjs

      - name: Install root dependencies and run Execution Resolver Gate
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test -- --runInBand

      - name: Run Architecture Drift Detection
        working-directory: http-generic-api
        run: npm run validate

      - name: Run exact E2E phase evaluation and execution
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/e2e-phase-governance.mjs check --base "${EXPECTED_MAIN_SHA}" --head "${EXPECTED_HEAD_SHA}" --report-file "${REPORT_DIR}/e2e-phase-evaluation.json"
          node http-generic-api/scripts/e2e-phase-governance.mjs run --base "${EXPECTED_MAIN_SHA}" --head "${EXPECTED_HEAD_SHA}" --report-file "${REPORT_DIR}/e2e-phase-evaluation-run.json" --execution-report-file "${REPORT_DIR}/e2e-phase-execution.json"

      - name: Run lifecycle and reference integrity checks independently
        id: lifecycle
        continue-on-error: true
        working-directory: http-generic-api
        shell: bash
        run: |
          failures=0
          for entry in 'repository-tool-lifecycle:test-repository-tool-lifecycle.mjs' 'repo-lock-governance:test-repo-lock-governance.mjs' 'e2e-contract-reference-integrity:test-e2e-contract-reference-integrity.mjs'; do
            name="${entry%%:*}"
            script="${entry#*:}"
            set +e
            node "${script}" > "${REPORT_DIR}/${name}.stdout" 2> "${REPORT_DIR}/${name}.stderr"
            rc=$?
            set -e
            printf '%s\t%s\n' "${name}" "${rc}" >> "${REPORT_DIR}/lifecycle-results.tsv"
            [[ "${rc}" -eq 0 ]] || failures=$((failures + 1))
          done
          test "${failures}" -eq 0

      - name: Publish exact no-secret summary
        if: always()
        shell: bash
        env:
          LIFECYCLE_OUTCOME: ${{ steps.lifecycle.outcome }}
        run: |
          mkdir -p "${REPORT_DIR}"
          jq -n --arg base_sha "${EXPECTED_MAIN_SHA}" --arg head_sha "${EXPECTED_HEAD_SHA}" --arg run_id "${GITHUB_RUN_ID}" --arg lifecycle_outcome "${LIFECYCLE_OUTCOME}" '{contract:"mad4b.exact-ci-pr-stale-cancellation-arm-validation.v3",base_sha:$base_sha,head_sha:$head_sha,run_id:$run_id,lifecycle_outcome:$lifecycle_outcome,test_report_provenance_verified:true,generated_work_maps_checked:true,candidate_mutated:false,main_mutated:false,production_mutated:false,provider_call:false,credential_read:false,sql_executed:false,migration_apply:false,database_mutated:false,external_send:false,secrets_included:false}' > "${REPORT_DIR}/summary.json"

      - name: Upload exact validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-ci-pr-stale-cancellation-arm-validation-5921-${{ github.run_id }}
          path: |
            ${{ env.REPORT_DIR }}
            ${{ runner.temp }}/test-suite-reports/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce lifecycle outcome
        if: always()
        shell: bash
        env:
          LIFECYCLE_OUTCOME: ${{ steps.lifecycle.outcome }}
        run: test "${LIFECYCLE_OUTCOME}" = 'success'
