name: Exact CI PR Stale Cancellation ARM Validation 5882 V2

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/exact-ci-pr-stale-cancellation-arm-validation-5882-v2.yml

permissions:
  contents: read

concurrency:
  group: exact-ci-pr-stale-cancellation-arm-validation-5882-v2
  cancel-in-progress: false

jobs:
  register:
    name: Register exact ARM validator
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/exact-ci-pr-stale-cancellation-arm-validation-5882-v2'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Confirm registration
        run: echo 'exact ARM validator registered'
