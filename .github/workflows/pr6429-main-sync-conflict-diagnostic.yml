name: PR 6429 governed main reconciliation

# trigger: capture-current-main-v6
on:
  push:
    branches:
      - gpt/reconcile/pr6429-main-20260806

permissions:
  contents: write

concurrency:
  group: pr6429-governed-main-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    name: Merge captured main and regenerate conflicts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WORK_BRANCH: gpt/reconcile/pr6429-main-20260806
      WORKFLOW_PATH: .github/workflows/pr6429-main-sync-conflict-diagnostic.yml
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: gpt/reconcile/pr6429-main-20260806

      - name: Capture immutable branch and main bindings
        shell: bash
        run: |
          set -euo pipefail
          expected_branch_head='${{ github.sha }}'
          remote_branch_head="$(git ls-remote --exit-code origin "refs/heads/${WORK_BRANCH}" | awk '{print $1}')"
          captured_main_head="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test "${remote_branch_head}" = "${expected_branch_head}"
          [[ "${captured_main_head}" =~ ^[0-9a-f]{40}$ ]]
          printf '%s\n' "${captured_main_head}" > /tmp/pr6429-pinned-main-sha
          git fetch --no-tags origin "${captured_main_head}"

      - name: Merge captured main and resolve generated conflicts only
        shell: bash
        run: |
          set -euo pipefail
          PINNED_MAIN_SHA="$(cat /tmp/pr6429-pinned-main-sha)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          set +e
          git merge --no-ff --no-commit "${PINNED_MAIN_SHA}"
          merge_rc=$?
          set -e
          test "${merge_rc}" -eq 1

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
          expected_conflicts=(
            'docs/work-maps/README.md'
            'http-generic-api/frontend-operation-governance.generated.json'
            'http-generic-api/frontend-surface-dispatch.generated.json'
          )
          printf '%s\n' "${conflicts[@]}" > /tmp/conflicts.actual
          printf '%s\n' "${expected_conflicts[@]}" > /tmp/conflicts.expected
          diff -u /tmp/conflicts.expected /tmp/conflicts.actual

          git checkout --ours -- "${expected_conflicts[@]}"
          git add -- "${expected_conflicts[@]}"
          rm -f "${WORKFLOW_PATH}"
          git add -u -- "${WORKFLOW_PATH}"
          test -f .git/MERGE_HEAD
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Install generator dependencies
        working-directory: http-generic-api
        shell: bash
        run: npm ci --ignore-scripts

      - name: Regenerate frontend governance and dispatch artifacts
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          node scripts/frontend-operation-governance-generator.mjs --write
          node scripts/frontend-operation-governance-generator.mjs --check
          node scripts/frontend-surface-dispatch.mjs --write --baseline-ref=main
          node scripts/frontend-surface-dispatch.mjs --check --baseline-ref=main

      - name: Validate official Work Map contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check http-generic-api/scripts/platform-work-map-generator.mjs
          node --check http-generic-api/scripts/platform-work-map-schema-intelligence.mjs
          node --check http-generic-api/scripts/work-map-schema-classification.mjs
          node --check http-generic-api/scripts/work-map-schema-classification-contract.mjs
          node --check http-generic-api/scripts/pipeline-connectivity-check.mjs
          node http-generic-api/scripts/pipeline-connectivity-check.mjs
          node http-generic-api/test-pipeline-connectivity-check.mjs
          node http-generic-api/scripts/work-map-schema-classification-contract.mjs
          node http-generic-api/scripts/work-map-schema-classification.mjs
          node http-generic-api/test-work-map-schema-classification.mjs
          node http-generic-api/test-work-map-schema-classification-contract.mjs

      - name: Regenerate Work Maps and prove idempotency
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/platform-work-map-generator.mjs --write

          unexpected_files="$(git diff --name-only | grep -v -E '^(docs/work-maps/|http-generic-api/frontend-operation-governance.generated.json$|http-generic-api/frontend-surface-dispatch.generated.json$|http-generic-api/openapi/frontend-runtime-routes.generated.yaml$)' || true)"
          if [[ -n "${unexpected_files}" ]]; then
            echo 'Generator or frontend refresh modified an unexpected path:' >&2
            printf '%s\n' "${unexpected_files}" >&2
            exit 1
          fi

          first_diff_hash="$(git diff --binary -- docs/work-maps | sha256sum | awk '{print $1}')"
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          second_diff_hash="$(git diff --binary -- docs/work-maps | sha256sum | awk '{print $1}')"
          test "${first_diff_hash}" = "${second_diff_hash}"
          node http-generic-api/scripts/platform-work-map-generator.mjs --check

      - name: Validate bounded generated delta
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t unstaged < <(git diff --name-only | sort)
          allowed_paths=(
            'docs/work-maps/README.md'
            'docs/work-maps/data-model-domain-map.md'
            'docs/work-maps/work-map-coverage-matrix.md'
            'http-generic-api/frontend-operation-governance.generated.json'
            'http-generic-api/frontend-surface-dispatch.generated.json'
            'http-generic-api/openapi/frontend-runtime-routes.generated.yaml'
          )
          printf '%s\n' "${allowed_paths[@]}" | sort > /tmp/generated.allowed
          printf '%s\n' "${unstaged[@]}" | sort > /tmp/generated.actual
          unexpected="$(comm -13 /tmp/generated.allowed /tmp/generated.actual)"
          if [[ -n "${unexpected}" ]]; then
            echo 'Unexpected generated path:' >&2
            printf '%s\n' "${unexpected}" >&2
            exit 1
          fi
          test "${#unstaged[@]}" -gt 0
          git diff --check
          git add -- \
            docs/work-maps/README.md \
            docs/work-maps/data-model-domain-map.md \
            docs/work-maps/work-map-coverage-matrix.md \
            http-generic-api/frontend-operation-governance.generated.json \
            http-generic-api/frontend-surface-dispatch.generated.json \
            http-generic-api/openapi/frontend-runtime-routes.generated.yaml
          test -z "$(git diff --name-only)"
          test -z "$(git diff --name-only --diff-filter=U)"
          test ! -e "${WORKFLOW_PATH}"

      - name: Run focused controller regressions
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir=/tmp/pr6429-reconciliation-evidence
          mkdir -p "${evidence_dir}"
          overall=0
          for test_file in \
            test-github-repository-policy-controller.mjs \
            test-repository-automation-policy-facade.mjs \
            test-frontend-surface-dispatch.mjs
          do
            set +e
            node "${test_file}" 2>&1 | tee "${evidence_dir}/${test_file}.log"
            test_rc=${PIPESTATUS[0]}
            set -e
            printf '%s=%s\n' "${test_file}" "${test_rc}" >> "${evidence_dir}/focused-test-status.txt"
            if [[ "${test_rc}" -ne 0 ]]; then
              overall=1
            fi
          done
          exit "${overall}"

      - name: Commit merge and push without force
        shell: bash
        run: |
          set -euo pipefail
          PINNED_MAIN_SHA="$(cat /tmp/pr6429-pinned-main-sha)"
          pre_push_remote="$(git ls-remote --exit-code origin "refs/heads/${WORK_BRANCH}" | awk '{print $1}')"
          current_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test "${pre_push_remote}" = '${{ github.sha }}'
          test "${current_main}" = "${PINNED_MAIN_SHA}"

          mkdir -p /tmp/pr6429-reconciliation-evidence
          {
            echo "source_branch_head=${{ github.sha }}"
            echo "pinned_main_sha=${PINNED_MAIN_SHA}"
            echo 'conflicts_resolved=docs/work-maps/README.md,http-generic-api/frontend-operation-governance.generated.json,http-generic-api/frontend-surface-dispatch.generated.json'
            echo 'resolution=regenerated_from_final_merged_tree'
            echo 'work_map_validation=official_autofix_contracts_plus_two-pass_idempotency'
            echo 'focused_tests=canonical_pr6429_e2e_contract_tests'
            echo 'main_rechecked_before_push=true'
            echo 'force_push=false'
          } >> /tmp/pr6429-reconciliation-evidence/bindings.txt
          git diff --cached --name-only | sort > /tmp/pr6429-reconciliation-evidence/staged-paths.txt

          git commit -m 'chore: reconcile PR 6429 with latest main'
          result_head="$(git rev-parse HEAD)"
          echo "result_head=${result_head}" >> /tmp/pr6429-reconciliation-evidence/bindings.txt
          git push origin "HEAD:refs/heads/${WORK_BRANCH}"
          remote_after="$(git ls-remote --exit-code origin "refs/heads/${WORK_BRANCH}" | awk '{print $1}')"
          test "${remote_after}" = "${result_head}"

      - name: Upload reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr6429-main-reconciliation-${{ github.sha }}
          path: /tmp/pr6429-reconciliation-evidence
          if-no-files-found: warn
          retention-days: 7
