name: PR 6429 governed main reconciliation

# trigger: execute-pinned-main-fa225f7-v2
on:
  push:
    branches:
      - gpt/reconcile/pr6429-main-20260806

permissions:
  contents: write

concurrency:
  group: pr6429-governed-main-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    name: Merge pinned main and regenerate conflicts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WORK_BRANCH: gpt/reconcile/pr6429-main-20260806
      PINNED_MAIN_SHA: fa225f7146498cd570d6126a9d228fbbf9edbb3e
      WORKFLOW_PATH: .github/workflows/pr6429-main-sync-conflict-diagnostic.yml
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: gpt/reconcile/pr6429-main-20260806

      - name: Verify immutable bindings
        shell: bash
        run: |
          set -euo pipefail
          expected_branch_head='${{ github.sha }}'
          remote_branch_head="$(git ls-remote --exit-code origin "refs/heads/${WORK_BRANCH}" | awk '{print $1}')"
          remote_main_head="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test "${remote_branch_head}" = "${expected_branch_head}"
          test "${remote_main_head}" = "${PINNED_MAIN_SHA}"
          git fetch --no-tags origin "${PINNED_MAIN_SHA}"

      - name: Merge pinned main and resolve generated conflicts only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          set +e
          git merge --no-ff --no-commit "${PINNED_MAIN_SHA}"
          merge_rc=$?
          set -e
          test "${merge_rc}" -eq 1

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
          expected_conflicts=(
            'docs/work-maps/README.md'
            'http-generic-api/frontend-operation-governance.generated.json'
            'http-generic-api/frontend-surface-dispatch.generated.json'
          )
          printf '%s\n' "${conflicts[@]}" > /tmp/conflicts.actual
          printf '%s\n' "${expected_conflicts[@]}" > /tmp/conflicts.expected
          diff -u /tmp/conflicts.expected /tmp/conflicts.actual

          git checkout --ours -- "${expected_conflicts[@]}"
          git add -- "${expected_conflicts[@]}"
          rm -f "${WORKFLOW_PATH}"
          git add -u -- "${WORKFLOW_PATH}"
          test -f .git/MERGE_HEAD
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Install generator dependencies
        working-directory: http-generic-api
        shell: bash
        run: npm ci --ignore-scripts

      - name: Regenerate frontend governance and dispatch artifacts
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          node scripts/frontend-operation-governance-generator.mjs --write
          node scripts/frontend-operation-governance-generator.mjs --check
          node scripts/frontend-surface-dispatch.mjs --write --baseline-ref=main
          node scripts/frontend-surface-dispatch.mjs --check --baseline-ref=main

      - name: Regenerate and validate Work Maps from final tree
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/pipeline-connectivity-check.mjs
          node http-generic-api/scripts/work-map-schema-classification-contract.mjs
          node http-generic-api/scripts/work-map-schema-classification.mjs

          converged=false
          for attempt in 1 2 3; do
            echo "Work Map stabilization attempt ${attempt}/3"
            node http-generic-api/scripts/platform-work-map-generator.mjs --write
            if node http-generic-api/scripts/platform-work-map-generator.mjs --check; then
              converged=true
              break
            fi
          done
          if [[ "${converged}" != 'true' ]]; then
            echo '::error::Work Maps did not reach a stable fixed point within three bounded attempts.'
            exit 1
          fi

          node http-generic-api/scripts/validate-spec-kit-work-maps.mjs --schema
          node http-generic-api/scripts/validate-spec-kit-work-maps.mjs --governance

      - name: Validate bounded generated delta
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t unstaged < <(git diff --name-only | sort)
          for path in "${unstaged[@]}"; do
            case "${path}" in
              docs/work-maps/*.md|http-generic-api/frontend-operation-governance.generated.json|http-generic-api/frontend-surface-dispatch.generated.json|http-generic-api/openapi/frontend-runtime-routes.generated.yaml) ;;
              *) echo "Unexpected generated path: ${path}" >&2; exit 1 ;;
            esac
          done
          test "${#unstaged[@]}" -gt 0
          git diff --check
          git add -- docs/work-maps \
            http-generic-api/frontend-operation-governance.generated.json \
            http-generic-api/frontend-surface-dispatch.generated.json \
            http-generic-api/openapi/frontend-runtime-routes.generated.yaml
          test -z "$(git diff --name-only)"
          test -z "$(git diff --name-only --diff-filter=U)"
          test ! -e "${WORKFLOW_PATH}"

      - name: Run focused controller regressions
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            test/github-repository-policy-controller.test.js \
            test/frontend-github-contract.test.js \
            test/github-routes.test.js

      - name: Commit merge and push without force
        shell: bash
        run: |
          set -euo pipefail
          pre_push_remote="$(git ls-remote --exit-code origin "refs/heads/${WORK_BRANCH}" | awk '{print $1}')"
          test "${pre_push_remote}" = '${{ github.sha }}'

          mkdir -p /tmp/pr6429-reconciliation-evidence
          {
            echo "source_branch_head=${{ github.sha }}"
            echo "pinned_main_sha=${PINNED_MAIN_SHA}"
            echo 'conflicts_resolved=docs/work-maps/README.md,http-generic-api/frontend-operation-governance.generated.json,http-generic-api/frontend-surface-dispatch.generated.json'
            echo 'resolution=regenerated_from_final_merged_tree'
            echo 'work_map_stabilization=max_3_attempts_fail_closed'
            echo 'force_push=false'
          } > /tmp/pr6429-reconciliation-evidence/bindings.txt
          git diff --cached --name-only | sort > /tmp/pr6429-reconciliation-evidence/staged-paths.txt

          git commit -m 'chore: reconcile PR 6429 with latest main'
          result_head="$(git rev-parse HEAD)"
          echo "result_head=${result_head}" >> /tmp/pr6429-reconciliation-evidence/bindings.txt
          git push origin "HEAD:refs/heads/${WORK_BRANCH}"
          remote_after="$(git ls-remote --exit-code origin "refs/heads/${WORK_BRANCH}" | awk '{print $1}')"
          test "${remote_after}" = "${result_head}"

      - name: Upload reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr6429-main-reconciliation-${{ github.sha }}
          path: /tmp/pr6429-reconciliation-evidence
          if-no-files-found: warn
          retention-days: 7
