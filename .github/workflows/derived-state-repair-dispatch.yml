name: Derived State Repair Dispatch
run-name: Derived State Repair Dispatch · ${{ github.event.workflow_run.id || inputs.source_run_id || github.run_id }}

on:
  workflow_run:
    workflows: [Derived State Closure]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Failed Derived State Closure run ID
        required: true
        type: string
      expected_head_sha:
        description: Exact current PR head SHA
        required: true
        type: string
      confirmation:
        description: Type REQUEST_DERIVED_STATE_REPAIR
        required: true
        type: string

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: derived-state-repair-${{ github.event.workflow_run.id || inputs.source_run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Route first topological repair authority
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure') ||
      (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'REQUEST_DERIVED_STATE_REPAIR')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Resolve exact failed candidate and repair authority
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_FORCE_TTY: "0"
          SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.source_run_id }}
          MANUAL_EXPECTED_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_head_sha || '' }}
        run: |
          set -euo pipefail
          normalize_github_json() {
            local file="$1"
            perl -0pi -e 's/\e\[[0-9;]*[A-Za-z]//g; s/^\x{FEFF}//' "$file"
          }
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          run="$RUNNER_TEMP/source-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > "$run"
          normalize_github_json "$run"
          test "$(jq -r '.path' "$run")" = ".github/workflows/derived-state-closure.yml"
          test "$(jq -r '.conclusion' "$run")" = "failure"
          artifacts="$RUNNER_TEMP/artifacts.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" > "$artifacts"
          normalize_github_json "$artifacts"
          artifact_name="$(jq -r --arg run_id "$SOURCE_RUN_ID" '[.artifacts[] | select((.name == ("derived-state-closure-" + $run_id)) and (.expired==false))][0].name // empty' "$artifacts")"
          test "$artifact_name" = "derived-state-closure-$SOURCE_RUN_ID"
          mkdir -p "$RUNNER_TEMP/closure"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir "$RUNNER_TEMP/closure"
          report="$(find "$RUNNER_TEMP/closure" -type f -name report.json | head -n1)"
          objections="$(find "$RUNNER_TEMP/closure" -type f -name policy-objections.json | head -n1)"
          test -f "$report"
          test "$(jq -r '.contract' "$report")" = "mad4b.repository-derived-state-closure.v1"
          test "$(jq -r '.candidate.kind' "$report")" = "github_merge_candidate"
          test "$(jq -r '.converged' "$report")" = "false"
          pr_number="$(jq -r '.candidate.pr_number // 0' "$report")"
          head_sha="$(jq -r '.candidate.source_head_sha // empty' "$report")"
          base_sha="$(jq -r '.candidate.base_sha // empty' "$report")"
          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]; [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]; [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ -n "$MANUAL_EXPECTED_HEAD_SHA" ]]; then test "$head_sha" = "$MANUAL_EXPECTED_HEAD_SHA"; fi
          pr="$RUNNER_TEMP/pr.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" > "$pr"
          normalize_github_json "$pr"
          test "$(jq -r '.state' "$pr")" = "open"
          test "$(jq -r '.base.ref' "$pr")" = "main"
          test "$(jq -r '.head.repo.full_name' "$pr")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.head.sha' "$pr")" = "$head_sha"
          target_ref="$(jq -r '.head.ref' "$pr")"
          [[ "$target_ref" =~ ^(gpt|cert|fix|feat|chore|docs|release)/[A-Za-z0-9._/-]+$ ]]
          case "$target_ref" in
            main|Production) echo "Protected branch mutation target is forbidden: $target_ref" >&2; exit 1 ;;
          esac
          main_ref_json="$RUNNER_TEMP/main-ref.json"
          compare_json="$RUNNER_TEMP/compare.json"
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" > "$main_ref_json"
          normalize_github_json "$main_ref_json"
          jq -e 'type == "object" and (.object.sha | type == "string")' "$main_ref_json" >/dev/null
          main_sha="$(jq -er '.object.sha' "$main_ref_json")"
          gh api "repos/${GITHUB_REPOSITORY}/compare/${main_sha}...${head_sha}" > "$compare_json"
          normalize_github_json "$compare_json"
          jq -e 'type == "object" and (.behind_by | type == "number")' "$compare_json" >/dev/null
          compare_behind="$(jq -er '.behind_by' "$compare_json")"
          printf 'validated_main_sha=%s\nvalidated_report_base_sha=%s\nvalidated_source_head_sha=%s\nvalidated_compare_behind=%s\n' "$main_sha" "$base_sha" "$head_sha" "$compare_behind"
          test "$main_sha" = "$base_sha"
          test "$compare_behind" = "0"
          authority="$(jq -c '.repair_authorities[0] // null' "$report")"
          if [[ "$authority" == "null" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "reason=no_blocking_repair_authority" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          authority_kind="$(jq -er '.kind' <<<"$authority")"
          authority_id="$(jq -er '.id' <<<"$authority")"
          authority_recipe="$(jq -r '.recipe // empty' <<<"$authority")"
          [[ "$authority_kind" =~ ^[a-z0-9_]+$ ]]
          [[ "$authority_id" =~ ^[a-z0-9_.-]+$ ]]
          [[ -z "$authority_recipe" || "$authority_recipe" =~ ^[a-z0-9_.-]+$ ]]
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "target_ref=$target_ref" >> "$GITHUB_OUTPUT"
          authority_file="$RUNNER_TEMP/repair-authority.json"
          printf '%s' "$authority" > "$authority_file"
          chmod 600 "$authority_file"
          test -s "$authority_file"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Dispatch registered authority
        if: steps.target.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_FORCE_TTY: "0"
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          TARGET_REF: ${{ steps.target.outputs.target_ref }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
        run: |
          set -euo pipefail
          case "$TARGET_REF" in
            main|Production) echo "Protected branch mutation target is forbidden: $TARGET_REF" >&2; exit 1 ;;
          esac
          authority_file="$RUNNER_TEMP/repair-authority.json"
          test -s "$authority_file"
          authority="$(cat "$authority_file")"
          kind="$(jq -er '.kind' <<<"$authority")"
          id="$(jq -er '.id' <<<"$authority")"
          recipe="$(jq -r '.recipe // empty' <<<"$authority")"
          [[ "$kind" =~ ^[a-z0-9_]+$ ]]
          [[ "$id" =~ ^[a-z0-9_.-]+$ ]]
          [[ -z "$recipe" || "$recipe" =~ ^[a-z0-9_.-]+$ ]]
          if [[ "$kind" == "generated_artifact_recipe" ]]; then
            payload="$(jq -cn --arg ref main --arg target_ref "$TARGET_REF" --arg head "$HEAD_SHA" --arg recipe "$recipe" '{ref:$ref,inputs:{target_ref:$target_ref,expected_head_sha:$head,recipe:$recipe,confirmation:"APPLY_GENERATED_ARTIFACT_REFRESH",create_from_main:"false",source_main_sha:""}}')"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/governed-generated-artifact-refresh.yml/dispatches" --input - <<<"$payload"
            state="dispatched"
          elif [[ "$kind" == "delegated_work_map_writer" ]]; then
            body="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.body // ""')"
            marker='<!-- work-map-autofix:authorized -->'
            if grep -Fq "$marker" <<<"$body"; then
              payload="$(jq -cn --arg ref main --arg pr "$PR_NUMBER" --arg head "$HEAD_SHA" '{ref:$ref,inputs:{pr_number:$pr,expected_head_sha:$head,confirmation:"RECOVER_SPEC_KIT_WORK_MAP_AUTOFIX"}}')"
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/spec-kit-work-map-autofix-recovery-dispatch.yml/dispatches" --input - <<<"$payload"
              state="delegated_recovery_dispatched"
            else
              state="manual_authorization_required"
              gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="DERIVED_STATE_REPAIR_DISPATCH contract=mad4b.derived-state-repair-dispatch.v2 state=${state} authority=${id} head_sha=${HEAD_SHA} draft_repair_allowed=true instruction=add_work_map_authorization_marker_to_pr_body" >/dev/null
              exit 0
            fi
          else
            echo "Unregistered repair authority kind: $kind" >&2
            exit 1
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="DERIVED_STATE_REPAIR_DISPATCH contract=mad4b.derived-state-repair-dispatch.v2 state=${state} authority=${id} head_sha=${HEAD_SHA} draft_repair_allowed=true topological_order=true" >/dev/null
