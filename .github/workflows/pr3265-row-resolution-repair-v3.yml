name: PR 3265 Row Resolution Semantic Repair V3

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'gpt/hostinger-production-resync-policy-20260729'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governed PR head
        uses: actions/checkout@v5
        with:
          ref: gpt/hostinger-production-resync-policy-20260729
          fetch-depth: 0

      - name: Execute corrected embedded repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow_path = Path(".github/workflows/pr3265-row-resolution-repair-v2.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])

          pattern = re.compile(
              r"latest_operation_suffix = '''.*?advisor = replace_count\(advisor, latest_operation_suffix, latest_operation_repaired, 1, \"latest operation resolver\"\)",
              re.DOTALL,
          )
          replacement = '''latest_operation_assignment = '    operation = uniqueAdvisorRow(rows, "release_operation");'
          latest_operation_positions = [
              index for index in range(len(advisor))
              if advisor.startswith(latest_operation_assignment, index)
          ]
          if len(latest_operation_positions) != 2:
              raise SystemExit(f"latest operation resolver: expected two assignments, found {len(latest_operation_positions)}")
          latest_operation_index = latest_operation_positions[1]
          advisor = (
              advisor[:latest_operation_index]
              + advisor[latest_operation_index:].replace(
                  latest_operation_assignment,
                  '    operation = deterministicLatestAdvisorRow(rows, "release_operation_latest");',
                  1,
              )
          )'''
          script, count = pattern.subn(replacement, script, count=1)
          if count != 1:
              raise SystemExit(f"embedded repair override: expected one block, found {count}")
          exec(compile(script, "pr3265-row-resolution-repair-v3", "exec"), {})
          PY

      - name: Install focused dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Validate focused contracts
        shell: bash
        run: |
          node http-generic-api/test-repository-main-moved-trigger-coordinator.mjs
          node http-generic-api/test-self-healing-release-advisor.mjs
          if grep -En '\b(rows|rowset|verificationRows|gateRows|deploymentRows|existingRows)\s*\[\s*0\s*\]' \
            http-generic-api/repositoryMainMovedTriggerService.js \
            http-generic-api/selfHealingReleaseAdvisorService.js; then
            echo "Direct first-candidate selection remains" >&2
            exit 1
          fi

      - name: Commit repair and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            http-generic-api/repositoryMainMovedTriggerService.js \
            http-generic-api/selfHealingReleaseAdvisorService.js \
            http-generic-api/test-repository-main-moved-trigger-coordinator.mjs \
            http-generic-api/test-self-healing-release-advisor.mjs
          git rm \
            .github/workflows/pr3265-row-resolution-repair-v2.yml \
            .github/workflows/pr3265-row-resolution-repair-v3.yml
          git diff --cached --check
          git commit -m "fix(release): distinguish unique and latest row resolution"
          git push origin HEAD:gpt/hostinger-production-resync-policy-20260729
