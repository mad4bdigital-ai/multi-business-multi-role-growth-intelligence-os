name: Incident 5021 approval builder diagnostic v9

on:
  pull_request:
    branches:
      - gpt/incident-5021/draft-merge-guard-v2-20260803
    paths:
      - .github/scripts/incident-5021-diagnostic-v9.py
      - .github/workflows/incident-5021-exact-head-approval-builder-diagnostic-v9.yml

permissions:
  contents: read

concurrency:
  group: incident-5021-approval-builder-diagnostic-v9
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose compiled exact-head approval candidate without publishing
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: gpt/incident-5021/exact-head-approval-guard-20260803
      BUILDER_BRANCH: gpt/incident-5021/exact-head-approval-guard-builder-20260803
      EXPECTED_TARGET_SHA: 2c89cc14d8a38a09034f0306eccff273234046e2
      SOURCE_COMMIT: 681a6a3bf8750276a25994584ef4b461caf9ce84
      REPORT_PATH: incident-5021-builder-diagnostic-v9.json
    steps:
      - name: Checkout immutable target branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install connector dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Verify target and fetch compiled diagnostic
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"
          test "$(git status --porcelain)" = ""
          git fetch --no-tags origin "$BUILDER_BRANCH"
          git show "origin/${BUILDER_BRANCH}:.github/scripts/incident-5021-diagnostic-v9.py" > /tmp/incident-5021-diagnostic-v9.py
          sed -i "s|origin/{BUILDER_BRANCH}|${SOURCE_COMMIT}|" /tmp/incident-5021-diagnostic-v9.py
          python -m py_compile /tmp/incident-5021-diagnostic-v9.py

      - name: Run compiled structured diagnostic
        shell: bash
        run: python /tmp/incident-5021-diagnostic-v9.py

      - name: Upload compiled structured diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incident-5021-builder-diagnostic-v9-${{ github.sha }}
          path: incident-5021-builder-diagnostic-v9.json
          if-no-files-found: error
          retention-days: 7

      - name: Fail unless compiled candidate is fully clean
        shell: bash
        run: |
          python - <<'PYCHECK'
          import json
          from pathlib import Path
          report = json.loads(Path("incident-5021-builder-diagnostic-v9.json").read_text())
          checks = [
              report.get("diagnostic_completed") is True,
              report.get("patch_returncode") == 0,
              report.get("all_tests_passed") is True,
              report.get("diff_check_returncode") == 0,
              report.get("exact_six_file_boundary") is True,
          ]
          if not all(checks):
              raise SystemExit("compiled candidate diagnostic is not fully clean; inspect structured artifact")
          print("compiled candidate diagnostic fully clean")
          PYCHECK
