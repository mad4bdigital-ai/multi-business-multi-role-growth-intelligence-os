name: EC1 Test Manifest Registration

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  register:
    if: github.event.pull_request.head.ref == 'gpt/spec-012-ec1-execution-capsule-shadow-adapter-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout EC1 branch
        uses: actions/checkout@v5
        with:
          ref: gpt/spec-012-ec1-execution-capsule-shadow-adapter-20260730
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Register EC1 test exactly once
        working-directory: http-generic-api
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'scripts/test-manifest.mjs';
          const source = fs.readFileSync(path, 'utf8');
          const command = '  "node test-execution-capsule-shadow-adapter.mjs",\n';
          if (source.includes(command)) throw new Error('EC1 test is already registered');
          const anchor = '  "node test-execution-capsule-contract.mjs",\n';
          const first = source.indexOf(anchor);
          if (first < 0 || source.indexOf(anchor, first + anchor.length) >= 0) {
            throw new Error('EC0 test manifest anchor is missing or ambiguous');
          }
          const updated = source.slice(0, first + anchor.length) + command + source.slice(first + anchor.length);
          fs.writeFileSync(path, updated);
          NODE

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Verify registration and contracts
        working-directory: http-generic-api
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('scripts/test-manifest.mjs', 'utf8');
          const matches = source.match(/node test-execution-capsule-shadow-adapter\.mjs/g) || [];
          if (matches.length !== 1) throw new Error(`Expected one EC1 manifest entry, found ${matches.length}`);
          NODE
          node test-execution-capsule-shadow-adapter.mjs
          node test-execution-capsule-contract.mjs
          node test-context-kernel-shadow-integration.mjs

      - name: Enforce exact source write set
        run: |
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'http-generic-api/scripts/test-manifest.mjs'

      - name: Remove one-shot workflow
        run: git rm .github/workflows/ec1-test-manifest-registration.yml

      - name: Commit registration
        run: |
          git config user.name 'mad4b-governed-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add http-generic-api/scripts/test-manifest.mjs
          git commit -m 'test(spec-012): register EC1 capsule shadow adapter'
          git push origin HEAD:gpt/spec-012-ec1-execution-capsule-shadow-adapter-20260730
