name: Transport Response Schema Main Sync

on:
  push:
    branches:
      - fix/transport-response-schema-promotion-readiness-20260806
    paths:
      - .github/workflows/transport-response-schema-main-sync.yml

permissions:
  contents: write

concurrency:
  group: transport-response-schema-main-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os' && github.ref == 'refs/heads/fix/transport-response-schema-promotion-readiness-20260806'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact readiness branch
        uses: actions/checkout@v5
        with:
          ref: fix/transport-response-schema-promotion-readiness-20260806
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current main without force
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main --no-tags
          git merge --no-edit origin/main
          git merge-base --is-ancestor origin/main HEAD

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install focused dependencies
        working-directory: http-generic-api
        run: npm ci --ignore-scripts

      - name: Verify transport schema migration regression
        working-directory: http-generic-api
        run: node test-transport-response-chunk-schema-recovery.mjs

      - name: Verify surface-contract generated readback
        working-directory: http-generic-api
        run: node scripts/surface-contract-discovery.mjs --check

      - name: Verify repository readiness evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          migration='http-generic-api/migrations/1048_transport_response_chunk_schema_recovery.sql'
          ! grep -q '### .*1048_transport_response_chunk_schema_recovery.sql' docs/surface-contract-gap-queue.md
          for target in \
            'Updating Registry Patch Index.md' \
            'deployment_parity_checklist.md' \
            'docs/ai-docs-agent-governance.md' \
            'docs/auto-docs-agent/README.md' \
            'docs/change-documentation-governance.md'; do
            grep -q '1048_transport_response_chunk_schema_recovery.sql' "$target"
          done
          for marker in no_provider_call no_credential_payload_read no_raw_secrets no_external_send no_external_write secrets_included_false; do
            grep -Eq "^[[:space:]]*--[[:space:]]*${marker}[[:space:]]*$" "$migration"
          done

      - name: Remove sync workflow and push synchronized branch
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow='.github/workflows/transport-response-schema-main-sync.yml'
          git rm "$workflow"
          git diff --cached --check
          git commit -m 'chore(transport): sync schema readiness branch with main'
          git push origin HEAD:fix/transport-response-schema-promotion-readiness-20260806
