name: Spec 012 OAuth Route Test Parity Writer V2

on:
  pull_request:
    branches:
      - gpt/exact-phase-g-schema-arm-base-20260803
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: spec012-oauth-route-diagnostic-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose Spec 012 OAuth parity validations
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/spec012-oauth-token-route-test-parity-20260804'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      EXPECTED_MAIN_SHA: a61cd9e83070618001676bbc679bc937f0551875
      SCRIPT_BRANCH: gpt/exact-phase-g-schema-arm-base-20260803
      SCRIPT_COMMIT_SHA: 9bc786994e58d5e7e46f5b137eebbe3c93fe018b
      MARKER_PATH: .github/validation/spec012-oauth-route-failure-diagnostic-v3.txt
      E2E_PATH: .changes/e2e/spec012-t031-oauth-token-route-test-parity.json
    steps:
      - name: Checkout exact bounded diagnostic head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Verify bounded synchronize identity and install dependencies
        shell: bash
        run: |
          set -euo pipefail
          DIAGNOSTIC_ROOT="${RUNNER_TEMP}/spec012-oauth-diagnostic-${GITHUB_RUN_ID}"
          printf 'DIAGNOSTIC_ROOT=%s\n' "${DIAGNOSTIC_ROOT}" >> "${GITHUB_ENV}"
          mkdir -p "${DIAGNOSTIC_ROOT}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_MAIN_SHA}"
          test -f "${MARKER_PATH}"
          test "$(git diff --name-only "${EXPECTED_MAIN_SHA}" HEAD | wc -l | tr -d ' ')" = "1"
          test "$(git diff --name-only "${EXPECTED_MAIN_SHA}" HEAD)" = "${MARKER_PATH}"
          npm ci --prefix http-generic-api
          git fetch --no-tags origin "refs/heads/${SCRIPT_BRANCH}:refs/remotes/origin/${SCRIPT_BRANCH}"
          git merge-base --is-ancestor "${SCRIPT_COMMIT_SHA}" "refs/remotes/origin/${SCRIPT_BRANCH}"
          git show "${SCRIPT_COMMIT_SHA}:.github/scripts/apply-spec012-oauth-route-test-parity.py" > /tmp/apply-spec012-oauth-route-test-parity.py
          python -m py_compile /tmp/apply-spec012-oauth-route-test-parity.py

      - name: Apply bounded transformation and safe failure instrumentation
        shell: bash
        run: |
          set -euo pipefail
          rm -- "${MARKER_PATH}"
          python /tmp/apply-spec012-oauth-route-test-parity.py
          python - <<'PY'
          from pathlib import Path
          path = Path('http-generic-api/routes/tenantGptOAuthTokenExchangeRoutes.js')
          source = path.read_text(encoding='utf-8')
          old = '''    } catch (error) {
      if (res.headersSent) {'''
          new = '''    } catch (error) {
      console.error("oauth_token_exchange_safe_failure_diagnostic", {
        name: String(error?.name || "").slice(0, 64),
        code: String(error?.code || "").slice(0, 128),
        message: String(error?.message || "").slice(0, 240),
        phase,
        code_consumed: codeConsumed,
        secrets_included: false,
      });
      if (res.headersSent) {'''
          if source.count(old) != 1:
              raise SystemExit('expected one catch insertion point')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
          git diff --check

      - name: Run transformed OAuth validations independently
        shell: bash
        run: |
          set -uo pipefail
          results="${DIAGNOSTIC_ROOT}/validation-results.tsv"
          : > "${results}"
          run_check() {
            local name="$1"; shift
            local log="${DIAGNOSTIC_ROOT}/${name}.log"
            set +e
            "$@" >"${log}" 2>&1
            local status=$?
            set -e
            printf '%s\t%s\t%s\n' "${name}" "${status}" "${log##*/}" >> "${results}"
            cat "${log}"
          }
          run_check token-route node http-generic-api/test-tenant-gpt-oauth-token-exchange-routes.mjs
          run_check auth-oauth-integration node http-generic-api/test-auth-oauth-routes.mjs
          run_check route-wiring node http-generic-api/test-spec012-t031-oauth-token-route-wiring.mjs
          grep -n 'oauth_token_exchange_safe_failure_diagnostic' "${DIAGNOSTIC_ROOT}"/*.log > "${DIAGNOSTIC_ROOT}/safe-failures.txt" || true
          {
            printf 'check\texit_code\tlog\n'
            cat "${results}"
          } > "${DIAGNOSTIC_ROOT}/validation-summary.tsv"
          cat "${DIAGNOSTIC_ROOT}/validation-summary.tsv"
          cat "${DIAGNOSTIC_ROOT}/safe-failures.txt" || true

      - name: Upload OAuth diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec012-oauth-safe-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/spec012-oauth-diagnostic-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7

      - name: Enforce diagnostic success
        shell: bash
        run: |
          set -euo pipefail
          test -s "${DIAGNOSTIC_ROOT}/validation-results.tsv"
          awk -F '\t' '$2 != "0" { print; failed=1 } END { exit failed ? 1 : 0 }' "${DIAGNOSTIC_ROOT}/validation-results.tsv"
