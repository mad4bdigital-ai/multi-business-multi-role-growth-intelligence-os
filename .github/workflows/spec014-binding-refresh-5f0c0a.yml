name: Spec 014 Binding Refresh 5F0C0A

on:
  push:
    branches:
      - gpt/spec014-binding-refresh-5f0c0a-20260804
    paths:
      - .github/workflows/spec014-binding-refresh-5f0c0a.yml

permissions:
  contents: write

concurrency:
  group: spec014-binding-refresh-5f0c0a-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact launcher head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify immutable launcher topology
        shell: bash
        env:
          EXPECTED_PARENT: 5f0c0acf913fedb45564e8739c2f40fa019ed3eb
          LAUNCHER_PATH: .github/workflows/spec014-binding-refresh-5f0c0a.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$LAUNCHER_PATH"
          test -z "$(git status --porcelain)"

      - name: Refresh canonical Spec 014 binding
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
            --spec-dir specs/014-governed-hostinger-storage-orchestration \
            --write
          mapfile -t changed < <(git status --porcelain | sed -E 's/^...//' | sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "specs/014-governed-hostinger-storage-orchestration/work-map-integration.json"
          git diff --check

      - name: Validate canonical final readback
        shell: bash
        run: |
          set -euo pipefail
          REPORT_PATH="$RUNNER_TEMP/spec014-binding-5f0c0a.json" \
            node http-generic-api/scripts/spec014-final-work-map-readback.mjs
          node - "$RUNNER_TEMP/spec014-binding-5f0c0a.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (report.ok !== true || (report.findings || []).length !== 0) throw new Error('binding_readback_failed');
          if (report.classification?.ok !== true || report.classification?.coverage_percent !== 100) throw new Error('classification_failed');
          if (report.manifest_registry?.fingerprint !== report.current_registry?.fingerprint) throw new Error('registry_fingerprint_mismatch');
          if (report.provider_dispatch !== false || report.live_database_access !== false || report.migration_apply !== false || report.secrets_included !== false) throw new Error('safety_boundary_failed');
          NODE

      - name: Remove one-shot launcher and commit binding only
        shell: bash
        env:
          BRANCH: gpt/spec014-binding-refresh-5f0c0a-20260804
          EVENT_SHA: ${{ github.sha }}
          LAUNCHER_PATH: .github/workflows/spec014-binding-refresh-5f0c0a.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_SHA"
          rm "$LAUNCHER_PATH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/014-governed-hostinger-storage-orchestration/work-map-integration.json
          git add -u "$LAUNCHER_PATH"
          mapfile -t staged < <(git diff --cached --name-only | sort)
          test "${#staged[@]}" -eq 2
          test "${staged[0]}" = "$LAUNCHER_PATH"
          test "${staged[1]}" = "specs/014-governed-hostinger-storage-orchestration/work-map-integration.json"
          git diff --cached --check
          git commit -m 'chore(spec-014): refresh CI cancellation Work Map binding'
          remote_head="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EVENT_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Final bounded summary
        shell: bash
        run: |
          set -euo pipefail
          echo 'SPEC014_BINDING_REFRESH=success'
          echo "RESULT_HEAD_SHA=$(git rev-parse HEAD)"
          echo 'SECRETS_INCLUDED=false'
          echo 'PROVIDER_DISPATCH=false'
          echo 'LIVE_DATABASE_ACCESS=false'
          echo 'MIGRATION_APPLY=false'
          echo 'PRODUCTION_MUTATION=false'
