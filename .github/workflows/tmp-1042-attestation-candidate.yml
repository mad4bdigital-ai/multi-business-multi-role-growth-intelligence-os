name: Temporary Migration 1042 Attestation Candidate

on:
  push:
    branches:
      - docs/migration-1042-surface-contract-remediation-20260807
    paths:
      - .github/workflows/tmp-1042-attestation-candidate.yml

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install runtime dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Derive candidate from canonical governance code
        working-directory: http-generic-api
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { buildAttestation, validateManualAttestation } from './scripts/surface-contract-auto-remediator.mjs';
          import { assessMigrationSqlPreflight } from './releaseReadiness.js';

          const migrationFile = '1042_sprint69_support_ticket_lifecycle_sla_dedupe.sql';
          const source = fs.readFileSync(`migrations/${migrationFile}`, 'utf8').replace(/\r\n?/g, '\n');
          const queue = JSON.parse(fs.readFileSync('../docs/surface-contract-gap-queue.json', 'utf8'));
          const item = queue.top_items.find((entry) => entry.migration_file === migrationFile);
          if (!item) throw new Error('Migration 1042 not found in surface gap queue');
          const built = buildAttestation({ item, source });
          const preflight = assessMigrationSqlPreflight(migrationFile, source);
          const migrationSha256 = createHash('sha256').update(source, 'utf8').digest('hex');
          const probe = {
            migration_file: migrationFile,
            migration_sha256: migrationSha256,
            checksum_canonicalization: 'utf8_lf_v1',
            auto_attestation_eligible: built.eligible,
            auto_attestation_reasons: built.reasons || [],
            forbidden_patterns: built.forbidden_patterns || [],
            preflight_status: preflight.status,
            preflight_risk_count: Number(preflight.risk_count || 0),
            statement_count: Number(preflight.counts?.statements || 0),
            preflight_risks: (preflight.risks || []).reduce((out, risk) => {
              out[risk.code] = (out[risk.code] || 0) + 1;
              return out;
            }, {}),
            execution_authorized: false,
            secrets_included: false,
          };
          fs.writeFileSync('/tmp/migration-1042-attestation-candidate.json', `${JSON.stringify(probe, null, 2)}\n`);
          console.log(JSON.stringify(probe, null, 2));
          if (probe.auto_attestation_eligible) throw new Error('Migration 1042 must remain manual-review-only');
          if (!probe.auto_attestation_reasons.includes('forbidden_sql_pattern_detected')) throw new Error('trigger forbidden pattern was not detected');
          if (!probe.auto_attestation_reasons.includes('migration_preflight_has_risks')) throw new Error('preflight risk was not preserved');
          NODE

      - name: Upload candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: migration-1042-attestation-candidate-${{ github.run_id }}
          path: /tmp/migration-1042-attestation-candidate.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary workflow from branch
        run: |
          set -euo pipefail
          git config user.name "migration-1042-attestation-probe[bot]"
          git config user.email "migration-1042-attestation-probe[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-1042-attestation-candidate.yml
          git commit -m "chore(ci): remove temporary Migration 1042 attestation probe"
          git push origin HEAD:docs/migration-1042-surface-contract-remediation-20260807
