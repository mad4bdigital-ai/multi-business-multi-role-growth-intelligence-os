name: Spec012 OAuth Frontend Parity Writer

on:
  push:
    branches:
      - gpt/read-main-tree-sha-v8-97e4ee7
    paths:
      - ".github/workflows/spec012-oauth-frontend-parity-writer.yml"

permissions:
  contents: write

concurrency:
  group: spec012-oauth-frontend-parity-writer-${{ github.repository }}
  cancel-in-progress: false

jobs:
  repair-generated-parity:
    runs-on: ubuntu-24.04
    env:
      TARGET_BRANCH: gpt/spec012-oauth-canonical-deps-current-main-v2-20260804
      EXPECTED_MAIN_SHA: 0f83d8faf1abf8b0bf149f08c10f652d2a3ed3fa
      EXPECTED_HEAD_SHA: 98399a28573808a8e46a063e9297fb447c5cbac2
      EXPECTED_GENERATED_SHA256: 1379113d5dd06df1848f47a3f350da77a9ab72423eb395173e9366bbb0da5ac1
    steps:
      - name: Checkout immutable feature branch head
        uses: actions/checkout@v4
        with:
          ref: gpt/spec012-oauth-canonical-deps-current-main-v2-20260804
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable refs and clean worktree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "${EXPECTED_MAIN_SHA}"
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${EXPECTED_HEAD_SHA}"
          test "$(git status --porcelain)" = ""
          test "$(git rev-list --count "${EXPECTED_MAIN_SHA}"..HEAD)" = "22"
          test "$(git rev-list --count HEAD.."${EXPECTED_MAIN_SHA}")" = "0"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install locked dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Regenerate deterministic frontend dispatch
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          npm run frontend:dispatch:generate -- --baseline-ref=main
          test "$(sha256sum frontend-surface-dispatch.generated.json | awk '{print $1}')" = "${EXPECTED_GENERATED_SHA256}"

      - name: Enforce one-line bounded generated-artifact repair
        shell: bash
        run: |
          set -euo pipefail
          expected_path="http-generic-api/frontend-surface-dispatch.generated.json"
          test "$(git diff --name-only)" = "${expected_path}"
          test "$(git diff --numstat -- "${expected_path}")" = $'1\t1\thttp-generic-api/frontend-surface-dispatch.generated.json'
          git diff --check
          git diff -- "${expected_path}" | grep -F -- '-    "ref": null,'
          git diff -- "${expected_path}" | grep -F -- '+    "ref": "main",'

      - name: Validate frontend parity and focused OAuth wiring
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          node test-frontend-dispatch-workflow-baseline.mjs
          node test-frontend-operation-governance-generator.mjs
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-openapi-route-coverage.mjs
          npm run openapi:auth:check
          node test-spec012-t031-oauth-token-route-wiring.mjs
          node test-tenant-gpt-oauth-token-exchange-routes.mjs
          node test-auth-oauth-routes.mjs
          node test-chatgpt-mcp-metadata-routing.mjs

      - name: Run complete HTTP Generic API manifest
        working-directory: http-generic-api
        env:
          TEST_SUITE_REPORT_DIR: ${{ runner.temp }}/test-suite-reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${TEST_SUITE_REPORT_DIR}"
          npm test 2>&1 | tee "${RUNNER_TEMP}/spec012-oauth-frontend-parity-full-suite.log"

      - name: Commit bounded repair
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "${EXPECTED_MAIN_SHA}"
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${EXPECTED_HEAD_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add http-generic-api/frontend-surface-dispatch.generated.json
          test "$(git diff --cached --name-only)" = "http-generic-api/frontend-surface-dispatch.generated.json"
          git diff --cached --check
          git commit -m "fix(frontend): preserve canonical main baseline in generated dispatch"
          new_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_HEAD_SHA}"
          printf 'new_sha=%s\n' "${new_sha}" >> "${GITHUB_OUTPUT}"

      - name: Push fast-forward feature branch update
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "${EXPECTED_MAIN_SHA}"
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${EXPECTED_HEAD_SHA}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "$(git rev-parse HEAD)"

      - name: Build bounded evidence
        if: always()
        shell: bash
        env:
          NEW_SHA: ${{ steps.commit.outputs.new_sha }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/spec012-oauth-frontend-parity"
          jq -n \
            --arg expected_main_sha "${EXPECTED_MAIN_SHA}" \
            --arg expected_head_sha "${EXPECTED_HEAD_SHA}" \
            --arg new_sha "${NEW_SHA}" \
            --arg generated_sha256 "${EXPECTED_GENERATED_SHA256}" \
            --arg job_status "${{ job.status }}" \
            '{schema_version:"spec012-oauth-frontend-parity-writer-v1",expected_main_sha:$expected_main_sha,expected_head_sha:$expected_head_sha,new_sha:$new_sha,generated_sha256:$generated_sha256,job_status:$job_status,changed_files:["http-generic-api/frontend-surface-dispatch.generated.json"],force_push:false,protected_ref_mutation:false,production_mutation:false,provider_mutation:false,database_mutation:false,migration_apply:false,credential_access:false,external_send:false,secrets_included:false}' \
            > "${RUNNER_TEMP}/spec012-oauth-frontend-parity/result.json"
          cp "${RUNNER_TEMP}/spec012-oauth-frontend-parity-full-suite.log" "${RUNNER_TEMP}/spec012-oauth-frontend-parity/" 2>/dev/null || true
          cp "${RUNNER_TEMP}"/test-suite-reports/*.json "${RUNNER_TEMP}/spec012-oauth-frontend-parity/" 2>/dev/null || true

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec012-oauth-frontend-parity-writer-${{ github.run_id }}
          path: ${{ runner.temp }}/spec012-oauth-frontend-parity
          if-no-files-found: error
          retention-days: 14
