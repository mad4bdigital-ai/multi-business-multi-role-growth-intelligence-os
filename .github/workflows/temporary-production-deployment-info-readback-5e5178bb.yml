name: Temporary Production Deployment Info Readback 5e5178bb

on:
  pull_request:
    branches:
      - gpt/production-deployment-info-readback-base-5e5178bb-20260803

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout diagnostic head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify protected Production identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api '/repos/mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os/git/ref/heads/Production' --jq '.object.sha')" = "5e5178bb7d5b86fe42a5eb97e647a5d65edaaceb"
          test "$(gh api '/repos/mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os/issues/4953' --jq '.state')" = "open"

      - name: Generate bounded deployment-info evidence
        id: parity
        continue-on-error: true
        working-directory: http-generic-api
        env:
          REPORT_DIR: ${{ runner.temp }}/production-deployment-info-parity-evidence
        run: |
          node scripts/production-runtime-parity-evidence.mjs \
            --expected-sha 5e5178bb7d5b86fe42a5eb97e647a5d65edaaceb \
            --expected-branch Production \
            --endpoint auth=https://auth.mad4b.com/deployment-info \
            --output-dir "${REPORT_DIR}"

      - name: Upload bounded deployment-info evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-deployment-info-parity-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/production-deployment-info-parity-evidence/*
          if-no-files-found: error
          retention-days: 30

      - name: Enforce secret-free structured report
        if: always()
        working-directory: http-generic-api
        env:
          REPORT_PATH: ${{ runner.temp }}/production-deployment-info-parity-evidence/production-runtime-parity-evidence.json
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, "utf8"));
            const auth = Array.isArray(report.endpoints)
              ? report.endpoints.find((endpoint) => endpoint.name === "auth")
              : null;
            const effects = report.side_effects || {};
            const safe =
              report.contract === "mad4b.production-runtime-parity-evidence.v1" &&
              report.identity?.expected_sha === "5e5178bb7d5b86fe42a5eb97e647a5d65edaaceb" &&
              report.identity?.expected_branch === "Production" &&
              auth?.required === true &&
              report.secrets_included === false &&
              effects.repository_mutation_performed === false &&
              effects.provider_dispatch_performed === false &&
              effects.credential_access_performed === false &&
              effects.sql_execution_performed === false &&
              effects.migration_apply_performed === false &&
              effects.external_send_performed === false;
            if (!safe) throw new Error("invalid deployment-info evidence contract");
            console.log(JSON.stringify({
              outcome: report.outcome,
              first_failure: report.first_failure,
              auth_status: auth?.status || null,
              deployed_sha: auth?.runtime?.deployed_commit_sha || null,
              deployment_branch: auth?.runtime?.deployment_branch || null,
              secrets_included: false
            }));
            if (report.outcome !== "passed") process.exit(1);
          '
