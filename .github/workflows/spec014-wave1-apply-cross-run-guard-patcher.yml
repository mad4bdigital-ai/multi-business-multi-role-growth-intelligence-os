name: Patch Spec 014 Wave 1 Apply cross-run guard

on:
  push:
    branches:
      - fix/spec014-wave1-apply-cross-run-guard-20260805

permissions:
  contents: write

jobs:
  patch:
    if: github.actor_id == 271942579
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      TARGET_BRANCH: fix/spec014-wave1-apply-cross-run-guard-20260805
      EXPECTED_MAIN_SHA: 81525a9e0a16ed86a6ab96b849ff26ad3405bd04
      PATCHER_PATH: .github/workflows/spec014-wave1-apply-cross-run-guard-patcher.yml
      TRIGGER_PATH: .github/ops/spec014-wave1-apply-cross-run-guard-trigger.json
    steps:
      - name: Checkout exact patch authority
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify immutable patch lease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_MAIN_SHA}"
          test "$(gh api "/repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "${EXPECTED_MAIN_SHA}"
          test "$(gh api "/repos/${REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')" = "${GITHUB_SHA}"
          node -e "const x=require('./${TRIGGER_PATH}'); if(x.contract!=='spec014-wave1-apply-cross-run-guard-trigger.v1'||x.expected_main_sha!=='${EXPECTED_MAIN_SHA}'||x.migration_apply!==false) process.exit(1)"
          actual="$(git diff --name-only "${EXPECTED_MAIN_SHA}"...HEAD | sort)"
          expected="$(printf '%s\n' "${TRIGGER_PATH}" "${PATCHER_PATH}" | sort)"
          test "${actual}" = "${expected}"

      - name: Create trigger guard and regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > .github/ops/spec014-wave1-apply-trigger-guard.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';

          const ELIGIBLE_ASSOCIATIONS = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
          const AUTHORITY_RUN_MARKER = 'SPEC014_WAVE1_APPLY_AUTHORITY';

          function positiveInteger(value, label) {
            const parsed = Number(value);
            assert.ok(Number.isSafeInteger(parsed) && parsed > 0, `${label} is invalid`);
            return parsed;
          }

          async function collectPages(fetchPage, valueKey = null) {
            const output = [];
            for (let page = 1; page <= 10; page += 1) {
              const payload = await fetchPage(page);
              const values = valueKey ? payload?.[valueKey] : payload;
              assert.ok(Array.isArray(values), `Paged ${valueKey || 'response'} is unavailable`);
              output.push(...values);
              if (values.length < 100) break;
            }
            return output;
          }

          export async function verifySpec014Wave1ApplyTriggerGuard({
            env = process.env,
            githubJson,
            currentRefSha,
            requestGet,
            collectShas,
            repository,
            controlIssue,
            applyConfirm,
            productionSha = null,
            baseUrl = 'https://auth.mad4b.com',
            localHead = null,
          }) {
            assert.equal(typeof githubJson, 'function');
            assert.equal(typeof currentRefSha, 'function');
            const toolingSha = String(env.EXPECTED_TOOLING_SHA || '').trim().toLowerCase();
            assert.match(toolingSha, /^[0-9a-f]{40}$/, 'Issue-comment event tooling SHA is invalid');
            const triggerCommentId = positiveInteger(env.TRIGGER_COMMENT_ID, 'Trigger comment ID');
            const triggerActorId = positiveInteger(env.TRIGGER_ACTOR_ID, 'Trigger actor ID');
            const currentRunId = positiveInteger(env.CURRENT_RUN_ID, 'Workflow run ID');
            const currentRunAttempt = positiveInteger(env.CURRENT_RUN_ATTEMPT, 'Workflow run attempt');
            const association = String(env.TRIGGER_AUTHOR_ASSOCIATION || '').trim();
            const triggerBody = String(env.TRIGGER_BODY || '');

            assert.equal(currentRunAttempt, 1, 'Apply workflow reruns are forbidden');
            assert.equal(triggerBody, applyConfirm, 'Trigger body does not match the exact Apply confirmation');
            assert.ok(ELIGIBLE_ASSOCIATIONS.has(association), 'Trigger author association is not eligible');

            const checkedOutSha = String(
              localHead || execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }),
            )
              .trim()
              .toLowerCase();
            assert.equal(checkedOutSha, toolingSha, 'Checkout does not match the issue-comment event SHA');
            const liveMain = await currentRefSha('main');
            assert.equal(liveMain, toolingSha, 'Protected main moved after the Apply event');

            const issue = await githubJson(`/repos/${repository}/issues/${controlIssue}`);
            assert.equal(issue?.state, 'open', 'Apply control issue must be open');

            const comments = await collectPages((page) =>
              githubJson(`/repos/${repository}/issues/${controlIssue}/comments?per_page=100&page=${page}`),
            );
            const eligible = comments
              .filter(
                (comment) =>
                  String(comment?.body || '') === applyConfirm &&
                  ELIGIBLE_ASSOCIATIONS.has(String(comment?.author_association || '')),
              )
              .sort((left, right) => Number(left.id || 0) - Number(right.id || 0));
            const currentComment = eligible.find((comment) => Number(comment?.id) === triggerCommentId);
            assert.ok(currentComment, 'Current comment is not an eligible exact Apply trigger');
            assert.equal(Number(currentComment?.user?.id), triggerActorId, 'Trigger actor identity mismatch');
            assert.equal(
              String(currentComment?.author_association || ''),
              association,
              'Trigger author association mismatch',
            );
            assert.equal(
              Number(eligible[0]?.id),
              triggerCommentId,
              'An earlier exact Apply confirmation already consumed the one-shot authority',
            );

            const runs = await collectPages(
              (page) =>
                githubJson(
                  `/repos/${repository}/actions/workflows/spec014-wave1-apply.yml/runs?event=issue_comment&per_page=100&page=${page}`,
                ),
              'workflow_runs',
            );
            const priorAuthorityRuns = runs.filter(
              (run) =>
                Number(run?.id || 0) < currentRunId &&
                String(run?.display_title || '').includes(`${AUTHORITY_RUN_MARKER} authorized=true`),
            );
            assert.equal(
              priorAuthorityRuns.length,
              0,
              'A prior Apply authority run already consumed the exact-once execution lease',
            );

            const evidence = {
              tooling_sha: toolingSha,
              trigger_comment_id: triggerCommentId,
              trigger_actor_id: triggerActorId,
              trigger_author_association: association,
              workflow_run_id: currentRunId,
              workflow_run_attempt: currentRunAttempt,
              earliest_eligible_comment_id: Number(eligible[0]?.id || 0),
              prior_authority_run_count: priorAuthorityRuns.length,
              issue_state: issue.state,
              secrets_included: false,
            };

            if (productionSha !== null) {
              assert.equal(typeof requestGet, 'function');
              assert.equal(typeof collectShas, 'function');
              const expectedProduction = String(productionSha).toLowerCase();
              assert.match(expectedProduction, /^[0-9a-f]{40}$/);
              const liveProduction = await currentRefSha('Production');
              assert.equal(liveProduction, expectedProduction, 'Protected Production moved before Apply');
              const [health, version, deployment] = await Promise.all([
                requestGet(`${baseUrl}/health`),
                requestGet(`${baseUrl}/version`),
                requestGet(`${baseUrl}/deployment-info`),
              ]);
              assert.ok(health.http_ok && health.payload?.ok === true, 'Runtime health failed before Apply');
              assert.ok(collectShas(version.payload).has(expectedProduction), 'Runtime version drifted before Apply');
              assert.ok(
                collectShas(deployment.payload).has(expectedProduction),
                'Runtime deployment identity drifted before Apply',
              );
              Object.assign(evidence, {
                production_sha: expectedProduction,
                health_http: health.status,
                version_http: version.status,
                deployment_info_http: deployment.status,
                protected_refs_stable: true,
                runtime_identity_stable: true,
              });
            }

            return evidence;
          }
          EOF

          cat > http-generic-api/test-spec014-wave1-apply-trigger-guard.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { verifySpec014Wave1ApplyTriggerGuard } from '../.github/ops/spec014-wave1-apply-trigger-guard.mjs';

          const SHA = 'a'.repeat(40);
          const PRODUCTION = 'b'.repeat(40);
          const CONFIRM = 'APPLY_20260802_01_SPEC014_HOSTINGER_STORAGE_FOUNDATION';
          const baseEnv = {
            EXPECTED_TOOLING_SHA: SHA,
            TRIGGER_COMMENT_ID: '200',
            TRIGGER_ACTOR_ID: '271942579',
            TRIGGER_AUTHOR_ASSOCIATION: 'OWNER',
            TRIGGER_BODY: CONFIRM,
            CURRENT_RUN_ID: '500',
            CURRENT_RUN_ATTEMPT: '1',
          };

          function harness({ env = {}, comments = null, runs = null, main = SHA, production = PRODUCTION, runtime = PRODUCTION } = {}) {
            const mergedEnv = { ...baseEnv, ...env };
            const issueComments =
              comments ||
              [{ id: 200, body: CONFIRM, author_association: 'OWNER', user: { id: 271942579 } }];
            const workflowRuns = runs || [
              { id: 500, display_title: 'SPEC014_WAVE1_APPLY_AUTHORITY authorized=true comment=200' },
            ];
            return {
              env: mergedEnv,
              localHead: SHA,
              repository: 'mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os',
              controlIssue: 6215,
              applyConfirm: CONFIRM,
              productionSha: production,
              baseUrl: 'https://auth.mad4b.com',
              currentRefSha: async (branch) => (branch === 'main' ? main : production),
              githubJson: async (pathname) => {
                if (pathname.endsWith('/issues/6215')) return { state: 'open' };
                if (pathname.includes('/issues/6215/comments')) return issueComments;
                if (pathname.includes('/actions/workflows/spec014-wave1-apply.yml/runs')) {
                  return { workflow_runs: workflowRuns };
                }
                throw new Error(`Unexpected GitHub path ${pathname}`);
              },
              requestGet: async (url) => {
                if (url.endsWith('/health')) return { http_ok: true, status: 200, payload: { ok: true } };
                return { http_ok: true, status: 200, payload: { sha: runtime } };
              },
              collectShas: (value) => new Set([String(value?.sha || '').toLowerCase()].filter(Boolean)),
            };
          }

          const success = await verifySpec014Wave1ApplyTriggerGuard(harness());
          assert.equal(success.trigger_comment_id, 200);
          assert.equal(success.prior_authority_run_count, 0);
          assert.equal(success.runtime_identity_stable, true);

          await assert.rejects(
            verifySpec014Wave1ApplyTriggerGuard(harness({ env: { CURRENT_RUN_ATTEMPT: '2' } })),
            /reruns are forbidden/,
          );
          await assert.rejects(
            verifySpec014Wave1ApplyTriggerGuard(harness({ main: 'c'.repeat(40) })),
            /Protected main moved/,
          );
          await assert.rejects(
            verifySpec014Wave1ApplyTriggerGuard(
              harness({
                comments: [
                  { id: 100, body: CONFIRM, author_association: 'OWNER', user: { id: 271942579 } },
                  { id: 200, body: CONFIRM, author_association: 'OWNER', user: { id: 271942579 } },
                ],
              }),
            ),
            /earlier exact Apply confirmation/,
          );
          await assert.rejects(
            verifySpec014Wave1ApplyTriggerGuard(
              harness({
                runs: [
                  { id: 400, display_title: 'SPEC014_WAVE1_APPLY_AUTHORITY authorized=true comment=100' },
                  { id: 500, display_title: 'SPEC014_WAVE1_APPLY_AUTHORITY authorized=true comment=200' },
                ],
              }),
            ),
            /prior Apply authority run/,
          );
          await assert.rejects(
            verifySpec014Wave1ApplyTriggerGuard(harness({ runtime: 'd'.repeat(40) })),
            /Runtime version drifted/,
          );

          console.log(
            JSON.stringify({
              ok: true,
              contract: 'spec014_wave1_apply_trigger_guard_test.v1',
              immutable_event_tooling: true,
              open_issue_required: true,
              earliest_exact_comment_required: true,
              prior_authority_run_allowed: false,
              rerun_allowed: false,
              final_production_runtime_lease: true,
              secrets_included: false,
            }),
          );
          EOF

      - name: Patch workflow, executor, contract, and existing regression
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          workflow = '.github/workflows/spec014-wave1-apply.yml'
          replace_once(
              workflow,
              'name: Spec 014 Wave 1 Migration Apply\n\n',
              "name: Spec 014 Wave 1 Migration Apply\nrun-name: SPEC014_WAVE1_APPLY_AUTHORITY authorized=${{ github.event.issue.number == 6215 && github.event.issue.state == 'open' && !github.event.issue.pull_request && github.event.comment.body == 'APPLY_20260802_01_SPEC014_HOSTINGER_STORAGE_FOUNDATION' && contains(fromJSON('[\\\"OWNER\\\",\\\"MEMBER\\\",\\\"COLLABORATOR\\\"]'), github.event.comment.author_association) }} comment=${{ github.event.comment.id }}\n\n",
          )
          replace_once(
              workflow,
              'permissions:\n  contents: read\n',
              'permissions:\n  actions: read\n  contents: read\n  issues: read\n',
          )
          replace_once(
              workflow,
              "      github.event.issue.number == 6215 &&\n      !github.event.issue.pull_request &&\n",
              "      github.run_attempt == 1 &&\n      github.event.issue.number == 6215 &&\n      github.event.issue.state == 'open' &&\n      !github.event.issue.pull_request &&\n",
          )
          replace_once(
              workflow,
              "      EVIDENCE_DIR: .artifacts/spec014-wave1-apply\n",
              "      EVIDENCE_DIR: .artifacts/spec014-wave1-apply\n      EXPECTED_TOOLING_SHA: ${{ github.sha }}\n      TRIGGER_COMMENT_ID: ${{ github.event.comment.id }}\n      TRIGGER_ACTOR_ID: ${{ github.event.comment.user.id }}\n      TRIGGER_AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}\n      TRIGGER_BODY: ${{ github.event.comment.body }}\n      CURRENT_RUN_ID: ${{ github.run_id }}\n      CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}\n",
          )
          replace_once(workflow, '          ref: main\n', '          ref: ${{ github.sha }}\n')

          runner = '.github/ops/spec014-wave1-apply.mjs'
          replace_once(
              runner,
              "import { splitMigrationSqlStatements } from '../../http-generic-api/migrationSqlStatements.js';\n",
              "import { splitMigrationSqlStatements } from '../../http-generic-api/migrationSqlStatements.js';\nimport { verifySpec014Wave1ApplyTriggerGuard } from './spec014-wave1-apply-trigger-guard.mjs';\n",
          )
          replace_once(
              runner,
              "let finalReadback = null;\n",
              "let finalReadback = null;\nlet triggerIdentity = null;\nlet finalExecutionLease = null;\n",
          )
          replace_once(
              runner,
              "    stage,\n    main_sha: mainSha,\n",
              "    stage,\n    tooling_sha: triggerIdentity?.tooling_sha || null,\n    trigger_comment_id: triggerIdentity?.trigger_comment_id || null,\n    workflow_run_id: triggerIdentity?.workflow_run_id || null,\n    workflow_run_attempt: triggerIdentity?.workflow_run_attempt || null,\n    main_sha: mainSha,\n",
          )
          replace_once(
              runner,
              "      production_sha: productionSha,\n    }),\n",
              "      production_sha: productionSha,\n      tooling_sha: triggerIdentity?.tooling_sha || mainSha,\n      trigger_comment_id: triggerIdentity?.trigger_comment_id || null,\n      workflow_run_id: triggerIdentity?.workflow_run_id || null,\n    }),\n",
          )
          replace_once(
              runner,
              "async function verifyRepositoryAndRuntimeParity() {\n  mainSha = await currentRefSha('main');\n",
              "async function verifyRepositoryAndRuntimeParity() {\n  const currentMainSha = await currentRefSha('main');\n  if (mainSha) assert.equal(currentMainSha, mainSha, 'Protected main changed after trigger verification');\n  mainSha = currentMainSha;\n",
          )
          replace_once(
              runner,
              "  await verifyLocalContract();\n  await writeState({ local_contract_verified: true });\n\n  stage = 'repository_and_runtime_parity';\n",
              "  await verifyLocalContract();\n  await writeState({ local_contract_verified: true });\n\n  stage = 'trigger_and_tooling_identity';\n  triggerIdentity = await verifySpec014Wave1ApplyTriggerGuard({\n    githubJson,\n    currentRefSha,\n    requestGet,\n    collectShas,\n    repository: REPOSITORY,\n    controlIssue: CONTROL_ISSUE,\n    applyConfirm: APPLY_CONFIRM,\n    baseUrl: BASE,\n  });\n  mainSha = triggerIdentity.tooling_sha;\n  await writeJson('trigger-identity.json', triggerIdentity);\n  await writeState({ trigger_identity_verified: true });\n\n  stage = 'repository_and_runtime_parity';\n",
          )
          replace_once(
              runner,
              "  await writeJson('execution-envelope.json', executionEnvelope);\n  await writeState({ execution_envelope_apply_authorized: true });\n\n  stage = 'single_apply_attempt';\n",
              "  await writeJson('execution-envelope.json', executionEnvelope);\n  await writeState({ execution_envelope_apply_authorized: true });\n\n  stage = 'final_execution_lease';\n  finalExecutionLease = await verifySpec014Wave1ApplyTriggerGuard({\n    githubJson,\n    currentRefSha,\n    requestGet,\n    collectShas,\n    repository: REPOSITORY,\n    controlIssue: CONTROL_ISSUE,\n    applyConfirm: APPLY_CONFIRM,\n    productionSha,\n    baseUrl: BASE,\n  });\n  await writeJson('final-execution-lease.json', finalExecutionLease);\n  await writeState({ final_execution_lease_verified: true });\n\n  stage = 'single_apply_attempt';\n",
          )
          replace_once(
              runner,
              "      statement_count: STATEMENT_COUNT,\n      apply_sent_by_this_run: false,\n",
              "      statement_count: STATEMENT_COUNT,\n      tooling_sha: triggerIdentity.tooling_sha,\n      trigger_comment_id: triggerIdentity.trigger_comment_id,\n      workflow_run_id: triggerIdentity.workflow_run_id,\n      apply_sent_by_this_run: false,\n",
          )
          replace_once(
              runner,
              "    source_merge_sha: SOURCE_MERGE_SHA,\n    readiness_authorization: 'verified',\n",
              "    source_merge_sha: SOURCE_MERGE_SHA,\n    tooling_sha: triggerIdentity.tooling_sha,\n    trigger_comment_id: triggerIdentity.trigger_comment_id,\n    workflow_run_id: triggerIdentity.workflow_run_id,\n    final_execution_lease: Boolean(finalExecutionLease),\n    readiness_authorization: 'verified',\n",
          )
          replace_once(
              runner,
              "    stage,\n    main_sha: mainSha,\n",
              "    stage,\n    tooling_sha: triggerIdentity?.tooling_sha || null,\n    trigger_comment_id: triggerIdentity?.trigger_comment_id || null,\n    workflow_run_id: triggerIdentity?.workflow_run_id || null,\n    workflow_run_attempt: triggerIdentity?.workflow_run_attempt || null,\n    main_sha: mainSha,\n",
          )

          test = 'http-generic-api/test-spec014-wave1-apply-contract.mjs'
          replace_once(
              test,
              "const E2E_PATH = path.join(ROOT, '.changes/e2e/spec014-wave1-apply-contract.json');\n",
              "const E2E_PATH = path.join(ROOT, '.changes/e2e/spec014-wave1-apply-contract.json');\nconst GUARD_PATH = path.join(ROOT, '.github/ops/spec014-wave1-apply-trigger-guard.mjs');\n",
          )
          replace_once(
              test,
              "const [runner, workflow, e2eText] = await Promise.all([\n  fs.readFile(RUNNER_PATH, 'utf8'),\n  fs.readFile(WORKFLOW_PATH, 'utf8'),\n  fs.readFile(E2E_PATH, 'utf8'),\n]);\n",
              "const [runner, workflow, e2eText, guard] = await Promise.all([\n  fs.readFile(RUNNER_PATH, 'utf8'),\n  fs.readFile(WORKFLOW_PATH, 'utf8'),\n  fs.readFile(E2E_PATH, 'utf8'),\n  fs.readFile(GUARD_PATH, 'utf8'),\n]);\n",
          )
          replace_once(
              test,
              "assert.match(workflow, /permissions:\\n  contents: read/);\nassert.doesNotMatch(workflow, /contents:\\s*write|issues:\\s*write|pull-requests:\\s*write/);\n",
              "assert.match(workflow, /permissions:\\n  actions: read\\n  contents: read\\n  issues: read/);\nassert.doesNotMatch(workflow, /actions:\\s*write|contents:\\s*write|issues:\\s*write|pull-requests:\\s*write/);\n",
          )
          replace_once(
              test,
              "assert.match(workflow, /github\\.event\\.issue\\.number == 6215/);\n",
              "assert.match(workflow, /SPEC014_WAVE1_APPLY_AUTHORITY authorized=/);\nassert.match(workflow, /github\\.run_attempt == 1/);\nassert.match(workflow, /github\\.event\\.issue\\.number == 6215/);\nassert.match(workflow, /github\\.event\\.issue\\.state == 'open'/);\n",
          )
          replace_once(test, "assert.match(workflow, /ref: main/);\n", "assert.match(workflow, /ref: \\${{ github\\.sha }}/);\nassert.doesNotMatch(workflow, /ref: main/);\n")
          replace_once(
              test,
              "assert.match(workflow, /persist-credentials: false/);\n",
              "assert.match(workflow, /persist-credentials: false/);\nfor (const binding of ['EXPECTED_TOOLING_SHA', 'TRIGGER_COMMENT_ID', 'TRIGGER_ACTOR_ID', 'CURRENT_RUN_ID', 'CURRENT_RUN_ATTEMPT']) {\n  assert.ok(workflow.includes(binding), `Apply workflow is missing ${binding}.`);\n}\n",
          )
          replace_once(
              test,
              "assert.match(runner, /governed_migration_authorization_registry/);\n",
              "assert.match(runner, /verifySpec014Wave1ApplyTriggerGuard/);\nassert.equal((runner.match(/verifySpec014Wave1ApplyTriggerGuard\\(/g) || []).length, 2);\nassert.match(runner, /trigger-identity\\.json/);\nassert.match(runner, /final-execution-lease\\.json/);\nassert.match(guard, /earlier exact Apply confirmation/);\nassert.match(guard, /prior Apply authority run/);\nassert.match(guard, /Protected main moved after the Apply event/);\nassert.match(guard, /Protected Production moved before Apply/);\nassert.match(runner, /governed_migration_authorization_registry/);\n",
          )
          replace_once(
              test,
              "  \"stage = 'repository_and_runtime_parity'\",\n",
              "  \"stage = 'trigger_and_tooling_identity'\",\n  \"stage = 'repository_and_runtime_parity'\",\n",
          )
          replace_once(
              test,
              "  \"stage = 'execution_envelope'\",\n  \"stage = 'single_apply_attempt'\",\n",
              "  \"stage = 'execution_envelope'\",\n  \"stage = 'final_execution_lease'\",\n  \"stage = 'single_apply_attempt'\",\n",
          )
          replace_once(
              test,
              "  'http-generic-api/test-spec014-wave1-apply-contract.mjs',\n",
              "  'http-generic-api/test-spec014-wave1-apply-contract.mjs',\n  '.github/ops/spec014-wave1-apply-trigger-guard.mjs',\n  'http-generic-api/test-spec014-wave1-apply-trigger-guard.mjs',\n",
          )
          replace_once(
              test,
              "      apply_retry_allowed: false,\n",
              "      apply_retry_allowed: false,\n      cross_run_retry_allowed: false,\n      rerun_allowed: false,\n      immutable_event_tooling_required: true,\n",
          )

          e2e_path = Path('.changes/e2e/spec014-wave1-apply-contract.json')
          e2e = json.loads(e2e_path.read_text())
          include = e2e['scope']['include']
          for item in [
              '.github/ops/spec014-wave1-apply-trigger-guard.mjs',
              'http-generic-api/test-spec014-wave1-apply-trigger-guard.mjs',
          ]:
              if item not in include:
                  include.append(item)
          journey = e2e['phases'][0]['e2e_journeys'][0]
          journey['objective'] = 'Provide a separately authorized exact-once Wave 1 Apply contract that binds execution to one immutable issue-comment event SHA and earliest eligible trigger, rejects reruns and every prior Apply authority run, requires pre-existing Runtime Readiness authorization, exact Production parity, ledger-first duplicate prevention, a same-cycle zero-risk dry-run, a final execution lease, one non-retriable Apply attempt, and exact ledger/table certification.'
          journey['steps'][0] = 'Require the exact Apply comment on an open issue #6215 from an OWNER, MEMBER, or COLLABORATOR with run_attempt=1.'
          journey['steps'][1:1] = [
              'Bind checkout to github.sha and require live protected main to equal that immutable issue-comment event SHA.',
              'Require the current comment to be the earliest eligible exact Apply confirmation and reject any prior authority-marked issue-comment workflow run.',
              'Repeat trigger, run-history, main, Production, and public runtime identity checks immediately before the single Apply request.',
          ]
          journey['assertions'][1] = 'The workflow has actions:read, contents:read, and issues:read only and no push, pull_request, workflow_dispatch, Issue write, PR write, or repository mutation permission.'
          journey['assertions'][2:2] = [
              'The workflow run name records an authority marker, exact-body eligibility, and comment ID so prior real Apply authority runs can be distinguished from unrelated skipped issue-comment runs.',
              'The workflow rejects run_attempt greater than one, requires the control issue to be open, checks out github.sha exactly, and fails if live main differs from the event tooling SHA.',
              'The earliest eligible exact comment is the only trigger and any prior authority-marked run permanently blocks cross-run retry even if comments are later deleted.',
              'A final execution lease repeats comment, Actions history, main, Production, and public runtime SHA checks immediately before Apply.',
          ]
          for index, assertion in enumerate(journey['assertions']):
              if assertion == 'The executor contains exactly one mode=apply request and never retries Apply after an unsuccessful or ambiguous response.':
                  journey['assertions'][index] = 'The executor contains exactly one mode=apply request; same-run retry, workflow rerun, repeated-comment execution, redelivery, and every later authority run are rejected.'
          tests = journey['tests']
          if not any(item.get('path') == 'test-spec014-wave1-apply-trigger-guard.mjs' for item in tests):
              tests.append({
                  'id': 'spec014-wave1-apply-trigger-guard',
                  'runner': 'node',
                  'working_directory': 'http-generic-api',
                  'path': 'test-spec014-wave1-apply-trigger-guard.mjs',
                  'args': [],
              })
          evidence = journey['evidence_paths']
          for item in [
              '.github/ops/spec014-wave1-apply-trigger-guard.mjs',
              'http-generic-api/test-spec014-wave1-apply-trigger-guard.mjs',
          ]:
              if item not in evidence:
                  evidence.append(item)
          e2e_path.write_text(json.dumps(e2e, indent=2) + '\n')
          PY

      - name: Validate hardening and final scope
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check .github/ops/spec014-wave1-apply-trigger-guard.mjs
          node --check .github/ops/spec014-wave1-apply.mjs
          node http-generic-api/test-spec014-wave1-apply-trigger-guard.mjs
          node http-generic-api/test-spec014-wave1-apply-contract.mjs
          node -e "JSON.parse(require('fs').readFileSync('.changes/e2e/spec014-wave1-apply-contract.json','utf8'))"
          rm -f "${PATCHER_PATH}" "${TRIGGER_PATH}"
          git diff --check
          actual="$(git diff --name-only "${EXPECTED_MAIN_SHA}"...HEAD | grep -v -E "^(${PATCHER_PATH}|${TRIGGER_PATH})$" | sort)"
          expected="$(printf '%s\n' \
            '.changes/e2e/spec014-wave1-apply-contract.json' \
            '.github/ops/spec014-wave1-apply-trigger-guard.mjs' \
            '.github/ops/spec014-wave1-apply.mjs' \
            '.github/workflows/spec014-wave1-apply.yml' \
            'http-generic-api/test-spec014-wave1-apply-contract.mjs' \
            'http-generic-api/test-spec014-wave1-apply-trigger-guard.mjs' | sort)"
          test "${actual}" = "${expected}"

      - name: Commit and push guarded candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(spec014): prevent cross-run Wave 1 Apply retries'
          git push origin "HEAD:${TARGET_BRANCH}"
