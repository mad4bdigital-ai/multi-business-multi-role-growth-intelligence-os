name: T016 Atomic Candidate Evidence Completion

on:
  pull_request:
    branches:
      - agent/validate-t016-readiness-artifact-base-435c001
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: t016-atomic-candidate-evidence-completion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    name: Complete legacy evidence semantics on PR 5652
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/ops/t016-readiness-envelope-path-current-main-20260803' &&
      github.event.pull_request.head.sha == '8d6e16e64094f9338b582c1fb3d7457e988c1407'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      TARGET_BRANCH: gpt/ops/t016-readiness-envelope-path-current-main-20260803
      EXPECTED_HEAD: 8d6e16e64094f9338b582c1fb3d7457e988c1407
      EVIDENCE_DIR: /tmp/t016-atomic-evidence-completion-${{ github.run_id }}
    steps:
      - name: Checkout exact atomic candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
          persist-credentials: true

      - name: Verify immutable candidate head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"

      - name: Fetch trusted section-bounded repair script
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin agent/validate-t016-readiness-artifact-base-435c001
          git show FETCH_HEAD:.github/ops/t016-evidence-path-repair.mjs > /tmp/t016-evidence-path-repair.mjs
          node --check /tmp/t016-evidence-path-repair.mjs

      - name: Apply final legacy evidence semantics
        run: node /tmp/t016-evidence-path-repair.mjs

      - name: Validate exact six-file candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check .github/ops/sprint69-1043-runtime-readiness.mjs
          node --check .github/ops/sprint69-1043-runtime-readiness-backfill.mjs
          node --check http-generic-api/routes/adminCliRoutes.js
          node http-generic-api/test-sprint69-1043-runtime-readiness-contract.mjs
          node http-generic-api/test-capability-envelope-create-alias-path.mjs
          node http-generic-api/test-capability-envelope-approval-alias-path.mjs
          git diff --check
          mkdir -p "${EVIDENCE_DIR}"
          git diff > "${EVIDENCE_DIR}/legacy-semantics.patch"
          git diff --stat > "${EVIDENCE_DIR}/stat.txt"

      - name: Commit and push when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Atomic candidate already contains final evidence semantics.'
            exit 0
          fi
          git config user.name 'mad4bdigital-ai'
          git config user.email '271942579+mad4bdigital-ai@users.noreply.github.com'
          git add .github/ops/sprint69-1043-runtime-readiness-backfill.mjs \
            .github/ops/sprint69-1043-runtime-readiness.mjs \
            http-generic-api/test-sprint69-1043-runtime-readiness-contract.mjs
          git commit -m 'fix(ops): preserve unverified T016 legacy evidence'
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Upload bounded completion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t016-atomic-evidence-completion-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
