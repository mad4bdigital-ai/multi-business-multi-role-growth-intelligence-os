name: Spec 011 Phase 3 Delegation Policy Runtime Closeout Once

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: spec-011-phase3-delegation-policy-runtime-closeout
  cancel-in-progress: false

jobs:
  closeout:
    if: github.event.pull_request.head.ref == 'gpt/spec-011-phase3-delegation-policy-runtime-closeout-20260731'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gpt/spec-011-phase3-delegation-policy-runtime-closeout-20260731
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Synchronize latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Apply semantic closeout
        env:
          CLOSEOUT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/spec011-phase3-delegation-policy-runtime-closeout.py

      - name: Validate evidence and safety state
        run: |
          python3 -m json.tool specs/011-durable-governed-execution-and-agent-delegation/manifest.json >/dev/null
          python3 -m json.tool specs/011-durable-governed-execution-and-agent-delegation/completion.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('specs/011-durable-governed-execution-and-agent-delegation')
          manifest = json.loads((root / 'manifest.json').read_text())
          completion = json.loads((root / 'completion.json').read_text())
          assert manifest['phase3_delegation_policy_runtime_tasks_status'] == 't142_t149_complete_on_main'
          assert manifest['phase3_delegation_policy_runtime_t141_status'].startswith('open_')
          assert manifest['phase3_delegation_policy_runtime_production_migration_applied'] is False
          assert manifest['phase3_delegation_policy_runtime_runtime_binding_enabled'] is False
          wave = completion['evidence']['phase3_delegation_policy_runtime_wave']
          assert wave['status'] == 'complete_on_main_production_unapplied'
          assert wave['runtime_dispatch_gate'] is True
          assert wave['self_approval_forbidden'] is True
          assert wave['renewal_no_widening'] is True
          assert wave['production_database_write'] is False
          assert wave['secrets_included'] is False
          print('phase3 delegation policy runtime closeout validated')
          PY

      - name: Enforce evidence-only write set
        run: |
          allowed='^(specs/011-durable-governed-execution-and-agent-delegation/manifest\.json|specs/011-durable-governed-execution-and-agent-delegation/completion\.json|\.github/scripts/spec011-phase3-delegation-policy-runtime-closeout\.py|\.github/workflows/spec-011-phase3-delegation-policy-runtime-closeout-once\.yml)$'
          unexpected="$(git diff --name-only origin/main | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected closeout files:\n%s\n' "$unexpected"
            exit 1
          fi

      - name: Commit clean closeout
        run: |
          rm -f .github/scripts/spec011-phase3-delegation-policy-runtime-closeout.py
          rm -f .github/workflows/spec-011-phase3-delegation-policy-runtime-closeout-once.yml
          git add -A
          git commit -m "docs(spec-011): close delegation policy runtime wave"
          git fetch origin gpt/spec-011-phase3-delegation-policy-runtime-closeout-20260731
          git merge --no-edit origin/gpt/spec-011-phase3-delegation-policy-runtime-closeout-20260731
          git push origin HEAD:gpt/spec-011-phase3-delegation-policy-runtime-closeout-20260731
