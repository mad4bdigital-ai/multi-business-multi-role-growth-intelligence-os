name: Governed Generated Artifact Refresh PR Target V3

on:
  pull_request_target:
    types: [labeled, synchronize, ready_for_review, reopened]

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: governed-generated-artifact-refresh-pr-target-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dispatch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'generated-artifact-refresh') &&
      (github.event.action != 'labeled' || github.event.label.name == 'generated-artifact-refresh')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_REF: ${{ github.event.pull_request.head.ref }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      IS_DRAFT: ${{ github.event.pull_request.draft }}
    steps:
      - name: Validate immutable pull-request candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "${HEAD_REPOSITORY}" == "${GITHUB_REPOSITORY}" ]]
          [[ "${BASE_REF}" == "main" ]]
          [[ "${IS_DRAFT}" == "false" ]]
          [[ "${TARGET_REF}" =~ ^(gpt|cert|fix|feat|chore|docs|release)/[A-Za-z0-9._/-]+$ ]]
          [[ "${TARGET_REF}" != "main" && "${TARGET_REF}" != "Production" ]]
          [[ "${EXPECTED_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]

      - name: Dispatch registered V2 decision workflow and observe its run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          started_at="$(date -u -d '5 seconds ago' +'%Y-%m-%dT%H:%M:%SZ')"
          payload="$(jq -cn \
            --arg ref "main" \
            --arg target_ref "${TARGET_REF}" \
            --arg expected_head_sha "${EXPECTED_HEAD_SHA}" \
            '{ref:$ref,inputs:{target_ref:$target_ref,expected_head_sha:$expected_head_sha}}')"
          status="$(curl --silent --show-error \
            --output /tmp/generated-refresh-v3-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data "${payload}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/governed-generated-artifact-refresh-dispatch-v2.yml/dispatches")"
          if [[ "${status}" != "204" ]]; then
            body="$(cat /tmp/generated-refresh-v3-response.json 2>/dev/null || true)"
            echo "::error::V2 workflow dispatch rejected with HTTP ${status}: ${body:0:1000}"
            exit 1
          fi

          observed_run_id=""
          for attempt in $(seq 1 12); do
            observed_run_id="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/governed-generated-artifact-refresh-dispatch-v2.yml/runs?event=workflow_dispatch&branch=main&per_page=20" \
              --jq "[.workflow_runs[] | select(.created_at >= \"${started_at}\")] | sort_by(.created_at) | last | .id // empty")"
            if [[ "${observed_run_id}" =~ ^[1-9][0-9]*$ ]]; then
              echo "Observed V2 dispatcher run ${observed_run_id} for ${TARGET_REF}@${EXPECTED_HEAD_SHA}."
              exit 0
            fi
            sleep 5
          done

          echo "::error::GitHub accepted the V2 workflow_dispatch request but no V2 run was observed in the bounded window."
          exit 1
