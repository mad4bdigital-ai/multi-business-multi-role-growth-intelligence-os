name: TEMP R7 Source Rebuild e25ae2e9

on:
  pull_request:
    branches:
      - gpt/r7-source-rebuild-base-e25ae2e9
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  rebuild:
    name: Rebuild exact reviewed R7 sources on captured current main
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'gpt/r7-source-rebuild-trigger-e25ae2e9-v2'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      SOURCE_SHA: c17acfb377cbc3e6121db768e3b21329a01e76f2
      TARGET_BRANCH: fix/hostinger-production-r7-registration-main-e25ae2e9-20260804
    steps:
      - name: Capture current main and target identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          target_sha="$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          [[ "${current_main_sha}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${target_sha}" =~ ^[0-9a-f]{40}$ ]]
          echo "CAPTURED_MAIN_SHA=${current_main_sha}" >> "${GITHUB_ENV}"
          echo "CAPTURED_TARGET_SHA=${target_sha}" >> "${GITHUB_ENV}"

      - name: Checkout target branch and fast-forward only
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Fast-forward to captured main and restore reviewed blobs
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${CAPTURED_TARGET_SHA}"
          git fetch --no-tags origin "${CAPTURED_MAIN_SHA}" "${SOURCE_SHA}"
          git merge-base --is-ancestor "${CAPTURED_TARGET_SHA}" "${CAPTURED_MAIN_SHA}"
          test "$(git rev-list --count "${CAPTURED_MAIN_SHA}..${CAPTURED_TARGET_SHA}")" = '0'
          git merge --ff-only "${CAPTURED_MAIN_SHA}"
          test "$(git rev-parse HEAD)" = "${CAPTURED_MAIN_SHA}"
          git show "${SOURCE_SHA}:.github/workflows/hostinger-production-runtime-readback-r7.yml" > .github/workflows/hostinger-production-runtime-readback-r7.yml
          git show "${SOURCE_SHA}:http-generic-api/test-hostinger-production-runtime-readback-r7.mjs" > http-generic-api/test-hostinger-production-runtime-readback-r7.mjs
          git diff --name-only | sort > /tmp/actual.txt
          printf '%s\n' '.github/workflows/hostinger-production-runtime-readback-r7.yml' 'http-generic-api/test-hostinger-production-runtime-readback-r7.mjs' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          git diff --check
          node http-generic-api/test-hostinger-production-runtime-readback-r7.mjs

      - name: Commit and push candidate branch only
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/hostinger-production-runtime-readback-r7.yml http-generic-api/test-hostinger-production-runtime-readback-r7.mjs
          git commit -m 'fix(ops): restore R7 issue-comment workflow registration'
          result_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:${TARGET_BRANCH}"
          remote_sha="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_sha}" = "${result_sha}"
          printf 'captured_main_sha=%s\nresult_sha=%s\n' "${CAPTURED_MAIN_SHA}" "${result_sha}" >> "${GITHUB_STEP_SUMMARY}"
