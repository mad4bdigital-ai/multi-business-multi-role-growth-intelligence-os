name: OpenAPI Completion Metadata Root Diagnostic

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - '.github/workflows/openapi-completion-metadata-root-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose-root-openapi:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'gpt/probe-openapi-completion-root-4dc325c7-20260802'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json
      - name: Evaluate exact root OpenAPI migration
        shell: bash
        run: |
          set -euo pipefail
          report_dir="${RUNNER_TEMP}/openapi-completion-metadata-root-diagnostic"
          mkdir -p "$report_dir"
          npm --prefix http-generic-api ci >/dev/null

          set +e
          (cd http-generic-api && node scripts/openapi-precise-contract-registry-sync.mjs --write) >"$report_dir/write.stdout" 2>"$report_dir/write.stderr"
          write_status=$?
          set -e

          check_status=99
          path_ref=''
          changed_files=''
          if [[ $write_status -eq 0 ]]; then
            set +e
            (cd http-generic-api && node scripts/openapi-precise-contract-registry-sync.mjs --check) >"$report_dir/check.stdout" 2>"$report_dir/check.stderr"
            check_status=$?
            set -e
            changed_files="$(git diff --name-only | sort -u)"
            path_ref="$(cd http-generic-api && node --input-type=module <<'NODE'
            import fs from 'node:fs';
            import YAML from 'yaml';
            const doc = YAML.parse(fs.readFileSync('openapi.yaml', 'utf8'));
            process.stdout.write(String(doc?.paths?.['/admin/support/tickets/{ticket_id}/external-delivery/completion-certification']?.$ref || ''));
            NODE
            )"
          fi

          WRITE_STATUS="$write_status" CHECK_STATUS="$check_status" PATH_REF="$path_ref" CHANGED_FILES="$changed_files" REPORT_DIR="$report_dir" python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          root=Path(os.environ['REPORT_DIR'])
          def bounded(name):
            text=(root/name).read_text(errors='replace') if (root/name).exists() else ''
            text=re.sub(r'(?i)(authorization|api[_-]?key|token|password|secret|cookie)\s*[:=]\s*\S+', r'\1=[redacted]', text)
            return {'head':text[:1200],'tail':text[-1200:]}
          write_status=int(os.environ['WRITE_STATUS'])
          check_status=int(os.environ['CHECK_STATUS'])
          changed=[line for line in os.environ['CHANGED_FILES'].splitlines() if line]
          expected='./openapi/support-ticket-runtime-completion.yaml#/certifyAdminSupportTicketExternalDeliveryCompletion'
          passed=(write_status==0 and check_status==0 and changed==['http-generic-api/openapi.yaml'] and os.environ['PATH_REF']==expected)
          structured=None
          if write_status!=0:
            try:
              payload=json.loads((root/'write.stderr').read_text())
              structured={'code':payload.get('code'),'conflict_count':payload.get('conflict_count'),'conflicts':[{'path':x.get('path'),'code':x.get('code'),'expected_path_item_ref':x.get('expected_path_item_ref')} for x in (payload.get('conflicts') or [])[:10]]}
            except Exception:
              pass
          report={
            'contract':'mad4b.openapi-completion-metadata-root-diagnostic.v1',
            'outcome':'passed' if passed else 'blocked',
            'candidate_sha':os.environ.get('GITHUB_SHA'),
            'write_status':write_status,
            'check_status':check_status,
            'changed_files':changed,
            'observed_path_ref':os.environ['PATH_REF'],
            'expected_path_ref':expected,
            'structured_failure':structured,
            'write_output':bounded('write.stdout'),
            'write_error':bounded('write.stderr'),
            'repository_mutation_performed':False,
            'runner_worktree_modified':write_status==0,
            'job_logs_consulted':False,
            'provider_dispatch':False,
            'credential_access':False,
            'secrets_included':False,
          }
          (root/'summary.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Upload root diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-completion-metadata-root-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/openapi-completion-metadata-root-diagnostic/summary.json
          if-no-files-found: error
          retention-days: 14
