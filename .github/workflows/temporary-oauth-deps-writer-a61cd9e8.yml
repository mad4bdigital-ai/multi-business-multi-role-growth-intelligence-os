name: Temporary OAuth Dependency Writer a61cd9e8

on:
  pull_request:
    branches:
      - gpt/patch-oauth-deps-base-a61cd9e8
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: temporary-oauth-deps-writer-a61cd9e8
  cancel-in-progress: false

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/spec012-oauth-deps-baseline-a61cd9e8-20260804'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable target head
        uses: actions/checkout@v4
        with:
          ref: gpt/spec012-oauth-deps-baseline-a61cd9e8-20260804
          fetch-depth: 0
          persist-credentials: true

      - name: Prove exact repository state
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD^)" = "764ba0cef618f9df7018c5d6fea01a7666ac8346"
          test "$(git rev-parse origin/main)" = "a61cd9e83070618001676bbc679bc937f0551875"
          test -z "$(git status --porcelain)"
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('.changes/tmp/oauth-deps-writer-trigger-a61cd9e8.json').read_text(encoding='utf-8'))
          if payload != {
              'purpose': 'temporary exact-head trigger for governed OAuth dependency baseline writer',
              'base_sha': 'a61cd9e83070618001676bbc679bc937f0551875',
              'diagnostic_nonce': 3,
              'secrets_included': False,
          }:
              raise SystemExit(f'unexpected trigger payload: {payload!r}')
          PY

      - name: Apply exact OAuth dependency and integration-contract patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          test_path = Path("http-generic-api/test-auth-oauth-routes.mjs")
          replacements = [
              (
                  Path("http-generic-api/routes/index.js"),
                  "  app.use(buildTenantGptOAuthMetadataRoutes());\n",
                  "  app.use(buildTenantGptOAuthMetadataRoutes(deps));\n",
              ),
              (
                  test_path,
                  "app.use(buildTenantGptOAuthMetadataRoutes());\n",
                  "app.use(buildTenantGptOAuthMetadataRoutes({\n  getPool: () => oauthClientPool,\n}));\n",
              ),
              (
                  Path("http-generic-api/test-spec012-t031-oauth-token-route-wiring.mjs"),
                  "const metadataMount = routeIndex.indexOf(\"app.use(buildTenantGptOAuthMetadataRoutes())\");\n",
                  "const metadataMount = routeIndex.indexOf(\"app.use(buildTenantGptOAuthMetadataRoutes(deps))\");\n",
              ),
              (
                  test_path,
                  "  assert(\"invalid client diagnostic uses OAuth action key\", invalidClientDiagnostic?.action_key === \"tenant_gpt_oauth_token_exchange\", JSON.stringify(invalidClientDiagnostic));\n",
                  "  assert(\"invalid client diagnostic uses versioned OAuth action key\", invalidClientDiagnostic?.action_key === \"tenant_gpt_oauth_token_exchange_v2\", JSON.stringify(invalidClientDiagnostic));\n",
              ),
              (
                  test_path,
                  "  assert(\"invalid client diagnostic captures code timing\", invalidClientDiagnostic?.runtime_evidence_json?.code_timing?.ttl_seconds === 300, JSON.stringify(invalidClientDiagnostic));\n",
                  "  assert(\"invalid client diagnostic captures bounded code lifetime\", Number.isFinite(invalidClientDiagnostic?.runtime_evidence_json?.code?.expires_in_seconds) && invalidClientDiagnostic.runtime_evidence_json.code.expires_in_seconds > 0 && invalidClientDiagnostic.runtime_evidence_json.code.expires_in_seconds <= 300, JSON.stringify(invalidClientDiagnostic));\n",
              ),
              (
                  test_path,
                  "  assert(\"invalid client diagnostic captures code age\", Number.isFinite(invalidClientDiagnostic?.runtime_evidence_json?.code_timing?.age_seconds), JSON.stringify(invalidClientDiagnostic));\n",
                  "  assert(\"invalid client diagnostic captures code age\", Number.isFinite(invalidClientDiagnostic?.runtime_evidence_json?.code?.age_seconds), JSON.stringify(invalidClientDiagnostic));\n",
              ),
              (
                  test_path,
                  "  assert(\"success diagnostic captures lowercase token type\", successDiagnostic?.runtime_evidence_json?.access_token?.token_type === \"bearer\", JSON.stringify(successDiagnostic));\n",
                  "  assert(\"success diagnostic marks access token prepared\", successDiagnostic?.runtime_evidence_json?.access_token_prepared === true, JSON.stringify(successDiagnostic));\n",
              ),
              (
                  test_path,
                  "  assert(\"success diagnostic captures token length only\", successDiagnostic?.runtime_evidence_json?.access_token?.length === exchange.body.access_token.length, JSON.stringify(successDiagnostic));\n",
                  "  assert(\"success diagnostic omits access token metadata\", !Object.prototype.hasOwnProperty.call(successDiagnostic?.runtime_evidence_json || {}, \"access_token\"), JSON.stringify(successDiagnostic));\n",
              ),
              (
                  test_path,
                  "  assert(\"success diagnostic captures requested scope count only\", successDiagnostic?.runtime_evidence_json?.requested_scope?.count === TENANT_SCOPE_LINKS.length, JSON.stringify(successDiagnostic));\n",
                  "  assert(\"success diagnostic omits requested scope values\", !Object.prototype.hasOwnProperty.call(successDiagnostic?.runtime_evidence_json || {}, \"requested_scope\"), JSON.stringify(successDiagnostic));\n",
              ),
              (
                  test_path,
                  "      return [{ affectedRows: canConsume ? 1 : 0 }];\n    }\n    if (sql.includes(\"INSERT INTO `execution_log`\")) {\n",
                  "      return [{ affectedRows: canConsume ? 1 : 0 }];\n    }\n    if (sql.includes(\"SELECT status, expires_at, consumed_at\") && sql.includes(\"FROM `tenant_gpt_oauth_authorization_codes`\")) {\n      const record = durableOAuthCodes.get(params[2]);\n      if (!record) return [[]];\n      return [[{\n        status: record.status,\n        expires_at: new Date(Date.now() + 300_000),\n        consumed_at: record.status === \"consumed\" ? new Date() : null,\n        client_matches: record.client_id === params[0] ? 1 : 0,\n        redirect_matches: record.redirect_uri_hash === params[1] ? 1 : 0,\n        expired_by_store: 0,\n      }]];\n    }\n    if (sql.includes(\"INSERT INTO `execution_log`\")) {\n",
              ),
          ]

          for path, old, new in replacements:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"exact replacement count for {path}: expected 1, got {count}; needle={old[:80]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          trigger = Path(".changes/tmp/oauth-deps-writer-trigger-a61cd9e8.json")
          if not trigger.is_file():
              raise SystemExit("temporary trigger file is missing")
          trigger.unlink()

          expected = {
              ".changes/tmp/oauth-deps-writer-trigger-a61cd9e8.json",
              "http-generic-api/routes/index.js",
              "http-generic-api/test-auth-oauth-routes.mjs",
              "http-generic-api/test-spec012-t031-oauth-token-route-wiring.mjs",
          }
          actual = set(subprocess.check_output(
              ["git", "diff", "--name-only"], text=True,
          ).splitlines())
          if actual != expected:
              raise SystemExit(f"unexpected patch scope: {sorted(actual)}")
          PY
          git diff --check
          git diff --stat

      - name: Install locked API dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Prepare diagnostic directory
        shell: bash
        run: mkdir -p diagnostics

      - name: Capture T031 wiring regression
        working-directory: http-generic-api
        shell: bash
        run: |
          set +e
          node test-spec012-t031-oauth-token-route-wiring.mjs > ../diagnostics/t031-wiring.log 2>&1
          code=$?
          printf '%s\n' "$code" > ../diagnostics/t031-wiring.exit
          cat ../diagnostics/t031-wiring.log
          exit 0

      - name: Capture integrated OAuth route regression
        working-directory: http-generic-api
        shell: bash
        run: |
          set +e
          node test-auth-oauth-routes.mjs > ../diagnostics/auth-oauth-routes.log 2>&1
          code=$?
          printf '%s\n' "$code" > ../diagnostics/auth-oauth-routes.exit
          cat ../diagnostics/auth-oauth-routes.log
          exit 0

      - name: Capture T032 compatibility regression
        working-directory: http-generic-api
        shell: bash
        run: |
          set +e
          node test-spec012-t032-legacy-audience-compatibility.mjs > ../diagnostics/t032-compatibility.log 2>&1
          code=$?
          printf '%s\n' "$code" > ../diagnostics/t032-compatibility.exit
          cat ../diagnostics/t032-compatibility.log
          exit 0

      - name: Record diagnostic metadata
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "main_sha=$(git rev-parse origin/main)"
            echo "target_sha=$(git rev-parse HEAD)"
            echo "target_parent_sha=$(git rev-parse HEAD^)"
            echo "patch_files:"
            git diff --name-only | sed 's/^/  - /'
          } > diagnostics/metadata.txt

      - name: Upload OAuth dependency diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oauth-dependency-diagnostics-${{ github.event.pull_request.head.sha }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce focused regression success
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for status in diagnostics/*.exit; do
            code="$(cat "$status")"
            echo "$(basename "$status"): $code"
            if [ "$code" != "0" ]; then
              failed=1
            fi
          done
          test "$failed" = "0"

      - name: Commit and push tested patch without force
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "764ba0cef618f9df7018c5d6fea01a7666ac8346"
          test "$(git rev-parse origin/main)" = "a61cd9e83070618001676bbc679bc937f0551875"
          rm -rf diagnostics
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "fix(spec-012): preserve OAuth route dependency injection"
          git push origin HEAD:refs/heads/gpt/spec012-oauth-deps-baseline-a61cd9e8-20260804
