name: Transport connector merged diagnostic once

on:
  push:
    branches:
      - "fix/transport-response-delivery-20260806"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Merge main in isolated worktree state
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          conflicts="$(git diff --name-only --diff-filter=U || true)"
          unexpected="$(printf '%s\n' "${conflicts}" | grep -Ev '^(docs/work-maps/README\.md|http-generic-api/frontend-operation-governance\.generated\.json|http-generic-api/frontend-surface-dispatch\.generated\.json|http-generic-api/scripts/test-manifest\.mjs)$' || true)"
          test -z "${unexpected}"
          for generated in docs/work-maps/README.md http-generic-api/frontend-operation-governance.generated.json http-generic-api/frontend-surface-dispatch.generated.json; do
            if git diff --name-only --diff-filter=U -- "${generated}" | grep -q .; then
              git checkout --ours -- "${generated}"
              git add -- "${generated}"
            fi
          done
          if git diff --name-only --diff-filter=U -- http-generic-api/scripts/test-manifest.mjs | grep -q .; then
            git checkout --ours -- http-generic-api/scripts/test-manifest.mjs
          fi
          test -z "$(git diff --name-only --diff-filter=U || true)"
          test "${merge_status}" -eq 0 || git rev-parse --verify MERGE_HEAD

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Capture connector transport assertion
        shell: bash
        working-directory: http-generic-api
        run: |
          set +e
          node test-local-connector-transport-errors.mjs > "$RUNNER_TEMP/connector-test.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/connector-test.log"
          if [[ "${status}" -ne 0 ]]; then
            diagnostic="$(tail -c 6000 "$RUNNER_TEMP/connector-test.log" | base64 -w0)"
            echo "::error file=http-generic-api/test-local-connector-transport-errors.mjs,line=1::connector-test-base64:${diagnostic}"
            exit "${status}"
          fi
