name: Repository Inventory Autofix Dispatch
run-name: Repository Inventory Autofix Dispatch · ${{ github.event.workflow_run.id || inputs.expected_head_sha || github.run_id }}

on:
  workflow_run:
    workflows:
      - Repository Inventory
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: Only main_convergence may write observability state; pull_request mode is intentionally advisory-only
        required: false
        default: main_convergence
        type: choice
        options: [main_convergence, pull_request]
      expected_head_sha:
        description: Exact source SHA
        required: true
        type: string
      source_main_sha:
        description: Exact main SHA for post-merge convergence
        required: false
        type: string
      confirmation:
        description: Type REQUEST_REPOSITORY_INVENTORY_REFRESH
        required: true
        type: string

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: repository-inventory-regeneration-${{ github.event.workflow_run.head_sha || inputs.expected_head_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Enforce policy-driven observability repair boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout trusted main policy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve policy and dispatch only post-merge convergence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_EVENT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event || 'workflow_dispatch' }}
          SOURCE_CONCLUSION: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion || 'manual' }}
          SOURCE_HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_head_sha }}
          SOURCE_HEAD_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || '' }}
          MANUAL_MODE: ${{ inputs.mode || 'main_convergence' }}
          MANUAL_SOURCE_MAIN_SHA: ${{ inputs.source_main_sha || '' }}
          MANUAL_CONFIRMATION: ${{ inputs.confirmation || '' }}
        run: |
          set -euo pipefail
          registry=".github/derived-state-governance.json"
          test "$(jq -r '.policy.observability_artifacts_publish_post_merge_only' "$registry")" = "true"
          test "$(jq -r '.policy.observability_premerge_mutation_forbidden' "$registry")" = "true"
          test "$(jq -r '.artifacts[] | select(.artifact_id=="repository_inventory") | .artifact_class' "$registry")" = "observability"
          test "$(jq -r '.artifacts[] | select(.artifact_id=="repository_inventory") | .merge_blocking' "$registry")" = "false"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            [[ "$SOURCE_CONCLUSION" == "failure" ]] || exit 0
            [[ "$SOURCE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
            if [[ "$SOURCE_EVENT" == "pull_request" ]]; then
              echo "Repository Inventory drift is advisory before merge; feature-PR mutation intentionally suppressed." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            [[ "$SOURCE_EVENT" == "push" && "$SOURCE_HEAD_BRANCH" == "main" ]] || exit 0
            source_main_sha="$SOURCE_HEAD_SHA"
          else
            test "$MANUAL_CONFIRMATION" = "REQUEST_REPOSITORY_INVENTORY_REFRESH"
            if [[ "$MANUAL_MODE" == "pull_request" ]]; then
              echo "Pre-merge Repository Inventory mutation is forbidden by policy." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            [[ "$MANUAL_SOURCE_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$MANUAL_SOURCE_MAIN_SHA" = "$SOURCE_HEAD_SHA"
            source_main_sha="$MANUAL_SOURCE_MAIN_SHA"
          fi

          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main_sha" = "$source_main_sha"
          target_ref="chore/repository-inventory-main-sync-${source_main_sha:0:12}"
          case "$target_ref" in
            main|Production) echo "Protected branch mutation target is forbidden: $target_ref" >&2; exit 1 ;;
          esac
          [[ "$target_ref" =~ ^chore/repository-inventory-main-sync-[0-9a-f]{12}$ ]]
          payload="$(jq -cn \
            --arg ref main \
            --arg target_ref "$target_ref" \
            --arg expected_head_sha "$source_main_sha" \
            --arg source_main_sha "$source_main_sha" \
            '{ref:$ref,inputs:{target_ref:$target_ref,expected_head_sha:$expected_head_sha,recipe:"repository_inventory_refresh",confirmation:"APPLY_GENERATED_ARTIFACT_REFRESH",create_from_main:"true",source_main_sha:$source_main_sha}}')"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/governed-generated-artifact-refresh.yml/dispatches" --input - <<<"$payload"
          echo "Dispatched post-merge observability convergence from main@${source_main_sha}; no feature PR was mutated." >> "$GITHUB_STEP_SUMMARY"
