name: Production Runtime Parity Probe

on:
  pull_request:
    branches:
      - Production
    paths:
      - .github/workflows/production-runtime-parity-probe.yml

permissions:
  contents: read

concurrency:
  group: production-migration-1006-dry-run-20260730
  cancel-in-progress: false

jobs:
  governed-dry-run:
    name: Governed Migration 1006 authorization and dry-run only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNTIME_BASE_URL: https://auth.mad4b.com
      EXPECTED_PRODUCTION_SHA: abdeed2c5a588c19a2d1f2e35046e7b120d97016
      MIGRATION_NAME: 1006_sprint69_agent_capability_evidence_coverage.sql
      MIGRATION_PATH: http-generic-api/migrations/1006_sprint69_agent_capability_evidence_coverage.sql
      MIGRATION_SHA256: 995c657922413f9917fd4d93ac1213e76bc66b077c68646e4f5572c62c744374
      MIGRATION_STATEMENTS: "5"
      SOURCE_PR: "3371"
      SOURCE_MERGE_SHA: d14234a6ca478aa6c47e4c561c83a24063789d83
      PLATFORM_ADMIN_USER_ID: 00000000-0000-4000-a000-000000000002
      AUTHORIZATION_ENVELOPE_ID: 3bce53ec-c7ae-4696-ad0d-12ef18fbe325
    steps:
      - name: Checkout Production-pinned probe branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify Production and Migration pins
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin Production
          test "$(git rev-parse origin/Production)" = "$EXPECTED_PRODUCTION_SHA"
          actual="$(sha256sum "$MIGRATION_PATH" | awk '{print $1}')"
          statements="$(grep -Ec '^[[:space:]]*CREATE[[:space:]]+(TABLE|OR[[:space:]]+REPLACE[[:space:]]+VIEW)' "$MIGRATION_PATH")"
          test "$actual" = "$MIGRATION_SHA256"
          test "$statements" -eq "$MIGRATION_STATEMENTS"
          echo "PRODUCTION_PIN=$EXPECTED_PRODUCTION_SHA"
          echo "MIGRATION_1006_SHA256=$actual"
          echo "MIGRATION_1006_CREATE_STATEMENTS=$statements"

      - name: Reconfirm Production runtime parity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = process.env.RUNTIME_BASE_URL.replace(/\/$/, "");
          const expected = process.env.EXPECTED_PRODUCTION_SHA.toLowerCase();
          const strings = [];
          for (const path of ["/health", "/version", "/deployment-info"]) {
            const response = await fetch(`${base}${path}`, { headers: { Accept: "application/json", "User-Agent": "mad4b-migration-1006-governance/1.1" }, signal: AbortSignal.timeout(15000) });
            const body = await response.json();
            console.log(`RUNTIME_PROBE ${path} status=${response.status} ok=${response.ok}`);
            if (!response.ok || body?.ok !== true) process.exit(1);
            const visit = (value) => {
              if (typeof value === "string") strings.push(value.toLowerCase());
              else if (Array.isArray(value)) value.forEach(visit);
              else if (value && typeof value === "object") Object.values(value).forEach(visit);
            };
            visit(body);
          }
          if (!strings.some((value) => value.includes(expected))) process.exit(1);
          console.log(`PRODUCTION_RUNTIME_PARITY=PASS expected_sha=${expected}`);
          NODE

      - name: Approve, authorize, and dry-run Migration 1006
        shell: bash
        env:
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = process.env.RUNTIME_BASE_URL.replace(/\/$/, "");
          const apiKey = process.env.BACKEND_API_KEY || "";
          if (!apiKey) throw new Error("BACKEND_API_KEY is unavailable");
          const sensitive = /(password|secret|token|authorization|cookie|api[_-]?key|credential|private[_-]?key|refresh[_-]?token|access[_-]?token)/i;
          const sanitize = (value) => {
            if (Array.isArray(value)) return value.map(sanitize);
            if (!value || typeof value !== "object") return value;
            return Object.fromEntries(Object.entries(value).map(([key, child]) => [key, sensitive.test(key) ? "[redacted]" : sanitize(child)]));
          };
          const print = (label, value) => console.log(`${label}=${JSON.stringify(sanitize(value), null, 2)}`);
          const parseJson = (value) => {
            if (value && typeof value === "object") return value;
            try { return JSON.parse(String(value || "")); } catch { return null; }
          };
          const unwrapShell = (response) => parseJson(response?.body?.result?.stdout) || response?.body?.result || response?.body;
          const unwrapTool = (response) => response?.body?.result || response?.body?.data || response?.body;
          const findValue = (value, key) => {
            if (!value || typeof value !== "object") return undefined;
            if (Object.prototype.hasOwnProperty.call(value, key)) return value[key];
            for (const child of Object.values(value)) {
              const found = findValue(child, key);
              if (found !== undefined) return found;
            }
            return undefined;
          };

          async function request(path, body, timeout = 300000) {
            const response = await fetch(`${base}${path}`, {
              method: "POST",
              headers: { Authorization: `Bearer ${apiKey}`, "Content-Type": "application/json", Accept: "application/json", "User-Agent": "mad4b-migration-1006-governance/1.1" },
              body: JSON.stringify(body),
              signal: AbortSignal.timeout(timeout),
            });
            const text = await response.text();
            let payload;
            try { payload = JSON.parse(text); } catch { payload = { raw_preview: text.slice(0, 1000) }; }
            return { status: response.status, ok: response.ok, body: payload };
          }
          const shellAlias = (alias, extraArgs) => request("/admin/control", {
            tool: "shell",
            action: "run",
            alias,
            authority_context: { resource_type: "shell_alias", resource_uri: `shell://${alias}`, operation_mode: alias, required: true },
            extra_args: extraArgs,
          });
          const toolCall = (name, toolArgs) => request("/gpt/tools/call", { name, tool_args: toolArgs });

          const envelopeId = process.env.AUTHORIZATION_ENVELOPE_ID;
          const approvalResponse = await shellAlias("capability_resolution_envelope_approve", [
            `--envelope-id=${envelopeId}`,
            `--approved-by=${process.env.PLATFORM_ADMIN_USER_ID}`,
            "--decision-note=Approve checksum-bound Migration 1006 authorization bootstrap after Production parity and zero-gap envelope readback.",
            "--ttl-minutes=120",
          ]);
          const approval = unwrapShell(approvalResponse);
          print("ENVELOPE_APPROVAL_HTTP", approvalResponse);
          print("ENVELOPE_APPROVAL_RESULT", approval);
          if (!approvalResponse.ok || approval?.ok === false || approval?.envelope_status !== "ready_for_dispatch") process.exit(1);

          const authArgs = {
            migration: process.env.MIGRATION_NAME,
            expected_checksum_sha256: process.env.MIGRATION_SHA256,
            expected_statement_count: Number(process.env.MIGRATION_STATEMENTS),
            pull_request: Number(process.env.SOURCE_PR),
            merge_sha: process.env.SOURCE_MERGE_SHA,
            confirm: "AUTHORIZE_GOVERNED_MIGRATION_1006_SPRINT69_AGENT_CAPABILITY_EVIDENCE_COVERAGE",
            capability_envelope_id: envelopeId,
            decision_note: "Authorize reviewed additive Migration 1006 checksum after Production runtime parity. This authorization step executes no migration SQL.",
          };

          let authorizationResponse = await toolCall("governed_migration_authorization_bootstrap", authArgs);
          let authorization = unwrapTool(authorizationResponse);
          print("AUTHORIZATION_ATTEMPT", authorizationResponse);
          if (!authorizationResponse.ok || authorization?.ok === false) {
            const errorCode = String(findValue(authorizationResponse.body, "code") || "");
            const previous = String(findValue(authorizationResponse.body, "recorded_checksum_sha256") || "").toLowerCase();
            if (errorCode === "governed_migration_authorization_previous_checksum_required" && /^[0-9a-f]{64}$/.test(previous)) {
              authorizationResponse = await toolCall("governed_migration_authorization_bootstrap", {
                ...authArgs,
                previous_checksum_sha256: previous,
                decision_note: "Rotate the existing unapplied Migration 1006 authorization from its prior checksum to the reviewed Production checksum after runtime parity verification.",
              });
              authorization = unwrapTool(authorizationResponse);
              print("AUTHORIZATION_ROTATION", authorizationResponse);
            }
          }
          if (!authorizationResponse.ok || authorization?.ok === false) process.exit(1);
          console.log(`MIGRATION_1006_AUTHORIZATION=PASS envelope_id=${envelopeId}`);

          const dryRunResponse = await toolCall("governed_migration_execute", {
            migration: process.env.MIGRATION_NAME,
            mode: "dry_run",
            expected_checksum_sha256: process.env.MIGRATION_SHA256,
            expected_statement_count: Number(process.env.MIGRATION_STATEMENTS),
          });
          const dryRun = unwrapTool(dryRunResponse);
          print("MIGRATION_DRY_RUN_HTTP", dryRunResponse);
          print("MIGRATION_DRY_RUN_RESULT", dryRun);
          if (!dryRunResponse.ok || dryRun?.ok === false) process.exit(1);
          if (dryRun?.applies_sql !== false || dryRun?.mode !== "dry_run") process.exit(1);
          console.log(`MIGRATION_1006_GOVERNED_DRY_RUN=PASS envelope_id=${envelopeId}`);
          NODE
