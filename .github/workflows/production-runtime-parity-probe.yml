name: Production Runtime Parity Probe

on:
  pull_request:
    branches:
      - Production
    paths:
      - .github/workflows/production-runtime-parity-probe.yml

permissions:
  contents: read

concurrency:
  group: production-migration-1006-readback-discovery-20260730
  cancel-in-progress: false

jobs:
  discover-readback:
    name: Discover Migration 1006 readback surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNTIME_BASE_URL: https://auth.mad4b.com
      EXPECTED_PRODUCTION_SHA: abdeed2c5a588c19a2d1f2e35046e7b120d97016
    steps:
      - name: Checkout Production-pinned discovery branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify Production pin and discover source surfaces
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin Production
          test "$(git rev-parse origin/Production)" = "$EXPECTED_PRODUCTION_SHA"
          echo SOURCE_DISCOVERY_BEGIN
          git grep -n -C 12 -E 'getLogicRuntimeCoverage|getEngineRuntimeCoverage|capabilityCoverageRuntime|v_logic_runtime_coverage|v_engine_runtime_coverage' -- http-generic-api || true
          echo SOURCE_DISCOVERY_END

      - name: Sweep governed admin catalog read-only
        shell: bash
        env:
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = process.env.RUNTIME_BASE_URL.replace(/\/$/, "");
          const apiKey = process.env.BACKEND_API_KEY || "";
          if (!apiKey) throw new Error("BACKEND_API_KEY is unavailable");
          async function call(name, toolArgs) {
            const response = await fetch(`${base}/gpt/tools/call`, {
              method: "POST",
              headers: { Authorization: `Bearer ${apiKey}`, "Content-Type": "application/json", Accept: "application/json", "User-Agent": "mad4b-migration-1006-discovery/1.0" },
              body: JSON.stringify({ name, tool_args: toolArgs }),
              signal: AbortSignal.timeout(180000),
            });
            const body = await response.json();
            return { response, body, result: body?.result || body?.data || body };
          }
          const matches = new Map();
          let cursor = 0;
          for (let pageIndex = 0; pageIndex < 20; pageIndex += 1) {
            const { response, result } = await call("admin_tool_catalog_search", { cursor, limit: 200, response_options: { max_chars: 120000 } });
            if (!response.ok || result?.ok === false) process.exit(1);
            for (const item of result?.items || []) {
              const text = JSON.stringify(item);
              if (/coverage|capability_invocations|logic runtime|engine runtime/i.test(text)) {
                const name = String(item?.name || item?.tool_key || item?.key || `item-${matches.size}`);
                matches.set(name, item);
              }
            }
            const page = result?.page || {};
            if (!page?.has_more) break;
            const next = Number(page?.next_cursor);
            if (!Number.isFinite(next) || next <= cursor) break;
            cursor = next;
          }
          console.log(`CATALOG_MATCH_COUNT=${matches.size}`);
          for (const [name, item] of matches) {
            console.log(`CATALOG_MATCH ${name} ${JSON.stringify(item)}`);
          }
          console.log("DISCOVERY_SQL_EXECUTED=false");
          NODE
