name: Production Runtime Parity Probe

on:
  pull_request:
    branches:
      - Production
    paths:
      - .github/workflows/production-runtime-parity-probe.yml

permissions:
  contents: read

concurrency:
  group: production-runtime-parity-probe-20260730
  cancel-in-progress: true

jobs:
  probe:
    name: Read-only runtime and Migration 1006 evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNTIME_BASE_URL: https://auth.mad4b.com
      EXPECTED_PRODUCTION_SHA: abdeed2c5a588c19a2d1f2e35046e7b120d97016
      MIGRATION_NAME: 1006_sprint69_agent_capability_evidence_coverage.sql
      MIGRATION_PATH: http-generic-api/migrations/1006_sprint69_agent_capability_evidence_coverage.sql
      MIGRATION_SHA256: 995c657922413f9917fd4d93ac1213e76bc66b077c68646e4f5572c62c744374
      MIGRATION_STATEMENTS: "5"
    steps:
      - name: Checkout Production-pinned probe branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify Migration 1006 checksum locally
        shell: bash
        run: |
          set -euo pipefail
          actual="$(sha256sum "$MIGRATION_PATH" | awk '{print $1}')"
          statements="$(grep -Ec '^[[:space:]]*CREATE[[:space:]]+(TABLE|OR[[:space:]]+REPLACE[[:space:]]+VIEW)' "$MIGRATION_PATH")"
          echo "MIGRATION_1006_SHA256=$actual"
          echo "MIGRATION_1006_CREATE_STATEMENTS=$statements"
          test "$actual" = "$MIGRATION_SHA256"
          test "$statements" -eq "$MIGRATION_STATEMENTS"

      - name: Read governed Migration 1006 schema and ledger state
        shell: bash
        env:
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = process.env.RUNTIME_BASE_URL.replace(/\/$/, "");
          const key = process.env.BACKEND_API_KEY || "";
          if (!key) throw new Error("BACKEND_API_KEY is unavailable to the same-repository workflow");
          const response = await fetch(`${base}/gpt/tools/call`, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${key}`,
              "Content-Type": "application/json",
              Accept: "application/json",
              "User-Agent": "mad4b-migration-readback/1.0",
            },
            body: JSON.stringify({
              name: "governed_migration_schema_readback",
              tool_args: {
                migration: process.env.MIGRATION_NAME,
                expected_checksum_sha256: process.env.MIGRATION_SHA256,
                expected_statement_count: Number(process.env.MIGRATION_STATEMENTS),
              },
            }),
            signal: AbortSignal.timeout(120000),
          });
          const text = await response.text();
          let body;
          try { body = JSON.parse(text); } catch { body = { raw_preview: text.slice(0, 1000) }; }
          function sanitize(value) {
            if (Array.isArray(value)) return value.map(sanitize);
            if (!value || typeof value !== "object") return value;
            const out = {};
            for (const [name, child] of Object.entries(value)) {
              out[name] = /(password|secret|token|authorization|cookie|api[_-]?key|credential|private[_-]?key)/i.test(name)
                ? "[redacted]"
                : sanitize(child);
            }
            return out;
          }
          console.log(`MIGRATION_SCHEMA_READBACK_HTTP_STATUS=${response.status}`);
          console.log(JSON.stringify(sanitize(body), null, 2));
          if (!response.ok || body?.ok === false) process.exit(1);
          if (body?.secrets_included === true) process.exit(1);
          NODE

      - name: Reconfirm Production runtime parity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = process.env.RUNTIME_BASE_URL.replace(/\/$/, "");
          const expected = process.env.EXPECTED_PRODUCTION_SHA.toLowerCase();
          const paths = ["/health", "/version", "/deployment-info"];
          const strings = [];
          for (const path of paths) {
            const response = await fetch(`${base}${path}`, {
              headers: { Accept: "application/json", "User-Agent": "mad4b-runtime-parity-probe/1.3" },
              signal: AbortSignal.timeout(15000),
            });
            const body = await response.json();
            console.log(`RUNTIME_PROBE ${path} status=${response.status} ok=${response.ok}`);
            if (!response.ok || body?.ok !== true) process.exit(1);
            const visit = (value) => {
              if (typeof value === "string") strings.push(value.toLowerCase());
              else if (Array.isArray(value)) value.forEach(visit);
              else if (value && typeof value === "object") Object.values(value).forEach(visit);
            };
            visit(body);
          }
          if (!strings.some((value) => value.includes(expected))) process.exit(1);
          console.log(`PRODUCTION_RUNTIME_PARITY=PASS expected_sha=${expected}`);
          NODE
