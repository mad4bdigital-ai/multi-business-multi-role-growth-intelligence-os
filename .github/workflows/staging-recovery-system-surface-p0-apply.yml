name: Staging Recovery System Surface P0 Apply

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: staging-recovery-system-surface-p0-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/staging-recovery-system-surface-closure-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact authorized PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Verify exact branch head
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          remote_head_sha="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head_sha}" = "${EXPECTED_HEAD_SHA}"
          test "${TARGET_BRANCH}" != "main"
          test "${TARGET_BRANCH}" != "Production"

      - name: Apply exact-anchor bounded P0 patch
        run: node http-generic-api/scripts/apply-staging-recovery-system-surface-p0.mjs

      - name: Verify patched JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check http-generic-api/stagingRecoverySystemSurface.js
          node --check http-generic-api/recoveryKernel.js
          node --check http-generic-api/routes/systemLayerRoutes.js
          node --check http-generic-api/test-fixed-host-local-system-tool.mjs
          git diff --check

      - name: Remove temporary patch transport
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/staging-recovery-system-surface-p0-apply.yml
          git rm -- http-generic-api/scripts/apply-staging-recovery-system-surface-p0.mjs

      - name: Commit and push exact-head P0 result
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          remote_head_sha="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head_sha}" = "${EXPECTED_HEAD_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add http-generic-api/recoveryKernel.js \
                  http-generic-api/routes/systemLayerRoutes.js \
                  http-generic-api/test-fixed-host-local-system-tool.mjs \
                  http-generic-api/stagingRecoverySystemSurface.js
          git commit -m "Wire bounded Staging Recovery system surface"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
