name: Production Runtime Env Key Inventory

on:
  workflow_dispatch:
    inputs:
      expected_production_sha:
        description: Exact current Production SHA
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: production-runtime-env-key-inventory
  cancel-in-progress: false

jobs:
  inventory:
    name: Read Production runtime and Hostinger env key names
    if: >-
      (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       github.event.issue.number == 6813 &&
       startsWith(github.event.comment.body, 'READ_PRODUCTION_ENV_KEY_INVENTORY:') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: Production
      deployment: false
    env:
      COMMENT_BODY: ${{ github.event.comment.body || '' }}
      INPUT_EXPECTED_PRODUCTION_SHA: ${{ inputs.expected_production_sha || '' }}
      OUTPUT_DIR: ${{ runner.temp }}/production-runtime-env-key-inventory
    steps:
      - name: Resolve exact read-only target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "issue_comment" ]]; then
            if [[ ! "${COMMENT_BODY}" =~ ^READ_PRODUCTION_ENV_KEY_INVENTORY:([0-9a-f]{40})$ ]]; then
              echo "::error::Read-only env key inventory confirmation format mismatch"
              exit 1
            fi
            expected_production_sha="${BASH_REMATCH[1]}"
          else
            expected_production_sha="${INPUT_EXPECTED_PRODUCTION_SHA}"
          fi
          [[ "${expected_production_sha}" =~ ^[0-9a-f]{40}$ ]]
          production_sha="$(gh api "/repos/${REPOSITORY}/git/ref/heads/Production" --jq '.object.sha')"
          main_sha="$(gh api "/repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "${production_sha}" == "${expected_production_sha}" ]]
          echo "expected_production_sha=${expected_production_sha}" >> "${GITHUB_OUTPUT}"
          echo "main_sha=${main_sha}" >> "${GITHUB_OUTPUT}"

      - name: Checkout exact trusted main tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.target.outputs.main_sha }}
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Validate read-only inventory contract
        working-directory: http-generic-api
        run: node scripts/test-production-runtime-env-key-inventory.mjs

      - name: Collect key names only
        working-directory: http-generic-api
        env:
          EXPECTED_PRODUCTION_SHA: ${{ steps.target.outputs.expected_production_sha }}
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: node scripts/production-runtime-env-key-inventory.mjs

      - name: Enforce no-value evidence
        shell: bash
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/production-runtime-env-key-inventory/inventory.json
        run: |
          set -euo pipefail
          jq -e '
            (.contract == "mad4b.production-runtime-env-key-inventory.v1") and
            (.raw_values_exposed == false) and
            (.secrets_included == false) and
            (.effects.provider_get_performed == true) and
            (.effects.provider_mutation_performed == false) and
            (.effects.production_runtime_mutation_performed == false) and
            (.effects.database_mutation_performed == false) and
            (.effects.restart_performed == false) and
            (.effects.deployment_performed == false) and
            ([.. | objects | keys[] | select(test("password|private_key|access_token|refresh_token|credential_value|raw_value"; "i"))] | length == 0)
          ' "${EVIDENCE_PATH}" >/dev/null

      - name: Upload no-secret env key inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-runtime-env-key-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/production-runtime-env-key-inventory/inventory.json
          if-no-files-found: error
          retention-days: 7
