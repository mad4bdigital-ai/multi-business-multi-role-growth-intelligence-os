name: Governed Generated Artifact Refresh Dispatch

on:
  push:
    branches:
      - "gpt/**"
      - "cert/**"
      - "fix/**"
      - "feat/**"
      - "chore/**"
      - "docs/**"
      - "release/**"
  workflow_dispatch:
    inputs:
      target_ref:
        description: Governed work branch to evaluate for refresh dispatch
        required: true
        type: string
      expected_head_sha:
        description: Exact current 40-character head SHA
        required: true
        type: string

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: governed-generated-artifact-refresh-dispatch-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  dispatch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.ref_name }}
      EXPECTED_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_head_sha || github.sha }}
      REPORT_DIR: ${{ runner.temp }}/governed-generated-artifact-refresh-dispatch
    steps:
      - name: Validate dispatch candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "${TARGET_REF}" =~ ^(gpt|cert|fix|feat|chore|docs|release)/[A-Za-z0-9._/-]+$ ]]
          [[ "${TARGET_REF}" != "main" && "${TARGET_REF}" != "Production" ]]
          [[ "${EXPECTED_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]

      - name: Resolve associated pull request and explicit refresh label
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${REPORT_DIR}"
          prs="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:${TARGET_REF}&per_page=10")"
          count="$(jq 'length' <<<"${prs}")"
          if [[ "${count}" != "1" ]]; then
            jq -n \
              --arg contract "mad4b.governed-generated-artifact-refresh-dispatch.v1" \
              --arg target_ref "${TARGET_REF}" \
              --arg expected_head_sha "${EXPECTED_HEAD_SHA}" \
              --arg code "associated_pull_request_cardinality_invalid" \
              --arg detail "expected exactly one open same-repository pull request; found ${count}" \
              '{contract:$contract,outcome:"blocked",target_ref:$target_ref,expected_head_sha:$expected_head_sha,first_failure:{code:$code,diagnostic_tail:$detail},dispatch_requested:false,source_of_truth:"structured_report",job_logs_role:"diagnostic_only",consult_job_logs:false,secrets_included:false}' \
              > "${REPORT_DIR}/dispatch.json"
            exit 0
          fi
          pr_number="$(jq -r '.[0].number' <<<"${prs}")"
          pr_head_sha="$(jq -r '.[0].head.sha' <<<"${prs}")"
          labels="$(jq -c '.[0].labels | map(.name)' <<<"${prs}")"
          if [[ "${pr_head_sha}" != "${EXPECTED_HEAD_SHA}" ]]; then
            jq -n \
              --arg contract "mad4b.governed-generated-artifact-refresh-dispatch.v1" \
              --arg target_ref "${TARGET_REF}" \
              --arg expected_head_sha "${EXPECTED_HEAD_SHA}" \
              --arg observed_head_sha "${pr_head_sha}" \
              --argjson pr_number "${pr_number}" \
              '{contract:$contract,outcome:"blocked",target_ref:$target_ref,expected_head_sha:$expected_head_sha,observed_head_sha:$observed_head_sha,pr_number:$pr_number,first_failure:{code:"pull_request_head_mismatch",diagnostic_tail:"associated pull request head no longer matches the triggering exact SHA"},dispatch_requested:false,source_of_truth:"structured_report",job_logs_role:"diagnostic_only",consult_job_logs:false,secrets_included:false}' \
              > "${REPORT_DIR}/dispatch.json"
            exit 0
          fi
          if ! jq -e 'index("generated-artifact-refresh") != null' <<<"${labels}" >/dev/null; then
            jq -n \
              --arg contract "mad4b.governed-generated-artifact-refresh-dispatch.v1" \
              --arg target_ref "${TARGET_REF}" \
              --arg expected_head_sha "${EXPECTED_HEAD_SHA}" \
              --argjson pr_number "${pr_number}" \
              '{contract:$contract,outcome:"skipped",target_ref:$target_ref,expected_head_sha:$expected_head_sha,pr_number:$pr_number,reason:"generated-artifact-refresh label absent",dispatch_requested:false,source_of_truth:"structured_report",job_logs_role:"diagnostic_only",consult_job_logs:false,secrets_included:false}' \
              > "${REPORT_DIR}/dispatch.json"
            exit 0
          fi
          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch registered exact-head refresh workflow
        if: steps.candidate.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr_number }}
        run: |
          set -euo pipefail
          payload="$(jq -cn \
            --arg ref "main" \
            --arg target_ref "${TARGET_REF}" \
            --arg expected_head_sha "${EXPECTED_HEAD_SHA}" \
            '{ref:$ref,inputs:{target_ref:$target_ref,expected_head_sha:$expected_head_sha,confirmation:"APPLY_GENERATED_ARTIFACT_REFRESH"}}')"
          response_headers="${REPORT_DIR}/dispatch-headers.txt"
          http_status="$(curl --silent --show-error \
            --output "${REPORT_DIR}/dispatch-response.json" \
            --dump-header "${response_headers}" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data "${payload}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/governed-generated-artifact-refresh.yml/dispatches")"
          request_id="$(awk 'BEGIN{IGNORECASE=1} /^x-github-request-id:/ {gsub("\r", ""); print $2}' "${response_headers}" | tail -1)"
          if [[ "${http_status}" != "204" ]]; then
            body="$(cat "${REPORT_DIR}/dispatch-response.json" 2>/dev/null || true)"
            jq -n \
              --arg contract "mad4b.governed-generated-artifact-refresh-dispatch.v1" \
              --arg target_ref "${TARGET_REF}" \
              --arg expected_head_sha "${EXPECTED_HEAD_SHA}" \
              --argjson pr_number "${PR_NUMBER}" \
              --arg http_status "${http_status}" \
              --arg request_id "${request_id}" \
              --arg detail "workflow dispatch rejected with HTTP ${http_status}: ${body:0:1000}" \
              '{contract:$contract,outcome:"blocked",target_ref:$target_ref,expected_head_sha:$expected_head_sha,pr_number:$pr_number,http_status:($http_status|tonumber),github_request_id:($request_id|select(length>0)),first_failure:{code:"workflow_dispatch_rejected",diagnostic_tail:$detail},dispatch_requested:false,source_of_truth:"structured_report",job_logs_role:"diagnostic_only",consult_job_logs:false,secrets_included:false}' \
              > "${REPORT_DIR}/dispatch.json"
            exit 0
          fi
          jq -n \
            --arg contract "mad4b.governed-generated-artifact-refresh-dispatch.v1" \
            --arg target_ref "${TARGET_REF}" \
            --arg expected_head_sha "${EXPECTED_HEAD_SHA}" \
            --argjson pr_number "${PR_NUMBER}" \
            --arg request_id "${request_id}" \
            '{contract:$contract,outcome:"passed",target_ref:$target_ref,expected_head_sha:$expected_head_sha,pr_number:$pr_number,http_status:204,github_request_id:($request_id|select(length>0)),dispatch_requested:true,delegated_workflow:"governed-generated-artifact-refresh.yml",typed_confirmation:"APPLY_GENERATED_ARTIFACT_REFRESH",direct_repository_mutation:false,protected_branch_mutation:false,force_push:false,source_of_truth:"structured_report",job_logs_role:"diagnostic_only",consult_job_logs:false,secrets_included:false}' \
            > "${REPORT_DIR}/dispatch.json"

      - name: Render canonical dispatch evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "${REPORT_DIR}/dispatch.json" ]]; then
            mkdir -p "${REPORT_DIR}"
            jq -n \
              --arg contract "mad4b.governed-generated-artifact-refresh-dispatch.v1" \
              --arg target_ref "${TARGET_REF}" \
              --arg expected_head_sha "${EXPECTED_HEAD_SHA}" \
              '{contract:$contract,outcome:"blocked",target_ref:$target_ref,expected_head_sha:$expected_head_sha,first_failure:{code:"dispatch_report_missing",diagnostic_tail:"dispatcher did not emit its structured decision"},dispatch_requested:false,source_of_truth:"structured_report",job_logs_role:"diagnostic_only",consult_job_logs:false,secrets_included:false}' \
              > "${REPORT_DIR}/dispatch.json"
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = process.env.REPORT_DIR;
          const report = JSON.parse(fs.readFileSync(path.join(dir, 'dispatch.json'), 'utf8'));
          const lines = [
            '# Governed generated-artifact refresh dispatch',
            '',
            `- Contract: \`${report.contract}\``,
            `- Outcome: **${report.outcome}**`,
            `- Target ref: \`${report.target_ref}\``,
            `- Expected head SHA: \`${report.expected_head_sha}\``,
            `- Associated PR: \`${report.pr_number ?? 'not-resolved'}\``,
            `- Dispatch requested: **${report.dispatch_requested === true ? 'yes' : 'no'}**`,
            '- Direct repository mutation: **no**',
            '- Job logs: **diagnostic-only**',
            '- Secrets included: **no**',
          ];
          if (report.first_failure) {
            lines.push('', '## First blocking finding', '', `- Code: \`${report.first_failure.code}\``, `- Diagnostic: \`${String(report.first_failure.diagnostic_tail || '').replace(/`/g, "'")}\``);
          }
          fs.writeFileSync(path.join(dir, 'dispatch.md'), `${lines.join('\n')}\n`);
          NODE

      - name: Upload canonical dispatch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governed-generated-artifact-refresh-dispatch-${{ github.run_id }}
          path: ${{ env.REPORT_DIR }}/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce dispatch decision
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(`${process.env.REPORT_DIR}/dispatch.json`, 'utf8'));
          if (report.contract !== 'mad4b.governed-generated-artifact-refresh-dispatch.v1' || report.secrets_included !== false) process.exit(1);
          if (report.outcome === 'blocked') process.exit(1);
          process.exit(0);
          NODE
