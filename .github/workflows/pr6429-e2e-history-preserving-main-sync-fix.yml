name: PR 6429 E2E history-preserving main sync classifier fix

on:
  push:
    branches:
      - gpt/fix/e2e-history-preserving-main-sync-20260806

permissions:
  contents: write

concurrency:
  group: pr6429-e2e-history-preserving-main-sync-fix
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORK_BRANCH: gpt/fix/e2e-history-preserving-main-sync-20260806
      BASE_BRANCH: gpt/github-main-policy-controller-20260805
      BASE_SHA: 4d081fe1d677bbbd440b1d4c2e7eb050332bbfa9
      WORKFLOW_PATH: .github/workflows/pr6429-e2e-history-preserving-main-sync-fix.yml
      PATCH_SCRIPT_PATH: .github/scripts/pr6429-e2e-history-preserving-main-sync-fix.cjs
    steps:
      - name: Checkout exact helper head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          check-latest: false

      - name: Verify immutable helper binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git ls-remote --exit-code origin "refs/heads/${WORK_BRANCH}" | awk '{print $1}')" = "${GITHUB_SHA}"
          test "$(git ls-remote --exit-code origin "refs/heads/${BASE_BRANCH}" | awk '{print $1}')" = "${BASE_SHA}"
          git merge-base --is-ancestor "${BASE_SHA}" HEAD
          case "$(node --version)" in v22.*) ;; *) exit 1 ;; esac

      - name: Apply deterministic bounded patch
        shell: bash
        run: |
          set -euo pipefail
          evidence_root="${RUNNER_TEMP}/e2e-history-preserving-main-sync-fix"
          mkdir -p "${evidence_root}"
          PATCH_DIAGNOSTIC_PATH="${evidence_root}/patch-diagnostics.txt" \
            node "${PATCH_SCRIPT_PATH}"
          rm "${WORKFLOW_PATH}" "${PATCH_SCRIPT_PATH}"
          git add -A -- \
            "${WORKFLOW_PATH}" \
            "${PATCH_SCRIPT_PATH}" \
            .changes/e2e/e2e-history-preserving-feature-branch-main-sync.json \
            http-generic-api/scripts/e2e-parallel-pr-gate.mjs \
            http-generic-api/scripts/e2e-default-branch-sync-classification-self-test.mjs

      - name: Create exact three-file candidate
        shell: bash
        run: |
          set -euo pipefail
          expected="$(mktemp)"
          actual="$(mktemp)"
          cat > "${expected}" <<'EOF'
          .changes/e2e/e2e-history-preserving-feature-branch-main-sync.json
          .github/scripts/pr6429-e2e-history-preserving-main-sync-fix.cjs
          .github/workflows/pr6429-e2e-history-preserving-main-sync-fix.yml
          http-generic-api/scripts/e2e-default-branch-sync-classification-self-test.mjs
          http-generic-api/scripts/e2e-parallel-pr-gate.mjs
          EOF
          sed -i 's/^          //' "${expected}"
          sort -o "${expected}" "${expected}"
          git diff --cached --name-only | sort > "${actual}"
          diff -u "${expected}" "${actual}"
          test ! -e "${WORKFLOW_PATH}"
          test ! -e "${PATCH_SCRIPT_PATH}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "fix(ci): classify bounded feature-branch main reconciliation"

          cat > "${expected}" <<'EOF'
          .changes/e2e/e2e-history-preserving-feature-branch-main-sync.json
          http-generic-api/scripts/e2e-default-branch-sync-classification-self-test.mjs
          http-generic-api/scripts/e2e-parallel-pr-gate.mjs
          EOF
          sed -i 's/^          //' "${expected}"
          sort -o "${expected}" "${expected}"
          git diff --name-only "${BASE_SHA}...HEAD" | sort > "${actual}"
          diff -u "${expected}" "${actual}"
          test ! -e "${WORKFLOW_PATH}"
          test ! -e "${PATCH_SCRIPT_PATH}"

      - name: Run classifier and E2E regressions
        shell: bash
        run: |
          set -euo pipefail
          evidence_root="${RUNNER_TEMP}/e2e-history-preserving-main-sync-fix"
          mkdir -p "${evidence_root}"
          node --check http-generic-api/scripts/e2e-parallel-pr-gate.mjs
          node --check http-generic-api/scripts/e2e-default-branch-sync-classification-self-test.mjs
          node http-generic-api/scripts/e2e-default-branch-sync-classification-self-test.mjs \
            | tee "${evidence_root}/classification-self-test.json"
          node http-generic-api/scripts/e2e-parallel-work-governance-self-test.mjs \
            | tee "${evidence_root}/parallel-work-self-test.json"
          node http-generic-api/scripts/e2e-parallel-pr-flow-self-test.mjs \
            | tee "${evidence_root}/parallel-pr-flow-self-test.json"
          node http-generic-api/scripts/e2e-phase-governance.mjs check \
            --base "${BASE_SHA}" --head HEAD \
            --report-file "${evidence_root}/phase-governance.json"
          node http-generic-api/scripts/e2e-parallel-pr-gate.mjs \
            --root . --base "${BASE_SHA}" --head HEAD \
            --head-ref "${WORK_BRANCH}" --base-ref "${BASE_BRANCH}" \
            --report-file "${evidence_root}/parallel-pr-gate.json"

      - name: Push without force after immutable readback
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote --exit-code origin "refs/heads/${WORK_BRANCH}" | awk '{print $1}')" = "${GITHUB_SHA}"
          test "$(git ls-remote --exit-code origin "refs/heads/${BASE_BRANCH}" | awk '{print $1}')" = "${BASE_SHA}"
          git push origin "HEAD:refs/heads/${WORK_BRANCH}"
          final_sha="$(git rev-parse HEAD)"
          test "$(git ls-remote --exit-code origin "refs/heads/${WORK_BRANCH}" | awk '{print $1}')" = "${final_sha}"

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-history-preserving-main-sync-fix-${{ github.sha }}
          path: ${{ runner.temp }}/e2e-history-preserving-main-sync-fix
          if-no-files-found: warn
          retention-days: 14
