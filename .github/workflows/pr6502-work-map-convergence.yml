name: PR 6502 Work Map Convergence
run-name: PR 6502 Work Map Convergence · ${{ github.sha }}

on:
  push:
    paths:
      - .github/workflows/pr6502-work-map-convergence.yml

permissions:
  contents: write
  pull-requests: read
  issues: write

concurrency:
  group: pr-6502-work-map-convergence-${{ github.sha }}
  cancel-in-progress: false

jobs:
  converge:
    name: Regenerate final-tree maps and remove one-shot workflow
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      TARGET_PR: "6502"
      TARGET_BRANCH: fix/push-workflow-runner-context-registration-main-ba10f269-20260806
      AUTHORIZED_PARENT_SHA: 6a2b51cb03aedd13f56b7370aa9562a793541ac1
      ONE_SHOT_PATH: .github/workflows/pr6502-work-map-convergence.yml
    steps:
      - name: Checkout exact one-shot commit without marketplace actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=2 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          node --version

      - name: Validate exact PR and fast-forward authority
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os"
          test "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}"
          test "${EVENT_BEFORE}" = "${AUTHORIZED_PARENT_SHA}"
          test "${EVENT_AFTER}" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "${AUTHORIZED_PARENT_SHA}"

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}")"
          test "$(jq -r '.state' <<<"${pr_json}")" = "open"
          test "$(jq -r '.draft' <<<"${pr_json}")" = "true"
          test "$(jq -r '.base.ref' <<<"${pr_json}")" = "main"
          test "$(jq -r '.head.repo.full_name' <<<"${pr_json}")" = "${GITHUB_REPOSITORY}"
          test "$(jq -r '.head.ref' <<<"${pr_json}")" = "${TARGET_BRANCH}"
          test "$(jq -r '.head.sha' <<<"${pr_json}")" = "${GITHUB_SHA}"

          compare_json="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_SHA}")"
          test "$(jq -r '.behind_by' <<<"${compare_json}")" = "0"

      - name: Remove one-shot source before final-tree generation
        run: |
          set -euo pipefail
          test -f "${ONE_SHOT_PATH}"
          rm -- "${ONE_SHOT_PATH}"
          test ! -e "${ONE_SHOT_PATH}"

      - name: Validate Work Map generator contracts
        run: |
          set -euo pipefail
          node --check http-generic-api/scripts/platform-work-map-generator.mjs
          node --check http-generic-api/scripts/platform-work-map-schema-intelligence.mjs
          node --check http-generic-api/scripts/work-map-schema-classification.mjs
          node --check http-generic-api/scripts/work-map-schema-classification-contract.mjs
          node --check http-generic-api/scripts/pipeline-connectivity-check.mjs
          node http-generic-api/scripts/pipeline-connectivity-check.mjs
          node http-generic-api/test-pipeline-connectivity-check.mjs
          node http-generic-api/scripts/work-map-schema-classification-contract.mjs
          node http-generic-api/scripts/work-map-schema-classification.mjs
          node http-generic-api/test-work-map-schema-classification.mjs
          node http-generic-api/test-work-map-schema-classification-contract.mjs

      - name: Regenerate final-tree maps and prove idempotency
        run: |
          set -euo pipefail
          node http-generic-api/scripts/platform-work-map-generator.mjs --write

          mapfile -t changed_paths < <(git diff --name-only | sort)
          printf '%s\n' "${changed_paths[@]}"
          for path in "${changed_paths[@]}"; do
            case "${path}" in
              "${ONE_SHOT_PATH}"|docs/work-maps/README.md|docs/work-maps/repository-automation-map.md)
                ;;
              *)
                echo "Unexpected generated change: ${path}"
                exit 1
                ;;
            esac
          done

          test -n "$(git diff --name-only -- docs/work-maps/repository-automation-map.md)"

          first_diff_hash="$(git diff --binary -- docs/work-maps | sha256sum | awk '{print $1}')"
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          second_diff_hash="$(git diff --binary -- docs/work-maps | sha256sum | awk '{print $1}')"
          test "${first_diff_hash}" = "${second_diff_hash}"
          node http-generic-api/scripts/platform-work-map-generator.mjs --check

      - name: Commit final-tree maps and publish bounded result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/work-maps/README.md docs/work-maps/repository-automation-map.md
          git add -u -- "${ONE_SHOT_PATH}"

          mapfile -t staged < <(git diff --cached --name-only | sort)
          printf '%s\n' "${staged[@]}"
          test "${#staged[@]}" -ge 2
          test "${#staged[@]}" -le 3
          printf '%s\n' "${staged[@]}" | grep -Fxq "${ONE_SHOT_PATH}"
          printf '%s\n' "${staged[@]}" | grep -Fxq "docs/work-maps/repository-automation-map.md"
          for path in "${staged[@]}"; do
            case "${path}" in
              "${ONE_SHOT_PATH}"|docs/work-maps/README.md|docs/work-maps/repository-automation-map.md)
                ;;
              *)
                echo "Unexpected staged path: ${path}"
                exit 1
                ;;
            esac
          done

          git commit -m "docs(work-maps): converge generated repository automation map"
          result_sha="$(git rev-parse HEAD)"
          remote_before="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_before}" = "${GITHUB_SHA}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          remote_after="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_after}" = "${result_sha}"
          test ! -e "${ONE_SHOT_PATH}"
          node http-generic-api/scripts/platform-work-map-generator.mjs --check

          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${TARGET_PR}/comments" \
            -f body="WORK_MAP_CONVERGENCE outcome=passed authorized_parent_sha=${AUTHORIZED_PARENT_SHA} one_shot_sha=${GITHUB_SHA} result_head_sha=${result_sha} generated_from_final_tree=true generated_paths=docs/work-maps/README.md,docs/work-maps/repository-automation-map.md one_shot_removed=true protected_ref_mutation=false force_push=false"
