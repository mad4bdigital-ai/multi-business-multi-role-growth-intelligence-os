name: Exact Spec 014 Surface Ubuntu 24.04 Validation 5634 v1

on:
  pull_request:
    branches:
      - gpt/validate-spec014-surface-ubuntu2404-base-5634-5db9-v1
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: exact-spec014-surface-ubuntu2404-5634-v1-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate:
    name: Exact Spec 014 Surface candidate validation
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Initialize bounded evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/spec014-surface-5634-$GITHUB_RUN_ID"
          mkdir -p \
            "$evidence_dir/reference-integrity" \
            "$evidence_dir/repository-tool-lifecycle" \
            "$evidence_dir/test-suite-reports"
          echo "EVIDENCE_DIR=$evidence_dir" >> "$GITHUB_ENV"
          echo "EXPECTED_HEAD_SHA=c2cdd1b0b748ceeb31a84648f448129a5da60701" >> "$GITHUB_ENV"
          echo "EXPECTED_MAIN_SHA=5db9f992ff42b136fbac88f9191949a7e31ffbf0" >> "$GITHUB_ENV"
          printf '{"candidate_pr":5634,"candidate_sha":"c2cdd1b0b748ceeb31a84648f448129a5da60701","main_sha":"5db9f992ff42b136fbac88f9191949a7e31ffbf0","runner":"ubuntu-24.04","status":"initialized","secrets_included":false}\n' \
            > "$evidence_dir/identity-start.json"

      - name: Verify immutable identity and exact scope
        id: preflight
        continue-on-error: true
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_HEAD_REF: gpt/014-hostinger/surface-contract-generated-evidence-v5-final-20260803
        run: |
          set -euo pipefail
          mark() { printf '%s\n' "$1" | tee -a "$EVIDENCE_DIR/preflight-progress.txt"; }

          mark event-identity-start
          test "$HEAD_REPOSITORY" = "$REPOSITORY"
          test "$HEAD_REF" = "$EXPECTED_HEAD_REF"
          test "$HEAD_SHA" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          mark event-identity-pass

          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" "$EXPECTED_HEAD_SHA"
          commit_count="$(git rev-list --count "${EXPECTED_MAIN_SHA}..${EXPECTED_HEAD_SHA}")"
          test "$commit_count" = "8"
          mark exact-main-ancestry-pass

          git diff --name-only "$EXPECTED_MAIN_SHA" "$EXPECTED_HEAD_SHA" | sort > "$EVIDENCE_DIR/actual-files.txt"
          cat <<'EOF_FILES' | sort > "$EVIDENCE_DIR/expected-files.txt"
          Updating Registry Patch Index.md
          deployment_parity_checklist.md
          docs/ai-docs-agent-governance.md
          docs/auto-docs-agent/README.md
          docs/change-documentation-governance.md
          docs/surface-contract-discovery-status.json
          docs/surface-contract-discovery-status.md
          docs/surface-contract-gap-queue.json
          docs/surface-contract-gap-queue.md
          docs/surface-contract-gap-trends.json
          docs/surface-contract-gap-trends.md
          docs/surface-contract-gap-triage.json
          docs/surface-contract-gap-triage.md
          docs/surface-contract-governance-compact.json
          docs/surface-contract-governance-compact.md
          docs/surface-contract-governance-dashboard.json
          docs/surface-contract-governance-dashboard.md
          docs/surface-contract-safety-attestations.json
          EOF_FILES
          sed -i 's/^          //' "$EVIDENCE_DIR/expected-files.txt"
          sort -o "$EVIDENCE_DIR/expected-files.txt" "$EVIDENCE_DIR/expected-files.txt"
          diff -u "$EVIDENCE_DIR/expected-files.txt" "$EVIDENCE_DIR/actual-files.txt"
          test "$(wc -l < "$EVIDENCE_DIR/actual-files.txt" | tr -d ' ')" = "18"
          mark exact-eighteen-file-scope-pass

          git diff --name-status "$EXPECTED_MAIN_SHA" "$EXPECTED_HEAD_SHA" > "$EVIDENCE_DIR/name-status.tsv"
          jq -n \
            --arg candidate_sha "$EXPECTED_HEAD_SHA" \
            --arg main_sha "$EXPECTED_MAIN_SHA" \
            --argjson commit_count "$commit_count" \
            '{ok:true,candidate_pr:5634,candidate_sha:$candidate_sha,main_sha:$main_sha,commit_count:$commit_count,changed_files:18,runner:"ubuntu-24.04",network_fetch_used:false,secrets_included:false}' \
            > "$EVIDENCE_DIR/preflight.json"
          mark preflight-complete

      - name: Syntax and canonical governance
        id: syntax
        if: steps.preflight.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/schema-docs-change-guard.mjs
          node http-generic-api/scripts/migration-placement-guard.mjs
          (cd http-generic-api && node scripts/user-jwt-auth-governance.mjs)
          (cd http-generic-api && node scripts/interruption-readiness.mjs --ci --skip-dependencies --skip-worktree)
          node validate-canonical-sources.mjs
          node build-canonicals.mjs --check
          node --check find-canonical-domain.mjs
          node http-generic-api/scripts/spec-kit-completion-gate.mjs --ci --changed
          node validate-memory-schema.mjs
          git diff --check

      - name: Resource API coverage and regressions
        id: resource_api
        if: steps.preflight.outcome == 'success'
        continue-on-error: true
        working-directory: http-generic-api
        env:
          GITHUB_BASE_REF: main
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node scripts/resource-api-coverage-audit.mjs --ci --changed
          node test-resource-api-architecture.mjs
          node test-resource-api-service.mjs

      - name: Prove generated Surface evidence and checksum-bound safety
        id: surface_evidence
        if: steps.preflight.outcome == 'success'
        continue-on-error: true
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          mark() { printf '%s\n' "$1" | tee -a "$EVIDENCE_DIR/surface-progress.txt"; }

          mark node-check-discovery:start
          node --check scripts/surface-contract-discovery.mjs
          mark node-check-discovery:pass

          mark node-check-gap-triage:start
          node --check scripts/surface-contract-gap-triage.mjs
          mark node-check-gap-triage:pass

          mark discovery-tests:start
          node test-surface-contract-discovery.mjs
          mark discovery-tests:pass

          mark governance-loop-tests:start
          node test-surface-contract-governance-loop.mjs
          mark governance-loop-tests:pass

          mark auto-remediation-tests:start
          node test-surface-contract-auto-remediation.mjs
          mark auto-remediation-tests:pass

          mark generated-parity-check:start
          node scripts/surface-contract-discovery.mjs --check
          mark generated-parity-check:pass

          mark checksum-attestation:start
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const migrationFile = '20260802_03_spec014_hostinger_storage_execution_evidence.sql';
          const checksum = 'cf484d413399bbd3a0ea9ff36155ceb8b369e1bd43c63c300a93a179e0a57096';
          const queue = JSON.parse(fs.readFileSync('../docs/surface-contract-gap-queue.json', 'utf8'));
          const attestations = JSON.parse(fs.readFileSync('../docs/surface-contract-safety-attestations.json', 'utf8'));
          const item = attestations.items.find((entry) => entry.migration_file === migrationFile);

          fs.writeFileSync(
            process.env.EVIDENCE_DIR + '/surface-inputs.json',
            JSON.stringify({
              queue: {
                ok: queue.ok,
                schema_version: queue.schema_version,
                total_items: queue.total_items,
                migration_absent: !JSON.stringify(queue).includes(migrationFile)
              },
              attestation: item ? {
                migration_file: item.migration_file,
                migration_sha256: item.migration_sha256,
                checksum_canonicalization: item.checksum_canonicalization,
                attestation_status: item.attestation_status,
                evidence_mode: item.evidence_mode,
                review_status: item.review_status,
                reviewed_by: item.reviewed_by,
                reviewed_at: item.reviewed_at,
                execution_authorized: item.execution_authorized,
                safety: item.safety,
                safety_markers: item.safety_markers
              } : null,
              provider_mutation: false,
              production_mutation: false,
              credential_access: false,
              database_mutation: false,
              external_write: false,
              secrets_included: false
            }, null, 2) + '\n'
          );

          assert.equal(queue.ok, true);
          assert.equal(queue.schema_version, 'surface-contract-gap-queue-v1');
          assert.equal(queue.total_items, 24);
          assert.equal(JSON.stringify(queue).includes(migrationFile), false, 'Spec 014 migration returned to the gap queue');

          assert(item, 'Spec 014 checksum-bound safety attestation is missing');
          assert.equal(item.migration_sha256, checksum);
          assert.equal(item.checksum_canonicalization, 'utf8_lf_v1');
          assert.equal(item.attestation_status, 'verified_static_no_external_side_effects');
          assert.equal(item.evidence_mode, 'checksum_bound_human_review');
          assert.equal(item.review_status, 'approved_checksum_bound_internal_sql');
          assert.equal(item.reviewed_by, 'platform_admin:f242960c-2857-4b4d-a504-ee50f8a278b4');
          assert.equal(item.reviewed_at, '2026-08-03T11:31:00Z');
          assert.equal(item.execution_authorized, false);

          for (const [key, value] of Object.entries(item.safety || {})) {
            assert.equal(value, false, `Safety authority must remain false: ${key}`);
          }
          for (const [key, value] of Object.entries(item.safety_markers || {})) {
            assert.equal(value, true, `Safety marker must remain true: ${key}`);
          }

          fs.writeFileSync(
            process.env.EVIDENCE_DIR + '/surface-evidence.json',
            JSON.stringify({
              ok: true,
              queue_total_items: queue.total_items,
              migration_file: migrationFile,
              migration_absent_from_gap_queue: true,
              migration_sha256: item.migration_sha256,
              attestation_status: item.attestation_status,
              execution_authorized: item.execution_authorized,
              provider_mutation: false,
              production_mutation: false,
              credential_access: false,
              database_mutation: false,
              external_write: false,
              secrets_included: false
            }, null, 2) + '\n'
          );
          NODE
          mark checksum-attestation:pass

          mark clean-worktree-check:start
          git diff --exit-code
          mark clean-worktree-check:pass
          mark surface-evidence:complete

      - name: E2E contract reference integrity
        id: reference_integrity
        if: steps.preflight.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/test-e2e-contract-reference-integrity.mjs
          node http-generic-api/test-e2e-contract-git-index-integrity.mjs
          node http-generic-api/scripts/e2e-contract-reference-integrity.mjs \
            --base "$EXPECTED_MAIN_SHA" \
            --head "$EXPECTED_HEAD_SHA" \
            --report-file "$EVIDENCE_DIR/reference-integrity/report.json"
          node http-generic-api/scripts/e2e-contract-git-index-integrity.mjs \
            --report-file "$EVIDENCE_DIR/reference-integrity/report.json"

      - name: Repository tool lifecycle governance
        id: lifecycle
        if: steps.preflight.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs
          BASE_SHA="$EXPECTED_MAIN_SHA" CANDIDATE_SHA="$EXPECTED_HEAD_SHA" \
            node http-generic-api/scripts/maintenance-tools/repository-tool-lifecycle-guard.mjs \
              --changed-files "$EVIDENCE_DIR/name-status.tsv" \
              --policy .github/repository-maintenance-tool-governance.json \
              --output-dir "$EVIDENCE_DIR/repository-tool-lifecycle"

      - name: HTTP Generic API unit integration and architecture
        id: api_tests
        if: steps.preflight.outcome == 'success'
        continue-on-error: true
        working-directory: http-generic-api
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
          TEST_SUITE_REPORT_DIR: ${{ runner.temp }}/spec014-surface-5634-${{ github.run_id }}/test-suite-reports
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run validate

      - name: Execution resolver typecheck and tests
        id: root_tests
        if: steps.preflight.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test -- --runInBand

      - name: Exact E2E phase evaluation and journeys
        id: e2e
        if: steps.preflight.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/e2e-phase-governance.mjs check \
            --base "$EXPECTED_MAIN_SHA" \
            --head "$EXPECTED_HEAD_SHA" \
            --report-file "$EVIDENCE_DIR/e2e-phase-evaluation.json"
          node http-generic-api/scripts/e2e-phase-governance.mjs run \
            --base "$EXPECTED_MAIN_SHA" \
            --head "$EXPECTED_HEAD_SHA" \
            --report-file "$EVIDENCE_DIR/e2e-phase-evaluation-run.json" \
            --execution-report-file "$EVIDENCE_DIR/e2e-phase-execution.json"

      - name: Write bounded validation result
        if: always()
        shell: bash
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          SYNTAX_OUTCOME: ${{ steps.syntax.outcome }}
          RESOURCE_API_OUTCOME: ${{ steps.resource_api.outcome }}
          SURFACE_EVIDENCE_OUTCOME: ${{ steps.surface_evidence.outcome }}
          REFERENCE_INTEGRITY_OUTCOME: ${{ steps.reference_integrity.outcome }}
          LIFECYCLE_OUTCOME: ${{ steps.lifecycle.outcome }}
          API_TESTS_OUTCOME: ${{ steps.api_tests.outcome }}
          ROOT_TESTS_OUTCOME: ${{ steps.root_tests.outcome }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: |
          set -euo pipefail
          jq -n \
            --arg candidate_sha "$EXPECTED_HEAD_SHA" \
            --arg main_sha "$EXPECTED_MAIN_SHA" \
            --arg preflight "$PREFLIGHT_OUTCOME" \
            --arg syntax "$SYNTAX_OUTCOME" \
            --arg resource_api "$RESOURCE_API_OUTCOME" \
            --arg surface_evidence "$SURFACE_EVIDENCE_OUTCOME" \
            --arg reference_integrity "$REFERENCE_INTEGRITY_OUTCOME" \
            --arg lifecycle "$LIFECYCLE_OUTCOME" \
            --arg api_tests "$API_TESTS_OUTCOME" \
            --arg root_tests "$ROOT_TESTS_OUTCOME" \
            --arg e2e "$E2E_OUTCOME" \
            '{candidate_pr:5634,candidate_sha:$candidate_sha,main_sha:$main_sha,runner:"ubuntu-24.04",network_fetch_used:false,outcomes:{preflight:$preflight,syntax:$syntax,resource_api:$resource_api,surface_evidence:$surface_evidence,reference_integrity:$reference_integrity,lifecycle:$lifecycle,api_tests:$api_tests,root_tests:$root_tests,e2e:$e2e},provider_mutation:false,production_mutation:false,credential_access:false,database_mutation:false,external_write:false,secrets_included:false}' \
            > "$EVIDENCE_DIR/result.json"
          cat "$EVIDENCE_DIR/result.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-spec014-surface-5634-ubuntu2404-v1-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce exact validation result
        if: always()
        shell: bash
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          SYNTAX_OUTCOME: ${{ steps.syntax.outcome }}
          RESOURCE_API_OUTCOME: ${{ steps.resource_api.outcome }}
          SURFACE_EVIDENCE_OUTCOME: ${{ steps.surface_evidence.outcome }}
          REFERENCE_INTEGRITY_OUTCOME: ${{ steps.reference_integrity.outcome }}
          LIFECYCLE_OUTCOME: ${{ steps.lifecycle.outcome }}
          API_TESTS_OUTCOME: ${{ steps.api_tests.outcome }}
          ROOT_TESTS_OUTCOME: ${{ steps.root_tests.outcome }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: |
          set -euo pipefail
          for outcome in \
            "$PREFLIGHT_OUTCOME" "$SYNTAX_OUTCOME" "$RESOURCE_API_OUTCOME" \
            "$SURFACE_EVIDENCE_OUTCOME" "$REFERENCE_INTEGRITY_OUTCOME" "$LIFECYCLE_OUTCOME" \
            "$API_TESTS_OUTCOME" "$ROOT_TESTS_OUTCOME" "$E2E_OUTCOME"
          do
            test "$outcome" = "success"
          done
          jq -e '
            .candidate_pr == 5634 and
            .candidate_sha == "c2cdd1b0b748ceeb31a84648f448129a5da60701" and
            .main_sha == "5db9f992ff42b136fbac88f9191949a7e31ffbf0" and
            .runner == "ubuntu-24.04" and
            .network_fetch_used == false and
            ([.outcomes[]] | all(. == "success")) and
            .provider_mutation == false and
            .production_mutation == false and
            .credential_access == false and
            .database_mutation == false and
            .external_write == false and
            .secrets_included == false
          ' "$EVIDENCE_DIR/result.json" >/dev/null
