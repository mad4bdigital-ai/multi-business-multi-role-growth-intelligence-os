name: Authority Live Census Observation

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/authority-live-census-observation.mjs"
      - ".github/workflows/authority-live-census-observation.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/authority-live-census-observation.mjs"
      - ".github/workflows/authority-live-census-observation.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: authority-live-census-observation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governed-live-read-only-census:
    name: Governed Live Read-Only Authority Census
    if: >-
      (github.event_name == 'push' && github.ref_name == 'main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.base.ref == 'main' &&
       github.head_ref == 'gpt/011-ueacp-live-authority-census-observation-20260731' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
       (github.ref_name == 'main' || github.ref_name == 'gpt/011-ueacp-live-authority-census-observation-20260731'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNTIME_BASE_URL: https://auth.mad4b.com
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
      EVIDENCE_PATH: ${{ runner.temp }}/authority-live-census-observation.json
      OBSERVED_REF: ${{ github.event.pull_request.base.sha || github.sha }}
    steps:
      - name: Checkout exact observation ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Assert bounded read-only observer contract
        run: |
          set -euo pipefail
          grep -q 'mode: "read_only_authority_catalog_census"' .github/scripts/authority-live-census-observation.mjs
          grep -q 'database_mutation_executed: false' .github/scripts/authority-live-census-observation.mjs
          grep -q 'migration_apply_authorized: false' .github/scripts/authority-live-census-observation.mjs
          if grep -Eq '\b(INSERT|UPDATE|DELETE|REPLACE|ALTER|CREATE|DROP|TRUNCATE|GRANT|REVOKE)\b' .github/scripts/authority-live-census-observation.mjs; then
            grep -q 'forbidden mutation token' .github/scripts/authority-live-census-observation.mjs
          fi

      - name: Observe live SQL catalog and same-cycle readback
        id: observe
        run: node .github/scripts/authority-live-census-observation.mjs

      - name: Validate bounded no-effect artifact
        run: |
          node -e '
            const fs = require("node:fs");
            const p = process.env.EVIDENCE_PATH;
            const v = JSON.parse(fs.readFileSync(p, "utf8"));
            if (v.contract !== "mad4b.ueacp.live-authority-catalog-observation.v1") process.exit(1);
            if (v.read_only !== true || v.applies_sql !== false || v.database_mutation_executed !== false) process.exit(1);
            if (v.provider_calls !== false || v.credential_payload_read !== false || v.external_writes !== false || v.secrets_included !== false) process.exit(1);
            if (v.same_cycle_readback?.verified !== true || v.closure_state?.t002_complete !== false || v.closure_state?.migration_apply_authorized !== false) process.exit(1);
            if (!Array.isArray(v.objects) || !Array.isArray(v.columns) || !Array.isArray(v.indexes) || !Array.isArray(v.foreign_keys) || !Array.isArray(v.views) || !Array.isArray(v.view_dependencies)) process.exit(1);
          '

      - name: Upload bounded live census evidence
        uses: actions/upload-artifact@v4
        with:
          name: authority-live-census-observation-${{ github.run_id }}
          path: ${{ env.EVIDENCE_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Record evidence summary
        if: always()
        run: |
          if [[ -f "$EVIDENCE_PATH" ]]; then
            node -e '
              const fs = require("node:fs");
              const v = JSON.parse(fs.readFileSync(process.env.EVIDENCE_PATH, "utf8"));
              console.log(`AUTHORITY_LIVE_CENSUS_SUMMARY schema=${v.database_server.schema_name} objects=${v.summary.object_count} columns=${v.summary.column_count} views=${v.summary.view_count} foreign_keys=${v.summary.foreign_key_count} sha256=${v.observation_sha256}`);
            '
          fi
