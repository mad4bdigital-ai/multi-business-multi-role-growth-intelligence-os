name: PR 3265 Atomic Finalizer

on:
  pull_request:
    types: [synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: pr-3265-atomic-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.pull_request.number == 3265 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/hostinger-production-resync-policy-20260729' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout governed PR branch
        uses: actions/checkout@v5
        with:
          ref: gpt/hostinger-production-resync-policy-20260729
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Synchronize, validate, and merge exact head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: '3265'
          TARGET_BRANCH: gpt/hostinger-production-resync-policy-20260729
        run: |
          set -euo pipefail

          WORKFLOW_PATH='.github/workflows/pr3265-atomic-finalizer.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [[ -f "$WORKFLOW_PATH" ]]; then
            git rm "$WORKFLOW_PATH"
            git commit -m 'chore(ci): remove temporary PR 3265 finalizer'
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

          ARTIFACTS=(
            http-generic-api/openapi.yaml
            http-generic-api/frontend-operation-governance.generated.json
            http-generic-api/frontend-surface-dispatch.generated.json
            http-generic-api/openapi/frontend-runtime-routes.generated.yaml
            http-generic-api/openapi/openapi.custom-gpt.auth-dispatcher.yaml
            http-generic-api/openapi/openapi.custom-gpt.activation-admin.yaml
            http-generic-api/openapi/openapi.tenant-gpt.auth.yaml
            http-generic-api/openapi/openapi.tenant-gpt.activation.yaml
            http-generic-api/openapi.gpt-action.local-connector.yaml
          )

          for attempt in $(seq 1 8); do
            echo "finalizer_attempt=${attempt}"
            git fetch --no-tags origin \
              "+refs/heads/main:refs/remotes/origin/main" \
              "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
            git reset --hard "refs/remotes/origin/${TARGET_BRANCH}"

            BASE_SHA="$(git rev-parse refs/remotes/origin/main)"
            HEAD_SHA="$(git rev-parse HEAD)"

            if ! git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; then
              for file in "${ARTIFACTS[@]}"; do
                if git cat-file -e "${BASE_SHA}:${file}" 2>/dev/null; then
                  git checkout "$BASE_SHA" -- "$file"
                fi
              done
              if ! git diff --quiet; then
                git add -- "${ARTIFACTS[@]}"
                git diff --cached --check
                git commit -m 'chore(ci): align generated artifacts before main sync'
              fi
              git merge --no-ff --no-edit "$BASE_SHA"
            fi

            (
              cd http-generic-api
              node scripts/openapi-precise-contract-registry-sync.mjs --write
              node scripts/openapi-autofill-missing-routes.mjs --write
              npm run frontend:dispatch:generate -- --baseline-ref=main
              node scripts/generate-custom-gpt-schemas.mjs --write
              node test-openapi-autofill-missing-routes.mjs
              node test-frontend-operation-governance-generator.mjs
              node test-frontend-surface-dispatch.mjs
              node test-frontend-auth-openapi-parity.mjs
              node test-openapi-route-coverage.mjs
              npm run openapi:auth:check
              npm run schemas:guard
            )

            mapfile -t CHANGED < <(git status --porcelain --untracked-files=all | sed -E 's/^...//')
            if [[ ${#CHANGED[@]} -gt 0 ]]; then
              UNEXPECTED=''
              for file in "${CHANGED[@]}"; do
                case "$file" in
                  http-generic-api/openapi.yaml|\
                  http-generic-api/frontend-operation-governance.generated.json|\
                  http-generic-api/frontend-surface-dispatch.generated.json|\
                  http-generic-api/openapi/frontend-runtime-routes.generated.yaml|\
                  http-generic-api/openapi/openapi.custom-gpt.auth-dispatcher.yaml|\
                  http-generic-api/openapi/openapi.custom-gpt.activation-admin.yaml|\
                  http-generic-api/openapi/openapi.tenant-gpt.auth.yaml|\
                  http-generic-api/openapi/openapi.tenant-gpt.activation.yaml|\
                  http-generic-api/openapi.gpt-action.local-connector.yaml)
                    ;;
                  *) UNEXPECTED+="$file"$'\n' ;;
                esac
              done
              if [[ -n "$UNEXPECTED" ]]; then
                echo '::error::finalizer generator changed files outside bounded artifact set'
                printf '%s' "$UNEXPECTED"
                exit 1
              fi
              git add -- "${CHANGED[@]}"
              git diff --cached --check
              git commit -m 'chore(ci): refresh exact finalizer artifacts'
            fi

            git push origin "HEAD:${TARGET_BRANCH}"
            HEAD_SHA="$(git rev-parse HEAD)"
            git fetch --no-tags origin main
            BASE_SHA="$(git rev-parse refs/remotes/origin/main)"
            if ! git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; then
              echo 'main moved before CI dispatch; retrying'
              continue
            fi

            DISPATCHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh workflow run ci.yml --ref "$TARGET_BRANCH"
            RUN_ID=''
            for lookup in $(seq 1 40); do
              RUN_ID="$(gh run list --workflow ci.yml --branch "$TARGET_BRANCH" --event workflow_dispatch --limit 30 --json databaseId,headSha,createdAt --jq "map(select(.headSha == \"$HEAD_SHA\" and .createdAt >= \"$DISPATCHED_AT\"))[0].databaseId // empty")"
              if [[ -n "$RUN_ID" ]]; then break; fi
              sleep 5
            done
            if [[ -z "$RUN_ID" ]]; then
              echo '::error::unable to resolve exact PR 3265 CI run'
              exit 1
            fi

            DEADLINE="$(( $(date +%s) + 5400 ))"
            while (( $(date +%s) < DEADLINE )); do
              RUN_JSON="$(gh run view "$RUN_ID" --json databaseId,event,headSha,status,conclusion,jobs)"
              STATUS="$(jq -r '.status // ""' <<<"$RUN_JSON")"
              CONCLUSION="$(jq -r '.conclusion // ""' <<<"$RUN_JSON")"
              if [[ "$STATUS" == 'completed' ]]; then
                if [[ "$CONCLUSION" != 'success' ]]; then
                  echo "::error::exact CI failed: ${CONCLUSION}"
                  exit 1
                fi
                node - "$HEAD_SHA" <<'NODE' <<<"$RUN_JSON"
          const fs = require('node:fs');
          const expectedSha = process.argv[2];
          const run = JSON.parse(fs.readFileSync(0, 'utf8'));
          if (run.event !== 'workflow_dispatch') throw new Error(`unexpected event: ${run.event}`);
          if (run.headSha !== expectedSha) throw new Error(`head SHA mismatch: ${run.headSha}`);
          const required = new Set(['Syntax Check','Unit & Integration Tests','Execution Resolver Gate','Architecture Drift Detection']);
          for (const job of run.jobs || []) if (job.conclusion === 'success') required.delete(job.name);
          if (required.size) throw new Error(`missing successful jobs: ${[...required].join(', ')}`);
          NODE
                break
              fi
              sleep 20
            done

            git fetch --no-tags origin \
              "+refs/heads/main:refs/remotes/origin/main" \
              "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
            LATEST_MAIN="$(git rev-parse refs/remotes/origin/main)"
            LATEST_HEAD="$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})"
            if [[ "$LATEST_MAIN" != "$BASE_SHA" || "$LATEST_HEAD" != "$HEAD_SHA" ]]; then
              echo 'main or PR head moved during exact CI; retrying'
              continue
            fi

            PR_JSON="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
            PR_STATE="$(jq -r '.state' <<<"$PR_JSON")"
            PR_HEAD="$(jq -r '.head.sha' <<<"$PR_JSON")"
            PR_BASE="$(jq -r '.base.sha' <<<"$PR_JSON")"
            if [[ "$PR_STATE" != 'open' || "$PR_HEAD" != "$HEAD_SHA" || "$PR_BASE" != "$BASE_SHA" ]]; then
              echo 'PR refs changed before merge; retrying'
              continue
            fi

            MERGE_JSON="$(gh api --method PUT "repos/${REPOSITORY}/pulls/${PR_NUMBER}/merge" \
              -f merge_method=merge \
              -f sha="$HEAD_SHA" \
              -f commit_title='Merge PR #3265: require Production resync after every main movement' \
              -f commit_message='Exact-head CI and freshness verified by bounded atomic finalizer. Migration remains separately governed.')"
            if jq -e '.merged == true' >/dev/null <<<"$MERGE_JSON"; then
              echo "$MERGE_JSON"
              exit 0
            fi
            echo "$MERGE_JSON"
            echo 'merge was not accepted; retrying'
          done

          echo '::error::PR 3265 finalizer exhausted bounded attempts'
          exit 1
