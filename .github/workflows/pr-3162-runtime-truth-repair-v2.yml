name: PR 3162 cleanup

on:
  push:
    branches:
      - gpt/pr-3162-rebuild-main-20260730-v2
    paths:
      - .github/workflows/pr-3162-runtime-truth-repair-v2.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/pr-3162-rebuild-main-20260730-v2
          fetch-depth: 0

      - name: Restore trusted workflows and remove recovery scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- \
            .github/workflows/ci.yml \
            .github/workflows/frontend-surface-dispatch.yml
          rm -f \
            .github/scripts/pr3162_growth_auth_contract_patch.py \
            .github/scripts/pr3162_runtime_truth_repair.py \
            .github/workflows/pr-3162-rebuild-main.yml \
            .github/workflows/pr-3162-rebuild-trigger.yml \
            .github/workflows/pr-3162-runtime-truth-repair-v2.yml

          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //')
          for path in "${changed[@]}"; do
            case "$path" in
              .github/scripts/pr3162_growth_auth_contract_patch.py|\
              .github/scripts/pr3162_runtime_truth_repair.py|\
              .github/workflows/ci.yml|\
              .github/workflows/frontend-surface-dispatch.yml|\
              .github/workflows/pr-3162-rebuild-main.yml|\
              .github/workflows/pr-3162-rebuild-trigger.yml|\
              .github/workflows/pr-3162-runtime-truth-repair-v2.yml)
                ;;
              *)
                echo "::error::unexpected cleanup path: ${path}"
                exit 1
                ;;
            esac
          done
          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            .github/scripts/pr3162_growth_auth_contract_patch.py \
            .github/scripts/pr3162_runtime_truth_repair.py \
            .github/workflows/ci.yml \
            .github/workflows/frontend-surface-dispatch.yml \
            .github/workflows/pr-3162-rebuild-main.yml \
            .github/workflows/pr-3162-rebuild-trigger.yml \
            .github/workflows/pr-3162-runtime-truth-repair-v2.yml
          git commit -m "chore: remove PR 3162 recovery scaffolding"
          git push origin HEAD:gpt/pr-3162-rebuild-main-20260730-v2

      - name: Publish cleanup readback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 3295 --repo "${{ github.repository }}" --body "PR #3162 recovery scaffolding removed in workflow run ${GITHUB_RUN_ID}; trusted CI workflows restored from current main before commit."

# Serial direct trigger; no parallel merge mutation follows.
