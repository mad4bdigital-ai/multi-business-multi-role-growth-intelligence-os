name: Surface Callability Main Reconstruction

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

env:
  TARGET_BRANCH: gpt/surface-callability-main-reconstruction-20260803
  PINNED_MAIN: 26639b44b605c2ea3d608ca13a3d091679ddc39d
  INTEGRATION_REF: gpt/integrated-platform-governance-wave-20260731
  PINNED_INTEGRATION: da2aa9ddf3624e1260737887c22a5b2f00f0d5ea
  RUNNER_PATH: .github/workflows/surface-callability-main-reconstruction.yml

concurrency:
  group: surface-callability-main-reconstruction-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  reconstruct-and-validate:
    if: >-
      github.event.pull_request.head.ref == 'gpt/surface-callability-main-reconstruction-20260803' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out reconstruction branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact reconstruction trigger
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PINNED_MAIN" HEAD
          test "$(git diff --name-only "$PINNED_MAIN" HEAD)" = "$RUNNER_PATH"
          COUNT=$(git rev-list --count "$PINNED_MAIN..HEAD")
          test "$COUNT" -ge 1
          test "$COUNT" -le 2
          git fetch origin "refs/heads/${INTEGRATION_REF}:refs/remotes/origin/surface-integration"
          test "$(git rev-parse refs/remotes/origin/surface-integration)" = "$PINNED_INTEGRATION"

      - name: Materialize bounded product through fail-closed three-way merge
        shell: bash
        run: |
          set -euo pipefail
          BASE=$(git merge-base "$PINNED_MAIN" "$PINNED_INTEGRATION")
          echo "merge_base=$BASE"

          merge_path() {
            local path="$1"
            local safe
            safe=$(printf '%s' "$path" | tr '/.' '__')
            mkdir -p "$(dirname "$path")"
            git show "$PINNED_MAIN:$path" > "$path"
            git show "$BASE:$path" > "/tmp/${safe}.base"
            git show "$PINNED_INTEGRATION:$path" > "/tmp/${safe}.theirs"
            set +e
            git merge-file "$path" "/tmp/${safe}.base" "/tmp/${safe}.theirs"
            status=$?
            set -e
            if [[ $status -ne 0 ]]; then
              echo "three_way_conflict:$path" >&2
              git diff -- "$path" || true
              exit 1
            fi
          }

          copy_new_path() {
            local path="$1"
            mkdir -p "$(dirname "$path")"
            if git cat-file -e "$BASE:$path" 2>/dev/null; then
              echo "expected_new_path_exists_in_merge_base:$path" >&2
              exit 1
            fi
            git show "$PINNED_INTEGRATION:$path" > "$path"
          }

          while IFS= read -r path; do
            [[ -n "$path" ]] && merge_path "$path"
          done <<'FILES'
          http-generic-api/agentSurfaceRuntimeService.js
          http-generic-api/routes/agentSurfaceRoutes.js
          http-generic-api/routes/tenantInfrastructureRoutes.js
          http-generic-api/routes/tenantLifecycleRoutes.js
          http-generic-api/routes/workspaceResourceRoutes.js
          http-generic-api/scripts/resource-api-callability-contracts.mjs
          http-generic-api/scripts/surface-contract-sql-registry-extractor.mjs
          http-generic-api/scripts/test-manifest.mjs
          http-generic-api/test-resource-api-callability-effect-classes.mjs
          http-generic-api/test-surface-contract-sql-registry-extractor.mjs
          FILES

          while IFS= read -r path; do
            [[ -n "$path" ]] && copy_new_path "$path"
          done <<'FILES'
          http-generic-api/scripts/surface-callability-closure/generate_closure_contracts.mjs
          http-generic-api/test-surface-callability-full-closure.mjs
          FILES

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Regenerate canonical contracts and evidence
        working-directory: http-generic-api
        run: |
          set -euo pipefail
          node scripts/surface-callability-closure/generate_closure_contracts.mjs
          npm run frontend:dispatch:generate
          node scripts/surface-contract-discovery.mjs --write

      - name: Validate syntax and focused closure contracts
        working-directory: http-generic-api
        run: |
          set -euo pipefail
          node --check routes/tenantLifecycleRoutes.js
          node --check routes/workspaceResourceRoutes.js
          node --check routes/tenantInfrastructureRoutes.js
          node --check routes/agentSurfaceRoutes.js
          node --check agentSurfaceRuntimeService.js
          node --check scripts/resource-api-callability-contracts.mjs
          node --check scripts/surface-contract-sql-registry-extractor.mjs
          node --check scripts/surface-callability-closure/generate_closure_contracts.mjs
          node test-surface-contract-sql-registry-extractor.mjs
          node test-resource-api-callability-effect-classes.mjs
          node test-multi-surface-agent-runtime.mjs
          node test-resource-api-coverage.mjs
          node test-surface-callability-full-closure.mjs

      - name: Enforce queue zero and bounded write set
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const queue = JSON.parse(fs.readFileSync('docs/surface-contract-gap-queue.json', 'utf8'));
          if (queue.total_items !== 0 || (queue.top_items || []).length !== 0) {
            console.error(JSON.stringify(queue, null, 2));
            process.exit(1);
          }
          NODE

          rm -f "$RUNNER_PATH"
          git diff --name-only > /tmp/surface-reconstruction-files.txt
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed = [line.strip() for line in Path('/tmp/surface-reconstruction-files.txt').read_text().splitlines() if line.strip()]
          exact = {
              '.github/workflows/surface-callability-main-reconstruction.yml',
              'http-generic-api/agentSurfaceRuntimeService.js',
              'http-generic-api/routes/agentSurfaceRoutes.js',
              'http-generic-api/routes/tenantInfrastructureRoutes.js',
              'http-generic-api/routes/tenantLifecycleRoutes.js',
              'http-generic-api/routes/workspaceResourceRoutes.js',
              'http-generic-api/scripts/resource-api-callability-contracts.mjs',
              'http-generic-api/scripts/surface-callability-closure/generate_closure_contracts.mjs',
              'http-generic-api/scripts/surface-contract-sql-registry-extractor.mjs',
              'http-generic-api/scripts/test-manifest.mjs',
              'http-generic-api/test-resource-api-callability-effect-classes.mjs',
              'http-generic-api/test-surface-contract-sql-registry-extractor.mjs',
              'http-generic-api/test-surface-callability-full-closure.mjs',
              'http-generic-api/resource-api-surface-callability.manifest.json',
              'http-generic-api/surface-contract-classification-evidence.json',
              'http-generic-api/frontend-operation-governance.generated.json',
              'http-generic-api/frontend-surface-dispatch.generated.json',
              'http-generic-api/openapi/frontend-runtime-routes.generated.yaml',
              'docs/surface-contract-safety-attestations.json',
          }
          docs_pattern = re.compile(r'^docs/surface-contract-(?:discovery-status|gap-queue|gap-trends|gap-triage|governance-compact|governance-dashboard)\.(?:json|md)$')
          unexpected = [item for item in changed if item not in exact and not docs_pattern.match(item)]
          if unexpected:
              raise SystemExit('unexpected_surface_reconstruction_writes:' + ','.join(unexpected))
          required = {
              'http-generic-api/resource-api-surface-callability.manifest.json',
              'http-generic-api/test-surface-callability-full-closure.mjs',
              'docs/surface-contract-gap-queue.json',
          }
          missing = sorted(required.difference(changed))
          if missing:
              raise SystemExit('missing_surface_reconstruction_writes:' + ','.join(missing))
          print({'changed_files': len(changed), 'unexpected': 0, 'queue_items': 0})
          PY

      - name: Commit one bounded product result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: reconstruct Surface callability closure on current main'
          git push origin "HEAD:${TARGET_BRANCH}"
