name: Temporary Spec 014 Work Map E2E Contract Writer

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-spec014-bind-work-map-e2e-contract-4033d886.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: tmp-spec014-bind-work-map-e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  bind-contract:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/spec014-final-work-map-binding-main-4033d886-20260804' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      EXPECTED_MAIN_SHA: 4033d886187e87b29a855b9b9a942788dafd88ca
      PRODUCT_EVIDENCE_SHA: a0e18090b45c0d888940c84ec8815a2a74f7b594
      TARGET_BRANCH: gpt/spec014-final-work-map-binding-main-4033d886-20260804
      TEMP_WORKFLOW: .github/workflows/tmp-spec014-bind-work-map-e2e-contract-4033d886.yml
      WORK_MAP_PATH: specs/014-governed-hostinger-storage-orchestration/work-map-integration.json
      CONTRACT_PATH: specs/014-governed-hostinger-storage-orchestration/e2e-phases.json
      REPORT_DIR: .ci-evidence/spec014-work-map-e2e-binding
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable source and bounded initial scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.event.pull_request.base.sha }}" = "${EXPECTED_MAIN_SHA}"
          test "${{ github.event.pull_request.head.ref }}" = "${TARGET_BRANCH}"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${EXPECTED_MAIN_SHA}"
          mapfile -t changed < <(git diff --name-only "${EXPECTED_MAIN_SHA}" HEAD)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx "${WORK_MAP_PATH}"
          printf '%s\n' "${changed[@]}" | grep -Fx "${TEMP_WORKFLOW}"
          test -z "$(git status --porcelain)"

      - name: Bind final Work Map evidence into E2E phase contract
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${REPORT_DIR}"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const contractPath = process.env.CONTRACT_PATH;
          const evidenceSha = process.env.PRODUCT_EVIDENCE_SHA;
          const contract = JSON.parse(fs.readFileSync(contractPath, 'utf8'));
          const workstreams = contract?.parallel_work?.workstreams;
          if (!Array.isArray(workstreams)) throw new Error('parallel_work.workstreams is missing');
          const matches = workstreams.filter((row) => row?.id === 'final-work-map-readback');
          if (matches.length !== 1) throw new Error(`Expected one final-work-map-readback workstream, found ${matches.length}`);
          const target = matches[0];
          if (!target.commit_evidence || typeof target.commit_evidence !== 'object') throw new Error('commit_evidence is missing');
          if (target.commit_evidence.head_sha !== '3fdded3ce97bf024fe9fbb71f362aaf52a3d09f3') {
            throw new Error(`Unexpected prior evidence head: ${target.commit_evidence.head_sha}`);
          }
          if (!Array.isArray(target.commit_evidence.commits)) throw new Error('commit_evidence.commits is missing');
          target.commit_evidence.head_sha = evidenceSha;
          if (!target.commit_evidence.commits.includes(evidenceSha)) target.commit_evidence.commits.push(evidenceSha);
          const output = `${JSON.stringify(contract)}\n`;
          fs.writeFileSync(contractPath, output);
          const report = {
            contract: 'mad4b.spec014-work-map-e2e-binding.v1',
            ok: true,
            workstream_id: target.id,
            prior_head_sha: '3fdded3ce97bf024fe9fbb71f362aaf52a3d09f3',
            bound_product_evidence_sha: evidenceSha,
            commit_count: target.commit_evidence.commits.length,
            contract_sha256: crypto.createHash('sha256').update(output).digest('hex'),
            provider_dispatch_performed: false,
            production_mutation_performed: false,
            database_access_performed: false,
            migration_apply_performed: false,
            secrets_included: false
          };
          fs.writeFileSync(`${process.env.REPORT_DIR}/binding.json`, `${JSON.stringify(report, null, 2)}\n`);
          console.log(JSON.stringify(report));
          NODE
          test -n "$(git diff -- "${CONTRACT_PATH}")"
          git diff --check

      - name: Validate contract and exact final scope
        shell: bash
        run: |
          set -Eeuo pipefail
          node -e "const c=require('./${CONTRACT_PATH}');const w=c.parallel_work.workstreams.filter(x=>x.id==='final-work-map-readback');if(w.length!==1||w[0].commit_evidence.head_sha!=='${PRODUCT_EVIDENCE_SHA}'||!w[0].commit_evidence.commits.includes('${PRODUCT_EVIDENCE_SHA}'))process.exit(1)"
          node http-generic-api/scripts/e2e-phase-governance-self-test.mjs
          git rm "${TEMP_WORKFLOW}"
          git add "${CONTRACT_PATH}"
          mapfile -t final_paths < <(git diff --name-only "${EXPECTED_MAIN_SHA}")
          test "${#final_paths[@]}" -eq 2
          printf '%s\n' "${final_paths[@]}" | grep -Fx "${WORK_MAP_PATH}"
          printf '%s\n' "${final_paths[@]}" | grep -Fx "${CONTRACT_PATH}"
          test ! -e "${TEMP_WORKFLOW}"
          git diff --cached --check

      - name: Publish self-cleaned bounded candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_before="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_before}" = "$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(spec-014): bind final Work Map evidence to E2E contract'
          result_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:${TARGET_BRANCH}"
          for attempt in {1..20}; do
            remote_after="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
            if [[ "${remote_after}" = "${result_sha}" ]]; then break; fi
            sleep 2
          done
          test "${remote_after}" = "${result_sha}"
          echo "result_sha=${result_sha}" >> "${GITHUB_OUTPUT}"

      - name: Upload bounded no-secret evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec014-work-map-e2e-binding-${{ github.run_id }}
          path: .ci-evidence/spec014-work-map-e2e-binding/*
          if-no-files-found: warn
          retention-days: 30
