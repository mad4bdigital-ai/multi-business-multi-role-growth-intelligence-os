name: Generated Artifact Dispatch JSON Null Repair 6626 Once

on:
  push:
    branches:
      - fix/generated-artifact-refresh-eligible-request-json-20260807

permissions:
  contents: write

concurrency:
  group: generated-artifact-dispatch-json-null-repair-6626
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_REF: fix/generated-artifact-refresh-eligible-request-json-20260807
      EXPECTED_PARENT_SHA: 4a380f17c06bc789b6ad725d5cc16fa4c7fda95f
      WRITER_PATH: .github/workflows/generated-artifact-dispatch-json-null-repair-6626-once.yml
      WORKFLOW_PATH: .github/workflows/governed-generated-artifact-refresh-dispatch-v2.yml
      TEST_PATH: http-generic-api/test-governed-generated-artifact-refresh-dispatch-workflow.mjs
      CONTRACT_PATH: .changes/e2e/governed-generated-artifact-refresh-dispatch.json
      DIAG_DIR: .ci-evidence/generated-artifact-dispatch-json-null-repair-6626
    steps:
      - name: Checkout bounded work branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0
          persist-credentials: true

      - name: Validate one-shot identity and parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT_SHA}"
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "${WRITER_PATH}"

      - name: Patch optional dispatch evidence fields and regressions
        shell: bash
        run: |
          set -euo pipefail
          git rm -- "${WRITER_PATH}"
          python <<'PY'
          from pathlib import Path
          import json

          workflow_path = Path('.github/workflows/governed-generated-artifact-refresh-dispatch-v2.yml')
          workflow = workflow_path.read_text()
          old_request = 'github_request_id:($request_id|select(length>0))'
          new_request = 'github_request_id:(if ($request_id|length)>0 then $request_id else null end)'
          old_conclusion = 'delegated_run_conclusion:($delegated_run_conclusion|select(length>0))'
          new_conclusion = 'delegated_run_conclusion:(if ($delegated_run_conclusion|length)>0 then $delegated_run_conclusion else null end)'
          assert workflow.count(old_request) == 3, workflow.count(old_request)
          assert workflow.count(old_conclusion) == 1, workflow.count(old_conclusion)
          workflow = workflow.replace(old_request, new_request).replace(old_conclusion, new_conclusion)
          assert old_request not in workflow
          assert old_conclusion not in workflow
          workflow_path.write_text(workflow)

          test_path = Path('http-generic-api/test-governed-generated-artifact-refresh-dispatch-workflow.mjs')
          test = test_path.read_text()
          anchor = 'assert.match(workflow, /workflow_conclusion="success"/u, "passed or skipped evidence must be published as a successful decision");\n'
          addition = (
              'assert.doesNotMatch(workflow, /github_request_id:\\(\\$request_id\\|select\\(length>0\\)\\)/u, "optional request IDs must not filter the dispatch report object");\n'
              'assert.match(workflow, /github_request_id:\\(if \\(\\$request_id\\|length\\)>0 then \\$request_id else null end\\)/u, "missing request IDs must be encoded as JSON null");\n'
              'assert.doesNotMatch(workflow, /delegated_run_conclusion:\\(\\$delegated_run_conclusion\\|select\\(length>0\\)\\)/u, "queued delegated runs must not filter the dispatch report object");\n'
              'assert.match(workflow, /delegated_run_conclusion:\\(if \\(\\$delegated_run_conclusion\\|length\\)>0 then \\$delegated_run_conclusion else null end\\)/u, "an unfinished delegated run conclusion must be encoded as JSON null");\n'
          )
          assert anchor in test
          assert 'optional request IDs must not filter the dispatch report object' not in test
          test = test.replace(anchor, anchor + addition)
          assert 'tests: 46,' in test
          test = test.replace('tests: 46,', 'tests: 50,')
          test_path.write_text(test)

          contract_path = Path('.changes/e2e/governed-generated-artifact-refresh-dispatch.json')
          contract = json.loads(contract_path.read_text())
          journey = contract['phases'][0]['e2e_journeys'][0]
          step = 'Emit non-empty canonical dispatch JSON even when optional GitHub request IDs or delegated-run conclusions are absent, encoding absent optional values as JSON null.'
          if step not in journey['steps']:
              journey['steps'].insert(-1, step)
          assertions = [
              'Optional GitHub request IDs never filter out the dispatch object; an absent request ID is represented as JSON null.',
              'A delegated run that is queued or in progress may have no conclusion; the absent conclusion is represented as JSON null without deleting the dispatch object.'
          ]
          for assertion in assertions:
              if assertion not in journey['assertions']:
                  journey['assertions'].append(assertion)
          contract_path.write_text(json.dumps(contract, indent=2) + '\n')
          PY

      - name: Capture focused contract diagnostics
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "${DIAG_DIR}"
          set +e
          (cd http-generic-api && node test-governed-generated-artifact-refresh-dispatch-workflow.mjs) > "${DIAG_DIR}/dispatch-test.log" 2>&1
          dispatch_status=$?
          (cd http-generic-api && node test-governed-generated-artifact-refresh-pr-target-bridge.mjs) > "${DIAG_DIR}/bridge-test.log" 2>&1
          bridge_status=$?
          node -e "JSON.parse(require('node:fs').readFileSync('.changes/e2e/governed-generated-artifact-refresh-dispatch.json','utf8'))" > "${DIAG_DIR}/contract-parse.log" 2>&1
          contract_status=$?
          set -e
          git diff -- "${WORKFLOW_PATH}" "${TEST_PATH}" "${CONTRACT_PATH}" > "${DIAG_DIR}/candidate.diff"
          printf '{"dispatch_status":%s,"bridge_status":%s,"contract_status":%s,"bridge_status_role":"diagnostic_only"}\n' "${dispatch_status}" "${bridge_status}" "${contract_status}" > "${DIAG_DIR}/status.json"

      - name: Upload focused contract diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-artifact-dispatch-json-null-repair-6626-${{ github.run_id }}
          path: ${{ env.DIAG_DIR }}
          if-no-files-found: error
          retention-days: 7

      - name: Enforce dispatch repair contracts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const status = JSON.parse(fs.readFileSync(process.env.DIAG_DIR + '/status.json', 'utf8'));
          if (status.dispatch_status !== 0 || status.contract_status !== 0) {
            console.error(status);
            process.exit(1);
          }
          if (status.bridge_status !== 0) {
            console.log(`Unrelated bridge baseline diagnostic remains non-zero: ${status.bridge_status}`);
          }
          NODE

      - name: Commit bounded repair and self-retire
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- "${WORKFLOW_PATH}" "${TEST_PATH}" "${CONTRACT_PATH}"
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected="$(printf '%s\n' "${CONTRACT_PATH}" "${WRITER_PATH}" "${WORKFLOW_PATH}" "${TEST_PATH}" | sort)"
          actual="$(printf '%s\n' "${staged[@]}")"
          test "${actual}" = "${expected}"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ci): preserve optional generated refresh dispatch evidence'
          git push origin "HEAD:${TARGET_REF}"
