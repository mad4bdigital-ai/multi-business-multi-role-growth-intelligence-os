name: Exact CI Recovery Extended Validation 5544 V2

on:
  pull_request:
    branches:
      - gpt/validate-ci-recovery-extended-5544-b991e0-v2
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: exact-ci-recovery-extended-5544-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Exact Candidate Preflight
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/fix-ci-recovery-exact-checkout-provenance-current-main-b991e0-20260803' &&
      github.event.pull_request.head.sha == '55c934e0e3e6bdf14817aaa5d4442816051a4545'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    outputs:
      main_sha: ${{ steps.verify.outputs.main_sha }}
      head_sha: ${{ steps.verify.outputs.head_sha }}
    env:
      EXPECTED_MAIN_SHA: b991e0ae9ee9beb43582444d7f7f5a1a0c5768fe
      EXPECTED_HEAD_SHA: 55c934e0e3e6bdf14817aaa5d4442816051a4545
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable identity and scope
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          test "$(git rev-parse HEAD^1)" = "${EXPECTED_MAIN_SHA}"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "${EXPECTED_MAIN_SHA}"
          mapfile -t files < <(git diff --name-only "${EXPECTED_MAIN_SHA}"..."${EXPECTED_HEAD_SHA}")
          test "${#files[@]}" -eq 3
          test "${files[0]}" = '.changes/e2e/ci-pull-request-recovery-exact-checkout-provenance.json'
          test "${files[1]}" = '.github/workflows/ci-pull-request-recovery.yml'
          test "${files[2]}" = 'http-generic-api/test-ci-pull-request-recovery-exact-checkout-provenance.mjs'
          test "$(git rev-parse "${EXPECTED_HEAD_SHA}:.changes/e2e/ci-pull-request-recovery-exact-checkout-provenance.json")" = 'c946e3e7878bae8f6cac5960912ef90b64ccecb8'
          test "$(git rev-parse "${EXPECTED_HEAD_SHA}:.github/workflows/ci-pull-request-recovery.yml")" = 'e21882316db92fcccd2b67d4ff60b7f5b3e6cdb7'
          test "$(git rev-parse "${EXPECTED_HEAD_SHA}:http-generic-api/test-ci-pull-request-recovery-exact-checkout-provenance.mjs")" = 'b1de449e9c762e11782841516a10356d724ef902'
          printf 'main_sha=%s\n' "${EXPECTED_MAIN_SHA}" >> "${GITHUB_OUTPUT}"
          printf 'head_sha=%s\n' "${EXPECTED_HEAD_SHA}" >> "${GITHUB_OUTPUT}"

  lifecycle:
    name: Repository Tool Lifecycle
    needs: preflight
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      BASE_SHA: ${{ needs.preflight.outputs.main_sha }}
      CANDIDATE_SHA: ${{ needs.preflight.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Evaluate canonical lifecycle policy
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs
          git diff --name-status "${BASE_SHA}" "${CANDIDATE_SHA}" > "${RUNNER_TEMP}/repository-tool-changes.tsv"
          node http-generic-api/scripts/maintenance-tools/repository-tool-lifecycle-guard.mjs \
            --changed-files "${RUNNER_TEMP}/repository-tool-changes.tsv" \
            --policy .github/repository-maintenance-tool-governance.json \
            --output-dir "${RUNNER_TEMP}/repository-tool-lifecycle"
      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-ci-recovery-lifecycle-5544-${{ github.run_id }}
          path: ${{ runner.temp }}/repository-tool-lifecycle/
          if-no-files-found: error
          retention-days: 14

  contract:
    name: E2E Contract Reference Integrity
    needs: preflight
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      BASE_SHA: ${{ needs.preflight.outputs.main_sha }}
      CANDIDATE_SHA: ${{ needs.preflight.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate contract and Git index references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/contract-reference"
          node http-generic-api/test-e2e-contract-reference-integrity.mjs
          node http-generic-api/test-e2e-contract-git-index-integrity.mjs
          node http-generic-api/scripts/e2e-contract-reference-integrity.mjs \
            --base "${BASE_SHA}" \
            --head "${CANDIDATE_SHA}" \
            --report-file "${RUNNER_TEMP}/contract-reference/e2e-contract-reference-integrity.json"
          node http-generic-api/scripts/e2e-contract-git-index-integrity.mjs \
            --report-file "${RUNNER_TEMP}/contract-reference/e2e-contract-reference-integrity.json"
      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-ci-recovery-contract-5544-${{ github.run_id }}
          path: ${{ runner.temp }}/contract-reference/
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend Deterministic Parity
    needs: preflight
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json
      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci
      - name: Generate and enforce deterministic parity
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          CANONICAL_BASELINE_REF=main TARGET_REF=main npm run frontend:dispatch:generate -- --baseline-ref=main
          node test-frontend-dispatch-workflow-baseline.mjs
          node test-frontend-operation-governance-generator.mjs
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-openapi-route-coverage.mjs
          npm run openapi:auth:check
          git status --porcelain > "${RUNNER_TEMP}/frontend-status.txt"
          unexpected="$(awk '{print $2}' "${RUNNER_TEMP}/frontend-status.txt" | grep -Ev '^(frontend-operation-governance\.generated\.json|frontend-surface-dispatch\.generated\.json|openapi/frontend-runtime-routes\.generated\.yaml)$' || true)"
          test -z "${unexpected}"
          generated="$(git status --porcelain -- frontend-operation-governance.generated.json frontend-surface-dispatch.generated.json openapi/frontend-runtime-routes.generated.yaml)"
          if [[ -n "${generated}" ]]; then
            git diff --no-ext-diff --unified=1 -- frontend-operation-governance.generated.json frontend-surface-dispatch.generated.json openapi/frontend-runtime-routes.generated.yaml > "${RUNNER_TEMP}/frontend-generated.diff" || true
            exit 1
          fi
      - name: Upload frontend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-ci-recovery-frontend-5544-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/frontend-status.txt
            ${{ runner.temp }}/frontend-generated.diff
          if-no-files-found: warn
          retention-days: 14

  decision:
    name: Exact Extended Decision
    if: always()
    needs: [preflight, lifecycle, contract, frontend]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Publish no-secret decision
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          LIFECYCLE_RESULT: ${{ needs.lifecycle.result }}
          CONTRACT_RESULT: ${{ needs.contract.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg preflight "${PREFLIGHT_RESULT}" \
            --arg lifecycle "${LIFECYCLE_RESULT}" \
            --arg contract "${CONTRACT_RESULT}" \
            --arg frontend "${FRONTEND_RESULT}" \
            '{contract:"mad4b.exact-ci-recovery-extended-validation.v2",base_sha:"b991e0ae9ee9beb43582444d7f7f5a1a0c5768fe",head_sha:"55c934e0e3e6bdf14817aaa5d4442816051a4545",results:{preflight:$preflight,lifecycle:$lifecycle,contract:$contract,frontend:$frontend},candidate_mutated:false,main_mutated:false,production_mutated:false,provider_call:false,credential_read:false,sql_executed:false,migration_apply:false,database_mutated:false,external_send:false,secrets_included:false}' \
            > "${RUNNER_TEMP}/exact-ci-recovery-extended-validation-v2.json"
      - uses: actions/upload-artifact@v4
        with:
          name: exact-ci-recovery-extended-decision-5544-${{ github.run_id }}
          path: ${{ runner.temp }}/exact-ci-recovery-extended-validation-v2.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce decision
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          LIFECYCLE_RESULT: ${{ needs.lifecycle.result }}
          CONTRACT_RESULT: ${{ needs.contract.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          test "${PREFLIGHT_RESULT}" = success
          test "${LIFECYCLE_RESULT}" = success
          test "${CONTRACT_RESULT}" = success
          test "${FRONTEND_RESULT}" = success
