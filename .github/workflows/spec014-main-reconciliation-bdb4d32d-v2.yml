name: Spec014 Main Reconciliation bdb4d32d V2

on:
  push:
    branches:
      - gpt/reconcile-spec014-main-bdb4d32d-20260802-v2
    paths:
      - '.github/workflows/spec014-main-reconciliation-bdb4d32d-v2.yml'
      - '.github/scripts/spec014-main-reconciliation-bdb4d32d-v2.sh'
  pull_request:
    branches:
      - gpt/hostinger-safe-storage-cleanup-ssh-20260801
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - '.github/workflows/spec014-main-reconciliation-bdb4d32d-v2.yml'
      - '.github/scripts/spec014-main-reconciliation-bdb4d32d-v2.sh'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: spec014-main-reconciliation-bdb4d32d-v2
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'gpt/reconcile-spec014-main-bdb4d32d-20260802-v2')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_REF: gpt/reconcile-spec014-main-bdb4d32d-20260802-v2
      INTEGRATION_REF: gpt/hostinger-safe-storage-cleanup-ssh-20260801
      CREATION_INTEGRATION_SHA: 6684e7058e3b19dbbc37b4004f5531d5e8a7c24d
      MINIMUM_MAIN_SHA: bdb4d32d12fd96e0a0034fd7b1186faf2c7075f0
      LAUNCHER_PATH: .github/workflows/spec014-main-reconciliation-bdb4d32d-v2.yml
      RECONCILIATION_SCRIPT: .github/scripts/spec014-main-reconciliation-bdb4d32d-v2.sh
      REPORT_DIR: .ci-evidence/spec014-main-reconciliation-bdb4d32d-v2
      NORMALIZED_OPENAPI_PATH: /admin/support/tickets/{ticket_id}/external-delivery/completion-certification
      NORMALIZED_OPENAPI_REF: ./openapi/support-ticket-runtime-completion.yaml#/certifyAdminSupportTicketExternalDeliveryCompletion
    steps:
      - name: Checkout exact launcher head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Scope whitespace validation to reconciliation outputs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path(os.environ['RECONCILIATION_SCRIPT'])
          text = path.read_text(encoding='utf-8')
          old = '''if [[ "${#generated_paths[@]}" -gt 0 ]]; then
            git add -- "${generated_paths[@]}"
          fi
          [[ -z "$(git diff --name-only)" ]]
          git diff --cached --check
          '''
          new = '''if [[ "${#generated_paths[@]}" -gt 0 ]]; then
            git add -- "${generated_paths[@]}"
            git diff --cached --check -- "${generated_paths[@]}"
          fi
          [[ -z "$(git diff --name-only)" ]]
          '''
          if text.count(old) != 1:
              raise SystemExit(f'generated write-set block count must be 1, got {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git add -- "${RECONCILIATION_SCRIPT}"

      - name: Build, validate, and push bounded reconciliation
        shell: bash
        run: bash "${RECONCILIATION_SCRIPT}"

      - name: Upload canonical reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec014-main-reconciliation-bdb4d32d-v2-${{ github.run_id }}
          path: ${{ env.REPORT_DIR }}/
          if-no-files-found: error
          retention-days: 30
