name: Exact Work Map Writer ARM Validation 5490 v2

on:
  pull_request:
    branches:
      - gpt/validate-work-map-writer-arm-base-5490-c7f7be81
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: exact-work-map-writer-arm-validation-5490-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  focused:
    name: Exact Preflight and Writer Contracts
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    outputs:
      head_sha: ${{ steps.identity.outputs.head_sha }}
      main_sha: ${{ steps.identity.outputs.main_sha }}
    steps:
      - name: Initialize durable diagnostics
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/work-map-writer-5490-v2"
          mkdir -p "$root"
          printf 'index\tname\tstatus\tlog\n' > "$root/results.tsv"
          printf 'DIAGNOSTIC_ROOT=%s\n' "$root" >> "$GITHUB_ENV"

      - name: Checkout exact candidate with read-only token
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Verify immutable identity and run focused contracts
        id: identity
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_HEAD_REF: gpt/work-map-writer-diagnostics-v3-20260803
          EXPECTED_HEAD_SHA: 3f15080c4f6374c877a0a7f6ee748c863b04e175
          EXPECTED_MAIN_SHA: c7f7be81b811caf3c1112372ab1089fc5ee3714c
        run: |
          set -uo pipefail
          run_check() {
            local index="$1"
            local name="$2"
            local command="$3"
            local log="$DIAGNOSTIC_ROOT/$(printf '%02d' "$index")-${name}.log"
            set +e
            bash -lc "$command" >"$log" 2>&1
            local status=$?
            set -e
            cat "$log"
            printf '%s\t%s\t%s\t%s\n' "$index" "$name" "$status" "$(basename "$log")" >> "$DIAGNOSTIC_ROOT/results.tsv"
          }

          run_check 1 head-repository 'test "$HEAD_REPOSITORY" = "$REPOSITORY"'
          run_check 2 head-ref 'test "$HEAD_REF" = "$EXPECTED_HEAD_REF"'
          run_check 3 event-head-sha 'test "$HEAD_SHA" = "$EXPECTED_HEAD_SHA"'
          run_check 4 checkout-head-sha 'test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"'
          run_check 5 fetch-exact-refs 'git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main" "+refs/heads/${EXPECTED_HEAD_REF}:refs/remotes/origin/${EXPECTED_HEAD_REF}"'
          run_check 6 remote-main-sha 'test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN_SHA"'
          run_check 7 remote-head-sha 'test "$(git rev-parse refs/remotes/origin/${EXPECTED_HEAD_REF})" = "$EXPECTED_HEAD_SHA"'
          run_check 8 main-is-ancestor 'git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" "$EXPECTED_HEAD_SHA"'
          run_check 9 ahead-count 'test "$(git rev-list --count "${EXPECTED_MAIN_SHA}..${EXPECTED_HEAD_SHA}")" = "3"'
          run_check 10 exact-diff-scope 'test "$(git diff --name-only "$EXPECTED_MAIN_SHA"..."$EXPECTED_HEAD_SHA" | wc -l | tr -d " ")" = "1" && test "$(git diff --name-only "$EXPECTED_MAIN_SHA"..."$EXPECTED_HEAD_SHA")" = ".github/workflows/spec-kit-work-map-autofix.yml"'

          run_check 11 generator-syntax 'node --check http-generic-api/scripts/platform-work-map-generator.mjs'
          run_check 12 schema-intelligence-syntax 'node --check http-generic-api/scripts/platform-work-map-schema-intelligence.mjs'
          run_check 13 schema-classification-syntax 'node --check http-generic-api/scripts/work-map-schema-classification.mjs'
          run_check 14 schema-contract-syntax 'node --check http-generic-api/scripts/work-map-schema-classification-contract.mjs'
          run_check 15 connectivity-syntax 'node --check http-generic-api/scripts/pipeline-connectivity-check.mjs'
          run_check 16 connectivity-check 'node http-generic-api/scripts/pipeline-connectivity-check.mjs'
          run_check 17 connectivity-test 'node http-generic-api/test-pipeline-connectivity-check.mjs'
          run_check 18 schema-contract-runtime 'node http-generic-api/scripts/work-map-schema-classification-contract.mjs'
          run_check 19 schema-classification-runtime 'node http-generic-api/scripts/work-map-schema-classification.mjs'
          run_check 20 schema-classification-test 'node http-generic-api/test-work-map-schema-classification.mjs'
          run_check 21 schema-contract-test 'node http-generic-api/test-work-map-schema-classification-contract.mjs'
          run_check 22 supervisor-assurance-test 'node http-generic-api/test-supervisor-runtime-assurance-automation.mjs'
          run_check 23 workflow-diff-check 'git diff --check'
          run_check 24 diagnostic-contract 'workflow=.github/workflows/spec-kit-work-map-autofix.yml; grep -F "validation-results.tsv" "$workflow" && grep -F "validation-summary.md" "$workflow" && grep -F "Validate generator and governance contracts" "$workflow" && grep -F "test \"\${failed}\" = \"0\"" "$workflow" && test "$(grep -nF "Validate generator and governance contracts" "$workflow" | head -1 | cut -d: -f1)" -lt "$(grep -nF "Regenerate and prove idempotency" "$workflow" | head -1 | cut -d: -f1)"'

          {
            echo '# Exact Work Map writer validation'
            echo
            echo '| # | Check | Exit | Log |'
            echo '|---:|---|---:|---|'
            tail -n +2 "$DIAGNOSTIC_ROOT/results.tsv" | while IFS=$'\t' read -r index name status log; do
              printf '| %s | `%s` | `%s` | `%s` |\n' "$index" "$name" "$status" "$log"
            done
          } > "$DIAGNOSTIC_ROOT/summary.md"
          cat "$DIAGNOSTIC_ROOT/summary.md"

          failures="$(awk -F '\t' 'NR > 1 && $3 != 0 { count++ } END { print count+0 }' "$DIAGNOSTIC_ROOT/results.tsv")"
          printf 'failure_count=%s\n' "$failures" > "$DIAGNOSTIC_ROOT/result.env"
          printf 'head_sha=%s\n' "$EXPECTED_HEAD_SHA" >> "$GITHUB_OUTPUT"
          printf 'main_sha=%s\n' "$EXPECTED_MAIN_SHA" >> "$GITHUB_OUTPUT"
          test "$failures" = "0"

      - name: Upload focused exact-head diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-work-map-writer-5490-v2-focused-${{ github.run_id }}
          path: ${{ runner.temp }}/work-map-writer-5490-v2
          if-no-files-found: error
          retention-days: 14

  unit:
    name: Unit and Integration Tests
    needs: focused
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.focused.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json
      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci
      - name: Run complete ordered test suite
        working-directory: http-generic-api
        env:
          GITHUB_SHA: ${{ needs.focused.outputs.head_sha }}
          TEST_SUITE_REPORT_DIR: ${{ runner.temp }}/test-suite-reports
        run: npm test
      - name: Upload ordered test progress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-work-map-writer-5490-v2-test-progress-${{ github.run_id }}
          path: ${{ runner.temp }}/test-suite-reports/*.json
          if-no-files-found: warn
          retention-days: 14

  resolver:
    name: Execution Resolver Gate
    needs: focused
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.focused.outputs.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --runInBand

  architecture:
    name: Architecture Drift Detection
    needs: focused
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.focused.outputs.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json
      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci
      - name: Run architecture validation
        working-directory: http-generic-api
        run: npm run validate

  e2e:
    name: E2E Phase Governance
    needs: focused
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.focused.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Evaluate and execute exact changed phase
        shell: bash
        env:
          BASE_SHA: ${{ needs.focused.outputs.main_sha }}
          HEAD_SHA: ${{ needs.focused.outputs.head_sha }}
        run: |
          set -euo pipefail
          node http-generic-api/scripts/e2e-phase-governance.mjs check --base "$BASE_SHA" --head "$HEAD_SHA" --report-file "$RUNNER_TEMP/e2e-phase-evaluation.json"
          node http-generic-api/scripts/e2e-phase-governance.mjs run --base "$BASE_SHA" --head "$HEAD_SHA" --report-file "$RUNNER_TEMP/e2e-phase-evaluation-run.json" --execution-report-file "$RUNNER_TEMP/e2e-phase-execution.json"
      - name: Upload exact E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-work-map-writer-5490-v2-e2e-${{ github.run_id }}
          path: ${{ runner.temp }}/e2e-phase-*.json
          if-no-files-found: error
          retention-days: 14
