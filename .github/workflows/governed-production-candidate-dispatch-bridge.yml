name: Governed Production Candidate Dispatch Request
run-name: Governed Production Candidate Dispatch Request · ${{ github.event.issue.number || inputs.request_pr || github.event.pull_request.number || github.run_id }}

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/governed-production-candidate-dispatch-bridge.yml"
      - ".github/workflows/governed-production-candidate-dispatch-push-fallback.yml"
      - ".github/workflows/governed-production-candidate-dispatch-request-dispatcher.yml"
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      request_pr:
        description: Open same-repository Production synchronization request PR
        required: true
        type: string
      expected_head_sha:
        description: Exact current 40-character request PR head SHA
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: governed-production-candidate-dispatch-request-${{ github.event.issue.number || inputs.request_pr || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  static-contract:
    name: Validate bounded dispatch bridge contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify read-only request and REST dispatcher surfaces
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_FILE=.github/workflows/governed-production-candidate-dispatch-bridge.yml
          FALLBACK_FILE=.github/workflows/governed-production-candidate-dispatch-push-fallback.yml
          DISPATCHER_FILE=.github/workflows/governed-production-candidate-dispatch-request-dispatcher.yml
          test -f "$DISPATCHER_FILE"
          grep -Fq "DISPATCH_GOVERNED_PRODUCTION_CANDIDATE_BUILDER" "$REQUEST_FILE"
          grep -Fq "mad4b.governed-production-candidate-dispatch-request.v1" "$REQUEST_FILE"
          grep -Fq "mad4b.governed-production-candidate-dispatch-request.v1" "$FALLBACK_FILE"
          grep -Fq "production-promotion-candidate.yml" "$DISPATCHER_FILE"
          grep -Fq "expected_head_sha" "$DISPATCHER_FILE"
          grep -Fq "expected_main_sha" "$DISPATCHER_FILE"
          grep -Fq "expected_production_sha" "$DISPATCHER_FILE"
          POST_METHOD='--method '"POST"
          grep -Fq "gh api ${POST_METHOD}" "$DISPATCHER_FILE"
          if grep -Eq '^[[:space:]]+gh pr comment[[:space:]]' "$REQUEST_FILE" "$FALLBACK_FILE" "$DISPATCHER_FILE"; then
            echo "::error::Production candidate dispatch evidence must use the REST issue-comments endpoint"
            exit 1
          fi
          node - "$REQUEST_FILE" "$FALLBACK_FILE" <<'NODE'
          const fs = require('node:fs');
          const files = process.argv.slice(2);
          const forbidden = [
            'gh workflow' + ' run',
            '--method ' + 'POST',
            'git ' + 'push',
            'contents:' + ' write',
            'issues:' + ' write',
            'actions:' + ' write',
          ];
          for (const file of files) {
            const content = fs.readFileSync(file, 'utf8');
            for (const token of forbidden) {
              if (content.includes(token)) {
                console.error(`::error file=${file}::read-only request stage contains forbidden write surface: ${token}`);
                process.exit(1);
              }
            }
          }
          NODE

  required-check-compatibility:
    name: Dispatch exact current-ref candidate builder
    if: github.event_name == 'pull_request'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm mutation is delegated to trusted dispatcher
        shell: bash
        run: |
          set -euo pipefail
          echo "Legacy check identity preserved; write authority is delegated to the trusted request dispatcher."

  request:
    name: Publish exact-head read-only dispatch request
    if: github.event_name == 'issue_comment' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      REQUEST_PR: ${{ github.event_name == 'workflow_dispatch' && inputs.request_pr || github.event.issue.number }}
      MANUAL_EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha || '' }}
      COMMENT_BODY: ${{ github.event.comment.body || '' }}
      AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association || '' }}
      HAS_PULL_REQUEST: ${{ github.event.issue.pull_request != null }}
      REPORT_DIR: /tmp/governed-production-candidate-dispatch-request
    steps:
      - name: Evaluate exact request without repository mutation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${REPORT_DIR}"
          mkdir -p "${REPORT_DIR}"
          [[ "${REQUEST_PR}" =~ ^[1-9][0-9]*$ ]]

          outcome="eligible"
          reason=""
          if [[ "${GITHUB_EVENT_NAME}" == "issue_comment" ]]; then
            if [[ "${HAS_PULL_REQUEST}" != "true" ]]; then
              outcome="skipped"
              reason="comment_is_not_on_pull_request"
            elif [[ "${COMMENT_BODY}" != "DISPATCH_GOVERNED_PRODUCTION_CANDIDATE_BUILDER" ]]; then
              outcome="skipped"
              reason="dispatch_token_absent"
            else
              case "${AUTHOR_ASSOCIATION}" in
                OWNER|MEMBER|COLLABORATOR) ;;
                *) outcome="blocked"; reason="untrusted_comment_author" ;;
              esac
            fi
          elif [[ ! "${MANUAL_EXPECTED_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            outcome="blocked"
            reason="invalid_manual_expected_head_sha"
          fi

          target_ref=""
          expected_head_sha=""
          main_sha=""
          production_sha=""

          if [[ "${outcome}" == "eligible" ]]; then
            pr="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${REPOSITORY}/pulls/${REQUEST_PR}")"
            title="$(jq -r '.title' <<<"${pr}")"
            state="$(jq -r '.state' <<<"${pr}")"
            draft="$(jq -r '.draft' <<<"${pr}")"
            base_ref="$(jq -r '.base.ref' <<<"${pr}")"
            target_ref="$(jq -r '.head.ref' <<<"${pr}")"
            head_repository="$(jq -r '.head.repo.full_name' <<<"${pr}")"
            expected_head_sha="$(jq -r '.head.sha' <<<"${pr}")"

            if [[ "${title}" != "ops: request governed Production synchronization" ]]; then
              outcome="blocked"; reason="unexpected_request_title"
            elif [[ "${state}" != "open" ]]; then
              outcome="blocked"; reason="request_pull_request_not_open"
            elif [[ "${draft}" == "true" ]]; then
              outcome="blocked"; reason="request_pull_request_is_draft"
            elif [[ "${base_ref}" != "main" ]]; then
              outcome="blocked"; reason="unexpected_base_branch"
            elif [[ "${head_repository}" != "${REPOSITORY}" ]]; then
              outcome="blocked"; reason="cross_repository_request_forbidden"
            elif [[ ! "${target_ref}" =~ ^(gpt|cert|fix|feat|chore|docs|release)/[A-Za-z0-9._/-]+$ ]]; then
              outcome="blocked"; reason="invalid_governed_request_branch"
            elif [[ "${target_ref}" == "main" || "${target_ref}" == "Production" ]]; then
              outcome="blocked"; reason="protected_request_branch_forbidden"
            elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${expected_head_sha}" != "${MANUAL_EXPECTED_HEAD_SHA}" ]]; then
              outcome="blocked"; reason="request_head_mismatch"
            fi

            main_sha="$(gh api "/repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
            production_sha="$(gh api "/repos/${REPOSITORY}/git/ref/heads/Production" --jq '.object.sha')"
            [[ "${expected_head_sha}" =~ ^[0-9a-f]{40}$ ]]
            [[ "${main_sha}" =~ ^[0-9a-f]{40}$ ]]
            [[ "${production_sha}" =~ ^[0-9a-f]{40}$ ]]
          fi

          jq -n \
            --arg contract "mad4b.governed-production-candidate-dispatch-request.v1" \
            --arg outcome "${outcome}" \
            --arg reason "${reason}" \
            --arg target_ref "${target_ref}" \
            --arg expected_head_sha "${expected_head_sha}" \
            --arg expected_main_sha "${main_sha}" \
            --arg expected_production_sha "${production_sha}" \
            --arg source_event "${GITHUB_EVENT_NAME}" \
            --argjson request_pr "${REQUEST_PR}" \
            --argjson source_run_id "${GITHUB_RUN_ID}" \
            '{contract:$contract,outcome:$outcome,reason:(if ($reason|length)>0 then $reason else null end),request_pr:$request_pr,target_ref:(if ($target_ref|length)>0 then $target_ref else null end),expected_head_sha:(if ($expected_head_sha|length)>0 then $expected_head_sha else null end),expected_main_sha:(if ($expected_main_sha|length)>0 then $expected_main_sha else null end),expected_production_sha:(if ($expected_production_sha|length)>0 then $expected_production_sha else null end),source_run_id:$source_run_id,source_event:$source_event,candidate_code_checkout:false,repository_mutation_performed:false,merge_executed:false,deployment_executed:false,migration_executed:false,provider_call_executed:false,credential_payload_read:false,secrets_included:false}' \
            > "${REPORT_DIR}/request.json"

      - name: Upload exact-head dispatch request
        uses: actions/upload-artifact@v4
        with:
          name: governed-production-candidate-dispatch-request-${{ github.run_id }}
          path: ${{ env.REPORT_DIR }}/request.json
          if-no-files-found: error
          retention-days: 14
