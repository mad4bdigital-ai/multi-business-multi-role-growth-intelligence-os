name: Custom GPT Guard Incident Governed Dispatch

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed Custom GPT Contract Guard run ID on main
        required: true
        type: string
      expected_head_sha:
        description: Exact protected main HEAD (40-character SHA)
        required: true
        type: string
      confirmation:
        description: Explicit authorization for GitHub Issue lifecycle only
        required: true
        type: choice
        options:
          - AUTHORIZE_GUARD_INCIDENT_ISSUE_UPDATE

permissions:
  contents: read

jobs:
  authorize:
    name: Validate exact main HEAD and completed guard source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      result: ${{ steps.verify.outputs.result }}
    steps:
      - name: Validate trusted source and protected branch
        id: verify
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const mainBranch = context.payload.repository.default_branch;
            const expected_head_sha = process.env.EXPECTED_HEAD_SHA || "";
            const sourceRunId = Number(process.env.SOURCE_RUN_ID);
            if (mainBranch !== "main" || mainBranch === "Production"
              || context.ref !== "refs/heads/main"
              || process.env.CONFIRMATION !== "AUTHORIZE_GUARD_INCIDENT_ISSUE_UPDATE"
              || !/^[a-f0-9]{40}$/.test(expected_head_sha)
              || !Number.isSafeInteger(sourceRunId) || sourceRunId < 1) {
              throw new Error("incident_writer_invalid_explicit_authorization");
            }
            const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: mainBranch });
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: sourceRunId });
            if (branch.commit.sha !== expected_head_sha
              || run.head_sha !== expected_head_sha || run.head_branch !== mainBranch
              || run.name !== "Custom GPT Contract Guard" || run.status !== "completed"
              || !["push", "schedule", "workflow_dispatch"].includes(run.event)
              || run.repository?.full_name !== `${owner}/${repo}`) {
              throw new Error("incident_writer_expected_head_sha_or_source_run_mismatch");
            }
            core.setOutput("result", run.conclusion || "unknown");

  mutate-incident:
    name: Governed GitHub Issue lifecycle
    needs: authorize
    if: ${{ needs.authorize.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: Production
      deployment: false
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.expected_head_sha }}
          persist-credentials: false
      - name: Open, update, or resolve the OpenAPI guard incident
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          GUARD_RESULT: ${{ needs.authorize.outputs.result }}
          OUTCOME_CLASSIFICATION: ${{ needs.authorize.outputs.result }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sourceRunId = Number(process.env.SOURCE_RUN_ID);
            const expected_head_sha = process.env.EXPECTED_HEAD_SHA;
            const mainBranch = context.payload.repository.default_branch;
            // Recheck the exact head immediately before creating/updating Issues.
            if (mainBranch !== "main" || mainBranch === "Production") {
              throw new Error("incident_writer_protected_branch_denied");
            }
            const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: mainBranch });
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: sourceRunId });
            if (branch.commit.sha !== expected_head_sha || run.head_sha !== expected_head_sha
              || run.head_branch !== mainBranch || run.name !== "Custom GPT Contract Guard"
              || run.status !== "completed" || !["push", "schedule", "workflow_dispatch"].includes(run.event)
              || run.repository?.full_name !== `${owner}/${repo}`) {
              throw new Error("incident_writer_expected_head_sha_or_source_run_mismatch");
            }
            const marker = "<!-- openapi-response-object-guard-alert -->";
            const title = "[OpenAPI Guard] Custom GPT Contract Guard failing";
            const guardResult = process.env.GUARD_RESULT || "unknown";
            const outcomeClassification = process.env.OUTCOME_CLASSIFICATION || guardResult;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${sourceRunId}`;
            const observedAt = new Date().toISOString();
            // Cancellation may be superseded; never open a false failure incident.
            if (guardResult === "cancelled") {
              core.info("Cancelled guard run: no incident mutation.");
              return;
            }

            if (outcomeClassification === "cancelled_due_to_superseding_run") {
              core.info(`Superseded cancellation is neutral; no OpenAPI guard incident mutation will occur. Superseding run: ${process.env.SUPERSEDING_RUN_URL || "unknown"}.`);
              return;
            }

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const matches = openIssues.filter((issue) =>
              !issue.pull_request
              && issue.title === title
              && (issue.body || "").includes(marker),
            );

            if (guardResult === "success") {
              for (const issue of matches) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: `Recovered after a successful default-branch guard run: ${runUrl}`,
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issue.number,
                  state: "closed",
                  state_reason: "completed",
                });
              }
              core.info(matches.length > 0
                ? `Closed ${matches.length} OpenAPI guard alert issue(s).`
                : "No open OpenAPI guard alert issue required resolution.");
              return;
            }

            const body = `${marker}
            ## OpenAPI Response Object guard alert

            The default-branch **Custom GPT Contract Guard** did not succeed.

            - Result: **${guardResult}**
            - Classification: **${outcomeClassification}**
            - Observed: ${observedAt}
            - Workflow run: ${runUrl}
            - Ref: \`${`refs/heads/${mainBranch}`}\`
            - Commit: \`${expected_head_sha}\`

            Follow \`docs/openapi-response-object-guard-runbook.md\` before changing generated schemas.`;

            if (matches.length > 0) {
              const issue = matches[0];
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, body });
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `Failure observed again: ${runUrl}`,
              });
              core.warning(`Updated OpenAPI guard alert issue #${issue.number}.`);
              return;
            }

            const created = await github.rest.issues.create({ owner, repo, title, body });
            core.warning(`Created OpenAPI guard alert issue #${created.data.number}.`);
