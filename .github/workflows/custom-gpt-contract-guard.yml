name: Custom GPT Contract Guard

on:
  pull_request:
    paths:
      - "http-generic-api/openapi*.yaml"
      - "http-generic-api/openapi/**/*.yaml"
      - "canonicals/openapi/**/*.yaml"
      - "edge/activation-gateway/**"
      - "http-generic-api/package.json"
      - "http-generic-api/package-lock.json"
      - "http-generic-api/scripts/split-openapi.mjs"
      - "http-generic-api/scripts/generate-custom-gpt-schemas.mjs"
      - "http-generic-api/scripts/openapi-builder-schema-guard.mjs"
      - "http-generic-api/scripts/openapi-response-object-guard.mjs"
      - "http-generic-api/scripts/openapi-lint-and-compatibility.mjs"
      - "http-generic-api/test-openapi-response-object-guard.mjs"
      - "http-generic-api/test-openapi-lint-and-compatibility.mjs"
      - "specs/006-adaptive-authorization-execution-governance/contracts/authorization-execution.openapi.yaml"
      - "specs/006-adaptive-authorization-execution-governance/contracts/authorization-execution.openapi.baseline.json"
      - "http-generic-api/test-custom-gpt-schemas.mjs"
      - "http-generic-api/test-openapi-builder-schema-guard.mjs"
      - "http-generic-api/test-tenant-activation-session-alias.mjs"
      - "http-generic-api/test-activation-gateway.mjs"
      - "http-generic-api/test-openapi-split-governance.mjs"
      - "http-generic-api/test-openapi-split-regeneration-parity.mjs"
      - "http-generic-api/activationGuidanceService.js"
      - "http-generic-api/tenantActivationSnapshot.js"
      - "http-generic-api/platformDegradationPolicy.js"
      - "http-generic-api/routes/credentialIntakeRoutes.js"
      - "http-generic-api/routes/gptToolsRoutes.js"
      - "http-generic-api/routes/tenantActivationOverlayRoutes.js"
      - "http-generic-api/routes/rootDiscoveryRoutes.js"
      - "http-generic-api/tenantGptOAuthPreset.js"
      - "http-generic-api/test-platform-routes.mjs"
      - ".github/workflows/openapi-auto-sync.yml"
      - ".github/workflows/custom-gpt-contract-guard.yml"
  push:
    branches: [main]
    paths:
      - "http-generic-api/openapi*.yaml"
      - "http-generic-api/openapi/**/*.yaml"
      - "canonicals/openapi/**/*.yaml"
      - "http-generic-api/package.json"
      - "http-generic-api/scripts/split-openapi.mjs"
      - "http-generic-api/scripts/generate-custom-gpt-schemas.mjs"
      - "http-generic-api/scripts/openapi-builder-schema-guard.mjs"
      - "http-generic-api/scripts/openapi-response-object-guard.mjs"
      - "http-generic-api/scripts/openapi-lint-and-compatibility.mjs"
      - "http-generic-api/test-openapi-response-object-guard.mjs"
      - "http-generic-api/test-openapi-lint-and-compatibility.mjs"
      - "specs/006-adaptive-authorization-execution-governance/contracts/authorization-execution.openapi.yaml"
      - "specs/006-adaptive-authorization-execution-governance/contracts/authorization-execution.openapi.baseline.json"
      - "http-generic-api/activationGuidanceService.js"
      - "http-generic-api/tenantActivationSnapshot.js"
      - "http-generic-api/platformDegradationPolicy.js"
      - "http-generic-api/routes/credentialIntakeRoutes.js"
      - "http-generic-api/routes/gptToolsRoutes.js"
      - ".github/workflows/openapi-auto-sync.yml"
      - ".github/workflows/custom-gpt-contract-guard.yml"
  workflow_dispatch:
  schedule:
    - cron: "41 2 * * *"

permissions:
  contents: read

concurrency:
  group: custom-gpt-contract-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: http-generic-api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json
      - run: npm ci
      - name: Enforce canonical parity and Builder-safe schemas
        run: npm run schemas:guard
      - name: Verify split-schema governance and regeneration parity
        run: |
          node test-openapi-split-governance.mjs
          node test-openapi-split-regeneration-parity.mjs

  alert:
    name: OpenAPI guard issue lifecycle
    needs: guard
    if: ${{ always() && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open, update, or resolve the OpenAPI guard incident
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          GUARD_RESULT: ${{ needs.guard.result }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const marker = "<!-- openapi-response-object-guard-alert -->";
            const title = "[OpenAPI Guard] Custom GPT Contract Guard failing";
            const guardResult = process.env.GUARD_RESULT || "unknown";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const observedAt = new Date().toISOString();

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const matches = openIssues.filter((issue) =>
              !issue.pull_request
              && issue.title === title
              && (issue.body || "").includes(marker),
            );

            if (guardResult === "success") {
              for (const issue of matches) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: `Recovered after a successful default-branch guard run: ${runUrl}`,
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issue.number,
                  state: "closed",
                  state_reason: "completed",
                });
              }
              core.info(matches.length > 0
                ? `Closed ${matches.length} OpenAPI guard alert issue(s).`
                : "No open OpenAPI guard alert issue required resolution.");
              return;
            }

            const body = `${marker}
            ## OpenAPI Response Object guard alert

            The default-branch **Custom GPT Contract Guard** did not succeed.

            - Result: **${guardResult}**
            - Observed: ${observedAt}
            - Workflow run: ${runUrl}
            - Ref: \`${context.ref}\`
            - Commit: \`${context.sha}\`

            Follow \`docs/openapi-response-object-guard-runbook.md\` before changing generated schemas.`;

            if (matches.length > 0) {
              const issue = matches[0];
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, body });
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `Failure observed again: ${runUrl}`,
              });
              core.warning(`Updated OpenAPI guard alert issue #${issue.number}.`);
              return;
            }

            const created = await github.rest.issues.create({ owner, repo, title, body });
            core.warning(`Created OpenAPI guard alert issue #${created.data.number}.`);
