name: Governed Generated Artifact Refresh Request Dispatcher
run-name: Governed Generated Artifact Refresh Request Dispatcher · ${{ github.event.workflow_run.id || inputs.expected_head_sha }}

on:
  workflow_run:
    workflows:
      - Governed Generated Artifact Refresh PR Target Request
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open same-repository pull request number
        required: true
        type: string
      target_ref:
        description: Governed work branch to refresh
        required: true
        type: string
      expected_head_sha:
        description: Exact current 40-character PR head SHA
        required: true
        type: string

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: governed-generated-artifact-refresh-request-dispatcher-${{ github.event.workflow_run.id || inputs.target_ref || github.run_id }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request_target' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPORT_DIR: /tmp/governed-generated-artifact-refresh-request-dispatcher
      REQUEST_DIR: /tmp/governed-generated-artifact-refresh-request
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
      MANUAL_PR_NUMBER: ${{ inputs.pr_number || '' }}
      MANUAL_TARGET_REF: ${{ inputs.target_ref || '' }}
      MANUAL_EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha || '' }}
    steps:
      - name: Resolve and revalidate exact-head request before checkout or dispatch
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "${REPORT_DIR}" "${REQUEST_DIR}"
          mkdir -p "${REPORT_DIR}" "${REQUEST_DIR}"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            [[ "${MANUAL_PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
            [[ "${MANUAL_EXPECTED_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
            jq -n \
              --arg contract "mad4b.governed-generated-artifact-refresh-request.v1" \
              --arg target_ref "${MANUAL_TARGET_REF}" \
              --arg expected_head_sha "${MANUAL_EXPECTED_HEAD_SHA}" \
              --argjson pr_number "${MANUAL_PR_NUMBER}" \
              --argjson source_run_id "${GITHUB_RUN_ID}" \
              '{contract:$contract,outcome:"eligible",target_ref:$target_ref,expected_head_sha:$expected_head_sha,pr_number:$pr_number,source_run_id:$source_run_id,source_event:"workflow_dispatch",candidate_code_checkout:false,repository_mutation_performed:false,protected_branch_mutation:false,force_push:false,source_of_truth:"structured_report",job_logs_role:"diagnostic_only",consult_job_logs:false,secrets_included:false}' \
              > "${REQUEST_DIR}/request.json"
          else
            [[ "${SOURCE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
            gh run download "${SOURCE_RUN_ID}" \
              --repo "${GITHUB_REPOSITORY}" \
              --name "governed-generated-artifact-refresh-request-${SOURCE_RUN_ID}" \
              --dir "${REQUEST_DIR}"
          fi

          request="${REQUEST_DIR}/request.json"
          test -f "${request}"
          contract="$(jq -r '.contract' "${request}")"
          request_outcome="$(jq -r '.outcome' "${request}")"
          request_reason="$(jq -r '.reason // empty' "${request}")"
          pr_number="$(jq -r '.pr_number' "${request}")"
          target_ref="$(jq -r '.target_ref' "${request}")"
          expected_head_sha="$(jq -r '.expected_head_sha' "${request}")"
          request_source_run_id="$(jq -r '.source_run_id' "${request}")"
          failure_code=""
          failure_detail=""
          request_skipped="false"

          if [[ "${contract}" != "mad4b.governed-generated-artifact-refresh-request.v1" ]]; then
            failure_code="invalid_request_contract"
            failure_detail="The request artifact contract is not recognized."
          elif [[ ! "${pr_number}" =~ ^[1-9][0-9]*$ ]]; then
            failure_code="invalid_pull_request_number"
            failure_detail="The request must contain a positive pull request number."
          elif [[ ! "${expected_head_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            failure_code="invalid_expected_head_sha"
            failure_detail="The request must contain an exact expected head SHA."
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_run" && "${request_source_run_id}" != "${SOURCE_RUN_ID}" ]]; then
            failure_code="request_source_run_mismatch"
            failure_detail="The request source run differs from the triggering workflow run."
          elif [[ "${request_outcome}" == "skipped" ]]; then
            request_skipped="true"
          elif [[ "${request_outcome}" != "eligible" ]]; then
            failure_code="${request_reason:-request_not_eligible}"
            failure_detail="The read-only request evaluator did not authorize writer dispatch."
          fi

          if [[ "${request_skipped}" == "true" ]]; then
            jq -n \
              --arg contract "mad4b.governed-generated-artifact-refresh-dispatch.v1" \
              --arg target_ref "${target_ref}" \
              --arg expected_head_sha "${expected_head_sha}" \
              --argjson pr_number "${pr_number}" \
              --arg reason "${request_reason:-request_skipped}" \
              '{contract:$contract,outcome:"skipped",target_ref:$target_ref,expected_head_sha:$expected_head_sha,pr_number:$pr_number,reason:$reason,dispatch_requested:false,delegated_run_observed:false,source_of_truth:"structured_report",job_logs_role:"diagnostic_only",consult_job_logs:false,direct_repository_mutation:false,protected_branch_mutation:false,force_push:false,secrets_included:false}' \
              > "${REPORT_DIR}/dispatch.json"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          target_branch="${target_ref}"
          if [[ -z "${failure_code}" && ( "${target_branch}" == "main" || "${target_branch}" == "Production" ) ]]; then
            jq -n \
              --arg contract "mad4b.governed-generated-artifact-refresh-dispatch.v1" \
              --arg target_ref "${target_branch}" \
              --arg expected_head_sha "${expected_head_sha}" \
              --argjson pr_number "${pr_number}" \
              '{contract:$contract,outcome:"blocked",target_ref:$target_ref,expected_head_sha:$expected_head_sha,pr_number:$pr_number,first_failure:{code:"protected_branch_mutation_forbidden",diagnostic_tail:"The governed writer cannot target main or Production."},dispatch_requested:false,delegated_run_observed:false,source_of_truth:"structured_report",job_logs_role:"diagnostic_only",consult_job_logs:false,direct_repository_mutation:false,protected_branch_mutation:false,force_push:false,secrets_included:false}' \
              > "${REPORT_DIR}/dispatch.json"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [[ -z "${failure_code}" ]]; then
            pr="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
            state="$(jq -r '.state' <<<"${pr}")"
            draft="$(jq -r '.draft' <<<"${pr}")"
            head_repository="$(jq -r '.head.repo.full_name' <<<"${pr}")"
            current_target_ref="$(jq -r '.head.ref' <<<"${pr}")"
            current_head_sha="$(jq -r '.head.sha' <<<"${pr}")"
            base_ref="$(jq -r '.base.ref' <<<"${pr}")"
            labels="$(jq -c '[.labels[].name]' <<<"${pr}")"

            if [[ "${state}" != "open" ]]; then
              failure_code="pull_request_not_open"
              failure_detail="The associated pull request is no longer open."
            elif [[ "${draft}" == "true" ]]; then
              failure_code="pull_request_is_draft"
              failure_detail="The associated pull request is a draft."
            elif [[ "${head_repository}" != "${GITHUB_REPOSITORY}" ]]; then
              failure_code="cross_repository_pull_request_forbidden"
              failure_detail="The dispatcher accepts same-repository pull requests only."
            elif [[ "${base_ref}" != "main" ]]; then
              failure_code="unexpected_base_branch"
              failure_detail="The associated pull request must target main."
            elif [[ ! "${target_ref}" =~ ^(gpt|cert|fix|feat|chore|docs|release)/[A-Za-z0-9._/-]+$ ]]; then
              failure_code="invalid_governed_work_branch"
              failure_detail="The target ref is not an approved governed work branch."
            elif [[ "${current_target_ref}" != "${target_ref}" ]]; then
              failure_code="pull_request_branch_mismatch"
              failure_detail="The current PR branch differs from the request target ref."
            elif [[ "${current_head_sha}" != "${expected_head_sha}" ]]; then
              failure_code="pull_request_head_mismatch"
              failure_detail="The current head SHA differs from expected_head_sha."
            elif ! jq -e 'index("generated-artifact-refresh") != null' <<<"${labels}" >/dev/null; then
              failure_code="generated_artifact_refresh_label_absent"
              failure_detail="The generated-artifact-refresh label is no longer present."
            fi
          fi

          if [[ -n "${failure_code}" ]]; then
            jq -n \
              --arg contract "mad4b.governed-generated-artifact-refresh-dispatch.v1" \
              --arg target_ref "${target_ref:-unresolved}" \
              --arg expected_head_sha "${expected_head_sha:-unresolved}" \
              --argjson pr_number "${pr_number:-0}" \
              --arg code "${failure_code}" \
              --arg detail "${failure_detail}" \
              '{contract:$contract,outcome:"blocked",target_ref:$target_ref,expected_head_sha:$expected_head_sha,pr_number:$pr_number,first_failure:{code:$code,diagnostic_tail:$detail},dispatch_requested:false,delegated_run_observed:false,source_of_truth:"structured_report",job_logs_role:"diagnostic_only",consult_job_logs:false,direct_repository_mutation:false,protected_branch_mutation:false,force_push:false,secrets_included:false}' \
              > "${REPORT_DIR}/dispatch.json"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"
          echo "target_ref=${target_ref}" >> "$GITHUB_OUTPUT"
          echo "expected_head_sha=${expected_head_sha}" >> "$GITHUB_OUTPUT"

      - name: Dispatch and observe exact-head governed writer
        if: steps.candidate.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr_number }}
          TARGET_REF: ${{ steps.candidate.outputs.target_ref }}
          EXPECTED_HEAD_SHA: ${{ steps.candidate.outputs.expected_head_sha }}
        run: |
          set -euo pipefail
          workflow_state="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/governed-generated-artifact-refresh.yml" \
            --jq '.state')"
          if [[ "${workflow_state}" != "active" ]]; then
            jq -n \
              --arg contract "mad4b.governed-generated-artifact-refresh-dispatch.v1" \
              --arg target_ref "${TARGET_REF}" \
              --arg expected_head_sha "${EXPECTED_HEAD_SHA}" \
              --argjson pr_number "${PR_NUMBER}" \
              --arg workflow_state "${workflow_state}" \
              '{contract:$contract,outcome:"blocked",target_ref:$target_ref,expected_head_sha:$expected_head_sha,pr_number:$pr_number,workflow_state:$workflow_state,first_failure:{code:"delegated_workflow_not_active",diagnostic_tail:"The governed writer workflow is not active."},dispatch_requested:false,delegated_run_observed:false,source_of_truth:"structured_report",job_logs_role:"diagnostic_only",consult_job_logs:false,direct_repository_mutation:false,protected_branch_mutation:false,force_push:false,secrets_included:false}' \
              > "${REPORT_DIR}/dispatch.json"
            exit 0
          fi

          dispatch_started_at="$(date -u -d '5 seconds ago' +'%Y-%m-%dT%H:%M:%SZ')"
          expected_title="Governed Generated Artifact Refresh · ${TARGET_REF} · ${EXPECTED_HEAD_SHA}"
          payload="$(jq -cn \
            --arg ref "main" \
            --arg target_ref "${TARGET_REF}" \
            --arg expected_head_sha "${EXPECTED_HEAD_SHA}" \
            '{ref:$ref,inputs:{target_ref:$target_ref,expected_head_sha:$expected_head_sha,confirmation:"APPLY_GENERATED_ARTIFACT_REFRESH"}}')"
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/governed-generated-artifact-refresh.yml/dispatches" \
            --input - <<<"${payload}"

          delegated_run_id=""
          delegated_run_url=""
          delegated_run_status=""
          delegated_run_conclusion=""
          for attempt in $(seq 1 20); do
            runs="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/governed-generated-artifact-refresh.yml/runs?event=workflow_dispatch&branch=main&per_page=50")"
            delegated_run_id="$(jq -r --arg started "${dispatch_started_at}" --arg title "${expected_title}" \
              '[.workflow_runs[] | select(.created_at >= $started and .display_title == $title)] | sort_by(.created_at) | last | .id // empty' <<<"${runs}")"
            if [[ "${delegated_run_id}" =~ ^[1-9][0-9]*$ ]]; then
              delegated_run_url="$(jq -r --argjson run_id "${delegated_run_id}" '.workflow_runs[] | select(.id == $run_id) | .html_url' <<<"${runs}")"
              delegated_run_status="$(jq -r --argjson run_id "${delegated_run_id}" '.workflow_runs[] | select(.id == $run_id) | .status' <<<"${runs}")"
              delegated_run_conclusion="$(jq -r --argjson run_id "${delegated_run_id}" '.workflow_runs[] | select(.id == $run_id) | .conclusion // empty' <<<"${runs}")"
              break
            fi
            sleep 5
          done

          if [[ ! "${delegated_run_id}" =~ ^[1-9][0-9]*$ ]]; then
            jq -n \
              --arg contract "mad4b.governed-generated-artifact-refresh-dispatch.v1" \
              --arg target_ref "${TARGET_REF}" \
              --arg expected_head_sha "${EXPECTED_HEAD_SHA}" \
              --argjson pr_number "${PR_NUMBER}" \
              '{contract:$contract,outcome:"blocked",target_ref:$target_ref,expected_head_sha:$expected_head_sha,pr_number:$pr_number,dispatch_requested:true,delegated_run_observed:false,first_failure:{code:"delegated_workflow_run_not_observed",diagnostic_tail:"The exact writer run did not appear within the bounded observation window."},source_of_truth:"structured_report",job_logs_role:"diagnostic_only",consult_job_logs:false,direct_repository_mutation:false,protected_branch_mutation:false,force_push:false,secrets_included:false}' \
              > "${REPORT_DIR}/dispatch.json"
            exit 0
          fi

          jq -n \
            --arg contract "mad4b.governed-generated-artifact-refresh-dispatch.v1" \
            --arg target_ref "${TARGET_REF}" \
            --arg expected_head_sha "${EXPECTED_HEAD_SHA}" \
            --argjson pr_number "${PR_NUMBER}" \
            --argjson delegated_run_id "${delegated_run_id}" \
            --arg delegated_run_url "${delegated_run_url}" \
            --arg delegated_run_status "${delegated_run_status}" \
            --arg delegated_run_conclusion "${delegated_run_conclusion}" \
            '{contract:$contract,outcome:"passed",target_ref:$target_ref,expected_head_sha:$expected_head_sha,pr_number:$pr_number,dispatch_requested:true,delegated_workflow:"governed-generated-artifact-refresh.yml",delegated_run_observed:true,delegated_run_id:$delegated_run_id,delegated_run_url:$delegated_run_url,delegated_run_status:$delegated_run_status,delegated_run_conclusion:($delegated_run_conclusion|select(length>0)),typed_confirmation:"APPLY_GENERATED_ARTIFACT_REFRESH",source_of_truth:"structured_report",job_logs_role:"diagnostic_only",consult_job_logs:false,direct_repository_mutation:false,protected_branch_mutation:false,force_push:false,secrets_included:false}' \
            > "${REPORT_DIR}/dispatch.json"

      - name: Checkout trusted default branch publisher
        if: always()
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js 22
        if: always()
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Render canonical dispatch evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "${REPORT_DIR}/dispatch.json" ]]; then
            jq -n \
              --arg contract "mad4b.governed-generated-artifact-refresh-dispatch.v1" \
              '{contract:$contract,outcome:"blocked",target_ref:"unresolved",expected_head_sha:"unresolved",pr_number:0,first_failure:{code:"dispatch_report_missing",diagnostic_tail:"The trusted dispatcher did not emit a structured decision."},dispatch_requested:false,delegated_run_observed:false,source_of_truth:"structured_report",job_logs_role:"diagnostic_only",consult_job_logs:false,direct_repository_mutation:false,protected_branch_mutation:false,force_push:false,secrets_included:false}' \
              > "${REPORT_DIR}/dispatch.json"
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(`${process.env.REPORT_DIR}/dispatch.json`, 'utf8'));
          const lines = [
            '# Governed generated-artifact refresh request dispatcher',
            '',
            `- Contract: \`${report.contract}\``,
            `- Outcome: **${report.outcome}**`,
            `- Pull request: \`${report.pr_number}\``,
            `- Target ref: \`${report.target_ref}\``,
            `- Expected head SHA: \`${report.expected_head_sha}\``,
            `- Dispatch requested: **${report.dispatch_requested === true ? 'yes' : 'no'}**`,
            `- Delegated run observed: **${report.delegated_run_observed === true ? 'yes' : 'no'}**`,
            `- Delegated run ID: \`${report.delegated_run_id ?? 'none'}\``,
            '- Candidate code checkout: **no**',
            '- Direct repository mutation: **no**',
            '- Job logs: **diagnostic-only**',
            '- Secrets included: **no**',
          ];
          if (report.first_failure) {
            lines.push('', '## First blocking finding', '', `- Code: \`${report.first_failure.code}\``, `- Diagnostic: \`${String(report.first_failure.diagnostic_tail || '').replace(/`/g, "'")}\``);
          }
          fs.writeFileSync(`${process.env.REPORT_DIR}/dispatch.md`, `${lines.join('\n')}\n`);
          NODE

      - name: Upload canonical dispatch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governed-generated-artifact-refresh-request-dispatcher-${{ github.run_id }}
          path: ${{ env.REPORT_DIR }}/
          if-no-files-found: error
          retention-days: 30

      - name: Publish canonical decision directly
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report="${REPORT_DIR}/dispatch.json"
          test -f "${report}"
          pr_number="$(jq -r '.pr_number' "${report}")"
          expected_head_sha="$(jq -r '.expected_head_sha' "${report}")"
          outcome="$(jq -r '.outcome' "${report}")"
          if [[ ! "${pr_number}" =~ ^[1-9][0-9]*$ || ! "${expected_head_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::notice::No resolved exact PR identity; artifact remains authoritative."
            exit 0
          fi
          if [[ "${outcome}" == "blocked" ]]; then
            workflow_conclusion="failure"
          else
            workflow_conclusion="success"
          fi
          node http-generic-api/scripts/generated-artifact-refresh-dispatch-pr-publisher.mjs \
            --repository "${GITHUB_REPOSITORY}" \
            --pr-number "${pr_number}" \
            --workflow-conclusion "${workflow_conclusion}" \
            --report "${report}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --source-head-sha "${expected_head_sha}"

      - name: Enforce dispatcher decision
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(`${process.env.REPORT_DIR}/dispatch.json`, 'utf8'));
          if (report.contract !== 'mad4b.governed-generated-artifact-refresh-dispatch.v1') process.exit(1);
          if (report.secrets_included !== false || report.consult_job_logs !== false) process.exit(1);
          if (report.direct_repository_mutation !== false || report.protected_branch_mutation !== false || report.force_push !== false) process.exit(1);
          if (report.outcome === 'blocked') process.exit(1);
          if (report.outcome === 'passed' && (!report.delegated_run_observed || !Number.isInteger(report.delegated_run_id))) process.exit(1);
          NODE
