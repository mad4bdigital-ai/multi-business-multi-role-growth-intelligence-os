name: Governed Production Main Source-Pin Guard

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact main workflow head SHA for an auditable guard rerun
        required: true
        type: string

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: governed-production-main-source-pin-${{ github.repository }}
  cancel-in-progress: true

jobs:
  invalidate-outdated-promotion-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      MAIN_SHA: ${{ github.sha }}
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha || github.sha }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Verify current main source identity
        id: verify
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF_NAME" == "main" ]] || { echo "::error::source-pin guard must execute from main"; exit 1; }
          [[ "$MAIN_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::event main SHA must be an exact lowercase SHA"; exit 1; }
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::expected_head_sha must be an exact lowercase SHA"; exit 1; }
          CURRENT_HEAD_SHA="$MAIN_SHA"
          [[ "$CURRENT_HEAD_SHA" == "$EXPECTED_HEAD_SHA" ]] || {
            echo "::error::expected head mismatch: guard event is not the authorized main SHA"
            exit 1
          }
          READBACK_MAIN="$(gh api "/repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$READBACK_MAIN" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::current main readback is not an exact lowercase SHA"; exit 1; }
          if [[ "$READBACK_MAIN" != "$MAIN_SHA" ]]; then
            echo "::notice::guard event superseded before readback: event=$MAIN_SHA current=$READBACK_MAIN"
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "current_main_sha=$READBACK_MAIN" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "superseded=false" >> "$GITHUB_OUTPUT"
          echo "current_main_sha=$READBACK_MAIN" >> "$GITHUB_OUTPUT"

      - name: Publish superseded guard evidence
        id: superseded
        if: steps.verify.outputs.superseded == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          REPORT_DIR="$RUNNER_TEMP/governed-production-main-source-pin"
          mkdir -p "$REPORT_DIR"
          jq -n \
            --arg contract "mad4b.governed-production-main-source-pin-guard.v2" \
            --arg event_name "$EVENT_NAME" \
            --arg event_main_sha "$MAIN_SHA" \
            --arg current_main_sha "${{ steps.verify.outputs.current_main_sha }}" \
            '{contract:$contract,ok:true,outcome:"superseded",event_name:$event_name,event_main_sha:$event_main_sha,current_main_sha:$current_main_sha,guard_scope:"main_source_identity",outdated_launcher_run_ids:[],cancelled_run_ids:[],stale_release_prs:[],marked_stale_release_pr_numbers:[],merge_executed:false,deployment_executed:false,migration_executed:false,provider_call_executed:false,credential_payload_read:false,secrets_included:false}' \
            > "$REPORT_DIR/report.json"
          echo "report=$REPORT_DIR/report.json" >> "$GITHUB_OUTPUT"

      - name: Cancel and mark only stale governed promotion surfaces
        id: invalidate
        if: steps.verify.outputs.superseded != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          REPORT_DIR="$RUNNER_TEMP/governed-production-main-source-pin"
          mkdir -p "$REPORT_DIR"
          STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          RELEASE_PRS="$(gh pr list \
            --repo "$REPOSITORY" \
            --state open \
            --base Production \
            --limit 100 \
            --json number,title,body,headRefName,headRefOid)"
          STALE_RELEASES='[]'
          MARKED_RELEASES='[]'
          STALE_HEADS='[]'

          assert_non_protected_ref() {
            local target_branch="$1"
            case "$target_branch" in
              main|Production|main/*|Production/*|refs/*)
                echo "::error::refusing to mutate a protected or fully qualified target branch: $target_branch"
                exit 1
                ;;
            esac
          }

          while IFS= read -r pr; do
            [[ -n "$pr" ]] || continue
            pr_number="$(jq -r '.number' <<<"$pr")"
            title="$(jq -r '.title' <<<"$pr")"
            head_ref="$(jq -r '.headRefName' <<<"$pr")"
            head_sha="$(jq -r '.headRefOid' <<<"$pr")"
            pinned_main="$(jq -r 'try (.body | capture("pinned main: `(?<sha>[0-9a-f]{40})`").sha) catch ""' <<<"$pr")"
            promotion_marker="$(jq -r 'if (.body | contains("governed_promotion_candidate: true")) then "true" else "false" end' <<<"$pr")"
            if [[ "$title" != release:\ promote\ pinned\ main\ * \
              || "$promotion_marker" != "true" \
              || ! "$head_sha" =~ ^[0-9a-f]{40}$ \
              || ! "$pinned_main" =~ ^[0-9a-f]{40}$ \
              || "$pinned_main" == "$MAIN_SHA" ]]; then
              continue
            fi
            assert_non_protected_ref "$head_ref"
            STALE_RELEASES="$(jq --argjson pr_number "$pr_number" --arg pinned_main "$pinned_main" --arg head_sha "$head_sha" '. + [{pr_number:$pr_number,pinned_main_sha:$pinned_main,head_sha:$head_sha}]' <<<"$STALE_RELEASES")"
            STALE_HEADS="$(jq --arg head_sha "$head_sha" 'if index($head_sha) then . else . + [$head_sha] end' <<<"$STALE_HEADS")"
            reason="STALE_PRODUCTION_CANDIDATE main_before=${pinned_main} main_after=${MAIN_SHA} source_pin_guard=true action=marked_stale merge_executed=false deployment_executed=false"
            gh pr comment "$pr_number" --repo "$REPOSITORY" --body "$reason"
            MARKED_RELEASES="$(jq --argjson pr_number "$pr_number" '. + [$pr_number]' <<<"$MARKED_RELEASES")"
          done < <(jq -c '.[]' <<<"$RELEASE_PRS")

          LAUNCHER_RUN_IDS="$(gh api "/repos/${REPOSITORY}/actions/workflows/governed-production-promotion-request-launcher.yml/runs?status=in_progress&per_page=100" \
            --jq --arg main_sha "$MAIN_SHA" '[.workflow_runs[] | select(.head_branch == "main" and .head_sha != $main_sha) | .id]')"
          BUILDER_RUN_IDS="$(gh api "/repos/${REPOSITORY}/actions/workflows/production-promotion-candidate.yml/runs?status=in_progress&per_page=100" \
            --jq --arg main_sha "$MAIN_SHA" '[.workflow_runs[] | select(.head_branch == "main" and .head_sha != $main_sha) | .id]')"
          EXACT_RUN_IDS="$(gh api "/repos/${REPOSITORY}/actions/workflows/production-promotion-exact-candidate-validation.yml/runs?status=in_progress&per_page=100" \
            --jq --argjson stale_heads "$STALE_HEADS" '[.workflow_runs[] | select(.head_sha as $head | ($stale_heads | index($head)) != null) | .id]')"
          DESCENDANT_RUN_IDS="$(gh api "/repos/${REPOSITORY}/actions/runs?status=in_progress&per_page=100" \
            --jq --argjson stale_heads "$STALE_HEADS" '[.workflow_runs[] | select(.head_sha as $head | ($stale_heads | index($head)) != null) | .id]')"
          ALL_RUN_IDS="$(jq -n \
            --argjson launcher "$LAUNCHER_RUN_IDS" \
            --argjson builder "$BUILDER_RUN_IDS" \
            --argjson exact "$EXACT_RUN_IDS" \
            --argjson descendants "$DESCENDANT_RUN_IDS" \
            '[$launcher[], $builder[], $exact[], $descendants[]] | unique')"
          CANCELLED='[]'
          while IFS= read -r run_id; do
            [[ -n "$run_id" ]] || continue
            if gh run cancel "$run_id" --repo "$REPOSITORY"; then
              CANCELLED="$(jq --argjson run_id "$run_id" '. + [$run_id]' <<<"$CANCELLED")"
            else
              echo "::notice::stale governed run $run_id completed before cancellation could be applied"
            fi
          done < <(jq -r '.[]' <<<"$ALL_RUN_IDS")

          jq -n \
            --arg contract "mad4b.governed-production-main-source-pin-guard.v2" \
            --arg event_name "$EVENT_NAME" \
            --arg main_sha "$MAIN_SHA" \
            --arg started_at "$STARTED_AT" \
            --argjson outdated_launcher_run_ids "$LAUNCHER_RUN_IDS" \
            --argjson cancelled_run_ids "$CANCELLED" \
            --argjson stale_release_prs "$STALE_RELEASES" \
            --argjson marked_stale_release_pr_numbers "$MARKED_RELEASES" \
            '{contract:$contract,ok:true,outcome:"current",event_name:$event_name,current_main_sha:$main_sha,guard_scope:"main_source_identity",outdated_launcher_run_ids:$outdated_launcher_run_ids,cancelled_run_ids:$cancelled_run_ids,stale_release_prs:$stale_release_prs,marked_stale_release_pr_numbers:$marked_stale_release_pr_numbers,merge_executed:false,deployment_executed:false,migration_executed:false,provider_call_executed:false,credential_payload_read:false,secrets_included:false,started_at:$started_at}' \
            > "$REPORT_DIR/report.json"
          echo "report=$REPORT_DIR/report.json" >> "$GITHUB_OUTPUT"

      - name: Upload source-pin guard evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: governed-production-main-source-pin-${{ github.run_id }}
          path: ${{ steps.superseded.outputs.report || steps.invalidate.outputs.report }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish source-pin decision
        shell: bash
        env:
          REPORT: ${{ steps.superseded.outputs.report || steps.invalidate.outputs.report }}
        run: |
          set -Eeuo pipefail
          outcome="$(jq -r '.outcome' "$REPORT")"
          cancelled_count="$(jq '.cancelled_run_ids | length' "$REPORT")"
          marked_release_count="$(jq '.marked_stale_release_pr_numbers | length' "$REPORT")"
          if [[ "$outcome" == "superseded" ]]; then
            echo "::notice::main moved again before this guard could act; a newer guard owns the decision"
          elif [[ "$cancelled_count" == "0" && "$marked_release_count" == "0" ]]; then
            echo "::notice::main source pin remains current; no governed promotion invalidation was required"
          else
            echo "::notice::invalidated $cancelled_count stale governed run(s) and marked $marked_release_count release surface(s) stale; a new exact-head promotion request is required"
          fi
