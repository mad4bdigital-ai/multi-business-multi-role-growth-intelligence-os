name: PR 6429 Exact-Head Work Map Refresh Helper

on:
  push:
    branches:
      - gpt/generated/pr6429-work-map-refresh-20260806
    paths:
      - .github/workflows/pr6429-work-map-refresh-helper.yml

permissions:
  contents: write

jobs:
  refresh-work-maps:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v5
        with:
          ref: gpt/generated/pr6429-work-map-refresh-20260806
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Prepare final tree and generate exact-head Work Maps
        shell: bash
        run: |
          set -euo pipefail
          helper='.github/workflows/pr6429-work-map-refresh-helper.yml'
          test -f "${helper}"
          rm "${helper}"
          test ! -e "${helper}"

          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          node http-generic-api/scripts/platform-work-map-generator.mjs --check

          changed="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/pr6429-work-map-refresh-helper.yml' \
            'docs/work-maps/README.md' \
            'docs/work-maps/data-model-domain-map.md' \
            'docs/work-maps/work-map-coverage-matrix.md' | LC_ALL=C sort)"
          if [[ "${changed}" != "${expected}" ]]; then
            echo 'Unexpected final-tree change set:'
            printf '%s\n' "${changed}"
            exit 1
          fi

          map_changed="$(git diff --name-only -- docs/work-maps | LC_ALL=C sort)"
          map_expected="$(printf '%s\n' \
            'docs/work-maps/README.md' \
            'docs/work-maps/data-model-domain-map.md' \
            'docs/work-maps/work-map-coverage-matrix.md' | LC_ALL=C sort)"
          if [[ "${map_changed}" != "${map_expected}" ]]; then
            echo 'Unexpected Work Map change set:'
            printf '%s\n' "${map_changed}"
            exit 1
          fi

      - name: Run Work Map validation on final tree
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/pr6429-work-map-refresh-helper.yml
          node http-generic-api/scripts/work-map-schema-classification-contract.mjs
          node http-generic-api/scripts/work-map-schema-classification.mjs
          node http-generic-api/scripts/spec-kit-work-map-governance-gate.mjs --ci --changed
          node http-generic-api/scripts/platform-work-map-generator.mjs --check

      - name: Commit exact generated maps and helper deletion atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            .github/workflows/pr6429-work-map-refresh-helper.yml \
            docs/work-maps/README.md \
            docs/work-maps/data-model-domain-map.md \
            docs/work-maps/work-map-coverage-matrix.md

          staged="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/pr6429-work-map-refresh-helper.yml' \
            'docs/work-maps/README.md' \
            'docs/work-maps/data-model-domain-map.md' \
            'docs/work-maps/work-map-coverage-matrix.md' | LC_ALL=C sort)"
          if [[ "${staged}" != "${expected}" ]]; then
            echo 'Unexpected staged change set:'
            printf '%s\n' "${staged}"
            exit 1
          fi

          git diff --cached --check
          git commit -m "docs(work-maps): refresh PR 6429 exact-head maps"
          git push origin HEAD:gpt/generated/pr6429-work-map-refresh-20260806
