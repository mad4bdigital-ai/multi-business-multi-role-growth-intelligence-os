name: PR 6429 Exact-Head Work Map Refresh Helper

on:
  push:
    branches:
      - gpt/generated/pr6429-work-map-refresh-20260806
    paths:
      - .github/workflows/pr6429-work-map-refresh-helper.yml

permissions:
  contents: write

jobs:
  refresh-work-maps:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v5
        with:
          ref: gpt/generated/pr6429-work-map-refresh-20260806
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Generate and validate exact-head Work Maps
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          unexpected="$(git diff --name-only | grep -v '^docs/work-maps/' | grep -v '^.github/workflows/pr6429-work-map-refresh-helper.yml$' || true)"
          if [[ -n "${unexpected}" ]]; then
            echo "Unexpected generated paths:"
            printf '%s\n' "${unexpected}"
            exit 1
          fi
          changed="$(git diff --name-only -- docs/work-maps | sort)"
          expected=$'docs/work-maps/README.md\ndocs/work-maps/data-model-domain-map.md\ndocs/work-maps/work-map-coverage-matrix.md'
          if [[ "${changed}" != "${expected}" ]]; then
            echo "Unexpected Work Map change set:"
            printf '%s\n' "${changed}"
            exit 1
          fi

      - name: Run Work Map validation
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/work-map-schema-classification-contract.mjs
          node http-generic-api/scripts/work-map-schema-classification.mjs
          node http-generic-api/scripts/spec-kit-work-map-governance-gate.mjs --ci --changed

      - name: Commit generated maps and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr6429-work-map-refresh-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/work-maps/README.md docs/work-maps/data-model-domain-map.md docs/work-maps/work-map-coverage-matrix.md
          git add -u -- .github/workflows
          git diff --cached --check
          git commit -m "docs(work-maps): refresh PR 6429 exact-head maps"
          git push origin HEAD:gpt/generated/pr6429-work-map-refresh-20260806
