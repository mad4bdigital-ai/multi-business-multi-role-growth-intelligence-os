name: Repository Inventory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/repository-inventory.json'
      - '!docs/repository-inventory-summary.json'
      - '!docs/repository-inventory.md'
  pull_request:
    paths:
      - '**'
      - '!docs/repository-inventory.json'
      - '!docs/repository-inventory-summary.json'
      - '!docs/repository-inventory.md'

permissions:
  contents: read

concurrency:
  group: repository-inventory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Generate and verify repository inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Regenerate inventory artifacts
        run: npm run inventory:write

      - name: Verify inventory is committed and deterministic
        run: |
          npm run inventory:check
          npm run inventory:test
          git diff --exit-code -- docs/repository-inventory.json docs/repository-inventory-summary.json docs/repository-inventory.md

      - name: Upload inventory artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repository-inventory-${{ github.sha }}
          path: |
            docs/repository-inventory.json
            docs/repository-inventory-summary.json
            docs/repository-inventory.md
          if-no-files-found: error
