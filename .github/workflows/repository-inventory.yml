name: Repository Inventory

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Governed work branch whose exact head must be verified
        required: true
        type: string
      expected_head_sha:
        description: Exact 40-character branch head SHA to verify
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/repository-inventory.json'
      - '!docs/repository-inventory-summary.json'
      - '!docs/repository-inventory.md'
  pull_request:
    paths:
      - '**'
      - '!docs/repository-inventory.json'
      - '!docs/repository-inventory-summary.json'
      - '!docs/repository-inventory.md'

# Read-only exact-head verifier. Pre-merge observability drift is advisory. On exact main,
# Inventory and dependent Evaluation are both checked because they share repository_inventory_refresh.
env:
  INVENTORY_AUTHORITY_MODE: read_only_verifier

permissions:
  contents: read

concurrency:
  group: repository-inventory-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Generate and verify repository inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate exact-head verification dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TARGET_REF: ${{ inputs.target_ref }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_REF" =~ ^(gpt|fix|feat|chore|docs|release)/[A-Za-z0-9._/-]+$ ]]
          [[ "$TARGET_REF" != "main" && "$TARGET_REF" != "Production" ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_head_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Verify Inventory currentness or advisory drift
        id: inventory
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.head_ref || github.ref_name }}
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_head_sha || github.event.pull_request.head.sha || github.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$INVENTORY_AUTHORITY_MODE" = "read_only_verifier"
          node scripts/repository-inventory-verification-gate.mjs \
            --event-name "$EVENT_NAME" \
            --target-ref "$TARGET_REF" \
            --expected-head-sha "$EXPECTED_HEAD_SHA" \
            --head-repository "$HEAD_REPOSITORY" \
            --base-ref "$BASE_REF" \
            --repository "$REPOSITORY" \
            --output repository-inventory-verification.json

      - name: Signal post-merge Repository State convergence
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          registry=.github/derived-state-governance.json
          inventory_outcome="$(jq -er '.outcome' repository-inventory-verification.json)"
          if [[ "$inventory_outcome" == "advisory" ]]; then
            test "$(jq -r '.followup_required' repository-inventory-verification.json)" = "true"
            test "$(jq -r '.followup_mode' repository-inventory-verification.json)" = "post_merge_observability_publish"
            echo "Repository Inventory is stale on exact main; emitting post-merge convergence signal." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          test "$inventory_outcome" = "passed"
          test "$(jq -r '.artifacts[] | select(.artifact_id=="repository_evaluation") | .artifact_class' "$registry")" = "observability"
          test "$(jq -r '.artifacts[] | select(.artifact_id=="repository_evaluation") | .merge_blocking' "$registry")" = "false"
          test "$(jq -r '.artifacts[] | select(.artifact_id=="repository_evaluation") | .recipe' "$registry")" = "repository_inventory_refresh"
          set +e
          node scripts/repository-evaluation.mjs --check --enforce > "$RUNNER_TEMP/repository-evaluation-main-currentness.log" 2>&1
          evaluation_status=$?
          set -e
          if [[ "$evaluation_status" -ne 0 ]]; then
            echo "Repository Evaluation is stale on exact main; emitting shared post-merge convergence signal." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Publish bounded Inventory state
        if: always()
        shell: bash
        run: |
          if [[ -f repository-inventory-verification.json ]]; then
            jq -r '
              "Repository Inventory: " + (.outcome // "unknown") +
              " | state=" + (.inventory_state // "unknown") +
              " | current=" + ((.current // false) | tostring) +
              " | followup_required=" + ((.followup_required // false) | tostring)
            ' repository-inventory-verification.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload inventory artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repository-inventory-${{ github.event_name == 'workflow_dispatch' && inputs.expected_head_sha || github.sha }}
          path: |
            docs/repository-inventory.json
            docs/repository-inventory-summary.json
            docs/repository-inventory.md
            repository-inventory-verification.json
            ${{ runner.temp }}/repository-evaluation-main-currentness.log
          if-no-files-found: error
