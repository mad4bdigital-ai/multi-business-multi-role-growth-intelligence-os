name: Temporary Production Runtime Parity Probe c0f9d9fa V2

on:
  pull_request:
    branches:
      - gpt/production-runtime-readback-base-c0f9d9fa-20260802-v2
    paths:
      - '.github/workflows/temporary-production-runtime-parity-probe-c0f9d9fa-v2.yml'

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Generate bounded public runtime evidence
        id: parity
        continue-on-error: true
        working-directory: http-generic-api
        env:
          REPORT_DIR: ${{ runner.temp }}/production-runtime-parity-evidence
        run: |
          node scripts/production-runtime-parity-evidence.mjs \
            --expected-sha c0f9d9fa84bfbf9edf4967a11a94758cb1491ad3 \
            --expected-branch Production \
            --endpoint auth=https://auth.mad4b.com/version \
            --optional-endpoint connector=https://connector.mad4b.com/version \
            --optional-endpoint dev=https://dev.mad4b.com/version \
            --output-dir "${REPORT_DIR}"

      - name: Upload bounded runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-runtime-parity-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/production-runtime-parity-evidence/*
          if-no-files-found: error
          retention-days: 7

      - name: Enforce auth Production parity
        if: always()
        working-directory: http-generic-api
        env:
          REPORT_PATH: ${{ runner.temp }}/production-runtime-parity-evidence/production-runtime-parity-evidence.json
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const path = process.env.REPORT_PATH;
            if (!path || !fs.existsSync(path)) {
              console.error(JSON.stringify({ ok: false, error: "runtime_evidence_missing", secrets_included: false }));
              process.exit(1);
            }
            const report = JSON.parse(fs.readFileSync(path, "utf8"));
            const endpoints = Array.isArray(report.endpoints) ? report.endpoints : [];
            const auth = endpoints.find((endpoint) => endpoint.name === "auth");
            const safe = {
              contract: report.contract,
              outcome: report.outcome,
              first_failure: report.first_failure,
              expected_sha: report.identity?.expected_sha,
              expected_branch: report.identity?.expected_branch,
              auth_status: auth?.status,
              auth_observed_sha: auth?.deployment?.deployed_commit_sha ?? null,
              auth_observed_branch: auth?.deployment?.manifest?.branch ?? null,
              secrets_included: report.secrets_included
            };
            console.log(JSON.stringify(safe));
            if (
              report.contract !== "mad4b.production-runtime-parity-evidence.v1" ||
              report.identity?.expected_sha !== "c0f9d9fa84bfbf9edf4967a11a94758cb1491ad3" ||
              report.identity?.expected_branch !== "Production" ||
              auth?.status !== "passed" ||
              report.secrets_included !== false
            ) process.exit(1);
          '
