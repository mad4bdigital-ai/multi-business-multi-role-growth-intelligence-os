name: Spec 014 Main 79cbbc63 Reconciliation Launcher

on:
  push:
    branches:
      - gpt/reconcile-spec014-main-79cbbc63-20260802
    paths:
      - .github/workflows/spec014-main-79cbbc63-reconciliation-launcher.yml
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - gpt/hostinger-safe-storage-cleanup-ssh-20260801
    paths:
      - .github/workflows/spec014-main-79cbbc63-reconciliation-launcher.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event_name == 'push' || github.head_ref == 'gpt/reconcile-spec014-main-79cbbc63-20260802'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact reconciliation branch
        uses: actions/checkout@v5
        with:
          ref: gpt/reconcile-spec014-main-79cbbc63-20260802
          fetch-depth: 0

      - name: Verify immutable inputs and bounded launcher commits
        shell: bash
        run: |
          set -euo pipefail
          integration_sha='06daaf7aeb270af435910a5ea07a2385cdbb4fbf'
          main_sha='79cbbc634e690bf30ab2827144cb49c88b14f9a5'
          test "$(git merge-base "$integration_sha" HEAD)" = "$integration_sha"
          mapfile -t launcher_diff < <(git diff --name-only "$integration_sha" HEAD)
          test "${#launcher_diff[@]}" = '1'
          test "${launcher_diff[0]}" = '.github/workflows/spec014-main-79cbbc63-reconciliation-launcher.yml'
          git fetch origin "$main_sha" --depth=1000
          test "$(git rev-parse FETCH_HEAD)" = "$main_sha"

      - name: Merge protected main and resolve bounded generated conflicts
        shell: bash
        run: |
          set -euo pipefail
          main_sha='79cbbc634e690bf30ab2827144cb49c88b14f9a5'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          set +e
          git merge --no-commit --no-ff "$main_sha"
          merge_status=$?
          set -e

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          if (( merge_status != 0 && ${#conflicts[@]} == 0 )); then
            echo 'Merge failed without reportable file conflicts.' >&2
            exit 1
          fi

          cat > /tmp/allowed-conflicts <<'EOF'
          .changes/e2e/governed-generated-artifact-refresh-pr-target-bridge.json
          .changes/e2e/governed-generated-artifact-refresh-request-reregistration-v2.json
          .changes/e2e/openapi-auto-sync-generated-contract-review.json
          .github/workflows/governed-generated-artifact-refresh-pr-target-bridge.yml
          .github/workflows/governed-generated-artifact-refresh-pr-target-bridge-v2.yml
          docs/repo-maintenance-status.md
          docs/surface-contract-discovery-status.json
          docs/surface-contract-discovery-status.md
          docs/surface-contract-gap-queue.json
          docs/surface-contract-gap-queue.md
          docs/surface-contract-gap-trends.json
          docs/surface-contract-gap-trends.md
          docs/surface-contract-gap-triage.json
          docs/surface-contract-gap-triage.md
          docs/surface-contract-governance-compact.json
          docs/surface-contract-governance-compact.md
          docs/surface-contract-governance-dashboard.json
          docs/surface-contract-governance-dashboard.md
          http-generic-api/frontend-surface-dispatch.generated.json
          http-generic-api/openapi.yaml
          http-generic-api/test-governed-generated-artifact-refresh-pr-target-bridge.mjs
          http-generic-api/test-openapi-precise-legacy-registry-transition.mjs
          EOF
          sed -i 's/^          //' /tmp/allowed-conflicts
          sort -u -o /tmp/allowed-conflicts /tmp/allowed-conflicts
          printf '%s\n' "${conflicts[@]}" | sort -u > /tmp/actual-conflicts
          comm -23 /tmp/actual-conflicts /tmp/allowed-conflicts > /tmp/unexpected-conflicts
          if [[ -s /tmp/unexpected-conflicts ]]; then
            echo 'Unexpected reconciliation conflicts:' >&2
            cat /tmp/unexpected-conflicts >&2
            exit 1
          fi

          for file in "${conflicts[@]}"; do
            if git cat-file -e "$main_sha:$file" 2>/dev/null; then
              git checkout "$main_sha" -- "$file"
            else
              git rm -f --ignore-unmatch -- "$file"
            fi
          done
          git add -A
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved merge conflicts remain.' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Rebuild precise OpenAPI registry
        working-directory: http-generic-api
        run: node scripts/openapi-precise-contract-registry-sync.mjs --write

      - name: Rebuild missing-route OpenAPI coverage
        working-directory: http-generic-api
        run: node scripts/openapi-autofill-missing-routes.mjs --write

      - name: Rebuild repository planning status
        working-directory: http-generic-api
        run: node scripts/update-repo-planning-docs.mjs

      - name: Rebuild surface contract discovery
        working-directory: http-generic-api
        run: node scripts/surface-contract-discovery.mjs --write

      - name: Rebuild initial surface gap triage reports
        working-directory: http-generic-api
        run: node scripts/surface-contract-gap-triage.mjs --write

      - name: Upload initial surface gap diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec014-surface-gap-triage-initial-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            docs/surface-contract-gap-queue.json
            docs/surface-contract-discovery-status.json
            docs/surface-contract-gap-triage.json
            docs/surface-contract-gap-triage.md
            docs/surface-contract-gap-baseline.json
            docs/surface-contract-governance-dashboard.json
            docs/surface-contract-governance-compact.json
            docs/surface-contract-gap-trends.json

      - name: Reconcile exact parent-existing gap baseline
        working-directory: http-generic-api
        env:
          INTEGRATION_PARENT_SHA: 06daaf7aeb270af435910a5ea07a2385cdbb4fbf
          MAIN_PARENT_SHA: 79cbbc634e690bf30ab2827144cb49c88b14f9a5
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import fs from 'node:fs';
          import path from 'node:path';

          const repoRoot = path.resolve('..');
          const triagePath = path.join(repoRoot, 'docs', 'surface-contract-gap-triage.json');
          const baselinePath = path.join(repoRoot, 'docs', 'surface-contract-gap-baseline.json');
          const triage = JSON.parse(fs.readFileSync(triagePath, 'utf8'));
          const baseline = JSON.parse(fs.readFileSync(baselinePath, 'utf8'));
          const expectedAddedFiles = [
            '1020_sprint69_multi_surface_tenant_agent_runtime.sql',
            '1029_sprint69_minimal_dynamic_brand_resolution.sql',
            '1030_sprint69_generic_platform_resource_context.sql',
            '1041_sprint69_tenant_request_inbox_and_chunk_store_hardening.sql',
            '1042_sprint69_support_ticket_lifecycle_sla_dedupe.sql',
            '1043_sprint69_tenant_managed_execution_lifecycle.sql',
            '189_sprint66_tenant_gpt_operating_guide_tools.sql',
            '191_sprint66_tenant_credential_intake_connection_status.sql',
            '196_sprint66_tenant_database_schema_read_tool.sql',
            '197_sprint66_tenant_database_query_readonly_tool.sql',
            '198_sprint66_tenant_ssh_probe_tool.sql',
            '199_sprint66_tenant_ssh_cli_dry_run_tool.sql',
            '200_sprint66_tenant_ssh_cli_approval_request_tool.sql',
            '201_sprint66_tenant_ssh_cli_approval_decision_tools.sql',
            '20260728_governed_response_chunk_ownership.sql',
            '20260730_hostinger_production_resync_policy.sql',
            '20260802_03_spec014_hostinger_storage_execution_evidence.sql',
            '202_sprint66_tenant_ssh_cli_allowlisted_execute_tool.sql',
            '204_sprint66_tenant_ssh_cli_execute_job_result_tool.sql',
            '205_sprint66_tenant_ssh_password_and_intake_wait.sql',
          ].sort();

          const baselineSet = new Set(baseline.baseline_files || []);
          const actualAddedItems = (triage.items || []).filter((item) => !baselineSet.has(item.migration_file));
          const actualAddedFiles = actualAddedItems.map((item) => item.migration_file).sort();
          assert.deepEqual(actualAddedFiles, expectedAddedFiles, 'Parent-baseline reconciliation set drifted from the reviewed diagnostic artifact.');

          const parentShas = [process.env.INTEGRATION_PARENT_SHA, process.env.MAIN_PARENT_SHA];
          const parentPresence = {};
          for (const file of expectedAddedFiles) {
            const repoPath = `http-generic-api/migrations/${file}`;
            const presentIn = [];
            for (const sha of parentShas) {
              try {
                execFileSync('git', ['cat-file', '-e', `${sha}:${repoPath}`], { cwd: repoRoot, stdio: 'ignore' });
                presentIn.push(sha);
              } catch {}
            }
            assert.ok(presentIn.length > 0, `Unreviewed merge-only gap cannot be baselined: ${file}`);
            parentPresence[file] = presentIn;
          }

          const classCounts = { ...(baseline.baseline_class_counts || {}) };
          for (const item of actualAddedItems) {
            classCounts[item.triage_class] = (classCounts[item.triage_class] || 0) + 1;
          }
          const mergedFiles = [...new Set([...(baseline.baseline_files || []), ...expectedAddedFiles])].sort();
          baseline.baseline_policy = 'future gates fail for any unbaselined new-gap candidate; low, medium, high, and critical new queue items must be remediated before promotion';
          baseline.future_only_lock = true;
          baseline.baseline_item_count = mergedFiles.length;
          baseline.baseline_files = mergedFiles;
          baseline.baseline_class_counts = classCounts;
          baseline.parent_reconciliation = {
            schema_version: 'surface-contract-parent-baseline-reconciliation-v1',
            integration_parent_sha: process.env.INTEGRATION_PARENT_SHA,
            main_parent_sha: process.env.MAIN_PARENT_SHA,
            rule: 'Only migration files already present in at least one immutable parent may enter the reconciled future-only baseline; merge-only files remain blocking.',
            reviewed_initial_artifact_run_id: process.env.GITHUB_RUN_ID,
            added_item_count: expectedAddedFiles.length,
            added_files: expectedAddedFiles,
            parent_presence: parentPresence,
            blocking_merge_only_item_count: 0,
            safety: {
              executes_provider_calls: false,
              reads_credentials: false,
              mutates_runtime: false,
              writes_database: false,
              external_sends: false,
              deploys: false,
              secrets_included: false,
            },
          };
          fs.writeFileSync(baselinePath, `${JSON.stringify(baseline, null, 2)}\n`);
          NODE

      - name: Rebuild reconciled surface gap reports
        working-directory: http-generic-api
        run: node scripts/surface-contract-gap-triage.mjs --write

      - name: Upload reconciled surface gap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec014-surface-gap-triage-reconciled-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            docs/surface-contract-gap-queue.json
            docs/surface-contract-discovery-status.json
            docs/surface-contract-gap-triage.json
            docs/surface-contract-gap-triage.md
            docs/surface-contract-gap-baseline.json
            docs/surface-contract-governance-dashboard.json
            docs/surface-contract-governance-compact.json
            docs/surface-contract-gap-trends.json

      - name: Enforce zero unbaselined surface gaps
        working-directory: http-generic-api
        run: node scripts/surface-contract-gap-triage.mjs --check --enforce-new-gaps

      - name: Rebuild frontend operation governance
        working-directory: http-generic-api
        run: node scripts/frontend-operation-governance-generator.mjs --write

      - name: Rebuild frontend dispatch
        working-directory: http-generic-api
        run: node scripts/frontend-surface-dispatch.mjs --write --baseline-ref=79cbbc634e690bf30ab2827144cb49c88b14f9a5

      - name: Rebuild Custom GPT schemas
        working-directory: http-generic-api
        run: node scripts/generate-custom-gpt-schemas.mjs --write

      - name: Verify reconciled OpenAPI and generated evidence
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          node test-openapi-precise-legacy-registry-transition.mjs
          node test-openapi-precise-contract-inline-ref-migration.mjs
          node test-hostinger-storage-root-openapi-parity.mjs
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-openapi-route-coverage.mjs
          node test-governed-generated-artifact-refresh-pr-target-bridge.mjs
          npm run openapi:auth:check
          npm run schemas:guard

      - name: Collect bounded final write set evidence
        shell: bash
        run: |
          set -euo pipefail
          integration_sha='06daaf7aeb270af435910a5ea07a2385cdbb4fbf'
          evidence_dir="$RUNNER_TEMP/spec014-final-write-set"
          mkdir -p "$evidence_dir"

          cat > "$evidence_dir/allowed-exact.txt" <<'EOF'
          .changes/e2e/governed-generated-artifact-refresh-pr-target-bridge.json
          .changes/e2e/governed-generated-artifact-refresh-request-reregistration-v2.json
          .changes/e2e/openapi-auto-sync-generated-contract-review.json
          .github/workflows/governed-generated-artifact-refresh-pr-target-bridge.yml
          .github/workflows/governed-generated-artifact-refresh-pr-target-bridge-v2.yml
          .github/workflows/spec014-main-79cbbc63-reconciliation-launcher.yml
          docs/repo-maintenance-status.md
          http-generic-api/frontend-operation-governance.generated.json
          http-generic-api/frontend-surface-dispatch.generated.json
          http-generic-api/openapi.yaml
          http-generic-api/openapi/frontend-runtime-routes.generated.yaml
          http-generic-api/openapi/openapi.custom-gpt.activation-admin.yaml
          http-generic-api/openapi/openapi.custom-gpt.auth-dispatcher.yaml
          http-generic-api/openapi/openapi.tenant-gpt.activation.yaml
          http-generic-api/openapi/openapi.tenant-gpt.auth.yaml
          http-generic-api/openapi.gpt-action.local-connector.yaml
          http-generic-api/test-governed-generated-artifact-refresh-pr-target-bridge.mjs
          http-generic-api/test-openapi-precise-legacy-registry-transition.mjs
          EOF
          sed -i 's/^          //' "$evidence_dir/allowed-exact.txt"
          sort -u -o "$evidence_dir/allowed-exact.txt" "$evidence_dir/allowed-exact.txt"

          git diff --name-only "$integration_sha" | sort -u > "$evidence_dir/actual.txt"
          : > "$evidence_dir/unexpected.txt"
          while IFS= read -r file; do
            case "$file" in
              docs/surface-contract-*.json|docs/surface-contract-*.md)
                ;;
              *)
                if ! grep -Fxq "$file" "$evidence_dir/allowed-exact.txt"; then
                  printf '%s\n' "$file" >> "$evidence_dir/unexpected.txt"
                fi
                ;;
            esac
          done < "$evidence_dir/actual.txt"

          echo 'Actual final write set:'
          cat "$evidence_dir/actual.txt"
          if [[ -s "$evidence_dir/unexpected.txt" ]]; then
            echo 'Unexpected final changed files:' >&2
            cat "$evidence_dir/unexpected.txt" >&2
          fi
          test -s "$evidence_dir/actual.txt"

      - name: Upload bounded final write set evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec014-final-write-set-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/spec014-final-write-set

      - name: Enforce bounded final write set
        shell: bash
        run: |
          set -euo pipefail
          unexpected_file="$RUNNER_TEMP/spec014-final-write-set/unexpected.txt"
          if [[ -s "$unexpected_file" ]]; then
            echo 'Final write set exceeded the reviewed allowlist.' >&2
            cat "$unexpected_file" >&2
            exit 1
          fi

      - name: Remove launcher and publish merge commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/spec014-main-79cbbc63-reconciliation-launcher.yml
          git add -A
          git commit -m 'chore(spec-014): reconcile main 79cbbc63 generated contracts'
          parent_count="$(git cat-file -p HEAD | grep -c '^parent ')"
          test "$parent_count" = '2'
          test "$(git rev-parse HEAD^2)" = '79cbbc634e690bf30ab2827144cb49c88b14f9a5'
          git push origin 'HEAD:gpt/reconcile-spec014-main-79cbbc63-20260802'
