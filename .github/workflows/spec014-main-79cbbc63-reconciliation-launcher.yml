name: Spec 014 Main 79cbbc63 Reconciliation Launcher

on:
  push:
    branches:
      - gpt/reconcile-spec014-main-79cbbc63-20260802
    paths:
      - .github/workflows/spec014-main-79cbbc63-reconciliation-launcher.yml
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - gpt/hostinger-safe-storage-cleanup-ssh-20260801
    paths:
      - .github/workflows/spec014-main-79cbbc63-reconciliation-launcher.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event_name == 'push' || github.head_ref == 'gpt/reconcile-spec014-main-79cbbc63-20260802'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact reconciliation branch
        uses: actions/checkout@v5
        with:
          ref: gpt/reconcile-spec014-main-79cbbc63-20260802
          fetch-depth: 0

      - name: Verify immutable inputs and bounded launcher commits
        shell: bash
        run: |
          set -euo pipefail
          integration_sha='06daaf7aeb270af435910a5ea07a2385cdbb4fbf'
          main_sha='79cbbc634e690bf30ab2827144cb49c88b14f9a5'
          test "$(git merge-base "$integration_sha" HEAD)" = "$integration_sha"
          mapfile -t launcher_diff < <(git diff --name-only "$integration_sha" HEAD)
          test "${#launcher_diff[@]}" = '1'
          test "${launcher_diff[0]}" = '.github/workflows/spec014-main-79cbbc63-reconciliation-launcher.yml'
          git fetch origin "$main_sha" --depth=1000
          test "$(git rev-parse FETCH_HEAD)" = "$main_sha"

      - name: Merge protected main and resolve bounded generated conflicts
        shell: bash
        run: |
          set -euo pipefail
          main_sha='79cbbc634e690bf30ab2827144cb49c88b14f9a5'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          set +e
          git merge --no-commit --no-ff "$main_sha"
          merge_status=$?
          set -e

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          if (( merge_status != 0 && ${#conflicts[@]} == 0 )); then
            echo 'Merge failed without reportable file conflicts.' >&2
            exit 1
          fi

          cat > /tmp/allowed-conflicts <<'EOF'
          .changes/e2e/governed-generated-artifact-refresh-pr-target-bridge.json
          .changes/e2e/governed-generated-artifact-refresh-request-reregistration-v2.json
          .changes/e2e/openapi-auto-sync-generated-contract-review.json
          .github/workflows/governed-generated-artifact-refresh-pr-target-bridge.yml
          .github/workflows/governed-generated-artifact-refresh-pr-target-bridge-v2.yml
          docs/repo-maintenance-status.md
          docs/surface-contract-discovery-status.json
          docs/surface-contract-discovery-status.md
          docs/surface-contract-gap-queue.json
          docs/surface-contract-gap-queue.md
          docs/surface-contract-gap-trends.json
          docs/surface-contract-gap-trends.md
          docs/surface-contract-gap-triage.json
          docs/surface-contract-gap-triage.md
          docs/surface-contract-governance-compact.json
          docs/surface-contract-governance-compact.md
          docs/surface-contract-governance-dashboard.json
          docs/surface-contract-governance-dashboard.md
          http-generic-api/frontend-surface-dispatch.generated.json
          http-generic-api/openapi.yaml
          http-generic-api/test-governed-generated-artifact-refresh-pr-target-bridge.mjs
          http-generic-api/test-openapi-precise-legacy-registry-transition.mjs
          EOF
          sed -i 's/^          //' /tmp/allowed-conflicts
          sort -u -o /tmp/allowed-conflicts /tmp/allowed-conflicts
          printf '%s\n' "${conflicts[@]}" | sort -u > /tmp/actual-conflicts
          comm -23 /tmp/actual-conflicts /tmp/allowed-conflicts > /tmp/unexpected-conflicts
          if [[ -s /tmp/unexpected-conflicts ]]; then
            echo 'Unexpected reconciliation conflicts:' >&2
            cat /tmp/unexpected-conflicts >&2
            exit 1
          fi

          for file in "${conflicts[@]}"; do
            if git cat-file -e "$main_sha:$file" 2>/dev/null; then
              git checkout "$main_sha" -- "$file"
            else
              git rm -f --ignore-unmatch -- "$file"
            fi
          done
          git add -A
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved merge conflicts remain.' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Rebuild precise OpenAPI registry
        working-directory: http-generic-api
        run: node scripts/openapi-precise-contract-registry-sync.mjs --write

      - name: Rebuild missing-route OpenAPI coverage
        working-directory: http-generic-api
        run: node scripts/openapi-autofill-missing-routes.mjs --write

      - name: Rebuild repository planning status
        working-directory: http-generic-api
        run: node scripts/update-repo-planning-docs.mjs

      - name: Rebuild surface contract discovery
        working-directory: http-generic-api
        run: node scripts/surface-contract-discovery.mjs --write

      - name: Rebuild and enforce surface gap triage
        working-directory: http-generic-api
        run: node scripts/surface-contract-gap-triage.mjs --write --enforce-new-gaps

      - name: Rebuild frontend operation governance
        working-directory: http-generic-api
        run: node scripts/frontend-operation-governance-generator.mjs --write

      - name: Rebuild frontend dispatch
        working-directory: http-generic-api
        run: node scripts/frontend-surface-dispatch.mjs --write --baseline-ref=79cbbc634e690bf30ab2827144cb49c88b14f9a5

      - name: Rebuild Custom GPT schemas
        working-directory: http-generic-api
        run: node scripts/generate-custom-gpt-schemas.mjs --write

      - name: Verify reconciled OpenAPI and generated evidence
        working-directory: http-generic-api
        shell: bash
        run: |
          set -euo pipefail
          node test-openapi-precise-legacy-registry-transition.mjs
          node test-openapi-precise-contract-inline-ref-migration.mjs
          node test-hostinger-storage-root-openapi-parity.mjs
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-openapi-route-coverage.mjs
          node test-governed-generated-artifact-refresh-pr-target-bridge.mjs
          npm run openapi:auth:check
          npm run schemas:guard

      - name: Enforce bounded final write set
        shell: bash
        run: |
          set -euo pipefail
          integration_sha='06daaf7aeb270af435910a5ea07a2385cdbb4fbf'
          mapfile -t changed < <(git diff --name-only "$integration_sha" | sort -u)
          for file in "${changed[@]}"; do
            case "$file" in
              .changes/e2e/governed-generated-artifact-refresh-pr-target-bridge.json|
              .changes/e2e/governed-generated-artifact-refresh-request-reregistration-v2.json|
              .changes/e2e/openapi-auto-sync-generated-contract-review.json|
              .github/workflows/governed-generated-artifact-refresh-pr-target-bridge.yml|
              .github/workflows/governed-generated-artifact-refresh-pr-target-bridge-v2.yml|
              docs/repo-maintenance-status.md|
              docs/surface-contract-*.json|
              docs/surface-contract-*.md|
              http-generic-api/frontend-operation-governance.generated.json|
              http-generic-api/frontend-surface-dispatch.generated.json|
              http-generic-api/openapi.yaml|
              http-generic-api/openapi/frontend-runtime-routes.generated.yaml|
              http-generic-api/openapi/openapi.custom-gpt.auth-dispatcher.yaml|
              http-generic-api/openapi/openapi.custom-gpt.activation-admin.yaml|
              http-generic-api/openapi/openapi.tenant-gpt.auth.yaml|
              http-generic-api/openapi/openapi.tenant-gpt.activation.yaml|
              http-generic-api/openapi.gpt-action.local-connector.yaml|
              http-generic-api/test-governed-generated-artifact-refresh-pr-target-bridge.mjs|
              http-generic-api/test-openapi-precise-legacy-registry-transition.mjs|
              .github/workflows/spec014-main-79cbbc63-reconciliation-launcher.yml)
                ;;
              *)
                echo "Unexpected final changed file: $file" >&2
                exit 1
                ;;
            esac
          done
          test -n "${changed[*]}"

      - name: Remove launcher and publish merge commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/spec014-main-79cbbc63-reconciliation-launcher.yml
          git add -A
          git commit -m 'chore(spec-014): reconcile main 79cbbc63 generated contracts'
          parent_count="$(git cat-file -p HEAD | grep -c '^parent ')"
          test "$parent_count" = '2'
          test "$(git rev-parse HEAD^2)" = '79cbbc634e690bf30ab2827144cb49c88b14f9a5'
          git push origin 'HEAD:gpt/reconcile-spec014-main-79cbbc63-20260802'
