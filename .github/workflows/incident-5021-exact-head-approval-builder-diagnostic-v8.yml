name: Incident 5021 approval builder diagnostic v8

on:
  pull_request:
    branches:
      - gpt/incident-5021/draft-merge-guard-v2-20260803
    paths:
      - .github/workflows/incident-5021-exact-head-approval-builder-diagnostic-v8.yml

permissions:
  contents: read

concurrency:
  group: incident-5021-approval-builder-diagnostic-v8
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose repr-safe exact-head approval candidate without publishing
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: gpt/incident-5021/exact-head-approval-guard-20260803
      BUILDER_BRANCH: gpt/incident-5021/exact-head-approval-guard-builder-20260803
      EXPECTED_TARGET_SHA: 2c89cc14d8a38a09034f0306eccff273234046e2
      REPORT_PATH: incident-5021-builder-diagnostic-v8.json
    steps:
      - name: Checkout immutable target branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install connector dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Verify target and fetch diagnostic source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"
          test "$(git status --porcelain)" = ""
          git fetch --no-tags origin "$BUILDER_BRANCH"

      - name: Build and run repr-safe structured diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYBUILD'
          from pathlib import Path
          import subprocess
          import textwrap

          branch = "gpt/incident-5021/exact-head-approval-guard-builder-20260803"
          path = ".github/workflows/incident-5021-exact-head-approval-builder-diagnostic-v6.yml"
          raw = subprocess.check_output(["git", "show", f"origin/{branch}:{path}"], text=True)
          start_marker = "          python - <<'PYDIAG'\n"
          end_marker = "\n          PYDIAG\n"
          start = raw.find(start_marker)
          if start < 0:
              raise SystemExit("V6 diagnostic start marker missing")
          start += len(start_marker)
          end = raw.find(end_marker, start)
          if end < 0:
              raise SystemExit("V6 diagnostic end marker missing")
          source = textwrap.dedent(raw[start:end])
          marker = '    script = replace_ast_node(script, success_node, success_replacement)\n'
          if source.count(marker) != 1:
              raise SystemExit(f"V6 success injection marker mismatch: {source.count(marker)}")

          patches = []
          def add_patch(label, variable, code):
              patches.extend([
                  f"    {variable}_node = find_labelled_assignment(script, {label!r})",
                  f"    {variable}_replacement = {code!r}",
                  f"    script = replace_ast_node(script, {variable}_node, {variable}_replacement)",
                  "",
              ])

          enforcement_anchor = '  if (!renewalAllowed(input)) {\n    throw lifecycleError(\n'
          enforcement_value = '''  if (protectedFinalizationRequiresExplicitEnvelope(operationKey, input)) {
    throw lifecycleError(
      409,
      "OPERATION_CAPABILITY_ENVELOPE_REQUIRED",
      "Protected pull-request finalization requires a separately issued capability envelope; automatic renewal is disabled.",
      {
        operation_key: operationKey,
        previous_envelope_id: existingEnvelopeId || null,
        automatic_renewal_enabled: false,
        next_action: "supply_explicit_approved_capability_envelope",
        secrets_included: false,
      },
    );
  }

  if (!renewalAllowed(input)) {
    throw lifecycleError(
'''
          add_patch("explicit envelope enforcement", "enforcement", "\n".join([
              f"enforcement_anchor = {enforcement_anchor!r}",
              f"enforcement_value = {enforcement_value!r}",
              "if capability.count(enforcement_anchor) != 1:",
              "    raise SystemExit(f\"explicit enforcement anchor: expected one match, found {capability.count(enforcement_anchor)}\")",
              "capability = capability.replace(enforcement_anchor, enforcement_value, 1)",
              "",
          ]))

          testing_export_anchor = '  renewalProfile,\n  renewalAllowed,\n  publicFailure,\n};\n'
          testing_export_value = '  renewalProfile,\n  renewalAllowed,\n  protectedFinalizationRequiresExplicitEnvelope,\n  publicFailure,\n};\n'
          add_patch("testing export", "testing_export", "\n".join([
              f"testing_export_anchor = {testing_export_anchor!r}",
              f"testing_export_value = {testing_export_value!r}",
              "if capability.count(testing_export_anchor) != 1:",
              "    raise SystemExit(f\"testing export anchor: expected one match, found {capability.count(testing_export_anchor)}\")",
              "capability = capability.replace(testing_export_anchor, testing_export_value, 1)",
              "",
          ]))

          expired_anchor = '        operation_key: "repo.change.execute",\n        capability_envelope_id: "env-expired",\n'
          expired_value = '        operation_key: "repo.change.execute",\n        automation_key: "branch_cleanup",\n        capability_envelope_id: "env-expired",\n'
          add_patch("expired renewal safe recipe", "expired", "\n".join([
              f"expired_anchor = {expired_anchor!r}",
              f"expired_value = {expired_value!r}",
              "if capability_test.count(expired_anchor) != 1:",
              "    raise SystemExit(f\"expired renewal anchor: expected one match, found {capability_test.count(expired_anchor)}\")",
              "capability_test = capability_test.replace(expired_anchor, expired_value, 1)",
              "",
          ]))

          approval_anchor = '      input: { operation_key: "repo.change.execute", owner: "owner", repo: "repo" },\n      operationKey: "repo.change.execute",\n      createEnvelope: async () => ({\n'
          approval_value = '      input: { operation_key: "repo.change.execute", automation_key: "branch_cleanup", owner: "owner", repo: "repo" },\n      operationKey: "repo.change.execute",\n      createEnvelope: async () => ({\n'
          add_patch("approval renewal safe recipe", "approval", "\n".join([
              f"approval_anchor = {approval_anchor!r}",
              f"approval_value = {approval_value!r}",
              "if capability_test.count(approval_anchor) != 1:",
              "    raise SystemExit(f\"approval renewal anchor: expected one match, found {capability_test.count(approval_anchor)}\")",
              "capability_test = capability_test.replace(approval_anchor, approval_value, 1)",
              "",
          ]))

          capability_tests_anchor = '''  assert.equal(
    _testingOperationCapabilityLifecycleService.repositoryResourceUri({
      owner: "owner",
      repo: "repo",
    }),
    "github://owner/repo",
  );
'''
          capability_tests_addition = capability_tests_anchor + '''  assert.equal(
    _testingOperationCapabilityLifecycleService.protectedFinalizationRequiresExplicitEnvelope(
      "repo.change.execute",
      {},
    ),
    true,
  );
  assert.equal(
    _testingOperationCapabilityLifecycleService.protectedFinalizationRequiresExplicitEnvelope(
      "repo.change.execute",
      { automation_key: "branch_cleanup" },
    ),
    false,
  );
  assert.equal(
    _testingOperationCapabilityLifecycleService.protectedFinalizationRequiresExplicitEnvelope(
      "operation.resume",
      {},
    ),
    true,
  );

  {
    let createCalls = 0;
    await assert.rejects(
      () => prepareOperationCapabilityLifecycle({
        pool: {},
        auth: { tenant_id: "tenant-a", user_id: "user-a" },
        input: { operation_key: "repo.change.execute", owner: "owner", repo: "repo" },
        operationKey: "repo.change.execute",
        createEnvelope: async () => { createCalls += 1; return {}; },
      }),
      (error) => error.code === "OPERATION_CAPABILITY_ENVELOPE_REQUIRED"
        && error.details?.automatic_renewal_enabled === false,
    );
    assert.equal(createCalls, 0);
  }
'''
          add_patch("capability explicit envelope tests", "capability_tests", "\n".join([
              f"capability_tests_anchor = {capability_tests_anchor!r}",
              f"capability_tests_addition = {capability_tests_addition!r}",
              "if capability_test.count(capability_tests_anchor) != 1:",
              "    raise SystemExit(f\"capability test insertion anchor: expected one match, found {capability_test.count(capability_tests_anchor)}\")",
              "capability_test = capability_test.replace(capability_tests_anchor, capability_tests_addition, 1)",
              "",
          ]))

          openapi_assertion_anchor = '  assert.match(lifecycleOpenApi, /OPERATION_CAPABILITY_RENEWAL_REQUIRES_APPROVAL/);\n'
          openapi_assertion_value = openapi_assertion_anchor + '  assert.match(lifecycleOpenApi, /OPERATION_CAPABILITY_ENVELOPE_REQUIRED/);\n'
          add_patch("OpenAPI explicit envelope assertion", "openapi_assertion", "\n".join([
              f"openapi_assertion_anchor = {openapi_assertion_anchor!r}",
              f"openapi_assertion_value = {openapi_assertion_value!r}",
              "if capability_test.count(openapi_assertion_anchor) != 1:",
              "    raise SystemExit(f\"OpenAPI assertion anchor: expected one match, found {capability_test.count(openapi_assertion_anchor)}\")",
              "capability_test = capability_test.replace(openapi_assertion_anchor, openapi_assertion_value, 1)",
              "",
          ]))

          description_anchor = '    envelope. Missing or expired envelopes may be recreated from a governed\n    dry-run, but approval is never granted automatically.\n'
          description_value = '    envelope. Missing or expired envelopes may be recreated from a governed\n    dry-run for lower-risk recipes, but protected pull-request finalization and\n    operation resume require a separately issued explicit envelope.\n'
          add_patch("OpenAPI lifecycle description", "lifecycle_description", "\n".join([
              f"description_anchor = {description_anchor!r}",
              f"description_value = {description_value!r}",
              "if openapi.count(description_anchor) != 1:",
              "    raise SystemExit(f\"OpenAPI lifecycle description anchor: expected one match, found {openapi.count(description_anchor)}\")",
              "openapi = openapi.replace(description_anchor, description_value, 1)",
              "",
          ]))

          renewal_description_anchor = '            Allows creation of a fresh dry-run envelope when none exists or the\n            supplied envelope expired. It never grants approval automatically.\n'
          renewal_description_value = '            Allows creation of a fresh dry-run envelope when none exists or the\n            supplied envelope expired for lower-risk recipes. It is ignored for protected\n            pull-request finalization and operation resume, which require an explicit envelope.\n'
          add_patch("OpenAPI renewal field description", "renewal_description", "\n".join([
              f"renewal_description_anchor = {renewal_description_anchor!r}",
              f"renewal_description_value = {renewal_description_value!r}",
              "if openapi.count(renewal_description_anchor) != 1:",
              "    raise SystemExit(f\"OpenAPI renewal description anchor: expected one match, found {openapi.count(renewal_description_anchor)}\")",
              "openapi = openapi.replace(renewal_description_anchor, renewal_description_value, 1)",
              "",
          ]))

          error_enum_anchor = '                - OPERATION_CAPABILITY_ENVELOPE_REJECTED\n'
          error_enum_value = error_enum_anchor + '                - OPERATION_CAPABILITY_ENVELOPE_REQUIRED\n'
          add_patch("OpenAPI error enum", "error_enum", "\n".join([
              f"error_enum_anchor = {error_enum_anchor!r}",
              f"error_enum_value = {error_enum_value!r}",
              "if openapi.count(error_enum_anchor) != 1:",
              "    raise SystemExit(f\"OpenAPI error enum anchor: expected one match, found {openapi.count(error_enum_anchor)}\")",
              "openapi = openapi.replace(error_enum_anchor, error_enum_value, 1)",
              "",
          ]))

          injection = "\n" + "\n".join(patches)
          source = source.replace(marker, marker + injection, 1)
          source = source.replace("incident-5021-builder-diagnostic-v6.json", "incident-5021-builder-diagnostic-v8.json")
          source = source.replace("incident_5021_exact_head_approval_builder_v6", "incident_5021_exact_head_approval_builder_v8")
          source = source.replace("incident-5021-builder-diagnostic-v6.py", "incident-5021-builder-diagnostic-v8.py")
          compile(source, "/tmp/incident-5021-diagnostic-driver-v8.py", "exec")
          Path("/tmp/incident-5021-diagnostic-driver-v8.py").write_text(source)
          PYBUILD
          python /tmp/incident-5021-diagnostic-driver-v8.py

      - name: Upload repr-safe structured diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incident-5021-builder-diagnostic-v8-${{ github.sha }}
          path: incident-5021-builder-diagnostic-v8.json
          if-no-files-found: error
          retention-days: 7

      - name: Fail unless repr-safe candidate is fully clean
        shell: bash
        run: |
          python - <<'PYCHECK'
          import json
          from pathlib import Path
          report = json.loads(Path("incident-5021-builder-diagnostic-v8.json").read_text())
          checks = [
              report.get("diagnostic_completed") is True,
              report.get("patch_returncode") == 0,
              report.get("all_tests_passed") is True,
              report.get("diff_check_returncode") == 0,
              report.get("exact_six_file_boundary") is True,
          ]
          if not all(checks):
              raise SystemExit("repr-safe candidate diagnostic is not fully clean; inspect structured artifact")
          print("repr-safe candidate diagnostic fully clean")
          PYCHECK
