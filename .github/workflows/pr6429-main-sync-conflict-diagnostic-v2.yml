name: PR 6429 main reconciliation conflict diagnostic v2

on:
  push:
    branches:
      - gpt/reconcile/pr6429-main-20260806-v2

permissions:
  contents: read

concurrency:
  group: pr6429-main-reconciliation-conflict-diagnostic-v2
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORK_BRANCH: gpt/reconcile/pr6429-main-20260806-v2
    steps:
      - name: Checkout exact reconciliation branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Diagnose merge against captured main
        id: merge_diagnostic
        shell: bash
        run: |
          set -euo pipefail
          evidence_root="${RUNNER_TEMP}/pr6429-main-reconciliation-conflicts-v2"
          mkdir -p "${evidence_root}"

          remote_branch_head="$(git ls-remote --exit-code origin "refs/heads/${WORK_BRANCH}" | awk '{print $1}')"
          captured_main_head="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test "${remote_branch_head}" = "${GITHUB_SHA}"
          test "${captured_main_head}" =~ ^[0-9a-f]{40}$
          git fetch --no-tags origin "${captured_main_head}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          set +e
          git merge --no-ff --no-commit "${captured_main_head}"
          merge_rc=$?
          set -e

          git diff --name-only --diff-filter=U | sort > "${evidence_root}/conflicts.txt"
          git status --short > "${evidence_root}/status.txt"
          conflict_count="$(grep -cve '^$' "${evidence_root}/conflicts.txt" || true)"
          {
            echo "event_sha=${GITHUB_SHA}"
            echo "captured_main_sha=${captured_main_head}"
            echo "merge_rc=${merge_rc}"
            echo "conflict_count=${conflict_count}"
            echo "force_push=false"
            echo "remote_write=false"
            echo "production_mutation=false"
            echo "migration_apply=false"
            echo "provider_dispatch=false"
            echo "secrets_included=false"
          } > "${evidence_root}/bindings.txt"

          {
            echo '## PR #6429 reconciliation diagnostic'
            echo
            echo '```text'
            cat "${evidence_root}/bindings.txt"
            echo
            echo '--- conflicts ---'
            cat "${evidence_root}/conflicts.txt"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "merge_rc=${merge_rc}" >> "${GITHUB_OUTPUT}"
          echo "conflict_count=${conflict_count}" >> "${GITHUB_OUTPUT}"
          echo "captured_main_sha=${captured_main_head}" >> "${GITHUB_OUTPUT}"

          cat "${evidence_root}/bindings.txt"
          echo '--- conflicts ---'
          cat "${evidence_root}/conflicts.txt"

          # Diagnostic-only: preserve evidence for upload, never commit or push.
          exit 0

      - name: Upload conflict diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: pr6429-main-reconciliation-conflicts-v2-${{ github.sha }}
          path: ${{ runner.temp }}/pr6429-main-reconciliation-conflicts-v2
          if-no-files-found: error
          retention-days: 7

      - name: Confirm diagnostic remained read-only
        shell: bash
        run: |
          set -euo pipefail
          remote_branch_head="$(git ls-remote --exit-code origin "refs/heads/${WORK_BRANCH}" | awk '{print $1}')"
          test "${remote_branch_head}" = "${GITHUB_SHA}"
          test "${{ steps.merge_diagnostic.outputs.captured_main_sha }}" =~ ^[0-9a-f]{40}$
          echo "merge_rc=${{ steps.merge_diagnostic.outputs.merge_rc }}"
          echo "conflict_count=${{ steps.merge_diagnostic.outputs.conflict_count }}"
