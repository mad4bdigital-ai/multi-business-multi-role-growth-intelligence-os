name: OpenAPI Auto Sync

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spec009-final-regeneration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Generate Custom GPT schemas
        working-directory: http-generic-api
        run: npm run schemas:generate

      - name: Sync activation gateway runtime bundle
        working-directory: http-generic-api
        run: npm run activation-gateway:bundle:sync

      - name: Generate frontend dispatch evidence
        working-directory: http-generic-api
        run: npm run frontend:dispatch:generate -- --baseline-ref=main

      - name: Verify generated contracts
        working-directory: http-generic-api
        run: |
          node test-tenant-activation-session-alias.mjs
          node test-activation-gateway-policy-parity.mjs
          node test-activation-host-gateway-boundary.mjs
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-openapi-route-coverage.mjs
          npm run openapi:auth:check

      - name: Commit generated artifacts to current branch
        shell: bash
        run: |
          git config user.name "admin-assitant-growth-os[bot]"
          git config user.email "283129699+admin-assitant-growth-os[bot]@users.noreply.github.com"
          git add http-generic-api/openapi/openapi.tenant-gpt.activation.yaml
          git add edge/activation-gateway/generated/route-policy.json
          git add http-generic-api/activation-gateway-runtime/generated/route-policy.json
          git add http-generic-api/activation-gateway-runtime/bundle-manifest.json
          git add http-generic-api/frontend-surface-dispatch.generated.json
          git add http-generic-api/openapi/frontend-runtime-routes.generated.yaml
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Spec 009: regenerate merged contract artifacts"
          git push origin HEAD:${GITHUB_REF_NAME}
