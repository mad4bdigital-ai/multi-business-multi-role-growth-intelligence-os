name: OpenAPI Auto Sync

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: staging-automation-final-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - working-directory: http-generic-api
        run: npm ci

      - name: Generate and validate frontend evidence
        working-directory: http-generic-api
        run: |
          npm run frontend:dispatch:generate -- --baseline-ref=main
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-runtime-gate-deployment-info-parity.mjs

      - name: Commit deterministic frontend artifacts
        shell: bash
        run: |
          git config user.name "admin-assitant-growth-os[bot]"
          git config user.email "283129699+admin-assitant-growth-os[bot]@users.noreply.github.com"
          git add http-generic-api/frontend-surface-dispatch.generated.json
          git add http-generic-api/openapi/frontend-runtime-routes.generated.yaml
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Regenerate frontend evidence on final PR head"
          git push origin HEAD:${GITHUB_REF_NAME}
