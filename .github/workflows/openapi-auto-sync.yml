name: T050 Artifact Generation Helper

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: t050-artifact-helper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Generate schemas
        working-directory: http-generic-api
        run: npm run schemas:generate

      - name: Sync activation gateway runtime bundle
        working-directory: http-generic-api
        run: npm run activation-gateway:bundle:sync

      - name: Validate generated schemas and bundle
        working-directory: http-generic-api
        run: |
          npm run schemas:check
          npm run activation-gateway:bundle:check
          node test-openapi-split-regeneration-parity.mjs

      - name: Commit reviewed generated artifacts to helper branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --             http-generic-api/openapi/openapi.tenant-gpt.activation.yaml             edge/activation-gateway/generated/route-policy.json             http-generic-api/activation-gateway-runtime/generated/route-policy.json             http-generic-api/activation-gateway-runtime/bundle-manifest.json
          if git diff --cached --quiet; then
            echo "No generated artifact changes."
            exit 0
          fi
          git commit -m "chore: generate T050 schema artifacts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
