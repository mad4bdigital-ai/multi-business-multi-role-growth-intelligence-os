name: Full Release Readiness

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: full-release-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Validate credential availability
        env:
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${BACKEND_API_KEY}" ]]; then
            echo "::error::BACKEND_API_KEY repository secret is required."
            exit 1
          fi

      - name: Run and persist full release readiness
        env:
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-readiness-artifacts
          curl --fail-with-body --silent --show-error \
            --connect-timeout 20 \
            --max-time 600 \
            -H "Authorization: Bearer ${BACKEND_API_KEY}" \
            "https://auth.mad4b.com/release/readiness?full=true&persist=true" \
            --output release-readiness-artifacts/full-release-readiness.json

      - name: Validate readiness result and publish summary
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = 'release-readiness-artifacts/full-release-readiness.json';
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          const summary = report.summary || {};
          const degraded = Object.entries(report)
            .filter(([, value]) => value && typeof value === 'object' && typeof value.status === 'string' && value.status !== 'pass')
            .map(([key, value]) => ({ key, status: value.status, detail: value.detail || null }));
          const compact = {
            ok: report.ok !== false,
            overall: report.overall || null,
            run_id: report.run_id || null,
            checked_at: report.checked_at || null,
            summary,
            degraded_surfaces: degraded,
            secrets_included: false,
          };
          fs.writeFileSync('release-readiness-artifacts/full-release-readiness-summary.json', JSON.stringify(compact, null, 2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `## Full Release Readiness\n\n` +
            `- Overall: ${compact.overall}\n` +
            `- Run ID: ${compact.run_id}\n` +
            `- Checks: ${summary.pass || 0} pass, ${summary.warn || 0} warn, ${summary.fail || 0} fail\n` +
            `- Degraded surfaces: ${degraded.length}\n`);
          console.log(JSON.stringify(compact, null, 2));
          if (compact.overall === 'fail' || Number(summary.fail || 0) > 0) process.exit(1);
          NODE

      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-release-readiness-${{ github.run_id }}
          path: release-readiness-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Restore canonical workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "admin-assitant-growth-os[bot]"
          git config user.email "283129699+admin-assitant-growth-os[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- .github/workflows/openapi-auto-sync.yml
          git add .github/workflows/openapi-auto-sync.yml
          if git diff --cached --quiet; then
            echo "Canonical workflow already restored."
            exit 0
          fi
          git commit -m "Restore standard OpenAPI auto-sync workflow"
          git push origin HEAD:${GITHUB_REF_NAME}
