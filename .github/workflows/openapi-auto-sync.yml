name: OpenAPI Auto Sync

on:
  push:
    branches:
      - main
    paths:
      - "http-generic-api/routes/**"
      - "http-generic-api/openapi.yaml"
      - "http-generic-api/openapi.*.yaml"
      - "http-generic-api/openapi-route-coverage.allowlist.json"
      - "http-generic-api/scripts/openapi-*.mjs"
      - "http-generic-api/scripts/split-openapi.mjs"
      - "http-generic-api/scripts/repo-maintenance-sync.mjs"
      - "http-generic-api/scripts/update-repo-planning-docs.mjs"
      - "docs/**/*.md"
      - "canonicals/**/*.md"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: openapi-auto-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-contract-sync:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Report auto-sync PR credential mode
        shell: bash
        env:
          REPO_AUTOSYNC_TOKEN_PRESENT: ${{ secrets.REPO_AUTOSYNC_TOKEN != '' }}
        run: |
          if [ "$REPO_AUTOSYNC_TOKEN_PRESENT" = "true" ]; then
            echo "Auto-sync PR credential mode: REPO_AUTOSYNC_TOKEN secret is configured."
          else
            echo "Auto-sync PR credential mode: using default GITHUB_TOKEN. Repository Actions settings must allow PR creation."
          fi

      - name: Run repository contract maintenance sync
        id: maintenance
        working-directory: http-generic-api
        run: |
          node scripts/repo-maintenance-sync.mjs --write --report-file "$RUNNER_TEMP/repo-maintenance-sync-result.json" | tee "$RUNNER_TEMP/repo-maintenance-sync-output.log"

      - name: Check generated diff
        id: diff
        shell: bash
        run: |
          CHANGED_FILES="$(git diff --name-only -- \
            http-generic-api/openapi.yaml \
            docs/**/*.md \
            canonicals/**/*.md \
            '*.md')"
          if git diff --quiet -- \
            http-generic-api/openapi.yaml \
            docs/**/*.md \
            canonicals/**/*.md \
            '*.md'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "auto_merge=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changed files:"
            echo "$CHANGED_FILES"

            AUTO_MERGE=true
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                docs/*.md|docs/**/*.md|canonicals/*.md|canonicals/**/*.md|*.md)
                  ;;
                *)
                  AUTO_MERGE=false
                  ;;
              esac
            done <<< "$CHANGED_FILES"

            if git diff -- http-generic-api/openapi.yaml | grep -q "TODO document"; then
              AUTO_MERGE=false
            fi

            echo "auto_merge=$AUTO_MERGE" >> "$GITHUB_OUTPUT"
          fi

      - name: Create repository contract sync PR
        id: cpr
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/repo-contract-auto-sync-${{ github.run_id }}
          delete-branch: true
          title: "Auto-sync repository contracts"
          commit-message: "Auto-sync repository contracts"
          labels: |
            openapi
            docs
            automated
          token: ${{ secrets.REPO_AUTOSYNC_TOKEN || github.token }}
          body: |
            Autogenerated by **OpenAPI Auto Sync** after a push to `main`.

            This PR may update:
            - OpenAPI route stubs for newly detected Express routes.
            - Generated repository maintenance planning docs such as `docs/repo-maintenance-status.md`.

            Generated/scoped OpenAPI schema files are not committed by this default automation. Use `repo-maintenance-sync.mjs --write --write-split-schemas` in a reviewed PR when split schema artifacts need to change.

            Review checklist:
            - Replace `TODO document ...` summaries with precise summaries.
            - Replace autogenerated request/response schemas with the real contract.
            - Confirm authentication and authorization notes.
            - Confirm `x-openai-isConsequential` is correct.
            - Confirm generated docs reflect the intended source-of-truth state.
            - Do not merge this PR as-is for externally consumed routes unless generated stubs have been reviewed.
            - Do not merge autogenerated public route stubs without human contract review.

            Maintenance result is committed in `repo-maintenance-sync-result.json` when generated changes exist.

      - name: Enable auto-merge for safe docs-only sync PRs
        if: steps.diff.outputs.auto_merge == 'true' && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.REPO_AUTOSYNC_TOKEN || github.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --auto --squash --delete-branch
