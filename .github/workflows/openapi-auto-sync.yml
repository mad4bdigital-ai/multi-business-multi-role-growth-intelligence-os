name: OpenAPI Auto Sync

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openapi-capability-repair-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-capability-coverage-openapi:
    runs-on: ubuntu-latest
    if: github.ref_name == 'gpt/agent-capability-evidence-v1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Rebuild capability coverage OpenAPI paths
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:http-generic-api/openapi.yaml > "$RUNNER_TEMP/openapi-main.yaml"
          python3 - <<'PY'
          from pathlib import Path

          source = Path(__import__('os').environ['RUNNER_TEMP']) / 'openapi-main.yaml'
          target = Path('http-generic-api/openapi.yaml')
          marker = '  /platform/agent-governance/readiness:\n'
          coverage = '''  /platform/agent-governance/logic-coverage:
    get:
      tags: [platform-agent-governance]
      security: [{ adminBearerAuth: [] }, { backendApiKeyAuth: [] }]
      operationId: getAgentGovernanceLogicCoverage
      summary: Read evidence-backed Agent Logic runtime coverage
      description: Returns Logic inventory separately from retrieval, selection, dispatch, success, and verification evidence. Active inventory alone is not counted as usage.
      parameters:
        - { name: logic_key, in: query, required: false, schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,191}$' } }
        - { name: registry_status, in: query, required: false, schema: { type: string, pattern: '^[a-z0-9_-]{1,32}$' } }
        - name: usage_status
          in: query
          required: false
          schema: { type: string, enum: [never_retrieved, retrieved_never_selected, selected_never_dispatched, dispatched_never_succeeded, succeeded_not_verified, verified] }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 250, default: 100 } }
      responses:
        "200": { description: Logic runtime coverage and usage evidence }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Admin principal required }
  /platform/agent-governance/engine-coverage:
    get:
      tags: [platform-agent-governance]
      security: [{ adminBearerAuth: [] }, { backendApiKeyAuth: [] }]
      operationId: getAgentGovernanceEngineCoverage
      summary: Read evidence-backed Agent Engine runtime coverage
      description: Returns workflow-bound Engine references separately from retrieval, selection, dispatch, success, and verification evidence. Textual references alone are not counted as usage.
      parameters:
        - { name: engine_key, in: query, required: false, schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,191}$' } }
        - name: usage_status
          in: query
          required: false
          schema: { type: string, enum: [never_retrieved, retrieved_never_selected, selected_never_dispatched, dispatched_never_succeeded, succeeded_not_verified, verified] }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 250, default: 100 } }
      responses:
        "200": { description: Engine runtime coverage and usage evidence }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Admin principal required }
'''
          text = source.read_text(encoding='utf-8')
          if marker not in text:
              raise SystemExit('Agent Governance readiness marker not found in main OpenAPI')
          if '/platform/agent-governance/logic-coverage:' in text or '/platform/agent-governance/engine-coverage:' in text:
              raise SystemExit('Main OpenAPI already contains capability coverage paths')
          target.write_text(text.replace(marker, coverage + marker, 1), encoding='utf-8')
          PY

      - name: Validate repaired contracts
        working-directory: http-generic-api
        run: |
          node -e "const fs=require('node:fs');const YAML=require('yaml');YAML.parse(fs.readFileSync('openapi.yaml','utf8'));console.log('OpenAPI YAML parse passed');"
          node test-agent-governance-runtime.mjs
          node test-agent-capability-coverage.mjs
          node test-agent-capability-admin-tool-registry.mjs

      - name: Restore canonical workflow and commit repair
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/workflows/openapi-auto-sync.yml > .github/workflows/openapi-auto-sync.yml
          git config user.name "growth-intelligence-platform[bot]"
          git config user.email "growth-intelligence-platform[bot]@users.noreply.github.com"
          git add http-generic-api/openapi.yaml .github/workflows/openapi-auto-sync.yml
          if git diff --cached --quiet; then
            echo "No repair changes detected."
            exit 0
          fi
          git commit -m "Repair Agent capability coverage OpenAPI contracts"
          git push origin HEAD:${GITHUB_REF_NAME}
