name: OpenAPI Auto Sync

on:
  push:
    branches:
      - main
    paths:
      - "http-generic-api/routes/**"
      - "http-generic-api/migrations/**"
      - "http-generic-api/test-*.mjs"
      - "http-generic-api/test-openapi-builder-schema-guard.mjs"
      - "http-generic-api/openapi.yaml"
      - "http-generic-api/openapi.*.yaml"
      - "http-generic-api/openapi/**/*.yaml"
      - "http-generic-api/openapi-route-coverage.allowlist.json"
      - "http-generic-api/package.json"
      - "http-generic-api/package-lock.json"
      - "http-generic-api/scripts/openapi-*.mjs"
      - "http-generic-api/scripts/generate-custom-gpt-schemas.mjs"
      - "http-generic-api/scripts/split-openapi.mjs"
      - "http-generic-api/scripts/surface-contract-discovery.mjs"
      - "http-generic-api/scripts/repo-maintenance-sync.mjs"
      - "http-generic-api/scripts/update-repo-planning-docs.mjs"
      - "http-generic-api/scripts/pipeline-connectivity-check.mjs"
      - "http-generic-api/test-pipeline-connectivity-check.mjs"
      - ".specify/pipeline-connectivity-contract.json"
      - ".github/workflows/openapi-auto-sync.yml"
      - ".github/governance/generated-artifact-registry.json"
      - ".github/ops/generated-artifact-governance.mjs"
      - ".github/ops/github-followup-automerge-readiness.mjs"
      - "canonicals/openapi/**/*.yaml"
      - "edge/activation-gateway/**"
      - "docs/**/*.md"
      - "canonicals/**/*.md"
      - "*.md"
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact current main SHA to synchronize
        required: true
        type: string

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: repository-generated-artifacts-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  dispatch-exact-main:
    name: Dispatch exact main synchronization
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Resolve live main and dispatch exact writer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          expected_head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "${expected_head_sha}" != "${EVENT_HEAD_SHA}" ]]; then
            echo "OpenAPI Auto Sync dispatcher is stale: event=${EVENT_HEAD_SHA}, current_main=${expected_head_sha}. A newer main push owns synchronization."
            exit 0
          fi
          gh workflow run openapi-auto-sync.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f expected_head_sha="${expected_head_sha}"
          echo "Dispatched OpenAPI Auto Sync writer for exact main ${expected_head_sha}."

  repo-contract-sync:
    name: Synchronize repository contracts from exact main
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact governed main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected_head_sha }}

      - name: Pin exact source and safe target branch
        id: target
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          git fetch --no-tags origin main
          current_head_sha="$(git rev-parse origin/main)"
          test "${current_head_sha}" = "${EXPECTED_HEAD_SHA}"
          TARGET_BRANCH="repo-contract-auto-sync-${GITHUB_RUN_ID}"
          case "${TARGET_BRANCH}" in
            main|Production)
              echo "Refusing protected target branch ${TARGET_BRANCH}."
              exit 1
              ;;
          esac
          echo "expected_head_sha=${EXPECTED_HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "target_branch=${TARGET_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Validate inter-pipeline connectivity
        run: |
          node http-generic-api/scripts/pipeline-connectivity-check.mjs
          node http-generic-api/test-pipeline-connectivity-check.mjs

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Report auto-sync PR credential mode
        shell: bash
        env:
          REPO_AUTOSYNC_TOKEN_PRESENT: ${{ secrets.REPO_AUTOSYNC_TOKEN != '' }}
        run: |
          if [ "$REPO_AUTOSYNC_TOKEN_PRESENT" = "true" ]; then
            echo "Auto-sync PR credential mode: REPO_AUTOSYNC_TOKEN secret is configured."
          else
            echo "Auto-sync PR credential mode: trusted writer unavailable; PR creation will fail closed if changes are generated."
          fi

      - name: Run repository contract maintenance sync without Work Map ownership
        id: maintenance
        working-directory: http-generic-api
        run: |
          node scripts/repo-maintenance-sync.mjs --write --skip-work-maps --report-file "$RUNNER_TEMP/repo-maintenance-sync-result.json" | tee "$RUNNER_TEMP/repo-maintenance-sync-output.log"

      - name: Refuse Work Map mutation outside the governed writer
        shell: bash
        run: |
          if ! git diff --quiet -- docs/work-maps; then
            echo "OpenAPI Auto Sync must not modify docs/work-maps. Use the governed Work Map Autofix writer."
            git diff --name-only -- docs/work-maps
            exit 1
          fi

      - name: Generate Custom GPT schemas from canonical sources
        working-directory: http-generic-api
        run: npm run schemas:generate

      - name: Sync activation gateway runtime bundle
        working-directory: http-generic-api
        run: npm run activation-gateway:bundle:sync

      - name: Validate generated schemas and parity
        working-directory: http-generic-api
        run: npm run schemas:guard

      - name: Check generated diff
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          changed_files=()
          while IFS= read -r -d '' entry; do
            changed_files+=("${entry:3}")
          done < <(git status --porcelain=v1 -z --untracked-files=all)

          if (( ${#changed_files[@]} == 0 )); then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "auto_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Changed files:"

          AUTO_MERGE=true
          for file in "${changed_files[@]}"; do
            printf '%s\n' "$file"
            if classification="$(
              node .github/ops/generated-artifact-governance.mjs \
                classify \
                --owner openapi_auto_sync \
                --path "$file" \
                2>/dev/null
            )"; then
              if [[ "$(jq -r '.auto_merge_allowed' <<<"$classification")" != "true" ]]; then
                AUTO_MERGE=false
              fi
            else
              AUTO_MERGE=false
            fi
          done

          if git diff -- http-generic-api/openapi.yaml | grep -q "TODO document"; then
            AUTO_MERGE=false
          fi

          echo "auto_merge=$AUTO_MERGE" >> "$GITHUB_OUTPUT"

      - name: Revalidate exact main before PR creation
        id: freshness
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ steps.target.outputs.expected_head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          latest_main_sha="$(git rev-parse origin/main)"
          echo "latest_main_sha=${latest_main_sha}" >> "$GITHUB_OUTPUT"
          if [[ "${latest_main_sha}" != "${EXPECTED_HEAD_SHA}" ]]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale repository auto-sync run. Expected ${EXPECTED_HEAD_SHA}, current main is ${latest_main_sha}."
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Require trusted follow-up writer identity
        if: steps.diff.outputs.changed == 'true' && steps.freshness.outputs.current == 'true'
        env:
          REPO_AUTOSYNC_TOKEN_PRESENT: ${{ secrets.REPO_AUTOSYNC_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REPO_AUTOSYNC_TOKEN_PRESENT" != "true" ]]; then
            echo "::error::REPO_AUTOSYNC_TOKEN is required before creating a repository auto-sync follow-up."
            exit 1
          fi

      - name: Create repository contract sync PR
        id: cpr
        if: steps.diff.outputs.changed == 'true' && steps.freshness.outputs.current == 'true'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          base: main
          branch: ${{ steps.target.outputs.target_branch }}
          delete-branch: true
          title: "Auto-sync repository contracts"
          commit-message: "Auto-sync repository contracts"
          labels: |
            openapi
            docs
            automated
          token: ${{ secrets.REPO_AUTOSYNC_TOKEN }}
          body: |
            <!-- openapi-auto-sync-source:${{ steps.target.outputs.expected_head_sha }} -->

            Autogenerated by **OpenAPI Auto Sync** from exact `main` `${{ steps.target.outputs.expected_head_sha }}`.

            Generation sequence:
            1. Update the canonical `openapi.yaml` and repository planning docs without Work Map mutation.
            2. Generate split Custom GPT schemas into a temporary directory.
            3. Validate all request/response schemas recursively.
            4. Write generated artifacts only after validation succeeds.
            5. Verify committed artifacts exactly match their canonical sources.

            Work Maps are intentionally excluded. Their sole remote writer is the governed Spec Kit Work Map Autofix workflow.

            Automated finalization is permitted only when every changed path is registered to `openapi_auto_sync`, the generated-artifact registry marks the set eligible, `main` is protected server-side, GitHub native auto-merge is disabled, and the Governance Finalizer obtains Trusted GitHub App attestation for the exact merge candidate. Any runtime/schema/unknown output remains open for governed review.

            Review checklist:
            - Replace any `TODO document ...` summaries with precise contracts.
            - Confirm request and response properties match implementation.
            - Confirm authentication and authorization notes.
            - Confirm `x-openai-isConsequential` is correct.
            - Confirm each Custom GPT schema stays within its operation budget.
            - Confirm canonical and generated artifacts remain byte-for-byte aligned.

      - name: Record governance-finalizer eligibility for registered safe generated artifacts
        if: steps.diff.outputs.auto_merge == 'true' && steps.freshness.outputs.current == 'true' && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.REPO_AUTOSYNC_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          EXPECTED_HEAD_SHA: ${{ steps.target.outputs.expected_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          latest_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "${latest_main_sha}" != "${EXPECTED_HEAD_SHA}" ]]; then
            gh pr close "${PR_NUMBER}" --comment "Closing stale docs-only auto-sync PR: main moved from ${EXPECTED_HEAD_SHA} to ${latest_main_sha} before governance finalization. A newer run owns regeneration."
            echo "Refused stale generated-artifact finalization."
            exit 0
          fi

          pr_head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          changed_files="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.changed_files')"
          [[ "$pr_head_sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${changed_files}" == "0" ]]; then
            gh pr close "${PR_NUMBER}" --comment "Closing empty repository auto-sync PR; generated changes are already present on main."
            echo "Refused empty generated-artifact finalization."
            exit 0
          fi

          echo "PR ${PR_NUMBER} head ${pr_head_sha} is generated-artifact eligible. Native GitHub auto-merge is intentionally not registered; Derived State Closure and the Governance Finalizer own any automated merge decision."
