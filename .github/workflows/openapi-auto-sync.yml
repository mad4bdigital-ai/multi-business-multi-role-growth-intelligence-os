name: OpenAPI Auto Sync

on:
  push:
    branches:
      - main
    paths:
      - "http-generic-api/routes/**"
      - "http-generic-api/openapi.yaml"
      - "http-generic-api/openapi-route-coverage.allowlist.json"
      - "http-generic-api/scripts/openapi-route-coverage.mjs"
      - "http-generic-api/scripts/openapi-autofill-missing-routes.mjs"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: openapi-auto-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofill-openapi-routes:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Generate missing OpenAPI route stubs
        id: autofill
        working-directory: http-generic-api
        run: |
          node scripts/openapi-autofill-missing-routes.mjs --write | tee ../openapi-autofill-result.json

      - name: Check generated diff
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- http-generic-api/openapi.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create OpenAPI sync PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/openapi-auto-sync-${{ github.run_id }}
          delete-branch: true
          title: "Auto-sync OpenAPI route stubs"
          commit-message: "Auto-sync OpenAPI route stubs"
          labels: |
            openapi
            automated
          body: |
            Autogenerated by **OpenAPI Auto Sync** after a push to `main`.

            This PR adds OpenAPI stubs for newly detected Express routes that are not documented in `http-generic-api/openapi.yaml` and not covered by `openapi-route-coverage.allowlist.json`.

            Review checklist:
            - Replace `TODO document ...` summaries with precise summaries.
            - Replace autogenerated request/response schemas with the real contract.
            - Confirm authentication and authorization notes.
            - Confirm `x-openai-isConsequential` is correct.
            - Add examples where useful.

            Do not merge this PR as-is for externally consumed routes unless the generated stubs have been reviewed.
