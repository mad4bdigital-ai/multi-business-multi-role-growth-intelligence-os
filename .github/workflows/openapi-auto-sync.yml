name: T050 Artifact Generation Helper

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: t050-artifact-helper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Generate schemas
        working-directory: http-generic-api
        run: npm run schemas:generate

      - name: Sync activation gateway runtime bundle
        working-directory: http-generic-api
        run: npm run activation-gateway:bundle:sync

      - name: Sync activation gateway runtime bundle
        working-directory: http-generic-api
        run: npm run activation-gateway:bundle:sync

      - name: Validate generated schemas and parity
        working-directory: http-generic-api
        run: |
          npm run schemas:check
          npm run activation-gateway:bundle:check
          node test-openapi-split-regeneration-parity.mjs

      - name: Commit reviewed generated artifacts to helper branch
        shell: bash
        run: |
          CHANGED_FILES="$(git diff --name-only --             http-generic-api/openapi.yaml             http-generic-api/openapi.*.yaml             canonicals/openapi/**/*.yaml             edge/activation-gateway/**             docs/**/*.md             canonicals/**/*.md             '*.md')"

          if [ -z "$CHANGED_FILES" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "auto_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: generate T050 schema artifacts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
