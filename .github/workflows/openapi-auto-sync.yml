name: OpenAPI Auto Sync

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: staging-automation-finalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Generate frontend dispatch evidence
        working-directory: http-generic-api
        run: npm run frontend:dispatch:generate -- --baseline-ref=main

      - name: Validate staging automation and frontend evidence
        working-directory: http-generic-api
        run: |
          node test-frontend-surface-dispatch.mjs
          node test-frontend-auth-openapi-parity.mjs
          node test-runtime-gate-deployment-info-parity.mjs

      - name: Restore canonical workflow and commit final artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "admin-assitant-growth-os[bot]"
          git config user.email "283129699+admin-assitant-growth-os[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- .github/workflows/openapi-auto-sync.yml
          git add .github/workflows/openapi-auto-sync.yml
          git add http-generic-api/frontend-surface-dispatch.generated.json
          git add http-generic-api/openapi/frontend-runtime-routes.generated.yaml
          if git diff --cached --quiet; then
            echo "No final changes to commit."
            exit 0
          fi
          git commit -m "Finalize main staging automation evidence"
          git push origin HEAD:${GITHUB_REF_NAME}
