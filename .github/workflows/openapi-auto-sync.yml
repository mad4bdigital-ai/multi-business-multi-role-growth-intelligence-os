name: OpenAPI Auto Sync

on:
  push:
    branches:
      - main
      - gpt/openapi-autosync-stale-main-guard-20260801
    paths:
      - "http-generic-api/routes/**"
      - "http-generic-api/migrations/**"
      - "http-generic-api/test-*.mjs"
      - "http-generic-api/test-openapi-builder-schema-guard.mjs"
      - "http-generic-api/openapi.yaml"
      - "http-generic-api/openapi.*.yaml"
      - "http-generic-api/openapi/**/*.yaml"
      - "http-generic-api/openapi-route-coverage.allowlist.json"
      - "http-generic-api/package.json"
      - "http-generic-api/package-lock.json"
      - "http-generic-api/scripts/openapi-*.mjs"
      - "http-generic-api/scripts/generate-custom-gpt-schemas.mjs"
      - "http-generic-api/scripts/split-openapi.mjs"
      - "http-generic-api/scripts/surface-contract-discovery.mjs"
      - "http-generic-api/scripts/repo-maintenance-sync.mjs"
      - "http-generic-api/scripts/update-repo-planning-docs.mjs"
      - "http-generic-api/scripts/pipeline-connectivity-check.mjs"
      - "http-generic-api/test-pipeline-connectivity-check.mjs"
      - ".specify/pipeline-connectivity-contract.json"
      - ".github/workflows/openapi-auto-sync.yml"
      - "canonicals/openapi/**/*.yaml"
      - "edge/activation-gateway/**"
      - "docs/**/*.md"
      - "canonicals/**/*.md"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: repository-generated-artifacts-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap-exact-head-work-maps:
    if: github.ref_name == 'gpt/openapi-autosync-stale-main-guard-20260801' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore final workflow and regenerate Work Maps
        shell: bash
        env:
          EXPECTED_PARENT_SHA: 2a2141a0dd0cb463670623f82de5383f4a212df4
          TARGET_BRANCH: gpt/openapi-autosync-stale-main-guard-20260801
        run: |
          set -euo pipefail
          actual_parent_sha="$(git rev-parse HEAD^)"
          if [[ "${actual_parent_sha}" != "${EXPECTED_PARENT_SHA}" ]]; then
            echo "Bootstrap parent mismatch. Expected ${EXPECTED_PARENT_SHA}, found ${actual_parent_sha}."
            exit 1
          fi

          bootstrap_head_sha="$(git rev-parse HEAD)"
          remote_head_sha="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          if [[ "${remote_head_sha}" != "${bootstrap_head_sha}" ]]; then
            echo "Bootstrap branch moved before generation. Expected ${bootstrap_head_sha}, found ${remote_head_sha}."
            exit 1
          fi

          git checkout "${EXPECTED_PARENT_SHA}" -- .github/workflows/openapi-auto-sync.yml
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          first_diff_hash="$(git diff --binary -- docs/work-maps | sha256sum | awk '{print $1}')"
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          second_diff_hash="$(git diff --binary -- docs/work-maps | sha256sum | awk '{print $1}')"
          if [[ "${first_diff_hash}" != "${second_diff_hash}" ]]; then
            echo "Refusing non-idempotent Work Map bootstrap."
            exit 1
          fi
          node http-generic-api/scripts/platform-work-map-generator.mjs --check

          unexpected_files="$(git diff --name-only | grep -Ev '^(\.github/workflows/openapi-auto-sync\.yml|docs/work-maps/)' || true)"
          if [[ -n "${unexpected_files}" ]]; then
            echo "Bootstrap modified unexpected files:"
            printf '%s\n' "${unexpected_files}"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/openapi-auto-sync.yml docs/work-maps
          git commit -m "docs(work-maps): refresh OpenAPI auto-sync governance map"

          remote_head_sha="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          if [[ "${remote_head_sha}" != "${bootstrap_head_sha}" ]]; then
            echo "Bootstrap branch moved before push. Expected ${bootstrap_head_sha}, found ${remote_head_sha}."
            exit 1
          fi
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

  repo-contract-sync:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main' && github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Validate inter-pipeline connectivity
        run: |
          node http-generic-api/scripts/pipeline-connectivity-check.mjs
          node http-generic-api/test-pipeline-connectivity-check.mjs

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Report auto-sync PR credential mode
        shell: bash
        env:
          REPO_AUTOSYNC_TOKEN_PRESENT: ${{ secrets.REPO_AUTOSYNC_TOKEN != '' }}
        run: |
          if [ "$REPO_AUTOSYNC_TOKEN_PRESENT" = "true" ]; then
            echo "Auto-sync PR credential mode: REPO_AUTOSYNC_TOKEN secret is configured."
          else
            echo "Auto-sync PR credential mode: using default GITHUB_TOKEN. Repository Actions settings must allow PR creation."
          fi

      - name: Run repository contract maintenance sync without Work Map ownership
        id: maintenance
        working-directory: http-generic-api
        run: |
          node scripts/repo-maintenance-sync.mjs --write --skip-work-maps --report-file "$RUNNER_TEMP/repo-maintenance-sync-result.json" | tee "$RUNNER_TEMP/repo-maintenance-sync-output.log"

      - name: Refuse Work Map mutation outside the governed writer
        shell: bash
        run: |
          if ! git diff --quiet -- docs/work-maps; then
            echo "OpenAPI Auto Sync must not modify docs/work-maps. Use the governed Work Map Autofix writer."
            git diff --name-only -- docs/work-maps
            exit 1
          fi

      - name: Generate Custom GPT schemas from canonical sources
        working-directory: http-generic-api
        run: npm run schemas:generate

      - name: Sync activation gateway runtime bundle
        working-directory: http-generic-api
        run: npm run activation-gateway:bundle:sync

      - name: Validate generated schemas and parity
        working-directory: http-generic-api
        run: npm run schemas:guard

      - name: Check generated diff
        id: diff
        shell: bash
        run: |
          CHANGED_FILES="$(git diff --name-only -- \
            http-generic-api/openapi.yaml \
            http-generic-api/openapi.*.yaml \
            http-generic-api/openapi/**/*.yaml \
            canonicals/openapi/**/*.yaml \
            edge/activation-gateway/** \
            docs/**/*.md \
            canonicals/**/*.md \
            '*.md')"

          if [ -z "$CHANGED_FILES" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "auto_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Changed files:"
          echo "$CHANGED_FILES"

          AUTO_MERGE=true
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              docs/*.md|docs/**/*.md|canonicals/*.md|canonicals/**/*.md|*.md)
                ;;
              *)
                AUTO_MERGE=false
                ;;
            esac
          done <<< "$CHANGED_FILES"

          if git diff -- http-generic-api/openapi.yaml | grep -q "TODO document"; then
            AUTO_MERGE=false
          fi

          echo "auto_merge=$AUTO_MERGE" >> "$GITHUB_OUTPUT"

      - name: Refuse stale main snapshot before PR creation
        id: freshness
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          latest_main_sha="$(git rev-parse origin/main)"
          echo "latest_main_sha=${latest_main_sha}" >> "$GITHUB_OUTPUT"
          if [[ "${latest_main_sha}" != "${GITHUB_SHA}" ]]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale repository auto-sync run. Triggered at ${GITHUB_SHA}, current main is ${latest_main_sha}."
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Create repository contract sync PR
        id: cpr
        if: steps.diff.outputs.changed == 'true' && steps.freshness.outputs.current == 'true'
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/repo-contract-auto-sync-${{ github.run_id }}
          delete-branch: true
          title: "Auto-sync repository contracts"
          commit-message: "Auto-sync repository contracts"
          labels: |
            openapi
            docs
            automated
          token: ${{ secrets.REPO_AUTOSYNC_TOKEN || github.token }}
          body: |
            Autogenerated by **OpenAPI Auto Sync** after a push to `main`.

            Generation sequence:
            1. Update the canonical `openapi.yaml` and repository planning docs without Work Map mutation.
            2. Generate split Custom GPT schemas into a temporary directory.
            3. Validate all request/response schemas recursively.
            4. Write generated artifacts only after validation succeeds.
            5. Verify committed artifacts exactly match their canonical sources.

            Work Maps are intentionally excluded. Their sole remote writer is the governed Spec Kit Work Map Autofix workflow.

            Do not merge this PR as-is when it contains generated schema, runtime, authentication, or non-Markdown changes; those require human/GPT review. Safe Markdown-only synchronization may be merged automatically only while `main` remains pinned to the triggering SHA.

            Review checklist:
            - Replace any `TODO document ...` summaries with precise contracts.
            - Confirm request and response properties match implementation.
            - Confirm authentication and authorization notes.
            - Confirm `x-openai-isConsequential` is correct.
            - Confirm each Custom GPT schema stays within its operation budget.
            - Confirm canonical and generated artifacts remain byte-for-byte aligned.

      - name: Merge safe docs-only sync PR against exact main
        if: steps.diff.outputs.auto_merge == 'true' && steps.freshness.outputs.current == 'true' && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.REPO_AUTOSYNC_TOKEN || github.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        shell: bash
        run: |
          set -euo pipefail
          latest_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "${latest_main_sha}" != "${GITHUB_SHA}" ]]; then
            gh pr close "${PR_NUMBER}" --comment "Closing stale docs-only auto-sync PR: main moved from ${GITHUB_SHA} to ${latest_main_sha} before merge. A newer queued run owns regeneration."
            echo "Refused stale docs-only merge."
            exit 0
          fi

          pr_head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          changed_files="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.changed_files')"
          if [[ "${changed_files}" == "0" ]]; then
            gh pr close "${PR_NUMBER}" --comment "Closing empty repository auto-sync PR; generated changes are already present on main."
            echo "Refused empty docs-only merge."
            exit 0
          fi

          gh pr merge "${PR_NUMBER}" --squash --delete-branch --match-head-commit "${pr_head_sha}"
