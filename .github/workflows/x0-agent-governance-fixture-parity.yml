name: X0 Agent Governance Fixture Parity

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'gpt/spec-011-x0-governed-execution-baseline-20260730'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact governed PR head
        uses: actions/checkout@v5
        with:
          ref: gpt/spec-011-x0-governed-execution-baseline-20260730
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Apply exact fixture parity
        working-directory: http-generic-api
        run: node scripts/apply-x0-agent-governance-fixture-parity.mjs

      - name: Verify affected contracts
        working-directory: http-generic-api
        run: |
          node test-agent-governance-runtime.mjs
          node test-sequential-plan-orchestrator.mjs
          node test-governed-execution-baseline-telemetry.mjs
          node test-governed-execution-baseline-benchmark.mjs

      - name: Enforce exact write set
        run: |
          mapfile -t changed < <(git diff --name-only | sort)
          expected=('http-generic-api/test-agent-governance-runtime.mjs')
          test "${#changed[@]}" -eq 1
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${changed[@]}")

      - name: Commit fixture parity
        run: |
          git config user.name 'mad4b-governed-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add http-generic-api/test-agent-governance-runtime.mjs
          git commit -m 'test(spec-011): align agent governance fixture with ambiguity guard'
          git push origin HEAD:gpt/spec-011-x0-governed-execution-baseline-20260730
