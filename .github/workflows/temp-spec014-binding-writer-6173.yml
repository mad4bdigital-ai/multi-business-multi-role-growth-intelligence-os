name: TEMP Spec 014 Binding Writer 6173

on:
  pull_request:
    branches:
      - gpt/spec014-binding-writer-base-6173-2f6634d3
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  refresh:
    name: Refresh exact Spec 014 binding on R7 registration candidate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      CANONICAL_PR: '6173'
      EXPECTED_MAIN_SHA: 2f6634d39cf6a281efb1f7744bb1dee3a28f2cd9
      EXPECTED_HEAD_SHA: 90112c21a096dcbe6d2092247910e1eb72b29928
      TARGET_BRANCH: fix/hostinger-production-r7-registration-context-20260804
      AUTHORIZATION_MARKER: '<!-- spec014-final-work-map-binding-refresh:authorized -->'
      MANIFEST_PATH: specs/014-governed-hostinger-storage-orchestration/work-map-integration.json
      TASKS_PATH: specs/014-governed-hostinger-storage-orchestration/tasks.md
    steps:
      - name: Validate identity and consume authorization
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          report_dir="${RUNNER_TEMP}/spec014-binding-refresh-6173"
          mkdir -p "${report_dir}"
          echo "REPORT_DIR=${report_dir}" >> "${GITHUB_ENV}"

          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${CANONICAL_PR}")"
          test "$(jq -r '.state' <<<"${pr}")" = 'open'
          test "$(jq -r '.draft' <<<"${pr}")" = 'true'
          test "$(jq -r '.base.ref' <<<"${pr}")" = 'main'
          test "$(jq -r '.base.sha' <<<"${pr}")" = "${EXPECTED_MAIN_SHA}"
          test "$(jq -r '.head.ref' <<<"${pr}")" = "${TARGET_BRANCH}"
          test "$(jq -r '.head.sha' <<<"${pr}")" = "${EXPECTED_HEAD_SHA}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "${EXPECTED_MAIN_SHA}"
          comparison="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${EXPECTED_MAIN_SHA}...${EXPECTED_HEAD_SHA}")"
          test "$(jq -r '.behind_by' <<<"${comparison}")" = '0'
          test "$(jq -r '.merge_base_commit.sha' <<<"${comparison}")" = "${EXPECTED_MAIN_SHA}"

          body="$(jq -r '.body // ""' <<<"${pr}")"
          test "$(grep -Fo "${AUTHORIZATION_MARKER}" <<<"${body}" | wc -l | tr -d ' ')" = '1'
          next_body="${body//${AUTHORIZATION_MARKER}/}"
          jq -n --arg body "${next_body}" '{body:$body}' > "${report_dir}/consume-marker.json"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${CANONICAL_PR}" --input "${report_dir}/consume-marker.json" >/dev/null
          if gh api "repos/${GITHUB_REPOSITORY}/pulls/${CANONICAL_PR}" --jq '.body // ""' | grep -Fq "${AUTHORIZATION_MARKER}"; then
            echo 'Authorization marker removal readback failed.' >&2
            exit 1
          fi

      - name: Checkout exact authorized candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Run official refresh, readback, and bounded push
        id: refresh
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs | tee "${REPORT_DIR}/refresh.json"

          git diff --name-only | sort > "${REPORT_DIR}/changed-files.txt"
          grep -Fxq "${MANIFEST_PATH}" "${REPORT_DIR}/changed-files.txt"
          unexpected="$(grep -Fvx -e "${MANIFEST_PATH}" -e "${TASKS_PATH}" "${REPORT_DIR}/changed-files.txt" || true)"
          test -z "${unexpected}"
          git diff --check

          node http-generic-api/scripts/platform-work-map-generator.mjs --check | tee "${REPORT_DIR}/work-map-currentness.json"
          REPORT_PATH="${REPORT_DIR}/spec014-final-work-map-readback.json" node http-generic-api/scripts/spec014-final-work-map-readback.mjs | tee "${REPORT_DIR}/spec014-final-work-map-readback.stdout.json"
          jq -e '.ok == true and ((.findings | length) == 0)' "${REPORT_DIR}/spec014-final-work-map-readback.json" >/dev/null

          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${EXPECTED_HEAD_SHA}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${MANIFEST_PATH}" "${TASKS_PATH}"
          git diff --cached --name-only | sort > "${REPORT_DIR}/committed-files.txt"
          grep -Fxq "${MANIFEST_PATH}" "${REPORT_DIR}/committed-files.txt"
          unexpected_cached="$(grep -Fvx -e "${MANIFEST_PATH}" -e "${TASKS_PATH}" "${REPORT_DIR}/committed-files.txt" || true)"
          test -z "${unexpected_cached}"
          git commit -m 'docs(spec-014): refresh R7 registration Work Map binding'
          result_head_sha="$(git rev-parse HEAD)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${TARGET_BRANCH}"

          observed_remote=''
          observed_pr=''
          for _ in $(seq 1 20); do
            observed_remote="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
            observed_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${CANONICAL_PR}" --jq '.head.sha')"
            if [[ "${observed_remote}" = "${result_head_sha}" && "${observed_pr}" = "${result_head_sha}" ]]; then break; fi
            sleep 2
          done
          test "${observed_remote}" = "${result_head_sha}"
          test "${observed_pr}" = "${result_head_sha}"
          echo "result_head_sha=${result_head_sha}" >> "${GITHUB_OUTPUT}"
          jq -n --arg result_head_sha "${result_head_sha}" '{contract:"mad4b.spec014-binding-writer-6173.v1",outcome:"passed",result_head_sha:$result_head_sha,official_script:"http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs",candidate_branch_only:true,changed_paths_bounded:true,protected_branch_mutation:false,force_push:false,provider_dispatch:false,live_database_access:false,migration_apply:false,secrets_included:false}' > "${REPORT_DIR}/summary.json"

      - name: Upload bounded refresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec014-binding-refresh-6173-${{ github.run_id }}
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish canonical PR evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_HEAD_SHA: ${{ steps.refresh.outputs.result_head_sha }}
        run: |
          set -Eeuo pipefail
          outcome='passed'
          if [[ "${{ steps.refresh.outcome }}" != 'success' ]]; then outcome='blocked'; fi
          body="SPEC014_BINDING_REFRESH_6173 outcome=${outcome} run_id=${GITHUB_RUN_ID} expected_main_sha=${EXPECTED_MAIN_SHA} expected_head_sha=${EXPECTED_HEAD_SHA} result_head_sha=${RESULT_HEAD_SHA:-none} official_script=spec014-refresh-final-work-map-binding.mjs manifest_mutation_authorized=true tasks_mutation_authorized=true protected_branch_mutation=false force_push=false provider_dispatch=false live_database_access=false migration_apply=false secrets_included=false"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${CANONICAL_PR}/comments" -f body="${body}" >/dev/null
