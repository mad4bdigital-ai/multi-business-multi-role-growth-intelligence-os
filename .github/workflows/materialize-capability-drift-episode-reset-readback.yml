name: Materialize capability drift episode reset readback

on:
  push:
    branches:
      - fix/capability-drift-age-severity-escalation-4450-20260808
    paths:
      - .github/workflows/materialize-capability-drift-episode-reset-readback.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v5
        with:
          ref: fix/capability-drift-age-severity-escalation-4450-20260808
          fetch-depth: 0
          persist-credentials: true

      - name: Verify current main ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          test "$(git rev-parse origin/main)" = "f861f181fd5c00e65208cae058b7b96eaf688458"

      - name: Apply current-episode severity readback refinement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}")
              p.write_text(text.replace(old, new, 1))

          service = "http-generic-api/operationalAlertService.js"
          test = "http-generic-api/test-operational-alerting-control-plane.mjs"

          replace_once(
              service,
              '''    const capabilityDriftMerge = current.source_type === CAPABILITY_DRIFT_SOURCE\n      || item.source_type === CAPABILITY_DRIFT_SOURCE;\n    const mergedSeverity = capabilityDriftMerge\n      ? (safeNumber(SEVERITY_WEIGHT[item.severity]) > safeNumber(SEVERITY_WEIGHT[current.severity])\n          ? item.severity\n          : current.severity)\n      : latest.severity;\n''',
              '''    const capabilityDriftMerge = current.source_type === CAPABILITY_DRIFT_SOURCE\n      || item.source_type === CAPABILITY_DRIFT_SOURCE;\n    const preservePersistedCapabilitySeverity = capabilityDriftMerge\n      && !(persistedLifecycleClosed && hasNewerLiveOccurrence);\n    const mergedSeverity = preservePersistedCapabilitySeverity\n      ? (safeNumber(SEVERITY_WEIGHT[item.severity]) > safeNumber(SEVERITY_WEIGHT[current.severity])\n          ? item.severity\n          : current.severity)\n      : latest.severity;\n'''
          )

          replace_once(
              test,
              '''  assert.equal(mergedEscalated[0].alert_id, "alert-capability-escalated");\n  assert.equal(mergedEscalated[0].lifecycle_status, "investigating");\n''',
              '''  assert.equal(mergedEscalated[0].alert_id, "alert-capability-escalated");\n  assert.equal(mergedEscalated[0].lifecycle_status, "investigating");\n\n  const resolvedPriorEpisode = _testingOperationalAlerts.candidate({\n    alertId: "alert-capability-resolved",\n    alertKey: first.alertKey,\n    sourceType: CAPABILITY_DRIFT_SOURCE,\n    sourceRef: first.sourceRef,\n    sourceRecordId: first.sourceRecordId,\n    category: "capability_drift",\n    severity: "critical",\n    title: first.title,\n    summary: first.summary,\n    reasonCode: first.reasonCode,\n    lifecycleStatus: "resolved",\n    lifecycleUpdatedAt: "2026-08-08T16:00:00.000Z",\n    verificationState: "verified",\n    evidence: { tenant_visible: true, age_escalation: { policy_key: "capability_drift_age_escalation_v1" } },\n    occurrenceCount: 12,\n    firstSeenAt: "2026-08-01T12:00:00.000Z",\n    lastSeenAt: "2026-08-08T15:00:00.000Z",\n    persisted: true,\n  });\n  const reopenedEpisode = _testingOperationalAlerts.mergeCandidates([newerLiveBaseSeverity, resolvedPriorEpisode]);\n  assert.equal(reopenedEpisode[0].lifecycle_status, "open", "a live occurrence newer than resolution must reopen the capability alert");\n  assert.equal(reopenedEpisode[0].severity, "medium", "a new lifecycle episode must not inherit age-escalated severity from a resolved episode");\n  assert.equal(reopenedEpisode[0].last_seen_at, newerLiveBaseSeverity.last_seen_at);\n  assert.equal(reopenedEpisode[0].alert_id, "alert-capability-resolved");\n'''
          )

          replace_once(
              test,
              '''  assert.match(service, /const capabilityDriftMerge/);\n  assert.match(service, /severity: mergedSeverity/);\n''',
              '''  assert.match(service, /const capabilityDriftMerge/);\n  assert.match(service, /preservePersistedCapabilitySeverity/);\n  assert.match(service, /severity: mergedSeverity/);\n'''
          )
          PY

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/test-operational-alerting-control-plane.mjs
          node http-generic-api/scripts/test-operation-observability-service.mjs

      - name: Remove temporary materializer and enforce exact scope
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capability-drift-episode-reset-readback.yml
          git add -A
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          expected = {
              ".changes/e2e/capability-drift-age-severity-escalation.json",
              "http-generic-api/capabilityDriftAlertEscalationPolicy.js",
              "http-generic-api/operationalAlertService.js",
              "http-generic-api/test-operational-alerting-control-plane.mjs",
          }
          actual = set(subprocess.check_output(
              ["git", "diff", "--cached", "--name-only", "origin/main"],
              text=True,
          ).splitlines())
          if actual != expected:
              raise SystemExit(f"unexpected final scope: expected={sorted(expected)} actual={sorted(actual)}")
          PY

      - name: Commit bounded episode reset refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(observability): reset capability severity across resolved episodes"
          git push origin HEAD:fix/capability-drift-age-severity-escalation-4450-20260808
