name: Trigger Support Ticket Runtime OpenAPI Completion

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/support-ticket-runtime-openapi-completion-pr-bootstrap.yml

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/support-ticket-runtime-openapi-completion-20260802
          fetch-depth: 1
          persist-credentials: true
      - name: Execute bounded composer embedded in bootstrap
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/support-ticket-runtime-openapi-completion-bootstrap.yml').read_text(encoding='utf-8')
          opening = "          python3 <<'PY'\n"
          closing = "\n          PY\n"
          start = workflow.index(opening) + len(opening)
          end = workflow.index(closing, start)
          source = textwrap.dedent(workflow[start:end])
          exec(compile(source, '<support-ticket-runtime-openapi-bootstrap>', 'exec'), {})
          PY
      - name: Expand every path item from the reviewed regression contract
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          base = Path('http-generic-api')
          test_source = (base / 'test-support-ticket-runtime-openapi-completion.mjs').read_text(encoding='utf-8')
          start = test_source.index('const contracts = [') + len('const contracts = ')
          candidate = test_source[start:]
          depth = 0
          in_string = False
          escaped = False
          end = None
          for index, character in enumerate(candidate):
              if in_string:
                  if escaped:
                      escaped = False
                  elif character == '\\':
                      escaped = True
                  elif character == '"':
                      in_string = False
              else:
                  if character == '"':
                      in_string = True
                  elif character == '[':
                      depth += 1
                  elif character == ']':
                      depth -= 1
                      if depth == 0:
                          end = index + 1
                          break
          contracts = json.loads(candidate[:end])
          if len(contracts) != 47:
              raise SystemExit(f'expected 47 reviewed contracts, got {len(contracts)}')

          responses = [
              ('200', 'Success'),
              ('400', 'BadRequest'),
              ('401', 'Unauthorized'),
              ('403', 'Forbidden'),
              ('404', 'NotFound'),
              ('409', 'Conflict'),
              ('422', 'Unprocessable'),
              ('500', 'InternalError'),
          ]
          lines = [
              '# Source-bound path items completing Support Ticket runtime OpenAPI coverage.',
              '# Runtime validation, authorization, approvals, confirmations, provider gates, credential gates, and readback remain authoritative.',
              '',
          ]
          for entry in contracts:
              lines.append(f"{entry['pathItem']}:")
              lines.append(f"  {entry['method']}:")
              lines.append(f"    operationId: {entry['operationId']}")
              if entry['exposure'] == 'tenant_user':
                  lines.append('    security: [{ userJwtAuth: [] }]')
              else:
                  lines.append('    security: [{ adminBearerAuth: [] }, { backendApiKeyAuth: [] }]')
              lines.append(f"    x-registry-exposure: {entry['exposure']}")
              lines.append(f"    x-openai-isConsequential: {'true' if entry['consequential'] else 'false'}")
              parameters = re.findall(r':([A-Za-z0-9_]+)', entry['expressPath'])
              if parameters:
                  lines.append('    parameters:')
                  for parameter in parameters:
                      lines.extend([
                          f'      - name: {parameter}',
                          '        in: path',
                          '        required: true',
                          '        schema: { type: string, minLength: 1 }',
                      ])
              lines.append('    responses:')
              for status, response in responses:
                  lines.append(f"      '{status}': {{ $ref: './support-ticket-admin-common.yaml#/responses/{response}' }}")
              lines.append('')

          target = base / 'openapi/support-ticket-runtime-completion.yaml'
          target.write_text('\n'.join(lines), encoding='utf-8')
          print(json.dumps({
              'contract': 'mad4b.support-ticket-runtime-path-item-expansion.v1',
              'path_items': len(contracts),
              'admin_operations': sum(entry['exposure'] == 'admin_tool' for entry in contracts),
              'tenant_operations': sum(entry['exposure'] == 'tenant_user' for entry in contracts),
              'consequential_operations': sum(entry['consequential'] for entry in contracts),
          }, indent=2))
          PY
      - name: Run precise completeness regression
        shell: bash
        run: |
          set +e
          cd http-generic-api
          node test-support-ticket-runtime-openapi-completion.mjs > ../support-ticket-runtime-openapi-regression.log 2>&1
          status=$?
          cat ../support-ticket-runtime-openapi-regression.log
          exit "$status"
      - name: Upload bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: support-ticket-runtime-openapi-completion-diagnostic
          path: |
            support-ticket-runtime-openapi-regression.log
            .changes/e2e/support-ticket-runtime-openapi-completion.json
            http-generic-api/openapi-route-contracts.yaml
            http-generic-api/openapi/support-ticket-runtime-completion.yaml
            http-generic-api/test-support-ticket-runtime-openapi-completion.mjs
          if-no-files-found: error
          retention-days: 3
      - name: Commit bounded completion and remove both bootstraps
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- \
            .github/workflows/support-ticket-runtime-openapi-completion-bootstrap.yml \
            .github/workflows/support-ticket-runtime-openapi-completion-pr-bootstrap.yml
          git add \
            .changes/e2e/support-ticket-runtime-openapi-completion.json \
            http-generic-api/openapi-route-contracts.yaml \
            http-generic-api/openapi/support-ticket-runtime-completion.yaml \
            http-generic-api/test-support-ticket-runtime-openapi-completion.mjs
          git commit -m "fix(openapi): complete Support Ticket runtime contracts"
          git push origin HEAD:fix/support-ticket-runtime-openapi-completion-20260802
