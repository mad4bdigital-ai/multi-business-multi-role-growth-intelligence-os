name: Governed Generated Artifact Refresh

on:
  push:
    branches:
      - "fix/transport-response-delivery-20260806"

permissions:
  actions: write
  contents: write

concurrency:
  group: transport-latest-main-reconcile-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Pin branch and fetch current main
        id: pin
        shell: bash
        env:
          TARGET_BRANCH: fix/transport-response-delivery-20260806
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          test "$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${EXPECTED_HEAD_SHA}"
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          [[ "${main_sha}" =~ ^[0-9a-f]{40}$ ]]
          echo "main_sha=${main_sha}" >> "$GITHUB_OUTPUT"
          test "${TARGET_BRANCH}" != main
          test "${TARGET_BRANCH}" != Production

      - name: Merge main with bounded conflict policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U || true)"
          unexpected="$(printf '%s\n' "${conflicts}" | grep -Ev '^(docs/work-maps/[A-Za-z0-9._-]+\.md|http-generic-api/frontend-operation-governance\.generated\.(json|md|yaml)|http-generic-api/frontend-surface-dispatch\.generated\.json|http-generic-api/frontend-registry-closure-report\.(json|md)|http-generic-api/skill-inventory\.generated\.md|http-generic-api/openapi/frontend-runtime-routes\.generated\.yaml|http-generic-api/scripts/test-manifest\.mjs)$' || true)"
          if [[ -n "${unexpected}" ]]; then
            echo "Unexpected merge conflicts:" >&2
            printf '%s\n' "${unexpected}" >&2
            exit 1
          fi

          while IFS= read -r path; do
            [[ -n "${path}" ]] || continue
            if [[ "${path}" == "http-generic-api/scripts/test-manifest.mjs" ]]; then
              git checkout --theirs -- "${path}"
            else
              git checkout --ours -- "${path}"
            fi
            git add -- "${path}"
          done <<< "${conflicts}"

          python - <<'PY'
          from pathlib import Path

          path = Path("http-generic-api/scripts/test-manifest.mjs")
          text = path.read_text(encoding="utf-8")
          anchor = '  "node test-smoke-branch-cleanup-gate.mjs",\n'
          entries = [
              '  "node test-sink-orchestration-json-asset-lookup-failure.mjs",\n',
              '  "node test-local-connector-transport-errors.mjs",\n',
              '  "node test-transport-response-chunk-schema-recovery.mjs",\n',
          ]
          if text.count(anchor) != 1:
              raise SystemExit("test manifest insertion anchor mismatch")
          for entry in entries:
              if entry not in text:
                  text = text.replace(anchor, entry + anchor, 1)
          path.write_text(text, encoding="utf-8")
          PY
          git add -- http-generic-api/scripts/test-manifest.mjs

          test -z "$(git diff --name-only --diff-filter=U || true)"
          test "${merge_status}" -eq 0 || git rev-parse --verify MERGE_HEAD

          git checkout origin/main -- .github/workflows/governed-generated-artifact-refresh.yml
          test ! -e .github/workflows/transport-main-reconcile-once.yml
          test ! -e .github/workflows/transport-main-reconcile-diagnostic-once.yml
          test ! -e .github/workflows/transport-main-reconcile-finalize-once.yml
          test ! -e .github/workflows/transport-connector-merge-diagnostic-once.yml

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Regenerate frontend governed evidence
        working-directory: http-generic-api
        run: npm run frontend:dispatch:generate -- --baseline-ref=main

      - name: Regenerate and verify clean Work Maps
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          if grep -R -n -E 'transport-(connector-merge-diagnostic|main-reconcile)|Transport (connector merged diagnostic once|main reconciliation)' docs/work-maps; then
            echo "Temporary transport workflow references remain in generated Work Maps." >&2
            exit 1
          fi

      - name: Verify transport and latest-main contracts
        working-directory: http-generic-api
        run: |
          node test-local-connector-transport-errors.mjs
          node test-transport-response-chunk-schema-recovery.mjs
          node test-sink-orchestration-json-asset-lookup-failure.mjs
          node test-production-certified-release-cut-validation-registration.mjs
          node test-production-promotion-convergence-workflows.mjs
          node test-frontend-operation-governance-generator.mjs
          node test-frontend-surface-dispatch.mjs
          node test-openapi-route-coverage.mjs

      - name: Commit reconciliation and push without force
        shell: bash
        env:
          TARGET_BRANCH: fix/transport-response-delivery-20260806
          EXPECTED_HEAD_SHA: ${{ github.sha }}
          MERGED_MAIN_SHA: ${{ steps.pin.outputs.main_sha }}
        run: |
          set -euo pipefail
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -m "merge(main): reconcile transport recovery with latest main"
          test "$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${EXPECTED_HEAD_SHA}"
          test "$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')" = "${MERGED_MAIN_SHA}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
