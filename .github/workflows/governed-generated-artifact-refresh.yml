name: Governed Generated Artifact Refresh

on:
  push:
    branches:
      - "fix/transport-response-delivery-20260806"

permissions:
  actions: write
  contents: write

concurrency:
  group: transport-clean-generated-evidence-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Pin branch identity and restore canonical workflow
        shell: bash
        env:
          TARGET_BRANCH: fix/transport-response-delivery-20260806
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          test "$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${EXPECTED_HEAD_SHA}"
          git fetch --no-tags origin main
          git checkout origin/main -- .github/workflows/governed-generated-artifact-refresh.yml
          git diff --cached --quiet -- .github/workflows/governed-generated-artifact-refresh.yml && {
            echo "Canonical workflow restoration produced no staged change." >&2
            exit 1
          }
          test ! -e .github/workflows/transport-main-reconcile-once.yml
          test ! -e .github/workflows/transport-main-reconcile-diagnostic-once.yml
          test ! -e .github/workflows/transport-main-reconcile-finalize-once.yml
          test ! -e .github/workflows/transport-connector-merge-diagnostic-once.yml

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Regenerate frontend governed evidence
        working-directory: http-generic-api
        run: npm run frontend:dispatch:generate -- --baseline-ref=main

      - name: Regenerate and verify clean Work Maps
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/platform-work-map-generator.mjs --write
          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          if grep -R -n -E 'Transport (connector merged diagnostic once|main reconciliation (diagnostics once|finalize once))|transport-(connector-merge-diagnostic|main-reconcile)' docs/work-maps; then
            echo "Temporary transport workflow references remain in generated Work Maps." >&2
            exit 1
          fi

      - name: Verify focused and generated contracts
        working-directory: http-generic-api
        run: |
          node test-local-connector-transport-errors.mjs
          node test-transport-response-chunk-schema-recovery.mjs
          node test-sink-orchestration-json-asset-lookup-failure.mjs
          node test-frontend-operation-governance-generator.mjs
          node test-frontend-surface-dispatch.mjs
          node test-openapi-route-coverage.mjs

      - name: Enforce bounded generated mutation set
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev '^(\.github/workflows/governed-generated-artifact-refresh\.yml|docs/work-maps/(README|data-model-domain-map|migration-lifecycle-map|observability-release-map|repository-automation-map|work-map-coverage-matrix)\.md|http-generic-api/frontend-operation-governance\.generated\.(json|md|yaml)|http-generic-api/frontend-surface-dispatch\.generated\.json|http-generic-api/frontend-registry-closure-report\.(json|md)|http-generic-api/skill-inventory\.generated\.md|http-generic-api/openapi/frontend-runtime-routes\.generated\.yaml)$' || true)"
          if [[ -n "${unexpected}" ]]; then
            echo "Unexpected generated mutation paths:" >&2
            printf '%s\n' "${unexpected}" >&2
            exit 1
          fi

      - name: Commit clean generated evidence and push without force
        shell: bash
        env:
          TARGET_BRANCH: fix/transport-response-delivery-20260806
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No clean generated changes to publish."; exit 1; }
          git commit -m "chore(transport): refresh generated evidence after workflow cleanup"
          test "$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${EXPECTED_HEAD_SHA}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
