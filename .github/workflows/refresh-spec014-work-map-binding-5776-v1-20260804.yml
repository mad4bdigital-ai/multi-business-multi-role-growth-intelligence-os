name: Diagnose Spec014 Work Map Binding 5776 V2 20260804

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/refresh-spec014-work-map-binding-5776-v1-20260804.yml

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: diagnose-spec014-work-map-binding-5776-v2-20260804
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose exact Spec014 binding refresh compactly
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/refresh-spec014-work-map-binding-5776-v1-20260804' &&
      github.event.pull_request.user.id == 271942579
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      BUILDER_PR: ${{ github.event.pull_request.number }}
      BUILDER_WORKFLOW: .github/workflows/refresh-spec014-work-map-binding-5776-v1-20260804.yml
      TARGET_PR: '5776'
      TARGET_BRANCH: gpt/work-map-currentness-refresh-20260804
      TARGET_SHA: 07a863372f9e5437065b477d502e7eecc3ee6d36
      EXPECTED_MAIN_SHA: 773179a2dee3523c8af25262475ac83b92e46f21
      MANIFEST: specs/014-governed-hostinger-storage-orchestration/work-map-integration.json
      TASKS: specs/014-governed-hostinger-storage-orchestration/tasks.md

    steps:
      - name: Verify one-file diagnostic and exact target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mapfile -t files < <(gh api --paginate "/repos/${REPOSITORY}/pulls/${BUILDER_PR}/files?per_page=100" --jq '.[].filename')
          test "${#files[@]}" -eq 1
          test "${files[0]}" = "${BUILDER_WORKFLOW}"
          test "$(gh api "/repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "${EXPECTED_MAIN_SHA}"
          target="$(gh api "/repos/${REPOSITORY}/pulls/${TARGET_PR}")"
          test "$(jq -r '.state' <<<"${target}")" = open
          test "$(jq -r '.base.sha' <<<"${target}")" = "${EXPECTED_MAIN_SHA}"
          test "$(jq -r '.head.ref' <<<"${target}")" = "${TARGET_BRANCH}"
          test "$(jq -r '.head.sha' <<<"${target}")" = "${TARGET_SHA}"

      - name: Checkout exact target head read-only
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Collect compact diagnostic JSON
        id: collect
        shell: bash
        run: |
          set -Eeuo pipefail
          result="${RUNNER_TEMP}/spec014-binding-diagnostic.json"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          runner_temp = Path(os.environ['RUNNER_TEMP'])
          result_path = runner_temp / 'spec014-binding-diagnostic.json'
          readback_path = runner_temp / 'spec014-binding-readback.json'

          def run(label, argv, extra_env=None):
              env = os.environ.copy()
              if extra_env:
                  env.update(extra_env)
              completed = subprocess.run(
                  argv,
                  cwd=root,
                  env=env,
                  text=True,
                  capture_output=True,
                  check=False,
              )
              return {
                  'label': label,
                  'exit_code': completed.returncode,
                  'stdout_tail': completed.stdout[-900:],
                  'stderr_tail': completed.stderr[-900:],
              }

          result = {
              'target_sha': os.environ['TARGET_SHA'],
              'expected_main_sha': os.environ['EXPECTED_MAIN_SHA'],
              'commands': {},
              'changed_paths': [],
              'status_paths': [],
              'current_fingerprint': None,
              'manifest_fingerprint': None,
              'findings': [],
              'manifest_registry_after_refresh': None,
          }

          result['commands']['generator_precheck'] = run(
              'generator_precheck',
              ['node', 'http-generic-api/scripts/platform-work-map-generator.mjs', '--check'],
          )
          result['commands']['refresh'] = run(
              'official_refresh',
              ['node', 'http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs'],
          )

          changed = subprocess.run(
              ['git', 'diff', '--name-only'], cwd=root, text=True, capture_output=True, check=False
          )
          result['changed_paths'] = sorted(filter(None, changed.stdout.splitlines()))
          status = subprocess.run(
              ['git', 'status', '--short'], cwd=root, text=True, capture_output=True, check=False
          )
          result['status_paths'] = status.stdout.splitlines()

          manifest_path = root / os.environ['MANIFEST']
          try:
              manifest = json.loads(manifest_path.read_text())
              registry = manifest.get('work_map_registry') or manifest.get('registry') or {}
              result['manifest_registry_after_refresh'] = {
                  'fingerprint': registry.get('fingerprint'),
                  'total_objects': registry.get('total_objects'),
                  'unresolved_objects': registry.get('unresolved_objects'),
              }
          except Exception as exc:
              result['manifest_parse_error'] = str(exc)

          result['commands']['readback'] = run(
              'official_final_readback',
              ['node', 'http-generic-api/scripts/spec014-final-work-map-readback.mjs'],
              {'REPORT_PATH': str(readback_path)},
          )
          if readback_path.exists():
              try:
                  readback = json.loads(readback_path.read_text())
                  result['current_fingerprint'] = (readback.get('current_registry') or {}).get('fingerprint')
                  result['manifest_fingerprint'] = (readback.get('manifest_registry') or {}).get('fingerprint')
                  result['findings'] = (readback.get('findings') or [])[:8]
                  result['readback_ok'] = readback.get('ok')
              except Exception as exc:
                  result['readback_parse_error'] = str(exc)

          result['commands']['governance'] = run(
              'changed_scope_governance',
              ['node', 'http-generic-api/scripts/spec-kit-work-map-governance-gate.mjs', '--ci', '--changed'],
          )
          result['commands']['diff_check'] = run('git_diff_check', ['git', 'diff', '--check'])
          result_path.write_text(json.dumps(result, indent=2) + '\n')
          PY
          test -s "${result}"
          echo "result_path=${result}" >> "${GITHUB_OUTPUT}"

      - name: Publish compact diagnostic result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_PATH: ${{ steps.collect.outputs.result_path }}
        run: |
          set -Eeuo pipefail
          test -s "${RESULT_PATH}"
          python3 - <<'PY' > "${RUNNER_TEMP}/compact-comment.md"
          import json
          import os
          from pathlib import Path

          data = json.loads(Path(os.environ['RESULT_PATH']).read_text())
          commands = data.get('commands') or {}
          codes = {name: item.get('exit_code') for name, item in commands.items()}
          findings = data.get('findings') or []
          finding_codes = []
          for finding in findings:
              if isinstance(finding, dict):
                  finding_codes.append(str(finding.get('code') or finding.get('finding') or finding.get('message') or finding)[:180])
              else:
                  finding_codes.append(str(finding)[:180])
          refresh = commands.get('refresh') or {}
          readback = commands.get('readback') or {}
          diagnostic_tail = (refresh.get('stderr_tail') or refresh.get('stdout_tail') or readback.get('stderr_tail') or readback.get('stdout_tail') or 'none')
          diagnostic_tail = diagnostic_tail.replace('```', "'''")[-1200:]

          print('## Spec 014 binding refresh compact diagnostic')
          print()
          print(f"- Target head: `{data.get('target_sha')}`")
          print(f"- Protected main: `{data.get('expected_main_sha')}`")
          print(f"- Exit codes: `{json.dumps(codes, sort_keys=True)}`")
          print(f"- Changed paths: `{', '.join(data.get('changed_paths') or []) or 'none'}`")
          print(f"- Current fingerprint: `{data.get('current_fingerprint') or 'unresolved'}`")
          print(f"- Manifest fingerprint: `{data.get('manifest_fingerprint') or 'unresolved'}`")
          print(f"- Manifest registry after refresh: `{json.dumps(data.get('manifest_registry_after_refresh'), sort_keys=True)}`")
          print(f"- Findings: `{'; '.join(finding_codes) or 'none'}`")
          print('- Remote repository mutation: none')
          print()
          print('```text')
          print(diagnostic_tail)
          print('```')
          PY
          wc -c "${RUNNER_TEMP}/compact-comment.md"
          test "$(wc -c < "${RUNNER_TEMP}/compact-comment.md")" -lt 5000
          gh pr comment "${TARGET_PR}" --repo "${REPOSITORY}" --body-file "${RUNNER_TEMP}/compact-comment.md"
          gh pr comment "${BUILDER_PR}" --repo "${REPOSITORY}" --body-file "${RUNNER_TEMP}/compact-comment.md"
