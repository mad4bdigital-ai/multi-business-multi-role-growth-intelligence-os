name: Diagnose Spec014 Work Map Binding 5776 V1 20260804

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/refresh-spec014-work-map-binding-5776-v1-20260804.yml

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: diagnose-spec014-work-map-binding-5776-v1-20260804
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose exact Spec014 binding refresh
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/refresh-spec014-work-map-binding-5776-v1-20260804' &&
      github.event.pull_request.user.id == 271942579
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      BUILDER_PR: ${{ github.event.pull_request.number }}
      BUILDER_WORKFLOW: .github/workflows/refresh-spec014-work-map-binding-5776-v1-20260804.yml
      TARGET_PR: '5776'
      TARGET_BRANCH: gpt/work-map-currentness-refresh-20260804
      TARGET_SHA: 07a863372f9e5437065b477d502e7eecc3ee6d36
      EXPECTED_MAIN_SHA: 773179a2dee3523c8af25262475ac83b92e46f21
      MANIFEST: specs/014-governed-hostinger-storage-orchestration/work-map-integration.json
      TASKS: specs/014-governed-hostinger-storage-orchestration/tasks.md

    steps:
      - name: Verify one-file diagnostic and exact target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mapfile -t files < <(gh api --paginate "/repos/${REPOSITORY}/pulls/${BUILDER_PR}/files?per_page=100" --jq '.[].filename')
          test "${#files[@]}" -eq 1
          test "${files[0]}" = "${BUILDER_WORKFLOW}"
          test "$(gh api "/repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "${EXPECTED_MAIN_SHA}"
          target="$(gh api "/repos/${REPOSITORY}/pulls/${TARGET_PR}")"
          test "$(jq -r '.state' <<<"${target}")" = open
          test "$(jq -r '.base.sha' <<<"${target}")" = "${EXPECTED_MAIN_SHA}"
          test "$(jq -r '.head.ref' <<<"${target}")" = "${TARGET_BRANCH}"
          test "$(jq -r '.head.sha' <<<"${target}")" = "${TARGET_SHA}"

      - name: Checkout exact target head read-only
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Execute labeled binding diagnostic
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          diagnostic_dir="${RUNNER_TEMP}/spec014-binding-diagnostic"
          mkdir -p "${diagnostic_dir}/readback"
          log="${diagnostic_dir}/diagnostic.log"

          set +e
          (
            checkpoint() { printf '\n===== %s =====\n' "$1"; }

            checkpoint 'exact target and initial status'
            printf 'HEAD=%s\n' "$(git rev-parse HEAD)"
            git status --short
            test "$(git rev-parse HEAD)" = "${TARGET_SHA}"

            checkpoint 'generated Work Map currentness before refresh'
            node http-generic-api/scripts/platform-work-map-generator.mjs --check
            printf 'generator_status=%s\n' "$?"

            checkpoint 'official Spec014 binding refresh tool'
            node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs \
              > "${diagnostic_dir}/refresh.stdout.json" \
              2> "${diagnostic_dir}/refresh.stderr.txt"
            refresh_status=$?
            printf 'refresh_status=%s\n' "${refresh_status}"
            printf '%s\n' '--- refresh stdout ---'
            cat "${diagnostic_dir}/refresh.stdout.json" 2>/dev/null || true
            printf '%s\n' '--- refresh stderr ---'
            cat "${diagnostic_dir}/refresh.stderr.txt" 2>/dev/null || true

            checkpoint 'changed paths after refresh attempt'
            git status --short
            git diff --name-only | sort
            printf '%s\n' '--- diff stat ---'
            git diff --stat

            checkpoint 'manifest binding after refresh attempt'
            node --input-type=module <<'NODE'
            import { readFileSync } from 'node:fs';
            const manifest = JSON.parse(readFileSync(process.env.MANIFEST, 'utf8'));
            const registry = manifest.work_map_registry || manifest.registry || {};
            const metadata = manifest.generated_work_map_metadata || {};
            console.log(JSON.stringify({
              registry_fingerprint: registry.fingerprint ?? null,
              registry_total_objects: registry.total_objects ?? null,
              registry_unresolved_objects: registry.unresolved_objects ?? null,
              generated_work_map_metadata: metadata,
            }, null, 2));
            NODE

            checkpoint 'official final Work Map readback after refresh attempt'
            REPORT_PATH="${diagnostic_dir}/readback/summary.json" \
              node http-generic-api/scripts/spec014-final-work-map-readback.mjs \
              > "${diagnostic_dir}/readback/stdout.json" \
              2> "${diagnostic_dir}/readback/stderr.txt"
            readback_status=$?
            printf 'readback_status=%s\n' "${readback_status}"
            printf '%s\n' '--- readback summary ---'
            cat "${diagnostic_dir}/readback/summary.json" 2>/dev/null || true
            printf '%s\n' '--- readback stdout ---'
            cat "${diagnostic_dir}/readback/stdout.json" 2>/dev/null || true
            printf '%s\n' '--- readback stderr ---'
            cat "${diagnostic_dir}/readback/stderr.txt" 2>/dev/null || true

            checkpoint 'changed-scope Work Map governance after refresh attempt'
            node http-generic-api/scripts/spec-kit-work-map-governance-gate.mjs --ci --changed
            governance_status=$?
            printf 'governance_status=%s\n' "${governance_status}"

            checkpoint 'final diagnostic status'
            git diff --check
            diff_check_status=$?
            printf 'diff_check_status=%s\n' "${diff_check_status}"
            printf 'refresh_status=%s readback_status=%s governance_status=%s diff_check_status=%s\n' \
              "${refresh_status}" "${readback_status}" "${governance_status}" "${diff_check_status}"
            exit 0
          ) >"${log}" 2>&1
          diagnostic_status=$?
          set -e
          cat "${log}"

          current_fingerprint="$(jq -r '.current_registry.fingerprint // "unresolved"' "${diagnostic_dir}/readback/summary.json" 2>/dev/null || echo unresolved)"
          manifest_fingerprint="$(jq -r '.manifest_registry.fingerprint // "unresolved"' "${diagnostic_dir}/readback/summary.json" 2>/dev/null || echo unresolved)"
          findings="$(jq -c '.findings // []' "${diagnostic_dir}/readback/summary.json" 2>/dev/null || echo '[]')"
          changed_paths="$(git diff --name-only | sort | paste -sd ',' -)"

          {
            echo '## Spec 014 binding refresh diagnostic'
            echo
            echo "- Target head: \`${TARGET_SHA}\`"
            echo "- Protected main: \`${EXPECTED_MAIN_SHA}\`"
            echo "- Current fingerprint after refresh attempt: \`${current_fingerprint}\`"
            echo "- Manifest fingerprint after refresh attempt: \`${manifest_fingerprint}\`"
            echo "- Changed paths after refresh attempt: \`${changed_paths:-none}\`"
            echo "- Readback findings: \`${findings}\`"
            echo '- No commit, push, repository write, protected-ref mutation, SQL, migration, database, provider, deployment, credential, or external-send action occurred.'
            echo
            echo '```text'
            tail -n 320 "${log}"
            echo '```'
          } > "${diagnostic_dir}/comment.md"
          gh pr comment "${TARGET_PR}" --repo "${REPOSITORY}" --body-file "${diagnostic_dir}/comment.md"
          gh pr comment "${BUILDER_PR}" --repo "${REPOSITORY}" --body-file "${diagnostic_dir}/comment.md"
          exit "${diagnostic_status}"
