name: Refresh Spec014 Work Map Binding 5776 V3 20260804

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/refresh-spec014-work-map-binding-5776-v1-20260804.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-spec014-work-map-binding-5776-v3-20260804
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh exact Spec014 binding with lease
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/refresh-spec014-work-map-binding-5776-v1-20260804' &&
      github.event.pull_request.user.id == 271942579
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      REPOSITORY: mad4bdigital-ai/multi-business-multi-role-growth-intelligence-os
      BUILDER_PR: ${{ github.event.pull_request.number }}
      BUILDER_WORKFLOW: .github/workflows/refresh-spec014-work-map-binding-5776-v1-20260804.yml
      TARGET_PR: '5776'
      TARGET_BRANCH: gpt/work-map-currentness-refresh-20260804
      TARGET_SHA: 07a863372f9e5437065b477d502e7eecc3ee6d36
      EXPECTED_MAIN_SHA: 773179a2dee3523c8af25262475ac83b92e46f21
      EXPECTED_FINGERPRINT: f81e65d2452c2c04a1281d1537f2aec58a5a2228d6faa06f72faaa454d963fda
      MANIFEST: specs/014-governed-hostinger-storage-orchestration/work-map-integration.json

    steps:
      - name: Verify one-file Builder and exact target snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mapfile -t files < <(gh api --paginate "/repos/${REPOSITORY}/pulls/${BUILDER_PR}/files?per_page=100" --jq '.[].filename')
          test "${#files[@]}" -eq 1
          test "${files[0]}" = "${BUILDER_WORKFLOW}"
          test "$(gh api "/repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "${EXPECTED_MAIN_SHA}"
          target="$(gh api "/repos/${REPOSITORY}/pulls/${TARGET_PR}")"
          test "$(jq -r '.state' <<<"${target}")" = open
          test "$(jq -r '.base.sha' <<<"${target}")" = "${EXPECTED_MAIN_SHA}"
          test "$(jq -r '.head.ref' <<<"${target}")" = "${TARGET_BRANCH}"
          test "$(jq -r '.head.sha' <<<"${target}")" = "${TARGET_SHA}"

      - name: Checkout exact target head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Refresh binding and prove exact local result
        id: refresh
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          test -z "$(git status --short)"

          node http-generic-api/scripts/spec014-refresh-final-work-map-binding.mjs > "${RUNNER_TEMP}/refresh.json"
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "${MANIFEST}"

          report="${RUNNER_TEMP}/final-readback.json"
          REPORT_PATH="${report}" node http-generic-api/scripts/spec014-final-work-map-readback.mjs > "${RUNNER_TEMP}/readback.stdout.json"
          jq -e '.ok == true and .findings == []' "${report}"
          current="$(jq -r '.current_registry.fingerprint' "${report}")"
          manifest="$(jq -r '.manifest_registry.fingerprint' "${report}")"
          test "${current}" = "${EXPECTED_FINGERPRINT}"
          test "${manifest}" = "${EXPECTED_FINGERPRINT}"
          node http-generic-api/scripts/platform-work-map-generator.mjs --check
          git diff --check
          echo "fingerprint=${current}" >> "${GITHUB_OUTPUT}"

      - name: Commit and push manifest-only refresh
        id: push
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_head="$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${TARGET_SHA}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${MANIFEST}"
          test "$(git diff --cached --name-only)" = "${MANIFEST}"
          git commit -m 'docs(spec014): refresh final Work Map binding'
          result_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          test "$(git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "${result_sha}"
          echo "result_sha=${result_sha}" >> "${GITHUB_OUTPUT}"

      - name: Publish exact refresh evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## Spec 014 Work Map binding refreshed successfully'
            echo
            echo '- Source head: `${{ env.TARGET_SHA }}`'
            echo '- Result head: `${{ steps.push.outputs.result_sha }}`'
            echo '- Changed path: `${{ env.MANIFEST }}` only'
            echo '- Current and manifest fingerprint: `${{ steps.refresh.outputs.fingerprint }}`'
            echo '- Official refresh tool, generated-map currentness, and final readback: passed'
            echo '- The changed-scope governance gate will be executed on the committed result head, not the pre-commit worktree'
            echo '- No protected-ref mutation, force push, Production action, SQL, migration, database, provider, deployment, credential, secret, or external-send action occurred'
          } > "${RUNNER_TEMP}/evidence.md"
          gh pr comment "${TARGET_PR}" --repo "${REPOSITORY}" --body-file "${RUNNER_TEMP}/evidence.md"
          gh pr comment "${BUILDER_PR}" --repo "${REPOSITORY}" --body-file "${RUNNER_TEMP}/evidence.md"
