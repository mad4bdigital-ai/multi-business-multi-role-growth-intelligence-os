name: Exact CI Stale Cancellation ARM Validation 5828

on:
  pull_request:
    branches:
      - gpt/validate-ci-stale-cancellation-arm-base-4a049185
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: exact-ci-stale-cancellation-arm-validation-5828-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  exact-candidate:
    name: Exact CI Stale Cancellation Full Validation
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gpt/ci-pr-stale-head-cancellation-main-4a049185-20260804' &&
      github.event.pull_request.head.sha == '4dd9c63eed9cd3fb0d3e3db24db0369d70439b66'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      EXPECTED_MAIN_SHA: 4a049185f8eff3232bf1a6ed0a176525e72d980d
      EXPECTED_HEAD_SHA: 4dd9c63eed9cd3fb0d3e3db24db0369d70439b66
      EXPECTED_HEAD_REF: gpt/ci-pr-stale-head-cancellation-main-4a049185-20260804
      REPORT_DIR: ${{ runner.temp }}/exact-ci-stale-cancellation-5828
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            http-generic-api/package-lock.json

      - name: Verify immutable identity, ancestry, scope, and Blobs
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.repo.full_name }}" = "${GITHUB_REPOSITORY}"
          test "${{ github.event.pull_request.head.ref }}" = "${EXPECTED_HEAD_REF}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "${EXPECTED_MAIN_SHA}"
          test "$(git merge-base "${EXPECTED_MAIN_SHA}" "${EXPECTED_HEAD_SHA}")" = "${EXPECTED_MAIN_SHA}"
          test "$(git rev-list --count "${EXPECTED_MAIN_SHA}..${EXPECTED_HEAD_SHA}")" -eq 2
          mapfile -t files < <(git diff --name-only "${EXPECTED_MAIN_SHA}"..."${EXPECTED_HEAD_SHA}")
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 4
          test "${files[0]}" = '.changes/e2e/ci-pull-request-recovery-exact-checkout-provenance.json'
          test "${files[1]}" = '.github/workflows/ci-pull-request-recovery.yml'
          test "${files[2]}" = '.github/workflows/ci.yml'
          test "${files[3]}" = 'http-generic-api/test-ci-pull-request-recovery-exact-checkout-provenance.mjs'
          test "$(git rev-parse "${EXPECTED_HEAD_SHA}:.changes/e2e/ci-pull-request-recovery-exact-checkout-provenance.json")" = '98563a3aa27fe26f5f6ec336e3b6e72dc41b1bd9'
          test "$(git rev-parse "${EXPECTED_HEAD_SHA}:.github/workflows/ci.yml")" = '1c496f7770f784f8e3aa2dc1b3c310c379c2d54f'
          test "$(git rev-parse "${EXPECTED_HEAD_SHA}:.github/workflows/ci-pull-request-recovery.yml")" = 'a93265700c7637750b0b0dd828ba51762221fe42'
          test "$(git rev-parse "${EXPECTED_HEAD_SHA}:http-generic-api/test-ci-pull-request-recovery-exact-checkout-provenance.mjs")" = '9a0e8e9d500ffd5f671ccec14288782e836efcbf'

      - name: Run canonical syntax and governance checks
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/schema-docs-change-guard.mjs
          node http-generic-api/scripts/migration-placement-guard.mjs
          node http-generic-api/scripts/user-jwt-auth-governance.mjs
          node http-generic-api/scripts/interruption-readiness.mjs --ci --skip-dependencies --skip-worktree
          node validate-canonical-sources.mjs
          node build-canonicals.mjs --check
          node --check find-canonical-domain.mjs
          (cd http-generic-api && node scripts/resource-api-coverage-audit.mjs --ci --changed)
          (cd http-generic-api && node test-resource-api-architecture.mjs && node test-resource-api-service.mjs)
          node http-generic-api/scripts/spec-kit-completion-gate.mjs --ci --changed
          node validate-memory-schema.mjs
          git diff --check
          node --check http-generic-api/test-ci-pull-request-recovery-exact-checkout-provenance.mjs

      - name: Validate PR-only cancellation and exact-checkout contract
        working-directory: http-generic-api
        run: node test-ci-pull-request-recovery-exact-checkout-provenance.mjs

      - name: Install HTTP API dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Run official repository-tool lifecycle contract
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs
          mkdir -p "${REPORT_DIR}/repository-tool-lifecycle"
          git diff --name-status "${EXPECTED_MAIN_SHA}" "${EXPECTED_HEAD_SHA}" > "${REPORT_DIR}/repository-tool-changes.tsv"
          BASE_SHA="${EXPECTED_MAIN_SHA}" CANDIDATE_SHA="${EXPECTED_HEAD_SHA}" \
            node http-generic-api/scripts/maintenance-tools/repository-tool-lifecycle-guard.mjs \
              --changed-files "${REPORT_DIR}/repository-tool-changes.tsv" \
              --policy .github/repository-maintenance-tool-governance.json \
              --output-dir "${REPORT_DIR}/repository-tool-lifecycle"

      - name: Run complete Unit and Integration suite with exact provenance
        working-directory: http-generic-api
        shell: bash
        env:
          TEST_SUITE_REPORT_DIR: ${{ runner.temp }}/test-suite-reports
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_HEAD_SHA"
          GITHUB_SHA="$actual_sha" npm test

      - name: Verify exact test report provenance
        shell: bash
        run: |
          set -euo pipefail
          for report in \
            "$RUNNER_TEMP/test-suite-reports/test-manifest.json" \
            "$RUNNER_TEMP/test-suite-reports/test-suite.json"; do
            test -f "$report"
            test "$(jq -r '.status' "$report")" = 'passed'
            test "$(jq -r '.commitSha' "$report")" = "$EXPECTED_HEAD_SHA"
            test "$(jq -r '.firstFailure' "$report")" = 'null'
            test "$(jq -r '.secretsIncluded' "$report")" = 'false'
          done

      - name: Prove runtime startup and deployment evidence
        working-directory: http-generic-api
        env:
          FORCE_ROUTE_RUNTIME_TESTS: 'true'
          DEPLOYMENT_BRANCH: ${{ env.EXPECTED_HEAD_REF }}
          DEPLOYMENT_COMMIT_SHA: ${{ env.EXPECTED_HEAD_SHA }}
        run: |
          node test-deployment-manifest-generator.mjs
          npm run manifest:deployment
          node test-server-startup-smoke.mjs

      - name: Install root dependencies and run Execution Resolver Gate
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test -- --runInBand

      - name: Run Architecture Drift Detection
        working-directory: http-generic-api
        run: npm run validate

      - name: Run exact E2E phase evaluation and execution
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/e2e-phase-governance.mjs check \
            --base "${EXPECTED_MAIN_SHA}" \
            --head "${EXPECTED_HEAD_SHA}" \
            --report-file "${REPORT_DIR}/e2e-phase-evaluation.json"
          node http-generic-api/scripts/e2e-phase-governance.mjs run \
            --base "${EXPECTED_MAIN_SHA}" \
            --head "${EXPECTED_HEAD_SHA}" \
            --report-file "${REPORT_DIR}/e2e-phase-evaluation-run.json" \
            --execution-report-file "${REPORT_DIR}/e2e-phase-execution.json"

      - name: Run exact E2E reference and Git-index integrity
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/test-e2e-contract-reference-integrity.mjs
          node http-generic-api/test-e2e-contract-git-index-integrity.mjs
          node http-generic-api/scripts/e2e-contract-reference-integrity.mjs \
            --base "${EXPECTED_MAIN_SHA}" \
            --head "${EXPECTED_HEAD_SHA}" \
            --report-file "${REPORT_DIR}/e2e-contract-reference-integrity.json"
          node http-generic-api/scripts/e2e-contract-git-index-integrity.mjs \
            --report-file "${REPORT_DIR}/e2e-contract-reference-integrity.json"

      - name: Publish exact no-secret summary
        if: always()
        shell: bash
        run: |
          mkdir -p "${REPORT_DIR}"
          jq -n \
            --arg base_sha "${EXPECTED_MAIN_SHA}" \
            --arg head_sha "${EXPECTED_HEAD_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            '{contract:"mad4b.exact-ci-stale-cancellation-arm-validation.v2",base_sha:$base_sha,head_sha:$head_sha,run_id:$run_id,official_lifecycle_contract:true,test_report_provenance_verified:true,candidate_mutated:false,main_mutated:false,production_mutated:false,provider_call:false,credential_read:false,sql_executed:false,migration_apply:false,database_mutated:false,external_send:false,secrets_included:false}' \
            > "${REPORT_DIR}/summary.json"

      - name: Upload exact validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-ci-stale-cancellation-arm-validation-5828-${{ github.run_id }}
          path: |
            ${{ env.REPORT_DIR }}/**
            ${{ runner.temp }}/test-suite-reports/*.json
          if-no-files-found: warn
          retention-days: 14
