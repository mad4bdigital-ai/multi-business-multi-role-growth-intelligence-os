name: Lease Migration Production Final Readback

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: lease-migration-production-final-readback
  cancel-in-progress: false

jobs:
  governed-production-final-readback:
    if: github.event.pull_request.head.ref == 'ops/lease-migration-production-apply-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out deployed Production source
        uses: actions/checkout@v5
        with:
          ref: Production
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: http-generic-api/package-lock.json

      - name: Install dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Verify deployed runtime parity
        working-directory: http-generic-api
        env:
          RUNTIME_BASE_URL: https://auth.mad4b.com
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
          RUNTIME_PROFILE: queue_worker
          VERIFY_EXECUTION_LOG_ROW: 'false'
          ALLOW_ENVIRONMENT_ACCESS_BLOCKED: 'false'
        run: node verify-runtime.mjs

      - name: Verify migration ledger and Admin tool catalog
        env:
          RUNTIME_BASE_URL: https://auth.mad4b.com
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          const BASE = String(process.env.RUNTIME_BASE_URL || '').replace(/\/+$/, '');
          const KEY = String(process.env.BACKEND_API_KEY || '');
          const MIGRATION = '20260730_repository_reconciliation_lease_control_tool.sql';
          const CHECKSUM = 'fe79a8b77cbaf0aa73c46c1852354b85429482f1fa88ed9284919861bb858fdf';
          const STATEMENT_COUNT = 1;
          const TOOL_KEY = 'repository_reconciliation_lease_control';
          const TRANSIENT_STATUS = new Set([429, 502, 503, 504, 520]);

          assert.equal(BASE, 'https://auth.mad4b.com');
          assert.ok(KEY, 'BACKEND_API_KEY is required');

          const sensitiveKey = /(password|secret|token|authorization|cookie|api[_-]?key|credential|private[_-]?key|refresh[_-]?token|access[_-]?token)/i;
          function sanitize(value) {
            if (Array.isArray(value)) return value.map(sanitize);
            if (!value || typeof value !== 'object') return value;
            return Object.fromEntries(Object.entries(value).map(([key, child]) => [
              key,
              sensitiveKey.test(key) ? '[redacted]' : sanitize(child),
            ]));
          }

          function parsedValue(value) {
            if (typeof value !== 'string') return value;
            const text = value.trim();
            if (!text || (!text.startsWith('{') && !text.startsWith('['))) return value;
            try { return JSON.parse(text); } catch { return value; }
          }

          function collectObjects(value, output = [], seen = new Set()) {
            value = parsedValue(value);
            if (!value || typeof value !== 'object' || seen.has(value)) return output;
            seen.add(value);
            if (!Array.isArray(value)) output.push(value);
            for (const child of Object.values(value)) collectObjects(child, output, seen);
            return output;
          }

          async function safeRead(path, body, attempts = 4) {
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              const response = await fetch(`${BASE}${path}`, {
                method: 'POST',
                redirect: 'error',
                headers: {
                  Authorization: `Bearer ${KEY}`,
                  Accept: 'application/json',
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify(body),
                signal: AbortSignal.timeout(180000),
              });
              const text = await response.text();
              let payload;
              try { payload = text ? JSON.parse(text) : null; }
              catch { payload = { raw_preview: text.slice(0, 500) }; }
              console.log(JSON.stringify(sanitize({ attempt, status: response.status, http_ok: response.ok, payload }), null, 2));
              if (response.ok && payload?.ok !== false) return payload;
              const retryable = TRANSIENT_STATUS.has(response.status) || payload?.retryable === true || response.status === 409;
              if (!retryable || attempt === attempts) {
                const error = new Error(`Final readback failed for ${path} with HTTP ${response.status}`);
                error.code = payload?.error?.code || payload?.error_code || 'final_readback_failed';
                throw error;
              }
              const delaySeconds = Math.max(5, Math.min(Number(payload?.retry_after || 10), 60));
              await new Promise((resolve) => setTimeout(resolve, delaySeconds * 1000));
            }
            throw new Error('final_readback_retry_exhausted');
          }

          const readback = await safeRead('/gpt/tools/call', {
            name: 'governed_migration_schema_readback',
            tool_args: {
              migration: MIGRATION,
              expected_checksum_sha256: CHECKSUM,
              expected_statement_count: STATEMENT_COUNT,
            },
          });
          assert.equal(readback?.ok, true, 'Migration readback is not successful');
          assert.equal(readback?.readback_status, 'pass', 'Migration readback status mismatch');
          assert.equal(readback?.migration_checksum_sha256, CHECKSUM, 'Migration readback checksum mismatch');
          assert.equal(Number(readback?.statement_count), STATEMENT_COUNT, 'Migration readback statement count mismatch');
          assert.equal(readback?.ledger?.found, true, 'Migration ledger row is absent');
          assert.ok(String(readback?.ledger?.run_id || ''), 'Migration ledger run_id is absent');
          assert.equal(readback?.ledger?.mode, 'apply', 'Migration ledger mode mismatch');
          assert.equal(readback?.ledger?.preflight_status, 'pass', 'Migration ledger preflight status mismatch');
          assert.equal(Number(readback?.ledger?.preflight_risk_count), 0, 'Migration ledger risk count mismatch');
          assert.ok(String(readback?.ledger?.capability_envelope_id || ''), 'Migration ledger capability envelope evidence is absent');
          for (const key of ['tables', 'columns', 'indexes', 'rule_conditions']) {
            assert.deepEqual(readback?.expectations?.missing?.[key] || [], [], `Migration readback has missing ${key}`);
          }

          const catalog = await safeRead('/gpt/tools/call', {
            name: 'admin_tool_catalog_search',
            tool_args: { q: TOOL_KEY, cursor: 0, limit: 20 },
          });
          const toolRows = collectObjects(catalog).filter((item) => String(item.name || '') === TOOL_KEY);
          assert.ok(toolRows.length >= 1, 'Lease control tool is absent from the Admin tool catalog');
          const tool = toolRows[0];
          assert.equal(String(tool.method || '').toUpperCase(), 'POST', 'Lease control tool method mismatch');
          assert.equal(String(tool.path || ''), '/admin/repository-automation/reconciliation-lease', 'Lease control tool path mismatch');
          const tags = new Set(Array.isArray(tool.tags) ? tool.tags.map(String) : []);
          for (const tag of ['capability_envelope', 'apply_authorized', 'typed_confirmation', 'no_force', 'same_cycle_readback', 'no_secrets']) {
            assert.equal(tags.has(tag), true, `Lease control catalog entry is missing tag ${tag}`);
          }
          const required = new Set(Array.isArray(tool.inputSchema?.required) ? tool.inputSchema.required.map(String) : []);
          for (const field of ['action', 'capability_envelope_id', 'confirm']) {
            assert.equal(required.has(field), true, `Lease control input schema is missing required field ${field}`);
          }

          console.log(JSON.stringify({
            ok: true,
            stage: 'production_migration_final_readback_complete',
            migration: MIGRATION,
            migration_checksum_sha256: CHECKSUM,
            statement_count: STATEMENT_COUNT,
            ledger_run_id: readback.ledger.run_id,
            ledger_mode: readback.ledger.mode,
            preflight_status: readback.ledger.preflight_status,
            preflight_risk_count: Number(readback.ledger.preflight_risk_count),
            schema_expectation_gaps: 0,
            admin_tool_registry_readback_passed: true,
            registered_tool_key: TOOL_KEY,
            registered_method: tool.method,
            registered_path: tool.path,
            migration_sql_applied: true,
            provider_call_executed: false,
            external_write_executed: false,
            secrets_included: false,
          }, null, 2));
          NODE
