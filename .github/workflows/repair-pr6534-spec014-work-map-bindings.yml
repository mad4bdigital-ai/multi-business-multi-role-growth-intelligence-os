name: Repair PR 6534 Spec014 Work Map Bindings

on:
  push:
    branches:
      - gpt/migration-1048-governed-rollout-20260807
    paths:
      - .github/ops/repair-pr6534-spec014-work-map-bindings.trigger

permissions:
  contents: write
  actions: write

concurrency:
  group: repair-pr6534-spec014-work-map-bindings
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Refresh bounded canonical bindings
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BRANCH: gpt/migration-1048-governed-rollout-20260807
          WORKFLOW_FILE: .github/workflows/repair-pr6534-spec014-work-map-bindings.yml
          TRIGGER_FILE: .github/ops/repair-pr6534-spec014-work-map-bindings.trigger
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          git fetch origin main "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse origin/${EXPECTED_BRANCH})" = "${GITHUB_SHA}"

          node scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-governed-hostinger-storage-orchestration --write
          node scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-retail-commerce-operations-growth-os --write

          mapfile -t CHANGED < <(git status --short | sed -E 's/^.. //' | sort)
          ALLOWED=(
            "specs/014-governed-hostinger-storage-orchestration/work-map-integration.json"
            "specs/014-governed-hostinger-storage-orchestration/tasks.md"
            "specs/014-retail-commerce-operations-growth-os/work-map-integration.json"
          )
          for file in "${CHANGED[@]}"; do
            allowed=false
            for candidate in "${ALLOWED[@]}"; do
              if [[ "$file" == "$candidate" ]]; then allowed=true; break; fi
            done
            if [[ "$allowed" != true ]]; then
              echo "Unexpected producer write: $file"
              exit 1
            fi
          done
          git status --short | grep -Fq "specs/014-governed-hostinger-storage-orchestration/work-map-integration.json"
          git status --short | grep -Fq "specs/014-retail-commerce-operations-growth-os/work-map-integration.json"

          node scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-governed-hostinger-storage-orchestration --check
          node scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-retail-commerce-operations-growth-os --check
          node scripts/spec-kit-work-map-generator.mjs --check

          rm -f "$WORKFLOW_FILE" "$TRIGGER_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            "$WORKFLOW_FILE" \
            "$TRIGGER_FILE" \
            specs/014-governed-hostinger-storage-orchestration/work-map-integration.json \
            specs/014-governed-hostinger-storage-orchestration/tasks.md \
            specs/014-retail-commerce-operations-growth-os/work-map-integration.json
          git commit -m "fix(spec014): refresh final Work Map bindings for PR 6534"
          NEW_HEAD="$(git rev-parse HEAD)"

          node scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-governed-hostinger-storage-orchestration --check
          node scripts/spec014-refresh-final-work-map-binding.mjs --feature-key 014-retail-commerce-operations-growth-os --check
          node scripts/spec-kit-work-map-generator.mjs --check

          git fetch origin "${EXPECTED_BRANCH}"
          test "$(git rev-parse origin/${EXPECTED_BRANCH})" = "${GITHUB_SHA}"
          git push origin "HEAD:${EXPECTED_BRANCH}"

          gh workflow run spec-kit-work-map-integration.yml --repo "${GITHUB_REPOSITORY}" --ref "${EXPECTED_BRANCH}"
          gh workflow run ci.yml --repo "${GITHUB_REPOSITORY}" --ref "${EXPECTED_BRANCH}"
          echo "result_head=${NEW_HEAD}" >> "$GITHUB_STEP_SUMMARY"
