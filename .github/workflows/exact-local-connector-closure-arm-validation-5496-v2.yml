name: Exact Local Connector Closure ARM Validation 5496 v2

on:
  pull_request:
    branches:
      - gpt/validate-local-connector-closure-arm-base-5496-c7f7be81
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: exact-local-connector-closure-arm-validation-5496-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Exact Candidate Full ARM Validation
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    env:
      EXPECTED_HEAD_REF: gpt/ci/retire-local-connector-closure-final-one-commit-20260803
      EXPECTED_HEAD_SHA: d2d3fbf20998d24fda53eb05e1f0ddd004ace8e7
      EXPECTED_MAIN_SHA: c7f7be81b811caf3c1112372ab1089fc5ee3714c
      EVIDENCE_DIR: /tmp/local-connector-closure-5496-v2-${{ github.run_id }}
    steps:
      - name: Checkout exact candidate with read-only token
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable candidate identity and exact scope
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"

          test "$HEAD_REPOSITORY" = "$REPOSITORY"
          test "$HEAD_REF" = "$EXPECTED_HEAD_REF"
          test "$HEAD_SHA" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${EXPECTED_HEAD_REF}:refs/remotes/origin/${EXPECTED_HEAD_REF}"

          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse refs/remotes/origin/${EXPECTED_HEAD_REF})" = "$EXPECTED_HEAD_SHA"
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" "$EXPECTED_HEAD_SHA"
          test "$(git rev-list --count "${EXPECTED_MAIN_SHA}..${EXPECTED_HEAD_SHA}")" = "2"

          git diff --name-only "$EXPECTED_MAIN_SHA"..."$EXPECTED_HEAD_SHA" | sort > "$EVIDENCE_DIR/actual-files.txt"
          cat > "$EVIDENCE_DIR/expected-files.txt" <<'EOF_FILES'
          .changes/e2e/local-connector-production-closure-automation-retirement.json
          .github/local-connector-closure/trigger-3945-792ff63a.txt
          .github/scripts/governed-local-connector-production-closure.mjs
          .github/workflows/automation-overlap-guard.yml
          .github/workflows/governed-local-connector-production-closure-pr-target.yml
          .github/workflows/governed-local-connector-production-closure-push.yml
          .github/workflows/governed-local-connector-production-closure.yml
          .github/workflows/local-connector-closure-v8-trigger.txt
          http-generic-api/scripts/local-connector-closure-automation-retirement-self-test.mjs
          EOF_FILES
          sed -i 's/^          //' "$EVIDENCE_DIR/expected-files.txt"
          diff -u "$EVIDENCE_DIR/expected-files.txt" "$EVIDENCE_DIR/actual-files.txt"

          git diff --name-status "$EXPECTED_MAIN_SHA" "$EXPECTED_HEAD_SHA" > "$EVIDENCE_DIR/name-status.tsv"
          printf '{"ok":true,"candidate_sha":"%s","main_sha":"%s","commit_count":2,"changed_files":9,"secrets_included":false}\n' \
            "$EXPECTED_HEAD_SHA" "$EXPECTED_MAIN_SHA" > "$EVIDENCE_DIR/preflight.json"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Run canonical syntax and governance checks
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/schema-docs-change-guard.mjs
          node http-generic-api/scripts/migration-placement-guard.mjs
          node http-generic-api/scripts/user-jwt-auth-governance.mjs
          node http-generic-api/scripts/interruption-readiness.mjs --ci --skip-dependencies --skip-worktree
          node validate-canonical-sources.mjs
          node build-canonicals.mjs --check
          node --check find-canonical-domain.mjs
          node http-generic-api/scripts/resource-api-coverage-audit.mjs --ci --changed
          node http-generic-api/test-resource-api-architecture.mjs
          node http-generic-api/test-resource-api-service.mjs
          node http-generic-api/scripts/spec-kit-completion-gate.mjs --ci --changed
          node validate-memory-schema.mjs
          git diff --check

      - name: Prove retirement scope and fail-closed contract
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            .github/local-connector-closure/trigger-3945-792ff63a.txt \
            .github/scripts/governed-local-connector-production-closure.mjs \
            .github/workflows/governed-local-connector-production-closure-pr-target.yml \
            .github/workflows/governed-local-connector-production-closure-push.yml \
            .github/workflows/governed-local-connector-production-closure.yml \
            .github/workflows/local-connector-closure-v8-trigger.txt
          do
            test ! -e "$path"
          done

          workflow=.github/workflows/automation-overlap-guard.yml
          grep -F 'contents: read' "$workflow"
          ! grep -E 'issues:[[:space:]]*write|pull-requests:[[:space:]]*write|contents:[[:space:]]*write|BACKEND_API_KEY|RUN_LOCAL_CONNECTOR_PRODUCTION_CLOSURE|governed-local-connector-production-closure' "$workflow"
          node --check http-generic-api/scripts/local-connector-closure-automation-retirement-self-test.mjs
          (cd http-generic-api && node scripts/local-connector-closure-automation-retirement-self-test.mjs)

      - name: Run E2E reference integrity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/reference-integrity"
          node http-generic-api/test-e2e-contract-reference-integrity.mjs
          node http-generic-api/test-e2e-contract-git-index-integrity.mjs
          node http-generic-api/scripts/e2e-contract-reference-integrity.mjs \
            --base "$EXPECTED_MAIN_SHA" \
            --head "$EXPECTED_HEAD_SHA" \
            --report-file "$EVIDENCE_DIR/reference-integrity/report.json"
          node http-generic-api/scripts/e2e-contract-git-index-integrity.mjs \
            --report-file "$EVIDENCE_DIR/reference-integrity/report.json"

      - name: Run repository-tool lifecycle governance
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/test-repository-tool-lifecycle-guard.mjs
          mkdir -p "$EVIDENCE_DIR/repository-tool-lifecycle"
          BASE_SHA="$EXPECTED_MAIN_SHA" CANDIDATE_SHA="$EXPECTED_HEAD_SHA" \
            node http-generic-api/scripts/maintenance-tools/repository-tool-lifecycle-guard.mjs \
              --changed-files "$EVIDENCE_DIR/name-status.tsv" \
              --policy .github/repository-maintenance-tool-governance.json \
              --output-dir "$EVIDENCE_DIR/repository-tool-lifecycle"

      - name: Install HTTP Generic API dependencies
        working-directory: http-generic-api
        run: npm ci

      - name: Run full Unit and Integration test suite
        working-directory: http-generic-api
        env:
          GITHUB_SHA: ${{ env.EXPECTED_HEAD_SHA }}
          TEST_SUITE_REPORT_DIR: ${{ env.EVIDENCE_DIR }}/test-suite-reports
        run: npm test

      - name: Run architecture validation
        working-directory: http-generic-api
        run: npm run validate

      - name: Install root dependencies
        run: npm ci

      - name: Run Execution Resolver Gate
        run: |
          set -euo pipefail
          npm run typecheck
          npm test -- --runInBand

      - name: Run exact E2E phase evaluation and journeys
        shell: bash
        run: |
          set -euo pipefail
          node http-generic-api/scripts/e2e-phase-governance.mjs check \
            --base "$EXPECTED_MAIN_SHA" \
            --head "$EXPECTED_HEAD_SHA" \
            --report-file "$EVIDENCE_DIR/e2e-phase-evaluation.json"
          node http-generic-api/scripts/e2e-phase-governance.mjs run \
            --base "$EXPECTED_MAIN_SHA" \
            --head "$EXPECTED_HEAD_SHA" \
            --report-file "$EVIDENCE_DIR/e2e-phase-evaluation-run.json" \
            --execution-report-file "$EVIDENCE_DIR/e2e-phase-execution.json"

      - name: Publish bounded validation summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          cat > "$EVIDENCE_DIR/summary.md" <<EOF_SUMMARY
          # Exact Local Connector Closure ARM Validation

          - Candidate PR: #5496
          - Candidate SHA: \`$EXPECTED_HEAD_SHA\`
          - Main baseline: \`$EXPECTED_MAIN_SHA\`
          - Runner: \`ubuntu-24.04-arm\`
          - Expected commits: \`2\`
          - Expected changed files: \`9\`
          - Provider mutation: \`false\`
          - Production mutation: \`false\`
          - Credential access: \`false\`
          - SQL or Migration Apply: \`false\`
          - Secrets included: \`false\`
          EOF_SUMMARY
          sed -i 's/^          //' "$EVIDENCE_DIR/summary.md"
          cat "$EVIDENCE_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-local-connector-closure-5496-arm-v2-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 14
